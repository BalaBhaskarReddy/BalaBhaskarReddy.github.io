CH.push({
  id: 'ch20', n: 20, title: 'Testing and Verification',
  lede: 'The compiler removes whole classes of bugs, which makes the remaining tests more valuable, not less. Rust\'s built-in test harness runs unit, integration and documentation tests with no setup, and the ecosystem adds property testing, fuzzing, snapshot testing, concurrency model checking and even proofs. This chapter shows each, and how to combine them into a pipeline you can defend to an auditor.',
  html: `
<h2>Tests are part of the language</h2>
<p>Any function marked <code>#[test]</code> is a test; <code>cargo test</code> builds a test binary for each crate target, runs the binaries one after another, and runs the tests inside each binary in parallel threads. By convention:</p>
<ul>
<li><b>Unit tests</b> live in a <code>#[cfg(test)] mod tests</code> at the bottom of the file they test and can reach private items.</li>
<li><b>Integration tests</b> live in <code>tests/*.rs</code>, each compiled as a separate crate that sees only the public API.</li>
<li><b>Doc tests</b> are the code blocks in <code>///</code> comments; they are compiled and run, so examples in documentation cannot rot. Since Edition 2024 they are merged into one binary, which makes them much faster.</li>
<li><b>Benchmarks</b> live in <code>benches/</code> (Chapter 19).</li>
</ul>
${EX('c20-testing', 'Unit tests, should_panic, property tests, an integration test and a doctest')}
<p>The two property tests describe behaviour rather than examples: for any amount, rate and minimum, the fee is bounded by the amount and at least the minimum where possible; and fees never decrease as amounts increase. Proptest generated 256 random cases for each and would have shrunk any failure to a minimal counterexample. Note the <code>i128</code> in <code>fee</code>: a property test over large amounts finds the overflow that <code>amount * bps</code> in <code>i64</code> would cause, which is exactly the kind of bug example-based tests miss.</p>

<h2>Choosing the right tool</h2>
${fig('bugtools', '<b>Figure 20.1</b> Interactive: pick the class of bug and see which tools find it.')}
${R('A fuzz target (cargo fuzz add parse_iso8583; cargo +nightly fuzz run parse_iso8583)')`
#![no_main]
use libfuzzer_sys::fuzz_target;

fuzz_target!(|data: &[u8]| {
    // Must never panic, hang or allocate without bound, whatever the input.
    if let Ok(msg) = iso8583::parse(data) {
        let bytes = msg.encode();
        assert_eq!(iso8583::parse(&bytes).as_ref(), Ok(&msg), "round trip");
    }
});`}
<p>cargo-fuzz needs a nightly toolchain because it builds with sanitiser instrumentation; the fuzz crate lives in <code>fuzz/</code>, separate from your stable build. loom works on stable. It replaces <code>std::sync</code> and <code>std::thread</code> with versions that record every atomic operation, then reruns the test body under each possible interleaving:</p>
${EX('c20-loom', 'loom finds the lost update of Figure 14.1')}
<p>The code under test imports atomics from loom only when built with <code>--cfg loom</code>, so production builds are unaffected; the <code>[lints.rust]</code> entry declares that cfg so the compiler does not warn about it. Both increment methods use atomic operations and both compile, yet loom proves the load-then-store version loses an update in some interleaving, every time it runs, on any machine. A stress test running the same code a million times might never hit it. loom's exploration grows quickly with the number of threads and operations, so keep models to two or three threads and a handful of steps.</p>

<h2>Async and time</h2>
<p><code>#[tokio::test]</code> runs an async test on a runtime. With <code>start_paused = true</code> (which needs Tokio's <code>test-util</code> feature) the runtime's clock is virtual: <code>sleep</code> and timeouts complete instantly in deterministic order, so a test of a 30-second retry policy takes milliseconds and never flakes. The cancellation example in Chapter 16 runs this way. Test HTTP handlers by calling the axum <code>Router</code> as a tower <code>Service</code> without opening a socket, or against a real server on an ephemeral port.</p>

<h2>Tooling around the tests</h2>
<ul>
<li><b>cargo-nextest</b>: a faster test runner with per-test processes, retries for known-flaky tests, JUnit output and partitioning across CI machines. It does not run doc tests, so CI also needs <code>cargo test --doc</code>.</li>
<li><b>cargo-llvm-cov</b>: line and region coverage from LLVM's source-based instrumentation, with HTML, LCOV and Cobertura output, and a <code>nextest</code> mode. Branch coverage and doc-test coverage still need nightly.</li>
<li><b>insta</b>: snapshot tests for large outputs (rendered reports, API responses), reviewed with <code>cargo insta review</code>.</li>
<li><b>mutants</b> (<code>cargo mutants</code>): changes your code in small ways and checks the tests notice, measuring test quality rather than coverage.</li>
<li><b>Kani</b>: bounded model checking; prove, for example, that a parser never panics for inputs up to 64 bytes. A <code>#[kani::proof]</code> harness looks like a test but uses <code>kani::any()</code> for symbolic inputs; <code>cargo kani</code> checks it for every value at once. AWS uses it (Firecracker, s2n-quic), as does the community effort to verify the Rust standard library.</li>
</ul>
<div class="note key"><b>Evidence for audits</b><p>For PCI DSS v4.0.1 requirement 6.2.4 (engineering techniques that prevent common software attacks), 6.2.3 (code review before release) and 6.3.2 (an inventory of bespoke software and its third-party components), and for SOC 2 change management (CC8.1), a Rust pipeline produces strong evidence cheaply: clippy with warnings denied, reviewed pull requests, tests with coverage reports, fuzzing of every parser of external input with the corpus in version control, Miri on crates containing unsafe, <code>#![forbid(unsafe_code)]</code> elsewhere, cargo-deny and an SBOM for dependencies, and semver checks for shared libraries. Keep the reports as build artefacts tied to the commit.</p></div>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Testing only the happy path</strong> because the types feel reassuring; the compiler does not check your business rules.</li>
<li><strong>Tests sharing global state</strong> (env vars, a static, a database) while running in parallel; use nextest's process isolation or separate resources per test. In Edition 2024 <code>set_var</code> is <code>unsafe</code> precisely because of this race.</li>
<li><strong>Coverage as the goal</strong>: 90% line coverage with weak assertions catches little. <code>cargo mutants</code> shows which lines your tests execute without checking.</li>
<li><strong>Real sleeps in async tests</strong>; use paused time.</li>
<li><strong>Fuzzing once</strong>: run fuzzers continuously (OSS-Fuzz, ClusterFuzzLite, or a nightly job) because new code paths appear with every change.</li>
<li><strong>Mocks for everything</strong>: prefer a small trait at a boundary you own and real implementations elsewhere.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Private or public?</summary><p>Can an integration test in <code>tests/</code> call a <code>pub(crate)</code> function?</p><p><em>Answer:</em> no; integration tests are separate crates and see only the public API. Test private items with unit tests in the same module.</p></details>
<details><summary>Why did loom need a cfg?</summary><p>Why does the loom example import <code>AtomicU64</code> from <code>loom</code> only under <code>cfg(loom)</code>, rather than always?</p><p><em>Answer:</em> loom's atomics only work inside <code>loom::model</code>, which runs the closure many times under a simulated scheduler; they are far slower and would panic in normal use. The cfg swaps them in for the model-checking build alone, and production code keeps <code>std</code>'s atomics.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A property for a ledger</summary><p>Write a property test for a ledger: for any sequence of valid postings, the sum of all account balances equals the sum of all postings, and no balance is negative.</p><p><em>Answer:</em> generate <code>Vec&lt;(account in 0..5usize, delta in -1000i64..1000)&gt;</code>; apply each posting with the ledger's <code>apply</code>, skipping rejected ones but counting accepted deltas; assert the sum of balances equals the sum of accepted deltas and every balance is non-negative. Proptest will shrink any failure to the shortest sequence that breaks it.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>What Miri cannot see</summary><p>Your crate's tests pass under Miri. Name two kinds of problem that can still exist in its unsafe code.</p><p><em>Answer:</em> UB on paths the tests never execute (Miri checks execution, not all paths), and problems in foreign code it cannot interpret (C libraries, inline assembly, most syscalls). Fuzzing under Miri widens the first; sanitisers or Kani help with the second.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I write unit, integration and doc tests and know where each lives.</li>
<li>I use property tests to find edge cases and fuzzing to harden parsers.</li>
<li>I use Miri, loom and Kani where unsafe or lock-free code needs them, and know loom runs on stable while Miri and cargo-fuzz need nightly.</li>
<li>I test async code with paused time and handlers without sockets.</li>
<li>I can assemble a CI pipeline whose reports serve as audit evidence.</li>
</ul>
`});

CH.push({
  id: 'ch21', n: 21, title: 'Command-Line Tools',
  lede: 'Command-line tools are where many teams first meet Rust, and where its strengths are easiest to see: millisecond startup, a single static binary with no runtime to install, easy cross-compilation, and some of the fastest text processing available. This chapter builds a transaction-summary tool with clap and csv, covers configuration, output, errors, testing and distribution, and ends with a lab.',
  html: `
<h2>Why Rust took over the command line</h2>
<p>Since about 2016 a new generation of developer tools has been written in Rust: ripgrep, fd, bat, eza, delta, hyperfine and starship on the terminal; uv and ruff for Python; Biome, Oxc, Rolldown, SWC and Turbopack for JavaScript; and many internal platform tools. The reasons are practical. A Rust binary starts in about a millisecond (a JVM takes tens to hundreds), uses little memory, ships as one file with no interpreter or runtime, and does not break when the user's Python or Node version changes. And Rust's iterators, zero-copy string handling and easy parallelism with rayon make tools that process large files fast by default.</p>

<h2>Anatomy of a CLI</h2>
${fig('cli', '<b>Figure 21.1</b> The stages of a well-behaved command-line program.')}
${EX('c21-cli', 'txn: subcommands, CSV with serde, table and JSON output, errors with context')}
<p>Points worth copying from the example:</p>
<ul>
<li><b>clap's derive API</b> turns a struct into a parser: doc comments become help text, types are validated (<code>usize</code>, <code>PathBuf</code>, an enum of formats), and <code>--help</code>, <code>--version</code> and shell completions (clap_complete) come free.</li>
<li><b>Errors go to stderr with context and a non-zero exit</b>. <code>main</code> catches the error and prints the whole chain with <code>{:#}</code>, which is friendlier than the default <code>Debug</code> output of returning <code>Result</code> from main.</li>
<li><b>Streaming</b>: the CSV reader deserialises one record at a time through a buffered reader; for very large files, process records in the iterator instead of collecting them.</li>
<li><b>Output</b>: lock stdout once and write through it; unlocked <code>println!</code> takes the lock on every call. Write machine-readable formats (JSON, CSV) to stdout and progress or diagnostics to stderr, so pipelines work.</li>
<li><b>Broken pipes</b>: Rust ignores SIGPIPE, so when a reader such as <code>head</code> exits early the next write returns an <code>io::Error</code> of kind <code>BrokenPipe</code> (and <code>println!</code> would panic). Because the example writes with <code>writeln!</code> and <code>?</code>, the error reaches <code>main</code>, which recognises it with <code>downcast_ref</code> and exits quietly with status 0.</li>
<li><b>Tests run the real binary</b>: <code>tests/cli.rs</code> uses assert_cmd's <code>cargo_bin_cmd!</code> to run the built executable and checks stdout, stderr and the exit code, including clap's exit code 2 for a bad <code>--format</code>. These are the contract a scheduler or a shell script depends on.</li>
</ul>

<h2>The ecosystem for CLIs</h2>
<div class="tbl"><table>
<tr><th>Need</th><th>Crates</th></tr>
<tr><td>Arguments</td><td>clap (derive), lexopt or argh for tiny binaries</td></tr>
<tr><td>Configuration</td><td>figment or config (layered files, env, flags), directories for platform paths</td></tr>
<tr><td>Errors</td><td>anyhow or miette (rich diagnostics with source spans)</td></tr>
<tr><td>Terminal UX</td><td>indicatif (progress bars), anstream and owo-colors (colour that respects NO_COLOR and pipes), dialoguer (prompts), ratatui (full-screen TUIs)</td></tr>
<tr><td>Files and processes</td><td>walkdir and ignore (fast directory walks honouring .gitignore), tempfile, duct or std::process</td></tr>
<tr><td>Testing</td><td>assert_cmd and predicates (run the binary), trycmd and snapbox (snapshot whole CLI sessions)</td></tr>
<tr><td>Distribution</td><td>cargo-dist (installers, Homebrew, release artefacts), cross or cargo-zigbuild (cross-compilation)</td></tr>
</table></div>

<h2>Distributing a binary</h2>
${SH('Static Linux binaries and cross-compilation')`
# A fully static binary that runs on any Linux (musl libc, 1.2.5 since Rust 1.93):
rustup target add x86_64-unknown-linux-musl
cargo build --release --target x86_64-unknown-linux-musl

# ARM servers and Macs from one machine (cargo-zigbuild links with Zig, so install
# Zig first, for example with pip install ziglang):
cargo install cargo-zigbuild
rustup target add aarch64-unknown-linux-gnu aarch64-apple-darwin
cargo zigbuild --release --target aarch64-unknown-linux-gnu
cargo zigbuild --release --target aarch64-apple-darwin

# Check what you ship:
ls -lh target/x86_64-unknown-linux-musl/release/txn
ldd target/x86_64-unknown-linux-musl/release/txn     # "statically linked" or "not a dynamic executable"`}
<p>For internal platform tools, build in CI for each target, sign the artefacts and SBOM, and publish to your artefact store with an install script or a Homebrew tap; cargo-dist automates most of this. Embed the dependency list with <code>cargo auditable</code> so vulnerability scanners can inspect binaries on engineers' machines.</p>

${LAB('extend the transaction tool', `<p>Starting from the example (create the project with <code>cargo new txn</code>, copy the code and add the dependencies):</p>
<ol>
<li>Add a <code>--status</code> option to <code>summary</code> accepting several values (<code>--status approved --status refunded</code>), using <code>Vec&lt;String&gt;</code> and clap's <code>num_args</code> or repeated flags.</li>
<li>Read from stdin when the file argument is <code>-</code>, so <code>cat txns.csv | txn summary -</code> works. Hint: <code>Box&lt;dyn Read&gt;</code>.</li>
<li>Add <code>--format csv</code> using the csv crate's <code>Writer</code> over the locked stdout.</li>
<li>Make malformed rows non-fatal with <code>--skip-bad</code>, counting them and printing the count to stderr at the end.</li>
<li>Extend the integration tests in <code>tests/cli.rs</code> to cover each new feature: several <code>--status</code> values, input from stdin (assert_cmd's <code>write_stdin</code>), CSV output, and <code>--skip-bad</code> with a malformed row (check the count on stderr and exit code 0).</li>
<li>Generate a file with five million rows (a small Rust or Python script) and time the tool with <code>hyperfine</code> in debug and release. Then add <code>rayon</code> and measure again: read batches of records on one thread and aggregate each batch in parallel with rayon's <code>fold</code> and <code>reduce</code>. Profile first; if CSV parsing dominates, splitting the file into byte ranges at line boundaries and parsing each range on its own thread is what scales.</li>
<li>Build a static musl binary and confirm with <code>ldd</code> that it has no dynamic dependencies.</li>
</ol><p><em>Done when</em> the tests pass in CI, the release binary handles the five-million-row file in a few seconds or less, and the help text explains every option.</p>`)}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Panicking on bad input</strong> (<code>unwrap</code> on parse results): users see a backtrace instead of a message.</li>
<li><strong>Colour codes in pipes</strong>: detect terminals and honour <code>NO_COLOR</code>; anstream does this.</li>
<li><strong>Reading whole files into memory</strong> when streaming would do.</li>
<li><strong>Ignoring broken pipes</strong>: <code>txn summary big.csv | head</code> makes writes fail with EPIPE; handle the error quietly instead of panicking.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>stdout or stderr?</summary><p>Where should "processed 5,000,000 rows in 2.1 s" go, and where should the JSON result go?</p><p><em>Answer:</em> the timing message to stderr, the JSON to stdout, so <code>txn … | jq</code> receives only data.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Exit codes</summary><p>Design exit codes for a reconciliation CLI used by a scheduler: success, mismatches found, input error, internal error.</p><p><em>Answer:</em> 0 for success with no mismatches; 1 for mismatches found (a business result the scheduler should alert on); 2 for usage or input errors (clap already uses 2 for usage); 70 (EX_SOFTWARE) or 101 for internal failures. Document them in the help text and test them with assert_cmd.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why is ripgrep fast?</summary><p>Name three techniques behind ripgrep's speed that are available to any Rust CLI.</p><p><em>Answer:</em> a regex engine that compiles to finite automata and uses SIMD for literal prefixes (the regex crate); memory-mapped or large buffered reads with no per-line allocation; and parallel directory traversal with gitignore filtering (the ignore crate) across all cores.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why Rust suits command-line tools.</li>
<li>I build CLIs with clap, structured errors, streaming input and correct use of stdout and stderr.</li>
<li>I know the crates for configuration, terminal UX and testing CLIs.</li>
<li>I can produce static and cross-compiled binaries and distribute them.</li>
<li>I completed the lab: filters, stdin, CSV output, tests, parallelism and a static build.</li>
</ul>
`});

CH.push({
  id: 'ch22', n: 22, title: 'Web Services and APIs',
  lede: 'Rust\'s web stack is mature: hyper underneath, tower for middleware, axum for routing and extraction, tonic for gRPC, sqlx and SeaORM for databases, and tracing and OpenTelemetry for observability. A Rust service typically uses a fraction of the memory of the equivalent JVM service and has no GC-related tail latency. This chapter builds an idempotent payments API, maps Spring Boot concepts to their Rust equivalents, and ends with a lab that takes it to production shape.',
  html: `
<h2>The stack</h2>
<div class="tbl"><table>
<tr><th>Layer</th><th>Crate</th><th>Spring Boot equivalent</th></tr>
<tr><td>HTTP protocol</td><td>hyper (HTTP/1.1, HTTP/2)</td><td>Tomcat, Netty</td></tr>
<tr><td>Middleware</td><td>tower (<code>Service</code>, <code>Layer</code>), tower-http (trace, timeout, CORS, compression, limits)</td><td>Servlet filters, HandlerInterceptor</td></tr>
<tr><td>Routing and extraction</td><td>axum (also actix-web, Rocket, Loco)</td><td>@RestController, @RequestBody, @PathVariable</td></tr>
<tr><td>Validation</td><td>serde types, newtypes, validator or garde</td><td>Bean Validation (@Valid)</td></tr>
<tr><td>Errors</td><td><code>IntoResponse</code> for an error enum</td><td>@ControllerAdvice</td></tr>
<tr><td>Database</td><td>sqlx (async, compile-time-checked SQL), SeaORM, Diesel</td><td>Spring Data JPA, JdbcTemplate</td></tr>
<tr><td>gRPC</td><td>tonic and prost</td><td>grpc-java</td></tr>
<tr><td>HTTP client</td><td>reqwest</td><td>WebClient, RestClient</td></tr>
<tr><td>Observability</td><td>tracing, tracing-subscriber, opentelemetry-otlp, metrics or prometheus-client</td><td>Micrometer, Actuator</td></tr>
<tr><td>Configuration</td><td>figment, config, envy</td><td>application.yml, @ConfigurationProperties</td></tr>
<tr><td>Dependency injection</td><td>Plain constructors and a shared <code>AppState</code></td><td>The Spring container</td></tr>
</table></div>
<p>There is no framework container in Rust services: <code>main</code> builds the dependencies (config, pools, clients) explicitly and passes them in an <code>AppState</code> that handlers extract with <code>State&lt;AppState&gt;</code>. Everything is visible and checked at compile time, at the cost of a little wiring.</p>

<h2>An idempotent payments API</h2>
${EX('c22-api', 'axum 0.8: create and fetch payments with idempotency keys, typed errors and middleware')}
${fig('reqflow', '<b>Figure 22.1</b> Step through: the path of a request through hyper, tower layers, the router, extractors, the handler and IntoResponse.')}
<p>What the output demonstrates: a retry with the same <code>Idempotency-Key</code> and the same body returns the original payment with 200 rather than charging twice; the same key with a different body is rejected with 422, and a missing key with 400, the codes recommended by the IETF Idempotency-Key header draft (which also suggests 409 for a retry that arrives while the first request is still being processed); an unknown currency and an unexpected field are rejected before anything is stored. The unexpected field is caught by serde inside the extractor. axum's own rejection would be a plain-text body, so the example wraps <code>Json</code> in a <code>JsonBody</code> extractor (derived with <code>#[from_request(via(Json), rejection(ApiError))]</code>, from axum's <code>macros</code> feature) and every error, including that one, leaves the service in the same JSON shape with a stable <code>error</code> code that clients can match on. The in-memory <code>Mutex</code> is held without any <code>.await</code> inside, which is the right use of a std lock in async code; a real service would use a database with a unique constraint on the key.</p>
${R('The same handler with Postgres via sqlx (compile-time checked)')`
async fn create(State(st): State<AppState>, headers: HeaderMap, Json(req): Json<NewPayment>)
    -> Result<(StatusCode, Json<Payment>), ApiError>
{
    let key = idempotency_key(&headers)?;
    let mut tx = st.db.begin().await?;
    let inserted = sqlx::query_as!(Payment,
        r#"INSERT INTO payments (idem_key, merchant_id, amount_minor, currency, status)
           VALUES ($1, $2, $3, $4, 'authorised')
           ON CONFLICT (idem_key) DO NOTHING
           RETURNING id, merchant_id, amount_minor, currency, status"#,
        key, req.merchant_id, req.amount_minor, req.currency)
        .fetch_optional(&mut *tx).await?;
    let Some(p) = inserted else {
        // The key exists: a retry gets the stored payment (200), a different body gets 422.
        // No new outbox event, so a retry never publishes payment.created twice.
        return Ok((StatusCode::OK, Json(existing_or_reused(&mut tx, &key, &req).await?)));
    };
    sqlx::query!("INSERT INTO outbox (topic, payload) VALUES ('payment.created', $1)", serde_json::to_value(&p)?)
        .execute(&mut *tx).await?;                     // same transaction as the payment row
    tx.commit().await?;                                // a relay publishes outbox rows after commit
    Ok((StatusCode::CREATED, Json(p)))
}
// Here Payment.id is an i64 and Payment.status a String (query_as! maps BIGINT and TEXT
// to those; Postgres has no unsigned integers, so u64 fails), and ApiError has
// From<sqlx::Error>. Two concurrent requests with one key are safe: the second INSERT
// waits for the first transaction, then DO NOTHING returns no row and it reads the stored one.`}

<h2>Production concerns</h2>
<ul>
<li><b>Graceful shutdown</b>: the example's <code>serve</code> mode uses <code>with_graceful_shutdown</code>, which stops accepting connections on SIGTERM and waits for in-flight requests. Pair it with a readiness probe that fails first and a <code>preStop</code> delay so the load balancer stops sending traffic.</li>
<li><b>Timeouts everywhere</b>: per request (tower-http), per outbound call (reqwest's timeout), per database query, and a pool acquire timeout.</li>
<li><b>Structured logs and traces</b>: tracing spans carry request IDs, payment IDs and timings; export them over OTLP with opentelemetry-otlp, and propagate W3C trace context on outbound calls.</li>
<li><b>Authentication</b>: validate JWTs (jsonwebtoken) or mTLS client certificates (rustls) in a tower layer that inserts the principal into request extensions; authorise in handlers or a policy layer.</li>
<li><b>Rate limiting and load shedding</b>: tower's <code>ConcurrencyLimit</code> and <code>LoadShed</code>, or tower_governor per client.</li>
<li><b>Never log secrets</b>: derive Debug carefully (Chapter 13's redacting derive), and skip sensitive fields in <code>#[instrument(skip(...))]</code>.</li>
</ul>
${T('A lean container image (multi-stage Dockerfile, shown as its key lines)')`
# build:   FROM rust:1.100 AS build ... RUN rustup target add x86_64-unknown-linux-musl
#          RUN apt-get update && apt-get install -y musl-tools   # for crates that compile C (ring, aws-lc-rs)
#          RUN cargo build --release --locked --target x86_64-unknown-linux-musl
# runtime: FROM gcr.io/distroless/static-debian13:nonroot
#          COPY --from=build /src/target/x86_64-unknown-linux-musl/release/payments-api /app
#          USER nonroot ; ENTRYPOINT ["/app", "serve"]
# result: an image of a few MiB with no shell and no package manager`}

${LAB('take the payments API to production shape', `<ol>
<li>Replace the in-memory store with Postgres using sqlx: a migration with a <code>UNIQUE (idem_key)</code> constraint (applied with <code>sqlx migrate run</code> or <code>sqlx::migrate!</code> at startup), a connection pool in <code>AppState</code>, and the handler above. The <code>query!</code> macros check SQL against a live database at compile time: set <code>DATABASE_URL</code> locally, and run <code>cargo sqlx prepare</code> (from sqlx-cli: <code>cargo install sqlx-cli --no-default-features --features postgres,rustls</code>) so CI builds offline from the committed <code>.sqlx</code> directory. Run Postgres with testcontainers in tests.</li>
<li>Add a request-ID layer (<code>SetRequestIdLayer</code> and <code>PropagateRequestIdLayer</code> from tower-http) and record the ID and payment ID in tracing spans; export to an OpenTelemetry collector.</li>
<li>Add JWT authentication as a layer: reject missing or invalid tokens with 401, put the merchant ID claim in request extensions, and make <code>create</code> refuse a <code>merchant_id</code> that does not match the token (403).</li>
<li>Expose Prometheus metrics: request count and latency by route and status, and a counter of idempotent replays.</li>
<li>Write tests that call the router with <code>oneshot</code>: success, replay, key reuse, validation errors and authentication failures. Then fire two identical requests concurrently and check that exactly one payment and one outbox row exist.</li>
<li>Build the distroless image, run it with a read-only root filesystem, and load test it (oha or k6) at 2,000 requests per second. Record p50 and p99 latency and resident memory, and compare with a Spring Boot service your team runs.</li>
<li>Send SIGTERM during the load test and confirm no request fails.</li>
</ol><p><em>Done when</em> the service passes its tests, survives a rolling restart under load without errors, and you have the latency and memory numbers to discuss with your team.</p>`)}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Blocking in handlers</strong> (password hashing, synchronous SDKs): use <code>spawn_blocking</code> (Chapter 16).</li>
<li><strong>Layer order</strong>: in axum, layers added later wrap earlier ones, so the last <code>.layer()</code> runs first on the request. Put tracing outermost.</li>
<li><strong>Treating a timeout as failure</strong> in money movement; the outcome is unknown, so reconcile using idempotency keys.</li>
<li><strong>Unbounded request bodies</strong> and unbounded in-memory queues.</li>
<li><strong>Exposing internal errors</strong> in responses; log them with the request ID and return a generic message.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Where does validation happen?</summary><p>A request has an extra field <code>"amount"</code> instead of <code>"amount_minor"</code>. Which code rejects it?</p><p><em>Answer:</em> serde, while the <code>JsonBody&lt;NewPayment&gt;</code> extractor deserialises (through axum's <code>Json</code>), because of <code>deny_unknown_fields</code>; serde reports the unknown field <code>amount</code> as soon as it meets it, before noticing that <code>amount_minor</code> is missing. The handler never runs, and the rejection is converted into the service's 422 <code>invalid_body</code> error.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A health model</summary><p>Design liveness and readiness endpoints for this service on Kubernetes.</p><p><em>Answer:</em> <code>/livez</code> returns 200 as long as the process can serve HTTP (no dependency checks, or a restart loop follows a database outage); <code>/readyz</code> checks that the pool can acquire a connection within a short timeout and returns 503 during shutdown, flipped by the same token that triggers graceful shutdown.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why tower?</summary><p>Why does it matter that axum handlers, middleware, hyper, tonic and reqwest all speak tower's <code>Service</code> trait?</p><p><em>Answer:</em> one middleware implementation (timeout, retry, rate limit, tracing, load shed) works for HTTP servers, gRPC servers and HTTP clients alike, and services compose like functions. It also makes testing easy: a router is just a Service you can call with a request.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can map Spring Boot concepts to the Rust web stack.</li>
<li>I can build an axum service with state, extractors, typed errors and middleware.</li>
<li>I implement idempotency correctly in memory and with a database.</li>
<li>I know the production concerns: shutdown, timeouts, telemetry, auth, rate limits, images.</li>
<li>I completed the lab and measured the service under load.</li>
</ul>
`});

CH.push({
  id: 'ch23', n: 23, title: 'Cloud-Native and Kubernetes',
  lede: 'Kubernetes and most of its ecosystem are written in Go, but the cloud\'s data planes are increasingly Rust: microVM monitors, proxies, log agents, container runtimes and storage engines. This chapter shows where Rust fits in cloud-native systems, builds a Kubernetes operator with kube-rs, covers serverless functions and the AWS SDK, and ends with a lab that deploys the operator to a local cluster.',
  html: `
<h2>Where Rust runs in the cloud</h2>
<div class="tbl"><table>
<tr><th>Layer</th><th>Rust components</th><th>Why Rust</th></tr>
<tr><td>Virtualisation</td><td>Firecracker (Lambda, Fargate), Cloud Hypervisor, crosvm</td><td>A small, memory-safe VMM is a smaller attack surface between tenants</td></tr>
<tr><td>Host OS</td><td>Bottlerocket's control components, youki (OCI runtime)</td><td>Safety at the most privileged layer</td></tr>
<tr><td>Network data plane</td><td>Linkerd2-proxy, Cloudflare's Pingora</td><td>Predictable latency and low memory per connection</td></tr>
<tr><td>Observability pipelines</td><td>Vector (now part of Datadog), the OpenTelemetry Rust SDK</td><td>High throughput with small, stable footprints on every node</td></tr>
<tr><td>Storage and databases</td><td>TiKV, Neon's storage, SurrealDB, Qdrant, and AWS's S3 ShardStore</td><td>Control over I/O and memory without GC pauses</td></tr>
<tr><td>Control plane</td><td>kube-rs operators</td><td>When the controller shares code or types with a Rust data plane</td></tr>
</table></div>
<p>For a platform team the practical pattern is: keep Go for controllers that live comfortably on client-go and controller-runtime, and use Rust where a component runs on every node or in every request path, where memory per instance multiplies across a fleet, or where the component handles untrusted input.</p>

<h2>An operator with kube-rs</h2>
<p><b>kube-rs</b> (a CNCF sandbox project) provides a typed client, a <code>CustomResource</code> derive that generates the CRD from a Rust struct, and a controller runtime with reflectors, watchers, a work queue and finalizer helpers, mirroring controller-runtime. Kubernetes API types come from <b>k8s-openapi</b>, selected by a feature (<code>latest</code> is 1.37 as of this writing).</p>
${EX('c23-operator', 'A Tenant operator: CRD from a struct, pure desired-state function, server-side apply, tests', { cmd: 'cargo run -- crd | head -24; cargo test' })}
${fig('ctrl', '<b>Figure 23.1</b> Step through: how the controller turns watch events into reconciles.')}
<p>The design choices are the same as in any good controller: compute desired state in a <b>pure function</b> (<code>desired</code>) that unit tests can exercise without a cluster; apply it with server-side apply and a fixed field manager so reconcile is idempotent; set owner references so Kubernetes garbage-collects children; report <code>observedGeneration</code> in status; and requeue periodically to correct drift. The CRD's OpenAPI schema comes from the Rust types through schemars, so the API server validates objects against exactly the types the controller deserialises.</p>
<div class="note key"><b>kube-rs and controller-runtime</b><p><code>Controller::new(...).owns(...).run(reconcile, error_policy, ctx)</code> corresponds to controller-runtime's builder with <code>For</code>, <code>Owns</code> and <code>Reconcile</code>; <code>kube::runtime::finalizer</code> wraps reconcile with add-finalizer and cleanup-on-delete logic; <code>watcher::Config::labels</code> and metadata-only watches (a <code>watcher</code> over <code>Api&lt;PartialObjectMeta&lt;K&gt;&gt;</code>, which replaced the deprecated <code>metadata_watcher</code>; <code>Controller::owns_stream</code> accepts such a stream) keep memory down; leader election is available through crates such as kube-leader-election or a Lease-based helper. A small kube-rs operator with filtered watches needs little memory beyond its cache; measure yours in the lab.</p></div>

<h2>Serverless and the AWS SDK</h2>
<p>Rust is a good fit for functions as a service because cold start and memory are billed. The AWS SDK for Rust has been generally available since November 2023 and covers every AWS service; <code>lambda_runtime</code> and <b>cargo-lambda</b> build, test and deploy functions for the <code>provided.al2023</code> runtime, on Graviton (arm64) for lower cost.</p>
${R('A Lambda that records a payment event in DynamoDB')`
use aws_sdk_dynamodb::{types::AttributeValue, Client};
use lambda_runtime::{run, service_fn, Error, LambdaEvent};
use serde::Deserialize;

#[derive(Deserialize)]
struct PaymentEvent { payment_id: String, amount_minor: i64, currency: String }

async fn handler(client: &Client, ev: LambdaEvent<PaymentEvent>) -> Result<(), Error> {
    let p = ev.payload;
    client.put_item()
        .table_name("payments")
        .item("pk", AttributeValue::S(p.payment_id))
        .item("amount_minor", AttributeValue::N(p.amount_minor.to_string()))
        .item("currency", AttributeValue::S(p.currency))
        .condition_expression("attribute_not_exists(pk)")     // idempotent insert
        .send().await?;
    Ok(())
}

#[tokio::main]
async fn main() -> Result<(), Error> {
    let config = aws_config::load_defaults(aws_config::BehaviorVersion::latest()).await; // once per cold start
    let client = Client::new(&config);
    run(service_fn(|ev| handler(&client, ev))).await
}
// cargo lambda build --release --arm64 && cargo lambda deploy`}

<h2>Containers and the cluster</h2>
<ul>
<li><b>Images</b>: a static musl or glibc binary on distroless (or scratch) gives images of a few MiB with no shell, which shrinks the vulnerability-scan surface to your binary and its embedded dependency list (<code>cargo auditable</code>).</li>
<li><b>Resources</b>: Rust services need no heap headroom for a collector, so memory requests can sit close to the working set. Tokio sizes its workers from the CPU limit (via cgroups); set CPU requests and limits deliberately, as for Go.</li>
<li><b>Signals</b>: handle SIGTERM and drain (Chapter 22); the binary is PID 1 in a distroless container, so it must handle signals itself.</li>
<li><b>Observability</b>: OTLP export of traces, metrics and logs integrates with the same collectors your Go and Java services use.</li>
</ul>

${LAB('deploy the Tenant operator to a local cluster', `<ol>
<li>Create a kind or k3d cluster. Generate the CRD and apply it: <code>cargo run -- crd | kubectl apply -f -</code> (kubectl accepts JSON as well as YAML). Check it with <code>kubectl explain tenant.spec</code>.</li>
<li>Write RBAC for a ServiceAccount in a ClusterRole (tenants and namespaces are cluster-scoped): get, list, watch and patch on tenants and tenants/status; get, list, watch, create and patch on namespaces and resourcequotas. Later steps add create and patch on events in <code>events.k8s.io</code> (step 5; kube's event <code>Recorder</code> patches repeated events into a series) and get, create and patch on leases in <code>coordination.k8s.io</code> (step 6, as kube-leader-election uses them). Test it with <code>kubectl auth can-i --as=system:serviceaccount:&lt;ns&gt;:&lt;name&gt;</code>.</li>
<li>Build a distroless image, load it into the cluster, and deploy the operator with resource requests of 50m CPU and 64Mi memory.</li>
<li>Create a Tenant and confirm the namespace, quota, owner references and status appear. Delete the namespace by hand and watch the operator recreate it.</li>
<li>Add a finalizer with <code>kube::runtime::finalizer</code> that records an audit event before a Tenant is deleted, and test deletion.</li>
<li>Add leader election so two replicas can run safely, and Prometheus metrics for reconcile count, errors and duration.</li>
<li>Create a few hundred unrelated namespaces and 1,000 Tenants, and measure the operator's memory. Then remove the label selector from the Namespace watch (the example already has one) and measure again, and finally try a metadata-only watch for the owned Namespaces.</li>
</ol><p><em>Done when</em> the operator survives a restart, recreates deleted children, cleans up through its finalizer, and its memory is understood.</p>`)}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Calling the API server inside reconcile for objects you already watch</strong>: read from the reflector store instead.</li>
<li><strong>Non-idempotent reconcile</strong> (create instead of apply, appending to lists): every resync duplicates work.</li>
<li><strong>Watching cluster-wide without filters</strong> and caching every object of a kind.</li>
<li><strong>Mismatched k8s-openapi features</strong> across crates in a workspace; select one Kubernetes version feature in one place.</li>
<li><strong>Creating SDK clients per invocation</strong> in Lambda; create them once per cold start.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Why server-side apply?</summary><p>Why does the operator use <code>Patch::Apply</code> with a field manager instead of create-or-update?</p><p><em>Answer:</em> apply is declarative and idempotent: the API server merges the fields this manager owns, leaves other managers' fields alone, and reports conflicts. Reconcile can run any number of times with the same result.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Status conditions</summary><p>Replace <code>ready: bool</code> with Kubernetes-style conditions. What fields and behaviour do you need?</p><p><em>Answer:</em> a <code>conditions: Vec&lt;Condition&gt;</code> using <code>k8s_openapi::apimachinery::pkg::apis::meta::v1::Condition</code> (type, status, reason, message, lastTransitionTime, observedGeneration), updated only when the status changes so lastTransitionTime is meaningful, with a Ready condition set to False and a reason when apply fails.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Go or Rust for this operator?</summary><p>Argue which language your platform team should use for its next three operators.</p><p><em>Answer:</em> it depends on the team and the surroundings. Go: the reference implementations, kubebuilder scaffolding, envtest, more examples and engineers. Rust: smaller memory, shared types with Rust data-plane components, stronger compile-time checks. A reasonable policy is Go by default and Rust where the operator is tightly coupled to Rust components or must run with very small footprints.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know where Rust is used in cloud infrastructure and why.</li>
<li>I can build a kube-rs operator with a derived CRD, pure desired state and server-side apply.</li>
<li>I can write a Lambda with the AWS SDK for Rust and deploy it with cargo-lambda.</li>
<li>I know how to package and size Rust services in containers.</li>
<li>I completed the lab: RBAC, deployment, finalizer, leader election and memory measurement.</li>
</ul>
`});

CH.push({
  id: 'ch24', n: 24, title: 'Security and Cryptography',
  lede: 'Memory safety removes the bug class behind most critical vulnerabilities in systems software, which makes Rust a natural choice for code that faces attackers: parsers, protocol implementations, cryptography and anything handling secrets. This chapter covers what Rust does and does not give you for security, the cryptography ecosystem (rustls, aws-lc-rs, RustCrypto), handling secrets, constant-time code, and hardening parsers, with a lab that builds a verified webhook receiver.',
  html: `
<h2>What Rust gives security engineers</h2>
<ul>
<li><b>No memory corruption in safe code</b>: buffer overflows, use-after-free, double free and uninitialised reads are the root of most remote code execution bugs in C and C++ software. They are gone, outside audited <code>unsafe</code>.</li>
<li><b>No data races</b>: unsynchronised access to shared memory from several threads does not compile. Higher-level race conditions remain possible, including time-of-check-to-time-of-use bugs on files or between two separate lock acquisitions.</li>
<li><b>Explicit errors and exhaustive matching</b>, so "forgot to handle the error case" bugs (a classic source of authentication bypasses, such as an unchecked signature result) are hard to write: the value inside a <code>Result</code> cannot be reached without handling the error, and a discarded <code>Result</code> triggers the <code>unused_must_use</code> warning, which CI should deny (an explicit <code>let _ =</code> still silences it, so look for those in review).</li>
<li><b>Types for invariants</b>: newtypes for validated input, typestate for protocol steps, and separate types for secret material that do not implement <code>Debug</code> or <code>Display</code>.</li>
</ul>
<p>And what it does not: logic errors in authorisation, injection (SQL, command, template), insecure defaults, misuse of cryptography, denial of service through panics or unbounded allocation, and supply-chain compromise. A panic on malformed input is memory safe but still takes your service down; treat reachable panics in request paths as security bugs.</p>

<h2>The cryptography ecosystem</h2>
<div class="tbl"><table>
<tr><th>Crate</th><th>What it is</th><th>Use for</th></tr>
<tr><td><b>rustls</b></td><td>A TLS 1.2 and 1.3 implementation in Rust, available as a TLS backend in curl and the default TLS stack across much of the Rust ecosystem</td><td>Default TLS for clients and servers (reqwest, hyper, tonic, axum through tokio-rustls)</td></tr>
<tr><td><b>aws-lc-rs</b></td><td>Rust bindings to AWS-LC, AWS's BoringSSL-derived library; has a FIPS 140-3 validated mode</td><td>rustls's default crypto provider; regulated environments needing FIPS</td></tr>
<tr><td><b>ring</b></td><td>Long-established primitives library</td><td>Older code; many crates support both</td></tr>
<tr><td><b>RustCrypto</b> (sha2, hmac, aes-gcm, chacha20poly1305, argon2, ed25519-dalek, p256…)</td><td>Pure-Rust implementations of individual algorithms</td><td>no_std and Wasm targets, or when you need one algorithm without C code</td></tr>
<tr><td><b>zeroize</b>, <b>secrecy</b></td><td>Wiping secrets on drop; wrapper types that refuse to print</td><td>Keys, tokens, passwords in memory</td></tr>
<tr><td><b>subtle</b></td><td>Constant-time comparisons and selection</td><td>Comparing MACs, tokens, password hashes</td></tr>
</table></div>
<p>With its default aws-lc-rs provider, rustls supports the hybrid post-quantum key exchange X25519MLKEM768 (classical X25519 combined with ML-KEM-768 from FIPS 203), and its <code>prefer-post-quantum</code> feature, on by default in current 0.23 releases, makes it the first choice. That protects TLS traffic recorded today against future quantum decryption. Where FIPS 140-3 validated cryptography is required (US federal systems and FedRAMP, and many bank and government customer contracts), build rustls with aws-lc-rs's <code>fips</code> feature, which uses the validated AWS-LC FIPS module, and record the module's certificate number. PCI DSS itself asks for "strong cryptography" (industry-tested algorithms and key lengths with proper key management) rather than FIPS validation specifically, but a validated module is a common and easily accepted way to evidence it.</p>
${EX('c24-crypto', 'Webhook HMAC verification, constant-time comparison, Argon2id, Ed25519 and zeroize')}
<p>The example uses the current major releases of the RustCrypto crates (hmac 0.13, sha2 0.11, ed25519-dalek 3, argon2 0.6, all released during 2026). Much of the ecosystem still depends on the previous generation (hmac 0.12, sha2 0.10, ed25519-dalek 2, argon2 0.5), so expect both in your <code>Cargo.lock</code> for a while; the one change this example needed was importing the <code>KeyInit</code> trait, which now provides <code>new_from_slice</code>. Note the last webhook case: the timestamp comes from an attacker-controlled header, so the freshness check uses <code>abs_diff</code>, because <code>(now - ts).abs()</code> overflows on <code>i64::MIN</code> and would panic in a debug build or wrap in release.</p>

<h2>Verifying webhooks and tokens</h2>
${fig('webhook', '<b>Figure 24.1</b> Interactive: compute and verify a webhook signature; change one character of the received body and see why comparison must be constant time.')}
<ul>
<li>Sign a canonical string that includes a <b>timestamp</b> and reject messages outside a short window, to stop replays.</li>
<li>Verify over the <b>raw bytes</b> received, before parsing JSON (parsing and re-serialising changes bytes).</li>
<li>Compare with a <b>constant-time</b> function (<code>Mac::verify_slice</code>, <code>subtle::ConstantTimeEq</code>), never <code>==</code>.</li>
<li>Support <b>two active secrets</b> during rotation and try both.</li>
<li>For JWTs, pin the expected algorithm and issuer and validate expiry and audience (the jsonwebtoken crate's <code>Validation</code>); never accept <code>alg: none</code> or let the token choose the key.</li>
</ul>

<h2>Secrets in memory and in logs</h2>
${R('A secret type that cannot leak through formatting')`
use secrecy::{ExposeSecret, SecretString};

#[derive(serde::Deserialize)]
pub struct GatewayConfig {
    pub endpoint: url::Url,
    pub api_key: SecretString,          // Debug prints SecretBox<str>([REDACTED]); zeroized on drop
}

fn auth_header(cfg: &GatewayConfig) -> String {
    format!("Bearer {}", cfg.api_key.expose_secret())   // the one greppable place it is read
}`}
<p>Load secrets from a secrets manager or mounted files at startup, keep them in <code>SecretString</code> or <code>Zeroizing</code> buffers, never derive <code>Debug</code> on structs that hold them (or redact, as Chapter 13's macro did), and skip them in tracing spans. Zeroising reduces exposure in core dumps and memory disclosure bugs; it is not a guarantee, because copies may exist in registers, swap or the allocator's free lists.</p>

<h2>Parsing untrusted input</h2>
<p>Parsers are where attackers start. In Rust: use parser combinators (nom, winnow) or zero-copy formats (zerocopy, bytemuck) instead of hand-rolled pointer arithmetic; bound every length and recursion depth before allocating; return errors instead of panicking (no <code>unwrap</code>, no unchecked indexing); and fuzz every parser continuously (Chapter 20). Rust ports of security-critical parsers are a growing pattern: image and font decoders in browsers and Android, the sudo-rs and ntpd-rs rewrites, and the Prossimo project's work on memory-safe infrastructure.</p>
<div class="note key"><b>For a CISO</b><p>Rust is one of the "memory-safe languages" named in CISA, NSA and FBI guidance, and the strongest choice where C or C++ would otherwise be used. In a security programme, frame it as: new internet-facing parsers and native components in memory-safe languages by default; existing C and C++ hardened (C++26 hardened library, sanitisers, fuzzing) and replaced at component boundaries over time; <code>unsafe</code> code inventoried, reviewed and tested with Miri; and supply-chain controls as in Chapter 12. Measure it the way Google did: memory-safety vulnerabilities as a share of the total, by year.</p></div>

${LAB('a verified webhook receiver', `<ol>
<li>Build an axum endpoint <code>POST /webhooks/psp</code> that reads the raw body as <code>Bytes</code> (with a 64 KiB limit), the <code>X-Signature</code> and <code>X-Timestamp</code> headers, and verifies them with the function from the example before parsing JSON.</li>
<li>Load two secrets (current and next) from files at startup into <code>SecretString</code>, accept a signature made with either, and log which key matched (by key ID, never the key).</li>
<li>Store processed event IDs with a TTL so duplicates are acknowledged but not reprocessed.</li>
<li>Return 401 for bad signatures, 400 for malformed bodies, 409 or 200 for duplicates, and never include the expected signature in a response or log.</li>
<li>Write a fuzz target for the body parser and run it for ten minutes; add any crash as a regression test.</li>
<li>Switch the service's TLS to rustls with aws-lc-rs, check that the hybrid post-quantum group is negotiated (<code>openssl s_client -groups X25519MLKEM768</code> with OpenSSL 3.5 or later, or the server's handshake log), and enable FIPS mode in a branch to see what changes.</li>
</ol><p><em>Done when</em> replayed, tampered, stale and duplicate webhooks are all handled correctly in tests, and no secret appears in any log line.</p>`)}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Rolling your own cryptography</strong> or combining primitives ad hoc; use high-level APIs (AEADs, HPKE, TLS) from maintained crates.</li>
<li><strong>Panics reachable from input</strong>: an attacker who can crash a worker at will has a denial-of-service.</li>
<li><strong>Logging request bodies</strong> that contain card data or personal data. In PCI DSS v4.0.1, a full PAN in a log is stored account data that must be rendered unreadable (requirement 3.5.1), and sensitive authentication data such as the CVV must not be kept after authorisation at all (3.3.1), logs included.</li>
<li><strong>Treating <code>unsafe</code> in a dependency as someone else's problem</strong>; inventory it with cargo-geiger and prefer crates that test with Miri.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Why verify raw bytes?</summary><p>Why must a webhook signature be checked against the raw body rather than the parsed and re-serialised JSON?</p><p><em>Answer:</em> serialisers may reorder keys, change whitespace or number formatting, so the bytes differ from what the sender signed and verification fails, or worse, a parser quirk lets two different byte strings parse to the same value.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A type for card numbers</summary><p>Design a <code>Pan</code> type for primary account numbers that cannot be logged in full by accident.</p><p><em>Answer:</em> a newtype over <code>Zeroizing&lt;String&gt;</code> with a validating constructor (digits only, length 12 to 19, Luhn check), a <code>Debug</code> and <code>Display</code> that print only the last four digits (PCI DSS v4.0.1 requirement 3.4.1 requires PAN to be masked when displayed, with the BIN and last four digits as the most that may be shown, so that only personnel with a legitimate business need can see more), a method returning the full number for the tokenisation call only, and no <code>Serialize</code> or <code>Clone</code> implementation, so the number cannot be copied into a log record or a response by accident.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Is a panic a vulnerability?</summary><p>Your parser panics on a 3-byte input. Rust guarantees memory safety. Is it still a security bug?</p><p><em>Answer:</em> yes, if attackers can reach it. Under Tokio a panicking task is dropped along with its connection (axum can turn it into a 500 with tower-http's <code>CatchPanicLayer</code>), in a thread-per-request server it kills that thread, and with <code>panic = "abort"</code> it kills the whole process; repeated requests make a denial of service, and a panic while a <code>Mutex</code> is held poisons it for every later request. Track it like any other vulnerability, though with lower severity than memory corruption.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know which vulnerability classes Rust removes and which remain.</li>
<li>I can choose between rustls, aws-lc-rs, ring and RustCrypto, including for FIPS.</li>
<li>I verify signatures and tokens correctly: timestamps, raw bytes, constant time, rotation.</li>
<li>I handle secrets with dedicated types and keep them out of logs.</li>
<li>I completed the webhook lab, including fuzzing.</li>
</ul>
`});

CH.push({
  id: 'ch25', n: 25, title: 'Fintech and Low-Latency Systems',
  lede: 'Financial systems need two things that are usually in tension: correctness that survives audits, and performance that holds at the tail. Rust\'s type system makes money, currencies and workflow states hard to misuse, and its lack of a garbage collector makes latency predictable. This chapter covers money and decimal arithmetic, ledgers, order books and matching, low-latency engineering, payments message formats and the blockchain ecosystem, with a lab that builds and measures a matching engine.',
  html: `
<h2>Correctness first: money in the type system</h2>
<p>Most financial bugs are not exotic: an amount in the wrong currency, a float rounding error, a rounding rule applied in the wrong place, an overflow on a large aggregate, a state transition that should have been impossible. Rust lets you rule most of them out by construction:</p>
<ul>
<li><b>Integer minor units</b> (<code>i64</code> paise, cents) with checked arithmetic for amounts; <code>i128</code> for aggregates; <code>rust_decimal::Decimal</code> for rates and prices that need fractions. Never <code>f64</code>.</li>
<li><b>Currency as a type parameter</b>, so <code>Money&lt;Inr&gt; + Money&lt;Usd&gt;</code> does not compile, and conversion is an explicit function that takes a rate and a rounding strategy.</li>
<li><b>Explicit rounding</b>: banker's rounding (half to even) for many accounting uses, half-up for some customer-facing displays; make the rule a parameter, not an accident.</li>
<li><b>Enums and typestate</b> for payment and trade lifecycles (Chapter 6), so impossible transitions are errors.</li>
</ul>
${EX('c25-orderbook', 'Currency-typed money, decimal FX conversion, and a price-time priority order book measured on a million orders')}
<p>The commented-out line in <code>main</code> shows the compile-time currency check; <code>PhantomData&lt;C&gt;</code> makes it free at runtime, so <code>Money&lt;Inr&gt;</code> is just an <code>i64</code>. The order book uses a <code>BTreeMap</code> of price levels, each a FIFO <code>VecDeque</code>, which gives price-time priority with simple, safe code; the benchmark shows that even this straightforward design handles an order in around a hundred nanoseconds at the median on the build machine (including the cost of reading the clock twice), and reports the tail, not just the average. Note how far p99.9 sits from p50: allocations when a level's queue grows, and cache misses, are what the lab removes.</p>
${fig('book', '<b>Figure 25.1</b> Interactive: submit orders to a small book and watch price-time priority produce fills.')}

<h2>Ledgers</h2>
<p>A ledger is the system of record, and its rules translate well into Rust types:</p>
${R('Double-entry postings that must balance')`
pub struct Posting { pub account: AccountId, pub amount: Money<Inr> }   // + debit, - credit

pub struct Journal(Vec<Posting>);          // private field: only one way to build one

impl Journal {
    pub fn new(postings: Vec<Posting>) -> Result<Self, LedgerError> {
        if postings.len() < 2 { return Err(LedgerError::TooFewLegs); }
        let sum = postings.iter().try_fold(0i64, |acc, p| acc.checked_add(p.amount.minor))
            .ok_or(LedgerError::Overflow)?;
        if sum != 0 { return Err(LedgerError::Unbalanced(sum)); }
        Ok(Journal(postings))
    }
}
// Ledger::post(&mut self, j: Journal) cannot receive an unbalanced journal: the type proves it.`}
<p>Add an append-only event log (events as enums serialised with serde), deterministic replay (state is a fold over events; tests replay production logs), idempotency keys on every external command, and reconciliation jobs that compare the ledger with bank and scheme files. Rust's determinism (no GC, explicit iteration order with BTreeMap) makes replay reliable.</p>

<h2>Low-latency engineering</h2>
<div class="tbl"><table>
<tr><th>Technique</th><th>Rust tools</th></tr>
<tr><td>No allocation on the hot path</td><td>Pre-allocated Vecs and pools, <code>ArrayVec</code>/<code>heapless</code>, arenas or the <code>Allocator</code> trait (1.100), <code>clear()</code> instead of new buffers</td></tr>
<tr><td>Lock-free hand-off between threads</td><td>Single-producer single-consumer ring buffers (rtrb), crossbeam's <code>ArrayQueue</code>, disruptor-style sequencers</td></tr>
<tr><td>Thread placement</td><td>Pin threads to isolated cores (core_affinity), busy-poll instead of sleeping, keep one thread per core</td></tr>
<tr><td>Cache-friendly data</td><td>Struct-of-arrays, <code>#[repr(align(64))]</code> to avoid false sharing between threads, fixed-point integers</td></tr>
<tr><td>Kernel bypass and fast I/O</td><td>io_uring (the io-uring crate directly, or thread-per-core runtimes such as compio, monoio and glommio; check each one's release activity, as several have slowed), AF_XDP and DPDK bindings, raw UDP multicast for market data</td></tr>
<tr><td>Zero-copy decoding</td><td>zerocopy and bytemuck for binary protocols (SBE, ITCH), rkyv for zero-copy deserialisation</td></tr>
<tr><td>Measurement</td><td>hdrhistogram for latency distributions, <code>rdtsc</code>-based clocks (quanta), flame graphs under realistic load</td></tr>
</table></div>
<p>Rust does not make these techniques unnecessary; it makes them safe to apply. A lock-free queue with a subtle race is a production incident in C++; in Rust the queue's <code>unsafe</code> internals are confined to a crate tested with loom and Miri, and the code using it cannot misuse it.</p>

<h2>Payments formats and rails</h2>
<ul>
<li><b>ISO 8583</b> (card authorisation): binary bitmap-driven messages, a natural fit for zero-copy parsers with nom or winnow, fuzzed continuously.</li>
<li><b>ISO 20022</b> (pacs, pain and camt XML messages used by SWIFT, SEPA and RTGS systems): generate Rust types from the XSD schemas and use quick-xml with serde; validate structure on entry.</li>
<li><b>FIX</b> (trading): engines and parsers exist as crates; many firms write their own tag-value or SBE codecs for speed.</li>
<li><b>Card data</b>: keep PANs out of most of the system (tokenisation), use the redacting types from Chapter 24, and remember that PCI DSS scope follows wherever card data flows, including logs and core dumps.</li>
</ul>

<h2>Blockchain and digital assets</h2>
<p>Rust is one of the main languages of blockchain infrastructure: Solana's on-chain programs are written in Rust (with the Anchor framework), Polkadot and its parachains are built with the Polkadot SDK, Ethereum has Reth (an execution client) and Lighthouse (a consensus client) plus the Foundry toolkit, and zero-knowledge proving systems (RISC Zero, SP1, Plonky3) are largely Rust. The reasons are the same as elsewhere in finance: performance, determinism, and the cost of a bug when it moves money irreversibly.</p>

${LAB('a matching engine you can trust', `<ol>
<li>Start from the example's <code>Book</code>. Add order cancellation by ID (keep a <code>HashMap&lt;OrderId, (Side, Price)&gt;</code> to find the level in O(log n), then remove the order from that level's queue, or mark it cancelled and skip it lazily when it reaches the front) and market orders.</li>
<li>Add self-trade prevention: an incoming order never fills against a resting order from the same account.</li>
<li>Write property tests (proptest, Chapter 20) over random order sequences: after every <code>submit</code> the best bid is below the best ask; quantity is conserved (everything submitted is filled, resting or cancelled); every fill is at the maker's price and within the taker's limit; no resting order has zero quantity.</li>
<li>Emit events (<code>Accepted</code>, <code>Filled</code>, <code>Cancelled</code>) into an append-only Vec, rebuild a book by replaying them, and assert both books are identical.</li>
<li>Put the engine on its own thread fed by an SPSC ring buffer (rtrb) from a gateway thread; measure end-to-end latency with hdrhistogram at 1 million orders per second.</li>
<li>Remove the remaining allocations on the hot path (fills buffer, VecDeque growth) and compare p99 and p99.9 before and after.</li>
</ol><p><em>Done when</em> the property tests pass, replay is exact, and you can explain your p99.9 latency.</p>`)}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Floats anywhere near money</strong>, including in JSON (send amounts as strings or integers).</li>
<li><strong>Measuring averages</strong>; trading and payments live and die at p99 and beyond.</li>
<li><strong>HashMap iteration order</strong> in anything that must be deterministic or replayable.</li>
<li><strong>Treating a timeout as a decline</strong>; it is unknown and needs reconciliation.</li>
<li><strong>Premature lock-free code</strong> before measuring a simple single-threaded engine, which is often fast enough.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Banker's rounding</summary><p>Round 2.345 and 2.355 to two places with half-to-even.</p><p><em>Answer:</em> 2.34 and 2.36: halves round to the nearest even final digit, which avoids a systematic upward bias across many roundings.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Fees in several currencies</summary><p>Extend <code>Money&lt;C&gt;</code> with a currency that has three decimal places (KWD) and make <code>Display</code> correct for it.</p><p><em>Answer:</em> <code>impl Currency for Kwd { const CODE: &amp;'static str = "KWD"; const DIGITS: u32 = 3; }</code>. <code>to_decimal</code> already uses <code>C::DIGITS</code> as the scale, so <code>Money::&lt;Kwd&gt;::new(1500)</code> displays as "KWD 1.500" with no other change. <code>convert</code>, however, hard-codes two decimal places and a factor of 100; make it generic over the target currency and use <code>C::DIGITS</code> for both, or KWD conversions would be off by a factor of ten.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why BTreeMap for the book?</summary><p>What would you change for a production exchange with prices on a fixed tick grid?</p><p><em>Answer:</em> with a bounded tick grid, an array indexed by price ticks (plus best-bid and best-ask indices) gives O(1) access and better cache behaviour than a tree; each level holds an intrusive FIFO or a slab-allocated queue to avoid per-order allocation. The BTreeMap version is a correct, simple baseline to test the fast one against.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I model money with integer minor units, decimal rates, explicit rounding and currency types.</li>
<li>I can build ledgers whose types enforce balanced postings and support replay.</li>
<li>I understand price-time priority matching and can measure latency distributions.</li>
<li>I know the low-latency toolbox and the payments and trading formats.</li>
<li>I completed the matching-engine lab with property tests, replay and latency measurement.</li>
</ul>
`});

CH.push({
  id: 'ch26', n: 26, title: 'Data and AI',
  lede: 'A large share of the modern data stack now has a Rust core under a Python or SQL interface: Polars, DataFusion and the Apache Arrow libraries, vector databases, tokenizers and inference engines, and Python\'s fastest tooling. This chapter explains why, surveys the ecosystem for data engineering and AI, and builds a Python extension in Rust in a lab that measures the speed-up.',
  html: `
<h2>Why data infrastructure moved to Rust</h2>
<p>Analytical engines need tight control over memory layout, SIMD, and multi-core parallelism, and they are embedded in other languages' processes. That used to mean C++. Rust gives the same control with memory safety, a much better build and packaging story (Cargo plus maturin produce Python wheels for every platform from one command) and fearless parallelism, which matters when a query engine runs work-stealing scans across all cores. Most of the projects below were started after 2018.</p>
${fig('columnar', '<b>Figure 26.1</b> Interactive: row layout versus Apache Arrow\'s columnar layout.')}

<h2>The ecosystem</h2>
<div class="tbl"><table>
<tr><th>Area</th><th>Projects with Rust cores</th></tr>
<tr><td>Columnar memory and formats</td><td>arrow-rs and parquet (Apache), Lance (columnar format for ML data), Vortex</td></tr>
<tr><td>DataFrames and query engines</td><td>Polars (DataFrames, lazy query optimiser; Python and Rust APIs), Apache DataFusion (extensible SQL engine used inside many databases), Apache DataFusion Comet (Spark accelerator)</td></tr>
<tr><td>Table formats</td><td>delta-rs (Delta Lake), iceberg-rust</td></tr>
<tr><td>Databases and search</td><td>InfluxDB 3 (built on DataFusion), Qdrant and LanceDB (vector search), Meilisearch and Tantivy (full-text), TiKV, Materialize</td></tr>
<tr><td>Streaming and pipelines</td><td>Vector (observability pipelines), Fluvio, Arroyo</td></tr>
<tr><td>ML inference</td><td>candle (Hugging Face), burn, mistral.rs, ort (ONNX Runtime bindings), llama.cpp bindings</td></tr>
<tr><td>ML building blocks</td><td>tokenizers and safetensors (Hugging Face), text-embeddings-inference</td></tr>
<tr><td>Python tooling</td><td>uv (packages and environments), ruff (lint and format), ty (type checker), pydantic-core, orjson</td></tr>
<tr><td>AI developer tools</td><td>Several coding agents and their sandboxes, including OpenAI's Codex CLI (rewritten in Rust in 2025), and Wasm-based tool sandboxes</td></tr>
</table></div>
${R('Polars from Rust: a lazy query over Parquet (the same plan Python users build)')`
use polars::prelude::*;

// polars features: lazy, parquet, aws (for s3:// paths). Paths are PlRefPath values, hence .into().
let lf = LazyFrame::scan_parquet("s3://lake/payments/2026-11/*.parquet".into(), Default::default())?
    .filter(col("status").eq(lit("approved")))
    .group_by([col("merchant_id")])
    .agg([col("amount_minor").sum().alias("total"), len().alias("count")])
    .sort(["total"], SortMultipleOptions::default().with_order_descending(true))
    .limit(20);
let top = lf.collect()?;   // the optimiser pushes the filter and column selection into the Parquet scan`}

<h2>Rust inside Python</h2>
<p>The highest-leverage pattern for most data teams is not rewriting pipelines in Rust; it is moving the one hot function into a Rust extension and keeping everything else in Python. PyO3 maps Python types to Rust (lists to <code>Vec</code>, str to <code>String</code> or <code>&amp;str</code>, numpy arrays through the numpy crate, Arrow data through pyo3-arrow without copying), raises Python exceptions from Rust errors, and lets Rust release the GIL so other Python threads run in parallel.</p>
${EX('c26-pyo3', 'A velocity-check function as a Python extension, compared with pure Python on two million transactions', { cmd: 'cargo build --release && cp target/release/libfastrisk.so fastrisk.so && python3 bench.py' })}
<p>The result is identical and several times faster, and the Python caller does not know or care that the function is Rust. Converting the four million Python integers into Rust vectors is only about a tenth of the Rust call (timed separately with a function that just takes the two lists); most of the time goes into grouping by card in a <code>HashMap</code> and sorting. Passing columns as Arrow or numpy buffers removes the conversion copy (step 3 of the lab), and parallelising the per-card work inside Rust (step 4) is where most of the remaining gain lies. For distribution, <code>maturin build --release</code> produces a wheel; with the <code>abi3-py39</code> feature one wheel per platform works for every Python from 3.9, and maturin's GitHub Actions template builds Linux, macOS and Windows wheels for x86-64 and ARM.</p>

<h2>Inference in Rust</h2>
<p>Training stays in Python and CUDA. Inference is different: a service that loads a model and answers requests benefits from Rust's small footprint, predictable latency and safe concurrency. Options range from <b>ort</b> (ONNX Runtime from Rust, the simplest path for models exported from PyTorch), to <b>candle</b> and <b>burn</b> (native Rust tensor libraries with CUDA and Metal backends), to <b>mistral.rs</b> for LLM serving. For fraud and risk scoring with gradient-boosted trees, exporting to ONNX and serving from an axum service is a common pattern with single-digit-millisecond latency.</p>
${R('Scoring a fraud model exported to ONNX (ort crate)')`
use ort::session::Session;
use ort::value::Tensor;

// ort 2.0 (release candidate rc.15 at the time of writing; pin the exact version)
let env = ort::init().with_name("risk").build()?;                            // once per process
let mut model = Session::builder(&env)?.commit_from_file("fraud_gbt.onnx")?; // load once at startup
let features: Vec<f32> = txn.features();                                 // e.g. 32 engineered features
let input = Tensor::from_array(([1usize, 32], features))?;
let outputs = model.run(ort::inputs!["input" => input])?;                // run takes &mut self
let (_, p) = outputs["probabilities"].try_extract_tensor::<f32>()?;
let fraud_probability = p[1];`}
<p>Two production details. <code>Session::run</code> takes <code>&amp;mut self</code>, so an axum service either keeps a small pool of sessions (one per worker thread) or puts one behind a <code>Mutex</code>, and runs inference in <code>spawn_blocking</code> or on a dedicated thread pool so it does not stall the async workers. And ort downloads or links a native ONNX Runtime library, which belongs in your SBOM and patching process like any other native dependency.</p>
${LAB('a Rust accelerator for a Python pipeline', `<ol>
<li>Create the extension with <code>maturin new --bindings pyo3 fastrisk</code> (or start from the example), and install it into a virtual environment with <code>maturin develop --release</code>.</li>
<li>Reproduce the benchmark, then profile the pure-Python version to confirm the velocity check is the hot spot it replaces.</li>
<li>Change the signature to accept a Polars or pyarrow table through pyo3-arrow (it accepts any object that exports the Arrow PyCapsule interface, as both do) so columns arrive without copying, and return a boolean column of flags. Match the binding crate to your pyo3 version: pyo3-arrow 0.21 uses pyo3 0.30 like the example, while pyo3-polars 0.28 still requires pyo3 0.29, and one extension cannot link two pyo3 versions.</li>
<li>Parallelise inside Rust with rayon over card groups, while the GIL is released, and measure the speed-up on 4 cores.</li>
<li>Add input validation that raises <code>ValueError</code> with a clear message, and Python tests with pytest.</li>
<li>Build abi3 wheels for Linux x86-64 and aarch64 in CI and install them in a clean container.</li>
</ol><p><em>Done when</em> the Python pipeline gets the same answers faster, and the wheel installs with pip on a machine without Rust.</p>`)}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Crossing the boundary per row</strong>: calling a Rust function a million times from a Python loop is slow; pass whole columns or batches.</li>
<li><strong>Converting Arrow or numpy data to Python lists</strong> and back; use zero-copy bindings.</li>
<li><strong>Holding the GIL during long Rust work</strong>, which blocks every other Python thread.</li>
<li><strong>Rewriting a whole pipeline</strong> when Polars or DataFusion already solve the problem from Python or SQL.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Why columnar?</summary><p>Why is <code>SUM(amount)</code> faster over Arrow data than over a <code>Vec&lt;Payment&gt;</code>?</p><p><em>Answer:</em> the amounts are contiguous, so the CPU streams exactly the bytes it needs and the loop vectorises; in a Vec of structs every cache line also carries IDs and currencies the sum does not use.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Where to draw the line</summary><p>A nightly Python job joins three large Parquet datasets, computes features and scores a model. Where would Rust help, and how?</p><p><em>Answer:</em> the joins and aggregations are best expressed in Polars or DataFusion (already Rust, called from Python); a custom feature with a tight loop that neither engine expresses well is a candidate for a PyO3 extension; model scoring can move to an ONNX model served by a Rust service if latency or cost matters.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Releasing the GIL safely</summary><p>Why does PyO3 require the closure passed to <code>py.detach</code> to be <code>Ungil</code> (effectively Send)?</p><p><em>Answer:</em> while the GIL is released, other threads may run Python code and mutate Python objects; Rust code must therefore not hold references to Python objects that require the GIL. Requiring Send-like types inside the closure lets the compiler enforce that only plain Rust data is used.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why analytical engines and Python tooling moved to Rust.</li>
<li>I know the Arrow, Polars, DataFusion and inference ecosystems.</li>
<li>I can build and ship a PyO3 extension with maturin.</li>
<li>I can choose between using an existing engine, writing an extension, and serving a model from Rust.</li>
<li>I completed the lab and measured the speed-up.</li>
</ul>
`});
