<style>
/* Layout: lab manual. A fixed chapter rail on the left, one reading column, figures that break slightly wider than the prose. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#121A26; --ink-2:#384457; --muted:#5F6B7D; --line:#D6DCE5; --line-2:#9AA5B5;

  --code-bg:#EDF1F6; --code-ink:#1B2534;

  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;

  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#F2955A; --accent-soft:#3A2214; --hot:#FF7383; --hot-soft:#3D1A20; --ok:#43C99D; --ok-soft:#12332A;
  --cmp:#B78FFF; --cmp-soft:#291F43; --warn:#E5B54A; --warn-soft:#352B12;
  --code-bg:#111821; --code-ink:#DCE3EC;
  --tk-key:#C39BFF; --tk-str:#5FD3A8; --tk-num:#FF9E6B; --tk-com:#7D889A; --tk-fn:#8DB4FF; --tk-type:#F08FC0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C26; --sunk:#1C2531; --ink:#E5EAF1; --ink-2:#B5BFCD; --muted:#8F9AAB; --line:#28323F; --line-2:#56627A;
  --accent:#F2955A; --accent-soft:#3A2214; --hot:#FF7383; --hot-soft:#3D1A20; --ok:#43C99D; --ok-soft:#12332A;
  --cmp:#B78FFF; --cmp-soft:#291F43; --warn:#E5B54A; --warn-soft:#352B12;
  --code-bg:#111821; --code-ink:#DCE3EC;

  color-scheme:dark}
*{box-sizing:border-box}

.brand{font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.1;margin:0 0 4px}
.brand-sub{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0 0 22px}

.rail a.complete .done{background:var(--ok);border-color:var(--ok)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;font-family:var(--f-display)}

/* chapter */

/* callouts */

.note.key{border-color:var(--accent);background:var(--accent-soft)} .note.key>b:first-child{color:var(--accent)}
.note.pit{border-color:var(--hot);background:var(--hot-soft)} .note.pit>b:first-child{color:var(--hot)}
.note.ex{border-style:dashed} .note.ex>b:first-child{color:var(--ok)}
.note.lab{border-color:var(--cmp);background:var(--cmp-soft)} .note.lab>b:first-child{color:var(--cmp)} .note.lab ol{margin:.4em 0 .2em;padding-left:1.3em}
.formula{font-family:var(--f-mono);font-size:15.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:16px 0 18px;overflow-x:auto;white-space:pre;line-height:1.55}

.stage{overflow-x:auto;padding:4px 0}
.dg{display:block;margin:0 auto;max-width:100%;height:auto}
.fnote{font-family:var(--f-display);font-size:15.5px;line-height:1.45;color:var(--ink);background:var(--sunk);border-radius:8px;padding:10px 14px;margin-top:10px;min-height:3.3em}

.prog{flex:1;min-width:80px;height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}

.cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.tabs,.pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.cell{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}

.th{font-size:12px;fill:var(--muted);font-weight:700}

.tp.hot,.tri.hot{fill:var(--hot)} .tp.ok,.tri.ok{fill:var(--ok)} .tp.cmp,.tri.cmp{fill:var(--cmp)} .tp.acc,.tri.acc{fill:var(--accent)} .tp.warn,.tri.warn{fill:var(--warn)}
.lbg{fill:var(--surface);stroke:var(--line);stroke-width:1}
.lbg.hot{fill:var(--hot-soft);stroke:var(--hot)} .lbg.ok{fill:var(--ok-soft);stroke:var(--ok)} .lbg.acc{fill:var(--accent-soft);stroke:var(--accent)} .lbg.cmp{fill:var(--cmp-soft);stroke:var(--cmp)} .lbg.dim{opacity:.35}
.w{font-size:12px;fill:var(--ink-2);font-weight:600}
.axis{stroke:var(--line-2);stroke-width:1.2} .gridl{stroke:var(--line);stroke-width:1}
.c1{stroke:var(--ink-2)} .c2{stroke:var(--ok)} .c3{stroke:var(--accent)} .c4{stroke:var(--cmp)} .c5{stroke:var(--warn)} .c6{stroke:var(--hot)}
.f1{fill:var(--ink-2)} .f2{fill:var(--ok)} .f3{fill:var(--accent)} .f4{fill:var(--cmp)} .f5{fill:var(--warn)} .f6{fill:var(--hot)}
.curve{fill:none;stroke-width:2.6}
.area-ok{fill:var(--ok-soft);opacity:.8} .area-cmp{fill:var(--cmp-soft);opacity:.8} .area-hot{fill:var(--hot-soft)} .area-acc{fill:var(--accent-soft)}
.box{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.6}

/* practice + checklist */
.practice{display:grid;grid-template-columns:1fr;gap:14px;margin:18px 0 26px}
@media (min-width:760px){.practice{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lvl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}

.lvl details{border-top:1px solid var(--line);padding:7px 0;font-size:15.5px}

ul.check{list-style:none;padding:0;margin:14px 0 10px;display:grid;gap:6px}

ul.check label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.ch-nav{max-width:720px;margin:64px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}

.bitrow{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 12px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
.tool{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px}
.tool label{overflow-wrap:anywhere;display:block;font:600 13px var(--f-display);color:var(--ink-2);margin:10px 0 5px}
.tool label:first-child{margin-top:0}

<script>
'use strict';
/* ================= core helpers ================= */
const CH = [], FIG = {};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const f1 = n => Math.round(n * 10) / 10;
const tx = (x, y, t, c = 't', a = 'middle') => `<text x="${f1(x)}" y="${f1(y)}" class="${c}" text-anchor="${a}" dominant-baseline="central">${esc(t)}</text>`;
const svgw = (w, h, inner, label) => `<svg class="dg" viewBox="0 0 ${f1(w)} ${f1(h)}" width="${f1(w)}" height="${f1(h)}" role="img" aria-label="${esc(label || 'Diagram')}">${inner}</svg>`;
const grp = (x, y, s) => `<g transform="translate(${f1(x)},${f1(y)})">${s}</g>`;
const mk = c => ({ hot: 'ar-hot', ok: 'ar-ok', acc: 'ar-acc', cmp: 'ar-cmp', warn: 'ar-warn' }[String(c).split(' ')[0]] || 'ar');
function shorten(a, b, ra, rb) { const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1; return { x1: a.x + dx / L * ra, y1: a.y + dy / L * ra, x2: b.x - dx / L * rb, y2: b.y - dy / L * rb }; }
const ln = (L, c = '', m) => `<line x1="${f1(L.x1)}" y1="${f1(L.y1)}" x2="${f1(L.x2)}" y2="${f1(L.y2)}" class="ed ${c}"${m ? ` marker-end="url(#${mk(c)})"` : ''}/>`;
const arrow = (x1, y1, x2, y2, c = '') => ln({ x1, y1, x2, y2 }, c, true);
function lbl(x, y, t, c = '') { const w = String(t).length * 7.4 + 10; return `<rect x="${f1(x - w / 2)}" y="${f1(y - 9)}" width="${f1(w)}" height="18" rx="4" class="lbg ${c}"/>` + tx(x, y, t, 'w ' + c); }
const rect = (x, y, w, h, c = 'cell', r = 5) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${r}" class="${c}"/>`;
const code = (title, lang = 'rust') => (s, ...v) => `<div class="code">${title ? `<div class="code-h">${esc(title)}</div>` : ''}<pre><code class="language-${lang}">${esc(String.raw({ raw: s.raw }, ...v).replace(/\\`/g, '`').replace(/\\\$\{/g, '${').replace(/^\n+|\s+$/g, ''))}</code></pre></div>`;
const fig = (name, cap) => `<figure class="fig" data-fig="${name}" data-cap="${esc(cap || '')}"></figure>`;

/* ================= primitives ================= */
function arrayRow(vals, o = {}) {
  const c = o.cell || 46, gap = o.gap || 0, st = o.st || {}, x0 = o.x || 0, y0 = o.y || 0;
  const groups = {};
  (o.ptr || []).forEach(p => { if (p.i == null || p.i < 0 || p.i > vals.length) return; (groups[p.i] = groups[p.i] || []).push(p); });
  const depth = Math.max(0, ...Object.values(groups).map(g => g.length));
  const top = y0 + (depth ? depth * 17 + 12 : 0);
  let s = '';
  if (o.range) { const [l, r] = o.range; if (l <= r) s += rect(x0 + l * (c + gap) - 3, top - 3, (r - l + 1) * (c + gap) - gap + 6, c + 6, 'area-' + (o.rangeCls || 'acc'), 7); }
  vals.forEach((v, i) => {
    const x = x0 + i * (c + gap), k = st[i] || '';
    s += rect(x + 1, top + 1, c - 2, c - 2, 'cell ' + k);
    s += tx(x + c / 2, top + c / 2, v == null ? '' : v, 'tv ' + (o.small ? 'sm ' : '') + k);
    if (o.idx !== false) s += tx(x + c / 2, top + c + 13, o.idxLabels ? o.idxLabels[i] : i, 'ti');
  });
  for (const i in groups) {
    const x = x0 + (+i) * (c + gap) + c / 2, g = groups[i];
    g.forEach((p, k) => { s += tx(x, top - 12 - (g.length - 1 - k) * 17, p.label, 'tp ' + (p.cls || 'acc')); });
    s += `<path d="M${f1(x - 5)} ${top - 5} L${f1(x + 5)} ${top - 5} L${f1(x)} ${top + 1} Z" class="tri ${g[g.length - 1].cls || 'acc'}"/>`;
  }
  const pmax = Math.max(vals.length, ...Object.keys(groups).map(k => +k + 1));
  return { s, w: x0 + pmax * (c + gap) - gap, h: top + c + (o.idx !== false ? 24 : 4) };
}

function chips(x, y, label, vals, o = {}) {
  let s = label ? tx(x, y + 14, label, 'tm', 'start') : '';
  let cx = x + (label ? (o.lw || 74) : 0);
  const st = o.st || {};
  vals.forEach((v, i) => {
    const w = Math.max(30, String(v).length * 8.2 + 14), k = st[i] || o.cls || '';
    s += rect(cx, y, w, 28, 'cell ' + k) + tx(cx + w / 2, y + 14, v, 'tv sm ' + k); cx += w + 6;
  });
  if (!vals.length) s += tx(cx, y + 14, o.empty || 'empty', 'tm', 'start');
  return s;
}

function btree(nodes, root, o = {}) {
  const dx = o.dx || 46, dy = o.dy || 62, r = o.r || 18, px = o.px ?? 20, py = o.py ?? 20, st = o.st || {}, es = o.es || {}, sub = o.sub || {};
  const pos = {}; let k = 0, md = 0;
  (function w(id, d) { if (id == null || nodes[id] == null) return; w(nodes[id].l, d + 1); pos[id] = { x: px + r + k * dx, y: py + r + d * dy }; k++; md = Math.max(md, d); w(nodes[id].r, d + 1); })(root, 0);
  let s = '';
  for (const id in pos) { const n = nodes[id]; [n.l, n.r].forEach(c => { if (c != null && pos[c]) s += ln(shorten(pos[id], pos[c], r, r), es[id + '-' + c] || ''); }); }
  for (const id in pos) {
    const p = pos[id], c = st[id] || '';
    s += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}" class="nd ${c}"/>` + tx(p.x, p.y, nodes[id].v, 'tn ' + (String(nodes[id].v).length > 2 ? 'sm ' : '') + c);
    if (sub[id] != null) s += tx(p.x, p.y + r + 11, sub[id], 'tsub');
  }
  return { s, w: px * 2 + 2 * r + Math.max(0, k - 1) * dx, h: py * 2 + 2 * r + md * dy + (Object.keys(sub).length ? 16 : 0), pos };
}
function heapNodes(a) { const N = {}; a.forEach((v, i) => { N[i] = { v, l: 2 * i + 1 < a.length ? 2 * i + 1 : null, r: 2 * i + 2 < a.length ? 2 * i + 2 : null }; }); return N; }
/* level-order heap layout: keeps positions stable as the heap changes */
function heapTree(a, o = {}) {
  const n = a.length, r = o.r || 19, dy = o.dy || 58, W = o.W || 520, st = o.st || {}, es = o.es || {};
  const P = i => { const d = Math.floor(Math.log2(i + 1)), first = 2 ** d - 1, cnt = 2 ** d; return { x: (i - first + 0.5) * W / cnt, y: r + 8 + d * dy }; };
  let s = '', md = 0;
  for (let i = 1; i < n; i++) { const p = (i - 1) >> 1; s += ln(shorten(P(p), P(i), r, r), es[p + '-' + i] || ''); }
  for (let i = 0; i < n; i++) {
    const p = P(i), c = st[i] || ''; md = Math.max(md, p.y);
    s += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}" class="nd ${c}"/>` + tx(p.x, p.y, a[i], 'tn ' + c);
    if (o.idx) s += tx(p.x + r + 6, p.y - r + 2, i, 'ti', 'start');
  }
  return { s, w: W, h: md + r + 10 };
}

function gtree(root, o = {}) {
  const dx = o.dx || 64, dy = o.dy || 64, nw = o.nw || 54, nh = o.nh || 28, px = o.px ?? 8, py = o.py ?? 8;
  let leaf = 0, md = 0; const all = [];
  (function lay(n, d) { n._d = d; md = Math.max(md, d); all.push(n); if (n.kids && n.kids.length) { n.kids.forEach(c => lay(c, d + 1)); n._x = (n.kids[0]._x + n.kids[n.kids.length - 1]._x) / 2; } else n._x = leaf++; })(root, 0);
  const W = n => n.w || nw;
  const X = n => px + nw / 2 + n._x * dx, Y = n => py + nh / 2 + n._d * dy;
  let s = '', el = '';
  all.forEach(n => (n.kids || []).forEach(c => {
    s += `<line x1="${f1(X(n))}" y1="${f1(Y(n) + nh / 2)}" x2="${f1(X(c))}" y2="${f1(Y(c) - nh / 2)}" class="ed ${c.ec || ''}"/>`;
    if (c.el != null) el += lbl((X(n) + X(c)) / 2, (Y(n) + nh / 2 + Y(c) - nh / 2) / 2, c.el, c.ec || '');
  }));
  s += el;
  all.forEach(n => {
    const w = W(n);
    s += rect(X(n) - w / 2, Y(n) - nh / 2, w, nh, 'nd ' + (n.cls || ''), o.round ? nh / 2 : 6) + tx(X(n), Y(n), n.label, 'tn ' + (o.small ? 'sm ' : '') + (n.cls || ''));
    if (n.sub != null) s += tx(X(n), Y(n) + nh / 2 + 11, n.sub, 'tsub');
  });
  return { s, w: px * 2 + nw + Math.max(0, leaf - 1) * dx, h: py * 2 + nh + md * dy + 16, X, Y, all };
}

function graph(N, E, o = {}) {
  const r = o.r || 19, ns = o.ns || {}, es = o.es || {}, sub = o.sub || {}, dir = !!o.dir;
  let s = '', labels = '';
  E.forEach(([a, b, w, bend]) => {
    const A = N[a], B = N[b], k = es[a + '-' + b] || (!dir && es[b + '-' + a]) || '';
    if (bend) {
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy);
      const C = { x: mx - dy / L * bend, y: my + dx / L * bend }, s1 = shorten(A, C, r, 0), s2 = shorten(C, B, 0, r + (dir ? 2 : 0));
      s += `<path d="M${f1(s1.x1)} ${f1(s1.y1)} Q${f1(C.x)} ${f1(C.y)} ${f1(s2.x2)} ${f1(s2.y2)}" class="ed ${k}"${dir ? ` marker-end="url(#${mk(k)})"` : ''}/>`;
      if (w != null) labels += lbl((A.x + 2 * C.x + B.x) / 4, (A.y + 2 * C.y + B.y) / 4, w, k);
    } else {
      s += ln(shorten(A, B, r, r + (dir ? 2 : 0)), k, dir);
      if (w != null) labels += lbl((A.x + B.x) / 2, (A.y + B.y) / 2, w, k);
    }
  });
  s += labels;
  for (const id in N) {
    const n = N[id], k = ns[id] || '';
    const lab = n.l ?? id;
    if (n.box) { const bw = Math.max(2 * r, String(lab).length * 8 + 18), bh = 2 * r - 4; s += rect(n.x - bw / 2, n.y - bh / 2, bw, bh, 'nd ' + k, 6); }
    else s += `<circle cx="${n.x}" cy="${n.y}" r="${r}" class="nd ${k}"/>`;
    s += tx(n.x, n.y, lab, 'tn ' + (String(lab).length > 2 ? 'sm ' : '') + k);
    if (sub[id] != null && sub[id] !== '') s += lbl(n.x + (n.sx || 0), n.y + (n.sy ?? -1) * (r + 13), sub[id], (o.subCls || {})[id] || '');
  }
  return { s, w: o.w, h: o.h };
}

function llist(o) {
  const bw = o.bw || 66, bh = 38, gap = o.gap || 46, px = 16, val = o.val || {}, st = o.st || {}, drop = o.drop || {};
  const ptr = o.ptr || {};
  const depth = Math.max(0, ...Object.values(ptr).map(a => a.length));
  const top = 10 + (depth ? depth * 17 + 12 : 0);
  const idx = {}; o.slots.forEach((id, i) => idx[id] = i);
  const X = i => px + i * (bw + gap), Y = id => top + (drop[id] || 0);
  const isNull = id => String(id).startsWith('null');
  let s = '', below = 0;
  for (const id in (o.next || {})) {
    const t = o.next[id]; if (t == null || idx[t] == null || idx[id] == null) continue;
    const i = idx[id], j = idx[t], k = (o.es || {})[id] || '';
    const sx = X(i) + bw - 11, sy = Y(id) + bh / 2;
    if (j > i) { const ex = isNull(t) ? X(j) + bw / 2 - 28 : X(j) - 1; s += `<path d="M${sx} ${sy} L${ex} ${Y(t) + bh / 2}" class="ed ${k}" marker-end="url(#${mk(k)})"/>`; }
    else { const ex = X(j) + bw / 2, ey = Y(t) + (isNull(t) ? bh / 2 + 14 : bh) + 3, dep = 22 + (i - j) * 8; below = Math.max(below, dep + 10); s += `<path d="M${sx} ${sy} C ${sx + 6} ${sy + dep + 22}, ${ex} ${ey + dep}, ${ex} ${ey}" class="ed ${k}" marker-end="url(#${mk(k)})"/>`; }
  }
  o.slots.forEach((id, i) => {
    const x = X(i), y = Y(id), k = st[id] || '';
    if (isNull(id)) { s += rect(x + bw / 2 - 26, y + bh / 2 - 14, 52, 28, 'cell dash ' + k) + tx(x + bw / 2, y + bh / 2, 'null', 'tm'); }
    else {
      s += rect(x, y, bw, bh, 'cell ' + k) + `<line x1="${x + bw - 22}" y1="${y}" x2="${x + bw - 22}" y2="${y + bh}" class="ed"/>`;
      s += tx(x + (bw - 22) / 2, y + bh / 2, val[id] ?? id, 'tv ' + k) + `<circle cx="${x + bw - 11}" cy="${y + bh / 2}" r="3.4" class="f1"/>`;
    }
    const pl = ptr[id]; if (pl) { pl.forEach((p, q) => { s += tx(x + bw / 2 - 11, top - 12 - (pl.length - 1 - q) * 17 + (drop[id] || 0), p.label, 'tp ' + (p.cls || 'acc')); }); }
  });
  const md = Math.max(0, ...Object.values(drop));
  return { s, w: X(o.slots.length - 1) + bw + px, h: top + bh + md + below + 14 };
}

function stackV(vals, o = {}) {
  const cap = Math.max(o.cap || 4, vals.length), bw = o.bw || 96, bh = 32, px = o.px ?? 14, py = o.title ? 30 : 12, st = o.st || {};
  let s = o.title ? tx(px + bw / 2, 12, o.title, 'th') : '';
  const bot = py + cap * bh + 6;
  s += `<path d="M${px - 5} ${py} V${bot} H${px + bw + 5} V${py}" class="well"/>`;
  vals.forEach((v, i) => { const y = py + (cap - 1 - i) * bh + 3, k = st[i] || ''; s += rect(px, y, bw, bh - 4, 'cell ' + k) + tx(px + bw / 2, y + (bh - 4) / 2, v, 'tv sm ' + k); });
  if (vals.length && o.top !== false) { const y = py + (cap - vals.length) * bh + 3 + (bh - 4) / 2; s += arrow(px + bw + 44, y, px + bw + 10, y, 'acc') + tx(px + bw + 48, y, 'top', 'tp acc', 'start'); }
  if (!vals.length) s += tx(px + bw / 2, bot - 20, 'empty', 'tm');
  return { s, w: px + bw + (o.top !== false ? 84 : 16), h: bot + 8 };
}

function ring(slots, o = {}) {
  const n = slots.length, R = o.R || 92, cx = R + 74, cy = R + 54, bw = 44, st = o.st || {};
  let s = `<circle cx="${cx}" cy="${cy}" r="${R}" class="ringc"/>`;
  slots.forEach((v, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n, cs = Math.cos(a), sn = Math.sin(a), x = cx + R * cs, y = cy + R * sn, k = st[i] || '';
    s += rect(x - bw / 2, y - bw / 2, bw, bw, 'cell ' + k, 7) + tx(x, y, v ?? '', 'tv ' + k) + tx(cx + (R - 40) * cs, cy + (R - 40) * sn, i, 'ti');
    const labs = []; if (o.head === i) labs.push(['head', 'acc']); if (o.tail === i) labs.push(['tail', 'hot']);
    labs.forEach((L, q) => { const rr = R + 42 + q * 18; s += tx(cx + rr * cs, cy + rr * sn, L[0], 'tp ' + L[1]); });
  });
  return { s, w: 2 * cx, h: 2 * cy };
}

function bars(vals, o = {}) {
  const bw = o.bw || 34, gap = o.gap || 8, H = o.H || 150, max = o.max || Math.max(...vals, 1), st = o.st || {}, px = 8, py = 22;
  let s = '';
  if (o.range && o.range[0] <= o.range[1]) { const [l, r] = o.range; s += rect(px + l * (bw + gap) - 4, py - 16, (r - l + 1) * (bw + gap) - gap + 8, H + 20, 'area-' + (o.rangeCls || 'acc'), 6); }
  vals.forEach((v, i) => { const h = Math.max(3, v / max * H), x = px + i * (bw + gap), y = py + H - h, k = st[i] || ''; s += rect(x, y, bw, h, 'bar ' + k, 3) + tx(x + bw / 2, y - 9, v, 'tv sm') + tx(x + bw / 2, py + H + 13, i, 'ti'); });
  let rows = 0;
  (o.marks || []).forEach(m => { if (m.i == null) return; rows = Math.max(rows, (m.row || 0) + 1); const x = px + m.i * (bw + gap) + bw / 2; s += tx(x, py + H + 31 + (m.row || 0) * 16, m.label, 'tp ' + (m.cls || 'acc')); });
  return { s, w: px * 2 + vals.length * (bw + gap) - gap, h: py + H + 24 + rows * 16 + 6 };
}

function grid(cells, o = {}) {
  const cw = o.cw || 40, chh = o.chh || 34, rows = cells.length, cols = cells[0].length, st = o.st || {};

p_or_default();\n        println!(\"{}{extra}\", label(named));\n    }\n\n    let amounts = [i64::MAX - 1, 1];\n    println!(\"total {:?}; one more unit {:?}\", amounts.into_iter().checked_total(), amounts.into_iter().chain([1]).checked_total());\n    println!(\"assets are {}-normal, liabilities {}-normal\", normal_balance::<ledger::Asset>(), normal_balance::<ledger::Liability>());\n}\n"}, "cmd": "cargo run -q", "out": "grocer 4500: []\ncasino-x 250000: [\"250000 over limit 100000\", \"merchant casino-x is blocked\"]\n<limit(100000)> (a Limit, max 100000)\n<blocklist>\ntotal Some(9223372036854775807); one more unit None\nassets are debit-normal, liabilities credit-normal", "fail": false}, "c08-generics": {"files": {"src/main.rs": "use std::any::type_name;\nuse std::collections::HashMap;\nuse std::hash::Hash;\n\n// Generic over the item type and over any key type that can be hashed and compared for equality.\nfn count_by<T, K, F>(items: &[T], key: F) -> HashMap<K, usize>\nwhere\n    K: Eq + Hash,\n    F: Fn(&T) -> K,\n{\n    let mut m = HashMap::new();\n    for it in items {\n        *m.entry(key(it)).or_insert(0) += 1;\n    }\n    m\n}\n\n// Const generics: the array length is part of the type.\nfn checksum<const N: usize>(bytes: [u8; N]) -> u8 {\n    bytes.iter().fold(0u8, |acc, b| acc.wrapping_add(*b))\n}\n\n// impl Trait in argument and return position.\nfn evens(limit: u32) -> impl Iterator<Item = u32> {\n    (0..limit).filter(|n| n % 2 == 0)\n}\nfn show_all(items: impl IntoIterator<Item = impl std::fmt::Display>) -> String {\n    items.into_iter().map(|i| i.to_string()).collect::<Vec<_>>().join(\",\")\n}\n\n// Monomorphisation made visible: each call gets its own copy.\nfn which<T>(_: T) -> &'static str { type_name::<T>() }\n\n// Associated types: an iterator decides its Item, the caller does not.\nstruct Countdown(u32);\nimpl Iterator for Countdown {\n    type Item = u32;\n    fn next(&mut self) -> Option<u32> {\n        if self.0 == 0 { None } else { self.0 -= 1; Some(self.0 + 1) }\n    }\n}\n\nfn main() {\n    let txns = [\"UPI\", \"CARD\", \"UPI\", \"NEFT\", \"UPI\", \"CARD\"];\n    let mut counts: Vec<_> = count_by(&txns, |t| *t).into_iter().collect();\n    counts.sort();\n    println!(\"{counts:?}\");\n    let by_len = count_by(&txns, |t| t.len());\n    println!(\"by length: {:?}\", { let mut v: Vec<_> = by_len.into_iter().collect(); v.sort(); v });\n\n    println!(\"checksum of 4 bytes {}, of 8 bytes {}\", checksum([1, 2, 3, 200]), checksum([9; 8]));\n    println!(\"evens {}\", show_all(evens(10)));\n    println!(\"{} | {} | {}\", which(1u8), which(\"x\"), which(vec![1.0f64]));\n    println!(\"countdown {}\", show_all(Countdown(3)));\n}\n"}, "cmd": "cargo run -q", "out": "[(\"CARD\", 2), (\"NEFT\", 1), (\"UPI\", 3)]\nby length: [(3, 3), (4, 3)]\nchecksum of 4 bytes 206, of 8 bytes 72\nevens 0,2,4,6,8\nu8 | &str | alloc::vec::Vec<f64>\ncountdown 3,2,1", "fail": false}, "c08-traits": {"files": {"src/main.rs": "use std::fmt;\nuse std::ops::Add;\n\n/// Money in minor units, tagged with a currency.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]\nstruct Money { minor: i64, ccy: Ccy }\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]\nenum Ccy { Inr, Usd }\n\nimpl fmt::Display for Ccy {\n    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n        f.write_str(match self { Ccy::Inr => \"INR\", Ccy::Usd => \"USD\" })\n    }\n}\n\nimpl fmt::Display for Money {\n    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {\n        // Format the sign separately: -50 / 100 is 0, so \"minor / 100\" alone would print -0.50 as 0.50.\n        let sign = if self.minor < 0 { \"-\" } else { \"\" };\n        let abs = self.minor.unsigned_abs();\n        write!(f, \"{} {sign}{}.{:02}\", self.ccy, abs / 100, abs % 100)\n    }\n}\n\n// Operator overloading is just a trait implementation.\nimpl Add for Money {\n    type Output = Option<Money>;           // different currencies, or overflow: no answer\n    fn add(self, rhs: Money) -> Option<Money> {\n        if self.ccy != rhs.ccy {\n            return None;\n        }\n        self.minor.checked_add(rhs.minor).map(|minor| Money { minor, ccy: self.ccy })\n    }\n}\n\n/// A trait with a required method, a default method and an associated constant.\ntrait FeePolicy {\n    const NAME: &'static str;\n    fn fee(&self, amount: Money) -> Money;\n    fn describe(&self, amount: Money) -> String {\n        format!(\"{} charges {} on {}\", Self::NAME, self.fee(amount), amount)\n    }\n}\n\nstruct Flat(i64);\nstruct Percent { bps: i64, min: i64 }\n\nimpl FeePolicy for Flat {\n    const NAME: &'static str = \"flat\";\n    fn fee(&self, a: Money) -> Money { Money { minor: self.0, ccy: a.ccy } }\n}\nimpl FeePolicy for Percent {\n    const NAME: &'static str = \"percent\";\n    fn fee(&self, a: Money) -> Money { Money { minor: (a.minor * self.bps / 10_000).max(self.min), ccy: a.ccy } }\n}\n\n// Static dispatch: one copy of this function is generated per policy type.\nfn total_static<P: FeePolicy>(p: &P, amounts: &[Money]) -> i64 {\n    amounts.iter().map(|a| p.fee(*a).minor).sum()\n}\n\n// Dynamic dispatch needs a dyn-compatible trait (no associated consts, no generic methods).\ntrait Fee { fn fee_minor(&self, amount: i64) -> i64; }\nimpl<T: FeePolicy> Fee for T {                     // blanket implementation\n    fn fee_minor(&self, amount: i64) -> i64 { self.fee(Money { minor: amount, ccy: Ccy::Inr }).minor }\n}\n\nfn main() {\n    let a = Money { minor: 250_000, ccy: Ccy::Inr };\n    let b = Money { minor: 1_999, ccy: Ccy::Inr };\n    let c = Money { minor: 500, ccy: Ccy::Usd };\n    println!(\"{a} + {b} = {:?}\", (a + b).map(|m| m.to_string()));\n    println!(\"{a} + {c} = {:?}\", a + c);\n    println!(\"refund {}\", Money { minor: -50, ccy: Ccy::Inr });\n\n    println!(\"{}\", Flat(1_000).describe(a));\n    println!(\"{}\", Percent { bps: 25, min: 500 }.describe(b));\n    println!(\"static total: {}\", total_static(&Percent { bps: 25, min: 500 }, &[a, b]));\n\n    // A heterogeneous list: each Box<dyn Fee> carries a vtable pointer.\n    let plans: Vec<(&str, Box<dyn Fee>)> = vec![(\"basic\", Box::new(Flat(1_500))), (\"pro\", Box::new(Percent { bps: 10, min: 0 }))];\n    for (name, p) in &plans {\n        println!(\"{name}: fee on 2500.00 = {}\", p.fee_minor(250_000));\n    }\n\n    // Derived traits at work: sorting by (minor, ccy) because of derive(Ord).\n    let mut v = [a, c, b];\n    v.sort();\n    println!(\"{}\", v.iter().map(|m| m.to_string()).collect::<Vec<_>>().join(\" < \"));\n}\n"}, "cmd": "cargo run -q", "out": "INR 2500.00 + INR 19.99 = Some(\"INR 2519.99\")\nINR 2500.00 + USD 5.00 = None\nrefund INR -0.50\nflat charges INR 10.00 on INR 2500.00\npercent charges INR 5.00 on INR 19.99\nstatic total: 1125\nbasic: fee on 2500.00 = 1500\npro: fee on 2500.00 = 250\nUSD 5.00 < INR 19.99 < INR 2500.00", "fail": false}, "c09-bench": {"files": {"src/main.rs": "use std::hint::black_box;\nuse std::time::Instant;\n\nfn loop_sum(v: &[u32]) -> u64 {\n    let mut total = 0u64;\n    let mut i = 0;\n    while i < v.len() {\n        if v[i].is_multiple_of(3) {\n            total += u64::from(v[i]) * 2;\n        }\n        i += 1;\n    }\n    total\n}\n\nfn iter_sum(v: &[u32]) -> u64 {\n    v.iter().filter(|&&x| x.is_multiple_of(3)).map(|&x| u64::from(x) * 2).sum()\n}\n\nfn time(name: &str, f: impl Fn() -> u64) {\n    let _ = f(); // warm up\n    let start = Instant::now();\n    let mut r = 0;\n    for _ in 0..50 {\n        r = black_box(f());\n    }\n    println!(\"{name:<16} {:>8.2} ms per pass   (result {r})\", start.elapsed().as_secs_f64() * 1000.0 / 50.0);\n}\n\nfn main() {\n    let v: Vec<u32> = (0..10_000_000).collect();\n    time(\"index loop\", || loop_sum(black_box(&v)));\n    time(\"iterator chain\", || iter_sum(black_box(&v)));\n}\n"}, "cmd": "cargo run -q --release", "out": "index loop           6.35 ms per pass   (result 33333336666666)\niterator chain       6.44 ms per pass   (result 33333336666666)", "fail": false}, "c09-closures": {"files": {"src/main.rs": "use std::collections::BTreeMap;\n\n// A closure factory: the returned closure owns its copy of `bps`.\nfn fee_at(bps: i64) -> impl Fn(i64) -> i64 {\n    move |amount| amount * bps / 10_000\n}\n\nstruct Account { id: String, balance: i64, history: Vec<i64> }\nstruct Entry { day: u32, amount: i64 }\n\nfn main() {\n    // Every closure has its own type; Box<dyn Fn> gives a table of them one type.\n    let surcharge = 50;\n    let mut fees: BTreeMap<&str, Box<dyn Fn(i64) -> i64>> = BTreeMap::new();\n    fees.insert(\"card\", Box::new(fee_at(180)));\n    fees.insert(\"upi\", Box::new(|_| 0));\n    let intl = fee_at(350);\n    fees.insert(\"intl\", Box::new(move |a| intl(a) + surcharge));\n    let quoted: Vec<String> = fees.iter().map(|(k, f)| format!(\"{k}={}\", f(100_000))).collect();\n    println!(\"fees on 1000.00: {}\", quoted.join(\" \"));\n\n    // Disjoint capture (Edition 2021+): the closure borrows only the fields it uses.\n    let mut acct = Account { id: \"ACC-7\".into(), balance: 0, history: vec![] };\n    let mut post = |amt: i64| {\n        acct.balance += amt;\n        acct.history.push(amt);\n    };\n    post(500);\n    println!(\"posting to {}\", acct.id); // fine: `post` holds &mut balance and &mut history, not id\n    post(-200);\n    println!(\"{} balance {} history {:?}\", acct.id, acct.balance, acct.history);\n\n    // take_while consumes the first item that fails the test, and it is gone.\n    let mut it = [100, 200, -50, 300].into_iter();\n    let credits: Vec<i64> = it.by_ref().take_while(|&a| a > 0).collect();\n    println!(\"take_while: credits {credits:?}, rest {:?}\", it.collect::<Vec<_>>());\n    // next_if (on a Peekable) only takes the item if it matches.\n    let mut it = [100, 200, -50, 300].into_iter().peekable();\n    let mut credits = vec![];\n    while let Some(a) = it.next_if(|&a| a > 0) {\n        credits.push(a);\n    }\n    println!(\"next_if:    credits {credits:?}, rest {:?}\", it.collect::<Vec<_>>());\n\n    // chunk_by groups consecutive runs: a daily net from a sorted statement.\n    let stmt = [\n        Entry { day: 1, amount: 500 }, Entry { day: 1, amount: -120 },\n        Entry { day: 2, amount: 900 },\n        Entry { day: 3, amount: -40 }, Entry { day: 3, amount: 60 },\n    ];\n    for day in stmt.chunk_by(|a, b| a.day == b.day) {\n        print!(\"day {} net {}; \", day[0].day, day.iter().map(|e| e.amount).sum::<i64>());\n    }\n    println!();\n\n    // sum() on i64 panics on overflow in debug builds and wraps in release; try_fold makes it explicit.\n    let big = [i64::MAX, 1];\n    println!(\"checked total {:?}\", big.iter().try_fold(0i64, |acc, &x| acc.checked_add(x)));\n}\n"}, "cmd": "cargo run -q", "out": "fees on 1000.00: card=1800 intl=3550 upi=0\nposting to ACC-7\nACC-7 balance 300 history [500, -200]\ntake_while: credits [100, 200], rest [300]\nnext_if:    credits [100, 200], rest [-50, 300]\nday 1 net 380; day 2 net 900; day 3 net 20; \nchecked total None", "fail": false}, "c09-iter": {"files": {"src/main.rs": "use std::collections::BTreeMap;\n\n#[derive(Debug, Clone)]\nstruct Txn { merchant: &'static str, amount: i64, ok: bool }\n\nfn main() {\n    let txns = [\n        Txn { merchant: \"grocer\", amount: 1_250, ok: true },\n        Txn { merchant: \"fuel\", amount: 3_000, ok: false },\n        Txn { merchant: \"grocer\", amount: 800, ok: true },\n        Txn { merchant: \"cinema\", amount: 600, ok: true },\n        Txn { merchant: \"fuel\", amount: 2_200, ok: true },\n    ];\n\n    // A lazy pipeline: nothing runs until sum() pulls values through it.\n    let approved: i64 = txns.iter().filter(|t| t.ok).map(|t| t.amount).sum();\n    println!(\"approved total {approved}\");\n\n    // Group and aggregate; BTreeMap keeps keys sorted for stable output.\n    let mut by_merchant: BTreeMap<&str, (usize, i64)> = BTreeMap::new();\n    for t in txns.iter().filter(|t| t.ok) {\n        le n {r:?}\"),\n    }\n\n    // 4. Bounded concurrency: at most 2 calls at a time, via a semaphore and a JoinSet.\n    let t = Instant::now();\n    let limit = Arc::new(Semaphore::new(2));\n    let mut set = JoinSet::new();\n    for id in [7, 8, 9, 10] {\n        let permit = Arc::clone(&limit).acquire_owned().await.unwrap();\n        set.spawn(async move { let r = call_bank(id, 100).await; drop(permit); r });\n    }\n    let mut done: Vec<u32> = set.join_all().await.into_iter().flatten().collect();\n    done.sort();\n    println!(\"limited   {done:?} after ~{} ms (4 calls, 2 at a time)\", ms(t));\n\n    // 5. Backpressure: a bounded channel makes a fast producer wait for a slow consumer.\n    let t = Instant::now();\n    let (tx, mut rx) = mpsc::channel::<u64>(2);\n    let consumer = tokio::spawn(async move {\n        let mut sum = 0;\n        while let Some(v) = rx.recv().await { sleep(Duration::from_millis(50)).await; sum += v; }\n        sum\n    });\n    for v in 1..=4 { tx.send(v).await.unwrap(); }\n    println!(\"channel   producer finished sending after ~{} ms (it waited for space)\", ms(t));\n    drop(tx);\n    println!(\"channel   consumer sum {}\", consumer.await.unwrap());\n\n    // 6. Cooperative cancellation of a background task.\n    let token = CancellationToken::new();\n    let child = token.child_token();\n    let ticker = tokio::spawn(async move {\n        let mut ticks = 0;\n        let mut iv = tokio::time::interval(Duration::from_millis(40));\n        loop {\n            tokio::select! {\n                _ = child.cancelled() => break ticks,\n                _ = iv.tick() => ticks += 1,\n            }\n        }\n    });\n    sleep(Duration::from_millis(100)).await;\n    token.cancel();\n    println!(\"cancel    ticker stopped cleanly after {} ticks\", ticker.await.unwrap());\n\n    // 7. CPU-bound work goes to the blocking pool, not the async workers.\n    let digest = tokio::task::spawn_blocking(|| (1..=5_000_000u64).fold(0u64, |h, x| h.rotate_left(5) ^ x)).await.unwrap();\n    println!(\"blocking  computed {digest:x} off the async workers\");\n}\n", "Cargo.toml": "[package]\nname = \"c16-tokio\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[dependencies]\ntokio = { version = \"1\", features = [\"full\"] }\ntokio-util = \"0.7\"\n"}, "cmd": "cargo run -q", "out": "join!     Ok(1) Ok(2) Err(\"bank 3 declined\") after ~150 ms (not 300)\ntimeout   gave up after 50 ms; the call was cancelled by dropping it\nselect!   hedge won Ok(6)\nlimited   [7, 8, 9, 10] after ~200 ms (4 calls, 2 at a time)\nchannel   producer finished sending after ~50 ms (it waited for space)\nchannel   consumer sum 10\ncancel    ticker stopped cleanly after 3 ticks\nblocking  computed 6a5bc71195e873ae off the async workers", "fail": false}, "c17-unsafe": {"files": {"src/main.rs": "use std::mem::MaybeUninit;\n\n/// Our own split_at_mut: a safe API with unsafe inside.\nfn split_at_mut<T>(s: &mut [T], mid: usize) -> (&mut [T], &mut [T]) {\n    let len = s.len();\n    assert!(mid <= len, \"mid out of bounds\");\n    let p = s.as_mut_ptr();\n    // SAFETY: mid <= len, so [0, mid) and [mid, len) are in bounds and disjoint.\n    // Both slices borrow from `s`, so nothing else can touch the memory while they live.\n    unsafe { (std::slice::from_raw_parts_mut(p, mid), std::slice::from_raw_parts_mut(p.add(mid), len - mid)) }\n}\n\n/// A fixed-capacity stack that never allocates.\n/// Invariant: buf[..len] are initialised, buf[len..] are not.\npub struct StackVec<T, const N: usize> {\n    buf: [MaybeUninit<T>; N],\n    len: usize,\n}\n\nimpl<T, const N: usize> Default for StackVec<T, N> {\n    fn default() -> Self { Self { buf: [const { MaybeUninit::uninit() }; N], len: 0 } }\n}\n\nimpl<T, const N: usize> StackVec<T, N> {\n    pub fn push(&mut self, v: T) -> Result<(), T> {\n        if self.len == N {\n            return Err(v);\n        }\n        self.buf[self.len].write(v);\n        self.len += 1;\n        Ok(())\n    }\n    pub fn pop(&mut self) -> Option<T> {\n        if self.len == 0 {\n            return None;\n        }\n        self.len -= 1;\n        // SAFETY: slot `len` was initialised (invariant) and is now outside buf[..len],\n        // so it will not be read or dropped again.\n        Some(unsafe { self.buf[self.len].assume_init_read() })\n    }\n    pub fn as_slice(&self) -> &[T] {\n        // SAFETY: the first `len` elements are initialised, and MaybeUninit<T> has T's layout.\n        unsafe { std::slice::from_raw_parts(self.buf.as_ptr().cast::<T>(), self.len) }\n    }\n}\n\nimpl<T, const N: usize> Drop for StackVec<T, N> {\n    fn drop(&mut self) {\n        for slot in &mut self.buf[..self.len] {\n            // SAFETY: exactly the initialised elements are dropped, once.\n            unsafe { slot.assume_init_drop() }\n        }\n    }\n}\n\nstruct Noisy(&'static str);\nimpl Drop for Noisy {\n    fn drop(&mut self) { println!(\"  drop {}\", self.0); }\n}\n\n/// Reads an element without a bounds check.\n///\n/// # Safety\n/// `idx` must be less than `v.len()`.\nunsafe fn read_unchecked(v: &[u64], idx: usize) -> u64 {\n    // Edition 2024 warns (unsafe_op_in_unsafe_fn) about unsafe operations in an unsafe fn\n    // that are not inside an unsafe block, so each one is marked and justified.\n    // SAFETY: the caller guarantees idx < v.len().\n    unsafe { *v.get_unchecked(idx) }\n}\n\nfn main() {\n    let mut data = [1, 2, 3, 4, 5, 6];\n    let (l, r) = split_at_mut(&mut data, 2);\n    l[0] = 100;\n    r[0] = 300;\n    println!(\"split_at_mut: {data:?}\");\n\n    let mut st: StackVec<Noisy, 3> = StackVec::default();\n    for name in [\"a\", \"b\", \"c\", \"d\"] {\n        if let Err(rejected) = st.push(Noisy(name)) {\n            println!(\"  full, rejected {}\", rejected.0);\n        }\n    }\n    println!(\"stack holds {:?}\", st.as_slice().iter().map(|n| n.0).collect::<Vec<_>>());\n    let top = st.pop();\n    println!(\"popped {:?}\", top.as_ref().map(|n| n.0));\n    drop(top);\n    println!(\"dropping the stack:\");\n    drop(st);\n\n    let v = vec![10u64, 20, 30];\n    // SAFETY: 2 < v.len()\n    println!(\"read_unchecked = {}\", unsafe { read_unchecked(&v, 2) });\n\n    // Raw pointers can be created in safe code; only dereferencing them is unsafe.\n    let x = 42u32;\n    let p = &raw const x;\n    println!(\"raw pointer {p:p} -> {}\", unsafe { *p });\n}\n"}, "cmd": "cargo run -q", "out": "split_at_mut: [100, 2, 300, 4, 5, 6]\n  full, rejected d\n  drop d\nstack holds [\"a\", \"b\", \"c\"]\npopped Some(\"c\")\n  drop c\ndropping the stack:\n  drop a\n  drop b\nread_unchecked = 30\nraw pointer 0x7ffc88c44d3c -> 42", "fail": false}, "c18-ffi-c": {"files": {"src/main.rs": "use std::ffi::{c_char, c_int, c_long, CString};\n\n// Edition 2024: extern blocks are `unsafe extern`, because the declarations are promises\n// the compiler cannot check. Items can be marked `safe` when calling them cannot cause UB.\nunsafe extern \"C\" {\n    fn luhn_valid(digits: *const c_char) -> c_int;\n    fn sum_mapped(xs: *const c_long, n: usize, f: extern \"C\" fn(c_long) -> c_long) -> c_long;\n}\n\n/// Safe wrapper: owns the conversion, the invariants and the error mapping.\npub fn card_number_valid(pan: &str) -> Result<bool, String> {\n    let c = CString::new(pan).map_err(|_| \"embedded NUL byte\".to_string())?;\n    // SAFETY: `c` is a valid NUL-terminated string that outlives the call; luhn_valid only reads it.\n    match unsafe { luhn_valid(c.as_ptr()) } {\n        1 => Ok(true),\n        0 => Ok(false),\n        _ => Err(format!(\"non-digit in {pan:?}\")),\n    }\n}\n\n/// A Rust function C can call: C ABI, no unwinding across the boundary.\nextern \"C\" fn fee_bps_25(amount: c_long) -> c_long {\n    amount * 25 / 10_000\n}\n\nfn main() {\n    for pan in [\"4111111111111111\", \"4111111111111112\", \"4111-1111\"] {\n        println!(\"{pan}: {:?}\", card_number_valid(pan));\n    }\n    let amounts: [c_long; 3] = [100_000, 250_000, 40_000];\n    // SAFETY: the point ked non-null; the caller guarantees NUL termination and validity.\n    let Ok(cc) = unsafe { CStr::from_ptr(country) }.to_str() else { return -1 };\n    let mut score = 0i32;\n    if amount_minor > 5_000_000 { score += 40 } else if amount_minor > 1_000_000 { score += 20 }\n    if !matches!(cc, \"IN\" | \"SG\" | \"GB\") { score += 25 }\n    score += (txns_last_hour.min(10) * 5) as i32;\n    score.min(100)\n}\n", "java/RiskDemo.java": "import java.lang.foreign.*;\nimport java.lang.invoke.MethodHandle;\nimport java.nio.file.Path;\nimport static java.lang.foreign.ValueLayout.*;\n\n// Java 21 (preview) and Java 22+ (final) Foreign Function & Memory API: no JNI glue code.\npublic class RiskDemo {\n    public static void main(String[] args) throws Throwable {\n        try (Arena arena = Arena.ofConfined()) {\n            SymbolLookup lib = SymbolLookup.libraryLookup(Path.of(args[0]), arena);\n            MethodHandle score = Linker.nativeLinker().downcallHandle(\n                lib.find(\"risk_score\").orElseThrow(),\n                FunctionDescriptor.of(JAVA_INT, JAVA_LONG, ADDRESS, JAVA_INT));\n            Object[][] cases = { {250_000L, \"IN\", 1}, {6_000_000L, \"US\", 2}, {2_000_000L, \"SG\", 9} };\n            for (Object[] c : cases) {\n                MemorySegment cc = arena.allocateUtf8String((String) c[1]);   // allocateFrom(...) on Java 22+\n                int s = (int) score.invokeExact((long) c[0], cc, (int) c[2]);\n                System.out.printf(\"amount %,d %s velocity %d -> risk %d%n\", c[0], c[1], c[2], s);\n            }\n        }\n    }\n}\n", "Cargo.toml": "[package]\nname = \"risk\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[lib]\ncrate-type = [\"cdylib\"]\n\n[dependencies]\n"}, "cmd": "cargo build -q --release && javac -d out --release 21 --enable-preview java/RiskDemo.java 2>&1 | grep -v -e Picked -e \"uses preview\" -e \"Recompile with\" ; java --enable-preview --enable-native-access=ALL-UNNAMED -cp out RiskDemo \"$CARGO_TARGET_DIR/release/librisk.so\" 2>&1 | grep -v Picked", "out": "amount 250,000 IN velocity 1 -> risk 5\namount 6,000,000 US velocity 2 -> risk 75\namount 2,000,000 SG velocity 9 -> risk 65", "fail": false}, "c19-alloc": {"files": {"src/main.rs": "use std::fmt::Write;\nuse std::hint::black_box;\nuse std::time::Instant;\n\nstruct Txn { id: u64, amount: i64, ccy: &'static str }\n\nfn bench(name: &str, f: impl Fn() -> usize) {\n    black_box(f());\n    let t = Instant::now();\n    let mut out = 0;\n    for _ in 0..20 { out = black_box(f()); }\n    println!(\"{name:<44} {:>6.2} ms   ({out} bytes)\", t.elapsed().as_secs_f64() * 1000.0 / 20.0);\n}\n\nfn main() {\n    let txns: Vec<Txn> = (0..200_000).map(|i| Txn { id: i, amount: (i as i64 * 7919) % 100_000, ccy: \"INR\" }).collect();\n\n    bench(\"format! per line, collect, join\", || {\n        let lines: Vec<String> = txns.iter().map(|t| format!(\"{},{},{}\\n\", t.id, t.amount, t.ccy)).collect();\n        lines.concat().len()\n    });\n    bench(\"write! into one String\", || {\n        let mut s = String::new();\n        for t in &txns { writeln!(s, \"{},{},{}\", t.id, t.amount, t.ccy).unwrap(); }\n        s.len()\n    });\n    bench(\"write! into one String, reserved\", || {\n        let mut s = String::with_capacity(txns.len() * 24);\n        for t in &txns { writeln!(s, \"{},{},{}\", t.id, t.amount, t.ccy).unwrap(); }\n        s.len()\n    });\n    bench(\"byte buffer, reserved, to_string per field\", || {\n        let mut buf = Vec::with_capacity(txns.len() * 24);\n        for t in &txns {\n            buf.extend_from_slice(t.id.to_string().as_bytes());\n            buf.push(b',');\n            buf.extend_from_slice(t.amount.to_string().as_bytes());\n            buf.push(b',');\n            buf.extend_from_slice(t.ccy.as_bytes());\n            buf.push(b'\\n');\n        }\n        buf.len()\n    });\n    bench(\"byte buffer, reserved, itoa (no allocation)\", || {\n        let mut buf = Vec::with_capacity(txns.len() * 24);\n        let mut num = itoa::Buffer::new(); // formats an integer into a stack buffer\n        for t in &txns {\n            buf.extend_from_slice(num.format(t.id).as_bytes());\n            buf.push(b',');\n            buf.extend_from_slice(num.format(t.amount).as_bytes());\n            buf.push(b',');\n            buf.extend_from_slice(t.ccy.as_bytes());\n            buf.push(b'\\n');\n        }\n        buf.len()\n    });\n}\n", "Cargo.toml": "[package]\nname = \"c19-alloc\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[dependencies]\nitoa = \"1\"\n"}, "cmd": "cargo run -q --release", "out": "format! per line, collect, join               28.72 ms   (3266670 bytes)\nwrite! into one String                        11.82 ms   (3266670 bytes)\nwrite! into one String, reserved              15.33 ms   (3266670 bytes)\nbyte buffer, reserved, to_string per field     9.56 ms   (3266670 bytes)\nbyte buffer, reserved, itoa (no allocation)    3.71 ms   (3266670 bytes)", "fail": false}, "c20-loom": {"files": {"src/lib.rs": "//! A counter shared between threads, checked with loom under every interleaving.\n#[cfg(loom)]\nuse loom::sync::atomic::{AtomicU64, Ordering};\n#[cfg(not(loom))]\nuse std::sync::atomic::{AtomicU64, Ordering};\n\n#[derive(Default)]\npub struct Counter(AtomicU64);\n\nimpl Counter {\n    /// Correct: one indivisible read-modify-write.\n    pub fn incr(&self) {\n        self.0.fetch_add(1, Ordering::Relaxed);\n    }\n    /// Wrong: a load and a separate store, the lost update of Figure 14.1.\n    /// Every individual access is atomic, so this compiles, and it passes most stress tests.\n    pub fn incr_racy(&self) {\n        let v = self.0.load(Ordering::Relaxed);\n        self.0.store(v + 1, Ordering::Relaxed);\n    }\n    pub fn get(&self) -> u64 {\n        self.0.load(Ordering::Relaxed)\n    }\n}\n\n#[cfg(all(test, loom))]\nmod tests {\n    use super::Counter;\n    use loom::sync::Arc;\n    use loom::thread;\n\n    fn two_threads(f: fn(&Counter)) -> u64 {\n        let c = Arc::new(Counter::default());\n        let hs: Vec<_> = (0..2)\n            .map(|_| {\n                let c = Arc::clone(&c);\n                thread::spawn(move || f(&c))\n            })\n            .collect();\n        for h in hs {\n            h.join().unwrap();\n        }\n        c.get()\n    }\n\n    #[test]\n    fn fetch_add_never_loses_an_increment() {\n        loom::model(|| assert_eq!(two_threads(Counter::incr), 2));\n    }\n\n    #[test]\n    #[should_panic(expected = \"lost an increment\")]\n    fn load_then_store_loses_one() {\n        // loom explores the interleavings until it finds the one where both threads load 0.\n        loom::model(|| assert_eq!(two_threads(Counter::incr_racy), 2, \"lost an increment\"));\n    }\n}\n", "Cargo.toml": "[package]\nname = \"counter\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[dependencies]\n\n[target.'cfg(loom)'.dependencies]\nloom = \"0.7\"\n\n[lints.rust]\nunexpected_cfgs = { level = \"warn\", check-cfg = [\"cfg(loom)\"] }\n"}, "cmd": "RUSTFLAGS=\"--cfg loom\" cargo test --release --lib -- --test-threads=1 2>&1 | grep -E \"^test |^test result\"", "out": "test tests::fetch_add_never_loses_an_increment ... ok\ntest tests::load_then_store_loses_one - should panic ... ok\ntest result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s", "fail": false}, "c20-testing": {"files": {"src/lib.rs": "//! Fee calculation with unit tests, property tests, an integration test and a doctest.\n\n/// Fee in minor units: `bps` basis points of `amount`, at least `min`, never more than `amount`.\n///\n/// ```\n/// assert_eq!(fees::fee(100_000, 25, 500), 500);   // 0.25% of 1000.00 is 2.50, below the minimum\n/// assert_eq!(fees::fee(1_000_000, 25, 500), 2_500);\n/// ```\npub fn fee(amount: i64, bps: i64, min: i64) -> i64 {\n    assert!(amount >= 0 && bps >= 0 && min >= 0, \"inputs must be non-negative\");\n    let pct = (i128::from(amount) * i128::from(bps) / 10_000) as i64;\n    pct.max(min).min(amount)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use proptest::prelude::*;\n\n    #[test]\n    fn minimum_applies_to_small_amounts() {\n        assert_eq!(fee(10_000, 25, 500), 500);\n    }\n\n    #[test]\n    fn fee_never_exceeds_amount() {\n        assert_eq!(fee(300, 25, 500), 300);\n    }\n\n    #[test]\n    #[should_panic(expected = \"non-negative\")]\n    fn negative_amount_is_a_bug() {\n        fee(-1, 25, 0);\n    }\n\n    proptest! {\n        // Properties hold for every input proptest generates (256 cases by default),\n        // and a failure is shrunk to the smallest counterexample.\n        #[test]\n        fn fee_is_bounded(amount in 0i64..i64::MAX / 2, bps in 0i64..10_000, min in 0i64..100_000) {\n            let f = fee(amount, bps, min);\n            prop_assert!(f <= amount);\n            prop_assert!(f >= min.min(amount));\n        }\n\n        #[test]\n        fn fee_is_monotonic(a in 0i64..1_000_000_000, extra in 0i64..1_000_000, bps in 0i64..500) {\n            prop_assert!(fee(a, bps, 0) <= fee(a + extra, bps, 0));\n        }\n    }\n}\n", "tests/api.rs": "// Integration tests use the crate like an external user would.\n#[test]\nfn typical_card_fee() {\n    let amounts = [50_000, 1_000_000, 25_000_000];\n    let total: i64 = amounts.iter().map(|&a| fees::fee(a, 180, 100)).sum();\n    assert_eq!(total, 900 + 18_000 + 450_000);\n}\n", "Cargo.toml": "[package]\nname = \"fees\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[dependencies]\n\n[dev-dependencies]\nproptest = \"1\"\n"}, "cmd": "cargo test -q 2>&1 | grep -v \"^$\"", "out": "running 5 tests\n.....\ntest result: ok. 5 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.01s\nrunning 1 test\n.\ntest result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s\nrunning 1 test\n.\ntest result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s\nall doctests ran in 0.45s; merged doctests compilation took 0.32s", "fail": false}, "c21-cli": {"files": {"src/main.rs": "use anyhow::{Context, Result};\nuse clap::{Parser, Subcommand, ValueEnum};\nuse serde::{Deserialize, Serialize};\nuse std::collections::BTreeMap;\nuse std::fs::File;\nuse std::io::{self, BufReader, Write};\nuse std::path::{Path, PathBuf};\n\n/// Summarise payment transaction files.\n#[derive(Parser)]\n#[command(name = \"txn\", version, about)]\nstruct Cli {\n    #[command(subcommand)]\n    cmd: Cmd,\n}\n\n#[derive(Subcommand)]\nenum Cmd {\n    /// Totals per merchant for approved transactions\n    Summary {\n        file: PathBuf,\n        #[arg(long, value_enum, default_value_t = Format::Table)]\n        format: Format,\n    },\n    /// The largest approved transactions\n    Top {\n        file: PathBuf,\n        #[arg(short, long, default_value_t = 5)]\n        n: usize,\n        #[arg(long)]\n        currency: Option<String>,\n    },\n}\n\n#[derive(Clone, Copy, ValueEnum)]\nenum Format { Table, Json }\n\n#[derive(Debug, Deserialize)]\nstruct Txn { id: u64, merchant: String, amount_minor: i64, currency: String, status: String }\n\n#[derive(Serialize, Default)]\nstruct Line { count: usize, total_minor: i64 }\n\nfn load(path: &Path) -> Result<Vec<Txn>> {\n    let f = File::open(path).with_context(|| format!(\"cannot open {}\", path.display()))?;\n    let mut rdr = csv::Reader::from_reader(BufReader::new(f));\n    rdr.deserialize()\n        .enumerate()\n        .map(|(i, r)| r.with_context(|| format!(\"{}: bad record {}\", path.display(), i + 1)))\n        .collect()\n}\n\nfn money(minor: i64) -> String { format!(\"{}.{:02}\", minor / 100, minor % 100) }\n\nfn run(cli: Cli) -> Result<()> {\n    let out = io::stdout();\n    let mut out = out.lock(); // lock once for fast bulk output\n    match cli.cmd {\n        Cmd::Summary { file, format } => {\n            let mut by: BTreeMap<(String, String), Line> = BTreeMap::new();\n            for t in load(&file)?.into_iter().filter(|t| t.status == \"approved\") {\n                let l = by.entry((t.currency, t.merchant)).or_default();\n                l.count += 1;\n                l.total_minor += t.amount_minor;\n            }\n            match format {\n                Format::Table => {\n                    writeln!(out, \"{:<4} {:<10} {:>5} {:>12}\", \"ccy\", \"merchant\", \"count\", \"total\")?;\n                    for ((ccy, m), l) in &by {\n                        writeln!(out, \"{ccy:<4} {m:<10} {:>5} {:>12}\", l.count, money(l.total_minor))?;\n                    }\n                }\n                Format::Json => {\n                    let flat: BTreeMap<String, &Line> = by.iter().map(|((c, m), l)| (format!(\"{c}/{m}\"), l)).collect();\n                    writeln!(out, \"{}\", serde_json::to_string(&flat)?)?;\n                }\n            }\n        }\n        Cmd::Top { file, n, currency } => {\n            let mut txns: Vec<Txn> = load(&file)?\n                .into_iter()\n                .filter(|t| t.status == \"approved\" && currency.as_ref().is_none_or(|c| &t.currency == c))\n                .collect();\n            txns.sort_by_key(|t| std::cmp::Reverse(t.amount_minor));\n            for t in txns.iter().take(n) {\n                writeln!(out, \"#{:<3} {:<10} {} {}\", t.id, t.merchant, t.currency, money(t.amount_minor))?;\n            }\n        }\n    }\n    Ok(())\n}\n\nfn main() {\n    if let Err(e) = run(Cli::parse()) {\n        // `txn summary big.csv | head` closes the pipe early: a normal end, not an error.\n        if e.downcast_ref::<io::Error>().is_some_and(|io| io.kind() == io::ErrorKind::BrokenPipe) {\n            return;\n        }\n        eprintln!(\"error: {e:#}\");\n        std::process::exit(1);\n    }\n}\n", "tests/cli.rs": "// Integration tests run the real binary, as a user or a scheduler would.\nuse assert_cmd::cargo::cargo_bin_cmd;\nuse predicates::str::contains;\n\n#[test]\nfn summary_prints_totals_per_merchant() {\n    cargo_bin_cmd!(\"txn\")\n        .args([\"summary\", \"data/txns.csv\"])\n        .assert()\n        .success()\n        .stdout(contains(\"INR  grocer         2      2050.00\"));\n}\n\n#[test]\nfn missing_file_exits_1_with_a_message() {\n    cargo_bin_cmd!(\"txn\")\n        .args([\"summary\", \"nope.csv\"])\n        .assert()\n        .code(1)\n        .stderr(contains(\"cannot open nope.csv\"));\n}\n\n#[test]\nfn unknown_format_is_a_usage_error() {\n    cargo_bin_cmd!(\"txn\")\n        .args([\"summary\", \"data/txns.csv\", \"--format\", \"xml\"])\n        .assert()\n        .code(2) // clap's exit code for usage errors\n        .stderr(contains(\"invalid value 'xml'\"));\n}\n", "Cargo.toml": "[package]\nname = \"txn\"\nversion = \"0.1.0\"\nedition = \"2024\"\n\n[dependencies]\nanyhow = \"1\"\nclap = { version = \"4\", features = [\"derive\"] }\ncsv = \"1\"\nserde = { version = \"1\", features = [\"derive\"] }\nserde_json = \"1\"\n\n[dev-dependencies]\nassert_cmd = \"2\"\npredicates = \"3\"\n"}, "cmd": "cargo run -q -- summary data/txns.csv; cargo run -q -- top data/txns.csv -n 2 --currency INR; cargo run -q -- summary data/txns.csv --format json; cargo run -q -- summary missing.csv 2>&1; echo \"exit status $?\"; cargo test -q 2>&1 | grep -E \"^test result\"", "out": "ccy  merchant   count        total\nINR  airline        1     45999.00\nINR  cinema         1       600.00\nINR  fuel           1      2200.00\nINR  grocer         2      2050.00\nUSD  bookstore      1        25.00\n#4   airline    INR 45999.00\n#7   fuel       INR 2200.00\n{\"INR/airline\":{\"count\":1,\"total_minor\":4599900},\"INR/cinema\":{\"count\":1,\"total_minor\":60000},\"INR/fuel\":{\"count\":1,\"total_minor\":220000},\"INR/grocer\":{\"count\":2,\"total_minor\":205000},\"USD/bookstore\":{\"count\":1,\"total_minor\":2500}}\nerror: cannot open missing.csv: No such file or directory (os error 2)\nexit status 1\ntest result: ok. 0 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s\ntest result: ok. 3 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.00s", "fail": false}, "c22-api": {"files": {"src/main.rs": "use axum::body::{to_bytes, Body};\nuse axum::extract::rejection::JsonRejection;\nuse axum::extract::{FromRequest, Path, State};\nuse axum::http::{HeaderMap, Request, StatusCode};\nuse axum::response::{IntoResponse, Response};\nuse axum::routing::{get, post};\nuse axum::{Json, Router};\nuse serde::{Deserialize, Serialize};\nuse serde_json::json;\nuse std::collections::HashMap;\nuse std::sync::{Arc, Mutex};\nuse std::time::Duration;\nuse tower::ServiceExt;\nuse tower_http::limit::RequestBodyLimitLayer;\nuse tower_http::timeout::TimeoutLayer;\nuse tower_http::trace::TraceLayer;\n\n#[derive(Default)]\nstruct Store { payments: HashMap<u64, Payment>, by_key: HashMap<String, u64>, next_id: u64 }\n\n#[derive(Clone, Default)]\nstruct AppState { store: Arc<Mutex<Store>> }\n\n#[derive(Deserialize)]\n#[serde(deny_unknown_fields)]\nstruct NewPayment { merchant_id: String, amount_minor: i64, currency: String }\n\n#[derive(Serialize, Clone)]\nstruct Payment { id: u64, merchant_id: String, amount_minor: i64, currency: String, status: &'static str }\n\n#[derive(Debug, thiserror::Error)]\nenum ApiError {\n    #[error(\"{0}\")]\n    Validation(String),\n    #[error(transparent)]\n    BadBody(#[from] JsonRejection),\n    #[error(\"Idempotency-Key header is required\")]\n    MissingKey,\n    #[error(\"idempotency key reused with a different request\")]\n    KeyReused,\n    #[error(\"payment not found\")]\n    NotFound,\n}\n\n// Status codes for idempotency follow the IETF Idempotency-Key draft: 400 missing, 422 reused.\nimpl IntoResponse for ApiError {\n    fn into_response(self) -> Response {\n        let (status, code) = match &self {\n            ApiError::Validation(_) => (StatusCode::UNPROCESSABLE_ENTITY, \"validation_failed\"),\n            ApiError::BadBody(r) => (r.status(), \"invalid_body\"),\n            ApiError::MissingKey => (StatusCode::BAD_REQUEST, \"idempotency_key_missing\"),\n            ApiError::KeyReused => (StatusCode::UNPROCESSABLE_ENTITY, \"idempotency_key_reused\"),\n            ApiError::NotFound => (StatusCode::NOT_FOUND, \"not_found\"),\n        };\n        (status, Json(json!({ \"error\": code, \"message\": self.to_string() }))).into_response()\n    }\n}\n\n/// Like `Json`, but a body that fails to parse becomes an `ApiError`, so every error has one shape.\n#[derive(FromRequest)]\n#[from_request(via(Json), rejection(ApiError))]\nstruct JsonBody<T>(T);\n\nasync fn create(State(st): State<AppState>, headers: HeaderMap, JsonBody(req): JsonBody<NewPayment>) -> Result<(StatusCode, Json<Payment>), ApiError> {\n    let key = headers\n        .get(\"idempotency-key\")\n        .and_then(|v| v.to_str().ok())\n        .ok_or(ApiError::MissingKey)?\n        .to_owned();\n    if req.amount_minor <= 0 {\n        return Err(ApiError::Validation(\"amount_minor must be positive\".into()));\n    }\n    if !matches!(req.currency.as_str(), \"INR\" | \"USD\" | \"EUR\") {\n        return Err(ApiError::Validation(format!(\"unsupported currency {}\", req.currency)));\n    }\n    let mut s = st.store.lock().expect(\"store lock poisoned\"); // no .await while held\n    if let Some(id) = s.by_key.get(&key) {\n        let existing = s.payments[id].clone();\n        let same = existing.merchant_id == req.merchant_id && existing.amount_minor == req.amount_minor && existing.currency == req.currency;\n        return if same {\n            Ok((StatusCode::OK, Json(existing))) // a retry: same answer, no second charge\n        } else {\n            Err(ApiError::KeyReused)\n        };\n    }\n    s.next_id += 1;\n    let p = Payment { id: s.next_id, merchant_id: req.merchant_id, amount_minor: req.amount_minor, currency: req.currency, status: \"authorised\" };\n    s.by_key.insert(key, p.id);\n    s.payments.insert(p.id, p.clone());\n    tracing::info!(payment_id = p.id, amount = p.amount_minor, \"payment created\");\n    Ok((StatusCode::CREATED, Json(p)))\n}\n\nasync fn get_one(State(st): State<AppState>, Path(id): Path<u64>) -> Result<Json<Payment>, ApiError> {\n    st.store.lock().expect(\"store lock poisoned\").payments.get(&id).cloned().map(Json).ok_or(ApiError::NotFound)\n}\n\nfn app(state: AppState) -> Router {\n    Router::new()\n        .route(\"/payments\", post(create))\n        .route(\"/payments/{id}\", get(get_one))\n        .route(\"/healthz\", get(|| async { \"ok\" }))\n        // The last layer added runs first: tracing wraps everything.\n        .layer(RequestBodyLimitLayer::new(16 * 1024))\n        .layer(TimeoutLayer::with_status_code(StatusCode::REQUEST_TIMEOUT, Duration::from_secs(5)))\n        .layer(TraceLayer::new_for_http())\n        .with_state(state)\n}\n\nasync fn call(app: &Router, method: &str, uri: &str, key: Option<&str>, body: &str) -> anyhow::Result<()> {\n    let mut req = Request::builder().method(method).uri(uri).header(\"content-type\", \"application/json\");\n    if let Some(k) = key { req = req.header(\"idempotency-key\", k); }\n    let resp = app.clone().oneshot(req.body(Body::from(body.to_owned()))?).await?;\n    let status = resp.status();\n    let bytes = to_bytes(resp.into_body(), 64 * 1024).await?;\n    println!(\"{method:<4} {uri:<14} -> {} {}\", status.as_u16(), String::from_utf8_lossy(&bytes));\n    Ok(())\n}\n\nasync fn shutdown_signal() {\n    let mut term = tokio::signal::unix::signal(tokio::signal::unix::SignalKind::terminate()).expect(\"signal handler\");\n    tokio::select! { _ = tokio::signal::ctrl_c() => {}, _ = term.recv() => {} }\n    tracing::info!(\"shutting down: draining in-flight requests\");\n}\n\n#[tokio::main]\nasync fn main() -> anyhow::Result<()> {\n    tracing_subscriber::fmt().with_env_filter(\"payments_api=info\").json().with_current_span(false).without_time().init();\n    let app = app(AppState::default());\n\n    if std::env::args().nth(1).as_deref() == Some(\"serve\") {\n        let listener = tokio::net::TcpListener::bind(\"0.0.0.0: lt)]\nstruct Book { bids: BTreeMap<u64, VecDeque<Order>>, asks: BTreeMap<u64, VecDeque<Order>> }\n\nimpl Book {\n    fn submit(&mut self, mut o: Order, fills: &mut Vec<Fill>) {\n        loop {\n            if o.qty == 0 { return; }\n            // Best opposite level: lowest ask for a buy, highest bid for a sell.\n            let best = match o.side {\n                Side::Buy => self.asks.first_entry().filter(|e| *e.key() <= o.price),\n                Side::Sell => self.bids.last_entry().filter(|e| *e.key() >= o.price),\n            };\n            let Some(mut level) = best else { break };\n            let price = *level.key();\n            let queue = level.get_mut();\n            while o.qty > 0 {\n                let Some(maker) = queue.front_mut() else { break };\n                let q = o.qty.min(maker.qty);\n                fills.push(Fill { taker: o.id, maker: maker.id, price, qty: q });\n                o.qty -= q;\n                maker.qty -= q;\n                if maker.qty == 0 { queue.pop_front(); }\n            }\n            if queue.is_empty() { level.remove(); }\n        }\n        let side = if o.side == Side::Buy { &mut self.bids } else { &mut self.asks };\n        side.entry(o.price).or_default().push_back(o); // rest the remainder\n    }\n}\n\nfn main() {\n    let a = Money::<Inr>::new(125_050);\n    let b = Money::<Inr>::new(99_950);\n    println!(\"{} + {} = {}\", a, b, a + b);\n    // let wrong = a + Money::<Usd>::new(1);   // compile error: expected Money<Inr>, found Money<Usd>\n    println!(\"USD 1,234.57 at 84.125 = {}\", convert(Money::new(123_457), Decimal::from_str(\"84.125\").unwrap()));\n\n    let mut book = Book::default();\n    let mut fills = Vec::new();\n    for o in [\n        Order { id: 1, side: Side::Sell, price: 10_050, qty: 5 },\n        Order { id: 2, side: Side::Sell, price: 10_040, qty: 3 },\n        Order { id: 3, side: Side::Sell, price: 10_050, qty: 4 },\n        Order { id: 4, side: Side::Buy, price: 10_050, qty: 1 CH.push({
  id: 'ch01', n: 1, title: 'The Idea of Rust',
  lede: 'Rust is a systems language that gives the control and speed of C and C++ while proving, at compile time, that a program has no use-after-free, no dangling pointers and no data races. It does this without a garbage collector, through a small set of rules about who owns each value and who may change it. This chapter sets out the problem Rust solves, what it costs, and the toolchain you will use for the rest of the book.',
  html: `
<h2>The problem Rust was built for</h2>
<p>Software that runs close to the machine (operating systems, browsers, databases, network stacks, payment switches, language runtimes) has been written in C and C++ for fifty years because nothing else offered the same control over memory layout, latency and resource use. The price has been a steady stream of <b>memory-safety bugs</b>: reading past the end of a buffer, using memory after it was freed, freeing it twice, two threads writing the same variable at once. Microsoft and Google have both reported, across very large codebases, that roughly 70% of their serious security vulnerabilities came from this one class of bug.</p>
<p>Languages with a garbage collector (Java, Go, C#, Python) remove most of that class, but they take something away in exchange: a runtime that decides when memory is reclaimed, a heap that typically runs at twice the live data or more, pauses or background CPU for collection, and a layer between you and the hardware. For a microservice that is usually a fine trade. For a kernel driver, a 5 µs matching engine, a 64 KiB microcontroller or a library loaded into somebody else's process, it is not.</p>
<p>Rust's claim is that you do not have to choose. It keeps the C++ model of values with deterministic destruction (memory is freed at a known point, by the code that owns it) and adds a compile-time check, the <b>borrow checker</b>, that rejects any program in which a reference could outlive its data or two parts of the program could change the same data at the same time.</p>
${EX('c01-safety', 'The bug C++ lets through')}
<p>The program above is the textbook C++ iterator-invalidation bug: <code>push</code> may move the vector to a bigger allocation and free the old one, leaving <code>first</code> pointing at freed memory. In C++ it compiles and usually even appears to work. Rust refuses it, and the error tells you exactly which two uses conflict. Chapters 4 and 5 explain the rules behind that message; for now, notice that the check happens before the program ever runs and costs nothing at runtime.</p>

<h2>What Rust promises</h2>
<div class="tbl"><table>
<tr><th>Promise</th><th>What it means in practice</th><th>How it is enforced</th></tr>
<tr><td><b>Memory safety</b></td><td>No use-after-free, double free, dangling pointer, buffer overflow or uninitialised read in safe code</td><td>Ownership, borrowing and lifetimes checked at compile time; bounds checks on indexing at runtime</td></tr>
<tr><td><b>Data-race freedom</b></td><td>Two threads can never access the same memory at the same time with at least one writing, unless through a lock or atomic</td><td>The <code>Send</code> and <code>Sync</code> traits plus the "one writer or many readers" rule</td></tr>
<tr><td><b>Zero-cost abstractions</b></td><td>Iterators, closures, generics and traits compile to the same machine code you would write by hand</td><td>Monomorphisation and inlining through LLVM</td></tr>
<tr><td><b>No null, no exceptions</b></td><td>Absence is <code>Option&lt;T&gt;</code>, failure is <code>Result&lt;T, E&gt;</code>; the compiler makes you handle both</td><td>Enums and exhaustive <code>match</code></td></tr>
<tr><td><b>No runtime</b></td><td>No garbage collector, no virtual machine, no mandatory threads; the same language runs in a kernel, on a microcontroller and in WebAssembly</td><td>Ownership decides when to free; the standard library is optional (<code>no_std</code>)</td></tr>
<tr><td><b>Stability</b></td><td>Code written for Rust 1.0 in 2015 still compiles on 1.100 in 2026, apart from rare, announced fixes for soundness bugs and inference changes</td><td>The stability promise, editions, and crater runs over every public crate before each release</td></tr>
</table></div>
<p>There is a deliberate escape hatch. Inside an <code>unsafe</code> block you may dereference raw pointers, call C functions and do the handful of other things the compiler cannot check. The promise then becomes: if the small amount of <code>unsafe</code> code upholds its documented rules, everything built on it is safe. The standard library's <code>Vec</code>, <code>Arc</code> and <code>Mutex</code> are built exactly like that. Chapter 17 is about writing such code well.</p>

<h2>What Rust costs</h2>
<ul>
<li><b>A learning curve.</b> Ownership is a new idea for most programmers. Expect a few weeks of arguing with the borrow checker; most people report that the arguments stop once the model clicks, and that it changes how they write code in other languages too.</li>
<li><b>Compile times.</b> Generics are compiled once per concrete type and LLVM optimises heavily, so a large Rust service builds more slowly than the same service in Go. Chapter 19 covers what helps (incremental builds, splitting crates, faster linkers; LLD has been the default linker on x86-64 Linux since 1.90).</li>
<li><b>Explicitness.</b> You will write <code>.clone()</code>, <code>&amp;</code>, <code>Arc&lt;Mutex&lt;T&gt;&gt;</code> and error conversions that other languages hide. This is the price of the compiler knowing everything it needs.</li>
<li><b>Async complexity.</b> Rust's async model is zero-cost but more intricate than goroutines or Java's virtual threads. Chapters 15 and 16 take it apart.</li>
</ul>
<p>Chapter 2 compares Rust with the languages you already use, workload by workload, including the cases where Rust is the wrong choice.</p>

<h2>A short history</h2>
${fig('history', '<b>Figure 1.1</b> From a personal project to an industry systems language.')}
<p>Rust is developed in the open by the <b>Rust Project</b> (several hundred contributors organised into teams for the language, compiler, library, Cargo, infrastructure and so on, coordinated by a Leadership Council). The <b>Rust Foundation</b>, a non-profit funded by member companies, holds the trademarks, pays for infrastructure such as crates.io, and funds security and maintainer programmes. No single company owns the language.</p>

<h2>Releases and editions</h2>
${fig('train', '<b>Figure 1.2</b> Step through: the six-week release train.')}
<p>A new stable compiler ships every six weeks, so features arrive in small steps (this book was finished the day after 1.100.0 shipped). The stability promise says a stable feature is never removed. To make changes that would otherwise break code, such as new keywords or different defaults, Rust uses <b>editions</b>: each crate declares one in <code>Cargo.toml</code> (2015, 2018, 2021 or 2024), crates of different editions link together freely, and <code>cargo fix --edition</code> migrates most code automatically. Every example in this book uses <b>Edition 2024</b> (released with 1.85 in February 2025), which reserved <code>gen</code> as a keyword, required <code>unsafe extern</code> blocks, changed the never type fallback and tail-expression temporary scopes, and is the edition in which <code>if let</code> chains are allowed (stable since 1.88).</p>
<div class="note key"><b>What changed recently</b><p>The last year of releases, in brief. 1.92 made the never-type fallback lints deny-by-default. 1.93 shipped musl 1.2.5 for static Linux binaries. 1.94 added <code>array_windows</code> and the TOML 1.1 parser in Cargo. 1.95 brought <code>cfg_select!</code> and <code>if let</code> guards in <code>match</code> arms. 1.96 added <code>assert_matches!</code> and the new range types. 1.97 made v0 symbol mangling the default and added <code>CARGO_BUILD_WARNINGS</code>. 1.98 added algebraic floating-point methods and <code>format_into</code>. 1.99 added C-variadic function definitions and <code>Vec::into_parts</code>. <b>1.100</b> stabilised the never type <code>!</code> (with <code>Infallible</code> now an alias for it), the core of the <code>Allocator</code> trait for <code>Vec</code> and <code>Box</code>, <code>DropGuard</code>, unused-dependency warnings and minimum publish age ("cooldowns") in Cargo. Each feature is covered in the chapter where it belongs.</p></div>

<h2>The toolchain</h2>
${fig('toolchain', '<b>Figure 1.3</b> What you install, and what each piece does.')}
<p>Install with <b>rustup</b>, the toolchain manager. It installs <code>rustc</code> (the compiler), <code>cargo</code> (build tool and package manager), the standard library, <code>clippy</code> (hundreds of lints), <code>rustfmt</code> (the one true format) and documentation, and it can add cross-compilation targets and nightly toolchains side by side.</p>
${SH('Install, create a project, run it')`
curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh   # or your OS package manager
rustup update stable          # 1.100.0 as of 12 November 2026
cargo new payments-cli        # binary crate; cargo new --lib for a library
cd payments-cli
cargo run                     # build (debug) and run
cargo build --release         # optimised build in target/release/
cargo clippy                  # lints
cargo fmt                     # format
cargo test                    # unit, integration and doc tests
cargo doc --open              # HTML docs for your crate and every dependency`}
${T('Pin the toolchain for the whole team: rust-toolchain.toml')`
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-gnu"]`}
<p>Every example in this book was compiled and run when the book was built, almost all of them also checked with <code>cargo clippy -- -D warnings</code>, and the output shown is the real output. The build machine had Rust 1.97.0, so examples use only features stable in 1.97; features from 1.98 to 1.100 are shown as code that is described but was not compiled here.</p>

<h2>A first program</h2>
${EX('c01-hello', 'Structs, vectors and iterators')}
<p>Even this small program shows the style of the language: a struct with explicit types, a mutable binding marked <code>mut</code> (bindings are immutable by default), numbers with type inference and digit separators, a closure-based iterator pipeline that compiles to a plain loop, <code>{:?}</code> debug formatting generated by <code>#[derive(Debug)]</code>, and <code>max_by_key</code> returning an <code>Option</code> because an empty list has no maximum.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Benchmarking debug builds.</strong> <code>cargo run</code> builds without optimisation and with overflow checks; it is often an order of magnitude slower than <code>--release</code>.</li>
<li><strong>Fighting the borrow checker by cloning everything.</strong> It works, but it hides design problems. Chapters 4 and 5 show the patterns that remove the conflict instead.</li>
<li><strong>Reading 2018-era tutorials.</strong> Much older advice (<code>extern crate</code>, <code>try!</code>, the 2015-edition module and path rules, lazy_static, async-std) is obsolete. Prefer the official documentation and current crate docs.</li>
<li><strong>Staying on an old compiler.</strong> Only the latest stable gets fixes. Pin with rust-toolchain.toml and move the pin forward every release or two.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Garbage collector or not?</summary><p>How does Rust decide when to free a <code>String</code>'s heap buffer?</p><p><em>Answer:</em> the buffer is freed when the variable that owns the <code>String</code> goes out of scope (or the value is dropped explicitly). The compiler inserts the call to the destructor at that point; there is no collector and no reference counting unless you ask for it.</p></details>
<details><summary>Editions</summary><p>Your service uses Edition 2024; a dependency still declares Edition 2018. Does that work?</p><p><em>Answer:</em> yes. The edition is a per-crate setting that changes how that crate's source is parsed and checked; all editions compile to the same internal representation and link together.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Set up a project properly</summary><p>Create a new binary crate, pin the toolchain to 1.100.0 with clippy and rustfmt, and make CI fail on warnings without invalidating the build cache.</p><p><em>Answer:</em> <code>cargo new</code>, add rust-toolchain.toml as above, and in CI run <code>CARGO_BUILD_WARNINGS=deny cargo clippy --all-targets</code> (available since 1.97; unlike <code>RUSTFLAGS=-Dwarnings</code> it does not force a rebuild), plus <code>cargo fmt --check</code> and <code>cargo test</code>.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why not just use C++ with sanitisers?</summary><p>AddressSanitizer and ThreadSanitizer find many of the same bugs. What is the difference in guarantee?</p><p><em>Answer:</em> sanitisers find bugs on the paths your tests execute, at a large runtime cost, so they are a testing tool. The borrow checker rejects every program in the class, on every path, before it runs, at no runtime cost. C++26 adds a hardened standard library and removes undefined behaviour for uninitialised reads, which helps, but lifetime and aliasing errors remain the programmer's responsibility.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can state the problem Rust solves and the trade-off it avoids.</li>
<li>I can list Rust's main promises and how each is enforced.</li>
<li>I know what Rust costs: learning curve, compile time, explicitness, async complexity.</li>
<li>I understand the six-week release train and editions.</li>
<li>I have a toolchain installed and pinned, and can build, lint, format and test a crate.</li>
</ul>
`});

  lede: 'Every language is a set of trade-offs. This chapter compares Rust with C and C++, Go, Java, Python and Zig on the things that decide real projects: safety, performance, memory, concurrency, tooling, ecosystem, hiring and time to first feature. It ends with the evidence from large Rust adopters and an honest list of jobs for which Rust is the wrong tool.',
  html: `
<h2>The short answer</h2>
<p>Rust shines when a program must be <b>fast, small and correct at the same time</b>, and when a bug is expensive: infrastructure that thousands of other systems depend on, code that parses untrusted input, latency-sensitive paths, software that runs where no garbage collector or runtime can go, and libraries embedded in other languages' processes. It is a weaker choice when time to first feature dominates, when the work is mostly gluing large existing frameworks together, or when the team will only ever write a few hundred lines of it.</p>
${fig('picker', '<b>Figure 2.1</b> Interactive: pick a workload and see how each language fits it. Ratings are the author\'s judgement of the November 2026 landscape, not benchmarks.')}

<h2>The dimensions that matter</h2>
<div class="tbl"><table>
