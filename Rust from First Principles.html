CH.push({
  id: 'ch08', n: 8, title: 'Traits and Generics',
  lede: 'Traits are Rust\'s interfaces: named sets of methods that types implement. With generics they give polymorphism at compile time, with trait objects at runtime, and with derive, operator traits and conversion traits they shape how every Rust API feels. This chapter covers defining and implementing traits, bounds, associated types, static and dynamic dispatch, the coherence rules, and the standard traits every type should consider.',
  html: `
<h2>Defining and implementing traits</h2>
<p>A trait declares methods (and optionally associated types and constants); an <code>impl Trait for Type</code> block provides them. Traits can have default method bodies that implementors inherit or override. Unlike Go, implementation is explicit; unlike Java, you can implement a trait for a type you did not write, including standard types such as <code>i64</code> or <code>Vec&lt;T&gt;</code>, as long as either the trait or the type is local to your crate.</p>
${EX('c08-traits', 'A fee policy trait, operator overloading, static and dynamic dispatch')}
<p>Note how <code>Add for Money</code> returns <code>Option&lt;Money&gt;</code>: the type system records that adding rupees to dollars (or overflowing an <code>i64</code>) has no answer, so every caller must handle it. The <code>Display</code> implementation formats the sign separately because integer division truncates towards zero: <code>-50 / 100</code> is <code>0</code>, and a naive <code>minor / 100</code> would print a 50-paise refund as a 50-paise charge. Derives (<code>Debug</code>, <code>Clone</code>, <code>Copy</code>, <code>PartialEq</code>, <code>Eq</code>, <code>PartialOrd</code>, <code>Ord</code>, <code>Hash</code>, <code>Default</code>) generate the obvious implementations; ordering derives compare fields in declaration order, which is why the sorted output orders by amount first.</p>

<h2>Generics and bounds</h2>
<p>A generic function or type takes type parameters, and <b>bounds</b> say what the parameter must be able to do. Bounds can go inline (<code>&lt;P: FeePolicy&gt;</code>) or in a <code>where</code> clause when they get long. <code>impl Trait</code> in argument position is shorthand for an anonymous generic; in return position it means "some single concrete type implementing this trait, which I will not name", essential for returning closures and iterator chains whose types cannot be written down.</p>
${EX('c08-generics', 'Bounds, where clauses, const generics, impl Trait and associated types')}
<ul>
<li><b>Associated types</b> (<code>type Item</code> in <code>Iterator</code>) are chosen by the implementor: a type is an iterator of exactly one item type. Use them when there is one natural answer; use a generic parameter (<code>From&lt;T&gt;</code>) when a type may implement the trait many times.</li>
<li><b>Const generics</b> make values part of a type: <code>[u8; N]</code>, a fixed-size matrix, a ring buffer of capacity <code>N</code> with no heap allocation.</li>
<li><b>Blanket implementations</b> (<code>impl&lt;T: FeePolicy&gt; Fee for T</code>) implement a trait for every type meeting a bound. The standard library uses them widely: anything that implements <code>Display</code> gets <code>ToString</code> for free.</li>
</ul>

<h2>Static and dynamic dispatch</h2>
${fig('dispatch', '<b>Figure 8.1</b> Interactive: what the compiler produces for a generic function and for a trait object.')}
<div class="tbl"><table>
<tr><th></th><th>Generics (<code>T: Trait</code>, <code>impl Trait</code>)</th><th>Trait objects (<code>&amp;dyn Trait</code>, <code>Box&lt;dyn Trait&gt;</code>)</th></tr>
<tr><td>Resolved</td><td>At compile time</td><td>At runtime via a vtable</td></tr>
<tr><td>Speed</td><td>Inlinable, fastest</td><td>One indirect call; rarely matters outside tight loops</td></tr>
<tr><td>Code size</td><td>One copy per type</td><td>One copy</td></tr>
<tr><td>Heterogeneous collections</td><td>No (one type per instantiation)</td><td>Yes</td></tr>
<tr><td>Use for</td><td>Hot paths, library APIs, iterators</td><td>Plugins, handlers chosen by configuration, reducing compile time and binary size</td></tr>
</table></div>
<p>Async functions in traits (stable since 1.75) work with generics; using them through <code>dyn Trait</code> still needs a helper such as the <code>async-trait</code> crate or manual boxing of the returned future. "Native async fn dynamic dispatch in traits" is one of the Rust project's 2026 goals; Chapter 15 covers the options.</p>

<h2>Designing with traits</h2>
<p>A few patterns recur in every large Rust codebase. A <b>supertrait</b> (<code>trait Rule: Named + Send + Sync</code>) says that every implementor must also implement the listed traits, so code holding a <code>&amp;dyn Rule</code> can call their methods too. Since 1.86, <b>trait upcasting</b> lets a <code>&amp;dyn Rule</code> coerce to <code>&amp;dyn Named</code> or <code>&amp;dyn Any</code>, which replaces the old hand-written <code>as_any()</code> method when you need to downcast. An <b>extension trait</b> adds methods to types you do not own, through a blanket implementation; this is how itertools adds methods to every iterator. A <b>sealed trait</b> has a private supertrait, so other crates can use it but not implement it, and its owner can add methods later without a breaking change.</p>
${EX('c08-design', 'Supertraits, trait upcasting and downcasting, an extension trait and a sealed trait')}
<p>One Edition 2024 change matters when you return <code>impl Trait</code>: the hidden type now captures every generic parameter and lifetime in scope, so <code>fn ids(&amp;self) -&gt; impl Iterator&lt;Item = u64&gt;</code> is assumed to borrow <code>self</code> without the <code>+ '_</code> older code needed. When it does not borrow, say so with precise capturing, <code>impl Iterator&lt;Item = u64&gt; + use&lt;&gt;</code> (stable since 1.82), and callers are free to drop or mutate the source while they iterate.</p>

<h2>Coherence and the orphan rule</h2>
<p>To guarantee that there is at most one implementation of a trait for a type in any program, Rust enforces <b>coherence</b>: you may implement a trait for a type only if your crate defines the trait or the type (with some refinements for generics). So you cannot implement <code>serde::Serialize</code> for <code>chrono::DateTime</code> in your application; the crates do it for you behind a feature flag, or you wrap the foreign type in a local <b>newtype</b> and implement the trait for that. The payoff is that adding a dependency can never introduce a second, conflicting implementation that silently changes which code runs. Java avoids the question by allowing interfaces to be implemented only in the class's own declaration; Scala's implicits and Haskell's orphan instances allow it and pay for it with resolution surprises.</p>

<h2>The standard traits worth knowing</h2>
<div class="tbl"><table>
<tr><th>Trait</th><th>Purpose</th><th>Typical use</th></tr>
<tr><td><code>Debug</code>, <code>Display</code></td><td>Developer and user-facing formatting</td><td>Derive Debug everywhere; implement Display for user-facing types. Hand-write Debug for types holding secrets</td></tr>
<tr><td><code>Clone</code>, <code>Copy</code></td><td>Explicit and implicit duplication</td><td>Copy only for small plain values</td></tr>
<tr><td><code>PartialEq</code>, <code>Eq</code>, <code>PartialOrd</code>, <code>Ord</code>, <code>Hash</code></td><td>Comparison and hashing</td><td>Required by sort, BTreeMap keys, HashMap keys</td></tr>
<tr><td><code>Default</code></td><td>A zero or empty value</td><td>Config structs, <code>..Default::default()</code>, <code>mem::take</code></td></tr>
<tr><td><code>From</code>, <code>Into</code>, <code>TryFrom</code>, <code>TryInto</code></td><td>Conversions</td><td>Implement From; callers get Into. Error conversion for <code>?</code></td></tr>
<tr><td><code>AsRef</code>, <code>Borrow</code>, <code>Deref</code></td><td>Cheap reference conversions</td><td>Flexible parameters; smart pointers. Do not use Deref to fake inheritance</td></tr>
<tr><td><code>Iterator</code>, <code>IntoIterator</code>, <code>FromIterator</code></td><td>Iteration and collect</td><td>Chapter 9</td></tr>
<tr><td><code>Drop</code></td><td>Destructors</td><td>RAII (Chapter 4)</td></tr>
<tr><td><code>Send</code>, <code>Sync</code></td><td>Thread safety, auto-implemented</td><td>Chapter 14</td></tr>
<tr><td><code>Fn</code>, <code>FnMut</code>, <code>FnOnce</code></td><td>Callables</td><td>Closures (Chapter 9)</td></tr>
</table></div>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Java-style class hierarchies with traits.</strong> Traits model capabilities, not "is-a" trees; prefer composition and enums for closed sets of variants.</li>
<li><strong>Trait objects everywhere</strong> "for flexibility" when an enum or a generic would do; you lose inlining and exhaustiveness.</li>
<li><strong>Generic over everything</strong>: long bound lists on application code slow compilation and hurt readability. Generalise where reuse is real.</li>
<li><strong>Using <code>Deref</code> to emulate inheritance</strong> (struct A derefs to B to "inherit" its methods); it confuses method resolution and readers.</li>
<li><strong>Deriving Debug on types with secrets</strong>; the derived impl prints every field into logs.</li>
<li><strong>Deriving <code>Ord</code> without checking field order</strong>: the derived ordering compares fields top to bottom, so reordering struct fields silently changes how values sort. Implement <code>Ord</code> by hand when the order is a business rule.</li>
<li><strong>Calling <code>type_id()</code> or <code>downcast_ref</code> on the wrong layer</strong>: on a <code>Box&lt;dyn Any&gt;</code>, <code>b.type_id()</code> is the Box's own type ID; dereference first (<code>(*b).type_id()</code>) or use <code>b.downcast_ref::&lt;T&gt;()</code>, which does.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Implement Display</summary><p>Implement <code>Display</code> for <code>AccountId(u64)</code> so it prints as <code>ACC-000042</code>.</p><p><em>Answer:</em> <code>impl fmt::Display for AccountId { fn fmt(&amp;self, f: &amp;mut fmt::Formatter) -&gt; fmt::Result { write!(f, "ACC-{:06}", self.0) } }</code></p></details>
<details><summary>Dyn-compatible?</summary><p>Can <code>trait Repo { fn get&lt;T: DeserializeOwned&gt;(&amp;self, id: &amp;str) -&gt; T; }</code> be used as <code>dyn Repo</code>?</p><p><em>Answer:</em> no: a generic method needs a separate copy per T, which a vtable cannot hold. Make the method non-generic (return bytes or a concrete type) or split the trait.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Cloning trait objects</summary><p><code>Clone</code> is not dyn-compatible (<code>clone</code> returns <code>Self</code>). How do you clone a <code>Vec&lt;Box&lt;dyn Rule&gt;&gt;</code>?</p><p><em>Answer:</em> give the trait a method that returns a box. Put it in a helper supertrait, <code>trait CloneRule { fn clone_box(&amp;self) -&gt; Box&lt;dyn Rule&gt;; }</code> with <code>trait Rule: CloneRule</code>, and implement it once for every <code>T: Rule + Clone + 'static</code> as <code>Box::new(self.clone())</code>; then <code>impl Clone for Box&lt;dyn Rule&gt;</code> by calling <code>clone_box</code>. The dyn-clone crate packages this pattern. Often the better answer is <code>Arc&lt;dyn Rule&gt;</code>, which clones by counting.</p></details>
<details><summary>Pluggable fraud rules</summary><p>Design a trait for fraud rules that a service loads from configuration at startup, and evaluate all rules for a transaction, returning the reasons for any hits.</p><p><em>Answer:</em> <code>trait Rule: Send + Sync { fn name(&amp;self) -&gt; &amp;str; fn check(&amp;self, t: &amp;Txn) -&gt; Option&lt;String&gt;; }</code>; store <code>Vec&lt;Box&lt;dyn Rule&gt;&gt;</code> built from config; evaluate with <code>rules.iter().filter_map(|r| r.check(t)).collect()</code>. Dynamic dispatch fits because rules are chosen at runtime; Send + Sync lets the rule set be shared across threads.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Sealing for evolution</summary><p>You publish a crate with <code>pub trait Scheme { fn settle(&amp;self); }</code>. Next release you want to add <code>fn refund(&amp;self)</code> without a default body. Why is that a breaking change, and how would sealing have helped?</p><p><em>Answer:</em> every downstream type implementing <code>Scheme</code> would stop compiling because it lacks <code>refund</code>. If the trait had a private supertrait (<code>pub trait Scheme: sealed::Sealed</code>), no downstream crate could implement it, so adding methods only affects your own implementations. Seal traits that represent a closed set; leave open the ones meant as extension points, and give new methods default bodies.</p></details>
<details><summary>Why the orphan rule?</summary><p>Two crates you depend on each implement <code>Display for Vec&lt;u8&gt;</code>. What would go wrong without the orphan rule?</p><p><em>Answer:</em> the program would have two conflicting implementations and no principled way to choose, and merely adding a dependency could change which one your code uses. The orphan rule makes such conflicts impossible by construction, at the cost of newtype wrappers.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I define traits with required and default methods, associated types and constants.</li>
<li>I write generic functions with bounds, where clauses, impl Trait and const generics.</li>
<li>I choose between static and dynamic dispatch and know what makes a trait dyn-compatible.</li>
<li>I use supertraits, trait upcasting, extension traits and sealed traits, and know how Edition 2024 captures lifetimes in <code>impl Trait</code>.</li>
<li>I understand coherence, the orphan rule and the newtype workaround.</li>
<li>I know which standard traits to derive or implement for a new type.</li>
</ul>
`});

CH.push({
  id: 'ch09', n: 9, title: 'Closures and Iterators',
  lede: 'Closures are functions that capture their environment; iterators are lazy sequences you transform with closures. Together they let you write data processing as a readable pipeline that compiles to a tight loop, the clearest example of Rust\'s zero-cost abstractions. This chapter covers how closures capture, the three closure traits, the iterator protocol and adapters, and writing your own iterators.',
  html: `
<h2>Closures and what they capture</h2>
<p>A closure <code>|args| body</code> can use variables from the scope where it is written. The compiler captures each variable in the least demanding way the body allows: by shared reference if it only reads, by mutable reference if it modifies, by value if it moves the variable out. The <code>move</code> keyword forces capture by value, which you need when the closure outlives the current scope: a thread, a task, a callback stored in a struct.</p>
<div class="tbl"><table>
<tr><th>Trait</th><th>The closure…</th><th>Can be called</th><th>Required by</th></tr>
<tr><td><code>Fn</code></td><td>only reads captured state</td><td>any number of times through a shared reference (so concurrently, if it is also <code>Sync</code>)</td><td>callbacks stored as <code>Arc&lt;dyn Fn…&gt;</code> and shared, rayon's <code>par_iter().map</code>, which calls it from many threads</td></tr>
<tr><td><code>FnMut</code></td><td>mutates captured state</td><td>many times, one call at a time</td><td><code>map</code>, <code>filter</code>, <code>for_each</code>, <code>retain</code>, <code>sort_by</code>: most iterator and slice methods</td></tr>
<tr><td><code>FnOnce</code></td><td>consumes something it captured</td><td>once</td><td><code>thread::spawn</code>, <code>Option::map</code>, <code>unwrap_or_else</code></td></tr>
</table></div>
<p>Every <code>Fn</code> is also <code>FnMut</code>, and every <code>FnMut</code> is <code>FnOnce</code>, so an API should ask for the least demanding bound it can (<code>FnOnce</code> if it calls once, <code>FnMut</code> if it calls repeatedly from one place) to accept the most closures; that is why <code>map</code> and <code>filter</code> take <code>FnMut</code>. Each closure has its own unnamed type, which is why functions take them generically (<code>F: Fn(&amp;T) -&gt; K</code>) or as <code>impl Fn…</code>, and return them as <code>impl Fn…</code> or <code>Box&lt;dyn Fn…&gt;</code>. Since 1.85, <b>async closures</b> (<code>async |x| { … }</code>) and the <code>AsyncFn</code> traits let closures return futures that borrow from their captures.</p>

<h2>The iterator protocol</h2>
<p>An iterator is anything implementing <code>Iterator</code>, whose one required method is <code>fn next(&amp;mut self) -&gt; Option&lt;Self::Item&gt;</code>. Everything else (dozens of provided methods) is built on <code>next</code>. Collections offer three ways in: <code>iter()</code> yields <code>&amp;T</code>, <code>iter_mut()</code> yields <code>&amp;mut T</code>, <code>into_iter()</code> yields <code>T</code> by value and consumes the collection. A <code>for</code> loop calls <code>into_iter()</code> on whatever you give it, so <code>for x in &amp;v</code> borrows and <code>for x in v</code> consumes.</p>
${fig('pull', '<b>Figure 9.1</b> Step through: a lazy iterator chain pulls one element at a time through each adapter.')}
${EX('c09-iter', 'A transaction pipeline: filter, map, sum, scan, partition, windows and collect')}
<div class="tbl"><table>
<tr><th>Kind</th><th>Methods</th></tr>
<tr><td>Adapters (lazy)</td><td><code>map filter filter_map flat_map enumerate zip chain skip take take_while skip_while peekable scan inspect rev step_by cloned copied</code></td></tr>
<tr><td>Consumers</td><td><code>sum product count min max min_by_key max_by_key fold reduce any all find position collect partition for_each last nth</code></td></tr>
<tr><td>Slice helpers</td><td><code>windows chunks chunks_exact array_windows (1.94) split rsplit binary_search sort_by_key</code></td></tr>
</table></div>
<p><code>collect()</code> is driven by the type you ask for: a <code>Vec</code>, <code>HashMap</code>, <code>String</code>, <code>BTreeSet</code>, or even <code>Result&lt;Vec&lt;T&gt;, E&gt;</code>, which stops at the first error. That last form is the idiomatic way to validate a batch.</p>

<h2>Zero-cost, measured</h2>
${EX('c09-bench', 'An index loop against an iterator chain, release build')}
<p>The two run at the same speed: the difference between the lines is measurement noise, and either can come out ahead on a given run. Inspecting the release assembly shows why: the compiler turns both into the same vectorised loop with no bounds checks (it proves <code>i &lt; v.len()</code> for the index loop; the slice iterator never needs a check). This is the general rule: iterator adapters are generic structs whose <code>next</code> methods are inlined into one loop, often auto-vectorised, and they remove bounds checks in cases where the optimiser cannot prove an index is in range. Write the clearest pipeline and trust the optimiser, then measure (Chapter 19) if it matters. For data-parallel work, the rayon crate turns <code>iter()</code> into <code>par_iter()</code> and spreads the same pipeline over all cores (Chapter 14).</p>

<h2>Writing your own iterator</h2>
<p>Implement <code>Iterator</code> with an associated <code>Item</code> type and a <code>next</code> method, as <code>Countdown</code> did in Chapter 8, and your type gets every adapter. For one-off cases, <code>std::iter::from_fn(|| …)</code> and <code>std::iter::successors(first, |prev| …)</code> build iterators from closures. Returning <code>impl Iterator&lt;Item = T&gt;</code> from a method lets callers iterate over internal data without exposing the collection type; in Edition 2024 the returned iterator automatically captures the borrow of <code>self</code> or of an argument, so the <code>+ '_</code> that older code adds is no longer needed.</p>
${R('Paging through an API with from_fn')`
fn all_pages(client: &Client) -> impl Iterator<Item = Result<Page, ApiError>> {
    let mut cursor = Some(String::new());
    std::iter::from_fn(move || {
        let c = cursor.take()?;                          // None once the last page was seen
        Some(client.fetch(&c).inspect(|p| cursor = p.next_cursor.clone()))
    })
}

for page in all_pages(&client) {
    for txn in page?.items { reconcile(txn)?; }
}`}

<h2>Closures and iterators in practice</h2>
<p>Four details account for most surprises. Since Edition 2021 a closure captures only the <b>fields</b> it uses, not the whole struct, so a closure updating <code>acct.balance</code> does not stop you reading <code>acct.id</code>. A table of different closures needs one type, <code>Box&lt;dyn Fn…&gt;</code>. <code>take_while</code> has to pull the first failing item to know it should stop, and that item is then gone; <code>Peekable::next_if</code> looks before it takes. And <code>sum()</code> on integers uses ordinary addition, which panics on overflow in debug builds and wraps silently in release builds, so totals of money should use <code>checked_add</code> through <code>try_fold</code>.</p>
${EX('c09-closures', 'Closure tables, disjoint capture, take_while versus next_if, chunk_by and checked totals')}
<p><code>chunk_by</code> (on slices, stable since 1.77) groups consecutive runs, which is what a statement sorted by date needs; <code>array_windows::&lt;N&gt;()</code> gives fixed-size windows as arrays you can destructure, <code>let [prev, cur] = w</code>. For iterators, <code>DoubleEndedIterator</code> adds <code>rev</code> and <code>next_back</code>, <code>ExactSizeIterator</code> adds <code>len</code>, and <code>fuse</code> guarantees <code>None</code> forever after the first <code>None</code>.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Forgetting that adapters are lazy</strong>: <code>v.iter().map(|x| log(x));</code> does nothing (the compiler warns that the iterator is unused). Use a <code>for</code> loop for side effects.</li>
<li><strong>Collecting just to iterate again</strong>; chain the adapters instead.</li>
<li><strong>Capturing by reference in a closure that must outlive the scope</strong>: add <code>move</code>, and clone an <code>Arc</code> first if several closures need the same data.</li>
<li><strong>Long chains with complex closures</strong>; extract named functions so the pipeline reads as a sentence.</li>
<li><strong><code>sum()</code> over money</strong>: it wraps silently on overflow in release builds. Use <code>try_fold(0i64, |a, &amp;x| a.checked_add(x))</code> over <code>iter()</code> (the start value needs its type: with a bare <code>0</code> the call does not compile) or a checked money type.</li>
<li><strong>Losing an element to <code>take_while</code></strong> when you continue with the same iterator through <code>by_ref()</code>; use <code>peekable</code> and <code>next_if</code>.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Which trait?</summary><p>Which closure trait does <code>let mut n = 0; let mut inc = || n += 1;</code> implement, and why must <code>inc</code> be declared <code>mut</code>?</p><p><em>Answer:</em> <code>FnMut</code>: it mutates captured state. Calling an <code>FnMut</code> needs <code>&amp;mut</code> access to the closure, so the binding must be mutable.</p></details>
<details><summary>iter or into_iter?</summary><p>After <code>for t in txns { … }</code>, can you still use <code>txns</code>?</p><p><em>Answer:</em> no; the loop consumed it. Write <code>for t in &amp;txns</code> to borrow.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Velocity check</summary><p>Given transactions sorted by time with a <code>card</code> and <code>ts</code> (seconds), find cards with more than 3 transactions in any 60-second window.</p><p><em>Answer:</em> group timestamps by card into a <code>HashMap&lt;&amp;str, Vec&lt;u64&gt;&gt;</code> (they stay sorted because the input is); for each card use <code>ts.windows(4).any(|w| w[3] - w[0] &lt; 60)</code>, or <code>array_windows::&lt;4&gt;().any(|[a, _, _, d]| d - a &lt; 60)</code>; collect the cards where it is true. For a live stream, keep a <code>VecDeque</code> of recent timestamps per card and pop from the front anything older than 60 seconds.</p></details>
<details><summary>A fee table</summary><p>Fee rules are configured per payment method at startup, and some rules need parameters (a rate in basis points, a fixed surcharge). How do you store them?</p><p><em>Answer:</em> <code>HashMap&lt;Method, Box&lt;dyn Fn(i64) -&gt; i64 + Send + Sync&gt;&gt;</code>, built from config with closure factories such as <code>fee_at(bps)</code> that <code>move</code> their parameters in. Wrap the map in an <code>Arc</code> to share it across request handlers; <code>Send + Sync</code> on the trait object makes that possible.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why is each closure a different type?</summary><p>Why can't you put two different closures with the same signature in a <code>Vec&lt;impl Fn(i32) -&gt; i32&gt;</code>?</p><p><em>Answer:</em> each closure is a distinct struct holding its captures, with its own size; <code>impl Trait</code> names one concrete type. A vector of different closures needs a uniform type: <code>Vec&lt;Box&lt;dyn Fn(i32) -&gt; i32&gt;&gt;</code>, or plain <code>fn(i32) -&gt; i32</code> pointers if they capture nothing.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know how closures capture and when to use move.</li>
<li>I can choose between Fn, FnMut and FnOnce bounds.</li>
<li>I use iter, iter_mut and into_iter correctly and know adapters are lazy.</li>
<li>I build pipelines with adapters and collect into the type I need, including Result.</li>
<li>I know about disjoint field capture, the take_while trap, and why money totals need checked arithmetic.</li>
<li>I can implement Iterator and build iterators with from_fn and successors.</li>
</ul>
`});

CH.push({
  id: 'ch10', n: 10, title: 'Smart Pointers and Interior Mutability',
  lede: 'Single ownership and compile-time borrowing cover most code. For the rest (recursive data, shared ownership, graphs, caches, global configuration and state shared between threads) the standard library provides smart pointers and interior mutability types. Each one moves a specific check from compile time to runtime, at a specific cost. This chapter shows which to use when.',
  html: `
<h2>Box: one owner, on the heap</h2>
<p><code>Box&lt;T&gt;</code> puts a value on the heap and owns it. Use it for recursive types (an expression tree, a rule set), for trait objects (<code>Box&lt;dyn Error&gt;</code>), to move a large value cheaply, or to shrink an enum with one large variant. A Box has no runtime cost beyond the allocation and the matching free; it is a pointer the compiler knows it owns.</p>

<h2>Rc and Arc: shared ownership</h2>
<p><code>Rc&lt;T&gt;</code> (reference counted) lets several owners share one value; it is freed when the last owner drops. <code>Arc&lt;T&gt;</code> is the same with atomic counters, so it can cross threads. Both give shared, read-only access: you cannot get <code>&amp;mut T</code> out of an <code>Rc</code> while it is shared, because that would break the borrowing rule. <code>Rc::get_mut</code> returns <code>Some</code> only when no other <code>Rc</code> or <code>Weak</code> points to the value, and <code>Rc::make_mut</code> (and <code>Arc::make_mut</code>) implements copy-on-write: it mutates in place when the value is unshared and clones it first when it is not. Cycles of strong references are never freed (a leak, not a safety problem); use <code>Weak</code> for back-pointers.</p>
${fig('rc', '<b>Figure 10.1</b> Step through: strong and weak counts, and why a Weak never dangles.')}

<h2>Interior mutability</h2>
<p>Sometimes a value must be changed through a shared reference: a cache inside an object that is logically read-only, a counter in a rate limiter, shared state behind an <code>Rc</code>. <b>Interior mutability</b> types make this safe by enforcing the rule another way:</p>
<div class="tbl"><table>
<tr><th>Type</th><th>Threads</th><th>How the rule is enforced</th><th>Cost</th></tr>
<tr><td><code>Cell&lt;T&gt;</code></td><td>One</td><td>Never hands out references; only get (Copy) and set or replace</td><td>None</td></tr>
<tr><td><code>RefCell&lt;T&gt;</code></td><td>One</td><td>Counts borrows at runtime; a conflict panics or returns Err from <code>try_borrow_mut</code></td><td>A counter check per borrow</td></tr>
<tr><td><code>OnceCell&lt;T&gt;</code>, <code>LazyCell&lt;T&gt;</code></td><td>One</td><td>Write once, then read only</td><td>A check per access</td></tr>
<tr><td><code>Mutex&lt;T&gt;</code>, <code>RwLock&lt;T&gt;</code></td><td>Many</td><td>Blocking locks; the guard is the only way in. A panic while holding the guard <b>poisons</b> the lock, and later <code>lock()</code> calls return <code>Err</code></td><td>An uncontended lock is a few atomic operations</td></tr>
<tr><td>Atomics (<code>AtomicU64</code> …)</td><td>Many</td><td>Hardware atomic instructions</td><td>Cheapest shared mutation for simple values</td></tr>
<tr><td><code>OnceLock&lt;T&gt;</code>, <code>LazyLock&lt;T&gt;</code></td><td>Many</td><td>Thread-safe write-once</td><td>One atomic load per access after init</td></tr>
</table></div>
${EX('c10-pointers', 'Box, Rc and Weak, Cell and RefCell, Cow and LazyLock')}
<p>Under the hood all of these are built on <code>UnsafeCell</code>, the one primitive that tells the compiler a value behind a shared reference may change. Everything else in the table is a safe wrapper that adds a different rule for when change is allowed.</p>

<h2>Cow: borrow or own</h2>
<p><code>Cow&lt;'a, T&gt;</code> (clone on write) holds either a borrowed reference or an owned value. A function that usually returns its input unchanged but sometimes must modify it returns <code>Cow</code>, and allocates only in the second case. The PAN-masking function in the example borrows for inputs that need no masking and allocates only when it has to. Serde uses the same idea to deserialise strings without copying: a <code>Cow&lt;'a, str&gt;</code> field marked <code>#[serde(borrow)]</code> points into the input buffer unless the JSON string contains escape sequences, in which case it must be decoded into a new String (Chapter 11 shows both cases). Without the attribute, serde always produces <code>Cow::Owned</code>.</p>

<h2>Sharing state in a service</h2>
<p>The pattern behind most "hot-reloadable" configuration in Rust services is <code>RwLock&lt;Arc&lt;Config&gt;&gt;</code>. A reader holds the lock only long enough to clone the <code>Arc</code>, then works with a consistent snapshot for the rest of the request, however long it takes. A writer replaces the Arc, or edits it with <code>Arc::make_mut</code>, which copies the config only if some reader still holds the old version. Immutable shared text is best held as <code>Arc&lt;str&gt;</code>: one allocation, cloning is a counter increment, and it is smaller than a <code>String</code> because it needs no capacity field.</p>
${EX('c10-arc', 'Copy-on-write configuration snapshots with RwLock<Arc<T>>, Arc::make_mut and Arc<str>')}
<p>The output shows both paths of <code>make_mut</code>: while the old snapshot is alive, the update copies (two allocations exist and the shared merchant string has three owners); once nothing else holds the config, the next update happens in place. The scoped threads at the end borrow <code>live</code> directly; Chapter 14 explains why <code>thread::scope</code> makes that safe without an <code>Arc&lt;Live&gt;</code>. If reads are very frequent, the arc-swap crate removes even the brief read lock.</p>

<h2>Choosing</h2>
${fig('pickptr', '<b>Figure 10.2</b> Interactive: answer the questions about a value and get the type to reach for.')}
<div class="note key"><b>In services</b><p>The common shapes in a Rust web service: configuration in an <code>Arc&lt;Config&gt;</code> shared by all handlers; a connection pool (itself an Arc internally); small mutable shared state in <code>Arc&lt;Mutex&lt;T&gt;&gt;</code> held briefly; hot counters as atomics; and anything bigger in a proper store. If you find yourself writing <code>Arc&lt;Mutex&lt;HashMap&lt;…&gt;&gt;&gt;</code> for a large, hot cache, look at sharded maps (dashmap) or a cache crate (moka), or message-passing to an owning task (Chapter 16).</p></div>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong><code>Rc&lt;RefCell&lt;T&gt;&gt;</code> everywhere</strong> to recreate a Java object graph: it compiles, but every borrow is a runtime check that can panic. Prefer clear ownership, indices into a Vec, or message passing.</li>
<li><strong>Holding a <code>RefCell</code> borrow or a <code>MutexGuard</code> across a call</strong> that borrows the same cell again: a runtime panic or a deadlock.</li>
<li><strong>Holding a <code>std::sync::MutexGuard</code> across an <code>.await</code></strong>: the future stops being <code>Send</code>, so a multi-threaded runtime rejects it, and where it does compile (a single-threaded runtime) a second task that asks for the lock blocks the only executor thread, so the task holding the guard can never resume: a deadlock. Take what you need, drop the guard, then await (Chapter 16).</li>
<li><strong>Ignoring poisoning</strong> by sprinkling <code>lock().unwrap()</code> without a decision. A poisoned lock means a thread panicked mid-update; either propagate the panic deliberately (<code>expect("…poisoned")</code>, as the example does) or recover with <code>PoisonError::into_inner</code> when you can check or repair the data, or when no update can leave it half-done.</li>
<li><strong>Reference cycles</strong> with strong pointers, which leak.</li>
<li><strong>Using Arc where a borrow would do</strong>: scoped threads and structured async can borrow; Arc is for when lifetimes really are dynamic.</li>
<li><strong>Global mutable state</strong> in <code>static Mutex</code>: it makes tests interfere and hides dependencies. Pass state explicitly.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Pick a pointer</summary><p>An immutable list of currency rules is loaded at startup and read by every request handler on a multi-threaded server. What type?</p><p><em>Answer:</em> <code>Arc&lt;Rules&gt;</code> passed to handlers (or a <code>static RULES: LazyLock&lt;Rules&gt;</code> if it never changes and has no inputs).</p></details>
<details><summary>Count it</summary><p>After <code>let a = Rc::new(1); let b = a.clone(); let w = Rc::downgrade(&amp;a); drop(a);</code> what are the strong and weak counts?</p><p><em>Answer:</em> strong 1 (b), weak 1 (w).</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Hot-reloadable config</summary><p>Configuration must be replaceable at runtime without blocking readers for long. Design it.</p><p><em>Answer:</em> store <code>RwLock&lt;Arc&lt;Config&gt;&gt;</code> (or the arc-swap crate's <code>ArcSwap&lt;Config&gt;</code>). Readers take the lock just long enough to clone the inner Arc and then use their snapshot; the reloader builds a new Config and swaps the Arc. Old snapshots stay valid until their last reader drops them.</p></details>
<details><summary>Predict make_mut</summary><p>In <code>c10-arc</code>, what would "updated in place?" print if the code kept a snapshot alive across the second update, for example with <code>let held = live.snapshot();</code> just before it?</p><p><em>Answer:</em> <code>false</code>. The held snapshot raises the strong count to 2, so <code>make_mut</code> must clone the config rather than change data a reader can see; <code>held</code> keeps v2 and the store moves to a new allocation for v3.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why is Rc not Send?</summary><p>What would go wrong if an <code>Rc</code> could be sent to another thread?</p><p><em>Answer:</em> two threads could clone or drop their Rcs at the same time; the non-atomic increments and decrements of the count would race, losing updates, so the value could be freed while still in use or never freed. The compiler prevents this because Rc does not implement Send (Chapter 14).</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I use Box for heap allocation, recursive types and trait objects.</li>
<li>I use Rc and Arc for shared ownership and Weak to break cycles.</li>
<li>I can choose between Cell, RefCell, Mutex, RwLock, atomics and the once types.</li>
<li>I use Cow to avoid needless allocation, and <code>make_mut</code> for copy-on-write sharing.</li>
<li>I can build snapshot-style shared configuration and decide how to handle lock poisoning.</li>
<li>I recognise when smart pointers signal a design problem.</li>
</ul>
`});

CH.push({
  id: 'ch11', n: 11, title: 'Collections, Strings and Text',
  lede: 'Most programs spend their time in a few collections and a lot of string handling. Rust\'s standard collections are fast and predictable, and its strings are always valid UTF-8, which makes text handling correct by default but different from Java\'s and Go\'s. This chapter covers Vec and its growth, maps and sets, queues and heaps, String and &str, formatting, and serialisation with serde.',
  html: `
<h2>Vec: the default collection</h2>
<p><code>Vec&lt;T&gt;</code> is a growable array: pointer, capacity and length, with elements stored contiguously on the heap. Contiguity is what makes it fast: iteration is a linear scan the CPU prefetches, and sorting, searching and binary search work on the underlying slice. When a push exceeds capacity, the Vec reallocates to double the capacity (at least 4 elements for most types, 8 for bytes) and moves the elements, so pushes are amortised constant time.</p>
${fig('vecgrow', '<b>Figure 11.1</b> Interactive: how many reallocations a Vec makes as it grows, and what reserving up front saves.')}
<p>If you know the final size, <code>Vec::with_capacity(n)</code> or <code>reserve(n)</code> avoids every reallocation; <code>shrink_to_fit</code> returns slack memory after a build-up. Removing from the front is O(n) because everything shifts; use <code>VecDeque</code> for queues, or <code>swap_remove</code> when order does not matter.</p>
${EX('c11-collections', 'Vec, HashMap entry, BTreeMap ranges, HashSet, VecDeque and BinaryHeap')}

<h2>Maps, sets and the rest</h2>
<div class="tbl"><table>
<tr><th>Type</th><th>Use for</th><th>Notes</th></tr>
<tr><td><code>HashMap&lt;K, V&gt;</code>, <code>HashSet&lt;T&gt;</code></td><td>Lookup by key, membership</td><td>SwissTable design; default hasher is SipHash-1-3 with random keys, resistant to hash-flooding attacks from untrusted keys. Iteration order is arbitrary and differs between runs</td></tr>
<tr><td><code>BTreeMap</code>, <code>BTreeSet</code></td><td>Sorted keys, range queries, deterministic iteration</td><td>An order book, time-bucketed aggregates, reproducible output</td></tr>
<tr><td><code>VecDeque&lt;T&gt;</code></td><td>Queues, sliding windows</td><td>Ring buffer; push and pop at both ends in O(1)</td></tr>
<tr><td><code>BinaryHeap&lt;T&gt;</code></td><td>Priority queues, top-k</td><td>Max-heap; wrap in <code>Reverse</code> for a min-heap</td></tr>
<tr><td><code>LinkedList&lt;T&gt;</code></td><td>Almost never</td><td>Poor cache behaviour; a Vec or VecDeque is nearly always faster</td></tr>
</table></div>
<p>The <b>entry API</b> (<code>map.entry(k).or_insert(v)</code>, <code>.or_default()</code>, <code>.and_modify(…)</code>) does a read-modify-write with one hash lookup and no borrow-checker trouble. When keys are trusted and speed matters (integers, internal IDs), a faster non-cryptographic hasher such as <code>foldhash</code> or <code>rustc-hash</code> is a common drop-in (<code>HashMap::with_hasher</code>); never use one for keys an attacker controls.</p>

<h2>Strings</h2>
<p>Rust has two main string types. <code>String</code> is an owned, growable buffer; <code>&amp;str</code> is a borrowed view into UTF-8 bytes owned by something else. Both are <b>guaranteed valid UTF-8</b>; every way of creating one either checks (<code>String::from_utf8</code>) or is correct by construction. Functions take <code>&amp;str</code> and return <code>String</code> when they create new text.</p>
${fig('utf8', '<b>Figure 11.2</b> Interactive: type any text and see its UTF-8 bytes, byte offsets, characters and grapheme clusters.')}
${EX('c11-strings', 'UTF-8, character boundaries, capacity and common string operations')}
<ul>
<li><code>len()</code> is in <b>bytes</b>. <code>chars()</code> yields Unicode scalar values; what a user perceives as one character (a flag, a family emoji, a letter with combining accents) can be several. For user-visible text use the unicode-segmentation crate.</li>
<li>Comparing names needs more than <code>==</code>. "Zoë" can be stored as one code point (U+00EB) or as "e" plus a combining diaeresis, and the two are different bytes; normalise both sides first (NFC or, for matching, NFKC, with the unicode-normalization crate). <code>to_lowercase</code> is not full case folding either (<code>"STRASSE"</code> and <code>"straße"</code> do not compare equal after lowercasing). Name screening and deduplication need normalisation and folding, usually from ICU4X; <code>eq_ignore_ascii_case</code> is for protocol tokens only.</li>
<li>Slicing <code>&amp;s[a..b]</code> uses byte offsets and panics if an offset is inside a multi-byte character; <code>s.get(a..b)</code> returns <code>None</code> instead. Offsets from <code>find</code>, <code>char_indices</code> and <code>split_once</code> are always on boundaries.</li>
<li>Other string types: <code>OsString</code>/<code>OsStr</code> for platform strings (environment variables, file names, which need not be UTF-8), <code>PathBuf</code>/<code>Path</code> for paths, <code>CString</code>/<code>CStr</code> for NUL-terminated C strings, <code>Vec&lt;u8&gt;</code> or the <code>bytes</code> crate for binary data.</li>
<li>Formatting: <code>format!</code>, <code>write!</code> and <code>println!</code> share one syntax (<code>{name}</code>, <code>{:&gt;10}</code>, <code>{:+}</code>, <code>{:08.3}</code>, <code>{:#x}</code>, <code>{:?}</code>, <code>{:#?}</code>), checked at compile time. Since 1.98, integers can format into a stack buffer with <code>format_into</code> and <code>NumBuffer</code>, avoiding allocation in hot logging paths.</li>
</ul>
<div class="note key"><b>Java and Go readers</b><p>Java's <code>String</code> is UTF-16 code units, so <code>length()</code> counts surrogate halves; Go's <code>string</code> is arbitrary bytes that are usually UTF-8. Rust's choice of always-valid UTF-8 removes a class of encoding bugs at the boundary: invalid input is rejected or replaced (<code>from_utf8_lossy</code>) once, when it enters, and never travels further. Text arriving as UTF-16 from a JVM or Windows API converts with <code>String::from_utf16</code>, or from raw bytes with <code>from_utf16le</code> and <code>from_utf16be</code> (stable since 1.98).</p></div>
<p>The example also parses an amount. Money never belongs in <code>f64</code>: binary floating point cannot represent 0.10 exactly, as the <code>0.1 + 0.2</code> line shows. Parse into integer minor units as <code>parse_minor</code> does, rejecting anything with more decimals than the currency allows, or use a decimal type such as rust_decimal when you need arithmetic on fractional values (rates, FX).</p>

<h2>Serialisation with serde</h2>
<p>Almost every Rust program that talks to the outside world uses <b>serde</b>: <code>#[derive(Serialize, Deserialize)]</code> on your types, plus a format crate (<code>serde_json</code>, <code>toml</code>, <code>csv</code>, <code>rmp-serde</code> for MessagePack, <code>postcard</code> or <code>bitcode</code> for compact binary). Check a format crate's maintenance status like any dependency: the original <code>serde_yaml</code> is archived and marked deprecated, and <code>bincode</code> was declared permanently unmaintained in RUSTSEC-2025-0141. <code>cargo deny</code> flags only crates with an advisory: it catches bincode, and serde_yaml's best-known fork <code>serde_yml</code> (RUSTSEC-2025-0068, unsound and unmaintained), but not serde_yaml itself, so an archived crate with no advisory still needs a human check. Serde generates code at compile time, with no reflection, so it is both fast and type-checked; deserialising into a struct validates structure as it parses.</p>
${EX('c11-serde', 'Serde attributes you will use in an API, and what strict deserialisation rejects')}
<p><code>deny_unknown_fields</code> rejects payloads with unexpected keys, useful for strict APIs and a cheap defence against mass-assignment tricks such as an injected <code>"isAdmin": true</code>. An internally tagged enum maps the common JSON shape <code>{"type": "UPI", "vpa": "…"}</code> to a Rust enum, so the handler gets an exhaustively matchable value instead of a bag of optional fields, and an unknown <code>type</code> fails at the boundary. Because <code>amount_minor</code> is an <code>i64</code>, <code>1250.5</code> is rejected rather than rounded. Note that <code>deny_unknown_fields</code> applies only to the struct it is on (not to the enum's variants here) and cannot be combined with <code>#[serde(flatten)]</code>. The error messages name fields and positions, and some quote the offending value (the float above, an unknown variant), so treat them as potentially sensitive before logging a rejected payment payload.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Indexing strings by position</strong> as in Java; use char iteration or byte offsets from search functions.</li>
<li><strong><code>&amp;String</code> and <code>&amp;Vec&lt;T&gt;</code> parameters</strong>: take <code>&amp;str</code> and <code>&amp;[T]</code>.</li>
<li><strong>Relying on HashMap iteration order</strong> in tests or output; it changes between runs. Use BTreeMap or sort.</li>
<li><strong>Repeated <code>s = s + &amp;x</code> or <code>format!</code> in loops</strong>; push onto one String with reserved capacity.</li>
<li><strong>Converting <code>OsString</code> paths with <code>to_str().unwrap()</code></strong>; non-UTF-8 file names exist.</li>
<li><strong>Money in <code>f64</code></strong>, in Rust types or in JSON. Use integer minor units or a decimal type, and a decimal string in JSON if a client might parse numbers as doubles.</li>
<li><strong>Comparing user-entered names byte for byte</strong>; normalise Unicode first.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Lengths</summary><p>What do <code>"₹".len()</code> and <code>"₹".chars().count()</code> return?</p><p><em>Answer:</em> 3 and 1. The rupee sign is U+20B9, three bytes in UTF-8.</p></details>
<details><summary>Pick the collection</summary><p>You need the 10 largest transactions from a stream of millions without storing them all. Which collection?</p><p><em>Answer:</em> a <code>BinaryHeap&lt;Reverse&lt;i64&gt;&gt;</code> capped at 10: push each amount and pop the smallest whenever the size exceeds 10.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A merchant summary</summary><p>From a slice of <code>(merchant: &amp;str, amount: i64)</code>, produce a report sorted by total descending, with merchant names padded to 12 characters and amounts right-aligned with two decimals.</p><p><em>Answer:</em> fold into a <code>HashMap&lt;&amp;str, i64&gt;</code> with the entry API, collect into a Vec, <code>sort_by_key(|&amp;(_, t)| Reverse(t))</code>, then <code>println!("{m:&lt;12}{:&gt;12}.{:02}", t / 100, t % 100)</code>. That split is right only for non-negative totals; if refunds can make a total negative, format the sign separately, as <code>Money</code>'s <code>Display</code> does in Chapter 8.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Hash flooding</summary><p>Why does Rust's default HashMap use a keyed hash instead of a faster one, and when is it safe to switch?</p><p><em>Answer:</em> with a fixed, known hash function an attacker can submit many keys that collide, turning O(1) lookups into O(n) and a request into a CPU denial of service. SipHash keyed with random values chosen at runtime prevents that. Switching is safe when keys cannot be chosen by an attacker (internal integer IDs, compile-time data).</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I understand Vec growth and reserve capacity when I know sizes.</li>
<li>I choose between HashMap, BTreeMap, VecDeque, BinaryHeap and sets for a task.</li>
<li>I handle UTF-8 strings correctly: bytes, chars, boundaries and the other string types.</li>
<li>I use format strings fluently and avoid needless allocation.</li>
<li>I can model JSON APIs with serde derives and attributes, and keep money out of floating point.</li>
</ul>
`});

FIG.semver = host => {
  const AV = ['0.2.9', '0.3.0', '0.3.7', '1.1.0', '1.2.0', '1.2.3', '1.2.9', '1.3.0', '1.9.4', '2.0.0', '2.1.0-rc.1'];
  host.innerHTML = `<div class="tool"><label for="sv-r">version requirement in Cargo.toml</label><input class="txt" id="sv-r" value="1.2.3"><div class="btns">${['1.2.3', '~1.2.3', '=1.2.3', '>=1.2, <1.5', '1.*', '0.3', '0.3.0', '2.1.0-rc.1'].map(r => `<button type="button" class="act" data-r="${r}">${r}</button>`).join('')}</div><div id="sv-o" style="margin-top:10px"></div></div>`;
  const P = v => { const [core, pre] = v.split('-'); const [a, b, c] = core.split('.').map(Number); return { a, b: b ?? null, c: c ?? null, pre: pre || null }; };
  const cmp = (x, y) => (x.a - y.a) || ((x.b || 0) - (y.b || 0)) || ((x.c || 0) - (y.c || 0)) || (x.pre && !y.pre ? -1 : !x.pre && y.pre ? 1 : 0);
  const one = (req, v) => {
    req = req.trim(); let m = req.match(/^(\^|~|=|>=|<=|>|<)?\s*([\d.*]+(?:-[\w.]+)?)$/); if (!m) return null;
    let [, op, ver] = m; op = op || '^';
    if (ver.includes('*')) { const r = P(ver.replace(/\.\*/g, '')); return v.a === r.a && (r.b === null || v.b === r.b) && !v.pre; }
    const r = P(ver);
    if (v.pre && !(r.pre && v.a === r.a && v.b === r.b && v.c === r.c)) return false;
    const c = cmp(v, { a: r.a, b: r.b || 0, c: r.c || 0, pre: r.pre });
    if (op === '=') return v.a === r.a && (r.b === null || v.b === r.b) && (r.c === null || v.c === r.c) && v.pre === r.pre;
    if (op === '>=') return c >= 0; if (op === '>') return c > 0; if (op === '<') return c < 0; if (op === '<=') return c <= 0;
    if (op === '~') return c >= 0 && v.a === r.a && (r.b === null || v.b === r.b);
    if (c < 0) return false;
    if (r.a > 0 || r.b === null) return v.a === r.a;
    if (r.b > 0 || r.c === null) return v.a === 0 && v.b === r.b;
    return v.a === 0 && v.b === 0 && v.c === r.c;
  };
  const draw = () => {
    const req = host.querySelector('#sv-r').value; const parts = req.split(',');
    const res = AV.map(v => { const pv = P(v); const ok = parts.map(p => one(p, pv)); return [v, ok.includes(null) ? null : ok.every(Boolean)]; });
    if (res.some(r => r[1] === null)) { host.querySelector('#sv-o').innerHTML = '<div class="out"><span class="d">cannot parse that requirement</span></div>'; return; }
    const chosen = res.filter(r => r[1]).map(r => r[0]).pop();
    let s = ''; res.forEach(([v, ok], i) => { const x = 6 + (i % 6) * 104, y = 6 + Math.floor(i / 6) * 40; s += rect(x, y, 96, 30, 'cell ' + (v === chosen ? 'acc' : ok ? 'ok' : 'dim'), 5) + tx(x + 48, y + 15, v, 'ti'); });
    host.querySelector('#sv-o').innerHTML = svgw(632, 90, s, 'Published versions') + `<div class="out">${chosen ? `matches ${res.filter(r => r[1]).length} published version(s); a fresh <code>cargo update</code> picks <b>${chosen}</b>` : '<span class="d">no published version matches: resolution fails</span>'}</div>`;
  };
  host.querySelector('#sv-r').addEventListener('input', draw);
  host.querySelector('.btns').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { host.querySelector('#sv-r').value = b.dataset.r; draw(); } });
  draw();
};

CH.push({
  id: 'ch12', n: 12, title: 'Crates, Cargo and the Supply Chain',
  lede: 'Cargo is one of the reasons people stay with Rust: one tool builds, tests, documents, benchmarks and publishes every project the same way. This chapter covers modules and visibility, crates and workspaces, Cargo.toml, features, semantic versioning and resolution, build scripts, and the supply-chain controls a regulated organisation needs around crates.io.',
  html: `
<h2>Packages, crates and modules</h2>
<ul>
<li>A <b>crate</b> is one compilation unit: a library (<code>src/lib.rs</code>) or a binary (<code>src/main.rs</code>, or each file in <code>src/bin/</code>).</li>
<li>A <b>package</b> is a directory with a <code>Cargo.toml</code>, containing at most one library crate and any number of binaries, examples, tests and benchmarks.</li>
<li>A <b>module</b> is a namespace inside a crate: <code>mod rules;</code> loads <code>rules.rs</code> or <code>rules/mod.rs</code>. Items are private to their module unless marked <code>pub</code>; <code>pub(crate)</code> exposes them within the crate only, and <code>pub(super)</code> to the parent.</li>
<li>A <b>workspace</b> groups packages that share one <code>Cargo.lock</code> and one <code>target/</code> directory, with shared versions, dependencies and lint settings.</li>
</ul>
${EX('c12-workspace', 'A two-crate workspace: a pure domain library and a CLI')}
<p>Splitting a system into a <b>core</b> library with no I/O and thin adapters (a CLI, an HTTP service, a Python module) is the most useful structural habit in Rust. The core is fast to compile and test, has no async or framework dependencies, and is reusable. Separate crates also compile in parallel and recompile independently, which matters for build times (Chapter 19). Notice the doctest in <code>apply</code>'s documentation: examples in doc comments are compiled and run by <code>cargo test</code>, so documentation cannot drift from the code.</p>

<h2>Cargo.toml</h2>
${EX('c12-features', 'Features, rust-version and lint configuration', { cmd: 'cargo run -q && cargo run -q --features audit,fast-hash' })}
<div class="tbl"><table>
<tr><th>Key</th><th>What it does</th></tr>
<tr><td><code>edition</code></td><td>Language edition for this crate</td></tr>
<tr><td><code>rust-version</code></td><td>Minimum supported Rust version (MSRV). The default resolver in Edition 2024 ("resolver 3") prefers dependency versions compatible with it. A virtual workspace root has no edition, so it must say <code>resolver = "3"</code> itself, as the workspace example does</td></tr>
<tr><td><code>publish</code></td><td><code>publish = false</code> stops an internal crate being pushed to crates.io by accident; <code>publish = ["internal"]</code> allows only your own registry</td></tr>
<tr><td><code>[dependencies]</code>, <code>[dev-dependencies]</code>, <code>[build-dependencies]</code></td><td>Normal, test-only and build-script-only dependencies; <code>[target.'cfg(unix)'.dependencies]</code> for platform-specific ones</td></tr>
<tr><td><code>[features]</code></td><td>Named, additive compile-time options; dependencies can be optional and enabled by a feature (<code>dep:name</code>)</td></tr>
<tr><td><code>[lints]</code></td><td>Lint levels for rustc (<code>[lints.rust]</code>), clippy (<code>[lints.clippy]</code>) and Cargo itself (<code>[lints.cargo]</code>), for the package or, through <code>[workspace.lints]</code>, the whole workspace</td></tr>
<tr><td><code>[workspace.dependencies]</code></td><td>One version for each shared dependency; members write <code>serde.workspace = true</code></td></tr>
<tr><td><code>[profile.*]</code></td><td>Optimisation level, debug info, LTO, codegen units, panic strategy, overflow checks</td></tr>
<tr><td><code>[patch]</code></td><td>Override a dependency everywhere in the graph (a local fork, a security fix not yet released)</td></tr>
</table></div>
<p>Features must be <b>additive</b>: Cargo unifies them, so if two crates in your graph enable different features of the same dependency, it is built once with both. A feature that removes functionality or changes behaviour incompatibly will break someone. Since 1.100 Cargo also warns about <b>unused dependencies</b> (the <code>cargo::unused_dependencies</code> lint). It fires only when a build includes every target that could use the dependency, so <code>cargo check --bin foo</code> stays quiet, and it never fires for dev-dependencies. It can misfire on an entry that exists only to pin the version of, or enable a feature on, a transitive dependency; for a pin, Cargo's documentation suggests moving it to a <code>[target.'cfg(false)'.dependencies]</code> table. Each unused crate is still downloaded, compiled and shipped in your SBOM, so it is worth turning into an error in CI:</p>
${T('Cargo.toml (Cargo 1.100)')`
[lints.cargo]
unused_dependencies = "deny"`}

<h2>Versions and resolution</h2>
<p>Crates follow semantic versioning, with a Rust twist for 0.x versions: the leftmost non-zero component is treated as the major version. A bare requirement such as <code>serde = "1.0.200"</code> is a <b>caret</b> requirement, meaning "1.0.200 or any later 1.x". Cargo picks the newest compatible version when it first resolves, writes it to Cargo.lock, and keeps it until you run <code>cargo update</code>. Two incompatible major versions of the same crate can coexist in one build (they are different crates to the compiler), which avoids dependency hell at some cost in binary size.</p>
${fig('semver', '<b>Figure 12.1</b> Interactive: type a version requirement and see which published versions it accepts and which one Cargo picks.')}
<p>For your own libraries, run <code>cargo semver-checks</code> before publishing: it compares the public API with the last release and fails if you are about to ship a breaking change under a minor version bump. Breaking changes include removing items, adding a required trait method, adding a variant to an exhaustive public enum and changing a function signature.</p>

<h2>Build scripts and native code</h2>
<p>A <code>build.rs</code> file is compiled and run before the crate is built. It can compile C code with the <code>cc</code> crate, generate Rust bindings with bindgen, generate code from protobuf definitions (tonic and prost do this), and tell Cargo how to link (<code>cargo::rustc-link-lib=…</code>). Build scripts and procedural macros run arbitrary code on the developer's and CI machines at build time, which is a supply-chain consideration in itself.</p>

<h2>The supply chain</h2>
${fig('supply', '<b>Figure 12.2</b> Step through: controls around third-party crates, from selection to production.')}
${T('.cargo/config.toml: organisation defaults (Cargo 1.100)')`
[registry]
global-min-publish-age = "3 days"    # ignore releases younger than this when resolving
                                     # (versions already in Cargo.lock are kept)

[source.vetted-mirror]
registry = "sparse+https://crates.example.internal/index/"   # internal mirror of crates.io;
                                     # it must serve pubtime for the age check to apply

[source.crates-io]
replace-with = "vetted-mirror"       # all crates.io traffic goes through the mirror

[net]
git-fetch-with-cli = true`}
${T('deny.toml: policy checked in CI with cargo deny check')`
[advisories]
yanked = "deny"
unmaintained = "all"                 # the default, stated explicitly: fail on abandoned crates too
ignore = [
  # every exception states why, and lapses on its own (duration counted from the advisory date)
  # { id = "RUSTSEC-0000-0000", reason = "not reachable: we never parse untrusted input with it", expiry = "P30D" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "ISC", "Unicode-3.0"]

[bans]
multiple-versions = "warn"
deny = [{ crate = "openssl", reason = "use rustls with aws-lc-rs" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"`}
<p>When resolution fails because every matching version is too new (a fix you need was released yesterday), override the age check for one deliberate update, not globally: <code>CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p some-crate --precise 1.2.4</code>. The cooldown does not apply to <code>cargo install</code>, so pin tools to an exact version: <code>cargo install tool@1.2.3</code>. Since 1.100 it builds with the lockfile published inside the crate by default, so <code>--locked</code> is no longer needed there (keep it for older toolchains).</p>

<h2>Reproducible and offline builds</h2>
<p>Three flags control how far Cargo may stray from the lockfile. <code>--locked</code> fails if Cargo.lock would need to change; <code>--offline</code> forbids network access and uses only what is already downloaded; <code>--frozen</code> is both. For a build environment with no internet access, which is common inside a cardholder data environment, <code>cargo vendor</code> copies every dependency's source into a directory and prints the <code>[source]</code> replacement to add to <code>.cargo/config.toml</code>; the vendored tree can be reviewed, archived with the release and built with <code>--frozen</code>. <code>cargo fetch --locked</code> is the lighter alternative: download once in an early CI stage, then build offline.</p>

<div class="note key"><b>For PCI DSS and SOC 2</b><p>PCI DSS v4.0.1 requirement 6.3.1 asks you to identify vulnerabilities from recognised industry sources, 6.3.2 for an inventory of bespoke and custom software and the third-party components incorporated into it, and 6.3.3 for patching known vulnerabilities in time (patches for critical vulnerabilities within one month of release, others within a period set by your risk ranking). The RustSec database checked by <code>cargo deny</code> or <code>cargo audit</code> on every build is such a source; a committed Cargo.lock, <code>cargo auditable</code> builds and an SBOM per release are the inventory; documented, expiring exceptions in <code>deny.toml</code> and an internal mirror with a publish-age delay show the process. Publish your own crates with crates.io trusted publishing (short-lived tokens from GitHub Actions' or GitLab.com CI's OIDC identity, no stored API token) and enable trusted-publishing-only mode so a leaked token cannot publish a release.</p></div>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Not committing Cargo.lock</strong>, so builds differ between CI runs and between developers.</li>
<li><strong>Non-additive features</strong> such as <code>no-tls</code> that disable something another crate needs.</li>
<li><strong>Depending on a git branch</strong> in production: it moves. Pin a revision, or publish to your registry.</li>
<li><strong>Dependency sprawl</strong>: hundreds of crates for a small service lengthen builds and widen the attack surface. Review <code>cargo tree -d</code> for duplicates and question each new dependency.</li>
<li><strong>Typosquatting</strong>: check the exact crate name and owner before adding one; malicious look-alike crates have been published and removed from crates.io.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>What does "0.3" mean?</summary><p>Which versions does <code>tower = "0.3"</code> accept?</p><p><em>Answer:</em> 0.3.0 up to but not including 0.4.0. For 0.x versions the minor number acts as the major.</p></details>
<details><summary>Visibility</summary><p>A helper in <code>src/rules.rs</code> should be callable from anywhere in the crate but not by users of the library. How do you declare it?</p><p><em>Answer:</em> <code>pub(crate) fn helper()</code>.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Set up CI checks</summary><p>List the commands a CI pipeline for a Rust service should run on every pull request.</p><p><em>Answer:</em> <code>cargo fmt --check</code>; <code>CARGO_BUILD_WARNINGS=deny cargo clippy --all-targets --all-features --locked</code> (the <code>build.warnings</code> setting, stable since 1.97, fails the build on warnings without the cache-busting <code>RUSTFLAGS=-Dwarnings</code>); <code>cargo test --locked</code> (or cargo nextest); <code>cargo deny check</code>; <code>cargo semver-checks</code> for published libraries; and on release, <code>cargo auditable build --release --locked</code> plus SBOM generation and signing.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>A cooldown blocks a security fix</summary><p>RustSec announces a vulnerability in a crate you use; the fixed version was published six hours ago, and your config has <code>global-min-publish-age = "3 days"</code>. What do you do, and what do you record?</p><p><em>Answer:</em> update just that crate with the age check overridden for one command, <code>CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p the-crate --precise &lt;fixed version&gt;</code>, review the diff of the release (and of any new transitive dependencies the update pulls in), and commit the lockfile change with a reference to the advisory. That leaves the policy in place for everything else and gives an auditor a dated, reviewed exception.</p></details>
<details><summary>Why can two versions coexist?</summary><p>Your graph contains <code>http 0.2</code> and <code>http 1.x</code>. Why does it compile, and when does it cause errors?</p><p><em>Answer:</em> each major version is a separate crate with its own types, so both can be linked. Errors appear when a type from one is passed to an API expecting the other ("expected http::Request, found http::Request" from different versions). The fix is to upgrade the dependency still on 0.2, or to convert at the boundary.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I structure code into modules, crates and workspaces with deliberate visibility.</li>
<li>I configure Cargo.toml: edition, MSRV, dependencies, features, lints and profiles.</li>
<li>I understand caret requirements, 0.x semantics, the lockfile and duplicate versions.</li>
<li>I know what build scripts and proc macros can do at build time.</li>
<li>I can put supply-chain controls in place: lockfile, cooldowns, audit, deny, vet, SBOM and a mirror.</li>
<li>I can build reproducibly and offline with --locked, --frozen and cargo vendor.</li>
</ul>
`});

CH.push({
  id: 'ch13', n: 13, title: 'Macros',
  lede: 'Macros are Rust\'s compile-time code generation. Declarative macros (macro_rules!) match token patterns and expand them; procedural macros are Rust programs that read and write token streams, powering #[derive(Serialize)], #[tokio::main] and SQL checked at compile time. This chapter shows how both work, when to write one, and when a function or generic would be better.',
  html: `
<h2>Why Rust has macros</h2>
<p>Some things cannot be written as functions: variable numbers of arguments with different types (<code>println!</code>), new syntax (<code>vec![…]</code>), generating a trait implementation from a struct definition (<code>derive</code>), checking a format string or a SQL query at compile time. Macros fill those gaps. Unlike C preprocessor macros, Rust macros operate on parsed tokens, respect hygiene, and expand to code that is then fully type-checked. The <code>!</code> in <code>println!</code> marks an invocation, so a reader always knows when code is being generated.</p>

<h2>Declarative macros</h2>
${EX('c13-macros', 'hashmap!, a newtype generator and a recursive counter')}
${fig('expand', '<b>Figure 13.1</b> Step through: matching, transcription and hygiene for the hashmap! macro.')}
<p>A <code>macro_rules!</code> macro is a list of rules, each a pattern and a template. Patterns use <b>fragment specifiers</b> and repetition (<code>$( … ),*</code> for zero or more separated by commas, <code>+</code> for one or more, <code>?</code> for optional). The <code>id_type!</code> macro generates a full type with a constructor and a <code>Display</code> implementation for each name, which removes a page of boilerplate per identifier type without hiding anything a reader cannot see in the macro definition. It also shows the limit of <code>macro_rules!</code> hygiene: local variables introduced by a macro (the <code>m</code> inside <code>hashmap!</code>) are invisible to the caller, but items it defines (the <code>AccountId</code> struct) are ordinary items in the caller's module, which is exactly what a type generator needs. Use <code>#[macro_export]</code> to make a macro available to other crates; it is then exported at the crate root, and its body should name your crate's items as <code>$crate::…</code>.</p>
<div class="tbl"><table>
<tr><th>Fragment</th><th>Matches</th></tr>
<tr><td><code>expr</code></td><td>An expression: <code>a + 1</code>, <code>f(x)</code>, <code>"UPI"</code>. In Edition 2024 it also matches <code>_</code> and <code>const { … }</code>; <code>expr_2021</code> keeps the old behaviour</td></tr>
<tr><td><code>ident</code></td><td>An identifier: a type, function or variable name</td></tr>
<tr><td><code>ty</code>, <code>path</code></td><td>A type such as <code>Vec&lt;u8&gt;</code>; a path such as <code>std::io::Error</code></td></tr>
<tr><td><code>literal</code></td><td>A literal: <code>"ACC-"</code>, <code>42</code></td></tr>
<tr><td><code>tt</code></td><td>Any single token tree: the escape hatch for custom syntax</td></tr>
<tr><td><code>block</code>, <code>stmt</code>, <code>pat</code>, <code>pat_param</code>, <code>item</code>, <code>lifetime</code>, <code>vis</code>, <code>meta</code></td><td>The corresponding syntactic pieces (<code>pat_param</code> is a pattern without top-level <code>|</code>, for closure-like syntax)</td></tr>
</table></div>

<h2>Procedural macros</h2>
<p>A procedural macro is a function from <code>TokenStream</code> to <code>TokenStream</code>, compiled into a special crate (<code>proc-macro = true</code>) and run by the compiler. There are three kinds: <b>derive</b> macros (<code>#[derive(Describe)]</code>), <b>attribute</b> macros (<code>#[tokio::main]</code>, <code>#[instrument]</code>, <code>#[get("/")]</code>), and <b>function-like</b> macros (<code>sqlx::query!(…)</code>). Almost all are written with two crates: <code>syn</code> parses tokens into a syntax tree, and <code>quote</code> builds the output with a template syntax.</p>
${EX('c13-derive', 'A derive macro that redacts fields marked #[secret]')}
<p>This derive is a realistic example for regulated systems: a <code>describe()</code> method for logs that cannot leak fields marked <code>#[secret]</code>, because the redaction is generated from the type definition rather than remembered by each caller. Three habits of production derives are visible in it. Errors are reported with <code>syn::Error::new_spanned</code>, which points the compiler error at the user's code rather than at the macro. <code>split_for_impl</code> carries the struct's generic parameters and where clause onto the generated impl, so <code>Envelope&lt;T&gt;</code> works (and because the secret field is never formatted, <code>T</code> need not implement <code>Debug</code>). And the generated code names everything by absolute path (<code>::std::format!</code>, <code>::std::string::String</code>), because a procedural macro's output is resolved in the caller's scope, where those names may be shadowed.</p>
<p>Test procedural macros at two levels: ordinary tests on the generated behaviour, and compile-fail tests with the trybuild crate, which compiles small files that must fail and compares the compiler's message with a stored copy, so the error a user sees for <code>#[derive(Describe)]</code> on an enum stays readable.</p>

<h2>The macros you will use most</h2>
<div class="tbl"><table>
<tr><th>Macro</th><th>Kind</th><th>What it does</th></tr>
<tr><td><code>println! format! write! panic! assert! assert_eq! debug_assert!</code></td><td>built in</td><td>Formatting and checks; format strings are validated at compile time</td></tr>
<tr><td><code>assert_matches!</code>, <code>debug_assert_matches!</code></td><td>built in (1.96)</td><td>Asserts a value matches a pattern (guards allowed) and prints it on failure; not in the prelude, so import it with <code>use std::assert_matches;</code></td></tr>
<tr><td><code>cfg_select!</code></td><td>built in (1.95)</td><td>Chooses code by configuration predicates, first match wins, <code>_</code> as the fallback; works for items and in expression position; replaces the cfg-if crate</td></tr>
<tr><td><code>#[derive(Serialize, Deserialize)]</code></td><td>derive (serde)</td><td>Serialisation code for your types</td></tr>
<tr><td><code>#[derive(Error)]</code></td><td>derive (thiserror)</td><td>Display and Error implementations</td></tr>
<tr><td><code>#[tokio::main]</code>, <code>#[tokio::test]</code></td><td>attribute</td><td>Builds a runtime and runs an async main or test on it</td></tr>
<tr><td><code>#[tracing::instrument]</code></td><td>attribute</td><td>Wraps a function in a tracing span with its arguments</td></tr>
<tr><td><code>sqlx::query!</code></td><td>function-like</td><td>Checks SQL against a real database schema at compile time and infers row types</td></tr>
</table></div>
${R('cfg_select! (1.95): platform-specific code without nested cfg attributes')`
cfg_select! {
    target_os = "linux" => {
        // SAFETY: sysconf only reads a configuration value; it has no memory-safety preconditions.
        fn page_size() -> usize { unsafe { libc::sysconf(libc::_SC_PAGESIZE) as usize } }
    }
    windows => {
        fn page_size() -> usize { 4096 }
    }
    _ => {
        fn page_size() -> usize { 4096 }
    }
}`}

<h2>When to write a macro</h2>
<ul>
<li>Prefer a <b>function</b> when one will do, then a <b>generic</b> function, then a <b>trait</b>. Macros are harder to read, document, debug and give worse IDE support.</li>
<li>Write a <code>macro_rules!</code> macro to remove repetitive boilerplate within a crate (test tables, many similar impls) or to provide small syntax conveniences.</li>
<li>Write a procedural macro when a feature needs to read a type's definition (derive) or validate something at compile time, and when it will be used widely enough to justify the compile-time cost; proc macros, and syn in particular, add noticeably to build times.</li>
<li>Use <code>cargo expand</code> (a third-party subcommand) to see what any macro expands to.</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Macros as a substitute for good types</strong>: a macro that generates ten nearly identical functions often wants one generic function.</li>
<li><strong>Unhygienic paths</strong>: inside an exported macro, refer to items as <code>$crate::path</code> and <code>::std::…</code> so expansions work in any caller's scope.</li>
<li><strong>Evaluating an argument twice</strong>: <code>$x</code> used twice in the template runs the expression twice. Bind it once with <code>let</code>.</li>
<li><strong>Proc-macro crates with heavy dependencies</strong>, which run on every developer machine and in CI at build time.</li>
<li><strong>Assuming items are hygienic</strong>: a <code>fn helper()</code> or <code>struct</code> defined inside a <code>macro_rules!</code> expansion lands in the caller's namespace and can collide with theirs. Wrap helpers in a block or a private module inside the expansion.</li>
<li><strong>Trusting proc macros as data</strong>: a procedural macro is arbitrary code that runs unsandboxed with the build user's permissions and network access. Review proc-macro and build-script dependencies with the same care as runtime ones.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Repetition syntax</summary><p>What does <code>$(,)?</code> at the end of a pattern allow?</p><p><em>Answer:</em> an optional trailing comma, so both <code>hashmap!{a =&gt; 1}</code> and <code>hashmap!{a =&gt; 1,}</code> work.</p></details>
<details><summary>What hygiene covers</summary><p>Inside <code>hashmap!</code> the macro declares <code>let mut m</code>. If the caller also has a variable <code>m</code> and writes <code>hashmap!{ "k" =&gt; m }</code>, which <code>m</code> is inserted? And why can callers use the <code>AccountId</code> type that <code>id_type!</code> declares?</p><p><em>Answer:</em> the caller's <code>m</code>: identifiers keep the syntax context they were written in, so the macro's <code>m</code> and the caller's are different variables. Hygiene in <code>macro_rules!</code> covers local variables and labels only; items such as structs and functions are placed in the caller's module under their plain names, which is why <code>AccountId</code> is usable.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A table-driven test macro</summary><p>Write a macro <code>fee_cases!</code> that takes lines of <code>name: amount =&gt; expected</code> and generates one <code>#[test]</code> function per line.</p><p><em>Answer:</em> <code>macro_rules! fee_cases { ($($name:ident: $amt:expr =&gt; $exp:expr),* $(,)?) =&gt; { $( #[test] fn $name() { assert_eq!(fee($amt), $exp); } )* }; }</code></p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Compile-time SQL</summary><p><code>sqlx::query!</code> connects to a database while compiling. How do you keep builds reproducible and offline in CI?</p><p><em>Answer:</em> run <code>cargo sqlx prepare</code> to save query metadata into a <code>.sqlx</code> directory committed to the repository, and set <code>SQLX_OFFLINE=true</code> in CI so the macro reads that metadata instead of connecting.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can read and write macro_rules! macros with fragments and repetition.</li>
<li>I understand hygiene and why macros expand before type checking.</li>
<li>I know the three kinds of procedural macro and how syn and quote are used, including generics and absolute paths in generated code.</li>
<li>I know the common macros in the ecosystem and what each generates.</li>
<li>I prefer functions, generics and traits, and write macros only when they earn their cost.</li>
</ul>
`});
