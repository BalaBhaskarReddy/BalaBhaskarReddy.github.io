CH.push({
  id: 'ch27', n: 27, title: 'WebAssembly',
  lede: 'WebAssembly is a portable, sandboxed instruction format that runs in browsers, at the edge, and inside other programs as a plugin system. Rust is its most mature source language because it needs no garbage collector or runtime in the module. This chapter covers the targets, Rust in the browser, the component model and WASI, and using Wasm to run untrusted code safely, with a lab that builds a plugin host with CPU limits.',
  html: `
<h2>What WebAssembly is good for</h2>
<ul>
<li><b>Browsers</b>: CPU-heavy code (image and video processing, cryptography, document rendering, simulation) next to JavaScript, at near-native speed. Figma, Google Earth and many editors use Wasm.</li>
<li><b>Edge and serverless</b>: Wasm modules start in microseconds and isolate tenants without a VM per request (Cloudflare Workers, Fastly Compute, Fermyon Spin, wasmCloud).</li>
<li><b>Plugins</b>: run code from customers or partners inside your process, with no access to anything you do not grant: proxy filters (Proxy-Wasm in Envoy), database user-defined functions, editor extensions (Zed), business rules (Shopify Functions).</li>
<li><b>Portability</b>: one artefact for every CPU and OS that has a runtime.</li>
</ul>

<h2>Targets</h2>
<div class="tbl"><table>
<tr><th>Target</th><th>For</th><th>Notes</th></tr>
<tr><td><code>wasm32-unknown-unknown</code></td><td>Browsers, and hosts that provide everything through imports</td><td>No OS assumptions; used with wasm-bindgen</td></tr>
<tr><td><code>wasm32-wasip1</code></td><td>WASI preview 1 (files, clocks, random) in Wasmtime, WasmEdge, Node</td><td>The older, widely supported system interface</td></tr>
<tr><td><code>wasm32-wasip2</code></td><td>The component model and WASI 0.2 interfaces (HTTP, sockets, key-value)</td><td>Tier 2 since Rust 1.82; produces components directly</td></tr>
<tr><td><code>wasm32v1-none</code></td><td>Minimal hosts and blockchains needing only the original Wasm 1.0 features</td><td>no_std only</td></tr>
</table></div>
<p>Since Rust 1.96 (May 2026), Wasm targets are no longer linked with <code>--allow-undefined</code>: a symbol that is declared but never defined is a link error instead of silently becoming an import of the module. Code that relied on the old behaviour to import host functions must say so explicitly with <code>#[link(wasm_import_module = "...")]</code> on the <code>extern</code> block.</p>

<h2>Rust in the browser</h2>
${R('A fee calculator exported to JavaScript with wasm-bindgen')`
use wasm_bindgen::prelude::*;

#[wasm_bindgen]
pub fn card_fee(amount_minor: i64, bps: i64) -> i64 {      // i64 crosses to JavaScript as a BigInt
    (amount_minor * bps / 10_000).max(100)
}

#[wasm_bindgen]
pub struct Basket { items: Vec<i64> }

#[wasm_bindgen]
impl Basket {
    #[wasm_bindgen(constructor)]
    pub fn new() -> Basket { Basket { items: vec![] } }
    pub fn add(&mut self, amount: i64) { self.items.push(amount); }
    pub fn total(&self) -> i64 { self.items.iter().sum() }
}
// wasm-pack build --target web   ->   import init, { card_fee, Basket } from "./pkg/fees.js";`}
<p>wasm-bindgen generates the JavaScript glue and TypeScript definitions; <code>web-sys</code> and <code>js-sys</code> expose browser APIs. Whole front-end frameworks exist (Leptos, Dioxus, Yew), but the common production use is a focused module called from a TypeScript application: the same validation or pricing code that runs on the server runs in the browser, so they cannot disagree.</p>

<h2>Wasm as a sandbox for untrusted code</h2>
${fig('sandbox', '<b>Figure 27.1</b> What a Wasm guest can and cannot reach, and what the host controls.')}
${EX('c27-wasm', 'A plugin host: a partner\'s fee rule runs with a CPU budget, and a runaway plugin is stopped')}
<p>A Wasm module can only touch its own linear memory and call the functions you import into it, so a plugin cannot read your process's memory, open files or sockets, or call the operating system unless you hand it that capability. <b>Fuel</b> bounds the instructions per call, which stopped the infinite loop above deterministically; <b>epoch interruption</b> bounds wall-clock time more cheaply; <code>ResourceLimiter</code> caps memory. Wasmtime, the runtime used here, is itself written in Rust, is a Bytecode Alliance project, and is designed and fuzzed as a security boundary.</p>

<h2>The component model and WASI</h2>
<p>Core Wasm only passes numbers across the boundary. The <b>component model</b> adds rich interface types (strings, records, variants, lists, resources) described in WIT files, so a component written in Rust can be called from a host or another component written in Go, Python or JavaScript without hand-written glue. <b>WASI 0.2</b> defines standard interfaces built on it (filesystem, sockets, HTTP, clocks, random), and the WASI 0.3 work adds native async support. In Rust, <code>wit-bindgen</code> generates guest bindings from WIT and Wasmtime's <code>bindgen!</code> macro generates host bindings, so the same WIT file defines both sides of a plugin API.</p>
${R('A plugin interface in WIT, shared by host and guest')`
// wit/fees.wit
package acme:fees@1.0.0;

interface rules {
    record txn { amount-minor: s64, currency: string, mcc: u16 }
    variant decision { allow(s64), review(string), deny(string) }
    evaluate: func(t: txn) -> decision;
}

interface host {
    log: func(message: string);       // the only capability the host grants
}

world fee-plugin {
    import host;
    export rules;
}`}
<p>On the host side, <code>bindgen!({ path: "wit/fees.wit", world: "fee-plugin" })</code> generates a <code>FeePlugin</code> type with <code>instantiate</code> and a typed <code>call_evaluate</code>, an <code>acme::fees::host::Host</code> trait that your store's data implements to provide <code>log</code>, and Rust structs for <code>txn</code> and <code>decision</code>. On the guest side, <code>wit_bindgen::generate!</code> produces the matching <code>Guest</code> trait to implement.</p>

${LAB('a sandboxed rules engine', `<ol>
<li>Start from the example host. Add a <code>ResourceLimiter</code> so a plugin cannot grow its memory beyond 16 MiB (make the store's data a struct holding a <code>StoreLimits</code> built with <code>StoreLimitsBuilder</code>, and register it with <code>store.limiter</code>), and an epoch deadline of 5 ms per call alongside fuel (<code>Config::epoch_interruption(true)</code>, a background thread calling <code>engine.increment_epoch()</code> every millisecond, and <code>store.set_epoch_deadline(5)</code>).</li>
<li>Write the WIT interface above in <code>wit/fees.wit</code>. Create the guest as a library crate with <code>crate-type = ["cdylib"]</code> and the wit-bindgen dependency, implement <code>evaluate</code> with a few rules, and build it with <code>rustup target add wasm32-wasip2</code> and <code>cargo build --release --target wasm32-wasip2</code>, which produces a component directly.</li>
<li>Generate host bindings with <code>wasmtime::component::bindgen!</code>, load the guest with <code>Component::from_file</code>, and call <code>evaluate</code> with typed records instead of integers. A guest that uses the standard library on <code>wasm32-wasip2</code> imports WASI interfaces even if it never opens a file, so also add the wasmtime-wasi crate to the host's component <code>Linker</code> (<code>wasmtime_wasi::p2::add_to_linker_sync</code>) with a <code>WasiCtx</code> that grants nothing: no preopened directories, no network, no inherited environment. The store's data implements <code>WasiView</code>, handing out that context together with a <code>ResourceTable</code>.</li>
<li>Cache compiled code (<code>Component::serialize</code> for the components from step 3, <code>Module::serialize</code> for core modules, or Wasmtime's cache) so loading a plugin takes microseconds, and instantiate a fresh store per request for isolation.</li>
<li>Write hostile plugins (infinite loop, memory bomb, deep recursion) and confirm each is stopped with a clear error and the host keeps serving.</li>
<li>Expose the engine through an axum endpoint and measure per-call overhead against a native Rust implementation of the same rules.</li>
</ol><p><em>Done when</em> partners could upload rules that run in your payment path without being able to crash it, slow it beyond its budget, or read anything you did not pass in.</p>`)}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Large binaries</strong>: build with <code>opt-level = "z"</code>, LTO and <code>panic = "abort"</code>, strip, and run wasm-opt; check with twiggy.</li>
<li><strong>Chatty boundaries</strong>: every JS-to-Wasm call and string conversion costs; pass batches and buffers.</li>
<li><strong>Assuming a sandbox you did not configure</strong>: granting WASI filesystem or network access gives the guest real access. Grant capabilities explicitly and narrowly.</li>
<li><strong>Threads and SIMD</strong> need specific browser and runtime support; check before relying on them.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Which target?</summary><p>You are writing a Wasm component that will run in Wasmtime and use WASI HTTP. Which target?</p><p><em>Answer:</em> <code>wasm32-wasip2</code>, which produces components and supports the WASI 0.2 interfaces.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Fuel or epochs?</summary><p>When would you use fuel and when epoch interruption to bound plugin execution?</p><p><em>Answer:</em> fuel counts instructions, so limits are deterministic and reproducible (the same input always stops at the same point), at some runtime cost. Epochs check a counter incremented by a timer thread, which is cheaper and bounds wall-clock time but is not deterministic. Many hosts use epochs in production and fuel where determinism matters (blockchains, tests).</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why Rust for Wasm?</summary><p>Go and C# can also compile to Wasm. Why are Rust modules usually much smaller?</p><p><em>Answer:</em> Rust has no garbage collector or runtime scheduler to ship inside the module, and dead code is removed aggressively, so a small function compiles to a few kilobytes. Languages with a runtime must include it (GC, goroutine scheduler) in every module, typically adding hundreds of kilobytes to megabytes, although the Wasm GC proposal now lets some languages use the host's collector instead.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know where WebAssembly is used and which Rust target fits each use.</li>
<li>I can export Rust to JavaScript with wasm-bindgen.</li>
<li>I can host untrusted Wasm safely with Wasmtime: capabilities, fuel, epochs and memory limits.</li>
<li>I understand the component model, WIT and WASI 0.2.</li>
<li>I completed the sandboxed rules-engine lab.</li>
</ul>
`});

CH.push({
  id: 'ch28', n: 28, title: 'Embedded and no_std',
  lede: 'Rust runs on microcontrollers with a few kilobytes of RAM and no operating system, because the language needs no runtime and the standard library is optional. Ownership maps naturally onto hardware peripherals, typestate catches misconfigured pins at compile time, and async gives cooperative multitasking without an RTOS. This chapter covers no_std, the embedded ecosystem, async firmware with Embassy, and Rust in safety-critical and payment-terminal settings.',
  html: `
<h2>no_std</h2>
<p>The standard library is three layers: <code>core</code> (types, traits, iterators, Option, Result, slices, formatting, atomics: no allocation, no OS), <code>alloc</code> (Box, Vec, String, Rc, Arc: needs a heap allocator), and <code>std</code> (threads, files, networking, time: needs an operating system). A crate marked <code>#![no_std]</code> uses only <code>core</code> (and optionally <code>alloc</code>), so it runs on bare metal, in kernels, in bootloaders and in Wasm. Much of the ecosystem supports no_std: serde, heapless, the RustCrypto algorithms, hashing, parsers such as nom.</p>
${EX('c28-nostd', 'A no_std ring buffer, fixed-point averaging and a compile-time CRC, tested on the host')}
<p>Two techniques from the example are standard in firmware. <code>#![cfg_attr(not(test), no_std)]</code> keeps the library no_std for the device while the tests link std and run on your laptop or in CI, so most logic is tested without hardware. And <code>const fn</code> moves work to compile time: <code>HELLO_CRC</code> is computed by the compiler, and the device never runs that code. The same idea guards the ring buffer: an inline <code>const { assert!(N &gt; 0) }</code> block is evaluated for each capacity the program uses, so a <code>Ring&lt;i32, 0&gt;</code>, which would divide by zero in <code>push</code>, is rejected at compile time (the <code>compile_fail</code> doc test checks this) instead of panicking on the device.</p>

<h2>The embedded ecosystem</h2>
${fig('emb', '<b>Figure 28.1</b> The layers of an embedded Rust project.')}
<ul>
<li><b>embedded-hal 1.0</b> (January 2024) defines traits for GPIO, SPI, I²C, delays and more, with async versions in embedded-hal-async. A sensor driver written against them works on any chip with a HAL.</li>
<li><b>Peripherals as owned values</b>: a HAL gives you each peripheral exactly once (<code>Peripherals::take()</code>), so two parts of the firmware cannot both drive the same UART. Pins carry their mode in their type, so writing to an input pin does not compile.</li>
<li><b>Tooling</b>: probe-rs flashes and debugs over SWD and JTAG (<code>cargo run</code> flashes the board), defmt provides compact logging, and RTT streams logs with almost no overhead.</li>
<li><b>Vendor support</b>: Espressif develops esp-hal for its ESP32 family; Raspberry Pi's RP2040 and RP2350 have strong community HALs; Nordic, STMicro and NXP parts are covered by Embassy and community HALs; RISC-V cores are well supported.</li>
</ul>

<h2>Async firmware with Embassy</h2>
<p>Embassy is an async executor and HAL family for microcontrollers. Because futures are state machines of known size (Chapter 15), tasks are allocated statically, waiting on a pin or a timer puts the core to sleep until an interrupt wakes the task, and there is no RTOS kernel or per-task stack to size.</p>
${R('Two concurrent tasks on a Raspberry Pi Pico (embassy-executor 0.10, embassy-rp 0.10)')`
#![no_std]
#![no_main]
use embassy_executor::Spawner;
use embassy_rp::gpio::{Input, Level, Output, Pull};
use embassy_time::{Duration, Timer};
use {defmt_rtt as _, panic_probe as _};

#[embassy_executor::task]
async fn heartbeat(mut led: Output<'static>) {
    loop {
        led.toggle();
        Timer::after(Duration::from_millis(500)).await;   // the core sleeps here
    }
}

#[embassy_executor::main]
async fn main(spawner: Spawner) {
    let p = embassy_rp::init(Default::default());
    // A task function returns Result<SpawnToken, SpawnError>: Err if its static slot is in use.
    spawner.spawn(heartbeat(Output::new(p.PIN_25, Level::Low)).unwrap());
    let mut button = Input::new(p.PIN_15, Pull::Up);
    loop {
        button.wait_for_falling_edge().await;              // interrupt-driven, no polling
        defmt::info!("button pressed");
    }
}`}

<h2>Safety-critical and regulated devices</h2>
<p>Rust is increasingly used where software must be certified. <b>Ferrocene</b>, a downstream distribution of the Rust compiler, is qualified for ISO 26262 (automotive, up to ASIL D), IEC 61508 (industrial, up to SIL 4) and IEC 62304 (medical devices), and the Rust project adopted its language specification in 2025. The Safety-Critical Rust Consortium, formed in 2024 under the Rust Foundation, works on coding guidelines and tooling, and MISRA has published guidance on applying its C guidelines to Rust. For payment devices, the same properties matter: card terminals, PIN pads and HSM firmware parse untrusted input and hold keys, and memory-safety bugs there are both security and certification problems (PCI PTS and PCI PIN requirements apply to the device and its key handling).</p>

${LAB('firmware logic you can test without hardware', `<ol>
<li>Create a <code>no_std</code> library crate like the example, with <code>#![cfg_attr(not(test), no_std)]</code>, containing a frame parser for a simple serial protocol (start byte, length, payload, CRC-16) that works on <code>&amp;[u8]</code> and never allocates or panics.</li>
<li>Write unit and property tests on the host, and a fuzz target for the parser.</li>
<li>Add a state machine for a card-reader-like device (Idle, CardPresent, Reading, Error) as an enum with an exhaustive transition function.</li>
<li>If you have a board (a Raspberry Pi Pico is inexpensive), start an Embassy project from the RP examples in the Embassy repository (they include the memory layout, linker settings and a probe-rs runner), depend on your library, read frames from a UART, blink an LED on errors, and log with defmt.</li>
<li>Check the binary's flash and RAM usage with <code>cargo size</code> (cargo-binutils, which needs <code>rustup component add llvm-tools</code>) and cargo-bloat, and get it under 64 KiB of flash.</li>
</ol><p><em>Done when</em> the protocol logic is fully tested on the host, fuzzed, and (with hardware) running on the device.</p>`)}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Pulling in std by accident</strong> through a dependency; check with <code>cargo build --target thumbv7em-none-eabihf</code> in CI.</li>
<li><strong>Panics on the device</strong>: choose a panic handler deliberately (halt, reset, or log over defmt) and remove panicking paths from protocol code.</li>
<li><strong>Floating point on cores without an FPU</strong>; use fixed-point integers as in the example.</li>
<li><strong>Large futures</strong> in async firmware consume static RAM; keep buffers outside tasks or in static cells.</li>
<li><strong>Interrupt-shared state</strong> without a critical section or atomics; use <code>critical-section</code> or Embassy's sync primitives.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>core, alloc or std?</summary><p>Which layer provides <code>Vec</code>, <code>Option</code> and <code>std::thread</code>?</p><p><em>Answer:</em> <code>alloc</code>, <code>core</code> and <code>std</code> respectively.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A typestate pin</summary><p>Sketch types so that <code>set_high</code> exists only on output pins and changing mode consumes the old pin.</p><p><em>Answer:</em> <code>struct Pin&lt;MODE&gt; { n: u8, _m: PhantomData&lt;MODE&gt; }</code> with marker types <code>Input</code> and <code>Output</code>; <code>impl Pin&lt;Input&gt; { fn into_output(self) -&gt; Pin&lt;Output&gt; }</code> and <code>impl Pin&lt;Output&gt; { fn set_high(&amp;mut self) }</code>. HALs use exactly this pattern.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Async without an RTOS</summary><p>How can Embassy run many concurrent tasks on a microcontroller without allocating stacks for them?</p><p><em>Answer:</em> each task is a future whose size the compiler knows, so the executor stores it in a static of exactly that size; awaiting saves the task's state in the future itself, not on a separate stack. The single hardware stack is shared, and the core sleeps (WFI) when no task is ready, waking on interrupts that call the relevant wakers.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I understand core, alloc and std and write no_std crates tested on the host.</li>
<li>I know the embedded layers: PAC, HAL, BSP and embedded-hal traits.</li>
<li>I can explain how ownership and typestate model hardware peripherals.</li>
<li>I understand async firmware with Embassy and its memory model.</li>
<li>I know Rust's position in safety-critical and payment-device development.</li>
</ul>
`});

CH.push({
  id: 'ch29', n: 29, title: 'Operating Systems and Kernels',
  lede: 'Kernels are where memory-safety bugs are most dangerous and where garbage-collected languages cannot go. Rust is now a permanent part of the Linux kernel, ships in Android\'s kernel and userspace, runs inside Windows, and powers several new operating systems and hypervisors. This chapter explains how Rust fits into a C kernel, what a kernel module in Rust looks like, and what platform and infrastructure teams should expect.',
  html: `
<h2>Rust in Linux</h2>
<p>Initial Rust support was merged in Linux 6.1 (December 2022). At the 2025 Maintainers Summit the kernel developers agreed that the experiment had succeeded and ended its "experimental" label. The state in late 2026:</p>
<ul>
<li><b>Drivers in production</b>: Android 16 devices on kernel 6.12 ship a Rust ashmem implementation; the Android binder driver, rewritten in Rust, was merged in 6.18; Nova (the NVIDIA GPU driver), Tyr (Arm Mali GPUs) and the Apple GPU driver are progressing; there are Rust PHY, block and DRM panic-screen drivers. At the December 2025 Maintainers Summit the DRM (graphics) maintainer said the subsystem was about a year away from refusing new drivers written in C and requiring Rust.</li>
<li><b>Architecture</b>: Rust code talks to the C kernel through generated bindings, wrapped in the <code>kernel</code> crate's safe abstractions; drivers use only those, so <code>unsafe</code> is concentrated in code that subsystem maintainers review.</li>
<li><b>Toolchain policy</b>: the minimum Rust version tracks Debian stable, raised some months after each Debian release; the kernel uses a few unstable features under a special allowance and works with the Rust project to stabilise them. gccrs, a GCC front end for Rust, is working towards compiling the kernel's Rust code but could not yet do so as of September 2026; rustc_codegen_gcc, which plugs GCC's code generator into rustc, is the other route to GCC-only targets.</li>
<li><b>Distributions</b>: Debian has enabled Rust in its kernel builds, starting with its next release (forky), and Android's 6.12 kernels ship with Rust enabled. Whether your distribution's kernel has <code>CONFIG_RUST=y</code> varies by distribution and architecture; check its kernel config rather than assuming.</li>
</ul>
${fig('rfl', '<b>Figure 29.1</b> How Rust drivers sit on top of the C kernel.')}
${R('An out-of-tree kernel module in Rust (illustrative)')`
// SPDX-License-Identifier: GPL-2.0
use kernel::prelude::*;

module! {
    type: LedgerDev,
    name: "ledger_dev",
    authors: ["Platform Team"],
    description: "Example Rust kernel module",
    license: "GPL",
}

struct LedgerDev {
    numbers: KVec<i64>,
}

impl kernel::Module for LedgerDev {
    fn init(_module: &'static ThisModule) -> Result<Self> {
        pr_info!("ledger_dev loaded\n");
        let mut numbers = KVec::new();
        numbers.push(125_000, GFP_KERNEL)?;     // allocation can fail in the kernel: it returns Result
        numbers.push(-4_999, GFP_KERNEL)?;
        Ok(LedgerDev { numbers })
    }
}

impl Drop for LedgerDev {
    fn drop(&mut self) {
        pr_info!("ledger_dev unloading, sum {}\n", self.numbers.iter().sum::<i64>());
    }
}`}
<p>Notice what is different from userspace Rust: no <code>std</code>; fallible allocation with explicit GFP flags (the kernel must survive out-of-memory); kernel logging macros; and <code>Drop</code> doing the module's clean-up, so unload paths cannot be forgotten. The same ownership rules that prevent use-after-free in applications prevent it in drivers, where it is a privilege-escalation bug.</p>

<h2>Windows, Android and hypervisors</h2>
<ul>
<li><b>Windows</b>: Microsoft ships Rust components in the Windows kernel (parts of the graphics subsystem were rewritten in Rust), publishes windows-drivers-rs for writing drivers, and open-sourced OpenVMM, a Rust virtual machine monitor used in Azure. In September 2026 Microsoft announced that Rust is a Tier-1 language for its internal development, alongside C++, C# and TypeScript, with a supported toolchain that includes a backend sharing MSVC's code generator.</li>
<li><b>Android</b>: besides kernel modules, large parts of userspace are Rust: Keystore2, the Bluetooth stack, the DNS-over-HTTP resolver, the virtualisation framework, and media and font parsers. About 5 million lines in total by late 2025.</li>
<li><b>Hypervisors and firmware</b>: Firecracker and Cloud Hypervisor (Chapter 23), crosvm in ChromeOS, and firmware projects for hardware roots of trust such as Caliptra and Oxide's Hubris operating system.</li>
<li><b>New operating systems</b>: Redox (a Unix-like microkernel OS), Asterinas (a Linux-compatible kernel built around a small unsafe core), Tock (for secure embedded devices), and Theseus (a research OS) explore designs that rely on Rust's guarantees rather than only on hardware isolation.</li>
</ul>

<h2>What this means for platform teams</h2>
<ul>
<li>Kernel builds now need a Rust toolchain alongside GCC or LLVM; pin it as the kernel documentation specifies, and include it in your build images and SBOMs.</li>
<li>Vendors will increasingly ship Rust drivers (GPU, networking, storage). Treat them like any kernel module for patching and inventory; expect fewer memory-corruption CVEs, not zero bugs.</li>
<li>If you maintain out-of-tree modules (security agents, eBPF helpers, custom drivers), new ones are good Rust candidates, and the eBPF ecosystem has Rust options too (Aya writes both the kernel-side programs and the userspace loader in Rust).</li>
</ul>

${LAB('build and load a Rust kernel module', `<ol>
<li>In a VM (not your workstation), install a recent kernel source tree and its documented Rust toolchain version; run <code>make LLVM=1 rustavailable</code> to check prerequisites.</li>
<li>Configure a kernel with <code>CONFIG_RUST=y</code> and the Rust samples enabled, build it, and boot it in QEMU.</li>
<li>Build the module above out of tree against that kernel (the Rust-for-Linux project publishes an out-of-tree template), load it with <code>insmod</code>, read the messages with <code>dmesg</code>, and unload it.</li>
<li>Add a misc device that exposes the sum through <code>read</code>, using the kernel crate's misc-device abstraction (read and write support through <code>iov_iter</code> arrived in 6.18, and the in-tree <code>samples/rust/rust_misc_device.rs</code> shows how; on older kernels, expose it through an ioctl as that sample originally did), and read it from userspace.</li>
<li>Write an eBPF program with Aya that counts <code>openat</code> calls per process and a userspace loader that prints the top five, all in Rust.</li>
</ol><p><em>Done when</em> the module loads and unloads cleanly and you can explain where its unsafe code lives (hint: not in your file).</p>`)}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Expecting userspace Rust idioms</strong>: no std, fallible allocation, sleeping versus atomic contexts, and kernel locking rules all apply.</li>
<li><strong>Mismatched toolchains</strong>: the kernel's Rust code must be built with a supported rustc and bindgen version.</li>
<li><strong>Assuming Rust code is reviewed like C</strong>: a subsystem may require its own abstractions to be merged first; check with maintainers before writing a driver.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Why fallible allocation?</summary><p>Why does <code>KVec::push</code> take GFP flags and return a Result, while <code>Vec::push</code> in userspace does neither?</p><p><em>Answer:</em> the kernel must handle out-of-memory gracefully rather than abort, and allocation behaviour depends on context (whether the caller may sleep, which memory zones are acceptable). Userspace Rust aborts on allocation failure by default.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Inventory</summary><p>Your security team asks which production hosts run Rust kernel code. How would you find out?</p><p><em>Answer:</em> check kernel configs for CONFIG_RUST and list loaded modules built from Rust (module metadata and build records); include the kernel's Rust toolchain version in the image SBOM; and track vendor drivers by module name. The answer feeds vulnerability management like any other component.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Safety at the boundary</summary><p>If Rust drivers call C kernel code that may have bugs, what do they actually gain?</p><p><em>Answer:</em> the driver's own logic, usually the largest and least-reviewed part, cannot introduce memory-safety bugs; misuse of kernel APIs (wrong locking, use after free of a device, missing cleanup on error paths) is caught by the abstractions' types; and the remaining unsafe code is concentrated in shared abstractions reviewed by experts. Bugs in the C code beneath remain, so the benefit is far fewer bugs, not none.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know the state of Rust in Linux and the drivers in production.</li>
<li>I understand bindings, the kernel crate and where unsafe code lives.</li>
<li>I can read a Rust kernel module and explain how it differs from userspace Rust.</li>
<li>I know Rust's role in Windows, Android, hypervisors and new operating systems.</li>
<li>I know what this means for platform builds, inventory and patching.</li>
</ul>
`});

CH.push({
  id: 'ch30', n: 30, title: 'Adopting Rust in an Organisation',
  lede: 'Introducing a language is an organisational change as much as a technical one. This chapter covers choosing the first components, building the team and its skills, the engineering standards and platform assets that make Rust sustainable, interoperating with a Java and Go estate, and presenting the programme to security, compliance and leadership, including the memory-safety roadmap regulators now expect.',
  html: `
<h2>Choosing where to start</h2>
${fig('score', '<b>Figure 30.1</b> Interactive: score a candidate component for a first Rust project.')}
<p>Good first production components share three properties: a real reason to be in Rust (the three questions of Chapter 2), a clean boundary so the rest of the system does not care what language is inside, and a team that will own it. In fintech and platform organisations, typical good starts are: a parser for an external format (ISO 8583, ISO 20022, bank statement files), a high-volume gateway or sidecar, a CLI used by many engineers, a Python extension for a slow pipeline step, a webhook verifier, or a native library called from Java through FFM. Poor starts are a team's core CRUD service, anything on a deadline that does not need Rust's strengths, and anything owned by one enthusiast.</p>

<h2>Stages of adoption</h2>
${fig('stages', '<b>Figure 30.2</b> Step through: how organisations typically move from first experiments to a supported language.')}

<h2>People and skills</h2>
<ul>
<li><b>Expect a ramp-up</b>: experienced engineers typically contribute within weeks and become comfortable with ownership over a few months; in an internal survey of more than 1,000 of its developers, published in 2023, Google found that more than two-thirds of those learning Rust felt confident contributing to a Rust codebase within two months or less. Budget for it.</li>
<li><b>Train on your domain</b>: generic tutorials teach syntax; a workshop that builds a small version of your own service (this book's labs) teaches the patterns that matter to you.</li>
<li><b>Pair and review</b>: early on, have experienced Rust reviewers on every change; most of the learning happens in code review.</li>
<li><b>Hire for systems thinking</b>, not Rust years: strong C++, Go or Java engineers learn Rust well. The pool of experienced Rust engineers is growing but still smaller than for Java or Go.</li>
</ul>

<h2>Engineering standards</h2>
${T('A workspace baseline (Cargo.toml) that encodes the standards')`
# Members opt in: [lints] workspace = true, and edition.workspace = true and so on.
# Without that line in a member's Cargo.toml the lints below do not apply to it.
[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"                 # allow per crate only with a reviewed exception
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"                 # use expect with a reason, or handle it; to allow it in
                                     # tests, set allow-unwrap-in-tests = true in clippy.toml
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
await_holding_lock = "deny"
large_futures = "warn"
dbg_macro = "deny"
print_stdout = "warn"                # services log through tracing

[profile.release]
overflow-checks = true
debug = "line-tables-only"`}
<div class="tbl"><table>
<tr><th>Area</th><th>Standard</th></tr>
<tr><td>Toolchain</td><td>Pinned in rust-toolchain.toml; upgraded every one or two releases by a platform owner; MSRV declared for shared libraries</td></tr>
<tr><td>Errors</td><td>thiserror enums in libraries, anyhow at application edges, no panics on request paths, stable error codes in APIs</td></tr>
<tr><td>Async</td><td>Tokio only; no blocking on async workers; bounded channels; cancellation-safe select loops</td></tr>
<tr><td>Unsafe</td><td>Denied by default; exceptions reviewed by two named reviewers, documented with SAFETY comments, tested with Miri</td></tr>
<tr><td>Dependencies</td><td>Through the internal mirror with a publish-age delay; cargo-deny policy; new direct dependencies reviewed</td></tr>
<tr><td>Observability</td><td>tracing with OTLP export; standard metrics and health endpoints from the service template</td></tr>
<tr><td>Testing</td><td>Unit, integration and doc tests; property tests for domain logic; fuzzing for every parser of external input</td></tr>
</table></div>

<h2>Living with Java and Go</h2>
<p>A Rust component in a JVM estate should look like any other component from the outside: the same API styles (REST with OpenAPI, or gRPC with shared protobuf definitions), the same observability (OTLP, the same metric names and trace propagation), the same deployment (container images, Helm charts or operators, the same probes), the same identity (mTLS certificates, the same JWT validation). Generate clients and servers from shared schemas (utoipa or aide for OpenAPI from Rust; tonic-prost-build, tonic's protobuf code generator, for gRPC) so contracts are checked on both sides. Use in-process FFI (Chapter 18) only where call volume or latency demands it.</p>

<h2>Security, compliance and the memory-safety roadmap</h2>
<p>US agencies (CISA, NSA, FBI) and their counterparts in other countries have urged software manufacturers to publish memory-safety roadmaps ("The Case for Memory Safe Roadmaps", December 2023), and CISA and the FBI's Product Security Bad Practices guidance (January 2025) calls it a bad practice for an existing product written in a memory-unsafe language not to have a published roadmap by 1 January 2026. The guidance is voluntary, but it sets the expectation: a roadmap covers how new code will be written in memory-safe languages and how existing memory-unsafe code will be reduced or hardened. Regulated customers and auditors increasingly ask about it. A credible roadmap for an organisation with Java, Go and some C or C++ contains:</p>
<ol>
<li>An inventory of memory-unsafe code: C and C++ services, native libraries, vendor components, and <code>unsafe</code> in your Rust.</li>
<li>A policy: new code in memory-safe languages by default (Java, Go, Rust, and others), Rust where native performance or no runtime is needed.</li>
<li>Hardening for what remains: C++26 hardened standard library and other compiler hardening, sanitisers and fuzzing in CI, sandboxing (including Wasm) for risky parsers.</li>
<li>A replacement plan prioritised by exposure: internet-facing parsers and privileged components first.</li>
<li>Metrics: share of new native code in memory-safe languages; memory-safety vulnerabilities as a share of all vulnerabilities, by year; unsafe blocks per thousand lines in Rust code.</li>
</ol>
<div class="note key"><b>Mapping to frameworks</b><p>For PCI DSS v4.0.1, Rust adoption supports requirements 6.2.4 (software engineering techniques that prevent or mitigate common attacks, which explicitly include attacks on data and data structures, such as attempts to manipulate buffers or pointers), 6.3.1 (identifying vulnerabilities from industry sources, here the RustSec advisory database), 6.3.2 (an inventory of bespoke software and its third-party components, through Cargo.lock, SBOMs and cargo auditable) and 6.3.3 (installing security patches, critical ones within a month, helped by cargo-deny failing builds on advisories). For SOC 2, the CI pipeline, branch protection and dependency policy provide evidence for the change-management (CC8.1) and vulnerability-monitoring (CC7.1) criteria. The EU Cyber Resilience Act points the same way: its vulnerability and incident reporting obligations have applied since 11 September 2026, and its secure-by-design requirements for products with digital elements apply from 11 December 2027.</p></div>

<h2>Measuring the programme</h2>
<ul>
<li><b>Outcome</b>: incidents and vulnerabilities in Rust components compared with the components they replaced; memory and CPU cost per request; p99 latency.</li>
<li><b>Delivery</b>: lead time and change failure rate of Rust teams compared with others once past the ramp-up; rollback rates (Google reported in 2025 that medium and large Rust changes in Android are rolled back about four times less often than C++ changes).</li>
<li><b>Sustainability</b>: number of engineers able to review Rust; how far the toolchain lags the latest stable; time to adopt a new template version.</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>The rewrite trap</strong>: rewriting a large working system "in Rust" without a reason beyond the language.</li>
<li><strong>The hero trap</strong>: one enthusiast builds something critical, then leaves.</li>
<li><strong>The island trap</strong>: Rust services with their own logging, deployment and API conventions that operations teams cannot support.</li>
<li><strong>Underestimating the ramp-up</strong> and judging the language on the first month's velocity.</li>
<li><strong>Ignoring compile times</strong> until CI takes forty minutes; structure workspaces and caching from the start.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>A first project</summary><p>Your team suggests rewriting the merchant onboarding service in Rust as its first project. What do you say?</p><p><em>Answer:</em> it is a CRUD service with no strong technical reason to move and it is business-critical, so it is a poor first project. Suggest a component that scores well on the scorecard, such as the settlement-file parser or a webhook verifier, and revisit the onboarding service later if there is a reason.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Write the policy</summary><p>Draft the three-sentence language policy for new code in a fintech engineering organisation that uses Java, Go and Python.</p><p><em>Answer:</em> for example: "New services use Java or Go unless a documented reason applies. New native code (parsers of external formats, components on latency-critical paths, agents, libraries embedded in other runtimes, firmware) is written in Rust. C and C++ require an architecture exception with a hardening and replacement plan."</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Presenting to the board</summary><p>Summarise for a risk committee why the organisation is investing in Rust, in terms they care about.</p><p><em>Answer:</em> memory-safety flaws have been the largest single source of critical vulnerabilities in systems software; regulators now expect a plan to reduce them; Rust removes that class in new native code while matching C++ performance; large adopters have measured sharp falls in such vulnerabilities and in production rollbacks; the programme is targeted at high-exposure components, limited in cost, and measured by vulnerability and incident trends.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can choose and justify a first production Rust component.</li>
<li>I can plan the stages of adoption and the skills and review practices needed.</li>
<li>I can set engineering standards in a workspace baseline and a policy table.</li>
<li>I know how to make Rust components fit an existing Java and Go estate.</li>
<li>I can write a memory-safety roadmap and map the programme to PCI DSS and SOC 2.</li>
</ul>

<h2>The brief</h2>
<p>A payments gateway (an existing Java service) must ask for a risk decision before authorising each card or account-to-account payment. The decision is allow, review or deny, with reasons. Requirements:</p>
<div class="tbl"><table>
<tr><th>Requirement</th><th>Target</th></tr>
<tr><td>Throughput</td><td>5,000 decisions per second sustained, 15,000 peak, across three replicas</td></tr>

${fig('cap', '<b>Figure 31.1</b> The capstone system and its neighbours.')}

<h2>The latency budget</h2>
${fig('budget', '<b>Figure 31.2</b> Interactive: allocate the 20 ms objective across the stages of a decision; the tail factor converts typical latencies to an estimated p99.')}
<p>Budgeting before building tells you where design effort goes. With the starting estimates the p99 is over the objective, and the velocity lookups and the decision-log write dominate. So the design keeps hot velocity counters in process (sharded maps with TTL, rebuilt on start from a snapshot in Redis or Valkey plus the Kafka topic) and writes the log asynchronously through a bounded channel to a batching writer, with the payment ID as an idempotency key. Both choices have a cost to state in the design: counters fed from Kafka lag real traffic by the consumer delay, and a decision returned before its log entry is durable can be lost in a crash, in which case a retry from the gateway gets a freshly computed decision rather than the stored one. If that is unacceptable, append to a local write-ahead file before answering and ship it asynchronously. Rules and model scoring are CPU-bound and fast in Rust; the Wasm sandbox adds microseconds, not milliseconds.</p>

<h2>Milestones</h2>
<div class="note lab"><b>Milestone 1: the domain core (Chapters 3 to 9, 20)</b>
<ol>
<li>A <code>risk-core</code> library crate with no I/O: <code>Money&lt;C&gt;</code>, <code>PaymentRequest</code> (validated constructor), <code>Features</code>, a <code>Rule</code> trait and an enum of built-in rules (amount thresholds, velocity, country and MCC lists), and <code>Decision { outcome, reasons, score }</code>.</li>
<li>A pure function <code>decide(req, features, rules, model_score) -&gt; Decision</code>.</li>
<li>Property tests: decisions are deterministic; adding a rule never relaxes a decision (a deny stays a deny, a review never becomes an allow); scores stay in range.</li>
</ol><p><em>Accepted when</em> the core has no dependencies on async, HTTP or databases, and its tests run in under a second.</p></div>
<div class="note lab"><b>Milestone 2: the service (Chapters 16, 22)</b>
<ol>
<li>An axum service with <code>POST /v1/decisions</code> and a tonic gRPC endpoint generated from a shared <code>risk.proto</code>, both calling the core.</li>
<li>Idempotency by payment ID (return the stored decision for repeats), request validation, typed errors with stable codes, timeouts and a body limit.</li>
<li>Graceful shutdown, liveness and readiness, tracing with OTLP export and Prometheus metrics (decisions by outcome, latency histograms by stage).</li>
</ol><p><em>Accepted when</em> integration tests call the router and the gRPC service in process, and a load test reaches 5,000 decisions per second on one replica.</p></div>
<div class="note lab"><b>Milestone 3: features and the decision log (Chapters 10, 14, 16, 25)</b>
<ol>
<li>In-process velocity counters per card token and account (sharded, with expiry), fed by a Kafka consumer and rebuilt on start. Every replica must see every transaction for the cards it scores: either each replica consumes the whole topic (its own consumer group), or the gateway routes requests by card token to the replica that owns that partition.</li>
<li>The decision log: an append-only event stream written through a bounded channel to a batching writer (Kafka or Postgres), with replay that rebuilds decisions exactly from inputs.</li>
<li>Backpressure: when the log writer falls behind, the service sheds load with a clear error rather than growing memory.</li>
</ol><p><em>Accepted when</em> a replay of one hour of recorded traffic reproduces every decision byte for byte, and memory stays under 256 MiB at peak.</p></div>
<div class="note lab"><b>Milestone 4: partner rules in WebAssembly (Chapter 27)</b>
<ol>
<li>A WIT interface for partner rules, a guest template partners can build with wit-bindgen for the <code>wasm32-wasip2</code> target, and a host that loads per-partner components with fuel, epoch and memory limits and a WASI context that grants nothing.</li>
<li>A hostile-plugin test suite (loops, memory bombs, traps) that must never affect other partners' decisions or the latency objective.</li>
</ol><p><em>Accepted when</em> a partner rule set can be added without redeploying the service, and the hostile suite passes under load.</p></div>
<div class="note lab"><b>Milestone 5: the model (Chapter 26)</b>
<ol>
<li>Export the data science team's gradient-boosted model to ONNX and score it with ort in the service, with features computed by the same Rust code used in training data preparation (exposed to Python with PyO3), so training and serving cannot drift.</li>
<li>Shadow mode: score with a candidate model in parallel and log differences without affecting decisions.</li>
</ol><p><em>Accepted when</em> model scoring stays under its budget at p99 and a candidate model can be shadowed and promoted by configuration.</p></div>
<div class="note lab"><b>Milestone 6: operations (Chapters 12, 19, 23, 24, 30)</b>
<ol>
<li>A kube-rs operator managing a <code>RiskRuleSet</code> custom resource: validates rule sets, distributes them to replicas, supports canary percentages and rollback, and reports status conditions.</li>
<li>mTLS with rustls and aws-lc-rs (FIPS mode where required), card data only as tokens, redacting types for anything sensitive, and a log scan in CI that fails on PAN-like strings.</li>
<li>Supply chain: Cargo.lock, internal mirror with a publish-age delay, cargo-deny, cargo auditable builds, an SBOM and signature per image.</li>
<li>Performance: profile under peak load, remove allocation hot spots, and record p50, p99 and p99.9 per stage.</li>
