CH.push({
  id: 'ch14', n: 14, title: 'Fearless Concurrency',
  lede: 'Rust\'s ownership rules extend to threads through two marker traits, Send and Sync, so that a data race is a compile error rather than a production incident. This chapter covers threads and scoped threads, message passing, locks, atomics and memory ordering, and data parallelism with rayon, and what Rust does not prevent: deadlocks and logic races.',
  html: `
<h2>Data races, and why they are hard elsewhere</h2>
<p>A <b>data race</b> is two threads accessing the same memory at the same time, at least one writing, without synchronisation. The result can be a lost update, a torn value, or in C and C++ undefined behaviour that the optimiser may turn into anything. Races are hard to find because they depend on timing: they pass tests and appear under production load.</p>
${fig('lost', '<b>Figure 14.1</b> Step through: a lost update, and the atomic version that cannot lose one.')}
<p>Rust's borrowing rule already says "many readers or one writer". Applied across threads, it rules out data races entirely in safe code. Chapter 2 showed the compiler rejecting an unsynchronised counter; here is the other half of the mechanism.</p>

<h2>Send and Sync</h2>
<ul>
<li><code>Send</code>: a value of this type can be <b>moved</b> to another thread.</li>
<li><code>Sync</code>: a <code>&amp;T</code> can be <b>shared</b> between threads (formally, <code>T: Sync</code> exactly when <code>&amp;T: Send</code>).</li>
</ul>
<p>Both are auto traits: the compiler implements them for your types when all their fields have them. APIs that cross threads state the requirement, <code>thread::spawn</code> requires its closure to be <code>Send + 'static</code>, and <code>tokio::spawn</code> requires its future to be <code>Send</code>. Put a non-Send type in, and the program does not compile:</p>
${EX('c14-send-fail', 'Rc cannot cross threads')}
${fig('sendsync', '<b>Figure 14.2</b> Interactive: whether common types are Send and Sync, and why.')}

<h2>The toolbox</h2>
${EX('c14-threads', 'Scoped threads, channels, Mutex, RwLock, atomics and rayon')}
<div class="tbl"><table>
<tr><th>Tool</th><th>Use when</th><th>Notes</th></tr>
<tr><td><code>thread::scope</code></td><td>Fork-join work over local data</td><td>Threads may borrow from the enclosing function; all are joined before the scope returns</td></tr>
<tr><td><code>thread::spawn</code></td><td>Long-lived background threads</td><td>Needs owned or <code>Arc</code> data (<code>'static</code>)</td></tr>
<tr><td><code>mpsc</code> channels (std), crossbeam-channel, flume</td><td>Pipelines; one owner of mutable state receiving messages</td><td>Often simpler to reason about than locks. Bounded channels (<code>mpsc::sync_channel(n)</code>) apply backpressure</td></tr>
<tr><td><code>Mutex&lt;T&gt;</code></td><td>Short critical sections over shared data</td><td>The data lives inside the lock; the guard unlocks on drop. A panic while locked "poisons" it (lock returns Err)</td></tr>
<tr><td><code>RwLock&lt;T&gt;</code></td><td>Read-mostly data</td><td>Writers can starve under constant reads, depending on the platform</td></tr>
<tr><td>Atomics</td><td>Counters, flags, sequence numbers, lock-free structures</td><td>Require choosing a memory ordering (below)</td></tr>
<tr><td><code>Condvar</code>, <code>Barrier</code>, <code>OnceLock</code>, <code>LazyLock</code></td><td>Waiting for conditions, phases, one-time init</td><td>Lower-level coordination; <code>LazyLock</code> replaces the lazy_static and once_cell crates</td></tr>
<tr><td>rayon</td><td>CPU-bound data parallelism</td><td><code>par_iter()</code>, <code>par_sort</code>, <code>join</code>; a work-stealing pool sized to the cores</td></tr>
</table></div>

<h2>Atomics and memory ordering</h2>
<p>Modern CPUs and compilers reorder memory operations. An atomic operation takes an <code>Ordering</code> that says how much reordering around it is allowed:</p>
<ul>
<li><code>Relaxed</code>: the operation itself is atomic, with no ordering relative to other memory. Right for statistics counters.</li>
<li><code>Release</code> on a store and <code>Acquire</code> on the load that sees it: everything the writer did before the store is visible to the reader after the load. Right for publishing data through a flag or pointer, and what locks do internally.</li>
<li><code>SeqCst</code>: a single global order of all SeqCst operations. The safe default when in doubt, slightly more expensive on some architectures.</li>
</ul>
${fig('relacq', '<b>Figure 14.3</b> Release and Acquire: a store and the load that reads it create a happens-before edge that carries every earlier write with it.')}
<p>Two more facts that matter in practice. First, SeqCst is not a fix for a design that is wrong under Acquire and Release: it only adds a global order among SeqCst operations, and mixing it with weaker orderings elsewhere gives you the weaker guarantee. Second, x86-64 is strongly ordered in hardware, so a missing Release or Acquire often goes unnoticed there and only fails on ARM, including AWS Graviton, where the CPU reorders more aggressively. The compiler may reorder on any architecture.</p>
${EX('c14-atomics', 'A lock-free credit reservation, Release/Acquire publication, and one-time initialisation')}
<p>The first part is the important one for payment code: "is there enough limit left?" and "debit it" must be one atomic step, or two threads both see 1,000 and both approve. <code>fetch_update</code> (a <code>compare_exchange</code> loop) re-reads and retries if another thread changed the value in between, so exactly three of eight reservations of 300 succeed. Relaxed is enough there, because the decision depends only on that one atomic value. For one-time initialisation, prefer <code>OnceLock</code> and <code>LazyLock</code> (stable since 1.70 and 1.80) to hand-written flags.</p>
<p>Rust's orderings are those of C++20, so the reasoning and the literature carry over. Write lock-free code only when profiling shows you need it, and test it with loom (Chapter 20), which explores the possible interleavings and orderings.</p>

<h2>What Rust does not prevent</h2>
<ul>
<li><b>Deadlocks</b>: two threads taking two locks in opposite orders still deadlock, and so does one thread locking a std <code>Mutex</code> it already holds (it is not re-entrant, unlike Java's <code>synchronized</code>). Keep lock scopes small, take locks in a fixed order, and never hold a lock across a call into unknown code or an <code>.await</code>.</li>
<li><b>Logic races</b>: check-then-act on two separately locked values ("is the balance enough?" then "debit it") can interleave badly. Hold one lock across the whole operation, or use a single owner task.</li>
<li><b>Starvation and contention</b>: a correctly locked hot <code>Mutex</code> can still serialise the program. Shard the data or use message passing.</li>
</ul>
<div class="note key"><b>Java and Go readers</b><p>In Java, <code>synchronized</code> and <code>volatile</code> are conventions the compiler cannot check against the data they protect; in Go, the race detector finds races only on executed paths. In Rust the lock owns the data, the type system knows which types may cross threads, and for safe code the check is complete: no data race compiles. (Unsafe code can still break the rules; Chapter 17.) The remaining hard problems (deadlock, contention, design) are the same everywhere.</p></div>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong><code>Arc&lt;Mutex&lt;T&gt;&gt;</code> held for long operations</strong>, including I/O; copy what you need and release the lock.</li>
<li><strong><code>lock().unwrap()</code> everywhere</strong> without thinking about poisoning; for most services, treating a poisoned lock as fatal is right, but decide deliberately.</li>
<li><strong>Spawning a thread per task</strong> for thousands of tasks; use a pool (rayon for CPU, an async runtime for I/O).</li>
<li><strong>Relaxed ordering for publication</strong> of data to another thread: use Release and Acquire. Tests on x86 laptops will not catch it; ARM machines such as Graviton can expose it, rarely and under load.</li>
<li><strong>A guard in a <code>match</code> scrutinee</strong>: in <code>match map.lock().unwrap().get(&amp;k) { … }</code> the guard lives until the end of the match, so locking again inside an arm deadlocks. Bind the value you need first. (Edition 2024 shortened this for <code>if let</code>, whose temporaries are now dropped before the <code>else</code> branch, but not for <code>match</code>.)</li>
<li><strong>Blocking a std Mutex inside async code</strong> across an await (Chapter 16).</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Fix the error</summary><p>How do you fix the Rc example so the worker thread can read the config?</p><p><em>Answer:</em> use <code>Arc&lt;String&gt;</code> (and <code>Arc::clone</code>), or a scoped thread that borrows <code>&amp;config</code>.</p></details>
<details><summary>Pick the tool</summary><p>Many request threads increment a "requests served" metric. What do you use?</p><p><em>Answer:</em> an <code>AtomicU64</code> with <code>fetch_add(1, Ordering::Relaxed)</code>; no lock needed and ordering does not matter for a counter.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Transfer without deadlock</summary><p>Accounts are in <code>Vec&lt;Mutex&lt;Account&gt;&gt;</code>. Write a transfer between indices <code>i</code> and <code>j</code> that cannot deadlock against a concurrent transfer from <code>j</code> to <code>i</code>.</p><p><em>Answer:</em> always lock the lower index first: <code>let (a, b) = if i &lt; j { (i, j) } else { (j, i) };</code> lock <code>a</code> then <code>b</code>, then perform the debit and credit on whichever guard is the source. A consistent global lock order removes the cycle. Reject <code>i == j</code> first: locking the same mutex twice on one thread never returns.</p></details>
<details><summary>Lock or atomic?</summary><p>A per-merchant daily limit is checked and debited on every authorisation. When is an <code>AtomicI64</code> with <code>fetch_update</code> enough, and when do you need a <code>Mutex</code>?</p><p><em>Answer:</em> the atomic is enough while the decision depends on that single value, as in the example. As soon as one decision reads or writes two values (the limit and a velocity counter, or two accounts), they must change together, so use one <code>Mutex</code> around a struct holding both, or a single owner task.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why is Mutex&lt;T&gt; Sync when T is only Send?</summary><p>A <code>Cell&lt;u64&gt;</code> is Send but not Sync. Why is <code>Mutex&lt;Cell&lt;u64&gt;&gt;</code> Sync?</p><p><em>Answer:</em> the mutex guarantees that only one thread at a time has access to the inner value, which is equivalent to moving it to that thread for the duration of the lock. Moving requires only Send. So the lock can safely be shared even if the data inside could not.</p></details>
<details><summary>It works on my laptop</summary><p>A flag-and-payload handoff uses <code>Relaxed</code> for both and passes millions of test runs on x86-64. After moving to Graviton instances, a consumer occasionally reads a stale payload. Why, and what is the fix?</p><p><em>Answer:</em> x86-64 hardware keeps stores in order, so the bug was latent; ARM may make the flag visible before the payload. Relaxed never promised otherwise, and the compiler could have reordered them anywhere. Store the flag with <code>Release</code> and load it with <code>Acquire</code>, or hand the data over through a channel or <code>OnceLock</code>; loom would have found it on any machine.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain a data race and how Rust rules it out.</li>
<li>I know what Send and Sync mean and can predict them for common types.</li>
<li>I choose between scoped threads, channels, Mutex, RwLock, atomics and rayon.</li>
<li>I understand Relaxed, Acquire/Release and SeqCst, and can make check-then-act atomic with a compare-and-swap.</li>
<li>I know Rust does not prevent deadlocks or logic races, and how to avoid them.</li>
</ul>
`});

CH.push({
  id: 'ch15', n: 15, title: 'Async Rust from the Ground Up',
  lede: 'A server handling 50,000 connections cannot afford 50,000 threads. Async lets one thread juggle many tasks that are mostly waiting on I/O. Rust\'s version is unusual: async functions compile to state machines with no heap allocation per await, and the language provides no runtime, so you choose one. This chapter builds a future and an executor by hand so the machinery is clear before Chapter 16 puts Tokio to work.',
  html: `
<h2>Why async, and why it is different in Rust</h2>
<p>Each OS thread needs a stack (address space reserved up front: 8 MiB for a Linux main thread by default, 2 MiB for threads Rust spawns, 1 MiB on a 64-bit JVM) and a kernel context switch to move between them, so thread-per-connection stops scaling in the tens of thousands. The alternative is to let many tasks share a few threads, switching only when a task would wait. Languages differ in where they put that machinery:</p>
<div class="tbl"><table>
<tr><th></th><th>Go</th><th>Java 21+</th><th>Rust</th></tr>
<tr><td>Unit of concurrency</td><td>Goroutine with a growable stack</td><td>Virtual thread with a heap-allocated stack</td><td>Future: a state machine struct, sized at compile time</td></tr>
<tr><td>Scheduler</td><td>In the language runtime</td><td>In the JVM</td><td>A library you choose (Tokio, smol, Embassy for embedded)</td></tr>
<tr><td>Syntax</td><td>Ordinary blocking calls</td><td>Ordinary blocking calls</td><td><code>async fn</code> and <code>.await</code>, visible in signatures</td></tr>
<tr><td>Cost per task</td><td>A few KiB of stack</td><td>Heap chunks for the stack</td><td>Exactly the bytes the state needs</td></tr>
<tr><td>Works without an OS</td><td>No</td><td>No</td><td>Yes (microcontrollers, kernels)</td></tr>
</table></div>
<p>The trade-off: Rust's model is as cheap as hand-written callbacks and runs anywhere, but async code is "coloured" (an async function can only be awaited from async code), the types can be complex, and you must understand a few new concepts: futures, polling, wakers and pinning.</p>

<h2>Futures and polling</h2>
<p>A <code>Future</code> is a value representing a computation that may not have finished. Its one method is <code>poll</code>, which either returns <code>Poll::Ready(output)</code> or <code>Poll::Pending</code>. A future that returns Pending must arrange for the <b>waker</b> it was given to be called when progress is possible; the executor then polls it again. Futures are <b>lazy</b>: creating one does nothing until something polls it.</p>
${EX('c15-future', 'A hand-written timer future and a ten-line executor')}
${fig('sm', '<b>Figure 15.1</b> Step through: the state machine the compiler generates for payment_flow, poll by poll.')}
<p>The compiler turns each <code>async fn</code> into an anonymous struct that implements <code>Future</code>: an enum of states, one per await point, holding whatever locals are alive across that await. Nested async calls become nested state machines inside one struct, so a whole request handler can be one allocation (when spawned) or none at all. That is how Rust async runs on a microcontroller with no heap.</p>

<h2>Executors, reactors and wakers</h2>
${fig('reactor', '<b>Figure 15.2</b> How a runtime\'s executor and reactor cooperate.')}
<ul>
<li>The <b>executor</b> keeps a queue of tasks (top-level futures) and polls those that are ready.</li>
<li>The <b>reactor</b> talks to the OS (epoll on Linux, kqueue on macOS, IOCP on Windows, io_uring through specialised runtimes) and to timers. When a socket becomes readable or a timer fires, it calls the waker registered for it.</li>
<li>A <b>waker</b> is a handle that puts a task back on the run queue. Leaf futures (sockets, timers, channels) are the only code that deals with wakers directly; everything above them is generated by <code>async</code>/<code>.await</code>.</li>
</ul>
<p>The example's <code>block_on</code> is a complete executor for one future: poll, and if Pending, park the thread until the waker unparks it. Tokio's multi-threaded scheduler is the same idea with many tasks, work-stealing queues across worker threads and a reactor on top of epoll.</p>
<p>The waker contract has three rules that hand-written futures must respect, all visible in the example's <code>Timer</code>:</p>
<ul>
<li><b>No lost wake-ups.</b> The "is it done?" check and the storing of the waker happen under the same lock that the timer thread takes to set <code>done</code> and wake. Without that, the timer could fire between the check and the store, and the task would sleep forever.</li>
<li><b>Store the latest waker on every poll.</b> A task can be polled with a different waker each time (Tokio moves tasks between workers), so <code>Timer</code> replaces the stored one on every Pending. <code>Waker::will_wake</code> lets you skip the clone when it has not changed.</li>
<li><b>Spurious polls are allowed.</b> An executor may poll a future that was not woken (and <code>thread::park</code> may return early), so <code>poll</code> must always re-check its state rather than assume it was woken for a reason.</li>
</ul>

<h2>Pinning</h2>
<p>A future's state machine may hold a reference to one of its own fields (a buffer borrowed across an await). Moving the struct in memory would leave that reference dangling. <code>Pin&lt;P&gt;</code> is a wrapper around a pointer that promises the pointee will not move again, which is why <code>poll</code> takes <code>self: Pin&lt;&amp;mut Self&gt;</code>. In practice:</p>
<ul>
<li><code>tokio::spawn</code> and <code>Box::pin</code> pin futures on the heap; <code>std::pin::pin!</code> pins on the stack, as in the example's executor.</li>
<li>Types that are safe to move even when pinned implement <code>Unpin</code>. Most types are; compiler-generated futures and some hand-written ones (Tokio's <code>Sleep</code>, for example) are not, which is why you pin them before polling them by reference.</li>
<li><code>Pin</code> constrains the pointee, not the pointer: a <code>Pin&lt;Box&lt;F&gt;&gt;</code> can be moved around freely, because moving the box does not move the future inside it.</li>
<li>You meet <code>Pin</code> when you implement <code>Future</code> by hand, store futures in a struct, or call <code>select!</code> on a future in a loop (pin it once outside the loop).</li>
</ul>
<p>Field projections (including pin projections, which today need the pin-project crates) and in-place initialisation are part of "Beyond the &amp;", one of the Rust project's 2026 flagship goals. None of that is stable yet; the current <code>Pin</code> API is what every runtime uses.</p>

<h2>Async in traits and closures</h2>
<p><code>async fn</code> in traits has been stable since 1.75, and async closures (<code>async |x| …</code>) with the <code>AsyncFn</code>, <code>AsyncFnMut</code> and <code>AsyncFnOnce</code> traits since 1.85. Two gaps remain as of 1.100: calling async trait methods through <code>dyn Trait</code> (use the <code>async-trait</code> or <code>dynosaur</code> crates, or return boxed futures; native support is a 2026 to 2027 project goal), and naming the future returned by a trait method to require <code>Send</code> on it ("return type notation", RFC-accepted and being prepared for stabilisation under the 2026 goals). Library authors who need Send futures often write <code>fn fetch(&amp;self) -&gt; impl Future&lt;Output = …&gt; + Send</code> in the trait instead of <code>async fn</code>.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Creating a future and never awaiting it</strong>: nothing happens. The compiler warns (futures are <code>#[must_use]</code>).</li>
<li><strong>Blocking inside async code</strong> (std file or network I/O, heavy CPU, <code>thread::sleep</code>): the whole worker thread stops polling every other task on it.</li>
<li><strong>Holding a <code>std::sync::MutexGuard</code> or <code>RefCell</code> borrow across an <code>.await</code></strong>: the future becomes non-Send, or worse, deadlocks.</li>
<li><strong>Huge futures</strong>: large arrays held across awaits make every task large. Box big state or keep it out of the async function.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Lazy</summary><p>What does <code>let f = send_email(); println!("sent");</code> do if <code>send_email</code> is async?</p><p><em>Answer:</em> it creates a future and prints "sent" without sending anything; the future is dropped unpolled. You need <code>send_email().await</code>, or to spawn it.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A join by hand</summary><p>Write <code>async fn both()</code> that runs two <code>step</code> calls concurrently with the example's executor. Does the standard library help?</p><p><em>Answer:</em> not on stable: <code>std::future::join!</code> is still unstable in 1.100. Write a future that holds both children (pinned), polls each one that has not finished every time it is itself polled, and is Ready when both are; or use <code>futures::join!</code> from the futures crate, which works with any executor. The total time becomes about 40 ms instead of 60, on one thread, because both timers run while the task waits.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why a waker instead of polling in a loop?</summary><p>The executor could simply call poll on every task repeatedly. Why the waker protocol?</p><p><em>Answer:</em> busy polling burns a core per executor and scales with the number of idle tasks. With wakers, an idle task costs nothing: the executor only polls tasks whose leaf futures reported that progress is possible, and sleeps in the OS (epoll_wait) when none are.</p></details>
<details><summary>Find the lost wake-up</summary><p>A colleague's <code>poll</code> reads <code>done</code> under the lock, releases it, and then takes the lock again to store the waker if <code>done</code> was false. Tests pass. What can go wrong?</p><p><em>Answer:</em> the timer thread can set <code>done</code> and find no waker to call in the gap between the two critical sections. The future then returns Pending with nobody left to wake it, and the task hangs forever, rarely and only under load. The check and the registration must be one critical section (or the future must re-check after registering).</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can compare Rust futures with goroutines and virtual threads.</li>
<li>I understand poll, Ready, Pending and the waker contract, including lost wake-ups.</li>
<li>I know async fn compiles to a state machine and futures are lazy.</li>
<li>I can describe how an executor and a reactor cooperate.</li>
<li>I know what Pin is for and the current limits of async traits.</li>
</ul>
`});

  host.innerHTML = `<div class="tool"><div class="row"><div><label for="bk-w">worker threads</label><input class="txt" type="number" id="bk-w" value="4" min="1"></div><div><label for="bk-r">requests per second</label><input class="txt" type="number" id="bk-r" value="2000" min="1"></div><div><label for="bk-a">async work per request (ms)</label><input class="txt" type="number" id="bk-a" value="0.3" step="0.1" min="0"></div><div><label for="bk-b">blocking call inside the handler (ms)</label><input class="txt" type="number" id="bk-b" value="1.5" step="0.1" min="0"></div></div><div class="out" id="bk-o" style="margin-top:10px"></div></div>`;
  const draw = () => {
    const v = id => Math.max(0, +host.querySelector('#' + id).value || 0);
    const w = Math.max(1, Math.round(v('bk-w'))), r = v('bk-r'), a = v('bk-a'), b = v('bk-b');
    const busy = r * (a + b) / 1000, util = busy / w, util2 = r * a / 1000 / w;
    /* Erlang C (M/M/c): probability a request has to wait, via the numerically stable Erlang B recursion */
    const erlangC = (A, c) => { let B = 1; for (let k = 1; k <= c; k++) B = A * B / (k + A * B); return B / (1 - A / c * (1 - B)); };
    const wait = util >= 1 ? 'unbounded: the queue grows until requests time out' : `≈ ${(erlangC(busy, w) * (a + b) / (w - busy)).toFixed(2)} ms average queueing`;
    host.querySelector('#bk-o').innerHTML = `worker utilisation with the blocking call: <b class="${util >= 0.8 ? 'd' : 'g'}">${(util * 100).toFixed(0)}%</b> (${wait})<br>with the call moved to spawn_blocking or made async: <b class="g">${(util2 * 100).toFixed(0)}%</b> of the async workers<br><span style="font-family:var(--f-body)">Every millisecond a handler blocks is a millisecond that worker cannot poll any of the other tasks queued on it. An M/M/c (Erlang C) estimate that treats the workers as one shared pool; real latency tails are worse.</span>`;
  };
  host.querySelectorAll('input').forEach(e => e.addEventListener('input', draw)); draw();
};

CH.push({
  id: 'ch16', n: 16, title: 'Async in Practice with Tokio',
  lede: 'Tokio is the async runtime most production Rust uses: a work-stealing scheduler, an I/O and timer driver, channels and synchronisation primitives, and the foundation under hyper, axum, tonic, reqwest and the AWS SDK. This chapter covers spawning, joining, select, timeouts, cancellation and its safety, backpressure, blocking work, shared state and graceful shutdown.',
  html: `
<h2>The runtime</h2>
${fig('tokio', '<b>Figure 16.1</b> The multi-threaded runtime: worker threads with local queues and work stealing, a shared I/O and timer driver, and a separate pool for blocking work.')}
<p><code>#[tokio::main]</code> builds a multi-threaded runtime with one worker per available core (from <code>std::thread::available_parallelism</code>, which on Linux takes cgroup CPU quotas into account; <code>TOKIO_WORKER_THREADS</code> overrides it) and runs your <code>async fn main</code> on it. <code>tokio::spawn</code> submits a task, which must be <code>Send + 'static</code> because it may move between workers. For a single-threaded runtime (<code>flavor = "current_thread"</code>) tasks need not be Send, which suits CLI tools and some proxies. Version 1.x has been stable since 2020, with an LTS policy for selected minor versions.</p>

<h2>The core patterns</h2>
${EX('c16-tokio', 'join!, timeout, select!, bounded concurrency, backpressure, cancellation and spawn_blocking')}
<div class="tbl"><table>
<tr><th>Need</th><th>Tool</th></tr>
<tr><td>Run a few futures concurrently in this task and wait for all</td><td><code>tokio::join!</code>, <code>try_join!</code> (stops at the first error)</td></tr>
<tr><td>Run many tasks in parallel and collect results</td><td><code>JoinSet</code> (aborts remaining tasks when dropped)</td></tr>
<tr><td>First of several futures wins</td><td><code>tokio::select!</code> (the others are dropped)</td></tr>
<tr><td>Deadline</td><td><code>tokio::time::timeout</code>, <code>timeout_at</code></td></tr>
<tr><td>Limit concurrency</td><td><code>Semaphore</code>, or <code>futures::StreamExt::buffer_unordered(n)</code></td></tr>
<tr><td>Hand work between tasks</td><td><code>mpsc</code> (bounded for backpressure), <code>oneshot</code> (one reply), <code>broadcast</code> (fan-out), <code>watch</code> (latest value, e.g. config)</td></tr>
<tr><td>Stop background tasks</td><td><code>CancellationToken</code> from tokio-util (cooperative), or <code>JoinHandle::abort()</code> (drops the task at its next await). Dropping a <code>JoinHandle</code> does not stop the task; it detaches it</td></tr>
<tr><td>CPU-heavy or blocking calls</td><td><code>spawn_blocking</code>, or rayon for large parallel computations</td></tr>
</table></div>

<h2>Cancellation, and cancellation safety</h2>
<p>In Rust async, <b>cancelling a task means dropping its future</b>. A timeout, a <code>select!</code> branch that loses, a client disconnecting from an axum handler, or a <code>JoinSet</code> being dropped all stop the future at its current await point and run destructors. This is cheap and immediate, unlike Go's or Java's cooperative cancellation, but it means any await is a place your code may stop forever.</p>
<p>A future is <b>cancellation safe</b> if dropping it at an await and creating it again loses nothing. Tokio documents this per method:</p>
<div class="tbl"><table>
<tr><th>Cancellation safe</th><th>Not cancellation safe</th></tr>
<tr><td><code>mpsc</code> and <code>broadcast</code> <code>recv</code>, <code>watch::Receiver::changed</code>, <code>TcpListener::accept</code>, <code>AsyncReadExt::read</code>, <code>AsyncWriteExt::write</code>, <code>StreamExt::next</code></td><td>Data can be lost: <code>read_exact</code>, <code>read_to_end</code>, <code>read_to_string</code>, <code>write_all</code>, and any hand-written "read header, then read body" sequence.<br>Only your place in a fair queue is lost: <code>Mutex::lock</code>, <code>RwLock::read</code>/<code>write</code>, <code>Semaphore::acquire</code>, <code>Notify::notified</code>.<br><code>mpsc::Sender::send</code> sends nothing if cancelled, but the message you passed it is dropped; <code>reserve()</code> a slot first, then send.</td></tr>
</table></div>
<p>In <code>select!</code> loops, only use cancellation-safe futures in branches, keep partial state in something that outlives the loop, or pin one long-lived future outside the loop and poll it by <code>&amp;mut</code> reference so it is not recreated. The example runs the same length-prefixed protocol through both kinds of loop:</p>
${EX('c16-cancel', 'A select! loop that loses bytes, and one that cannot')}
<p>In the naive loop, the heartbeat fires while <code>read_frame</code> is waiting for a body, so the future is dropped after it has consumed the two-byte length. The next call reads the first two bytes of the body ("au", 24,949) as a length and the stream never recovers. <code>FramedRead</code> keeps partial frames in a buffer owned by the stream, so dropping <code>next()</code> loses nothing. The example also uses <code>biased;</code> (poll branches in order rather than at random) and <code>start_paused</code> (virtual time), which together make the run deterministic.</p>
<div class="note key"><b>Money-moving code</b><p>Never leave a payment half-done because a future was dropped. Make each step idempotent with an idempotency key, and record intent before calling out (an outbox table). Run a step that must finish once started in a spawned task and await its <code>JoinHandle</code> from the handler: if the client disconnects, the handler's future is dropped, but dropping a <code>JoinHandle</code> only detaches the task, so the step completes. Track such tasks (<code>TaskTracker</code>) so shutdown waits for them. Treat a timeout as "outcome unknown", not "failed", and reconcile.</p></div>

<h2>Blocking: the most common production bug</h2>
${fig('blocking', '<b>Figure 16.2</b> Interactive: how a short blocking call inside handlers eats the capacity of the async workers.')}
<p>Async workers must never block. Common offenders: <code>std::fs</code> and <code>std::net</code> calls, a synchronous database driver, <code>thread::sleep</code>, bcrypt or Argon2 password hashing, large JSON serialisation, compression, and a <code>std::sync::Mutex</code> held while contended. Move them to <code>spawn_blocking</code> (or use the async equivalent: <code>tokio::fs</code>, <code>tokio::time::sleep</code>, an async driver). tokio-console and the runtime metrics show tasks that run too long between awaits ("busy" time); clippy's <code>await_holding_lock</code> lint catches guards held across awaits.</p>

<h2>Shared state in async code</h2>
<ul>
<li>Read-mostly state: <code>Arc&lt;T&gt;</code> or <code>Arc&lt;ArcSwap&lt;T&gt;&gt;</code>, cloned into each handler.</li>
<li>Short critical sections with no await inside: a <code>std::sync::Mutex</code> is fine and faster than an async one.</li>
<li>Critical sections that must await (rare): <code>tokio::sync::Mutex</code>.</li>
<li>Anything complicated: an <b>actor</b>, a task that owns the state and receives commands over an mpsc channel with a oneshot for replies. It serialises access without locks and makes the state's lifecycle explicit.</li>
</ul>
${R('An actor owning per-account limits')`
enum Cmd { Reserve { acct: u64, amt: i64, reply: oneshot::Sender<bool> } }

async fn limits_actor(mut rx: mpsc::Receiver<Cmd>, mut remaining: HashMap<u64, i64>) {
    while let Some(cmd) = rx.recv().await {
        match cmd {
            Cmd::Reserve { acct, amt, reply } => {
                let left = remaining.entry(acct).or_insert(100_000);
                let ok = *left >= amt;
                if ok { *left -= amt; }
                let _ = reply.send(ok);            // the caller may have given up; that is fine
            }
        }
    }
}`}

<h2>Graceful shutdown</h2>
<p>A service should stop accepting work on SIGTERM, finish or hand off in-flight requests, flush telemetry and exit before Kubernetes' grace period ends. With Tokio: listen for the signal (<code>tokio::signal::ctrl_c</code> or <code>signal(SignalKind::terminate())</code>), cancel a root <code>CancellationToken</code> that every background loop selects on, call axum's <code>with_graceful_shutdown</code> so the server drains, and await a <code>TaskTracker</code> (tokio-util) with a timeout. Chapter 22 applies this to an axum service on Kubernetes.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Unbounded channels</strong> between a fast producer and a slow consumer: memory grows until the pod is OOM-killed. Bound them.</li>
<li><strong>Spawning tasks and dropping their handles</strong> without tracking: errors and panics in them vanish, and shutdown cannot wait for them.</li>
<li><strong>Assuming <code>select!</code> is fair or ordered</strong>: by default it polls ready branches in random order. Add <code>biased;</code> when one branch (shutdown, for instance) must win ties.</li>
<li><strong>A <code>JoinHandle</code> that is never awaited after <code>abort()</code></strong>: abort takes effect at the task's next await, so a task stuck in blocking code is not stopped; and <code>spawn_blocking</code> tasks cannot be aborted at all once running.</li>
<li><strong>Nesting runtimes</strong> (<code>block_on</code> inside async code) panics; restructure, or use <code>spawn_blocking</code> plus <code>Handle::block_on</code> deliberately.</li>
<li><strong>Mixing runtimes</strong>: a library tied to one runtime's types will not work on another. Most of the ecosystem assumes Tokio.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>join! or spawn?</summary><p>A handler must call a fraud service and a limits service and needs both answers. Do you use <code>join!</code> or two <code>spawn</code>s?</p><p><em>Answer:</em> <code>try_join!</code>: both run concurrently within the handler's task, and if the request is cancelled both calls are cancelled with it. Spawn when work must outlive the request or run on other workers in parallel for CPU reasons.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Retry with jittered backoff</summary><p>Write an async retry helper that calls a closure returning a future up to 5 times with exponential backoff and full jitter, stopping early on non-retryable errors, and respecting an overall deadline.</p><p><em>Answer:</em> loop over attempts; on error check retryability; sleep <code>rand(0..base*2^n)</code> capped; wrap the whole loop in <code>tokio::time::timeout(deadline, …)</code>. Take the operation as <code>impl AsyncFnMut() -&gt; Result&lt;T, E&gt;</code> (async closures, 1.85) or <code>FnMut() -&gt; Fut</code>.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Is this select! loop safe?</summary><p><code>loop { select! { msg = rx.recv() =&gt; handle(msg), frame = read_frame(&amp;mut sock) =&gt; process(frame) } }</code>, where <code>read_frame</code> reads a length prefix and then the body. What can go wrong?</p><p><em>Answer:</em> if a message arrives while <code>read_frame</code> is between the prefix and the body, the read future is dropped and the prefix bytes are lost, desynchronising the stream. Make reading cancellation safe by buffering in a struct that survives the loop (tokio-util's <code>FramedRead</code>, as in the example), or pin one read future outside the loop and recreate it only after it completes.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I understand Tokio's scheduler, I/O driver and blocking pool.</li>
<li>I use join!, JoinSet, select!, timeout, semaphores and the right channel for each job.</li>
<li>I understand cancellation by drop and write cancellation-safe code.</li>
<li>I keep blocking work off the async workers.</li>
<li>I can share state with Arc, locks or an actor, and shut down gracefully.</li>
</ul>
`});

CH.push({
  id: 'ch17', n: 17, title: 'Unsafe Rust',
  lede: 'Safe Rust is built on unsafe Rust. The standard library\'s collections, synchronisation primitives and I/O, and every call into C, contain code whose correctness the compiler cannot check. The unsafe keyword marks those places and moves the proof obligation to the programmer. This chapter explains exactly what unsafe allows, what undefined behaviour is, how to build safe abstractions, and the tools that check unsafe code.',
  html: `
<h2>What unsafe allows</h2>
<p>An <code>unsafe { … }</code> block does not turn off the borrow checker or the type system. It unlocks a short list of extra operations:</p>
<ol>
<li>Dereferencing a raw pointer (<code>*const T</code>, <code>*mut T</code>).</li>
<li>Calling an <code>unsafe fn</code>: foreign functions not marked <code>safe</code>, intrinsics, and since 1.86 a function with <code>#[target_feature]</code> called from code that does not enable the same CPU features.</li>
<li>Reading or writing a <code>static mut</code>, or a static declared in an <code>extern</code> block (unless it is marked <code>safe</code>).</li>
<li>Reading a field of a <code>union</code> (writing one is safe).</li>
</ol>
<p>The keyword also appears on declarations, where it is a promise rather than a block: <code>unsafe impl</code> for an <code>unsafe trait</code> such as <code>Send</code>, <code>Sync</code> or <code>GlobalAlloc</code>; <code>unsafe extern</code> blocks; and unsafe attributes such as <code>#[unsafe(no_mangle)]</code>. Everything else is still checked. "Unsafe" is best read as "unchecked by the compiler, checked by a person".</p>

<h2>Undefined behaviour</h2>
<p>The compiler optimises safe code assuming certain rules always hold. If unsafe code breaks one, the program has <b>undefined behaviour</b> (UB): the optimiser may produce any result, including code that seems to work in tests and fails in production. The main rules:</p>
<ul>
<li>No dangling, misaligned or null pointer dereferences; no out-of-bounds access.</li>
<li>The aliasing rules: while a <code>&amp;mut T</code> is live, nothing else accesses that memory; while a <code>&amp;T</code> is live, nothing mutates it (except through <code>UnsafeCell</code>).</li>
<li>Every value is valid for its type: a <code>bool</code> is 0 or 1, a <code>char</code> is a Unicode scalar, an enum has a valid discriminant, references are non-null and aligned, uninitialised memory is never read as a typed value.</li>
<li>No data races.</li>
<li>No unwinding out of a function with an ABI that does not allow it (a panic must not cross into C through an <code>extern "C"</code> function), and no calling a function through a pointer with the wrong signature or ABI.</li>
</ul>
<p>Library types add their own invariants on top: a <code>str</code> must be UTF-8, a <code>Vec</code>'s length must not exceed its capacity. Breaking them with unsafe code (<code>from_utf8_unchecked</code>, <code>set_len</code>) is not immediately UB, but any safe code that later relies on them may be.</p>

<h2>Safe abstractions</h2>
${fig('layers', '<b>Figure 17.1</b> Where unsafe code lives in a well-designed system.')}
<p>The goal of unsafe code is to build a <b>safe abstraction</b>: an API that no safe caller can misuse to cause UB, whatever arguments they pass. The standard library's <code>split_at_mut</code> is the classic example: the borrow checker cannot see that two halves of a slice do not overlap, so the implementation uses raw pointers, and the public signature carries the guarantee.</p>
${EX('c17-unsafe', 'split_at_mut, a fixed-capacity stack with MaybeUninit, an unsafe fn contract and raw pointers')}
<p>Conventions that make unsafe code reviewable, visible in the example:</p>
<ul>
<li>Every <code>unsafe</code> block has a <code>// SAFETY:</code> comment explaining why each condition holds. Clippy's <code>undocumented_unsafe_blocks</code> lint enforces it once you enable it (it is in the off-by-default restriction group).</li>
<li>Every <code>unsafe fn</code> has a <code># Safety</code> section in its documentation stating what the caller must guarantee.</li>
<li>Types with invariants (the stack's "first <code>len</code> elements are initialised") state them once, keep the fields private, and every method maintains them.</li>
<li>Unsafe operations inside an <code>unsafe fn</code> go in their own <code>unsafe</code> blocks with their own SAFETY comments; Edition 2024 warns otherwise.</li>
</ul>
<h3>What Edition 2024 changed</h3>
<div class="tbl"><table>
<tr><th>Change</th><th>Why</th></tr>
<tr><td><code>unsafe_op_in_unsafe_fn</code> warns by default</td><td>An <code>unsafe fn</code> states a contract for its callers; it should not silently make its whole body unchecked</td></tr>
<tr><td><code>extern</code> blocks must be written <code>unsafe extern</code>; items in them can be marked <code>safe</code></td><td>The declarations are promises about foreign code the compiler cannot verify. A <code>safe fn</code> (say, C's <code>abs</code>) can then be called without an unsafe block</td></tr>
<tr><td><code>no_mangle</code>, <code>export_name</code> and <code>link_section</code> must be written <code>#[unsafe(…)]</code></td><td>Two exported symbols with the same name, or a symbol that collides with a libc function, is UB at link time</td></tr>
<tr><td><code>std::env::set_var</code> and <code>remove_var</code> are <code>unsafe</code></td><td>On most Unix platforms, changing the environment while another thread reads it (including C code such as <code>getaddrinfo</code>) is a data race the library cannot prevent. Set variables before spawning threads, or pass configuration explicitly</td></tr>
<tr><td>References to <code>static mut</code> are denied (<code>static_mut_refs</code>)</td><td>Creating <code>&amp;</code> or <code>&amp;mut</code> to a mutable static almost always breaks the aliasing rules. Use an atomic, a <code>Mutex</code>, <code>OnceLock</code>, or <code>&amp;raw mut</code> if you really need a pointer</td></tr>
</table></div>

<h2>Checking unsafe code</h2>
<div class="tbl"><table>
<tr><th>Tool</th><th>What it finds</th></tr>
<tr><td><b>Miri</b> (<code>cargo +nightly miri test</code>)</td><td>An interpreter for Rust's intermediate representation that detects most UB as it happens: out-of-bounds access, use-after-free, invalid values, aliasing violations (Stacked Borrows by default, Tree Borrows with <code>-Zmiri-tree-borrows</code>), leaks and data races, on the paths your tests run. It is orders of magnitude slower than native code, so run a focused test subset under it in CI for any crate with unsafe code.</td></tr>
<tr><td>Sanitisers (<code>RUSTFLAGS=-Zsanitizer=address</code>, or <code>thread</code>, <code>memory</code>)</td><td>Fast native checks, still nightly-only as of 1.100 (AddressSanitizer is close to stabilisation). Useful for FFI-heavy code that Miri cannot run.</td></tr>
<tr><td>Kani</td><td>A model checker that proves properties for all inputs within bounds, used by AWS on Firecracker and parts of the standard library.</td></tr>
<tr><td>cargo-geiger, <code>#![forbid(unsafe_code)]</code></td><td>Inventory unsafe usage in your dependency tree; forbid it in crates that should not need it.</td></tr>
<tr><td>Fuzzing</td><td>Drives parsers with random input under sanitisers (Chapter 20).</td></tr>
</table></div>

<h2>When to use unsafe</h2>
<ul>
<li><b>FFI</b>: calling C or being called from it (Chapter 18). Unavoidable, so wrap it once.</li>
<li><b>Performance</b>, after profiling: skipping a bounds check the optimiser could not remove, SIMD intrinsics, a custom allocator, a lock-free queue. Measure first; safe Rust is usually fast enough.</li>
<li><b>Hardware</b>: memory-mapped registers in embedded code and kernels, normally behind a HAL.</li>
<li><b>Never</b> to silence the borrow checker for ordinary application logic. If it rejects your design, change the design.</li>
</ul>
<p>Rust 1.100 stabilised the <code>Allocator</code> trait with <code>Global</code> and <code>System</code>, and the allocator-aware constructors of <code>Box</code> and <code>Vec</code> (<code>Box::new_in</code>, <code>Vec::new_in</code>, <code>Vec::with_capacity_in</code> and friends), so a collection can use an arena or a pool without unsafe code in the caller. <code>Allocator</code> is an unsafe trait: writing an allocator remains unsafe; using one is not.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Creating a <code>&amp;mut</code> to memory that something else can access</strong>, even briefly; this is UB even if you never use both.</li>
<li><strong><code>mem::transmute</code></strong> between types with different validity rules or layouts; prefer <code>from_ne_bytes</code>, <code>bytemuck</code> or <code>zerocopy</code>.</li>
<li><strong>Reading uninitialised memory</strong> via <code>mem::uninitialized</code> (deprecated) or <code>set_len</code> before writing; use <code>MaybeUninit</code>.</li>
<li><strong>Exposing unsound safe APIs</strong>: if any safe caller could trigger UB, the bug is in your crate, not theirs.</li>
<li><strong><code>unsafe impl Send/Sync</code></strong> without a written argument; it is how many soundness bugs in published crates happened.</li>
<li><strong>Integers cast to pointers</strong>: a pointer carries provenance (which allocation it may access) that an integer does not. Use the strict-provenance APIs (stable since 1.84: <code>ptr.addr()</code>, <code>ptr.with_addr(a)</code>, <code>ptr::without_provenance</code>) instead of <code>as</code> casts, so Miri can check the code.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Is this unsafe?</summary><p>Does <code>let p = &amp;raw const x;</code> need an unsafe block? Does <code>println!("{}", *p)</code>?</p><p><em>Answer:</em> creating a raw pointer is safe; dereferencing it requires unsafe.</p></details>
<details><summary>Edition 2024 upgrade</summary><p>After moving a service to Edition 2024, <code>std::env::set_var("TZ", "UTC")</code> in a request handler no longer compiles without <code>unsafe</code>. What is the right fix?</p><p><em>Answer:</em> not an unsafe block. The call was always a data race if any other thread could read the environment, which in a multi-threaded server it can. Set the variable before the runtime starts (at the top of <code>main</code>, before any thread is spawned) or, better, pass the value as configuration and never mutate the process environment at run time.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Find the soundness bug</summary><p><code>pub fn get(v: &amp;[u8], i: usize) -&gt; u8 { unsafe { *v.get_unchecked(i) } }</code>. What is wrong, and how do you fix it?</p><p><em>Answer:</em> it is a safe function that lets any caller read out of bounds, so it is unsound. Either check <code>i &lt; v.len()</code> before the unsafe call (and then <code>v[i]</code> is just as fast after optimisation), or make the function <code>unsafe fn</code> with a <code># Safety</code> section.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Drop and leaks</summary><p>Why is <code>std::mem::forget</code> a safe function, even though it stops a destructor from running?</p><p><em>Answer:</em> leaking memory or resources is not undefined behaviour, and leaks can already happen in safe code through Rc cycles. So Rust's safety guarantee cannot depend on destructors running; unsafe code must stay sound even if a value is forgotten. This is why APIs like scoped threads join in the scope function rather than relying on a guard's Drop.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know the operations an unsafe block allows, and that everything else is still checked.</li>
<li>I know what Edition 2024 changed: unsafe extern, unsafe attributes, unsafe set_var, and no references to static mut.</li>
<li>I can list the main sources of undefined behaviour.</li>
<li>I write SAFETY comments, # Safety docs and maintain type invariants.</li>
<li>I can build a safe abstraction around unsafe code.</li>
<li>I test unsafe code with Miri, sanitisers, fuzzing and, where justified, Kani.</li>
</ul>
`});

CH.push({
  id: 'ch18', n: 18, title: 'FFI: C, C++, Java and Python',
  lede: 'Rust rarely arrives alone. It replaces one component of a C++ system, speeds up a Python library, or provides a native core to a Java service. Because Rust has no runtime and speaks the C ABI natively, it can be called from, and call into, almost anything at zero overhead. This chapter shows the C boundary in both directions, calling Rust from Java with the Foreign Function and Memory API, and the tools for C++, Python, Node and mobile.',
  html: `
<h2>The C ABI is the common language</h2>
${fig('hub', '<b>Figure 18.1</b> One Rust core, many hosts: the tools for each boundary.')}
<p>Every mainstream language can call C functions, so a Rust library that exposes a C ABI can be used from all of them. The rules at the boundary are C's: only C-compatible types cross (integers, floats, raw pointers, <code>#[repr(C)]</code> structs and enums), memory allocated on one side is freed on the same side, strings are pointers to NUL-terminated bytes, errors are return codes, and panics must not unwind across (since 1.81, a panic escaping an <code>extern "C"</code> function aborts the process instead of causing UB; use <code>extern "C-unwind"</code> only when both sides support unwinding).</p>

<h2>Calling C, and being called from C</h2>
${EX('c18-ffi-c', 'A C library compiled by build.rs, a safe wrapper, and a Rust callback passed to C')}
<p>The pattern to copy: declare the foreign functions in an <code>unsafe extern "C"</code> block exactly once, in a private module; write a safe wrapper that converts types (<code>&amp;str</code> to <code>CString</code>), upholds the C function's requirements, and turns return codes into a <code>Result</code>; expose only the wrapper. For large C APIs, <b>bindgen</b> generates the declarations from the header in <code>build.rs</code>, and a separate <code>-sys</code> crate conventionally holds the raw bindings and linking logic (<code>openssl-sys</code>, <code>libz-sys</code>). In the other direction, <b>cbindgen</b> generates a C header from your <code>#[unsafe(no_mangle)] pub extern "C" fn</code> exports so C and C++ code can call Rust.</p>

<h2>Calling Rust from Java</h2>
<p>For a JVM shop this is the most useful boundary. Java 22 finalised the <b>Foreign Function and Memory (FFM) API</b> (Project Panama), which calls native functions directly through method handles: no JNI C glue, no <code>native</code> methods, and memory managed through arenas. The Rust side exports a C function from a <code>cdylib</code> crate; the Java side looks it up and calls it.</p>
${EX('c18-java-ffm', 'A Rust risk-scoring library called from Java through FFM', { cmd: 'cargo build --release && javac -d out java/RiskDemo.java && java --enable-native-access=ALL-UNNAMED -cp out RiskDemo target/release/librisk.so' })}
<p>FFM was a preview feature in JDK 21 and became final in Java 22; the Java 25 LTS has the final API. The code is the same on both apart from one call: a Java string is copied into native memory with <code>arena.allocateUtf8String(s)</code> on 21 and <code>arena.allocateFrom(s)</code> on 22 and later. On 21 you must also compile and run with <code>--enable-preview</code>, and preview code compiled for 21 runs only on 21, so a shop standardised on Java 21 should treat FFM code as tied to that release, or use JNI until it moves to 25. <code>--enable-native-access</code> acknowledges that native code can break the JVM's safety guarantees; without it, Java 22 and later print a warning the first time a restricted method such as <code>SymbolLookup.libraryLookup</code> is called. <b>jextract</b> generates the Java bindings from a C header, which cbindgen can produce from the Rust crate, so the whole binding can be generated.</p>
<div class="tbl"><table>
<tr><th></th><th>FFM API (Java 22+)</th><th>JNI with the jni crate</th></tr>
<tr><td>Rust side</td><td>Plain <code>extern "C"</code> functions</td><td>Functions named <code>Java_pkg_Class_method</code> taking <code>JNIEnv</code></td></tr>
<tr><td>Java side</td><td>Method handles, arenas, layouts; jextract can generate it</td><td><code>native</code> method declarations</td></tr>
<tr><td>Calling back into Java, Java objects</td><td>Upcall stubs</td><td>Full access to Java objects through JNIEnv</td></tr>
<tr><td>Overhead</td><td>Low, optimised by the JIT</td><td>Higher per call</td></tr>
<tr><td>Choose when</td><td>New code on Java 22+, plain data in and out</td><td>Older JVMs, or the Rust code must manipulate Java objects</td></tr>
</table></div>
<div class="note key"><b>Designing the boundary</b><p>Make calls coarse-grained: one call that scores a batch of 1,000 transactions beats 1,000 calls. Pass flat data (numbers, byte buffers, a serialised message such as protobuf or FlatBuffers) rather than object graphs. Keep ownership simple: the caller allocates and frees, or Rust exports a matching <code>free</code> function for anything it allocates. For services, also consider not using FFI at all: a Rust sidecar over gRPC or a Unix socket isolates crashes and versions, at the cost of a network hop.</p></div>

<h2>C++</h2>
<p>For C++, the <b>cxx</b> crate defines the boundary once in a Rust module (<code>#[cxx::bridge]</code>) and generates both sides, with safe support for <code>std::string</code>, <code>std::vector</code>, <code>std::unique_ptr</code>, Rust <code>String</code>, <code>Vec</code>, <code>Box</code> and shared structs. It is the standard choice for adding Rust components to large C++ codebases and is used in Chromium. <b>autocxx</b> generates cxx bridges from existing headers. In mixed codebases the boundary, not the Rust code behind it, tends to be where the effort goes, so invest in a small, clean one.</p>
<p>Since 1.99 Rust can also <em>define</em> C-variadic functions (<code>unsafe extern "C" fn log_event(fmt: *const c_char, mut args: ...)</code>), so a Rust library can replace a C one whose API includes a <code>printf</code>-style function. Calling variadic C functions has always worked.</p>

<h2>Python, Node and mobile</h2>
<ul>
<li><b>PyO3</b> writes Python extension modules in Rust with <code>#[pyfunction]</code> and <code>#[pyclass]</code>; <b>maturin</b> builds and publishes wheels for every platform. Chapter 26 has a lab. Release the GIL around heavy Rust work (<code>py.detach</code> since PyO3 0.26, formerly <code>allow_threads</code>) to get real parallelism, and target the stable ABI (abi3) to ship one wheel per platform for every CPython version from your chosen minimum. Free-threaded builds cannot use abi3 wheels. Python 3.15 added a second stable ABI, abi3t, which covers both free-threaded and GIL-enabled builds, and PyO3 supports it from 0.29 (the <code>abi3t</code> feature); the free-threaded 3.13t and 3.14t builds still need a wheel per Python version.</li>
<li><b>napi-rs</b> does the same for Node.js native addons, and is how tools such as the Rspack and Rolldown bundlers expose Rust to JavaScript.</li>
<li><b>UniFFI</b> (from Mozilla) generates Kotlin, Swift and Python bindings from one Rust interface definition; Firefox and several mobile wallets and messengers share Rust cores between iOS and Android this way.</li>
<li><b>Go</b> can call Rust through cgo and the C ABI; each call costs more than a Go function call, so batch work across the boundary.</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Freeing on the wrong side</strong>: memory allocated by Rust's allocator must be freed by Rust, and C's by C's <code>free</code>.</li>
<li><strong>Lifetimes the C side does not respect</strong>: a pointer returned to C into a Rust Vec dangles when the Vec reallocates or drops.</li>
<li><strong>Assuming Rust layout</strong> for structs passed to C; use <code>#[repr(C)]</code> and check with bindgen's layout tests.</li>
<li><strong>Panics across the boundary</strong>: wrap exported functions in <code>catch_unwind</code> if you want to return an error code instead of aborting.</li>
<li><strong>Thread affinity</strong>: some host runtimes (the JVM, Python with the GIL, UI toolkits) require calls back into them from particular threads.</li>
<li><strong>C enums received as Rust enums</strong>: if C passes a value outside the declared variants, that is UB on the Rust side. Receive the field as an integer (<code>c_int</code>) and convert with <code>TryFrom</code>; likewise receive C <code>bool</code>-like ints as integers, not <code>bool</code>.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Strings across the boundary</summary><p>Why can't you pass a Rust <code>&amp;str</code> directly to a C function expecting <code>const char*</code>?</p><p><em>Answer:</em> a <code>&amp;str</code> is a pointer plus a length and is not NUL-terminated; it may also contain interior NUL bytes. Convert with <code>CString::new</code>, which adds the terminator and rejects interior NULs.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A batch API for Java</summary><p>Change <code>risk_score</code> to score many transactions per call. What signature would you export?</p><p><em>Answer:</em> <code>pub unsafe extern "C" fn risk_scores(txns: *const Txn, n: usize, out: *mut i32) -&gt; i32</code> with <code>#[repr(C)] struct Txn { amount_minor: i64, country: [u8; 2], velocity: u32 }</code>; Java allocates both arrays in an Arena with matching struct and sequence layouts, and the return value is an error code. One crossing per batch.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why abort on panic in extern "C"?</summary><p>Before Rust 1.81, a panic unwinding out of an <code>extern "C"</code> function was undefined behaviour. Why is aborting the right default?</p><p><em>Answer:</em> C frames have no unwinding information or destructors to run, so unwinding through them can corrupt state or skip clean-up in ways the C code never expected. Aborting is predictable and safe; code that needs to report the error should catch the panic at the boundary and return an error code.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know the rules of the C ABI boundary: types, ownership, strings, errors and panics.</li>
<li>I can call C from Rust behind a safe wrapper and export Rust functions to C.</li>
<li>I can call Rust from Java with FFM and know when JNI is still the right tool.</li>
<li>I know the standard tools for C++, Python, Node, mobile and Go.</li>
<li>I design coarse-grained boundaries with clear ownership.</li>
</ul>
`});

CH.push({
  id: 'ch19', n: 19, title: 'Performance and Profiling',
  lede: 'Rust gives you the control to make code fast, but it does not make every program fast by itself. Allocation in hot paths, needless copies, lock contention and the wrong data structure cost as much in Rust as anywhere. This chapter covers how to measure (benchmarks and profilers), the common sources of slowness and their fixes, build profiles, compile times and binary size.',
  html: `
<h2>Measure first</h2>
<p>Optimisation without measurement is guessing. The workflow: reproduce the workload, profile it to find where time goes, form a hypothesis, change one thing, measure again with a benchmark that would catch a regression. Always measure release builds (<code>--release</code>), with the same CPU limits as production; a container throttled to two cores behaves very differently from a laptop.</p>
<div class="tbl"><table>
<tr><th>Tool</th><th>Use for</th></tr>
<tr><td><code>criterion</code>, <code>divan</code></td><td>Statistical micro-benchmarks in <code>benches/</code>, with outlier detection and comparison against a saved baseline</td></tr>
<tr><td><code>perf record</code> + <code>cargo flamegraph</code>, samply</td><td>Sampling CPU profiles of a whole program; flame graphs show where time goes</td></tr>
<tr><td>heaptrack, dhat (dhat-rs)</td><td>Allocation counts, sizes and call sites</td></tr>
<tr><td><code>tokio-console</code>, Tokio runtime metrics</td><td>Async tasks that poll too long, busy workers, queue depths</td></tr>
<tr><td><code>cargo build --timings</code></td><td>Which crates dominate compile time</td></tr>
<tr><td>cargo-bloat, twiggy</td><td>What makes a binary or Wasm module large</td></tr>
<tr><td><code>cargo asm</code>, Compiler Explorer</td><td>The machine code a function compiles to (did it vectorise? inline?)</td></tr>
</table></div>
${fig('flame', '<b>Figure 19.1</b> An illustrative flame graph for a payment API handler. The widest bars are the cost; here logging and serialisation, not the cryptography.')}
<p>Reading a flame graph: the x-axis is the share of samples (not time order), each bar is a function, and its parents are below it. Look for wide plateaus near the top. In the illustration the surprise is a <code>tracing</code> call formatting fields into a String on every request, and response serialisation growing a <code>Vec</code> repeatedly; both are allocation problems, the most common kind in Rust services.</p>

<h2>The usual suspects</h2>
${EX('c19-alloc', 'Five ways to build the same 3 MB of CSV, release build')}
<p>Two lessons from the numbers. Reserving capacity made no consistent difference here, because a growing <code>String</code> doubles its capacity and so reallocates only about twenty times on the way to 3 MB; one allocation per line is what cost. And the per-field <code>to_string</code> version is at least as fast as <code>write!</code> despite allocating twice per line, because the <code>fmt</code> machinery has a cost of its own; formatting integers into a stack buffer with the itoa crate removes both and is two to three times faster than either. (Exact timings vary from run to run; the ordering is what to look at.)</p>
<ul>
<li><b>Allocation</b>: <code>format!</code>, <code>to_string</code>, <code>clone</code> and collecting into temporary Vecs in hot loops. Reuse buffers (<code>clear()</code> keeps capacity), reserve capacity, write into a buffer with <code>write!</code>, return <code>&amp;str</code> or <code>Cow</code>, and use <code>SmallVec</code> or arrays for small bounded collections. Since 1.98 the standard library can format an integer into a stack buffer too (<code>n.format_into(&amp;mut core::fmt::NumBuffer::new())</code>), the job the itoa crate does in the example.</li>
<li><b>The allocator</b>: the system allocator is fine for most programs; heavily multi-threaded allocation-heavy services often gain from mimalloc or jemalloc (<code>#[global_allocator]</code>), and arenas (bumpalo, or since 1.100 any <code>Allocator</code> passed to <code>Vec::new_in</code> or <code>Box::new_in</code>) make per-request allocation almost free.</li>
<li><b>Data layout</b>: a <code>Vec</code> of small structs scanned linearly beats a <code>HashMap</code> or a linked structure for surprisingly large sizes. Keep hot fields together; consider struct-of-arrays for analytics.</li>
<li><b>Hashing</b>: the default SipHash resists hash-flooding attacks but is relatively slow for small keys; a faster hasher (foldhash, FxHash) helps when keys are not attacker-controlled.</li>
<li><b>Contention</b>: one hot <code>Mutex</code> serialises all threads. Shard, use atomics, or use per-thread state merged at the end.</li>
<li><b>Dynamic dispatch and bounds checks</b> matter only in the tightest loops; check the profile before changing them.</li>
<li><b>I/O</b>: use <code>BufReader</code> and <code>BufWriter</code> (unbuffered <code>File</code> writes are a syscall each), lock stdout once for bulk output, and batch database calls.</li>
</ul>

<h2>Build profiles</h2>
${fig('profile', '<b>Figure 19.2</b> Interactive: what each release-profile setting trades.')}
${T('A typical production profile')`
[profile.release]
lto = "thin"            # cross-crate inlining at moderate link cost
codegen-units = 4       # some parallelism, better optimisation than 16
debug = "line-tables-only"   # file and line numbers for profiles and backtraces
overflow-checks = true  # for money-handling code (Chapter 3)

[profile.release-small] # for Lambda, Wasm, embedded
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"`}
<p>Two more levers for CPU-bound code: <b>profile-guided optimisation</b> (build instrumented with cargo-pgo, run a representative workload, rebuild with the profile; it helps most on large, branchy code such as compilers, parsers and interpreters, and the Rust compiler's own release builds use it on x86-64 Linux) and <b>target features</b> (<code>-C target-cpu=x86-64-v3</code> enables AVX2 when you know every production machine has it; prefer runtime detection with <code>is_x86_feature_detected!</code> for code that ships to unknown hardware).</p>

<h2>Compile times</h2>
<p>Rust compile times are a real cost and worth managing like any other:</p>
<ul>
<li>Split large crates: the compiler parallelises across crates, and an edit recompiles only what depends on it.</li>
<li>Avoid heavy generic instantiation across crate boundaries and needless proc macros; check <code>cargo build --timings</code>.</li>
<li>Use <code>cargo check</code> while editing (no code generation) and keep debug builds lean (<code>debug = "line-tables-only"</code> for dependencies).</li>
<li>A fast linker matters for incremental builds: LLD is the default on x86-64 Linux since 1.90, and mold is faster still.</li>
<li>Cache in CI: <code>Swatinem/rust-cache</code> on GitHub Actions or sccache. Since 1.100 Cargo uses a new layout for intermediate artefacts in the build directory; scripts that dig through <code>target/</code> for files should read Cargo's JSON messages (<code>--message-format=json</code>) instead, because the layout is not a stable interface.</li>
<li>Since 1.99 Cargo turns incremental compilation off by default when it detects CI (the <code>CI</code> environment variable), since incremental artefacts rarely survive between CI runs.</li>
<li>The Cranelift backend (nightly, <code>-Zcodegen-backend=cranelift</code>) speeds up debug builds noticeably for some projects.</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Micro-benchmarks the optimiser deletes</strong>: use <code>std::hint::black_box</code> on inputs and outputs, as the examples do.</li>
<li><strong>Benchmarking on a noisy laptop</strong> and trusting a 3% difference; use criterion's statistics and dedicated runners.</li>
<li><strong>Optimising the wrong layer</strong>: a 30% faster parser does not matter if the request waits 40 ms on the database.</li>
<li><strong>Turning on every flag</strong> (<code>codegen-units = 1</code>, fat LTO) for development builds, then complaining about compile times.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Why was the first CSV version slowest?</summary><p>Explain the gap between "format! per line, collect, join" and "write! into one String, reserved".</p><p><em>Answer:</em> the first allocates a String per line, a Vec of 200,000 Strings, then a final String and copies every byte again; the last writes every byte once into a buffer that never reallocates.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A benchmark with a baseline</summary><p>Add a criterion benchmark for the fee function of Chapter 20 and make CI fail if it regresses by more than 10%.</p><p><em>Answer:</em> add criterion as a dev-dependency with <code>[[bench]] name = "fee" harness = false</code>; in CI run <code>cargo bench -- --save-baseline main</code> on the main branch and <code>--baseline main</code> on pull requests. Criterion reports regressions but does not fail the build, so compare the saved baselines with a tool (critcmp, or a benchmark-tracking service) and fail the job past your threshold. Noise makes a 10% threshold unreliable on shared runners; use dedicated machines, or count instructions instead of time with Gungraun (formerly iai-callgrind), which is stable enough for CI gates.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why do iterators match indexing?</summary><p>In Chapter 9 the index loop and the iterator chain ran at the same speed. Why is the index loop not slower, given that <code>v[i]</code> is bounds-checked?</p><p><em>Answer:</em> the loop condition <code>i &lt; v.len()</code> lets LLVM prove every index is in range, so it removes the check and vectorises the loop, producing the same code as the iterator. The iterator gets there without needing that proof, which is why it stays fast in loops where the index arithmetic is less obvious (stepping by two, indexing a second slice) and the check would survive.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I measure with benchmarks and profilers before optimising.</li>
<li>I can read a flame graph and find allocation hot spots.</li>
<li>I know the common sources of slowness in Rust and their fixes.</li>
<li>I can configure release profiles for speed or size, and know PGO and target features.</li>
<li>I can manage compile times in a growing codebase.</li>
</ul>
`});
