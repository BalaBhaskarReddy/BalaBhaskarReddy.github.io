<tr><td><b>Startup and footprint</b></td><td>Milliseconds, a few MiB</td><td>Milliseconds, ~10 MiB</td><td>Hundreds of ms on a JVM; fast with native-image</td><td>Milliseconds, small</td><td>Tens of ms, interpreter</td><td>Milliseconds, small</td></tr>
<tr><td><b>Error handling</b></td><td>Result and Option, checked</td><td>Error values, unchecked</td><td>Exceptions</td><td>Exceptions or codes</td><td>Exceptions</td><td>Error unions, checked</td></tr>
<tr><td><b>Generics</b></td><td>Traits, monomorphised</td><td>Type parameters, dictionary-based</td><td>Erased</td><td>Templates and concepts</td><td>Type hints only</td><td>comptime</td></tr>
<tr><td><b>Compile speed</b></td><td>Slow to moderate</td><td>Very fast</td><td>Fast</td><td>Slow</td><td>None</td><td>Fast; incremental on x86-64 Linux</td></tr>
<tr><td><b>Packaging</b></td><td>Cargo and crates.io, uniform</td><td>Go modules, uniform</td><td>Maven, Gradle</td><td>CMake plus vcpkg or Conan; fragmented</td><td>pip, uv, Poetry</td><td>Zig build system</td></tr>
<tr><td><b>C interop</b></td><td>Zero-cost, both directions</td><td>cgo, with call overhead</td><td>FFM API (Java 22+), JNI</td><td>Native</td><td>C API, ctypes, cffi</td><td>Ships a C compiler; translates C headers in the build</td></tr>
<tr><td><b>Stability</b></td><td>1.x since 2015, editions</td><td>1.x since 2012</td><td>Strong, LTS releases</td><td>ISO standard; C++26 finalised in 2026</td><td>3.x</td><td>Pre-1.0 (0.17, October 2026); breaking changes each release</td></tr>
</table></div>

<h2>Rust and C++</h2>
<p>This is the comparison Rust was designed around. Both compile to native code through an optimiser (LLVM for both, usually), both have zero-cost abstractions, RAII, generics compiled per type and no mandatory runtime, and in benchmarks they land within a few percent of each other. The difference is what the compiler checks. In C++ the lifetime of every pointer and reference, and the absence of data races, is the programmer's responsibility; in Rust it is the compiler's.</p>
<p>C++ is not standing still. C++26, technically complete in March 2026, makes reading an uninitialised local erroneous behaviour rather than undefined, adds a hardened standard library with bounds checks on <code>vector</code>, <code>span</code>, <code>string</code> and friends, and adds contracts and reflection. Safety profiles, which would restrict code to a checked subset, did not make C++26 and are being worked on for C++29. These help existing code, and every large C++ codebase should adopt them; they do not provide lifetime safety.</p>
<p>Where C++ still wins: enormous existing codebases, mature GPU and HPC toolchains (CUDA), game engines, vendor SDKs, and teams with deep C++ expertise. In practice organisations rarely rewrite; they write <b>new</b> components in Rust and connect them through a C ABI or the cxx crate (Chapter 18). Google's data shows why that works: most memory-safety bugs are in new code, so stopping new unsafe code shrinks the problem even while old code stays.</p>

<h2>Rust and Go</h2>
<p>Go and Rust are often compared because both produce static binaries and both are popular for infrastructure. They made opposite bets. Go chose simplicity: a small language, a garbage collector, goroutines in the runtime, very fast builds, and a strong standard library for network services. Rust chose control and compile-time proof: no GC, explicit ownership, a richer type system, and slower builds.</p>
<ul>
<li><b>Choose Go</b> for network services and Kubernetes tooling where development speed and onboarding matter more than the last 30% of efficiency, and where the Go ecosystem (client-go, controller-runtime, the cloud SDKs) is the centre of gravity.</li>
<li><b>Choose Rust</b> when memory per instance or tail latency is a cost driver, when the component is on a data path (proxies, storage engines, codecs), when you need to embed it in another process or run it without an OS, or when a data race would be a serious incident. Go's race detector finds races only on paths your tests run; Rust rejects them at compile time.</li>
</ul>
${EX('c02-race-fail', 'A data race Go and Java would compile')}
${EX('c02-race-ok', 'Two correct versions')}
<p>The compiler did not just complain; it forced a choice between two designs that are both correct: an atomic counter, or a <code>Mutex</code> that <i>owns</i> the vector so the only way to reach the data is through the lock. In Go or Java the lock and the data it protects are separate, and nothing stops code from touching the data without the lock.</p>

<h2>Rust and Java</h2>
<p>For an architect with a JVM background, the useful frame is: Java optimises the whole team's productivity on long-lived business systems; Rust optimises the efficiency and correctness of a component. The JVM gives you a mature GC, excellent profilers and observability, dynamic class loading, and the deepest enterprise ecosystem. It costs memory (heap headroom and the JVM itself), startup time (mitigated by class-data sharing, the Project Leyden ahead-of-time cache in JDK 24 and later, CRaC and GraalVM native-image) and some unpredictability at the tail.</p>
<p>Concrete places Rust appears in JVM shops: sidecars and gateways where pod memory is multiplied by thousands of replicas, Lambda functions where cold start is billed, CPU-heavy libraries called from Java through the Foreign Function and Memory API (final since Java 22, and much simpler than JNI), and native components such as compression, cryptography or parsers. Chapter 18 builds a Rust library and calls it from Java through the FFM API.</p>
${fig('heap', '<b>Figure 2.2</b> Interactive: how memory in use relates to live data under a tracing GC and under ownership. The curves illustrate the mechanism, not a measurement.')}

<h2>Rust and Python</h2>
<p>These two are partners more than rivals. Python is the best language for exploration, notebooks and glue; Rust is one of the best languages for writing the fast core that Python calls. PyO3 and maturin make a Rust function importable from Python in a few lines (Chapter 26 has a lab), and much of the modern Python toolchain is Rust: uv and ruff, the pydantic-core validation engine, Polars, tokenizers. The typical pattern is to keep the Python API and move the hot loop to Rust, gaining 10 to 100 times on CPU-bound code and releasing the GIL for real parallelism.</p>

<h2>Rust and Zig</h2>
<p>Zig is a modern C replacement: simple, explicit about every allocation (allocators are passed as parameters), with compile-time execution (<code>comptime</code>) instead of generics and macros, and excellent C interop and cross-compilation. It does not attempt to prove memory safety; its safe build modes catch some errors at runtime. Zig is still pre-1.0: 0.16 (April 2026) made all I/O go through an <code>Io</code> interface, and 0.17 (October 2026) reworked the build system and removed <code>@cImport</code> in favour of C translation in the build, so expect breaking changes. Choose it when you want C's model with better tools; choose Rust when you want the compiler to guarantee safety. Some teams use Zig's toolchain (<code>zig cc</code>) to cross-compile Rust and C code even if they write no Zig.</p>

<h2>Rust, C# and Swift</h2>
<p>C# and .NET occupy the same space as Java, with value types, <code>Span&lt;T&gt;</code> and Native AOT narrowing the performance and startup gap. Swift is memory safe through automatic reference counting and has added compile-time data-race checking (the Swift 6 language mode) and opt-in ownership features (non-copyable types, <code>borrowing</code> and <code>consuming</code> parameters) similar in spirit to Rust's; it dominates Apple platforms and has a newer embedded mode. Of the three, Rust has the most mature support for running with no runtime at all, and it frees memory without reference-counting traffic unless you ask for <code>Rc</code> or <code>Arc</code>.</p>

<h2>The evidence from large adopters</h2>
${fig('android', '<b>Figure 2.3</b> Memory-safety bugs as a share of Android\'s vulnerabilities, as Google reported them. The 2024 figure was extrapolated from part of the year; the 2025 figure is from Google\'s November 2025 report.')}
<ul>
<li><b>Android</b> (Google, November 2025): about 5 million lines of Rust in the platform, roughly 4% of it inside <code>unsafe</code> blocks; memory-safety issues fell below 20% of vulnerabilities for the first time; an estimated memory-safety vulnerability density for Rust of about 0.2 per million lines against close to 1,000 for C and C++; a rollback rate for medium and large Rust changes about four times lower than for C++, and about 25% less time in code review. Google also reported its first near-miss Rust memory-safety bug, a buffer overflow in <code>unsafe</code> code in the CrabbyAVIF image decoder, caught before release and made non-exploitable by the Scudo allocator's guard pages: <code>unsafe</code> code still needs review, fuzzing and hardening.</li>
<li><b>Linux</b>: at the December 2025 Maintainers Summit the kernel developers agreed to end Rust's "experimental" status. Android 16 devices on kernel 6.12 ship a Rust ashmem module; the Rust binder driver was merged for 6.18; and the DRM (graphics) maintainer said the subsystem was about a year away from requiring Rust for new drivers.</li>
<li><b>Microsoft</b>: Rust is used in Windows (including kernel components) and in Azure infrastructure such as the OpenHCL paravisor and firmware. In September 2026 Microsoft announced Rust as a Tier-1 language for internal development alongside C++, C# and TypeScript: an internal support label (not a Rust Project tier) meaning a supported toolchain, CI and compliance path for every team, including a code-generation backend that connects rustc to the MSVC back end.</li>
<li><b>Cloud providers</b>: AWS builds Firecracker (the microVM monitor behind Lambda and Fargate), Bottlerocket and parts of S3's storage layer in Rust. Cloudflare built its Pingora proxy framework in Rust and in 2025 replaced its core request proxy with FL2, a Rust rewrite it reports uses half the CPU and less than half the memory of the system it replaced. The same proxy was also at the centre of Cloudflare's 18 November 2025 outage, when an oversized configuration file made it call <code>unwrap()</code> on an error (Chapter 7): memory safety is not the same as robustness.</li>
<li><b>Governments and regulators</b>: in their Product Security Bad Practices guidance (voluntary, published October 2024 and updated January 2025), CISA and the FBI asked manufacturers of software used in critical infrastructure to publish memory-safety roadmaps by 1 January 2026, naming memory-safe languages as the preferred long-term fix. If you sell software to regulated customers, expect questions about your memory-safety plan; Chapter 30 covers how to answer them.</li>
</ul>

<h2>Where Rust is the wrong tool</h2>
<ul>
<li><b>Prototypes and throwaway scripts</b>, where correctness proofs slow you down and nothing will run in production.</li>
<li><b>Thin CRUD services</b> that mostly call a database and other services, in a team fluent in Go or Java. The efficiency gain rarely pays for the learning curve and slower builds.</li>
<li><b>Work dominated by one framework</b> (Spring, Django, Rails, a game engine) whose value is its ecosystem.</li>
<li><b>Model training and research code</b>, which lives in Python and CUDA.</li>
<li><b>A single developer's Rust island</b>. If only one person can maintain it, it is a risk however good the code is. Adopt Rust as a team (Chapter 30).</li>
</ul>
<div class="note key"><b>A rule of thumb</b><p>Ask three questions. Would a memory-safety bug or data race here be a security incident or a large outage? Does memory, latency or CPU cost scale with traffic or replicas? Does this code need to run somewhere without a runtime (kernel, firmware, browser, inside another process)? Two yeses make a strong case for Rust; none suggests Go, Java or Python will serve you better.</p></div>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Choosing Rust for performance alone</strong> on I/O-bound services, where the database is the bottleneck and the gain is small.</li>
<li><strong>Rewriting a working system wholesale.</strong> Incremental replacement at component boundaries almost always beats a big rewrite.</li>
<li><strong>Comparing a debug Rust build with an optimised Java or Go build</strong>, or comparing micro-benchmarks that do not resemble the workload.</li>
<li><strong>Assuming "memory safe" means "secure".</strong> Rust removes one large class of bugs; logic errors, injection, broken authorisation and supply-chain risk remain.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Spot the class of bug</summary><p>Which of these does safe Rust prevent at compile time: SQL injection, use-after-free, a deadlock, a data race, integer overflow?</p><p><em>Answer:</em> use-after-free and data races. Deadlocks and SQL injection are logic errors. Integer overflow is detected at runtime in debug builds and wraps in release builds unless you enable overflow checks or use checked arithmetic (Chapter 3).</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Make the call</summary><p>Your fintech platform needs (a) a merchant onboarding portal backend, (b) an ISO 8583 message parser in the card-authorisation path handling 20,000 messages a second, and (c) a nightly reconciliation report. Which would you write in Rust?</p><p><em>Answer:</em> (b): it parses untrusted binary input on a latency-sensitive, high-volume path where a memory bug is a security incident. (a) is a CRUD service best written in the team's main language. (c) is batch work where Python or Java is quicker to build, unless volumes make it CPU-bound, in which case a Rust or Polars core is reasonable.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why most bugs are in new code</summary><p>Google observed that Android's memory-safety bugs fell sharply even though most of its C and C++ remained. Why does this happen?</p><p><em>Answer:</em> vulnerability density decays with code age: old code has been tested, fuzzed and exercised in production, and most bugs are found within a few years of a line being written. If new code is written in a memory-safe language, the stream of new bugs dries up, and the share from old code shrinks as it ages. That is the argument for "safe by default for new code" rather than rewrites.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain where Rust's guarantees matter and where they do not.</li>
<li>I can compare Rust with C++, Go, Java, Python and Zig on memory, safety, concurrency and tooling.</li>
<li>I can cite the evidence from Android, Linux and other large adopters.</li>
<li>I can name workloads for which Rust is the wrong choice.</li>
<li>I can apply a simple three-question test to a proposed component.</li>
</ul>
`});

CH.push({
  id: 'ch03', n: 3, title: 'Values, Types and Layout',
  lede: 'Rust is a language of values with known sizes, laid out in memory the way you would lay them out by hand. This chapter covers the primitive types, integers and their overflow rules, tuples, arrays and slices, structs and enums, and how each is represented in memory, including the fat pointers and niche optimisations that make Rust\'s abstractions cost nothing.',
  html: `
<h2>Bindings and mutability</h2>
<p><code>let x = 5;</code> binds a name to a value. Bindings are <b>immutable by default</b>; <code>let mut x</code> allows reassignment and mutation. You can <b>shadow</b> a name with a new <code>let</code>, often to change its type after parsing (<code>let amount: i64 = amount.parse()?;</code>). Types are inferred locally but never across function signatures: every function states its parameter and return types, which keeps APIs readable and type errors local. <code>const</code> declares a compile-time constant inlined at each use; <code>static</code> declares a single value with a fixed address that lives for the whole program.</p>

<h2>Scalars</h2>
<div class="tbl"><table>
<tr><th>Type</th><th>Size</th><th>Notes</th></tr>
<tr><td><code>i8 i16 i32 i64 i128</code>, <code>u8 … u128</code></td><td>1 to 16 bytes</td><td>Signed and unsigned; integer literals default to <code>i32</code></td></tr>
<tr><td><code>isize usize</code></td><td>pointer size</td><td><code>usize</code> indexes collections and measures lengths</td></tr>
<tr><td><code>f32 f64</code></td><td>4, 8</td><td>IEEE 754; float literals default to <code>f64</code>. Not <code>Eq</code> or <code>Ord</code> because of NaN</td></tr>
<tr><td><code>bool</code></td><td>1</td><td>Only 0 or 1 is valid; anything else is undefined behaviour in unsafe code</td></tr>
<tr><td><code>char</code></td><td>4</td><td>A Unicode scalar value, not a byte. Strings are UTF-8 bytes, so a <code>String</code> is not a <code>Vec&lt;char&gt;</code></td></tr>
<tr><td><code>()</code></td><td>0</td><td>The unit type: "no meaningful value", returned by functions with no result</td></tr>
<tr><td><code>!</code></td><td>0</td><td>The never type: an expression that never produces a value (<code>panic!</code>, <code>loop {}</code>, <code>return</code>). Fully stable as a nameable type since 1.100</td></tr>
</table></div>
<h3>Integer overflow is a bug, and conversions are explicit</h3>
<p>Arithmetic that overflows is a bug in Rust's semantics. In debug builds it panics; in release builds it wraps, unless you set <code>overflow-checks = true</code> in the release profile, which payment and ledger code often should. When overflow is expected, say which behaviour you want with a method. Conversions between numeric types are always explicit: <code>From</code> for lossless widening, <code>TryFrom</code> for narrowing that can fail, and <code>as</code> for truncating casts you really mean.</p>
${EX('c03-ints', 'Overflow methods and explicit conversions')}
${EX('c03-overflow', 'The same addition in debug and release')}
${T('Cargo.toml: keep overflow checks in release builds for money-handling code')`
[profile.release]
overflow-checks = true   # a branch per arithmetic op; measure, but usually worth it`}
<div class="note key"><b>Money</b><p>Never use <code>f64</code> for amounts. Use integer minor units (<code>i64</code> paise or cents, or <code>i128</code> for very large aggregates) with checked arithmetic, or a decimal type such as <code>rust_decimal::Decimal</code> (96-bit mantissa, 28 decimal places) when you need fractional rates. Chapter 25 builds a money type that makes mixing currencies a compile error.</p></div>

<h2>Compound types</h2>
<ul>
<li><b>Tuples</b> <code>(i64, &amp;str)</code> group values of different types; access by position (<code>t.0</code>) or destructure (<code>let (amount, ccy) = t;</code>).</li>
<li><b>Arrays</b> <code>[u8; 32]</code> have a length fixed at compile time and live inline (on the stack or inside a struct). A SHA-256 digest is naturally a <code>[u8; 32]</code>.</li>
<li><b>Slices</b> <code>&amp;[T]</code> and <code>&amp;mut [T]</code> are views into a contiguous run of elements owned by an array, a <code>Vec</code> or something else. A function that only reads a sequence should take <code>&amp;[T]</code>, so callers can pass any of them.</li>
<li><b>String slices</b> <code>&amp;str</code> are slices of UTF-8 bytes; string literals are <code>&amp;'static str</code>, stored in the binary.</li>
</ul>
<p>Indexing (<code>v[i]</code>) is bounds-checked and panics when out of range; <code>v.get(i)</code> returns an <code>Option</code> instead. Iterators (<code>for x in &amp;v</code>, <code>zip</code>, <code>chunks</code>) need no per-element checks at all, and in index loops the optimiser removes the checks when it can prove the index is in range, for example in <code>for i in 0..n</code> after an <code>assert!(n &lt;= v.len())</code> placed before the loop. That is one reason idiomatic Rust prefers iterators to index arithmetic.</p>

<h2>Structs and enums</h2>
<p>Structs come in three forms: named fields (<code>struct Account { id: u64, balance: i64 }</code>), tuple structs (<code>struct AccountId(u64);</code>, the basis of the <b>newtype</b> pattern that stops an <code>AccountId</code> being passed where a <code>CustomerId</code> is expected), and unit structs (<code>struct Marker;</code>, zero bytes). Methods live in <code>impl</code> blocks; there is no inheritance.</p>
<p>Enums are <b>sum types</b>: a value is exactly one of several variants, each of which may carry its own data. With <code>Option</code>, <code>Result</code> and pattern matching they are the heart of Rust's type-driven design, covered in Chapter 6. Here, what matters is their layout: an enum is as large as its largest variant plus a tag, and the compiler hides the tag in unused bit patterns wherever it can.</p>

<h2>How values are laid out</h2>
${EX('c03-layout', 'Sizes and alignments, measured')}
<p>Three things in that output are worth noticing. First, <code>Unordered</code> is 16 bytes but the identical <code>#[repr(C)]</code> struct is 24: by default the compiler is free to reorder fields to reduce padding, while <code>repr(C)</code> fixes C's order for FFI. Second, <code>&amp;str</code>, <code>&amp;[u8]</code> and <code>Box&lt;dyn Speak&gt;</code> are two words, not one. Third, <code>Option&lt;&amp;u64&gt;</code>, <code>Option&lt;Box&lt;u64&gt;&gt;</code>, <code>Option&lt;NonZeroU32&gt;</code>, <code>Option&lt;String&gt;</code> and <code>Option&lt;Order&gt;</code> are no bigger than the type inside: <code>None</code> is stored in a bit pattern the inner type can never have. <code>Option&lt;u32&gt;</code> and <code>Option&lt;u64&gt;</code>, by contrast, double in size, because every bit pattern of an integer is a valid value and a separate tag (plus padding) is needed.</p>
${fig('layout', '<b>Figure 3.1</b> Interactive: choose field types and compare C layout with the reordered Rust layout.')}
${fig('fatptr', '<b>Figure 3.2</b> Interactive: what slices, owned buffers, boxes, trait objects and options look like in memory.')}
<div class="note key"><b>Layout guarantees</b><p>The default representation (<code>repr(Rust)</code>) promises nothing about field order or padding, so never transmute it or send it over the wire raw. Use <code>#[repr(C)]</code> for FFI and memory-mapped structures, <code>#[repr(transparent)]</code> for a newtype that must have exactly its inner type's ABI, <code>#[repr(u8)]</code> or similar to fix an enum's tag, and a serialisation format (Chapter 11, Chapter 25) for bytes on the wire.</p></div>

<h2>Expressions everywhere</h2>
<p>Almost everything in Rust is an expression with a value: blocks (the last expression without a semicolon is the block's value), <code>if</code>, <code>match</code> and <code>loop</code> (via <code>break value</code>). That is why Rust has no ternary operator and why functions often end without <code>return</code>:</p>
${R('Expressions instead of statements')`
fn fee(amount: i64, premium: bool) -> i64 {
    let rate_bp = if premium { 15 } else { 25 };   // basis points
    let fee = amount * rate_bp / 10_000;
    fee.max(100)                                    // no semicolon: this is the return value
}

let category = match amount {
    ..=0 => "invalid",
    1..=99_999 => "small",
    _ => "large",
};`}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Floats for money</strong>, or <code>as</code> casts that truncate amounts silently. Float-to-integer <code>as</code> casts saturate and map NaN to 0 (<code>f64::NAN as i64 == 0</code>, <code>1e20 as i64 == i64::MAX</code>), so a bad rate can become a plausible-looking amount instead of an error.</li>
<li><strong>Relying on overflow wrapping</strong> in release builds; it differs from debug and hides bugs.</li>
<li><strong>Assuming struct layout</strong> without <code>repr(C)</code> when talking to C, hardware or files.</li>
<li><strong>Treating <code>char</code> as a byte</strong> or a <code>&amp;str</code> index as a character position (Chapter 11).</li>
<li><strong>Large arrays on the stack</strong>: <code>[u8; 10_000_000]</code> in a function overflows the main thread's stack (typically 8 MiB on Linux) and the 2 MiB that <code>std::thread::spawn</code> gives new threads by default. Use a <code>Vec</code>, or <code>vec![0u8; n].into_boxed_slice()</code>; <code>Box::new([0u8; N])</code> may still build the array on the stack first.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Sizes</summary><p>What are the sizes of <code>Option&lt;u64&gt;</code>, <code>Option&lt;&amp;u64&gt;</code> and <code>(u8, u64, u8)</code> on x86-64?</p><p><em>Answer:</em> 16 (a u64 has no unused bit pattern, so a separate tag plus padding is needed; the layout example prints it), 8 (references are never null, so None uses zero), and 16 (the compiler may reorder to u64, u8, u8 plus 6 bytes of padding).</p></details>
<details><summary>Conversions</summary><p>Convert a <code>u64</code> balance to <code>u32</code> safely.</p><p><em>Answer:</em> <code>u32::try_from(balance)</code>, which returns <code>Err</code> if the value does not fit. <code>balance as u32</code> would silently keep the low 32 bits.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A newtype for IDs</summary><p>Define types so that a function <code>fn freeze(account: AccountId)</code> cannot be called with a customer ID by mistake, at zero runtime cost.</p><p><em>Answer:</em> <code>#[derive(Clone, Copy, PartialEq, Eq, Hash, Debug)] #[repr(transparent)] struct AccountId(u64);</code> and the same for <code>CustomerId</code>. They are distinct types with the same 8-byte layout as <code>u64</code>.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Niches in your own types</summary><p>Why is <code>Option&lt;Order&gt;</code> from the layout example still 16 bytes, the same as <code>Order</code>?</p><p><em>Answer:</em> <code>Order</code>'s tag uses only three of the values its tag field can hold, so the compiler encodes <code>None</code> as a fourth tag value (the example prints 16 for both). Any type with unused bit patterns (an enum tag, a bool, a reference, a NonZero) provides such a niche.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know the primitive types, their sizes and the never and unit types.</li>
<li>I handle integer overflow and numeric conversion explicitly.</li>
<li>I use arrays, slices and string slices appropriately, and know indexing is checked.</li>
<li>I can predict struct and enum layouts and know when to use repr(C) or repr(transparent).</li>
<li>I can explain fat pointers and the niche optimisation.</li>
</ul>
`});

CH.push({
  id: 'ch04', n: 4, title: 'Ownership',
  lede: 'Ownership is the idea that makes Rust different. Every value has exactly one owner; when the owner goes away, the value is destroyed; ownership can be moved but not duplicated by accident. Three short rules replace both manual memory management and garbage collection, and they also manage files, sockets, locks and transactions.',
  html: `
<h2>Stack, heap and who frees what</h2>
<p>A value whose size is known at compile time can live on the <b>stack</b>, in the function's frame, and disappears when the function returns. Data whose size is only known at runtime, or that must outlive the function that created it, lives on the <b>heap</b>, and someone must free it. C makes you call <code>free</code> yourself, which leads to leaks, double frees and use-after-free. Java and Go run a collector that frees what is unreachable. Rust takes a third path: the compiler knows, from the structure of the code, the single place each heap allocation must be freed, and inserts the call there.</p>

<h2>The three rules</h2>
<div class="note key"><b>Ownership</b><ol style="margin:.3em 0 0;padding-left:1.3em">
<li>Each value has exactly one <b>owner</b>, a variable or a field of another value.</li>
<li>Ownership can be <b>moved</b> to another owner, after which the old one cannot be used.</li>
<li>When the owner goes out of scope, the value is <b>dropped</b>: its destructor runs and its resources are released.</li>
</ol></div>
${fig('own', '<b>Figure 4.1</b> Step through: moves, a clone and drops of a String.')}
${EX('c04-move-fail', 'Use after move')}
<p>The compiler's message is a good example of how Rust errors read: it names the value, shows where the move happened and why (<code>String</code> is not <code>Copy</code>), and suggests two fixes, borrowing instead of taking ownership, or cloning. The first is almost always right, and it is the subject of the next chapter.</p>

<h2>Move, Copy and Clone</h2>
<div class="tbl"><table>
<tr><th></th><th>What happens on <code>let b = a;</code></th><th>Types</th></tr>
<tr><td><b>Move</b> (the default)</td><td>The bits are copied and <code>a</code> becomes unusable</td><td><code>String</code>, <code>Vec</code>, <code>Box</code>, files, sockets, most structs</td></tr>
<tr><td><b>Copy</b></td><td>The bits are copied and both stay usable</td><td>Integers, floats, <code>bool</code>, <code>char</code>, shared references <code>&amp;T</code> (not <code>&amp;mut T</code>), tuples and arrays of Copy types, and your own structs and enums made only of Copy types that opt in with <code>#[derive(Clone, Copy)]</code></td></tr>
<tr><td><b>Clone</b></td><td>Only when you call <code>.clone()</code>; may allocate</td><td>Anything that implements <code>Clone</code></td></tr>
</table></div>
<p>A type can be <code>Copy</code> only if a bitwise copy is a correct copy, which rules out anything that owns a resource or has a destructor. Moves are always a shallow bitwise copy of the value itself (three words for a <code>String</code>), never a deep copy, and the optimiser often removes even that; only large inline values, such as a big array or a struct with one, make a move expensive, which is when you reach for <code>Box</code>.</p>
<div class="note key"><b>Coming from Java or Go</b><p>In Java, <code>b = a</code> copies a reference: both names point to the same object, and either can change it. In Go, assigning a slice or map does the same, while assigning a struct copies it shallowly, so two copies can share a backing array. Rust has neither kind of silent sharing: assignment moves, and sharing has to be spelled out as a borrow (<code>&amp;a</code>) or a reference-counted pointer (<code>Rc</code>, <code>Arc</code>). That is what lets the compiler know every alias of every value.</p></div>

<h2>Drop and RAII</h2>
<p>Implementing the <code>Drop</code> trait gives a type a destructor. Because drops happen at predictable points (end of scope, in reverse order of declaration; for struct fields, in declaration order), Rust uses the same mechanism C++ calls RAII for every kind of resource: a <code>File</code> closes its descriptor, a <code>MutexGuard</code> unlocks, a database transaction rolls back unless committed, a span in a tracing library closes.</p>
${EX('c04-ownership', 'Scope, moves, clones and drop order')}
<p>Two details from that output: values are dropped in <b>reverse</b> order of declaration (<code>replica</code> before <code>primary</code>), so something declared later, which may refer to something earlier, goes first; and <code>std::mem::drop(x)</code> is just a function that takes ownership and does nothing, so the value is dropped when it returns.</p>
${R('Transactions as values: commit or roll back, never forget')`
pub struct Tx<'c> { conn: &'c mut Conn, done: bool }

impl<'c> Tx<'c> {
    pub fn commit(mut self) -> Result<(), DbError> {
        self.conn.exec("COMMIT")?;
        self.done = true;
        Ok(())
    }   // self dropped here, but done == true
}

impl Drop for Tx<'_> {
    fn drop(&mut self) {
        if !self.done {
            let _ = self.conn.exec("ROLLBACK");   // early return or ? in the caller: rolled back
        }
    }
}`}
<p>Because <code>commit</code> takes <code>self</code> by value, a committed transaction is consumed: calling anything on it afterwards is a compile error. Since 1.100 the standard library also has <code>core::mem::DropGuard</code>, which pairs a value with a closure that runs on drop unless you call <code>DropGuard::dismiss</code>, for one-off clean-ups without defining a type.</p>
${R('A one-off guard with DropGuard (1.100; not compiled here)')`
use std::mem::DropGuard;

fn import(batch: &mut Vec<Row>, lines: &[&str]) -> Result<(), ParseError> {
    let before = batch.len();
    // On any early return the guard truncates the batch back to where it was.
    let mut guard = DropGuard::new(batch, move |b| b.truncate(before));
    for l in lines {
        guard.push(Row::parse(l)?);     // DropGuard derefs to the &mut Vec
    }
    DropGuard::dismiss(guard);          // success: keep the rows, skip the closure
    Ok(())
}`}

<h2>Ownership in function signatures</h2>
<p>A function signature tells you its ownership contract at a glance, which is one reason Rust APIs are easy to review:</p>
<div class="tbl"><table>
<tr><th>Parameter</th><th>Meaning</th><th>Use when</th></tr>
<tr><td><code>fn f(x: T)</code></td><td>Takes ownership</td><td>The function stores, consumes or transforms the value (a constructor, <code>send</code>, <code>commit</code>)</td></tr>
<tr><td><code>fn f(x: &amp;T)</code></td><td>Borrows to read</td><td>The default for inputs</td></tr>
<tr><td><code>fn f(x: &amp;mut T)</code></td><td>Borrows exclusively to modify</td><td>In-place updates</td></tr>
<tr><td><code>fn f() -&gt; T</code></td><td>Gives ownership to the caller</td><td>Constructors and builders</td></tr>
</table></div>
<p>Prefer the most general borrowed form for parameters: <code>&amp;str</code> rather than <code>&amp;String</code>, <code>&amp;[T]</code> rather than <code>&amp;Vec&lt;T&gt;</code>, <code>impl AsRef&lt;Path&gt;</code> for paths. Callers with any compatible owner can then use the function without converting.</p>

<h2>Partial moves and moving out of collections</h2>
<p>You can move a field out of a struct you own (<code>let name = account.name;</code>); the rest of the struct stays usable but the struct as a whole does not. A struct that implements <code>Drop</code> does not allow this at all (error E0509), because its destructor still needs every field; use <code>std::mem::take</code> or <code>Option::take</code> on such fields instead. You cannot move out of something you only borrow, or out of a <code>Vec</code> by index, because that would leave a hole. Use the methods that keep the container valid: <code>remove</code>, <code>swap_remove</code>, <code>pop</code>, <code>drain</code>, or <code>std::mem::take</code> and <code>std::mem::replace</code>, which leave a default or a replacement value behind.</p>
${R('Taking a value out of a field you only have &mut to')`
struct Batch { pending: Vec<Payment>, sent: usize }

fn flush(batch: &mut Batch) -> Vec<Payment> {
    batch.sent += batch.pending.len();
    std::mem::take(&mut batch.pending)   // leaves an empty Vec, returns the old one
}`}
<p>The same idea works for optional fields: <code>Option::take</code> moves the value out and leaves <code>None</code>, which is the usual way to hand a connection or a sender off from inside a <code>&amp;mut self</code> method (for example in <code>Drop</code>).</p>

<h2>Ownership and closures</h2>
<p>A closure captures each variable it uses in the least demanding way that works: by shared reference if it only reads, by mutable reference if it changes it, by value if it consumes it. Writing <code>move</code> before the closure forces every capture to be by value, which is what you need when the closure must outlive the current scope: a thread, a spawned async task or a callback stored in a struct. Moving a <code>String</code> into a closure moves ownership; moving a <code>u64</code> copies it; to share something with a closure and keep using it yourself, clone an <code>Arc</code> first and move the clone. Chapter 14 builds on this.</p>
${R('move closures take ownership of what they capture')`
let audit_tag = String::from("batch-42");
let handle = std::thread::spawn(move || {
    println!("processing {audit_tag}");    // the thread now owns audit_tag
});
// println!("{audit_tag}");                // error[E0382]: borrow of moved value
handle.join().unwrap();`}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Cloning to silence the compiler.</strong> A clone in a loop on a hot path is a real cost; first ask whether a borrow would do.</li>
<li><strong>Taking <code>String</code> or <code>Vec</code> by value</strong> in functions that only read them, forcing callers to give up or clone their data.</li>
<li><strong>Relying on <code>Drop</code> for things that must happen</strong>: destructors do not run if the process aborts (including any panic when built with <code>panic = "abort"</code>), on <code>std::process::exit</code>, when the process is killed, or for values leaked with <code>mem::forget</code>, <code>Box::leak</code> or reference cycles. Make critical steps explicit (like <code>commit</code>) and use Drop as the safety net.</li>
<li><strong>Panicking in Drop</strong>; a panic during unwinding aborts the process.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Move or copy?</summary><p>After <code>let a = (1u32, 2.5f64); let b = a;</code> can you use <code>a</code>? And after <code>let a = (1u32, String::new()); let b = a;</code>?</p><p><em>Answer:</em> yes, then no. A tuple is Copy only if every element is Copy; String is not.</p></details>
<details><summary>Drop order</summary><p>In <code>let a = Guard("a"); let b = Guard("b");</code> which is dropped first at the end of the scope?</p><p><em>Answer:</em> <code>b</code>, then <code>a</code>: reverse declaration order.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Fix the signature</summary><p><code>fn audit(log: Vec&lt;String&gt;) -&gt; usize { log.iter().filter(|l| l.contains("DENY")).count() }</code> forces callers to give up their log. Fix it.</p><p><em>Answer:</em> <code>fn audit(log: &amp;[String]) -&gt; usize</code>; callers pass <code>&amp;log</code>, and arrays or slices of Strings work too. Even more general: <code>fn audit&lt;S: AsRef&lt;str&gt;&gt;(log: &amp;[S])</code>.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why can't Copy types have Drop?</summary><p>Explain why the compiler forbids implementing both Copy and Drop for the same type.</p><p><em>Answer:</em> Copy means a bitwise copy creates an independent, equally valid value, and copies are implicit. If the type had a destructor, every implicit copy would run it again on the same resource, which is exactly the double free that ownership exists to prevent.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can state the three ownership rules.</li>
<li>I can tell move, Copy and Clone apart and predict which applies.</li>
<li>I use Drop for RAII and know when destructors do not run.</li>
<li>I read ownership contracts from function signatures and choose parameter types deliberately.</li>
<li>I can move values out of collections and fields with take, replace, remove and drain.</li>
<li>I know how closures capture values and when to write <code>move</code>.</li>
</ul>
`});

CH.push({
  id: 'ch05', n: 5, title: 'Borrowing and Lifetimes',
  lede: 'Moving ownership around for every function call would be unbearable, so Rust lets code borrow a value through a reference. One rule governs every borrow: at any moment a value may have many readers or one writer, never both, and no reference may outlive the value it points to. This chapter explains that rule, how the compiler checks it, how to read lifetime annotations, and the standard ways out when the rule seems to be in the way.',
  html: `
<h2>References</h2>
<p><code>&amp;T</code> is a <b>shared reference</b>: read-only access to a value someone else owns. <code>&amp;mut T</code> is a <b>mutable</b> (more precisely, <b>exclusive</b>) reference: read-write access, guaranteed to be the only active path to that value. Creating a reference is called borrowing. A reference is just a pointer at runtime; all the checking happens at compile time.</p>
<div class="note key"><b>The borrowing rule</b><p>At any point in the program, a value can have <b>either</b> any number of shared references <b>or</b> exactly one mutable reference, and every reference must point to a value that is still alive. "Aliasing XOR mutability."</p></div>
<p>The rule prevents a whole family of bugs with one mechanism: iterator invalidation, use-after-free through a dangling reference, a callback modifying a collection while you iterate it, and, combined with the <code>Send</code> and <code>Sync</code> traits of Chapter 14, data races between threads. It also helps the optimiser: because a <code>&amp;mut</code> cannot alias anything else, the compiler may keep its value in a register across calls, something a C compiler can only do with <code>restrict</code>.</p>

<h2>How the borrow checker sees your code</h2>
${fig('borrowck', '<b>Figure 5.1</b> Interactive: four small programs, the live range of each borrow, and why each is accepted or rejected.')}
${EX('c05-borrow-fail', 'Modifying a collection while iterating it')}
${EX('c05-dangling-fail', 'Returning a reference to a local')}
${EX('c05-fixes', 'The standard fixes')}
<p>Most borrow-checker errors fall into a handful of shapes, and each has a standard fix: collect first and mutate afterwards; iterate by index when the loop must see its own additions; return owned data instead of a reference to something local; shorten a borrow by moving the last use earlier; or split a struct so different fields can be borrowed independently (the compiler tracks borrows of separate fields of the same struct separately within one function).</p>

<h2>Lifetimes</h2>
<p>A <b>lifetime</b> is the compiler's name for the region of code in which a reference is valid. Most of the time lifetimes are inferred and invisible. They appear in signatures when a function returns a reference, or a struct holds one, and the compiler needs to know which input the output borrows from.</p>
${EX('c05-lifetimes', 'Lifetime annotations, a zero-copy parser and NLL')}
<p><code>fn longer&lt;'a&gt;(a: &amp;'a str, b: &amp;'a str) -&gt; &amp;'a str</code> reads: "for some region <code>'a</code> during which both inputs are valid, the result is valid for that region too." Annotations never change how long anything lives; they describe relationships so the compiler can check callers. <code>Record&lt;'a&gt;</code> says a record cannot outlive the text it was parsed from, which is what lets the parser return fields without copying them, a large win when parsing millions of lines.</p>
<h3>Elision rules</h3>
<p>Three rules let you omit lifetimes in most signatures:</p>
<ol>
<li>Each reference parameter gets its own lifetime.</li>
<li>If there is exactly one input lifetime, it is used for all output references (<code>fn first_word(s: &amp;str) -&gt; &amp;str</code>).</li>
<li>In a method with <code>&amp;self</code> or <code>&amp;mut self</code>, outputs borrow from <code>self</code>.</li>
</ol>
<p>When none applies, as in <code>longer</code>, you write the annotation. The placeholder <code>'_</code> (as in <code>Record&lt;'_&gt;</code>) says "a lifetime is here; infer it". Since 1.89 the <code>mismatched_lifetime_syntaxes</code> lint warns by default when a signature such as <code>fn parse(line: &amp;str) -&gt; Option&lt;Record&gt;</code> hides a lifetime that is elided elsewhere, so readers can always see that the result borrows.</p>
<h3><code>'static</code></h3>
<p><code>'static</code> means "valid for the rest of the program". String literals are <code>&amp;'static str</code>. As a bound, <code>T: 'static</code> means the type contains no borrowed references with shorter lifetimes; it does <b>not</b> mean the value lives forever. <code>thread::spawn</code> requires <code>'static</code> because the new thread may outlive the caller's stack; that is why owned data or <code>Arc</code> is moved into threads, and why scoped threads (Chapter 14) can borrow.</p>

<h2>Borrowing in methods and structs</h2>
<ul>
<li><code>&amp;self</code> methods read, <code>&amp;mut self</code> methods modify, <code>self</code> methods consume. A getter returning <code>&amp;T</code> keeps the whole struct borrowed while the result is used.</li>
<li>Structs that hold references (<code>struct Parser&lt;'a&gt; { input: &amp;'a str }</code>) are fine for short-lived views. For long-lived application state, prefer owned fields; a struct full of lifetimes is usually a sign that ownership should move.</li>
<li>Cyclic or shared graphs (a parent pointing to children that point back) do not fit single ownership. Use indices into a <code>Vec</code> (an arena), or <code>Rc</code>/<code>Arc</code> with <code>Weak</code> back-pointers (Chapter 10).</li>
</ul>
${EX('c05-split', 'Disjoint fields, disjoint elements, and get-or-insert')}
<p>Three standard tools appear in that example. Borrows of two different fields of <code>self</code> are independent, so <code>post</code> can hold <code>&amp;mut</code> to an account and to the journal at the same time (this works within one function body; a method such as <code>self.accounts_mut()</code> borrows all of <code>self</code>). <code>get_disjoint_mut</code> hands out several <code>&amp;mut</code> into one slice after checking at runtime that the indices are distinct and in bounds, returning an error instead of panicking; <code>split_at_mut</code> is the older, panicking tool for the same job. And the <code>entry</code> API performs "get or insert" with one lookup and no borrow conflict.</p>

<h2>When the checker is too strict</h2>
<p>The borrow checker is conservative: it rejects every invalid program and some valid ones. The best-known case is a function that conditionally returns a borrow from a map or otherwise inserts into it (the "get or insert" problem), which the current checker rejects although it is safe. Work around it with the <code>entry</code> API, or by looking up twice. A flow-sensitive version of the analysis, Polonius Alpha, accepts these programs; it has been on by default on nightly since August 2026 and the compiler team aims to stabilise it around the end of 2026. Until it reaches stable, the workarounds are idiomatic and cost little.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Annotating lifetimes to "fix" an error.</strong> Annotations describe relationships; they cannot make data live longer. If data dies too soon, change who owns it.</li>
<li><strong>Holding a borrow across a long block</strong> (a guard, a <code>&amp;mut</code> from a getter) and then needing the owner; end the borrow early or restructure.</li>
<li><strong>Self-referential structs</strong> (a struct holding a buffer and a slice into it) cannot be written with plain references. Store offsets, or use an arena or a crate designed for it.</li>
<li><strong>Reading <code>T: 'static</code> as "lives forever".</strong> <code>String</code> is <code>'static</code>; it just owns its data.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Accepted or rejected?</summary><p><code>let mut s = String::from("a"); let r1 = &amp;s; let r2 = &amp;s; println!("{r1}{r2}"); let r3 = &amp;mut s; r3.push('b');</code></p><p><em>Answer:</em> accepted. The shared borrows end after the print, so the mutable borrow does not overlap them.</p></details>
<details><summary>Elision</summary><p>Which input does the result of <code>fn pick(&amp;self, key: &amp;str) -&gt; &amp;Account</code> borrow from?</p><p><em>Answer:</em> <code>self</code>, by the third elision rule. If it should borrow from <code>key</code>, you must annotate.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Zero-copy CSV</summary><p>Using <code>Record</code> and <code>parse</code> from the example, write a function that returns the record with the largest amount from a <code>&amp;str</code> file, together with its line number, without allocating per record.</p><p><em>Answer:</em> <code>parse</code> sees one line, so number the lines outside it and pair each record with its number: <code>file.lines().enumerate().filter_map(|(i, l)| parse(l).map(|r| (i + 1, r))).max_by_key(|(_, r)| r.amount.parse::&lt;i64&gt;().unwrap_or(i64::MIN))</code>. The signature is <code>fn largest(file: &amp;str) -&gt; Option&lt;(usize, Record&lt;'_&gt;)&gt;</code>: the result borrows from <code>file</code>, and no field is copied.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why &amp;mut helps the optimiser</summary><p>In C, <code>void add(int *a, const int *b) { *a += *b; *a += *b; }</code> must reload <code>*b</code> after the first store. Why doesn't the Rust equivalent <code>fn add(a: &amp;mut i32, b: &amp;i32)</code>?</p><p><em>Answer:</em> in C, <code>a</code> and <code>b</code> may point to the same int, so the store through <code>a</code> may change <code>*b</code>. In Rust a <code>&amp;mut</code> cannot alias any other live reference, so the compiler marks it <code>noalias</code> and loads <code>*b</code> once.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can state the borrowing rule and the bugs it prevents.</li>
<li>I can read a borrow-checker error and apply the standard fixes.</li>
<li>I can read and write lifetime annotations and know the elision rules.</li>
<li>I know what 'static means as a type and as a bound.</li>
<li>I can split borrows and choose owned fields, indices or Rc when references do not fit.</li>
</ul>
`});

    Object.entries(ST).forEach(([n, [x, y]]) => { s += rect(x, y, 120, 40, 'nd ' + (n === cur ? (bad ? 'hot' : 'acc') : ''), 8) + tx(x + 60, y + 20, n, 'tn sm'); });
    host.querySelector('#sm-svg').innerHTML = svgw(620, 200, s, 'Payment state machine');
    host.querySelector('#sm-out').innerHTML = log.slice(-4).join('<br>');

  host.querySelector('.btns').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const ev = b.dataset.e;

CH.push({
  id: 'ch06', n: 6, title: 'Enums, Patterns and Modelling with Types',
  lede: 'Rust\'s enums are full algebraic data types: each variant can carry different data, and the compiler checks that every match handles every case. Together with Option instead of null and a rich pattern language, they let you encode business rules in types, so that invalid states cannot be represented and invalid transitions do not compile.',
  html: `
<h2>Enums that carry data</h2>
<p>A Java enum is a fixed set of constants; a Rust enum is a fixed set of <b>shapes</b>. (The closest Java equivalent is a sealed interface whose permitted subtypes are records, which a Java 21 pattern-matching <code>switch</code> also checks for exhaustiveness.) A payment is created with an amount, authorised with an amount and an authorisation code, captured with an optional settlement date, refunded with a reason, or failed with a code. Each variant holds exactly the data that makes sense in that state, so there is no <code>authCode</code> field that is null half the time.</p>
${EX('c06-states', 'A payment lifecycle as an enum, with match, let-else and if-let chains')}

<h2>Exhaustive matching</h2>
<p><code>match</code> compares a value against patterns in order and runs the first arm that matches. It must be <b>exhaustive</b>: if you add a <code>Disputed</code> variant to <code>Payment</code>, every <code>match</code> without a catch-all arm stops compiling until you decide what disputes mean there. That turns "we forgot to handle the new status in the reconciliation job" from a production incident into a compile error. Avoid catch-all <code>_</code> arms on your own enums for exactly this reason; use them on types you do not control, or mark public enums <code>#[non_exhaustive]</code> so downstream crates must include one.</p>
${fig('paysm', '<b>Figure 6.1</b> Interactive: drive the state machine from the example (Settled is <code>Captured</code> with a settlement date). Every transition not drawn returns an error the caller must handle.')}

<h2>The pattern language</h2>
<div class="tbl"><table>
<tr><th>Pattern</th><th>Example</th><th>Matches</th></tr>
<tr><td>Literal, range</td><td><code>0</code>, <code>500..=599</code>, <code>'a'..='z'</code></td><td>Exact values or inclusive and half-open ranges</td></tr>
<tr><td>Destructuring</td><td><code>Captured { amount, settled_on: None }</code>, <code>(x, _)</code>, <code>[first, .., last]</code></td><td>Structs, enums, tuples, arrays and slices, binding parts to names</td></tr>
<tr><td>Wildcards</td><td><code>_</code>, <code>..</code></td><td>Anything, ignored; the rest of the fields or elements</td></tr>
<tr><td>Or</td><td><code>Refunded { .. } | Failed { .. }</code></td><td>Either pattern</td></tr>
<tr><td>Binding with <code>@</code></td><td><code>code @ 400..=499</code></td><td>Tests a sub-pattern and binds the value</td></tr>
<tr><td>Guard</td><td><code>Captured { amount, .. } if amount &gt; 0</code></td><td>A pattern plus a boolean condition</td></tr>
<tr><td><code>if let</code> guard</td><td><code>Some(x) if let Ok(n) = x.parse::&lt;u32&gt;()</code></td><td>A guard that itself matches a pattern (stable since 1.95)</td></tr>
<tr><td>References</td><td><code>&amp;(a, b)</code>, or just match <code>&amp;value</code> and let default binding modes borrow</td><td>Matching through references</td></tr>
</table></div>
<p>Patterns appear in more places than <code>match</code>: <code>let</code> (irrefutable patterns such as tuples), function parameters (<code>|&amp;(id, amt)|</code>), <code>for</code> loops, <code>while let</code> (pop until empty), <code>if let</code>, and <code>let ... else</code>, which binds or diverges and keeps the happy path unindented. Edition 2024 adds <b>let chains</b>: <code>if let A = x &amp;&amp; let B = y &amp;&amp; cond { … }</code>, which replaces deeply nested <code>if let</code> blocks.</p>

<h2>Option instead of null</h2>
<p><code>Option&lt;T&gt;</code> is just an enum, <code>Some(T)</code> or <code>None</code>, and there is no null in safe Rust. A function that may not find an account returns <code>Option&lt;&amp;Account&gt;</code>, and you cannot use the account without handling <code>None</code>. The combinators make that pleasant:</p>
${R('Working with Option')`
let fee = accounts.get(&id)              // Option<&Account>
    .filter(|a| a.active)                // None if inactive
    .map(|a| a.fee_plan.monthly_fee())   // Option<i64>
    .unwrap_or(0);                       // default

let email = user.contact.as_ref().and_then(|c| c.email.as_deref());   // Option<&str>
let Some(acct) = accounts.get_mut(&id) else { return Err(NotFound(id)) };
acct.balance += amount;`}
<p><code>unwrap()</code> and <code>expect("why this cannot fail")</code> panic on <code>None</code>. They are fine in tests, in prototypes, and where an invariant guarantees a value (and <code>expect</code> documents it). In service code, prefer handling the case or converting it to an error with <code>ok_or</code>, covered in the next chapter.</p>

<h2>Make illegal states unrepresentable</h2>
<p>The strongest use of enums is design: if the type cannot express an invalid state, no code can produce one. Some patterns that pay off in financial systems:</p>
<ul>
<li><b>Newtypes for identifiers and units</b>: <code>AccountId(u64)</code>, <code>Paise(i64)</code>, <code>Bps(u32)</code>. Swapping arguments becomes a type error.</li>
<li><b>Validated types</b> with private fields and a fallible constructor: <code>Iban::parse(s)?</code> returns a value that is known to be valid everywhere else, so validation happens once, at the boundary ("parse, don't validate").</li>
<li><b>Enums instead of boolean flags</b>: <code>Settlement::Instant | Settlement::NextDay</code> instead of <code>is_instant: bool</code>, so the meaning is in the type and new options are additive.</li>
<li><b>Typestate</b>: encode a workflow's state in a type parameter, so methods that are only valid in one state only exist on that type.</li>
</ul>
${EX('c06-typestate', 'A four-eyes approval rule enforced by types')}
<p>In the typestate example, <code>execute</code> exists only on <code>Transfer&lt;Approved&gt;</code>, and the only way to get one is through <code>approve</code>, which enforces the four-eyes rule. <code>PhantomData&lt;State&gt;</code> is a zero-sized marker that makes the type parameter count without storing anything, so the state costs nothing at runtime. This is the same technique embedded HALs use to make it impossible to drive a pin that is configured as an input.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Catch-all arms on your own enums</strong>, which silence the exhaustiveness check that is the point of enums.</li>
<li><strong><code>unwrap()</code> in request paths</strong>: one malformed input becomes a crashed task or process.</li>
<li><strong>Boolean soup</strong> (<code>is_settled</code>, <code>is_refunded</code>, <code>is_failed</code>) where the combinations are mostly invalid.</li>
<li><strong>Over-engineering with typestate</strong> where states change at runtime from data (a status from the database); then a plain enum and a transition function are clearer.</li>
<li><strong>Huge enum variants</strong>: an enum is as big as its largest variant. Box a rarely used large payload (clippy's <code>large_enum_variant</code> warns).</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Pattern it</summary><p>Write a match arm that matches an HTTP status code in the 400s, binds it to <code>code</code>, and excludes 404.</p><p><em>Answer:</em> <code>code @ 400..=499 if code != 404 =&gt; …</code></p></details>
<details><summary>let-else</summary><p>Rewrite <code>let id = match parts.next() { Some(x) =&gt; x, None =&gt; return Err(e) };</code> with let-else.</p><p><em>Answer:</em> <code>let Some(id) = parts.next() else { return Err(e) };</code></p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Add chargebacks</summary><p>Add a <code>Disputed { amount, case_id }</code> state reachable from Captured or Settled, which can resolve to Captured (merchant wins) or Refunded (cardholder wins). What does the compiler tell you?</p><p><em>Answer:</em> nothing. Both functions in the example end with a catch-all (<code>other =&gt;</code> in <code>describe</code>, <code>(from, event) =&gt; Err(...)</code> in <code>apply</code>), so the program compiles and every dispute event is quietly rejected at runtime until you remember to add the transitions. That is the cost of catch-alls. To make the compiler help, have <code>describe</code> name every variant, and structure <code>apply</code> as an outer <code>match</code> on the state with no wildcard, each arm matching the events valid in that state: a new variant then fails to compile until you decide what it means.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Typestate and persistence</summary><p>Transfers are stored in a database and loaded later. How do you combine typestate with data whose state is only known at runtime?</p><p><em>Answer:</em> load into an enum over the typed states, <code>enum AnyTransfer { Draft(Transfer&lt;Draft&gt;), Approved(Transfer&lt;Approved&gt;) }</code>, then match once at the boundary; inside each arm the compiler again knows the state and enforces the rules.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I model alternatives with data-carrying enums instead of nullable fields and flags.</li>
<li>I use exhaustive match, guards, bindings, ranges, slices and or-patterns.</li>
<li>I use if let, while let, let-else and let chains to keep code flat.</li>
<li>I handle Option with combinators and reserve unwrap and expect for real invariants.</li>
<li>I can apply newtypes, validated constructors and typestate to business rules.</li>
</ul>
`});

CH.push({
  id: 'ch07', n: 7, title: 'Error Handling',
  lede: 'Rust has no exceptions. A function that can fail returns Result, the caller decides what to do, and the ? operator makes propagation a single character. Panics exist for bugs, not for expected failures. This chapter covers both, the conventions for library and application errors, and how the never type and Infallible fit in.',
  html: `
<h2>Result</h2>
<p><code>Result&lt;T, E&gt;</code> is an enum: <code>Ok(T)</code> or <code>Err(E)</code>. Because it is a value, a function's signature tells you it can fail and with what, the compiler warns if you ignore a returned <code>Result</code> (<code>#[must_use]</code>), and handling an error is ordinary control flow. Compared with Java's exceptions: an expected failure cannot leave a function by a hidden path, or escape as an unchecked <code>RuntimeException</code> from a library you thought could not fail. The one unchecked path is a panic, which by convention means a bug (see Panics below). Compared with Go's <code>if err != nil</code>: the compiler will not let you use the value without dealing with the error, and <code>?</code> removes the boilerplate.</p>

<h2>The ? operator</h2>
${EX('c07-question', 'What ? expands to, and ? on Option')}
<p><code>expr?</code> means: if <code>expr</code> is <code>Ok(v)</code>, the expression evaluates to <code>v</code>; if it is <code>Err(e)</code>, return <code>Err(From::from(e))</code> from the current function. The <code>From::from</code> call is what lets a function returning <code>Result&lt;T, AppError&gt;</code> use <code>?</code> on a <code>std::io::Error</code>, as long as <code>AppError</code> implements <code>From&lt;io::Error&gt;</code>. On <code>Option</code>, <code>?</code> returns <code>None</code> early. Mixing the two in one function needs an explicit conversion (<code>ok_or</code>, <code>ok_or_else</code>, <code>.ok()</code>).</p>
${fig('qmark', '<b>Figure 7.1</b> Step through: an error travelling up the call stack, gaining context at each layer.')}

<h2>Library errors and application errors</h2>
<p>Two conventions cover almost all Rust code:</p>
<div class="tbl"><table>
<tr><th></th><th>Library code</th><th>Application code</th></tr>
<tr><td><b>Goal</b></td><td>Let callers react to specific failures</td><td>Report failures with enough context to fix them</td></tr>
<tr><td><b>Type</b></td><td>A specific enum per module or crate, implementing <code>std::error::Error</code></td><td>One boxed, dynamic error type</td></tr>
<tr><td><b>Crate</b></td><td><code>thiserror</code> (derives Display, Error and From)</td><td><code>anyhow</code> (or <code>eyre</code>) with <code>.context()</code></td></tr>
<tr><td><b>Callers</b></td><td><code>match</code> on variants</td><td>Log, return an HTTP status, exit with a code</td></tr>
</table></div>
${EX('c07-errors', 'thiserror for a library, anyhow for the application')}
<p>The <code>#[source]</code> attribute chains the underlying cause, so the full story ("batch line 2 → bad amount "1O0" → invalid digit") survives up to the place where it is logged. In services, convert errors to responses at one boundary: an <code>impl IntoResponse for ApiError</code> in axum (Chapter 22) maps each variant to a status code and a safe message, and logs the internal details instead of leaking them to clients.</p>
<div class="note key"><b>Error design for regulated systems</b><p>Keep error variants about <i>what went wrong in domain terms</i> (<code>Insufficient</code>, <code>LimitExceeded</code>, <code>AccountFrozen</code>), not about which library failed. Never put secrets, full card numbers or personal data into error messages: they end up in logs. Give each variant a stable machine-readable code for clients and audit trails, separate from the human message.</p></div>

<h2>Panics</h2>
<p>A <b>panic</b> means the program reached a state its author believed impossible: an index out of bounds, an <code>unwrap</code> on <code>None</code>, an explicit <code>panic!</code>, an arithmetic overflow in a debug build. By default the panicking thread <b>unwinds</b>, running destructors as it goes; if it is the main thread, the process exits with status 101. A panic in a spawned thread is reported to whoever joins it; in a Tokio task, to whoever awaits its <code>JoinHandle</code>.</p>
<ul>
<li>Use <code>Result</code> for anything that can happen in correct operation: bad input, network failures, missing files, business rule violations.</li>
<li>Use panics for broken invariants and programmer errors, where continuing would be worse than stopping.</li>
<li><code>panic = "abort"</code> in the release profile skips unwinding: smaller binaries and slightly faster code, but no destructors on panic and no <code>catch_unwind</code>. Embedded and some latency-sensitive services choose it; servers that isolate request failures usually keep unwinding.</li>
<li><code>std::panic::catch_unwind</code> exists for boundaries such as FFI (a panic must never unwind into C) and thread pools, not as a try/catch for normal errors.</li>
</ul>
<p>Memory safety does not make a panic harmless. On 18 November 2025 a database permissions change doubled the size of a configuration file that Cloudflare distributes to its proxies; the file exceeded a fixed limit in the Rust proxy, the code reached an <code>unwrap()</code> on the resulting <code>Err</code>, and worker threads panicked across the network (<code>called \`Result::unwrap()\` on an \`Err\` value</code>), causing an outage of several hours. Input that crosses a trust or deployment boundary, configuration included, should be validated and its failure handled as an error, with a safe fallback such as keeping the last good version.</p>
${T('Release profile choices')`
[profile.release]
panic = "unwind"         # default; "abort" for embedded or when you prefer crash-and-restart
overflow-checks = true   # treat overflow as a bug in production too`}

<h2>Errors at the edge of the program</h2>
<p><code>main</code> may return <code>Result&lt;(), E&gt;</code> for any <code>E: Debug</code>: an <code>Err</code> is printed with its <code>Debug</code> format and the process exits with status 1, so <code>fn main() -&gt; anyhow::Result&lt;()&gt;</code> with <code>?</code> throughout is a reasonable start for a CLI. When exit codes matter to a scheduler or a shell script, return <code>std::process::ExitCode</code> and map each failure to a documented code yourself. For diagnosis, <code>std::backtrace::Backtrace::capture()</code> records a backtrace when <code>RUST_BACKTRACE=1</code> (or <code>RUST_LIB_BACKTRACE=1</code>) is set, and anyhow attaches one to its errors automatically under the same variables; capturing has a cost, so turn it on deliberately in production.</p>
${R('Exit codes a batch scheduler can act on')`
use std::process::ExitCode;

fn main() -> ExitCode {
    match run() {                          // run() -> anyhow::Result<()>
        Ok(()) => ExitCode::SUCCESS,
        Err(e) => {
            eprintln!("settlement run failed: {e:#}");
            match e.downcast_ref::<LedgerError>() {
                Some(LedgerError::Insufficient { .. }) => ExitCode::from(3), // business rule: page ops, do not retry
                _ => ExitCode::from(2),                                      // infrastructure: safe to retry
            }
        }
    }
}`}

<h2>Errors that cannot happen: ! and Infallible</h2>
<p>Some APIs are generic over an error type but a particular implementation can never fail, for example converting a <code>String</code> into a <code>String</code>. That error type is <code>std::convert::Infallible</code>, originally defined as an enum with no variants, so no value of it can exist. Since Rust 1.100 the never type <code>!</code> is fully stable as a type you can name anywhere (<code>Result&lt;T, !&gt;</code>), and <code>Infallible</code> is now an alias for it. The compiler knows that the <code>Err</code> arm of a <code>Result&lt;T, !&gt;</code> is unreachable, so you can destructure it irrefutably and it adds no space. 1.100 also changed the "fallback" type that older editions used for some unconstrained expressions from <code>()</code> to <code>!</code>, matching Edition 2024; if an old dependency stops compiling on 1.100 with a never-type error, updating it usually fixes it.</p>
${R('Infallible results (1.100)')`
fn parse_cfg(s: &str) -> Result<Config, !> { Ok(Config::lenient(s)) }

let Ok(cfg) = parse_cfg(raw);   // irrefutable: the Err case cannot exist`}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong><code>Box&lt;dyn Error&gt;</code> or anyhow in a library's public API</strong>: callers cannot match on what went wrong.</li>
<li><strong>One giant error enum for the whole crate</strong> that every function returns: callers cannot tell which variants a given function can actually produce. Prefer one per module or operation.</li>
<li><strong>Losing the cause</strong> with <code>map_err(|_| MyError::Failed)</code>; keep the source.</li>
<li><strong>Ignoring a Result</strong> with <code>let _ = …</code> where the failure matters (a write, a commit, a flush).</li>
<li><strong>Panicking across FFI</strong> or in a <code>Drop</code> implementation.</li>
<li><strong><code>unwrap()</code> on configuration or data you did not produce</strong>: the Cloudflare outage above. Treat it like any other untrusted input.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Convert Option to Result</summary><p>Inside a function returning <code>Result&lt;Account, LedgerError&gt;</code>, get an account from a <code>HashMap</code> or return <code>NoAccount</code>.</p><p><em>Answer:</em> <code>let a = map.get(id).cloned().ok_or_else(|| LedgerError::NoAccount(id.to_string()))?;</code></p></details>
<details><summary>Panic or Result?</summary><p>A config value is missing at startup; a request carries an unknown currency; an internal cache index points past the end of its vector. Which should panic?</p><p><em>Answer:</em> only the third, which is a broken invariant. The first should be an error that makes startup fail with a clear message; the second is a client error to return as a 4xx response.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>An error for HTTP</summary><p>Write an <code>ApiError</code> enum with <code>NotFound</code>, <code>Validation(String)</code> and <code>Internal(anyhow::Error)</code>, and a function mapping it to a status code and a client-safe message.</p><p><em>Answer:</em> derive <code>thiserror::Error</code>; implement <code>From&lt;anyhow::Error&gt;</code> for Internal; map NotFound to 404, Validation to 422 with the message, Internal to 500 with a generic message and an incident id, logging the full chain with <code>{:#}</code> or <code>{:?}</code>.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Errors and performance</summary><p>Why does Rust's approach make the success path fast, and when can large error types hurt?</p><p><em>Answer:</em> there is no unwinding machinery on the success path, just a branch on a discriminant. But <code>Result&lt;T, E&gt;</code> is as large as the larger of T and E, so a 200-byte error enum makes every return value at least 200 bytes, even on the success path. Box large payloads (<code>Box&lt;Details&gt;</code>) or use a boxed error type for rare failures; clippy's <code>result_large_err</code> lint warns.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I use Result and Option for expected failures and handle them with ?, combinators and match.</li>
<li>I know what ? expands to and how From conversions make it work.</li>
<li>I design typed errors with thiserror for libraries and use anyhow with context in applications.</li>
<li>I reserve panics for bugs and know the unwind and abort trade-off.</li>
<li>I return meaningful results and exit codes from <code>main</code>, and I never <code>unwrap</code> untrusted input.</li>
<li>I understand Infallible and the never type as of Rust 1.100.</li>
</ul>
`});
