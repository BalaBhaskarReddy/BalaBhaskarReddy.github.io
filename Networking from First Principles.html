<style>

:root{

}

  --accent:#78A6FF; --accent-soft:#1B2944; --hot:#FF8B50; --hot-soft:#3B2216; --ok:#43C99D; --ok-soft:#12332A;
  --cmp:#B78FFF; --cmp-soft:#291F43; --warn:#E5B54A; --warn-soft:#352B12;
  --code-bg:#111821; --code-ink:#DCE3EC;
  --tk-key:#C39BFF; --tk-str:#5FD3A8; --tk-num:#FF9E6B; --tk-com:#7D889A; --tk-fn:#8DB4FF; --tk-type:#F08FC0;
  color-scheme:dark}}
:root[data-theme="dark"]{

.topbar{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;font-family:var(--f-display)}

/* callouts */
.note{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 18px;margin:22px 0}

.note p:last-child{margin-bottom:0}
.note.key{border-color:var(--accent);background:var(--accent-soft)} .note.key>b:first-child{color:var(--accent)}
.note.pit{border-color:var(--hot);background:var(--hot-soft)} .note.pit>b:first-child{color:var(--hot)}
.note.ex{border-style:dashed} .note.ex>b:first-child{color:var(--ok)}
.formula{font-family:var(--f-mono);font-size:15.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:16px 0 18px;overflow-x:auto;white-space:pre;line-height:1.55}

.tbl{overflow-x:auto;margin:18px 0 24px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

.ctl{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}

.cell.hot,.nd.hot,.bar.hot{fill:var(--hot-soft);stroke:var(--hot);stroke-width:2.2}

.ed.hot{stroke:var(--hot);stroke-width:3}

.c1{stroke:var(--ink-2)} .c2{stroke:var(--ok)} .c3{stroke:var(--accent)} .c4{stroke:var(--cmp)} .c5{stroke:var(--warn)} .c6{stroke:var(--hot)}
.f1{fill:var(--ink-2)} .f2{fill:var(--ok)} .f3{fill:var(--accent)} .f4{fill:var(--cmp)} .f5{fill:var(--warn)} .f6{fill:var(--hot)}

/* practice + checklist */
.practice{display:grid;grid-template-columns:1fr;gap:14px;margin:18px 0 26px}

<script>
'use strict';
/* ================= core helpers ================= */
const CH = [], FIG = {};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const f1 = n => Math.round(n * 10) / 10;
const tx = (x, y, t, c = 't', a = 'middle') => `<text x="${f1(x)}" y="${f1(y)}" class="${c}" text-anchor="${a}" dominant-baseline="central">${esc(t)}</text>`;
const svgw = (w, h, inner, label) => `<svg class="dg" viewBox="0 0 ${f1(w)} ${f1(h)}" width="${f1(w)}" height="${f1(h)}" role="img" aria-label="${esc(label || 'Diagram')}">${inner}</svg>`;
const grp = (x, y, s) => `<g transform="translate(${f1(x)},${f1(y)})">${s}</g>`;
const mk = c => ({ hot: 'ar-hot', ok: 'ar-ok', acc: 'ar-acc', cmp: 'ar-cmp', warn: 'ar-warn' }[String(c).split(' ')[0]] || 'ar');
function shorten(a, b, ra, rb) { const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1; return { x1: a.x + dx / L * ra, y1: a.y + dy / L * ra, x2: b.x - dx / L * rb, y2: b.y - dy / L * rb }; }
const ln = (L, c = '', m) => `<line x1="${f1(L.x1)}" y1="${f1(L.y1)}" x2="${f1(L.x2)}" y2="${f1(L.y2)}" class="ed ${c}"${m ? ` marker-end="url(#${mk(c)})"` : ''}/>`;
const arrow = (x1, y1, x2, y2, c = '') => ln({ x1, y1, x2, y2 }, c, true);
function lbl(x, y, t, c = '') { const w = String(t).length * 7.4 + 10; return `<rect x="${f1(x - w / 2)}" y="${f1(y - 9)}" width="${f1(w)}" height="18" rx="4" class="lbg ${c}"/>` + tx(x, y, t, 'w ' + c); }
const rect = (x, y, w, h, c = 'cell', r = 5) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${r}" class="${c}"/>`;
const code = (title, lang = 'java') => (s, ...v) => `<div class="code">${title ? `<div class="code-h">${esc(title)}</div>` : ''}<pre><code class="language-${lang}">${esc(String.raw({ raw: s.raw }, ...v).replace(/^\n+|\s+$/g, ''))}</code></pre></div>`;
const fig = (name, cap) => `<figure class="fig" data-fig="${name}" data-cap="${esc(cap || '')}"></figure>`;

/* ================= primitives ================= */
function arrayRow(vals, o = {}) {
  const c = o.cell || 46, gap = o.gap || 0, st = o.st || {}, x0 = o.x || 0, y0 = o.y || 0;
  const groups = {};
  (o.ptr || []).forEach(p => { if (p.i == null || p.i < 0 || p.i > vals.length) return; (groups[p.i] = groups[p.i] || []).push(p); });
  const depth = Math.max(0, ...Object.values(groups).map(g => g.length));
  const top = y0 + (depth ? depth * 17 + 12 : 0);
  let s = '';
  if (o.range) { const [l, r] = o.range; if (l <= r) s += rect(x0 + l * (c + gap) - 3, top - 3, (r - l + 1) * (c + gap) - gap + 6, c + 6, 'area-' + (o.rangeCls || 'acc'), 7); }
  vals.forEach((v, i) => {
    const x = x0 + i * (c + gap), k = st[i] || '';
    s += rect(x + 1, top + 1, c - 2, c - 2, 'cell ' + k);
    s += tx(x + c / 2, top + c / 2, v == null ? '' : v, 'tv ' + (o.small ? 'sm ' : '') + k);
    if (o.idx !== false) s += tx(x + c / 2, top + c + 13, o.idxLabels ? o.idxLabels[i] : i, 'ti');
  });
  for (const i in groups) {
    const x = x0 + (+i) * (c + gap) + c / 2, g = groups[i];
    g.forEach((p, k) => { s += tx(x, top - 12 - (g.length - 1 - k) * 17, p.label, 'tp ' + (p.cls || 'acc')); });
    s += `<path d="M${f1(x - 5)} ${top - 5} L${f1(x + 5)} ${top - 5} L${f1(x)} ${top + 1} Z" class="tri ${g[g.length - 1].cls || 'acc'}"/>`;
  }
  const pmax = Math.max(vals.length, ...Object.keys(groups).map(k => +k + 1));
  return { s, w: x0 + pmax * (c + gap) - gap, h: top + c + (o.idx !== false ? 24 : 4) };
}

function chips(x, y, label, vals, o = {}) {
  let s = label ? tx(x, y + 14, label, 'tm', 'start') : '';
  let cx = x + (label ? (o.lw || 74) : 0);
  const st = o.st || {};
  vals.forEach((v, i) => {
    const w = Math.max(30, String(v).length * 8.2 + 14), k = st[i] || o.cls || '';
    s += rect(cx, y, w, 28, 'cell ' + k) + tx(cx + w / 2, y + 14, v, 'tv sm ' + k); cx += w + 6;
  });
  if (!vals.length) s += tx(cx, y + 14, o.empty || 'empty', 'tm', 'start');
  return s;
}

function btree(nodes, root, o = {}) {
  const dx = o.dx || 46, dy = o.dy || 62, r = o.r || 18, px = o.px ?? 20, py = o.py ?? 20, st = o.st || {}, es = o.es || {}, sub = o.sub || {};
  const pos = {}; let k = 0, md = 0;
  (function w(id, d) { if (id == null || nodes[id] == null) return; w(nodes[id].l, d + 1); pos[id] = { x: px + r + k * dx, y: py + r + d * dy }; k++; md = Math.max(md, d); w(nodes[id].r, d + 1); })(root, 0);
  let s = '';
  for (const id in pos) { const n = nodes[id]; [n.l, n.r].forEach(c => { if (c != null && pos[c]) s += ln(shorten(pos[id], pos[c], r, r), es[id + '-' + c] || ''); }); }
  for (const id in pos) {
    const p = pos[id], c = st[id] || '';
    s += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}" class="nd ${c}"/>` + tx(p.x, p.y, nodes[id].v, 'tn ' + (String(nodes[id].v).length > 2 ? 'sm ' : '') + c);
    if (sub[id] != null) s += tx(p.x, p.y + r + 11, sub[id], 'tsub');
  }
  return { s, w: px * 2 + 2 * r + Math.max(0, k - 1) * dx, h: py * 2 + 2 * r + md * dy + (Object.keys(sub).length ? 16 : 0), pos };
}
function heapNodes(a) { const N = {}; a.forEach((v, i) => { N[i] = { v, l: 2 * i + 1 < a.length ? 2 * i + 1 : null, r: 2 * i + 2 < a.length ? 2 * i + 2 : null }; }); return N; }
/* level-order heap layout: keeps positions stable as the heap changes */
function heapTree(a, o = {}) {
  const n = a.length, r = o.r || 19, dy = o.dy || 58, W = o.W || 520, st = o.st || {}, es = o.es || {};
  const P = i => { const d = Math.floor(Math.log2(i + 1)), first = 2 ** d - 1, cnt = 2 ** d; return { x: (i - first + 0.5) * W / cnt, y: r + 8 + d * dy }; };
  let s = '', md = 0;
  for (let i = 1; i < n; i++) { const p = (i - 1) >> 1; s += ln(shorten(P(p), P(i), r, r), es[p + '-' + i] || ''); }
  for (let i = 0; i < n; i++) {
    const p = P(i), c = st[i] || ''; md = Math.max(md, p.y);
    s += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}" class="nd ${c}"/>` + tx(p.x, p.y, a[i], 'tn ' + c);
    if (o.idx) s += tx(p.x + r + 6, p.y - r + 2, i, 'ti', 'start');
  }
  return { s, w: W, h: md + r + 10 };
}

function gtree(root, o = {}) {
  const dx = o.dx || 64, dy = o.dy || 64, nw = o.nw || 54, nh = o.nh || 28, px = o.px ?? 8, py = o.py ?? 8;
  let leaf = 0, md = 0; const all = [];
  (function lay(n, d) { n._d = d; md = Math.max(md, d); all.push(n); if (n.kids && n.kids.length) { n.kids.forEach(c => lay(c, d + 1)); n._x = (n.kids[0]._x + n.kids[n.kids.length - 1]._x) / 2; } else n._x = leaf++; })(root, 0);
  const W = n => n.w || nw;
  const X = n => px + nw / 2 + n._x * dx, Y = n => py + nh / 2 + n._d * dy;
  let s = '', el = '';
  all.forEach(n => (n.kids || []).forEach(c => {
    s += `<line x1="${f1(X(n))}" y1="${f1(Y(n) + nh / 2)}" x2="${f1(X(c))}" y2="${f1(Y(c) - nh / 2)}" class="ed ${c.ec || ''}"/>`;
    if (c.el != null) el += lbl((X(n) + X(c)) / 2, (Y(n) + nh / 2 + Y(c) - nh / 2) / 2, c.el, c.ec || '');
  }));
  s += el;
  all.forEach(n => {
    const w = W(n);
    s += rect(X(n) - w / 2, Y(n) - nh / 2, w, nh, 'nd ' + (n.cls || ''), o.round ? nh / 2 : 6) + tx(X(n), Y(n), n.label, 'tn ' + (o.small ? 'sm ' : '') + (n.cls || ''));
    if (n.sub != null) s += tx(X(n), Y(n) + nh / 2 + 11, n.sub, 'tsub');

}

function graph(N, E, o = {}) {
  const r = o.r || 19, ns = o.ns || {}, es = o.es || {}, sub = o.sub || {}, dir = !!o.dir;
  let s = '', labels = '';

    const A = N[a], B = N[b], k = es[a + '-' + b] || (!dir && es[b + '-' + a]) || '';

      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy);
      const C = { x: mx - dy / L * bend, y: my + dx / L * bend }, s1 = shorten(A, C, r, 0), s2 = shorten(C, B, 0, r + (dir ? 2 : 0));
      s += `<path d="M${f1(s1.x1)} ${f1(s1.y1)} Q${f1(C.x)} ${f1(C.y)} ${f1(s2.x2)} ${f1(s2.y2)}" class="ed ${k}"${dir ? ` marker-end="url(#${mk(k)})"` : ''}/>`;
      if (w != null) labels += lbl((A.x + 2 * C.x + B.x) / 4, (A.y + 2 * C.y + B.y) / 4, w, k);
    } else {
      s += ln(shorten(A, B, r, r + (dir ? 2 : 0)), k, dir);
      if (w != null) labels += lbl((A.x + B.x) / 2, (A.y + B.y) / 2, w, k);
    }
  });

  for (const id in N) {
    const n = N[id], k = ns[id] || '';
    const lab = n.l ?? id;
    if (n.box) { const bw = Math.max(2 * r, String(lab).length * 8 + 18), bh = 2 * r - 4; s += rect(n.x - bw / 2, n.y - bh / 2, bw, bh, 'nd ' + k, 6); }
    else s += `<circle cx="${n.x}" cy="${n.y}" r="${r}" class="nd ${k}"/>`;
    s += tx(n.x, n.y, lab, 'tn ' + (String(lab).length > 2 ? 'sm ' : '') + k);
    if (sub[id] != null && sub[id] !== '') s += lbl(n.x + (n.sx || 0), n.y + (n.sy ?? -1) * (r + 13), sub[id], (o.subCls || {})[id] || '');
  }
  return { s, w: o.w, h: o.h };
}

function llist(o) {
  const bw = o.bw || 66, bh = 38, gap = o.gap || 46, px = 16, val = o.val || {}, st = o.st || {}, drop = o.drop || {};
  const ptr = o.ptr || {};
  const depth = Math.max(0, ...Object.values(ptr).map(a => a.length));
  const top = 10 + (depth ? depth * 17 + 12 : 0);
  const idx = {}; o.slots.forEach((id, i) => idx[id] = i);
  const X = i => px + i * (bw + gap), Y = id => top + (drop[id] || 0);
  const isNull = id => String(id).startsWith('null');
  let s = '', below = 0;
  for (const id in (o.next || {})) {
    const t = o.next[id]; if (t == null || idx[t] == null || idx[id] == null) continue;
    const i = idx[id], j = idx[t], k = (o.es || {})[id] || '';
    const sx = X(i) + bw - 11, sy = Y(id) + bh / 2;
    if (j > i) { const ex = isNull(t) ? X(j) + bw / 2 - 28 : X(j) - 1; s += `<path d="M${sx} ${sy} L${ex} ${Y(t) + bh / 2}" class="ed ${k}" marker-end="url(#${mk(k)})"/>`; }
    else { const ex = X(j) + bw / 2, ey = Y(t) + (isNull(t) ? bh / 2 + 14 : bh) + 3, dep = 22 + (i - j) * 8; below = Math.max(below, dep + 10); s += `<path d="M${sx} ${sy} C ${sx + 6} ${sy + dep + 22}, ${ex} ${ey + dep}, ${ex} ${ey}" class="ed ${k}" marker-end="url(#${mk(k)})"/>`; }
  }
  o.slots.forEach((id, i) => {
    const x = X(i), y = Y(id), k = st[id] || '';
    if (isNull(id)) { s += rect(x + bw / 2 - 26, y + bh / 2 - 14, 52, 28, 'cell dash ' + k) + tx(x + bw / 2, y + bh / 2, 'null', 'tm'); }
    else {
      s += rect(x, y, bw, bh, 'cell ' + k) + `<line x1="${x + bw - 22}" y1="${y}" x2="${x + bw - 22}" y2="${y + bh}" class="ed"/>`;
      s += tx(x + (bw - 22) / 2, y + bh / 2, val[id] ?? id, 'tv ' + k) + `<circle cx="${x + bw - 11}" cy="${y + bh / 2}" r="3.4" class="f1"/>`;
    }
    const pl = ptr[id]; if (pl) { pl.forEach((p, q) => { s += tx(x + bw / 2 - 11, top - 12 - (pl.length - 1 - q) * 17 + (drop[id] || 0), p.label, 'tp ' + (p.cls || 'acc')); }); }
  });
  const md = Math.max(0, ...Object.values(drop));
  return { s, w: X(o.slots.length - 1) + bw + px, h: top + bh + md + below + 14 };
}

function stackV(vals, o = {}) {
  const cap = Math.max(o.cap || 4, vals.length), bw = o.bw || 96, bh = 32, px = o.px ?? 14, py = o.title ? 30 : 12, st = o.st || {};
  let s = o.title ? tx(px + bw / 2, 12, o.title, 'th') : '';
  const bot = py + cap * bh + 6;
  s += `<path d="M${px - 5} ${py} V${bot} H${px + bw + 5} V${py}" class="well"/>`;
  vals.forEach((v, i) => { const y = py + (cap - 1 - i) * bh + 3, k = st[i] || ''; s += rect(px, y, bw, bh - 4, 'cell ' + k) + tx(px + bw / 2, y + (bh - 4) / 2, v, 'tv sm ' + k); });
  if (vals.length && o.top !== false) { const y = py + (cap - vals.length) * bh + 3 + (bh - 4) / 2; s += arrow(px + bw + 44, y, px + bw + 10, y, 'acc') + tx(px + bw + 48, y, 'top', 'tp acc', 'start'); }
  if (!vals.length) s += tx(px + bw / 2, bot - 20, 'empty', 'tm');
  return { s, w: px + bw + (o.top !== false ? 84 : 16), h: bot + 8 };
}

function ring(slots, o = {}) {
  const n = slots.length, R = o.R || 92, cx = R + 74, cy = R + 54, bw = 44, st = o.st || {};
  let s = `<circle cx="${cx}" cy="${cy}" r="${R}" class="ringc"/>`;
  slots.forEach((v, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n, cs = Math.cos(a), sn = Math.sin(a), x = cx + R * cs, y = cy + R * sn, k = st[i] || '';
    s += rect(x - bw / 2, y - bw / 2, bw, bw, 'cell ' + k, 7) + tx(x, y, v ?? '', 'tv ' + k) + tx(cx + (R - 40) * cs, cy + (R - 40) * sn, i, 'ti');
    const labs = []; if (o.head === i) labs.push(['head', 'acc']); if (o.tail === i) labs.push(['tail', 'hot']);
    labs.forEach((L, q) => { const rr = R + 42 + q * 18; s += tx(cx + rr * cs, cy + rr * sn, L[0], 'tp ' + L[1]); });
  });
  return { s, w: 2 * cx, h: 2 * cy };
}

function bars(vals, o = {}) {
  const bw = o.bw || 34, gap = o.gap || 8, H = o.H || 150, max = o.max || Math.max(...vals, 1), st = o.st || {}, px = 8, py = 22;
  let s = '';
  if (o.range && o.range[0] <= o.range[1]) { const [l, r] = o.range; s += rect(px + l * (bw + gap) - 4, py - 16, (r - l + 1) * (bw + gap) - gap + 8, H + 20, 'area-' + (o.rangeCls || 'acc'), 6); }
  vals.forEach((v, i) => { const h = Math.max(3, v / max * H), x = px + i * (bw + gap), y = py + H - h, k = st[i] || ''; s += rect(x, y, bw, h, 'bar ' + k, 3) + tx(x + bw / 2, y - 9, v, 'tv sm') + tx(x + bw / 2, py + H + 13, i, 'ti'); });
  let rows = 0;
  (o.marks || []).forEach(m => { if (m.i == null) return; rows = Math.max(rows, (m.row || 0) + 1); const x = px + m.i * (bw + gap) + bw / 2; s += tx(x, py + H + 31 + (m.row || 0) * 16, m.label, 'tp ' + (m.cls || 'acc')); });
  return { s, w: px * 2 + vals.length * (bw + gap) - gap, h: py + H + 24 + rows * 16 + 6 };
}

function grid(cells, o = {}) {
  const cw = o.cw || 40, chh = o.chh || 34, rows = cells.length, cols = cells[0].length, st = o.st || {};
  const hw = o.rh ? (o.rhw || 46) : 0, hh = o.ch ? 26 : 0, px = 2, py = 2;
  let s = '';
  if (o.ch) o.ch.forEach((t, c) => s += tx(px + hw + c * cw + cw / 2, py + hh / 2, t, 'th'));
  if (o.rh) o.rh.forEach((t, r) => s += tx(px + hw / 2, py + hh + r * chh + chh / 2, t, 'th'));
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const k = st[r + ',' + c] || '', x = px + hw + c * cw, y = py + hh + r * chh, v = cells[r][c];
    s += rect(x + 1, y + 1, cw - 2, chh - 2, 'cell ' + k, 3) + tx(x + cw / 2, y + chh / 2, v == null ? '' : v, 'tv ' + (o.small ? 'sm ' : '') + k);
  }
  (o.arrows || []).forEach(a => {
    const C = ([r, c]) => ({ x: px + hw + c * cw + cw / 2, y: py + hh + r * chh + chh / 2 });
    s += ln(shorten(C(a[0]), C(a[1]), 9, 11), a[2] || 'hot', true);
  });
  return { s, w: px * 2 + hw + cols * cw, h: py * 2 + hh + rows * chh };
}

/* ================= figure mounting + stepper ================= */
const IC = {
  first: '<svg viewBox="0 0 20 20"><path d="M4 4h2.4v12H4zM16.5 4 8 10l8.5 6z"/></svg>',
  prev: '<svg viewBox="0 0 20 20"><path d="M14 4 5.5 10 14 16z"/></svg>',
  next: '<svg viewBox="0 0 20 20"><path d="M6 4l8.5 6L6 16z"/></svg>',
  play: '<svg viewBox="0 0 20 20"><path d="M6 3.5 16.5 10 6 16.5z"/></svg>',
  pause: '<svg viewBox="0 0 20 20"><path d="M5 4h3.4v12H5zM11.6 4H15v12h-3.4z"/></svg>'
};
const asSvg = (r, label) => typeof r === 'string' ? r : svgw(r.w, r.h, r.s, label);
function still(host, r, label) { host.innerHTML = `<div class="stage">${asSvg(r, label)}</div>`; }
function stepper(host, frames, render, o = {}) {
  const outs = frames.map((f, i) => render(f, i));
  let W = 0, H = 0; outs.forEach(r => { if (typeof r === 'object') { W = Math.max(W, r.w); H = Math.max(H, r.h); } });
  const svgs = outs.map(r => typeof r === 'string' ? r : svgw(W, H, grp((W - r.w) / 2, 0, r.s), o.label));
  const n = frames.length;
  host.innerHTML = `<div class="stage"></div><div class="fnote" aria-live="polite"></div>
  <div class="ctl"><button type="button" data-a="first" aria-label="Back to the first step">${IC.first}</button><button type="button" data-a="prev" aria-label="Previous step">${IC.prev}</button><button type="button" data-a="play" class="play" aria-label="Play">${IC.play}</button><button type="button" data-a="next" aria-label="Next step">${IC.next}</button><div class="prog"><i></i></div><span class="cnt"></span></div>${o.legend ? `<div class="legend">${o.legend}</div>` : ''}`;
  const stage = host.querySelector('.stage'), note = host.querySelector('.fnote'), cnt = host.querySelector('.cnt'), bar = host.querySelector('.prog i');
  const B = a => host.querySelector(`[data-a="${a}"]`);
  let i = 0, t = null;
  const show = () => {
    stage.innerHTML = svgs[i]; note.innerHTML = frames[i].note || ''; cnt.textContent = `${i + 1} / ${n}`;
    bar.style.width = (n > 1 ? i / (n - 1) * 100 : 100) + '%';
    B('first').disabled = B('prev').disabled = i === 0; B('next').disabled = i === n - 1;
  };
  const stop = () => { clearInterval(t); t = null; B('play').innerHTML = IC.play; B('play').setAttribute('aria-label', 'Play'); };
  host.querySelector('.ctl').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const a = b.dataset.a;
    if (a === 'first') { stop(); i = 0; } else if (a === 'prev') { stop(); i = Math.max(0, i - 1); } else if (a === 'next') { stop(); i = Math.min(n - 1, i + 1); }
    else if (a === 'play') {
      if (t) stop(); else {
        if (i === n - 1) i = 0;
        t = setInterval(() => { if (!host.isConnected || i >= n - 1) { stop(); return; } i++; show(); }, o.speed || 1150);
        B('play').innerHTML = IC.pause; B('play').setAttribute('aria-label', 'Pause');
      }
    }
    show();
  });
  show();
}
function tabs(host, opts, onPick, start) {

CH.push({
  id: 'ch01', n: 1, title: 'Architecture and Protocols',
  lede: 'The Internet connects billions of devices that were never designed together, run by tens of thousands of independent organizations. This chapter explains the two ideas that make that possible, packet switching and protocols, and gives you the vocabulary for measuring a network: bandwidth, the four kinds of delay, throughput and loss.',
  html: `
<h2>What a network is</h2>
<p>A computer network moves data from one program to another program running on a different machine. At its simplest, two computers are joined by a cable and send bits to each other. That does not scale. Connecting every pair of n computers directly would take n(n−1)/2 links, almost 500,000 for a thousand machines. Instead, networks share links. Computers (called <strong>hosts</strong> or <strong>end systems</strong>) attach to nearby <strong>switches</strong> and <strong>routers</strong>, which forward data across a shared fabric of links toward its destination.</p>
<p>The Internet is a network of networks. Your home network, your company's network, a mobile operator, a university campus and a cloud provider's datacenter are each run independently. They agree to connect and exchange traffic, and a common set of rules lets data cross all of them. No single organization owns or controls the whole. That decentralization is the main reason the Internet grew from four computers in 1969 to billions today, and it shapes almost every design decision in this book.</p>
<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Host</td><td>an end system that runs applications: laptop, phone, server, sensor</td></tr>
<tr><td>Link</td><td>a physical or wireless channel between two or more nodes, with a bandwidth and a delay</td></tr>
<tr><td>Switch</td><td>forwards data within one local network, using link-layer addresses</td></tr>
<tr><td>Router</td><td>forwards data between networks, using Internet (IP) addresses</td></tr>
<tr><td>Packet</td><td>a self-contained chunk of data plus a header saying where it should go</td></tr>
<tr><td>Protocol</td><td>an agreed format for messages and rules for exchanging them</td></tr>
</table></div>

<h2>Two ways to share a network</h2>
<h3>Circuit switching</h3>
<p>The traditional telephone network used <strong>circuit switching</strong>. Before a call starts, the network sets up a dedicated path and reserves a fixed share of capacity on every link along it. While the call lasts, that capacity belongs to it, whether anyone is speaking or not. When the call ends, the reservation is released.</p>
<p>Circuits give predictable performance: once a call is admitted, it never competes with anyone. But they have three costs. Setting up the circuit takes time before any data flows. Reserved capacity is wasted whenever the connection is idle. And if any switch on the path fails, every circuit through it breaks.</p>
<h3>Packet switching</h3>
<p>In <strong>packet switching</strong>, data is cut into packets, each carrying a header with its destination address. Each router looks at the header of each packet independently and sends it one hop closer. Nothing is reserved in advance. A link is used by whichever packets happen to need it.</p>
${fig('pvc', '<b>Figure 1.1</b> A circuit reserves capacity along the whole path for one conversation. Packets from different conversations share every link.')}
<p>Computer traffic is <strong>bursty</strong>: a web browser is silent while you read and then suddenly requests dozens of objects. Reserving peak capacity for bursty traffic wastes most of it. Packet switching lets one sender's burst use the capacity another sender is not using at that moment. The price is unpredictability: when too many packets arrive at once, they wait in a <strong>queue</strong>, and if the queue fills, some are dropped.</p>
<div class="tbl"><table><tr><th></th><th>Circuit switching</th><th>Packet switching</th></tr>
<tr><td>Setup before sending</td><td>required</td><td>none</td></tr>
<tr><td>Capacity</td><td>reserved per connection</td><td>shared on demand</td></tr>
<tr><td>Performance</td><td>guaranteed once admitted</td><td>varies with load: queueing, loss</td></tr>
<tr><td>Efficiency for bursty traffic</td><td>poor</td><td>high</td></tr>
<tr><td>Failure of a switch</td><td>breaks every circuit through it</td><td>packets are routed around it</td></tr>
<tr><td>Examples</td><td>classic telephone network</td><td>the Internet, Ethernet</td></tr>
</table></div>

<h2>Statistical multiplexing</h2>
<p>Sharing a link among many flows whose demands vary over time is called <strong>statistical multiplexing</strong>. It works because independent bursty flows rarely all peak at the same moment. The capacity needed for the sum of many flows is much less than the sum of their individual peaks.</p>
${fig('statmux', '<b>Figure 1.2</b> Three bursty flows share one link. Their combined demand stays near the link capacity most of the time, although each flow alone sometimes needs far more than a third of it.')}
<p>A classic example: 35 users share a 1 Gbit/s link, and each user, when active, sends at 100 Mbit/s but is active only 10% of the time. Circuit switching could admit only 10 users. With packet switching, all 35 can share the link, and the probability that more than 10 are active at once is about 0.04%. When it does happen, a few packets queue for a moment.</p>
<p>Statistical multiplexing is a bet on averages, and occasionally the bet loses. The rest of the network stack is designed around that fact: queues absorb short bursts, transport protocols retransmit lost packets, and congestion control (Chapters 13 and 14) slows senders down when the network is overloaded.</p>

<h2>Measuring a network</h2>
<h3>Bandwidth</h3>
<p>The <strong>bandwidth</strong> (or capacity, or rate) of a link is how many bits per second it can carry: 100 Mbit/s for a home fiber line, 400 Gbit/s for a datacenter link. Note the units: networking uses bits per second, while file sizes are usually in bytes. A byte is 8 bits, so a 100 Mbit/s link carries at most 12.5 megabytes per second.</p>
<h3>The four delays</h3>
<p>A packet crossing a network accumulates four kinds of delay at each hop:</p>
<ol>
<li><strong>Transmission delay</strong>: the time to push all of the packet's bits onto the link. It equals packet size divided by bandwidth. A 1,500-byte packet (12,000 bits) takes 0.12 ms on a 100 Mbit/s link and 1.2 µs on a 10 Gbit/s link.</li>
<li><strong>Propagation delay</strong>: the time for a signal to travel the length of the link. It equals distance divided by signal speed, which is about two-thirds of the speed of light in fiber or copper, roughly 200 km per millisecond. Mumbai to London is about 7,200 km, so at least 36 ms one way, no matter how fast the link is.</li>
<li><strong>Queueing delay</strong>: time spent waiting in a router's buffer for packets ahead of it. It ranges from zero on an idle link to many milliseconds on a congested one.</li>
<li><strong>Processing delay</strong>: time for the router to examine the header and decide where to send the packet. Usually microseconds.</li>
</ol>
${fig('delay', '<b>Figure 1.3</b> Transmission and propagation are different things. Transmission depends on the link\'s rate; propagation depends only on distance.')}
<p>It helps to picture a link as a pipe. Bandwidth is how wide the pipe is; propagation delay is how long it is. Making the pipe wider does nothing for how long the first bit takes to reach the other end.</p>
<h3>Latency, RTT and the bandwidth-delay product</h3>
<p>The <strong>latency</strong> of a path is the total time for a packet to travel from source to destination. The <strong>round-trip time</strong> (RTT) is the time for a packet to go there and a reply to come back. Many protocols need at least one RTT before useful data flows, so RTT often matters more to users than bandwidth does.</p>
<p>The <strong>bandwidth-delay product</strong> (BDP) is bandwidth × RTT: the number of bits "in flight" in the pipe when it is full. A 1 Gbit/s path with a 100 ms RTT holds 100 megabits, about 12.5 MB. To keep that pipe full, a sender must have 12.5 MB of data sent but not yet acknowledged. This number reappears in sliding windows (Chapter 11), congestion control and router buffer sizing.</p>
<h3>Throughput and loss</h3>
<p><strong>Throughput</strong> is the rate at which data actually arrives, which is limited by the slowest link on the path (the <strong>bottleneck</strong>), by competing traffic and by the protocols themselves. <strong>Goodput</strong> counts only useful application data, excluding headers and retransmissions. <strong>Loss rate</strong> is the fraction of packets dropped, usually because a queue was full. Even 1% loss can reduce TCP throughput dramatically.</p>
<h3>Why queues grow</h3>
<p>Queueing delay depends on <strong>utilization</strong> ρ, the ratio of arrival rate to link rate. With random arrivals, the average delay grows like 1 / (1 − ρ). At 50% utilization a packet waits about one service time on average; at 90%, about ten; at 99%, about a hundred.</p>
${fig('queuedelay', '<b>Figure 1.4</b> Average queueing delay rises slowly at first and then explodes as utilization approaches 100%.')}
<p>That curve is why networks are rarely run close to full: the last few percent of utilization cost a huge amount of delay.</p>
${code('Delay calculator')`
public class LinkMath {
  /** Transmission delay in milliseconds. */
  static double transmitMs(long bytes, double bitsPerSecond) { return bytes * 8 / bitsPerSecond * 1000; }
  /** Propagation delay in milliseconds, assuming signals travel at 2e8 m/s. */
  static double propagateMs(double km) { return km * 1000 / 2e8 * 1000; }
  /** Bytes in flight needed to fill the pipe. */
  static double bdpBytes(double bitsPerSecond, double rttMs) { return bitsPerSecond * rttMs / 1000 / 8; }

  public static void main(String[] args) {
    System.out.printf("1500 B on 100 Mbit/s: %.3f ms%n", transmitMs(1500, 100e6));   // 0.120
    System.out.printf("Mumbai-London 7200 km: %.1f ms%n", propagateMs(7200));          // 36.0
    System.out.printf("BDP 1 Gbit/s, 100 ms: %.1f MB%n", bdpBytes(1e9, 100) / 1e6);    // 12.5
  }
}`}

<h2>Protocols</h2>
<p>Hosts and routers from different vendors, running different operating systems, must understand each other. They do so by following <strong>protocols</strong>. A protocol defines:</p>
<ul>
<li>the <strong>syntax</strong> of messages: which fields appear, in what order, with what sizes and encodings;</li>
<li>the <strong>semantics</strong> of each field: what the values mean;</li>
<li>the <strong>rules</strong>: when to send which message, how to respond to each message, and what to do when something goes wrong, such as a timeout.</li>
</ul>
<p>Human conversation has protocols too. You say hello and wait for a reply before asking your question; if the other person does not answer, you repeat yourself or give up. Network protocols are the same idea, made precise enough for software.</p>
<p>Internet protocols are standardized by the <strong>IETF</strong> (Internet Engineering Task Force) in documents called <strong>RFCs</strong>. IP is RFC 791 (1981), TCP's current specification is RFC 9293 (2022), HTTP/3 is RFC 9114. The IETF's working motto is "rough consensus and running code": a standard is expected to be implemented and shown to work, not just written. Link technologies such as Ethernet and Wi-Fi are standardized by the IEEE as the 802 family.</p>

<h2>The shape of the Internet</h2>
<p>Hosts connect through an <strong>access network</strong>: home broadband, a mobile network, an office Ethernet. Access networks connect to <strong>Internet service providers</strong> (ISPs). ISPs connect to each other, either by buying transit from a larger provider or by exchanging traffic directly as peers, often at <strong>Internet exchange points</strong> (IXPs) where many networks meet in one building. At the top are a few dozen large transit networks with global reach. Alongside them, large content providers and cloud platforms run private global networks that reach users directly.</p>
<p>Each independently run network is called an <strong>autonomous system</strong>. Routing inside one is covered in Chapters 5 to 8, and routing between them with BGP in Chapters 9 and 10.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Mixing bits and bytes.</strong> Link rates are bits per second; file sizes are bytes. Multiply or divide by 8.</li>
<li><strong>Confusing bandwidth with latency.</strong> A faster link reduces transmission delay, not propagation delay.</li>
<li><strong>Forgetting the round trip.</strong> Many operations need a request and a reply: count the RTT, not the one-way delay.</li>
<li><strong>Assuming a full link is efficient.</strong> Near 100% utilization, queueing delay grows without bound.</li>
</ul></div>

CH.push({
  id: 'ch02', n: 2, title: 'Layers, from the Bottom Up',
  lede: 'Networking is organized into layers. Each layer solves one problem, uses the service of the layer below and offers a service to the layer above. This chapter climbs the stack from signals on a wire to applications, and shows how a packet is wrapped and unwrapped as it travels.',
  html: `
<h2>Why layers</h2>
<p>Getting a web page from a server to your browser involves converting bits into light pulses or radio waves, sharing a cable or a radio channel with other devices, finding a path across dozens of independently run networks, recovering from lost packets and interpreting the page's content. Writing one program that handled all of that for every combination of technologies would be impossible.</p>
<p>Instead, the job is split into <strong>layers</strong>. Each layer solves one problem and relies only on the <em>service</em> provided by the layer directly below it, without knowing how that service is implemented. A web browser does not care whether the bits travel over Wi-Fi, fiber or a satellite. Wi-Fi does not care whether it carries a video call or an email. Either side can change without breaking the other. This is the same idea as programming against an interface rather than an implementation.</p>
${fig('layers', '<b>Figure 2.1</b> The five-layer model of the Internet, with each layer\'s job, example protocols and the name of its unit of data.')}
<p>You may also meet the seven-layer <strong>OSI model</strong>, which adds a session layer and a presentation layer between transport and application. Those two never became separate layers on the Internet; their jobs (managing sessions, encoding data, encryption) are done inside applications or by libraries such as TLS. People still say "layer 2" for the link layer, "layer 3" for the network layer, "layer 4" for transport and "layer 7" for applications, from the OSI numbering.</p>

<h2>Layer 1: the physical layer</h2>
<p>The physical layer moves raw bits across a medium. It decides how a 0 and a 1 are represented: voltage levels on copper, light pulses in fiber, changes in a radio wave's amplitude, frequency or phase. It also defines connectors, cable types and the <strong>symbol rate</strong> (how many signal changes per second).</p>
<p>Physical channels are imperfect. Signals weaken with distance (<strong>attenuation</strong>), pick up <strong>noise</strong> and interfere with each other. The Shannon-Hartley theorem sets the ceiling: a channel of bandwidth B hertz and signal-to-noise ratio S/N can carry at most B · log₂(1 + S/N) bits per second, however clever the encoding. Better encodings get closer to that limit; nothing exceeds it. Some bits will inevitably be flipped, which the layers above must detect.</p>

<h2>Layer 2: the link layer</h2>
<p>The link layer moves a <strong>frame</strong>, a bounded chunk of bits with a header and a trailer, between two nodes on the same physical network. Its tasks:</p>
<ul>
<li><strong>Framing:</strong> marking where each frame starts and ends in a stream of bits.</li>
<li><strong>Addressing:</strong> on shared media, saying which node the frame is for, using a <strong>MAC address</strong> (48 bits, written like <code>3c:22:fb:9a:10:4e</code>).</li>
<li><strong>Error detection:</strong> a checksum such as a 32-bit CRC lets the receiver discard corrupted frames.</li>
<li><strong>Medium access:</strong> on shared channels such as Wi-Fi, deciding who may transmit when, so that transmissions do not collide.</li>
</ul>
<p>Ethernet and Wi-Fi are link-layer technologies; Chapters 17 and 22 cover them. A link-layer network is local: it might be one office floor or one home. The link layer by itself has no idea how to reach a machine on another continent.</p>

<h2>Layer 3: the network layer</h2>
<p>The network layer delivers a <strong>packet</strong> from a source host to a destination host anywhere, across many different link-layer networks. On the Internet there is exactly one network-layer protocol: the <strong>Internet Protocol</strong>, IP. Every host and router speaks it.</p>
<p>IP gives each network interface a globally meaningful <strong>IP address</strong> (32 bits in IPv4, 128 bits in IPv6). Routers read the destination address in each packet's header and forward the packet one hop closer. The algorithms that let routers decide where "closer" is are the subject of Chapters 5 to 10.</p>
<p>IP's service is <strong>best effort</strong>. It tries to deliver each packet, but promises nothing: packets may be lost, duplicated, delayed or delivered out of order, and there is no notice when that happens. This modest promise is deliberate. It is easy to implement on any link technology, and it leaves the decision about how much reliability to buy to the hosts that care. Chapter 4 explains the reasoning.</p>

<h2>Layer 4: the transport layer</h2>
<p>IP delivers packets to a <em>host</em>. But a host runs many programs at once: a browser with twenty tabs, a chat app, a music stream. The transport layer delivers data to the right <em>process</em>, identified by a 16-bit <strong>port number</strong>. Web servers listen on port 443, DNS on port 53, SSH on port 22.</p>
<p>The transport layer can also turn IP's best-effort service into something better:</p>
<ul>
<li><strong>UDP</strong> adds ports and a checksum and nothing else. Each datagram is independent and may be lost. It suits applications that prefer speed to completeness, or that implement their own recovery.</li>
<li><strong>TCP</strong> provides a reliable, ordered <strong>byte stream</strong>. It numbers the bytes, retransmits whatever is lost, reorders what arrives out of order, avoids overwhelming the receiver (flow control) and avoids overwhelming the network (congestion control). Chapters 11 to 14 build it piece by piece.</li>
<li><strong>QUIC</strong> provides TCP-like reliability plus encryption and multiple independent streams, running on top of UDP. It carries HTTP/3 (Chapter 16).</li>
</ul>

<h2>Layer 7: applications</h2>
<p>The application layer is where networking meets the programs people use. Applications define their own protocols on top of transport: <strong>HTTP</strong> for the web, <strong>DNS</strong> for translating names to addresses, <strong>SMTP</strong> and <strong>IMAP</strong> for email, <strong>SSH</strong> for remote shells. Application protocols decide what messages mean; the lower layers only move bytes.</p>

<h2>Encapsulation</h2>
<p>When data moves down the stack, each layer treats everything it receives from above as an opaque payload and puts its own <strong>header</strong> in front. This nesting is called <strong>encapsulation</strong>. On the way up at the receiver, each layer reads and removes its own header and passes the rest up.</p>
${fig('encap', '<b>Figure 2.2</b> An HTTP request wrapped by TCP, IP and Ethernet, then unwrapped and rewrapped at a router, and finally unwrapped at the server.')}
<p>Each header carries the information its layer needs: the Ethernet header has MAC addresses and a type field saying "IP is inside", the IP header has IP addresses and a protocol field saying "TCP is inside", and the TCP header has port numbers. These "what is inside" fields are how a receiver knows which code should handle the payload next. This step is called <strong>demultiplexing</strong>.</p>
<p>Headers cost bandwidth. A full-size Ethernet frame carries up to 1,500 bytes of IP packet (the <strong>maximum transmission unit</strong>, MTU). With 20 bytes of IPv4 header, 20 bytes of TCP header and 38 bytes of Ethernet framing overhead, about 95% of the bits on the wire are application data. For tiny packets the overhead dominates.</p>
${code('Peeling headers off a raw frame')`
import java.nio.ByteBuffer;

public class Decap {
  /** Prints the layers of an Ethernet frame carrying IPv4 and TCP. */
  static void describe(byte[] frame) {
    ByteBuffer b = ByteBuffer.wrap(frame);                  // network byte order is big-endian, the default
    b.position(12);
    int etherType = b.getShort() & 0xFFFF;                  // 0x0800 means "an IPv4 packet follows"
    if (etherType != 0x0800) { System.out.println("not IPv4"); return; }
    int ipStart = 14;
    int ihl = (frame[ipStart] & 0x0F) * 4;                  // IP header length in bytes
    int protocol = frame[ipStart + 9] & 0xFF;               // 6 means "a TCP segment follows"
    String src = ip(frame, ipStart + 12), dst = ip(frame, ipStart + 16);
    System.out.println("IPv4 " + src + " -> " + dst + ", protocol " + protocol);
    if (protocol == 6) {
      b.position(ipStart + ihl);
      int sport = b.getShort() & 0xFFFF, dport = b.getShort() & 0xFFFF;
      System.out.println("TCP port " + sport + " -> " + dport);
    }
  }
  static String ip(byte[] f, int off) {
    return (f[off] & 0xFF) + "." + (f[off + 1] & 0xFF) + "." + (f[off + 2] & 0xFF) + "." + (f[off + 3] & 0xFF);
  }
}`}

<h2>Which devices implement which layers</h2>
<p>Hosts implement all five layers. Network devices implement only as many as they need to forward traffic:</p>
<ul>
<li>A <strong>switch</strong> works at layer 2. It reads MAC addresses and forwards frames within one local network.</li>
<li>A <strong>router</strong> works at layer 3. It reads IP addresses and forwards packets between networks, rebuilding the link-layer frame for each new link.</li>
<li>Hosts implement transport and application layers. Routers in the middle of the network do not look at TCP or HTTP at all, at least in principle.</li>
</ul>
${fig('devices', '<b>Figure 2.3</b> The path of a packet through the layers of each device it crosses.')}
<p>In practice many devices in the middle of the network break this rule. Firewalls inspect ports, load balancers read HTTP headers, and NAT boxes rewrite addresses and ports (Chapter 18). These <strong>middleboxes</strong> are useful but make the Internet harder to change, a theme that recurs in Chapter 4.</p>

<h2>Service and interface</h2>
<p>Three words are worth keeping distinct. A layer's <strong>service</strong> is what it promises to the layer above ("deliver this packet, best effort"). Its <strong>interface</strong> is how the layer above asks for that service (a function call, such as the sockets API in Chapter 3). Its <strong>protocol</strong> is how the layer talks to its counterpart on another machine (the header format and rules). You can change a protocol without changing the service, and many protocols can provide the same service.</p>
<p>Layers on two machines that share a protocol are called <strong>peers</strong>. The TCP code on your laptop and the TCP code on the server are peers: they exchange headers with each other, even though the bits physically travel down one stack and up the other.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Treating MAC and IP addresses as interchangeable.</strong> MAC addresses are for one hop on one link; IP addresses identify the endpoints across the whole path.</li>
<li><strong>Thinking IP is reliable.</strong> Reliability, if you want it, comes from the transport layer or the application.</li>
<li><strong>Forgetting the MTU.</strong> Packets larger than a link's MTU must be fragmented or rejected, which causes subtle failures.</li>
<li><strong>Assuming routers do not look inside packets.</strong> Real networks are full of middleboxes that do.</li>
</ul></div>

CH.push({
  id: 'ch03', n: 3, title: 'Layers, from the Top Down',
  lede: 'Now look at the same stack from the application\'s side. This chapter follows a single web page load across the network, shows how a program talks to the network through sockets, and explains how ports and connections let thousands of conversations share one machine.',
  html: `
<h2>What happens when you load a web page</h2>
<p>Typing <code>https://www.example.com</code> into a browser sets off a short, carefully ordered exchange of messages. Every step uses a protocol you will study in detail later in this book; here the point is to see how they fit together.</p>
${fig('webreq', '<b>Figure 3.1</b> The messages exchanged to load one page. Time runs downward; each diagonal arrow is a message, and its slope is the network delay.')}
<ol>
<li><strong>Name resolution.</strong> The browser needs an IP address. It asks a DNS resolver (Chapter 15), usually run by the ISP or a public service, over UDP. The answer may come straight from a cache.</li>
<li><strong>Connection setup.</strong> The browser opens a TCP connection to port 443 with a three-way handshake (Chapter 12): SYN, SYN-ACK, ACK. That costs one round trip.</li>
<li><strong>Security setup.</strong> TLS (Chapter 18) negotiates encryption keys and authenticates the server with a certificate. TLS 1.3 needs one more round trip.</li>
<li><strong>The request.</strong> The browser sends an HTTP GET (Chapter 16), and the server returns the HTML.</li>
<li><strong>Everything else.</strong> The HTML references stylesheets, scripts and images, often from other servers, each of which may need its own DNS lookup and connection.</li>
</ol>
<p>Count the round trips: one for DNS, one for TCP, one for TLS and one for the request itself. On a 100 ms path, that is 400 ms before the first byte of the page arrives, no matter how much bandwidth you have. This is why so much engineering goes into removing round trips: DNS caching, connection reuse, TLS session resumption, and QUIC's combined transport and crypto handshake.</p>

<h2>Sockets: the application's view</h2>
<p>An application does not build headers or talk to the network card. It asks the operating system for a <strong>socket</strong>, an endpoint for communication, and reads and writes bytes through it. The operating system's network stack does the rest. The sockets API, first introduced in BSD Unix in 1983, is the interface between the application layer and the transport layer on almost every system, and Java's <code>java.net</code> classes wrap it.</p>
${fig('sockapi', '<b>Figure 3.2</b> The order of socket calls on a TCP server and client. accept() blocks until a client connects.')}
<h3>A TCP server and client</h3>
${code('EchoServer.java')`
import java.io.*;
import java.net.*;

public class EchoServer {
  public static void main(String[] args) throws IOException {
    try (ServerSocket listener = new ServerSocket(8080)) {          // socket + bind + listen
      System.out.println("listening on 8080");
      while (true) {
        Socket conn = listener.accept();                           // blocks until a client connects
        Thread.ofVirtual().start(() -> handle(conn));              // one cheap virtual thread per client
      }
    }
  }
  static void handle(Socket conn) {
    try (conn;
         BufferedReader in = new BufferedReader(new InputStreamReader(conn.getInputStream()));
         PrintWriter out = new PrintWriter(conn.getOutputStream(), true)) {
      String line;
      while ((line = in.readLine()) != null) out.println("echo: " + line);   // read, then write back
    } catch (IOException e) {
      System.err.println("client error: " + e.getMessage());
    }
  }
}`}
${code('EchoClient.java')`
import java.io.*;
import java.net.*;

public class EchoClient {
  public static void main(String[] args) throws IOException {
    try (Socket s = new Socket("localhost", 8080);                 // socket + connect (TCP handshake happens here)
         PrintWriter out = new PrintWriter(s.getOutputStream(), true);
         BufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream()))) {
      out.println("hello");
      System.out.println(in.readLine());                           // echo: hello
    }
  }
}`}
<p>Notice what the code does not contain: no packets, no retransmission, no sequence numbers. TCP gives the application a <strong>byte stream</strong>, like a file, and hides everything else. One consequence surprises beginners: TCP does not preserve message boundaries. Two <code>write</code> calls of 100 bytes may arrive as one read of 200 bytes, or as reads of 37 and 163. Applications must frame their own messages, with newlines (as above), length prefixes, or a protocol such as HTTP that defines where each message ends.</p>
<h3>A UDP exchange</h3>
${code('UdpPing.java')`
import java.net.*;
import java.nio.charset.StandardCharsets;

public class UdpPing {
  public static void main(String[] args) throws Exception {
    try (DatagramSocket sock = new DatagramSocket()) {             // no connection, no handshake
      sock.setSoTimeout(1000);                                     // UDP never retries: we must
      byte[] msg = "ping".getBytes(StandardCharsets.UTF_8);
      sock.send(new DatagramPacket(msg, msg.length, InetAddress.getByName("localhost"), 9999));
      byte[] buf = new byte[1500];
      DatagramPacket reply = new DatagramPacket(buf, buf.length);
      try {
        sock.receive(reply);                                       // one whole datagram, boundaries preserved
        System.out.println(new String(buf, 0, reply.getLength(), StandardCharsets.UTF_8));
      } catch (SocketTimeoutException e) {
        System.out.println("no reply: the datagram or its answer was lost");
      }
    }
  }
}`}
<p>UDP is the opposite trade. Each datagram arrives whole or not at all, there is no setup cost, and nothing is retransmitted. The application decides what to do about loss.</p>

<h2>Ports and connections</h2>
<p>An IP address identifies a host's network interface. A <strong>port</strong>, a 16-bit number from 0 to 65,535, identifies a socket on that host. Well-known services use fixed ports below 1024 (HTTP 80, HTTPS 443, DNS 53, SSH 22). A client usually gets a temporary <strong>ephemeral port</strong> chosen by the operating system, typically in the range 32768 to 60999 on Linux or 49152 to 65535 on Windows.</p>
${fig('demux', '<b>Figure 3.3</b> Arriving packets are handed to the right process by destination port.')}
<p>A TCP connection is identified by its <strong>5-tuple</strong>: protocol, source IP, source port, destination IP and destination port. Many clients can connect to port 443 on the same server at once, because each connection has a different client address or port. A busy server can hold millions of connections on one listening port, limited by memory rather than by port numbers.</p>
<div class="tbl"><table><tr><th>Socket</th><th>Identified by</th><th>Receives</th></tr>
<tr><td>UDP socket</td><td>local IP and port</td><td>datagrams from anyone sent to that port</td></tr>
<tr><td>TCP listening socket</td><td>local IP and port</td><td>new connection requests</td></tr>
<tr><td>TCP connected socket</td><td>the full 5-tuple</td><td>bytes of one specific connection</td></tr>
</table></div>

<h2>Client-server and other patterns</h2>
<p>Most Internet applications follow the <strong>client-server</strong> pattern: a server with a stable address waits for requests, and clients connect to it. It is simple and easy to secure and manage, but the server must handle the whole load, which is why popular services run on large fleets behind load balancers and content delivery networks (Chapter 16).</p>
<p>In <strong>peer-to-peer</strong> systems, every participant both requests and serves data. BitTorrent swarms and some video-calling systems work this way; capacity grows with the number of users, at the cost of more complex coordination. Large distributed computations, such as training machine-learning models across thousands of GPUs, use yet another pattern of collective communication (Chapter 21).</p>

<h2>Looking at real traffic</h2>
<p>A few command-line tools let you see these steps on your own machine:</p>
${code('Tools to try', 'none')`
dig www.example.com              # the DNS query and answer, with timing
curl -v https://www.example.com  # TCP connect, TLS handshake, HTTP request and response headers
curl -w "dns %{time_namelookup}  connect %{time_connect}  tls %{time_appconnect}  first byte %{time_starttransfer}\n" -o /dev/null -s https://www.example.com
ss -tn                           # open TCP connections with their 5-tuples (Linux)
traceroute www.example.com       # the routers along the path (Chapter 8 explains how)`}
<p>The <code>curl -w</code> line prints the time at which each phase finished. On a distant server you will see the round trips of Figure 3.1 add up.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Assuming one write equals one read.</strong> TCP is a byte stream; frame your messages.</li>
<li><strong>Forgetting timeouts.</strong> A blocking read on a dead connection waits forever. Set <code>setSoTimeout</code> or use deadlines.</li>
<li><strong>Not closing sockets.</strong> Leaked sockets exhaust file descriptors. Use try-with-resources.</li>
<li><strong>One platform thread per connection at scale.</strong> Use virtual threads or non-blocking I/O.</li>
<li><strong>Ignoring the round trips.</strong> Latency, not bandwidth, usually dominates page load time.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Run the echo pair</summary><p>Run the server and client, then connect with <code>nc localhost 8080</code> and type lines by hand.</p></details>
<details><summary>Count round trips</summary><p>Use the curl timing command on three sites at different distances and explain the numbers.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Length-prefixed framing</summary><p>Change the echo protocol to send a 4-byte length followed by the message, using DataInputStream and DataOutputStream.</p></details>
<details><summary>UDP echo server</summary><p>Write the server side of UdpPing, then drop 30% of replies at random and add retries to the client.</p></details>
<details><summary>Many clients</summary><p>Open 10,000 concurrent connections to the echo server with virtual threads and watch them with <code>ss</code>.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>A tiny HTTP server</summary><p>Using only ServerSocket, parse "GET /path HTTP/1.1" requests and return files with correct Content-Length headers.</p></details>
<details><summary>Non-blocking server</summary><p>Rewrite the echo server with java.nio Selector so one thread serves all clients.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can list the protocol steps and round trips involved in loading an HTTPS page.</li>
<li>I can write a TCP client and server and a UDP exchange in Java.</li>
<li>I can explain why TCP needs application-level message framing and UDP does not.</li>
<li>I can explain ports, ephemeral ports and the 5-tuple, and how demultiplexing uses them.</li>
<li>I can use dig, curl and ss to observe the steps of a request.</li>
</ul>
`});

CH.push({
  id: 'ch04', n: 4, title: 'Architectural Principles',
  lede: 'Behind the protocols sit a few design principles that explain why the Internet looks the way it does: a deliberately simple core, intelligence at the edges, a single narrow waist, and state that can be rebuilt. Knowing them lets you predict where new features belong and why some designs fail.',
  html: `
<h2>Design goals</h2>
<p>In 1988 David Clark, one of the Internet's early architects, wrote down the goals the original designers had in mind, in order of priority. The order explains a great deal:</p>
<ol>
<li>Connect existing, different networks into one.</li>
<li>Keep communicating despite the loss of networks or gateways (routers).</li>
<li>Support many types of service.</li>
<li>Accommodate a variety of network technologies.</li>
<li>Allow distributed management.</li>
<li>Be cost effective.</li>
<li>Make it easy to attach hosts.</li>
<li>Account for the resources used.</li>
</ol>
<p>Survivability came second, which is why the network keeps almost no per-connection state that a failure could destroy. Security was not on the list at all: the early Internet connected a few hundred trusted research institutions. Much of the effort of the last thirty years, from firewalls to TLS to securing BGP, has gone into adding what was left out.</p>

<h2>The narrow waist</h2>
<p>Above IP there are thousands of applications and several transport protocols. Below IP there are dozens of link technologies, from Ethernet to Wi-Fi to 5G to satellite links. In the middle, every packet uses one protocol: IP.</p>
${fig('hourglass', '<b>Figure 4.1</b> The hourglass. Anything above can run over anything below, because they all meet at IP.')}
<p>The narrow waist is why the Internet could adopt new technologies so quickly. A new link technology only has to carry IP packets to support every existing application. A new application only has to use IP (through TCP or UDP) to run over every existing network. The cost is that changing IP itself is extremely hard, because everything depends on it. The transition from IPv4 to IPv6 began in the late 1990s and is still under way.</p>

<h2>Best-effort delivery</h2>
<p>IP's service promises almost nothing. A packet may be lost, delayed, duplicated, reordered or corrupted, and the network does not report it. This sounds like a weakness, but it was the key to interconnecting very different networks. Any network that can sometimes move a packet can carry IP. Guaranteeing more, such as bounded delay or no loss, would require every network along the path to support those guarantees, and would rule many of them out.</p>
<p>Best effort also matches what packet switching naturally provides. Statistical multiplexing (Chapter 1) means queues will sometimes overflow. Rather than hide that in the core, the Internet lets the hosts decide how to respond.</p>

<h2>The end-to-end argument</h2>
<p>The most influential principle in network design comes from a 1984 paper by Saltzer, Reed and Clark. In paraphrase: a function that can be completely and correctly implemented only with the knowledge of the application at the endpoints should be implemented at the endpoints. Implementing it inside the network can be at most a performance optimization, never a replacement.</p>
<p>The paper's example is reliable file transfer. Suppose every link checks its frames and retransmits damaged ones, so each hop is reliable. Is the file now guaranteed to arrive intact? No. A router could corrupt the data in its memory after receiving it correctly and before sending it on. A bug in the receiving host's disk driver could corrupt it after it arrives. Only a check by the receiving application, comparing a checksum of the whole file against one computed by the sender, can confirm the transfer succeeded. And once that end-to-end check exists, per-hop reliability is no longer necessary for correctness.</p>
${fig('e2e', '<b>Figure 4.2</b> Every link check passes, but the data is still wrong. Only the endpoints can tell.')}
<p>That does not mean the network should do nothing. Wi-Fi retransmits lost frames locally because its loss rate is high and an end-to-end retransmission would be slow; that is a performance optimization, and it is worth it. The argument says such features are optional and should not be relied on for correctness.</p>
<div class="note key"><b>Consequences</b><p>The end-to-end argument explains why reliability, ordering, encryption and congestion control live in the hosts (TCP, TLS, QUIC), while routers only forward packets. It is also why the Internet was easy to extend: new applications need no changes inside the network.</p></div>

<h2>Fate sharing and soft state</h2>
<p><strong>Fate sharing</strong> means keeping the state of a conversation in the endpoints that are part of it, so the state is lost only when an endpoint itself fails, and then it does not matter. A TCP connection's sequence numbers, buffers and timers live only in the two hosts. If a router in the middle crashes, no connection state is lost; packets are routed around the failure and the connection continues.</p>
<p>When the network does keep state, it should be <strong>soft state</strong>: information that expires unless refreshed, and that can be rebuilt automatically. Routing tables are rebuilt by routing protocols. DNS caches expire after a TTL. Switch learning tables age out. ARP caches are refreshed. Soft state means the system recovers from failures and stale information without manual repair. The alternative, <strong>hard state</strong>, must be explicitly installed and removed, and a crash in the middle leaves it inconsistent.</p>

<h2>Layering and its violations</h2>
<p>Layering (Chapter 2) gives modularity, but it is a guideline rather than a law. Real networks contain many <strong>middleboxes</strong> that look above their layer:</p>
<ul>
<li><strong>NAT</strong> devices rewrite IP addresses and transport ports (Chapter 18).</li>
<li><strong>Firewalls</strong> block traffic based on ports and connection state.</li>
<li><strong>Load balancers</strong> route by HTTP headers or TLS server names.</li>
<li><strong>Traffic shapers</strong> classify flows by application.</li>
</ul>
<p>Each is useful, and each breaks the end-to-end model. A middlebox that only understands TCP and UDP will drop packets of a new transport protocol. This <strong>ossification</strong> is why QUIC runs on top of UDP and encrypts almost all of its header: anything visible to middleboxes eventually becomes impossible to change.</p>

<h2>Other principles</h2>
<ul>
<li><strong>The robustness principle</strong> (Postel's law): "be conservative in what you do, be liberal in what you accept from others." It helped early implementations interoperate. Today it is applied more cautiously, because accepting malformed input invites security bugs and lets errors become de facto standards.</li>
<li><strong>Hierarchy for scale.</strong> Addresses are hierarchical (Chapter 7), so routers store prefixes, not every host. Names are hierarchical (Chapter 15), so no single server holds every name.</li>
<li><strong>Separate the control plane from the data plane.</strong> Deciding routes (slow, complex, software) is distinct from forwarding packets (fast, simple, hardware). Software-defined networking (Chapter 20) takes this separation to its conclusion.</li>
<li><strong>Design for heterogeneity and failure.</strong> Assume links of wildly different speeds, devices from many vendors, and components that will fail.</li>
<li><strong>Decentralized control.</strong> No organization runs the whole Internet. Protocols such as BGP (Chapter 9) let independent networks cooperate while keeping their own policies.</li>
</ul>

<h2>What the Internet does not provide</h2>
<p>These principles also explain several things the Internet lacks, which you will see engineers working around throughout this book:</p>
<div class="tbl"><table><tr><th>Missing feature</th><th>Why</th><th>Workarounds</th></tr>
<tr><td>Guaranteed bandwidth or delay</td><td>best-effort core, statistical multiplexing</td><td>overprovisioning, priority queues in private networks</td></tr>
<tr><td>Security</td><td>not an original goal</td><td>TLS, VPNs, firewalls, RPKI for BGP</td></tr>
<tr><td>Mobility</td><td>an IP address names a location</td><td>DHCP re-addressing, cellular tunnels, QUIC connection IDs</td></tr>
<tr><td>Multicast</td><td>needs state in routers and agreements between networks</td><td>application-layer distribution, CDNs</td></tr>
<tr><td>Accountability</td><td>source addresses are not verified</td><td>ingress filtering, logging, cryptographic identities</td></tr>
</table></div>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Relying on per-hop reliability for correctness.</strong> Check end to end.</li>
<li><strong>Putting connection state in the network</strong> without a plan for when that device fails.</li>
<li><strong>Exposing protocol details to middleboxes</strong> you will want to change later; they will ossify.</li>
<li><strong>Treating best effort as broken.</strong> It is the reason the Internet could connect everything.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Hard or soft state?</summary><p>Classify: a TCP connection's sequence numbers, a DNS cache entry, a static route typed by an operator, a switch's MAC table, a NAT mapping.</p></details>
<details><summary>Where does it belong?</summary><p>For encryption, reliability, duplicate suppression and spam filtering, argue whether the function belongs in the network or at the endpoints.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>End-to-end in your own systems</summary><p>Pick a message pipeline you know (for example, a payment event passing through queues). Where are the per-hop checks, and what end-to-end check guarantees correctness?</p></details>
<details><summary>Ossification</summary><p>Explain why TCP Fast Open and new TCP options were slow to deploy, and how QUIC avoided the same fate.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Read the originals</summary><p>Read "End-to-End Arguments in System Design" (1984) and "The Design Philosophy of the DARPA Internet Protocols" (1988), and write a one-page summary of where today's Internet departs from them.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can list the Internet's original design goals and explain why their order matters.</li>
<li>I can explain the narrow waist and its benefits and costs.</li>
<li>I can state the end-to-end argument and apply it to a new feature.</li>
<li>I can explain fate sharing, soft state and hard state with examples.</li>
<li>I can name common middleboxes and explain how they cause ossification.</li>
</ul>
`});

CH.push({
  id: 'ch05', n: 5, title: 'Routing Principles',
  lede: 'Every router must decide, for every packet, which neighbour to send it to next. This chapter separates that per-packet decision (forwarding) from the process that fills in the tables (routing), defines what makes a set of tables correct, and sets up the questions that the next five chapters answer.',
  html: `
<h2>Forwarding and routing</h2>
<p>Two different jobs are often both called "routing", and it pays to keep them apart.</p>
<ul>
<li><strong>Forwarding</strong> is what a router does to each packet as it arrives: read the destination address, look it up in a <strong>forwarding table</strong>, and send the packet out of the matching interface toward the <strong>next hop</strong>. It is local, simple and must be very fast: a 400 Gbit/s port receives a minimum-size packet every 1.7 nanoseconds.</li>
<li><strong>Routing</strong> is the process that fills in those forwarding tables. Routers exchange information with each other, compute paths and install entries. It is distributed, complex and runs on a much slower timescale: seconds, or when something changes.</li>
</ul>
<p>The same split is often described as the <strong>data plane</strong> (forwarding, in hardware) and the <strong>control plane</strong> (routing, in software). A useful analogy is driving: forwarding is reading the road sign at each junction; routing is the work done by whoever decided what the signs should say.</p>
${fig('fwd', '<b>Figure 5.1</b> A packet for 10.5.0.9 forwarded hop by hop. Each router consults only its own table and sends the packet one step closer.')}

<h2>Destination-based forwarding</h2>
<p>On the Internet, forwarding is <strong>destination-based</strong>: a router chooses the next hop by looking only at the packet's destination address, not at where it came from or what it contains. This keeps forwarding simple and tables small, and it has an important consequence: all packets to the same destination that pass through a given router take the same next hop, whatever their source.</p>
<p>Forwarding tables do not list individual hosts. They list <strong>prefixes</strong>, blocks of addresses such as <code>10.5.0.0/16</code> (all addresses that start with the 16 bits of 10.5). A <strong>default route</strong> (<code>0.0.0.0/0</code>) matches everything not covered by a more specific entry, typically pointing toward an upstream provider. When several entries match, the router uses the most specific one, a rule called <strong>longest prefix match</strong> (Chapter 7).</p>
${code('Viewing a forwarding table', 'none')`
$ ip route            # Linux
default via 192.168.1.1 dev wlan0
10.8.0.0/24 dev tun0 scope link
192.168.1.0/24 dev wlan0 scope link src 192.168.1.42

$ netstat -rn         # macOS and BSD`}
<p>Even a laptop has a forwarding table. Most laptops have only a few entries: the local network, perhaps a VPN, and a default route to the home router.</p>

<h2>What makes routing state valid</h2>
<p>Take all the routers' tables together and consider one destination at a time. The combined <strong>routing state</strong> for that destination is <strong>valid</strong> if and only if a packet sent from anywhere toward it actually reaches it. Two things can go wrong:</p>
<ul>
<li><strong>A loop:</strong> following next hops leads back to a router already visited, so packets circle forever (or until their TTL expires).</li>
<li><strong>A dead end:</strong> some router has no entry for the destination, or its next hop is unreachable, so packets are dropped.</li>
</ul>
${fig('badstate', '<b>Figure 5.2</b> The two ways routing state can fail: a loop and a dead end.')}
<p>If there are no loops and no dead ends, every packet must reach the destination, because each hop moves it to a router it has not visited, and there are only finitely many routers. That gives a simple way to check validity: for one destination, draw an arrow from each router to its next hop. The state is valid exactly when the arrows form a <strong>directed tree</strong> pointing at the destination, sometimes called a <strong>sink tree</strong>.</p>
${fig('desttree', '<b>Figure 5.3</b> Valid routing state toward E. Every router\'s next-hop arrow leads, without loops, to E.')}
<p>A network has one such tree per destination. Routing protocols are, in effect, distributed algorithms for building these trees and rebuilding them quickly when links fail.</p>
${code('Checking validity of routing state for one destination')`
import java.util.*;

public class RoutingCheck {
  /** nextHop.get(r) is r's next hop toward dst, or null if r has no route. */
  static List<String> problems(Map<String, String> nextHop, Set<String> routers, String dst) {
    List<String> out = new ArrayList<>();
    for (String start : routers) {
      Set<String> seen = new HashSet<>();
      String r = start;
      while (!r.equals(dst)) {
        if (!seen.add(r)) { out.add("loop from " + start + " through " + r); break; }
        String nh = nextHop.get(r);
        if (nh == null) { out.add("dead end at " + r + " (from " + start + ")"); break; }
        r = nh;
      }
    }
    return out;
  }
}`}

<h2>Least-cost routes</h2>
<p>Many trees are valid. Which one should the network use? Inside a single organization the usual answer is the tree of <strong>least-cost paths</strong>. Each link is given a <strong>cost</strong> (also called a metric or weight), and each router should forward along the path whose total cost to the destination is smallest. Costs can be set to:</p>
<ul>
<li>1 per link, so the cheapest path is the one with the fewest hops;</li>
<li>a value inversely proportional to bandwidth, so faster links are preferred (OSPF's default reference cost);</li>
<li>propagation delay, so the lowest-latency path is preferred;</li>
<li>values tuned by operators to balance load across links ("traffic engineering").</li>
</ul>
<p>Least-cost paths have a property that makes distributed computation possible: any part of a shortest path is itself a shortest path. If the best route from A to E goes through D, then its tail from D to E is D's best route to E. So each router only needs to choose the best <em>neighbour</em>, trusting that neighbour to do the same. The resulting next hops automatically form a tree, with no loops, as long as every router has consistent information.</p>

<h2>How routing information is obtained</h2>
<div class="tbl"><table><tr><th>Approach</th><th>How tables are filled</th><th>Used where</th></tr>
<tr><td>Static routing</td><td>an operator configures each entry by hand</td><td>small networks, default routes, stub sites</td></tr>
<tr><td>Distance-vector</td><td>neighbours exchange their current distances to every destination</td><td>RIP, and the idea behind BGP (Chapter 6)</td></tr>
<tr><td>Link-state</td><td>every router learns the whole topology and computes shortest paths itself</td><td>OSPF and IS-IS inside ISPs and enterprises (Chapter 7)</td></tr>
<tr><td>Path-vector</td><td>neighbours exchange full paths, filtered by policy</td><td>BGP between networks (Chapters 9 and 10)</td></tr>
<tr><td>Centralized</td><td>a controller computes paths and installs them</td><td>software-defined networks (Chapter 20)</td></tr>
</table></div>
<p>Static routes never adapt: if a link fails, someone must notice and edit the tables. Dynamic routing protocols detect failures (usually by missing periodic "hello" messages from a neighbour) and recompute. During the seconds while routers update one after another, the network can briefly contain loops or dead ends. How quickly a protocol returns to valid state, called <strong>convergence</strong>, is one of the main ways to compare protocols.</p>

<h2>Two levels of routing</h2>
<p>The Internet has two very different routing problems.</p>
<ul>
<li><strong>Intradomain routing</strong> happens inside one autonomous system, such as an ISP or a company network. One organization controls every router, so the goal is efficiency: find least-cost paths and recover quickly from failures. These protocols are called interior gateway protocols (IGPs).</li>
<li><strong>Interdomain routing</strong> happens between autonomous systems. Each network has its own business relationships and policies, wants to keep its internal structure private, and will not let others decide how its traffic flows. The goal is not the shortest path but a path each network is willing to use. The Internet uses one protocol for this, BGP.</li>
</ul>
<p>Hierarchy also makes the problem tractable. Inside an AS, routers need to know only that AS's own prefixes plus a way out. Between ASes, BGP carries roughly a million IPv4 prefixes, not billions of hosts.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Confusing forwarding with routing.</strong> Forwarding is per packet and local; routing builds the tables.</li>
<li><strong>Checking a single path for correctness.</strong> Validity is a property of all routers' tables for a destination.</li>
<li><strong>Assuming routing state is always valid.</strong> During convergence, transient loops and dead ends are normal; TTL limits the damage of loops.</li>
<li><strong>Assuming the shortest path is used between networks.</strong> Interdomain routing follows policy.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Draw the sink tree</summary><p>For a small topology with hop-count costs, draw each router's next hop toward one destination and check it is a tree.</p></details>
<details><summary>Read your table</summary><p>Run <code>ip route</code> or <code>netstat -rn</code>. Which entry handles a packet to 8.8.8.8?</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Find the bug</summary><p>Given forwarding tables for five routers, use the Java checker to find every loop and dead end, then fix the tables.</p></details>
<details><summary>Costs change paths</summary><p>Show a topology where hop-count routing and bandwidth-based routing pick different paths.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Transient loops</summary><p>A link fails and routers update one at a time in a given order. Simulate the intermediate states and show when a loop exists.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain the difference between forwarding and routing, and between the data plane and the control plane.</li>
<li>I can explain destination-based forwarding, prefixes and default routes.</li>
<li>I can define valid routing state and recognize loops and dead ends.</li>
<li>I can explain why least-cost next hops form a tree toward each destination.</li>
<li>I can distinguish static, distance-vector, link-state, path-vector and centralized routing.</li>
<li>I can explain why intradomain and interdomain routing have different goals.</li>
</ul>
`});
