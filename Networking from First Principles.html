CH.push({
  id: 'ch18', n: 18, title: 'Getting Connected: ARP, DHCP, NAT and TLS',
  lede: 'Before a laptop can load a page it must get an address, find its router, translate between IP and MAC addresses, often share one public address with everyone else at home, and finally set up an encrypted, authenticated channel. This chapter covers the four protocols that make that work and ties the whole book together with a complete walkthrough.',
  html: `
<h2>DHCP: getting an address</h2>
<p>A freshly connected device knows nothing: not its IP address, not its subnet, not its router, not its DNS server. Configuring all that by hand on every device would be unworkable, so networks use the <strong>Dynamic Host Configuration Protocol</strong> (DHCP, RFC 2131).</p>
${fig('dhcp', '<b>Figure 18.1</b> The four DHCP messages, often remembered as DORA: discover, offer, request, acknowledge.')}
<p>Addresses are <strong>leased</strong> for a limited time, and clients renew halfway through. A device that leaves simply stops renewing, and its address returns to the pool: soft state once more. Because DHCP starts with broadcasts, the server must be on the same LAN, or a router must relay the messages to a central server (a <strong>DHCP relay</strong>). In IPv6, hosts usually configure themselves from router advertisements (SLAAC), with DHCPv6 as an option.</p>
<p>DHCP is not authenticated. A rogue DHCP server on a LAN can hand out its own address as the default router and DNS server and intercept everything, which is why managed switches offer "DHCP snooping" to allow server responses only from trusted ports.</p>

<h2>ARP: from IP address to MAC address</h2>
<p>IP decides the next hop; Ethernet delivers frames to MAC addresses. Something must translate between them. For IPv4, that is the <strong>Address Resolution Protocol</strong> (ARP, RFC 826).</p>
${fig('arp', '<b>Figure 18.2</b> ARP finds the MAC address of the next hop on the local network.')}
<p>The key idea is which address to resolve. If the destination is on the same subnet (the host checks with its subnet mask), it ARPs for the destination itself. Otherwise it ARPs for its <strong>default router</strong>, and sends the packet in a frame addressed to the router's MAC while the IP header still carries the remote destination. At each hop, the IP addresses stay the same and the MAC addresses change. Results are cached in an <strong>ARP table</strong> for a few minutes (<code>ip neigh</code> shows it).</p>
<p>IPv6 does the same job with <strong>Neighbor Discovery</strong>, using ICMPv6 messages sent to multicast addresses instead of broadcasts.</p>
<p>Like DHCP, ARP trusts whatever it hears. In <strong>ARP spoofing</strong>, an attacker on the LAN sends unsolicited replies claiming the router's IP address, so other hosts send their traffic through the attacker. Defenses include dynamic ARP inspection on switches and, more fundamentally, encrypting traffic end to end so that interception reveals nothing.</p>

<h2>NAT: sharing one public address</h2>
<p>A home typically receives one public IPv4 address from its ISP but has dozens of devices. <strong>Network address translation</strong> lets them share it. Inside, devices use private addresses (192.168.x.x, 10.x.x.x). The NAT router rewrites each outgoing packet's source address and port to its own public address and a port it chooses, and records the mapping. When replies arrive, it reverses the translation.</p>
${fig('nat', '<b>Figure 18.3</b> A NAT translation table. Ports distinguish the connections of different inside hosts.')}
<p>Strictly, this is NAPT (network address and port translation), sometimes called PAT or IP masquerading. With 16-bit ports, one public address can support tens of thousands of simultaneous connections. ISPs short of IPv4 addresses also run <strong>carrier-grade NAT</strong>, putting thousands of customers behind a pool of shared addresses, which is why the 100.64.0.0/10 range exists.</p>
<h3>Consequences</h3>
<ul>
<li><strong>Inbound connections fail by default.</strong> A packet from outside with no matching mapping has nowhere to go. This incidentally acts as a crude firewall, but it is not a security mechanism.</li>
<li><strong>The end-to-end principle is broken.</strong> Hosts no longer have globally reachable addresses, which complicates peer-to-peer applications, games and calls. They use <strong>NAT traversal</strong>: a public server tells each peer the other's public address and port (STUN), both send packets to each other to open mappings ("hole punching"), and if that fails, traffic is relayed through a server (TURN). WebRTC bundles these as ICE.</li>
<li><strong>Mappings time out.</strong> A NAT forgets an idle UDP mapping after a minute or so, and an idle TCP mapping after minutes to hours, so long-lived connections send keepalives.</li>
<li><strong>Protocols that carry addresses in their payload</strong>, such as FTP and SIP, need application-aware helpers in the NAT.</li>
</ul>
<p>IPv6 has enough addresses that NAT is unnecessary; a stateful firewall provides the inbound protection that NAT gave by accident.</p>

<h2>TLS: securing the connection</h2>
<p>Everything so far travels in the clear. Anyone on the path, such as a café Wi-Fi operator, an ISP, or an attacker who has spoofed ARP or DNS, can read or modify it. <strong>Transport Layer Security</strong> (TLS) runs over TCP (or inside QUIC) and gives an application three guarantees:</p>
<ul>
<li><strong>Confidentiality:</strong> only the two endpoints can read the data.</li>
<li><strong>Integrity:</strong> any modification is detected.</li>
<li><strong>Authentication:</strong> the client is talking to the real server for the name it asked for, not an impostor. (The client can optionally be authenticated too, as in mutual TLS between services.)</li>
</ul>
<h3>The cryptographic building blocks</h3>
<div class="tbl"><table><tr><th>Tool</th><th>What it does</th><th>Used in TLS for</th><th>Examples</th></tr>
<tr><td>Symmetric encryption with authentication (AEAD)</td><td>both sides share one key; fast</td><td>encrypting all application data</td><td>AES-GCM, ChaCha20-Poly1305</td></tr>
<tr><td>Key exchange</td><td>two parties agree on a secret over a public channel</td><td>deriving the session keys</td><td>ECDHE with X25519; hybrids with ML-KEM for post-quantum security</td></tr>
<tr><td>Digital signatures</td><td>prove possession of a private key</td><td>the server proving its identity</td><td>ECDSA, RSA-PSS, Ed25519</td></tr>
<tr><td>Certificates</td><td>a trusted party vouches that a public key belongs to a name</td><td>linking the server's key to its domain</td><td>X.509 certificates from CAs</td></tr>
<tr><td>Hash functions and key derivation</td><td>fingerprints and turning secrets into keys</td><td>the handshake transcript and key schedule</td><td>SHA-256, HKDF</td></tr>
</table></div>
<h3>The TLS 1.3 handshake</h3>
${fig('tls', '<b>Figure 18.4</b> A TLS 1.3 handshake. Keys are agreed in the first round trip, and the client can send its request with its Finished message.')}
<p>TLS 1.3 (RFC 8446, 2018) made two big improvements over 1.2. It cut the full handshake to one round trip by having the client send its key share immediately. And it removed every key exchange that lacks <strong>forward secrecy</strong>: session keys come from ephemeral Diffie-Hellman values that are discarded afterwards, so even someone who later steals the server's private key cannot decrypt recorded past traffic. Resumed sessions can send data with zero round trips (0-RTT), with the replay caveat from Chapter 16.</p>
<h3>Certificates and trust</h3>
<p>Key exchange alone would let you set up an encrypted channel with an impostor. Authentication comes from <strong>certificates</strong>. A certificate binds a domain name to a public key and is signed by a <strong>certificate authority</strong> (CA). Your operating system and browser ship with a list of about 150 trusted root CAs.</p>
${fig('chain', '<b>Figure 18.5</b> A chain of trust: the root signs the intermediate, which signs the site\'s certificate.')}
<p>To validate a server, the client checks that the certificate's name matches the host it wanted, that it is within its validity dates and not revoked, and that each certificate in the chain is signed by the next, ending at a trusted root. Then it checks the server's signature over the handshake, which proves the server holds the matching private key. Since 2015, <strong>Let's Encrypt</strong> issues free, automated certificates and has made HTTPS the norm; certificate lifetimes are shrinking toward 47 days by 2029, which pushes everyone toward automation. All issued certificates are logged publicly in <strong>Certificate Transparency</strong> logs, so a misissued certificate for your domain can be detected.</p>
${code('TLS from Java')`
import javax.net.ssl.*;
import java.io.*;

public class TlsClient {
  public static void main(String[] args) throws Exception {
    SSLSocketFactory f = (SSLSocketFactory) SSLSocketFactory.getDefault();   // JDK trust store, hostname checks via HTTPS endpoint identification
    try (SSLSocket s = (SSLSocket) f.createSocket("www.example.com", 443)) {
      SSLParameters p = s.getSSLParameters();
      p.setEndpointIdentificationAlgorithm("HTTPS");     // verify the certificate matches the host name
      p.setProtocols(new String[]{"TLSv1.3"});
      s.setSSLParameters(p);
      s.startHandshake();
      System.out.println(s.getSession().getProtocol() + " " + s.getSession().getCipherSuite());
      System.out.println(((java.security.cert.X509Certificate) s.getSession().getPeerCertificates()[0]).getSubjectX500Principal());
    }
  }
}`}
<p>TLS protects data in transit between two endpoints. It does not protect data on the server, does not hide which server you connect to (the SNI is visible unless Encrypted Client Hello is used), and does not help if the endpoint itself is compromised. Inside datacenters, <strong>mutual TLS</strong> between services, often handled by a service mesh, authenticates both sides of every call, a core part of "zero trust" architectures and of compliance regimes that require encryption of sensitive data in transit.</p>

<h2>Putting it all together</h2>
<p>Here is everything that happens when you open a laptop in a café and load <code>https://www.example.com</code>, drawing on every part of this book:</p>
<ol>
<li><strong>Link:</strong> the laptop associates with the Wi-Fi access point (Chapter 22).</li>
<li><strong>DHCP:</strong> it broadcasts DISCOVER and gets an address, a /24 mask, a default router and a DNS resolver.</li>
<li><strong>ARP:</strong> to reach the resolver, which is off-subnet, it ARPs for the router's MAC address.</li>
<li><strong>DNS:</strong> it sends a UDP query to the resolver, which resolves the name iteratively (Chapter 15) and returns the address of a nearby CDN edge (Chapter 16).</li>
<li><strong>NAT:</strong> the café router rewrites the source address and port of every outgoing packet.</li>
<li><strong>Routing:</strong> each router forwards the packets by longest prefix match (Chapters 5 to 8), across ISPs whose paths were chosen by BGP policy (Chapters 9 and 10).</li>
<li><strong>TCP:</strong> a three-way handshake sets up the connection (Chapter 12).</li>
<li><strong>TLS:</strong> the client and server agree on keys and the server proves its identity.</li>
<li><strong>HTTP:</strong> the browser sends GET; the edge answers from cache or fetches from the origin (Chapter 16).</li>
<li><strong>Congestion control</strong> paces the response so it neither wastes the path nor floods it (Chapters 13 and 14), while each Ethernet and Wi-Fi hop along the way frames, checks and delivers it one link at a time (Chapter 17).</li>
</ol>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Treating NAT as a firewall.</strong> Use an actual stateful firewall.</li>
<li><strong>Disabling certificate validation</strong> to "make TLS work" in testing, and shipping it. Install the test CA instead.</li>
<li><strong>Forgetting hostname verification</strong> with raw TLS sockets: set the endpoint identification algorithm.</li>
<li><strong>Trusting the LAN.</strong> ARP and DHCP can be spoofed by any device on it; encrypt end to end.</li>
<li><strong>Manual certificate renewal.</strong> Lifetimes are shrinking; automate with ACME.</li>
</ul></div>

CH.push({
  id: 'ch19', n: 19, title: 'Datacenter Networks',
  lede: 'A datacenter connects tens or hundreds of thousands of servers in one building, run by one organization, with traffic patterns unlike anything on the public Internet. That combination makes designs possible that the Internet could never adopt. This chapter covers why datacenter networks are built as Clos fabrics, how they route across many equal paths, and what problems that creates.',
  html: `
<h2>What is different about a datacenter</h2>
<ul>
<li><strong>One owner.</strong> The operator controls every switch, every server and often the operating system and application code. It can deploy custom protocols, change all hosts at once and ignore interoperability with the outside world.</li>
<li><strong>Scale and regularity.</strong> Tens of thousands of identical switches in a regular pattern, rather than an ad hoc mesh grown over decades.</li>
<li><strong>Tiny RTTs.</strong> A round trip inside a datacenter takes 5 to 100 microseconds, a thousand times shorter than across a country. Microseconds of queueing matter.</li>
<li><strong>East-west traffic.</strong> Most traffic flows <em>between</em> servers rather than in and out of the building ("north-south"). Serving one web request can involve hundreds of internal calls to caches, databases and microservices; batch analytics and machine-learning training shuffle enormous data sets between machines.</li>
<li><strong>Demanding applications.</strong> Many requests fan out to many servers and wait for all of them, so the slowest response, the <strong>tail latency</strong> at the 99th or 99.9th percentile, decides the user's experience.</li>
</ul>

<h2>From trees to Clos networks</h2>
<p>Early datacenter networks were trees: servers connected to an <strong>access</strong> (top-of-rack) switch, access switches to <strong>aggregation</strong> switches, and those to a few large, expensive <strong>core</strong> switches.</p>
${fig('tiers', '<b>Figure 19.1</b> The traditional three-tier design. Capacity shrinks toward the top.')}
<p>Trees have a fundamental problem for east-west traffic. A rack of 40 servers with 10 Gbit/s each can generate 400 Gbit/s, but its uplinks might total 40 Gbit/s: a 10:1 <strong>oversubscription</strong>. Higher up the tree it gets worse. Servers in different racks could communicate at only a fraction of their link speed, so applications had to be placed carefully, and the big core switches were single points of failure.</p>
<h3>Bisection bandwidth</h3>
<p>The standard measure of a datacenter network is its <strong>bisection bandwidth</strong>: cut the servers into two equal halves in the worst possible way and measure the total capacity between the halves. A network with <strong>full bisection bandwidth</strong> lets any half of the servers talk to the other half at full line rate, so servers can be placed anywhere.</p>
<h3>Leaf-spine and fat trees</h3>
<p>The solution, used by every large operator, is a <strong>Clos network</strong>, an idea from Charles Clos's 1953 design for telephone exchanges. Instead of a few huge switches, use many small, identical, cheap ones arranged in stages, with many paths between any two points. The common two-tier form is the <strong>leaf-spine</strong> fabric:</p>
${fig('clos', '<b>Figure 19.2</b> A leaf-spine fabric. Every leaf connects to every spine, so any two leaves are exactly two hops apart, over as many paths as there are spines.')}
<ul>
<li>Every server connects to a <strong>leaf</strong> (top-of-rack) switch.</li>
<li>Every leaf connects to every <strong>spine</strong> switch.</li>
<li>Any two servers in different racks are three switch hops apart, over as many equal paths as there are spines.</li>
<li>To add capacity, add spines; to add racks, add leaves. If a spine fails, the network loses 1/n of its capacity, not connectivity.</li>
</ul>
<p>A <strong>fat tree</strong> (described for datacenters by Al-Fares, Loukissas and Vahdat in 2008) is a three-tier Clos built from k-port switches arranged in pods. It supports k³/4 servers with full bisection bandwidth: 48-port switches give 27,648 servers, and 64-port switches 65,536. Large operators build fabrics of this style with hundreds of thousands of server ports. Google's Jupiter fabric, for example, reached over a petabit per second of bisection bandwidth in 2015 and has since moved to optical circuit switches in place of the spine layer.</p>

<h2>Routing across many paths</h2>
<p>A Clos fabric only helps if traffic actually uses all of its paths. Spanning tree (Chapter 17) would block all but one, so datacenter fabrics use <strong>layer-3 routing all the way down to the rack</strong>: each leaf is a router, each rack is its own IP subnet, and routing protocols compute paths.</p>
<h3>ECMP</h3>
<p>With equal-cost multipath, a leaf that has four equal paths to a destination spreads traffic across all four. To avoid reordering packets within a TCP flow, it picks the path by <strong>hashing the 5-tuple</strong>, so all packets of a flow follow the same path while different flows spread out.</p>
${fig('ecmp', '<b>Figure 19.3</b> ECMP hashes each flow onto one of the equal-cost paths. Collisions can leave one path overloaded and another idle.')}
${code('Choosing an ECMP path')`
import java.util.zip.CRC32;

public class Ecmp {
  /** Same 5-tuple always gives the same path; different flows spread out. */
  static int pickPath(String srcIp, int srcPort, String dstIp, int dstPort, int proto, int paths, int seed) {
    CRC32 crc = new CRC32();
    crc.update((seed + "|" + srcIp + "|" + srcPort + "|" + dstIp + "|" + dstPort + "|" + proto).getBytes());
    return (int) (crc.getValue() % paths);      // per-switch seed avoids every switch making the same choice
  }
}`}
<p>Flow hashing works well when there are many small flows, and badly when a few large ones (<strong>elephant flows</strong>, such as a backup or a model checkpoint) collide on the same path. Improvements include:</p>
<ul>
<li><strong>Flowlet switching:</strong> a pause within a flow longer than the path delay difference lets the flow move to a new path without reordering.</li>
<li><strong>Congestion-aware load balancing</strong> (CONGA, HULA): switches track path utilization and steer flowlets away from congested paths.</li>
<li><strong>Packet spraying</strong>: send packets of one flow over all paths and let the receiver tolerate reordering, used by some RDMA and AI-cluster fabrics.</li>
</ul>
<h3>BGP in the datacenter</h3>
<p>Surprisingly, many large datacenters run <strong>BGP</strong> as their only routing protocol (RFC 7938). Each leaf, or each tier, gets its own private AS number, and switches peer with eBGP over every link. BGP scales well, is widely implemented, needs no flooding of link state, and gives operators precise policy controls such as draining a switch for maintenance by changing what it announces. The rest of the fabric routes around it in seconds.</p>

<h2>Datacenter transport</h2>
<p>The fabric's short RTTs and shallow switch buffers break assumptions that work on the Internet.</p>
<h3>Incast</h3>
<p>A query service asks 100 workers for partial results at the same moment. They all respond within microseconds, and their packets converge on the single switch port toward the aggregator. The port's buffer overflows, several responses lose packets, and with TCP's minimum retransmission timeout of 200 ms (Chapter 12) the whole request is delayed by a factor of a thousand.</p>
${fig('incast', '<b>Figure 19.4</b> Incast: many synchronized responses overwhelm one switch port.')}
<p>Fixes include microsecond-scale RTO values, adding small random delays to responses, limiting fan-out, and above all keeping switch queues short so bursts fit.</p>
<h3>DCTCP and successors</h3>
<p><strong>DCTCP</strong> (2010) has switches mark packets with ECN as soon as a queue exceeds a small threshold. Senders measure the <em>fraction</em> of marked packets over each RTT, α, and reduce their window by α/2, gently for slight congestion and sharply for heavy congestion. Queues stay small, leaving headroom for bursts, while links stay fully utilized. Later designs go further: Google's <strong>Swift</strong> controls delay measured precisely by NIC timestamps, and <strong>HPCC</strong> uses telemetry inserted into packets by switches to know exactly how loaded each link is.</p>
<h3>Tail latency</h3>
<p>If a request fans out to 100 servers and each is slow 1% of the time, then 63% of requests hit at least one slow server. Datacenter systems therefore attack the tail: they send backup ("hedged") requests after a short wait, prioritize short flows in switches, and isolate latency-sensitive traffic from bulk transfers with separate queues.</p>

<h2>Connecting datacenters</h2>
<p>Large operators link their datacenters with private wide-area networks. These carry huge, mostly schedulable flows such as replication, so operators use centralized traffic engineering to push links close to full: Google's B4 and Microsoft's SWAN run their WAN links at near 100% utilization by assigning bandwidth to applications by priority, something the public Internet's decentralized routing cannot do. This is an early example of software-defined networking, the subject of Chapter 20.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Using Internet defaults inside a datacenter.</strong> A 200 ms minimum RTO is a thousand RTTs.</li>
<li><strong>Ignoring oversubscription</strong> when placing data-intensive jobs across racks.</li>
<li><strong>Assuming ECMP balances load evenly.</strong> It balances flows, not bytes; elephants collide.</li>
<li><strong>Synchronized fan-out</strong> without limits or jitter, which invites incast.</li>
</ul></div>

<div class="practice">
<div class="lvl e"><h4>Easy</h4>

CH.push({
  id: 'ch20', n: 20, title: 'Software-Defined Networking and Host Networking',
  lede: 'Inside one organization\'s network, there is no need for every switch to run its own distributed routing protocol. Software-defined networking moves the control plane into a logically central program that programs simple switches. Meanwhile, at 100 Gbit/s and beyond, the server\'s own network stack becomes the bottleneck. This chapter covers both ends: SDN, programmable data planes and network virtualization, and the techniques that let hosts keep up with the wire.',
  html: `
<h2>Why separate the control plane</h2>
<p>A traditional router or switch bundles three things into one box from one vendor: the data plane (forwarding hardware), the control plane (routing protocols) and the management interface. To change how the network behaves, operators configure many boxes, one at a time, in each vendor's language, and rely on distributed protocols to produce the intended global behaviour. New features arrive only when vendors ship them.</p>
<p><strong>Software-defined networking</strong> (SDN) separates these concerns:</p>
<ul>
<li>Switches keep only the data plane: tables of simple rules matching packet headers to actions.</li>
<li>A logically centralized <strong>controller</strong> (in practice a replicated cluster) builds a global view of the topology and traffic and computes what every switch should do.</li>
<li>Network functions such as routing, access control and load balancing become <strong>applications</strong> on the controller.</li>
</ul>
${fig('sdn', '<b>Figure 20.1</b> In SDN, applications express policy, the controller computes rules, and switches only match and forward.')}
<p>The advantages are a global view (computing paths with knowledge of all links and all demands, instead of each router seeing only its neighbours), programmability (new behaviour is software, deployable in days), and simpler, cheaper switches. The trade-offs are that the controller becomes a critical dependency, so it must be replicated and switches must keep forwarding when it is unreachable, and that pushing rule updates across many switches consistently is a hard distributed systems problem.</p>

<h2>Match-action tables and OpenFlow</h2>
<p>The abstraction that made SDN practical is the <strong>match-action table</strong>. Each rule has a priority, a pattern over header fields (MAC addresses, VLAN, IP addresses and prefixes, ports, protocol) and a list of actions: forward to a port, drop, modify a header, push a tunnel header, send to the controller, or count. A packet is handled by the highest-priority rule that matches.</p>
${fig('flowtable', '<b>Figure 20.2</b> A flow table with prioritized rules. One table expresses routing, firewalling and quality of service together.')}
<p><strong>OpenFlow</strong> (2008, from Stanford and Berkeley) standardized this table and a protocol for the controller to install rules, read counters and receive packets that missed every rule. Notice how a single abstraction generalizes earlier devices: a router is a table matching destination prefixes; a firewall matches 5-tuples with drop actions; a NAT rewrites addresses; a load balancer rewrites destinations.</p>
<h3>Programmable data planes</h3>
<p>OpenFlow fixed the set of header fields a switch could match. <strong>P4</strong> (2014) goes further: a P4 program defines the headers to parse, the tables and their match types, and the actions, and it is compiled onto programmable switch chips such as Intel's Tofino, onto NICs, or onto software switches. Operators have used it for custom telemetry (stamping queue lengths into packets as they cross each switch), fast load balancers and in-network caching.</p>

<h2>SDN in practice</h2>
<p>Pure OpenFlow networks with a single controller deciding every flow turned out to be uncommon. SDN's ideas spread in other forms:</p>
<ul>
<li><strong>WAN traffic engineering:</strong> Google's B4 and Microsoft's SWAN use central controllers to allocate inter-datacenter bandwidth (Chapter 19).</li>
<li><strong>Datacenter fabrics</strong> run BGP or similar protocols in switches, with central software generating configurations and managing intent.</li>
<li><strong>Network virtualization</strong> in clouds, below, is the most widespread application.</li>
<li><strong>SD-WAN</strong> products manage branch-office connections centrally, choosing between internet, MPLS and cellular links per application from a cloud controller.</li>
</ul>

<h2>Network virtualization</h2>
<p>A public cloud must give each customer a private network that looks like their own (their own address ranges, subnets, routes and firewall rules) while thousands of customers share the same physical fabric and often the same servers. The solution is an <strong>overlay</strong>: virtual networks built from tunnels over a physical <strong>underlay</strong>.</p>
<p>Each server runs a software switch in its hypervisor (Open vSwitch or a cloud's custom equivalent), acting as a <strong>tunnel endpoint</strong>. When VM 1 sends a frame to VM 7 in the same virtual network, the hypervisor switch looks up which physical host VM 7 is on and wraps the frame in an outer header addressed to that host. The underlay routes it like any other IP packet; the receiving hypervisor unwraps it and delivers it.</p>
${fig('overlay', '<b>Figure 20.3</b> VXLAN encapsulation. The tenant\'s frame travels untouched inside a UDP packet between hypervisors.')}
<p><strong>VXLAN</strong> (RFC 7348) uses UDP port 4789 and a 24-bit virtual network identifier, allowing 16 million separate networks compared with VLANs' 4,094. Geneve is a more extensible successor. The mapping from virtual addresses to physical hosts is distributed by a controller: the SDN pattern applied at the edge of the network. A cloud's "VPC", security groups and virtual routers are all rules in these software switches, and increasingly in offload hardware on the NIC.</p>

<h2>Host networking</h2>
<p>At 100 Gbit/s, a server receives up to 8 million full-size packets per second, or 150 million minimum-size ones: one every 7 nanoseconds. A traditional kernel network stack spends several microseconds per packet on interrupts, memory allocation, protocol processing, context switches and copying data between kernel and user space. Without help, the host cannot keep up with its own network card.</p>
<h3>How a NIC talks to the host</h3>
<p>A modern NIC uses <strong>DMA</strong> to write received packets directly into memory, into <strong>ring buffers</strong> of descriptors shared with the driver. It notifies the CPU with an interrupt, but under load the driver switches to polling (Linux NAPI) to avoid an interrupt per packet. <strong>Receive-side scaling</strong> (RSS) hashes each packet's 5-tuple to one of many receive queues, each served by a different CPU core, so processing spreads across cores while each flow stays on one, much like ECMP within a single machine.</p>
<h3>Offloads</h3>
<div class="tbl"><table><tr><th>Offload</th><th>What the NIC does</th></tr>
<tr><td>Checksum offload</td><td>computes and verifies IP, TCP and UDP checksums</td></tr>
<tr><td>TSO / GSO (segmentation offload)</td><td>the kernel hands the NIC a 64 KB chunk; the NIC cuts it into MSS-sized segments with correct headers</td></tr>
<tr><td>LRO / GRO (receive offload)</td><td>merges consecutive segments of a flow into one large buffer before the stack processes it</td></tr>
<tr><td>Crypto offload</td><td>encrypts and decrypts TLS or IPsec on the card</td></tr>
<tr><td>Tunnel and virtual switch offload</td><td>handles VXLAN encapsulation and match-action rules in NIC hardware</td></tr>
</table></div>
<p>Segmentation offloads matter most: processing one 64 KB unit instead of 45 small packets cuts per-packet overhead roughly 45-fold.</p>
<h3>Bypassing the kernel</h3>
<p>For the most demanding applications, even an optimized kernel is too slow.</p>
<ul>
<li><strong>DPDK</strong> gives an application direct, polling access to the NIC's queues from user space. No interrupts, no system calls, no copies; one core can forward tens of millions of packets per second. It powers software routers, load balancers and telecom network functions. The cost is dedicated cores spinning at 100% and the need to bring your own protocol stack.</li>
<li><strong>AF_XDP and eBPF/XDP</strong> are Linux's middle ground: small verified programs run in the driver to drop, redirect or rewrite packets before the full stack sees them, widely used for DDoS filtering and load balancing.</li>
<li><strong>io_uring</strong> lets applications submit batches of socket operations through shared rings, cutting system call overhead while keeping the kernel's TCP stack.</li>
</ul>
<h3>RDMA</h3>
<p><strong>Remote direct memory access</strong> lets one machine read or write another machine's memory directly. The application registers a memory region, then posts a request ("write these 1 MB to that address on host B"); the NICs on both ends move the data, with no CPU involvement on the remote side and no copies. Latency is a few microseconds and CPU cost almost zero. RDMA originally came from InfiniBand; <strong>RoCEv2</strong> runs it over Ethernet and UDP, which requires a network with very little loss, traditionally achieved with priority flow control (PFC, pausing upstream links) and congestion control such as DCQCN. RDMA is central to storage systems and to the GPU clusters of Chapter 21.</p>
${fig('hostpath', '<b>Figure 20.4</b> Three ways for data to get from the wire to an application.')}
<h3>SmartNICs and DPUs</h3>
<p>The logical end point is a NIC with its own processors (a <strong>SmartNIC</strong> or <strong>DPU</strong>, such as AWS Nitro cards or NVIDIA BlueField) that runs the cloud's virtual switch, storage protocols, encryption and security enforcement. The host's CPUs are then left entirely to customer workloads, and the infrastructure is isolated from them, which is also a security boundary.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>A controller as a single point of failure.</strong> Replicate it, and design switches to keep forwarding on their existing rules if it is lost.</li>
<li><strong>Ignoring encapsulation overhead.</strong> VXLAN adds 50 bytes; raise the underlay MTU or lower the overlay MTU, or large packets fail.</li>
<li><strong>Disabling offloads while debugging and forgetting to re-enable them.</strong></li>
<li><strong>Running RoCE on a lossy network.</strong> Loss destroys RDMA performance; it needs a carefully engineered fabric.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Flow table</summary><p>Write a prioritized match-action table for a small office: block inbound SSH, send web traffic to queue 1, route 10.0.0.0/8 internally and everything else to the internet uplink.</p></details>
<details><summary>Offloads on your machine</summary><p>On Linux run <code>ethtool -k eth0</code> and list which offloads are enabled.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Implement a flow table</summary><p>In Java, model rules with priority, prefix and port matches and actions, and look up packets by highest priority. How would you make lookup faster than a linear scan?</p></details>
<details><summary>MTU math</summary><p>The underlay MTU is 1,500 bytes. What is the largest inner IP packet a VXLAN overlay can carry without fragmentation? 1,450 bytes.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Mininet</summary><p>Build a four-switch topology in Mininet with an SDN controller (such as Ryu), and write an application that installs shortest-path rules and reroutes when a link fails.</p></details>
<details><summary>Packets per second</summary><p>Write a Java UDP sender and receiver, measure packets per second with 64-byte and 1,400-byte payloads, and explain the difference.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why SDN separates the control plane from the data plane, and its benefits and risks.</li>
<li>I can describe match-action tables, OpenFlow and programmable data planes with P4.</li>
<li>I can explain overlay networks, VXLAN and how clouds virtualize tenant networks.</li>
<li>I can explain DMA, ring buffers, interrupts versus polling and receive-side scaling.</li>
<li>I can explain checksum and segmentation offloads and why they matter.</li>
<li>I can compare the kernel stack, DPDK, XDP and RDMA.</li>
</ul>
`});

FIG.ring = host => {
  const N = 4, hold = [...Array(N)].map((_, g) => [...Array(N)].map(() => String(g))), F = [];

  snap('Four GPUs in a ring (0→1→2→3→0). Each holds a gradient split into four chunks. The digits show whose contributions each chunk contains.');

CH.push({
  id: 'ch21', n: 21, title: 'Multicast and Collective Communication',
  lede: 'Most of this book has been about one sender talking to one receiver. Many applications need to send the same data to many receivers, or to combine data from many sources. This chapter covers IP multicast, why it never became universal on the Internet, and the collective communication patterns, such as all-reduce, that now dominate traffic in machine-learning clusters.',
  html: `
<h2>One to many</h2>
<p>Live video to thousands of viewers, market data feeds to hundreds of trading systems, software updates to a fleet, and synchronizing model parameters across thousands of GPUs all have the same shape: the same bytes must reach many destinations. With unicast, the sender transmits one copy per receiver, and links near the sender carry many identical copies.</p>
${fig('mcast', '<b>Figure 21.1</b> With unicast, links near the source carry one copy per receiver. With multicast, each link carries one copy and routers duplicate packets where paths split.')}
<p><strong>Multicast</strong> sends one copy into the network and has routers duplicate it only where the paths to different receivers diverge. Each link carries the data at most once. There are three ways to do it: in the network layer (IP multicast), in an overlay of application servers, or in specialized fabrics and libraries for collective operations.</p>

<h2>IP multicast</h2>
<h3>Group addressing</h3>
<p>IP multicast (RFC 1112, 1989) lets a sender address a packet to a <strong>group</strong> rather than a host. IPv4 reserves 224.0.0.0/4 for group addresses; IPv6 uses ff00::/8. Anyone can send to a group, and receivers join it. The sender need not know who or where the receivers are.</p>
<p>On a LAN, IP multicast maps directly to Ethernet multicast addresses (01:00:5e followed by the low 23 bits of the group address), and switches deliver frames to interested ports. Many local protocols rely on it: mDNS and Bonjour for device discovery (224.0.0.251), IPv6 Neighbor Discovery, and OSPF hellos.</p>
<h3>Joining a group</h3>
<p>Hosts tell their local router which groups they want with <strong>IGMP</strong> (Internet Group Management Protocol; MLD in IPv6). The router periodically asks "who is still interested?" and stops forwarding a group to the LAN when nobody answers. Switches "snoop" on IGMP messages to learn which ports want which groups, instead of flooding multicast to every port.</p>
${code('Receiving a multicast feed in Java')`
import java.net.*;

public class McastReceiver {
  public static void main(String[] args) throws Exception {
    InetAddress group = InetAddress.getByName("239.1.2.3");             // an administratively scoped group
    NetworkInterface nif = NetworkInterface.getByName("eth0");
    try (MulticastSocket sock = new MulticastSocket(5000)) {
      sock.joinGroup(new InetSocketAddress(group, 5000), nif);           // sends an IGMP membership report
      byte[] buf = new byte[1500];
      while (true) {
        DatagramPacket p = new DatagramPacket(buf, buf.length);
        sock.receive(p);                                                 // one copy, however many receivers
        System.out.println("tick from " + p.getAddress() + ": " + new String(buf, 0, p.getLength()));
      }
    }
  }
}`}
<h3>Multicast routing</h3>
<p>Routers must build a <strong>distribution tree</strong> for each group that reaches every router with interested receivers.</p>
<ul>
<li><strong>Source trees</strong> (shortest-path trees) are rooted at each sender. Early protocols such as DVMRP and PIM dense mode flooded traffic everywhere and then <em>pruned</em> branches with no receivers. Each router accepts a packet only if it arrives on the interface the router would itself use to reach the source; this <strong>reverse path forwarding</strong> check prevents loops without any per-group state.</li>
<li><strong>Shared trees</strong>, used by PIM sparse mode, are rooted at a meeting point called the rendezvous point. Receivers' routers join toward it, senders send to it, and once traffic flows, routers can switch to the source's shortest-path tree.</li>
<li><strong>Source-specific multicast</strong> (SSM) restricts a group to one known source, which removes the rendezvous point entirely and is the model used by IPTV.</li>
</ul>
<h3>Why the Internet does not do multicast</h3>
<p>Despite decades of standards, IP multicast never became available across the public Internet. The reasons are instructive:</p>
<ul>
<li>Routers must keep state per group, which conflicts with the stateless core described in Chapter 4.</li>
<li>Anyone can send to a group, which makes access control, billing and protection from abuse hard.</li>
<li>Interdomain multicast requires cooperation and agreements between ISPs that have little commercial incentive.</li>
<li>Reliability and congestion control for one sender and many receivers with different capacities are much harder than for unicast.</li>
</ul>
<p>Multicast thrives where one organization controls the whole network: IPTV inside an ISP, financial exchanges distributing market data to colocated members (often over UDP multicast with sequence numbers and a unicast recovery channel), and enterprise LANs. On the Internet, the same job is done with <strong>application-layer multicast</strong>: CDNs (Chapter 16) build trees of servers that replicate content, and live streaming platforms fan out through layers of edge servers.</p>

<h2>Collective communication</h2>
<p>In parallel computing, groups of processes cooperate on one job and communicate in structured patterns called <strong>collectives</strong>. Training a large machine-learning model is the most important example today.</p>
<p>In <strong>data-parallel training</strong>, each of N GPUs holds a copy of the model and processes a different slice of each batch. After each step, every GPU has its own gradient, and they must all end up with the <em>sum</em> (or average) of all N gradients before updating the model. That operation is an <strong>all-reduce</strong>, and for a model with billions of parameters it moves gigabytes per step, many times per second. It often dominates training time.</p>
${fig('collectives', '<b>Figure 21.2</b> Four common collectives on four GPUs, before and after.')}
<div class="tbl"><table><tr><th>Collective</th><th>Effect</th><th>Typical use</th></tr>
<tr><td>Broadcast</td><td>one process's data goes to all</td><td>distributing initial weights</td></tr>
<tr><td>Reduce</td><td>combine everyone's data at one process</td><td>collecting metrics</td></tr>
<tr><td>All-reduce</td><td>combine everyone's data; everyone gets the result</td><td>gradient synchronization</td></tr>
<tr><td>All-gather</td><td>everyone gets everyone's pieces</td><td>sharded parameters (FSDP, ZeRO)</td></tr>
<tr><td>Reduce-scatter</td><td>combine, then each process keeps one piece of the result</td><td>first half of ring all-reduce; sharded optimizers</td></tr>
<tr><td>All-to-all</td><td>each process sends a different piece to every other</td><td>mixture-of-experts layers</td></tr>
</table></div>

<h2>Ring all-reduce</h2>
<p>The naive all-reduce sends every gradient to one parameter server, which sums them and sends the result back. That server's link becomes the bottleneck, carrying N times the data. <strong>Ring all-reduce</strong> uses every link equally. Arrange the N GPUs in a logical ring and split each gradient into N chunks. Then:</p>
<ol>
<li><strong>Reduce-scatter</strong> (N − 1 steps): in each step, every GPU sends one chunk to its right neighbour, which adds it to its own copy of that chunk. After N − 1 steps, each GPU holds one chunk containing the complete sum.</li>
<li><strong>All-gather</strong> (N − 1 steps): each GPU passes its completed chunk around the ring, so everyone ends up with every completed chunk.</li>
</ol>
${fig('ring', '<b>Figure 21.3</b> Ring all-reduce on four GPUs. In every step, every GPU sends and receives one chunk at the same time.')}
<p>Each GPU sends 2(N − 1)/N times the gradient size, under twice the data size, however many GPUs there are, and all links are busy in every step. The ring is <strong>bandwidth-optimal</strong>. Its weakness is latency: it takes 2(N − 1) sequential steps, which hurts with thousands of GPUs or small messages. <strong>Tree</strong> and <strong>hierarchical</strong> algorithms reduce the number of steps to about 2 log N; real libraries combine them, using a fast intra-server link (such as NVLink) first and the network between servers second.</p>
${code('RingAllReduce.java: a single-process simulation')`
public class RingAllReduce {
  /** data[g] is GPU g's vector; on return every data[g] holds the element-wise sum. */
  static void allReduce(double[][] data) {
    int n = data.length, len = data[0].length, chunk = (len + n - 1) / n;
    // Reduce-scatter
    for (int step = 0; step < n - 1; step++) {
      double[][] snapshot = copy(data);                       // all sends in a step happen "at once"
      for (int g = 0; g < n; g++) {
        int c = Math.floorMod(g - step, n), to = (g + 1) % n;
        for (int i = c * chunk; i < Math.min(len, (c + 1) * chunk); i++) data[to][i] += snapshot[g][i];
      }
    }
    // All-gather
    for (int step = 0; step < n - 1; step++) {
      double[][] snapshot = copy(data);
      for (int g = 0; g < n; g++) {
        int c = Math.floorMod(g + 1 - step, n), to = (g + 1) % n;
        for (int i = c * chunk; i < Math.min(len, (c + 1) * chunk); i++) data[to][i] = snapshot[g][i];
      }
    }
  }
  static double[][] copy(double[][] a) { double[][] b = new double[a.length][]; for (int i = 0; i < a.length; i++) b[i] = a[i].clone(); return b; }
}`}

<h2>Networks for AI clusters</h2>
<p>Large training jobs run on tens of thousands of GPUs and spend a large share of their time in collectives, so the network directly sets the training speed. These clusters are built differently from general datacenter networks:</p>
<ul>
<li><strong>Separate fabrics:</strong> a high-bandwidth "back-end" network connects GPUs (often 400 to 800 Gbit/s per GPU), distinct from the front-end network used for storage and management.</li>
<li><strong>RDMA</strong> (Chapter 20), over InfiniBand or RoCE on Ethernet, so data moves between GPU memories without involving CPUs. Libraries such as NCCL implement the collectives on top.</li>
<li><strong>Rail-optimized topologies</strong>: GPU k of every server connects to the same group of leaf switches ("rail k"), so the most frequent collective traffic needs only one switch hop.</li>
<li><strong>Synchronized, bursty traffic</strong>: every GPU sends at the same moment in every step, so a single slow link or congested path holds up the whole job. Load balancing that sprays packets across all paths, and congestion control that reacts in microseconds, matter far more than in ordinary datacenters. The Ultra Ethernet Consortium is standardizing Ethernet transport features for exactly this workload.</li>
<li><strong>In-network reduction</strong>: switches that sum data as it passes through (for example NVIDIA SHARP) halve the traffic of an all-reduce.</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Expecting multicast across the Internet.</strong> Use a CDN or an application-layer fan-out.</li>
<li><strong>Multicast without sequence numbers and recovery.</strong> UDP multicast loses packets; add gap detection and a retransmission channel.</li>
<li><strong>A parameter server for large gradients.</strong> Its link becomes the bottleneck; use ring or tree all-reduce.</li>
<li><strong>Ignoring stragglers.</strong> A collective is as fast as its slowest participant.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Count copies</summary><p>In Figure 21.1, how many packet transmissions does one message cost with unicast and with multicast? 9 and 6.</p></details>
<details><summary>All-reduce volume</summary><p>A model has 7 billion parameters in 16-bit precision. How much does each GPU send in a ring all-reduce across 8 GPUs? About 24.5 GB.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Run the simulation</summary><p>Test RingAllReduce with random vectors on 3 to 16 GPUs and compare against a direct sum, including vector lengths not divisible by N.</p></details>
<details><summary>Market data feed</summary><p>Design a UDP multicast receiver that detects gaps using sequence numbers and requests missing packets over TCP.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Ring versus tree</summary><p>Model all-reduce time as steps × latency + bytes ÷ bandwidth. For what message sizes and GPU counts does a tree beat a ring?</p></details>
<details><summary>Reverse path forwarding</summary><p>Simulate flood-and-prune multicast with RPF checks on a small topology, and count the packets saved compared with unicast.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain what multicast saves compared with unicast.</li>
<li>I can describe multicast group addresses, IGMP and IGMP snooping.</li>
<li>I can explain source trees, shared trees, reverse path forwarding and SSM.</li>
<li>I can explain why IP multicast is not deployed across the Internet and where it is used.</li>

<li>I can describe how networks for AI training clusters differ from ordinary datacenter networks.</li>
</ul>

CH.push({
  id: 'ch22', n: 22, title: 'Wireless and Cellular Networks',
  lede: 'Most people reach the Internet over radio: Wi-Fi at home and work, and cellular networks everywhere else. Radio links are shared, noisy, variable and asymmetric, and their users move. This chapter explains what makes wireless different, how Wi-Fi shares the air, and how cellular networks are organized to give a moving phone a stable connection.',
  html: `
<h2>What makes wireless different</h2>
<p>A wired link is a private, reliable pipe. A wireless link is none of those things.</p>
<ul>
<li><strong>Signals weaken quickly.</strong> In free space, received power falls with the square of distance; indoors, walls and bodies make it fall much faster. Higher frequencies (such as 5 and 6 GHz Wi-Fi, or millimetre-wave 5G) carry more data but travel less far and penetrate walls worse.</li>
<li><strong>The medium is shared.</strong> Everyone nearby on the same channel shares one collision domain, including neighbours' networks, Bluetooth devices and microwave ovens.</li>
<li><strong>Multipath and fading.</strong> Signals reflect off surfaces and arrive over several paths with different delays, adding and cancelling. Moving a phone a few centimetres can change the signal dramatically.</li>
<li><strong>Error rates are high and variable.</strong> The bit error rate depends on the <strong>signal-to-noise ratio</strong> (SNR), which changes from moment to moment. Radios adapt by changing the modulation and coding: dense constellations such as 1024-QAM carry 10 bits per symbol but need a strong, clean signal; robust ones such as BPSK carry 1.</li>
<li><strong>Transmitters cannot hear collisions.</strong> A radio's own transmission drowns out anything it might receive, so collision <em>detection</em>, Ethernet's approach, is impossible.</li>
<li><strong>Users move</strong>, between rooms, access points and cities, while expecting their connections to continue.</li>
</ul>
<p>Two consequences for upper layers are worth noting. First, losses on wireless links are often not congestion, which confuses loss-based TCP (Chapter 14). Second, wireless links retransmit locally and adapt their rates aggressively, which is the end-to-end argument's "performance optimization" in action (Chapter 4).</p>

<h2>Sharing the air: CSMA/CA</h2>
<p>Wi-Fi (IEEE 802.11) uses <strong>carrier sense multiple access with collision avoidance</strong>. Since collisions cannot be detected, the protocol tries to avoid them and uses acknowledgments to discover failures:</p>
<ol>
<li>Before transmitting, listen. If the channel has been idle for a short interval (DIFS), you may transmit.</li>
<li>If the channel is busy, wait until it becomes idle, then count down a <strong>random backoff</strong> chosen from a contention window, pausing the countdown whenever the channel is busy again. Transmit when it reaches zero.</li>
<li>The receiver acknowledges every successfully received unicast frame after a very short interval (SIFS).</li>
<li>If no ACK arrives, assume a collision or corruption, double the contention window (exponential backoff again) and retry, up to a limit.</li>
</ol>
<p>Random backoff spreads out stations that were all waiting for the same busy period to end, which is exactly when collisions are most likely. Wi-Fi's per-frame overhead (gaps, backoff, preambles, ACKs) is significant: a link advertised at 1 Gbit/s typically delivers a few hundred megabits per second of TCP throughput in good conditions.</p>
<h3>Hidden and exposed terminals</h3>
${fig('hidden', '<b>Figure 22.1</b> The hidden terminal problem: carrier sensing fails when two senders cannot hear each other.')}
<p>Carrier sensing assumes that if anyone is transmitting, you will hear them. That fails when two stations are both in range of the access point but not of each other. Both sense an idle channel, both transmit, and their frames collide at the AP. The related <strong>exposed terminal</strong> problem is the reverse: a station needlessly stays silent because it hears a nearby transmission that would not actually interfere with its own.</p>
<p>802.11 offers an optional reservation handshake, <strong>RTS/CTS</strong>: a sender requests the channel for a stated duration, the receiver grants it, and every station that hears the grant stays silent for that time, even if it cannot hear the sender.</p>
${fig('rtscts', '<b>Figure 22.2</b> RTS/CTS lets a hidden station learn about a transmission it cannot hear.')}
<p>RTS/CTS costs extra frames, so it is typically used only for large frames.</p>

<h2>Wi-Fi networks</h2>
<p>In <strong>infrastructure mode</strong>, stations associate with an <strong>access point</strong> (AP), which bridges the wireless network to the wired one. The AP and its stations form a <strong>basic service set</strong>, identified by the AP's MAC address; several APs with the same network name (SSID) form an extended service set across a building. A station joins by scanning for beacons, choosing an AP, authenticating and associating, and then running DHCP (Chapter 18). Moving between APs of the same network is a layer-2 <strong>roam</strong>: the IP address stays the same.</p>
<div class="tbl"><table><tr><th>Generation</th><th>Standard</th><th>Bands</th><th>Key techniques</th></tr>
<tr><td>Wi-Fi 4</td><td>802.11n (2009)</td><td>2.4, 5 GHz</td><td>MIMO: several antennas send parallel streams</td></tr>
<tr><td>Wi-Fi 5</td><td>802.11ac (2013)</td><td>5 GHz</td><td>wider channels, 256-QAM, downlink multi-user MIMO</td></tr>
<tr><td>Wi-Fi 6 / 6E</td><td>802.11ax (2019)</td><td>2.4, 5, 6 GHz</td><td>OFDMA: one transmission serves several users on different subcarriers; 1024-QAM</td></tr>
<tr><td>Wi-Fi 7</td><td>802.11be (2024)</td><td>2.4, 5, 6 GHz</td><td>320 MHz channels, 4096-QAM, multi-link operation across bands</td></tr>
</table></div>
<p>Modern Wi-Fi is moving from pure contention toward scheduling: with OFDMA, the AP divides a channel among several stations and tells each when and where to transmit, borrowing an idea from cellular networks. Security uses <strong>WPA3</strong>, which provides encryption per station and resists offline password guessing; enterprise networks authenticate each user with 802.1X.</p>

<h2>Cellular networks</h2>
<h3>Cells and reuse</h3>
<p>Licensed radio spectrum is scarce and expensive, so cellular networks reuse it. The coverage area is divided into <strong>cells</strong>, each served by a base station. Neighbouring cells use different frequencies (or, in modern systems, coordinate carefully on the same ones), and the same frequencies are reused in cells far enough apart not to interfere. Smaller cells mean more reuse and more total capacity, which is why dense cities have many small cells.</p>
${fig('cells', '<b>Figure 22.3</b> Frequency reuse across hexagonal cells.')}
<p>Unlike Wi-Fi's contention, cellular networks are <strong>scheduled</strong>. The base station decides, every millisecond or less, which phones may send or receive on which slice of time and frequency, so collisions do not happen and the operator can manage quality of service. LTE and 5G use OFDMA in both directions, splitting the channel into many narrow subcarriers.</p>
<h3>Architecture</h3>
<p>A cellular network has two parts: the <strong>radio access network</strong> (base stations: eNodeB in 4G LTE, gNodeB in 5G) and the <strong>core network</strong>. In 5G the core is a set of software functions, often running in cloud datacenters, that separates the control plane from the user plane, the same separation as in Chapter 20:</p>
${fig('cellarch', '<b>Figure 22.4</b> A simplified 5G network. Control functions manage sessions and mobility; user data flows through a tunnel to the user plane function.')}
<ul>
<li>The <strong>AMF</strong> handles registration, authentication (using the SIM's secret keys) and mobility.</li>
<li>The <strong>SMF</strong> sets up data sessions and assigns the phone's IP address.</li>
<li>The <strong>UPF</strong> is the gateway between the mobile network and the Internet. User packets travel between the base station and the UPF inside <strong>GTP-U tunnels</strong>, which carry the phone's own IP packets inside outer IP/UDP headers.</li>
</ul>
<p>The phone's IP address is anchored at the UPF, not at the base station. That is the trick behind seamless mobility.</p>
<h3>Mobility and handover</h3>
<p>As a phone moves, it continually measures neighbouring cells. When another cell becomes better, the network performs a <strong>handover</strong>.</p>
${fig('handover', '<b>Figure 22.5</b> A handover between base stations. Only the tunnel endpoint moves; the phone keeps its address.')}
<p>Because only the tunnel between the base station and the UPF changes, the phone's IP address stays the same, and its TCP and QUIC connections continue undisturbed. This is <strong>indirection</strong>: a stable address that points at a changing location, the same idea as Mobile IP's home agent and, in a different form, QUIC's connection IDs.</p>
<h3>Roaming</h3>
<p>When you travel abroad, your phone attaches to a visited network, which authenticates you with your home operator. Often your data still travels back to your home network's UPF through an international tunnel ("home routing"), which is why roaming latency can be high and why your apparent location on the Internet stays in your home country.</p>
<h3>Generations</h3>
<div class="tbl"><table><tr><th>Generation</th><th>Era</th><th>Main idea</th><th>Typical user rates</th></tr>
<tr><td>2G (GSM)</td><td>1990s</td><td>digital voice, SMS; slow packet data added later</td><td>tens of kbit/s</td></tr>
<tr><td>3G (UMTS)</td><td>2000s</td><td>mobile data and the first smartphones</td><td>hundreds of kbit/s to a few Mbit/s</td></tr>
<tr><td>4G (LTE)</td><td>2010s</td><td>all-IP network: voice is VoIP (VoLTE); OFDMA</td><td>tens of Mbit/s</td></tr>
<tr><td>5G (NR)</td><td>2020s</td><td>wider bands up to millimetre wave, cloud-native core, network slicing, low-latency modes</td><td>hundreds of Mbit/s, up to Gbit/s</td></tr>
</table></div>
<p>5G also supports <strong>network slicing</strong>: running several logical networks with different guarantees (for example, one for consumer broadband, one for factory automation, one for payment terminals) on shared infrastructure, using the virtualization ideas of Chapter 20. Satellite constellations in low Earth orbit, such as Starlink, now add another kind of wireless access, with RTTs of a few tens of milliseconds instead of the 600 ms of geostationary satellites.</p>

<h2>Wireless and the layers above</h2>
<ul>
<li><strong>Variable bandwidth</strong> confuses congestion control and video players; adaptive bitrate (Chapter 16) and model-based congestion control (Chapter 14) help.</li>
<li><strong>Deep buffers</strong> in cellular base stations, used to smooth radio variability, can cause bufferbloat.</li>
<li><strong>Radio state machines</strong>: a phone's radio sleeps to save battery and takes tens to hundreds of milliseconds to wake. The first packet after an idle period is slow, and chatty apps that wake the radio often drain batteries.</li>
<li><strong>Address changes</strong> when moving between Wi-Fi and cellular break TCP connections; QUIC's connection migration and multipath TCP survive them.</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Treating Wi-Fi link rate as throughput.</strong> MAC overhead and contention cut it roughly in half or more.</li>
<li><strong>Too many APs on the same channel</strong>, which share one collision domain. Plan channels, especially on crowded 2.4 GHz.</li>
<li><strong>Assuming wireless loss means congestion.</strong></li>
<li><strong>Designing mobile apps that poll constantly</strong>, keeping the radio awake and the battery draining.</li>
</ul></div>

<div class="practice">
