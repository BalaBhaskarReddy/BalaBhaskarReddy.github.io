CH.push({
  id: 'ch12', n: 12, title: 'TCP',
  lede: 'TCP is the transport protocol behind most of the Internet\'s traffic. It turns IP\'s best-effort packets into a reliable, ordered, two-way stream of bytes between two processes. This chapter walks through its header, how connections open and close, how sequence numbers and acknowledgments really work, how it times out, how it recovers quickly from loss, and how it avoids overwhelming the receiver. It ends with UDP, its minimalist sibling.',
  html: `
<h2>What TCP provides</h2>
<ul>
<li><strong>Connection-oriented:</strong> the two ends set up shared state before data flows and tear it down afterwards.</li>
<li><strong>Reliable byte stream:</strong> every byte written arrives exactly once and in order, or the connection reports an error.</li>
<li><strong>Full duplex:</strong> data flows independently in both directions.</li>
<li><strong>Flow control:</strong> a sender never overruns the receiver's buffer.</li>
<li><strong>Congestion control:</strong> senders slow down when the network is overloaded (Chapters 13 and 14).</li>
</ul>
<p>TCP does not provide message boundaries, bounded delay, or security; those come from applications, from nothing at all, and from TLS, respectively.</p>

<h2>The TCP header</h2>
${fig('tcphdr', '<b>Figure 12.1</b> The TCP header: 20 bytes without options.')}
<div class="tbl"><table><tr><th>Field</th><th>Purpose</th></tr>
<tr><td>Ports</td><td>identify the two sockets; with the IP addresses they form the connection's 5-tuple</td></tr>
<tr><td>Sequence number</td><td>the position, in the byte stream, of the first data byte in this segment</td></tr>
<tr><td>Acknowledgment number</td><td>the next byte the sender of this segment expects to receive: a cumulative ACK</td></tr>
<tr><td>Flags</td><td>SYN (open), FIN (close), RST (abort), ACK (the ack field is valid), PSH, and ECN bits (Chapter 14)</td></tr>
<tr><td>Receive window</td><td>how many more bytes the receiver can accept: flow control</td></tr>
<tr><td>Options</td><td>maximum segment size, window scaling, selective acknowledgments, timestamps</td></tr>
</table></div>

<h2>Opening and closing connections</h2>
${fig('handshake', '<b>Figure 12.2</b> The three-way handshake, a data exchange, and the four-segment close.')}
<h3>The three-way handshake</h3>
<p>Each side picks an <strong>initial sequence number</strong> (ISN) and the other side acknowledges it. Three segments are needed, not two, because both directions need their starting number confirmed: SYN carries the client's ISN, SYN-ACK confirms it and carries the server's, and the final ACK confirms the server's.</p>
<p>ISNs are chosen randomly rather than starting at zero, for two reasons. If an old connection with the same 5-tuple left segments wandering in the network, random ISNs make it unlikely they fall inside the new connection's window. And an attacker who cannot see the traffic cannot guess the sequence numbers needed to inject data or reset the connection.</p>
<p>During the handshake the two sides also agree on options: the <strong>maximum segment size</strong> (MSS, typically 1,460 bytes on Ethernet: the 1,500-byte MTU minus 40 bytes of IP and TCP headers), whether to use window scaling, selective ACKs and timestamps.</p>
<h3>Closing</h3>
<p>Each direction is closed independently with a FIN, so a full close takes four segments (or three, when the server's FIN rides on its ACK). The side that closes first ends in <strong>TIME_WAIT</strong> for twice the maximum segment lifetime, often 60 seconds in total. That ensures its final ACK can be retransmitted if lost and that old duplicates of this connection have died before the same 5-tuple is reused. Busy servers that initiate closes can accumulate many TIME_WAIT sockets; letting clients close first avoids it.</p>
<p>A <strong>RST</strong> segment aborts a connection immediately: sent, for example, when a segment arrives for a port with no listening socket, or when an application exits abruptly.</p>
<h3>SYN floods</h3>
<p>A server that allocates memory for every SYN it receives can be exhausted by an attacker sending millions of SYNs from forged addresses. <strong>SYN cookies</strong> defend against this: the server encodes the connection's details in its own ISN using a secret hash and keeps no state until the final ACK returns with that number plus one.</p>

<h2>Sequence numbers and acknowledgments</h2>
<p>TCP numbers <strong>bytes</strong>, not segments. If a segment has sequence number 1,000 and carries 500 bytes, it holds bytes 1,000 to 1,499. The receiver's ACK of 1,500 means "I have every byte before 1,500; send 1,500 next." ACKs are <strong>cumulative</strong>, so a lost ACK does no harm if a later one arrives.</p>
<p>Data usually flows both ways, so ACKs ride on data segments going in the other direction (<strong>piggybacking</strong>). When there is no data to send, receivers use <strong>delayed ACKs</strong>, waiting briefly (up to about 40 to 200 ms) to acknowledge two segments at once. The receiver buffers out-of-order segments and acknowledges the start of the first gap.</p>
<h3>Selective acknowledgments</h3>
<p>A cumulative ACK says only where the first gap starts, not what arrived after it. With the <strong>SACK</strong> option (RFC 2018), the receiver also lists up to three or four blocks of data it holds beyond the gap, such as "bytes 3,000–5,999 and 7,000–8,499". The sender can then retransmit exactly the missing ranges, like Selective Repeat. Almost all modern TCP implementations use SACK.</p>

<h2>Estimating RTT and choosing the timeout</h2>
<p>TCP measures the RTT continuously: the time from sending a segment to receiving its ACK. Individual samples are noisy, so TCP keeps a smoothed average and a measure of how much samples vary (RFC 6298, from Jacobson and Karels' 1988 work):</p>
<div class="formula">RTTVAR = (1 − β) · RTTVAR + β · |SRTT − sample|      β = 1/4
SRTT   = (1 − α) · SRTT   + α · sample                α = 1/8
RTO    = SRTT + 4 · RTTVAR                           at least 1 second, per the RFC (Linux uses 200 ms)</div>
${fig('rtt', '<b>Figure 12.3</b> Noisy RTT samples, the smoothed estimate and the resulting timeout. A burst of queueing around sample 35 raises the variance term, and the timeout rises ahead of the samples.')}
<p>Two refinements matter. <strong>Karn's algorithm</strong>: do not take RTT samples from retransmitted segments, because you cannot tell whether the ACK answers the original or the retransmission. And <strong>exponential backoff</strong>: after each timeout, double the RTO, so a sender facing a dead or badly congested path backs off rather than flooding it. TCP timestamps (RFC 7323) let every ACK carry an exact echo of when its segment was sent, giving accurate samples even with retransmissions.</p>
${code('RttEstimator.java')`
public class RttEstimator {
  private double srtt = -1, rttvar;
  private double rtoMs = 1000;                    // initial RTO before any sample

  public void sample(double rttMs) {
    if (srtt < 0) { srtt = rttMs; rttvar = rttMs / 2; }
    else {
      rttvar = 0.75 * rttvar + 0.25 * Math.abs(srtt - rttMs);
      srtt   = 0.875 * srtt + 0.125 * rttMs;
    }
    rtoMs = Math.max(200, srtt + 4 * rttvar);    // Linux-style floor
  }
  public void onTimeout() { rtoMs = Math.min(rtoMs * 2, 60_000); }   // exponential backoff
  public double rto() { return rtoMs; }
}`}

<h2>Fast retransmit</h2>
<p>Waiting a full RTO after every loss would be slow. When a segment is lost but later ones arrive, the receiver sends <strong>duplicate ACKs</strong>, the same cumulative number again. Reordering can cause one or two duplicates; three in a row almost always mean loss. TCP therefore retransmits the missing segment as soon as it sees <strong>three duplicate ACKs</strong>, without waiting for the timer.</p>
${fig('fastretx', '<b>Figure 12.4</b> Three duplicate ACKs trigger a retransmission well before the timeout would fire.')}
<p>Modern stacks go further. <strong>RACK-TLP</strong> (RFC 8985), the default in Linux, declares a segment lost when a segment sent sufficiently later has been acknowledged, using time rather than counting duplicates, and sends a "tail loss probe" to detect losses at the end of a burst when no further ACKs would arrive.</p>

<h2>Flow control</h2>
<p>Each side has a receive buffer. Data waits there until the application reads it. The receiver advertises how much free space remains in the <strong>receive window</strong> (rwnd) field of every segment it sends. The sender keeps the amount of unacknowledged data in flight below rwnd.</p>
<div class="formula">bytes in flight = LastByteSent − LastByteAcked  ≤  rwnd</div>
<p>If the application stops reading, rwnd falls to zero and the sender stops. To find out when space opens up again, the sender periodically sends a one-byte <strong>window probe</strong>; otherwise a lost window update could deadlock the connection.</p>
<p>The window field is only 16 bits, a maximum of 64 KB, which caps throughput at 64 KB per RTT: about 5 Mbit/s at 100 ms. The <strong>window scale</strong> option, negotiated in the handshake, multiplies the field by up to 2¹⁴, allowing windows up to 1 GB. Operating systems also auto-tune buffer sizes to the measured bandwidth-delay product.</p>
<h3>Small segments</h3>
<p>An application writing one byte at a time could produce 41-byte packets carrying one byte of data. <strong>Nagle's algorithm</strong> holds back small segments while earlier data is unacknowledged and combines them. Combined with delayed ACKs it can add up to 200 ms of latency for request-response protocols, which is why interactive and RPC systems often disable it with <code>setTcpNoDelay(true)</code>.</p>

<h2>The TCP state machine</h2>
<div class="tbl"><table><tr><th>State</th><th>Meaning</th></tr>
<tr><td>LISTEN</td><td>server waiting for SYNs</td></tr>
<tr><td>SYN_SENT / SYN_RECEIVED</td><td>handshake in progress</td></tr>
<tr><td>ESTABLISHED</td><td>data can flow both ways</td></tr>
<tr><td>FIN_WAIT_1, FIN_WAIT_2</td><td>we sent FIN; waiting for its ACK and the peer's FIN</td></tr>
<tr><td>CLOSE_WAIT</td><td>the peer closed; waiting for our application to close</td></tr>
<tr><td>LAST_ACK</td><td>we sent our FIN after the peer's; waiting for the final ACK</td></tr>
<tr><td>TIME_WAIT</td><td>we closed first; waiting 2×MSL before forgetting the connection</td></tr>
</table></div>
<p>A server with thousands of sockets stuck in CLOSE_WAIT has an application bug: it is not closing connections that its peers have closed.</p>

<h2>Tuning TCP from Java</h2>
${code('Socket options')`
Socket s = new Socket();
s.setTcpNoDelay(true);                 // disable Nagle for request/response latency
s.setReceiveBufferSize(4 * 1024 * 1024);   // hint for large-BDP paths (set before connect)
s.setSoTimeout(5_000);                 // a read that blocks longer than 5 s throws
s.setKeepAlive(true);                  // probe idle connections so dead peers are noticed
s.connect(new InetSocketAddress("example.com", 443), 3_000);   // bounded connect time`}

<h2>UDP</h2>
<p>The <strong>User Datagram Protocol</strong> (RFC 768) adds just two things to IP: port numbers and an optional checksum. Its header is 8 bytes. There is no connection, no reliability, no ordering, no flow control and no congestion control. Each <code>send</code> becomes one datagram.</p>
<p>That is exactly what some applications want:</p>
<ul>
<li><strong>DNS</strong> queries fit in one packet; retrying a lost query is simpler than opening a connection.</li>
<li><strong>Real-time media</strong>: a voice packet that arrives late is useless, so retransmitting it is pointless.</li>
<li><strong>Protocols built on top</strong>: QUIC implements its own reliability, congestion control and encryption over UDP, so it can evolve in user space without operating-system or middlebox changes.</li>
</ul>
<p>Applications on UDP must still be good citizens: a UDP sender that ignores congestion can overload links and starve TCP flows.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Counting segments instead of bytes</strong> when reading sequence and acknowledgment numbers.</li>
<li><strong>Taking RTT samples from retransmissions.</strong> Follow Karn's algorithm.</li>
<li><strong>Leaving Nagle on for latency-sensitive request/response traffic.</strong></li>
<li><strong>Ignoring CLOSE_WAIT build-up</strong>: it means the application forgot to close sockets.</li>
<li><strong>Small socket buffers on long fat paths</strong>, which cap throughput at buffer ÷ RTT.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>

CH.push({
  id: 'ch13', n: 13, title: 'Congestion Control',
  lede: 'Flow control stops a sender from overwhelming its receiver. Congestion control stops all the senders together from overwhelming the network. Without it, the Internet collapsed in 1986. This chapter explains what congestion is, what a good solution must achieve, and how TCP\'s additive-increase, multiplicative-decrease rule, slow start and fast recovery achieve it using nothing but the packets each sender sees.',
  html: `
<h2>Congestion and collapse</h2>
<p>Routers have finite buffers. When packets arrive at a link faster than it can send them, the queue grows, delay increases, and once the buffer is full, packets are dropped. That is <strong>congestion</strong>. Some congestion is normal and short-lived; statistical multiplexing (Chapter 1) depends on queues absorbing bursts.</p>
<p>Sustained congestion becomes self-reinforcing. Dropped packets are retransmitted, adding more load. Packets that are delayed long enough are retransmitted even though they were not lost, so the network carries duplicate copies. Packets dropped near their destination wasted capacity on every earlier link. Eventually links are busy but almost nothing useful gets through: <strong>congestion collapse</strong>.</p>
${fig('collapse', '<b>Figure 13.1</b> Beyond a certain load, a network without congestion control delivers less useful data as senders push harder.')}
<p>This happened for real. In October 1986, throughput on a link between Lawrence Berkeley Laboratory and UC Berkeley, 400 yards apart, fell from 32 kbit/s to 40 bit/s. Van Jacobson and Michael Karels traced the problem and in 1988 published the algorithms that, with refinements, still underlie TCP congestion control today.</p>

<h2>What congestion control must achieve</h2>
<ul>
<li><strong>Efficiency:</strong> use the available capacity. A link that is idle while senders have data is wasted.</li>
<li><strong>Low delay and loss:</strong> do not keep queues permanently full.</li>
<li><strong>Fairness:</strong> flows sharing a bottleneck should get roughly equal shares, typically <em>max-min fairness</em>: no flow can get more without taking from a flow that has less.</li>
<li><strong>Convergence and stability:</strong> after flows arrive or leave, rates should settle quickly near the right values and not oscillate wildly.</li>
<li><strong>Decentralization:</strong> no central controller knows all the flows, so each sender must decide alone, from what it observes.</li>
</ul>
<h3>Where to put it</h3>
<p>Two broad approaches exist. In <strong>network-assisted</strong> congestion control, routers tell senders how fast to go or reserve capacity for them. In <strong>end-to-end</strong> congestion control, senders infer congestion from what they see, chiefly lost packets and growing delay, and adjust their own rates. The Internet chose end-to-end, in line with its simple core, though routers can help with explicit congestion notification (Chapter 14).</p>

<h2>The congestion window</h2>
<p>A TCP sender already has a window for flow control. Congestion control adds a second one, the <strong>congestion window</strong> (cwnd), which estimates how much data the network can absorb. The sender may have at most the smaller of the two in flight:</p>
<div class="formula">bytes in flight  ≤  min(cwnd, rwnd)          sending rate  ≈  cwnd ÷ RTT</div>
<p>So controlling the rate means adjusting cwnd. The remaining question is how: increase it while things go well to find spare capacity, and decrease it when there are signs of congestion.</p>
<p>Notice the <strong>ACK clock</strong> this creates. In steady state, a new segment is sent only when an ACK reports that an old one has left the network. The rate of ACKs reflects the rate the bottleneck is delivering, so the sender automatically paces itself to the bottleneck. TCP is "self-clocking".</p>

<h2>Additive increase, multiplicative decrease</h2>
<p>How should a sender react? Chiu and Jain showed in 1989 that the rule <strong>additive increase, multiplicative decrease</strong> (AIMD) is the one, among simple linear rules, that converges to both efficiency and fairness:</p>
<ul>
<li>When there is no congestion, increase the rate by a <em>constant</em> amount per round trip. TCP adds one maximum segment size to cwnd per RTT.</li>
<li>When congestion is detected, decrease the rate by a <em>constant factor</em>. TCP halves cwnd.</li>
</ul>
${fig('chiujain', '<b>Figure 13.2</b> Two AIMD flows in the Chiu-Jain phase plot. Increases move parallel to the fairness line; halvings move toward the origin, cutting the difference between the flows each time.')}
<p>The geometry explains why. Additive increase moves both flows' rates up by the same amount, which does not change the gap between them. Multiplicative decrease halves both rates, which halves the gap. Every cycle the flows become more equal. The alternatives fail: additive decrease never narrows the gap; multiplicative increase widens it. AIMD gives the familiar <strong>sawtooth</strong> shape of a TCP connection's window.</p>
${code('AIMD in its simplest form')`
// Called once per ACK in congestion avoidance: growing by 1/cwnd per ACK adds about 1 segment per RTT.
void onAck()  { cwnd += 1.0 / cwnd; }
// Called when loss is detected.
void onLoss() { cwnd = Math.max(1, cwnd / 2); }`}

<h2>Slow start</h2>
<p>Additive increase is slow when a connection starts. On a path that could carry 1,000 segments per RTT, growing from 1 by one segment per RTT would take 1,000 round trips. So a new connection starts with <strong>slow start</strong> (a misleading name: it is the fast phase). cwnd begins small, typically 10 segments today (RFC 6928), and grows by one segment for every ACK received, which <em>doubles</em> it each RTT. It reaches a large window in a logarithmic number of round trips.</p>
<p>Slow start ends when cwnd reaches the <strong>slow-start threshold</strong> (ssthresh), or when loss occurs. Then the sender switches to additive increase, called <strong>congestion avoidance</strong>. ssthresh is set to half the window at the last loss, which is TCP's memory of where trouble started.</p>
${fig('cwnd', '<b>Figure 13.3</b> A TCP Reno connection: exponential slow start, linear growth, halving on three duplicate ACKs, and a reset to one segment after a timeout.')}

<h2>Reacting to loss</h2>
<p>TCP distinguishes two loss signals, because they mean different things.</p>
<ul>
<li><strong>Three duplicate ACKs:</strong> one segment was lost, but later segments are still arriving, so the network is still delivering. The congestion is mild. TCP Reno performs <strong>fast retransmit</strong> and <strong>fast recovery</strong>: resend the missing segment, set ssthresh and cwnd to half the current window, and continue in congestion avoidance.</li>
<li><strong>A timeout:</strong> nothing is getting through, so the congestion may be severe. Set ssthresh to half the window, set cwnd to one segment, and start slow start again.</li>
</ul>
<div class="tbl"><table><tr><th>Event</th><th>ssthresh</th><th>cwnd</th><th>Next state</th></tr>
<tr><td>new ACK, cwnd &lt; ssthresh</td><td>unchanged</td><td>+1 segment per ACK (doubles per RTT)</td><td>slow start</td></tr>
<tr><td>new ACK, cwnd ≥ ssthresh</td><td>unchanged</td><td>+1/cwnd per ACK (+1 per RTT)</td><td>congestion avoidance</td></tr>
<tr><td>three duplicate ACKs</td><td>cwnd / 2</td><td>ssthresh (plus 3 during recovery)</td><td>fast recovery, then avoidance</td></tr>
<tr><td>timeout</td><td>cwnd / 2</td><td>1 segment</td><td>slow start</td></tr>
</table></div>
<p>The earliest version, <strong>TCP Tahoe</strong> (1988), went back to slow start on every loss. <strong>TCP Reno</strong> (1990) added fast recovery. <strong>NewReno</strong> fixed Reno's handling of several losses in one window by staying in fast recovery until all the data outstanding at the time of the loss is acknowledged. With SACK, recovery can repair several holes in one round trip.</p>
${code('RenoController.java')`
public class RenoController {
  private double cwnd = 10, ssthresh = Double.MAX_VALUE;   // segments
  private int dupAcks = 0;

  public void onNewAck() {
    dupAcks = 0;
    if (cwnd < ssthresh) cwnd += 1;          // slow start: +1 per ACK, doubling per RTT
    else cwnd += 1 / cwnd;                   // congestion avoidance: +1 per RTT
  }
  /** Returns true when the caller should fast-retransmit the missing segment. */
  public boolean onDupAck() {
    if (++dupAcks == 3) {
      ssthresh = Math.max(cwnd / 2, 2);
      cwnd = ssthresh;                       // fast recovery (simplified: no window inflation)
      return true;
    }
    return false;
  }
  public void onTimeout() {
    ssthresh = Math.max(cwnd / 2, 2);
    cwnd = 1;                                // start over with slow start
    dupAcks = 0;
  }
  public double window() { return cwnd; }
}`}

<h2>How much throughput does TCP get?</h2>
<p>A Reno flow in steady state swings between W/2 and W segments per RTT, averaging 3W/4. If one packet in every 1/p is lost, a short calculation (Mathis et al., 1997) gives:</p>
<div class="formula">throughput  ≈  (MSS ÷ RTT) × 1.22 ÷ √p</div>
<p>Two consequences stand out. Throughput falls with RTT, so flows with long RTTs get less of a shared bottleneck than flows with short RTTs: TCP is <strong>RTT-unfair</strong>. And high speed needs vanishingly low loss: 10 Gbit/s at 100 ms RTT with 1,460-byte segments requires a loss rate below about 2 × 10⁻¹⁰, one loss every 5 billion packets, which real links cannot provide. That limitation drove the newer algorithms in Chapter 14.</p>

<h2>Fairness and its limits</h2>
<p>TCP fairness is per flow, not per user or per application. A program that opens ten parallel connections gets roughly ten shares of a bottleneck, which download managers and some browsers exploit. UDP applications that do no congestion control at all can take more than their share and push TCP flows aside; real-time applications are expected to implement TCP-friendly rate control. Fairness between different congestion control algorithms (Reno, CUBIC, BBR) sharing a link is an active area of research and operational concern.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Confusing flow control with congestion control.</strong> rwnd protects the receiver; cwnd protects the network. The sender uses the smaller.</li>
<li><strong>Thinking slow start is slow.</strong> It grows exponentially.</li>
<li><strong>Treating every loss the same.</strong> Duplicate ACKs and timeouts call for different responses.</li>
<li><strong>Expecting equal throughput on paths with different RTTs.</strong> TCP Reno is RTT-unfair.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Slow start rounds</summary><p>Starting at cwnd = 10, how many RTTs until cwnd reaches 640 segments in slow start? Six.</p></details>
<details><summary>Trace Reno</summary><p>cwnd is 24 when three duplicate ACKs arrive. What are ssthresh and cwnd afterwards? Both 12. And after a timeout instead? ssthresh 12, cwnd 1.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Mathis formula</summary><p>Estimate Reno's throughput with MSS 1,460 bytes, RTT 50 ms and 0.1% loss. About 9 Mbit/s.</p></details>
<details><summary>Phase plot</summary><p>Repeat Figure 13.2 with additive increase and additive decrease and show that the flows never become equal.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Simulate a bottleneck</summary><p>Simulate two RenoController flows sharing a link with a drop-tail queue, with RTTs of 20 ms and 80 ms, and measure their throughput ratio.</p></details>
<details><summary>Derive the formula</summary><p>Derive the 1.22/√p throughput formula from the sawtooth shape.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain congestion, congestion collapse and the 1986 incident.</li>
<li>I can list the goals of congestion control.</li>
<li>I can explain the congestion window, min(cwnd, rwnd) and the ACK clock.</li>
<li>I can explain why AIMD converges to fairness using the phase plot.</li>
<li>I can trace slow start, congestion avoidance, fast recovery and timeouts in Reno.</li>
<li>I can use the Mathis formula and explain RTT unfairness and why high speeds need new algorithms.</li>
</ul>
`});

  const notes = ['Explicit congestion notification: a way to signal congestion without dropping packets.', 'The sender marks its packets as ECN-capable.', 'The router\'s queue is building. Instead of dropping the packet, it sets the Congestion Experienced bits in the IP header and forwards it.', 'The receiver echoes the signal back in its TCP ACK (the ECE flag).', 'The sender reduces cwnd as if a packet had been lost, and confirms with CWR. Nothing had to be retransmitted.'];

CH.push({
  id: 'ch14', n: 14, title: 'Modern Congestion Control',
  lede: 'Reno\'s ideas still hold, but today\'s networks are thousands of times faster and their buffers far larger. This chapter covers what changed: CUBIC, the default on Linux, Windows and macOS; delay- and model-based control such as BBR; explicit signals from the network with ECN; and the router side of the story, from bufferbloat to active queue management and fair queueing.',
  html: `
<h2>Why Reno is not enough</h2>
<p>Chapter 13 showed that Reno adds one segment per RTT and needs extremely low loss rates to sustain high speeds. Three changes in the network made those limits matter:</p>
<ul>
<li><strong>Large bandwidth-delay products.</strong> A 10 Gbit/s path with a 100 ms RTT holds about 85,000 segments. After one loss, Reno halves to 42,500 and then needs 42,500 RTTs, over an hour, to grow back.</li>
<li><strong>Large buffers.</strong> Cheap memory let home routers, cable modems and cellular base stations hold seconds of data. Loss-based TCP fills any buffer before it sees a loss, so these buffers sit full and add huge delays.</li>
<li><strong>Losses that are not congestion.</strong> On wireless links, packets are lost to interference. Treating each as congestion makes TCP slow down for no reason.</li>
</ul>
<p>Every modern algorithm keeps the overall structure (a window or rate controlled by the sender, probing for capacity and backing off) but changes what it reacts to and how quickly it grows.</p>

<h2>CUBIC</h2>
<p>CUBIC (RFC 9438) has been the default in Linux since 2006 and is now also the default in Windows and macOS. Its window growth depends on the <em>time since the last loss</em>, not on the number of ACKs, and follows a cubic curve centred on W_max, the window at the last loss:</p>
<div class="formula">W(t) = C · (t − K)³ + W_max          K = ∛(W_max · (1 − β) / C),   β = 0.7, C = 0.4</div>
${fig('cubic', '<b>Figure 14.1</b> After a loss, CUBIC climbs quickly back toward the old maximum, flattens out near it, then accelerates again to probe for more capacity.')}
<p>The shape is deliberate. Far below W_max, the window grows fast, recovering quickly. Near W_max, where the last loss happened, it grows very slowly, spending most of its time at a high, stable window. Beyond W_max, it accelerates to discover newly available capacity. Because growth depends on time rather than ACK rate, flows with different RTTs compete more fairly than under Reno. CUBIC also backs off less on loss (to 70% instead of 50%). When CUBIC would grow slower than Reno, as on short-RTT paths, it falls back to Reno-like growth so it is never less aggressive than standard TCP.</p>

<h2>Bufferbloat and active queue management</h2>
<p>A loss-based sender increases its window until a buffer overflows. If the bottleneck buffer holds one second of data, the sender keeps it nearly full, and every packet, including your video call and your DNS lookups, waits up to a second. This is <strong>bufferbloat</strong>, named by Jim Gettys in 2010 after he saw multi-second latency on his home connection whenever someone uploaded a file.</p>
${fig('bloat', '<b>Figure 14.2</b> A large upload fills an oversized drop-tail buffer and drives latency for everyone up to hundreds of milliseconds. With AQM the queue stays short.')}
<p>Making buffers smaller helps, but the real fix is to manage them. <strong>Active queue management</strong> (AQM) drops or marks packets <em>before</em> the buffer is full, to tell senders to slow down while the queue is still short.</p>
<ul>
<li><strong>RED</strong> (random early detection, 1993) drops each arriving packet with a probability that rises with the average queue length. It works, but is hard to tune.</li>
<li><strong>CoDel</strong> (controlled delay, 2012) measures how long each packet actually spent in the queue. If the minimum delay over an interval (100 ms) stays above a target (5 ms), it starts dropping, more often the longer the problem lasts. It needs no tuning for link speed.</li>
<li><strong>PIE</strong> controls the drop probability to keep estimated queueing delay near a target and is used in DOCSIS cable modems.</li>
</ul>
<p><strong>fq_codel</strong>, the default queueing discipline on Linux and in many home routers, combines CoDel with fair queueing.</p>

<h2>Fair queueing</h2>
<p>With a single FIFO queue, one bulk flow can fill the buffer, and a small interactive flow behind it suffers its delay. <strong>Fair queueing</strong> keeps a separate queue per flow (identified by hashing the 5-tuple) and serves them in turn.</p>
${fig('fq', '<b>Figure 14.3</b> Each flow gets its own queue and the scheduler takes turns, so a bulk transfer cannot delay a game or a call.')}
<p><strong>Deficit round robin</strong> (DRR) makes this fair in bytes rather than packets: each queue earns a quantum of bytes per round and may send packets as long as it has credit. Fair queueing isolates flows from each other: a flow sending more than its share builds only its own queue and only it sees drops. A sparse flow, such as a DNS query or a key press over SSH, is served almost immediately.</p>

<h2>Explicit congestion notification</h2>
<p>Dropping a packet is a crude way to say "slow down": the data must be retransmitted, and the sender learns about the problem only after a delay. <strong>ECN</strong> (RFC 3168) lets a router mark the packet instead. Two bits in the IP header indicate whether a packet is ECN-capable and whether congestion was experienced; the receiver echoes the mark to the sender in TCP's ECE flag; the sender reduces its window and confirms with CWR.</p>
${fig('ecn', '<b>Figure 14.4</b> ECN delivers the congestion signal without losing the packet.')}
<p>ECN is widely supported by end hosts and increasingly enabled in networks. Its biggest impact is in datacenters, where <strong>DCTCP</strong> reacts to the <em>fraction</em> of marked packets instead of halving on any mark, keeping switch queues tiny while sustaining full throughput. <strong>L4S</strong> (RFC 9330 to 9332) brings the same idea to the public Internet: a separate low-latency queue for senders that respond smoothly to ECN marks, aiming for queueing delays below a millisecond.</p>

<h2>Delay-based and model-based control</h2>
<p>A queue that is growing is an earlier warning than a full one. <strong>Delay-based</strong> algorithms watch RTT. TCP Vegas (1994) compares the expected rate (cwnd ÷ minimum RTT) with the actual rate and keeps only a few packets queued at the bottleneck. Vegas achieves low delay, but when it shares a link with loss-based flows it backs off first and loses out, which limited its adoption.</p>
<h3>BBR</h3>
<p>Google's <strong>BBR</strong> (bottleneck bandwidth and round-trip propagation time, 2016) builds an explicit model of the path from two measurements:</p>
<ul>
<li><strong>BtlBw</strong>: the bottleneck bandwidth, estimated as the maximum delivery rate seen over the last several round trips.</li>
<li><strong>RTprop</strong>: the propagation RTT, estimated as the minimum RTT seen over the last ten seconds or so.</li>
</ul>
<p>The ideal operating point is to send at exactly BtlBw with exactly BtlBw × RTprop in flight: the pipe is full, but no queue builds. Loss-based algorithms operate much further right, filling the buffer.</p>
${fig('bbr', '<b>Figure 14.5</b> Adding data in flight beyond one BDP increases delay without increasing delivery rate. BBR aims for the knee; loss-based TCP operates near the edge where buffers overflow.')}
<p>BBR paces packets at its estimated bandwidth rather than sending in bursts, periodically probes for more bandwidth by sending slightly faster for one RTT, and periodically drains the queue to re-measure RTprop. It does not treat random loss as congestion, which makes it much faster than CUBIC on lossy long-distance and wireless paths; Google reported large throughput and latency improvements on YouTube and its WAN. Its first version could be unfair to CUBIC flows and cause high loss in shallow buffers; BBRv2 and BBRv3 add reaction to loss and ECN to address this.</p>

<h2>Congestion control in QUIC and beyond</h2>
<p>Because QUIC (Chapter 16) runs in user space, applications can choose and update their congestion controller without waiting for operating systems. Most QUIC stacks use CUBIC or BBR. Video conferencing uses delay-based controllers such as Google Congestion Control in WebRTC, because a call cares more about latency than bulk throughput. In datacenters (Chapter 19), algorithms such as DCTCP, Swift and HPCC use ECN marks, precise delay measurements or telemetry from switches to keep queues near zero.</p>
<div class="tbl"><table><tr><th>Algorithm</th><th>Congestion signal</th><th>Growth</th><th>Used by</th></tr>
<tr><td>Reno / NewReno</td><td>loss</td><td>+1 segment per RTT</td><td>the reference standard</td></tr>
<tr><td>CUBIC</td><td>loss</td><td>cubic in time since last loss</td><td>Linux, Windows, macOS default</td></tr>
<tr><td>Vegas</td><td>rising RTT</td><td>keeps a few packets queued</td><td>research; ideas reused widely</td></tr>
<tr><td>BBR</td><td>model of bandwidth and min RTT</td><td>paced, probes periodically</td><td>Google services, many CDNs</td></tr>
<tr><td>DCTCP</td><td>fraction of ECN marks</td><td>Reno-like, proportional decrease</td><td>datacenters</td></tr>
</table></div>

<h2>Measuring it yourself</h2>
${code('Inspecting congestion control on Linux', 'none')`
sysctl net.ipv4.tcp_congestion_control        # current default, e.g. cubic
sysctl net.ipv4.tcp_available_congestion_control
ss -ti dst example.com                        # per-connection cwnd, rtt, retransmits, pacing rate
tc qdisc show                                 # queueing discipline on each interface, e.g. fq_codel
# Test for bufferbloat: run a large upload and watch ping latency rise, or use an online bufferbloat test.`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Adding buffer to fix packet loss.</strong> It turns loss into delay. Manage the queue instead.</li>
<li><strong>Treating wireless loss as congestion.</strong> Model-based control or link-layer retransmission avoids needless slowdowns.</li>
<li><strong>Assuming all algorithms share fairly.</strong> Mixing loss-based and delay-based flows on one bottleneck can starve one of them.</li>
<li><strong>Using a single FIFO for mixed traffic</strong> at a home or branch router; enable fq_codel or CAKE.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Reno recovery time</summary><p>How long does Reno take to regrow from 42,500 to 85,000 segments at 100 ms RTT? About 70 minutes.</p></details>
<details><summary>Buffer delay</summary><p>A home uplink of 20 Mbit/s has a 2 MB buffer. How much delay does a full buffer add? 0.8 seconds.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>CUBIC's K</summary><p>Compute K for W_max = 1,000 segments. About 9 seconds.</p></details>
<details><summary>Compare algorithms</summary><p>On a Linux VM, use <code>tc netem</code> to add 50 ms delay and 1% loss, and compare iperf3 throughput with cubic and bbr.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Implement CoDel</summary><p>Simulate a queue with CoDel's control law and compare queueing delay with a drop-tail queue under the same load.</p></details>
<details><summary>Deficit round robin</summary><p>Implement DRR in Java with per-flow queues and quantum 1,500 bytes, and show that flows with large and small packets receive equal byte rates.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why Reno struggles on high-BDP paths and with large buffers.</li>
<li>I can describe CUBIC's growth function and why it is time-based.</li>
<li>I can explain bufferbloat and how RED, CoDel and PIE manage queues.</li>
<li>I can explain fair queueing and deficit round robin.</li>
<li>I can explain ECN, DCTCP and L4S.</li>
<li>I can explain BBR's model and operating point and its trade-offs.</li>
</ul>
`});

CH.push({
  id: 'ch15', n: 15, title: 'DNS',
  lede: 'People use names; the network uses addresses. The Domain Name System translates between them, answering hundreds of billions of queries a day from a database that is split across millions of servers run by different organizations. It is a beautiful example of hierarchy, delegation and caching working together, and a frequent cause of outages and attacks.',
  html: `
<h2>Why names</h2>
<p>An IP address says where a host is attached. A name says what a service is. Separating the two lets a service change addresses (move to a new provider, add servers, fail over to a backup site) without anyone changing what they type or what their software is configured with. It also lets one name map to many addresses, for load balancing, and many names share one address, for virtual hosting.</p>
<p>In the early ARPANET, the mapping was a single file, <code>HOSTS.TXT</code>, maintained by hand at Stanford Research Institute and downloaded by every host. By the early 1980s that no longer scaled: the file changed constantly, downloads overloaded SRI, and names collided. Paul Mockapetris designed the <strong>Domain Name System</strong> in 1983 (RFCs 882 and 883, now 1034 and 1035) to replace it.</p>
<p>DNS had to be scalable to billions of names, have no single point of control or failure, allow each organization to manage its own names, and be fast for the very common case of repeated lookups. Its answer is a <strong>hierarchical, distributed database with aggressive caching</strong>.</p>

<h2>The namespace</h2>
<p>Names form a tree. Each node has a label of up to 63 characters, and a full name is the sequence of labels from a node up to the root, separated by dots: <code>www.example.com.</code>, where the final dot (usually omitted) stands for the root.</p>
${fig('dnstree', '<b>Figure 15.1</b> Part of the DNS tree. Reading a name right to left walks down from the root.')}
<ul>
<li>The <strong>root</strong> sits at the top.</li>
<li><strong>Top-level domains</strong> (TLDs) come next: generic ones such as <code>com</code>, <code>org</code> and <code>net</code>, country-code ones such as <code>in</code> and <code>uk</code>, and newer ones such as <code>app</code>.</li>
<li>Below each TLD, organizations register <strong>second-level domains</strong> such as <code>example.com</code>, through a registrar.</li>
<li>The owner of a domain can create any names beneath it: <code>www.example.com</code>, <code>api.eu.example.com</code>.</li>
</ul>

<h2>Zones and delegation</h2>
<p>The tree is cut into <strong>zones</strong>, each managed by one organization and served by its <strong>authoritative name servers</strong>. The root zone is managed by IANA and served by 13 named root server identities (a.root-servers.net to m.root-servers.net), operated by 12 organizations from over 1,800 sites worldwide using anycast. The <code>com</code> zone is run by Verisign. <code>example.com</code> is run by whoever owns it, or by the DNS provider they choose.</p>
<p>A parent zone does not hold its children's records. Instead, it <strong>delegates</strong>: it lists the name servers for the child zone (NS records) and, when those servers' names lie inside the child zone, their addresses (<strong>glue</strong> records). Delegation is what lets millions of organizations manage their own names without coordinating with anyone except their parent zone.</p>

<h2>Resource records</h2>
<p>DNS stores <strong>resource records</strong>, each with a name, a type, a value and a <strong>time to live</strong> (TTL) in seconds that says how long others may cache it.</p>
<div class="tbl"><table><tr><th>Type</th><th>Value</th><th>Example</th></tr>
<tr><td>A</td><td>an IPv4 address</td><td><code>www.example.com. 3600 A 93.184.215.14</code></td></tr>
<tr><td>AAAA</td><td>an IPv6 address</td><td><code>www.example.com. 3600 AAAA 2606:2800:21f:cb07:6820:80da:af6b:8b2c</code></td></tr>
<tr><td>CNAME</td><td>an alias: "this name is really that name"</td><td><code>shop.example.com. CNAME example.myshopify.com.</code></td></tr>
<tr><td>NS</td><td>the authoritative name servers for a zone</td><td><code>example.com. NS a.iana-servers.net.</code></td></tr>
<tr><td>MX</td><td>mail servers for a domain, with priorities</td><td><code>example.com. MX 10 mail.example.com.</code></td></tr>
<tr><td>TXT</td><td>free text: SPF, DKIM, domain ownership proofs</td><td><code>example.com. TXT "v=spf1 -all"</code></td></tr>
<tr><td>SOA</td><td>start of authority: zone serial number and timers</td><td>one per zone</td></tr>
<tr><td>PTR</td><td>reverse lookup: address to name</td><td><code>14.215.184.93.in-addr.arpa. PTR www.example.com.</code></td></tr>
<tr><td>SRV, HTTPS / SVCB</td><td>where a service runs, and how to connect (ports, protocols, HTTP/3 support)</td><td>used by browsers to discover HTTP/3</td></tr>
<tr><td>CAA</td><td>which certificate authorities may issue certificates for the domain</td><td>a security control</td></tr>
</table></div>

<h2>Resolution</h2>
<p>Three kinds of participant are involved in a lookup:</p>
<ul>
<li>The <strong>stub resolver</strong>, a small library in your operating system, which asks one question and expects a complete answer.</li>
<li>A <strong>recursive resolver</strong> (also called a caching resolver), run by your ISP, your company or a public service such as 1.1.1.1 or 8.8.8.8. It does the work of finding answers and caches them.</li>
<li><strong>Authoritative servers</strong>, which hold the actual records for their zones and answer only about those.</li>
</ul>
${fig('dnsres', '<b>Figure 15.2</b> A full iterative resolution with an empty cache. The stub makes one recursive query; the resolver makes iterative queries down the tree.')}
<p>The stub's query is <strong>recursive</strong>: "give me the final answer". The resolver's queries are <strong>iterative</strong>: each server either answers or refers the resolver one step further down. Splitting the work this way keeps authoritative servers simple and stateless, and concentrates caching where it helps the most users.</p>
<h3>Caching</h3>
<p>Caching is what makes DNS fast and scalable. A resolver caches every record it receives, including referrals, for its TTL. Because the NS records for <code>com</code> are cached nearly everywhere, the root servers handle only a tiny fraction of lookups. A popular name is answered from cache in under a millisecond by a nearby resolver. Resolvers also cache <strong>negative answers</strong> ("this name does not exist"), with a TTL set by the zone's SOA record.</p>
<p>TTLs are a trade-off chosen by the zone owner. A long TTL (a day) means fewer queries and faster lookups, but a change takes a day to reach everyone. A short TTL (30 to 60 seconds) allows quick failover and is common for load-balanced services, at the cost of more queries. Before a planned migration, operators lower the TTL well in advance.</p>

<h2>The protocol</h2>
<p>DNS messages use one format for queries and responses: a 12-byte header (a 16-bit ID that matches responses to queries, flags, counts), then sections for the question, the answers, authority (NS records for referrals) and additional records (glue). Queries normally use <strong>UDP port 53</strong>: one packet out, one back, no handshake. If a response is too large, the server sets a "truncated" flag and the client retries over <strong>TCP</strong>. The EDNS extension allows larger UDP messages and extra flags.</p>
${code('Looking up names')`

import java.util.*;

public class Lookup {

    for (InetAddress a : InetAddress.getAllByName("www.example.com"))   // uses the OS stub resolver and cache
      System.out.println(a.getHostAddress());
    // Note: the JVM caches successful lookups too (networkaddress.cache.ttl, 30 s by default
    // without a security manager). Long-running services should keep this short so failover works.
  }
}`}
${code('dig, the DNS power tool', 'none')`

dig +short AAAA www.example.com     # just the IPv6 addresses
dig MX gmail.com                    # mail servers
dig +trace www.example.com          # do the iterative walk yourself: root, TLD, authoritative

<h2>DNS beyond name lookup</h2>
<ul>
<li><strong>Load balancing:</strong> return several A records, or a different one per query, so clients spread across servers.</li>
<li><strong>Geographic steering:</strong> authoritative servers of CDNs answer with the address of the server closest to the resolver, or to the client if the resolver forwards a hint of the client's subnet (EDNS Client Subnet). Chapter 16 covers this.</li>
<li><strong>Service discovery:</strong> SRV and HTTPS records tell clients which host, port and protocol to use. Inside clusters, Kubernetes uses DNS names for services.</li>
<li><strong>Email security:</strong> SPF, DKIM and DMARC policies live in TXT records.</li>
</ul>

<h2>Security and privacy</h2>
<h3>Spoofing and cache poisoning</h3>
<p>Classic DNS has no authentication. A resolver accepts a response whose ID and question match an outstanding query. An attacker who can guess those values and get a forged response in first can make a resolver cache a false address for a domain, sending every user of that resolver to the attacker. In 2008 Dan Kaminsky showed a way to make this practical by triggering many queries for random subdomains. Resolvers now randomize the source port as well as the ID, which raises the attacker's odds from 1 in 65,536 to roughly 1 in 4 billion, but the real fix is cryptographic.</p>
<h3>DNSSEC</h3>
<p><strong>DNSSEC</strong> adds digital signatures. Each zone signs its records (RRSIG records) with its own key (DNSKEY), and the parent zone publishes a hash of the child's key (DS record), forming a <strong>chain of trust</strong> from the root down. A validating resolver can check that an answer really came from the zone owner and was not altered. DNSSEC authenticates data but does not encrypt it. Deployment is uneven: most TLDs, including the root, are signed, but only a minority of second-level domains are.</p>
<h3>Encrypted DNS</h3>
<p>Plain DNS travels unencrypted, so anyone on the path can see every name you look up and tamper with the answers. <strong>DNS over TLS</strong> (DoT, port 853), <strong>DNS over HTTPS</strong> (DoH) and <strong>DNS over QUIC</strong> encrypt the connection between the stub and the resolver. Browsers and mobile operating systems increasingly use them by default. Encryption protects the queries from the network, but the resolver itself still sees them, so choosing a trustworthy resolver matters.</p>
<h3>DNS as an attack amplifier</h3>
<p>A small UDP query with a forged source address can trigger a much larger response sent to the victim. Open resolvers and large responses have been used in reflection attacks of hundreds of gigabits per second. Defenses include closing open resolvers, rate-limiting responses and filtering spoofed source addresses at network edges.</p>

<h2>When DNS fails</h2>
<p>Because almost everything depends on it, DNS failures look like total outages. In October 2016 a botnet of compromised cameras and routers (Mirai) attacked the DNS provider Dyn, and sites such as Twitter, GitHub and Netflix became unreachable for many users in the US and Europe. In October 2021, a configuration error withdrew the BGP routes to Facebook's authoritative DNS servers; with no way to resolve their names, Facebook, Instagram and WhatsApp were unreachable worldwide for about six hours, and engineers had trouble reaching their own systems to fix it. Running authoritative DNS with more than one provider and keeping sensible TTLs are standard defenses.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Forgetting TTLs before a migration.</strong> Lower them days in advance, or clients keep using the old address.</li>
<li><strong>A CNAME at the zone apex.</strong> The standard forbids a CNAME on <code>example.com</code> itself, since other records (NS, SOA) must live there; providers offer "ALIAS" or "flattening" instead.</li>
<li><strong>Caching forever in the application.</strong> Respect TTLs, including the JVM's own DNS cache.</li>
<li><strong>A single DNS provider</strong> for a critical service.</li>
<li><strong>Assuming DNS is private.</strong> Without DoH or DoT, the network sees every name.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Trace it</summary><p>Run <code>dig +trace</code> on a site you use and identify the root, TLD and authoritative servers.</p></details>
<details><summary>Record types</summary><p>Find the MX, TXT and CAA records of a large company and explain what each says.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Cache behaviour</summary><p>Query a name twice in a row with dig and compare the TTL and query time of the two answers.</p></details>
<details><summary>Write a DNS query</summary><p>In Java, build a raw DNS query packet for an A record, send it over UDP to 1.1.1.1:53 and parse the answer section.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>An iterative resolver</summary><p>Extend your parser into a resolver that starts at a root server and follows referrals, using glue records, until it finds the answer. Add a TTL-respecting cache.</p></details>
<details><summary>Validate DNSSEC</summary><p>Use <code>dig +dnssec</code> to retrieve RRSIG, DNSKEY and DS records for a signed domain and trace the chain of trust to the root.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why names are separated from addresses and why HOSTS.TXT was replaced.</li>
<li>I can describe the namespace, zones, delegation and glue records.</li>
<li>I can name the common record types and what each is for.</li>
<li>I can trace a resolution with stub, recursive and authoritative servers, and explain recursive versus iterative queries.</li>
<li>I can explain caching, TTL trade-offs and negative caching.</li>
<li>I can explain cache poisoning, DNSSEC and encrypted DNS.</li>
</ul>
`});

CH.push({
  id: 'ch16', n: 16, title: 'HTTP and CDNs',
  lede: 'HTTP is the protocol of the web and of most APIs. This chapter covers its messages, methods and status codes, how caching works, and how the protocol evolved from one request per connection to multiplexed streams over QUIC. It ends with content delivery networks, which put copies of content close to users so that the speed of light matters less.',
  html: `
<h2>HTTP basics</h2>
<p>The <strong>Hypertext Transfer Protocol</strong> is a request-response protocol. A client sends a request naming a <strong>resource</strong> by its URL and a <strong>method</strong> saying what to do with it; the server returns a response with a status code, headers and usually a body. Tim Berners-Lee designed it in 1989 to fetch hypertext documents; today it carries web pages, video segments, software updates and the JSON of nearly every public API.</p>
<p>HTTP is <strong>stateless</strong>: each request is independent, and the server need not remember anything about earlier ones. Statelessness makes servers simple to scale (any server behind a load balancer can answer any request), and applications build sessions on top with <strong>cookies</strong>, small values the server asks the browser to send back with later requests, or with tokens in headers.</p>
<h3>Messages</h3>
${code('An HTTP/1.1 request and response, as text', 'none')`
GET /api/accounts/42 HTTP/1.1
Host: bank.example.com
Accept: application/json
Authorization: Bearer eyJhbGciOi...
User-Agent: curl/8.5.0

HTTP/1.1 200 OK
Content-Type: application/json
Content-Length: 59
Cache-Control: no-store
Date: Fri, 06 Nov 2026 08:30:00 GMT

{"id":42,"owner":"A. Rao","currency":"INR","balance":125000}`}
<p>A request line, header lines, a blank line, then an optional body. The <code>Host</code> header is mandatory in HTTP/1.1 because one IP address often serves many sites. The body's end is marked by <code>Content-Length</code> or by <em>chunked</em> transfer encoding, which matters because TCP itself has no message boundaries.</p>
<h3>Methods</h3>
<div class="tbl"><table><tr><th>Method</th><th>Meaning</th><th>Safe</th><th>Idempotent</th></tr>
<tr><td>GET</td><td>retrieve a representation</td><td>yes</td><td>yes</td></tr>
<tr><td>HEAD</td><td>like GET, headers only</td><td>yes</td><td>yes</td></tr>
<tr><td>POST</td><td>process data: create, submit, run an action</td><td>no</td><td>no</td></tr>
<tr><td>PUT</td><td>replace the resource with this representation</td><td>no</td><td>yes</td></tr>
<tr><td>PATCH</td><td>apply a partial change</td><td>no</td><td>not necessarily</td></tr>
<tr><td>DELETE</td><td>remove the resource</td><td>no</td><td>yes</td></tr>
</table></div>
<p><strong>Safe</strong> methods do not change server state; <strong>idempotent</strong> methods have the same effect whether sent once or many times. The distinction matters because networks fail: a client that times out does not know whether its request arrived. Retrying an idempotent request is harmless; retrying a POST might create a second payment. APIs that move money therefore accept an <strong>idempotency key</strong> header, letting the server recognize and ignore duplicates of the same logical request.</p>
<h3>Status codes</h3>
<div class="tbl"><table><tr><th>Class</th><th>Meaning</th><th>Common examples</th></tr>
<tr><td>1xx</td><td>informational</td><td>101 Switching Protocols (WebSockets), 103 Early Hints</td></tr>
<tr><td>2xx</td><td>success</td><td>200 OK, 201 Created, 204 No Content</td></tr>
<tr><td>3xx</td><td>redirection or cache</td><td>301 Moved Permanently, 302 Found, 304 Not Modified</td></tr>
<tr><td>4xx</td><td>client error</td><td>400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 429 Too Many Requests</td></tr>
<tr><td>5xx</td><td>server error</td><td>500 Internal Server Error, 502 Bad Gateway, 503 Service Unavailable, 504 Gateway Timeout</td></tr>
</table></div>
${code('HttpClient.java')`
import java.net.URI;

<h2>Connections and performance</h2>
<p>HTTP/1.0 opened a new TCP connection for every request, paying a handshake each time and never letting TCP's congestion window grow. HTTP/1.1 made connections <strong>persistent</strong> by default: many requests reuse one connection. But on one connection, HTTP/1.1 requests are answered strictly in order, so one slow response blocks those behind it (<strong>head-of-line blocking</strong>). Browsers work around this by opening about six parallel connections per server, and sites used to spread content across several hostnames to get more.</p>
<h3>HTTP/2</h3>
<p>HTTP/2 (2015, RFC 9113) keeps HTTP's meaning (methods, headers, status codes) but changes the wire format:</p>
<ul>
<li><strong>Binary framing</strong> replaces text, making messages faster and less ambiguous to parse.</li>
<li><strong>Multiplexing</strong>: many requests and responses travel at once as interleaved frames on independent <strong>streams</strong> over a single TCP connection.</li>
<li><strong>Header compression</strong> (HPACK) avoids resending the same headers, such as cookies and user agents, on every request.</li>
<li><strong>Stream priorities</strong> let the client say which resources matter most.</li>
</ul>
<p>HTTP/2 solves head-of-line blocking at the HTTP layer, but not below it. Because all streams share one TCP byte stream, a single lost packet makes TCP hold back <em>every</em> stream's data until the retransmission arrives.</p>
${fig('hver', '<b>Figure 16.1</b> HTTP/1.1 serializes requests; HTTP/2 interleaves them but one TCP loss stalls everything; HTTP/3 over QUIC confines the stall to one stream.')}
<h3>QUIC and HTTP/3</h3>
<p><strong>QUIC</strong> (RFC 9000, 2021) is a transport protocol built on UDP. It provides what TCP plus TLS provide, and more:</p>
<ul>
<li><strong>Independent streams</strong> with their own ordering, so a loss affects only the stream it belongs to.</li>
<li><strong>Built-in TLS 1.3</strong>: the transport and cryptographic handshakes are combined, so a new connection needs one round trip, and a resumed connection can send data immediately (<strong>0-RTT</strong>).</li>
<li><strong>Connection IDs</strong>: a connection survives a change of IP address, such as moving from Wi-Fi to mobile data.</li>
<li><strong>Encryption of almost all headers</strong>, which protects privacy and stops middleboxes from depending on, and freezing, the protocol's details.</li>
<li><strong>User-space implementation</strong>, so applications can ship improvements without operating-system upgrades.</li>
</ul>
${fig('rtts', '<b>Figure 16.2</b> Round trips spent on setup before the first request can be answered.')}
<p>HTTP/3 (RFC 9114) is HTTP over QUIC. A server advertises it with an <code>Alt-Svc</code> header or an HTTPS DNS record, and the browser switches. By the mid-2020s, roughly a third of web traffic used HTTP/3, led by Google, Meta and Cloudflare. 0-RTT data has one caveat: an attacker can replay it, so servers accept only idempotent requests that way.</p>

<h2>Caching</h2>
<p>The fastest request is the one that never crosses the network. HTTP has a detailed caching model, used by browsers, corporate proxies and CDNs.</p>
<ul>
<li><strong>Freshness:</strong> <code>Cache-Control: max-age=86400</code> lets any cache reuse a response for a day without asking. <code>no-store</code> forbids caching (sensitive data); <code>private</code> allows only the user's own browser to cache; <code>s-maxage</code> applies to shared caches.</li>
<li><strong>Validation:</strong> after expiry, a cache can ask "has it changed?" using <code>If-None-Match</code> with the response's <code>ETag</code>, or <code>If-Modified-Since</code>. If not, the server returns <strong>304 Not Modified</strong> with no body.</li>
<li><strong>Cache keys and Vary:</strong> a cache stores responses by URL; <code>Vary: Accept-Encoding</code> tells it to keep separate copies per encoding.</li>
<li><strong>Versioned URLs:</strong> the common pattern for static assets is to put a content hash in the file name (<code>app.3f9a1c.js</code>) and cache it for a year. Releasing a new version changes the URL, so caches never serve stale code.</li>
</ul>
${fig('cache', '<b>Figure 16.3</b> A cache miss, a hit for another user, and a cheap revalidation once the copy expires.')}

<h2>Content delivery networks</h2>
<p>Bandwidth is cheap, but distance is not: a user in Chennai fetching an image from a server in Virginia waits at least 130 ms per round trip, and a page needs many round trips. A <strong>content delivery network</strong> (CDN) runs servers in hundreds of locations, often inside ISPs' own networks, and serves content from whichever is closest to each user.</p>
${fig('cdn', '<b>Figure 16.4</b> Users fetch content from nearby edge servers, which fetch from the origin only on a miss.')}
<h3>How users reach the nearest edge</h3>
<ul>
<li><strong>DNS-based steering:</strong> the CDN's authoritative DNS server looks at where the query comes from (the resolver's address, or the client subnet if provided) and answers with the address of a nearby, healthy edge. Short TTLs let it shift load quickly.</li>
<li><strong>Anycast:</strong> every edge announces the same IP prefix over BGP (Chapter 10), and Internet routing delivers each user's packets to the nearest announcement. Cloudflare and many DNS services work this way. Anycast fails over automatically when a site withdraws its route.</li>
</ul>
<h3>What CDNs do</h3>
<ul>
<li><strong>Cache static content</strong> (images, video, scripts) close to users, cutting latency and origin load. Popular objects have hit rates above 95%.</li>
<li><strong>Accelerate dynamic content</strong> by terminating TCP and TLS near the user, so the expensive handshakes happen over a short path, and keeping warm, long-lived connections back to the origin.</li>
<li><strong>Absorb attacks</strong>: a CDN's total capacity, in hundreds of terabits per second, can soak up denial-of-service floods that would overwhelm any single origin.</li>
<li><strong>Run code at the edge</strong>: authentication, redirects, image resizing and small application logic.</li>
</ul>
<p>Video streaming is the largest CDN workload. Services such as Netflix place their own cache appliances inside ISPs, so most viewing traffic never leaves the user's ISP. The video is cut into short segments in several bitrates, and the player picks each segment's quality based on measured throughput (<strong>adaptive bitrate streaming</strong>, as in HLS and DASH), which is why quality changes as your connection does.</p>

<h2>Beyond request-response</h2>
<ul>
<li><strong>WebSockets</strong> upgrade an HTTP connection into a long-lived, two-way message channel, used for chat, live prices and collaborative editing.</li>
<li><strong>Server-sent events</strong> stream updates from server to client over a normal HTTP response.</li>
<li><strong>gRPC</strong> runs remote procedure calls over HTTP/2 streams with Protocol Buffers, common between microservices.</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Retrying non-idempotent requests blindly.</strong> Use idempotency keys for payments and other side effects.</li>
<li><strong>Caching personalized or sensitive responses in shared caches.</strong> Mark them <code>private</code> or <code>no-store</code>.</li>
<li><strong>Long cache lifetimes on unversioned URLs.</strong> Users keep the old file.</li>
<li><strong>Domain sharding on HTTP/2.</strong> It defeats multiplexing and header compression.</li>
<li><strong>No timeouts on HTTP clients.</strong> Set connect and request timeouts.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Read headers</summary><p>Run <code>curl -sI https://www.wikipedia.org</code> and explain each caching header.</p></details>
<details><summary>Which version?</summary><p>In the browser's developer tools, enable the protocol column and find which sites use h2 and h3.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Conditional requests</summary><p>With HttpClient, fetch a URL, then refetch with If-None-Match set to its ETag and confirm the 304.</p></details>
<details><summary>Idempotency keys</summary><p>Design a payment API endpoint that stores the response for each idempotency key and returns it on retries.</p></details>
<details><summary>Count round trips</summary><p>Estimate the time to first byte for a 150 ms RTT path with TCP + TLS 1.3, and with QUIC.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>A caching proxy</summary><p>Build a small HTTP proxy in Java that caches GET responses according to Cache-Control max-age and revalidates with ETags.</p></details>

CH.push({
  id: 'ch17', n: 17, title: 'Ethernet and Spanning Tree',
  lede: 'Routing gets packets to the right network. The link layer delivers them on that last network, and Ethernet is by far the most common link technology, from home routers to datacenter fabrics. This chapter covers MAC addresses and frames, how Ethernet evolved from a shared cable to switched links, how switches learn where hosts are, why loops are fatal, and how the spanning tree protocol and VLANs keep a local network sane.',
  html: `
<h2>What the link layer does</h2>
<p>The network layer decides that a packet's next hop is, say, the router 192.168.1.1. The link layer must actually deliver it to that router across the local network. It provides framing, local addressing, error detection and, on shared media, a way to take turns. Above all, it delivers a frame <em>one hop</em>: within a single local network, sometimes called a <strong>broadcast domain</strong> or a LAN.</p>

<h2>MAC addresses</h2>
<p>Each Ethernet or Wi-Fi interface has a 48-bit <strong>MAC address</strong>, written as six hex bytes: <code>3c:22:fb:9a:10:4e</code>. The first three bytes traditionally identify the manufacturer (the OUI) and the rest are assigned by it, so addresses are unique by construction. Two bits in the first byte have special meaning: one marks group (multicast) addresses, the other marks locally administered addresses. Phones and laptops now often use randomized, locally administered MACs on Wi-Fi so they cannot be tracked between networks.</p>
<p>MAC addresses are <strong>flat</strong>: nothing in the address says where the device is. That is fine within one LAN, where switches can learn locations, but it could never scale to a global network, which is why the Internet routes on hierarchical IP addresses. The special address <code>ff:ff:ff:ff:ff:ff</code> means <strong>broadcast</strong>: every device on the LAN.</p>

<h2>The Ethernet frame</h2>
${fig('ethframe', '<b>Figure 17.1</b> An Ethernet II frame. The minimum payload of 46 bytes dates from the collision-detection era.')}
<p>The frame starts with the destination address, so switches can begin forwarding before the whole frame has arrived. The <strong>EtherType</strong> says which protocol the payload belongs to. The <strong>frame check sequence</strong> is a 32-bit CRC computed over the frame; a receiver silently discards frames whose CRC does not match. The standard maximum payload, 1,500 bytes, is the Ethernet MTU. Datacenters often enable <strong>jumbo frames</strong> of 9,000 bytes to reduce per-packet overhead.</p>

<h2>From shared cable to switches</h2>
<h3>Classic Ethernet and CSMA/CD</h3>
<p>Ethernet was invented at Xerox PARC in 1973 by Bob Metcalfe and David Boggs. Every computer attached to one shared coaxial cable, and a transmission reached all of them. Only one could transmit at a time, so they used <strong>carrier sense multiple access with collision detection</strong> (CSMA/CD):</p>
<ol>
<li>Listen; transmit only if the cable is idle.</li>
<li>While transmitting, keep listening. If another transmission is detected (a collision), stop and send a short jam signal.</li>
<li>Wait a random time before retrying, doubling the range of the random wait after each successive collision (<strong>binary exponential backoff</strong>).</li>
</ol>
<p>Collision detection only works if a sender is still transmitting when news of a collision arrives from the far end of the cable. That sets a minimum frame size (64 bytes, hence the 46-byte minimum payload) and a maximum network diameter. Exponential backoff is a congestion control mechanism in miniature: under heavy load, senders spread their retries over longer intervals.</p>
<h3>Hubs and switches</h3>
<p>Coaxial cable gave way to twisted pair wired in a star to a central <strong>hub</strong>, which simply repeated every bit to every port: still one shared medium. A <strong>switch</strong> replaced the hub by reading each frame's destination address and forwarding it only to the right port. Each port now has its own link, typically <strong>full duplex</strong> (sending and receiving at once), so collisions cannot happen and CSMA/CD is no longer used. Modern Ethernet runs at 1 Gbit/s to the desktop and 100 to 800 Gbit/s in datacenters, but the frame format is the same as in 1980.</p>

<h2>How switches learn</h2>
<p>A switch keeps a <strong>MAC address table</strong> that maps addresses to ports. It is filled automatically, without any configuration, by watching traffic:</p>
<ul>
<li><strong>Learn:</strong> when a frame arrives on port p from source address S, record "S is on port p".</li>
<li><strong>Forward:</strong> if the destination is in the table, send the frame only out of that port (and drop it if that is the port it arrived on).</li>
<li><strong>Flood:</strong> if the destination is unknown, or is broadcast, send the frame out of every port except the one it arrived on.</li>
<li><strong>Age:</strong> forget entries not refreshed for a while (300 seconds by default), so a device that moves is relearned. Soft state again.</li>
</ul>
${fig('learning', '<b>Figure 17.2</b> A learning switch floods frames for unknown destinations and quickly learns where each host is.')}
${code('LearningSwitch.java')`
import java.util.*;

public class LearningSwitch {
  record Entry(int port, long seenAt) {}
  private final Map<String, Entry> table = new HashMap<>();
  private final int ports; private final long ageMs = 300_000;

  public LearningSwitch(int ports) { this.ports = ports; }

  /** Returns the ports to send a frame out of. */
  public List<Integer> handle(String srcMac, String dstMac, int inPort, long now) {
    table.put(srcMac, new Entry(inPort, now));                   // learn
    Entry e = table.get(dstMac);
    if (!dstMac.equals("ff:ff:ff:ff:ff:ff") && e != null && now - e.seenAt() < ageMs) {
      return e.port() == inPort ? List.of() : List.of(e.port()); // forward (or filter)
    }
    List<Integer> out = new ArrayList<>();                       // flood
    for (int p = 1; p <= ports; p++) if (p != inPort) out.add(p);
    return out;
  }
}`}
<p>Switches are <strong>transparent</strong>: hosts do not know they exist. You can add a switch to a network without reconfiguring anything. That transparency is also a risk: a malicious host that sends frames from millions of fake source addresses can fill the table, after which the switch floods everything and every host can see every frame (MAC flooding). Port security limits how many addresses each port may learn.</p>

<h2>The problem with loops</h2>
<p>For reliability, people connect switches redundantly, so that one failed cable does not cut the network in two. But redundant links create loops, and Ethernet has nothing like IP's TTL. A single broadcast frame entering a loop is flooded around it forever, and each switch makes more copies at every turn. Within seconds the links are saturated: a <strong>broadcast storm</strong>. Learning also breaks, because the same source address keeps appearing on different ports.</p>

<h2>Spanning tree</h2>
<p>The <strong>spanning tree protocol</strong> (STP, IEEE 802.1D, invented by Radia Perlman in 1985) fixes loops by turning some ports off. Switches cooperate to choose a subset of links that forms a <strong>spanning tree</strong>, connecting every switch with no loops, and block every other port. Redundant links stay physically connected but carry no traffic until they are needed.</p>
${fig('stp', '<b>Figure 17.3</b> The spanning tree algorithm elects a root, picks each switch\'s best path to it and blocks the rest.')}
<ol>
<li><strong>Elect a root bridge.</strong> Each switch has a bridge ID (a configurable priority plus its MAC address). Switches exchange <strong>BPDU</strong> messages; the lowest ID wins.</li>
<li><strong>Choose root ports.</strong> Every other switch picks the port with the lowest-cost path to the root. Port costs depend on link speed. Ties are broken by the neighbour's bridge ID, then by port number.</li>
<li><strong>Choose designated ports.</strong> On each link, the switch with the cheaper path to the root forwards traffic onto that link.</li>
<li><strong>Block everything else.</strong></li>
</ol>
<p>The resulting tree is a distance-vector computation in disguise, toward a single destination: the root. Classic STP took 30 to 50 seconds to react to a failure. <strong>Rapid spanning tree</strong> (RSTP, 802.1w) brings that down to under a few seconds. A cost of any spanning tree is wasted capacity: blocked links carry nothing, and all traffic funnels through the tree, often far from the shortest path. Datacenters avoid this by using IP routing with ECMP everywhere (Chapter 19), or link-layer protocols like TRILL and SPB that route frames with IS-IS.</p>
<p>Network operators set the root bridge deliberately, by giving a core switch the lowest priority, rather than leaving the election to whichever switch happens to have the lowest MAC address.</p>

<h2>VLANs</h2>
<p>Every host in a broadcast domain receives every broadcast, and every host can talk directly to every other at layer 2. In a large building, that is both wasteful and insecure. <strong>Virtual LANs</strong> (IEEE 802.1Q) split one physical switched network into several logical ones. Each switch port is assigned to a VLAN, and frames are forwarded and flooded only within their own VLAN. Traffic between VLANs must go through a router, where it can be filtered.</p>
<p>Links between switches that carry several VLANs are called <strong>trunks</strong>. Frames on a trunk carry a 4-byte <strong>802.1Q tag</strong> after the source address, containing a 12-bit VLAN ID (up to 4,094 VLANs) and a 3-bit priority. Typical uses are separating staff, guest and payment-terminal networks, a common requirement for keeping card data environments isolated, and separating management interfaces from user traffic.</p>
<div class="tbl"><table><tr><th>Device</th><th>Layer</th><th>Forwards on</th><th>Separates</th></tr>
<tr><td>Hub (obsolete)</td><td>1</td><td>nothing: repeats bits everywhere</td><td>nothing</td></tr>
<tr><td>Switch</td><td>2</td><td>MAC address, learned</td><td>collision domains (each port)</td></tr>
<tr><td>Switch with VLANs</td><td>2</td><td>MAC address within a VLAN</td><td>broadcast domains, logically</td></tr>
<tr><td>Router</td><td>3</td><td>IP prefix, longest match</td><td>broadcast domains and IP subnets</td></tr>
</table></div>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Disabling spanning tree</strong> "because it is slow" on a network with redundant links. One looped cable takes the whole LAN down.</li>
<li><strong>Leaving root election to chance.</strong> Set the root bridge priority explicitly.</li>
<li><strong>Very large broadcast domains.</strong> Broadcast traffic grows with the number of hosts; split them with VLANs and routing.</li>
<li><strong>Assuming switched traffic is private.</strong> MAC flooding and misconfigured mirror ports expose frames.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Your MAC addresses</summary><p>Run <code>ip link</code> or <code>ifconfig</code>. Which of your interfaces use randomized addresses?</p></details>
<details><summary>Trace the learning switch</summary><p>Extend Figure 17.2 with C sending to B, then D moving to port 2. What does the table contain after each step?</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Spanning tree by hand</summary><p>For a ring of five switches with IDs 50, 20, 40, 10, 30 in order, find the root, root ports and the one blocked port.</p></details>
<details><summary>Minimum frame size</summary><p>Show why a 10 Mbit/s Ethernet with a 51.2 µs round-trip collision window needs frames of at least 64 bytes.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Simulate a storm</summary><p>Connect three LearningSwitch instances in a triangle in a simulation and send one broadcast. Count copies over time, then add a blocked port and repeat.</p></details>
<details><summary>Implement STP</summary><p>Simulate BPDU exchange (root ID, cost, sender ID) until convergence and compute each port's role.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain what the link layer does and what a broadcast domain is.</li>
<li>I can describe MAC addresses and the Ethernet frame fields.</li>
<li>I can explain CSMA/CD and binary exponential backoff, and why switches made them unnecessary.</li>
<li>I can explain how a learning switch fills its table, forwards, floods and ages entries.</li>
<li>I can explain why loops cause broadcast storms and run the spanning tree algorithm by hand.</li>
<li>I can explain VLANs, trunks and 802.1Q tags.</li>
</ul>
`});
