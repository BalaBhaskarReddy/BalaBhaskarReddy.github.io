<style>

  for (let i = 0; i < 64; i++) { ip[i] = kp[i] ^ 0x36; op[i] = kp[i] ^ 0x5c; }
  ip.set(m, 64); op.set(sha256b(ip), 64); return sha256b(op);
}
/* deterministic pseudo-random numbers for drawing (not for security) */
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

CH.push({
  id: 'ch01', n: 1, title: 'What a Database System Does',
  lede: 'You already know how to organise data in memory: arrays, hash tables, trees and graphs. A database management system does something harder. It keeps data on storage that is a thousand times slower than memory, lets hundreds of users read and change it at once, survives power failures without losing a committed change, and answers questions written in a declarative language. This chapter explains why those goals need a dedicated system, what ACID means, and how PostgreSQL is organised as processes, memory and files.',
  html: `
<h2>Why not just files?</h2>
<p>Imagine storing customer accounts in a file of JSON lines, one per account. It works for one program on one machine. Then the problems arrive:</p>
<ul>
<li><strong>Finding things:</strong> to find account 42 you read the whole file, unless you build and maintain an index yourself, on disk, kept consistent with the data.</li>
<li><strong>Concurrency:</strong> two programs transfer money at the same time; both read balance 100, both write their result, and one transfer is lost.</li>
<li><strong>Crashes:</strong> the machine loses power halfway through rewriting the file; now it is half old, half new.</li>
<li><strong>Integrity:</strong> nothing stops a program writing a negative balance or a transfer to an account that does not exist.</li>
<li><strong>Questions:</strong> "total balance by city for customers who joined this year" needs a new program every time.</li>
<li><strong>Access control:</strong> anyone who can read the file can read everything in it.</li>
</ul>
<p>A database management system (DBMS) solves all of these once, so applications do not have to. It is built from the data structures you already know: B-trees and hash tables for indexes, heaps and queues inside the executor, graphs for lock waits, logs for durability. The difference is that every structure must work on pages of disk, with many users, and survive failure.</p>

<h2>The memory hierarchy rules everything</h2>
${fig('latency', '<b>Figure 1.1</b> Typical access times. Reading from storage is tens of thousands of times slower than reading from memory, so database design is dominated by avoiding I/O.')}
<p>Databases move data between storage and memory in fixed-size <strong>pages</strong> (8 KB in PostgreSQL). Almost every design decision follows from counting page reads: B-trees are wide and shallow so a lookup touches three or four pages; tables are scanned sequentially when most rows are needed because sequential reads are cheaper; a cache of pages in memory (the buffer pool) avoids repeated reads; and changes are first written to a sequential log rather than scattered across the files.</p>

<h2>ACID</h2>
<p>A <strong>transaction</strong> is a group of operations that the database treats as one unit. Transactions give four guarantees:</p>
<div class="tbl"><table><tr><th>Property</th><th>Meaning</th><th>How PostgreSQL provides it</th><th>Chapter</th></tr>
<tr><td>Atomicity</td><td>All of a transaction happens, or none of it</td><td>Commit status recorded in the commit log; aborted versions are simply invisible</td><td>14</td></tr>
<tr><td>Consistency</td><td>Constraints hold before and after each transaction</td><td>Primary and foreign keys, unique, check and exclusion constraints, triggers</td><td>3</td></tr>
<tr><td>Isolation</td><td>Concurrent transactions do not see each other's partial work</td><td>Multi-version concurrency control (MVCC), locks, serializable snapshot isolation</td><td>14–16</td></tr>
<tr><td>Durability</td><td>Once committed, a change survives crashes</td><td>Write-ahead log flushed to storage at commit</td><td>6</td></tr>
</table></div>
${code('A transfer that either happens completely or not at all', 'sql')`
BEGIN;
UPDATE accounts SET balance = balance - 500 WHERE id = 1;
UPDATE accounts SET balance = balance + 500 WHERE id = 2;
INSERT INTO transfers(from_id, to_id, amount) VALUES (1, 2, 500);
COMMIT;   -- after this returns, all three changes are durable
          -- if anything fails before here, none of them happened`}

<h2>How PostgreSQL is organised</h2>
${fig('arch', '<b>Figure 1.2</b> PostgreSQL\'s process architecture: a supervisor (postmaster), one backend process per client connection, shared memory, background processes, and files in the data directory.')}
<p>PostgreSQL uses <strong>processes, not threads</strong>. The postmaster listens for connections and forks a new backend process for each one. Backends cooperate through shared memory, which holds:</p>
<ul>
<li><strong>Shared buffers:</strong> the cache of table and index pages (Chapter 5).</li>
<li><strong>WAL buffers:</strong> log records waiting to be written (Chapter 6).</li>
<li><strong>The lock table</strong> and lightweight locks protecting shared structures (Chapter 16).</li>
<li><strong>The proc array:</strong> which transactions are running, used to build snapshots (Chapter 14).</li>
</ul>
<p>Background processes do the housekeeping: the <em>checkpointer</em> writes dirty pages and records checkpoints; the <em>background writer</em> cleans buffers ahead of demand; the <em>WAL writer</em> flushes the log; <em>autovacuum</em> workers remove dead row versions; <em>I/O workers</em>, new in PostgreSQL 18, perform asynchronous reads; <em>WAL senders</em> stream changes to replicas; the <em>archiver</em> copies completed log segments to backup storage.</p>
<p>Because each connection is a process with its own memory, connections are relatively expensive. A server with thousands of idle connections wastes memory and suffers contention; this is why connection poolers such as PgBouncer are standard (Chapter 25).</p>
<h3>The data directory</h3>
<ul>
<li><code>base/</code>: one subdirectory per database, one or more files per table and index, named by a number (the relfilenode). Files are split into 1 GB segments.</li>
<li><code>pg_wal/</code>: the write-ahead log, in 16 MB segments by default.</li>
<li><code>pg_xact/</code>: the commit log, two bits per transaction recording in progress, committed or aborted.</li>
<li><code>global/</code>: catalogs shared by all databases, such as roles.</li>
</ul>
${code('Look inside a running server', 'sql')`
-- who is connected and what are they doing?
SELECT pid, usename, state, wait_event_type, wait_event, left(query, 60) AS query
FROM pg_stat_activity
WHERE backend_type = 'client backend';

-- which file holds a table?
SELECT pg_relation_filepath('accounts');      -- e.g. base/16384/16397

-- the background processes
SELECT pid, backend_type FROM pg_stat_activity WHERE backend_type <> 'client backend';`}

<h2>The life of a query</h2>
${fig('lifeq', '<b>Figure 1.3</b> The five stages a SQL statement passes through inside a backend.')}
<p>SQL is <strong>declarative</strong>: you say what result you want, and the planner decides how to compute it. This is the database's greatest strength (the same query keeps working as data grows and indexes change) and the source of most performance surprises (the planner's choice depends on estimates that can be wrong). Chapters 11 and 12 open up the planner and executor.</p>

<h2>Versions in this book</h2>
<p>The book describes PostgreSQL 18, released in September 2025, and notes where PostgreSQL 19 changes behaviour. PostgreSQL 19 reached its release candidate stage in autumn 2026, with general availability scheduled for 19 November 2026. Major versions are released each year and supported for five years, so production systems commonly run two or three versions behind; where a feature is recent, the text says which version added it.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Treating the database as a dumb store</strong> and re-implementing integrity checks, joins and transactions in application code.</li>
<li><strong>Opening a connection per request</strong> without a pool.</li>
<li><strong>Ignoring I/O:</strong> performance thinking that counts CPU operations but not page reads.</li>
<li><strong>Assuming commit means "in memory somewhere"</strong>: in PostgreSQL, by default, commit means the log record is on durable storage.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Find the processes</summary><p>On a test server, list the operating system processes belonging to PostgreSQL (<code>ps -ef | grep postgres</code>) and match each to a row in <code>pg_stat_activity</code>.</p><p><em>Hint:</em> client backends show the user, database and client address in their process title.</p></details>
<details><summary>Locate a table</summary><p>Create a table, insert a million rows, and find its file with <code>pg_relation_filepath</code>. How big is it on disk, and how many 8 KB pages is that?</p><p><em>Answer sketch:</em> <code>pg_relation_size</code> divided by 8192 gives the page count.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Lost update in a file</summary><p>Write two small programs that read a balance from a text file, add 1, and write it back, 10,000 times each, running at the same time. What is the final value? Repeat with a PostgreSQL <code>UPDATE ... SET balance = balance + 1</code>.</p><p><em>Answer sketch:</em> the file loses many updates; the database's row locking serialises the updates so none are lost.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Process versus thread</summary><p>List the advantages and disadvantages of PostgreSQL's process-per-connection model compared with a thread-per-connection model such as MySQL's.</p><p><em>Answer sketch:</em> processes isolate crashes and memory corruption and simplify the code; they cost more memory and context switching and make shared state harder, which is why pooling matters.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why a DBMS is needed beyond files and in-memory structures.</li>
<li>I can explain why I/O dominates database design.</li>
<li>I can define atomicity, consistency, isolation and durability and say how PostgreSQL provides each.</li>
<li>I can describe PostgreSQL's processes, shared memory and data directory.</li>
<li>I can name the five stages of query processing.</li>
</ul>
`});

CH.push({
  id: 'ch02', n: 2, title: 'The Relational Model and SQL',
  lede: 'In 1970 Edgar Codd proposed storing data as relations, sets of tuples, and querying them with a small algebra. Fifty years later this is still the foundation of PostgreSQL. This chapter builds the model from first principles: relations, keys and the operators of relational algebra; then shows how SQL expresses them, including joins of every kind, grouping, subqueries, and the three-valued logic that makes NULL so surprising.',
  html: `
<h2>Relations, tuples and attributes</h2>
<p>A <strong>relation</strong> is a set of <strong>tuples</strong> that share the same <strong>attributes</strong>. In SQL terms a relation is a table, a tuple is a row and an attribute is a column with a name and a type. Two ideas matter:</p>
<ul>
<li><strong>Sets have no order.</strong> A table has no "first row". If you need an order, ask for it with <code>ORDER BY</code>; otherwise PostgreSQL returns rows in whatever order is cheapest, which can change between runs.</li>
<li><strong>Sets have no duplicates</strong> in the pure model. SQL relaxes this (tables are multisets, or "bags"), which is why you need keys to make rows distinguishable.</li>
</ul>
<h3>Keys</h3>
<p>A <strong>superkey</strong> is a set of attributes whose values identify a tuple uniquely. A <strong>candidate key</strong> is a minimal superkey. One candidate key is chosen as the <strong>primary key</strong>; the others become unique constraints. A <strong>foreign key</strong> is a set of attributes whose values must match a key in another relation. Keys are logical rules; PostgreSQL enforces primary keys and unique constraints with unique B-tree indexes (Chapter 7).</p>
<p>Natural keys (a PAN, an email, a PAN card number) carry meaning but can change or be reused; surrogate keys (a sequence number or a UUID) carry none. Most schemas use a surrogate primary key plus unique constraints on the natural keys.</p>

<h2>Relational algebra</h2>
<p>Codd defined a handful of operators that take relations and return relations. Because the output is always a relation, operators compose like functions, and that composability is what lets a planner rearrange them.</p>
<div class="tbl"><table><tr><th>Operator</th><th>Symbol</th><th>Meaning</th><th>SQL</th></tr>
<tr><td>Selection</td><td>σ</td><td>Keep tuples satisfying a predicate</td><td><code>WHERE</code></td></tr>
<tr><td>Projection</td><td>π</td><td>Keep some attributes</td><td>the <code>SELECT</code> list</td></tr>
<tr><td>Join</td><td>⋈</td><td>Combine tuples from two relations that satisfy a condition</td><td><code>JOIN ... ON</code></td></tr>
<tr><td>Union, difference, intersection</td><td>∪ − ∩</td><td>Set operations on compatible relations</td><td><code>UNION</code>, <code>EXCEPT</code>, <code>INTERSECT</code></td></tr>
<tr><td>Rename</td><td>ρ</td><td>Rename attributes or relations</td><td><code>AS</code></td></tr>
<tr><td>Grouping and aggregation</td><td>γ</td><td>Group tuples and compute aggregates</td><td><code>GROUP BY</code> with <code>sum</code>, <code>count</code>…</td></tr>
</table></div>
${code('A query and its algebra', 'sql')`
SELECT c.city AS name, sum(p.amount) AS total
FROM customers c
JOIN payments p ON p.customer_id = c.id
WHERE c.city = 'Pune' AND p.paid_at >= '2026-01-01'
GROUP BY c.city;`}
${fig('algtree', '<b>Figure 2.1</b> The query as a tree of algebra operators. The planner may push selections down to the tables before the join, because filtering first means joining fewer rows.')}
<p>Equivalence rules, such as "a selection on one input can be pushed below a join" and "joins are commutative and associative", let the planner transform this tree into many equivalent ones and choose the cheapest (Chapter 12). You write <em>what</em>; the algebra gives the planner freedom over <em>how</em>.</p>

<h2>Joins in SQL</h2>
${fig('joins', '<b>Figure 2.2</b> The same two tables joined five ways. Green rows on the left contribute to the result.')}
<p>Two further join forms are worth knowing. A <strong>cross join</strong> pairs every row with every row (the Cartesian product); it is occasionally useful and often an accident. A <strong>lateral join</strong> lets the right side refer to columns of the left, like a loop: "for each customer, their three most recent payments".</p>
${code('LATERAL: top three payments per customer', 'sql')`
SELECT c.id, c.name, p.amount, p.paid_at
FROM customers c
CROSS JOIN LATERAL (
    SELECT amount, paid_at FROM payments
    WHERE customer_id = c.id
    ORDER BY paid_at DESC
    LIMIT 3
) p;`}

<h2>The logical order of a SELECT</h2>
<p>SQL is written in one order and evaluated, logically, in another. Knowing the logical order explains many errors, such as why a column alias cannot be used in <code>WHERE</code>:</p>
<ol>
<li><code>FROM</code> and <code>JOIN</code>: build the combined rows.</li>
<li><code>WHERE</code>: filter rows.</li>
<li><code>GROUP BY</code>: form groups.</li>
<li><code>HAVING</code>: filter groups.</li>
<li>Window functions (Chapter 13).</li>
<li><code>SELECT</code>: compute output columns and aliases.</li>
<li><code>DISTINCT</code>.</li>
<li><code>ORDER BY</code>: may use aliases.</li>
<li><code>LIMIT</code> and <code>OFFSET</code>.</li>
</ol>
<p>The physical plan can do these in a different order, as long as the result is the same.</p>

<h2>NULL and three-valued logic</h2>
<p>NULL means "unknown" or "not applicable". Any comparison with NULL yields not true or false but <em>unknown</em>, and <code>WHERE</code> keeps only rows where the condition is true.</p>
${fig('tvl', '<b>Figure 2.3</b> Truth tables for SQL\'s three-valued logic. NULL (unknown) propagates unless the other operand decides the result.')}
<ul>
<li><code>x = NULL</code> is never true, even when x is NULL. Use <code>x IS NULL</code>, or <code>x IS NOT DISTINCT FROM y</code> to compare treating NULLs as equal.</li>
<li><code>NOT IN (subquery)</code> returns nothing if the subquery contains a NULL, because <code>x &lt;&gt; NULL</code> is unknown. Use <code>NOT EXISTS</code>. PostgreSQL 19 can convert <code>NOT IN</code> into an efficient anti-join when it can prove no NULLs are present.</li>
<li>Aggregates ignore NULLs (<code>count(col)</code> counts non-null values; <code>count(*)</code> counts rows); <code>sum</code> of no rows is NULL, not zero; use <code>coalesce(sum(x), 0)</code>.</li>
<li>A <code>UNIQUE</code> constraint allows many NULLs by default, because NULLs are not equal to each other. PostgreSQL 15 added <code>UNIQUE NULLS NOT DISTINCT</code> to allow only one.</li>
<li><code>CHECK</code> constraints pass when the expression is unknown, so <code>CHECK (amount &gt; 0)</code> accepts NULL; add <code>NOT NULL</code> as well.</li>
</ul>

<h2>Subqueries, CTEs and set operations</h2>
<p>Subqueries can appear in <code>FROM</code> (a derived table), in <code>WHERE</code> (with <code>IN</code>, <code>EXISTS</code>, <code>ANY</code>, <code>ALL</code>) or as scalar values. Common table expressions (<code>WITH</code>) name subqueries for readability; since PostgreSQL 12 they are inlined into the main query unless they are referenced more than once, have side effects, or are marked <code>MATERIALIZED</code>. Recursive CTEs traverse hierarchies and graphs (Chapter 13). Set operations remove duplicates unless you write <code>UNION ALL</code>, which is cheaper because it skips the sort or hash.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Relying on row order</strong> without <code>ORDER BY</code>.</li>
<li><strong>Inner joins that silently drop rows</strong> when a LEFT join was intended, or that multiply rows when the right side has several matches.</li>
<li><strong><code>NOT IN</code> with a nullable subquery.</strong></li>
<li><strong><code>= NULL</code></strong> instead of <code>IS NULL</code>.</li>
<li><strong><code>UNION</code> where <code>UNION ALL</code> was meant,</strong> paying for de-duplication.</li>
<li><strong>Filtering a LEFT JOIN's right table in WHERE,</strong> which turns it back into an inner join; put the condition in <code>ON</code>.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Translate to algebra</summary><p>Write the algebra tree for: names of customers who made a payment over ₹10,000 in 2026.</p><p><em>Answer sketch:</em> π name (σ amount &gt; 10000 ∧ year = 2026 (customers ⋈ payments)), with the selection pushed onto payments.</p></details>
<details><summary>Predict the NULLs</summary><p>What do <code>SELECT NULL = NULL</code>, <code>SELECT NULL IS NULL</code> and <code>SELECT 1 NOT IN (2, NULL)</code> return?</p><p><em>Answer:</em> NULL, true, NULL.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Duplicates from joins</summary><p>A report joins customers to payments and to addresses, and the totals are too high. Explain why and fix it.</p><p><em>Answer sketch:</em> two one-to-many joins multiply rows (payments × addresses per customer). Aggregate each side separately before joining, or use a semi-join for the filter.</p></details>
<details><summary>LEFT JOIN filter</summary><p>Rewrite <code>... LEFT JOIN payments p ON ... WHERE p.status = 'settled'</code> so customers without settled payments still appear.</p><p><em>Answer:</em> move <code>p.status = 'settled'</code> into the ON clause.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Division</summary><p>Relational division answers "which customers have paid with every payment method?". Express it in SQL with double <code>NOT EXISTS</code>.</p><p><em>Answer sketch:</em> customers c where not exists a method m such that not exists a payment by c with m.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can define relation, tuple, attribute, candidate, primary and foreign keys.</li>
<li>I can write the relational algebra for a simple query and explain why it helps the planner.</li>
<li>I know the five join forms and when to use EXISTS, NOT EXISTS and LATERAL.</li>
<li>I know the logical evaluation order of SELECT.</li>
<li>I can predict the effect of NULL in comparisons, NOT IN, aggregates and constraints.</li>
</ul>
`});

CH.push({
  id: 'ch03', n: 3, title: 'Schema Design and Normalisation',
  lede: 'A schema is a set of promises about data: what exists, how things relate, and which states are impossible. Good schemas make wrong data unrepresentable and queries simple; bad ones push integrity into application code, where it eventually fails. This chapter covers functional dependencies and normal forms, the constraints PostgreSQL can enforce, choosing data types (money, time and identifiers matter most in fintech), and when to denormalise deliberately.',
  html: `
<h2>Anomalies: why structure matters</h2>
${fig('anomaly', '<b>Figure 3.1</b> Update, insert and delete anomalies in a table that stores the same fact in many rows.')}

<h2>Functional dependencies</h2>
<p>A <strong>functional dependency</strong> X → Y says that whenever two rows agree on X, they agree on Y. In the wide table above, <code>customer_id → name, city</code>, and <code>payment_id → everything</code>. Dependencies are facts about the business, not about current data: today no two customers share a phone number, but <code>phone → customer</code> is false if families can share one.</p>
<p>Normalisation decomposes tables so that each dependency is enforced by a key. Every determinant (left side of a dependency) should be a key of its table; then each fact is stored once and anomalies disappear.</p>

<h2>Normal forms</h2>
${fig('nf', '<b>Figure 3.2</b> Normalising an order system step by step. Choose a tab to see the design and the dependency it removes.')}
<p>Higher forms exist (4NF handles independent multi-valued facts, 5NF join dependencies), but in practice <strong>aim for BCNF and denormalise only with a reason</strong>. Decomposition must be <em>lossless</em> (joining the parts gives back the original) and should preserve dependencies so they can be checked with keys.</p>

<h2>Constraints: let the database say no</h2>
<div class="tbl"><table><tr><th>Constraint</th><th>Example</th><th>Enforced by</th></tr>
<tr><td><code>NOT NULL</code></td><td>Every payment has an amount</td><td>Check on each row</td></tr>
<tr><td><code>PRIMARY KEY</code>, <code>UNIQUE</code></td><td>One account per IBAN</td><td>Unique B-tree index</td></tr>
<tr><td><code>FOREIGN KEY</code></td><td>Payment refers to an existing account</td><td>Triggers checking the referenced key; an index on the referencing column is your job</td></tr>
<tr><td><code>CHECK</code></td><td><code>amount &gt; 0</code>, <code>currency ~ '^[A-Z]{3}$'</code></td><td>Expression on each row</td></tr>
<tr><td><code>EXCLUDE</code></td><td>No two bookings of a room overlap in time</td><td>GiST index with an operator such as <code>&amp;&amp;</code> (Chapter 9)</td></tr>
<tr><td>Temporal keys (PostgreSQL 18)</td><td><code>PRIMARY KEY (account_id, valid WITHOUT OVERLAPS)</code></td><td>GiST-backed uniqueness over a range</td></tr>
</table></div>
${code('A payments schema that refuses bad data', 'sql')`
CREATE TABLE accounts (
    id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    iban        text NOT NULL UNIQUE CHECK (iban ~ '^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$'),
    currency    char(3) NOT NULL CHECK (currency ~ '^[A-Z]{3}$'),
    opened_at   timestamptz NOT NULL DEFAULT now(),
    closed_at   timestamptz,
    CHECK (closed_at IS NULL OR closed_at > opened_at)
);

CREATE TABLE payments (
    id           uuid PRIMARY KEY DEFAULT uuidv7(),          -- PostgreSQL 18
    account_id   bigint NOT NULL REFERENCES accounts(id),
    amount       numeric(18,2) NOT NULL CHECK (amount > 0),
    status       text NOT NULL CHECK (status IN ('pending','settled','failed','refunded')),
    created_at   timestamptz NOT NULL DEFAULT now(),
    amount_paise bigint GENERATED ALWAYS AS ((amount * 100)::bigint)   -- virtual by default in 18
);
CREATE INDEX ON payments (account_id);     -- foreign keys are not indexed automatically`}
<p>Constraints are cheaper and more reliable than application checks, because they apply to every writer, including scripts, migrations and future services. They also give the planner facts: a unique constraint lets it remove redundant joins and know a lookup returns one row.</p>

<h2>Choosing types</h2>
<h3>Money</h3>
<p>Never use <code>float</code> or <code>double precision</code> for money: binary floating point cannot represent 0.1 exactly, and sums drift. Use <code>numeric(p, s)</code>, which is exact decimal, or store integer minor units (<code>bigint</code> paise or cents) for speed. Store the currency alongside. Avoid the <code>money</code> type: it depends on a locale setting.</p>
<h3>Time</h3>
<p>Use <code>timestamptz</code> for instants. Despite its name it stores no time zone: it stores UTC and converts on input and output using the session's <code>TimeZone</code>. <code>timestamp</code> without time zone is a wall-clock reading with no instant attached, appropriate only for things like "opening hour 09:00 local". Use <code>date</code> for calendar dates (value dates, birthdays) and range types (<code>tstzrange</code>, <code>daterange</code>) for periods.</p>
<h3>Identifiers</h3>
${fig('uuidloc', '<b>Figure 3.3</b> Why key order matters for B-tree indexes. Sequential keys append to the rightmost leaf; random UUIDs scatter writes across the whole index, dirtying thousands of pages and filling the buffer cache.')}
<p><code>bigint GENERATED ALWAYS AS IDENTITY</code> is compact (8 bytes) and ordered. UUIDs (16 bytes) can be generated anywhere without coordination and do not reveal volumes, but random version-4 UUIDs destroy insert locality in B-trees, as Figure 3.3 shows. PostgreSQL 18 added <code>uuidv7()</code>, which puts a millisecond timestamp in the high bits: globally unique, generated anywhere, and roughly ordered. It does reveal creation time, so do not use it where that leaks information.</p>
<h3>Text and others</h3>
<ul>
<li><code>text</code> and <code>varchar(n)</code> perform the same; use <code>text</code> with a <code>CHECK</code> on length if you need a limit. <code>char(n)</code> pads with spaces and is rarely what you want.</li>
<li><code>boolean</code> rather than a <code>char(1)</code> flag; enums or a lookup table for fixed sets.</li>
<li>Domains bundle a type with constraints for reuse: <code>CREATE DOMAIN currency_code AS char(3) CHECK (VALUE ~ '^[A-Z]{3}$')</code>.</li>
<li><code>jsonb</code> for genuinely variable attributes (Chapter 18), not as a way to avoid design.</li>
<li>Column order affects storage through alignment padding (Chapter 4).</li>
</ul>

<h2>Denormalising on purpose</h2>
<p>Normalised schemas need joins, and sometimes a join on every request is too slow or a historical value must be frozen. Legitimate reasons to denormalise:</p>
<ul>
<li><strong>History:</strong> the price, address or exchange rate at the time of a transaction belongs on the transaction (as <code>price_at_order</code> in Figure 3.2).</li>
<li><strong>Derived values</strong> that are expensive to compute: account balances maintained alongside an immutable ledger, updated in the same transaction.</li>
<li><strong>Read models</strong> for reporting: materialised views refreshed on a schedule.</li>
</ul>
<p>Each copy needs a rule that keeps it right: a trigger, a generated column, the same transaction, or a documented refresh. A ledger is the classic fintech pattern: immutable entries are the source of truth; balances are a cache you can always rebuild.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Floating point money.</strong></li>
<li><strong><code>timestamp</code> instead of <code>timestamptz</code></strong>, producing errors at daylight saving changes and across regions.</li>
<li><strong>Unindexed foreign keys,</strong> making deletes on the parent scan the child table.</li>
<li><strong>Constraints only in the application.</strong></li>
<li><strong>Random UUIDv4 primary keys</strong> on large, write-heavy tables.</li>
<li><strong>Entity–attribute–value tables</strong> (id, attribute_name, value) that defeat types, constraints and the planner.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Find the dependencies</summary><p>For <code>loans(loan_id, customer_id, customer_pan, branch_code, branch_city, amount, rate)</code>, list the functional dependencies and decompose to BCNF.</p><p><em>Answer sketch:</em> loan_id → all; customer_id → customer_pan; branch_code → branch_city. Tables: loans(loan_id, customer_id, branch_code, amount, rate), customers(customer_id, pan), branches(branch_code, city).</p></details>
<details><summary>Float drift</summary><p>Run <code>SELECT sum(0.1::float8) FROM generate_series(1, 10)</code> and the same with <code>numeric</code>. Explain the difference.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>No overlapping rates</summary><p>Design a table of interest rates per product with validity periods, so that two rates for the same product can never overlap.</p><p><em>Answer sketch:</em> <code>valid tstzrange</code> with <code>EXCLUDE USING gist (product_id WITH =, valid WITH &amp;&amp;)</code> (needs btree_gist), or in PostgreSQL 18 <code>PRIMARY KEY (product_id, valid WITHOUT OVERLAPS)</code>.</p></details>
<details><summary>Ledger and balance</summary><p>Design ledger_entries and account_balances so that the balance can never disagree with the sum of entries for longer than a transaction.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Measure locality</summary><p>Create two tables of 10 million rows with bigint and UUIDv4 keys. Insert 100,000 more rows into each and compare <code>pg_stat_io</code> writes and WAL generated.</p><p><em>Answer sketch:</em> the UUIDv4 table writes far more pages and WAL (full-page images after each checkpoint touch many more pages).</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can recognise update, insert and delete anomalies.</li>
<li>I can identify functional dependencies and normalise to BCNF.</li>
<li>I know PostgreSQL's constraint types, including EXCLUDE and temporal keys.</li>
<li>I choose numeric or integer minor units for money and timestamptz for instants.</li>
<li>I can explain the B-tree cost of random keys and the benefit of UUIDv7.</li>
<li>I denormalise only with a rule that keeps copies correct.</li>
</ul>
`});

CH.push({
  id: 'ch04', n: 4, title: 'Pages and Tuples',
  lede: 'Every table and index in PostgreSQL is a file of 8 KB pages, and every row is a tuple stored inside one of them. Understanding the page layout explains much of PostgreSQL\'s behaviour: why rows have physical addresses, why updates create new versions, how much space a row really takes, why column order matters, and how values larger than a page are stored. This chapter opens the page and looks at the bytes.',
  html: `
<h2>Files, forks and pages</h2>
<p>Each table (a <em>relation</em>, in PostgreSQL's vocabulary) is stored as a set of files called <strong>forks</strong>:</p>
<ul>
<li>the <strong>main fork</strong>: the data itself, a sequence of 8 KB pages (blocks), split into 1 GB segment files;</li>
<li>the <strong>free space map</strong> (<code>_fsm</code>): approximately how much free space each page has, so inserts can find room;</li>
<li>the <strong>visibility map</strong> (<code>_vm</code>): two bits per page, "all tuples visible to everyone" and "all frozen", used by index-only scans and vacuum (Chapters 7 and 17);</li>
<li>the <strong>init fork</strong>, for unlogged tables.</li>
</ul>
<p>A table's main fork is a <strong>heap</strong>: rows are placed wherever there is space, with no ordering. (This is a different "heap" from the priority queue in the data structures book; the word means "pile".) Indexes are separate files that point into the heap.</p>

<h2>Inside a heap page</h2>
${fig('page', '<b>Figure 4.1</b> A heap page filling up. Line pointers grow from the front and tuples from the back; deletion leaves dead tuples until pruning reclaims the space.')}
<p>The page header (24 bytes) holds the page's LSN (the last WAL record that changed it, Chapter 6), a checksum if enabled, flags, and the offsets <code>pd_lower</code> and <code>pd_upper</code>. After it comes an array of 4-byte <strong>line pointers</strong> (item identifiers), each giving the offset and length of a tuple. The indirection is the key design choice: indexes point to a line pointer number, not a byte offset, so tuples can move within the page during compaction without changing their address.</p>
<p>A row's physical address is its <strong>ctid</strong>: (block number, line pointer number). You can select it like a column, though it changes whenever the row is updated, so never store it.</p>

<h2>Inside a tuple</h2>
<p>Each heap tuple begins with a 23-byte header:</p>
<div class="tbl"><table><tr><th>Field</th><th>Size</th><th>Purpose</th></tr>
<tr><td><code>t_xmin</code></td><td>4 B</td><td>Transaction ID that inserted this version</td></tr>
<tr><td><code>t_xmax</code></td><td>4 B</td><td>Transaction ID that deleted or locked it (0 if none)</td></tr>
<tr><td><code>t_cid</code></td><td>4 B</td><td>Command number within the transaction</td></tr>
<tr><td><code>t_ctid</code></td><td>6 B</td><td>Address of this tuple, or of the newer version after an update</td></tr>
<tr><td><code>t_infomask2</code></td><td>2 B</td><td>Number of attributes, HOT flags</td></tr>
<tr><td><code>t_infomask</code></td><td>2 B</td><td>Hint bits (committed or aborted known), has nulls, has variable-width</td></tr>
<tr><td><code>t_hoff</code></td><td>1 B</td><td>Offset to the user data</td></tr>
</table></div>
<p>A null bitmap follows if any column is null (one bit per column), then padding to an 8-byte boundary, then the column values. The header fields <code>xmin</code>, <code>xmax</code> and <code>ctid</code> are the machinery of MVCC, which Chapter 14 explains. For now notice the cost: <strong>every row carries about 24 bytes of overhead plus a 4-byte line pointer</strong>. A table of narrow rows, such as two integers, is dominated by overhead.</p>
${code('Look at real page contents with pageinspect', 'sql')`
CREATE EXTENSION IF NOT EXISTS pageinspect;

SELECT lower, upper, special, pagesize
FROM page_header(get_raw_page('accounts', 0));

SELECT lp, lp_off, lp_len, t_xmin, t_xmax, t_ctid, t_infomask::bit(16)
FROM heap_page_items(get_raw_page('accounts', 0))
LIMIT 5;

SELECT ctid, id FROM accounts LIMIT 3;    -- (0,1), (0,2), (0,3)`}

<h2>Alignment and column order</h2>
${fig('align', '<b>Figure 4.2</b> The same six columns in two orders. Types must start at addresses that are multiples of their alignment, so small columns before large ones create padding.')}
<p>Fixed-width types have alignment requirements: <code>int8</code>, <code>timestamptz</code> and <code>float8</code> align to 8 bytes; <code>int4</code> and <code>date</code> to 4; <code>int2</code> to 2; <code>boolean</code> to 1. Variable-length types such as <code>text</code> and <code>numeric</code> have a 1-byte header when short (under 127 bytes) and need no alignment in that case. For large tables, put fixed-width columns in decreasing alignment order and variable-length columns last. Check with <code>pg_column_size(row)</code>.</p>

<h2>Large values: TOAST</h2>
${fig('toast', '<b>Figure 4.3</b> The Oversized-Attribute Storage Technique moves large values out of line into a companion table.')}
<p>A tuple must fit in a page. When a row exceeds about 2 KB (<code>TOAST_TUPLE_THRESHOLD</code>, a quarter of a page), PostgreSQL first compresses its largest variable-length values, and if the row is still too big, moves them to the table's TOAST relation in chunks, leaving an 18-byte pointer. Each column has a storage strategy:</p>
<ul>
<li><code>PLAIN</code>: never compressed or moved (fixed-width types).</li>
<li><code>EXTENDED</code>: compress, then move out of line (the default for <code>text</code>, <code>jsonb</code>, <code>bytea</code>).</li>
<li><code>EXTERNAL</code>: move out of line without compressing, making substring operations fast.</li>
<li><code>MAIN</code>: compress, and move out only as a last resort.</li>
</ul>
<p>Compression uses <code>pglz</code> or <code>lz4</code> (<code>default_toast_compression</code>); PostgreSQL 19 makes <code>lz4</code> the default when the server is built with it. Two consequences matter in practice: reading a TOASTed value costs extra page reads, so <code>SELECT *</code> on a table with large documents is slow when you only need a few columns; and updating any part of a large value, such as one key in a big <code>jsonb</code> document, rewrites the whole value (Chapter 18).</p>

<h2>Fill factor and free space</h2>
<p>By default PostgreSQL fills heap pages completely (<code>fillfactor = 100</code>). For tables with frequent updates, leaving space (for example <code>fillfactor = 80</code>) lets an updated version stay on the same page, which enables heap-only tuple (HOT) updates that do not touch indexes (Chapter 14). B-tree indexes default to a fill factor of 90.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Storing ctid</strong> as a row identifier; it changes on update and after <code>VACUUM FULL</code> or <code>REPACK</code>.</li>
<li><strong>Ignoring per-row overhead</strong> when estimating table size.</li>
<li><strong><code>SELECT *</code> on tables with large TOASTed columns.</strong></li>
<li><strong>Interleaving booleans and bigints</strong> on very large tables.</li>
<li><strong>Default fill factor on hot-update tables,</strong> losing HOT updates.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Rows per page</summary><p>A row has a 24-byte header and 40 bytes of aligned data. How many fit in an 8 KB page, allowing 4 bytes per line pointer and a 24-byte page header?</p><p><em>Answer:</em> (8192 − 24) / (64 + 4) ≈ 120 rows.</p></details>
<details><summary>See the ctid move</summary><p>Select <code>ctid</code> for a row, update it, and select again. What changed and why?</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Measure padding</summary><p>Create the two tables of Figure 4.2, insert a million rows into each, and compare <code>pg_relation_size</code>.</p><p><em>Answer sketch:</em> the reordered table is about 25% smaller.</p></details>
<details><summary>TOAST cost</summary><p>Create a table with a 20 KB text column. Compare the time of <code>SELECT id</code> and <code>SELECT *</code> over 100,000 rows, and look at <code>pg_relation_size</code> of the TOAST table.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why line pointers?</summary><p>Explain how line pointers let PostgreSQL compact a page without updating any index, and what would break if indexes stored byte offsets.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can name the forks of a relation and what each is for.</li>
<li>I can draw a heap page: header, line pointers, free space, tuples.</li>
<li>I know what a ctid is and why it must not be stored.</li>
<li>I can list the tuple header fields and the per-row overhead.</li>
<li>I can order columns to minimise alignment padding.</li>
<li>I understand TOAST strategies and their performance effects.</li>
<li>I know when to lower fill factor.</li>
</ul>
`});

  const n = { sync: 'Before PostgreSQL 18, a backend that needed a page not in cache issued a read and waited. The operating system\'s read-ahead helped sequential scans, but each backend spent much of its time waiting.', worker: 'PostgreSQL 18 added asynchronous I/O. With the default <code>io_method = worker</code>, backends hand reads to a pool of I/O worker processes and continue; PostgreSQL 19 sizes the pool automatically between <code>io_min_workers</code> and <code>io_max_workers</code>.', uring: 'On Linux, <code>io_method = io_uring</code> submits reads directly through the kernel\'s io_uring interface, avoiding worker processes. Both methods help most on cloud block storage, where each read has high latency but high parallelism.' }[k];

CH.push({
  id: 'ch05', n: 5, title: 'The Buffer Manager and I/O',
  lede: 'Every page a query touches passes through the buffer manager, PostgreSQL\'s cache of 8 KB pages in shared memory. Its job is to keep the right pages in memory, share them safely among hundreds of processes, write changed pages back at the right time, and make reads from slow storage as cheap as possible. This chapter explains the buffer pool, the clock-sweep replacement algorithm, the relationship with the operating system cache, and the asynchronous I/O added in PostgreSQL 18.',
  html: `
<h2>The buffer pool</h2>
<p><code>shared_buffers</code> is an array of 8 KB slots in shared memory. Alongside it sit <strong>buffer descriptors</strong> (which page each slot holds, whether it is dirty, its pin count, usage count and locks) and the <strong>buffer mapping table</strong>, a hash table from a page's identity (relation, fork, block number) to the slot that holds it. You built hash tables in the data structures book; this one is partitioned into 128 parts, each with its own lock, so that many backends can look up pages concurrently.</p>
${fig('bufpath', '<b>Figure 5.1</b> What happens when a backend needs a page: a hash lookup, then either a hit or the eviction of a victim and a read.')}
<h3>Pins and content locks</h3>
<p>A backend <strong>pins</strong> a buffer while it uses it, so the page cannot be evicted, and takes a short <strong>content lock</strong> (shared to read, exclusive to modify) while it examines or changes the bytes. These are lightweight locks held for microseconds, quite separate from the row and table locks of Chapter 16.</p>

<h2>Choosing a victim: clock sweep</h2>
<p>When a page must be read and no buffer is free, the buffer manager must evict one. An exact least-recently-used list would need a global lock on every access, which does not scale. PostgreSQL uses the <strong>clock sweep</strong>, an approximation of LRU.</p>
${fig('clock', '<b>Figure 5.2</b> The clock sweep. The hand moves round the buffers, decrementing usage counts, until it finds an unpinned buffer with a count of zero.')}
<p>Each access increments the buffer's usage count, up to 5. Frequently used pages, such as the root and upper levels of busy B-trees, keep high counts and survive many sweeps; a page read once by a scan decays to zero quickly.</p>
<h3>Ring buffers</h3>
<p>A large sequential scan, a <code>VACUUM</code> or a bulk load would otherwise sweep useful pages out of the cache. For these operations PostgreSQL uses a small private <strong>ring</strong> of buffers (256 KB for scans, larger for bulk writes and vacuum), recycling them so that one big query cannot flush everyone else's working set. This is why a sequential scan of a table larger than a quarter of shared buffers does not warm the cache.</p>

<h2>Two caches: PostgreSQL and the operating system</h2>
<p>PostgreSQL reads and writes through the operating system's file system, so the kernel page cache also holds copies of database pages. A page may be in shared buffers, in the kernel cache, both, or neither. This "double buffering" is why the usual starting point is <code>shared_buffers</code> of about 25% of RAM, leaving the rest to the kernel. Tell the planner how much cache exists overall with <code>effective_cache_size</code> (commonly 50–75% of RAM); it allocates nothing but makes index scans look cheaper when their pages are likely cached.</p>
<p>On large dedicated servers, larger shared buffers (40% or more) can help, and huge pages (<code>huge_pages = on</code>) reduce memory-management overhead for big pools.</p>

<h2>Writing dirty pages</h2>
<p>A modified page is <em>dirty</em> until written back. Three processes write dirty pages:</p>
<ul>
<li>the <strong>checkpointer</strong>, which writes all dirty pages at each checkpoint, spread over time by <code>checkpoint_completion_target</code> (Chapter 6);</li>
<li>the <strong>background writer</strong>, which writes some dirty buffers ahead of the clock hand so backends find clean victims;</li>
<li><strong>backends themselves</strong>, when they find only dirty victims. This is the slow path and a sign the background writer or checkpoints need tuning.</li>
</ul>
<p>Before any dirty page is written, the WAL describing its changes must already be on durable storage. This write-ahead rule is the subject of the next chapter.</p>

<h2>Asynchronous I/O</h2>
${fig('aio', '<b>Figure 5.3</b> Synchronous reads compared with PostgreSQL 18\'s asynchronous I/O methods.')}
<p>PostgreSQL 17 introduced <em>read streams</em>, an internal interface through which scans announce which blocks they will need next. PostgreSQL 18 built asynchronous I/O on top of them, so sequential scans, bitmap heap scans and vacuum can have many reads in flight. The gain is largest on network-attached storage (cloud block volumes), where latency per read is high. <code>effective_io_concurrency</code> and <code>maintenance_io_concurrency</code> control how many reads may be in flight. PostgreSQL 19 adds an <code>IO</code> option to <code>EXPLAIN ANALYZE</code> to report asynchronous I/O activity.</p>

<h2>Measuring the cache</h2>
${code('Is the working set in memory?', 'sql')`
-- hits versus reads for the whole database since stats reset
SELECT datname, blks_hit, blks_read,
       round(100.0 * blks_hit / nullif(blks_hit + blks_read, 0), 2) AS hit_pct
FROM pg_stat_database WHERE datname = current_database();

-- what is in shared buffers right now, by relation
CREATE EXTENSION IF NOT EXISTS pg_buffercache;
SELECT c.relname, count(*) AS buffers, pg_size_pretty(count(*) * 8192) AS size,
       round(avg(b.usagecount), 1) AS avg_usage,
       sum(CASE WHEN b.isdirty THEN 1 ELSE 0 END) AS dirty
FROM pg_buffercache b JOIN pg_class c ON b.relfilenode = pg_relation_filenode(c.oid)
GROUP BY c.relname ORDER BY buffers DESC LIMIT 10;

-- I/O by backend type and context (PostgreSQL 16+)
SELECT backend_type, object, context, reads, writes, hits, evictions
FROM pg_stat_io WHERE reads > 0 OR writes > 0 ORDER BY reads DESC;`}
<p>In <code>EXPLAIN (ANALYZE, BUFFERS)</code> output, which shows buffer counts by default since PostgreSQL 18, <code>shared hit</code> means the page was in shared buffers and <code>read</code> means it came from the kernel or storage. A "read" may still have been fast if the kernel had it cached; only timing (<code>track_io_timing = on</code>) tells you.</p>
<p>A hit ratio of 99% sounds high, but means one access in a hundred goes to storage, which may dominate response time. Judge by I/O time and latency, not the ratio alone.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Setting shared_buffers to most of RAM,</strong> starving the kernel cache and work memory.</li>
<li><strong>Judging performance by hit ratio</strong> rather than I/O time.</li>
<li><strong>Benchmarking on a warm cache</strong> and being surprised in production after a restart (use <code>pg_prewarm</code> if needed).</li>
<li><strong>Ignoring backend writes</strong> in <code>pg_stat_io</code>, a sign of an overloaded background writer or too-frequent checkpoints.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Hit or read</summary><p>Run a query twice with <code>EXPLAIN (ANALYZE, BUFFERS)</code>. Compare <code>shared read</code> and <code>shared hit</code> between the runs.</p></details>
<details><summary>Run the sweep</summary><p>In Figure 5.2, how many steps would the hand take if every unpinned buffer had usage count 5?</p><p><em>Answer sketch:</em> up to five full rotations, decrementing each time, before one reaches zero.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Ring buffer effect</summary><p>Clear the cache (restart), scan a table larger than shared buffers, then check <code>pg_buffercache</code>. How many of its pages are cached, and why?</p><p><em>Answer sketch:</em> only about 32 pages (256 KB) from the ring.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Async I/O on cloud storage</summary><p>On a cloud volume, compare a cold sequential scan with <code>io_method</code> set to <code>sync</code> and <code>worker</code>, and with different <code>effective_io_concurrency</code> values. Plot throughput against concurrency.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can describe shared buffers, descriptors and the buffer mapping hash table.</li>
<li>I can explain pins, content locks and how they differ from row locks.</li>
<li>I can run the clock-sweep algorithm by hand and explain usage counts.</li>
<li>I know why ring buffers exist.</li>
<li>I can explain double buffering and set shared_buffers and effective_cache_size sensibly.</li>
<li>I know who writes dirty pages and what async I/O changed in PostgreSQL 18.</li>
</ul>
`});

CH.push({
  id: 'ch06', n: 6, title: 'Write-Ahead Logging and Durability',
  lede: 'Durability is a promise: once PostgreSQL says COMMIT, the change survives a crash, a power cut or a kernel panic. Writing every changed data page to disk at commit would be far too slow, because changes are scattered across files. Instead PostgreSQL writes a sequential log of changes first and the data pages later. This chapter explains the write-ahead log, checkpoints, crash recovery, full-page writes, the commit durability settings, and how the same log becomes backups, point-in-time recovery and replication.',
  html: `
<h2>The idea</h2>
<p>Every change to a data page is first described in a <strong>WAL record</strong> appended to the write-ahead log. At commit, only the log needs to reach durable storage, and appending to a log is sequential, which storage does well. Data pages are written later, in the background, in batches. If the server crashes, the log is replayed to bring the data files up to date. You met append-only logs in the data structures book; here the log is the source of truth and the tables are, in a sense, a cache of it.</p>
${fig('walrule', '<b>Figure 6.1</b> An update and commit, step by step. The client is told COMMIT when the log is durable, not when the data page is.')}
<p>The <strong>write-ahead rule</strong>: a data page may be written to disk only after all WAL records that changed it are on disk. Each page header stores the LSN of the last record that modified it, and the buffer manager flushes WAL up to that LSN before writing the page.</p>

<h2>LSNs, records and segments</h2>
<p>A <strong>log sequence number</strong> is a 64-bit byte position in the WAL stream, written like <code>0/3A1F28</code>. Records include a header (transaction ID, length, resource manager, CRC) and data describing the change: which page, which offset, what bytes. The log is stored in 16 MB segment files in <code>pg_wal/</code>, named by timeline and position. Old segments are recycled or removed after a checkpoint once they are no longer needed for recovery, archiving or replication.</p>
${code('Watching the log', 'sql')`
SELECT pg_current_wal_lsn();                      -- e.g. 2/9C3D5E80
SELECT pg_walfile_name(pg_current_wal_lsn());     -- 00000001000000020000009C

-- how much WAL did a statement generate?
EXPLAIN (ANALYZE, WAL) UPDATE accounts SET balance = balance + 1 WHERE branch = 12;
--   WAL: records=1204 fpi=96 bytes=812345

SELECT wal_records, wal_fpi, wal_bytes, wal_buffers_full FROM pg_stat_wal;`}

<h2>Checkpoints</h2>
<p>Without checkpoints, recovery would have to replay the log from the beginning of time. A <strong>checkpoint</strong> writes all dirty buffers to the data files, then writes a checkpoint record; recovery can start from the checkpoint's <em>redo point</em>. WAL before that point is no longer needed for crash recovery.</p>
<p>Checkpoints are triggered every <code>checkpoint_timeout</code> (default 5 minutes) or when WAL since the last one reaches <code>max_wal_size</code> (default 1 GB). The writes are spread over <code>checkpoint_completion_target</code> (default 0.9) of the interval to avoid I/O spikes. Frequent checkpoints cost write I/O and full-page images; infrequent ones mean longer crash recovery and more WAL on disk. Busy systems commonly use 15–30 minutes and a <code>max_wal_size</code> of tens of gigabytes. The log message "checkpoints are occurring too frequently" means <code>max_wal_size</code> is too small.</p>

<h2>Crash recovery and torn pages</h2>
${fig('recovery', '<b>Figure 6.2</b> Crash recovery replays the log from the last checkpoint\'s redo point. Full-page images repair pages that were only partly written.')}
<p>A database page is 8 KB but storage may only guarantee atomic writes of 4 KB or 512 bytes. If power fails mid-write, a page can be <em>torn</em>: half new, half old. A WAL record that changes a few bytes cannot fix a page whose other bytes are garbage. So, with <code>full_page_writes = on</code> (the default and the safe choice), the first modification of each page after a checkpoint logs a complete image of the page. Recovery restores the image, then applies later records.</p>
<p>Full-page images are a large share of WAL volume, especially just after checkpoints and with random writes (Figure 3.3's UUID problem again). <code>wal_compression</code> (with <code>lz4</code> or <code>zstd</code>) shrinks them; PostgreSQL 19 reports full-page image bytes in <code>pg_stat_wal</code>, <code>EXPLAIN (ANALYZE, WAL)</code> and vacuum logs.</p>
<h3>Checksums</h3>
<p>Data checksums detect corruption caused by storage, controllers or memory when a page is read. Since PostgreSQL 18, <code>initdb</code> enables them by default. They cost a little CPU and increase WAL slightly (hint-bit changes must be logged). Existing clusters can enable them offline with <code>pg_checksums</code>.</p>

<h2>Commit durability settings</h2>
<p><code>synchronous_commit</code> controls what COMMIT waits for:</p>
${fig('synccommit', '<b>Figure 6.3</b> What each level waits for, and roughly what it costs. Real numbers depend on storage and network.')}
<ul>
<li><code>off</code>: return before the WAL is flushed. The database stays consistent after a crash, but the most recent commits (up to three times <code>wal_writer_delay</code>) may be lost. Acceptable for some analytics or logging; never for payments.</li>
<li><code>local</code>: wait for the local flush only, even if synchronous replicas are configured.</li>
<li><code>on</code> (default): wait for the local flush, and for synchronous standbys to flush too, if any are configured.</li>
<li><code>remote_write</code>: wait until the standby has received and written the WAL (to its OS), not flushed it.</li>
<li><code>remote_apply</code>: wait until the standby has replayed it, so a read on the standby sees the change.</li>
</ul>
<p>The setting can be changed per transaction (<code>SET LOCAL synchronous_commit = off</code>), so a system can keep payments fully durable while relaxing an audit-log insert. Concurrent commits share one flush (<em>group commit</em>), which is why throughput rises with concurrency even though each flush has a fixed cost. <strong>Never set <code>fsync = off</code></strong> on data you care about: a crash can then corrupt the whole cluster, not just lose recent commits.</p>

<h2>The log as a backup and a replication stream</h2>
<p>Because the WAL describes every change, it is also how PostgreSQL does backups and replication:</p>
<ul>
<li><strong>Base backup plus WAL archive:</strong> <code>pg_basebackup</code> copies the data files while the server runs; <code>archive_command</code> or <code>archive_library</code> copies each completed WAL segment to safe storage. Restoring the base backup and replaying archived WAL gives <strong>point-in-time recovery</strong> to any moment, for example one second before a mistaken <code>DELETE</code>.</li>
<li><strong>Incremental backups</strong> (PostgreSQL 17): with <code>summarize_wal = on</code>, <code>pg_basebackup --incremental</code> copies only changed blocks, and <code>pg_combinebackup</code> reconstructs a full backup. Tools such as pgBackRest and Barman add compression, encryption, parallelism and retention management.</li>
<li><strong>Streaming replication:</strong> standbys receive WAL over the network and replay it continuously (Chapter 22).</li>
</ul>
<p>The <code>wal_level</code> setting controls how much is logged: <code>replica</code> (the default) supports archiving and physical replication; <code>logical</code> adds information for logical decoding. PostgreSQL 19 raises the effective level to logical automatically when the first logical replication slot is created.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong><code>fsync = off</code> or disabling full-page writes</strong> for speed.</li>
<li><strong>Storage that lies about flushes</strong> (write caches without battery or capacitor backing). Test with <code>pg_test_fsync</code>.</li>
<li><strong>Tiny <code>max_wal_size</code>,</strong> causing frequent checkpoints and WAL bloat from full-page images.</li>
<li><strong>Backups without tested restores,</strong> or without the WAL needed to make them consistent.</li>
<li><strong>Running out of disk in <code>pg_wal</code></strong> because archiving is failing or a replication slot is abandoned.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>WAL per statement</summary><p>Use <code>EXPLAIN (ANALYZE, WAL)</code> on an update of 10,000 rows immediately after a <code>CHECKPOINT</code> and again a moment later. Why does the second generate less WAL?</p><p><em>Answer:</em> the first run logs full-page images for each page touched for the first time after the checkpoint.</p></details>
<details><summary>Explain the rule</summary><p>Explain in two sentences why a dirty page must not be written before its WAL.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Point-in-time recovery</summary><p>Set up WAL archiving on a test server, take a base backup, insert rows, note the time, delete them, then restore to the noted time using <code>recovery_target_time</code>.</p></details>
<details><summary>Commit cost</summary><p>Use <code>pgbench</code> with single-row inserts at <code>synchronous_commit</code> on and off, at 1 and 32 clients. Explain the results with group commit.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Checkpoint tuning</summary><p>From <code>pg_stat_checkpointer</code> and WAL volume, choose <code>checkpoint_timeout</code> and <code>max_wal_size</code> for a system writing 50 MB of WAL per second, with a recovery time objective of 5 minutes.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain the write-ahead rule and why it makes commits fast and durable.</li>
<li>I know what an LSN, a WAL record and a segment are.</li>
<li>I can explain checkpoints, the redo point, and how to tune their frequency.</li>
<li>I can walk through crash recovery and explain full-page writes and torn pages.</li>
<li>I can choose synchronous_commit levels per workload.</li>
<li>I know how WAL enables PITR, incremental backup and replication.</li>
</ul>
`});

/* ===================== Chapter 7: B-tree indexes ===================== */
const bptree = (keys, MAX = 3) => {
  // returns list of snapshots {root, note}
  const mkLeaf = () => ({ leaf: true, keys: [] }), snaps = [];
  let root = mkLeaf();
  const clone = n => n.leaf ? { leaf: true, keys: n.keys.slice(), hot: n.hot } : { leaf: false, keys: n.keys.slice(), kids: n.kids.map(clone), hot: n.hot };
  const clear = n => { n.hot = false; if (!n.leaf) n.kids.forEach(clear); };
  const ins = (n, k) => {
    if (n.leaf) { n.keys.push(k); n.keys.sort((a, b) => a - b); n.hot = true; if (n.keys.length > MAX) { const r = mkLeaf(); r.keys = n.keys.splice(2); r.hot = true; return [r.keys[0], r]; } return null; }
    let i = 0; while (i < n.keys.length && k >= n.keys[i]) i++;
    const sp = ins(n.kids[i], k); if (!sp) return null;
    n.keys.splice(i, 0, sp[0]); n.kids.splice(i + 1, 0, sp[1]); n.hot = true;
    if (n.keys.length > MAX) { const mid = n.keys[2], r = { leaf: false, keys: n.keys.splice(3), kids: n.kids.splice(3), hot: true }; n.keys.splice(2, 1); return [mid, r]; }
    return null;
  };
  snaps.push({ root: clone(root), note: 'An empty B-tree index. Each node here holds at most three keys (a real 8 KB page holds hundreds). Leaves hold the indexed values and point to heap rows.' });
  keys.forEach(k => { clear(root); const sp = ins(root, k); let split = !!sp; if (sp) { const nr = { leaf: false, keys: [sp[0]], kids: [root, sp[1]], hot: true }; root = nr; }
    const leaves = []; (function L(n) { if (n.leaf) leaves.push(n); else n.kids.forEach(L); })(root);
    snaps.push({ root: clone(root), note: `Insert <b>${k}</b>.` + (split ? ' A node overflowed and split; the separator moved up' + (root.keys.length === 1 && root.hot && !root.kids[0].hot ? '' : '') + '. The tree grows only at the root, so all leaves stay at the same depth.' : ' It fits in an existing leaf.') }); });
  return snaps;
};
FIG.btree = host => {
  const snaps = bptree([10, 20, 30, 40, 50, 25, 35, 5, 45, 60, 55]);
  stepper(host, snaps, f => {
    const conv = n => ({ label: n.keys.join(' · ') || '∅', w: Math.max(56, n.keys.length * 30 + 16), cls: n.hot ? 'hot' : n.leaf ? 'ok' : 'acc', kids: n.leaf ? [] : n.kids.map(conv) });
    const r = gtree(conv(f.root), { nw: 100, nh: 30, dx: 108, dy: 64, small: true, px: 10 });
    let s = r.s; const leaves = []; (function L(n, d) { if (!n.kids || !n.kids.length) leaves.push(d); else n.kids.forEach(c => L(c, d + 1)); })(conv(f.root), 0);
    return { s, w: r.w + 10, h: Math.max(r.h, 220) };
  });
};

CH.push({
  id: 'ch07', n: 7, title: 'B-tree Indexes',
  lede: 'You built B-trees in the data structures book. PostgreSQL\'s default index is a B+tree adapted for disk pages and heavy concurrency: wide nodes so lookups touch three or four pages, sibling links so readers and writers rarely block each other, deduplication and suffix truncation to stay small, and an interplay with MVCC that decides when an index alone can answer a query. This chapter shows how B-tree indexes work inside PostgreSQL and how to design them: column order, covering columns, sort order and the new skip scan.',
  html: `
<h2>From the textbook tree to the disk tree</h2>
<p>A B-tree index in PostgreSQL (the <code>nbtree</code> access method) is a B+tree: all index entries live in the leaves, which are linked left to right; internal pages hold separator keys and downlinks. Each node is an 8 KB page. With keys of 16 bytes plus an 8-byte entry header and a 4-byte line pointer, a page holds a few hundred entries, so the fan-out is in the hundreds. A three-level tree indexes tens of millions of rows; four levels, billions. The root and upper levels are hot in the buffer cache, so a lookup usually costs one or two actual reads.</p>
${fig('btree', '<b>Figure 7.1</b> Inserting keys into a small B+tree. Watch leaves fill, split, and push separators upward until the root splits and the tree gains a level.')}
<p>Each leaf entry is the key plus a <strong>TID</strong> (the heap tuple's ctid). Because the index points to a physical tuple version, an update that creates a new version normally needs a new index entry in every index on the table, even if the indexed column did not change, unless the update is a HOT update (Chapter 14).</p>

<h2>Concurrency: the Lehman–Yao design</h2>
${fig('lehman', '<b>Figure 7.2</b> Each page has a right-link to its sibling and a high key, the upper bound of keys it may hold.')}
<p>A naive B-tree must lock the path from root to leaf during an insert, in case a split propagates upward. PostgreSQL implements Lehman and Yao's design: every page has a link to its right sibling and a <em>high key</em>. A split first moves the upper half of a page to a new right sibling and links it, then inserts the separator into the parent. A reader that descended to the old page before the parent was updated sees that its search key exceeds the high key, and simply follows the right-link. Readers hold only one page lock at a time, and writers rarely block readers.</p>

<h2>Keeping the tree small</h2>
<ul>
<li><strong>Deduplication</strong> (PostgreSQL 13): many entries with the same key are merged into one key with a list of TIDs. Indexes on low-cardinality columns, or on columns with many versions of the same key, shrink dramatically.</li>
<li><strong>Suffix truncation</strong> (PostgreSQL 12): separator keys in internal pages keep only the leading columns needed to separate the halves.</li>
<li><strong>Bottom-up deletion</strong> (PostgreSQL 14): before splitting a leaf because of version churn, the index removes entries pointing to dead tuples.</li>
<li><strong>Fill factor</strong> 90 by default leaves room in leaves for later inserts; for append-only keys PostgreSQL splits the rightmost page unevenly so pages stay full.</li>
</ul>

<h2>What a B-tree can do</h2>
<p>B-trees support equality and range comparisons (<code>=</code>, <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;=</code>, <code>&gt;</code>, <code>BETWEEN</code>, <code>IN</code>), <code>IS NULL</code>, prefix matching with <code>LIKE 'abc%'</code> (under the C collation or with <code>text_pattern_ops</code>), and ordered output: an index can satisfy <code>ORDER BY</code> and <code>ORDER BY ... LIMIT</code> without sorting, scanning forwards or backwards. They are the only index type that can enforce <code>UNIQUE</code> (apart from GiST exclusion constraints).</p>

<h2>Multicolumn indexes</h2>
${fig('multi', '<b>Figure 7.3</b> Entries of an index on (account_id, created_at) and which ones each query must examine. Red entries match; amber entries are examined but rejected.')}
<p>A multicolumn index is sorted by the first column, then the second within each value of the first, like a phone book sorted by surname then first name. Design rules:</p>
<ol>
<li>Put columns used with <strong>equality</strong> first, then the column used for a <strong>range</strong> or <strong>ORDER BY</strong>.</li>
<li>Only one range condition can bound the scan; conditions on later columns are checked while scanning, not used to skip.</li>
<li>An index on (a, b) also serves queries on a alone, so you rarely need a separate index on a.</li>
<li>Match sort directions for mixed orders: <code>ORDER BY account_id, created_at DESC</code> needs an index on <code>(account_id, created_at DESC)</code> or a backward scan of <code>(account_id DESC, created_at)</code>.</li>
</ol>
<p>PostgreSQL 18's <strong>skip scan</strong> relaxes rule 3's converse: an index on (a, b) can now serve a condition on b alone when a has few distinct values, by descending once per value of a. It does not replace a well-designed index for frequent queries.</p>

<h2>Index-only scans and covering indexes</h2>
${fig('ios', '<b>Figure 7.4</b> An index-only scan consults the visibility map to avoid visiting heap pages known to be all-visible.')}
<p>If every column a query needs is in the index, PostgreSQL can use an <strong>index-only scan</strong>, skipping heap pages that the visibility map marks all-visible. To make an index cover a query without changing its sort key, add payload columns with <code>INCLUDE</code>; they are stored in leaf entries but not in internal pages and do not affect uniqueness.</p>
${code('Designing for a hot query', 'sql')`
-- the query: latest 20 payments for an account, showing amount and status
SELECT id, amount, status, created_at
FROM payments
WHERE account_id = $1
ORDER BY created_at DESC
LIMIT 20;

-- equality column first, then the ORDER BY column (with matching direction),
-- then the other selected columns as payload so the heap is rarely touched
CREATE INDEX CONCURRENTLY payments_acct_created_idx
    ON payments (account_id, created_at DESC)
    INCLUDE (id, amount, status);

EXPLAIN (ANALYZE) SELECT ...;
--  Limit  (actual rows=20 loops=1)
--    ->  Index Only Scan using payments_acct_created_idx on payments
--          Index Cond: (account_id = 42)
--          Heap Fetches: 0
--          Buffers: shared hit=5`}

<h2>The cost of indexes</h2>
<p>Every index must be updated on every insert, on every non-HOT update and is scanned by vacuum. Each index also uses cache space that could hold table pages. A table with fifteen indexes may write five times more than one with three. Review regularly:</p>
${code('Find unused and duplicate indexes', 'sql')`
SELECT s.relname AS table, s.indexrelname AS index, s.idx_scan,
       pg_size_pretty(pg_relation_size(s.indexrelid)) AS size
FROM pg_stat_user_indexes s
JOIN pg_index i ON i.indexrelid = s.indexrelid
WHERE s.idx_scan = 0 AND NOT i.indisunique
ORDER BY pg_relation_size(s.indexrelid) DESC;`}
<p>Build and rebuild indexes on live tables with <code>CREATE INDEX CONCURRENTLY</code> and <code>REINDEX CONCURRENTLY</code>, which avoid blocking writes at the cost of two table scans. A failed concurrent build leaves an <code>INVALID</code> index that must be dropped.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Wrong column order:</strong> the range column before the equality column.</li>
<li><strong>A separate index for every column</strong> instead of one multicolumn index that matches the query.</li>
<li><strong>Functions on indexed columns</strong> (<code>WHERE lower(email) = ...</code> or <code>WHERE created_at::date = ...</code>) that the plain index cannot serve; use an expression index or rewrite as a range (Chapter 8).</li>
<li><strong>Expecting index-only scans</strong> on tables where vacuum lags.</li>
<li><strong>Building indexes without CONCURRENTLY</strong> on production tables, blocking writes.</li>
<li><strong>Keeping unused indexes</strong> that slow every write.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Depth estimate</summary><p>An index has 300 entries per page. How many levels does it need for 50 million rows?</p><p><em>Answer:</em> 300² = 90,000 and 300³ = 27 million, so four levels (root, two internal, leaf).</p></details>
<details><summary>Continue the insertions</summary><p>In Figure 7.1, insert 15, 52 and 58 by hand. Which nodes split?</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Design the index</summary><p>Design one index for: <code>WHERE merchant_id = $1 AND status = 'settled' AND created_at &gt;= $2 ORDER BY created_at</code>.</p><p><em>Answer sketch:</em> (merchant_id, status, created_at); both equality columns first, then the range and order column.</p></details>
<details><summary>Heap fetches</summary><p>Create a covering index, run an index-only query and note Heap Fetches. Update 20% of rows, run again, then VACUUM and run once more. Explain the three numbers.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why right-links work</summary><p>Construct an interleaving of a reader and a splitting writer that would return a wrong result without right-links, and show how the high key check prevents it.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain PostgreSQL's B+tree structure, fan-out and depth.</li>
<li>I can describe splits and how Lehman–Yao right-links enable concurrency.</li>
<li>I know deduplication, suffix truncation and bottom-up deletion.</li>
<li>I can design multicolumn indexes: equality first, then range or order.</li>
<li>I know when PostgreSQL 18 skip scan helps.</li>
<li>I can build covering indexes and explain the visibility map's role.</li>
<li>I can weigh the write cost of indexes and find unused ones.</li>
</ul>
`});
