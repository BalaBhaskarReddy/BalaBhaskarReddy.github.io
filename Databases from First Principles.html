CH.push({
  id: 'ch14', n: 14, title: 'Multi-Version Concurrency Control',
  lede: 'How can hundreds of transactions read and write the same tables without readers blocking writers or writers blocking readers? PostgreSQL\'s answer is multi-version concurrency control: an update never overwrites a row, it creates a new version, and each transaction sees the versions that were committed when its snapshot was taken. This chapter explains transaction IDs, tuple versions, snapshots and the visibility rules, then the consequences: HOT updates, the visibility map, and the dead versions that vacuum must clean up.',
  html: `
<h2>The core idea</h2>
<p>A lock-based database makes readers wait while a row is being changed. PostgreSQL instead keeps several versions of a row at once. Each version records which transaction created it (<code>xmin</code>) and which transaction deleted or replaced it (<code>xmax</code>). A transaction reading the table checks each version against its <strong>snapshot</strong> and sees only those that were committed, and not yet deleted, as of that snapshot. Readers never block writers; writers never block readers. Writers still block other writers of the same row (Chapter 16).</p>
${fig('versions', '<b>Figure 14.1</b> An update creates a new version. Different snapshots see different versions; old versions linger until no one can see them.')}
<ul>
<li><strong>INSERT</strong> creates a version with xmin = the inserting transaction.</li>
<li><strong>DELETE</strong> sets xmax on the current version; nothing is removed.</li>
<li><strong>UPDATE</strong> is a delete plus an insert: xmax on the old version, a new version with xmin, and a ctid chain from old to new.</li>
<li><strong>ROLLBACK</strong> does nothing to the table: the transaction is marked aborted in the commit log, which makes all its versions invisible. This is why rollback in PostgreSQL is instant, however large the transaction.</li>
</ul>

<h2>Transaction IDs and the commit log</h2>
<p>A transaction that writes is assigned a 32-bit transaction ID (XID) from a global counter; read-only transactions get only a virtual ID and consume none. The fate of each XID, in progress, committed or aborted, is kept in the commit log, <code>pg_xact</code>, two bits per transaction. To avoid looking it up on every read, the first reader to learn a version's inserter has committed or aborted sets <em>hint bits</em> in the tuple header. Setting hint bits dirties the page, which is why the first read after a bulk load can cause writes.</p>
<p>Thirty-two bits give about 4 billion IDs, which a busy system can exhaust in weeks. IDs are compared modulo 2³², so each XID sees about 2 billion IDs as past and 2 billion as future. Old versions must be <strong>frozen</strong>, marked as visible to everyone regardless of XID, before they are 2 billion transactions old, or they would suddenly appear to be in the future. Freezing is vacuum's job, and wraparound protection is one of the most important operational topics in PostgreSQL (Chapter 17).</p>

<h2>Snapshots</h2>
<p>A snapshot records which transactions' effects are visible. It contains:</p>
<ul>
<li><strong>xmin:</strong> the oldest XID still running when the snapshot was taken; everything older has finished.</li>
<li><strong>xmax:</strong> one past the newest XID assigned; anything at or above it started later and is invisible.</li>
<li><strong>xip:</strong> the list of XIDs between them that were still in progress.</li>
</ul>
${code('See your snapshot', 'sql')`
BEGIN ISOLATION LEVEL REPEATABLE READ;
SELECT pg_current_snapshot();           -- e.g. 118:135:125,130
SELECT pg_current_xact_id_if_assigned(); -- NULL until this transaction writes
SELECT xmin, xmax, ctid, * FROM accounts WHERE id = 7;
COMMIT;`}
<p>A version is visible to a snapshot if its inserter committed before the snapshot and its deleter did not. Try the rule:</p>
${fig('vis', '<b>Figure 14.2</b> A visibility checker. Enter a tuple\'s xmin and xmax and a snapshot, and see whether the version is visible and why.')}
<p>When the snapshot is taken depends on the isolation level: each statement takes a new one under Read Committed; the first statement's snapshot lasts the whole transaction under Repeatable Read and Serializable (Chapter 15). Snapshot creation reads the proc array of running transactions; with thousands of connections this was once a bottleneck, much improved in PostgreSQL 14.</p>

<h2>Consequences of versioning</h2>
<h3>Every update writes a whole new row</h3>
<p>Changing one integer in a 500-byte row writes a new 500-byte version (plus WAL). Wide, frequently updated rows are expensive. Split rarely-changing wide data from hot counters into separate tables if updates dominate.</p>
<h3>Indexes and HOT</h3>
${fig('hot', '<b>Figure 14.3</b> Ordinary updates add entries to every index; heap-only tuple (HOT) updates avoid touching indexes when no indexed column changes and the page has room.')}
<p>Watch the HOT ratio: <code>n_tup_hot_upd / n_tup_upd</code> in <code>pg_stat_user_tables</code>. A low ratio on an update-heavy table suggests an index on a frequently updated column (consider whether it is needed) or full pages (lower fill factor).</p>
<h3>The visibility map</h3>
<p>A page whose tuples are all visible to everyone is marked all-visible in the visibility map. Index-only scans skip such pages (Chapter 7), and vacuum skips them too. Any change to the page clears the bit; vacuum sets it again. PostgreSQL 19 also lets ordinary table scans set pages all-visible as they read them, reducing vacuum's work.</p>
<h3>Dead versions and bloat</h3>
<p>Old versions remain until no snapshot can see them. The oldest snapshot in the system, including long-running transactions, idle-in-transaction sessions, replication slots and standbys with <code>hot_standby_feedback</code>, sets the <em>xmin horizon</em>; nothing newer than it can be cleaned. One forgotten open transaction can make every table grow. Chapter 17 covers vacuum and how to watch the horizon.</p>

<h2>MVCC compared</h2>
<p>Oracle and MySQL's InnoDB also use multiversioning, but keep the latest version in place and older versions in an undo log; readers reconstruct old versions from undo. PostgreSQL keeps all versions in the table itself. Its approach makes rollback instant and avoids undo-log contention, at the cost of table bloat and the need for vacuum. Proposals for an undo-based storage engine (zheap) and the table access method API (since PostgreSQL 12) aim to make alternatives possible.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Long-running or idle-in-transaction sessions</strong> that hold back cleanup everywhere. Set <code>idle_in_transaction_session_timeout</code>.</li>
<li><strong>Updating a wide row frequently</strong> to change one counter.</li>
<li><strong>Indexing columns that change on every update,</strong> such as <code>updated_at</code>, preventing HOT updates.</li>
<li><strong>Assuming row counts are cheap:</strong> <code>count(*)</code> must check visibility of every version, so it scans the table or an index; use estimates (<code>pg_class.reltuples</code>) when exactness is not needed.</li>
<li><strong>Expecting ROLLBACK to undo work slowly,</strong> or COMMIT to write the data pages: it does neither.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Watch the versions</summary><p>Select <code>xmin, xmax, ctid</code> for a row; update it twice in separate transactions; select again. Use <code>pageinspect</code> to see the dead versions still on the page.</p></details>
<details><summary>Use the checker</summary><p>In Figure 14.2, set xmin = 140 with the default snapshot. Why is it invisible? Then set xmax = 125 with xmin = 100. Why is it visible?</p><p><em>Answer:</em> 140 ≥ snapshot xmax (started later); 125 is in progress, so the delete has not happened for this snapshot.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Two sessions</summary><p>In session 1, begin a repeatable read transaction and read a row. In session 2, update and commit it. Read again in session 1, then in a new transaction. Explain with snapshots.</p></details>
<details><summary>HOT ratio</summary><p>Find the tables with the lowest HOT ratio and most updates. For one, identify which index blocks HOT and test the effect of dropping it or lowering fill factor.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Horizon hunting</summary><p>Write a query that finds what holds back the xmin horizon: oldest <code>backend_xmin</code> in <code>pg_stat_activity</code>, replication slots' <code>xmin</code> and <code>catalog_xmin</code>, and prepared transactions.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain how INSERT, UPDATE, DELETE and ROLLBACK work with versions.</li>
<li>I know what XIDs, the commit log and hint bits are, and why freezing is needed.</li>
<li>I can describe a snapshot and apply the visibility rule.</li>
<li>I understand HOT updates and how to keep them happening.</li>
<li>I know what the visibility map does and what holds back cleanup.</li>
</ul>
`});

CH.push({
  id: 'ch15', n: 15, title: 'Isolation Levels and Anomalies',
  lede: 'MVCC gives each transaction a snapshot, but which snapshot, and what happens when two transactions change related data, depends on the isolation level. Choosing too weak a level produces subtle, rare, expensive bugs: lost deposits, double spending, broken invariants. This chapter defines the anomalies precisely, shows what PostgreSQL\'s three levels prevent, explains how Serializable Snapshot Isolation works, and shows how to write applications that retry correctly.',
  html: `
<h2>What isolation means</h2>
<p>The ideal is <strong>serializability</strong>: the result of running transactions concurrently is the same as running them one at a time in some order. Weaker levels trade correctness guarantees for concurrency and simplicity. The SQL standard defines levels by the anomalies they forbid; PostgreSQL implements three levels with stronger guarantees than the standard requires.</p>

<h2>The anomalies</h2>
${fig('anom', '<b>Figure 15.1</b> Four anomalies as interleavings of two transactions. Each tab shows what goes wrong and which level prevents it.')}
<p>A <strong>dirty read</strong> (seeing another transaction's uncommitted data) never happens in PostgreSQL at any level: MVCC simply does not show uncommitted versions.</p>

<h2>PostgreSQL's three levels</h2>
${fig('levels', '<b>Figure 15.2</b> Which anomalies each PostgreSQL isolation level allows.')}
<h3>Read Committed (default)</h3>
<p>Each statement sees a snapshot taken when the statement starts. If an <code>UPDATE</code> or <code>DELETE</code> finds a row that a concurrent transaction is changing, it waits for that transaction; if it committed, the statement re-evaluates its <code>WHERE</code> clause against the new version and proceeds. This makes single-statement updates like <code>SET balance = balance + 50</code> safe, but the re-check sees only the target row, not other rows the statement read, which can produce surprising results in complex statements. Good for most simple OLTP; dangerous for multi-statement logic that reads, decides, then writes.</p>
<h3>Repeatable Read</h3>
<p>One snapshot for the whole transaction, taken at its first statement. This is <em>snapshot isolation</em>. Reads are stable, and phantoms never appear. If the transaction tries to update a row that a concurrent transaction has changed and committed since the snapshot, it fails with <code>40001 could not serialize access due to concurrent update</code>, preventing lost updates. It still permits <strong>write skew</strong>, where two transactions read overlapping data and write different rows. Ideal for consistent reports and read-only analysis.</p>
<h3>Serializable</h3>
<p>Repeatable Read plus <strong>Serializable Snapshot Isolation</strong>, which detects dangerous patterns of read/write dependencies and aborts a transaction to break them. It guarantees serializability without blocking readers.</p>
${fig('ssi', '<b>Figure 15.3</b> How SSI detects write skew: reads are recorded as SIRead locks; a cycle of read-write dependencies between concurrent transactions causes one to abort.')}
<p>SSI can abort transactions that would in fact have been safe (false positives), especially when it must summarise many fine-grained locks into page or relation locks to save memory. Keep serializable transactions short, declare read-only ones <code>READ ONLY</code> (they can use a safe snapshot and are never aborted with <code>DEFERRABLE</code>), and use indexes so that predicate locks cover few rows rather than whole tables.</p>

<h2>Choosing a level</h2>
<div class="tbl"><table><tr><th>Situation</th><th>Approach</th></tr>
<tr><td>Single-statement updates and inserts</td><td>Read Committed is safe; write the logic in SQL (<code>SET x = x + 1</code>, <code>INSERT ... ON CONFLICT</code>)</td></tr>
<tr><td>Read, decide, write one row</td><td><code>SELECT ... FOR UPDATE</code> under Read Committed, or Repeatable Read with retry</td></tr>
<tr><td>Invariants across several rows or tables (limits, double booking, sum of balances)</td><td>Serializable with retry; or an explicit lock on a parent row; or a constraint (EXCLUDE, CHECK on a balance row)</td></tr>
<tr><td>Consistent multi-query report</td><td>Repeatable Read, <code>READ ONLY</code></td></tr>
<tr><td>Long analytical query on a replica</td><td>Repeatable Read; consider replica conflicts (Chapter 22)</td></tr>
</table></div>
<p>Many teams make Serializable the default for transactions that enforce business rules, because it removes a whole class of reasoning errors, and accept retries. The cost is usually modest if transactions are short.</p>

<h2>Retrying correctly</h2>
<p>Any application using Repeatable Read or Serializable must retry on <code>40001</code> (serialization failure) and should also retry on <code>40P01</code> (deadlock detected). Retry the <em>whole transaction</em>, including the reads, because the decision may change. Do not retry blindly after a commit attempt whose outcome is unknown (a lost connection during COMMIT); use idempotency keys for that.</p>
${code('A transaction retry loop in Java (JDBC)', 'java')`
public <T> T inSerializableTx(DataSource ds, SqlWork<T> work) throws SQLException {
    for (int attempt = 1; ; attempt++) {
        try (Connection c = ds.getConnection()) {
            c.setAutoCommit(false);
            c.setTransactionIsolation(Connection.TRANSACTION_SERIALIZABLE);
            try {
                T result = work.run(c);          // all reads and writes happen in here
                c.commit();
                return result;
            } catch (SQLException e) {
                c.rollback();
                String state = e.getSQLState();
                boolean retryable = "40001".equals(state) || "40P01".equals(state);
                if (!retryable || attempt >= 5) throw e;
                Thread.sleep((long) (Math.random() * 20 * attempt));   // jittered back-off
            }
        } catch (InterruptedException ie) {
            Thread.currentThread().interrupt();
            throw new SQLException("interrupted", ie);
        }
    }
}`}
<p>With Spring, <code>@Transactional(isolation = Isolation.SERIALIZABLE)</code> sets the level, but retries need a separate mechanism (for example a retry template around the transactional method, not inside it).</p>

<h2>Idempotency: the other half of correctness</h2>
<p>Networks fail. A client that sends a payment and loses the connection before hearing COMMIT does not know whether it happened. Give each request an idempotency key, store it with a unique constraint in the same transaction as the effect, and on retry return the stored result. PostgreSQL 19's <code>INSERT ... ON CONFLICT DO SELECT ... RETURNING</code> makes "get or create" a single statement.</p>
${code('Idempotent payment creation', 'sql')`
CREATE TABLE payment_requests (
    idempotency_key uuid PRIMARY KEY,
    payment_id      uuid NOT NULL,
    created_at      timestamptz NOT NULL DEFAULT now()
);

-- PostgreSQL 19: returns the existing row if the key was already used
INSERT INTO payment_requests (idempotency_key, payment_id)
VALUES ($1, $2)
ON CONFLICT (idempotency_key) DO SELECT
RETURNING payment_id;`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Read-check-write in application code under Read Committed</strong> without locking.</li>
<li><strong>Assuming Repeatable Read prevents all anomalies:</strong> it allows write skew.</li>
<li><strong>Using Serializable without retry logic.</strong></li>
<li><strong>Retrying only the failed statement</strong> instead of the whole transaction.</li>
<li><strong>Long serializable transactions,</strong> which raise abort rates and memory for predicate locks.</li>
<li><strong>No idempotency keys</strong> on externally triggered money movements.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>

<details><summary>Why SSI aborts</summary><p>Explain why SSI needs a cycle of two rw-antidependencies between concurrent transactions ("dangerous structure"), and why a single rw-dependency is harmless.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can define serializability and the anomalies: dirty read, non-repeatable read, phantom, lost update, write skew.</li>
<li>I know what each PostgreSQL isolation level prevents and how it behaves on conflict.</li>
<li>I can explain how SSI detects write skew.</li>
<li>I can choose a level or locking strategy for each situation.</li>
<li>I can write correct retry loops and idempotent operations.</li>
</ul>
`});

CH.push({
  id: 'ch16', n: 16, title: 'Locks and Concurrency',
  lede: 'MVCC lets readers and writers coexist, but writers of the same row must still take turns, schema changes must exclude everyone, and applications sometimes need to coordinate explicitly. PostgreSQL has several kinds of lock: table-level locks with eight modes, row-level locks stored in the tuples themselves, advisory locks for application use, and predicate locks for serializable transactions. This chapter explains each, the lock queue that turns a quick ALTER TABLE into an outage, deadlocks, and patterns such as job queues with SKIP LOCKED.',
  html: `
<h2>Table-level locks</h2>
<p>Every statement takes a lock on each table it touches, in one of eight modes. Most modes conflict with few others, so ordinary reads and writes coexist; the strongest, ACCESS EXCLUSIVE, conflicts with everything, including plain SELECT.</p>
${fig('lockmatrix', '<b>Figure 16.1</b> Which table lock modes conflict (×), and which commands take each mode.')}
<p>Locks are held until the end of the transaction, not the statement. A DDL statement in a long transaction keeps its strong lock for the whole transaction. You can see locks and who is waiting in <code>pg_locks</code>; PostgreSQL 19 adds <code>pg_stat_lock</code> with per-lock-type statistics and enables <code>log_lock_waits</code> by default.</p>

<h2>The lock queue</h2>
${fig('lockq', '<b>Figure 16.2</b> How a waiting ALTER TABLE blocks all later queries, and how a lock timeout prevents the outage.')}
<p>This is the most common way PostgreSQL deployments cause outages. Rules for schema changes on busy tables:</p>
<ul>
<li>Always <code>SET lock_timeout</code> (a few seconds) before DDL, and retry.</li>
<li>Prefer operations that need weaker locks or are instant: adding a nullable column or one with a constant default is instant (PostgreSQL 11+); <code>CREATE INDEX CONCURRENTLY</code>; adding a constraint as <code>NOT VALID</code> then <code>VALIDATE CONSTRAINT</code> (which takes a weaker lock); PostgreSQL 18 extends <code>NOT VALID</code> to NOT NULL constraints.</li>
<li>Avoid rewriting changes on large tables at peak, such as changing a column's type, which rewrites the table under ACCESS EXCLUSIVE.</li>
<li>Watch for long transactions before deploying (<code>pg_stat_activity</code>, <code>xact_start</code>).</li>
</ul>

<h2>Row-level locks</h2>
<p>Row locks are not kept in shared memory but in the tuple itself: the locker's XID goes in <code>xmax</code> with flag bits saying it is a lock rather than a delete. This means a transaction can lock millions of rows without exhausting memory, but locking writes to the page (and WAL). When several transactions share a lock on a row, PostgreSQL stores a <em>MultiXact</em> ID in xmax, pointing to a list of members.</p>
<div class="tbl"><table><tr><th>Mode</th><th>Taken by</th><th>Blocks</th></tr>
<tr><td><code>FOR UPDATE</code></td><td>DELETE, UPDATE of key columns, explicit</td><td>All other row locks and writes</td></tr>
<tr><td><code>FOR NO KEY UPDATE</code></td><td>UPDATE of non-key columns</td><td>Other updates; not FOR KEY SHARE</td></tr>
<tr><td><code>FOR SHARE</code></td><td>Explicit</td><td>Updates and deletes</td></tr>
<tr><td><code>FOR KEY SHARE</code></td><td>Foreign key checks on the referenced row</td><td>Deletes and key updates only</td></tr>
</table></div>
<p>The weaker <code>NO KEY UPDATE</code> and <code>KEY SHARE</code> modes exist so that inserting a payment that references an account (a foreign key check, KEY SHARE) does not block an update of that account's balance (NO KEY UPDATE). PostgreSQL 19 also speeds up foreign key checks considerably.</p>
<h3>Waiting, NOWAIT and SKIP LOCKED</h3>
<p>By default a conflicting row lock waits. <code>NOWAIT</code> errors immediately instead; <code>SKIP LOCKED</code> silently skips locked rows. SKIP LOCKED turns a table into a reliable work queue with many consumers:</p>
${code('A transactional job queue', 'sql')`
-- each worker claims up to 10 jobs no other worker holds
WITH next AS (
    SELECT id FROM jobs
    WHERE status = 'queued' AND run_at <= now()
    ORDER BY run_at
    LIMIT 10
    FOR UPDATE SKIP LOCKED
)
UPDATE jobs j SET status = 'running', started_at = now(), worker = $1
FROM next WHERE j.id = next.id
RETURNING j.*;

-- partial index keeps the queue scan tiny
CREATE INDEX jobs_ready ON jobs (run_at) WHERE status = 'queued';`}
<p>The job's state change commits with the work it represents (for example, the payment it settles), which gives exactly-once processing within the database. Delete or archive finished jobs to avoid bloat, and keep transactions short.</p>

<h2>Deadlocks</h2>
${fig('deadlock', '<b>Figure 16.3</b> Two transfers in opposite directions deadlock; locking in a consistent order prevents it.')}
<p>PostgreSQL detects deadlocks by searching for cycles in the wait-for graph, the cycle detection from the data structures book, after a lock wait exceeds <code>deadlock_timeout</code>. The victim receives error <code>40P01</code> and should retry. Prevent them by acquiring locks in a consistent order, keeping transactions short, and taking the strongest lock you will need first rather than upgrading.</p>

<h2>Advisory locks</h2>
<p>Advisory locks are named by a 64-bit integer (or two 32-bit ones) and mean whatever the application decides. Use them to ensure only one instance runs a scheduled job, to serialise processing per customer, or to coordinate migrations.</p>
${code('One settlement run per merchant at a time', 'sql')`
-- transaction-scoped: released automatically at commit or rollback
SELECT pg_try_advisory_xact_lock(hashtextextended('settlement:' || $1, 0));
-- returns false immediately if another session holds it`}
<p>Prefer transaction-scoped advisory locks; session-scoped ones survive the transaction and interact badly with connection poolers in transaction mode, where the next transaction may run on a different server connection.</p>

<h2>Lightweight locks and wait events</h2>
<p>Internally, PostgreSQL protects shared memory structures with lightweight locks (LWLocks) and spinlocks, held for microseconds. Contention on them appears as wait events in <code>pg_stat_activity</code> (for example <code>LWLock:BufferMapping</code>, <code>LWLock:WALWrite</code>, <code>LWLock:LockManager</code> with very many partitions or connections). Sampling wait events is the first step in diagnosing a busy server (Chapter 23).</p>
${code('Who blocks whom?', 'sql')`
SELECT waiting.pid AS waiting_pid, left(waiting.query, 50) AS waiting_query,
       blocking.pid AS blocking_pid, left(blocking.query, 50) AS blocking_query,
       now() - blocking.xact_start AS blocking_xact_age
FROM pg_stat_activity waiting
JOIN LATERAL unnest(pg_blocking_pids(waiting.pid)) AS b(pid) ON true
JOIN pg_stat_activity blocking ON blocking.pid = b.pid;`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>DDL without lock_timeout</strong> on busy tables.</li>
<li><strong>Long transactions holding locks</strong>, often a forgotten BEGIN in a script or an application that does network calls inside a transaction.</li>
<li><strong>Inconsistent lock order</strong> across code paths.</li>
<li><strong>Polling queues with plain SELECT then UPDATE,</strong> causing duplicate processing; use FOR UPDATE SKIP LOCKED.</li>
<li><strong>Session advisory locks behind a transaction-mode pooler.</strong></li>
<li><strong>Locking far more rows than needed</strong> with FOR UPDATE on a broad query.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Read the matrix</summary><p>Can <code>CREATE INDEX</code> (non-concurrent) run while an <code>UPDATE</code> is in progress? Can <code>VACUUM</code> run alongside <code>CREATE INDEX CONCURRENTLY</code>?</p><p><em>Answer:</em> no (SHARE conflicts with ROW EXCLUSIVE); no (both take SHARE UPDATE EXCLUSIVE, which conflicts with itself).</p></details>
<details><summary>Cause a queue</summary><p>On a test server, reproduce Figure 16.2 with three sessions and watch <code>pg_stat_activity</code>. Then repeat with lock_timeout.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Build a queue</summary><p>Implement the job queue with 8 worker processes and verify that no job is processed twice and none is lost when a worker crashes mid-transaction.</p></details>
<details><summary>Fix a deadlock</summary><p>Reproduce the transfer deadlock, then fix it with ordered locking. Measure throughput of 32 concurrent random transfers before and after.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Zero-downtime migration</summary><p>Plan adding a NOT NULL foreign key column to a 2-billion-row table without blocking writes for more than a second.</p><p><em>Answer sketch:</em> add nullable column; backfill in batches; add FK NOT VALID then VALIDATE; add CHECK (col IS NOT NULL) NOT VALID, validate, then SET NOT NULL (uses the validated check), each with lock_timeout and retries.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know the eight table lock modes, which commands take them, and the main conflicts.</li>
<li>I can explain the lock queue problem and use lock_timeout and low-lock DDL.</li>
<li>I know the four row lock modes and why KEY SHARE exists.</li>
<li>I can build a job queue with SKIP LOCKED.</li>
<li>I can explain deadlock detection and prevent deadlocks with lock ordering.</li>
<li>I can use advisory locks safely and find blockers.</li>
</ul>
`});

FIG.vacph = host => {
  const S = [['Scan heap', 'collect dead tuple IDs, prune pages, freeze old tuples'], ['Vacuum indexes', 'remove entries pointing to dead tuples, in every index'], ['Vacuum heap', 'mark dead line pointers unused'], ['Update maps', 'free space map, visibility map'], ['Truncate', 'return empty pages at the end to the OS']];
  const N = ['VACUUM (and autovacuum) reclaims space from dead tuple versions so it can be reused. It runs alongside normal reads and writes, taking only SHARE UPDATE EXCLUSIVE.', 'Phase 1: scan heap pages (skipping all-visible pages), prune dead versions, freeze old live ones, and collect the TIDs of dead tuples in memory (a compact TidStore since PostgreSQL 17, bounded by maintenance_work_mem).', 'Phase 2: scan every index and remove entries whose TID is in the dead set. Indexes are scanned completely, so a table with many indexes takes longer. If memory fills, phases 2 and 3 repeat in cycles.', 'Phase 3: return to the heap pages with dead tuples and mark their line pointers unused, now that no index points at them.', 'Phase 4: record free space in the FSM so inserts can reuse it, and set all-visible and all-frozen bits in the visibility map.', 'Phase 5: if the last pages of the table are empty, truncate the file (needs a brief exclusive lock, which it gives up if contended). Space in the middle of the table is reused, not returned: VACUUM does not shrink tables.'];
  stepper(host, N.map((note, k) => ({ k: k - 1, note })), f => { let s = ''; S.forEach(([a, b], i) => { const x = 10 + i * 128; s += box(x, 20, 116, 76, a, i === f.k ? 'hot' : i < f.k ? 'ok' : 'dim', b); if (i < 4) s += arrow(x + 117, 58, x + 127, 58, i < f.k ? 'ok' : ''); }); return { s, w: 650, h: 108 }; });
};

CH.push({
  id: 'ch17', n: 17, title: 'VACUUM, Bloat and Wraparound',
  lede: 'MVCC leaves dead tuple versions behind and assigns 32-bit transaction IDs that would eventually wrap around. VACUUM is the process that cleans up after both: it reclaims space, maintains the visibility map for index-only scans, and freezes old tuples so the transaction counter can keep going for ever. When vacuum falls behind, tables bloat, queries slow down, and in the worst case the database stops accepting writes. This chapter explains what vacuum does, how autovacuum decides when to run, how to tune it, and how to find what blocks it.',
  html: `
<h2>What VACUUM does</h2>
${fig('vacph', '<b>Figure 17.1</b> The phases of a VACUUM on one table.')}
<p>Vacuum's jobs, in order of importance:</p>
<ol>
<li><strong>Freeze</strong> old tuples so transaction IDs can wrap around safely.</li>
<li><strong>Remove dead tuples</strong> and their index entries so space is reused.</li>
<li><strong>Maintain the visibility map</strong> for index-only scans and faster future vacuums.</li>
<li><strong>Update statistics</strong> when run as <code>VACUUM ANALYZE</code> (autovacuum runs analyze separately).</li>
</ol>
<p>Plain VACUUM never shrinks a table file, except trimming empty pages at its end. To give space back to the operating system, a table must be rewritten: <code>VACUUM FULL</code> or <code>CLUSTER</code>, both of which take ACCESS EXCLUSIVE for the whole rewrite, or the <code>pg_repack</code> extension, which works online. PostgreSQL 19 adds <code>REPACK</code>, which replaces both commands, and <code>REPACK (CONCURRENTLY)</code>, which rewrites a table without blocking reads or writes.</p>

<h2>Bloat</h2>
<p>Bloat is space occupied by dead tuples or by free space that is not being reused. Some free space is healthy: updates reuse it, especially for HOT. Bloat becomes a problem when tables or indexes are several times larger than their live data, because every scan reads more pages and less of the working set fits in memory. Causes are almost always one of three: autovacuum not running often enough on a large table; something holding back the xmin horizon; or a one-off mass update or delete. Measure with <code>pgstattuple</code> (exact, expensive) or estimation queries based on statistics.</p>

<h2>Autovacuum</h2>
<p>The autovacuum launcher starts workers (<code>autovacuum_max_workers</code>, default 3) that vacuum and analyse tables whose activity crosses thresholds. A table is vacuumed when its dead tuples exceed:</p>
${code('Autovacuum trigger', 'none')`
dead tuples > autovacuum_vacuum_threshold + autovacuum_vacuum_scale_factor × reltuples
              (default 50)                   (default 0.2)
capped by autovacuum_vacuum_max_threshold (PostgreSQL 18, default 100 million)

inserts since last vacuum > autovacuum_vacuum_insert_threshold
                            + autovacuum_vacuum_insert_scale_factor × reltuples
(insert-only tables still need vacuum to set visibility bits and freeze)`}
${fig('avcalc', '<b>Figure 17.2</b> When will autovacuum run on your table? With the default scale factor, a 200-million-row table accumulates 40 million dead tuples before cleanup.')}
<p>The default 20% is fine for small tables and far too lax for large ones. Set per-table parameters for big, busy tables:</p>
${code('Per-table autovacuum tuning', 'sql')`
ALTER TABLE payments SET (
    autovacuum_vacuum_scale_factor = 0.01,     -- vacuum at 1% dead tuples
    autovacuum_vacuum_insert_scale_factor = 0.05,
    autovacuum_analyze_scale_factor = 0.01,
    autovacuum_vacuum_cost_limit = 2000        -- let it work faster than the global default
);

-- is autovacuum keeping up?
SELECT relname, n_live_tup, n_dead_tup,
       round(100.0 * n_dead_tup / nullif(n_live_tup + n_dead_tup, 0), 1) AS dead_pct,
       last_autovacuum, autovacuum_count
FROM pg_stat_user_tables ORDER BY n_dead_tup DESC LIMIT 15;`}
<p>Autovacuum throttles itself with a cost model (<code>autovacuum_vacuum_cost_limit</code> and <code>cost_delay</code>) so it does not overwhelm I/O. On modern storage the defaults are often too gentle; raise the cost limit and the number of workers on busy systems. PostgreSQL 19 lets autovacuum vacuum indexes with parallel workers (<code>autovacuum_max_parallel_workers</code>), prioritises tables with a scoring system, and shows priorities in <code>pg_stat_autovacuum_scores</code>.</p>

<h2>The xmin horizon</h2>
<p>Vacuum can only remove versions that no snapshot can see. The oldest snapshot anywhere in the cluster decides what is removable.</p>
${fig('horizon', '<b>Figure 17.3</b> Dead tuples on a busy table. Autovacuum keeps them low until a transaction is left open; while it is open nothing newer than its snapshot can be cleaned, however often vacuum runs.')}
<p>Things that hold back the horizon:</p>
<ul>
<li><strong>Long-running queries and transactions,</strong> including reports and migrations.</li>
<li><strong>Sessions idle in transaction:</strong> an application that began a transaction and is waiting on something else. Set <code>idle_in_transaction_session_timeout</code>.</li>
<li><strong>Replication slots</strong> whose consumers are slow or gone: their <code>xmin</code> and <code>catalog_xmin</code> hold back cleanup (and WAL removal).</li>
<li><strong>Standbys with <code>hot_standby_feedback = on</code></strong> running long queries.</li>
<li><strong>Forgotten prepared transactions</strong> (two-phase commit).</li>
</ul>
${code('What is holding back cleanup?', 'sql')`
SELECT 'backend' AS source, pid::text AS who, age(backend_xmin) AS xmin_age, state, now() - xact_start AS xact_age
FROM pg_stat_activity WHERE backend_xmin IS NOT NULL
UNION ALL
SELECT 'slot', slot_name, age(coalesce(xmin, catalog_xmin)), active::text, NULL FROM pg_replication_slots
UNION ALL
SELECT 'prepared', gid, age(transaction), NULL, now() - prepared FROM pg_prepared_xacts
ORDER BY xmin_age DESC NULLS LAST LIMIT 10;`}

<h2>Freezing and wraparound</h2>
<p>As Chapter 14 explained, 32-bit transaction IDs are compared in a circle, so a tuple must be frozen before its xmin is 2 billion transactions old. Each table records <code>relfrozenxid</code>, the oldest unfrozen XID it may contain; the database's age is the maximum over its tables.</p>
${fig('xidring', '<b>Figure 17.4</b> How far the oldest unfrozen transaction ID is behind the current one, against the thresholds that matter.')}
<ul>
<li>Normal vacuum freezes tuples older than <code>vacuum_freeze_min_age</code> on pages it visits, and eagerly scans some all-visible pages to freeze them (PostgreSQL 18).</li>
<li>When a table's age exceeds <code>vacuum_freeze_table_age</code>, vacuum scans all pages not already all-frozen.</li>
<li>At <code>autovacuum_freeze_max_age</code> (200 million), an anti-wraparound autovacuum is forced, even if autovacuum is off.</li>
<li>A failsafe (PostgreSQL 14) makes vacuum skip index cleanup and ignore cost limits when wraparound is near.</li>
<li>If all else fails, the server stops assigning XIDs to protect data, and writes fail until a vacuum completes.</li>
</ul>
<p>MultiXact IDs (used for shared row locks) have their own counter and wraparound, managed the same way; heavy foreign key or <code>FOR SHARE</code> traffic consumes them quickly.</p>
${code('Monitor wraparound risk', 'sql')`
SELECT datname, age(datfrozenxid) AS xid_age, mxid_age(datminmxid) AS mxid_age,
       round(100.0 * age(datfrozenxid) / 2147483647, 1) AS pct_to_wraparound
FROM pg_database ORDER BY xid_age DESC;

SELECT relname, age(relfrozenxid) AS xid_age, pg_size_pretty(pg_total_relation_size(oid))
FROM pg_class WHERE relkind IN ('r', 'm', 't') ORDER BY age(relfrozenxid) DESC LIMIT 10;
-- alert well before 1 billion; investigate anything above 500 million`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Turning autovacuum off</strong> because it "uses I/O".</li>
<li><strong>Default scale factors on billion-row tables.</strong></li>
<li><strong>Cancelling anti-wraparound vacuums</strong> or scheduling around them.</li>
<li><strong>Abandoned replication slots</strong> filling the disk and holding the horizon.</li>
<li><strong>Running VACUUM FULL on production at peak</strong> (use REPACK CONCURRENTLY in 19, or pg_repack).</li>
<li><strong>No monitoring of XID age</strong> until the warning appears in the logs.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Use the calculator</summary><p>For a 1-billion-row table with 5 million dead tuples per hour, how often does autovacuum run with defaults in PostgreSQL 17 and 18? What scale factor gives cleanup every hour?</p><p><em>Answer:</em> 17: every 40 hours (200 million); 18: capped at 100 million, every 20 hours; scale factor 0.005 for hourly.</p></details>
<details><summary>Watch dead tuples</summary><p>Update every row of a test table and check <code>n_dead_tup</code> and the table size before and after VACUUM and VACUUM FULL.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Reproduce the horizon</summary><p>Open a repeatable read transaction in one session and leave it idle. In another, run a heavy update workload and VACUUM VERBOSE. Read the "dead but not yet removable" count, then close the first session and vacuum again.</p></details>
<details><summary>Alerting</summary><p>Write alert rules for: XID age, longest transaction, idle-in-transaction count, inactive replication slots, and tables with dead tuples above 10%.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Insert-only tables</summary><p>Explain why an append-only ledger table still needs vacuum, and what would happen to index-only scans and freezing without it.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can describe vacuum's phases and what it does and does not reclaim.</li>
<li>I can compute autovacuum triggers and tune them per table.</li>
<li>I can find what holds back the xmin horizon.</li>
<li>I understand freezing, relfrozenxid, anti-wraparound vacuum and the failsafe.</li>
<li>I know when to rewrite a table and the online options, including REPACK in PostgreSQL 19.</li>
</ul>
`});

const jpEval = (doc, path) => {
  let p = path.trim(); if (!p.startsWith('$')) throw new Error('path must start with $'); p = p.slice(1);
  let cur = [doc]; const unwrap = v => Array.isArray(v) ? v : [v];
  const cmp = (a, op, b) => ({ '==': a === b, '!=': a !== b, '>': a > b, '<': a < b, '>=': a >= b, '<=': a <= b }[op]);
  const getPath = (v, segs) => { let xs = [v]; for (const sg of segs) xs = xs.flatMap(unwrap).flatMap(o => o && typeof o === 'object' && sg in o ? [o[sg]] : []); return xs; };
  while (p.length) {
    let m;
    if ((m = p.match(/^\s*\.\s*([A-Za-z_][\w]*)/))) { cur = cur.flatMap(unwrap).flatMap(o => o && typeof o === 'object' && !Array.isArray(o) && m[1] in o ? [o[m[1]]] : []); }
    else if ((m = p.match(/^\s*\.\s*\*/))) { cur = cur.flatMap(unwrap).flatMap(o => o && typeof o === 'object' ? Object.values(o) : []); }
    else if ((m = p.match(/^\s*\[\s*\*\s*\]/))) { cur = cur.flatMap(unwrap); }
    else if ((m = p.match(/^\s*\[\s*(\d+)\s*\]/))) { cur = cur.flatMap(o => Array.isArray(o) && o.length > +m[1] ? [o[+m[1]]] : []); }
    else if ((m = p.match(/^\s*\?\s*\(\s*@((?:\s*\.\s*[A-Za-z_]\w*)*)\s*(==|!=|>=|<=|>|<)\s*("(?:[^"]*)"|-?\d+(?:\.\d+)?|true|false)\s*\)/))) {
      const segs = (m[1].match(/[A-Za-z_]\w*/g) || []), lit = JSON.parse(m[3]);
      cur = cur.flatMap(unwrap).filter(o => getPath(o, segs).flatMap(unwrap).some(v => cmp(v, m[2], lit)));
    }
    else if ((m = p.match(/^\s*\.\s*size\(\)/))) { cur = cur.map(o => Array.isArray(o) ? o.length : 1); }
    else throw new Error('unsupported at: ' + p.slice(0, 20));
    p = p.slice(m[0].length);
  }
  return cur;
};

CH.push({
  id: 'ch18', n: 18, title: 'JSON and JSONB',
  lede: 'Modern systems exchange JSON everywhere: webhooks, card network messages, KYC provider responses, event streams, feature flags. PostgreSQL stores and queries JSON natively, with a binary format (jsonb), rich operators, the SQL/JSON path language, standard SQL/JSON functions including JSON_TABLE, and GIN indexes. This chapter explains how jsonb is stored, how to query and index it well, the costs of large documents, and how to decide what belongs in JSON and what belongs in columns.',
  html: `
<h2>json versus jsonb</h2>
${fig('jsonstore', '<b>Figure 18.1</b> The two JSON types store the same input very differently.')}
<p>jsonb values live in the tuple like any variable-length value: compressed and moved to TOAST when large (Chapter 4). Keys are stored sorted with offsets, so looking up a key in an object uses binary search rather than parsing. Numbers are stored as <code>numeric</code>, so <code>2450.50</code> keeps its precision, unlike JavaScript.</p>

<h2>Operators and functions</h2>
<div class="tbl"><table><tr><th>Operator</th><th>Meaning</th><th>Example</th></tr>
<tr><td><code>-&gt;</code> / <code>-&gt;&gt;</code></td><td>Get field or element as jsonb / as text</td><td><code>doc-&gt;'method'-&gt;&gt;'network'</code></td></tr>
<tr><td><code>#&gt;</code> / <code>#&gt;&gt;</code></td><td>Get at path</td><td><code>doc #&gt;&gt; '{items,0,sku}'</code></td></tr>
<tr><td>subscript (14+)</td><td>Read or update with array syntax</td><td><code>doc['merchant']['city']</code></td></tr>
<tr><td><code>@&gt;</code></td><td>Contains</td><td><code>doc @&gt; '{"status":"settled"}'</code></td></tr>
<tr><td><code>?</code>, <code>?|</code>, <code>?&amp;</code></td><td>Key exists (any, all)</td><td><code>doc ? 'refund_id'</code></td></tr>
<tr><td><code>@?</code>, <code>@@</code></td><td>jsonpath exists, jsonpath predicate</td><td><code>doc @? '$.items[*] ? (@.price &gt; 1000)'</code></td></tr>
<tr><td><code>||</code>, <code>-</code>, <code>#-</code></td><td>Concatenate, delete key, delete path</td><td><code>doc - 'risk'</code></td></tr>
</table></div>
<p>A common bug: <code>doc-&gt;'amount' &gt; 1000</code> compares jsonb values, and <code>doc-&gt;&gt;'amount' &gt; '1000'</code> compares text ('999' &gt; '1000'). Cast explicitly: <code>(doc-&gt;&gt;'amount')::numeric &gt; 1000</code>.</p>

<h2>The SQL/JSON path language</h2>
<p>SQL/JSON path, part of the SQL standard, navigates and filters inside documents: <code>$</code> is the root, <code>.key</code> a member, <code>[*]</code> every array element, <code>? (...)</code> a filter in which <code>@</code> is the current item. In the default <em>lax</em> mode, arrays are unwrapped automatically and missing keys yield nothing rather than errors; <em>strict</em> mode raises errors instead.</p>
${fig('jsonpath', '<b>Figure 18.2</b> A jsonpath evaluator over a payment document, implementing a subset of the language in lax mode. Edit the path or pick an example.')}
<p>PostgreSQL 19 adds string methods to jsonpath, such as <code>lower()</code>, <code>upper()</code>, <code>replace()</code>, <code>split_part()</code> and <code>btrim()</code>, and can output query results directly as JSON with <code>COPY ... (FORMAT json)</code>.</p>

<h2>SQL/JSON functions and JSON_TABLE</h2>
<p>PostgreSQL 16 and 17 added the SQL-standard functions: constructors (<code>JSON_OBJECT</code>, <code>JSON_ARRAY</code>, <code>JSON_ARRAYAGG</code>), the <code>IS JSON</code> predicate, query functions (<code>JSON_EXISTS</code>, <code>JSON_VALUE</code>, <code>JSON_QUERY</code>) and <code>JSON_TABLE</code>, which turns JSON into rows and columns.</p>
${code('Shredding a webhook payload into rows', 'sql')`
SELECT p.id, jt.*
FROM payments_raw p,
     JSON_TABLE(p.doc, '$'
        COLUMNS (
            status    text          PATH '$.status',
            amount    numeric(18,2) PATH '$.amount',
            network   text          PATH '$.method.network' DEFAULT 'unknown' ON EMPTY,
            NESTED PATH '$.items[*]' COLUMNS (
                line   FOR ORDINALITY,
                sku    text    PATH '$.sku',
                qty    int     PATH '$.qty',
                price  numeric PATH '$.price'
            )
        )) AS jt
WHERE JSON_EXISTS(p.doc, '$.items[*] ? (@.price > 1000)');

-- typed extraction with error handling
SELECT JSON_VALUE(doc, '$.risk.score' RETURNING numeric DEFAULT 0 ON ERROR) FROM payments_raw;`}

<h2>Indexing jsonb</h2>
${fig('ginjson', '<b>Figure 18.3</b> The two GIN operator classes for jsonb extract different index entries from the same document.')}
${code('Three ways to index JSON', 'sql')`
-- 1. GIN on the whole document: flexible containment and jsonpath queries
CREATE INDEX payments_raw_doc_gin ON payments_raw USING gin (doc jsonb_path_ops);
SELECT id FROM payments_raw WHERE doc @> '{"method": {"network": "RuPay"}, "status": "settled"}';
SELECT id FROM payments_raw WHERE doc @? '$.tags[*] ? (@ == "grocery")';

-- 2. B-tree on one extracted field: equality, ranges, sorting
CREATE INDEX payments_raw_amount ON payments_raw (((doc->>'amount')::numeric));
SELECT id FROM payments_raw WHERE (doc->>'amount')::numeric > 10000 ORDER BY 1 DESC LIMIT 50;

-- 3. Promote hot fields to real columns (stored generated columns are indexable)
ALTER TABLE payments_raw
  ADD COLUMN merchant_id text GENERATED ALWAYS AS (doc #>> '{merchant,id}') STORED;
CREATE INDEX ON payments_raw (merchant_id);`}
<p>GIN indexes answer containment and existence, not ranges or ordering. Range queries on a JSON field need an expression B-tree index on the extracted, cast value, and the query must use exactly the same expression. Statistics on expression indexes also give the planner real selectivity for that field; otherwise it guesses, typically badly, for predicates inside JSON. Extended statistics on expressions (Chapter 12) help too.</p>

<h2>Costs of large documents</h2>
<ul>
<li><strong>Updates rewrite the whole value.</strong> Changing one key in a 100 KB document writes a new 100 KB version (compressed, TOASTed) plus WAL. Documents that are updated field by field should be split into columns or smaller rows.</li>
<li><strong>Reads detoast the whole value.</strong> Extracting one field from a large TOASTed document decompresses all of it.</li>
<li><strong>Key names are stored in every row.</strong> A million documents with ten long key names repeat those names a million times; columns store names once in the catalog.</li>
<li><strong>No constraints or foreign keys inside JSON</strong> unless you add CHECK constraints on extracted expressions.</li>
</ul>

<h2>Columns or JSON?</h2>
<div class="tbl"><table><tr><th>Use columns when</th><th>Use jsonb when</th></tr>
<tr><td>The field is always present and has a known type</td><td>Attributes vary by type, provider or version</td></tr>
<tr><td>You filter, join, sort or aggregate on it</td><td>You mostly store and return it, or filter by containment</td></tr>
<tr><td>It needs constraints or foreign keys</td><td>You must keep the original payload for audit</td></tr>
<tr><td>It is updated independently</td><td>The document is written once and rarely changed</td></tr>
</table></div>
<p>A common fintech pattern: a payments table with typed columns for everything the business logic uses (amount, currency, status, account, timestamps) and a <code>jsonb</code> column for the provider-specific raw payload, kept for audit and troubleshooting, with a GIN index if support staff search it.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Text comparisons of numbers</strong> via <code>-&gt;&gt;</code> without casting.</li>
<li><strong>Expecting GIN to speed up range queries or ORDER BY</strong> on JSON fields.</li>
<li><strong>Query expressions that do not match the index expression exactly.</strong></li>
<li><strong>Frequently updated fields inside large documents.</strong></li>
<li><strong>Using json instead of jsonb</strong> without a reason.</li>
<li><strong>Schema-less by accident:</strong> no validation, so every reader must handle every historical shape.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Paths</summary><p>Using Figure 18.2, write paths for: the merchant's MCC; SKUs of items with quantity 1; the number of tags.</p><p><em>Answer:</em> <code>$.merchant.mcc</code>; <code>$.items[*] ? (@.qty == 1).sku</code>; <code>$.tags.size()</code>.</p></details>
<details><summary>Spot the bug</summary><p>Why does <code>WHERE doc-&gt;&gt;'amount' &gt; '500'</code> return a payment of 60?</p><p><em>Answer:</em> text comparison: '60' &gt; '500' because '6' &gt; '5'.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Compare GIN classes</summary><p>Load a million webhook documents, build GIN indexes with both operator classes, and compare size and the speed of three containment queries.</p></details>
<details><summary>Shred with JSON_TABLE</summary><p>Write a view that exposes payment line items from a jsonb payload as rows, and an expression index that makes filtering by SKU fast.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Update cost</summary><p>Measure WAL generated by updating one key in documents of 1 KB, 20 KB and 200 KB with <code>EXPLAIN (ANALYZE, WAL)</code>. Redesign the 200 KB case.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain the storage difference between json and jsonb.</li>
<li>I can use jsonb operators correctly, including casts.</li>
<li>I can write SQL/JSON path queries in lax mode and use JSON_TABLE and JSON_VALUE.</li>
<li>I can choose between jsonb_ops, jsonb_path_ops, expression indexes and generated columns.</li>
<li>I understand the update, TOAST and storage costs of large documents.</li>
<li>I can decide what belongs in columns and what in jsonb.</li>
</ul>
`});

    const cand = P.filter(inBB).length, hit = P.filter(p => inBB(p) && inPoly(p)).length;
    s += tx(540, 40, `rows: ${P.length}`, 'tm', 'start'); if (f.k >= 1) s += tx(540, 62, `candidates: ${cand}`, 'tp warn', 'start'); if (f.k >= 2) s += tx(540, 84, `inside: ${hit}`, 'tp hot', 'start');
    return { s, w: 650, h: 290 };
  });
};

CH.push({
  id: 'ch19', n: 19, title: 'Geospatial Queries with PostGIS',
  lede: 'Location matters in finance: merchant and ATM locators, branch catchments, geofenced offers, delivery and field-agent routing, and fraud signals such as impossible travel between two card transactions. PostGIS, the most widely used open-source spatial database extension, turns PostgreSQL into a full geographic information system. This chapter covers spatial types, coordinate systems and why distances go wrong, spatial predicates, GiST indexing with filter and refine, nearest-neighbour search, and practical patterns.',
  html: `
<h2>Spatial types</h2>
<p>PostGIS adds two families of types:</p>
<ul>
<li><code>geometry</code>: shapes on a flat plane, in a stated coordinate system. Points, line strings, polygons and their multi- and collection variants. Fast, with hundreds of functions.</li>
<li><code>geography</code>: shapes on the Earth's ellipsoid, always in longitude and latitude (SRID 4326). Distances and areas come out in metres and square metres, correctly, anywhere on Earth; fewer functions and slower calculations.</li>
</ul>
<p>Every geometry carries a <strong>spatial reference identifier (SRID)</strong> that says what its numbers mean. SRID 4326 (WGS 84) is longitude and latitude in degrees, as GPS reports them. SRID 3857 (Web Mercator) is what web maps display, in metres but badly distorted away from the equator. Projected systems such as UTM zones (for example EPSG:32643, UTM zone 43N, covering western India) give accurate metres within their zone.</p>
<p>Note the order: PostGIS points are <code>ST_MakePoint(longitude, latitude)</code>, x before y. Swapping them is the most common PostGIS bug.</p>

<h2>Why distances go wrong</h2>
${fig('travel', '<b>Figure 19.1</b> An impossible-travel calculator for two card transactions, comparing a correct great-circle distance with the meaningless planar "distance" in degrees that <code>geometry</code> in SRID 4326 would return.')}
<p>A degree of longitude is 111 km at the equator and 0 at the poles, so planar calculations on longitude and latitude are wrong for any length or area. Choose one of three approaches: use <code>geography</code> for distance and area across large regions; transform to a suitable projected SRID with <code>ST_Transform</code> for local calculations; or store geometry in 4326 and cast to geography where you need metres (<code>ST_DWithin(a::geography, b::geography, 500)</code>).</p>

<h2>Spatial relationships</h2>
<div class="tbl"><table><tr><th>Function</th><th>True when</th><th>Typical use</th></tr>
<tr><td><code>ST_Intersects(a, b)</code></td><td>a and b share any point</td><td>Which zones does this route cross?</td></tr>
<tr><td><code>ST_Contains(a, b)</code>, <code>ST_Within(b, a)</code></td><td>b lies inside a</td><td>Is this transaction inside the merchant's geofence?</td></tr>
<tr><td><code>ST_Covers(a, b)</code></td><td>Like contains, but boundary points count</td><td>Points on a polygon edge</td></tr>
<tr><td><code>ST_DWithin(a, b, d)</code></td><td>a and b are within distance d</td><td>ATMs within 2 km; transactions within 500 m of a branch</td></tr>
<tr><td><code>ST_Distance(a, b)</code></td><td>Returns the distance</td><td>Reporting, sorting small sets</td></tr>
<tr><td><code>ST_Touches</code>, <code>ST_Overlaps</code>, <code>ST_Crosses</code></td><td>Specific topological relationships (DE-9IM)</td><td>Boundary analysis</td></tr>
</table></div>
<p>Use <code>ST_DWithin</code> rather than <code>ST_Distance(a, b) &lt; d</code>: the former can use an index, the latter computes the distance for every row.</p>

<h2>Indexing: filter and refine</h2>
${fig('filtref', '<b>Figure 19.2</b> Spatial queries use the GiST index to find bounding-box candidates, then test only those exactly.')}
${code('A geofenced merchant offer and nearby ATMs', 'sql')`
CREATE EXTENSION IF NOT EXISTS postgis;

CREATE TABLE merchant_zones (
    merchant_id bigint PRIMARY KEY,
    zone        geometry(Polygon, 4326) NOT NULL
);
CREATE TABLE card_txns (
    id         bigint PRIMARY KEY,
    card_id    bigint NOT NULL,
    at         timestamptz NOT NULL,
    geom       geometry(Point, 4326) NOT NULL
);
CREATE INDEX ON merchant_zones USING gist (zone);
CREATE INDEX ON card_txns USING gist (geom);

-- which transactions in the last hour fell inside merchant 77's zone?
SELECT t.id
FROM card_txns t JOIN merchant_zones z ON ST_Contains(z.zone, t.geom)
WHERE z.merchant_id = 77 AND t.at > now() - interval '1 hour';

-- ATMs within 2 km of a customer (metres via geography)
SELECT id, name
FROM atms
WHERE ST_DWithin(geom::geography, ST_SetSRID(ST_MakePoint(73.8567, 18.5204), 4326)::geography, 2000);
-- for this to use an index, index the same expression: CREATE INDEX ON atms USING gist ((geom::geography));`}
<p>Complex polygons (thousands of vertices, such as administrative boundaries) make the refine step expensive. <code>ST_Subdivide</code> splits them into many small pieces with tight bounding boxes, often speeding queries by orders of magnitude.</p>

<h2>Nearest neighbours</h2>
${fig('knn', '<b>Figure 19.3</b> The five ATMs nearest to a customer. GiST returns them in distance order without computing every distance.')}
${code('K-nearest-neighbour search', 'sql')`
SELECT id, name,
       ST_Distance(geom::geography, me::geography) AS metres
FROM atms, ST_SetSRID(ST_MakePoint(73.8567, 18.5204), 4326) AS me
WHERE status = 'online'
ORDER BY geom <-> me          -- index-assisted distance ordering
LIMIT 5;`}
<p>The <code>&lt;-&gt;</code> operator in <code>ORDER BY</code> makes GiST walk its tree in order of distance using a priority queue, the best-first search from the data structures book. With <code>geometry</code> in SRID 4326 the ordering uses planar degrees, which is fine for ranking nearby points at moderate latitudes; compute the exact distance in metres for the few returned rows, as above.</p>

<h2>Practical patterns</h2>
<ul>
<li><strong>Impossible travel:</strong> for each card transaction, compare with the previous one for the same card using <code>lag()</code>; flag when distance divided by time exceeds a plausible speed. Combine with device and IP signals.</li>
<li><strong>Catchment analysis:</strong> customers within a drive-time or radius of each branch, with <code>ST_DWithin</code> and joins.</li>
<li><strong>Hexagonal grids:</strong> the <code>h3</code> extension assigns points to hierarchical hexagonal cells; aggregating by cell gives heatmaps and density features for fraud and risk models, with ordinary B-tree indexes on cell IDs.</li>
<li><strong>Clustering:</strong> <code>ST_ClusterDBSCAN</code> finds dense groups of events, for example skimming hot spots.</li>
<li><strong>Routing:</strong> pgRouting adds shortest-path algorithms over road networks for field agents and cash logistics.</li>
<li><strong>Geocoding:</strong> addresses to coordinates usually comes from an external service; store the result with its accuracy.</li>
</ul>
<p>Location data is personal data. Under India's DPDP Act and GDPR it needs a purpose, minimisation and retention limits; consider coarsening (to an H3 cell) for analytics.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Latitude and longitude swapped</strong> in ST_MakePoint.</li>
<li><strong>Distances in degrees</strong> from geometry in SRID 4326.</li>
<li><strong><code>ST_Distance &lt; d</code> in WHERE</strong> instead of ST_DWithin.</li>
<li><strong>Mixed SRIDs</strong> in one comparison (PostGIS raises an error; the fix is ST_Transform, not ST_SetSRID).</li>
<li><strong>Huge polygons without subdivision.</strong></li>
<li><strong>Precise locations kept for ever</strong> without a privacy reason.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Distances</summary><p>Using Figure 19.1, compute the distance from Pune (18.5204, 73.8567) to Mumbai (19.0760, 72.8777). What would SRID 4326 geometry report?</p><p><em>Answer:</em> about 120 km by great circle; about 1.12 "degrees" planar.</p></details>
<details><summary>Order matters</summary><p>What happens if you build Mumbai as ST_MakePoint(19.0760, 72.8777)?</p><p><em>Answer:</em> longitude 19.08 and latitude 72.88: a point in the Barents Sea, north of Norway.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Impossible travel in SQL</summary><p>Write a query over card_txns that flags consecutive transactions per card with implied speed above 900 km/h in the last 24 hours, using lag() and geography distance.</p></details>
<details><summary>Index the cast</summary><p>Show with EXPLAIN that <code>ST_DWithin(geom::geography, ...)</code> ignores a plain geometry index, then add an expression index and show it used.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Subdivide</summary><p>Load India's district boundaries, then time point-in-polygon joins for a million points before and after ST_Subdivide.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain geometry versus geography and what an SRID is.</li>
<li>I know why planar distances on longitude and latitude are wrong and how to fix them.</li>
<li>I can use spatial predicates, preferring ST_DWithin for distance filters.</li>
<li>I understand GiST filter and refine and index expression matching.</li>
<li>I can write nearest-neighbour queries with &lt;-&gt;.</li>
<li>I know fintech patterns: geofencing, impossible travel, H3 aggregation, and the privacy duties.</li>
</ul>
`});

FIG.hnsw = host => {
  const r = rng(21), P = []; for (let i = 0; i < 34; i++) P.push([40 + r() * 560, 30 + r() * 150]);
  const q = [470, 120], d = i => Math.hypot(P[i][0] - q[0], P[i][1] - q[1]);
  const L2 = [0, 9, 20], L1 = [0, 9, 20, 4, 13, 27, 30], near = (set, k) => { const out = {}; set.forEach(i => { out[i] = set.filter(j => j !== i).sort((a, b) => Math.hypot(P[a][0] - P[i][0], P[a][1] - P[i][1]) - Math.hypot(P[b][0] - P[i][0], P[b][1] - P[i][1])).slice(0, k); }); return out; };
  const all = [...Array(P.length).keys()], E0 = near(all, 3), E1 = near(L1, 2), E2 = near(L2, 2);
  const greedy = (set, E, start) => { const path = [start]; let cur = start; for (;;) { const nx = E[cur].reduce((b, j) => d(j) < d(b) ? j : b, cur); if (nx === cur) break; path.push(nx); cur = nx; } return path; };
  const p2 = greedy(L2, E2, 0), p1 = greedy(L1, E1, p2[p2.length - 1]), p0 = greedy(all, E0, p1[p1.length - 1]);
  const N = ['HNSW (hierarchical navigable small world) builds a graph where each vector links to its nearest neighbours, plus sparser upper layers with long-range links, like express and local trains.', 'Search for the query (red) starts at the entry point on the top layer, which has few nodes, and greedily moves to whichever neighbour is closer to the query.', 'When no neighbour is closer, drop to the next layer down and continue from the same node, now with denser links.', 'On the bottom layer, which contains every vector, a beam search keeps the ef_search best candidates and returns the nearest k. The search touched a few dozen vectors, not all of them. It is approximate: the true nearest might occasionally be missed.'];
  stepper(host, N.map((note, k) => ({ k, note })), f => {
    const layer = f.k <= 1 ? 2 : f.k === 2 ? 1 : 0, set = [L2, L1, all][2 - layer], E = [E0, E1, E2][layer], path = f.k === 0 ? [] : f.k === 1 ? p2 : f.k === 2 ? p2.concat(p1) : p2.concat(p1, p0);
    let s = tx(10, 14, ['bottom layer 0: all vectors', 'layer 1', 'top layer 2'][layer], 'tb', 'start');
    set.forEach(i => E[i].forEach(j => s += `<line x1="${f1(P[i][0])}" y1="${f1(P[i][1])}" x2="${f1(P[j][0])}" y2="${f1(P[j][1])}" class="ed" opacity="0.5"/>`));
    for (let i = 1; i < path.length; i++) s += `<line x1="${f1(P[path[i - 1]][0])}" y1="${f1(P[path[i - 1]][1])}" x2="${f1(P[path[i]][0])}" y2="${f1(P[path[i]][1])}" class="ed hot" stroke-width="3"/>`;
    set.forEach(i => s += `<circle cx="${f1(P[i][0])}" cy="${f1(P[i][1])}" r="${path.includes(i) ? 6 : 4}" class="${path.includes(i) ? 'f5' : 'f3'}"/>`);
    s += `<circle cx="${q[0]}" cy="${q[1]}" r="7" class="f6"/>` + tx(q[0] + 12, q[1], 'query', 'tp hot', 'start');

};

CH.push({
  id: 'ch20', n: 20, title: 'Vectors and Similarity Search',
  lede: 'Machine learning models turn text, images, transactions and customers into vectors of numbers, embeddings, such that similar things have nearby vectors. Finding the nearest vectors powers semantic search, retrieval for AI assistants, duplicate detection and anomaly scoring. The pgvector extension brings vector types, distance operators and approximate nearest-neighbour indexes into PostgreSQL, next to the rest of your data. This chapter explains distance measures, why exact search does not scale, how HNSW and IVFFlat indexes work, and how to combine vector search with filters and full-text search.',
  html: `
<h2>Embeddings and distance</h2>
<p>An embedding model maps an input to a vector, commonly with 384 to 3,072 dimensions. The model is trained so that geometric closeness reflects meaning: "card declined at checkout" and "payment failed at the till" land near each other although they share no words. Three distance measures are common, each an operator in pgvector:</p>
<div class="tbl"><table><tr><th>Measure</th><th>Operator</th><th>Index operator class</th><th>Notes</th></tr>
<tr><td>Euclidean (L2) distance</td><td><code>&lt;-&gt;</code></td><td><code>vector_l2_ops</code></td><td>Straight-line distance</td></tr>
<tr><td>Cosine distance</td><td><code>&lt;=&gt;</code></td><td><code>vector_cosine_ops</code></td><td>Angle only, ignores length; the usual choice for text embeddings</td></tr>
<tr><td>Negative inner product</td><td><code>&lt;#&gt;</code></td><td><code>vector_ip_ops</code></td><td>Fastest; equals cosine ordering for normalised vectors</td></tr>
<tr><td>L1, Hamming, Jaccard</td><td><code>&lt;+&gt;</code>, <code>&lt;~&gt;</code>, <code>&lt;%&gt;</code></td><td>various</td><td>Binary and sparse use cases</td></tr>
</table></div>
<p>Use whichever measure the embedding model was trained for, and normalise vectors if you use inner product.</p>

<h2>Why exact search does not scale</h2>
<p>Exact k-nearest-neighbour search compares the query with every vector: for a million 768-dimensional vectors, 768 million multiply-adds per query, and reading 3 GB of data. The tree indexes that work for two-dimensional geography (Chapter 19) fail in high dimensions, because almost all points are roughly equally far apart and bounding regions overlap everything (the "curse of dimensionality"). Practical systems use <strong>approximate</strong> nearest-neighbour (ANN) indexes, trading a little recall for speed of orders of magnitude.</p>

<h2>HNSW</h2>
${fig('hnsw', '<b>Figure 20.1</b> Searching a hierarchical navigable small-world graph: greedy moves on sparse upper layers, then a beam search on the full bottom layer.')}
<p>HNSW is a multi-layer proximity graph. Each vector is inserted at layer 0 and, with exponentially decreasing probability, into higher layers, like levels in a skip list. Each node keeps up to <code>m</code> links per layer (default 16). Build quality is controlled by <code>ef_construction</code> (default 64), search breadth by <code>hnsw.ef_search</code> (default 40).</p>
${fig('recall', '<b>Figure 20.2</b> Raising ef_search increases recall (the fraction of true nearest neighbours returned) at the cost of latency.')}
<p>HNSW gives excellent recall and speed and can be built on an empty table and updated incrementally. It is memory-hungry and slow to build: keep the index in RAM (shared buffers and the OS cache) for good performance, raise <code>maintenance_work_mem</code> so the build graph fits in memory, and use parallel workers for builds.</p>

<h2>IVFFlat</h2>
<p>IVFFlat clusters vectors with k-means into <code>lists</code> (for example rows ÷ 1,000 up to a million rows, √rows beyond). A query compares itself with the cluster centres, then searches only the <code>ivfflat.probes</code> nearest lists. It builds faster and uses less memory than HNSW but has lower recall at the same speed, and must be built after data is loaded so the clusters represent it. If data drifts, rebuild.</p>

<h2>Using pgvector</h2>
${code('Semantic search over dispute notes', 'sql')`
CREATE EXTENSION IF NOT EXISTS vector;

CREATE TABLE dispute_chunks (
    id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    dispute_id  bigint NOT NULL,
    tenant_id   int NOT NULL,
    body        text NOT NULL,
    embedding   vector(768) NOT NULL          -- or halfvec(768) to halve storage
);

CREATE INDEX ON dispute_chunks USING hnsw (embedding vector_cosine_ops)
    WITH (m = 16, ef_construction = 128);

SET hnsw.ef_search = 80;
SELECT id, dispute_id, 1 - (embedding <=> $1) AS similarity
FROM dispute_chunks
ORDER BY embedding <=> $1          -- $1 is the query embedding from the same model
LIMIT 10;`}
<p>Storage options: <code>vector</code> (4-byte floats, up to 2,000 dimensions indexed), <code>halfvec</code> (2-byte floats, up to 4,000 indexed, half the size with little loss), <code>sparsevec</code> for sparse embeddings, and <code>bit</code> for binary quantisation, which can be used for a fast first pass followed by re-ranking with full vectors.</p>

<h2>Filtering</h2>
<p>Real queries combine similarity with ordinary conditions: this tenant, this product, the last 90 days. An ANN index returns the nearest candidates first and filters afterwards; if the filter is selective, few of the first <code>ef_search</code> candidates pass and the query returns fewer rows than asked. Remedies:</p>
<ul>
<li><strong>Iterative index scans</strong> (pgvector 0.8): <code>SET hnsw.iterative_scan = relaxed_order</code> keeps scanning the index until enough rows pass the filter, bounded by <code>hnsw.max_scan_tuples</code>.</li>
<li><strong>Partial indexes or partitioning</strong> by tenant or category, so each index holds only relevant vectors.</li>
<li><strong>Exact search after a selective B-tree filter</strong>: if the filter leaves a few thousand rows, a plain scan with <code>ORDER BY embedding &lt;=&gt; $1</code> is exact and fast.</li>
</ul>
<p>Row-level security (Chapter 24) applies to vector queries like any other, which matters for multi-tenant retrieval for AI assistants: never let retrieval cross tenant boundaries.</p>

<h2>Hybrid search</h2>
<p>Vector search finds meaning; full-text search (Chapter 10) finds exact terms such as merchant IDs, error codes and names. Combining them usually beats either. Reciprocal rank fusion merges ranked lists without calibrating scores:</p>
${code('Hybrid search with reciprocal rank fusion', 'sql')`
WITH sem AS (
    SELECT id, row_number() OVER (ORDER BY embedding <=> $1) AS r
    FROM dispute_chunks WHERE tenant_id = $3
    ORDER BY embedding <=> $1 LIMIT 50
), lex AS (
    SELECT id, row_number() OVER (ORDER BY ts_rank_cd(to_tsvector('english', body), q) DESC) AS r
    FROM dispute_chunks, websearch_to_tsquery('english', $2) q
    WHERE tenant_id = $3 AND to_tsvector('english', body) @@ q
    ORDER BY r LIMIT 50
)
SELECT id, sum(1.0 / (60 + r)) AS score
FROM (SELECT * FROM sem UNION ALL SELECT * FROM lex) both_lists
GROUP BY id ORDER BY score DESC LIMIT 10;`}

<h2>Operational considerations</h2>
<ul>
<li><strong>Size:</strong> a 768-dimension float vector is 3 KB; ten million of them are 30 GB before indexes. Consider halfvec, dimension reduction, or quantisation.</li>
<li><strong>Model changes:</strong> embeddings from different models are not comparable; store the model name and version and re-embed on change, in a new column or table.</li>
<li><strong>Recall testing:</strong> measure recall against exact search on a sample, and track it as data grows.</li>
<li><strong>When to use a dedicated vector database:</strong> billions of vectors, very high query rates, or GPU-accelerated search. For millions of vectors with transactional data and access control nearby, PostgreSQL is often simpler and good enough.</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Mismatched distance operator and index operator class,</strong> so the index is not used.</li>
<li><strong>Selective filters with a plain ANN index,</strong> returning too few rows.</li>
<li><strong>Building IVFFlat on an empty or tiny table.</strong></li>
<li><strong>Mixing embeddings from different models.</strong></li>
<li><strong>Retrieval without tenant isolation</strong> for AI assistants.</li>
<li><strong>Never measuring recall.</strong></li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Cosine by hand</summary><p>Compute the cosine distance between (1, 0) and (1, 1), and between (1, 0) and (2, 0).</p><p><em>Answer:</em> 1 − 1/√2 ≈ 0.293; 0 (same direction, length ignored).</p></details>
<details><summary>Index use</summary><p>Create an HNSW index with <code>vector_cosine_ops</code> and check with EXPLAIN that <code>ORDER BY embedding &lt;-&gt; $1</code> does not use it while <code>&lt;=&gt;</code> does.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Recall curve</summary><p>Load 500,000 embeddings, compute exact top-10 for 200 queries, then measure HNSW recall and latency for ef_search 10 to 320. Reproduce Figure 20.2 for your data.</p></details>
<details><summary>Filtered search</summary><p>Add a tenant filter that keeps 1% of rows. Compare result counts with and without iterative scans, and against exact search.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Hybrid evaluation</summary><p>Label 100 queries with relevant documents. Compare precision at 10 for full-text, vector and hybrid (RRF) search.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain embeddings and choose a distance measure.</li>
<li>I know why exact and tree-based search fail in high dimensions.</li>
<li>I can explain HNSW and IVFFlat and tune m, ef_construction, ef_search, lists and probes.</li>
<li>I can store, index and query vectors with pgvector, including halfvec.</li>
<li>I can handle filtered search and build hybrid search with RRF.</li>
<li>I know the operational trade-offs and when to use a dedicated system.</li>
</ul>
`});
