CH.push({
  id: 'ch21', n: 21, title: 'Partitioning and Time-Series Data',
  lede: 'Ledgers, card authorisations, audit logs and market data grow without end. A single table of several billion rows becomes hard to vacuum, index, back up and prune. Declarative partitioning splits one logical table into many physical ones, so queries touch only relevant partitions, maintenance happens a piece at a time, and old data is removed by dropping a partition instead of deleting rows. This chapter explains the partitioning methods, pruning, indexes and constraints on partitioned tables, operations such as attach and detach, and patterns for time-series data.',
  html: `
<h2>Why partition</h2>
<ul>
<li><strong>Retention:</strong> dropping a month is instant; deleting it row by row is hours of work, WAL and bloat.</li>
<li><strong>Maintenance:</strong> vacuum, index rebuilds and statistics work on manageable pieces; old partitions become all-frozen and are skipped.</li>
<li><strong>Query performance:</strong> pruning removes irrelevant partitions, and the recent, hot partition and its indexes fit in memory.</li>
<li><strong>Storage tiering:</strong> old partitions can move to cheaper tablespaces, or be compressed or archived.</li>
</ul>
<p>Partitioning is not a general performance fix: queries that do not filter on the partition key must visit every partition, and planning time grows with the partition count. Partition when a table is large (hundreds of gigabytes or billions of rows), has a natural key used in most queries (usually time), and has retention or maintenance problems.</p>

<h2>Methods</h2>
${fig('ptypes', '<b>Figure 21.1</b> Range, list and hash partitioning. Partitions are ordinary tables; the parent holds no data.')}
${code('A partitioned ledger', 'sql')`
CREATE TABLE ledger_entries (
    id          bigint GENERATED ALWAYS AS IDENTITY,
    account_id  bigint NOT NULL,
    posted_at   timestamptz NOT NULL,
    amount      numeric(18,2) NOT NULL,
    PRIMARY KEY (id, posted_at)           -- unique keys must include the partition key
) PARTITION BY RANGE (posted_at);

CREATE TABLE ledger_entries_2026_11 PARTITION OF ledger_entries
    FOR VALUES FROM ('2026-11-01') TO ('2026-12-01');
CREATE TABLE ledger_entries_2026_12 PARTITION OF ledger_entries
    FOR VALUES FROM ('2026-12-01') TO ('2027-01-01');

-- an index on the parent is created on every partition, now and in future
CREATE INDEX ON ledger_entries (account_id, posted_at);`}
<p>Partitions can themselves be partitioned (sub-partitioning), for example by month then by hash of account. Keep the total number of partitions in the hundreds or low thousands, not tens of thousands; planning and locking costs grow with each partition a query must consider.</p>

<h2>Pruning</h2>
${fig('prune', '<b>Figure 21.2</b> Partition pruning at plan time and run time, and partition-wise aggregation.')}
<p>Pruning requires the query's conditions to be on the partition key, in a form the planner understands. <code>WHERE posted_at &gt;= $1</code> prunes; <code>WHERE date(posted_at) = $1</code> does not, because the expression hides the key; rewrite it as a range.</p>

<h2>Constraints and indexes</h2>
<ul>
<li><strong>Unique constraints and primary keys must include the partition key,</strong> because each partition enforces uniqueness on its own. A global "id is unique" needs a separate mechanism (a sequence or UUIDv7 that is unique by construction, or a lookup table).</li>
<li><strong>Foreign keys</strong> can reference partitioned tables (since PostgreSQL 12) and partitioned tables can have foreign keys.</li>
<li><strong>Indexes on the parent</strong> are created per partition. To build one without blocking on a large table, create it <code>ON ONLY</code> the parent (invalid at first), build each partition's index concurrently, and <code>ALTER INDEX ... ATTACH PARTITION</code> them; the parent index becomes valid when all are attached.</li>
</ul>

<h2>Operations</h2>
${code('Monthly partition management', 'sql')`
-- create next month ahead of time (pg_partman or a scheduled job automates this)
CREATE TABLE ledger_entries_2027_01 PARTITION OF ledger_entries
    FOR VALUES FROM ('2027-01-01') TO ('2027-02-01');

-- bulk-load a partition offline, then attach it:
-- a CHECK constraint matching the bounds lets ATTACH skip its validation scan
CREATE TABLE staging (LIKE ledger_entries INCLUDING ALL);
ALTER TABLE staging ADD CONSTRAINT bounds
    CHECK (posted_at >= '2025-11-01' AND posted_at < '2025-12-01');
-- ... COPY data in ...
ALTER TABLE ledger_entries ATTACH PARTITION staging
    FOR VALUES FROM ('2025-11-01') TO ('2025-12-01');

-- retention: detach without blocking queries, archive, drop
ALTER TABLE ledger_entries DETACH PARTITION ledger_entries_2019_11 CONCURRENTLY;
-- pg_dump or copy to object storage, then:
DROP TABLE ledger_entries_2019_11;`}
${fig('retain', '<b>Figure 21.3</b> Retention by DELETE against retention by dropping a partition.')}
<p>PostgreSQL 17 added <code>SPLIT PARTITION</code> and <code>MERGE PARTITIONS</code>, but they were reverted before release; restructuring partitions still means creating new ones and moving data. Plan partition granularity carefully: daily for very high volumes with short retention, monthly for most ledgers.</p>

<h2>Time-series patterns</h2>
<ul>
<li><strong>BRIN indexes</strong> on the time column inside partitions are tiny and effective because data arrives in order (Chapter 8).</li>
<li><strong>Rollups:</strong> keep raw data for a short period and aggregated data (per minute, hour, day) for longer, maintained by scheduled jobs or materialised views.</li>
<li><strong>Latest value per key:</strong> a separate small table updated on each event (or <code>DISTINCT ON (account_id) ... ORDER BY account_id, posted_at DESC</code> with a matching index) avoids scanning history.</li>
<li><strong>Extensions:</strong> TimescaleDB adds automatic time partitioning (hypertables), columnar compression, continuous aggregates and retention policies; pg_partman automates native partition creation and retention.</li>
<li><strong>Immutability:</strong> regulatory ledgers and audit logs should be append-only; revoke UPDATE and DELETE from application roles and consider hash chaining of entries for tamper evidence.</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Partitioning small tables</strong> or on a key queries do not use.</li>
<li><strong>Thousands of tiny partitions,</strong> slowing planning.</li>
<li><strong>Expressions on the partition key</strong> that defeat pruning.</li>
<li><strong>Forgetting to create future partitions,</strong> so inserts fail or land in the default partition.</li>
<li><strong>Retention by DELETE</strong> on partitioned tables.</li>
<li><strong>Expecting global uniqueness</strong> on a column that excludes the partition key.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>See pruning</summary><p>Create a table with 12 monthly partitions. Run EXPLAIN for a one-week range, for the same range via a prepared statement, and for a query using <code>date(posted_at)</code>. Which prune?</p></details>
<details><summary>Choose a method</summary><p>Choose partitioning for: (a) card authorisations kept 13 months; (b) customer data that must stay in its region; (c) a 5-billion-row table of account-level features queried by account.</p><p><em>Answer:</em> (a) monthly range; (b) list by region; (c) hash by account (or none, if indexes suffice).</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Migrate a big table</summary><p>Plan converting a 2-billion-row unpartitioned ledger to a partitioned one with minimal downtime.</p><p><em>Answer sketch:</em> create the partitioned table; attach the existing table as one large historical partition after adding a matching CHECK constraint (NOT VALID, then VALIDATE); route new data to new monthly partitions; later split history in batches.</p></details>
<details><summary>Automate</summary><p>Set up pg_partman (or a scheduled job) to create partitions three months ahead and detach those older than 13 months.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Planning cost</summary><p>Measure planning time for a query that cannot prune, with 10, 100, 1,000 and 5,000 partitions.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know when partitioning helps and when it does not.</li>
<li>I can create range, list and hash partitioned tables and sub-partitions.</li>
<li>I understand plan-time and run-time pruning and partition-wise operations.</li>
<li>I know the rules for unique keys, foreign keys and indexes on partitioned tables.</li>
<li>I can attach, detach and drop partitions safely and automate retention.</li>
<li>I know the main time-series patterns and extensions.</li>
</ul>
`});

CH.push({
  id: 'ch22', n: 22, title: 'Replication, Backup and High Availability',
  lede: 'A single database server is a single point of failure, and a payments platform measures acceptable downtime in seconds and data loss in zero transactions. PostgreSQL ships the write-ahead log to standbys for physical replication, decodes it into row changes for logical replication, and archives it for point-in-time recovery. This chapter explains each mechanism, how to combine them into a highly available cluster with automatic failover, how to read from replicas safely, and how to design backups you can actually restore.',
  html: `
<h2>Physical streaming replication</h2>
${fig('stream', '<b>Figure 22.1</b> A primary streaming WAL to a synchronous standby in the same region and an asynchronous standby elsewhere, with WAL archived to object storage.')}
<p>A standby is a byte-for-byte copy of the primary, built from a base backup, that continuously replays the primary's WAL (Chapter 6). The primary's <em>walsender</em> streams records to the standby's <em>walreceiver</em>; the standby's startup process applies them. Standbys can serve read-only queries (<code>hot_standby = on</code>). Replication is of the whole cluster, all databases, at the same major version and platform.</p>
<ul>
<li><strong>Replication slots</strong> make the primary keep WAL until each standby has received it, so a disconnected standby can catch up. An abandoned slot keeps WAL for ever and fills the disk: set <code>max_slot_wal_keep_size</code> and monitor <code>pg_replication_slots</code>.</li>
<li><strong>Synchronous replication:</strong> list standbys in <code>synchronous_standby_names</code>, for example <code>ANY 1 (node2, node3)</code> (quorum). With <code>synchronous_commit = on</code>, COMMIT waits until one standby has flushed the WAL, so failover to it loses nothing. If no synchronous standby is available, commits wait indefinitely, so always have at least two candidates.</li>
<li><strong>Cascading:</strong> standbys can feed other standbys, reducing load on the primary.</li>
<li><strong>Delayed standbys</strong> (<code>recovery_min_apply_delay</code>, for example one hour) protect against human error: a dropped table can be recovered from the delayed copy.</li>
</ul>

<h2>Reading from replicas</h2>
<p>Replicas let you scale reads and run reports away from the primary, with two complications:</p>
<ul>
<li><strong>Staleness:</strong> an asynchronous replica may be seconds behind, so a user who just changed something may not see it. Options: route a user's reads to the primary for a short time after they write; use <code>synchronous_commit = remote_apply</code> for specific transactions; or, in PostgreSQL 19, use <code>WAIT FOR LSN</code> on the standby to wait until it has replayed the primary's commit LSN.</li>
<li><strong>Query conflicts:</strong> replay may need to remove rows that a long standby query can still see (because vacuum on the primary removed them). After <code>max_standby_streaming_delay</code> the standby cancels the query. <code>hot_standby_feedback = on</code> avoids cancellations by holding back vacuum on the primary, at the cost of bloat there (Chapter 17).</li>
</ul>
${fig('ryw', '<b>Figure 22.2</b> Read-your-writes on a lagging standby with PostgreSQL 19\'s WAIT FOR LSN.')}

<h2>High availability and failover</h2>
<p>PostgreSQL provides the building blocks (replication, <code>pg_promote</code>, <code>pg_rewind</code>, timelines) but not automatic failover. That comes from a cluster manager. Patroni, using a distributed consensus store such as etcd, is the most common choice on virtual machines and Kubernetes (where operators such as CloudNativePG and Crunchy PGO play the same role). Managed services such as Amazon RDS and Aurora, Azure Database for PostgreSQL and Google Cloud SQL and AlloyDB provide their own.</p>
${fig('failover', '<b>Figure 22.3</b> Automatic failover with Patroni: a leader key with a time-to-live decides who is primary, so two nodes can never both accept writes.')}
<p>Design questions for a payments cluster:</p>
<ul>
<li><strong>RPO:</strong> synchronous replication to at least one standby in another availability zone gives zero data loss for committed transactions.</li>
<li><strong>RTO:</strong> failover typically takes 10–60 seconds, dominated by detection timeouts. Applications must reconnect and retry, and treat in-flight commits as unknown (idempotency keys, Chapter 15).</li>
<li><strong>Fencing:</strong> never allow two primaries. Consensus-based leadership, watchdogs and demotion of a returning old primary prevent split brain.</li>
<li><strong>Region failure:</strong> cross-region replicas are usually asynchronous (latency); promoting one may lose recent transactions, which needs a business decision and reconciliation.</li>
<li><strong>Test failover</strong> regularly under load, including the applications.</li>
</ul>

<h2>Logical replication</h2>
${fig('logical', '<b>Figure 22.4</b> Logical replication decodes WAL into row changes for chosen tables, for other PostgreSQL databases or external systems.')}
<p>Logical replication sends row-level changes for selected tables (a <em>publication</em>) to a <em>subscription</em> on another database, which can run a different major version, have different indexes or extra tables. Uses: near-zero-downtime major version upgrades, consolidating or splitting databases, feeding analytics, and change data capture with Debezium into Kafka. Recent releases removed long-standing gaps: logical replication from standbys (16), failover-safe slots that survive promotion (17), and in PostgreSQL 19, replication of sequence values, publications with <code>EXCEPT</code> for excluding tables, conflict detection with <code>retain_dead_tuples</code>, and automatic raising of the effective WAL level when the first logical slot is created.</p>
<p>Limitations remain: DDL is not replicated, so schema changes must be applied to both sides in the right order; large objects are not replicated; and conflicts on the subscriber (for example a duplicate key) stop replication until resolved.</p>

<h2>Backups you can restore</h2>
<p>Replication is not backup: a mistaken <code>DELETE</code> replicates in milliseconds. You need backups that can restore any point in time over your retention window:</p>
<ul>
<li><strong>Physical backups plus WAL archive</strong> with pgBackRest, Barman or WAL-G: full, differential and incremental backups (PostgreSQL 17 has native incremental backup), compression, encryption, parallelism, retention policies and verification.</li>
<li><strong>Logical dumps</strong> (<code>pg_dump</code>) for individual databases or tables, migrations and long-term archives; slow to restore for large databases.</li>
<li><strong>Restore testing:</strong> automate regular restores into a scratch environment, run consistency checks (<code>pg_amcheck</code>) and measure restore time against your RTO.</li>
<li><strong>Separation:</strong> keep backups in another account and region, immutable for the retention period, with different credentials from production (ransomware targets backups).</li>
</ul>
<p>Major version upgrades: <code>pg_upgrade --link</code> or <code>--swap</code> (18) takes minutes regardless of size and now preserves planner statistics (18); logical replication allows upgrades with seconds of downtime.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>A single synchronous standby,</strong> so its failure stops all commits.</li>
<li><strong>Home-made failover scripts</strong> without consensus, risking split brain.</li>
<li><strong>Abandoned replication slots</strong> filling the primary's disk.</li>
<li><strong>Reading from replicas without handling lag</strong> or query cancellations.</li>
<li><strong>Treating replicas as backups.</strong></li>
<li><strong>Never testing restores or failovers.</strong></li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Measure lag</summary><p>Set up a primary and standby. Under pgbench load, read <code>pg_stat_replication</code> (write_lag, flush_lag, replay_lag) and <code>pg_last_wal_replay_lsn()</code> on the standby.</p></details>
<details><summary>Slots</summary><p>Create a slot, stop its consumer, generate WAL, and watch <code>pg_wal</code> grow. Then set <code>max_slot_wal_keep_size</code> and observe the slot being invalidated.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Patroni drill</summary><p>Build a three-node Patroni cluster with etcd. Kill the primary during a write workload; record unavailability, verify no committed transaction was lost, and rejoin the old primary.</p></details>
<details><summary>Upgrade plan</summary><p>Plan a major version upgrade of a 4 TB payments database with under a minute of downtime using logical replication, including sequences and cutover steps.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Cross-region RPO</summary><p>Your DR region is 40 ms away. Compare synchronous and asynchronous replication there for commit latency and worst-case data loss, and propose a design with a business justification.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain streaming replication, slots, synchronous and cascading standbys.</li>
<li>I can read from replicas while handling lag and conflicts, including WAIT FOR LSN in 19.</li>
<li>I can design automatic failover with fencing and know typical RTO and RPO.</li>
<li>I know what logical replication is for and its remaining limits.</li>
<li>I can design and test backups for point-in-time recovery, and plan upgrades.</li>
</ul>
`});

CH.push({
  id: 'ch23', n: 23, title: 'Performance Tuning and Observability',
  lede: 'Most PostgreSQL performance problems are a few bad queries, not bad settings. A disciplined method finds them: measure where time goes, examine the worst offenders with EXPLAIN, fix the cause, and verify. This chapter gives that method and the tools that support it (pg_stat_statements, auto_explain, wait events, the I/O and lock statistics), the configuration settings that matter, connection management, and the application patterns that most often hurt.',
  html: `
<h2>A method</h2>
<ol>
<li><strong>Define the problem</strong> as a measurable symptom: p99 latency of the statement API above 300 ms, CPU at 90% at month end.</li>
<li><strong>Find where time goes</strong> with <code>pg_stat_statements</code>, sorted by total time, not by mean.</li>
<li><strong>Look at waits</strong>: is the server busy on CPU, waiting for I/O, locks, or internal lightweight locks?</li>
<li><strong>Explain the top queries</strong> with <code>EXPLAIN (ANALYZE, BUFFERS)</code> on realistic parameters (Chapter 11).</li>
<li><strong>Fix the cause</strong>: an index, a rewrite, statistics, a schema change, fewer calls from the application. Change one thing at a time.</li>
<li><strong>Verify</strong> with the same measurement, and keep the evidence.</li>
</ol>

<h2>Where time goes</h2>
${fig('pareto', '<b>Figure 23.1</b> Database load is usually concentrated in a handful of statements. Fix those first.')}
${code('Top statements by total time', 'sql')`
CREATE EXTENSION IF NOT EXISTS pg_stat_statements;   -- also in shared_preload_libraries

SELECT queryid, calls,
       round(total_exec_time::numeric / 1000, 1)            AS total_s,
       round(mean_exec_time::numeric, 2)                    AS mean_ms,
       round(100 * total_exec_time / sum(total_exec_time) OVER (), 1) AS pct,
       rows / nullif(calls, 0)                              AS rows_per_call,
       shared_blks_read, temp_blks_written,
       left(query, 80)                                      AS query
FROM pg_stat_statements
ORDER BY total_exec_time DESC
LIMIT 15;`}
<p>A query called 50 million times a day at 2 ms matters more than one called twice at 30 seconds. High <code>shared_blks_read</code> points to I/O; <code>temp_blks_written</code> to spills (work_mem); many rows per call to over-fetching. Capture plans of slow statements in production with <code>auto_explain</code> (<code>log_min_duration = '500ms'</code>, <code>log_analyze</code> with sampling to limit overhead). PostgreSQL 19 adds I/O reporting to auto_explain and EXPLAIN.</p>

<h2>Waits and system views</h2>
<div class="tbl"><table><tr><th>View</th><th>Answers</th></tr>
<tr><td><code>pg_stat_activity</code> (sampled)</td><td>What each session is doing and waiting for (<code>wait_event_type</code>, <code>wait_event</code>); sample every second to build a profile</td></tr>
<tr><td><code>pg_stat_io</code> (16)</td><td>Reads, writes, hits, evictions by backend type and context</td></tr>
<tr><td><code>pg_stat_user_tables</code> / <code>_indexes</code></td><td>Sequential versus index scans, HOT ratio, dead tuples, unused indexes</td></tr>
<tr><td><code>pg_stat_wal</code>, <code>pg_stat_checkpointer</code></td><td>WAL volume, full-page images, checkpoint frequency</td></tr>
<tr><td><code>pg_locks</code>, <code>pg_stat_lock</code> (19)</td><td>Lock waits and contention by lock type</td></tr>
<tr><td><code>pg_stat_replication</code>, <code>pg_stat_recovery</code> (19)</td><td>Replica lag and recovery status</td></tr>
<tr><td><code>pg_stat_progress_*</code></td><td>Progress of vacuum, index builds, COPY, base backups</td></tr>
</table></div>
<p>Export these to your monitoring system (for example with postgres_exporter to Prometheus, or a managed equivalent) and keep history; most diagnosis is comparing now with last week.</p>

<h2>Configuration that matters</h2>
<div class="tbl"><table><tr><th>Setting</th><th>Starting point</th><th>Why</th></tr>
<tr><td><code>shared_buffers</code></td><td>25% of RAM</td><td>Chapter 5</td></tr>
<tr><td><code>effective_cache_size</code></td><td>50–75% of RAM</td><td>Planner's view of total cache</td></tr>
<tr><td><code>work_mem</code></td><td>16–64 MB, raised per query</td><td>Per sort or hash node, per worker</td></tr>
<tr><td><code>maintenance_work_mem</code></td><td>1–2 GB</td><td>Vacuum, index builds</td></tr>
<tr><td><code>random_page_cost</code></td><td>1.1–1.5 on SSD</td><td>Chapter 12</td></tr>
<tr><td><code>effective_io_concurrency</code>, <code>io_method</code></td><td>Higher on cloud and NVMe storage</td><td>Async I/O (Chapter 5)</td></tr>
<tr><td><code>max_wal_size</code>, <code>checkpoint_timeout</code></td><td>Tens of GB; 15–30 min</td><td>Chapter 6</td></tr>
<tr><td>autovacuum settings</td><td>Lower scale factors on big tables; higher cost limit</td><td>Chapter 17</td></tr>
<tr><td><code>max_connections</code></td><td>Hundreds at most; use a pooler</td><td>See below</td></tr>
<tr><td><code>jit</code></td><td>Off for OLTP (default off in 19)</td><td>JIT compilation cost often exceeds its benefit</td></tr>
<tr><td>timeouts</td><td><code>statement_timeout</code>, <code>idle_in_transaction_session_timeout</code>, <code>lock_timeout</code> per role</td><td>Contain runaway work</td></tr>
</table></div>
${fig('mem', '<b>Figure 23.2</b> A memory budget. Peak memory is roughly shared buffers plus per-connection overhead plus work memory for every active sort and hash node. Try raising work_mem or active queries.')}

<h2>Connections</h2>
<p>Each connection is a process using memory and taking part in snapshot creation and lock management. Throughput rises with active connections up to roughly a few times the CPU core count, then falls as contention grows. Thousands of mostly idle application connections waste resources. Use a pooler: <strong>PgBouncer</strong> in transaction mode lets thousands of client connections share tens of server connections. In transaction mode, session state (SET, session advisory locks, temporary tables, LISTEN) does not carry across transactions; PgBouncer 1.21 and later supports protocol-level prepared statements. Size application pools (HikariCP for Java) modestly: a pool of 10–20 per service instance is usually plenty.</p>

<h2>Application patterns that hurt</h2>
<ul>
<li><strong>N+1 queries:</strong> an ORM loads 100 accounts and then issues 100 queries for their balances. Use joins, <code>IN</code> lists or batch fetching. Look for statements with very high call counts in pg_stat_statements.</li>
<li><strong>OFFSET pagination:</strong> <code>OFFSET 80000</code> reads and discards 80,000 rows. Use keyset pagination: <code>WHERE (created_at, id) &lt; ($1, $2) ORDER BY created_at DESC, id DESC LIMIT 50</code>.</li>
<li><strong>Functions and casts on indexed columns:</strong> <code>WHERE lower(email) = ...</code>, implicit casts from mismatched parameter types (a JDBC <code>setString</code> on a bigint column compares as text in some cases).</li>
<li><strong>Exact counts</strong> for UI badges; use estimates or cached counters.</li>
<li><strong>Long transactions around network calls,</strong> holding locks and the xmin horizon.</li>
<li><strong>Chatty single-row inserts</strong> in loops; batch them, or use <code>COPY</code> for bulk loads.</li>
</ul>
${fig('keyset', '<b>Figure 23.3</b> OFFSET pagination slows down linearly with depth; keyset pagination stays constant.')}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Tuning settings before finding the bad queries.</strong></li>
<li><strong>Sorting pg_stat_statements by mean time</strong> and fixing rare queries.</li>
<li><strong>Testing on tiny datasets</strong> where every plan is fast.</li>
<li><strong>max_connections in the thousands</strong> instead of a pooler.</li>
<li><strong>Global work_mem of gigabytes.</strong></li>
<li><strong>No timeouts,</strong> so one runaway query or forgotten session degrades everything.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Top ten</summary><p>Enable pg_stat_statements on a test system under load. List the top ten statements by total time and, for each, whether the cost is CPU, I/O or spills.</p></details>
<details><summary>Memory budget</summary><p>Use Figure 23.2 with your production values. Is peak memory safe? What would you change?</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Keyset pagination</summary><p>Rewrite an OFFSET-paginated statement API with keyset pagination, including ties on timestamps, and measure page 1,000 before and after.</p></details>
<details><summary>Wait profile</summary><p>Sample pg_stat_activity every second for ten minutes during load and build a histogram of wait events. What does it tell you?</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Pool sizing</summary><p>With pgbench, measure throughput and latency for 8, 16, 32, 64, 128 and 256 server connections on an 8-core server. Find the knee and explain it.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I follow a measure, find, explain, fix, verify method.</li>
<li>I can use pg_stat_statements, auto_explain and wait events to find problems.</li>
<li>I know which configuration settings matter and safe starting points.</li>
<li>I can budget memory and size connection pools with a pooler.</li>
<li>I can recognise and fix N+1 queries, OFFSET pagination and other common anti-patterns.</li>
</ul>
`});

CH.push({
  id: 'ch24', n: 24, title: 'Security',
  lede: 'A database holds the data attackers want most, and in a fintech it is subject to PCI DSS, RBI, SEBI, DPDP and SOC 2 controls. PostgreSQL has a strong security model: network and TLS controls, flexible authentication, roles and fine-grained privileges, row-level security, auditing and encryption options. This chapter builds a secure configuration from first principles: who may connect and how, what each role may do, how to isolate tenants, how to audit, how to protect data at rest and in transit, and the pitfalls that turn a database into an attack path.',
  html: `
<h2>Defence in depth</h2>
${fig('gates', '<b>Figure 24.1</b> The six gates between a client and a row. Step through what each controls.')}

<h2>Connecting and authenticating</h2>
${code('pg_hba.conf for a production cluster', 'none')`
# TYPE      DATABASE    USER            ADDRESS           METHOD
local       all         postgres                          peer          # OS admin on the host only
hostssl     payments    +app_login      10.20.0.0/16      scram-sha-256 # services, TLS required
hostssl     payments    +dba_login      10.99.1.0/24      cert          # DBAs with client certificates
hostssl     all         +sso_users      10.99.0.0/16      oauth issuer="https://sso.example.com" scope="openid pg"
hostssl     replication replicator      10.20.5.0/24      scram-sha-256
host        all         all             0.0.0.0/0         reject        # everything else, explicitly`}
<ul>
<li>Use <code>scram-sha-256</code> for passwords (<code>password_encryption = scram-sha-256</code>). MD5 password authentication is deprecated (PostgreSQL 18) and warns on each use in 19; migrate by resetting passwords.</li>
<li>Prefer short-lived credentials: client certificates from an internal CA, OAuth bearer tokens validated by a validator module (PostgreSQL 18), or cloud IAM authentication on managed services (AWS RDS IAM, Azure Entra ID, GCP IAM).</li>
<li>Require TLS with <code>hostssl</code> and verify the server on clients (<code>sslmode=verify-full</code>); PostgreSQL 19 supports SNI, so one server can present different certificates per hostname.</li>
<li>Keep secrets in a vault with rotation; never in code or connection strings committed to repositories.</li>
</ul>

<h2>Roles and privileges</h2>
<p>In PostgreSQL, users and groups are both <em>roles</em>. A role with LOGIN can connect; roles can be members of other roles and inherit their privileges. Every object has an owner, who can do anything to it, including drop it and grant on it. Design roles so that no application or person logs in as an owner or superuser.</p>
${fig('roles', '<b>Figure 24.2</b> A least-privilege role design: an owner that nobody uses, group roles holding privileges, and one login role per service or person.')}
${code('Least privilege, including future tables', 'sql')`
CREATE ROLE payments_owner NOLOGIN;
CREATE ROLE app_rw NOLOGIN;
CREATE ROLE app_ro NOLOGIN;

REVOKE ALL ON DATABASE payments FROM PUBLIC;
REVOKE CREATE ON SCHEMA public FROM PUBLIC;      -- default since PostgreSQL 15
CREATE SCHEMA pay AUTHORIZATION payments_owner;

GRANT CONNECT ON DATABASE payments TO app_rw, app_ro;
GRANT USAGE ON SCHEMA pay TO app_rw, app_ro;
GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA pay TO app_rw;   -- no DELETE
GRANT SELECT ON ALL TABLES IN SCHEMA pay TO app_ro;

-- tables created later by the owner get the same grants
ALTER DEFAULT PRIVILEGES FOR ROLE payments_owner IN SCHEMA pay
    GRANT SELECT, INSERT, UPDATE ON TABLES TO app_rw;
ALTER DEFAULT PRIVILEGES FOR ROLE payments_owner IN SCHEMA pay
    GRANT SELECT ON TABLES TO app_ro;

-- column-level: support staff may not read full card or identity numbers
REVOKE SELECT ON pay.customers FROM app_ro;
GRANT SELECT (id, name, city, created_at) ON pay.customers TO app_ro;

CREATE ROLE svc_payments LOGIN IN ROLE app_rw;
ALTER ROLE svc_payments SET statement_timeout = '5s';`}
<p>Predefined roles grant common capabilities without superuser: <code>pg_read_all_data</code>, <code>pg_monitor</code>, <code>pg_signal_backend</code>, <code>pg_maintain</code> (17) for vacuum and reindex, <code>pg_create_subscription</code>. Superuser should be reserved for break-glass use, with every use logged.</p>

<h2>Row-level security</h2>
<p>Row-level security (RLS) attaches policies to a table that filter which rows a role can see or modify. It is the strongest way to isolate tenants in a shared schema, because it applies to every query, however it is written.</p>
${fig('rls', '<b>Figure 24.3</b> The same query under an RLS policy keyed on a per-transaction tenant setting.')}
${code('Tenant isolation with RLS', 'sql')`
ALTER TABLE pay.payments ENABLE ROW LEVEL SECURITY;
ALTER TABLE pay.payments FORCE ROW LEVEL SECURITY;   -- applies to the owner too

CREATE POLICY tenant_isolation ON pay.payments
    USING      (tenant_id = current_setting('app.tenant', true)::int)
    WITH CHECK (tenant_id = current_setting('app.tenant', true)::int);

-- the application sets the tenant per transaction (safe with transaction-mode pooling)
BEGIN;
SET LOCAL app.tenant = '101';
SELECT * FROM pay.payments WHERE status = 'failed';    -- only tenant 101's rows
COMMIT;

CREATE INDEX ON pay.payments (tenant_id, created_at);  -- policies are predicates: index them`}
<p>Cautions: superusers and roles with <code>BYPASSRLS</code> ignore policies; table owners do too unless <code>FORCE</code> is set; the tenant setting must come from a trusted source (the application after authentication), never from user input; and policies using functions should be simple and leakproof so the planner can push them into indexes. Test that every table holding tenant data has RLS enabled.</p>

<h2>Dangerous corners</h2>
<ul>
<li><strong>search_path hijacking:</strong> functions and queries resolve unqualified names through <code>search_path</code>. An attacker who can create objects in a schema earlier in the path can substitute their own function. Remove CREATE on public, schema-qualify names in privileged code, and set <code>search_path</code> explicitly on functions.</li>
<li><strong>SECURITY DEFINER functions</strong> run with the owner's privileges, like setuid programs. Always <code>SET search_path = pg_catalog, pay</code> on them, validate inputs, and grant EXECUTE narrowly (revoke from PUBLIC, which has it by default).</li>
<li><strong>Dynamic SQL</strong> in PL/pgSQL must use <code>format()</code> with <code>%I</code> and <code>%L</code>, or <code>USING</code> parameters, never string concatenation of inputs.</li>
<li><strong>Untrusted languages and extensions:</strong> <code>plpython3u</code>, <code>COPY ... PROGRAM</code> and file access functions give operating system access; restrict to superuser and avoid in application roles.</li>
<li><strong>SQL injection</strong> is still the application's job: use bound parameters (JDBC <code>PreparedStatement</code>) for every value.</li>
</ul>

<h2>Auditing</h2>
<p>Standard logging (<code>log_connections</code>, <code>log_disconnections</code>, <code>log_statement = 'ddl'</code>) records sessions and schema changes. The <code>pgaudit</code> extension produces structured audit records by class (read, write, ddl, role, function) or per object, which is what PCI DSS requirement 10 and RBI audit requirements need. Ship logs off the server immediately to a store administrators of the database cannot alter, and alert on privileged activity: role changes, superuser sessions, bulk exports, disabling of RLS.</p>
${code('pgaudit settings', 'none')`
shared_preload_libraries = 'pgaudit, pg_stat_statements'
pgaudit.log = 'ddl, role, write'          # all schema, privilege and data changes
pgaudit.log_relation = on
pgaudit.log_parameter = off               # avoid writing card data into logs
-- object-level audit of reads on sensitive tables:
-- set pgaudit.role = 'auditor' and GRANT SELECT ON pay.cards TO auditor;`}

<h2>Encryption</h2>
<ul>
<li><strong>In transit:</strong> TLS for clients and replication, verified certificates.</li>
<li><strong>At rest:</strong> community PostgreSQL has no built-in transparent data encryption; use encrypted volumes (cloud KMS-backed disks, LUKS) and encrypted backups. Some distributions and managed services provide TDE; check where keys live.</li>
<li><strong>Column-level:</strong> encrypt or tokenise the most sensitive fields (PAN, Aadhaar, account numbers) in the application or a tokenisation service; <code>pgcrypto</code> can encrypt in SQL, but then keys reach the database and its logs. For PCI DSS, keeping PANs out of the database through tokenisation is usually best.</li>
<li><strong>Masking</strong> for non-production copies with tools such as PostgreSQL Anonymizer; never restore production data unmasked into test.</li>
</ul>

<h2>A hardening checklist</h2>
<ol>
<li>Supported major version, patched within your vulnerability SLA.</li>
<li>Network access restricted; TLS required; <code>reject</code> as the last hba rule.</li>
<li>SCRAM or certificate or OAuth authentication; no trust, password or md5.</li>
<li>No application logs in as superuser or owner; least-privilege group roles; default privileges set.</li>
<li>CREATE revoked on public; search_path set on SECURITY DEFINER functions.</li>
<li>RLS on every multi-tenant table, with FORCE.</li>
<li>pgaudit and connection logging, shipped off-host.</li>
<li>Encrypted storage, backups and replication; tokenised card and identity numbers.</li>
<li>Timeouts per role; connection limits per role.</li>
<li>Regular privilege reviews, as PCI DSS 7.2.4 and RBI expect.</li>
</ol>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Applications connecting as postgres</strong> or as the schema owner.</li>
<li><strong>A <code>trust</code> line</strong> left in pg_hba.conf from setup.</li>
<li><strong>RLS without FORCE,</strong> silently bypassed by the owner role the application uses.</li>
<li><strong>SECURITY DEFINER without a fixed search_path.</strong></li>
<li><strong>Bind parameters logged</strong> with card or identity numbers.</li>
<li><strong>Production snapshots restored into test unmasked.</strong></li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>

  id: 'ch25', n: 25, title: 'Scaling Out and Choosing Architectures',
  lede: 'A single well-tuned PostgreSQL server handles more than most teams expect: tens of thousands of transactions per second and many terabytes of data. Beyond that, or for resilience and geography, there are several paths: connection pooling, replicas, caches, partitioning, sharding with Citus, cloud services with disaggregated storage, and PostgreSQL-compatible distributed databases. This final chapter shows how to climb the scaling ladder in order, what each architecture trades away, and how to decide when PostgreSQL is not the right tool for a workload.',
  html: `
<h2>The scaling ladder</h2>
${fig('ladder', '<b>Figure 25.1</b> Scale in order of cost and risk. Each rung adds operational complexity.')}

<h2>Connection pooling</h2>
${fig('pool', '<b>Figure 25.2</b> A pooler multiplexes hundreds of client connections onto a few dozen server connections.')}
<p>Chapter 23 explained why: busy backends should number a few times the CPU core count. PgBouncer is the usual choice; alternatives include pgcat and Odyssey, and managed services offer built-in proxies (RDS Proxy, for example). Run poolers close to the application or as a highly available pair, and monitor their queue time: clients waiting for a server connection means the database or the pool size is the bottleneck.</p>

<h2>Architectures</h2>
${fig('arch', '<b>Figure 25.3</b> Four ways to run PostgreSQL-compatible databases at scale.')}
<div class="tbl"><table><tr><th></th><th>Primary + replicas</th><th>Sharded (Citus)</th><th>Disaggregated storage</th><th>Distributed SQL</th></tr>
<tr><td>Write scaling</td><td>One server</td><td>Across workers</td><td>One writer</td><td>Across nodes</td></tr>
<tr><td>PostgreSQL compatibility</td><td>Full</td><td>High (extension); some query limits</td><td>High; managed-service limits</td><td>Partial; different engine</td></tr>
<tr><td>Cross-partition transactions</td><td>Not applicable</td><td>Supported, slower</td><td>Not applicable</td><td>Supported, network round trips</td></tr>
<tr><td>Operational model</td><td>You or managed</td><td>You or managed (Azure Cosmos DB for PostgreSQL)</td><td>Managed</td><td>You or managed</td></tr>
<tr><td>Typical fit</td><td>Most OLTP</td><td>Multi-tenant SaaS, real-time analytics</td><td>Cloud OLTP with elastic reads</td><td>Global, always-on, very high write scale</td></tr>
</table></div>

<h2>Sharding well</h2>
<p>If you must shard, the choice of key decides everything:</p>
<ul>
<li><strong>Choose a key most transactions are scoped to:</strong> tenant, merchant, or customer. A payment between two customers on different shards becomes a distributed transaction.</li>
<li><strong>Co-locate related tables</strong> on the same key so joins stay local; replicate small reference tables (currencies, MCC codes) to every node.</li>
<li><strong>Avoid hot keys:</strong> one enormous merchant can overload a shard; plan for isolating large tenants to their own nodes.</li>
<li><strong>Global uniqueness and sequences</strong> need care: UUIDv7 or per-shard ranges.</li>
<li><strong>Rebalancing</strong> must move shards online as data grows.</li>
</ul>
<p>Application-level sharding (each service instance routes to one of several independent PostgreSQL clusters by key) is also common in payments, and keeps each cluster a simple, standard PostgreSQL.</p>

<h2>Consistency at a distance</h2>
<p>Once data lives on several machines, the CAP theorem and its refinement PACELC apply: during a network partition you choose between availability and consistency, and even without partitions you trade latency for consistency. A synchronous replica in another zone adds a round trip to every commit; a synchronous replica in another region adds tens of milliseconds. Ledgers and balances need strong consistency; caches, search indexes and analytics can be eventually consistent if their staleness is known and bounded. Patterns that help across systems: the transactional outbox (write the event in the same database transaction as the change, then publish it from the outbox table or via logical decoding), idempotent consumers, and periodic reconciliation.</p>

<h2>When PostgreSQL is not the answer</h2>
<div class="tbl"><table><tr><th>Workload</th><th>Why PostgreSQL struggles</th><th>Options</th></tr>
<tr><td>Large-scale analytics over billions of rows</td><td>Row storage reads whole rows; limited vectorised execution</td><td>Columnar warehouses or engines (ClickHouse, BigQuery, Snowflake, DuckDB); in-Postgres columnar extensions such as pg_duckdb or Hydra for moderate sizes</td></tr>
<tr><td>Very high-volume ephemeral data</td><td>MVCC, WAL and vacuum costs per write</td><td>Redis or Valkey for counters, sessions, rate limits</td></tr>
<tr><td>Event streaming with many consumers</td><td>Tables make poor durable logs at high fan-out</td><td>Kafka or similar, fed by the outbox pattern</td></tr>
<tr><td>Full-text search with heavy faceting and relevance tuning</td><td>Built-in ranking is simpler</td><td>OpenSearch or Elasticsearch, fed by CDC</td></tr>
<tr><td>Billions of vectors at high QPS</td><td>Memory and index build times</td><td>Dedicated vector engines</td></tr>
<tr><td>Global multi-region writes with automatic failover</td><td>One primary; async cross-region replicas</td><td>Distributed SQL, or region-partitioned application design</td></tr>
</table></div>
<p>The default for a fintech should still be PostgreSQL for the system of record: transactions, constraints, mature tooling and a large talent pool. Add specialised systems around it for workloads that genuinely need them, fed from it reliably.</p>

<h2>Looking ahead</h2>
<p>PostgreSQL's direction is visible in recent releases: asynchronous I/O (18) will extend to more operations and to writes; logical replication is closing its gaps (sequences, conflicts, automatic setup in 19), moving towards practical multi-writer and zero-downtime upgrades; operational tools such as online <code>REPACK</code> and plan advice (19) reduce reliance on extensions; and the table and index access method APIs allow new storage engines, including columnar ones, to plug in. The fundamentals in this book, pages and buffers, logs and checkpoints, trees and inverted indexes, snapshots and locks, cost-based planning, are the same ones those developments build on.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Sharding before fixing queries</strong> and pooling.</li>
<li><strong>A shard key that splits most transactions</strong> across nodes.</li>
<li><strong>Dual writes</strong> to the database and another system without an outbox, losing consistency on failure.</li>
<li><strong>Assuming wire compatibility means full compatibility</strong> with distributed SQL engines.</li>
<li><strong>Running analytics on the primary</strong> instead of a replica or a columnar store.</li>
</ul></div>
