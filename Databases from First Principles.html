CH.push({
  id: 'ch08', n: 8, title: 'Hash, BRIN, Partial and Expression Indexes',
  lede: 'B-trees are the default, but PostgreSQL offers more tools for particular shapes of data and query. Hash indexes answer equality only, in constant time. BRIN indexes summarise ranges of pages and can index billions of time-ordered rows in a few megabytes. Partial indexes cover only the rows that matter; expression indexes index a computed value. This chapter explains each, when it wins, and how to build and maintain indexes on live systems.',
  html: `
<h2>Hash indexes</h2>
${fig('hashix', '<b>Figure 8.1</b> A hash index maps a key\'s hash code to a bucket page holding hash codes and heap TIDs.')}
<p>A hash index stores only a 4-byte hash code per entry, not the key, and supports only equality (<code>=</code>). Buckets split one at a time as the index grows (linear hashing, a technique from the data structures book). Since PostgreSQL 10 hash indexes are WAL-logged and crash-safe. They can be smaller than a B-tree when keys are long (URLs, tokens, hashes), and a lookup touches fewer pages. They cannot enforce uniqueness, support ranges or sorting, or be multicolumn. In practice B-trees win most cases; consider hash for equality lookups on long, unique-ish text values, and measure.</p>

<h2>BRIN: block range indexes</h2>
<p>A BRIN index stores, for each range of consecutive heap pages (128 by default, <code>pages_per_range</code>), a summary: for the default <code>minmax</code> operator class, the minimum and maximum value in that range. A query reads the summaries, then only the page ranges that might contain matches, checking each row. It is a lossy index, so the plan shows a <em>Bitmap Heap Scan</em> with a recheck.</p>
${fig('brin', '<b>Figure 8.2</b> BRIN summaries for a time column. Whether BRIN helps depends entirely on whether the values follow the physical order of the table.')}
<ul>
<li><strong>Ideal for:</strong> append-mostly tables where a column correlates with insertion order: event times, ledger entry IDs, log sequence numbers.</li>
<li><strong>Tiny:</strong> one summary per 128 pages (1 MB of heap) means a few megabytes for terabytes of data, and almost no write overhead.</li>
<li><strong>Variants:</strong> <code>minmax_multi</code> (PostgreSQL 14) stores several intervals per range, tolerating some out-of-order rows; <code>bloom</code> handles equality on uncorrelated columns.</li>
<li><strong>Maintenance:</strong> new pages are summarised by vacuum or automatically with <code>autosummarize = on</code>; updates that move rows erode correlation.</li>
</ul>
${code('BRIN on a large event table', 'sql')`
CREATE INDEX ledger_entries_brin ON ledger_entries
    USING brin (posted_at) WITH (pages_per_range = 64, autosummarize = on);

SELECT attname, correlation FROM pg_stats
WHERE tablename = 'ledger_entries' AND attname = 'posted_at';   -- ≈ 0.99

EXPLAIN (ANALYZE)
SELECT sum(amount) FROM ledger_entries
WHERE posted_at >= '2026-10-01' AND posted_at < '2026-10-02';
--  Bitmap Heap Scan on ledger_entries
--    Recheck Cond: ...   Rows Removed by Index Recheck: 4120
--    Heap Blocks: lossy=2368
--    ->  Bitmap Index Scan on ledger_entries_brin`}

<h2>Partial indexes</h2>
<p>A partial index includes only rows that satisfy a <code>WHERE</code> clause. When queries always look for a small subset, such as pending payments, unprocessed jobs, active accounts or non-deleted rows, a partial index is tiny, fast and cheap to maintain, because rows outside the predicate are never indexed.</p>
${fig('idxsize', '<b>Figure 8.3</b> Index sizes for the same table. Partial and BRIN indexes can be thousands of times smaller than full B-trees.')}
${code('Partial and unique partial indexes', 'sql')`
-- the queue of work to do: small, hot, and stays small as history grows
CREATE INDEX payments_pending_idx ON payments (created_at)
    WHERE status = 'pending';

-- the planner uses it only when the query implies the predicate
SELECT id FROM payments WHERE status = 'pending' ORDER BY created_at LIMIT 100;

-- "at most one active card per account", while allowing many cancelled ones
CREATE UNIQUE INDEX one_active_card ON cards (account_id) WHERE status = 'active';

-- soft deletes: unique email among non-deleted users
CREATE UNIQUE INDEX users_email_live ON users (lower(email)) WHERE deleted_at IS NULL;`}
<p>The planner must be able to prove the query's <code>WHERE</code> implies the index predicate. Simple cases work (<code>status = 'pending'</code> matches exactly). Parameterised queries can be a problem: with a generic plan for <code>status = $1</code>, the planner cannot know <code>$1</code> is 'pending'. Write the constant in the query text where a partial index matters.</p>

<h2>Expression indexes</h2>
<p>An index on an expression stores the computed value, so queries that use the same expression can use the index.</p>
${code('Index what you search for', 'sql')`
CREATE INDEX users_email_lower ON users (lower(email));
SELECT * FROM users WHERE lower(email) = lower($1);       -- uses the index

-- a date filter on a timestamptz column
CREATE INDEX payments_day ON payments ((created_at AT TIME ZONE 'Asia/Kolkata')::date);
-- but a range is often better and works with a plain index:
SELECT * FROM payments
WHERE created_at >= '2026-11-06 00:00+05:30' AND created_at < '2026-11-07 00:00+05:30';

-- a field inside JSON (Chapter 18)
CREATE INDEX events_type ON events ((payload->>'type'));`}
<p>The expression must be <code>IMMUTABLE</code>: same inputs, same output, forever. That is why <code>created_at::date</code> on a <code>timestamptz</code> cannot be indexed directly (the result depends on the session time zone), while the version with an explicit time zone can. PostgreSQL keeps statistics on indexed expressions, which helps the planner estimate selectivity even when the index is not used. PostgreSQL 18's virtual generated columns are another way to name a computed value, but indexes on them are not supported; index the expression or use a stored generated column.</p>

<h2>Combining indexes: bitmap scans</h2>
<p>PostgreSQL can combine several indexes in one query. Each index produces a bitmap of matching heap pages (or tuples); bitmaps are combined with AND or OR, and the heap is then read in physical order (Chapter 11). So two single-column indexes can serve <code>WHERE a = 1 AND b = 2</code>, though usually less efficiently than one multicolumn index on (a, b).</p>

<h2>Building and maintaining indexes on live systems</h2>
<ul>
<li><code>CREATE INDEX CONCURRENTLY</code> builds without blocking writes; it waits for existing transactions and scans twice. It cannot run inside a transaction block. If it fails, drop the leftover invalid index.</li>
<li><code>REINDEX CONCURRENTLY</code> rebuilds a bloated or corrupt index without blocking.</li>
<li>Raise <code>maintenance_work_mem</code> for faster builds; B-tree, BRIN and (since PostgreSQL 18) GIN builds can use parallel workers (<code>max_parallel_maintenance_workers</code>).</li>
<li>On partitioned tables, create the index on each partition concurrently, then attach them to an index created on the parent with <code>ON ONLY</code> (Chapter 21).</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>BRIN on an uncorrelated column</strong>, which scans everything.</li>
<li><strong>Partial index predicates that queries do not literally imply,</strong> especially with parameters.</li>
<li><strong>Non-immutable expressions</strong>, such as time zone dependent casts.</li>
<li><strong>Full indexes on boolean or status columns</strong> where a partial index on the rare value would do.</li>
<li><strong>Forgetting to drop invalid indexes</strong> after failed concurrent builds; they still slow writes.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Which index?</summary><p>Choose an index type for: (a) API token lookup by a 64-character string; (b) a 2-billion-row event table queried by day; (c) the 0.5% of loans in arrears; (d) case-insensitive login by email.</p><p><em>Answer:</em> (a) B-tree or hash; (b) BRIN; (c) partial B-tree; (d) expression index on lower(email), unique.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Measure BRIN</summary><p>Load 50 million rows in time order, then create B-tree and BRIN indexes on the time column. Compare size, build time, and the time of a one-day range query.</p></details>
<details><summary>Partial predicate</summary><p>Prepare <code>SELECT ... WHERE status = $1</code> and execute it six times with 'pending'. Check whether the partial index is still used after the plan becomes generic, and explain.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Correlation decay</summary><p>Simulate updates that move 5% of rows to new pages each day. How does BRIN effectiveness decline, and how would <code>minmax_multi</code> or periodic reorganisation (<code>REPACK</code> in PostgreSQL 19) help?</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know what hash indexes can and cannot do.</li>
<li>I can explain BRIN summaries and the role of physical correlation.</li>
<li>I can use partial indexes for hot subsets and conditional uniqueness.</li>
<li>I can build expression indexes and explain the immutability requirement.</li>
<li>I know how bitmap scans combine indexes.</li>
<li>I can build and rebuild indexes safely on live tables.</li>
</ul>
`});

/* ===================== Chapter 9: GiST, SP-GiST and GIN ===================== */
const RPTS = (() => { const r = rng(11), P = []; [[90, 70], [250, 60], [130, 190], [330, 180], [470, 90], [520, 210]].forEach(([cx, cy], g) => { for (let i = 0; i < 5; i++) P.push([cx + (r() - 0.5) * 90, cy + (r() - 0.5) * 70, g]); }); return P; })();
FIG.rtree = host => {
  const G = [...new Set(RPTS.map(p => p[2]))].map(g => { const ps = RPTS.filter(p => p[2] === g), xs = ps.map(p => p[0]), ys = ps.map(p => p[1]); return [Math.min(...xs) - 6, Math.min(...ys) - 6, Math.max(...xs) + 6, Math.max(...ys) + 6]; });
  const top = [[G[0], G[1], G[2]], [G[3], G[4], G[5]]].map(gs => [Math.min(...gs.map(g => g[0])) - 6, Math.min(...gs.map(g => g[1])) - 6, Math.max(...gs.map(g => g[2])) + 6, Math.max(...gs.map(g => g[3])) + 6]);
  const Q = [240, 150, 440, 234], ov = (a, b) => !(a[2] < b[0] || a[0] > b[2] || a[3] < b[1] || a[1] > b[3]);
  const N = ['Thirty points (merchant locations). A GiST index for geometry works like an R-tree: it groups nearby entries and stores each group\'s bounding box.', 'Leaf pages each hold a few points; their parent entries are the bounding boxes (blue) of those groups.', 'Upper levels group the groups (purple). The root has two entries, each covering half the space. Boxes may overlap; GiST only requires that each covers everything beneath it.', 'Query: which points lie in the red rectangle? Start at the root; descend into every entry whose box overlaps the query.', 'At the next level, only some leaf boxes overlap the query; the others are skipped without reading their pages.', 'In the visited leaves, test each point exactly. The index gave a short list of candidates; the exact test removes false positives. This filter-then-recheck pattern is how GiST supports any data with a notion of "contains" or "overlaps".'];
  stepper(host, N.map((note, k) => ({ k, note })), f => {
    let s = '';
    if (f.k >= 2) top.forEach((b, i) => s += `<rect x="${f1(b[0])}" y="${f1(b[1])}" width="${f1(b[2] - b[0])}" height="${f1(b[3] - b[1])}" rx="6" class="${f.k >= 3 && ov(b, Q) ? 'area-hot' : 'area-cmp'}"/>`);
    if (f.k >= 1) G.forEach(b => { const vis = f.k >= 4 && ov(b, Q); s += `<rect x="${f1(b[0])}" y="${f1(b[1])}" width="${f1(b[2] - b[0])}" height="${f1(b[3] - b[1])}" rx="4" class="nd ${vis ? 'warn' : 'acc'}" fill-opacity="0.35"/>`; });
    if (f.k >= 3) s += `<rect x="${Q[0]}" y="${Q[1]}" width="${Q[2] - Q[0]}" height="${Q[3] - Q[1]}" class="ed hot dash" fill="none" stroke-width="2"/>`;
    RPTS.forEach(([x, y]) => { const inQ = x >= Q[0] && x <= Q[2] && y >= Q[1] && y <= Q[3]; s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="4" class="${f.k >= 5 && inQ ? 'f6' : 'f3'}"/>`; });
    const visited = G.filter(b => ov(b, Q)).length;
    if (f.k >= 4) s += tx(620, 260, `leaf pages read: ${visited} of 6`, 'tp hot', 'end');
    return { s, w: 640, h: 270 };
  });
};

CH.push({
  id: 'ch09', n: 9, title: 'GiST, SP-GiST and GIN',
  lede: 'B-trees need a total order: every pair of values must compare as less, equal or greater. Much modern data has no such order. Rectangles overlap, time ranges intersect, documents contain words, JSON objects contain keys, points are near each other. PostgreSQL handles these with three extensible index frameworks: GiST for balanced trees of overlapping regions, SP-GiST for space-partitioning trees, and GIN for inverted indexes. They power full-text search, JSONB, PostGIS, range types and exclusion constraints, and this chapter explains how they work.',
  html: `
<h2>Extensible indexing</h2>
<p>PostgreSQL separates <strong>access methods</strong> (the index structure: btree, hash, gist, spgist, gin, brin) from <strong>operator classes</strong> (how a particular data type is handled by that structure). An operator class tells the access method which operators it supports and provides support functions. This is how extensions such as PostGIS and pg_trgm add indexable types and operators without changing PostgreSQL's core.</p>
${code('Which operators can each index serve?', 'sql')`
SELECT am.amname, opc.opcname, typ.typname
FROM pg_opclass opc
JOIN pg_am am ON am.oid = opc.opcmethod
JOIN pg_type typ ON typ.oid = opc.opcintype
WHERE am.amname IN ('gist', 'spgist', 'gin')
ORDER BY 1, 3;`}

<h2>GiST: generalised search trees</h2>
<p>GiST is a balanced tree, like a B-tree, but each internal entry holds a <em>predicate</em> that is true of everything beneath it rather than a separator key. For geometry the predicate is a bounding box, giving an R-tree; for ranges it is a covering range; for text similarity it can be a signature. An operator class provides a few functions:</p>
<ul>
<li><strong>consistent:</strong> could anything under this entry satisfy the query? (used to decide which children to visit)</li>
<li><strong>union:</strong> compute the predicate covering a set of entries (the parent's bounding box)</li>
<li><strong>penalty:</strong> how much would this entry's predicate grow if a new item were added? (choose where to insert)</li>
<li><strong>picksplit:</strong> how to divide an overflowing page into two groups</li>
<li><strong>distance</strong> (optional): for nearest-neighbour ordering</li>
</ul>
${fig('rtree', '<b>Figure 9.1</b> A GiST R-tree over points, and a window query that visits only the leaf pages whose bounding boxes overlap the query rectangle.')}
<p>Because sibling boxes may overlap, a search may need to descend several branches, unlike a B-tree, which descends exactly one. Good <code>picksplit</code> and <code>penalty</code> functions keep overlap small. GiST also supports <strong>K-nearest-neighbour</strong> search: <code>ORDER BY location &lt;-&gt; point LIMIT 10</code> walks the tree in order of distance using a priority queue (the heap from the data structures book), returning the closest items without examining the rest (Chapter 19).</p>

<h3>Ranges and exclusion constraints</h3>
<p>Range types (<code>int4range</code>, <code>numrange</code>, <code>tstzrange</code>, <code>daterange</code>, and multiranges since PostgreSQL 14) are indexed with GiST, supporting overlap (<code>&amp;&amp;</code>), containment (<code>@&gt;</code>, <code>&lt;@</code>) and adjacency. GiST also enables <strong>exclusion constraints</strong>, a generalisation of uniqueness: no two rows may satisfy a set of operators together.</p>
${code('No overlapping holds on the same account', 'sql')`
CREATE EXTENSION IF NOT EXISTS btree_gist;   -- lets GiST handle = on scalar columns

CREATE TABLE card_holds (
    id          bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
    account_id  bigint NOT NULL,
    period      tstzrange NOT NULL,
    amount      numeric(18,2) NOT NULL,
    EXCLUDE USING gist (account_id WITH =, period WITH &&)
);

INSERT INTO card_holds (account_id, period, amount)
VALUES (7, '[2026-11-06 10:00, 2026-11-06 12:00)', 500);
INSERT INTO card_holds (account_id, period, amount)
VALUES (7, '[2026-11-06 11:00, 2026-11-06 13:00)', 200);
-- ERROR: conflicting key value violates exclusion constraint

-- PostgreSQL 18 temporal primary key, the same idea in standard syntax:
-- PRIMARY KEY (account_id, period WITHOUT OVERLAPS)`}

<h2>SP-GiST: space-partitioned trees</h2>
${fig('quad', '<b>Figure 9.2</b> SP-GiST supports unbalanced trees that divide space into non-overlapping parts, such as quadtrees, k-d trees and radix tries.')}
<p>SP-GiST implements trees where each level partitions the space into disjoint parts: quadtrees and k-d trees for points, radix tries (prefix trees) for text and IP addresses. Because parts never overlap, a search follows one path for a point lookup, and the tree adapts to the data's distribution. The trees are unbalanced, so SP-GiST maps nodes onto disk pages cleverly to keep the number of page reads low. Use it for points with uneven density, text prefix searches (<code>^@</code> operator), and <code>inet</code> network containment.</p>

<h2>GIN: generalised inverted indexes</h2>
${fig('gin', '<b>Figure 9.3</b> An inverted index maps each element to the rows that contain it. Multi-element queries intersect or merge the lists.')}
<p>GIN is for values that contain many elements: arrays, <code>tsvector</code> documents (words), <code>jsonb</code> (keys and values) and trigrams (Chapter 10). Its structure is a B-tree of distinct elements, each with a <strong>posting list</strong> of row TIDs (compressed, and itself a B-tree when long). Queries such as "contains all of these elements" intersect lists; "contains any" unions them.</p>
<h3>Writes are expensive, so GIN buffers them</h3>
<p>Inserting one document may add dozens of elements, each requiring an update in a different part of the index. With <code>fastupdate</code> on (the default), new entries go to an unsorted <em>pending list</em> and are merged into the main index in bulk by vacuum, by <code>gin_clean_pending_list()</code>, or when the list exceeds <code>gin_pending_list_limit</code> (4 MB). Searches must scan the pending list too, so a large list slows reads; an insert that triggers the merge pays the whole cost, causing occasional slow inserts. For latency-sensitive writes, consider turning <code>fastupdate</code> off or lowering the limit.</p>
<h3>GiST or GIN?</h3>
<div class="tbl"><table><tr><th></th><th>GIN</th><th>GiST</th></tr>
<tr><td>Lookup speed</td><td>Faster for containment ("has these words or keys")</td><td>Slower; may need rechecks</td></tr>
<tr><td>Build and update</td><td>Slower, larger; pending list helps updates</td><td>Faster, smaller</td></tr>
<tr><td>Exactness</td><td>Usually exact for tsvector and jsonb</td><td>Often lossy (signatures), requires recheck</td></tr>
<tr><td>Ordering and nearest-neighbour</td><td>No</td><td>Yes (distance operators)</td></tr>
<tr><td>Typical use</td><td>Full-text search, jsonb containment, arrays, trigram LIKE</td><td>Geometry, ranges, exclusion constraints, KNN, trigram similarity ordering</td></tr>
</table></div>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Using B-tree thinking for overlap queries</strong>: <code>WHERE start &lt; $2 AND finish &gt; $1</code> on two B-tree columns scales poorly; use a range column with GiST.</li>
<li><strong>Checking overlaps in application code</strong> instead of an exclusion constraint, leaving race conditions.</li>
<li><strong>Forgetting <code>btree_gist</code></strong> when an exclusion constraint mixes equality and overlap.</li>
<li><strong>A huge GIN pending list</strong> on write-heavy tables with infrequent vacuum.</li>
<li><strong>Expecting GIN to support ORDER BY or range queries.</strong></li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Pick the framework</summary><p>Which index for: (a) "transactions within 500 m of this point"; (b) "accounts tagged both 'nri' and 'premium'" with a text array column; (c) "no two interest rate periods overlap per product"; (d) IP address within a network block?</p><p><em>Answer:</em> (a) GiST (PostGIS); (b) GIN on the array; (c) GiST exclusion constraint; (d) GiST with the inet_ops operator class, or SP-GiST.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Overlap two ways</summary><p>Store 5 million bookings as start and finish columns with B-tree indexes, and again as a <code>tstzrange</code> with GiST. Compare the time of "bookings overlapping this hour".</p></details>
<details><summary>Pending list</summary><p>Insert 200,000 rows into a table with a GIN index and <code>fastupdate</code> on. Measure insert latency percentiles. Repeat with <code>fastupdate = off</code>.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Design an operator class</summary><p>Sketch the consistent, union, penalty and picksplit functions for a GiST operator class over one-dimensional intervals.</p><p><em>Answer sketch:</em> union is the min start and max end; consistent tests overlap; penalty is the growth in length; picksplit sorts by start and cuts in the middle.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain access methods versus operator classes.</li>
<li>I can describe GiST's predicates and support functions, and why searches may follow several branches.</li>
<li>I can use range types and exclusion constraints.</li>
<li>I can explain SP-GiST's space partitioning and when it fits.</li>
<li>I can describe GIN posting lists and the pending list trade-off.</li>
<li>I can choose between GIN and GiST.</li>
</ul>
`});

CH.push({
  id: 'ch10', n: 10, title: 'Full-Text and Fuzzy Search',
  lede: 'LIKE \'%refund%\' scans every row and knows nothing about language. PostgreSQL has a complete text search engine built in: documents are parsed and normalised into lexemes, indexed with GIN, matched with Boolean and phrase queries, and ranked by relevance. For names, typos and substring search, the pg_trgm extension indexes three-letter fragments. This chapter shows how both work and when they are enough, so you need not run a separate search cluster for many applications.',
  html: `
<h2>Why LIKE is not search</h2>
<p><code>WHERE description LIKE '%refund%'</code> cannot use a B-tree index (the pattern has no fixed prefix), so it reads every row. It also misses "refunded" and "refunds", matches "nonrefundable", and cannot rank results. Real search needs linguistic normalisation, an inverted index and a scoring function.</p>

<h2>Documents, lexemes and queries</h2>
${fig('ftspipe', '<b>Figure 10.1</b> A sentence through the English text search configuration: tokens, normalised lexemes, a tsvector, and a match against a tsquery.')}
<p>Two types carry text search:</p>
<ul>
<li><code>tsvector</code>: a document as a sorted set of lexemes with positions and optional weights (A–D, for example title above body).</li>
<li><code>tsquery</code>: lexemes combined with <code>&amp;</code> (and), <code>|</code> (or), <code>!</code> (not) and <code>&lt;-&gt;</code> (followed by), or <code>&lt;N&gt;</code> (N positions apart).</li>
</ul>
<p>A <strong>text search configuration</strong> chooses a parser and the dictionaries for each token type: stop words, Snowball stemmers for many languages, synonyms, thesaurus, and Ispell dictionaries. Use <code>simple</code> (lowercasing only) for codes and names, where stemming would harm.</p>
${code('Searchable payment descriptions', 'sql')`
ALTER TABLE disputes ADD COLUMN search tsvector
    GENERATED ALWAYS AS (
        setweight(to_tsvector('english', coalesce(title, '')), 'A') ||
        setweight(to_tsvector('english', coalesce(body,  '')), 'B') ||
        setweight(to_tsvector('simple',  coalesce(merchant_ref, '')), 'A')
    ) STORED;

CREATE INDEX disputes_search_idx ON disputes USING gin (search);

-- websearch_to_tsquery accepts what users type: quotes, OR, minus
SELECT id, title, ts_rank_cd(search, q) AS rank
FROM disputes, websearch_to_tsquery('english', '"card declined" refund -duplicate') AS q
WHERE search @@ q
ORDER BY rank DESC
LIMIT 20;

-- show matches in context
SELECT ts_headline('english', body, q, 'MaxFragments=2, StartSel=<b>, StopSel=</b>')
FROM disputes, websearch_to_tsquery('english', 'chargeback') q WHERE search @@ q LIMIT 5;`}
<p>Store the <code>tsvector</code> in a stored generated column (or maintain it with a trigger) rather than computing it in every query: <code>to_tsvector</code> is expensive, and the GIN index needs a stored or expression value. Use the same configuration for documents and queries, or matches will silently fail.</p>

<h2>Ranking</h2>
<p><code>ts_rank</code> scores by frequency of matching lexemes, <code>ts_rank_cd</code> by cover density (how close together they appear); both use weights. Ranking cannot use the index: PostgreSQL finds matches through GIN, then computes the rank for each match and sorts. For queries matching hundreds of thousands of documents this is slow; restrict first (by date or tenant), or keep a rank-friendly ordering column. Ranking quality is reasonable but simpler than dedicated engines with BM25; extensions such as ParadeDB's pg_search bring BM25 indexes into PostgreSQL.</p>

<h2>Fuzzy matching with trigrams</h2>
<p>Names, addresses and merchant descriptors suffer typos and variant spellings that stemming cannot fix. The <code>pg_trgm</code> extension splits text into <strong>trigrams</strong>, three-character fragments of each word padded with spaces, and measures similarity as the share of trigrams two strings have in common.</p>
${fig('trgm', '<b>Figure 10.2</b> A trigram similarity calculator, following pg_trgm\'s method. Shared trigrams are highlighted. Try your own names.')}
${code('Fuzzy name matching (for example screening names against a watch list)', 'sql')`
CREATE EXTENSION IF NOT EXISTS pg_trgm;

CREATE INDEX watchlist_name_trgm ON watchlist USING gin (name gin_trgm_ops);

-- similarity above the threshold, best first
SELECT name, similarity(name, $1) AS sim
FROM watchlist
WHERE name % $1                      -- uses the index; threshold pg_trgm.similarity_threshold
ORDER BY sim DESC
LIMIT 10;

-- word_similarity: does the search text match part of a longer string?
SELECT name FROM watchlist WHERE $1 <% name;

-- substring and regex search can use the same index
SELECT * FROM merchants WHERE descriptor ILIKE '%amzn mktp%';`}
<p>GIN trigram indexes accelerate <code>LIKE</code>, <code>ILIKE</code> and regular expressions with any pattern of at least three characters. A GiST trigram index (<code>gist_trgm_ops</code>) is slower for filtering but supports nearest-neighbour ordering by distance (<code>ORDER BY name &lt;-&gt; $1 LIMIT 10</code>). For name screening, combine trigrams with phonetic matching (<code>fuzzystrmatch</code>'s <code>dmetaphone</code>) and transliteration, and treat the database as a candidate generator, with scoring and review on top.</p>

<h2>When to use a separate search engine</h2>
<p>PostgreSQL search is enough when the corpus fits on one server, queries are mostly filter-plus-text, and transactional consistency matters (search results reflect committed data immediately). Consider OpenSearch, Elasticsearch or a dedicated engine for very large corpora, heavy faceting and aggregation, advanced relevance tuning, many languages with complex analysis, or search traffic that would compete with transactional load. Many systems use both: PostgreSQL as the source of truth, with changes streamed to the search engine through logical decoding (Chapter 22).</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Different configurations</strong> for document and query (for example <code>to_tsvector(body)</code> with the server default against <code>to_tsquery('english', ...)</code>).</li>
<li><strong><code>to_tsquery</code> on raw user input</strong>, which throws syntax errors; use <code>websearch_to_tsquery</code> or <code>plainto_tsquery</code>.</li>
<li><strong>Stemming identifiers and names</strong> with the English configuration.</li>
<li><strong>Ranking every match</strong> of a broad query.</li>
<li><strong>A trigram threshold left at the default</strong> without testing precision and recall on real data.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>See the lexemes</summary><p>Run <code>SELECT to_tsvector('english', 'Refunds were refunded after refunding')</code> and explain the output.</p><p><em>Answer:</em> 'refund':1,3,5 (stop word "were" and "after" removed; all forms stemmed to one lexeme).</p></details>
<details><summary>Trigram by hand</summary><p>List the trigrams of "upi" as pg_trgm computes them.</p><p><em>Answer:</em> "␣␣u", "␣up", "upi", "pi␣".</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Build search</summary><p>Add weighted full-text search over dispute title and body, with an index, and compare <code>EXPLAIN ANALYZE</code> with an <code>ILIKE '%...%'</code> query on a million rows.</p></details>
<details><summary>Tune the threshold</summary><p>For 1,000 pairs of names known to match or not, compute precision and recall of <code>%</code> at thresholds 0.2 to 0.6. Pick a threshold for screening and justify it.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Hybrid ranking</summary><p>Combine full-text rank and trigram similarity into one score with reciprocal rank fusion. Compare result quality with either alone (vectors join this mix in Chapter 20).</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why LIKE '%x%' is neither fast nor linguistic.</li>
<li>I can build tsvector columns with weights, a GIN index and safe user queries.</li>
<li>I know how text search configurations and dictionaries work.</li>
<li>I understand ranking and its cost.</li>
<li>I can use pg_trgm for fuzzy matching and substring search, with GIN or GiST.</li>
<li>I can decide when PostgreSQL search is enough.</li>
</ul>
`});

FIG.volcano = host => {

    s += arrow(280, 126, 150, 158, 'acc') + box(40, 160, 220, 50, 'Seq Scan customers', on('outer') ? 'hot' : 'dim', "filter city = 'Pune'; at: " + (f.k >= 4 ? 'Vikram' : f.k >= 1 ? 'Asha' : '–'));

    s += tx(320, 232, 'each arrow is a call to next(); rows flow upward one at a time', 'ti');
    return { s, w: 640, h: 244 };
  });
};

CH.push({
  id: 'ch11', n: 11, title: 'Executing Queries',
  lede: 'The planner produces a tree of operators; the executor runs it. Each operator is an algorithm you know from the data structures book applied to rows on pages: scans that read sequentially or through indexes, joins built from nested loops, hash tables and merges, sorts that spill to disk. This chapter explains the iterator model, each scan and join method, how memory limits shape execution, and how to read EXPLAIN ANALYZE output, the single most useful skill for PostgreSQL performance.',
  html: `
<h2>The iterator model</h2>
${fig('volcano', '<b>Figure 11.1</b> Demand-driven execution: each node returns its next row when asked. A LIMIT at the top stops all work below it once satisfied.')}
<p>PostgreSQL's executor follows the Volcano (iterator) model: each plan node implements initialise, next row, and end. Rows are pulled from the top. Most nodes are <em>pipelined</em>, passing rows up as soon as they have them; some are <em>blocking</em> and must consume all their input first: Sort, Hash (building a hash table), and HashAggregate. A blocking node under a LIMIT removes the benefit of LIMIT, which is why <code>ORDER BY x LIMIT 10</code> is fast with an index on x (rows arrive sorted, no Sort node) and slow without one.</p>

<h2>Scans</h2>
<div class="tbl"><table><tr><th>Scan</th><th>How it works</th><th>Best when</th></tr>
<tr><td>Seq Scan</td><td>Read every page in order, test each row</td><td>A large fraction of rows is needed, or the table is small</td></tr>
<tr><td>Index Scan</td><td>Descend the index, then fetch each heap tuple in index order</td><td>Few rows, or rows needed in index order (ORDER BY, LIMIT)</td></tr>
<tr><td>Index Only Scan</td><td>Answer from the index, visiting the heap only for pages not all-visible</td><td>All needed columns are in the index and the visibility map is current</td></tr>
<tr><td>Bitmap Index + Bitmap Heap Scan</td><td>Collect matching TIDs into a bitmap, then read heap pages in physical order</td><td>Moderate numbers of rows scattered over many pages; combining indexes</td></tr>
<tr><td>TID Scan, TID Range Scan</td><td>Fetch by ctid</td><td>Internal tools, batched maintenance</td></tr>
</table></div>
${fig('bitmap', '<b>Figure 11.2</b> A bitmap scan builds a map of matching pages from one or more indexes, then reads those pages once each in physical order.')}
<p>The planner chooses between scans by estimated cost (Chapter 12). The crossover is lower than many expect: once a query needs more than a few percent of a table's rows, randomly fetching them through an index can cost more than reading everything sequentially.</p>

<h2>Joins</h2>
${fig('joinalg', '<b>Figure 11.3</b> PostgreSQL\'s three join algorithms. The planner chooses per join from estimated row counts, available indexes and sort orders.')}
<div class="tbl"><table><tr><th></th><th>Nested loop</th><th>Hash join</th><th>Merge join</th></tr>
<tr><td>Join conditions</td><td>Any</td><td>Equality only</td><td>Equality (sortable)</td></tr>
<tr><td>Startup cost</td><td>None</td><td>Build the hash table</td><td>Sort both inputs unless already sorted</td></tr>
<tr><td>Total cost</td><td>outer × inner lookup</td><td>outer + inner</td><td>outer + inner (+ sorts)</td></tr>
<tr><td>Memory</td><td>Little</td><td>Hash table of inner side</td><td>Sort memory</td></tr>
<tr><td>Typical use</td><td>OLTP lookups, small outer, indexed inner</td><td>Large unsorted inputs, analytics</td><td>Pre-sorted inputs, very large joins</td></tr>
</table></div>
<p>Variants: <strong>semi</strong> and <strong>anti</strong> joins implement <code>EXISTS</code> and <code>NOT EXISTS</code> and stop at the first match; <strong>Memoize</strong> caches inner-side results of a nested loop for repeated keys; <strong>parallel hash join</strong> builds one shared hash table with several workers (Chapter 13).</p>

<h2>Memory: work_mem and spilling</h2>
<p>Sorts, hash tables and some other nodes use up to <code>work_mem</code> (default 4 MB) each before spilling to temporary files; hash-based nodes may use <code>work_mem × hash_mem_multiplier</code> (default 2). A single query can have several such nodes, and with parallelism each worker has its own allowance, so the real usage of one query can be many times <code>work_mem</code>. Signs of spilling in EXPLAIN: <code>Sort Method: external merge Disk: 120MB</code>, <code>Batches: 16</code> on a Hash node. Fix with more memory for that query (<code>SET LOCAL work_mem = '256MB'</code>), fewer rows reaching the node, or an index that provides order.</p>
<p>External sorting is the classic algorithm: sort runs that fit in memory, write them out, and merge them with a heap (priority queue). Incremental Sort (PostgreSQL 13) uses an existing partial order, sorting only within groups of equal leading keys.</p>

<h2>Reading EXPLAIN ANALYZE</h2>
${code('An annotated plan', 'sql')`
EXPLAIN (ANALYZE, BUFFERS, SETTINGS)
SELECT m.name, count(*), sum(p.amount)
FROM payments p JOIN merchants m ON m.id = p.merchant_id
WHERE p.created_at >= now() - interval '1 day' AND p.status = 'failed'
GROUP BY m.name ORDER BY sum(p.amount) DESC LIMIT 10;

Limit  (cost=4521.30..4521.33 rows=10 width=48) (actual time=38.2..38.2 rows=10 loops=1)
  ->  Sort  (cost=4521.30..4523.80 rows=1000 ...) (actual time=38.2..38.2 rows=10 loops=1)
        Sort Key: (sum(p.amount)) DESC
        Sort Method: top-N heapsort  Memory: 26kB          -- a heap keeps only the top 10
        ->  HashAggregate  (... rows=1000 ...) (actual ... rows=812 loops=1)
              Group Key: m.name
              ->  Hash Join  (... rows=4100 ...) (actual ... rows=3925 loops=1)
                    Hash Cond: (p.merchant_id = m.id)
                    ->  Bitmap Heap Scan on payments p  (... rows=4100 ...) (actual ... rows=3925 loops=1)
                          Recheck Cond: (created_at >= ...)
                          Filter: (status = 'failed')
                          Rows Removed by Filter: 211043             -- most rows read were discarded
                          Heap Blocks: exact=9120
                          Buffers: shared hit=1200 read=8410         -- 8410 pages from disk
                          ->  Bitmap Index Scan on payments_created_idx (...)
                    ->  Hash  (... rows=50000 ...) (actual ... rows=50000 loops=1)
                          Buckets: 65536  Batches: 1  Memory Usage: 3100kB
                          ->  Seq Scan on merchants m
Planning Time: 0.9 ms
Execution Time: 38.6 ms`}
<p>How to read it:</p>
<ol>
<li><strong>Read from the inside out:</strong> leaves are scans; each parent consumes its children's rows.</li>
<li><strong>Compare estimated and actual rows</strong> at each node. A large mismatch (10× or more) is usually the root cause of a bad plan, and the fix is statistics (Chapter 12).</li>
<li><strong>Multiply by loops:</strong> times and rows for an inner node are per loop; a 0.05 ms index scan with <code>loops=200000</code> costs 10 seconds.</li>
<li><strong>Look for work thrown away:</strong> "Rows Removed by Filter" in the hundreds of thousands suggests an index that includes the filter column. Here, an index on (status, created_at), or a partial index on created_at where status = 'failed', would avoid reading 211,000 rows.</li>
<li><strong>Look at buffers:</strong> <code>read</code> is I/O, <code>hit</code> is cache. Since PostgreSQL 18, ANALYZE includes BUFFERS by default.</li>
<li><strong>Cost units are arbitrary</strong> (roughly "sequential page reads"); compare costs only between plans for the same query.</li>
</ol>
<p>Use <code>EXPLAIN</code> without ANALYZE for statements you must not run (it only plans), and wrap ANALYZE of writes in a transaction you roll back. The <code>auto_explain</code> module logs plans of slow queries in production (Chapter 23).</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Reading cost instead of actual time.</strong></li>
<li><strong>Ignoring loops,</strong> underestimating inner node cost.</li>
<li><strong>Assuming index scans are always faster</strong> than sequential scans.</li>
<li><strong>Raising work_mem globally</strong> to fix one query, risking memory exhaustion under concurrency.</li>
<li><strong>Running EXPLAIN ANALYZE on a DELETE in production</strong> without a transaction to roll back.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Which scan?</summary><p>Run <code>EXPLAIN</code> for a primary-key lookup, a range covering 50% of a table, and a range covering 2%. Which scan does each use, and why?</p></details>
<details><summary>Loops</summary><p>An inner Index Scan shows <code>actual time=0.02..0.03 rows=3 loops=150000</code>. Total time and rows?</p><p><em>Answer:</em> about 4.5 s and 450,000 rows.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Force each join</summary><p>For a join of 10,000 and 5 million rows, compare the three join methods by disabling the others (<code>enable_hashjoin</code>, <code>enable_mergejoin</code>, <code>enable_nestloop</code>). When does each win?</p></details>
<details><summary>Stop the spill</summary><p>Find a query whose Sort shows "external merge". Fix it once with work_mem for that session, and once with an index. Compare.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Top-N heapsort</summary><p>Explain why ORDER BY ... LIMIT 10 uses a heap of size 10 and what its time complexity is compared with a full sort.</p><p><em>Answer sketch:</em> O(n log k) with k = 10, versus O(n log n), and only k rows held in memory.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain the iterator model and pipelined versus blocking nodes.</li>
<li>I know each scan type and when the planner prefers it.</li>
<li>I can explain nested loop, hash and merge joins and their costs.</li>
<li>I understand work_mem, spilling and memory multiplication across nodes and workers.</li>
<li>I can read EXPLAIN ANALYZE: estimates versus actuals, loops, filters, buffers.</li>
</ul>
`});

/* ===================== Chapter 12: The planner and statistics ===================== */
FIG.costcurve = host => tabs(host, [['hdd', 'random_page_cost = 4 (default)'], ['ssd', 'random_page_cost = 1.1 (SSD)']], (body, k) => {
  const rpc = k === 'hdd' ? 4 : 1.1, N = 10e6, P = 1e5;
  const seq = s => P * 1 + N * 0.01 + N * 0.0025;
  const idx = s => 4 * rpc + s * N * (0.005 + 0.0025 + 0.01) + s * N * rpc;
  const bmp = s => { const pf = P * (1 - Math.exp(-s * N / P)), cpp = rpc - (rpc - 1) * Math.sqrt(pf / P); return pf * cpp + s * N * (0.01 + 0.0025 + 0.005) + s * N * 0.0025; };
  const xs = []; for (let i = 0; i <= 100; i++) xs.push(i / 10);
  const S = [{ pts: xs.map(x => [x, seq(x / 100) / 1000]), c: 'c1', label: 'Seq Scan', f: '' }, { pts: xs.filter(x => idx(x / 100) / 1000 <= 600).map(x => [x, idx(x / 100) / 1000]), c: 'c6', label: 'Index Scan', f: 'hot' }, { pts: xs.map(x => [x, bmp(x / 100) / 1000]), c: 'c3', label: 'Bitmap Heap Scan', f: 'acc', ly: 12 }];
  let cx = xs.find(x => idx(x / 100) > seq(0));
  const r = linechart(S, { xmax: 10, ymax: 600, xticks: [0, 2, 4, 6, 8, 10], yticks: 6, yfmt: v => v + 'k', W: 460, H: 200, xlabel: 'fraction of rows selected (%)', R: 140 });
  body.innerHTML = `<div class="stage">${svgw(r.w, r.h, r.s, 'Scan cost')}</div><p class="fnote">Estimated cost (thousands of units) for a 10-million-row, 100,000-page table with uncorrelated order. An index scan beats a sequential scan only below about ${cx ?? '>10'}% of rows. Bitmap scans stay competitive much longer because they read each needed page once, in physical order; once they would touch nearly every page, a sequential scan wins. ${k === 'hdd' ? 'The default assumes random reads cost four times sequential ones.' : 'On SSDs and well-cached data, random reads are almost as cheap as sequential ones, so index scans stay attractive longer. Many teams set random_page_cost to 1.1–1.5.'}</p>`;
}, 'hdd');

const AMOUNTS = (() => { const r = rng(42), A = []; for (let i = 0; i < 20000; i++) { const u = r(), v = r(); const z = Math.sqrt(-2 * Math.log(u + 1e-9)) * Math.cos(2 * Math.PI * v); let a = Math.round(Math.exp(6.2 + 1.1 * z)); if (r() < 0.12) a = 500; if (r() < 0.08) a = 1000; A.push(a); } return A.sort((x, y) => x - y); })();
FIG.selest = host => {
  const n = AMOUNTS.length, cnt = {}; AMOUNTS.forEach(a => cnt[a] = (cnt[a] || 0) + 1);
  const mcv = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([v, c]) => [+v, c / n]);
  const rest = AMOUNTS.filter(a => !mcv.some(m => m[0] === a)), restFrac = rest.length / n, B = 10, bounds = [];
  for (let i = 0; i <= B; i++) bounds.push(rest[Math.min(rest.length - 1, Math.floor(i * (rest.length - 1) / B))]);
  host.innerHTML = `<div class="tool"><div class="row"><div><label for="sv">Predicate: amount &lt; X, where X =</label><input class="txt" id="sv" value="800"></div></div><div class="stage" id="ssvg"></div><div class="meta" id="sm"></div></div>`;
  const $ = id => host.querySelector('#' + id);
  const draw = () => { const X = +$('sv').value || 0;
    let sel = mcv.filter(m => m[0] < X).reduce((a, m) => a + m[1], 0), hs = 0;
    for (let i = 0; i < B; i++) { const lo = bounds[i], hi = bounds[i + 1]; if (X >= hi) hs += 1 / B; else if (X > lo) hs += (X - lo) / (hi - lo) / B; }
    sel += hs * restFrac; const act = AMOUNTS.filter(a => a < X).length / n;
    let s = tx(10, 12, 'histogram_bounds: 10 equal-frequency buckets', 'tb', 'start');
    const L = 20, W = 600, mx = bounds[B], bw = W / B, Xp = v => { if (v <= bounds[0]) return L; if (v >= mx) return L + W; let i = 0; while (v > bounds[i + 1]) i++; return L + (i + (v - bounds[i]) / (bounds[i + 1] - bounds[i])) * bw; };
    for (let i = 0; i < B; i++) { const x0 = Xp(bounds[i]), x1 = Xp(bounds[i + 1]), part = X >= bounds[i + 1] ? 1 : X > bounds[i] ? (X - bounds[i]) / (bounds[i + 1] - bounds[i]) : 0; s += rect(x0, 30, Math.max(1, x1 - x0 - 1), 40, 'cell', 2) + (part > 0 ? rect(x0, 30, Math.max(1, (x1 - x0 - 1) * part), 40, 'bar acc', 2) : '') + tx(x0, 82, bounds[i], 'ti'); }
    s += tx(L + W, 82, mx, 'ti');
    mcv.forEach(([v, f], i) => s += `<line x1="${f1(Xp(v))}" y1="24" x2="${f1(Xp(v))}" y2="74" class="ed ${v < X ? 'hot' : 'warn'}" stroke-width="3"/>` + tx(Xp(v), 100 + i * 14, `MCV ${v}: ${(f * 100).toFixed(1)}%`, 'tp ' + (v < X ? 'hot' : 'warn')));
    s += `<line x1="${f1(Xp(X))}" y1="20" x2="${f1(Xp(X))}" y2="76" class="ed hot dash"/>`;
    $('ssvg').innerHTML = svgw(640, 134, s, 'Selectivity estimate');
    $('sm').innerHTML = `estimate: MCVs below X + fraction of histogram × ${(restFrac * 100).toFixed(1)}% = <b>${(sel * 100).toFixed(1)}%</b> (≈${Math.round(sel * 10e6).toLocaleString('en-US')} of 10M rows) · actual: <b>${(act * 100).toFixed(1)}%</b>`; };
  $('sv').addEventListener('input', draw); draw();
};

FIG.joinorder = host => {
  const L = [['A', 'B', 'C', 'D'], ['AB', 'BC', 'CD'], ['ABC', 'BCD'], ['ABCD']];
  let s = ''; const pos = {};
  L.forEach((lv, d) => lv.forEach((n, i) => { const x = 320 + (i - (lv.length - 1) / 2) * 130, y = 210 - d * 64; pos[n] = [x, y]; }));
  L.slice(1).forEach(lv => lv.forEach(n => { L[n.length - 2].forEach(m => { if ([...m].every(c => n.includes(c))) s += `<line x1="${pos[m][0]}" y1="${pos[m][1] - 14}" x2="${pos[n][0]}" y2="${pos[n][1] + 14}" class="ed"/>`; }); }));
  Object.entries(pos).forEach(([n, [x, y]]) => s += rect(x - 36, y - 14, 72, 28, 'nd ' + ['acc', 'ok', 'warn', 'hot'][n.length - 1], 6) + tx(x, y, n, 'tn sm'));
  s += tx(630, 210, 'base relations', 'ti', 'end') + tx(630, 18, 'final join', 'ti', 'end') + tx(320, 240, 'AC, AD and BD are skipped: no join condition links them, so each would be a Cartesian product', 'ti');

CH.push({
  id: 'ch12', n: 12, title: 'The Planner and Statistics',
  lede: 'For any non-trivial query there are thousands of possible plans, differing in scan methods, join algorithms and join order, with running times that differ by factors of a million. The planner estimates the cost of candidate plans and picks the cheapest. Its estimates depend on a cost model and on statistics about your data, and nearly every bad plan comes from a wrong row-count estimate. This chapter opens the cost model, the statistics PostgreSQL collects, how selectivity is estimated, how join orders are searched, and how to correct the planner when it goes wrong.',
  html: `
<h2>Costs</h2>
<p>The planner assigns each plan an abstract cost, in units where one sequential page read is 1.0. The main parameters:</p>
<div class="tbl"><table><tr><th>Parameter</th><th>Default</th><th>Meaning</th></tr>
<tr><td><code>seq_page_cost</code></td><td>1.0</td><td>Read a page as part of a sequential scan</td></tr>
<tr><td><code>random_page_cost</code></td><td>4.0</td><td>Read a page at a random position</td></tr>
<tr><td><code>cpu_tuple_cost</code></td><td>0.01</td><td>Process one row</td></tr>
<tr><td><code>cpu_index_tuple_cost</code></td><td>0.005</td><td>Process one index entry</td></tr>
<tr><td><code>cpu_operator_cost</code></td><td>0.0025</td><td>Evaluate one operator or function</td></tr>
<tr><td><code>effective_cache_size</code></td><td>4 GB</td><td>How much data is likely cached, making repeated index page reads cheaper</td></tr>
</table></div>
${fig('costcurve', '<b>Figure 12.1</b> Estimated cost of three scan methods as the fraction of selected rows grows, under two settings of random_page_cost.')}
<p>Each node's cost has two numbers in EXPLAIN: <em>startup cost</em> (before the first row) and <em>total cost</em>. Under a LIMIT the planner prefers plans with low startup cost, which is how an index providing order beats a sort.</p>

<h2>Statistics</h2>
<p><code>ANALYZE</code> (run automatically by autovacuum) samples rows (300 × <code>default_statistics_target</code>, so 30,000 by default) and stores per-column statistics in <code>pg_statistic</code>, readable through the <code>pg_stats</code> view:</p>
<div class="tbl"><table><tr><th>Statistic</th><th>Used for</th></tr>
<tr><td><code>null_frac</code></td><td>IS NULL and IS NOT NULL</td></tr>
<tr><td><code>n_distinct</code></td><td>Equality on non-common values; GROUP BY and DISTINCT estimates; join sizes (negative values are a fraction of rows)</td></tr>
<tr><td><code>most_common_vals</code>, <code>most_common_freqs</code></td><td>Equality and ranges for frequent values (skew)</td></tr>
<tr><td><code>histogram_bounds</code></td><td>Range predicates on everything except the most common values; equal-frequency buckets</td></tr>
<tr><td><code>correlation</code></td><td>How well physical order follows the column's order; affects index scan and BRIN cost</td></tr>
<tr><td>array and range element statistics</td><td>Containment and overlap estimates</td></tr>
</table></div>
${fig('selest', '<b>Figure 12.2</b> How PostgreSQL estimates <code>amount &lt; X</code> from most common values and an equal-frequency histogram, compared with the true fraction. Try values near the common amounts 500 and 1,000.')}
<p>Raise the statistics target for skewed or important columns (<code>ALTER TABLE payments ALTER COLUMN merchant_id SET STATISTICS 1000</code>) so more common values and finer histograms are kept. PostgreSQL 18's <code>pg_upgrade</code> carries statistics over, so plans no longer go bad for hours after a major upgrade.</p>

<h3>The independence assumption</h3>
<p>For <code>WHERE city = 'Pune' AND pincode = '411001'</code>, the planner multiplies the two selectivities as if the columns were independent. They are not: pincode determines city. If each condition alone selects 1% of rows, the planner estimates 0.01% while the truth is 1%, a hundredfold underestimate that may choose a nested loop where a hash join was needed. <strong>Extended statistics</strong> fix this:</p>
${code('Extended statistics for correlated columns', 'sql')`
CREATE STATISTICS addr_stats (dependencies, ndistinct, mcv)
    ON city, pincode FROM customers;
ANALYZE customers;

SELECT stxname, stxkeys, dependencies FROM pg_stats_ext WHERE tablename = 'customers';
-- {"3 => 2": 1.000000}   pincode determines city

-- expressions too (PostgreSQL 14+)
CREATE STATISTICS pay_day ON (date_trunc('day', created_at)) FROM payments;`}

<h2>Join order</h2>
<p>For n tables there are a vast number of join orders and shapes. PostgreSQL uses <strong>dynamic programming</strong> (the technique from the data structures book): find the best way to join every pair, then every set of three using the best pairs, and so on, keeping the cheapest plan per subset and per useful sort order.</p>
${fig('joinorder', '<b>Figure 12.3</b> Dynamic programming over subsets of four relations joined in a chain A–B–C–D. Each subset keeps only its cheapest plans; subsets without join conditions are avoided.')}
<p>Work grows exponentially, so beyond <code>geqo_threshold</code> (12 relations by default) PostgreSQL switches to the genetic query optimiser, a randomised search. <code>join_collapse_limit</code> and <code>from_collapse_limit</code> (8) limit how much the planner reorders explicit joins and subqueries. For queries joining many tables (generated reports, ORMs), plans can become unstable; write joins in a sensible order and consider raising these limits with care.</p>

<h2>Prepared statements and generic plans</h2>
<p>A prepared statement (which most drivers use, including JDBC's <code>PreparedStatement</code> after a threshold) can be planned for specific parameter values (a <em>custom plan</em>) or once for any values (a <em>generic plan</em>). PostgreSQL uses custom plans for the first five executions, then switches to the generic plan if its estimated cost is not much worse. For skewed data this can go wrong: the generic plan for <code>merchant_id = $1</code> suits a small merchant and is terrible for the largest. <code>plan_cache_mode = force_custom_plan</code> fixes it at the cost of planning every time. Partial indexes need literal values to match (Chapter 8).</p>

<h2>When the planner is wrong</h2>
<ol>
<li><strong>Find the first node where estimated and actual rows diverge</strong> in <code>EXPLAIN ANALYZE</code>. Everything above it is built on a wrong number.</li>
<li><strong>Refresh statistics</strong> (<code>ANALYZE</code>), especially after bulk loads, and check autovacuum is analysing the table.</li>
<li><strong>Improve statistics:</strong> higher target for skewed columns; extended statistics for correlated columns; statistics on expressions you filter by.</li>
<li><strong>Rewrite predicates the planner cannot estimate:</strong> functions on columns, <code>OR</code> across columns, computed comparisons, opaque functions without <code>ROWS</code> estimates.</li>
<li><strong>Correct cost settings:</strong> <code>random_page_cost</code> and <code>effective_cache_size</code> that match your hardware.</li>
<li><strong>As a last resort, constrain the plan.</strong> Session settings such as <code>enable_nestloop = off</code> are blunt instruments for diagnosis, not production. PostgreSQL 19 adds the <code>pg_plan_advice</code> extension, a language to describe and adjust planner decisions, and <code>pg_stash_advice</code> to store advice and apply it automatically to matching queries, so a regressed plan can be fixed without changing application code. Before 19, the third-party <code>pg_hint_plan</code> served this role.</li>
</ol>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Tuning cost parameters to fix one query</strong> rather than fixing its estimate.</li>
<li><strong>Forgetting ANALYZE after a bulk load</strong> or a large delete.</li>
<li><strong>Correlated predicates without extended statistics.</strong></li>
<li><strong>Generic plans on skewed parameters.</strong></li>
<li><strong>Leaving <code>random_page_cost = 4</code> on SSD storage.</strong></li>
<li><strong>Disabling planner features globally</strong> to fix one plan.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Read pg_stats</summary><p>For one column, read <code>n_distinct</code>, the most common values and the histogram. Estimate by hand the rows for an equality on a common value and on a rare one, then compare with EXPLAIN.</p></details>
<details><summary>Crossover</summary><p>In Figure 12.1, how does the index-scan crossover move when random_page_cost drops from 4 to 1.1? Why?</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Fix a correlated estimate</summary><p>Create a customers table where pincode determines city. Show the misestimate for a query on both, add extended statistics, and show the corrected plan.</p></details>
<details><summary>Generic plan trap</summary><p>With a heavily skewed merchant_id, prepare a statement and execute it six times with a small merchant, then once with the largest. Compare the plan and time with <code>plan_cache_mode = force_custom_plan</code>.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Count join orders</summary><p>How many left-deep join orders exist for 10 tables? How many subsets does dynamic programming consider?</p><p><em>Answer:</em> 10! ≈ 3.6 million left-deep orders; 2¹⁰ − 1 = 1,023 subsets, far fewer.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain the cost parameters and why random_page_cost matters.</li>
<li>I know the column statistics PostgreSQL keeps and what each estimates.</li>
<li>I can estimate selectivity from MCVs and a histogram.</li>
<li>I can recognise the independence assumption and fix it with extended statistics.</li>
<li>I understand dynamic-programming join search, GEQO and collapse limits.</li>
<li>I know the generic plan problem and how to correct bad plans, including PostgreSQL 19 plan advice.</li>
</ul>
`});

CH.push({
  id: 'ch13', n: 13, title: 'Aggregation, Windows, CTEs and Parallelism',
  lede: 'Reports, ledgers and analytics need more than filtering and joining: they group and summarise, compute running totals and rankings, traverse hierarchies and graphs, and process millions of rows quickly. This chapter covers how PostgreSQL executes aggregates, window functions, common table expressions including recursive ones, and how it splits work across CPU cores with parallel query.',
  html: `
<h2>Aggregation</h2>
<p>PostgreSQL implements <code>GROUP BY</code> in two ways, chosen by cost:</p>
<ul>
<li><strong>HashAggregate:</strong> one hash table entry per group, filled in a single pass over unsorted input. Fast when groups fit in memory; since PostgreSQL 13 it spills to disk when they do not, rather than exhausting memory.</li>
<li><strong>GroupAggregate:</strong> requires input sorted by the group keys (from an index or a Sort), then emits each group as soon as the key changes. Streams results, uses little memory and benefits from incremental sort.</li>
</ul>
<p>Useful aggregate features: <code>FILTER (WHERE ...)</code> to compute several conditional aggregates in one pass; <code>GROUPING SETS</code>, <code>ROLLUP</code> and <code>CUBE</code> for subtotals; ordered-set aggregates such as <code>percentile_cont(0.99) WITHIN GROUP (ORDER BY latency)</code>; and <code>count(DISTINCT x)</code>, which always sorts or hashes the values per group and is expensive at scale. PostgreSQL 19's <em>eager aggregation</em> can partially aggregate rows before a join, shrinking the join's input.</p>
${code('One pass, many answers', 'sql')`
SELECT merchant_id,
       count(*)                                         AS attempts,
       count(*) FILTER (WHERE status = 'settled')       AS settled,
       sum(amount) FILTER (WHERE status = 'refunded')   AS refunded,
       percentile_cont(0.95) WITHIN GROUP (ORDER BY latency_ms) AS p95_ms
FROM payments
WHERE created_at >= date_trunc('day', now())
GROUP BY ROLLUP (merchant_id);       -- last row: totals across merchants`}

<h2>Window functions</h2>
<p>A window function computes a value for each row from a set of related rows, its <em>window</em>, without collapsing rows as <code>GROUP BY</code> does. The window is defined by <code>PARTITION BY</code> (which rows belong together), <code>ORDER BY</code> (their order) and a <em>frame</em> (which rows around the current one count).</p>
${fig('win', '<b>Figure 13.1</b> A window function evaluated row by row. The frame (amber) slides with the current row (red) and never crosses partitions.')}
${code('Running balances, rankings and gaps', 'sql')`
SELECT account_id, posted_at, amount,
       sum(amount) OVER w                                    AS running_balance,
       amount - lag(amount) OVER w                           AS change_from_previous,
       rank() OVER (PARTITION BY account_id ORDER BY amount DESC) AS size_rank,
       avg(amount) OVER (PARTITION BY account_id ORDER BY posted_at
                         RANGE BETWEEN interval '7 days' PRECEDING AND CURRENT ROW) AS avg_7d
FROM ledger_entries
WINDOW w AS (PARTITION BY account_id ORDER BY posted_at, id);

-- PostgreSQL 19: skip NULLs when looking back
SELECT ts, lag(price) IGNORE NULLS OVER (ORDER BY ts) AS last_known_price FROM ticks;`}
<p>The default frame with <code>ORDER BY</code> is <code>RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</code>, which includes all rows with the same order value as the current row (peers). For running totals with ties, add a unique tiebreaker to the order or use <code>ROWS</code>. Execution sorts by partition and order keys once per distinct window, so windows sharing a definition are cheaper; an index matching <code>(account_id, posted_at)</code> can avoid the sort.</p>

<h2>Common table expressions</h2>
<p><code>WITH</code> names a subquery. Since PostgreSQL 12, a CTE referenced once and without side effects is inlined into the main query, so the planner can push filters into it. Write <code>MATERIALIZED</code> to force it to be computed once and stored (an optimisation fence, useful when it is expensive and referenced several times, or to stop a bad pushdown), and <code>NOT MATERIALIZED</code> to force inlining. Data-modifying CTEs (<code>WITH moved AS (DELETE ... RETURNING *) INSERT INTO archive SELECT * FROM moved</code>) do several changes in one statement and snapshot.</p>

<h3>Recursive CTEs</h3>
${fig('rec', '<b>Figure 13.2</b> A recursive CTE expanding a transfer graph level by level, as breadth-first search.')}
${code('Follow money from one account, with depth limit and cycle detection', 'sql')`
WITH RECURSIVE chain AS (
    SELECT t.to_account AS account, 1 AS depth, t.amount
    FROM transfers t
    WHERE t.from_account = 'A' AND t.created_at >= now() - interval '2 days'
  UNION ALL
    SELECT t.to_account, c.depth + 1, t.amount
    FROM chain c
    JOIN transfers t ON t.from_account = c.account
    WHERE c.depth < 6 AND t.created_at >= now() - interval '2 days'
) CYCLE account SET is_cycle USING path      -- PostgreSQL 14+: stop at revisited nodes
SELECT account, min(depth) AS hops, sum(amount) AS received
FROM chain WHERE NOT is_cycle
GROUP BY account ORDER BY hops;`}
<p>Recursive queries run the anchor once, then repeatedly apply the recursive part to the rows produced by the previous iteration (the working table) until no new rows appear. Always bound them (depth, time window, <code>CYCLE</code>) and index the join column, here <code>transfers(from_account, created_at)</code>. For very large graph workloads, consider whether a graph-specific tool fits better; for most hierarchy and chain queries in fintech, recursive SQL is enough.</p>

<h2>Parallel query</h2>
${fig('par', '<b>Figure 13.3</b> A parallel aggregate: workers each scan part of the table and compute partial results, which the leader gathers and combines.')}
<p>PostgreSQL can run parts of a query in several background worker processes. Parallel-aware nodes include sequential, index and bitmap scans, hash joins (sharing one hash table), merge joins, aggregates (split into partial and finalize stages), and appends over partitions. The planner chooses a number of workers based on table size, up to <code>max_parallel_workers_per_gather</code> (default 2), drawn from <code>max_parallel_workers</code> and <code>max_worker_processes</code>.</p>
<p>Parallelism suits large scans and aggregations: reports, batch jobs, analytics on replicas. It does not help short OLTP queries, which finish before workers could start, and it is disabled for queries that write data (except some <code>CREATE TABLE AS</code> and index builds), use functions marked <code>PARALLEL UNSAFE</code>, or run inside cursors. Each worker uses its own <code>work_mem</code> per node, so memory use multiplies (Chapter 11).</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Self-joins or correlated subqueries</strong> to compute running totals or previous values, instead of window functions.</li>
<li><strong>Running totals with ties</strong> under the default RANGE frame.</li>
<li><strong>Unbounded recursive CTEs</strong> on graphs with cycles.</li>
<li><strong>Assuming CTEs are always fences</strong> (true before version 12) or never fences (false with MATERIALIZED).</li>
<li><strong>Expecting parallelism to speed up OLTP</strong>, or forgetting its memory multiplication.</li>
<li><strong><code>count(DISTINCT)</code> over huge groups</strong> where an approximate count (HyperLogLog extension) would do.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Window by hand</summary><p>Complete the moving sum and running total columns of Figure 13.1 without stepping through. Check against the figure.</p></details>
<details><summary>FILTER</summary><p>Rewrite a query that uses four <code>SUM(CASE WHEN ...)</code> expressions with <code>FILTER</code>.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Daily balance</summary><p>From a ledger of entries, produce each account's end-of-day balance for the last 30 days, including days without entries.</p><p><em>Answer sketch:</em> generate_series of days cross-joined with accounts, left join daily sums, then a running sum window per account.</p></details>
<details><summary>Mule chains</summary><p>Using the recursive query, find accounts reached within four hops from any account flagged as compromised in the last 48 hours. Add an index and compare plans.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Parallel scaling</summary><p>Measure a large aggregate with 0, 2, 4 and 8 workers per gather. Plot speed-up and explain why it is sub-linear.</p><p><em>Answer sketch:</em> the leader's gather and finalize steps, I/O bandwidth, and startup overhead limit scaling (Amdahl's law).</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know HashAggregate and GroupAggregate and when each is used.</li>
<li>I can use FILTER, ROLLUP and ordered-set aggregates.</li>
<li>I can write window functions with partitions, orders and frames, and avoid tie problems.</li>
<li>I know when CTEs are inlined or materialised.</li>
<li>I can write bounded recursive CTEs with cycle detection.</li>
<li>I understand parallel query plans, limits and costs.</li>
</ul>
`});

FIG.versions = host => {
  const N = ['Account 7 has balance 500, inserted long ago by transaction 90. One tuple version: xmin = 90, xmax = 0 (not deleted).', 'Transaction 105 runs <code>UPDATE accounts SET balance = 400 WHERE id = 7</code>. It does not overwrite the row: it sets xmax = 105 on the old version and inserts a new version with xmin = 105. The old version\'s ctid now points to the new one.', 'Before 105 commits, transaction 110 reads account 7. Its snapshot lists 105 as in progress, so the old version (xmax 105 not committed) is visible and the new one is not: 110 sees 500. Readers do not wait for writers.', 'Transaction 105 commits. Nothing in the table changes; the commit log (pg_xact) records 105 as committed.', 'A new snapshot taken now sees 105 as committed: the old version is dead to it (deleted by a committed transaction), the new one live. It sees 400. Transaction 110, if repeatable read, still sees 500 for its whole life.', 'Once no running transaction could see the old version, it is garbage. Pruning or VACUUM removes it (Chapter 17). Until then it occupies space: that is bloat.'];
  stepper(host, N.map((note, k) => ({ k, note })), f => {
    let s = '';
    const v1 = { x: 20, xmin: 90, xmax: f.k >= 1 ? 105 : 0, bal: 500, cls: f.k >= 5 ? 'dim' : f.k >= 4 ? 'warn' : 'ok' };
    s += box(v1.x, 30, 260, 70, 'version 1: balance 500', v1.cls, `xmin 90 · xmax ${v1.xmax}${f.k >= 1 ? ' · ctid → (0,2)' : ''}`);
    if (f.k >= 1) s += arrow(282, 65, 356, 65, 'acc') + box(360, 30, 260, 70, 'version 2: balance 400', f.k >= 3 ? 'ok' : 'warn', 'xmin 105 · xmax 0' + (f.k < 3 ? ' (105 in progress)' : ''));
    if (f.k >= 5) s += tx(150, 116, 'removed by vacuum', 'tp', 'middle');
    if (f.k >= 2) s += box(20, 140, 260, 50, 'T110 snapshot: 105 in progress', 'acc', 'sees version 1: 500');
    if (f.k >= 4) s += box(360, 140, 260, 50, 'new snapshot: 105 committed', 'acc', 'sees version 2: 400');
    s += box(20, 210, 600, 34, 'pg_xact (commit log): 90 committed · 105 ' + (f.k >= 3 ? 'committed' : f.k >= 1 ? 'in progress' : '–'), 'cmp');
    return { s, w: 640, h: 254 };
  });
};

FIG.vis = host => {
  host.innerHTML = `<div class="tool">
  <div class="row"><div><label for="vxmin">tuple xmin</label><input class="txt" id="vxmin" value="120"></div><div><label for="vxmax">tuple xmax (0 = none)</label><input class="txt" id="vxmax" value="130"></div><div><label for="vab">aborted transactions</label><input class="txt" id="vab" value=""></div></div>
  <div class="row"><div><label for="sxmin">snapshot xmin</label><input class="txt" id="sxmin" value="118"></div><div><label for="sxmax">snapshot xmax</label><input class="txt" id="sxmax" value="135"></div><div><label for="sxip">in progress (xip)</label><input class="txt" id="sxip" value="125, 130"></div></div>
  <div class="out" id="vout" style="margin-top:10px"></div></div>`;
  const $ = id => host.querySelector('#' + id), list = v => v.split(/[ ,]+/).filter(Boolean).map(Number);
  const draw = () => { const xmin = +$('vxmin').value, xmax = +$('vxmax').value, ab = list($('vab').value), sx = +$('sxmin').value, sX = +$('sxmax').value, xip = list($('sxip').value);
    const seen = x => !ab.includes(x) && x < sX && !xip.includes(x); const why = []; let vis;
    const inProg = x => x >= sX ? `${x} ≥ snapshot xmax ${sX}: started after the snapshot, treat as in progress` : xip.includes(x) ? `${x} is in the snapshot's in-progress list` : null;
    if (ab.includes(xmin)) { vis = false; why.push(`inserter ${xmin} aborted: the version never existed`); }
    else if (!seen(xmin)) { vis = false; why.push(`inserter ${xmin} not visible: ${inProg(xmin)}`); }
    else { why.push(`inserter ${xmin} committed before the snapshot (${xmin < sx ? 'below snapshot xmin ' + sx + ', so certainly finished' : 'not in the in-progress list'})`);
      if (!xmax) { vis = true; why.push('no deleter (xmax = 0)'); }
      else if (ab.includes(xmax)) { vis = true; why.push(`deleter ${xmax} aborted, so the delete did not happen`); }
      else if (!seen(xmax)) { vis = true; why.push(`deleter ${xmax} not visible: ${inProg(xmax)}; the delete has not happened for this snapshot`); }
      else { vis = false; why.push(`deleter ${xmax} committed before the snapshot: the version is dead`); } }
    $('vout').innerHTML = `<b class="${vis ? 'g' : 'd'}">${vis ? 'VISIBLE' : 'NOT VISIBLE'}</b><br>` + why.map(w => '· ' + w).join('<br>') + `<br><span style="opacity:.7">(simplified: ignores the current transaction's own changes, subtransactions and multixacts)</span>`; };
