CH.push({
  id: 'ch21', n: 21, title: 'File System Implementation',
  lede: 'A file system is a data structure on disk, plus the code that maintains it through every crash and concurrent update. This chapter builds one from the bottom: the disk layout, inodes and how they map file offsets to blocks, directories, path lookup, allocation bitmaps, and the buffer cache that sits between the file system and the disk. xv6\'s file system is small enough to read completely, and the chapter compares it with ext4 and with Linux\'s virtual file system layer.',
  html: `
<h2>Layers</h2>
${fig('fslayers', '<b>Figure 21.1</b> xv6 builds its file system in layers; each uses only the one below.')}

<h2>On-disk layout</h2>
${fig('xv6disk', '<b>Figure 21.2</b> The disk image built by xv6\'s mkfs, from <code>kernel/param.h</code>, <code>kernel/fs.h</code> and <code>mkfs/mkfs.c</code>.')}
<p>The disk is divided into regions. The <strong>superblock</strong> describes the rest: sizes and start blocks. The <strong>log</strong> (a header plus <code>LOGBLOCKS</code> = 30 blocks) is used for crash recovery (Chapter 22). <strong>Inode blocks</strong> hold fixed-size inodes, 16 per 1 KB block for 200 inodes. The <strong>bitmap</strong> has one bit per block saying whether it is in use. Everything else is <strong>data</strong>: file contents, directory contents, and indirect blocks.</p>

<h2>Inodes and block mapping</h2>
<p>An on-disk inode records the type (file, directory, device, or 0 for free), the link count, the size, and 13 block addresses. The first 12 point directly to data blocks; the 13th points to an <strong>indirect block</strong> holding 256 more addresses (1024 bytes / 4 bytes each). <code>bmap(ip, bn)</code> translates a block number within the file into a disk block, allocating blocks on demand as a file grows.</p>
${fig('bmap', '<b>Figure 21.3</b> Interactive: map a byte offset to the block that holds it. Try the boundary values.')}
${code('kernel/fs.c: bmap (simplified error handling)', 'c')`
static uint
bmap(struct inode *ip, uint bn)
{
  uint addr, *a;
  struct buf *bp;

  if(bn < NDIRECT){
    if((addr = ip->addrs[bn]) == 0){
      addr = balloc(ip->dev);          // allocate on first write
      ip->addrs[bn] = addr;
    }
    return addr;
  }
  bn -= NDIRECT;

  if(bn < NINDIRECT){
    if((addr = ip->addrs[NDIRECT]) == 0)
      ip->addrs[NDIRECT] = addr = balloc(ip->dev);
    bp = bread(ip->dev, addr);         // read the indirect block
    a = (uint*)bp->data;
    if((addr = a[bn]) == 0){
      a[bn] = addr = balloc(ip->dev);
      log_write(bp);                   // the indirect block changed
    }
    brelse(bp);
    return addr;
  }
  panic("bmap: out of range");
}`}
<p>This multi-level index is the classic Unix design: small files (most files are small) need no extra reads; large files pay for one or more levels of indirection. The original Unix and ext2/ext3 used 12 direct, one single, one double and one triple indirect pointer with 4 KB blocks, reaching terabytes. <strong>ext4 replaced this with extents</strong>: a record (logical block, length, physical start) describes up to 32,768 contiguous blocks at once, so a large contiguous file needs a handful of entries instead of thousands of pointers.</p>

<h2>Inodes in memory</h2>
<p>The kernel keeps an in-memory table of active inodes (<code>NINODE</code> = 50 in xv6). <code>iget</code> finds or allocates an entry and increments its reference count, without reading the disk; <code>ilock</code> takes the inode's sleep-lock and reads it from disk if not yet valid; <code>iunlock</code> releases the lock; <code>iput</code> drops a reference and, if it was the last reference and the link count is zero, frees the inode and its blocks (truncation). Separating references from locking lets many processes hold a pointer to an inode (an open file, a current directory) while only one at a time reads or modifies it.</p>

<h2>Directories and path names</h2>
${fig('namei', '<b>Figure 21.4</b> Resolving a path, one directory at a time.')}
<p>A directory is an inode of type T_DIR whose data is an array of <code>struct dirent</code>. An entry with inode number 0 is free. Lookup is a linear scan, fine for xv6's small directories; ext4 uses <strong>htree</strong> hashed directories so lookups in directories with millions of entries take a few block reads, and Linux caches lookups in the <strong>dentry cache</strong> so most path resolution never touches a directory block at all.</p>

<h2>Free space</h2>
<p><code>balloc</code> scans the bitmap for a zero bit, sets it, zeroes the block and returns its number; <code>bfree</code> clears the bit. Real file systems care much more about <em>where</em> blocks go: ext4 divides the disk into block groups, keeps a file's blocks near its inode, and delays allocation until data is written back so it can allocate large contiguous extents. On SSDs, contiguity matters less but freeing blocks promptly (TRIM, Chapter 19) matters more.</p>

<h2>The buffer cache</h2>
<p>xv6's <code>bio.c</code> keeps <code>NBUF</code> = 30 block buffers on an LRU list. It has two jobs: cache popular blocks, and guarantee that <strong>at most one copy of each disk block exists in memory and only one thread uses it at a time</strong>. <code>bread</code> returns a locked buffer (reading the disk if needed); <code>bwrite</code> writes it; <code>brelse</code> unlocks it and moves it to the front of the LRU list. The single <code>bcache.lock</code> becomes a bottleneck on many cores, which is the subject of the MIT lock lab: split it into hash buckets.</p>
<p>Linux merges the file data cache into the <strong>page cache</strong> (Chapter 12): file contents are cached in pages indexed by (inode, offset), shared with memory-mapped files, and reclaimed by the same machinery as anonymous memory. Metadata blocks are cached through the block device's own page cache.</p>

<h2>Reading and writing a file</h2>
<p><code>readi</code> loops over the blocks covering the requested range: <code>bmap</code>, <code>bread</code>, copy the relevant bytes to the user (via <code>either_copyout</code>), <code>brelse</code>. <code>writei</code> does the reverse with <code>log_write</code> instead of <code>bwrite</code>, and updates the size. A large write is split into several transactions by <code>filewrite</code>, each small enough to fit in the log: at most <code>((MAXOPBLOCKS-1-1-2) / 2) * BSIZE</code> bytes (3 KB), leaving room in the transaction for the inode, an indirect block, bitmap blocks, and two blocks of slop for writes that are not block-aligned.</p>

<h2>The virtual file system</h2>
<p>Linux supports dozens of file systems behind one interface. The <strong>VFS</strong> defines generic objects (superblock, inode, dentry, file) with tables of operations that each file system implements. System calls operate on these objects; the VFS handles path walking, permission checks, the dentry and inode caches, and the page cache, calling into ext4, XFS, Btrfs, NFS, FUSE or procfs only for what is specific to each. xv6 has one file system and no VFS, though its device files (<code>mknod</code>, the <code>devsw</code> table) are a small version of the same idea.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Thinking a directory "contains" files.</strong> It contains names that refer to inodes.</li>
<li><strong>Forgetting indirect blocks</strong> when computing a file's disk usage or the reads needed to reach an offset.</li>
<li><strong>Confusing references with locks</strong> (iget versus ilock).</li>
<li><strong>Holding a buffer too long,</strong> which blocks every other user of that block.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Disk usage</summary><p>How many disk blocks does a 20,000-byte file use in xv6, counting the indirect block?</p><p><em>Answer:</em> ⌈20000/1024⌉ = 20 data blocks; 8 of them are beyond the 12 direct ones, so one indirect block: 21.</p></details>
<details><summary>Maximum file size</summary><p>With 4 KB blocks, 4-byte addresses, 12 direct and one single, double and triple indirect pointer, what is the maximum file size?</p><p><em>Answer:</em> (12 + 1024 + 1024² + 1024³) × 4 KB ≈ 4 TB.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Large files lab</summary><p>Add a doubly indirect block to xv6 (11 direct, one indirect, one doubly indirect), raising the maximum file size to 11 + 256 + 65,536 = 65,803 blocks, as in the MIT file system lab.</p></details>
<details><summary>Inspect ext4</summary><p>Run <code>debugfs -R "stat /path/file" /dev/…</code> on an ext4 file (read-only) and identify its extents. Then use <code>filefrag -v</code> to see how fragmented it is.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Buffer cache scalability</summary><p>Do the MIT lock lab's buffer cache part: replace the global lock with a hash table of buckets, each with its own lock, while preserving the one-copy-per-block invariant. What makes evicting a buffer from another bucket tricky?</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can draw xv6's disk layout and explain each region.</li>
<li>I can map a file offset to a disk block through direct and indirect pointers.</li>
<li>I understand how directories and path lookup work.</li>
<li>I can explain the buffer cache's invariants and the in-memory inode life cycle.</li>
<li>I know what extents, htree directories and the VFS add in Linux.</li>
</ul>
`});

CH.push({
  id: 'ch22', n: 22, title: 'Crash Consistency and Journaling',
  lede: 'A single file system operation updates several blocks, but a disk writes one block at a time, and power can fail between any two. Without care, a crash leaves the on-disk structures inconsistent: blocks pointed to but marked free, space leaked, or files full of other files\' old data. This chapter works through what can go wrong, the old answer (check everything after a crash), and the answer nearly every file system now uses: write-ahead logging, or journaling. xv6\'s log is a complete, readable implementation.',
  html: `
<h2>The crash-consistency problem</h2>
${fig('crash3', '<b>Figure 22.1</b> Interactive: append one block to a file, crash with any subset of the three writes done, and see the result.')}
<p>Disks and their caches reorder writes for speed, so we cannot even assume the writes happen in the order issued. Out of eight outcomes, three are inconsistent and one silently returns garbage. Every multi-block update (create, rename, unlink, write that allocates) has the same problem.</p>

<h2>Solution 1: fsck</h2>
<p>Early Unix let inconsistencies happen and repaired them at boot with <strong>fsck</strong>: check that the superblock is sane, rebuild the bitmaps from the inodes, check link counts by walking every directory, find blocks claimed twice, move unreferenced inodes to <code>lost+found</code>. It works (except for the garbage-data case, which it cannot detect), but it reads all metadata, so its time grows with disk size: hours for large disks, far too slow when only a few blocks were being written at the time of the crash.</p>

<h2>Solution 2: journaling (write-ahead logging)</h2>
<p>Before changing structures in place, write a description of the whole change to a separate log area, then a commit record. Only after the commit is on disk, apply the changes to their home locations (<em>checkpoint</em>). After a crash, replay committed transactions from the log and ignore uncommitted ones. Recovery reads only the log, so it takes seconds regardless of disk size. Databases do the same with their write-ahead log.</p>
${fig('xv6log', '<b>Figure 22.2</b> One xv6 transaction from start to finish. At each step, consider what a crash would leave behind.')}
${code('kernel/log.c: the heart of xv6 logging', 'c')`
void
begin_op(void)
{
  acquire(&log.lock);
  while(1){
    if(log.committing){
      sleep(&log, &log.lock);
    } else if(log.lh.n + (log.outstanding+1)*MAXOPBLOCKS > LOGBLOCKS){
      sleep(&log, &log.lock);        // this op might exhaust log space; wait for commit
    } else {
      log.outstanding += 1;
      release(&log.lock);
      break;
    }
  }
}

static void
commit()
{
  if (log.lh.n > 0) {
    write_log();      // write modified blocks from cache to log
    write_head();     // write header to disk -- the real commit
    install_trans(0); // now install writes to home locations
    log.lh.n = 0;
    write_head();     // erase the transaction from the log
  }
}`}
<p>Details worth noticing:</p>
<ul>
<li><strong>Reservation:</strong> each operation may write at most <code>MAXOPBLOCKS</code> = 10 distinct blocks; <code>begin_op</code> waits if the log (30 blocks) could overflow. That is why large writes are split into several transactions.</li>
<li><strong>Group commit:</strong> several system calls can be in progress in one transaction; the commit happens when the last one calls <code>end_op</code>, amortising the cost of the disk writes.</li>
<li><strong>Absorption:</strong> if one transaction modifies the same block several times (a bitmap block, say), <code>log_write</code> records it once.</li>
<li><strong>Pinning:</strong> logged buffers are pinned in the buffer cache so they cannot be evicted (and written home) before the commit.</li>
<li><strong>Cost:</strong> every block is written twice, and system calls are synchronous. Real file systems journal mostly metadata and commit in the background.</li>
</ul>

<h2>Journaling in ext4</h2>
${fig('jmodes', '<b>Figure 22.3</b> The three ext4 data modes: how data writes are ordered relative to the metadata journal.')}
<p>ext4's journal (managed by the jbd2 layer) commits every 5 seconds by default or on <code>fsync</code>. Commit blocks carry checksums, so a commit record cannot be mistaken for valid if the transaction was torn. Correctness depends on the device honouring ordering: the journal uses cache <strong>flush</strong> and <strong>FUA</strong> (force unit access) commands so that the transaction is truly on stable media before the commit record. A drive that lies about flushes defeats every file system and database above it.</p>
<p>A well-known lesson came with ext4's delayed allocation in 2009: applications that wrote a new file and renamed it over an old one without <code>fsync</code> sometimes found zero-length files after a crash, because the rename committed before the data was allocated. ext4 added a heuristic to flush data on such renames, but the portable answer remains the recipe from Chapter 20.</p>

<h2>Other approaches</h2>
<ul>
<li><strong>Soft updates</strong> (FreeBSD UFS): carefully order every metadata write so that the on-disk state is always consistent apart from possible leaks, which a background check reclaims. Elegant but intricate.</li>
<li><strong>Copy-on-write</strong> (ZFS, Btrfs, APFS) and <strong>log-structured</strong> designs never overwrite live data; a single root pointer update commits a whole new version (Chapter 23).</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"Journaling protects my data."</strong> By default it protects metadata; recent data still needs fsync.</li>
<li><strong>Disabling write barriers</strong> for speed, or using storage that acknowledges flushes it has not done.</li>
<li><strong>Assuming fsck finds everything:</strong> it cannot detect consistent-looking garbage.</li>
<li><strong>Forgetting that the log's commit must be a single atomic write</strong> (one sector, or protected by a checksum).</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Commit point</summary><p>Why is writing xv6's log header the commit point, and not writing the last logged block?</p><p><em>Answer:</em> recovery looks only at the header's count; until the header with n &gt; 0 is on disk, the logged blocks are ignored, so the transaction becomes durable exactly when that one-block write completes.</p></details>
<details><summary>Ordering</summary><p>In data=ordered mode, why must data reach disk before the metadata commit, and not after?</p><p><em>Answer:</em> otherwise a crash after the commit leaves an inode pointing at a block with stale contents.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Crash xv6</summary><p>Add a panic in xv6's <code>commit</code> after <code>write_head</code> but before <code>install_trans</code>, create a file, reboot and verify recovery installs it. Then move the panic before <code>write_head</code> and verify the file does not exist.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Log space</summary><p>Why does <code>begin_op</code> reserve <code>MAXOPBLOCKS</code> for every outstanding operation rather than tracking each operation's actual usage? What would a more precise scheme need?</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can enumerate the outcomes of a crash during a multi-block update.</li>
<li>I can explain fsck and why it does not scale.</li>
<li>I can trace xv6's log through begin_op, log_write, commit and recovery, and identify the commit point.</li>
<li>I understand ext4's journal modes and the role of flushes and FUA.</li>
<li>I know the alternatives: soft updates, copy-on-write and log-structured file systems.</li>
</ul>
`});

FIG.lfs = host => {
  const N = ['A log-structured file system treats the whole disk as a log. Writes are collected in memory into a large <em>segment</em> (megabytes) and written sequentially in one go.', 'Create file A with two blocks: segment 1 receives A\'s data blocks A0, A1, then A\'s inode (pointing to them), then a piece of the <em>inode map</em> recording where inode A now lives.', 'Overwrite A0. LFS never writes in place: the new A0′, a new inode for A and a new inode map piece are appended to segment 2. The old A0, old inode and old imap piece in segment 1 are now dead.', 'The <em>checkpoint region</em> at a fixed location records where the latest inode map pieces are. It is updated periodically; recovery reads it and then rolls forward through segments written since.', 'Eventually the disk fills with partly dead segments. The <em>cleaner</em> reads segment 1, copies its live blocks (only A1) to the head of the log, and marks segment 1 free for reuse as one large sequential extent.'];
  stepper(host, N.map((note, k) => ({ k, note })), f => {
    const cw = 50; let s = '';
    const seg1 = f.k >= 1 ? [['A0', f.k >= 2 && f.k < 4 ? 'dim' : 'acc'], ['A1', 'acc'], ['iA', f.k >= 2 ? 'dim' : 'ok'], ['imap', f.k >= 2 ? 'dim' : 'warn']] : [];
    const seg2 = f.k >= 2 ? [['A0′', 'acc'], ['iA′', 'ok'], ['imap′', 'warn']] : [];
    s += tx(20, 14, 'segment 1', 'tb', 'start') + tx(250, 14, 'segment 2', 'tb', 'start') + tx(480, 14, 'segment 3', 'tb', 'start');
    for (let i = 0; i < 4; i++) { const c = f.k === 4 ? null : seg1[i]; s += rect(20 + i * cw, 24, cw - 4, 36, 'nd ' + (c ? c[1] : 'cell'), 3) + (c ? tx(20 + i * cw + (cw - 4) / 2, 42, c[0], 'ti') : ''); }
    for (let i = 0; i < 4; i++) { const c = seg2[i]; s += rect(250 + i * cw, 24, cw - 4, 36, 'nd ' + (c ? c[1] : 'cell'), 3) + (c ? tx(250 + i * cw + (cw - 4) / 2, 42, c[0], 'ti') : ''); }
    for (let i = 0; i < 3; i++) { const c = f.k === 4 ? [['A1', 'acc'], ['iA″', 'ok'], ['imap″', 'warn']][i] : null; s += rect(480 + i * cw, 24, cw - 4, 36, 'nd ' + (c ? c[1] : 'cell'), 3) + (c ? tx(480 + i * cw + (cw - 4) / 2, 42, c[0], 'ti') : ''); }
    if (f.k === 4) s += tx(115, 76, 'free again', 'tp ok') + arrow(80, 62, 500, 62, 'ok');
    if (f.k >= 2 && f.k < 4) s += tx(115, 76, 'grey = dead', 'ti');
    if (f.k >= 3) s += rect(20, 96, 200, 34, 'nd hot', 5) + tx(120, 113, 'checkpoint region → imap', 'ti') + arrow(222, 113, f.k === 4 ? 590 : 380, 62, 'hot');
    return { s, w: 640, h: 140 };
  });
};

FIG.lfscost = host => {
  host.innerHTML = `<div class="tool"><div class="row"><div style="flex:1"><label>utilisation of segments being cleaned: <b id="uv"></b></label><input id="u" type="range" min="0" max="90" value="50" style="width:100%"></div></div><div id="lcfig"></div><div class="out" id="lcout"></div></div>`;
  const draw = () => {
    const u = +host.querySelector('#u').value / 100; host.querySelector('#uv').textContent = Math.round(u * 100) + '%';
    const pts = []; for (let x = 0; x <= 0.9001; x += 0.02) pts.push([x * 100, 2 / (1 - x)]);
    const r = linechart([{ pts, c: 'c6', label: 'write cost', f: 'hot' }], { xmax: 100, ymax: 20, xticks: [0, 20, 40, 60, 80, 100], yticks: 4, W: 440, H: 170, xlabel: 'utilisation of cleaned segments (%)', R: 110, vlines: [{ x: u * 100, label: (2 / (1 - u)).toFixed(1) + '×', cls: 'acc' }] });
    host.querySelector('#lcfig').innerHTML = `<div class="stage">${svgw(r.w, r.h, r.s, 'Cleaning cost')}</div>`;
    const N = 10; host.querySelector('#lcout').innerHTML = `To free space the cleaner reads ${N} segments that are ${Math.round(u * 100)}% live, writes back ${(N * u).toFixed(1)} segments of live data and gains ${(N * (1 - u)).toFixed(1)} segments for new data. Total disk traffic per byte of new data: (read + live rewrite + new) / new = <b>2 / (1 − u) = ${(2 / (1 - u)).toFixed(2)}</b>.<br><span class="meta">Hence cleaners pick mostly-empty segments, and separate hot (frequently rewritten) from cold data.</span>`;
  };
  host.querySelector('#u').addEventListener('input', draw); draw();
};

FIG.cowtree = host => {
  const N = ['A copy-on-write file system keeps all metadata and data in a tree of blocks hanging from a root (ZFS calls it the uberblock; Btrfs has a superblock pointing to tree roots). Every pointer also carries a checksum of the block it points to.', 'Modify leaf C: the new contents are written to a <em>new</em> location, C′. The old C is not touched.', 'C′ has a new address, so its parent must change too: B′ is written to a new location, pointing to C′ and to the unchanged D.', 'And so on up to the root. Finally one atomic write of the root (with a transaction number) switches the file system from the old tree to the new tree. A crash before that write leaves the old tree intact; there is nothing to repair.', 'If a snapshot holds the old root, the old blocks stay: two complete trees share every unchanged block. Without a snapshot, old blocks unreachable from the new root are freed.'];
  stepper(host, N.map((note, k) => ({ k, note })), f => {
    const P = { R: [200, 24], A: [110, 84], B: [290, 84], L1: [60, 144], L2: [160, 144], C: [250, 144], D: [330, 144] };
    let s = '';
    const node = (id, t, c, dx = 0) => { const [x, y] = P[id]; return rect(x - 30 + dx, y - 15, 60, 30, 'nd ' + c, 5) + tx(x + dx, y, t, 'tm'); };
    const old = f.k === 4 ? 'dim' : 'acc';
    [['R', 'A'], ['R', 'B'], ['A', 'L1'], ['A', 'L2'], ['B', 'C'], ['B', 'D']].forEach(([a, b]) => s += `<line x1="${P[a][0]}" y1="${P[a][1] + 15}" x2="${P[b][0]}" y2="${P[b][1] - 15}" class="ed"/>`);
    s += node('R', 'root', f.k >= 3 ? old : 'cmp') + node('A', 'A', 'acc') + node('B', 'B', f.k >= 2 ? old : 'acc') + node('L1', 'leaf', 'acc') + node('L2', 'leaf', 'acc') + node('C', 'C', f.k >= 1 ? old : 'acc') + node('D', 'D', 'acc');
    const ox = 250;
    if (f.k >= 1) s += rect(P.C[0] + ox - 30, P.C[1] - 15, 60, 30, 'nd ok', 5) + tx(P.C[0] + ox, P.C[1], 'C′', 'tm');
    if (f.k >= 2) s += rect(P.B[0] + ox - 30, P.B[1] - 15, 60, 30, 'nd ok', 5) + tx(P.B[0] + ox, P.B[1], 'B′', 'tm') + `<line x1="${P.B[0] + ox}" y1="${P.B[1] + 15}" x2="${P.C[0] + ox}" y2="${P.C[1] - 15}" class="ed ok"/><line x1="${P.B[0] + ox - 10}" y1="${P.B[1] + 15}" x2="${P.D[0] + 6}" y2="${P.D[1] - 15}" class="ed ok"/>`;
    if (f.k >= 3) s += rect(P.R[0] + ox + 60, P.R[1] - 15, 70, 30, 'nd hot', 5) + tx(P.R[0] + ox + 95, P.R[1], 'root′', 'tm') + `<line x1="${P.R[0] + ox + 70}" y1="${P.R[1] + 15}" x2="${P.A[0] + 20}" y2="${P.A[1] - 15}" class="ed ok"/><line x1="${P.R[0] + ox + 95}" y1="${P.R[1] + 15}" x2="${P.B[0] + ox}" y2="${P.B[1] - 15}" class="ed ok"/>`;
    if (f.k === 4) s += tx(200, 186, 'old tree: kept by a snapshot, or freed', 'ti') + tx(520, 186, 'live tree', 'tp ok');
    return { s, w: 640, h: 196 };
  });
};

CH.push({
  id: 'ch23', n: 23, title: 'Log-Structured and Copy-on-Write File Systems',
  lede: 'Journaling bolts crash safety onto a file system that updates data in place. A different family of designs never overwrites live data at all: new versions are written elsewhere and a single pointer switch makes them current. This idea, from the log-structured file system of 1991, underlies ZFS, Btrfs and APFS, flash file systems such as F2FS, the flash translation layer inside every SSD, and the LSM trees in modern databases. It also gives snapshots, clones and end-to-end checksums almost for free.',
  html: `
<h2>Why write sequentially</h2>
<p>By the early 1990s memory had grown large enough to absorb most reads in the cache, so disk traffic was dominated by writes, and those writes were small and scattered: creating one file in a traditional Unix file system touched the directory, its inode, the file's inode, the bitmap and data blocks, all in different places, each costing a seek. Sequential bandwidth was improving much faster than seek time. The log-structured file system (LFS) proposed: buffer all updates, and write them together as one long sequential write.</p>

<h2>The log-structured file system</h2>
${fig('lfs', '<b>Figure 23.1</b> LFS appends everything, including inodes and the map that locates them, and reclaims space by cleaning.')}
<p>The new problem is finding inodes, which no longer live at fixed locations. LFS adds a level of indirection, the <strong>inode map</strong> (inode number → disk address), itself written to the log in pieces, with a fixed <strong>checkpoint region</strong> pointing to the latest pieces. Crash recovery reads the last consistent checkpoint (two copies are alternated, each with a timestamp written last) and rolls forward through later segments.</p>

<h2>The cost of cleaning</h2>
${fig('lfscost', '<b>Figure 23.2</b> Interactive: the cleaner\'s overhead rises steeply with the utilisation of the segments it cleans.')}
<p>Garbage collection is LFS's central cost and the main argument against it. The same trade-off reappears in SSD firmware (Chapter 19: write amplification and over-provisioning), in F2FS, and in LSM-tree databases (RocksDB, Cassandra), where compaction plays the cleaner's role.</p>

<h2>Copy-on-write file systems</h2>
${fig('cowtree', '<b>Figure 23.3</b> A copy-on-write update rewrites the path from the changed block to the root, then switches roots atomically.')}
<p>ZFS (2005, now OpenZFS on Linux and FreeBSD), Btrfs (in Linux since 2009) and Apple's APFS (2017) apply the same principle to trees of blocks. The benefits are significant:</p>
<ul>
<li><strong>Always-consistent on disk:</strong> no fsck, no journal replay. (ZFS adds an intent log, the ZIL, to make synchronous writes fast without waiting for a full transaction group.)</li>
<li><strong>Cheap snapshots and clones:</strong> keep an old root. Creating a snapshot is constant time; it costs space only as data diverges.</li>
<li><strong>End-to-end checksums:</strong> each block pointer holds the checksum of the child, forming a Merkle tree. A read verifies data all the way from the root, detecting bit rot, misdirected writes and phantom writes that the drive reports as successful. With redundancy (mirrors, RAID-Z), the file system repairs the bad copy from a good one; periodic <em>scrubs</em> read everything to find latent errors.</li>
<li><strong>Integrated volume management and RAID,</strong> compression, deduplication, and incremental replication by sending the difference between two snapshots.</li>
</ul>
<p>The costs: every small update rewrites a path of metadata (mitigated by batching updates into transaction groups every few seconds), free-space fragmentation over time, and in-place-update workloads such as databases and VM images fragment badly unless copy-on-write is disabled for those files (Btrfs <code>chattr +C</code>) or record sizes are tuned (ZFS <code>recordsize</code>).</p>

<h2>The landscape in Linux today</h2>
<div class="tbl"><table><tr><th>File system</th><th>Design</th><th>Typical use</th></tr>
<tr><td>ext4</td><td>In-place updates, extents, metadata journal</td><td>The conservative default on many distributions</td></tr>
<tr><td>XFS</td><td>In-place, B+ trees everywhere, metadata journal, parallel allocation groups; reflink copies</td><td>Large files and high parallelism; default on RHEL</td></tr>
<tr><td>Btrfs</td><td>Copy-on-write B-trees, checksums, snapshots, subvolumes, compression</td><td>Default on Fedora workstations and openSUSE</td></tr>
<tr><td>OpenZFS</td><td>Copy-on-write, pooled storage, RAID-Z, checksums (out of tree due to licensing)</td><td>Storage servers, NAS</td></tr>
<tr><td>F2FS</td><td>Log-structured, designed for flash</td><td>Android phones, flash devices</td></tr>
</table></div>
<p>Linux keeps evolving these: recent releases through 7.3 continued to add performance work to ext4 and Btrfs. bcachefs, a newer copy-on-write file system merged in 6.7, was removed from the mainline kernel in 6.18 and continues to be developed outside it.</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"Snapshots are backups."</strong> They share blocks with the live data on the same devices.</li>
<li><strong>"Copy-on-write means no write amplification."</strong> Small updates rewrite metadata paths.</li>
<li><strong>"Checksums fix corruption."</strong> They detect it; repair needs a redundant copy.</li>
<li><strong>Running copy-on-write file systems nearly full,</strong> where allocation and cleaning become slow.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Cleaning cost</summary><p>If the cleaner can find segments that are only 20% live, what is the write cost? At 80%?</p><p><em>Answer:</em> 2 / 0.8 = 2.5; 2 / 0.2 = 10.</p></details>
<details><summary>Why an inode map?</summary><p>Why does LFS need an inode map but ext4 does not?</p><p><em>Answer:</em> ext4 inodes live at fixed, computable locations; LFS writes each new inode version to the log head, so a level of indirection is needed to find it.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Snapshots in practice</summary><p>On a Btrfs or ZFS test volume, write a 1 GB file, snapshot it, then overwrite 10% of it. Compare the space used by the snapshot before and after.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Same idea, three places</summary><p>Compare an SSD's FTL, LFS and an LSM-tree database: what plays the role of the segment, the inode map, the cleaner, and the checkpoint in each?</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why LFS writes everything sequentially and how it finds inodes.</li>
<li>I can derive the cleaning cost and explain hot/cold separation.</li>
<li>I can trace a copy-on-write update to the root and explain snapshots.</li>
<li>I understand end-to-end checksums and scrubbing.</li>
<li>I can compare ext4, XFS, Btrfs, ZFS and F2FS.</li>
</ul>
`});

FIG.smash = host => {
  const M = [['canary', 'stack canary'], ['nx', 'non-executable stack (W^X)'], ['aslr', 'ASLR + PIE'], ['ss', 'shadow stack (CET / Zicfiss)']];
  const A = [['inject', 'Inject code on the stack'], ['rop', 'Return-oriented programming'], ['leak', 'Info leak, then ROP']];
  host.innerHTML = `<div class="tool"><div class="row"><div><label>attack</label><select id="atk">${A.map(([k, t]) => `<option value="${k}">${t}</option>`).join('')}</select></div><div><label>mitigations enabled</label>${M.map(([k, t]) => `<label class="chk"><input type="checkbox" data-m="${k}">${t}</label>`).join('')}</div></div><div id="smfig"></div><div class="out" id="smout"></div></div>`;
  const draw = () => {
    const atk = host.querySelector('#atk').value, on = {}; host.querySelectorAll('input[data-m]').forEach(c => on[c.dataset.m] = c.checked);
    let s = tx(150, 12, 'stack frame of a vulnerable function', 'tb');
    const rows = [['caller\'s frame', 'dim'], ['return address', 'hot'], ['saved frame pointer', 'warn'], ...(on.canary ? [['canary (random)', 'ok']] : []), ['char buf[64]', 'acc']];
    rows.forEach(([t, c], i) => s += rect(40, 24 + i * 30, 220, 26, 'nd ' + c, 3) + tx(150, 37 + i * 30, t, 'ti'));
    const by = 24 + (rows.length - 1) * 30;
    s += `<line x1="276" y1="${by + 20}" x2="276" y2="${54}" class="ed hot" marker-end="url(#${mk('hot')})"/>` + tx(286, (by + 74) / 2, 'strcpy(buf, input) writes upward past the end', 'tp hot', 'start');
    const pay = 'payload: ' + { inject: 'return address → shellcode in buf', rop: 'return address → gadgets in existing code', leak: 'leaked canary and addresses, then ROP' }[atk];
    s += rect(286, by + 30 - 30 * 0, 340, 26, 'nd cmp', 3) + tx(456, by + 43, pay, 'ti');
    host.querySelector('#smfig').innerHTML = `<div class="stage">${svgw(640, by + 66, s, 'Stack smashing')}</div>`;
    const res = [];
    if (on.canary) res.push(atk === 'leak' ? ['canary', false, 'the leaked canary value is written back unchanged'] : ['canary', true, 'the overwrite changes the canary; the check before return aborts the program']);
    if (on.nx) res.push(atk === 'inject' ? ['W^X', true, 'the stack is not executable; jumping to it faults'] : ['W^X', false, 'ROP only reuses code that is already executable']);
    if (on.aslr) res.push(atk === 'leak' ? ['ASLR', false, 'the leaked pointer reveals the randomised base'] : ['ASLR', true, 'the attacker must guess addresses; a wrong guess crashes (probabilistic, weak on 32-bit or with forking servers that keep the same layout)']);
    if (on.ss) res.push(['shadow stack', true, 'the hardware compares the return address with a protected copy and faults on mismatch']);
    const stopped = res.some(r => r[1]);
    host.querySelector('#smout').innerHTML = (res.length ? res.map(([n, ok, why]) => `<span class="${ok ? 'g' : 'd'}">${ok ? '✓' : '✗'} ${n}</span>: ${why}`).join('<br>') + '<br>' : '') + (stopped ? '<b class="g">Attack stopped (or made very unlikely).</b>' : '<b class="d">Attack succeeds: the attacker controls execution.</b>') + '<br><span class="meta">Every mitigation raises cost; none removes the bug. Memory-safe languages remove this class of bug at the source.</span>';
  };
  host.querySelectorAll('input,select').forEach(i => i.addEventListener('input', draw)); draw();
};

FIG.kpti = host => tabs(host, [['before', 'Kernel mapped in every process'], ['kpti', 'KPTI (and xv6)']], (body, k) => {
  let s = tx(160, 14, 'while running user code', 'tb') + tx(480, 14, 'while running in the kernel', 'tb');
  const col = (x, kernelFull, ul = 'user memory') => rect(x, 26, 220, 70, 'nd acc', 5) + tx(x + 110, 61, ul, 'tm') + rect(x, 100, 220, 70, 'nd ' + (kernelFull ? 'hot' : 'dim'), 5) + tx(x + 110, 128, kernelFull ? 'all kernel memory' : 'trampoline + trap entry only', 'tm') + tx(x + 110, 148, kernelFull ? 'mapped, marked supervisor-only' : 'nothing secret mapped', 'ti');
  s += col(50, k === 'before') + col(370, true, k === 'kpti' ? 'user memory (Linux; not xv6)' : 'user memory');
  const n = k === 'before' ? 'For speed, kernels mapped themselves into every address space, protected only by the supervisor bit in the page tables. Meltdown (2018) showed that on many Intel CPUs a user-mode load from a kernel address is executed speculatively before the permission check faults, and its value can be recovered through cache timing. All of kernel memory, and through the direct map all of physical memory, became readable.' : 'Kernel page-table isolation gives user mode a page table with almost no kernel mappings; entering the kernel switches to the full table. It costs a page-table switch on every system call and interrupt, softened by ASIDs/PCIDs. xv6 always worked this way: user page tables map only the trampoline and the trapframe, and uservec switches satp to the kernel page table.';
  body.innerHTML = `<div class="stage">${svgw(640, 180, s, 'Kernel page-table isolation')}</div><p class="fnote">${n}</p>`;
}, 'before');

CH.push({
  id: 'ch24', n: 24, title: 'Protection and Security',
  lede: 'Everything in this book so far, from user mode to page tables to file permissions, exists partly to keep programs from interfering with each other and with the kernel. This chapter looks at that protection as an adversary would: how isolation is attacked through memory-safety bugs, side channels and the kernel\'s own interfaces, and the defences that operating systems and hardware have accumulated in response, from W^X and ASLR to KPTI, seccomp, capabilities, mandatory access control and memory-safe kernel code.',
  html: `
<h2>Protection versus security</h2>
<p><strong>Protection</strong> is the set of mechanisms that control which subjects (processes, users) can access which objects (memory, files, devices) and how. <strong>Security</strong> is whether those mechanisms hold up against a determined adversary. The mechanisms we already have:</p>
<div class="tbl"><table><tr><th>Mechanism</th><th>Protects</th><th>Chapter</th></tr>
<tr><td>User/supervisor mode, privileged instructions</td><td>The kernel and hardware configuration</td><td>2, 4</td></tr>
<tr><td>Traps as the only entry into the kernel; argument checking</td><td>Kernel integrity</td><td>3, 4</td></tr>
<tr><td>Per-process page tables, PTE permission bits</td><td>Memory of other processes and of the kernel</td><td>10</td></tr>
<tr><td>Timer interrupts</td><td>CPU availability</td><td>4</td></tr>
<tr><td>File permissions, user IDs</td><td>Files</td><td>20</td></tr>
<tr><td>IOMMU</td><td>Memory against device DMA</td><td>18</td></tr>
</table></div>
<p>The kernel together with the hardware forms the <strong>trusted computing base</strong>: if any part of it has a bug, protection can fail. A design principle follows: keep the TCB small, and give every component the <strong>least privilege</strong> it needs.</p>

<h2>Memory-safety attacks and mitigations</h2>
<p>Most serious vulnerabilities in operating systems and the software on them have been memory-safety bugs in C and C++ code: buffer overflows, use-after-free, out-of-bounds reads. Microsoft and Google have each reported that around 70% of their severe security bugs were of this kind. The classic exploit overflows a stack buffer to overwrite a return address.</p>
${fig('smash', '<b>Figure 24.1</b> Interactive: choose an attack and a set of mitigations. Each defence stops some attacks and not others.')}
<p>Operating systems provide most of these mitigations:</p>
<ul>
<li><strong>W^X (NX/XD):</strong> no page is both writable and executable; enforced with PTE bits (RISC-V has separate R, W and X).</li>
<li><strong>ASLR:</strong> the kernel randomises the base of the stack, heap, mmap area and (for position-independent executables) the program itself; KASLR randomises the kernel's own location.</li>
<li><strong>Stack canaries</strong> (a compiler feature), guard pages below stacks, and hardened allocators.</li>
<li><strong>Control-flow integrity</strong> in hardware: Intel CET shadow stacks (Linux user-space support since 6.6) and indirect-branch tracking, Arm pointer authentication and BTI, and RISC-V's Zicfiss/Zicfilp extensions.</li>
<li><strong>Kernel protections against user memory:</strong> SMEP/SMAP on x86 (PXN/PAN on Arm; the SUM bit on RISC-V) stop the kernel from executing or accidentally dereferencing user pages. xv6 goes further: the kernel cannot see user memory directly at all, so <code>copyin</code> and <code>copyout</code> translate user addresses through the process's page table in software.</li>
</ul>
<p>The lasting fix is memory-safe code. Rust support in the Linux kernel is no longer experimental, and new drivers (such as the Nova GPU driver and Android's Binder rewrite) are being written in Rust. At the far end, the seL4 microkernel has a machine-checked proof that its C implementation matches its specification.</p>

<h2>Side channels</h2>
${fig('kpti', '<b>Figure 24.2</b> Meltdown and kernel page-table isolation.')}
<p>Meltdown was one of a family of <strong>transient-execution</strong> attacks disclosed from 2018 onward. Spectre tricks the branch predictor so that a victim speculatively executes code paths it never architecturally takes, leaving secrets in the cache. Defences combine microcode updates, compiler changes (retpolines, speculation barriers, index masking), kernel changes (KPTI, flushing buffers on context switch, disabling SMT for untrusted workloads), and newer hardware. New variants continue to appear; Linux reports the mitigation state in <code>/sys/devices/system/cpu/vulnerabilities/</code>. Other side channels include timing of shared caches between tenants and power analysis; isolation of memory alone does not stop information flowing through shared hardware.</p>

<h2>Reducing the kernel's attack surface</h2>
<p>A process can reach more than 450 Linux system calls, each a path into the TCB. Sandboxes restrict this:</p>
${code('seccomp: allow only the system calls a worker needs (using libseccomp)', 'c')`
scmp_filter_ctx ctx = seccomp_init(SCMP_ACT_KILL_PROCESS);   // default: kill
seccomp_rule_add(ctx, SCMP_ACT_ALLOW, SCMP_SYS(read), 0);
seccomp_rule_add(ctx, SCMP_ACT_ALLOW, SCMP_SYS(write), 0);
seccomp_rule_add(ctx, SCMP_ACT_ALLOW, SCMP_SYS(exit_group), 0);
seccomp_rule_add(ctx, SCMP_ACT_ALLOW, SCMP_SYS(futex), 0);
seccomp_load(ctx);      // a BPF program now checks every system call this process makes
// from here on, open(), socket(), execve()... kill the process`}
<p>seccomp filters are small BPF programs that inspect the system call number and arguments. Browsers, container runtimes (Docker's default profile blocks dozens of calls) and systemd services use them. <strong>Landlock</strong> (since Linux 5.13) lets unprivileged processes restrict their own file system and network access. More broadly, <strong>eBPF</strong> lets verified programs run inside the kernel for tracing, networking and security policy; the verifier that proves them safe is itself part of the TCB and a frequent target.</p>

<h2>Access control beyond Unix permissions</h2>
<ul>
<li><strong>Capabilities:</strong> Linux splits root's power into about 40 capabilities (CAP_NET_BIND_SERVICE, CAP_SYS_ADMIN, …), so a web server can bind port 443 without full root. CAP_SYS_ADMIN remains notoriously broad.</li>
<li><strong>Mandatory access control:</strong> SELinux (labels on every subject and object, central policy; default on Android, RHEL and Fedora) and AppArmor (path-based profiles; Ubuntu, SUSE) confine even root-owned processes.</li>
<li><strong>Capability-based systems</strong> in the original sense, where access rights are unforgeable tokens passed between processes, appear in seL4, Fuchsia's Zircon and the CHERI hardware architecture, and in a limited form in Unix file descriptors passed over sockets.</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Treating one mitigation as a fix.</strong> Exploits chain several bugs (an info leak to defeat ASLR, then a write).</li>
<li><strong>Trusting user pointers in the kernel</strong> without validation, or checking them and then reading them again (time-of-check to time-of-use).</li>
<li><strong>Running services as root</strong> or with CAP_SYS_ADMIN when one narrow capability would do.</li>
<li><strong>Disabling side-channel mitigations for performance</strong> on multi-tenant machines.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Which defence?</summary><p>An attacker can overwrite a function pointer in the heap (not a return address) and point it at existing code. Which of canaries, W^X, ASLR and shadow stacks help?</p><p><em>Answer:</em> ASLR (addresses unknown); forward-edge CFI such as indirect-branch tracking would also help. Canaries and shadow stacks protect return addresses; W^X does not stop code reuse.</p></details>
<details><summary>ASLR entropy</summary><p>If a library's base is randomised over 2<sup>28</sup> page-aligned positions and every wrong guess crashes a server that restarts with a new layout, how many attempts are needed on average?</p><p><em>Answer:</em> about 2<sup>27</sup>; but if forked workers share one layout, guesses can be repeated or addresses brute-forced byte by byte.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Look at your machine</summary><p>Read <code>/sys/devices/system/cpu/vulnerabilities/*</code>, <code>cat /proc/self/maps</code> twice to see ASLR, and <code>grep Seccomp /proc/*/status</code> to find sandboxed processes.</p></details>
<details><summary>xv6 copyin</summary><p>Read <code>copyin</code> in xv6's <code>vm.c</code>. Which checks prevent a process from passing a kernel address or an unmapped address to <code>read()</code>?</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Sandbox a program</summary><p>Write a seccomp filter for a program that only reads stdin and writes stdout, run it under <code>strace -f</code>, and observe what happens when it calls something else.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can list the OS protection mechanisms and what each protects.</li>
<li>I can explain stack smashing, code reuse, and which mitigations stop which attacks.</li>
<li>I understand Meltdown, Spectre and KPTI, and why xv6 already separates kernel and user page tables.</li>
<li>I know how seccomp, Landlock, capabilities and SELinux/AppArmor reduce privilege.</li>
<li>I understand why memory-safe languages and small TCBs matter.</li>
</ul>
`});

FIG.trapemu = host => {

    }

    const total = (g + 1) * (h + 1) - 1;
    host.querySelector('#nptfig').innerHTML = `<div class="stage">${svgw(640, 30 + (g + 1) * (cell + gap) + 6, s, 'Two-dimensional page walk')}</div>`;
    host.querySelector('#nptout').innerHTML = `TLB miss with nested paging: (${g} + 1) × (${h} + 1) − 1 = <b>${total}</b> memory references, versus ${g} natively. (The guest walk starts from the guest's root pointer, itself a guest physical address, so g + 1 host walks are needed; the final data read is not a page-table reference.)<br><span class="meta">This is why TLB reach, huge pages (on both levels) and paging-structure caches matter so much for virtual machines.</span>`;

CH.push({
  id: 'ch25', n: 25, title: 'Virtual Machines and Containers',
  lede: 'The book began with the operating system virtualising the CPU and memory for processes. It ends with the same idea applied one level down: virtualising the whole machine so that complete operating systems can share hardware, and, in the other direction, giving groups of processes their own view of a shared kernel. Virtual machines and containers are how nearly all cloud computing is delivered, and xv6 itself runs inside one: QEMU.',
  html: `
<h2>Three ways to share a machine</h2>
${fig('virtstacks', '<b>Figure 25.1</b> Full virtual machines, containers, and microVMs: what is shared and what is isolated.')}

<h2>Virtualising the CPU: trap and emulate</h2>
<p>Popek and Goldberg (1974) stated the condition for efficient virtualisation: every <em>sensitive</em> instruction (one that reads or changes privileged state) must be <em>privileged</em> (trap when run in user mode). Then the guest kernel can run directly on the CPU in an unprivileged mode, and each sensitive instruction traps to the hypervisor for emulation.</p>
${fig('trapemu', '<b>Figure 25.2</b> Trap-and-emulate: the guest runs natively until it touches privileged state.')}
<p>Classic x86 failed the condition: instructions such as <code>POPF</code> silently behaved differently in user mode instead of trapping. VMware worked around this with dynamic binary translation of guest kernel code, and Xen with <strong>paravirtualisation</strong>: modifying the guest kernel to call the hypervisor explicitly (hypercalls). Since 2005-2006, hardware support (Intel VT-x, AMD-V) adds a new privilege dimension, with the guest running in a "non-root" mode where its own rings work normally and configurable events cause <em>VM exits</em> to the hypervisor. Arm has EL2 for hypervisors, and RISC-V's <strong>H extension</strong> adds virtual-supervisor (VS) and virtual-user (VU) modes, a second stage of address translation, and virtualised interrupts and timers. Exits are expensive (hundreds to thousands of cycles), so hypervisor design is about avoiding them.</p>
<p>Linux's <strong>KVM</strong> turns the kernel into a hypervisor: each virtual CPU is a thread that enters guest mode through an ioctl; a user-space VMM such as QEMU, Firecracker or Cloud Hypervisor sets up memory and emulates devices. Every major cloud runs some form of this.</p>

<h2>Virtualising memory</h2>
<p>The guest manages its own page tables mapping guest virtual to <em>guest physical</em> addresses, which are not real physical addresses. Before hardware help, hypervisors kept <strong>shadow page tables</strong> mapping guest virtual straight to host physical, write-protecting the guest's tables to catch every change: correct, but full of expensive exits. <strong>Nested paging</strong> (Intel EPT, AMD NPT, RISC-V G-stage translation) has the hardware walk both levels. A TLB hit costs nothing extra; a miss is much more expensive:</p>
${fig('npt', '<b>Figure 25.3</b> Interactive: the two-dimensional page walk on a TLB miss.')}
<p>Memory can also be overcommitted across VMs: <strong>ballooning</strong> (a driver in the guest allocates memory to give back to the host), sharing identical pages (KSM), and swapping by the host. These interact badly with the guest's own memory management, which cannot see what the host is doing: the same semantic gap that runs through all of virtualisation.</p>

<h2>Virtualising I/O</h2>
<div class="tbl"><table><tr><th>Approach</th><th>How</th><th>Trade-off</th></tr>
<tr><td>Full emulation</td><td>The VMM emulates a real device (an IDE disk, an E1000 NIC); every register access exits</td><td>Runs unmodified guests; slow</td></tr>
<tr><td>Paravirtual (virtio)</td><td>Guest and host share virtqueues in memory designed for virtualisation; few exits, batched</td><td>Needs a guest driver; the standard today</td></tr>
<tr><td>Passthrough, SR-IOV</td><td>A physical device (or a virtual function of it) is assigned to the guest, isolated by the IOMMU</td><td>Near-native speed; harder to migrate or share</td></tr>
</table></div>
<p>xv6's disk driver from Chapter 18 is a virtio driver: when you run xv6, QEMU is the hypervisor, and the virtqueue descriptors your kernel writes are read by QEMU's device model. On an x86 or Arm laptop, QEMU also emulates the RISC-V CPU itself, translating guest instructions with its TCG binary translator. Hardware virtualisation could not run xv6 unmodified anyway: xv6 starts in machine mode (<code>start.c</code>), and a guest can be given only virtual supervisor and user modes.</p>

<h2>Confidential computing</h2>
<p>Normally the hypervisor can read any guest's memory. AMD SEV-SNP, Intel TDX and Arm CCA encrypt guest memory with keys held by the CPU and protect the integrity of the guest's mappings, so that even a compromised hypervisor or cloud operator cannot read or silently alter the guest. Attestation lets the guest prove to a remote party what it is running. The trusted computing base shrinks to the CPU, its firmware and the guest itself.</p>

<h2>Containers</h2>
<p>A container is not a kernel object; it is a process tree to which several independent kernel features have been applied:</p>
<div class="tbl"><table><tr><th>Feature</th><th>What it does</th></tr>
<tr><td>Namespaces: mount, PID, network, UTS, IPC, user, cgroup, time</td><td>Give the processes their own view: their own root file system, PID 1, network interfaces, hostname. User namespaces map root inside to an unprivileged user outside.</td></tr>
<tr><td>cgroups v2</td><td>Limit and account CPU, memory, I/O and number of processes for the group (Chapter 6 scheduling, Chapter 12 memory)</td></tr>
<tr><td>Capabilities, seccomp, LSM profiles</td><td>Reduce what the processes may ask the kernel to do (Chapter 24)</td></tr>
<tr><td>Layered images (overlayfs)</td><td>Share read-only image layers between containers, with a private writable layer on top</td></tr>
</table></div>
${code('A container from first principles', 'bash')`
# new PID, mount, UTS and network namespaces, running as "root" via a user namespace
$ unshare --user --map-root-user --pid --fork --mount --uts --net --mount-proc bash
# hostname box1          # changes only this namespace's hostname
# ps ax                  # PID 1 is this bash; host processes are invisible
# ip link                # only a loopback interface
# echo $$
1

# limit a group of processes to half a CPU and 256 MB (cgroup v2, as root on the host)
$ mkdir /sys/fs/cgroup/demo
$ echo "50000 100000" > /sys/fs/cgroup/demo/cpu.max
$ echo 256M > /sys/fs/cgroup/demo/memory.max
$ echo $PID > /sys/fs/cgroup/demo/cgroup.procs`}
<p>Because containers share the host kernel, the kernel's whole system-call surface is their isolation boundary. Hardened runtimes narrow it: gVisor intercepts system calls and implements them in a user-space kernel written in Go, and Kata Containers or Firecracker put each container or pod in its own lightweight VM. The choice between container and VM is a choice about how much kernel you are willing to share with whom.</p>

<h2>Full circle</h2>
<p>A hypervisor is an operating system whose processes are operating systems. Everything in this book reappears inside it: it schedules virtual CPUs (Chapters 5-6), manages a second level of address translation (Chapters 10-12), multiplexes devices through queues and interrupts (Chapter 18), and enforces isolation with the same hardware privilege mechanisms (Chapters 2, 4 and 24). A container runtime, in turn, is a careful user of the process, file system and resource-control interfaces. Understanding the operating system underneath is what makes both of them understandable.</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"Containers are lightweight VMs."</strong> They share the kernel; their isolation is the kernel's.</li>
<li><strong>"Root in a container is harmless."</strong> Without a user namespace it is root on the host as far as the kernel is concerned, limited only by capabilities, seccomp and LSM policy.</li>
<li><strong>"Virtualisation overhead is negligible."</strong> CPU-bound work is near native, but TLB misses, exits and I/O can cost a lot.</li>
<li><strong>"The cloud provider cannot see my VM."</strong> Only with confidential computing and attestation.</li>
</ul></div>
