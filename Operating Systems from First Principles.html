CH.push({
  id: 'ch11', n: 11, title: 'Translation Lookaside Buffers',
  lede: 'A three-level page table means three extra memory reads for every load or store, which would make paging unusable. Processors solve this with the translation lookaside buffer, a small, fast cache of recent translations. Because programs access memory with strong locality, a TLB of a few dozen to a few thousand entries satisfies the vast majority of translations. This chapter explains how TLBs work, how to reason about their hit rates with a simulator, what the kernel must do to keep them correct, and why huge pages matter.',
  html: `
<h2>Caching translations</h2>
${fig('tlbflow', '<b>Figure 11.1</b> Every memory access first consults the TLB. Only on a miss does the hardware walk the page table.')}
<p>The TLB is a cache inside the MMU, typically fully associative or highly set-associative, mapping VPNs (with an address-space tag) to PPNs and permission bits. Modern cores have a small, very fast first-level TLB (tens of entries per type) and a second-level TLB with one or two thousand entries. On a miss, RISC-V and x86 processors walk the page table in hardware, helped by caches that hold recently used upper-level entries; some older architectures such as MIPS raised an exception and let the kernel refill the TLB in software.</p>

<h2>Why TLBs work: locality</h2>
<ul>
<li><strong>Spatial locality:</strong> accesses near each other in address are likely on the same page. Walking an array of 4-byte integers touches 1,024 elements per 4 KB page: one miss, 1,023 hits.</li>
<li><strong>Temporal locality:</strong> recently used pages are likely used again soon.</li>
</ul>
${fig('tlbsim', '<b>Figure 11.2</b> A TLB simulator for a loop over an array. Compare sequential access, a stride of one page, and random access; change the TLB size and page size; try looping twice.')}
<p><strong>TLB reach</strong> is the memory covered by the TLB: entries × page size. 1,536 entries of 4 KB cover only 6 MB; the same entries with 2 MB pages cover 3 GB. Programs whose working set exceeds TLB reach (large hash tables, graph analytics, databases, JVM heaps) can spend a significant fraction of cycles on page walks, which is why huge pages help them.</p>

<h2>Context switches and ASIDs</h2>
${fig('asid', '<b>Figure 11.3</b> Without address-space tags the TLB must be flushed on every process switch; with tags, entries survive.')}
<p>RISC-V's <code>satp</code> has a 16-bit ASID field (implementations may support fewer bits). xv6 does not use ASIDs: it flushes the entire TLB with <code>sfence.vma zero, zero</code> whenever it switches page tables, which is simple and correct but slower. Linux uses ASIDs on RISC-V and ARM and PCIDs on x86 where available, and marks kernel mappings global (G bit) so they are not flushed on switches.</p>

<h2>Keeping the TLB coherent</h2>
<p>The TLB is not automatically coherent with page tables in memory. When the kernel changes a PTE (unmapping a page, removing write permission for copy-on-write, swapping a page out), it must invalidate cached translations:</p>
<ul>
<li>On the local CPU: <code>sfence.vma</code> with an address and ASID, or with zero for everything (x86: <code>invlpg</code> or reloading CR3).</li>
<li>On other CPUs that may have cached the translation: a <strong>TLB shootdown</strong>, an inter-processor interrupt asking each to flush. Shootdowns are expensive on many-core machines, so Linux batches them and tracks which CPUs have run the address space. Some recent CPUs provide broadcast invalidation in hardware (for example AMD's INVLPGB and ARM's TLBI broadcast).</li>
</ul>
<p>Forgetting a flush is one of the classic kernel bugs: a process keeps accessing a page through a stale translation after it was freed and reused.</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"TLB misses are rare enough to ignore."</strong> For random access over large memory, they dominate.</li>
<li><strong>"Changing a PTE takes effect immediately."</strong> Not until the TLB entry is invalidated.</li>
<li><strong>"Huge pages are only for databases."</strong> Any large, randomly accessed working set benefits; the JVM, for example, can use them with <code>-XX:+UseTransparentHugePages</code>.</li>
<li><strong>"A cache miss and a TLB miss are the same."</strong> Both can happen on one access, and a TLB miss's page walk can itself miss in the caches.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Hit rate by hand</summary><p>A loop reads 10 consecutive 4-byte integers starting at virtual address 100 with 16-byte pages and an initially empty TLB. How many misses?</p><p><em>Answer:</em> addresses 100–139 span pages 6, 7 and 8: three misses, seven hits.</p></details>
<details><summary>Reach</summary><p>What is the TLB reach of 64 entries with 4 KB pages? With 2 MB pages?</p><p><em>Answer:</em> 256 KB; 128 MB.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Measure the TLB</summary><p>Write a C program that touches one integer per page across N pages, many times, and time per access for N from 1 to 16,384 (pin to one CPU). Find the steps where first- and second-level TLB capacity are exceeded.</p></details>
<details><summary>Huge pages</summary><p>Run a random-access benchmark over 8 GB on Linux with transparent huge pages off and on (<code>/sys/kernel/mm/transparent_hugepage/enabled</code>), and compare <code>perf stat -e dTLB-load-misses</code>.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>ASIDs in xv6</summary><p>Design ASID support for xv6: allocation, recycling when ASIDs run out, and which flushes become unnecessary.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain what a TLB caches and what happens on a hit and a miss.</li>
<li>I can predict hit rates from access patterns and compute TLB reach.</li>
<li>I understand ASIDs and why xv6 flushes on every switch.</li>
<li>I know when the kernel must invalidate TLB entries and what shootdowns cost.</li>
</ul>
`});

const replSim = (refs, F, pol) => {
  const frames = [], out = []; let hand = 0; const ref = new Array(F).fill(0), last = {};
  refs.forEach((p, t) => { last[p] = t; const i = frames.indexOf(p);
    if (i >= 0) { if (pol === 'CLOCK') ref[i] = 1; out.push({ frames: frames.slice(), hit: true, ev: null }); return; }
    let ev = null;
    if (frames.length < F) { frames.push(p); if (pol === 'CLOCK') ref[frames.length - 1] = 1; }
    else { let v;
      if (pol === 'FIFO') { v = hand; hand = (hand + 1) % F; }
      else if (pol === 'LRU') { let best = Infinity; frames.forEach((q, j) => { const lu = refs.slice(0, t).lastIndexOf(q); if (lu < best) { best = lu; v = j; } }); }
      else if (pol === 'OPT') { let far = -1; frames.forEach((q, j) => { const nx = refs.indexOf(q, t + 1); const d = nx < 0 ? Infinity : nx; if (d > far) { far = d; v = j; } }); }
      else { while (ref[hand]) { ref[hand] = 0; hand = (hand + 1) % F; } v = hand; hand = (hand + 1) % F; }
      ev = frames[v]; frames[v] = p; if (pol === 'CLOCK') ref[v] = 1; }
    out.push({ frames: frames.slice(), hit: false, ev }); });
  return out;
};

CH.push({
  id: 'ch12', n: 12, title: 'Page Faults, Swapping and Replacement',
  lede: 'Page faults are not just errors: they are the hook that lets an operating system allocate memory lazily, share pages until someone writes, map files into memory, and pretend to have more memory than it does by moving pages to disk. When memory runs short, a replacement policy decides which pages to evict, and choosing well makes a large difference. This chapter covers the page fault path, copy-on-write, memory-mapped files and swapping, then lets you compare replacement policies on any reference string.',
  html: `
<h2>Handling a page fault</h2>
${fig('pfault', '<b>Figure 12.1</b> The steps of a page fault handler, from invalid PTE to restarted instruction.')}
<p>A fault that the kernel resolves without the program noticing is a <em>minor</em> fault if no disk I/O was needed (zero-fill, or a page already in the page cache) and a <em>major</em> fault if it had to read from disk. On Linux, <code>/usr/bin/time -v</code> and <code>ps -o min_flt,maj_flt</code> show the counts.</p>

<h2>Uses of page faults</h2>
<h3>Lazy allocation</h3>
<p>Do not allocate a page until it is used. Current xv6 supports this for <code>sbrk</code>: in lazy mode it only raises <code>p-&gt;sz</code>, and <code>vmfault()</code> allocates and maps a zeroed page on first touch. Linux does this for all anonymous memory: <code>malloc</code> of a gigabyte costs nothing until the pages are written.</p>
<h3>Copy-on-write fork</h3>
${fig('cow', '<b>Figure 12.2</b> Copy-on-write: fork shares pages read-only, and copies a page only when one side writes to it.')}
<p>Copy-on-write makes fork cheap: only page tables are copied. Implementing it in xv6 is one of the MIT labs: mark PTEs with a spare RSW bit, keep a reference count per physical page in kalloc, handle the store fault in usertrap, and also handle copyout, where the kernel writes into a COW page on the user's behalf.</p>
<h3>Memory-mapped files</h3>
<p><code>mmap</code> maps a file's contents into the address space: loads fault pages in from the file through the page cache; with <code>MAP_SHARED</code>, stores are eventually written back. Programs and shared libraries are loaded this way, so their code is demand-paged and shared between all processes using them. xv6's mmap lab adds a simple version.</p>
<h3>Other tricks</h3>
<p>Guard pages that catch stack overflow; zero-filled BSS; shared memory between processes; user-level fault handling (<code>userfaultfd</code>) used for live migration of virtual machines; and garbage collectors that use page protection to track writes.</p>

<h2>Swapping</h2>
<p>When physical memory is full, the kernel can move rarely used pages to a swap area on disk and free their frames. The PTE is marked not present and records where the page is in swap; touching it later causes a major fault that reads it back. Clean pages backed by a file (program code, cached file data) need not be written at all: they can simply be dropped and re-read from the file. Linux also offers <strong>zswap</strong> and <strong>zram</strong>, which compress pages in memory before (or instead of) writing them to disk.</p>

<h2>Replacement policies</h2>
<p>Which page should be evicted? The goal is to minimise future misses, given that a miss to disk costs millions of times more than a hit.</p>
${fig('repl', '<b>Figure 12.3</b> A page replacement simulator. Change the reference string and number of frames; compare FIFO, LRU, Clock and the optimal policy. Try Belady\'s example with 3 and then 4 frames.')}
<ul>
<li><strong>OPT</strong> (Belady's optimal): evict the page used furthest in the future. Impossible in practice but the yardstick for the others.</li>
<li><strong>FIFO:</strong> evict the oldest page. Simple, but ignores use, and can suffer <strong>Belady's anomaly</strong>: more frames, more faults (try the example with 3 and 4 frames).</li>
<li><strong>LRU:</strong> evict the least recently used page. Exploits temporal locality and never shows Belady's anomaly (it is a "stack algorithm"). Exact LRU needs a timestamp update on every memory access, which hardware does not provide.</li>
<li><strong>Clock</strong> (second chance): approximates LRU using the accessed bit (A) the hardware sets in each PTE. A hand sweeps frames; a page with A = 1 gets its bit cleared and a second chance; a page with A = 0 is evicted. Variants prefer clean pages, which need no write-back.</li>
</ul>
<h3>Thrashing and working sets</h3>
<p>If the pages processes actively use (their <em>working sets</em>) exceed physical memory, every process faults constantly and the system spends its time on I/O: <strong>thrashing</strong>. Remedies are to run fewer processes, add memory, or kill something. Linux's out-of-memory killer chooses a victim by memory use and an adjustable score (<code>oom_score_adj</code>); the pressure stall information files (<code>/proc/pressure/memory</code>) measure how much time tasks lose waiting for memory.</p>

<h2>What Linux does</h2>
<p>Linux keeps pages on LRU lists; since Linux 6.1 the <strong>multi-generational LRU</strong> (MGLRU) sorts pages into several age generations using accessed bits gathered by scanning page tables, which improves decisions under pressure (it was developed for Android and ChromeOS and is enabled by default in many distributions). The <code>kswapd</code> threads reclaim in the background when free memory falls below watermarks; allocations that cannot wait trigger direct reclaim. File pages and anonymous pages are balanced by the <code>swappiness</code> setting.</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"Page faults mean bugs."</strong> Most are normal and resolved transparently.</li>
<li><strong>"Swap is obsolete."</strong> A little swap lets the kernel move truly idle pages out and keep more useful cache; zram is common on phones and laptops.</li>
<li><strong>"More memory frames always means fewer faults."</strong> Not for FIFO (Belady's anomaly).</li>
<li><strong>"Free memory is good memory."</strong> Linux uses spare memory as page cache; "available" in <code>free -h</code> is the meaningful number.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Belady</summary><p>Using the simulator, record FIFO faults for 1 2 3 4 1 2 5 1 2 3 4 5 with 3 and 4 frames.</p><p><em>Answer:</em> 9 faults with 3 frames, 10 with 4.</p></details>
<details><summary>Minor or major?</summary><p>Classify: first touch of malloc'ed memory; executing code of a program just run for the first time since boot; running it again; reading a swapped-out page.</p><p><em>Answer:</em> minor; major (read from disk); usually minor (in the page cache); major.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Copy-on-write lab</summary><p>Implement copy-on-write fork in xv6 following the description above, and pass the lab's cowtest and usertests.</p></details>
<details><summary>Compare policies</summary><p>Generate a reference string with locality (80% of references to 20% of pages) and find how many frames each policy needs for a 90% hit rate.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>

</ul>
`});

CH.push({
  id: 'ch13', n: 13, title: 'Threads and Races',
  lede: 'A thread is an independent flow of execution inside a process. Threads let one program use many cores and keep working while some parts wait for I/O, but because they share memory, they can interfere with each other in ways that depend on precise timing. This chapter introduces threads, shows how a single line of code like counter++ goes wrong when two threads run it at once, and defines the vocabulary of concurrency: critical sections, race conditions, atomicity and mutual exclusion.',
  html: `
<h2>Threads</h2>
${fig('tspace', '<b>Figure 13.1</b> Threads share a process\'s code, globals and heap; each has its own stack and registers.')}
<p>Each thread has its own program counter, registers and stack, and is scheduled independently, possibly on different cores at the same moment. Everything else is shared. Creating a thread is cheaper than a process, switching between threads of one process avoids address-space changes, and sharing data needs no copying or pipes. The danger is the same as the benefit: any thread can modify anything.</p>
${code('POSIX threads', 'c')`
#include <pthread.h>
#include <stdio.h>

static volatile long counter = 0;          // volatile does NOT make this safe

void *worker(void *arg) {
    for (int i = 0; i < 1000000; i++)
        counter = counter + 1;
    return NULL;
}

int main(void) {
    pthread_t a, b;
    pthread_create(&a, NULL, worker, NULL);
    pthread_create(&b, NULL, worker, NULL);
    pthread_join(a, NULL);
    pthread_join(b, NULL);
    printf("counter = %ld (expected 2000000)\n", counter);   // typically less
}`}
<p>On Linux, threads are tasks created with <code>clone</code> sharing the address space, file table and signal handlers; to the scheduler, a thread and a process are both tasks. Java threads have historically mapped one-to-one onto kernel threads; Java 21's virtual threads are scheduled by the JVM onto a small pool of kernel threads, so millions can exist (Chapter 17). xv6 has kernel threads (each process's kernel side and each CPU's scheduler) but no user-level threads.</p>

<h2>The race</h2>
${fig('race', '<b>Figure 13.2</b> Step two threads through counter++ instruction by instruction. Some interleavings lose an update.')}
<p>The result depends on the interleaving, which depends on timing: interrupts, scheduling decisions, cache misses, other cores. The program usually works, fails occasionally, and the failure disappears when you add a print statement to investigate. Such timing-dependent behaviour is a <strong>race condition</strong>; when it involves unsynchronised accesses to the same memory with at least one write, it is a <strong>data race</strong>.</p>

<h2>Vocabulary</h2>
<ul>
<li><strong>Critical section:</strong> code that accesses shared state and must not be executed by more than one thread at a time.</li>
<li><strong>Mutual exclusion:</strong> the guarantee that only one thread is in a given critical section.</li>
<li><strong>Atomicity:</strong> a group of actions that appear to happen all at once or not at all, with no observable intermediate state.</li>
<li><strong>Indeterminate:</strong> a program whose output varies between runs with the same input because of scheduling.</li>
</ul>
<p>Two tools make concurrent programs correct: <strong>locks</strong> provide mutual exclusion (Chapter 14), and <strong>condition variables</strong> or semaphores let threads wait for one another (Chapter 15). Underneath both are atomic hardware instructions.</p>

<h2>Why this is harder than it looks</h2>
<p>Even without the three-instruction problem, modern hardware and compilers reorder memory operations. A compiler may keep a variable in a register and never reread it; a CPU may make writes visible to other cores in a different order than the program issued them. RISC-V and ARM use weak memory models that allow considerable reordering; x86 is stronger but still allows a store followed by a load to be reordered. Correct synchronisation primitives include the <strong>fences</strong> needed to prevent harmful reordering; ad hoc flag variables usually do not. C11 and C++11 atomics, Java's <code>volatile</code> and <code>java.util.concurrent</code>, and the Linux kernel's memory model define precisely which orderings are guaranteed.</p>

<h2>Concurrency in the kernel</h2>
<p>Kernels are among the most concurrent programs there are. In xv6, several CPUs run kernel code at once, interrupts can arrive in the middle of kernel code, and a process can sleep in the middle of a system call. Every shared kernel structure, the process table, the free page list, the buffer cache, the file table, needs a locking discipline, which the next chapters examine.</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"counter++ is one instruction, so it is atomic."</strong> It is a load, an add and a store.</li>
<li><strong>"volatile makes it thread-safe."</strong> In C it only prevents some compiler optimisations; it provides neither atomicity nor ordering between cores.</li>
<li><strong>"It passed the tests."</strong> Races may appear once in a million runs, or only on a different CPU.</li>
<li><strong>"One core means no races."</strong> Interrupts and preemption interleave threads even on one core.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Count interleavings</summary><p>How many distinct interleavings of the two three-instruction sequences in Figure 13.2 exist? How many give the correct answer?</p><p><em>Answer:</em> C(6,3) = 20; only the 2 where one thread completes all three instructions before the other starts give 52.</p></details>
<details><summary>Run it</summary><p>Compile the pthreads example with and without <code>-O2</code>. Run it ten times each. What values do you see?</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Minimum value</summary><p>If two threads each increment a shared counter 10 times without synchronisation, what is the smallest possible final value?</p><p><em>Answer sketch:</em> 2, via an interleaving in which one thread's stale write repeatedly overwrites the other's progress.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Message passing</summary><p>Rewrite the counter program so threads never share memory: each counts locally and sends its total over a pipe. Compare performance and discuss when sharing is worth the risk.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain what threads share and what they keep private.</li>
<li>I can show why counter++ races and find a bad interleaving.</li>
<li>I can define critical section, race condition, data race, mutual exclusion and atomicity.</li>
<li>I know that compilers and CPUs reorder memory operations and why fences matter.</li>
</ul>
`});

CH.push({
  id: 'ch14', n: 14, title: 'Locks',
  lede: 'A lock makes a critical section atomic with respect to other threads: whoever holds it runs alone. Building one requires help from the hardware, an instruction that reads and writes memory indivisibly, and building a good one requires attention to fairness, performance under contention, and interrupts. This chapter builds locks from first principles: why a flag fails, how test-and-set and compare-and-swap work, ticket locks, spinning versus sleeping, and the real code of xv6\'s spinlocks and Linux\'s futexes.',
  html: `
<h2>What a lock must provide</h2>
<ul>
<li><strong>Mutual exclusion:</strong> at most one holder.</li>
<li><strong>Progress and fairness:</strong> a waiting thread eventually gets the lock; ideally in order.</li>
<li><strong>Performance:</strong> cheap when uncontended, reasonable when contended, on one CPU and many.</li>
<li><strong>Memory ordering:</strong> everything written inside the critical section is visible to the next holder.</li>
</ul>
<p>On a uniprocessor, disabling interrupts during the critical section would work, since nothing else can run. But it is privileged, it fails with several CPUs, and it delays device handling, so it is used only inside kernels, briefly.</p>

<h2>Why a flag is not enough</h2>
${fig('naive', '<b>Figure 14.1</b> A lock built from an ordinary flag fails because checking and setting it are separate steps.')}
<p>Software-only algorithms such as Peterson's do solve mutual exclusion for two threads with ordinary loads and stores, but only on hardware that does not reorder memory operations; on modern CPUs they need fences, and they do not scale. Instead, processors provide atomic instructions.</p>

<h2>Atomic instructions</h2>
<div class="tbl"><table><tr><th>Primitive</th><th>Effect, atomically</th><th>RISC-V</th></tr>
<tr><td>Test-and-set / exchange</td><td>Write a new value, return the old one</td><td><code>amoswap.w</code></td></tr>
<tr><td>Fetch-and-add</td><td>Add, return the old value</td><td><code>amoadd.w</code></td></tr>
<tr><td>Compare-and-swap</td><td>If memory equals expected, write new; report success</td><td>built from <code>lr.w</code>/<code>sc.w</code> (Zacas adds <code>amocas</code>)</td></tr>
<tr><td>Load-reserved / store-conditional</td><td>The store succeeds only if nobody wrote the location since the load</td><td><code>lr.w</code>, <code>sc.w</code></td></tr>
</table></div>
<p>A spinlock from exchange: <code>while (xchg(&amp;lock, 1) == 1) ;</code> to acquire, and store 0 to release. It is correct but unfair: when the lock is released, whichever spinner's exchange reaches memory first wins, possibly the same one every time.</p>
${fig('ticket', '<b>Figure 14.2</b> A ticket lock uses fetch-and-add to serve threads in arrival order.')}

<h2>xv6's spinlock</h2>
${code('kernel/spinlock.c: acquire and release (abridged)', 'c')`
void
acquire(struct spinlock *lk)
{
  push_off(); // disable interrupts to avoid deadlock.
  if(holding(lk))
    panic("acquire");

  // Loops (spins) until the lock is acquired.
  // On RISC-V this compiles to an atomic swap: amoswap.w.aq
  while(__atomic_exchange_n(&lk->locked, 1, __ATOMIC_ACQUIRE) != 0)
    ;

  // Record info about lock acquisition for holding() and debugging.
  lk->cpu = mycpu();
}

void
release(struct spinlock *lk)
{
  if(!holding(lk))
    panic("release");

  lk->cpu = 0;

  // Release ordering: the critical section's stores become visible
  // before the lock is seen as free (fence rw,w; then the store).
  __atomic_store_n(&lk->locked, 0, __ATOMIC_RELEASE);

  pop_off();
}`}
<p>Three details matter:</p>
<ol>
<li><strong>Interrupts are disabled while any spinlock is held</strong> (<code>push_off</code> counts nesting and <code>pop_off</code> restores the previous state). Otherwise: a CPU holds the console lock, a UART interrupt arrives, and the interrupt handler tries to take the same lock on the same CPU. It spins forever, because the holder cannot run until the handler returns.</li>
<li><strong>Acquire and release ordering:</strong> the <code>__ATOMIC_ACQUIRE</code> and <code>__ATOMIC_RELEASE</code> annotations stop the compiler and the CPU from moving critical-section loads and stores outside the lock. Without them, a weakly ordered RISC-V core could make a store visible after the unlock.</li>
<li><strong>Recursive acquisition is a bug:</strong> <code>holding()</code> catches a CPU taking a lock it already holds, which would deadlock.</li>
</ol>

<h2>Spin or sleep?</h2>
<p>Spinning wastes a CPU while waiting, which is fine if the holder will release within microseconds on another CPU, and terrible if the holder has been preempted or is waiting for disk. Locks held for long periods should put waiters to sleep. xv6 has <strong>sleeplocks</strong> for this (used for inodes and buffers, held across disk I/O): a spinlock protects the sleeplock's state, and waiters call <code>sleep()</code> (Chapter 15).</p>
<p>Linux user-space locks use <strong>futexes</strong> (fast user-space mutexes): the uncontended case is a single atomic instruction in user space with no system call; only a contended thread calls <code>futex(FUTEX_WAIT)</code> to sleep in the kernel, and the releaser calls <code>futex(FUTEX_WAKE)</code> if there were waiters. Most mutexes are <em>two-phase</em>: spin briefly, then sleep. glibc's <code>pthread_mutex</code> and the JVM's monitors are built this way.</p>

<h2>Locks and scalability</h2>
${fig('scale', '<b>Figure 14.3</b> A single global lock limits scaling: as cores are added, they spend their time waiting and moving the lock\'s cache line between them.')}
<p>Under contention, every exchange on the lock word pulls its cache line exclusively to one core, so cores fight over a single line of memory. Remedies, roughly in order of preference: hold locks for less time; split one lock into many (per-CPU or per-bucket data, as in the xv6 locking lab for kalloc and the buffer cache); use reader-writer locks when reads dominate; use queue locks where each waiter spins on its own cache line (MCS; Linux's <code>qspinlock</code> is based on this idea); and, for read-mostly data, avoid locks for readers altogether with RCU (Chapter 16).</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Spinlocks held across sleeping operations</strong> (I/O, page faults, sleep()).</li>
<li><strong>Taking a spinlock in an interrupt handler</strong> that is also taken with interrupts enabled elsewhere.</li>
<li><strong>Forgetting memory ordering</strong> in home-made synchronisation.</li>
<li><strong>One big lock</strong> around everything, which is simple and correct but does not scale.</li>
<li><strong>Locking too finely,</strong> so operations need many locks and deadlock risk grows.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Interrupt deadlock</summary><p>Explain step by step why xv6 would deadlock if acquire did not disable interrupts and the console lock is used by both printk and the UART interrupt handler.</p></details>
<details><summary>Ticket fairness</summary><p>With a test-and-set lock and three spinners, can one thread wait forever? With a ticket lock?</p><p><em>Answer:</em> yes, in principle; no, each ticket is served in turn.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Lock lab</summary><p>In xv6, make kalloc use per-CPU free lists with stealing, and make the buffer cache use a hash table of buckets with a lock each. Measure contention with the lab's statistics.</p></details>
<details><summary>Compare-and-swap</summary><p>Implement a lock-free stack push with compare-and-swap in C11 atomics. Then explain the ABA problem for pop.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Futex mutex</summary><p>Implement a mutex with a three-state integer (0 unlocked, 1 locked, 2 locked with waiters) using C11 atomics and the Linux futex system call, so uncontended lock and unlock make no system calls.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can state what a lock must guarantee and why a plain flag fails.</li>
<li>I know exchange, fetch-and-add, compare-and-swap and LR/SC.</li>

CH.push({
  id: 'ch15', n: 15, title: 'Condition Variables, Semaphores, Sleep and Wakeup',
  lede: 'Locks stop threads from interfering, but threads also need to wait for each other: a consumer for data, a parent for its child, a process for its disk read. Spinning on a flag wastes CPU and is fragile. This chapter introduces the tools for waiting properly: condition variables with their essential rules, semaphores, and the sleep and wakeup primitives inside xv6, including the lost-wakeup problem that every implementation must solve.',
  html: `
<h2>Condition variables</h2>
<p>A condition variable is a queue of threads waiting for some condition on shared state. It is always used with a mutex that protects that state:</p>
<ul>
<li><code>wait(cv, mutex)</code>: atomically release the mutex and sleep; reacquire the mutex before returning.</li>
<li><code>signal(cv)</code>: wake one waiter, if any.</li>
<li><code>broadcast(cv)</code>: wake all waiters.</li>
</ul>
${code('A bounded buffer with pthreads', 'c')`
#define N 4
int buf[N], count = 0, in = 0, out = 0;
pthread_mutex_t m = PTHREAD_MUTEX_INITIALIZER;
pthread_cond_t notFull = PTHREAD_COND_INITIALIZER, notEmpty = PTHREAD_COND_INITIALIZER;

void put(int v) {
    pthread_mutex_lock(&m);
    while (count == N)                     // WHILE, not if
        pthread_cond_wait(&notFull, &m);
    buf[in] = v; in = (in + 1) % N; count++;
    pthread_cond_signal(&notEmpty);
    pthread_mutex_unlock(&m);
}

int get(void) {
    pthread_mutex_lock(&m);
    while (count == 0)
        pthread_cond_wait(&notEmpty, &m);
    int v = buf[out]; out = (out + 1) % N; count--;
    pthread_cond_signal(&notFull);
    pthread_mutex_unlock(&m);
    return v;
}`}
${fig('bbuf', '<b>Figure 15.1</b> Drive a bounded buffer by hand: fill it until a producer must sleep, empty it until a consumer must sleep, and watch signals wake them.')}
<h3>The rules</h3>
<ol>
<li><strong>Always hold the mutex</strong> when checking or changing the condition, and when calling wait.</li>
<li><strong>Always wait in a while loop.</strong> Almost all systems use "Mesa semantics": signal only hints that the condition may now be true. By the time the woken thread runs, another thread may have taken the item; implementations may also wake threads spuriously.</li>
<li><strong>Use separate condition variables</strong> for different conditions (not full, not empty); with one shared CV, a consumer might wake another consumer instead of a producer and everyone sleeps. If in doubt, broadcast.</li>
</ol>
<p>Java's built-in monitors follow the same rules: <code>synchronized</code> provides the mutex, and <code>wait()</code>, <code>notify()</code> and <code>notifyAll()</code> are the condition operations on a single implicit condition (so <code>notifyAll</code> is usually right); <code>java.util.concurrent.locks.Condition</code> gives multiple conditions per lock, and <code>BlockingQueue</code> packages the bounded buffer.</p>

<h2>Semaphores</h2>
<p>A semaphore is an integer with two atomic operations: <code>P</code> (wait, <code>sem_wait</code>) decrements it and blocks while it would go negative; <code>V</code> (signal, <code>sem_post</code>) increments it and wakes a waiter. Initialised to 1, a semaphore is a lock; initialised to 0, it orders events ("wait until the child has started"); initialised to N, it counts resources, such as free slots in a buffer. Semaphores remember signals (a V with no waiter is not lost), which makes some problems easier and others harder to reason about. Condition variables with a mutex are usually clearer, and semaphores can be built from them.</p>

<h2>Sleep and wakeup in xv6</h2>
<p>Inside the kernel, xv6 provides the primitive from which everything else is built: <code>sleep(chan, lk)</code> and <code>wakeup(chan)</code>. A channel is any address used as a name, such as the address of a pipe or a buffer. Pipes, wait, disk I/O, the console and sleeplocks all use them.</p>
${fig('lostwake', '<b>Figure 15.2</b> The lost wakeup problem, and how passing the condition\'s lock into sleep solves it.')}
${code('kernel/proc.c: sleep and wakeup (abridged)', 'c')`
void
sleep(void *chan, struct spinlock *lk)
{
  struct proc *p = myproc();

  // Must acquire p->lock in order to change p->state and then call sched.
  // Once we hold p->lock, we can be guaranteed that we won't miss any
  // wakeup (wakeup locks p->lock), so it's okay to release lk.
  acquire(&p->lock);
  release(lk);

  p->chan = chan;
  p->state = SLEEPING;

  sched();

  p->chan = 0;

  release(&p->lock);
  acquire(lk);
}

void
wakeup(void *chan)
{
  struct proc *p;

  for(p = proc; p < &proc[NPROC]; p++) {
    if(p != myproc()){
      acquire(&p->lock);
      if(p->state == SLEEPING && p->chan == chan)
        p->state = RUNNABLE;
      release(&p->lock);
    }
  }
}`}
<p>Callers always sleep in a loop that rechecks the condition, exactly like condition variables: <code>while(pi-&gt;nread == pi-&gt;nwrite) sleep(&amp;pi-&gt;nread, &amp;pi-&gt;lock);</code>. Wakeup scans the whole process table, simple but O(NPROC); Linux uses wait queues attached to each object so it wakes only the relevant waiters.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong><code>if</code> instead of <code>while</code></strong> around wait.</li>
<li><strong>Signalling without holding the mutex</strong> while the condition is changed, creating lost-wakeup windows.</li>
<li><strong>One condition variable for two conditions</strong> with signal instead of broadcast.</li>
<li><strong>Using sleep() for timing</strong> instead of waiting on the actual condition.</li>
<li><strong>Calling a blocking operation while holding a spinlock</strong> (other than the one passed to sleep).</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Why while?</summary><p>Describe an interleaving with two consumers and one producer in which a consumer using <code>if</code> wakes up and reads from an empty buffer.</p><p><em>Answer sketch:</em> C1 waits; P puts and signals; before C1 runs, C2 arrives, sees an item and takes it; C1 returns from wait and takes from the empty buffer.</p></details>
<details><summary>Semaphore uses</summary><p>What initial values do you give the semaphores for a bounded buffer of N slots: <code>empty</code>, <code>full</code> and <code>mutex</code>?</p><p><em>Answer:</em> N, 0 and 1.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Barrier</summary><p>Implement a reusable barrier for N threads with a mutex and condition variable, as in the MIT barrier exercise. Why do you need a round counter?</p><p><em>Answer sketch:</em> so a fast thread leaving one round and re-entering the barrier is not confused with threads still waiting in the previous round.</p></details>
<details><summary>xv6 pipe</summary><p>Read <code>kernel/pipe.c</code> and list each sleep and wakeup, its channel, and the condition it waits for.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Semaphore from CVs</summary><p>Implement a counting semaphore using one mutex and one condition variable. Then implement a condition variable using only semaphores and explain why it is harder.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can use condition variables with a mutex and follow the three rules.</li>
<li>I can build a bounded buffer with condition variables or semaphores.</li>
<li>I know how semaphores work and their three typical uses.</li>
<li>I can explain the lost-wakeup problem and how xv6's sleep avoids it.</li>
<li>I know Java's monitor equivalents.</li>
</ul>
`});

CH.push({
  id: 'ch16', n: 16, title: 'Concurrency Bugs, Deadlock and Lock-Free Techniques',
  lede: 'Concurrent programs fail in characteristic ways. Studies of real bugs in large open-source systems found that most are not deadlocks but simple violations of assumed atomicity or order; deadlocks are the next most common, and the rest are subtler. This chapter catalogues the patterns, explains deadlock and the four conditions it needs, shows how kernels avoid it with lock ordering, and introduces the techniques that avoid locks for readers altogether, especially read-copy-update.',
  html: `
<h2>Non-deadlock bugs</h2>
<p>An influential 2008 study of concurrency bugs in MySQL, Apache, Mozilla and OpenOffice found that about two thirds of non-deadlock bugs were of two kinds:</p>
<ul>
<li><strong>Atomicity violations:</strong> code assumes two accesses happen together, but another thread intervenes. <code>if (p-&gt;buf) fputs(p-&gt;buf, f);</code> fails if another thread sets <code>p-&gt;buf = NULL</code> between the check and the use. Fix: protect both with the same lock.</li>
<li><strong>Order violations:</strong> code assumes A happens before B, but nothing enforces it. A thread uses a pointer that the creating thread has not yet initialised. Fix: a condition variable, semaphore, or join.</li>
</ul>
<p>Both are invisible in the code of any single thread. Tools help: ThreadSanitizer (<code>-fsanitize=thread</code>) detects data races at run time; Linux's KCSAN does the same inside the kernel; model checkers and stress testing with random delays expose rare interleavings.</p>

<h2>Deadlock</h2>
<p>Deadlock occurs when each thread in a set waits for a resource held by another thread in the set. Four conditions are all necessary:</p>
<ol>
<li><strong>Mutual exclusion:</strong> resources are held exclusively.</li>
<li><strong>Hold and wait:</strong> threads hold resources while waiting for others.</li>
<li><strong>No preemption:</strong> resources cannot be taken away.</li>
<li><strong>Circular wait:</strong> there is a cycle of threads each waiting for the next.</li>
</ol>
${fig('phil', '<b>Figure 16.1</b> The dining philosophers: five threads, five locks. A consistent rule about which lock to take first breaks the cycle.')}
<p>Break any one condition and deadlock is impossible:</p>
<div class="tbl"><table><tr><th>Break</th><th>Technique</th><th>Cost</th></tr>
<tr><td>Circular wait</td><td><strong>Lock ordering:</strong> a global order (by address, level or documented hierarchy); always acquire in that order</td><td>Discipline; the usual choice in kernels</td></tr>
<tr><td>Hold and wait</td><td>Acquire all locks at once, under a "meta" lock</td><td>Less concurrency; must know locks in advance</td></tr>
<tr><td>No preemption</td><td><code>trylock</code>: if the second lock is busy, release the first and retry</td><td>Livelock risk; needs back-off</td></tr>
<tr><td>Mutual exclusion</td><td>Lock-free data structures with atomic instructions</td><td>Hard to get right</td></tr>
</table></div>
<p>Alternatively, <strong>detect and recover</strong>: build the waits-for graph and look for cycles, as databases do (PostgreSQL, for example, aborts a victim transaction). Avoidance algorithms such as the banker's algorithm need advance knowledge of maximum demands and are rarely used in general-purpose systems.</p>
<h3>Lock ordering in practice</h3>
<p>xv6 documents its order informally: for example, when a process exits, <code>wait_lock</code> is acquired before any <code>p-&gt;lock</code>, and the file system takes the log, then inode sleeplocks, then buffer locks in a consistent order. Linux formalises this with <strong>lockdep</strong>, which records the order in which every class of lock has ever been acquired and reports any acquisition that could form a cycle, even if the deadlock never actually happened during the test run.</p>

<h2>Avoiding locks for readers</h2>
<p>For data that is read far more often than written (routing tables, configuration, the list of loaded modules), even a reader-writer lock is costly: every reader writes the lock's cache line. Linux's answer is <strong>read-copy-update</strong> (RCU), now used thousands of times in the kernel:</p>
${fig('rcu', '<b>Figure 16.2</b> Read-copy-update: readers proceed without locks; updaters publish new versions and defer freeing old ones until all pre-existing readers have finished.')}
<p>Related ideas: sequence locks (readers retry if a writer was active during their read), per-CPU counters that are summed only when read, and lock-free queues built from compare-and-swap. User-space versions exist (liburcu), and the same ideas appear in Java's <code>ConcurrentHashMap</code> and copy-on-write collections.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Undocumented lock order,</strong> so a new code path acquires in reverse.</li>
<li><strong>Calling unknown code (callbacks) while holding a lock,</strong> which may take other locks.</li>
<li><strong>Check-then-act outside the lock</strong> (atomicity violation).</li>
<li><strong>Assuming initialisation happens first</strong> (order violation).</li>
<li><strong>Home-made lock-free structures</strong> without careful memory ordering and memory reclamation.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Which condition?</summary><p>For each fix, name the deadlock condition it removes: (a) always lock accounts in increasing ID order; (b) trylock and back off; (c) take one big lock for the whole transfer.</p><p><em>Answer:</em> circular wait; no preemption (in effect, voluntarily releasing); hold and wait (only one lock is ever held).</p></details>
<details><summary>Classify</summary><p>A thread reads a shared pointer, checks it is non-null, then calls through it, while another thread may set it to null. Which bug type?</p><p><em>Answer:</em> atomicity violation.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Philosophers</summary><p>Implement the dining philosophers with pthreads, reproduce the deadlock, then fix it two ways: lock ordering and a semaphore admitting at most four philosophers.</p></details>
<details><summary>ThreadSanitizer</summary><p>Run the counter program from Chapter 13 under ThreadSanitizer and read its report. Then fix the race with a mutex and with an atomic increment.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Lock order in xv6</summary><p>Find two places in xv6 where more than one lock is held at once and write down the order. Construct a hypothetical change that would introduce a deadlock.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can recognise atomicity and order violations and their fixes.</li>
<li>I can state the four deadlock conditions and break each one.</li>
<li>I understand lock ordering and tools like lockdep and ThreadSanitizer.</li>
<li>I can explain how RCU lets readers run without locks and why updaters wait for a grace period.</li>
</ul>
`});

CH.push({
  id: 'ch17', n: 17, title: 'Event-Driven Concurrency and Asynchronous I/O',
  lede: 'Threads are one way to do many things at once; another is to never block, and instead react to events as they happen. High-performance servers handle tens of thousands of connections in a few threads this way. This chapter compares thread-per-request, event-driven and virtual-thread designs, explains the kernel interfaces that make non-blocking servers possible, from select and epoll to io_uring, and discusses the trade-offs that still make this a design decision rather than a solved problem.',
  html: `
<h2>Three models</h2>
${fig('models', '<b>Figure 17.1</b> Three ways to serve many connections concurrently.')}

<h2>Readiness: select, poll, epoll</h2>
<p>An event loop needs to ask the kernel: which of my many file descriptors can I read or write now without blocking? <code>select</code> and <code>poll</code> pass the whole set on every call, so their cost grows with the number of descriptors. Linux's <code>epoll</code> keeps the interest set inside the kernel and returns only ready descriptors, so cost depends on activity, not on how many connections are open.</p>
${code('The skeleton of an epoll server', 'c')`
int ep = epoll_create1(0);
struct epoll_event ev = { .events = EPOLLIN, .data.fd = listen_fd };
epoll_ctl(ep, EPOLL_CTL_ADD, listen_fd, &ev);

for (;;) {
    struct epoll_event ready[64];
    int n = epoll_wait(ep, ready, 64, -1);          // block until something is ready
    for (int i = 0; i < n; i++) {
        int fd = ready[i].data.fd;
        if (fd == listen_fd) {
            int c = accept4(listen_fd, NULL, NULL, SOCK_NONBLOCK);
            struct epoll_event ce = { .events = EPOLLIN, .data.fd = c };
            epoll_ctl(ep, EPOLL_CTL_ADD, c, &ce);
        } else {
            handle_readable(fd);    // must not block: read what is available, keep state per fd
        }
    }
}`}
<p>Event-driven code has its own difficulties: state that would live on a thread's stack must be kept explicitly per connection; any blocking call (a page fault on a memory-mapped file, a DNS lookup, a slow disk read) stalls the whole loop; and using several cores requires one loop per core. Disk files are always "ready" to epoll, so asynchronous file I/O needed a different interface.</p>

<h2>Completion: io_uring</h2>
${fig('uring', '<b>Figure 17.2</b> io_uring: requests and results pass through shared ring buffers, so many operations cost one system call or none.')}
<p>io_uring, added in Linux 5.1 (2019) and extended in almost every release since, moves from readiness ("you may now read") to completion ("your read is done"). It supports file and network I/O, accepting connections, timeouts, and chains of dependent operations, all batched. It powers fast storage engines and has been adopted by databases (PostgreSQL 18 can use it for asynchronous reads), language runtimes and proxies. Its large attack surface led some environments (Android, some container platforms) to restrict it by default, a reminder that new kernel interfaces are also new attack surface.</p>

<h2>Virtual threads and async runtimes</h2>
<p>Asynchronous programming in languages comes in two styles. <em>Async/await</em> (Rust, C#, JavaScript, Python) turns functions into state machines that suspend at <code>await</code> points, run by an event loop. <em>Green threads</em> (Go, Erlang, Java virtual threads since JDK 21) keep ordinary blocking code and let the runtime switch stacks when a call would block. In Java, a virtual thread blocked in socket I/O is unmounted from its carrier kernel thread; since JDK 24 even blocking inside <code>synchronized</code> no longer pins the carrier. For the operating system, the result is the same: a few kernel threads, non-blocking I/O, and readiness or completion notifications.</p>

<h2>Choosing</h2>
<div class="tbl"><table><tr><th>Situation</th><th>Good fit</th></tr>
<tr><td>Moderate concurrency, CPU-heavy requests</td><td>A bounded thread pool</td></tr>
<tr><td>Very many mostly-idle connections</td><td>Event loop, or virtual threads / goroutines</td></tr>
<tr><td>Maximum storage throughput, many small I/Os</td><td>io_uring with batching</td></tr>
<tr><td>Simple code, existing blocking libraries, high concurrency (JVM)</td><td>Virtual threads</td></tr>
</table></div>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Blocking inside an event loop</strong> (synchronous logging, DNS, JDBC on a Netty thread).</li>
<li><strong>Unbounded thread creation</strong> under load.</li>
<li><strong>Assuming epoll makes file reads asynchronous;</strong> it does not.</li>
<li><strong>Pooling virtual threads,</strong> which defeats their purpose; create one per task and limit concurrency with semaphores instead.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Count system calls</summary><p>How many system calls does an epoll server make to serve one request on an existing connection? How many could io_uring with SQ polling make?</p><p><em>Answer sketch:</em> roughly epoll_wait, read, write (three, amortised over batches); with SQ polling, potentially none per request.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Benchmark three servers</summary><p>Write an echo server three ways (thread per connection, epoll, Java virtual threads) and measure throughput and memory at 100, 10,000 and 50,000 connections.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>liburing</summary><p>Use liburing to read 10,000 random 4 KB blocks from a large file on NVMe with queue depths 1, 8, 32 and 128. Plot IOPS against queue depth and explain the curve.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can compare thread-per-connection, event-loop and virtual-thread designs.</li>
<li>I can explain readiness notification and why epoll scales better than select.</li>
<li>I understand io_uring's submission and completion rings.</li>
<li>I know how virtual threads and async/await relate to the kernel's interfaces.</li>
</ul>
`});

CH.push({
  id: 'ch18', n: 18, title: 'Devices and Drivers',
  lede: 'Persistence starts with devices. Disks, network cards, keyboards and displays each have their own interface, timing and quirks, and device drivers, the code that hides them behind uniform abstractions, make up the majority of kernel source code. This chapter explains how the operating system talks to devices: registers, polling and interrupts, direct memory access, and the layering of drivers. It then reads xv6\'s two drivers: the UART that runs the console and the virtio disk.',
  html: `
<h2>A canonical device</h2>
${fig('canon', '<b>Figure 18.1</b> Every device presents a small interface of registers; how it works inside is hidden.')}
<p>A simple protocol: wait until the status register says the device is not busy; write data to the data register; write a command; wait until it finishes. The OS reaches registers either with special I/O instructions (x86 <code>in</code>/<code>out</code>) or, much more commonly today and always on RISC-V, through <strong>memory-mapped I/O</strong>: device registers appear at physical addresses (Chapter 2), mapped uncached.</p>

<h2>Polling and interrupts</h2>
${fig('pollint', '<b>Figure 18.2</b> Waiting for a device by polling versus by interrupt.')}
<p>An interrupt handler should do the minimum (acknowledge the device, move data, wake waiters) and defer the rest. Linux splits handlers into a fast "top half" and deferred work (softirqs, tasklets, threaded interrupts, workqueues). Devices raise interrupts through an interrupt controller: on RISC-V the PLIC, where the kernel <em>claims</em> an interrupt to learn which device raised it and <em>completes</em> it when done.</p>

<h2>Direct memory access</h2>
<p>Copying data byte by byte through a data register (programmed I/O) wastes CPU time for large transfers. With <strong>DMA</strong>, the driver tells the device where in memory to read or write and how much, and the device transfers the data itself, interrupting when finished. The kernel must use physical (or I/O-virtual) addresses for DMA buffers, keep them from being reused while the transfer runs, and on some architectures manage cache coherence. An <strong>IOMMU</strong> translates device addresses through page tables, like an MMU for devices, so a buggy or malicious device cannot write anywhere in memory; it is also what makes passing devices through to virtual machines safe.</p>

<h2>Driver layering</h2>
<p>Above drivers, the kernel defines generic interfaces so the rest of the system need not care about specific hardware: a <strong>block layer</strong> for storage (requests to read and write numbered blocks), a network stack with a common driver interface, a TTY layer for terminals, a graphics stack. Linux's multi-queue block layer (blk-mq) gives each CPU its own submission queue mapped onto the device's hardware queues, matching the design of NVMe devices, which support up to 65,535 queues of up to 65,536 commands each.</p>

<h2>xv6's console: the UART</h2>
<p>xv6's console runs over an emulated 16550 UART at <code>0x10000000</code>. Output: <code>uartputc</code> places characters in a small transmit buffer and <code>uartstart</code> writes the next character to the transmit register whenever the UART reports it is ready; the UART interrupts when it can accept more. Input: each received character raises an interrupt; <code>uartintr</code> reads it and passes it to <code>consoleintr</code>, which handles editing keys (backspace, Ctrl-U) and, at end of line, wakes any process sleeping in <code>consoleread</code>. Notice the same pattern as everywhere in xv6: a lock-protected buffer, sleep on a channel, wakeup from the interrupt handler.</p>

<h2>xv6's disk: virtio</h2>
${fig('virtq', '<b>Figure 18.3</b> One disk read through xv6\'s virtio driver: descriptors in shared memory, a notify register write, DMA by the device, and a completion interrupt.')}
<p>Block size matters: xv6's file system uses 1 KB blocks, two 512-byte sectors, so block 33 is sector 66. The driver supports a handful of outstanding requests; the buffer cache above it (Chapter 21) makes sure only one request per block is in flight.</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"Interrupts are always better than polling."</strong> Not for very fast devices or very high rates.</li>
<li><strong>"Drivers are a small part of the kernel."</strong> They are most of Linux's code and a large share of its bugs.</li>
<li><strong>"Devices only touch memory the driver mentioned."</strong> Without an IOMMU, a device can DMA anywhere.</li>
<li><strong>"Device registers behave like memory."</strong> Reads can have side effects (clearing status) and must not be reordered or cached.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Polling cost</summary><p>A device takes 5 ms per operation and a status check costs 100 ns. How many checks does a polling driver make per operation, and what fraction of a CPU does it waste at 100 operations per second?</p><p><em>Answer:</em> 50,000 checks; 50% of a CPU.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Read the UART driver</summary><p>In xv6's <code>kernel/uart.c</code> and <code>console.c</code>, trace what happens from a key press to a shell's read() returning a line. List every lock, sleep and wakeup.</p></details>
<details><summary>Network driver lab</summary><p>Do the MIT network driver lab: complete the transmit and receive functions for the emulated Intel E1000 card, using its DMA descriptor rings.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Interrupt livelock</summary><p>Explain receive livelock in a network stack and how NAPI's switch from interrupts to polling under load avoids it.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can describe a device's register interface and memory-mapped I/O.</li>
<li>I can compare polling and interrupts and explain livelock and coalescing.</li>
<li>I understand DMA and why IOMMUs matter.</li>
<li>I know how drivers are layered under block, network and terminal interfaces.</li>
<li>I can trace xv6's UART console and virtio disk drivers.</li>
</ul>
`});

CH.push({
  id: 'ch19', n: 19, title: 'Hard Disks, SSDs and RAID',
  lede: 'File systems are designed around the storage beneath them, and that storage has changed radically: from spinning disks where moving the head dominates everything, to flash drives with no moving parts but strange rules about erasing and wear, to NVMe drives that complete millions of operations per second. This chapter builds performance models of each, lets you compare disk scheduling algorithms, explains how SSDs work inside, and shows how RAID combines drives for capacity, speed and survival.',
  html: `
<h2>Hard disk drives</h2>
<p>A hard disk stores data on spinning platters, in concentric tracks divided into 512-byte or 4 KB sectors. A read or write costs:</p>
<p><code>T = seek time + rotational delay + transfer time</code></p>
<ul>
<li><strong>Seek:</strong> moving the arm to the right track, a few milliseconds on average.</li>
<li><strong>Rotation:</strong> waiting for the sector to come round; at 7,200 RPM a revolution takes 8.3 ms, so 4.2 ms on average.</li>
<li><strong>Transfer:</strong> reading the bits, around 200 MB/s once under the head.</li>
</ul>
<p>A random 4 KB read therefore takes about 8 ms (about 125 per second, 0.5 MB/s), while a sequential read streams at 200 MB/s: a factor of 400. Every classic file system technique (allocating related blocks together, large blocks, read-ahead, the buffer cache, journaling) exists to turn random I/O into sequential I/O.</p>
<h3>Disk scheduling</h3>
${fig('dsched', '<b>Figure 19.1</b> Disk head scheduling. Compare total head movement for first come first served, shortest seek time first, SCAN (the elevator) and circular SCAN.')}
<p>SSTF minimises movement greedily but can starve requests far from the head; SCAN sweeps back and forth like a lift, bounding waits; C-SCAN sweeps one way and jumps back, giving more uniform waits. Modern disks schedule internally (they know their geometry; the OS does not), so the kernel mainly orders and merges requests and controls fairness between processes. Linux's I/O schedulers today are <code>mq-deadline</code>, <code>bfq</code>, <code>kyber</code> and <code>none</code>; NVMe drives usually use <code>none</code>.</p>

<h2>Solid-state drives</h2>
${fig('ftl', '<b>Figure 19.2</b> Inside an SSD: out-of-place writes, a mapping table, and garbage collection that causes write amplification.')}
<ul>
<li><strong>No seeks:</strong> random reads take tens of microseconds, and many proceed in parallel across flash chips, so deep queues matter (NVMe, io_uring).</li>
<li><strong>Erase before write, in large blocks:</strong> handled by the FTL with out-of-place writes and garbage collection.</li>
<li><strong>Limited endurance:</strong> each block survives a few hundred to a few thousand erase cycles depending on cell type (SLC, MLC, TLC, QLC). Wear levelling spreads erases evenly; drives are rated in drive-writes-per-day or total terabytes written.</li>
<li><strong>Write amplification:</strong> physical writes ÷ logical writes. Random small overwrites on a full drive amplify most; TRIM, over-provisioning and sequential write patterns reduce it.</li>
<li><strong>Interfaces:</strong> NVMe over PCIe exposes many deep hardware queues; zoned namespaces (ZNS) and flexible data placement let the host place data to cut garbage collection.</li>
</ul>

<h2>RAID</h2>
<p>A redundant array of independent disks combines several drives into one logical volume. Striping spreads blocks across drives for parallelism; mirroring keeps copies; parity stores the XOR of a stripe's blocks so any one lost block can be recomputed.</p>
${fig('raid', '<b>Figure 19.3</b> RAID levels compared for your number and size of disks.')}
<p>Parity RAID pays a <strong>small-write penalty</strong>: updating one block means reading the old data and parity, computing the new parity, and writing both. Rebuilding a failed large drive can take a day or more, during which a second failure (or an unreadable sector) loses data, which is why RAID 6 or erasure coding is preferred for large drives. RAID also has a <strong>write hole</strong>: a crash between writing data and parity leaves them inconsistent; battery-backed caches, journals or copy-on-write file systems (ZFS, Btrfs) close it. Cloud block storage and distributed systems apply the same ideas across servers with erasure codes such as Reed–Solomon.</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"RAID is a backup."</strong> It protects against drive failure, not deletion, corruption, ransomware or site loss.</li>
<li><strong>"SSDs make I/O patterns irrelevant."</strong> Random small writes still cost more through write amplification, and parallelism needs deep queues.</li>
<li><strong>"A full SSD performs like an empty one."</strong> Garbage collection slows writes as free space shrinks.</li>
<li><strong>"The OS knows the disk's geometry."</strong> Logical block addresses hide it.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Disk arithmetic</summary><p>A 10,000 RPM disk with 4 ms average seek and 150 MB/s transfer. Time for one random 4 KB read? For a sequential 100 MB read?</p><p><em>Answer:</em> 4 + 3 + 0.03 ≈ 7 ms; about 0.67 s (plus one seek and rotation).</p></details>
<details><summary>Scheduling</summary><p>Using Figure 19.1 with the default queue, rank the four policies by head movement.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Parity</summary><p>A RAID 5 stripe holds data blocks 1011, 0110, 1100. What is the parity block? The second disk fails; recover its block.</p><p><em>Answer:</em> parity = 1011 ⊕ 0110 ⊕ 1100 = 0001; lost block = 1011 ⊕ 1100 ⊕ 0001 = 0110.</p></details>
<details><summary>fio</summary><p>Use <code>fio</code> to measure 4 KB random read IOPS on an NVMe drive at queue depths 1 and 64, and sequential 1 MB throughput. Compare with a cloud block volume.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Write amplification</summary><p>Simulate an FTL with greedy garbage collection and uniform random overwrites at 70%, 85% and 95% drive utilisation. Plot write amplification and explain why over-provisioning helps.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can model hard disk access time and explain the random versus sequential gap.</li>
<li>I can run FCFS, SSTF, SCAN and C-SCAN and know what Linux schedulers do today.</li>
<li>I understand flash pages and blocks, the FTL, garbage collection, write amplification and TRIM.</li>
<li>I can compare RAID levels for capacity, fault tolerance and small-write cost.</li>
<li>I know RAID's limits: rebuild risk, the write hole, and that it is not a backup.</li>
</ul>
`});

CH.push({
  id: 'ch20', n: 20, title: 'Files and Directories',
  lede: 'The file system turns a device that stores numbered blocks into named, persistent, shareable files arranged in a tree of directories. Before looking at how it is built, this chapter looks at the interface programs see: files as inodes with names, the system calls to read, write and synchronise them, links, permissions, and the surprisingly subtle question of how to update a file so that a crash cannot corrupt it.',
  html: `
<h2>Files, inodes and names</h2>
<p>A <strong>file</strong> is an array of bytes with metadata. Internally each file is identified by an <strong>inode number</strong>; its <strong>inode</strong> records type, size, owner, permissions, timestamps, link count and where its data lives. Names are separate: a <strong>directory</strong> is a file containing a list of (name, inode number) pairs. A path such as <code>/home/a/report.txt</code> is resolved one component at a time from the root (or the current directory), reading each directory to find the next inode.</p>
${code('Looking at inodes', 'bash')`
$ ls -i report.txt
27 report.txt
$ stat report.txt
  File: report.txt   Size: 5120   Blocks: 16   IO Block: 4096   regular file
Device: 259,2   Inode: 27   Links: 1
Access: (0640/-rw-r-----)  Uid: ( 1000/ bhaskar)   Gid: ( 1000/ bhaskar)
Modify: 2026-11-07 10:12:44.512 +0530`}

<h2>The basic calls</h2>
<div class="tbl"><table><tr><th>Call</th><th>Purpose</th><th>Notes</th></tr>
<tr><td><code>open(path, flags, mode)</code></td><td>Resolve a path, return a descriptor</td><td>O_CREAT, O_TRUNC, O_APPEND, O_DIRECT, O_CLOEXEC</td></tr>
<tr><td><code>read</code>, <code>write</code></td><td>Transfer bytes at the current offset</td><td>May transfer fewer bytes than asked; loop</td></tr>
<tr><td><code>lseek</code>, <code>pread</code>, <code>pwrite</code></td><td>Move the offset, or read/write at an explicit offset</td><td>pread/pwrite are safe with threads sharing a descriptor</td></tr>
<tr><td><code>fsync</code>, <code>fdatasync</code></td><td>Force data (and metadata) to stable storage</td><td>The only way to know data survives a crash</td></tr>
<tr><td><code>rename</code></td><td>Atomically change a name</td><td>Replaces the target if it exists</td></tr>
<tr><td><code>link</code>, <code>unlink</code>, <code>symlink</code></td><td>Add or remove names</td><td>Deleting is unlinking the last name</td></tr>
<tr><td><code>mkdir</code>, <code>rmdir</code>, <code>getdents</code></td><td>Directories</td><td>Only the kernel writes directory contents</td></tr>
<tr><td><code>stat</code>, <code>fstat</code></td><td>Read metadata</td><td>xv6's fstat returns type, size, links</td></tr>
<tr><td><code>mount</code></td><td>Attach a file system at a directory</td><td>Builds one tree from many devices</td></tr>
</table></div>
<p>Writes normally go to the page cache and reach storage later (Linux flushes dirty pages after about 30 seconds by default). A successful <code>write</code> means the kernel has the data, not the disk. Databases and anything that must survive power loss call <code>fsync</code> at the right moments, at the cost of waiting for storage.</p>

<h2>Links</h2>
${fig('links', '<b>Figure 20.1</b> Hard links, symbolic links, and what unlink really does.')}

<h2>Permissions</h2>
${fig('perm', '<b>Figure 20.2</b> Unix permission bits. Tick boxes to see the ls notation and octal mode.')}
<p>Each inode has an owner, a group and nine permission bits. For directories, read lists names, write creates and removes entries, and execute allows traversal. Extra bits: setuid and setgid run a program with its owner's or group's identity (for example <code>passwd</code>), and the sticky bit on <code>/tmp</code> lets only a file's owner delete it. Access control lists and Linux capabilities refine this model; mandatory controls such as SELinux add policy above it (Chapter 24). xv6 has no users or permissions at all.</p>

<h2>Updating files safely</h2>
${fig('atomic', '<b>Figure 20.3</b> The standard recipe for replacing a file atomically and durably.')}
<p>Overwriting a file in place is never crash-safe: a crash midway leaves a mix. The write-temporary, fsync, rename, fsync-directory recipe is how editors, package managers and configuration tools update files. Research on real applications found many that got this wrong, losing data after crashes on file systems that reorder writes.</p>

<h2>In xv6</h2>
<p>xv6 implements the core of this interface: <code>open</code> with O_CREATE, O_RDONLY, O_WRONLY, O_RDWR and O_TRUNC, <code>read</code>, <code>write</code>, <code>close</code>, <code>dup</code>, <code>pipe</code>, <code>fstat</code>, <code>link</code>, <code>unlink</code>, <code>mkdir</code>, <code>chdir</code>, and <code>mknod</code> for device files such as the console. Symbolic links are a classic extension exercise. Because xv6's file system logs every operation synchronously (Chapter 22), a completed system call is already durable.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Assuming write means durable.</strong></li>
<li><strong>Ignoring short reads and writes.</strong></li>
<li><strong>Overwriting files in place</strong> instead of write-and-rename.</li>
<li><strong>Forgetting to fsync the directory</strong> after creating or renaming files that must survive.</li>
<li><strong>World-writable files and directories</strong> without the sticky bit.</li>
<li><strong>Following symlinks unsafely in privileged programs</strong> (use <code>O_NOFOLLOW</code> or <code>openat2</code> with resolve restrictions).</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Link counts</summary><p>A new empty directory has link count 2. Why? What is it after creating two subdirectories inside it?</p><p><em>Answer:</em> its name in the parent plus its own "." entry; each subdirectory's ".." adds one, so 4.</p></details>
<details><summary>Octal</summary><p>Give the octal mode for rwxr-x--- and explain what each part allows on a directory.</p><p><em>Answer:</em> 750: owner may list, create and enter; group may list and enter; others nothing.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Open but unlinked</summary><p>Open a file, unlink it, keep writing to it, then check <code>df</code> and <code>ls /proc/PID/fd</code>. Why does disk space not come back until the process exits?</p></details>
<details><summary>Symlinks in xv6</summary><p>Add a <code>symlink(target, path)</code> system call and make <code>open</code> follow links (with a depth limit to catch cycles), as in the MIT file system lab.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Crash test</summary><p>Write a program that updates a file with the safe recipe, and another that overwrites in place, and test both with a crash simulator such as dm-log-writes or by cutting power to a VM.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain inodes, directories and path resolution.</li>
<li>I know the main file system calls and what write, fsync and rename guarantee.</li>
<li>I understand hard and symbolic links and that deletion is unlinking.</li>
<li>I can read and set Unix permissions.</li>
<li>I can update a file atomically and durably.</li>
</ul>
`});
