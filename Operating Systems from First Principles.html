<style>

  for (let i = 0; i < 64; i++) { ip[i] = kp[i] ^ 0x36; op[i] = kp[i] ^ 0x5c; }

}

CH.push({
  id: 'ch01', n: 1, title: 'What an Operating System Does',
  lede: 'A computer offers raw, awkward resources: one or a few processors, a flat array of physical memory, and devices controlled through registers and interrupts. An operating system turns these into abstractions that are easy to program and safe to share: processes that each seem to have their own processor and memory, files with names, and pipes and sockets for communication. This chapter introduces what operating systems do and how they are built, and introduces xv6, the small teaching kernel this book uses to show real code, alongside Linux.',
  html: `
<h2>Three jobs</h2>
<p>An operating system does three things at once:</p>
<ul>
<li><strong>Abstraction:</strong> it hides hardware details behind clean interfaces. A program calls <code>write(fd, buf, n)</code> without knowing whether the bytes go to an NVMe drive, a terminal or a network socket.</li>
<li><strong>Resource management:</strong> it decides who gets the processor next, which memory pages stay resident, and in what order disk requests are served, balancing efficiency and fairness.</li>
<li><strong>Protection and isolation:</strong> it prevents one program, buggy or malicious, from reading or corrupting another's memory, files or devices, or monopolising the machine.</li>
</ul>
<p>The core of the system, the <strong>kernel</strong>, runs with full hardware privilege. Everything else, including the shell and the C library, runs in a restricted <strong>user mode</strong> and must ask the kernel to do privileged things through <strong>system calls</strong>.</p>
${fig('osarch', '<b>Figure 1.1</b> Two ways to structure a kernel. Most general-purpose systems are monolithic; microkernels trade some performance for isolation.')}

<h2>The organising themes</h2>
${fig('pieces', '<b>Figure 1.2</b> The book is organised around three themes, each built from mechanisms (how) and policies (which).')}
<p>A recurring idea is the separation of <strong>mechanism</strong> from <strong>policy</strong>. A context switch is a mechanism: how to stop one process and start another. Which process should run next is a policy. Good systems make mechanisms general and fast so that policies can change: Linux's sched_ext, for example, keeps the switching mechanism in the kernel and lets a loaded BPF program choose the policy.</p>

<h2>xv6: a kernel you can read</h2>
<p>Production kernels are huge: Linux has tens of millions of lines. To see real mechanisms end to end, this book uses <strong>xv6</strong>, a re-implementation of Sixth Edition Unix (1975) written at MIT for teaching. The current version runs on 64-bit RISC-V, is about 6,000 lines of C and a little assembly, supports multiple CPUs, and is used in MIT's 6.1810 Operating System Engineering course. Its source is at <code>github.com/mit-pdos/xv6-riscv</code> and it runs under the QEMU emulator. Where xv6 is too simple, the text explains what Linux does instead; Linux 7.3, released in October 2026, is the current mainline version at the time of writing.</p>
<div class="tbl"><table><tr><th>Subsystem</th><th>xv6 files (kernel/)</th><th>Chapters</th></tr>
<tr><td>Boot and per-CPU start</td><td>entry.S, start.c, main.c</td><td>2</td></tr>
<tr><td>Processes, scheduling, sleep and wakeup</td><td>proc.c, proc.h, swtch.S</td><td>4, 6, 15</td></tr>
<tr><td>Traps and system calls</td><td>trampoline.S, trap.c, syscall.c, sysproc.c, sysfile.c</td><td>3, 4</td></tr>
<tr><td>Memory</td><td>kalloc.c, vm.c, riscv.h, memlayout.h</td><td>9, 10, 12</td></tr>
<tr><td>Locks</td><td>spinlock.c, sleeplock.c</td><td>14, 15</td></tr>
<tr><td>Devices</td><td>uart.c, console.c, plic.c, virtio_disk.c</td><td>18</td></tr>
<tr><td>File system</td><td>bio.c, log.c, fs.c, file.c, pipe.c, exec.c</td><td>20–22</td></tr>
<tr><td>User programs</td><td>user/sh.c, user/ls.c, user/usys.pl, user/ulib.c</td><td>3</td></tr>
</table></div>
${code('Getting xv6 running', 'bash')`
git clone https://github.com/mit-pdos/xv6-riscv.git
cd xv6-riscv
make qemu            # needs a riscv64 GCC toolchain and qemu-system-riscv64
# xv6 kernel is booting
# init: starting sh
$ ls
$ echo hello > f && cat f
# Ctrl-a x quits QEMU`}

<h2>A first look at system calls</h2>
<p>Every interaction between a program and the world passes through the kernel. Even printing a line ends in a system call:</p>
${code('Hello, kernel', 'c')`
#include <unistd.h>

int main(void) {
    const char msg[] = "hello\n";
    write(1, msg, sizeof msg - 1);   /* file descriptor 1 is standard output */
    return 0;                        /* exit(0) is a system call too */
}`}
${code('Watching the calls on Linux', 'bash')`
$ strace ./hello
execve("./hello", ["./hello"], 0x7ffc...) = 0
...                                  # dynamic loader maps libc with mmap
write(1, "hello\n", 6)               = 6
exit_group(0)                        = ?`}
<p>On RISC-V, the C library puts the system call number in register <code>a7</code> and arguments in <code>a0</code>–<code>a5</code>, then executes <code>ecall</code>, which traps into the kernel. Chapters 3 and 4 follow this path through xv6's code line by line.</p>

<h2>A short history</h2>
<ul>
<li><strong>Batch systems</strong> (1950s–60s) ran one job at a time; the OS was a library and a job loader.</li>
<li><strong>Multiprogramming and time sharing</strong> (1960s): keep several jobs in memory to overlap I/O, and switch rapidly so many users can share a machine interactively. Protection became essential.</li>
<li><strong>Unix</strong> (1969 onwards): processes, a hierarchical file system, everything-is-a-file, pipes, and a small set of composable system calls. xv6 follows Sixth Edition Unix closely.</li>
<li><strong>Personal computers, then Linux</strong> (1991): Unix ideas on commodity hardware; Linux now runs most servers, all Android phones and the top supercomputers.</li>
<li><strong>Today:</strong> many-core processors, virtual machines and containers, flash storage, memory-safe languages in kernels (Rust support in Linux is no longer experimental), and extensibility through eBPF.</li>
</ul>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"The OS is the GUI."</strong> The kernel has no windows; desktops are user programs.</li>
<li><strong>"Library calls are system calls."</strong> <code>printf</code> buffers in user space and calls <code>write</code> occasionally; <code>malloc</code> usually needs no system call at all.</li>
<li><strong>"The kernel is a process."</strong> It is code that runs on behalf of processes (during system calls and faults) and in response to interrupts, plus a few kernel threads.</li>
<li><strong>"Teaching kernels are toys."</strong> xv6 omits features, not concepts: its traps, page tables, locks and logging work the way production kernels' do.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Count the calls</summary><p>Run <code>strace -c ls</code> on Linux. Which system calls dominate, and why?</p><p><em>Answer sketch:</em> file metadata calls (statx, getdents64), mmap and openat for loading libraries, and write for output.</p></details>
<details><summary>Run xv6</summary><p>Build and boot xv6 in QEMU, run <code>ls</code>, and find the source of <code>ls</code> in <code>user/ls.c</code>. Which system calls does it make?</p><p><em>Answer:</em> open, fstat, read (for directory entries), close, and write via printf.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Mechanism or policy?</summary><p>Classify: the page table walk; choosing which page to evict; the context switch; deciding the time slice length; the file system journal format; deciding when to flush the journal.</p><p><em>Answer:</em> mechanism, policy, mechanism, policy, mechanism, policy.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Microkernel cost</summary><p>Estimate the extra cost of reading a file on a microkernel if each read needs two IPC round trips of 1 µs each, for a workload doing 200,000 small reads per second. Is it significant?</p><p><em>Answer sketch:</em> 0.4 s of IPC per second of work, 40% overhead, which is why microkernels optimise IPC heavily and batch requests.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can state the three jobs of an operating system.</li>
<li>I can explain user mode, kernel mode and system calls.</li>
<li>I can compare monolithic and microkernel designs.</li>
<li>I know the book's themes and the mechanism/policy distinction.</li>
<li>I can build and run xv6 and find its main source files.</li>
</ul>
`});

CH.push({
  id: 'ch02', n: 2, title: 'The Hardware Interface and Booting',
  lede: 'An operating system is built on a small set of hardware features: privilege modes, traps, a timer, page tables and memory-mapped devices. Without them, isolation would be impossible: any program could disable interrupts, overwrite the kernel or talk directly to the disk. This chapter introduces those features using RISC-V, the open instruction set xv6 runs on, and then follows xv6 from power-on to the shell prompt.',
  html: `
<h2>Privilege</h2>
${fig('modes', '<b>Figure 2.1</b> RISC-V\'s privilege modes. Each mode can do everything the modes inside it can, and more.')}
<p>The processor tracks a current privilege mode. Privileged instructions (changing the page table, returning from a trap, disabling interrupts) and privileged registers fail in user mode with an illegal-instruction exception, which traps into the kernel. x86 has the same idea as rings 0 to 3 (kernels use 0 and 3); ARM has exception levels EL0 to EL3. Higher levels are used by firmware and hypervisors (Chapter 25).</p>
<h3>Control and status registers</h3>
<p>Supervisor mode is controlled through a handful of control and status registers (CSRs), which xv6 reads and writes through inline functions in <code>kernel/riscv.h</code>:</p>
<div class="tbl"><table><tr><th>CSR</th><th>Purpose</th></tr>
<tr><td><code>stvec</code></td><td>Address of the trap handler</td></tr>
<tr><td><code>sepc</code></td><td>Program counter where the trap occurred (where to return)</td></tr>
<tr><td><code>scause</code></td><td>Why the trap happened: system call, page fault, timer, device interrupt…</td></tr>
<tr><td><code>stval</code></td><td>Extra information, such as the faulting address</td></tr>
<tr><td><code>sstatus</code></td><td>Interrupt enable bit (SIE), previous mode (SPP), and more</td></tr>
<tr><td><code>sie</code>, <code>sip</code></td><td>Which interrupts are enabled and pending</td></tr>
<tr><td><code>satp</code></td><td>Address of the root page table and the paging mode (Chapter 10)</td></tr>
<tr><td><code>sscratch</code></td><td>A spare register the trap code uses to find kernel state</td></tr>
<tr><td><code>stimecmp</code></td><td>When the next timer interrupt fires (Sstc extension)</td></tr>
</table></div>

<h2>Traps</h2>
<p>A <strong>trap</strong> transfers control from whatever is running to the kernel's handler at <code>stvec</code>. There are three kinds:</p>
<ul>
<li><strong>System calls:</strong> the program executes <code>ecall</code> deliberately.</li>
<li><strong>Exceptions:</strong> an instruction does something illegal or impossible: divide by zero is not a trap on RISC-V, but a page fault, illegal instruction or misaligned access is.</li>
<li><strong>Interrupts:</strong> a device or the timer needs attention, unrelated to the current instruction.</li>
</ul>
<p>On a trap the hardware does only a little: it saves the program counter in <code>sepc</code>, records the cause in <code>scause</code>, saves the current mode in <code>sstatus.SPP</code>, disables interrupts, switches to supervisor mode and jumps to <code>stvec</code>. It does not save general registers or switch page tables; the kernel's trap code must do that (Chapter 4). This minimalism is deliberate: it keeps hardware simple and gives the kernel flexibility.</p>

<h2>The timer</h2>
<p>If a program loops forever without making system calls, how does the kernel get the processor back? The <strong>timer interrupt</strong>. The kernel sets <code>stimecmp</code>; when the time counter passes it, an interrupt fires and the kernel can switch to another process. This is the foundation of preemptive multitasking. xv6 sets the next timer interrupt about a tenth of a second ahead in QEMU (one million ticks of a 10 MHz clock); Linux typically uses 250 or 1,000 ticks per second, or a "tickless" mode that programs the timer only when needed.</p>

<h2>Devices</h2>
${fig('memmap', '<b>Figure 2.2</b> The physical address map of QEMU\'s "virt" machine as xv6 uses it. RAM starts at 0x80000000; device registers live at lower addresses.')}
<p>Devices expose registers at physical addresses. Reading or writing those addresses talks to the device, not memory: writing a byte to the UART's transmit register sends a character to the console. Devices raise interrupts through the platform-level interrupt controller (PLIC), which routes them to harts. Chapter 18 covers drivers.</p>

<h2>Booting xv6</h2>
${fig('boot', '<b>Figure 2.3</b> xv6 from power-on to shell. Step through each stage.')}
${code('kernel/main.c', 'c')`
void main() {
  if(cpuid() == 0){
    consoleinit();
    printkinit();
    printk("\nxv6 kernel is booting\n\n");
    kinit();         // physical page allocator
    kvminit();       // create kernel page table
    kvminithart();   // turn on paging
    procinit();      // process table
    trapinit();      // trap vectors
    trapinithart();  // install kernel trap vector
    plicinit();      // set up interrupt controller
    plicinithart();  // ask PLIC for device interrupts
    binit();         // buffer cache
    iinit();         // inode table
    fileinit();      // file table
    virtio_disk_init(); // emulated hard disk
    userinit();      // first user process
    __atomic_store_n(&started, 1, __ATOMIC_RELEASE);
  } else {
    while(__atomic_load_n(&started, __ATOMIC_ACQUIRE) == 0)
      ;
    printk("hart %d starting\n", cpuid());
    kvminithart();    // turn on paging
    trapinithart();   // install kernel trap vector
    plicinithart();   // ask PLIC for device interrupts
  }
  scheduler();
}`}
<p>(The current source prints the banner with three calls; they are merged here for brevity. Note the release store and acquire load on <code>started</code>: they guarantee other harts see hart 0's initialisation before proceeding, a memory-ordering idea Chapter 14 explains.)</p>
<p>Real machines add steps before the kernel: firmware (UEFI or, on RISC-V boards, OpenSBI running in machine mode) initialises memory and devices, a bootloader such as GRUB or U-Boot loads the kernel and an initial RAM disk, and the kernel discovers hardware from ACPI tables or a device tree rather than from fixed addresses. Linux then starts <code>init</code> as process 1, usually systemd.</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"Hardware saves everything on a trap."</strong> RISC-V saves only the PC and a few status bits; the kernel saves the rest.</li>
<li><strong>"Interrupts and exceptions are the same."</strong> Exceptions are caused by the current instruction; interrupts are asynchronous.</li>
<li><strong>"Device registers are memory."</strong> Reads and writes have side effects and must not be cached or reordered; compilers need <code>volatile</code> and CPUs need fences.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>What traps?</summary><p>Classify: a key press; <code>ecall</code>; loading from an unmapped address; the timer; executing <code>sret</code> in user mode.</p><p><em>Answer:</em> interrupt; system call; exception (page fault); interrupt; exception (illegal instruction).</p></details>
<details><summary>Boot messages</summary><p>Add a <code>printf</code> to each stage of xv6's <code>main()</code> and boot it. In what order do the harts print, and why?</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Hang without a timer</summary><p>In xv6, comment out the call that arms the timer and run a user program with an infinite loop. What happens to the shell, and why?</p><p><em>Answer sketch:</em> once the looping process runs, the kernel never regains that hart; with one hart, the system freezes.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Why delegate?</summary><p>Explain why xv6's <code>start()</code> delegates interrupts and exceptions to supervisor mode, and what would happen if it did not.</p><p><em>Answer sketch:</em> by default all traps go to machine mode; without delegation, every system call and page fault would land in M-mode code that xv6 does not have.</p></details></div>
</div>

CH.push({
  id: 'ch03', n: 3, title: 'Processes and the System Call Interface',
  lede: 'Unix gave programmers a remarkably small set of system calls that combine powerfully: fork to create a process, exec to run a program, wait and exit to coordinate, and file descriptors with pipe and dup to connect everything. A working shell takes only a few hundred lines on top of them. This chapter explains the process API through xv6\'s small set of system calls and its shell, then follows one system call from user code into the kernel and back.',
  html: `
<h2>What a process is</h2>
<p>A <strong>process</strong> is a running program together with everything the kernel keeps for it: an address space (code, data, heap, stack), saved registers when not running, open file descriptors, a current directory, an identity (process ID, user), and a state. xv6 keeps this in <code>struct proc</code> in <code>kernel/proc.h</code>, in a fixed table of NPROC (64) entries; Linux uses <code>struct task_struct</code>, allocated dynamically.</p>

<h2>Creating processes: fork, exec, wait, exit</h2>
${fig('forkx', '<b>Figure 3.1</b> How a shell runs a command: fork a copy of itself, exec the program in the child, and wait for it.')}
${code('The core of a shell', 'c')`
for (;;) {
    char *argv[MAXARG];
    if (getcmd(buf, sizeof buf) < 0) break;
    parse(buf, argv);
    int pid = fork();
    if (pid == 0) {                      // child
        exec(argv[0], argv);             // only returns on failure
        fprintf(2, "exec %s failed\n", argv[0]);
        exit(1);
    }
    int status;
    wait(&status);                       // parent: wait for the child
}`}
<p>Why split creation into fork and exec rather than one "spawn" call? Because the child can adjust its own environment between them, redirecting file descriptors, changing directory, dropping privileges, using the ordinary system calls, before the new program starts. This is how redirection and pipes work with no special support in the programs themselves. The cost is copying an address space that exec immediately discards; real systems avoid it with copy-on-write (Chapter 12, and a lab in MIT's course) or with <code>vfork</code> and <code>posix_spawn</code>.</p>

<h2>File descriptors</h2>
${fig('fdt', '<b>Figure 3.2</b> File descriptors, open file objects and inodes, and how fork and dup share them.')}
<p>A file descriptor can refer to a file, a directory, a device such as the console, or one end of a pipe. Programs read and write bytes without knowing which, so <code>cat</code> works the same on a file, a terminal or a pipe.</p>

<h2>Pipes</h2>
<p><code>pipe(p)</code> creates a kernel buffer with a read end <code>p[0]</code> and a write end <code>p[1]</code>. Reads block until data is available; a read returns 0 (end of file) once every write end is closed. The shell builds <code>ls | wc</code> like this:</p>
${code('How a shell builds a pipeline', 'c')`
int p[2];
pipe(p);
if (fork() == 0) {          // left side: ls writes into the pipe
    close(1); dup(p[1]);    // fd 1 now refers to the write end
    close(p[0]); close(p[1]);
    exec("ls", lsargv);
}
if (fork() == 0) {          // right side: wc reads from the pipe
    close(0); dup(p[0]);    // fd 0 now refers to the read end
    close(p[0]); close(p[1]);
    exec("wc", wcargv);
}
close(p[0]); close(p[1]);   // the parent must close both, or wc never sees EOF
wait(0); wait(0);`}

<h2>xv6's system calls</h2>
<div class="tbl"><table><tr><th>Call</th><th>Purpose</th></tr>
<tr><td><code>fork()</code>, <code>exit(status)</code>, <code>wait(*status)</code>, <code>kill(pid)</code>, <code>getpid()</code></td><td>Process life cycle</td></tr>
<tr><td><code>exec(file, argv)</code></td><td>Replace memory with a new program</td></tr>
<tr><td><code>sbrk(n)</code></td><td>Grow (or shrink) memory by n bytes</td></tr>
<tr><td><code>pause(n)</code>, <code>uptime()</code></td><td>Wait for, or read, timer ticks (the call was named <code>sleep</code> in earlier versions)</td></tr>
<tr><td><code>open</code>, <code>read</code>, <code>write</code>, <code>close</code>, <code>dup</code>, <code>pipe</code>, <code>fstat</code></td><td>File descriptors</td></tr>
<tr><td><code>chdir</code>, <code>mkdir</code>, <code>mknod</code>, <code>link</code>, <code>unlink</code></td><td>Names in the file system</td></tr>
<tr><td><code>sync()</code></td><td>Flush file system state to disk</td></tr>
</table></div>
<p>That is 22 calls in the current source. Linux has over 450, but most are refinements of these ideas: <code>clone</code> generalises fork to create threads; <code>execve</code> takes an environment; <code>openat</code> resolves paths relative to a directory descriptor; <code>mmap</code> maps files into memory; <code>io_uring</code> batches I/O (Chapter 17).</p>

<h2>Inside a system call</h2>
${fig('scpath', '<b>Figure 3.3</b> One write() through xv6: user stub, trampoline, trap handler, dispatch and return.')}
${code('kernel/syscall.c (core)', 'c')`
void
syscall(void)
{
  int num;
  struct proc *p = myproc();

  num = p->trapframe->a7;
  if(num > 0 && num < NELEM(syscalls) && syscalls[num]) {
    // Use num to lookup the system call function for num, call it,
    // and store its return value in p->trapframe->a0
    p->trapframe->a0 = syscalls[num]();
  } else {
    printk("%d %s: unknown sys call %d\n", p->pid, p->name, num);
    p->trapframe->a0 = -1;
  }
}`}
<p>The kernel never trusts user pointers. <code>copyin</code> and <code>copyout</code> translate user virtual addresses through the process's page table and check that they are mapped and user-accessible before copying; a bad pointer makes the system call fail rather than crash the kernel. Linux's equivalents are <code>copy_from_user</code> and <code>copy_to_user</code>.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Forgetting to close unused pipe ends,</strong> so readers never see end of file.</li>
<li><strong>Not waiting for children,</strong> leaving zombies that fill the process table.</li>
<li><strong>Assuming exec returns.</strong> Code after a successful exec never runs.</li>
<li><strong>Writing to a shared descriptor from parent and child</strong> without realising the offset is shared.</li>
<li><strong>Buffered output and fork:</strong> data in a stdio buffer before fork is printed twice; flush first.</li>
</ul></div>

CH.push({
  id: 'ch04', n: 4, title: 'Limited Direct Execution and Context Switching',
  lede: 'To give every process the illusion of its own processor, the kernel must run programs fast, which means directly on the hardware, yet keep the ability to stop them, switch between them and stop them doing harm. The answer is "limited direct execution": run user code directly in user mode, and regain control through traps and timer interrupts. This chapter shows how xv6 enters and leaves the kernel through its trampoline page, keeps per-process kernel stacks, and switches between processes with a dozen lines of assembly.',
  html: `
<h2>Direct execution, with limits</h2>
${fig('lde', '<b>Figure 4.1</b> The limited direct execution protocol. User code runs directly on the CPU; the kernel regains control only through traps it set up in advance.')}
<p>Running a program inside an interpreter would give complete control but be far too slow. Running it directly is fast but would hand it the machine. Hardware support makes the compromise possible: user mode prevents privileged operations, traps can only enter the kernel at addresses it chose, and the timer guarantees the kernel runs again within a bounded time. This combination is called <strong>limited direct execution</strong>.</p>

<h2>Process states</h2>
${fig('pstates', '<b>Figure 4.2</b> The life cycle of an xv6 process, with the functions that cause each transition.')}
${code('kernel/proc.h (abridged)', 'c')`
enum procstate { UNUSED, USED, SLEEPING, RUNNABLE, RUNNING, ZOMBIE };

struct proc {
  struct spinlock lock;

  // p->lock must be held when using these:
  enum procstate state;        // Process state
  void *chan;                  // If non-zero, sleeping on chan
  int killed;                  // If non-zero, have been killed
  int xstate;                  // Exit status to be returned to parent's wait
  int pid;                     // Process ID

  struct proc *parent;         // Parent process (protected by wait_lock)

  uint64 kstack;               // Virtual address of kernel stack
  uint64 sz;                   // Size of process memory (bytes)
  pagetable_t pagetable;       // User page table
  struct trapframe *trapframe; // data page for trampoline.S
  struct context context;      // swtch() here to run process
  struct file *ofile[NOFILE];  // Open files
  struct inode *cwd;           // Current directory
  char name[16];               // Process name (debugging)
};`}

<h2>Entering and leaving the kernel</h2>
<p>When a trap arrives from user mode, the CPU is still using the <em>user</em> page table, and all 32 general registers hold user values that must not be lost. xv6 solves this with two special pages mapped at the top of every user address space:</p>
<ul>
<li>The <strong>trampoline</strong> page holds the code in <code>trampoline.S</code>. It is mapped at the same virtual address (<code>TRAMPOLINE</code>) in every user page table and in the kernel page table, so execution can continue across the switch of <code>satp</code>. It is not user-accessible (no PTE_U), so user code cannot run it directly.</li>
<li>The <strong>trapframe</strong> page, just below, is per process. <code>uservec</code> saves the user registers there, then loads from it the kernel stack pointer, the hart ID, the address of <code>usertrap()</code> and the kernel page table.</li>
</ul>
<p>Each process also has its own <strong>kernel stack</strong>, mapped in the kernel's address space with an unmapped guard page below it, so a kernel stack overflow faults instead of silently corrupting memory. A process executing a system call is therefore a <em>kernel thread</em>: it runs kernel code on its own kernel stack, and can block (for example waiting for the disk) without affecting other processes.</p>
<p>Traps that happen while already in the kernel (device interrupts, timer) go to a different vector, <code>kernelvec</code>, which saves registers on the current kernel stack and calls <code>kerneltrap()</code>. Linux uses the same split between entry from user space and from kernel space.</p>

<h2>Context switching</h2>
${fig('swtch', '<b>Figure 4.3</b> Switching from process A to process B in xv6 always passes through the CPU\'s scheduler thread.')}
${code('kernel/swtch.S', 'none')`
# Context switch
#   void swtch(struct context *old, struct context *new);
# Save current registers in old. Load from new.
.globl swtch
swtch:
        sd ra, 0(a0)
        sd sp, 8(a0)
        sd s0, 16(a0)
        sd s1, 24(a0)
        # ... s2 through s11 ...
        sd s11, 104(a0)

        ld ra, 0(a1)
        ld sp, 8(a1)
        ld s0, 16(a1)
        ld s1, 24(a1)
        # ... s2 through s11 ...
        ld s11, 104(a1)

        ret`}
<p>Only callee-saved registers need saving, because <code>swtch</code> is called like a C function: the compiler already saved any caller-saved registers it cares about. The program counter is not saved explicitly; <code>ra</code> (the return address) plays that role. Linux's <code>__switch_to</code> does the same essential job and also switches floating-point and vector state, the stack canary, the TLS register and, if the next task is in a different address space, the page table.</p>

<h2>What a context switch costs</h2>
<p>The register save and restore takes nanoseconds. The real costs are indirect: switching page tables may flush TLB entries (Chapter 11), caches are cold for the new process, and branch predictors are retrained. Measured on modern hardware, a process switch costs a few microseconds of lost work. This is why kernels avoid switching more often than needed and why threads in the same process (sharing a page table) switch faster than processes.</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"The kernel runs in its own process."</strong> System calls run in the calling process's context, on its kernel stack.</li>
<li><strong>"swtch saves the PC."</strong> It saves <code>ra</code>; returning is what resumes execution.</li>
<li><strong>"User code can jump into kernel functions."</strong> Only via traps to <code>stvec</code>; the trampoline is not executable by user mode.</li>
<li><strong>"Context switches are free."</strong> The cache and TLB effects dominate.</li>
</ul></div>

const schedSim = (jobs, pol, q) => {
  const J = jobs.map(j => ({ ...j, rem: j.run, first: null, done: null })); let t = 0, cur = null, slice = 0; const G = []; const queue = [];
  const arrived = () => J.filter(j => j.arr <= t && j.rem > 0);
  let guard = 0;
  while (J.some(j => j.rem > 0) && guard++ < 2000) {
    J.filter(j => j.arr === t).forEach(j => queue.push(j));
    let pick = null; const ready = arrived();
    if (!ready.length) { G.push(null); t++; continue; }
    if (pol === 'FIFO') pick = cur && cur.rem > 0 ? cur : ready.sort((a, b) => a.arr - b.arr || a.i - b.i)[0];
    else if (pol === 'SJF') pick = cur && cur.rem > 0 ? cur : ready.sort((a, b) => a.run - b.run || a.arr - b.arr)[0];
    else if (pol === 'STCF') pick = ready.sort((a, b) => a.rem - b.rem || a.arr - b.arr)[0];
    else { if (cur && cur.rem > 0 && slice < q) pick = cur; else { if (cur && cur.rem > 0) { queue.splice(queue.indexOf(cur), 1); queue.push(cur); } pick = queue.find(j => j.rem > 0); slice = 0; } }
    if (pick !== cur) slice = 0; cur = pick; if (pick.first === null) pick.first = t; G.push(pick.name); pick.rem--; slice++; t++; if (pick.rem === 0) { pick.done = t; const qi = queue.indexOf(pick); if (qi >= 0) queue.splice(qi, 1); }
  }
  return { G, J };
};

CH.push({
  id: 'ch05', n: 5, title: 'Scheduling Policies',
  lede: 'With the mechanism for switching in place, the kernel needs a policy: which runnable process should run next, and for how long? Different goals pull in different directions. Finishing jobs quickly favours running short ones first; interactive responsiveness favours giving everyone a turn soon; fairness favours equal shares. This chapter builds the classic policies from first principles with a simulator you can drive, defines the metrics that judge them, and shows why no single policy wins everywhere.',
  html: `
<h2>Metrics</h2>
<ul>
<li><strong>Turnaround time</strong> = completion time − arrival time. Good for batch work: how long until my job finishes?</li>
<li><strong>Response time</strong> = first run − arrival time. Good for interactive work: how long until something happens?</li>
<li><strong>Fairness:</strong> do jobs get comparable shares? (Jain's index measures this.)</li>
<li><strong>Throughput and overhead:</strong> jobs per second, and time lost to switching.</li>
</ul>
<p>Assume first that every job's length is known and jobs only use the CPU. We will relax both assumptions.</p>

<h2>Policies</h2>
<div class="tbl"><table><tr><th>Policy</th><th>Rule</th><th>Strength</th><th>Weakness</th></tr>
<tr><td>FIFO (first come, first served)</td><td>Run jobs in arrival order to completion</td><td>Simple, no starvation</td><td>Convoy effect: short jobs wait behind long ones</td></tr>
<tr><td>SJF (shortest job first)</td><td>Of the arrived jobs, run the shortest to completion</td><td>Optimal average turnaround if all arrive together</td><td>Late-arriving short jobs still wait; needs lengths</td></tr>
<tr><td>STCF (shortest time to completion first)</td><td>Preempt for the job with least remaining time</td><td>Optimal average turnaround with arrivals</td><td>Long jobs can starve; poor response</td></tr>
<tr><td>RR (round robin)</td><td>Run each job for a quantum, then move to the next</td><td>Good response time, fair</td><td>Poor turnaround for equal-length jobs; switching overhead</td></tr>
</table></div>
${fig('schedsim', '<b>Figure 5.1</b> A scheduling simulator. Edit the jobs and quantum, pick a policy or compare all four, and read average turnaround (T) and response (R).')}
<p>Try the default jobs. FIFO makes the short job C wait behind A; SJF and STCF finish short jobs quickly and minimise turnaround; RR gives every job a first slot within a few ticks, minimising response, but stretches every job out. Now try a quantum of 1 and of 6. Shorter quanta improve response but would multiply context-switch overhead on a real system; the quantum should be long compared with the switch cost, typically milliseconds.</p>

<h2>Overlapping I/O</h2>
${fig('overlap', '<b>Figure 5.2</b> When a job waits for I/O, running another job keeps the CPU busy.')}
<p>Real jobs alternate between computing and waiting for I/O. A scheduler should treat each CPU burst as a separate short job: when an interactive process wakes up with a short burst, running it first both improves response and keeps devices busy. This is the insight behind giving priority to processes that sleep often.</p>

<h2>The missing piece: we do not know job lengths</h2>
<p>SJF and STCF need the future. Operating systems cannot know how long a burst will take, but can <em>predict</em> it from the past: for example, an exponentially weighted average of previous bursts, <code>τₙ₊₁ = α·tₙ + (1−α)·τₙ</code>. The next chapter's multi-level feedback queue learns this implicitly by watching how jobs behave, and proportional-share schedulers sidestep it by aiming for fairness instead.</p>

<h2>xv6's policy</h2>
${code('kernel/proc.c: scheduler() (abridged)', 'c')`
void
scheduler(void)
{
  struct proc *p;
  struct cpu *c = mycpu();

  c->proc = 0;
  for(;;){
    // The most recent process to run may have had interrupts
    // turned off; enable them to avoid a deadlock if all
    // processes are waiting. Then turn them back off
    // to avoid a race between an interrupt and wfi.
    intr_on();
    intr_off();

    int found = 0;
    for(p = proc; p < &proc[NPROC]; p++) {
      acquire(&p->lock);
      if(p->state == RUNNABLE) {
        // Switch to chosen process.  It is the process's job
        // to release its lock and then reacquire it
        // before jumping back to us.
        p->state = RUNNING;
        c->proc = p;
        swtch(&c->context, &p->context);

        // Process is done running for now.
        c->proc = 0;
        found = 1;
      }
      release(&p->lock);
    }
    if(found == 0) {
      // nothing to run; stop running on this core until an interrupt.
      asm volatile("wfi");
    }
  }
}`}
<p>xv6 uses round robin across the process table, with a quantum of one timer tick: on every timer interrupt in user mode, <code>usertrap</code> calls <code>yield()</code>. Each CPU scans the same table, so runnable processes are shared among CPUs automatically. When nothing is runnable, the CPU executes <code>wfi</code> (wait for interrupt) to save power. Simple and fair, but with no priorities and no notion of interactive versus batch.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Optimising one metric</strong> and assuming the others follow; turnaround and response conflict.</li>
<li><strong>Quanta comparable to switch cost,</strong> wasting the CPU on overhead.</li>
<li><strong>Ignoring I/O:</strong> a CPU-bound policy that delays I/O-bound jobs leaves devices idle.</li>
<li><strong>Starvation:</strong> any policy that always prefers short or high-priority jobs needs a remedy for the others.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>By hand</summary><p>Three jobs arrive at time 0 with lengths 100, 10 and 10. Compute average turnaround under FIFO (in that order) and SJF.</p><p><em>Answer:</em> FIFO (100 + 110 + 120) / 3 = 110; SJF (10 + 20 + 120) / 3 = 50.</p></details>
<details><summary>RR response</summary><p>Five jobs of length 6 arrive at time 0. With RR and quantum 1, what is the average response time? Average turnaround?</p><p><em>Answer:</em> response (0+1+2+3+4)/5 = 2; turnaround (26+27+28+29+30)/5 = 28. Check with the simulator.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Find the crossover</summary><p>Using the simulator, find a job mix where RR gives better average turnaround than FIFO.</p><p><em>Answer sketch:</em> a long job arriving first followed by several short ones.</p></details>
<details><summary>Prediction</summary><p>Implement exponential averaging of burst lengths with α = 0.5 for bursts 6, 4, 6, 4, 13, 13, 13, starting from τ = 10. How quickly does the prediction adapt?</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Prove SJF optimal</summary><p>Prove that when all jobs arrive together, running them in order of increasing length minimises average turnaround. (Hint: exchange argument.)</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can define turnaround, response, fairness and overhead.</li>
<li>I can run FIFO, SJF, STCF and RR by hand and with the simulator.</li>
<li>I understand the convoy effect and the turnaround–response trade-off.</li>
<li>I know why overlapping I/O matters and why job lengths must be predicted.</li>
<li>I can read xv6's round-robin scheduler loop.</li>
</ul>
`});

CH.push({
  id: 'ch06', n: 6, title: 'Multi-Level Feedback, Proportional Share and Real Schedulers',
  lede: 'Real schedulers must do well for both interactive and batch work without knowing in advance which is which, share CPUs fairly between users and containers, and spread work across dozens of cores while respecting their caches. This chapter develops the multi-level feedback queue, which learns job behaviour by watching it; proportional-share scheduling with lotteries and strides; scheduling on multiprocessors; and how Linux actually schedules today, with EEVDF, real-time classes and the extensible sched_ext.',
  html: `
<h2>The multi-level feedback queue</h2>
${fig('mlfq', '<b>Figure 6.1</b> The rules of a multi-level feedback queue, applied to one CPU-bound and one interactive job.')}
<p>MLFQ approximates SJF without knowing job lengths: every job is assumed to be short until it proves otherwise. Variants have been used by BSD Unix, Solaris and Windows. Its parameters (number of queues, quantum per queue, allotment, boost period) are hard to tune, and earlier versions that reset a job's allotment whenever it gave up the CPU could be gamed by sleeping just before the quantum ended; accounting total time used at each level (Rule 4 as stated) closes that loophole.</p>

<h2>Proportional share</h2>
<p>Another goal is <em>fairness by share</em>: guarantee each job, user or container a fraction of the CPU.</p>
<ul>
<li><strong>Lottery scheduling:</strong> give each job tickets; each quantum, draw a random ticket and run its holder. Over time each job gets CPU in proportion to its tickets. Simple, needs almost no state, and handles new jobs naturally, but is only fair on average.</li>
<li><strong>Stride scheduling:</strong> the deterministic version. Each job has a stride inversely proportional to its tickets and a pass value; run the job with the smallest pass and add its stride. Exactly fair over short periods, but new arrivals need a sensible starting pass.</li>
</ul>
${fig('lottery', '<b>Figure 6.2</b> Lottery versus stride scheduling. Change the tickets and the number of quanta: lottery shares converge only over long runs; stride is exact from the start.')}

<h2>Multiprocessor scheduling</h2>
<p>With several CPUs, new problems appear:</p>
<ul>
<li><strong>Cache affinity:</strong> a process that last ran on CPU 2 has its data warm in CPU 2's caches. Moving it costs performance.</li>
<li><strong>One shared queue</strong> (as in xv6) is simple and balances load automatically, but every CPU contends for its lock, and jobs bounce between CPUs.</li>
<li><strong>Per-CPU queues</strong> scale and preserve affinity, but can become unbalanced, so the kernel migrates work: idle CPUs <em>steal</em> tasks from busy ones, and periodic balancing evens out load across the topology (cores sharing a cache first, then sockets, then NUMA nodes).</li>
<li><strong>Heterogeneous cores:</strong> laptops and phones mix fast and efficient cores; the scheduler places tasks by their needs and energy cost.</li>
</ul>
<p>Linux uses per-CPU run queues with hierarchical load balancing across "scheduling domains". Recent kernels add cache-aware scheduling (Linux 7.2, August 2026), which tries to keep tasks sharing data on CPUs that share a last-level cache.</p>

<h2>How Linux schedules</h2>
<p>Linux has several <strong>scheduling classes</strong>, consulted in priority order:</p>
<div class="tbl"><table><tr><th>Class</th><th>Policies</th><th>Use</th></tr>
<tr><td>Stop</td><td>internal</td><td>CPU hot-plug, migration</td></tr>
<tr><td>Deadline</td><td><code>SCHED_DEADLINE</code></td><td>Tasks with runtime, period and deadline guarantees (earliest deadline first)</td></tr>
<tr><td>Real-time</td><td><code>SCHED_FIFO</code>, <code>SCHED_RR</code></td><td>Fixed priorities 1–99; always beat normal tasks</td></tr>
<tr><td>Fair</td><td><code>SCHED_NORMAL</code>, <code>SCHED_BATCH</code>, <code>SCHED_IDLE</code></td><td>Everything else, using EEVDF</td></tr>
<tr><td>Extensible</td><td><code>SCHED_EXT</code></td><td>Policies written as BPF programs (sched_ext)</td></tr>
<tr><td>Idle</td><td>internal</td><td>Runs when nothing else can</td></tr>
</table></div>
<h3>From CFS to EEVDF</h3>
<p>From 2007 to 2023, normal tasks were scheduled by the Completely Fair Scheduler (CFS): each task accumulated <em>virtual runtime</em>, its actual runtime scaled by its weight, and the task with the smallest virtual runtime ran next, kept in a red-black tree (a structure from the data structures book). Weights come from the nice value: nice 0 is 1024, and each nice step changes weight by about 1.25×, so each step is roughly a 10% difference in CPU share.</p>
<p>Linux 6.6 (October 2023) replaced CFS's pick logic with <strong>EEVDF</strong> (Earliest Eligible Virtual Deadline First), completed in 6.12. It keeps the fair-share idea but handles latency explicitly:</p>
${fig('eevdf', '<b>Figure 6.3</b> EEVDF chooses among tasks that are owed CPU time the one with the earliest virtual deadline.')}
<h3>sched_ext</h3>
<p>Since Linux 6.12 (November 2024), <strong>sched_ext</strong> lets a BPF program implement the scheduling policy, loaded at run time without rebooting, and safely: if the BPF scheduler misbehaves, the kernel kicks it out and falls back to the fair class. Companies use it to experiment with policies for gaming, cloud and data-centre workloads; recent kernels (including Linux 7.3) extend it toward per-cgroup sub-schedulers.</p>
<h3>Real time</h3>
<p>Since Linux 6.12, the PREEMPT_RT patches are part of mainline, making nearly all kernel code preemptible and turning most spinlocks into sleeping locks, so high-priority real-time tasks see bounded latency. Real-time scheduling is about predictability, not speed.</p>
${code('Influencing the Linux scheduler', 'bash')`
nice -n 10 ./batch_job                 # lower priority (weight ~110 vs 1024)
chrt --fifo 50 ./control_loop          # real-time FIFO priority 50 (needs privilege)
taskset -c 2,3 ./service               # restrict to CPUs 2 and 3 (affinity)
cat /proc/$(pgrep service)/sched       # per-task scheduler statistics
# cgroup v2: give a container half of one CPU
echo "50000 100000" > /sys/fs/cgroup/app/cpu.max`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Real-time priority for ordinary services:</strong> a runaway SCHED_FIFO task can starve the whole system (Linux reserves 5% by default via throttling).</li>
<li><strong>Ignoring affinity and NUMA</strong> for latency-critical services.</li>
<li><strong>Treating nice as a hard limit;</strong> it sets relative shares, not caps. Use cgroup <code>cpu.max</code> for limits.</li>
<li><strong>Assuming CFS behaviour</strong> on modern kernels: EEVDF changed latency characteristics.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Stride by hand</summary><p>Jobs A, B, C have 100, 50 and 250 tickets; L = 10,000. Give their strides and the order of the first six runs.</p><p><em>Answer:</em> strides 100, 200, 40. Starting at pass 0 (ties by name): A, B, C, C, C, A, …</p></details>
<details><summary>Game MLFQ</summary><p>Explain how a job could monopolise an MLFQ that resets allotment whenever a job yields, and which rule stops it.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Add priorities to xv6</summary><p>Change xv6's scheduler to a two-level MLFQ: new processes start high; a process that uses a whole tick drops low; boost all every 100 ticks. Test with a CPU-bound loop and an interactive program.</p></details>
<details><summary>Measure nice</summary><p>On Linux, pin two CPU-bound loops to one core with nice 0 and nice 5. Measure their CPU shares with <code>top</code> and compare with the weight ratio.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Lottery variance</summary><p>For a job with 25% of tickets, compute the standard deviation of its share after 100 quanta (binomial). How many quanta until it is within 1% of its share with high probability?</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can state and apply the MLFQ rules and explain boosting and allotment accounting.</li>
<li>I can run lottery and stride scheduling and compare their fairness.</li>
<li>I understand cache affinity, per-CPU queues and load balancing.</li>
<li>I know Linux's scheduling classes, EEVDF's eligibility and deadlines, sched_ext and PREEMPT_RT.</li>
<li>I can influence Linux scheduling with nice, chrt, taskset and cgroups.</li>
</ul>
`});

CH.push({
  id: 'ch07', n: 7, title: 'Address Spaces and the Memory API',
  lede: 'Every process believes it has a large, private, contiguous memory starting at address zero. In reality it shares physical memory with every other process and the kernel. The address space is the abstraction that makes this work, and virtualising it is the job of the next five chapters. This chapter describes what an address space contains, how programs ask for memory, and the memory bugs that the abstraction cannot prevent.',
  html: `
<h2>The illusion</h2>
<p>Every address a program uses, every pointer it prints, is a <strong>virtual address</strong>. The hardware, under the kernel's control, translates each one to a physical address on every memory access. Virtualising memory gives:</p>
<ul>
<li><strong>Transparency:</strong> programs are written as if they had the machine to themselves.</li>
<li><strong>Protection:</strong> a process cannot name, let alone touch, another process's memory or the kernel's.</li>
<li><strong>Efficiency:</strong> translation happens in hardware on every access, and physical memory is allocated only where needed.</li>
</ul>
${code('Every process sees the same addresses', 'c')`
#include <stdio.h>
#include <stdlib.h>
#include <unistd.h>

int global = 7;
int main(void) {
    int *p = malloc(sizeof *p);
    printf("pid %d: code %p, global %p, heap %p, stack %p\n",
           getpid(), (void *)main, (void *)&global, (void *)p, (void *)&p);
    return 0;
}
// Without ASLR, two copies running at once print identical addresses,
// yet each has its own private global and heap.`}

<h2>What is in an address space</h2>
${fig('uas', '<b>Figure 7.1</b> The layout of a user address space in xv6 and in Linux.')}
<ul>
<li><strong>Text:</strong> machine code, mapped read-only and executable.</li>
<li><strong>Data and BSS:</strong> initialised and zero-initialised globals.</li>
<li><strong>Heap:</strong> dynamically allocated memory, growing upward.</li>
<li><strong>Stack:</strong> function frames, local variables and return addresses, growing downward. Each thread has its own.</li>
<li><strong>Memory-mapped regions:</strong> shared libraries, files mapped with <code>mmap</code>, shared memory.</li>
</ul>

<h2>Asking for memory</h2>
<p>Most programs use a user-space allocator (<code>malloc</code> and <code>free</code> in C, <code>new</code> and the garbage collector in Java). The allocator asks the kernel for large chunks and subdivides them:</p>
${fig('heapgrow', '<b>Figure 7.2</b> malloc gets memory from the kernel in large pieces and hands it out in small ones.')}
<ul>
<li><code>sbrk(n)</code> / <code>brk</code> move the end of the heap. xv6 has only sbrk, with an extra argument choosing eager or lazy allocation.</li>
<li><code>mmap(NULL, len, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0)</code> maps fresh zeroed pages anywhere; glibc uses it for allocations above 128 KB, and <code>munmap</code> returns them to the kernel.</li>
<li>Modern allocators (jemalloc, tcmalloc, mimalloc, glibc's ptmalloc) keep per-thread caches and size classes to avoid locks and fragmentation. The JVM reserves its heap with mmap and manages objects itself.</li>
</ul>
<p>On Linux, mapping memory does not allocate physical pages: they are allocated on first touch by page faults (Chapter 12). That is why a process can allocate more than the machine has and fail only when it uses it.</p>

<h2>Memory bugs</h2>
<p>Virtual memory protects processes from each other, not from themselves. In unsafe languages these bugs remain the largest source of security vulnerabilities:</p>
<div class="tbl"><table><tr><th>Bug</th><th>Example</th><th>Consequence</th></tr>
<tr><td>Forgetting to allocate</td><td><code>char *s; strcpy(s, "hi");</code></td><td>Write through an uninitialised pointer</td></tr>
<tr><td>Not allocating enough</td><td><code>malloc(strlen(s))</code> then <code>strcpy</code></td><td>Buffer overflow by one byte (the terminating NUL)</td></tr>
<tr><td>Uninitialised read</td><td><code>int *a = malloc(n); sum += a[0];</code></td><td>Garbage values, information leaks</td></tr>
<tr><td>Memory leak</td><td>malloc in a loop without free</td><td>Growth until out of memory in long-running servers</td></tr>
<tr><td>Use after free</td><td><code>free(p); p->x = 1;</code></td><td>Corrupts reused memory; a favourite exploit primitive</td></tr>
<tr><td>Double free</td><td><code>free(p); free(p);</code></td><td>Allocator corruption</td></tr>
</table></div>
${code('Finding them', 'bash')`
gcc -g -fsanitize=address,undefined prog.c && ./a.out     # AddressSanitizer: fast, compile-time instrumentation
valgrind --leak-check=full ./prog                          # no recompilation, slower`}
<p>Memory-safe languages remove these classes of bug; this is the main reason Rust is now accepted in the Linux kernel and why government security agencies recommend memory-safe languages for new code.</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"malloc is a system call."</strong> Usually it is not.</li>
<li><strong>"free returns memory to the OS."</strong> Usually only to the allocator's pool.</li>
<li><strong>"A pointer value is a physical address."</strong> Never, in user space.</li>
<li><strong>"If malloc succeeded, the memory exists."</strong> On Linux with overcommit, physical pages arrive only when touched.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Same address, different data</summary><p>Run the program above twice concurrently with ASLR disabled (<code>setarch -R</code>). Why can both print the same address for <code>global</code> while holding different values?</p></details>
<details><summary>Spot the bug</summary><p><code>char *dup(char *s){ char *d = malloc(strlen(s)); strcpy(d, s); return d; }</code></p><p><em>Answer:</em> one byte too few; allocate strlen(s) + 1.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Watch sbrk</summary><p>In xv6, print the result of <code>sbrk(0)</code> before and after several mallocs of different sizes in a user program. How often does malloc call sbrk? (Read user/umalloc.c.)</p></details>
<details><summary>pmap</summary><p>On Linux, run <code>pmap -x</code> on a Java process and identify the heap, thread stacks, mapped JAR files and native libraries.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Overcommit</summary><p>On a test VM, write a program that mallocs 2× physical RAM without touching it, then touches it page by page. What happens, and which kernel component acts?</p><p><em>Answer sketch:</em> allocation succeeds; touching triggers page faults; eventually the OOM killer terminates a process.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain the goals of virtualising memory.</li>
<li>I can draw the address space of an xv6 and a Linux process.</li>
<li>I know how malloc, sbrk and mmap relate.</li>
<li>I can recognise common memory bugs and the tools that find them.</li>
</ul>
`});

CH.push({
  id: 'ch08', n: 8, title: 'Address Translation: Base, Bounds and Segments',
  lede: 'How can the hardware turn each virtual address a program uses into a physical one, quickly and under the kernel\'s control? This chapter builds the answer up from the simplest scheme, a base and a bounds register, through segmentation, which was the main approach on early machines and survives in vestigial form on x86. Seeing where these schemes break down, especially external fragmentation, motivates paging in Chapter 10.',
  html: `
<h2>Dynamic relocation: base and bounds</h2>
<p>Give each CPU two privileged registers. On every memory access, the hardware computes <code>physical = base + virtual</code> and checks <code>virtual &lt; bounds</code>; a failed check raises an exception. The kernel sets the registers for each process at context-switch time. The program can be loaded anywhere in physical memory and cannot reach outside its region.</p>
${fig('bb', '<b>Figure 8.1</b> Base-and-bounds translation. Change the registers or the virtual address; try an address beyond the bounds.')}
<p>The kernel's jobs: find free physical memory for a new process (a free list), save and restore base and bounds on context switch, move a process by copying its memory and changing base, and handle the exceptions. The hardware is tiny: an adder and a comparator in the memory management unit (MMU).</p>
<p>The weakness: the whole address space must be contiguous in physical memory, including the unused gap between heap and stack. A process with a large, sparse address space wastes memory.</p>

<h2>Segmentation</h2>
<p>Instead of one base and bounds per process, have one per logical <strong>segment</strong>: code, heap, stack. The top bits of the virtual address select the segment; the rest is an offset into it. The stack segment grows downward, so its offset is negative. Segments can also carry protection bits (code read-only and executable) and can be shared between processes (one copy of library code).</p>
${fig('seg', '<b>Figure 8.2</b> A segmented 16 KB address space with 4 KB per segment. Try a stack address such as 15360, and an address beyond the heap\'s 3 KB.')}
<p>The famous "segmentation fault" message comes from this era: an access outside any valid segment. Modern systems still print it for invalid accesses, though they use paging.</p>

<h2>The fragmentation problem</h2>
${fig('frag', '<b>Figure 8.3</b> External fragmentation: plenty of free memory in total, but no single hole big enough.')}
<p>Variable-sized allocations of physical memory leave holes of all sizes. Over time free memory becomes fragmented, and a request can fail even though enough memory is free in total. Compaction (moving segments together) fixes it but costs copying and stops processes. Free-list policies such as best fit reduce but cannot eliminate it, as the next chapter shows.</p>

<h2>Where segmentation survives</h2>
<p>x86 was built around segmentation. In 64-bit mode, segment bases are forced to zero and limits ignored for code and data, so memory is effectively flat; only the FS and GS segment bases remain useful, and operating systems use them to point at per-thread (thread-local storage) and per-CPU data. RISC-V and ARM have no segmentation at all. The protection and sharing ideas of segments live on as attributes of page-table entries and of memory regions (Linux's <code>vm_area_struct</code>).</p>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"Translation is done by the kernel."</strong> The hardware translates every access; the kernel only sets it up and handles exceptions.</li>
<li><strong>"Segmentation faults mean segmentation."</strong> The name stuck; modern systems use paging.</li>
<li><strong>"More free memory prevents allocation failure."</strong> Not with variable-sized allocation and fragmentation.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Translate</summary><p>Base 20,000, bounds 4,000. Translate virtual addresses 0, 3,999, 4,000 and 1,234.</p><p><em>Answer:</em> 20,000; 23,999; fault; 21,234.</p></details>
<details><summary>Stack segment</summary><p>In Figure 8.2, which virtual address maps to the lowest valid stack byte, physical 26,624?</p><p><em>Answer:</em> offset −2,048, so binary 11 followed by 4096 − 2048 = 2048: virtual 12288 + 2048 = 14336.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Context switch duties</summary><p>List every register the kernel must save and restore at a context switch on a segmented machine with three segments, and explain why user code must not be able to change them.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Fragmentation simulation</summary><p>Simulate allocating and freeing random-sized segments under first fit and best fit. Measure how often requests fail while total free memory exceeds the request.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can translate addresses with base and bounds and explain the protection check.</li>
<li>I know the kernel's responsibilities for dynamic relocation.</li>
<li>I can translate segmented addresses, including a downward-growing stack.</li>
<li>I can explain external fragmentation and why it motivates paging.</li>
<li>I know what is left of segmentation on modern x86.</li>
</ul>
`});

CH.push({
  id: 'ch09', n: 9, title: 'Free-Space Management',
  lede: 'Every memory manager, from malloc in a C library to the kernel\'s page allocator, must track which memory is free and choose where to place each request. The choices determine speed, memory overhead and fragmentation. This chapter covers free lists and the classic placement policies with a simulator, then the specialised designs real systems use: buddy allocation for pages, slab allocators for kernel objects, and xv6\'s minimalist page allocator.',
  html: `
<h2>The problem</h2>
<p>An allocator receives requests of arbitrary sizes in arbitrary order and must return memory that does not overlap any live allocation. It cannot move allocated memory (C programs hold raw pointers), so once fragmentation happens it cannot compact. It must also be fast: allocators are called millions of times per second.</p>
<ul>
<li><strong>External fragmentation:</strong> free memory split into holes too small to use (Chapter 8).</li>
<li><strong>Internal fragmentation:</strong> memory handed out but unused, because requests are rounded up.</li>
</ul>

<h2>Free lists and placement policies</h2>
<p>A simple allocator keeps a linked list of free regions, stored inside the free memory itself (each free region begins with its size and a next pointer). Each allocated block carries a small header with its size, so <code>free(p)</code> knows how much to return. Freed regions are <strong>coalesced</strong> with free neighbours to rebuild large holes.</p>
${fig('allocsim', '<b>Figure 9.1</b> A free-list allocator simulator. Edit the operations and compare placement policies: which ones fail, and how fragmented does the free list become?')}
<div class="tbl"><table><tr><th>Policy</th><th>Choose</th><th>Behaviour</th></tr>
<tr><td>First fit</td><td>The first hole large enough</td><td>Fast; small fragments accumulate at the start of the list</td></tr>
<tr><td>Next fit</td><td>The first hole after the previous allocation</td><td>Spreads allocations; similar fragmentation</td></tr>
<tr><td>Best fit</td><td>The smallest hole large enough</td><td>Leaves tiny, useless slivers; needs a full search unless indexed</td></tr>
<tr><td>Worst fit</td><td>The largest hole</td><td>Keeps leftovers large; poor in practice</td></tr>
</table></div>
<p>No policy is best for all request patterns. Real allocators use <strong>segregated lists</strong>: separate free lists for common size classes (16, 32, 48 … bytes), so most requests are a constant-time pop, and only large requests use a general algorithm. Per-thread caches avoid locking.</p>

<h2>Buddy allocation</h2>
${fig('buddy', '<b>Figure 9.2</b> A binary buddy allocator splitting and merging power-of-two blocks.')}
<p>The buddy system rounds requests to powers of two and splits blocks in halves. Coalescing is trivial: a block's buddy is at address XOR size. The cost is internal fragmentation of up to half a block. Linux's physical page allocator is a buddy allocator over "orders" of 2⁰ to 2¹⁰ pages (4 KB to 4 MB), which you can see in <code>/proc/buddyinfo</code>.</p>

<h2>Slab allocation</h2>
<p>Kernels allocate huge numbers of fixed-size objects: inodes, process structures, network buffers. A <strong>slab allocator</strong> keeps caches of each object type, carved from pages: allocation and free are a pointer pop and push, objects of one type sit together (good for caches), and constructors need not run again for recycled objects. Linux uses SLUB (and since Linux 6.8 it is the only slab implementation); <code>/proc/slabinfo</code> and <code>slabtop</code> show the caches.</p>

<h2>xv6's page allocator</h2>
${code('kernel/kalloc.c (abridged)', 'c')`
struct run {
  struct run *next;
};

struct {
  struct spinlock lock;
  struct run *freelist;
} kmem;

void
kfree(void *pa)
{
  struct run *r;

  if(((uint64)pa % PGSIZE) != 0 || (char*)pa < end || (uint64)pa >= PHYSTOP)
    panic("kfree");

  // Fill with junk to catch dangling refs.
  memset(pa, 1, PGSIZE);

  r = (struct run*)pa;

  acquire(&kmem.lock);
  r->next = kmem.freelist;
  kmem.freelist = r;
  release(&kmem.lock);
}

void *
kalloc(void)
{
  struct run *r;

  acquire(&kmem.lock);
  r = kmem.freelist;
  if(r)
    kmem.freelist = r->next;
  release(&kmem.lock);

  if(r)
    memset((char*)r, 5, PGSIZE); // fill with junk
  return (void*)r;
}`}
<p>xv6 allocates only whole 4 KB pages, so a single free list suffices: no fragmentation, no headers, the list node lives in the free page itself. Filling freed pages with 1s and new pages with 5s makes use of uninitialised or freed memory show up as obvious garbage. One global lock means CPUs contend; a classic xv6 lab asks you to give each CPU its own free list and steal from others when empty, which is exactly what production allocators do.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Assuming best fit is best.</strong> It often fragments worse than first fit.</li>
<li><strong>Forgetting coalescing,</strong> so the heap splinters permanently.</li>
<li><strong>A single global lock</strong> in a multi-threaded allocator.</li>
<li><strong>Ignoring internal fragmentation</strong> of power-of-two schemes for odd sizes.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Run the simulator</summary><p>With the default operations, which policies fail a request? Why?</p><p><em>Answer:</em> worst fit and next fit fail the final a25: they carved the 12 and 18 out of the large free regions, leaving no 25-unit hole, while first and best fit placed them in the holes left by the frees.</p></details>
<details><summary>Buddy address</summary><p>In a buddy system, where is the buddy of the 8 KB block at offset 40 KB? Of the 16 KB block at offset 32 KB?</p><p><em>Answer:</em> 40 XOR 8 = 32 KB; 32 XOR 16 = 48 KB.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Per-CPU kalloc</summary><p>Implement per-CPU free lists in xv6's kalloc.c with stealing, and measure lock contention with the lab's test (the "Lock" lab).</p></details>
<details><summary>buddyinfo</summary><p>Read <code>/proc/buddyinfo</code> on a busy Linux server. Which orders are scarce, and what would fail if a driver needed a 2 MB physically contiguous buffer?</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Write malloc</summary><p>Implement malloc and free with a segregated free list for sizes up to 256 bytes and a first-fit list with coalescing above that, using sbrk. Test with random workloads.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain internal and external fragmentation.</li>
<li>I can describe a free list with headers and coalescing, and compare placement policies.</li>
<li>I understand segregated lists and per-thread caches.</li>
<li>I can run buddy splitting and merging, and know Linux uses it for pages.</li>
<li>I know what slab allocators do and how xv6's kalloc works.</li>
</ul>
`});

CH.push({
  id: 'ch10', n: 10, title: 'Paging and Page Tables',
  lede: 'Paging divides virtual and physical memory into fixed-size pages, typically 4 KB, and maps each virtual page to any physical frame. Fixed sizes end external fragmentation, sparse address spaces cost nothing for their unused parts, and each page carries its own permissions. The price is a mapping table per process and a lookup on every memory access. This chapter builds paging up from a toy example to RISC-V\'s three-level Sv39 scheme, with an interactive page walk and xv6\'s code.',
  html: `
<h2>The idea</h2>
${fig('pagemap', '<b>Figure 10.1</b> Paging on a toy machine. Virtual pages map to arbitrary physical frames; the offset within the page is unchanged.')}
<p>A virtual address splits into a <strong>virtual page number</strong> (VPN) and an <strong>offset</strong>. The MMU looks up the VPN in the current process's page table to find the <strong>physical frame number</strong> (PFN, or PPN in RISC-V's terms) and appends the offset. Each entry also has permission bits; an access that violates them, or touches an unmapped page, raises a <strong>page fault</strong>.</p>
<p>Because every page is the same size, any free frame can hold any page: no external fragmentation. Internal fragmentation is at most part of one page per region.</p>

<h2>The size problem</h2>
<p>A flat (linear) page table needs one entry per virtual page. With 39-bit addresses and 4 KB pages, that is 2²⁷ entries of 8 bytes: 1 GB per process, almost all of it describing unused addresses. The solution is to make the page table itself sparse with a tree: a <strong>multi-level page table</strong>. Only the parts of the tree covering used regions exist.</p>

<h2>RISC-V Sv39</h2>
<p>Sv39 uses three levels. A 39-bit virtual address has three 9-bit indices and a 12-bit offset. Each level is a 4 KB page holding 512 eight-byte entries, so every page-table page is itself exactly one page: elegant and easy to allocate. The <code>satp</code> register holds the physical page number of the root.</p>
${fig('sv39', '<b>Figure 10.2</b> An Sv39 page walk. Enter a virtual address or pick one: see its indices, the entry used at each level, and the physical address or the level at which it faults.')}
${fig('pte', '<b>Figure 10.3</b> The format of an Sv39 page table entry.')}
<p>A PTE with R, W and X all zero points to the next level; any of them set marks a leaf. A leaf at level 1 maps a 2 MB <strong>megapage</strong>, and at level 2 a 1 GB gigapage, which is how kernels map large regions with few entries (Linux calls these huge pages). Sv48 and Sv57 add a fourth and fifth level for larger address spaces; x86-64 uses the same four-level structure, with five levels optional, and ARM64 is similar.</p>

<h2>Page tables in xv6</h2>
<p>xv6 has one page table per process for user space and one kernel page table shared by all CPUs. The kernel maps physical memory and devices <em>directly</em>, so the kernel virtual address of a physical page equals its physical address, which makes page-table code simple. Above that it maps the trampoline and each process's kernel stack with guard pages.</p>
${code('kernel/vm.c: walk()', 'c')`
// Return the address of the PTE in page table pagetable
// that corresponds to virtual address va.  If alloc!=0,
// create any required page-table pages.
pte_t *
walk(pagetable_t pagetable, uint64 va, int alloc)
{
  if(va >= MAXVA)
    panic("walk");

  for(int level = 2; level > 0; level--) {
    pte_t *pte = &pagetable[PX(level, va)];
    if(*pte & PTE_V) {
      pagetable = (pagetable_t)PTE2PA(*pte);
    } else {
      if(!alloc || (pagetable = (pde_t*)kalloc()) == 0)
        return 0;
      memset(pagetable, 0, PGSIZE);
      *pte = PA2PTE(pagetable) | PTE_V;
    }
  }
  return &pagetable[PX(0, va)];
}`}
<p><code>PX(level, va)</code> extracts the 9-bit index for a level: <code>(va &gt;&gt; (12 + 9 * level)) &amp; 0x1FF</code>. <code>mappages</code> uses walk to install leaf PTEs; <code>uvmalloc</code>, <code>uvmcopy</code> (used by fork) and <code>uvmunmap</code> build on them. xv6 sets <code>MAXVA</code> to 2³⁸ rather than 2³⁹ to avoid having to sign-extend addresses with the top bit set.</p>
<p>After changing a page table, the kernel must flush stale translations from the TLB with <code>sfence.vma</code> (Chapter 11). Switching processes means writing a new root into <code>satp</code>.</p>

<h2>What Linux adds</h2>
<ul>
<li><strong>Huge pages:</strong> transparent huge pages (THP) use 2 MB mappings automatically for large anonymous regions; hugetlbfs gives explicit 2 MB or 1 GB pages for databases and VMs.</li>
<li><strong>Folios:</strong> the memory manager tracks groups of contiguous pages as one unit, reducing overhead and enabling larger page-cache allocations.</li>
<li><strong>Kernel page-table isolation (KPTI):</strong> after the Meltdown vulnerability (2018), affected x86 CPUs run user code with a page table that maps almost none of the kernel (Chapter 24).</li>
</ul>

<h2>Common misconceptions</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"Page tables live in the MMU."</strong> They live in ordinary memory; the MMU walks them (and caches results in the TLB).</li>
<li><strong>"Each process's page table is huge."</strong> Multi-level tables are proportional to the memory actually mapped.</li>
<li><strong>"The offset is translated."</strong> Only the page number is.</li>
<li><strong>"Kernel addresses are physical."</strong> True in xv6's direct map, but kernels use virtual addresses too.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Split an address</summary><p>Split Sv39 virtual address 0x403A7C into its indices and offset. Check with Figure 10.2.</p><p><em>Answer:</em> VPN[2] 0, VPN[1] 2, VPN[0] 3, offset 0xA7C.</p></details>
<details><summary>Table size</summary><p>A process maps 8 KB of code at address 0 and 8 KB of stack just below 0x40000000. How many page-table pages does Sv39 need?</p><p><em>Answer:</em> root, plus one level-1 and one level-0 table for each region (they share VPN[2] = 0 and the root's entry, but have different VPN[1]): 1 + 1 + 2 = 4 pages.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Print a page table</summary><p>Implement <code>vmprint()</code> in xv6 to print the page table of the first process after exec, as in the page tables lab. Identify text, data, guard, stack, trapframe and trampoline.</p></details>
<details><summary>USYSCALL</summary><p>Speed up <code>getpid()</code> in xv6 by mapping a read-only page shared with the kernel into each process, as in the lab. Which PTE flags must it have?</p><p><em>Answer:</em> R and U, not W.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Superpages</summary><p>Change xv6 to map the kernel's direct map with 2 MB megapages where alignment allows. How many page-table pages does it save, and what must walk() do differently?</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can translate an address with a page table and explain the offset.</li>
<li>I can explain why linear page tables are too big and how multi-level tables fix it.</li>
<li>I can walk an Sv39 address through three levels and read a PTE.</li>
<li>I can read xv6's walk() and know how it builds and uses page tables.</li>
<li>I know huge pages, folios and KPTI in Linux.</li>
</ul>
`});
