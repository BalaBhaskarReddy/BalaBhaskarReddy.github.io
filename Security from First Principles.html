CH.push({
  id: 'ch04', n: 4, title: 'Block Ciphers and AES',
  lede: 'A block cipher encrypts a fixed-size block, such as 16 bytes, under a key. It is the workhorse primitive behind disk encryption, TLS, payment cryptography and most of what follows in this book. This chapter defines what a secure block cipher is, explains the two classic ways to build one, tells the story of DES and why its key was too short, and then walks through one round of AES byte by byte on the official test vector.',
  html: `
<h2>What a block cipher is</h2>
<p>A block cipher is a pair of functions, encryption E and decryption D, that take an <i>n</i>-bit block and a key:</p>
<div class="formula">E : K × {0,1}<sup>n</sup> → {0,1}<sup>n</sup>          D(k, E(k, x)) = x</div>
<p>For AES, n = 128 bits and the key is 128, 192 or 256 bits. Because every block must decrypt uniquely, E(k, ·) must map distinct inputs to distinct outputs. For each fixed key it is a <strong>permutation</strong> of the 2<sup>n</sup> possible blocks: a reshuffling of all blocks. The key chooses which reshuffle.</p>
${fig('prp', '<b>Figure 4.1</b> A block cipher is a family of permutations indexed by the key. Switch keys to see a different permutation of the same blocks.')}
<p>A block cipher on its own encrypts only one block. Encrypting longer messages safely is the job of a <strong>mode of operation</strong> (Chapter 5). Think of the block cipher as an engine and the mode as the car built around it.</p>

<h2>What "secure" means: pseudorandom permutations</h2>
<p>The ideal is that E(k, ·) for a random key looks like a permutation chosen completely at random from all (2<sup>n</sup>)! permutations. We cannot have that literally, since a 128-bit key can pick at most 2<sup>128</sup> of them, but we can ask that no efficient adversary tell the difference.</p>
<p>The <strong>PRP game</strong>: the challenger either picks a random key and answers the adversary's queries x with E(k, x), or picks a truly random permutation π and answers with π(x). The adversary sends as many queries as it likes, adaptively, and must say which world it is in. E is a secure <strong>pseudorandom permutation</strong> (PRP) if every efficient adversary has negligible advantage. A <em>strong</em> PRP stays indistinguishable even if the adversary can also query decryption.</p>
<p>A closely related object is a <strong>pseudorandom function</strong> (PRF), which need not be invertible and should be indistinguishable from a random function. The <em>PRP/PRF switching lemma</em> says that a secure PRP is also a secure PRF as long as the number of queries q stays well below 2<sup>n/2</sup>. Beyond that, a random function would start producing repeated outputs (by the birthday paradox, Chapter 7) while a permutation never does. For 128-bit blocks, 2<sup>64</sup> blocks is about 295 exabytes, far beyond any single key's use. For 64-bit blocks it is only 32 GB, which matters below.</p>
<div class="note key"><b>Key idea</b><p>Cryptographers treat a good block cipher as if it were a random permutation for each key. Every mode and construction in later chapters is proved secure under exactly that assumption.</p></div>

<h2>Confusion and diffusion</h2>
<p>Shannon named the two properties a cipher needs. <strong>Confusion</strong>: the relationship between key and ciphertext should be complex, so each ciphertext bit depends on the key in a non-linear way. <strong>Diffusion</strong>: each plaintext bit should affect many ciphertext bits, so statistical patterns in the plaintext spread out and vanish. A good block cipher shows an <strong>avalanche effect</strong>: flipping one bit of input or key flips each output bit with probability about ½.</p>
<p>No single simple operation achieves both. Ciphers therefore iterate a <em>round function</em> many times, each round adding a little confusion and diffusion, with a different <em>round key</em> derived from the main key by a <em>key schedule</em>. The two standard ways to build round functions are Feistel networks and substitution-permutation networks.</p>

<h2>Feistel networks</h2>
<p>Horst Feistel's design at IBM splits the block into left and right halves. Each round computes a function F of the right half and the round key, XORs it into the left half, then swaps the halves:</p>
<div class="formula">Lᵢ₊₁ = Rᵢ          Rᵢ₊₁ = Lᵢ ⊕ F(Kᵢ, Rᵢ)</div>
${fig('feistel', '<b>Figure 4.2</b> One Feistel round. The structure is invertible whatever F is, because F is only ever XORed in.')}
<p>The beauty is that F never needs to be inverted. To decrypt, compute Rᵢ = Lᵢ₊₁ and then Lᵢ = Rᵢ₊₁ ⊕ F(Kᵢ, Lᵢ₊₁): the same structure with the round keys in reverse order. Luby and Rackoff proved in 1988 that three Feistel rounds with a pseudorandom function F give a secure PRP, and four give a strong PRP. Real ciphers use many more rounds because their F is far from ideal.</p>

<h2>DES and the problem of key length</h2>
<p>The Data Encryption Standard (DES), published in 1977, was a 16-round Feistel cipher with 64-bit blocks and a 56-bit key. Its design held up remarkably well against cryptanalysis. <strong>Differential cryptanalysis</strong>, published by Biham and Shamir around 1990, studies how input differences propagate to output differences; it turned out IBM had known of it in 1974 and designed DES's S-boxes to resist it. <strong>Linear cryptanalysis</strong> (Matsui, 1993) finds linear approximations of the cipher and needs about 2<sup>43</sup> known plaintexts to break DES, which is impractical.</p>
<p>DES failed not through cleverness but through its key length. 2<sup>56</sup> is about 7 × 10<sup>16</sup>, within reach of dedicated hardware. In 1998 the Electronic Frontier Foundation built "Deep Crack" for about $250,000 and found a DES key in 56 hours. Today a cloud GPU cluster does it in hours.</p>
<h3>Why not double DES?</h3>
<p>Encrypting twice with two independent keys, c = E(k₂, E(k₁, m)), looks like 112 bits of key. It is not, because of a <strong>meet-in-the-middle attack</strong>. Given one known plaintext-ciphertext pair, compute E(k₁, m) for every k₁ and store the results in a table. Then compute D(k₂, c) for every k₂ and look each one up. A match reveals both keys. That is about 2 × 2<sup>56</sup> operations plus a large table, barely harder than single DES.</p>
${fig('mitm', '<b>Figure 4.3</b> Meet in the middle against double encryption. Working forward from m and backward from c meets at the middle value, so the keys are found separately.')}
<p>Triple DES (E(k₁, D(k₂, E(k₃, m)))) defeats this, achieving about 112-bit security with three keys. It was the stopgap for two decades, notably in payment systems. Its 64-bit block became its downfall: the <strong>Sweet32</strong> attack (2016) collected about 2<sup>32</sup> blocks, around 32 GB of HTTPS traffic, until two ciphertext blocks collided, which leaks the XOR of two plaintext blocks and let researchers recover session cookies. NIST disallowed Triple DES for encryption after 2023.</p>

<h2>AES</h2>
<p>In 1997 NIST ran an open competition for a successor. Fifteen designs from around the world were submitted and publicly attacked for three years. In 2000 NIST chose <strong>Rijndael</strong>, by Belgian cryptographers Joan Daemen and Vincent Rijmen, published in 2001 as FIPS 197, the Advanced Encryption Standard. The open process is a model for the post-quantum competition in Chapter 15.</p>
<p>AES has a 128-bit block and keys of 128, 192 or 256 bits, using 10, 12 or 14 rounds respectively. It is a <strong>substitution-permutation network</strong>, not a Feistel cipher: every round transforms the whole state, and each step is individually invertible. The state is a 4 × 4 grid of bytes, filled column by column. Each round applies four steps:</p>
<ol>
<li><strong>SubBytes:</strong> each byte goes through a fixed 256-entry S-box. This is the only non-linear step and provides confusion.</li>
<li><strong>ShiftRows:</strong> row r of the grid is rotated left by r positions, moving bytes between columns.</li>
<li><strong>MixColumns:</strong> each column is multiplied by a fixed 4 × 4 matrix, so every output byte of a column depends on all four input bytes. With ShiftRows this provides diffusion: after two rounds, every output bit depends on every input bit.</li>
<li><strong>AddRoundKey:</strong> the state is XORed with a 128-bit round key.</li>
</ol>
<p>An extra AddRoundKey comes before the first round, and the last round omits MixColumns (which would add nothing an attacker could not undo). Figure 4.4 walks through the first round on the official FIPS-197 test vector; the values are computed live, so you can check them against the standard.</p>
${fig('aesround', '<b>Figure 4.4</b> The first round of AES-128 on the FIPS-197 example, step by step. Highlighted bytes show what each step touches.')}
<h3>The arithmetic underneath</h3>
<p>AES treats bytes as elements of the finite field GF(2<sup>8</sup>): polynomials of degree below 8 with coefficients 0 or 1, added by XOR and multiplied modulo the irreducible polynomial x<sup>8</sup> + x<sup>4</sup> + x<sup>3</sup> + x + 1. Every non-zero byte has a multiplicative inverse. The S-box maps each byte to its inverse (0 maps to 0) and then applies a fixed affine transformation; inversion is maximally non-linear, which is what makes differential and linear cryptanalysis fail. MixColumns' matrix uses only the coefficients 1, 2 and 3, which are cheap to multiply: multiplying by 2 is a left shift and a conditional XOR with 0x1b.</p>
<p>Because the design is so regular, AES's security can be argued: the "wide trail strategy" proves that any differential or linear characteristic over four rounds involves at least 25 active S-boxes, making such attacks far more expensive than brute force.</p>
<h3>How secure is AES today?</h3>
<p>After 25 years of intense study, the best attack on full AES-128 is a biclique attack (2011) requiring about 2<sup>126.1</sup> operations, a factor of four better than brute force and of no practical consequence. Related-key attacks on AES-256 exist in theory but require keys related in ways that do not occur in properly designed systems. Grover's quantum algorithm (Chapter 15) would halve the effective key length, which is one reason AES-256 is preferred for data that must stay secret for decades.</p>
<div class="tbl"><table><tr><th>Cipher</th><th>Block</th><th>Key</th><th>Status</th></tr>
<tr><td>DES</td><td class="num">64</td><td class="num">56</td><td>Broken by brute force (1998)</td></tr>
<tr><td>Triple DES</td><td class="num">64</td><td class="num">168 (≈112 effective)</td><td>Disallowed by NIST after 2023; 64-bit block too small</td></tr>
<tr><td>AES-128</td><td class="num">128</td><td class="num">128</td><td>Secure; default choice</td></tr>
<tr><td>AES-256</td><td class="num">128</td><td class="num">256</td><td>Secure; preferred for long-term and post-quantum margin</td></tr>
</table></div>

<h2>Implementation matters: side channels</h2>
<p>The mathematics of AES is sound; implementations have leaked keys. Fast software AES used large lookup tables ("T-tables") indexed by key-dependent bytes. Which table entries are in the CPU cache depends on the key, and an attacker on the same machine can measure cache timing to recover it. Bernstein demonstrated a remote timing attack on OpenSSL's AES in 2005; Osvik, Shamir and Tromer recovered full keys from cache measurements in 2006. Power consumption and electromagnetic emissions of smart cards and HSMs leak similarly, which is why payment cards and HSMs are certified against such attacks.</p>
<p>The fix on modern CPUs is hardware support. Intel and AMD's <strong>AES-NI</strong> instructions (since 2010) and ARMv8's cryptography extensions perform AES rounds in constant time without tables, and run at a few gigabytes per second per core. Java uses them automatically through HotSpot intrinsics. On hardware without them, prefer ChaCha20 or a bitsliced constant-time AES implementation.</p>

<h2>In code</h2>
<p>Java's <code>Cipher</code> API exposes AES through modes. To see the raw block cipher, encrypt one block in ECB mode with no padding and compare with FIPS-197. This is the <em>only</em> legitimate use of ECB in this book: testing.</p>
${code('AesBlock.java')`import java.util.HexFormat;
import javax.crypto.Cipher;
import javax.crypto.KeyGenerator;
import javax.crypto.SecretKey;
import javax.crypto.spec.SecretKeySpec;

public final class AesBlock {
    public static void main(String[] args) throws Exception {
        HexFormat hex = HexFormat.of();
        byte[] key = hex.parseHex("000102030405060708090a0b0c0d0e0f");
        byte[] pt  = hex.parseHex("00112233445566778899aabbccddeeff");

        Cipher aes = Cipher.getInstance("AES/ECB/NoPadding");   // one raw block: test use only
        aes.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(key, "AES"));
        System.out.println(hex.formatHex(aes.doFinal(pt)));
        // 69c4e0d86a7b0430d8cdb78070b4c55a  (FIPS-197 Appendix C.1)

        // Real keys come from a CSPRNG (or a KMS, Chapter 18), never from a password directly.
        KeyGenerator kg = KeyGenerator.getInstance("AES");
        kg.init(256);
        SecretKey k = kg.generateKey();
        System.out.println(k.getEncoded().length * 8 + "-bit key");
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Using a block cipher directly on data.</strong> That is ECB mode, which leaks patterns (Chapter 5).</li>
<li><strong>Keeping 64-bit block ciphers.</strong> Triple DES and Blowfish fall to birthday attacks after tens of gigabytes per key. Migrate legacy payment and mainframe links to AES.</li>
<li><strong>Turning a password into a key with a plain hash.</strong> Use a key derivation function designed for passwords (Chapter 13).</li>
<li><strong>Table-based software AES</strong> on shared machines without hardware support. Use the platform's constant-time implementation.</li>
</ul></div>

<h2>Practice</h2>

<details><summary>Implement AES-128</summary><p>Implement AES-128 encryption in Java (S-box from GF(2⁸) inversion, ShiftRows, MixColumns, key expansion) and verify all ten rounds against FIPS-197 Appendix C.1. Then measure it against the JDK's AES-NI version.</p></details>
<details><summary>Luby-Rackoff</summary><p>Show that a two-round Feistel network with random functions is not a PRP: find a distinguisher using two queries whose left halves differ and right halves are equal.</p></details></div>

<h2>Checkpoint</h2>

<li>I can explain confusion, diffusion and the avalanche effect.</li>

    s += tx(x0 + 8 * c, 140, f.pos == null ? (f.k ? 'block recovered' : 'oracle: "bad padding" / "ok"') : `oracle says "ok" at g = ${h2(f.g)}: padding ${Array(f.pad).fill(h2(f.pad)).join(' ')}`, 'tp ' + (f.pos == null ? 'cmp' : 'ok'));
    return { s, w: x0 + 16 * c + 4, h: 152 };

CH.push({
  id: 'ch05', n: 5, title: 'Modes of Operation and CPA Security',
  lede: 'A block cipher encrypts 16 bytes. Real messages are longer, and a key is used for many of them. A mode of operation turns a block cipher into a cipher for long messages. This chapter shows why the obvious mode is broken, defines the security notion every encryption scheme must meet, chosen-plaintext security, and builds CBC and counter mode. It ends with the padding oracle attack, which reads encrypted data using nothing but error messages and motivates authenticated encryption.',
  html: `
<h2>The obvious mode, and why it fails</h2>
<p>Split the message into 16-byte blocks and encrypt each one with the block cipher. This is <strong>electronic codebook</strong> (ECB) mode: Cᵢ = E(k, Pᵢ). It is simple, parallel and wrong. Because E is deterministic, equal plaintext blocks always give equal ciphertext blocks. Any repetition in the data shows through.</p>
${fig('ecbpix', '<b>Figure 5.1</b> The same image encrypted in ECB mode and in a proper mode. ECB hides the colours but not the picture.')}
<p>The leak matters in real data. Database columns encrypted with ECB reveal which rows have the same value: which customers share a postcode, salary or diagnosis. Adobe's 2013 breach exposed 150 million passwords encrypted with Triple DES in ECB mode; because equal passwords gave equal ciphertexts and users' password hints were stored alongside, the most common passwords were deduced without the key. An attacker can also cut and paste ECB blocks between messages to build new valid ciphertexts.</p>

<h2>Chosen-plaintext security</h2>
<p>Semantic security (Chapter 3) considered one message. Keys encrypt many, and attackers often influence what is encrypted: a web page can make a browser send requests containing attacker-chosen text, and an attacker can send emails or submit form fields that end up encrypted next to secrets. The right notion is <strong>indistinguishability under chosen-plaintext attack</strong> (IND-CPA):</p>
<ol>
<li>The challenger picks a key k and a secret bit b.</li>
<li>The adversary may ask for encryptions of any messages it likes, as often as it likes.</li>
<li>At some point it submits two equal-length messages m₀ and m₁ and receives Enc(k, m<sub>b</sub>).</li>
<li>It may keep asking for encryptions, then guesses b.</li>
</ol>
<p>The scheme is CPA-secure if no efficient adversary guesses b with non-negligible advantage.</p>
<div class="note key"><b>Key idea</b><p>No deterministic scheme can be CPA-secure. The adversary simply asks for the encryption of m₀ and compares it with the challenge. So every secure encryption scheme must be <strong>randomised</strong> (a fresh random IV per message) or <strong>stateful</strong> (a nonce that never repeats). Encrypting the same message twice must give different ciphertexts.</p></div>
<p>This one observation rules out ECB, textbook RSA (Chapter 11) and any "encryption" that always maps a value to the same output. It is also why deterministic encryption, sometimes used deliberately so encrypted columns can be searched by equality, must be treated as leaking equality.</p>

<h2>Cipher block chaining (CBC)</h2>
<p>CBC mode, invented at IBM in 1976, hides repetition by mixing each plaintext block with the previous ciphertext block before encrypting it:</p>
<div class="formula">C₀ = IV          Cᵢ = E(k, Pᵢ ⊕ Cᵢ₋₁)          Pᵢ = D(k, Cᵢ) ⊕ Cᵢ₋₁</div>
${fig('cbc', '<b>Figure 5.2</b> CBC encryption. Each block is chained to the previous ciphertext block, starting from a random IV.')}
<p>CBC with a random IV is CPA-secure if the block cipher is a secure PRP, up to roughly 2<sup>n/2</sup> blocks per key. The IV must be <strong>unpredictable</strong>, not merely unique. If the attacker can predict the IV of the next message, it can choose a plaintext block that cancels it, effectively turning CBC back into ECB for that block. That is the <strong>BEAST</strong> attack (2011): TLS 1.0 used the last ciphertext block of the previous record as the next IV. A malicious script in the victim's browser could predict it, inject chosen blocks, and test guesses of an HTTPS cookie one byte at a time. TLS 1.1 fixed this with a fresh random IV per record.</p>
<h3>Padding</h3>
<p>CBC needs whole blocks, so messages are padded. The standard scheme, PKCS#7 (called PKCS5Padding in Java), appends <i>p</i> bytes each of value <i>p</i>, where 1 ≤ p ≤ 16. A message ending exactly on a block boundary gets a whole extra block of 0x10 bytes, so padding is always unambiguous. After decrypting, the receiver checks that the last byte is a plausible <i>p</i> and that the last <i>p</i> bytes all equal <i>p</i>, then strips them. That check is about to become an attack.</p>

<h2>Counter mode (CTR)</h2>
<p>Counter mode turns the block cipher into a stream cipher. It encrypts successive counter values and XORs the results with the plaintext:</p>
<div class="formula">Cᵢ = Pᵢ ⊕ E(k, nonce ‖ i)</div>
${fig('ctr', '<b>Figure 5.3</b> Counter mode. The block cipher generates a keystream from a nonce and a counter; encryption and decryption are the same operation.')}
<p>CTR has many practical advantages. It needs no padding, since the last keystream block is simply truncated. Encryption and decryption are both fully parallel, and you can decrypt any block without the others, which suits disk and video seeking. Only E is ever used, never D. CTR is CPA-secure if E is a secure PRF and <strong>no counter block ever repeats under the same key</strong>. A repeated nonce gives a repeated keystream and the two-time pad of Chapter 2. CTR is the encryption half of AES-GCM, the most widely deployed mode today.</p>

<div class="tbl"><table><tr><th>Mode</th><th>IV requirement</th><th>Padding</th><th>Parallel</th><th>Notes</th></tr>
<tr><td>ECB</td><td>none</td><td>yes</td><td>yes</td><td>Never for data. Leaks equal blocks.</td></tr>
<tr><td>CBC</td><td>random, unpredictable</td><td>yes</td><td>decrypt only</td><td>Malleable; padding oracles if unauthenticated.</td></tr>
<tr><td>CTR</td><td>unique nonce</td><td>no</td><td>yes</td><td>Malleable like any stream cipher. Nonce reuse is catastrophic.</td></tr>
<tr><td>XTS</td><td>sector number (tweak)</td><td>no (ciphertext stealing)</td><td>yes</td><td>For disk encryption, where ciphertext cannot grow. No integrity.</td></tr>
<tr><td>GCM</td><td>unique 96-bit nonce</td><td>no</td><td>yes</td><td>CTR plus authentication. The default (Chapter 8).</td></tr>
</table></div>

<h2>CPA security is not enough: the padding oracle</h2>
<p>CBC and CTR keep secrets from an attacker who can only <em>watch</em> and <em>choose plaintexts</em>. Mallory can also <em>submit ciphertexts</em> and observe how the receiver reacts. Serge Vaudenay showed in 2002 that this destroys CBC with padding.</p>
<p>Suppose a server decrypts whatever it is sent and responds differently, by error message, status code or even response time, depending on whether the padding was valid. That single bit is a <strong>padding oracle</strong>. Take any two consecutive ciphertext blocks C₁, C₂. Decryption computes P₂ = D(k, C₂) ⊕ C₁. Call I = D(k, C₂) the intermediate value; the attacker does not know it, but controls C₁. Changing byte <i>j</i> of C₁ changes exactly byte <i>j</i> of P₂.</p>
<ol>
<li>Replace the last byte of C₁ with each value g from 0 to 255 and send C₁′ ‖ C₂. Padding is valid when the last byte of P₂′ is 0x01, that is when g ⊕ I[15] = 0x01. Now I[15] = g ⊕ 0x01, and the real last plaintext byte is P₂[15] = I[15] ⊕ C₁[15].</li>
<li>Set the last byte of C₁′ so that it decrypts to 0x02, and search the second-to-last byte for valid padding 02 02. That reveals I[14].</li>
<li>Continue leftwards. Each byte needs at most 256 queries.</li>
</ol>
${fig('padoracle', '<b>Figure 5.4</b> A padding oracle attack recovering a CBC plaintext block byte by byte from right to left, using only "valid padding" or "invalid padding" responses.')}
<p>The attack reads any block, works on every block in turn, and can even <em>encrypt</em> arbitrary data by running the process to choose C₁ values. It has been found again and again:</p>
<ul>
<li>ASP.NET (2010): padding errors let attackers decrypt the view state and download the site's configuration files, including keys.</li>
<li>Lucky Thirteen (2013): TLS servers returned the same error for bad padding and bad MAC, but took slightly different times, which was enough.</li>
<li>POODLE (2014): SSL 3.0 did not specify padding content at all, allowing a padding oracle that killed SSL 3.0.</li>
<li>Many JWE and SAML libraries and countless custom APIs that encrypt tokens with CBC.</li>
</ul>
<div class="note pit"><b>Pitfall</b><p>"Return the same error message" does not fix padding oracles; timing differences remain, as Lucky Thirteen showed. The real fix is to make tampered ciphertexts impossible to submit undetected: authenticate the ciphertext and reject anything whose tag fails <em>before</em> decrypting or checking padding. That is authenticated encryption, built in Chapter 8, and the security notion it achieves, chosen-ciphertext security, is defined there.</p></div>

<h2>In code</h2>
<p>Java exposes modes in the transformation string. The examples show correct IV handling. Neither provides integrity, so use them only to understand, test or interoperate; new code uses <code>AES/GCM/NoPadding</code>.</p>
${code('Modes.java')`import java.nio.ByteBuffer;
import java.security.SecureRandom;
import javax.crypto.Cipher;
import javax.crypto.SecretKey;
import javax.crypto.spec.IvParameterSpec;

public final class Modes {
    private static final SecureRandom RNG = new SecureRandom();

    /** CBC with a fresh random IV, prepended to the ciphertext. */
    static byte[] cbcEncrypt(SecretKey k, byte[] pt) throws Exception {
        byte[] iv = new byte[16];
        RNG.nextBytes(iv);                                 // unpredictable, new for every message
        Cipher c = Cipher.getInstance("AES/CBC/PKCS5Padding");
        c.init(Cipher.ENCRYPT_MODE, k, new IvParameterSpec(iv));
        byte[] ct = c.doFinal(pt);
        return ByteBuffer.allocate(16 + ct.length).put(iv).put(ct).array();
    }

    /** CTR with a 64-bit message counter as nonce and a 64-bit block counter. */
    static byte[] ctrEncrypt(SecretKey k, long messageNumber, byte[] pt) throws Exception {
        byte[] counterBlock = ByteBuffer.allocate(16).putLong(messageNumber).putLong(0).array();
        Cipher c = Cipher.getInstance("AES/CTR/NoPadding");
        c.init(Cipher.ENCRYPT_MODE, k, new IvParameterSpec(counterBlock));
        return c.doFinal(pt);                              // same length as the plaintext
        // messageNumber must never repeat for this key, including after restarts.
    }
}`}
<p>And here is the shape of the bug that creates a padding oracle. The two catch blocks tell the client which check failed:</p>
${code('VulnerableEndpoint.java')`try {
    byte[] pt = decryptCbc(key, token);          // throws BadPaddingException on bad padding
    Session s = Session.parse(pt);               // throws on bad content
    return ok(s);
} catch (javax.crypto.BadPaddingException e) {
    return status(400, "invalid token padding"); // oracle!
} catch (Exception e) {
    return status(401, "invalid session");
}
// Fix: use AES-GCM and treat any failure as one generic error after the tag check.`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>ECB by accident.</strong> In Java, <code>Cipher.getInstance("AES")</code> defaults to <code>AES/ECB/PKCS5Padding</code>. Always spell out the full transformation.</li>
<li><strong>Fixed or predictable IVs,</strong> such as all zeros, a hash of the key or the previous record's last block.</li>
<li><strong>Counters that reset:</strong> a CTR nonce kept in memory and restarted at zero after a deployment.</li>
<li><strong>Decrypting before verifying integrity,</strong> or using unauthenticated CBC at all.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Padding bytes</summary><p>What PKCS#7 padding is added to a 30-byte message, and to a 32-byte message, with 16-byte blocks? Two bytes 02 02; a full block of sixteen 0x10 bytes.</p></details>
<details><summary>Spot the leak</summary><p>A system encrypts card numbers with AES-ECB so it can look them up by encrypting the query. What does an attacker with the database learn without the key? Which records share a card number, and how many distinct cards exist.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>CBC bit flipping</summary><p>Flipping bit j of ciphertext block Cᵢ₋₁ does what to the decrypted Pᵢ and Pᵢ₋₁? It flips bit j of Pᵢ exactly and garbles all of Pᵢ₋₁. Use this to change <code>role=user</code> to <code>role=admn</code> in a cookie.</p></details>
<details><summary>Break deterministic encryption in the CPA game</summary><p>Write the adversary that wins the IND-CPA game with advantage 1 against any deterministic scheme, using one encryption query.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Build the oracle attack</summary><p>Write a Java server method that decrypts AES-CBC and returns true or false for padding validity, then write the attacker that recovers a full two-block message from it. Count the queries.</p></details>
<details><summary>BEAST</summary><p>Explain step by step how a predictable CBC IV lets an attacker who can inject chosen plaintext test a guess for one secret byte. Why does the attacker align the unknown byte at the end of a block?</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why ECB leaks and recognise it in code.</li>
<li>I can define IND-CPA security and explain why secure encryption must be randomised or stateful.</li>
<li>I can describe CBC and CTR, their IV requirements and their properties.</li>
<li>I can explain PKCS#7 padding.</li>
<li>I can carry out a padding oracle attack step by step.</li>
<li>I can explain why returning identical errors does not fix padding oracles, and what does.</li>
</ul>
`});

CH.push({
  id: 'ch06', n: 6, title: 'Message Integrity: MACs',
  lede: 'Encryption hides data but does not stop it being changed. A message authentication code lets the receiver check that a message came from someone holding the key and was not modified on the way. This chapter defines unforgeability, builds MACs from block ciphers and universal hashes, shows the attacks that break naïve designs, and applies MACs to signing API requests and webhooks the way payment systems do.',
  html: `
<h2>Integrity is a separate goal</h2>
<p>Chapters 2 to 5 showed that a stream cipher, a one-time pad or CBC mode lets Mallory change ciphertexts in useful ways: flip a bit, flip the same plaintext bit. Secrecy does nothing to stop that. Integrity needs its own mechanism, and in many systems it is the more important property. A bank may survive an attacker reading a payment instruction; it cannot survive an attacker rewriting the account number.</p>
<p>Error-detecting codes such as CRC-32 or a plain hash are not enough. They catch random noise, but anyone can recompute them after changing the data. WEP protected Wi-Fi frames with an encrypted CRC-32; since CRC is linear, an attacker could flip ciphertext bits and fix the CRC to match, without the key. What is needed is a check value that only a key holder can compute.</p>

<h2>Definition</h2>
<p>A <strong>message authentication code</strong> is a pair of algorithms sharing a key:</p>
<div class="formula">t = MAC(k, m)          Verify(k, m, t) → accept or reject</div>
<p>The sender transmits (m, t). The receiver recomputes the tag and accepts only if it matches. Usually Verify simply recomputes MAC(k, m) and compares.</p>
<h3>Unforgeability under chosen-message attack</h3>
<p>The security notion is <strong>existential unforgeability under chosen-message attack</strong> (EUF-CMA). The forger can obtain tags on any messages it chooses, adaptively, as many as it likes. It wins if it outputs any pair (m*, t*) that verifies, where m* is a message it never asked about. "Existential" means the forger wins even if m* is meaningless gibberish: we do not try to predict which forgeries would be harmful.</p>
${fig('eufcma', '<b>Figure 6.1</b> The unforgeability game. A secure MAC lets no efficient forger produce a valid tag on any new message, even after seeing tags on messages of its choice.')}
<p><strong>Strong</strong> unforgeability also forbids producing a new tag on an old message. That matters when tags double as identifiers, and it is what authenticated encryption needs.</p>
<h3>Tag length and guessing</h3>
<p>A forger can always guess a tag. With a t-bit tag each guess succeeds with probability 2<sup>−t</sup>, so tag length bounds security against online guessing. 128-bit tags are standard; 64 bits can be acceptable when the verifier limits attempts; 32-bit tags, as in some payment and IoT protocols, need strict rate limits and key changes after failures.</p>

<h2>MACs from pseudorandom functions</h2>
<p>A secure PRF is automatically a secure MAC for its input length. If F(k, ·) is indistinguishable from a random function, the forger's view of tags on other messages tells it nothing about F(k, m*), so it can only guess. AES is a PRF on 16-byte inputs, so AES itself is a MAC for exactly one block. The work is in extending to long messages.</p>
<h3>CBC-MAC and its trap</h3>
<p>The natural idea is to run CBC encryption with a zero IV and keep the last ciphertext block as the tag. This <strong>CBC-MAC</strong> is secure if every message has the same fixed length, a result proved by Bellare, Kilian and Rogaway. For variable-length messages it fails completely, as Figure 6.2 shows.</p>
${fig('cbcmac', '<b>Figure 6.2</b> The length-extension forgery on raw CBC-MAC. One tag on a one-block message yields a valid tag on a two-block message.')}
<p>Note also that CBC-MAC needs a <em>fixed</em> zero IV. A random IV sent with the message lets the forger change the first block freely by adjusting the IV. Standardised fixes include <strong>CMAC</strong> (NIST SP 800-38B), which XORs one of two key-derived subkeys into the last block depending on whether it was padded, and the older approach of encrypting the length first. CMAC is widely used in payment cryptography and smart cards.</p>
<h3>HMAC</h3>
<p>The most widely used MAC is <strong>HMAC</strong>, built from a hash function such as SHA-256. Its nested structure, explained in Chapter 7, avoids the length-extension weakness of naïve hash-based MACs. HMAC-SHA256 is the default answer when you need a MAC and have no AEAD in the picture: in JWTs (HS256), AWS request signing, webhook signatures, TOTP codes and key derivation (HKDF).</p>

<h2>Fast MACs: universal hashing</h2>
<p>A different and very fast approach, due to Carter and Wegman (1981), separates the MAC into two parts. A <strong>universal hash</strong> compresses the message using simple arithmetic with a secret key, such that two different messages collide with tiny probability. Then a one-time pad, or a PRF of a nonce, masks the result:</p>
<div class="formula">t = H(r, m) + F(s, nonce)</div>
<ul>
<li><strong>Poly1305</strong> (Bernstein, 2005) treats the message as coefficients of a polynomial and evaluates it at a secret point r modulo the prime 2<sup>130</sup> − 5. It is the MAC in ChaCha20-Poly1305.</li>
<li><strong>GHASH</strong> does the same over the field GF(2<sup>128</sup>) and is the MAC inside AES-GCM.</li>
</ul>
<p>These are provably secure, with no assumption about the hash beyond arithmetic, and run at many gigabytes per second. Their weakness is that the key for each message must be fresh: in practice the per-message mask comes from a nonce, and reusing a nonce can reveal the polynomial key and allow forgeries (Chapter 8).</p>

<h2>What a MAC does not do</h2>
<h3>Replay</h3>
<p>A MAC proves a message was produced by a key holder at some point. It does not prove the message is new. An attacker who records a valid "pay merchant 500" can send it again, and it will verify. Protocols defend against replay by including something that changes:</p>
<ul>
<li>a <strong>sequence number</strong>, as in TLS records and IPsec, where the receiver rejects anything not greater than what it has seen (or outside a sliding window, Chapter 23);</li>
<li>a <strong>timestamp</strong>, with requests outside a window of a few minutes rejected;</li>
<li>a <strong>nonce</strong> the receiver remembers for the duration of the timestamp window;</li>
<li>an <strong>idempotency key</strong>, which also protects against honest client retries, a standard pattern in payment APIs.</li>
</ul>
${fig('reqsign', '<b>Figure 6.3</b> Signing API requests with HMAC. The signature stops tampering; the timestamp and nonce stop replays.')}
<h3>Non-repudiation</h3>
<p>Both parties hold the same key, so either could have produced any tag. A MAC convinces the receiver, but the receiver cannot prove to a judge that the sender, rather than the receiver, created it. For that you need digital signatures (Chapter 12).</p>
<h3>Confidentiality</h3>
<p>A MAC tag can reveal information about the message. Deterministic MACs reveal whether two messages are equal. MACs are not encryption.</p>

<h2>Verifying safely</h2>
<p>A subtle implementation flaw undoes good MACs. Comparing the received tag with the expected one using an ordinary equality check, such as <code>Arrays.equals</code> or <code>String.equals</code>, stops at the first differing byte. An attacker who can time responses learns how many leading bytes of a guess were right, then guesses the tag one byte at a time: about 256 × 32 attempts for a 32-byte tag instead of 2<sup>256</sup>. Measurements are noisy, but statistics over many requests extract the signal, and such attacks have been demonstrated across networks, notably against early Xbox 360 boot code and OAuth libraries.</p>
${fig('mactime', '<b>Figure 6.4</b> A timing leak. When comparison stops at the first wrong byte, the correct first byte takes slightly longer, and an attacker can find the tag byte by byte.')}
<p>Always compare MACs, tokens and password hashes with a <strong>constant-time</strong> comparison that examines every byte regardless of where the first difference is. In Java that is <code>MessageDigest.isEqual</code>, which has been constant time since Java 6u17.</p>

<h2>Key separation</h2>
<p>Use different keys for different purposes. A key used both to encrypt and to MAC, or for two different MAC formats, can let an attacker turn a valid output from one context into a forgery in the other. Derive separate keys from one master key with a KDF and a label for each purpose, for example HKDF(master, info = "payout-request-mac-v1"). Including a version in the label makes later algorithm changes clean.</p>

<h2>In code: signing requests and webhooks</h2>
${code('RequestSigner.java')`import java.nio.charset.StandardCharsets;
import java.security.MessageDigest;
import java.time.Duration;
import java.time.Instant;
import java.util.HexFormat;
import java.util.Set;
import java.util.concurrent.ConcurrentHashMap;
import javax.crypto.Mac;
import javax.crypto.spec.SecretKeySpec;

public final class RequestSigner {
    private static final Duration WINDOW = Duration.ofMinutes(5);
    private final SecretKeySpec key;
    private final Set<String> seenNonces = ConcurrentHashMap.newKeySet(); // use a TTL cache in production

    public RequestSigner(byte[] secret) { this.key = new SecretKeySpec(secret, "HmacSHA256"); }

    /** Canonical form: every field the server acts on, unambiguously separated. */
    static String canonical(String method, String path, String ts, String nonce, byte[] body) throws Exception {
        String bodyHash = HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(body));
        return String.join("\n", method, path, ts, nonce, bodyHash);
    }

    public byte[] sign(String method, String path, String ts, String nonce, byte[] body) throws Exception {
        Mac mac = Mac.getInstance("HmacSHA256");
        mac.init(key);
        return mac.doFinal(canonical(method, path, ts, nonce, body).getBytes(StandardCharsets.UTF_8));
    }

    public boolean verify(String method, String path, String ts, String nonce, byte[] body, byte[] sig) throws Exception {
        Instant t = Instant.ofEpochSecond(Long.parseLong(ts));
        if (Duration.between(t, Instant.now()).abs().compareTo(WINDOW) > 0) return false;  // stale
        byte[] expected = sign(method, path, ts, nonce, body);
        if (!MessageDigest.isEqual(expected, sig)) return false;                         // constant time
        return seenNonces.add(nonce);                                                     // false on replay
    }
}`}
<p>Two details deserve attention. The canonical string separates fields with a character that cannot appear inside them; concatenating fields without separators lets an attacker move characters between fields ("/pay" + "ouT" versus "/payo" + "uT") while keeping the same tag. And the nonce is recorded only after the signature verifies, so an attacker cannot fill the nonce store with junk.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Using a hash instead of a MAC:</strong> SHA-256(m) can be recomputed by anyone.</li>
<li><strong>Using SHA-256(key ‖ message)</strong> as a MAC. It is vulnerable to length extension (Chapter 7). Use HMAC.</li>
<li><strong>Comparing tags with equals().</strong> Use MessageDigest.isEqual.</li>
<li><strong>Not signing everything that matters,</strong> such as the HTTP method, path, query parameters or a header the server uses to route the request.</li>
<li><strong>No replay protection</strong> on requests that move money.</li>
<li><strong>Truncating tags</strong> aggressively without rate-limiting verification failures.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Hash versus MAC</summary><p>A file server publishes SHA-256 checksums next to downloads on the same server. What attacker does this stop, and what attacker does it not? It catches corrupted downloads, not an attacker who controls the server, who can replace both file and checksum.</p></details>
<details><summary>Guessing tags</summary><p>An API accepts 32-bit tags and allows 1,000 attempts per second. Expected time for a forger to succeed by guessing? About 2<sup>31</sup>/1000 seconds ≈ 25 days; much less with many clients. Rate-limit and alert.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Ambiguous encoding</summary><p>A MAC covers <code>user + amount</code> concatenated as strings. Show two different (user, amount) pairs with the same MAC input, and fix the encoding with length prefixes or a separator.</p></details>
<details><summary>Webhook verification</summary><p>Implement verification for a webhook signature header of the form <code>t=1700000000,v1=hex</code>, where the MAC is over <code>t + "." + body</code>. Reject timestamps more than five minutes old.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Measure a timing leak</summary><p>Write a local HTTP endpoint that compares tags with Arrays.equals, and a client that measures median response time for each first-byte guess over 10,000 requests each. Can you detect the right byte on localhost? Repeat with MessageDigest.isEqual.</p></details>
<details><summary>Prove PRF implies MAC</summary><p>Show that if F is a secure PRF with t-bit output, the forger's success probability is at most Adv<sub>PRF</sub> + 2<sup>−t</sup>. Sketch the reduction.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why encryption does not provide integrity and why CRCs and hashes are not MACs.</li>
<li>I can define EUF-CMA and strong unforgeability.</li>
<li>I can explain the CBC-MAC length-extension forgery and how CMAC fixes it.</li>
<li>I can explain Carter-Wegman MACs such as Poly1305 and GHASH.</li>
<li>I can add replay protection with timestamps, nonces or sequence numbers.</li>
<li>I can verify tags in constant time and explain why it matters.</li>
</ul>
`});

CH.push({
  id: 'ch07', n: 7, title: 'Hash Functions',
  lede: 'A cryptographic hash function compresses any input to a short fingerprint that is practically impossible to forge or invert. Hashes underlie signatures, password storage, key derivation, software updates, Git, certificate transparency and blockchains. This chapter defines the three security properties, explains why collisions are found far sooner than intuition suggests, builds hash functions the way SHA-2 and SHA-3 do, and shows how the length-extension weakness led to HMAC.',
  html: `
<h2>What a hash function is</h2>
<p>A hash function H maps inputs of any length to a fixed-length output, the <strong>digest</strong>: 256 bits for SHA-256. Unlike a MAC, a hash has no key; anyone can compute it. It is useful for security because certain things about it are infeasible to do. Try changing one character in Figure 7.1 and watch half the output change.</p>
${fig('avalanche', '<b>Figure 7.1</b> SHA-256, computed live in your browser. A one-character change flips about half of the 256 output bits, in an unpredictable pattern.')}

<h2>Three security properties</h2>
<ul>
<li><strong>Preimage resistance</strong> (one-wayness): given a digest y, it is infeasible to find any x with H(x) = y. The best generic attack is trying inputs: about 2<sup>n</sup> work for an n-bit hash.</li>
<li><strong>Second-preimage resistance</strong>: given a specific x, it is infeasible to find a different x′ with H(x′) = H(x). Generic cost also about 2<sup>n</sup>.</li>
<li><strong>Collision resistance</strong>: it is infeasible to find <em>any</em> two different inputs x ≠ x′ with H(x) = H(x′). Generic cost only about 2<sup>n/2</sup>.</li>
</ul>
<p>Collisions must exist, since infinitely many inputs map to 2<sup>256</sup> outputs; the requirement is only that nobody can find one. Collision resistance implies second-preimage resistance, which (for hashes that compress enough) implies preimage resistance. Collision resistance is the strongest and the first to fall when a hash weakens.</p>
<p>Why does collision resistance matter? If someone can make two documents with the same hash, they can get you to sign one and then claim you signed the other. Signature schemes sign hashes (Chapter 12), so a hash collision becomes a forged signature.</p>

<h2>The birthday paradox</h2>
<p>How many people must be in a room before two probably share a birthday? Not 183, but 23. Among k people there are k(k−1)/2 pairs, and each pair matches with probability 1/365. With 23 people there are 253 pairs, enough to make a match more likely than not.</p>
${fig('birthday', '<b>Figure 7.2</b> The birthday paradox. Collisions among random values appear after about the square root of the number of possible values.')}
<p>The general rule: among q random values from N possibilities, the probability of a collision is about q²/2N, reaching 50% around q ≈ 1.18√N. For an n-bit hash, N = 2<sup>n</sup>, so collisions appear after about 2<sup>n/2</sup> hashes. That is why a 128-bit hash gives only 64-bit collision security, and why SHA-256 is the minimum for collision resistance today. The same bound governs random nonces (Chapter 3), 64-bit block ciphers (Sweet32, Chapter 4) and random IDs.</p>
<p>Finding birthday collisions does not need a huge table. Pollard's rho method walks x → H(x) → H(H(x)) … until the sequence loops, which happens after about 2<sup>n/2</sup> steps with constant memory, and van Oorschot and Wiener's parallel version spreads this across many machines.</p>

<h2>Building a hash: Merkle-Damgård</h2>
<p>Hashing arbitrary-length input starts from a fixed-size <strong>compression function</strong> f that takes a chaining value and a message block and outputs a new chaining value. The Merkle-Damgård construction (1989) pads the message, appending its length, splits it into blocks and chains:</p>
<div class="formula">h₀ = IV          hᵢ = f(hᵢ₋₁, mᵢ)          H(m) = h_last</div>
<p>Merkle and Damgård proved that if f is collision resistant, so is H. The length in the padding is essential to the proof. MD5, SHA-1 and SHA-2 are all built this way. The compression function is typically a block cipher in <em>Davies-Meyer</em> mode: f(h, m) = E(m, h) ⊕ h, using the message block as the key. SHA-256's compression function is a custom 64-round block cipher on a 256-bit state with 512-bit "keys" (the message blocks).</p>
${fig('mdext', '<b>Figure 7.3</b> Merkle-Damgård chaining, and the length-extension attack it allows when a hash is misused as a MAC.')}
<h3>Length extension</h3>
<p>Merkle-Damgård has a structural property that causes real breaks: the digest <em>is</em> the internal state after the last block. If you know H(x) and the length of x, you can compute H(x ‖ pad ‖ y) for any y without knowing x. You just resume the computation from H(x).</p>
<p>Harmless for collision resistance, fatal for the obvious MAC t = H(k ‖ m). An attacker who sees one valid request and its tag can append parameters and compute a valid tag for the longer request. In 2009 Thai Duong and Juliano Rizzo used exactly this against the Flickr API, which authenticated calls with MD5(secret ‖ parameters). SHA-256, SHA-512 and MD5 all have this property; truncated variants such as SHA-512/256 and SHA-384, and SHA-3, do not.</p>

<h2>HMAC</h2>
<p>HMAC (Bellare, Canetti and Krawczyk, 1996; RFC 2104) turns any Merkle-Damgård hash into a secure MAC by hashing twice with two derived keys:</p>
<div class="formula">HMAC(k, m) = H( (k ⊕ opad) ‖ H( (k ⊕ ipad) ‖ m ) )          ipad = 0x36 repeated, opad = 0x5c repeated</div>
<p>The inner hash processes the message; the outer hash, keyed independently, wraps the result. Extending the inner hash is useless because the attacker cannot compute the outer one. HMAC is a secure PRF provided the compression function is a PRF, a weaker requirement than collision resistance. That is why HMAC-MD5 and HMAC-SHA1 were never practically broken even after MD5 and SHA-1 collisions were found, though there is no reason to use them now. Keys longer than the hash block (64 bytes for SHA-256) are first hashed; shorter ones are zero-padded.</p>

<h2>SHA-3 and the sponge</h2>
<p>After attacks on MD5 and SHA-1 in 2004 and 2005, NIST ran a competition for a hash with a completely different structure, in case SHA-2 fell the same way. Keccak, by Bertoni, Daemen, Peeters and Van Assche, won in 2012 and became SHA-3 (FIPS 202, 2015). SHA-2 has not been broken, so both are standard.</p>
<p>Keccak is a <strong>sponge</strong>. A 1600-bit state is split into a <em>rate</em> part r and a <em>capacity</em> part c. To absorb the input, XOR each r-bit block into the rate part and apply a fixed permutation to the whole state. To squeeze the output, read r bits, permute, read again, as many times as needed. The capacity bits are never directly touched by input or output, and security is about c/2 bits. For SHA3-256, c = 512. Because the output never reveals the full state, sponges have no length extension, so KMAC (a SHA-3 MAC) can simply be H(k ‖ m) with proper encoding. Sponges also give <strong>extendable-output functions</strong> (XOFs), SHAKE128 and SHAKE256, which produce as many output bits as you ask for; ML-KEM and ML-DSA (Chapters 15 and 16) use them heavily.</p>

<h2>A history of broken hashes</h2>
<div class="tbl"><table><tr><th>Hash</th><th>Output</th><th>Status</th></tr>
<tr><td>MD5 (1992)</td><td class="num">128</td><td>Collisions found by Wang et al. in 2004, now in seconds. In 2012 the Flame malware used an MD5 chosen-prefix collision to forge a Microsoft code-signing certificate and spread through Windows Update.</td></tr>
<tr><td>SHA-1 (1995)</td><td class="num">160</td><td>Theoretical attacks from 2005. First real collision ("SHAttered", Google and CWI, 2017) cost about 2<sup>63</sup> SHA-1 computations. A chosen-prefix collision in 2020 ("SHA-1 is a Shambles") cost about $45,000 of GPU time and forged PGP keys. Browsers stopped accepting SHA-1 certificates in 2017.</td></tr>
<tr><td>SHA-256, SHA-384, SHA-512</td><td class="num">256–512</td><td>Secure. SHA-256 is the default.</td></tr>
<tr><td>SHA3-256, SHAKE</td><td class="num">256, variable</td><td>Secure. Different design, so a good backup.</td></tr>
<tr><td>BLAKE2, BLAKE3</td><td class="num">256 (variable)</td><td>Secure and very fast in software. Used by WireGuard (BLAKE2s) and many tools.</td></tr>
</table></div>
<p>The pattern is gradual: first theoretical weaknesses, then expensive collisions, then cheap chosen-prefix collisions that let attackers control both colliding documents. Each stage gave years of warning that many systems ignored. Git, which identifies objects by SHA-1, added collision detection after SHAttered and supports SHA-256 repositories.</p>

<h2>What hashes are used for</h2>
<ul>
<li><strong>Integrity against accidents and for addressing:</strong> content-addressed storage, deduplication, Git objects, container image digests. To protect against an attacker you also need a trusted channel for the digest, or a signature.</li>
<li><strong>Hash-and-sign:</strong> signatures operate on H(m), so only the short digest is signed (Chapter 12).</li>
<li><strong>Commitments:</strong> publish H(r ‖ value) with random r now, reveal r and the value later. The hash hides the value and binds you to it.</li>
<li><strong>Key derivation:</strong> HKDF, below, turns shared secrets into keys.</li>
<li><strong>Password storage:</strong> only with a deliberately slow, salted construction. A plain SHA-256 of a password is crackable at billions of guesses per second (Chapter 13).</li>
<li><strong>Merkle trees:</strong> commit to a large set with one root and prove membership cheaply.</li>
</ul>

<h2>Merkle trees</h2>
<p>A Merkle tree (Ralph Merkle, 1979) hashes items in pairs, then hashes the results in pairs, up to a single root. Publishing the root commits to the whole set. To prove that one item is included, give the item and the sibling hash at each level, about log₂ n hashes; the verifier recomputes up to the root and compares.</p>
${fig('merkle', '<b>Figure 7.4</b> A Merkle inclusion proof. The prover sends three sibling hashes; the verifier rebuilds the path and checks the root.')}
<p>Merkle trees appear everywhere: Certificate Transparency logs (Chapter 12) prove that a certificate was logged; Bitcoin blocks commit to transactions; Git and ZFS detect corruption; exchanges publish proof-of-reserves trees so customers can check their balance is included; and stateless hash-based signatures (Chapter 16) are built from them. Two details matter for security: hash leaves and internal nodes with different prefixes (RFC 6962 uses 0x00 and 0x01), or an attacker can present an internal node as if it were a leaf; and define how an odd node at the end of a level is handled, since Bitcoin's choice of duplicating it caused a known vulnerability (CVE-2012-2459).</p>

<h2>Key derivation with HKDF</h2>
<p>Protocols often end up with secret material that is not directly a good key: a Diffie-Hellman shared value (Chapter 10) is a non-uniform group element, and one secret often needs to produce several keys. <strong>HKDF</strong> (RFC 5869) handles both in two steps:</p>
<div class="formula">Extract:  PRK = HMAC(salt, input key material)
Expand:   T(1) = HMAC(PRK, info ‖ 0x01),  T(i) = HMAC(PRK, T(i−1) ‖ info ‖ i),  output = T(1) ‖ T(2) ‖ …</div>
<p>Extract concentrates the entropy of the input into a uniform pseudorandom key. Expand stretches it into as many independent keys as needed, separated by the <em>info</em> label, such as "client write key" and "server write key". TLS 1.3's whole key schedule (Chapter 14) is a sequence of HKDF calls.</p>

<h2>In code</h2>
${code('Hashing.java')`import java.io.InputStream;
import java.nio.file.Files;
import java.nio.file.Path;
import java.security.MessageDigest;
import java.util.HexFormat;
import java.util.List;
import javax.crypto.Mac;
import javax.crypto.spec.SecretKeySpec;

public final class Hashing {
    /** Stream a large file through SHA-256 without loading it into memory. */
    static String fileDigest(Path p) throws Exception {
        MessageDigest md = MessageDigest.getInstance("SHA-256");     // or "SHA3-256"
        try (InputStream in = Files.newInputStream(p)) {
            byte[] buf = new byte[1 << 16];
            for (int n; (n = in.read(buf)) > 0; ) md.update(buf, 0, n);
        }
        return HexFormat.of().formatHex(md.digest());
    }

    static byte[] hmac(byte[] key, byte[] data) throws Exception {
        Mac mac = Mac.getInstance("HmacSHA256");
        mac.init(new SecretKeySpec(key, "HmacSHA256"));
        return mac.doFinal(data);
    }

    /** HKDF (RFC 5869) from HMAC. JDK 25 also provides javax.crypto.KDF "HKDF-SHA256". */
    static byte[] hkdf(byte[] salt, byte[] ikm, byte[] info, int len) throws Exception {
        byte[] prk = hmac(salt.length == 0 ? new byte[32] : salt, ikm);           // extract
        byte[] out = new byte[len], t = new byte[0];
        for (int i = 1, pos = 0; pos < len; i++) {                                // expand
            byte[] in = new byte[t.length + info.length + 1];
            System.arraycopy(t, 0, in, 0, t.length);
            System.arraycopy(info, 0, in, t.length, info.length);
            in[in.length - 1] = (byte) i;
            t = hmac(prk, in);
            int n = Math.min(t.length, len - pos);
            System.arraycopy(t, 0, out, pos, n);
            pos += n;
        }
        return out;
    }

    /** Verify a Merkle inclusion proof with RFC 6962 domain separation. */
    static boolean verifyInclusion(byte[] leaf, long index, List<byte[]> siblings, byte[] root) throws Exception {
        MessageDigest md = MessageDigest.getInstance("SHA-256");
        md.update((byte) 0x00); byte[] h = md.digest(leaf);                       // leaf hash
        for (byte[] s : siblings) {
            md.update((byte) 0x01);                                               // node hash
            if ((index & 1) == 0) { md.update(h); md.update(s); } else { md.update(s); md.update(h); }
            h = md.digest();
            index >>= 1;
        }
        return MessageDigest.isEqual(h, root);
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>MD5 or SHA-1 anywhere security depends on collisions:</strong> signatures, certificates, file integrity against attackers, deduplication of untrusted uploads.</li>
<li><strong>H(key ‖ message) as a MAC.</strong> Use HMAC.</li>
<li><strong>Fast hashes for passwords.</strong> Use Argon2id, scrypt, bcrypt or PBKDF2 with a high work factor.</li>
<li><strong>Ambiguous inputs:</strong> H(a ‖ b) where a and b have variable length lets ("ab", "c") collide with ("a", "bc"). Length-prefix or encode fields.</li>
<li><strong>Merkle trees without leaf and node domain separation.</strong></li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Collision cost</summary><p>What is the generic collision-finding cost for a 160-bit hash, and for SHA-256? 2<sup>80</sup> and 2<sup>128</sup>.</p></details>
<details><summary>Proof size</summary><p>How many sibling hashes in a Merkle inclusion proof for a tree of 1,000,000 leaves? 20, since 2<sup>20</sup> ≈ 10<sup>6</sup>.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Truncated digests</summary><p>A system identifies uploaded files by the first 8 hex characters of SHA-256. How many uploads before two different files probably share an identifier? 32 bits, so about 77,000 (1.18 × 2<sup>16</sup>).</p></details>
<details><summary>Implement length extension</summary><p>Implement SHA-256 compression in Java (or use a library that lets you set the internal state), then forge SHA-256(secret ‖ "amount=10") into SHA-256(secret ‖ "amount=10" ‖ pad ‖ "&amount=1000") knowing only the original tag and the secret's length.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Rho collision</summary><p>Use Pollard's rho with Floyd cycle detection to find a collision in SHA-256 truncated to 40 bits. Estimate the number of hash calls (around 2<sup>20</sup>) and compare with your measurement.</p></details>
<details><summary>Second-preimage on long messages</summary><p>Read about Kelsey and Schneier's 2005 attack showing that second preimages for very long messages in Merkle-Damgård hashes cost less than 2<sup>n</sup>. Explain the role of expandable messages.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can define preimage, second-preimage and collision resistance and their generic costs.</li>
<li>I can explain the birthday bound and apply it to hashes, nonces and identifiers.</li>
<li>I can describe Merkle-Damgård and the length-extension attack.</li>
<li>I can explain HMAC's structure and why it resists length extension.</li>
<li>I can describe the sponge construction and SHAKE.</li>
<li>I can build and verify a Merkle inclusion proof and use HKDF correctly.</li>
</ul>
`});

CH.push({
  id: 'ch08', n: 8, title: 'Authenticated Encryption',
  lede: 'Real attackers do not just read ciphertexts; they change them and watch what happens. Authenticated encryption gives confidentiality and integrity in one primitive, and it is what every new system should use. This chapter defines chosen-ciphertext security, shows which ways of combining encryption with a MAC are safe, takes apart AES-GCM and ChaCha20-Poly1305, and spends serious time on the one rule that breaks them: never reuse a nonce.',
  html: `
<h2>The attacker who sends ciphertexts</h2>
<p>Chapter 5 ended with the padding oracle: an attacker who could submit modified ciphertexts and observe one bit of the result read the plaintext, even though CBC is CPA-secure. Real systems hand attackers this power constantly. A web server decrypts cookies; a message app decrypts incoming messages; an API decrypts tokens. Any of them may reveal, by an error code, a timing difference or a change in behaviour, something about what a forged ciphertext decrypted to.</p>
<h3>Chosen-ciphertext security</h3>
<p>The <strong>IND-CCA</strong> game strengthens IND-CPA. The adversary can request encryptions of messages and also <em>decryptions of any ciphertexts</em> it likes, except the challenge ciphertext itself. It must still be unable to tell which of m₀ and m₁ the challenge encrypts. This is the right notion for nearly all real use. CBC, CTR and every unauthenticated mode fail it immediately: flip a bit of the challenge, ask for the decryption, flip the bit back.</p>
<h3>Authenticated encryption</h3>
<p>The cleanest route to CCA security is <strong>authenticated encryption</strong> (AE), which combines two properties:</p>
<ul>
<li><strong>Confidentiality:</strong> IND-CPA security.</li>
<li><strong>Ciphertext integrity:</strong> no efficient adversary, even after seeing encryptions of messages of its choice, can produce any new ciphertext that decrypts successfully. The decryption algorithm either returns the plaintext or rejects with ⊥.</li>
</ul>
<p>Together they imply CCA security. The intuition is simple: if every ciphertext the attacker makes up is rejected, the decryption oracle only ever says "reject", which tells it nothing. Nothing an attacker forges ever reaches the parsing code, so padding, timing and format oracles disappear.</p>
<div class="note key"><b>Key idea</b><p>Use authenticated encryption for all encryption of data in transit and at rest. Unauthenticated modes belong only inside constructions designed by experts, such as GCM's CTR layer or XTS disk encryption, where the format makes authentication impossible.</p></div>

<h2>Combining a cipher and a MAC</h2>
<p>Before dedicated AE modes, protocols combined a CPA-secure cipher with a MAC. There are three ways, and real protocols chose all three. Bellare and Namprempre analysed them in 2000:</p>
${fig('compose', '<b>Figure 8.1</b> The three generic compositions. Only encrypt-then-MAC is secure for every secure cipher and MAC.')}
<p>The lesson generalises: <strong>verify before you process.</strong> Anything that touches attacker-controlled bytes before authentication, including decryption, decompression and padding removal, is an attack surface. Encrypt-then-MAC must use independent keys for the cipher and the MAC, and the MAC must cover the IV and every header field the receiver uses.</p>

<h2>The AEAD interface</h2>
<p>Modern AE schemes take one more input: <strong>associated data</strong> (AD), information that must be authenticated but not encrypted. Packet headers, record types, a database row's primary key, a user ID or a version number all qualify. The receiver needs to read them in the clear, but an attacker must not be able to change them or move a ciphertext to a context where they differ.</p>
${fig('aead', '<b>Figure 8.2</b> Authenticated encryption with associated data. Changing the key, nonce, header or any ciphertext bit makes decryption fail.')}
<p>Associated data solves a whole class of <em>cut-and-paste</em> attacks. Suppose a database stores each customer's encrypted card number. Without AD, an insider can copy Alice's ciphertext into Mallory's row, and the application will decrypt Alice's card as Mallory's. With the customer ID as associated data, the moved ciphertext fails to decrypt.</p>

<h2>AES-GCM</h2>
<p>Galois/Counter Mode (McGrew and Viega, 2004; NIST SP 800-38D) is the most widely deployed AEAD. It protects most HTTPS traffic, IPsec, SSH, cloud storage and Java's default encryption recipes. It is CTR mode for encryption plus a Carter-Wegman MAC for integrity:</p>
<ol>
<li>Derive the hash key H = E(k, 0<sup>128</sup>).</li>
<li>With a 96-bit nonce n, counter block 1 is n ‖ 00000001. Encrypt the plaintext in CTR mode starting at counter 2.</li>
<li>Compute GHASH, a polynomial evaluation at the point H in GF(2<sup>128</sup>), over the associated data, the ciphertext and their lengths.</li>
<li>The tag is GHASH ⊕ E(k, n ‖ 1), truncated to the tag length (use the full 128 bits).</li>
</ol>
${fig('gcm', '<b>Figure 8.3</b> AES-GCM: counter mode encrypts, GHASH authenticates the header and ciphertext, and an encrypted counter block masks the hash.')}
<p>GCM is fast: CTR parallelises fully, and modern CPUs have carry-less multiplication instructions (PCLMULQDQ on x86, PMULL on ARM) that compute GHASH at many gigabytes per second. Its limits are worth knowing exactly:</p>
<ul>
<li>At most about 64 GB of plaintext per message (2<sup>32</sup> − 2 blocks).</li>
<li>With random 96-bit nonces, at most 2<sup>32</sup> messages per key, to keep the collision probability below 2<sup>−32</sup>. With a counter as nonce the limit is the counter size.</li>
<li>Nonces other than 96 bits are hashed into a counter block, which works but has weaker bounds. Use 96 bits.</li>
</ul>

<h2>The nonce rule</h2>
<p>GCM's security depends absolutely on the nonce never repeating under one key. A repeat does not just leak a little; it destroys both properties at once (Figure 8.4).</p>
${fig('reuse', '<b>Figure 8.4</b> What one repeated GCM nonce costs: plaintext XOR leaks immediately, and the authentication key can be solved for, allowing forgeries.')}
<p>Nonce reuse happens in practice through:</p>
<ul>
<li><strong>Counters stored in memory</strong> that reset on restart, or that two instances of a service both start at zero with a shared key.</li>
<li><strong>Random nonces at very high volume:</strong> a key encrypting a billion records a day exceeds the 2<sup>32</sup> budget in about four days.</li>
<li><strong>Restored snapshots</strong> of VMs or databases that replay state.</li>
<li><strong>Library misuse,</strong> such as passing a fixed IV constant copied from an example.</li>
</ul>
<p>Defences: derive a fresh key per file or per session so each key encrypts few messages; use a counter that is persisted before use; or use a misuse-resistant mode.</p>

<h2>ChaCha20-Poly1305</h2>
<p>ChaCha20-Poly1305 (RFC 8439) combines the ChaCha20 stream cipher of Chapter 3 with the Poly1305 MAC of Chapter 6. For each message, the first ChaCha20 block, at counter 0, provides a one-time Poly1305 key; encryption uses the following blocks. It has the same interface and nonce rule as GCM, but runs in constant time in pure software and is faster than AES on CPUs without AES instructions, which is why TLS clients on phones often prefer it. <strong>XChaCha20-Poly1305</strong> extends the nonce to 192 bits, large enough that random nonces never realistically collide, which removes the message budget problem.</p>

<h2>Misuse-resistant AEAD</h2>
<p>Some designs tolerate nonce reuse gracefully. <strong>AES-GCM-SIV</strong> (RFC 8452) computes a MAC-like value over the plaintext first and uses it as the counter IV ("synthetic IV"). If a nonce repeats, the only leak is whether two messages under that nonce were identical; no forgeries become possible. It costs a second pass over the data. <strong>AES-SIV</strong> (RFC 5297) is the deterministic version, used for key wrapping and for encrypted values that must be searchable by equality. Choose these when you cannot guarantee unique nonces.</p>

<h2>Subtler properties</h2>
<h3>Key commitment</h3>
<p>Standard AEAD guarantees that an attacker without the key cannot forge. It does not guarantee that a ciphertext decrypts validly under only one key. With GCM or ChaCha20-Poly1305, someone who chooses two keys can craft a single ciphertext that decrypts to different valid messages under each. This broke Facebook Messenger's abuse reporting in 2018 ("invisible salamanders": a reported message decrypted differently for the moderator) and enables "partitioning oracle" attacks that test many password-derived keys at once. When the key might be chosen by an adversary, or one ciphertext is shared among recipients, use a key-committing scheme or add a commitment, for example a hash of the key stored with the ciphertext.</p>
<h3>Streaming and large data</h3>
<p>An AEAD decryptor must not release plaintext before checking the tag, because the plaintext could be forged. Java's GCM implementation buffers the whole ciphertext on decryption for this reason, which means a 10 GB file needs 10 GB of memory. The right approach is a <strong>chunked</strong> format: split the data into segments of, say, 64 KB, encrypt each with its own nonce derived from a per-file key and the segment index, and mark the last segment in the associated data so truncation is detected. Google's Tink library and the age file format implement this "STREAM" construction.</p>

<h2>In code</h2>
${code('Aead.java')`import java.nio.ByteBuffer;
import java.nio.charset.StandardCharsets;
import java.security.SecureRandom;
import javax.crypto.AEADBadTagException;
import javax.crypto.Cipher;
import javax.crypto.KeyGenerator;
import javax.crypto.SecretKey;
import javax.crypto.spec.GCMParameterSpec;

/** Format: version(1) | nonce(12) | ciphertext+tag. The AAD binds the ciphertext to its context. */
public final class Aead {
    private static final byte VERSION = 1;
    private static final SecureRandom RNG = new SecureRandom();

    public static byte[] encrypt(SecretKey k, byte[] plaintext, byte[] aad) throws Exception {
        byte[] nonce = new byte[12];
        RNG.nextBytes(nonce);                                  // random: keep under 2^32 messages per key
        Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
        c.init(Cipher.ENCRYPT_MODE, k, new GCMParameterSpec(128, nonce));
        c.updateAAD(new byte[] { VERSION });                   // authenticate the header too
        c.updateAAD(aad);
        byte[] ct = c.doFinal(plaintext);
        return ByteBuffer.allocate(1 + 12 + ct.length).put(VERSION).put(nonce).put(ct).array();
    }

    public static byte[] decrypt(SecretKey k, byte[] blob, byte[] aad) throws Exception {
        ByteBuffer b = ByteBuffer.wrap(blob);
        byte v = b.get();
        if (v != VERSION) throw new IllegalArgumentException("unknown version");
        byte[] nonce = new byte[12]; b.get(nonce);
        byte[] ct = new byte[b.remaining()]; b.get(ct);
        Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
        c.init(Cipher.DECRYPT_MODE, k, new GCMParameterSpec(128, nonce));
        c.updateAAD(new byte[] { v });
        c.updateAAD(aad);
        return c.doFinal(ct);                                  // throws AEADBadTagException if tampered
    }

    public static void main(String[] args) throws Exception {
        KeyGenerator kg = KeyGenerator.getInstance("AES"); kg.init(256);
        SecretKey k = kg.generateKey();
        byte[] card = "4111111111111111".getBytes(StandardCharsets.US_ASCII);
        byte[] blob = encrypt(k, card, "customer:42".getBytes(StandardCharsets.UTF_8));

        System.out.println(new String(decrypt(k, blob, "customer:42".getBytes(StandardCharsets.UTF_8))));
        try {
            decrypt(k, blob, "customer:99".getBytes(StandardCharsets.UTF_8)); // ciphertext moved to another row
        } catch (AEADBadTagException e) {
            System.out.println("rejected: wrong context");
        }
        // Same API with Cipher.getInstance("ChaCha20-Poly1305") and an IvParameterSpec(nonce).
    }
}`}

<h2>Choosing a scheme</h2>
<div class="tbl"><table><tr><th>Situation</th><th>Choice</th></tr>
<tr><td>General purpose, servers with AES hardware</td><td>AES-256-GCM, 96-bit random nonce, new key well before 2<sup>32</sup> messages</td></tr>
<tr><td>Mobile and embedded without AES instructions</td><td>ChaCha20-Poly1305</td></tr>
<tr><td>Many messages, random nonces, no coordination</td><td>XChaCha20-Poly1305, or a fresh derived key per batch</td></tr>
<tr><td>Nonce uniqueness cannot be guaranteed</td><td>AES-GCM-SIV</td></tr>
<tr><td>Wrapping keys</td><td>AES-KW (RFC 3394) or AES-SIV, or let the KMS do it (Chapter 18)</td></tr>
<tr><td>Large files or streams</td><td>A chunked AEAD format (Tink streaming AEAD, age)</td></tr>
<tr><td>Disk sectors that cannot grow</td><td>AES-XTS, accepting no integrity</td></tr>
</table></div>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Reusing a nonce,</strong> or using a fixed IV from sample code.</li>
<li><strong>Truncating tags</strong> to save space. GCM's security degrades faster than the tag length suggests when tags are short.</li>
<li><strong>Acting on plaintext before the tag is verified,</strong> for example by streaming decrypted output to a parser.</li>
<li><strong>Forgetting associated data,</strong> so ciphertexts can be moved between records, users or protocol states.</li>
<li><strong>Treating a decryption failure as anything other than an attack,</strong> for example by retrying with another key and revealing which one worked.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Budget a key</summary><p>A service encrypts 50 million events a day with one AES-GCM key and random nonces. When must it rotate to stay under 2<sup>32</sup> messages? After about 86 days. Rotating monthly is a comfortable margin.</p></details>
<details><summary>What to put in AAD</summary><p>For encrypted rows in a <code>payment_methods</code> table, list fields that should go in the associated data. Table name, primary key, customer ID, key version, schema version.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Break encrypt-and-MAC</summary><p>Show that encrypt-and-MAC with a deterministic MAC is not IND-CPA secure, by giving an adversary with advantage 1.</p></details>
<details><summary>Derived per-file keys</summary><p>Design a file encryption format in which each file gets its own key derived with HKDF from a master key and a random 32-byte file salt, so a counter starting at zero is a safe nonce. What goes in the header?</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Forbidden attack</summary><p>Using a library with GF(2<sup>128</sup>) arithmetic, generate two AES-GCM messages with a repeated nonce, set up the GHASH equation, find H, and forge a tag for a third ciphertext. Verify that Java's decryptor accepts it.</p></details>
<details><summary>Chunked AEAD</summary><p>Implement a streaming AEAD with 64 KB segments, nonce = prefix ‖ segment index ‖ last-segment flag. Show that reordering, dropping or truncating segments is detected.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can define IND-CCA security and ciphertext integrity, and explain why AE implies CCA security.</li>
<li>I can explain why encrypt-then-MAC is safe and the other compositions are fragile.</li>
<li>I can explain associated data and use it to prevent cut-and-paste attacks.</li>
<li>I can describe AES-GCM's structure and its message and nonce limits.</li>
<li>I can explain exactly what a repeated GCM nonce leaks and how to avoid repeats.</li>
<li>I can choose between GCM, ChaCha20-Poly1305, XChaCha20, GCM-SIV and chunked AEAD.</li>
</ul>
`});
