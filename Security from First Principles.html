CH.push({
  id: 'ch27', n: 27, title: 'Web Security',
  lede: 'The browser runs code from millions of sites side by side, and web applications turn untrusted input into HTML, SQL, URLs and commands all day long. This final chapter explains the browser\'s security model (origins, the same-origin policy, cookies and CORS) and then the vulnerabilities that have dominated breach reports for twenty years: cross-site scripting, cross-site request forgery, SQL injection, server-side request forgery and, most common of all, broken access control. Each comes with the defence that actually works and Java code that applies it.',
  html: `
<h2>The browser security model</h2>
<p>When you open a web page, the browser downloads and runs code chosen by whoever controls that site. A banking tab and a malicious ad may be open side by side. The browser's job is to stop one site's code from reading or acting on another site's data. Its unit of isolation is the <strong>origin</strong>: the combination of scheme, host and port.</p>
<div class="tbl"><table><tr><th>Compared with https://bank.example</th><th>Same origin?</th><th>Why</th></tr>
<tr><td>https://bank.example/accounts</td><td>Yes</td><td>Path does not matter</td></tr>
<tr><td>http://bank.example</td><td>No</td><td>Different scheme</td></tr>
<tr><td>https://api.bank.example</td><td>No</td><td>Different host (but same <em>site</em>, which matters for cookies)</td></tr>
<tr><td>https://bank.example:8443</td><td>No</td><td>Different port</td></tr>
<tr><td>https://bank.example.evil.com</td><td>No</td><td>Different host entirely</td></tr>
</table></div>
<h3>The same-origin policy</h3>
<p>Script running in one origin can freely read and modify pages and data of the same origin, and cannot read responses or documents from other origins. It <em>can</em>, however, cause requests to other origins: submit forms, load images and scripts, navigate frames. This asymmetry, send but not read, explains most of web security.</p>
${fig('sop', '<b>Figure 27.1</b> The same-origin policy lets a malicious page send requests to your bank but not read the responses. Whether your cookies go along is a separate decision.')}
<h3>Cookies and ambient authority</h3>
<p>Cookies predate the same-origin policy and follow different rules: they are scoped by domain (and optionally path), and historically the browser attached them to <em>every</em> request to that domain, whoever triggered it. A logged-in session is therefore <strong>ambient authority</strong>: any page can make requests that carry it. Cookie attributes control this:</p>
<div class="tbl"><table><tr><th>Attribute</th><th>Effect</th></tr>
<tr><td><code>Secure</code></td><td>Sent only over HTTPS.</td></tr>
<tr><td><code>HttpOnly</code></td><td>Not readable by JavaScript, so an XSS bug cannot steal it directly.</td></tr>
<tr><td><code>SameSite=Lax</code></td><td>Not sent on cross-site subrequests or form POSTs; sent on top-level navigations with GET. The default in major browsers since 2020.</td></tr>
<tr><td><code>SameSite=Strict</code></td><td>Never sent on cross-site requests, even link clicks.</td></tr>
<tr><td><code>SameSite=None; Secure</code></td><td>Always sent. Needed for genuine cross-site embedding; requires other CSRF defences.</td></tr>
<tr><td><code>__Host-</code> name prefix</td><td>Browser enforces Secure, no Domain attribute and Path=/, so subdomains cannot set or overwrite it.</td></tr>
</table></div>
<h3>CORS</h3>
<p>Cross-Origin Resource Sharing lets a server opt in to letting specific other origins <em>read</em> its responses, with <code>Access-Control-Allow-Origin</code> headers and, for non-simple requests, a preflight check. CORS relaxes the same-origin policy; it never adds protection. The classic misconfiguration reflects whatever Origin header arrives back in the allow header together with <code>Access-Control-Allow-Credentials: true</code>, which lets any site read authenticated API responses. Allow a fixed list of origins, and never treat <code>null</code> as trusted.</p>

<h2>Cross-site scripting (XSS)</h2>
<p>XSS happens when attacker-controlled data ends up in a page in a position where the browser interprets it as code. The attacker's script then runs in the site's origin with all its privileges.</p>
${fig('xss', '<b>Figure 27.2</b> Stored cross-site scripting. Text saved by the attacker is served to the victim as script.')}
<ul>
<li><strong>Stored XSS:</strong> the payload is saved (a comment, a profile field, a payee name) and served to others.</li>
<li><strong>Reflected XSS:</strong> the payload is in a link (a search query, an error message) and echoed back in the response.</li>
<li><strong>DOM-based XSS:</strong> client-side JavaScript takes data from the URL or a message and writes it into the page with <code>innerHTML</code>, <code>document.write</code> or <code>eval</code>, without the server ever seeing it.</li>
</ul>
<h3>Defences</h3>
<ol>
<li><strong>Contextual output encoding.</strong> Encode data for the place it goes: HTML body (<code>&lt;</code> to <code>&amp;lt;</code>), HTML attribute, JavaScript string, URL parameter, CSS. Each context has different dangerous characters. Templating engines that encode by default (Thymeleaf, modern JSP with JSTL, React's JSX) prevent most XSS; the bugs appear where developers bypass them (<code>th:utext</code>, <code>dangerouslySetInnerHTML</code>).</li>
<li><strong>Safe DOM APIs:</strong> use <code>textContent</code> and <code>setAttribute</code> instead of <code>innerHTML</code>.</li>
<li><strong>Sanitise rich HTML</strong> that users are allowed to write, with an allow-list sanitiser (OWASP Java HTML Sanitizer on the server, DOMPurify in the browser). Never write your own with regular expressions.</li>
<li><strong>Content Security Policy:</strong> a response header that tells the browser which scripts may run. A strict policy allows only scripts carrying a random per-response nonce, so injected script tags do not execute even if encoding fails somewhere. <strong>Trusted Types</strong> go further and make dangerous DOM sinks reject plain strings.</li>
<li><strong>HttpOnly cookies</strong> limit the damage but do not prevent it.</li>
</ol>

<h2>Cross-site request forgery (CSRF)</h2>
<p>CSRF abuses ambient authority: the attacker's page makes the victim's browser send a state-changing request to a site where the victim is logged in.</p>
${fig('csrf', '<b>Figure 27.3</b> Cross-site request forgery. The attacker cannot read the bank\'s response, but the forged request, carrying the victim\'s cookie, has already moved money.')}
<p>Defences, best used together:</p>
<ul>
<li><strong>SameSite cookies:</strong> Lax or Strict stops cookies on cross-site POSTs. Set it explicitly rather than relying on browser defaults, and never perform state changes on GET.</li>
<li><strong>Anti-CSRF tokens:</strong> a random value tied to the session, included in each form or as a header, which an attacker's page cannot read (same-origin policy) and therefore cannot include. Frameworks such as Spring Security do this by default.</li>
<li><strong>Origin checks:</strong> reject state-changing requests whose <code>Origin</code> header, or <code>Sec-Fetch-Site</code> metadata, shows they came from another site.</li>
<li><strong>Re-authentication</strong> for high-value actions, which payment regulations require anyway.</li>
</ul>
<p>A related attack, <strong>clickjacking</strong>, loads your site invisibly in a frame on the attacker's page and tricks the user into clicking buttons in it. Prevent framing with <code>Content-Security-Policy: frame-ancestors 'none'</code> (or 'self').</p>

<h2>SQL injection</h2>
<p>Injection is the general pattern of untrusted data being interpreted as code by some interpreter. SQL injection is its most damaging form on the web.</p>
${fig('sqli', '<b>Figure 27.4</b> SQL injection. Concatenated input changes the query\'s structure; a prepared statement keeps input as data.')}
<p>The fix is structural: <strong>parameterised queries</strong> (prepared statements) for every value, in every query, including those in ORMs. JPA and Hibernate are safe when parameters are bound (<code>:name</code>) and unsafe when queries are built with string concatenation, which still happens in native queries and dynamic sorting. Identifiers such as column names for ORDER BY cannot be parameters; map them from an allow-list instead. Add defence in depth: database accounts with only the privileges the application needs, no access to other schemas, and errors that do not reveal SQL. The same discipline applies to NoSQL queries (where operators like <code>$ne</code> can be injected through JSON), LDAP filters, XPath and shell commands.</p>

<h2>Server-side request forgery (SSRF)</h2>
<p>Many applications fetch URLs on users' behalf. If the user can choose the URL, the server becomes a proxy into its own network.</p>
${fig('ssrf', '<b>Figure 27.5</b> SSRF against a cloud metadata service. A URL-fetching feature reveals the server\'s own credentials.')}
<p>Defences: prefer not to fetch arbitrary URLs at all; allow-list destinations by host; resolve the name and reject private, loopback, link-local and metadata addresses <em>after</em> resolution, and connect to that checked address (otherwise DNS rebinding swaps the address between check and use); do not follow redirects blindly; send fetches through an egress proxy (Chapter 22); and in the cloud, require IMDSv2 and give instance roles the least privilege.</p>

<h2>Broken access control</h2>
<p>The most common serious web vulnerability is not exotic. It is a missing or wrong authorisation check, and the OWASP Top 10 has ranked broken access control first since 2021. For APIs, the top risk is <strong>broken object-level authorisation</strong> (BOLA), also called an insecure direct object reference:</p>
${code('', 'none')`GET /api/accounts/10023/statements      ← the customer's own account: 200 OK
GET /api/accounts/10024/statements      ← someone else's: should be 403, is often 200`}
<p>Authentication tells the API who is calling; it must still check on every request that this caller may access this specific object (Chapter 1's complete mediation). Related flaws:</p>
<ul>
<li><strong>Function-level authorisation:</strong> admin endpoints that are merely hidden from the user interface.</li>
<li><strong>Mass assignment:</strong> binding a JSON body directly onto an entity lets a user set fields such as <code>role</code>, <code>approved</code> or <code>accountId</code>. Bind to request-specific DTOs with explicit fields.</li>
<li><strong>Multi-tenant leaks:</strong> a query that filters by ID but not by tenant.</li>
<li><strong>Trusting client-side checks</strong>: amounts, prices, limits or approval flags validated only in the browser or mobile app.</li>
</ul>
<p>Centralise authorisation in one well-tested layer, deny by default, and write tests that call every endpoint as the wrong user.</p>

<h2>Third-party scripts and the payment page</h2>
<p>A page that loads scripts from analytics, chat or advertising providers runs their code with the page's full authority. Attackers compromise those suppliers, or the site's own build, and inject card skimmers ("Magecart" attacks). In 2018 a few lines of modified JavaScript on British Airways' payment page sent the card details of around 400,000 customers to an attacker's domain for two weeks. PCI DSS 4.0 now requires merchants to inventory and authorise every script on payment pages and to detect unauthorised changes to them. Practical controls: keep payment pages minimal, embed the payment provider's hosted fields in an iframe, use Subresource Integrity hashes for static third-party scripts, a strict CSP, and change monitoring.</p>

<h2>Security headers</h2>
<div class="tbl"><table><tr><th>Header</th><th>Purpose</th></tr>
<tr><td><code>Strict-Transport-Security: max-age=63072000; includeSubDomains; preload</code></td><td>HTTPS only, no click-through on certificate errors (Chapter 14)</td></tr>
<tr><td><code>Content-Security-Policy</code> with nonces, <code>object-src 'none'</code>, <code>base-uri 'none'</code>, <code>frame-ancestors 'none'</code></td><td>Limit script execution and framing</td></tr>
<tr><td><code>X-Content-Type-Options: nosniff</code></td><td>Stop browsers guessing content types (uploaded files executing as script)</td></tr>
<tr><td><code>Referrer-Policy: strict-origin-when-cross-origin</code></td><td>Do not leak full URLs, which may contain tokens, to other sites</td></tr>
<tr><td><code>Permissions-Policy</code></td><td>Disable camera, microphone, geolocation and similar features you do not use</td></tr>
<tr><td><code>Cache-Control: no-store</code> on sensitive responses</td><td>Keep account pages out of shared caches</td></tr>
</table></div>

<h2>In code</h2>
${code('WebDefences.java')`import java.net.InetAddress;
import java.net.URI;
import java.security.SecureRandom;
import java.sql.Connection;
import java.sql.PreparedStatement;
import java.sql.ResultSet;
import java.util.Base64;
import java.util.Map;
import org.owasp.encoder.Encode;     // OWASP Java Encoder

public final class WebDefences {
    /** 1. SQL: bind values; allow-list identifiers. */
    static ResultSet statements(Connection db, String ownerId, long accountId, String sort) throws Exception {
        String orderBy = Map.of("date", "posted_at", "amount", "amount_cents").getOrDefault(sort, "posted_at");
        PreparedStatement ps = db.prepareStatement(
            "SELECT posted_at, description, amount_cents FROM statements " +
            "WHERE account_id = ? AND owner_id = ? ORDER BY " + orderBy + " DESC LIMIT 100");
        ps.setLong(1, accountId);
        ps.setString(2, ownerId);           // object-level authorisation inside the query
        return ps.executeQuery();
    }

    /** 2. XSS: encode for the exact context. */
    static String payeeRow(String name, String note) {
        return "<tr><td>" + Encode.forHtml(name) + "</td>"
             + "<td title=\"" + Encode.forHtmlAttribute(note) + "\">…</td></tr>";
    }

    /** 3. Headers, with a fresh CSP nonce per response. Session cookie with strict attributes. */
    static Map<String, String> headers() {
        byte[] n = new byte[16]; new SecureRandom().nextBytes(n);
        String nonce = Base64.getEncoder().encodeToString(n);
        return Map.of(
            "Content-Security-Policy", "script-src 'nonce-" + nonce + "' 'strict-dynamic'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'",
            "Strict-Transport-Security", "max-age=63072000; includeSubDomains; preload",
            "X-Content-Type-Options", "nosniff",
            "Referrer-Policy", "strict-origin-when-cross-origin",
            "Set-Cookie", "__Host-session=<random 256-bit id>; Path=/; Secure; HttpOnly; SameSite=Lax");
    }

    /** 4. SSRF: resolve, reject internal addresses, then connect to the checked address only. */
    static InetAddress checkedTarget(String url) throws Exception {
        URI u = URI.create(url);
        if (!"https".equals(u.getScheme())) throw new SecurityException("https only");
        InetAddress a = InetAddress.getByName(u.getHost());
        if (a.isLoopbackAddress() || a.isSiteLocalAddress() || a.isLinkLocalAddress()
            || a.isAnyLocalAddress() || a.isMulticastAddress() || a.getHostAddress().startsWith("100.64."))
            throw new SecurityException("internal address");
        return a;   // pin the connection to 'a' (and disable redirects) so DNS cannot change it later
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Checking authentication but not object ownership</strong> on every API call.</li>
<li><strong>String-built SQL</strong> anywhere, including "just this one" admin report.</li>
<li><strong>innerHTML with data,</strong> or disabling template auto-escaping.</li>
<li><strong>Reflecting arbitrary origins in CORS</strong> with credentials allowed.</li>
<li><strong>State changes on GET</strong> requests, which SameSite=Lax does not protect.</li>
<li><strong>URL fetchers</strong> that check the host name but connect to whatever it resolves to later.</li>
<li><strong>Uncontrolled third-party scripts</strong> on login and payment pages.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Same origin?</summary><p>Is https://app.example.com the same origin as https://example.com? No: different hosts. Same site? Yes, both under example.com, which matters for SameSite cookies.</p></details>
<details><summary>Encode it</summary><p>What should <code>&lt;img src=x onerror=alert(1)&gt;</code> look like when safely placed in an HTML body? <code>&amp;lt;img src=x onerror=alert(1)&amp;gt;</code>, which displays as text.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Test for BOLA</summary><p>Write an integration test suite that logs in as two different customers and calls every account-scoped endpoint of your API with the other customer's IDs. Every call must return 403 or 404.</p></details>
<details><summary>Deploy a strict CSP</summary><p>Add a nonce-based CSP in report-only mode to a Java web app, collect violation reports for a week, fix inline scripts and event handlers, then enforce it.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Exploit and fix in a lab</summary><p>Use OWASP Juice Shop or WebGoat to exploit a stored XSS, a CSRF, an SQL injection and an IDOR. For each, write the Java fix in a small Spring Boot equivalent and a regression test.</p></details>
<details><summary>SSRF-safe fetcher</summary><p>Implement a URL fetcher with Java's HttpClient that resolves the host, rejects internal ranges for IPv4 and IPv6 (including IPv4-mapped IPv6 addresses), connects only to the checked address with the original Host header and TLS name, follows no redirects and limits response size. Test it against a DNS name that rebinds to 127.0.0.1.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can define an origin and explain the same-origin policy's send-but-not-read rule.</li>
<li>I can set cookie attributes correctly and explain what CORS does and does not do.</li>
<li>I can explain stored, reflected and DOM XSS and apply encoding, sanitising and CSP.</li>
<li>I can explain CSRF and clickjacking and apply SameSite, tokens, Origin checks and frame-ancestors.</li>
<li>I can prevent SQL and other injection with parameterisation and allow-lists.</li>
<li>I can explain SSRF and broken object-level authorisation, and secure third-party scripts on payment pages.</li>
</ul>
`});

boot();
