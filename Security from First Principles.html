CH.push({
  id: 'ch17', n: 17, title: 'Zero-Knowledge Proofs',
  lede: 'A zero-knowledge proof convinces someone that a statement is true while revealing nothing beyond that fact. You can prove you know a private key without revealing it, that a payment is valid without revealing its amount, or that you are over 18 without revealing your birth date. This chapter builds the idea from a children\'s-story example to Schnorr\'s protocol and its simulator, connects it to the signatures of Chapter 12, surveys modern succinct proofs and their uses in finance and identity, and closes with the other "compute on secrets" tools: multiparty computation, threshold signatures and homomorphic encryption.',
  html: `
<h2>Proving without revealing</h2>
<p>Ordinary proofs reveal their reasoning. To prove a number is composite you show a factor; to log in you send your password. In 1985 Shafi Goldwasser, Silvio Micali and Charles Rackoff asked whether a proof could convince a verifier while giving away nothing else, and showed that it can. The answer reshaped cryptography: it led to modern signatures, private digital money, anonymous credentials and verifiable outsourced computation.</p>
<p>The setting is an <strong>interactive proof</strong>: a prover P and a verifier V exchange messages, and at the end V accepts or rejects a statement, such as "I know the discrete logarithm of y". Three properties define a zero-knowledge proof:</p>
<ul>
<li><strong>Completeness:</strong> if the statement is true and P follows the protocol, V accepts.</li>
<li><strong>Soundness:</strong> if the statement is false, no cheating prover can make V accept except with small probability, the <em>soundness error</em>. Repeating the protocol shrinks it exponentially.</li>
<li><strong>Zero knowledge:</strong> V learns nothing except that the statement is true. Formally, there is an efficient <strong>simulator</strong> that, without the secret, produces transcripts indistinguishable from real conversations. If V could have generated the conversation alone, the conversation taught V nothing.</li>
</ul>
<p>A <strong>proof of knowledge</strong> adds that a prover who succeeds must actually <em>know</em> a witness (the secret), not merely that one exists: there is an <em>extractor</em> that, by running the prover and rewinding it, pulls the secret out.</p>

<h2>The cave</h2>
<p>The classic illustration, from Jean-Jacques Quisquater and colleagues' 1989 article "How to Explain Zero-Knowledge Protocols to Your Children", is a cave with a magic door.</p>
${fig('cave', '<b>Figure 17.1</b> The Ali Baba cave. Peggy proves she knows the secret word by always emerging where Victor asks, without ever saying the word.')}
<p>The structure of the cave protocol is the structure of every efficient zero-knowledge proof: the prover <em>commits</em> (picks a side), the verifier issues a random <em>challenge</em> (calls a side), the prover gives a <em>response</em> (emerges). A three-move protocol of this shape is called a <strong>Σ-protocol</strong> (sigma protocol).</p>

<h2>Schnorr's protocol</h2>
<p>Let G be a group of prime order q with generator g, where discrete logarithms are hard. The prover knows x; the public key is y = gˣ. To prove knowledge of x:</p>
<ol>
<li><strong>Commit:</strong> P picks random r in ℤ_q and sends t = gʳ.</li>
<li><strong>Challenge:</strong> V sends a random c in ℤ_q.</li>
<li><strong>Respond:</strong> P sends s = r + c·x mod q.</li>
<li><strong>Verify:</strong> V accepts if gˢ = t · yᶜ, which holds because g<sup>r + cx</sup> = gʳ · (gˣ)ᶜ.</li>
</ol>
${fig('schnorr', '<b>Figure 17.2</b> Schnorr identification with toy numbers. The response proves knowledge of x without revealing it, because the random r masks it.')}
<h3>Why it is sound: special soundness</h3>
<p>Suppose a prover can answer two different challenges c₁ ≠ c₂ for the same commitment t, with responses s₁ and s₂. Then g<sup>s₁ − s₂</sup> = y<sup>c₁ − c₂</sup>, so x = (s₁ − s₂)/(c₁ − c₂) mod q. Anyone who can answer two challenges knows x. A prover who does not know x can answer at most one challenge per commitment, so with a large challenge space (say 2<sup>128</sup> values) a cheater almost never succeeds in a single run.</p>
<p>This is exactly the algebra behind Chapter 12's ECDSA nonce-reuse attack: reusing r for two challenges gives away the secret. The extractor in the proof of knowledge is the honest version of that attack.</p>
<h3>Why it is zero knowledge: the simulator</h3>
<p>A simulator who does not know x can produce valid transcripts by working backwards: choose c and s at random, then compute t = gˢ · y<sup>−c</sup>. The triple (t, c, s) verifies, and it has exactly the same distribution as an honest run with an honest verifier.</p>
${fig('simul', '<b>Figure 17.3</b> A real conversation and a simulated one. They are indistinguishable, so the conversation carries no information about the secret.')}
<p>Strictly, this shows <em>honest-verifier</em> zero knowledge, for a verifier that picks challenges at random. Standard techniques extend it to arbitrary verifiers, and the non-interactive version below sidesteps the issue.</p>

<h2>From proofs to signatures: Fiat-Shamir</h2>
<p>Interaction is inconvenient. In 1986 Amos Fiat and Adi Shamir proposed replacing the verifier's random challenge with a hash of the commitment and the statement: c = H(g, y, t). The prover can then compute the whole proof alone and send (t, s). If the hash behaves like a random function, the prover cannot choose t to suit a challenge it knows in advance.</p>
<p>Include a message in the hash, c = H(g, y, t, m), and the proof becomes a <strong>signature</strong> on m: the Schnorr signature of Chapter 12. EdDSA, and in lattice form ML-DSA, are Fiat-Shamir signatures. The same transformation makes most modern zero-knowledge proofs non-interactive.</p>
<div class="note pit"><b>Pitfall</b><p>The hash must cover <em>every</em> public value: the group, the generator, the public key, all commitments and the context. In 2022 researchers disclosed "Frozen Heart" vulnerabilities in several zero-knowledge proof libraries that hashed only part of the statement; an attacker could choose the missing values after seeing the challenge and forge proofs of false statements. This "weak Fiat-Shamir" mistake has also affected voting systems.</p></div>

<h2>Proving more complex statements</h2>
<p>Σ-protocols combine. You can prove knowledge of two secrets at once (run both in parallel with one challenge), that two values share the same discrete logarithm (Chaum-Pedersen, used to prove a decryption is correct), or that you know <em>one of</em> several secrets without revealing which (OR proofs, used in ring signatures and in proving a vote is 0 or 1).</p>
<p>A deeper result (Goldreich, Micali and Wigderson, 1986) says every statement in NP, anything whose truth can be checked efficiently given a witness, has a zero-knowledge proof. Modern systems make this practical:</p>
<ol>
<li><strong>Arithmetise:</strong> express the statement as an arithmetic circuit over a finite field, or a set of polynomial constraints. "I know a preimage of this SHA-256 hash", "this transaction's inputs equal its outputs and the sender owns the inputs", "the birth date in my signed ID is before 2008".</li>
<li><strong>Prove:</strong> turn satisfying the circuit into claims about polynomials, commit to those polynomials, and prove the claims at random points chosen by Fiat-Shamir.</li>
</ol>
<div class="tbl"><table><tr><th>System</th><th>Proof size</th><th>Verification</th><th>Setup</th><th>Notes</th></tr>
<tr><td>Groth16 (zk-SNARK)</td><td>about 200 bytes</td><td>milliseconds</td><td>trusted, per circuit</td><td>Smallest proofs; setup secrets ("toxic waste") must be destroyed, done in multi-party ceremonies</td></tr>
<tr><td>PLONK and descendants</td><td>under 1 KB</td><td>milliseconds</td><td>trusted, universal</td><td>One ceremony serves all circuits up to a size</td></tr>
<tr><td>Bulletproofs</td><td>about 1 KB (logarithmic)</td><td>slower, linear</td><td>none</td><td>Range proofs in Monero</td></tr>
<tr><td>zk-STARKs</td><td>tens to hundreds of KB</td><td>fast</td><td>none (transparent)</td><td>Hash-based, so plausibly post-quantum</td></tr>
</table></div>
<p>"Succinct" means proofs are short and fast to verify regardless of the computation's size: a proof that a million transactions were processed correctly can be checked in milliseconds. Proving remains expensive, often thousands to millions of times the cost of the computation itself, though falling quickly with better algorithms and hardware.</p>

<h2>Where zero knowledge is used</h2>
<ul>
<li><strong>Private payments:</strong> Zcash (2016) proves that shielded transactions balance and that the sender owns the inputs, hiding sender, receiver and amount.</li>
<li><strong>Blockchain scaling:</strong> zk-rollups execute thousands of transactions off-chain and post a single validity proof on-chain.</li>
<li><strong>Proof of reserves:</strong> after FTX's collapse in 2022, exchanges began publishing Merkle trees of customer balances; zero-knowledge versions prove that total liabilities are covered and every balance is non-negative without revealing any customer's balance.</li>
<li><strong>Selective disclosure and age verification:</strong> a holder of a signed digital ID proves "over 18" or "resident of this country" without revealing name or birth date. Google open-sourced such a system for age assurance in 2025, and European digital identity wallets are adopting selective disclosure.</li>
<li><strong>Verifiable computation:</strong> a cloud provider proves it ran a computation correctly; a model owner proves an output came from a committed model.</li>
<li><strong>Authentication:</strong> PAKEs such as OPAQUE and some password systems use zero-knowledge components so the server never learns the password.</li>
</ul>

<h2>Beyond zero knowledge: computing on secrets</h2>
<h3>Secure multiparty computation</h3>
<p>Andrew Yao's 1982 "millionaires' problem" asked: can two millionaires learn who is richer without revealing their wealth? <strong>Secure multiparty computation</strong> (MPC) lets several parties compute any function of their private inputs, learning only the output. Techniques include garbled circuits (Yao) and secret-sharing-based protocols, where each input is split into random shares and the parties compute on shares. Deployed uses include private set intersection (finding common customers between two banks for fraud detection without exposing the rest), auctions, and privacy-preserving advertising measurement.</p>
<h3>Threshold signatures</h3>
<p>A special case widely used in finance: the private key is split among n parties, any t of whom can jointly sign, and the full key never exists in one place, not even during signing. Digital-asset custodians use MPC wallets so that compromising one server or one employee's device is not enough to move funds. FROST (RFC 9591, 2024) standardises threshold Schnorr signatures; threshold ECDSA is more complex but deployed.</p>
<h3>Homomorphic encryption</h3>
<p><strong>Fully homomorphic encryption</strong> (FHE), first constructed by Craig Gentry in 2009, lets anyone compute on encrypted data and produce an encrypted result that only the key holder can read. Modern schemes (BGV, BFV, CKKS for approximate arithmetic, TFHE for fast binary operations) are lattice-based and, like ML-KEM, rely on LWE. FHE is still thousands of times slower than computing on plaintext, but practical for narrow tasks: private database lookups, encrypted model inference, and private information retrieval. Partially homomorphic schemes, such as ElGamal (Chapter 11) and Paillier, support one operation and are much faster.</p>
<div class="note key"><b>Key idea</b><p>These tools change the question from "who must we trust with the data?" to "what must anyone learn?". When a design requires one party to see everything, ask whether a proof, an MPC protocol or a threshold key would remove that need.</p></div>

<h2>In code: Schnorr proofs in Java</h2>
${code('SchnorrProof.java')`import java.math.BigInteger;
import java.nio.ByteBuffer;
import java.nio.charset.StandardCharsets;
import java.security.MessageDigest;
import java.security.SecureRandom;

/** Non-interactive Schnorr proof of knowledge (Fiat-Shamir). Educational: real systems use a
 *  standard elliptic-curve group and a vetted library. */
public final class SchnorrProof {
    static final SecureRandom RNG = new SecureRandom();
    final BigInteger p, q, g;

    SchnorrProof(int bits) {                       // safe prime p = 2q + 1; g generates the order-q subgroup
        BigInteger qq, pp;
        do { qq = BigInteger.probablePrime(bits - 1, RNG); pp = qq.shiftLeft(1).add(BigInteger.ONE); }
        while (!pp.isProbablePrime(64));
        p = pp; q = qq; g = BigInteger.valueOf(4);  // 4 = 2^2 is a quadratic residue, so it has order q
    }

    BigInteger challenge(BigInteger y, BigInteger t, String context) throws Exception {
        MessageDigest h = MessageDigest.getInstance("SHA-256");
        for (BigInteger v : new BigInteger[] { p, q, g, y, t }) {                       // hash EVERYTHING,
            byte[] b = v.toByteArray();                                                   // length-prefixed
            h.update(ByteBuffer.allocate(4).putInt(b.length).array()); h.update(b);
        }
        h.update(context.getBytes(StandardCharsets.UTF_8));
        return new BigInteger(1, h.digest()).mod(q);
    }

    BigInteger[] prove(BigInteger x, BigInteger y, String ctx) throws Exception {
        BigInteger r = new BigInteger(q.bitLength() + 64, RNG).mod(q);     // fresh, uniform, never reused
        BigInteger t = g.modPow(r, p);
        BigInteger c = challenge(y, t, ctx);
        return new BigInteger[] { t, r.add(c.multiply(x)).mod(q) };
    }

    boolean verify(BigInteger y, BigInteger[] proof, String ctx) throws Exception {
        BigInteger t = proof[0], s = proof[1], c = challenge(y, t, ctx);
        return g.modPow(s, p).equals(t.multiply(y.modPow(c, p)).mod(p));
    }

    public static void main(String[] args) throws Exception {
        SchnorrProof grp = new SchnorrProof(512);                           // demo size only
        BigInteger x = new BigInteger(grp.q.bitLength(), RNG).mod(grp.q);  // secret
        BigInteger y = grp.g.modPow(x, grp.p);                              // public
        BigInteger[] proof = grp.prove(x, y, "login nonce 8f2c");
        System.out.println(grp.verify(y, proof, "login nonce 8f2c"));       // true
        System.out.println(grp.verify(y, proof, "login nonce 0000"));       // false: bound to its context
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Weak Fiat-Shamir:</strong> leaving public inputs out of the challenge hash.</li>
<li><strong>Reusing or biasing the prover's randomness,</strong> which leaks the witness by special soundness.</li>
<li><strong>Bugs in circuits:</strong> a missing constraint lets a prover prove a false statement that the verifier accepts. Circuit code needs audits like smart contracts.</li>
<li><strong>Trusting a setup ceremony</strong> without understanding who participated and how secrets were destroyed.</li>
<li><strong>Assuming zero knowledge hides metadata:</strong> timing, sizes and which verifier you talk to can still identify you.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Soundness error</summary><p>How many rounds of the cave protocol make a cheater's success probability below one in a billion? 30, since 2<sup>30</sup> ≈ 1.07 × 10<sup>9</sup>.</p></details>
<details><summary>Verify by hand</summary><p>In the toy group (p = 23, g = 2, y = 18), check the proof t = 8, c = 2, s = 9. 2<sup>9</sup> = 512 ≡ 6, and 8 × 18² = 8 × 324 ≡ 8 × 2 = 16. Not equal, so reject.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Extract the secret</summary><p>A prover answers c₁ = 3 with s₁ = 5 and c₂ = 8 with s₂ = 3 for the same commitment, in the group of order 11. Recover x = (s₁ − s₂)/(c₁ − c₂) mod 11. 2/(−5) ≡ 2 × 2 = 4, since −5 ≡ 6 and 6⁻¹ ≡ 2 mod 11.</p></details>
<details><summary>Chaum-Pedersen</summary><p>Design a Σ-protocol proving that y₁ = gˣ and y₂ = hˣ use the same x, without revealing x. Hint: commit to gʳ and hʳ with one r, answer with one s.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Break weak Fiat-Shamir</summary><p>Modify the Java code so the challenge hashes only t, not y. Show how to produce a valid-looking proof for a public key y of your choice without knowing its discrete log: pick s and c, then solve for y given t.</p></details>
<details><summary>Proof of reserves</summary><p>Build a Merkle sum tree in Java where each node stores the hash of its children and the sum of their balances. Produce inclusion proofs that let a customer check their balance is counted, and discuss what a zero-knowledge layer adds.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can define completeness, soundness, zero knowledge and proof of knowledge.</li>
<li>I can explain the cave protocol and the commit-challenge-response pattern.</li>
<li>I can run Schnorr's protocol and explain special soundness and the simulator.</li>
<li>I can explain the Fiat-Shamir transform, its link to signatures and the weak Fiat-Shamir pitfall.</li>
<li>I can compare SNARKs, STARKs and Bulletproofs and name real applications.</li>
<li>I can explain MPC, threshold signatures and homomorphic encryption and when each helps.</li>
</ul>
`});

  const pts = [1, 2, 3, 4, 5].map(x => [x, f(x)]);
  // two-share ambiguity: parabolas through (1,6.4) and (2,7.6) with different intercepts
  const through2 = S0 => { const a = ((7.6 - S0) / 2 - (6.4 - S0)) / 1; const b = 6.4 - S0 - a; return x => S0 + b * x + a * x * x; };
  const F = [

    { k: 2, note: 'Any three shares determine a unique degree-2 polynomial (three points fix a parabola), so three people can interpolate it and read off f(0) = S.' },

CH.push({
  id: 'ch18', n: 18, title: 'Key Management',
  lede: 'Cryptography turns the problem of protecting data into the problem of protecting keys. Most real cryptographic failures are not broken algorithms but keys that were hard-coded, shared, never rotated, logged or left on a laptop. This chapter covers the life of a key from generation to destruction, the hardware and services that keep keys safe, envelope encryption and key hierarchies, rotation without downtime, tokenisation for card data, secrets management for applications, and splitting keys among people. It includes Terraform and Java for a cloud KMS.',
  html: `
<h2>Why key management is the hard part</h2>
<p>AES-256 has never been broken. Yet encrypted data is stolen regularly, because attackers take the keys. The key is in the same database backup as the ciphertext; it is in an environment variable printed by a debug page; it is in a Git repository from 2019; it is on the laptop of an engineer who left. A key management design answers, for every key: <em>who or what can use it, for what, where does it live, how long does it live, and what happens if it leaks?</em></p>
<p>Keys come in several kinds, and each needs an answer:</p>
<ul>
<li><strong>Data encryption keys</strong> (DEKs) that encrypt records, files and backups.</li>
<li><strong>Key encryption keys</strong> (KEKs) that encrypt other keys.</li>
<li><strong>Signing keys</strong> for tokens, documents, software and certificates.</li>
<li><strong>TLS private keys</strong> for servers and clients.</li>
<li><strong>MAC keys</strong> for request signing, webhooks and session cookies.</li>
<li><strong>Secrets</strong> in the broader sense: database passwords, API keys, OAuth client secrets.</li>
</ul>

<h2>The key lifecycle</h2>
<p>NIST SP 800-57 describes the stages a key passes through. Each stage has its own risks and controls.</p>
${fig('lifecycle', '<b>Figure 18.1</b> The key lifecycle. Step through each stage and its main control.')}
<p>A <strong>cryptoperiod</strong> is how long a key may be used for its purpose. It is set by how much data the key protects (AEAD usage limits, Chapter 8), how valuable that data is, the risk of exposure over time (people who have had access, systems that have touched the key) and compliance rules. Encryption keys often have a period for creating new ciphertexts (originator usage) and a longer one for decrypting old ones (recipient usage).</p>

<h2>Where keys live</h2>
${fig('ladder', '<b>Figure 18.2</b> From worst to best: where keys and secrets are kept, and what each option protects against.')}
<h3>Hardware security modules</h3>
<p>An HSM is a hardened computer whose job is to generate, store and use keys without ever revealing them. Keys are marked non-exportable; applications send data in and get ciphertexts or signatures out. Physical protections detect drilling, probing, temperature and voltage manipulation and wipe keys when tampered with. HSMs are validated under FIPS 140-3: Level 2 requires tamper evidence and role-based authentication, Level 3 adds tamper response and identity-based authentication, and Level 4 protects against environmental attacks. Payment HSMs, certified under PCI PTS HSM, add functions for PIN translation, card verification values and key exchange between banks using standardised key blocks (ANSI X9.143 / TR-31) that bind each key to its permitted use.</p>
<p>Applications talk to general-purpose HSMs through PKCS#11, or in Java through a JCE provider (the SunPKCS11 provider or the vendor's). The same pattern exists on devices: a TPM in a server or laptop, the Secure Enclave or StrongBox in a phone, and the secure element in a payment card.</p>
<h3>Cloud key management services</h3>
<p>A cloud KMS (AWS KMS, Google Cloud KMS, Azure Key Vault) offers HSM-backed keys as an API. You never see the key material; you call Encrypt, Decrypt, GenerateDataKey or Sign, and the service checks the caller's identity against the key's policy and logs every call. Important features:</p>
<ul>
<li><strong>Key policies</strong> separate who may administer a key (create, rotate, schedule deletion) from who may use it, so administrators cannot decrypt data and applications cannot delete keys.</li>
<li><strong>Encryption context</strong>: key-value pairs bound to each ciphertext as associated data. Decryption must present the same context, so a ciphertext for tenant 42 cannot be decrypted in a request for tenant 99, and the context appears in audit logs.</li>
<li><strong>Size limits</strong>: direct Encrypt calls accept small payloads only (4 KB in AWS KMS), which is why bulk data uses envelope encryption.</li>
<li><strong>Key custody options</strong>: imported key material (bring your own key), dedicated single-tenant HSM clusters, and external key stores where the key stays in your own HSM outside the cloud.</li>
</ul>

<h2>Envelope encryption</h2>
<p>Encrypting every record through a remote KMS would be slow and limited. Instead, generate a <strong>data key</strong> per object (or per batch, or per hour), encrypt the data locally with it, and store the data key wrapped under a KMS key next to the data.</p>
${fig('envelope', '<b>Figure 18.3</b> Envelope encryption with a KMS. The KEK stays inside the KMS; only wrapped data keys are stored.')}
<p>Benefits multiply. Bulk encryption runs at local AES speed. The KMS sees only key-sized requests and logs each unwrap. Access to data is controlled in one place, the KEK's policy. And the scheme extends naturally into a hierarchy.</p>
<h3>Key hierarchies and crypto-shredding</h3>
${fig('hierarchy', '<b>Figure 18.4</b> A key hierarchy. A root key in an HSM protects key-encryption keys, which protect data keys. Destroying one KEK makes everything beneath it unreadable.')}
<p>Each level protects a manageable number of keys below it. A per-tenant KEK gives strong isolation and makes <strong>crypto-shredding</strong> possible: to erase a customer's data, including copies in backups and replicas that cannot practically be edited, destroy the key that protects it. This is a common way to meet data-erasure obligations under privacy law.</p>

<h2>Rotation</h2>
<p>Rotating a key means introducing a new version for new operations. Done well it is routine and invisible:</p>
<ol>
<li><strong>Version every key</strong> and record the version (or a key ID) in every ciphertext, signature or token, as the format in Chapter 8 does.</li>
<li><strong>Encrypt and sign with the newest version; decrypt and verify with any active version.</strong></li>
<li><strong>Re-encrypt lazily or in the background</strong> if old versions must eventually be retired. With envelope encryption, rotating a KEK means re-wrapping data keys, a small operation, not re-encrypting all data.</li>
<li><strong>For signing keys,</strong> publish the new public key before using it (for example in a JWKS endpoint with a new <code>kid</code>), sign with the new key, and remove the old public key only after all tokens signed with it have expired.</li>
<li><strong>For shared secrets</strong> such as API keys, allow two valid secrets during a changeover so clients can switch without an outage.</li>
</ol>
<p>Cloud KMS services can rotate key material automatically, keeping old versions for decryption; AWS KMS defaults to yearly and allows periods from 90 days to about seven years. Automatic rotation protects against long-term exposure of key material; it does not help if an attacker has permission to call Decrypt, so policies and monitoring matter as much.</p>
<h3>When a key is compromised</h3>
<p>Have a written runbook before you need it: who decides, how to disable the key, what data or tokens it protected, how to issue replacements, how to notify partners. Practise it. An unrotatable key, one baked into firmware or shared with fifty partners by email, is a liability to remove.</p>

<h2>Tokenisation and format-preserving encryption</h2>
<p>Card numbers (PANs) attract strict rules under PCI DSS: every system that stores, processes or transmits them is "in scope" and must meet hundreds of requirements. <strong>Tokenisation</strong> shrinks that scope. A tokenisation service replaces the PAN with a random surrogate, the token, and keeps the mapping in a tightly controlled vault. Everything downstream handles only tokens.</p>
${fig('tokenize', '<b>Figure 18.5</b> Tokenisation. Only the vault and the link to the payment processor ever see real card numbers; other systems leave PCI scope.')}
<ul>
<li>Tokens must not be derivable from the PAN without the vault. In particular, an unsalted hash of a card number is not a token: with a known 6- or 8-digit issuer prefix and the Luhn check digit, only about a billion candidates remain, which a GPU hashes in under a second.</li>
<li><strong>Vaultless tokenisation</strong> derives tokens with a keyed function instead of storing a table, trading the vault for a key that must be protected like any other.</li>
<li><strong>Format-preserving encryption</strong> (FPE, NIST SP 800-38G, mode FF1) encrypts a 16-digit number to another 16-digit number, so legacy schemas and validations keep working. FPE is deterministic and has small domains, so use it only where the format constraint is real, and never for short fields such as a 4-digit PIN where the whole domain can be enumerated.</li>
<li>Network tokenisation by card schemes replaces PANs with device- or merchant-bound tokens for each transaction, and wallet payments use it by default.</li>
</ul>

<h2>Secrets management for applications</h2>
<p>Applications need credentials for databases, queues and third-party APIs. Good practice:</p>
<ul>
<li><strong>Centralise in a secrets manager</strong> (HashiCorp Vault, cloud secrets managers) with access policies per service, audit logs and rotation.</li>
<li><strong>Prefer identity to secrets.</strong> Workload identity, such as cloud IAM roles for compute, Kubernetes service account tokens, SPIFFE certificates and OIDC federation for CI pipelines, lets services authenticate without any stored long-lived secret. This removes the "secret zero" problem of how the application authenticates to the secrets manager.</li>
<li><strong>Use short-lived, dynamic credentials:</strong> Vault can create a database user for each service instance with a lease of an hour, so leaked credentials expire on their own.</li>
<li><strong>Keep secrets out of code, images, logs and URLs.</strong> Run secret scanning in commit hooks and in CI; public code hosts find millions of leaked credentials a year.</li>
<li><strong>Separate environments</strong>: a staging secret must not work in production.</li>
</ul>

<h2>Splitting keys among people</h2>
<p>The most valuable keys, such as an HSM's master backup key or a CA's root, should not depend on any single person. Two principles apply: <strong>split knowledge</strong> (no one knows the whole key) and <strong>dual control</strong> (no one can use it alone). Shamir's secret sharing implements both mathematically.</p>
${fig('shamir', '<b>Figure 18.6</b> Shamir secret sharing with threshold 3 of 5. Three points determine the polynomial and its value at zero; two points leave it completely undetermined.')}
<p>A <strong>key ceremony</strong> generates or restores such keys in a scripted, witnessed, recorded event: custodians present their shares (often on smart cards), the HSM combines them internally, and auditors sign the log. Threshold signatures (Chapter 17) go further, letting key holders sign jointly without ever reconstructing the key.</p>

<h2>In code: envelope encryption in Java</h2>
${code('EnvelopeEncryption.java')`import java.nio.ByteBuffer;
import java.security.SecureRandom;
import java.util.Arrays;
import java.util.Map;
import javax.crypto.Cipher;
import javax.crypto.spec.GCMParameterSpec;
import javax.crypto.spec.SecretKeySpec;
import software.amazon.awssdk.core.SdkBytes;
import software.amazon.awssdk.services.kms.KmsClient;
import software.amazon.awssdk.services.kms.model.DataKeySpec;
import software.amazon.awssdk.services.kms.model.GenerateDataKeyResponse;

/** Format: len(wrappedDek) | wrappedDek | nonce | ciphertext+tag. AWS SDK for Java v2. */
public final class EnvelopeEncryption {
    private static final SecureRandom RNG = new SecureRandom();
    private final KmsClient kms = KmsClient.create();
    private final String kekAlias = "alias/statements-kek";

    public byte[] encrypt(byte[] plaintext, String tenantId) throws Exception {
        Map<String, String> ctx = Map.of("purpose", "statements", "tenant", tenantId);
        GenerateDataKeyResponse dk = kms.generateDataKey(r -> r.keyId(kekAlias).keySpec(DataKeySpec.AES_256).encryptionContext(ctx));
        byte[] dek = dk.plaintext().asByteArray(), wrapped = dk.ciphertextBlob().asByteArray();
        try {
            byte[] nonce = new byte[12]; RNG.nextBytes(nonce);
            Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
            c.init(Cipher.ENCRYPT_MODE, new SecretKeySpec(dek, "AES"), new GCMParameterSpec(128, nonce));
            c.updateAAD(tenantId.getBytes());                         // bind locally as well
            byte[] ct = c.doFinal(plaintext);
            return ByteBuffer.allocate(4 + wrapped.length + 12 + ct.length)
                .putInt(wrapped.length).put(wrapped).put(nonce).put(ct).array();
        } finally {
            Arrays.fill(dek, (byte) 0);                               // do not keep the plaintext DEK
        }
    }

    public byte[] decrypt(byte[] blob, String tenantId) throws Exception {
        ByteBuffer b = ByteBuffer.wrap(blob);
        byte[] wrapped = new byte[b.getInt()]; b.get(wrapped);
        byte[] nonce = new byte[12]; b.get(nonce);
        byte[] ct = new byte[b.remaining()]; b.get(ct);
        Map<String, String> ctx = Map.of("purpose", "statements", "tenant", tenantId);
        byte[] dek = kms.decrypt(r -> r.ciphertextBlob(SdkBytes.fromByteArray(wrapped)).encryptionContext(ctx))
                        .plaintext().asByteArray();                   // fails if the context differs
        try {
            Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
            c.init(Cipher.DECRYPT_MODE, new SecretKeySpec(dek, "AES"), new GCMParameterSpec(128, nonce));
            c.updateAAD(tenantId.getBytes());
            return c.doFinal(ct);
        } finally {
            Arrays.fill(dek, (byte) 0);
        }
    }
}`}
<p>Libraries such as the AWS Encryption SDK and Google Tink implement this pattern with key caching, versioned formats and key commitment already built in. Prefer them to hand-rolled envelopes in production.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Keys stored next to the data they protect,</strong> in the same database, backup or container image.</li>
<li><strong>One key for everything:</strong> all tenants, all purposes, all environments.</li>
<li><strong>No key ID in ciphertexts,</strong> making rotation impossible without a migration.</li>
<li><strong>Administrators who can also use keys,</strong> or applications that can delete them.</li>
<li><strong>Hashing card numbers</strong> and calling the result a token.</li>
<li><strong>Long-lived static cloud credentials</strong> in CI pipelines instead of OIDC federation.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Which key?</summary><p>For each item choose KMS-held KEK, local DEK, or secrets manager: (a) the key that encrypts a 2 GB export file; (b) the key that protects that file's key; (c) the password for a legacy SFTP partner. (a) DEK, (b) KEK, (c) secrets manager.</p></details>
<details><summary>Hashed PANs</summary><p>Explain why SHA-256 of a card number is not a safe token, with an estimate of the brute-force cost.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Rotation plan</summary><p>Write a rotation plan for an HMAC key that signs webhooks to 300 merchants, with no downtime. Hint: dual signatures or two accepted secrets, a published schedule, and monitoring of which merchants still verify with the old key.</p></details>
<details><summary>Implement Shamir</summary><p>Implement 3-of-5 Shamir secret sharing over the prime field modulo 2<sup>127</sup> − 1 in Java with BigInteger, using Lagrange interpolation at 0. Check that any 3 shares recover the secret and 2 give random-looking results.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Per-tenant crypto-shredding</summary><p>Design a multi-tenant document store where each tenant has its own KEK, documents have DEKs, and deleting a tenant destroys only its KEK. Address backups, search indexes, caches and logs that might hold plaintext.</p></details>
<details><summary>Least-privilege key policy</summary><p>Extend the Terraform above with a second service that may only call Decrypt for one tenant's encryption context, a CloudWatch alarm on Decrypt calls from unexpected principals, and an SCP that prevents disabling key rotation.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can describe the key lifecycle and choose cryptoperiods.</li>
<li>I can compare storage options from source code to HSMs and explain FIPS 140-3 levels.</li>
<li>I can implement envelope encryption with a KMS and encryption context.</li>
<li>I can design a key hierarchy, rotate keys without downtime and use crypto-shredding.</li>
<li>I can explain tokenisation, format-preserving encryption and their PCI DSS role.</li>
<li>I can apply secrets-management practices, workload identity and Shamir secret sharing.</li>
</ul>
`});

CH.push({
  id: 'ch19', n: 19, title: 'Local Network Attacks and Wi-Fi Security',
  lede: 'The protocols that glue a local network together, Ethernet, ARP, DHCP and VLANs, were designed for cooperative machines and authenticate almost nothing. Anyone who plugs into the network, or joins the Wi-Fi, can impersonate the gateway, hand out false addresses or flood switches. This chapter works through those attacks and their switch-level defences, then takes Wi-Fi security apart from the broken WEP, through the WPA2 handshake and its offline cracking and KRACK flaws, to WPA3 and enterprise authentication.',
  html: `
<h2>The local network is a trust boundary</h2>
<p>Inside a broadcast domain, a VLAN or a Wi-Fi network, hosts discover each other with protocols that assume everyone tells the truth. That made sense in 1982. Today the local network includes guest laptops, IoT devices, compromised workstations and anyone who can reach a network port in a meeting room. A single compromised machine on a flat network can attack all the others.</p>
<p>The attacks below need only local access. They matter in offices, data centres with shared layer-2 segments, branch sites, hotels, cafés and anywhere a contractor's laptop is plugged in.</p>

<h2>ARP spoofing</h2>
<p>IPv4 hosts find each other's hardware (MAC) addresses with the Address Resolution Protocol. A host that wants to reach 10.0.0.1 broadcasts "who has 10.0.0.1?" and caches the reply. ARP has no authentication, and hosts also accept <em>unsolicited</em> replies ("gratuitous ARP"), which exist so that a host can announce a changed address.</p>
${fig('arpspoof', '<b>Figure 19.1</b> ARP cache poisoning. Two forged replies put the attacker in the middle of the victim\'s traffic to the gateway.')}
<p>ARP spoofing is the first step of most LAN attacks because it creates a man-in-the-middle position on demand. Free tools automate it, together with the follow-on attacks: capturing credentials from unencrypted protocols, <strong>SSL stripping</strong> (rewriting HTTPS links to HTTP for sites without HSTS), DNS spoofing and session hijacking. IPv6 has the same problem in a different protocol: Neighbor Discovery messages are equally unauthenticated, and a rogue <em>router advertisement</em> can make every host on a segment route through the attacker, even on networks that think they do not use IPv6.</p>
<h3>Defences</h3>
<ul>
<li><strong>Dynamic ARP Inspection</strong> on switches drops ARP replies that do not match a trusted table of IP-to-MAC bindings, usually built by DHCP snooping. <strong>RA Guard</strong> does the equivalent for IPv6 router advertisements.</li>
<li><strong>Client isolation</strong> (private VLANs, Wi-Fi client isolation) prevents hosts on the same segment from talking directly at all, which suits guest and IoT networks.</li>
<li><strong>Encryption above layer 2</strong>: TLS, SSH and IPsec make a man-in-the-middle position useless for reading or changing traffic, provided certificates are validated. This is the defence that holds when the others fail.</li>
<li><strong>Monitoring</strong> for MAC addresses that suddenly claim the gateway's IP.</li>
</ul>

<h2>Switches, DHCP and VLANs</h2>
<h3>MAC flooding</h3>
<p>A switch learns which port each MAC address is on and stores the mapping in a fixed-size table (the CAM table). Flood it with frames from hundreds of thousands of random source addresses and the table fills. Many switches then fall back to forwarding unknown destinations out of every port, behaving like a hub, so the attacker sees everyone's traffic. <strong>Port security</strong>, which limits the number of MAC addresses learned per port, prevents it.</p>
<h3>DHCP attacks</h3>
<p>DHCP hands out IP addresses, the default gateway and DNS servers. A <strong>rogue DHCP server</strong> answers faster than the real one and names itself as gateway or DNS server, a quiet man-in-the-middle for every new client. A <strong>starvation</strong> attack requests every address in the pool with fake MAC addresses so legitimate clients get none, often as a prelude to the rogue server. <strong>DHCP snooping</strong> marks only the ports facing real DHCP servers as trusted and drops server messages from anywhere else; its binding table also feeds Dynamic ARP Inspection.</p>
<h3>VLAN hopping</h3>
<p>VLANs separate traffic on shared switches, and many designs rely on them as security boundaries. Two classic attacks cross them. <strong>Switch spoofing</strong>: an attacker's machine negotiates a trunk link using a dynamic trunking protocol and receives all VLANs. <strong>Double tagging</strong>: a frame carries two VLAN tags; the first switch strips the outer one (the native VLAN) and forwards the frame, whose inner tag sends it into the target VLAN. Defences: disable trunk negotiation on access ports, set the native VLAN to an unused VLAN, and allow only required VLANs on trunks.</p>
<h3>Port-based access control: 802.1X</h3>
<p>The structural fix is to authenticate devices before they get any network access. IEEE 802.1X turns a switch port or Wi-Fi association into a gate: the device (supplicant) authenticates with EAP through the switch (authenticator) to a RADIUS server, and only then is the port opened, often placing the device in a VLAN chosen by its identity. <strong>EAP-TLS</strong> with device certificates is the strongest method. Many deployments fall back to MAC Authentication Bypass for printers and phones, which an attacker defeats by copying a printer's MAC address, so those devices belong in tightly restricted segments.</p>

<h2>Wi-Fi: the network is the air</h2>
<p>Wireless removes the need for physical access. Anyone within range, possibly hundreds of metres with a directional antenna, receives every frame. Wi-Fi security therefore rests entirely on cryptography, and its history is a sequence of lessons in how not to build it.</p>
<h3>WEP</h3>
<p>Wired Equivalent Privacy (1997) encrypted frames with RC4 using a key formed by prepending a 24-bit IV to the shared secret, and protected integrity with an encrypted CRC-32. Every part was wrong. 24-bit IVs repeat after a few thousand frames on a busy network, causing keystream reuse. CRC-32 is linear, so ciphertexts could be modified and the checksum fixed without the key. And RC4's key schedule leaks the key when related keys share a known prefix: the Fluhrer-Mantin-Shamir attack (2001), refined until WEP keys could be recovered from about 40,000 captured frames in under a minute (2007). WEP must never be used.</p>
<h3>WPA2</h3>
<p>WPA2 (2004) uses AES in CCM mode (CCMP), an AEAD built from CTR mode and CBC-MAC, with per-session keys established by the <strong>four-way handshake</strong>.</p>
${fig('fourway', '<b>Figure 19.2</b> The WPA2 four-way handshake derives a fresh session key from the shared master key and two nonces, and proves both sides know the master key.')}
<p>In <strong>WPA2-Personal</strong> the master key comes from the passphrase and the network name. Everything an attacker needs to test a guess is in a captured handshake, and attackers can force one by sending a forged deauthentication frame that makes a client reconnect. Since 2018 it is not even necessary to wait for a client: many access points include a <em>PMKID</em> derived from the PMK in their first message, which allows the same offline attack.</p>
${fig('offline', '<b>Figure 19.3</b> The offline dictionary attack on WPA2-Personal. Every guess is checked against the captured MIC without talking to the network.')}
<p>The 4,096 PBKDF2 iterations slow guessing but do not stop it: one high-end GPU tests a few million passphrases per second. The practical conclusion: a WPA2-Personal network is as strong as its passphrase, and anyone who has the passphrase, including every past guest and employee, can decrypt others' traffic if they capture their handshakes.</p>
<h3>KRACK</h3>
<p>In 2017 Mathy Vanhoef showed that the handshake itself could be abused. Message 3 may be retransmitted if lost, and clients that received it again <em>reinstalled</em> the already-installed key, resetting its packet counter, which is the AEAD nonce. An attacker in the middle replayed message 3 to force nonce reuse, enabling decryption and, for some ciphers, forgery. One Linux and Android client implementation even reinstalled an all-zero key. Patches fixed clients and access points; the lesson is that state machines around cryptography need the same scrutiny as the cryptography.</p>
<h3>WPA3</h3>
<p>WPA3 (2018) replaces the PSK handshake with <strong>Simultaneous Authentication of Equals</strong> (SAE), a password-authenticated key exchange based on the Dragonfly protocol. Each password guess requires a live exchange with the access point, so captured traffic does not allow offline cracking, and each session has forward secrecy: learning the password later does not decrypt recorded sessions. WPA3 also requires <strong>Protected Management Frames</strong> (802.11w), which stops forged deauthentication.</p>
<p>WPA3 had its own early flaws. The "Dragonblood" attacks (2019) found timing and cache side channels in how the password was mapped to a group element, and downgrade attacks against "transition mode", where networks accept both WPA2 and WPA3 clients. The standard was updated with a constant-time hash-to-element method. Transition mode remains a weak point: an attacker can lure clients onto a fake WPA2-only network with the same name.</p>
<p><strong>Enhanced Open</strong> (OWE) brings encryption, but not authentication, to open networks: each client does an unauthenticated Diffie-Hellman exchange with the access point, which stops passive eavesdropping in cafés.</p>
<h3>Enterprise Wi-Fi</h3>
<p>WPA2- and WPA3-Enterprise use 802.1X: each user or device authenticates to a RADIUS server and gets its own master key, so one user cannot decrypt another's traffic. The method matters:</p>
<ul>
<li><strong>EAP-TLS</strong> with device certificates is strongest and has no password to steal.</li>
<li><strong>PEAP-MSCHAPv2</strong> and EAP-TTLS with passwords tunnel a weak challenge-response inside TLS. If clients do not validate the RADIUS server's certificate, an attacker runs a fake access point with the same name, terminates the tunnel and captures MSCHAPv2 exchanges, which are crackable. Client profiles must pin the expected server certificate and name.</li>
</ul>
<h3>Rogue and evil-twin access points</h3>
<p>Devices remember network names and join any network that announces one. An attacker broadcasting "CorpWiFi" or "Airport Free WiFi" attracts clients, then man-in-the-middles them or serves a captive portal that phishes credentials. Wireless intrusion detection, certificate-validated enterprise authentication and always-on VPNs or zero-trust access (Chapter 22) are the defences.</p>

<h2>In code: why passphrase length matters</h2>
${code('WpaPmk.java')`import java.nio.charset.StandardCharsets;
import java.util.HexFormat;
import javax.crypto.SecretKeyFactory;
import javax.crypto.spec.PBEKeySpec;

/** WPA2-PSK master key: PBKDF2-HMAC-SHA1(passphrase, SSID, 4096, 256). Measures guesses per second. */
public final class WpaPmk {
    static byte[] pmk(String passphrase, String ssid) throws Exception {
        PBEKeySpec spec = new PBEKeySpec(passphrase.toCharArray(), ssid.getBytes(StandardCharsets.UTF_8), 4096, 256);
        return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA1").generateSecret(spec).getEncoded();
    }

    public static void main(String[] args) throws Exception {
        // IEEE 802.11i test vector: passphrase "password", SSID "IEEE"
        System.out.println(HexFormat.of().formatHex(pmk("password", "IEEE")));
        // f42c6fc52df0ebef9ebb4b90b38a5f902e83fe1b135a70e23aed762e9710a12e

        int n = 200;
        long t0 = System.nanoTime();
        for (int i = 0; i < n; i++) pmk("guess" + i, "CorpWiFi");
        double perSec = n / ((System.nanoTime() - t0) / 1e9);
        System.out.printf("one CPU core: %.0f guesses/s%n", perSec);
        System.out.printf("8 lowercase letters: %.1f years on one core; minutes to hours on a GPU rig%n",
            Math.pow(26, 8) / perSec / 3.15e7);
        System.out.printf("20 random characters from 62: effectively never (%.1e guesses)%n", Math.pow(62, 20));
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Flat networks</strong> where guests, IoT devices, staff laptops and servers share one segment.</li>
<li><strong>Trusting the LAN:</strong> internal services over plain HTTP or unauthenticated protocols because "it is inside".</li>
<li><strong>Short or shared Wi-Fi passphrases</strong> for staff networks, never changed when people leave.</li>
<li><strong>Enterprise Wi-Fi clients that do not validate the RADIUS certificate.</strong></li>
<li><strong>WPA3 transition mode</strong> left on indefinitely.</li>
<li><strong>Switch defaults:</strong> trunk negotiation enabled, native VLAN 1, no DHCP snooping.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>What does HSTS stop?</summary><p>An attacker has ARP-spoofed a victim. Which follow-on attack does HSTS prevent, and why? SSL stripping: the browser refuses to use plain HTTP for the domain at all.</p></details>
<details><summary>WEP IV collisions</summary><p>With 24-bit IVs chosen at random, after about how many frames is a repeat likely? About 1.2 × 2<sup>12</sup> ≈ 5,000.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Lab ARP spoofing</summary><p>In an isolated lab with three VMs, use arping or a small Scapy script to poison one VM's cache, observe its ARP table, and capture its traffic. Then enable a static ARP entry and show the attack fails.</p></details>

</div>

CH.push({
  id: 'ch20', n: 20, title: 'Attacks on IP, TCP, DNS and BGP',
  lede: 'The Internet\'s core protocols were designed to deliver packets, not to resist adversaries. IP does not check who sent a packet, TCP\'s only defence is a guessable number, DNS answers can be forged into caches, and BGP believes whatever routes its neighbours announce. This chapter shows each attack precisely, including the famous incidents, and the defences that now exist: randomisation, DNSSEC and encrypted DNS, RPKI and route filtering, and above all end-to-end cryptography.',
  html: `
<h2>Where the attacker sits</h2>
<p>Network attacks depend on position, a distinction from Chapter 1:</p>
<ul>
<li>An <strong>on-path</strong> attacker sees and controls traffic: a compromised router, an ISP, a Wi-Fi access point, the ARP spoofer of Chapter 19. It can do anything to unprotected traffic. Only cryptography stops it.</li>
<li>An <strong>off-path</strong> attacker cannot see the traffic but can send packets from anywhere, with forged source addresses. Many protocols defend against it only with numbers it must guess.</li>
<li>A <strong>routing</strong> attacker manipulates the Internet's routing so that traffic flows to it, turning itself from off-path into on-path.</li>
</ul>

<h2>IP: no source authentication</h2>
<p>An IP packet's source address is just a field the sender fills in. Routers forward on the destination and do not check the source. Spoofing source addresses lets attackers hide, impersonate trusted hosts in address-based access controls, and reflect traffic off third parties (Chapter 21). The defence is <strong>ingress filtering</strong> (BCP 38, 2000): networks drop packets leaving their customers whose source address does not belong to those customers. It is simple but must be deployed by every network to be complete, and measurements still find a substantial fraction of networks that allow spoofing.</p>
<div class="note pit"><b>Pitfall</b><p>Never use a source IP address as authentication. Allow lists by IP are a useful extra layer against scanning but say nothing reliable about who sent a packet, especially for UDP, and nothing at all about who is behind a NAT or proxy.</p></div>

<h2>TCP: guessing your way in</h2>
<p>TCP's three-way handshake proves weakly that the client can receive packets at its claimed address, because it must echo the server's initial sequence number (ISN). An off-path attacker who can predict the ISN can complete a handshake with a spoofed source address and send commands as that address. Robert Morris described this in 1985, and Kevin Mitnick used it in 1994 against a machine that trusted another host's address for remote login. Modern stacks pick ISNs with a keyed hash of the connection's addresses, ports and a secret (RFC 6528), which makes them unpredictable.</p>
<h3>Injection into existing connections</h3>
<p>To inject data into, or reset, an existing connection, an off-path attacker must guess the four-tuple (often known: client and server addresses, the server's port, and a client port from a limited range) and a sequence number inside the receiver's window. With large windows that is far fewer guesses than 2<sup>32</sup>.</p>
${fig('tcpwindow', '<b>Figure 20.1</b> Blind injection into TCP. Forged packets need a sequence number inside the receive window, so large windows make guessing feasible.')}
<p>Long-lived connections, such as BGP sessions between routers, were the main concern; resets tore down routing sessions. RFC 5961 tightened the rules so that only exact sequence numbers are accepted for resets and anything else triggers a "challenge ACK". Ironically, a global rate limit on challenge ACKs in Linux created a side channel that let an off-path attacker infer sequence numbers of any connection (CVE-2016-5696), fixed by randomising the limit. On-path injection of resets is easy and has been used for censorship (national firewalls tear down connections by injecting RSTs) and by an ISP in 2007 to throttle file sharing.</p>
<p>The robust answer is cryptographic: TLS detects injected or modified data, and router-to-router sessions use TCP-AO, which adds a MAC to each segment. Note that TLS cannot stop resets, which happen below it: availability attacks remain.</p>

<h2>DNS: poisoning the phone book</h2>
<p>When an application looks up www.bank.example, a <strong>recursive resolver</strong>, run by an ISP, a company or a public service, queries the authoritative servers on its behalf and caches the answer for its time-to-live. Classic DNS runs over UDP with no cryptography. The only thing linking an answer to a question is the matching name, a 16-bit transaction ID (TXID) and the UDP ports.</p>
<h3>Cache poisoning</h3>
<p>An off-path attacker who gets a forged answer accepted before the real one <em>poisons</em> the resolver's cache, sending every user of that resolver to an attacker-chosen address. Before 2008 it was thought hard, because once a name was cached the attacker had to wait for it to expire before racing again. Dan Kaminsky showed that waiting is unnecessary.</p>
${fig('kaminsky', '<b>Figure 20.2</b> The Kaminsky attack. Racing the real nameserver with forged replies for random subdomains, the attacker eventually installs a fake nameserver for the whole domain.')}
<p>Defences, deployed in a coordinated emergency patch in 2008:</p>
<ul>
<li><strong>Source port randomisation</strong> adds about 16 bits of unpredictability on top of the TXID.</li>
<li><strong>0x20 encoding</strong> randomises the capitalisation of letters in the queried name (bAnK.eXaMpLe), which servers echo back, adding a bit per letter.</li>
<li><strong>Bailiwick checks</strong> refuse to cache records outside the domain being queried.</li>
</ul>
<p>Side channels keep reopening the problem: the 2020 "SAD DNS" attack used ICMP rate limits to infer a resolver's randomised port, reducing the attack back to guessing the TXID. The durable answers are cryptographic.</p>
<h3>DNSSEC</h3>
<p>DNSSEC adds signatures. Each zone signs its record sets (RRSIG records) with a zone key published as a DNSKEY record, and the parent zone vouches for that key with a DS record that the parent signs. Validators follow the chain from the root zone's key, which they hold as a trust anchor, down to the answer. Signed denial-of-existence records (NSEC, NSEC3) prove that a name does not exist.</p>
${fig('dnssec', '<b>Figure 20.3</b> The DNSSEC chain of trust. Each parent signs a digest of its child\'s key, from the root down to the record.')}
<p>DNSSEC makes forged answers detectable by any validating resolver, regardless of where the attacker sits. The root was signed in 2010. Adoption is uneven: many large domains do not sign, and many resolvers validate while others do not. Operational errors, such as expired signatures or broken key rollovers, make a signed domain unreachable for validating users, which has caused outages. DNSSEC also does nothing for privacy: queries and answers are still visible.</p>
<h3>Encrypted DNS</h3>
<p><strong>DNS over TLS</strong> (DoT, RFC 7858) and <strong>DNS over HTTPS</strong> (DoH, RFC 8484) encrypt and authenticate the hop between a device and its resolver, defeating eavesdroppers and forgers on the local network and the access ISP. They do not authenticate the data the resolver fetched from authoritative servers (DNSSEC does that) and they move trust to whichever resolver you use. Enterprises often run their own DoH resolvers so policy and logging continue to work.</p>
<h3>Attacks around DNS</h3>
<p>Many real DNS compromises do not touch the protocol:</p>
<ul>
<li><strong>Registrar or DNS provider account takeover:</strong> change the nameservers or records directly. Use registrar locks, MFA and change alerts on critical domains.</li>
<li><strong>Dangling records and subdomain takeover:</strong> a CNAME still points at a cloud resource (a storage bucket, an app service) that has been deleted; an attacker creates a resource with that name and serves content on your subdomain, with a valid certificate. Inventory DNS records and remove them when resources go.</li>
<li><strong>State-sponsored DNS hijacking campaigns</strong> have redirected government and telecom domains to intercept email and VPN logins, then obtained certificates for the hijacked names.</li>
</ul>

<h2>BGP: the Internet believes what it is told</h2>
<p>The Internet is about 75,000 autonomous systems (ASes), networks under one administration, that exchange reachability with the Border Gateway Protocol. Each AS announces the address prefixes it originates, and neighbours pass announcements on, adding themselves to the AS path. Routers prefer the most specific prefix that matches a destination, then by policy and path length. Nothing in base BGP verifies that an AS is allowed to originate a prefix or that a path is real.</p>
${fig('bgp', '<b>Figure 20.4</b> BGP prefix hijacking. Announcing more-specific prefixes captures all traffic; RPKI origin validation lets networks reject the false origin.')}
<h3>Incidents</h3>
<ul>
<li><strong>YouTube, 2008:</strong> Pakistan Telecom announced a more-specific prefix of YouTube's addresses to block the site domestically; the announcement leaked upstream and took YouTube offline worldwide for about two hours.</li>
<li><strong>China Telecom, 2010:</strong> about 15% of Internet routes were briefly announced through China Telecom, diverting traffic for many US networks.</li>
<li><strong>MyEtherWallet, 2018:</strong> attackers hijacked prefixes belonging to Amazon's Route 53 DNS service, answered DNS queries for myetherwallet.com with their own server, and stole cryptocurrency from users who clicked through a certificate warning.</li>
<li><strong>Route leaks:</strong> in 2019 a small ISP leaked routes learned from a customer's optimiser to a large transit provider that accepted them, sending a large share of traffic for major services through a small network and causing outages. Leaks are usually accidents, but have the same effect as hijacks.</li>
<li><strong>Cryptocurrency platforms</strong> have repeatedly been targeted with BGP hijacks combined with certificate issuance for the hijacked addresses.</li>
</ul>
<h3>Defences</h3>
<ul>
<li><strong>Prefix filtering</strong>: providers accept from customers only the prefixes registered for them in Internet routing registries.</li>
<li><strong>RPKI and Route Origin Validation</strong>: address holders publish signed Route Origin Authorisations (ROAs) in a certificate hierarchy rooted at the regional Internet registries. Networks validate announcements and drop those marked invalid. ROV is now deployed by most large transit providers and cloud networks, which is why many hijacks no longer propagate widely. Set ROA max-length carefully: allowing /24 when you announce a /22 lets an attacker announce a more-specific with a forged origin path.</li>
<li><strong>Path validation</strong>: ASPA (AS provider authorisation) lets networks publish their upstream providers so implausible paths can be rejected; BGPsec signs paths hop by hop but is rarely deployed.</li>
<li><strong>Multi-perspective validation</strong> by certificate authorities checks domain control from several network locations, so a local hijack cannot easily obtain a certificate.</li>
<li><strong>End-to-end cryptography</strong> remains the last line: a hijacker who diverts traffic still cannot read TLS or forge certificates, unless users click through warnings or a CA is fooled.</li>
</ul>

<h2>In code: the arithmetic of cache poisoning</h2>
${code('PoisoningOdds.java')`/** Probability that at least one of f forged replies matches before the real answer,
 *  when the resolver randomises a 16-bit TXID and 'portBits' bits of source port. */
public final class PoisoningOdds {
    static double raceSuccess(int forgedPerRace, int portBits) {
        double space = Math.pow(2, 16 + portBits);
        return 1 - Math.pow(1 - 1 / space, forgedPerRace);
    }

    public static void main(String[] args) {
        int forged = 100;                                    // forged replies that arrive before the real one
        for (int bits : new int[] { 0, 10, 16 }) {
            double p = raceSuccess(forged, bits);
            double racesFor50 = Math.log(0.5) / Math.log(1 - p);
            System.out.printf("port bits %2d: per-race %.2e, races for 50%% success %.0f%n", bits, p, racesFor50);
        }
        // port bits  0: per-race 1.5e-03, ~450 races: seconds of work
        // port bits 16: per-race 2.3e-08, ~30 million races: impractical, and noisy enough to detect
    }
}`}
${code('', 'none')`# Check DNSSEC validation and the chain for a domain
dig +dnssec www.example.com A

# Look up the RPKI status of a route (via a public validator or your router)

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>IP allow lists as the main control</strong> for sensitive APIs.</li>
<li><strong>Not publishing ROAs</strong> for your address space, or publishing them with loose max-length.</li>
<li><strong>Weak registrar security</strong> on your most important domains.</li>
<li><strong>Dangling DNS records</strong> left after decommissioning cloud resources.</li>
<li><strong>Clicking through certificate warnings,</strong> which converts a routing or DNS attack into a full compromise. Use HSTS so browsers do not allow it.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Most specific wins</summary><p>A router has routes for 203.0.113.0/24 via AS 64500 and 203.0.113.0/25 via AS 666. Where does a packet to 203.0.113.42 go? To AS 666: the /25 is more specific.</p></details>
<details><summary>Window guessing</summary><p>How many forged RSTs cover the sequence space if the receive window is 1 MB? 2<sup>32</sup> / 2<sup>20</sup> = 4,096.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Audit your DNS</summary><p>List every CNAME in a zone you manage and check each target still exists and belongs to you. Write a script that flags targets in cloud-provider domains (for example *.cloudfront.net or *.azurewebsites.net) that return "not found".</p></details>
<details><summary>Check RPKI</summary><p>Look up your organisation's prefixes in a public RPKI validator. Are there ROAs? What max-length do they allow, and does it match what you announce?</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Simulate Kaminsky</summary><p>In a lab, run a resolver with source port randomisation disabled and a script that races forged replies for random subdomains. Measure the time to poison the cache, then enable port randomisation and repeat.</p></details>
<details><summary>Validate a DNSSEC chain</summary><p>Fetch DNSKEY, DS and RRSIG records with a Java DNS library (dnsjava) for a signed domain and verify the chain from the root trust anchor down to an A record yourself.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can distinguish on-path, off-path and routing attackers.</li>
<li>I can explain IP spoofing and ingress filtering.</li>
<li>I can explain TCP sequence prediction and blind injection, and what RFC 5961 and TLS do about them.</li>
<li>I can describe DNS cache poisoning and the Kaminsky attack, and the defences against it.</li>
<li>I can explain DNSSEC, DoT and DoH and what each protects.</li>
<li>I can explain BGP hijacks and leaks and how RPKI, ROV, filtering and ASPA reduce them.</li>
</ul>
`});

CH.push({
  id: 'ch21', n: 21, title: 'Denial of Service',
  lede: 'Availability is a security property, and attacking it needs no secrets: only more traffic, or more expensive traffic, than a service can absorb. This chapter classifies denial-of-service attacks by what they exhaust, explains reflection and amplification, SYN floods and SYN cookies, application-layer and algorithmic attacks, and shows how protocol design and layered defences, from anycast scrubbing to per-client token buckets, keep services up.',
  html: `
<h2>Attacking availability</h2>
<p>A denial-of-service (DoS) attack makes a service unavailable to legitimate users. A <strong>distributed</strong> attack (DDoS) uses many machines at once, usually a <em>botnet</em> of compromised computers, routers, cameras or rented cloud servers. The 2016 Mirai botnet, built from hundreds of thousands of IoT devices with default passwords, knocked the DNS provider Dyn offline and with it many major sites. Financial services are frequent targets, often with an extortion note demanding payment to stop.</p>
<p>The core of every DoS attack is an <strong>asymmetry</strong>: the attacker spends less of some resource than the victim must spend in response. Defences work by removing the asymmetry or by having more capacity than the attacker. It helps to classify attacks by the resource they exhaust:</p>
<div class="tbl"><table><tr><th>Class</th><th>Exhausts</th><th>Measured in</th><th>Examples</th></tr>
<tr><td>Volumetric</td><td>Link bandwidth</td><td>bits per second</td><td>UDP floods, reflection and amplification</td></tr>
<tr><td>Protocol / state</td><td>Connection tables, CPU on network devices</td><td>packets per second</td><td>SYN floods, fragment floods, firewall state exhaustion</td></tr>
<tr><td>Application</td><td>Server CPU, memory, database, threads</td><td>requests per second</td><td>HTTP floods, expensive queries, Slowloris, algorithmic complexity</td></tr>
</table></div>
<p>Record sizes keep growing: over a terabit per second in 2018, hundreds of millions of HTTP requests per second in 2023, and attacks of tens of terabits per second reported by large mitigation providers in 2025.</p>

<h2>Reflection and amplification</h2>
<p>An attacker who can spoof source addresses (Chapter 20) sends requests to third-party servers with the victim's address as the source. The servers' replies go to the victim. This <strong>reflection</strong> hides the attacker and spreads the load across thousands of innocent servers. If the replies are larger than the requests, the attack is also <strong>amplified</strong>.</p>
${fig('amplify', '<b>Figure 21.1</b> A reflection attack. Small spoofed requests to open servers turn into large responses aimed at the victim.')}
<p>UDP protocols that answer small queries with large responses, without first confirming the requester's address, are the classic amplifiers:</p>
${fig('ampf', '<b>Figure 21.2</b> Bandwidth amplification factors of common reflection vectors (log scale), from US-CERT measurements.')}
<p>In February 2018 attackers used publicly exposed memcached servers, which answered a 15-byte UDP request with up to a megabyte of cached data, to hit GitHub with 1.35 Tbit/s. Mitigation required providers to filter UDP port 11211 and memcached to disable UDP by default.</p>
<div class="note key"><b>Key idea</b><p>Protocol designers now follow a rule: <strong>do not send more to an unverified address than you received from it, and do not keep state for it.</strong> QUIC limits a server to three times the bytes received until the client's address is validated; DTLS and IKEv2 use stateless cookies; WireGuard replies with a cookie under load; TCP has SYN cookies.</p></div>

<h2>SYN floods and SYN cookies</h2>
<p>TCP's handshake makes the server allocate state before the client has proven it can receive packets at its address. A SYN flood exploits this.</p>
${fig('synflood', '<b>Figure 21.3</b> A SYN flood fills the half-open connection backlog; SYN cookies remove the state so spoofed SYNs cost almost nothing.')}
<p>SYN cookies are a small but perfect example of cryptographic thinking applied to availability: the server replaces stored state with a MAC that it can verify later. The cost is that some TCP options cannot be encoded in the cookie (modern stacks store them in the timestamp option). The same idea, "make the client carry authenticated state", appears in stateless session tickets and in signed tokens.</p>
<p>State exhaustion also hits devices in front of the server. A stateful firewall or load balancer with a connection table of a few million entries can be filled faster than the servers behind it. Size and protect these devices as part of the attack surface, or put a stateless scrubbing layer before them.</p>

<h2>Application-layer attacks</h2>
<p>Application attacks use fully legitimate requests, often from huge pools of residential IP addresses, which makes them hard to separate from real users. Their power comes from targeting work that is expensive for the server and cheap for the client.</p>
<ul>
<li><strong>HTTP floods</strong> against uncacheable pages: search, login, checkout, report generation.</li>
<li><strong>Expensive authentication:</strong> a login endpoint using Argon2id at 250 ms per attempt is a gift to an attacker; rate-limit before hashing.</li>
<li><strong>Slow attacks:</strong> Slowloris (2009) opens many connections and sends request headers a byte at a time, tying up servers that dedicate a thread to each connection. Event-driven servers, header timeouts and connection limits per client defeat it.</li>
<li><strong>HTTP/2 Rapid Reset</strong> (2023): a client opens a stream and immediately cancels it, over and over within one connection, making servers do work for requests that never count against stream limits. It produced attacks of hundreds of millions of requests per second and was fixed by limiting resets per connection.</li>
</ul>
<h3>Algorithmic complexity attacks</h3>
<p>Some inputs make code take far longer than typical inputs. An attacker who can choose inputs can choose those.</p>
<ul>
<li><strong>Hash flooding:</strong> many keys that collide in a hash table turn O(1) lookups into O(n), so inserting n keys costs O(n²). In 2011 researchers showed that one HTTP POST with crafted parameter names could occupy a server CPU for minutes in most web platforms. Fixes: randomised (keyed) hash functions such as SipHash, and limits on parameter counts. Java 8 changed HashMap to turn long collision chains into balanced trees.</li>
<li><strong>Regular expression denial of service</strong> (ReDoS): backtracking regex engines take exponential time on patterns like <code>(a+)+$</code> against certain inputs. A single regex in a WAF rule caused a global outage at a major CDN in 2019. Use linear-time engines where possible, avoid nested quantifiers and limit input length.</li>
<li><strong>Decompression and expansion bombs:</strong> a 42 KB zip file that expands to petabytes; the XML "billion laughs" document whose nested entities expand to gigabytes; deeply nested JSON or GraphQL queries. Limit sizes, depth and expansion ratios, and disable XML entity expansion entirely.</li>
</ul>

<h2>Defence in layers</h2>
<ol>
<li><strong>Absorb at the edge.</strong> Anycast CDNs and DDoS mitigation services spread traffic across many data centres with combined capacity far beyond any single site. For volumetric attacks against your own IP space, scrubbing services take over the prefix by BGP during an attack, filter traffic and forward the clean remainder.</li>
<li><strong>Hide the origin.</strong> Accept traffic at origin servers only from the CDN or scrubbing provider, or attackers will bypass it by going straight to the origin's address.</li>
<li><strong>Filter early and statelessly.</strong> Drop traffic you never expect (UDP to an HTTPS-only service, unexpected source ports from reflectors) at the provider or edge routers. As a last resort, remotely triggered black-holing sacrifices the target address to save the rest of the network.</li>
<li><strong>Rate-limit by identity.</strong> Per API key, per user, per session and per IP, with sensible bursts, so one client cannot consume shared capacity.</li>
<li><strong>Protect expensive operations:</strong> cache aggressively; queue heavy jobs; require authentication before expensive work; use proof-of-work or CAPTCHA challenges for anonymous high-cost endpoints.</li>
<li><strong>Design to degrade:</strong> timeouts on everything, bounded queues, circuit breakers and load shedding that drops low-priority traffic first, so overload degrades service rather than collapsing it.</li>
<li><strong>Watch the bill.</strong> Autoscaling turns a DoS into a financial attack ("denial of wallet"). Set budgets, alerts and maximum scale.</li>
<li><strong>Prepare.</strong> Know your provider's escalation path, have a runbook, and test with authorised load tests.</li>
</ol>
${fig('bucket', '<b>Figure 21.4</b> A token bucket rate limiter allows a burst and then a steady rate. Step through the requests.')}

<h2>In code</h2>
${code('RateLimiter.java')`import java.util.concurrent.ConcurrentHashMap;

/** Token bucket per client key. In a cluster, keep buckets in a shared store (e.g. Redis) instead. */
public final class RateLimiter {
    private final double capacity, refillPerNano;
    private final ConcurrentHashMap<String, Bucket> buckets = new ConcurrentHashMap<>();

    public RateLimiter(double capacity, double perSecond) {
        this.capacity = capacity;
        this.refillPerNano = perSecond / 1e9;
    }

    private final class Bucket {
        double tokens = capacity;
        long last = System.nanoTime();
        synchronized boolean tryTake() {
            long now = System.nanoTime();
            tokens = Math.min(capacity, tokens + (now - last) * refillPerNano);
            last = now;
            if (tokens < 1) return false;
            tokens -= 1;
            return true;
        }
    }

    /** Returns false when the caller should get HTTP 429 with a Retry-After header. */
    public boolean allow(String clientKey) {
        return buckets.computeIfAbsent(clientKey, k -> new Bucket()).tryTake();
    }
}`}
${code('SafeXml.java')`import javax.xml.XMLConstants;
import javax.xml.parsers.DocumentBuilderFactory;

public final class SafeXml {
    /** Refuse DTDs entirely: stops billion-laughs expansion and XXE (Chapter 26) in one setting. */
    public static DocumentBuilderFactory factory() throws Exception {
        DocumentBuilderFactory f = DocumentBuilderFactory.newInstance();
        f.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);
        f.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true);
        f.setXIncludeAware(false);
        f.setExpandEntityReferences(false);
        return f;
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Exposing the origin server's address</strong> while relying on a CDN for protection.</li>
<li><strong>Running open UDP services</strong> (DNS resolvers, NTP, SSDP, memcached) that become reflectors for attacks on others.</li>
<li><strong>Unbounded inputs:</strong> no limits on body size, JSON depth, parameter counts or decompressed size.</li>
<li><strong>Expensive work before authentication or rate limiting.</strong></li>
<li><strong>No timeouts</strong> on outbound calls, so one slow dependency exhausts every thread.</li>
<li><strong>Autoscaling without limits.</strong></li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Amplified bandwidth</summary><p>An attacker controls 1 Gbit/s of upload and uses NTP reflectors with a factor of 500. What reaches the victim? Up to 500 Gbit/s, limited by how many reflectors are available.</p></details>
<details><summary>Classify</summary><p>Classify: (a) a botnet requesting /search?q=random at 50,000 per second; (b) a flood of UDP from port 123; (c) a million SYNs per second from random addresses. (a) application, (b) volumetric reflection, (c) protocol/state.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>SYN cookie budget</summary><p>A SYN cookie has 24 bits of MAC. What is the chance that a randomly guessed ACK creates a connection? 2<sup>−24</sup>. How many guesses per second would an attacker need to open one fake connection per second? About 16.8 million.</p></details>
<details><summary>Find a ReDoS</summary><p>Test the pattern <code>^(\\w+\\s?)*$</code> in Java against a string of 30 word characters followed by "!". Time it as you add characters. Rewrite the pattern to be linear.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Distributed rate limiting</summary><p>Implement a token bucket in Redis with a Lua script so that 20 instances of a Java service share one limit per API key. Discuss what happens if Redis is unavailable: fail open or fail closed?</p></details>
<details><summary>DDoS runbook</summary><p>Write a runbook for a payments API under a 400 Gbit/s volumetric attack and a separate one for a 2 million request-per-second HTTP flood. Who is called, what is switched on, which traffic is shed first, and how is success measured?</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can classify DoS attacks by the resource they exhaust.</li>
<li>I can explain reflection and amplification and why spoofing enables them.</li>
<li>I can explain SYN floods and how SYN cookies remove server state.</li>
<li>I can describe application-layer and algorithmic complexity attacks and their defences.</li>
<li>I can state the protocol design rule about unverified addresses and give examples.</li>
<li>I can design layered DoS defences and implement a token bucket rate limiter.</li>
</ul>
`});
