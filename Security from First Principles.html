  id: 'ch13', n: 13, title: 'Authentication: Passwords to Passkeys',
  lede: 'Before a system can decide what you may do, it must know who you are. This chapter covers how people and machines prove their identity: how to store passwords so a breach does not expose them, what password rules actually help, how one-time codes work and why they can be phished, and how FIDO2 passkeys finally make phishing-resistant authentication practical. It ends with sessions and federated sign-in, where many real failures live.',
  html: `
<h2>Words that are often confused</h2>
<ul>
<li><strong>Identification:</strong> claiming an identity ("I am alice@example.com").</li>
<li><strong>Authentication:</strong> proving the claim.</li>
<li><strong>Authorisation:</strong> deciding what the authenticated identity may do (Chapter 1).</li>
</ul>
<p>Proof comes from <strong>factors</strong>: something you <em>know</em> (password, PIN), something you <em>have</em> (phone, security key, smart card) and something you <em>are</em> (fingerprint, face). Multi-factor authentication combines factors from different categories so that stealing one is not enough. European payment rules (PSD2 strong customer authentication) require two of the three for most online payments, plus <em>dynamic linking</em>: the authentication code must be bound to the specific amount and payee, so a code captured for one payment cannot authorise another.</p>

<h2>Passwords: the threats</h2>
<p>Passwords remain the most common first factor. They are attacked in four distinct ways, and each needs a different defence:</p>
<ul>
<li><strong>Online guessing:</strong> trying passwords against the login form. Defence: rate limiting and detection.</li>
<li><strong>Credential stuffing:</strong> replaying username and password pairs leaked from other sites, exploiting reuse. Billions of such pairs circulate. Defence: breached-password checks, MFA, bot detection.</li>
<li><strong>Offline cracking:</strong> after stealing the password database, guessing at the attacker's own speed. Defence: how you store passwords.</li>
<li><strong>Phishing and malware:</strong> the user hands the password to a fake site or a keylogger captures it. Defence: phishing-resistant authentication, because no password policy helps here.</li>
</ul>

<h2>Storing passwords</h2>
<p>A server must be able to check a password without being able to recover it. Plaintext storage and reversible encryption both fail the moment the database and its key leak. The right answer is a one-way function, but not just any one.</p>
<h3>Salt</h3>
<p>If the server stores H(password), identical passwords give identical hashes, and an attacker can precompute hashes of common passwords once (as a lookup table or the space-efficient "rainbow table") and crack every account in every breached database at once. A <strong>salt</strong>, a random value of 16 bytes or more unique to each user and stored with the hash, makes each account a separate problem.</p>
${fig('salt', '<b>Figure 13.1</b> What salting changes. Unsalted hashes reveal shared passwords and fall to precomputation; salted hashes force the attacker to work on each user separately.')}
<h3>Slow on purpose</h3>
<p>Salting does not slow down guessing one account. General-purpose hashes are built to be fast, and a modern GPU computes tens of billions of SHA-256 hashes per second. Human-chosen passwords have little entropy: most fall within the first few billion guesses of a good cracking dictionary with mangling rules. Password hashing must therefore be <strong>deliberately expensive</strong>, ideally in a way that GPUs and custom chips cannot accelerate much.</p>
${fig('crack', '<b>Figure 13.2</b> Approximate cracking speed on one high-end GPU, and the time to exhaust every 8-character lowercase and digit password. Slow, memory-hard functions change hours into decades.')}
<div class="tbl"><table><tr><th>Function</th><th>Idea</th><th>Typical settings (OWASP guidance)</th></tr>
<tr><td>Argon2id</td><td>Memory-hard: needs a large block of RAM per guess, which GPUs and ASICs cannot provide cheaply. Winner of the 2015 Password Hashing Competition, RFC 9106.</td><td>19 MiB memory, 2 iterations, 1 lane (or more memory with fewer iterations)</td></tr>
<tr><td>scrypt</td><td>Memory-hard (2009).</td><td>N = 2<sup>17</sup>, r = 8, p = 1</td></tr>
<tr><td>bcrypt</td><td>Expensive key setup of the Blowfish cipher (1999). Truncates passwords at 72 bytes.</td><td>Cost factor 10 or more</td></tr>
<tr><td>PBKDF2-HMAC-SHA256</td><td>Iterates HMAC many times. Not memory-hard, but available everywhere and FIPS-approved.</td><td>600,000 iterations</td></tr>
</table></div>
<p>Choose parameters so that one verification takes roughly 100 to 500 ms on your servers and budget the CPU for peak login rates; a login storm becomes a denial-of-service risk otherwise. Store the algorithm and parameters with each hash (the standard formats such as <code>$argon2id$v=19$m=19456,t=2,p=1$salt$hash</code> do this) so you can raise the cost later and rehash on each user's next login.</p>
<h3>Pepper</h3>
<p>A <strong>pepper</strong> is a secret key applied to every password, for example by computing HMAC(pepper, password) before the slow hash, and kept outside the database: in an HSM, a KMS or at least application configuration. An attacker who steals only the database cannot even begin guessing. It must be designed in from the start, because rotating a pepper requires users to log in again.</p>

<h2>Password policy that helps</h2>
<p>NIST's digital identity guidelines (SP 800-63B) were rewritten around evidence of what actually reduces compromise. Their current recommendations, which most security teams now follow:</p>
<ul>
<li><strong>Length over complexity.</strong> Require at least 15 characters when a password is the only factor, and at least 8 when used with MFA. Allow at least 64 and any characters, including spaces and Unicode.</li>
<li><strong>No composition rules</strong> such as "one uppercase, one symbol". They produce predictable patterns (Password1!) and add little.</li>
<li><strong>No forced periodic changes.</strong> Change only on evidence of compromise. Forced rotation produces Summer2024! followed by Autumn2024!.</li>
<li><strong>Screen against breached and common passwords.</strong> Reject anything in known breach corpora.</li>
<li><strong>Allow paste and password managers,</strong> which generate unique random passwords per site.</li>
<li><strong>Rate-limit failed attempts</strong>, ideally with growing delays rather than hard lockouts that attackers can use to lock out real users.</li>
</ul>
<p>Checking a password against a breach corpus does not require sending it anywhere. The k-anonymity method used by Have I Been Pwned sends only the first five hex characters of its SHA-1 hash; the service returns all known suffixes with that prefix, and the comparison happens locally.</p>
${fig('kanon', '<b>Figure 13.3</b> Checking a password against breach data without revealing it, using a hash prefix shared by hundreds of other passwords.')}

<h2>One-time passwords</h2>
<p>A second factor proves possession of a device. The common forms:</p>
<ul>
<li><strong>SMS codes:</strong> better than nothing, but vulnerable to SIM-swap fraud (an attacker convinces the carrier to move your number), SS7 network interception and malware that reads messages. NIST classes SMS as a restricted authenticator.</li>
<li><strong>HOTP and TOTP</strong> (RFC 4226 and 6238): the device and server share a secret; the code is a truncated HMAC of a counter or of the current 30-second time step. Authenticator apps use TOTP.</li>
<li><strong>Push approvals:</strong> the app asks "Is this you signing in?". Attackers spam requests until a tired user taps Approve ("MFA fatigue", used in the 2022 Uber breach). Number matching, where the user types a number shown on the login screen, largely fixes this.</li>
</ul>
${fig('totp', '<b>Figure 13.4</b> Computing a TOTP code, using the RFC 6238 SHA-256 test vector. The steps run live in your browser.')}
<div class="note pit"><b>Pitfall</b><p>All code-based factors can be <strong>phished in real time</strong>. A reverse-proxy phishing kit shows the real bank's login page through the attacker's server, relays the password and the code as the victim types them, and keeps the resulting session cookie. Kits such as Evilginx make this routine. The code is valid; it was simply typed into the wrong site.</p></div>

<h2>FIDO2, WebAuthn and passkeys</h2>
<p>The fix is to make the credential itself refuse to work on the wrong site. FIDO2 (the W3C WebAuthn API plus the CTAP protocol between browser and authenticator) replaces shared secrets with public-key challenge-response:</p>
<ol>
<li><strong>Registration:</strong> the authenticator (a security key, or the phone or laptop's secure hardware) generates a new key pair for this site and returns the public key, which the server stores. Every site gets a different key, so there is nothing to reuse or stuff.</li>
<li><strong>Authentication:</strong> the server sends a random challenge; the authenticator signs it together with the origin reported by the browser, after the user verifies locally with a fingerprint, face or PIN.</li>
</ol>
${fig('webauthn', '<b>Figure 13.5</b> Signing in with WebAuthn. The signature covers the real origin, so a look-alike phishing site gets nothing it can replay.')}
<p>The server stores no secret worth stealing, the user has nothing to type into a fake page, and the biometric never leaves the device. <strong>Passkeys</strong> are FIDO credentials synchronised across a user's devices by their platform (Apple, Google, Microsoft or a password manager), which removes the "I lost my security key" problem at some cost in control. High-assurance settings, such as administrators of payment systems, often require device-bound hardware keys with <em>attestation</em>, a certificate proving the make and model of the authenticator.</p>
<p>An alternative for password-based systems is a <strong>PAKE</strong> (password-authenticated key exchange) such as OPAQUE, in which the server never sees the password even during login. WPA3's SAE (Chapter 19) is a PAKE.</p>

<h2>After login: sessions</h2>
<p>Authentication happens once; the session token then stands in for the user on every request. Stealing it is as good as stealing the password and the second factor, which is why phishing kits target cookies.</p>
<ul>
<li>Generate session IDs with at least 128 bits from a CSPRNG (Chapter 3).</li>
<li>Send them in cookies marked <code>Secure</code>, <code>HttpOnly</code> and <code>SameSite</code> (Chapter 27).</li>
<li>Issue a new session ID at login and privilege changes, to prevent <strong>session fixation</strong>, where an attacker plants a known ID before the victim logs in.</li>
<li>Expire idle sessions, allow users to see and revoke them, and revoke all sessions on password change.</li>
<li>Require <strong>step-up</strong> authentication for sensitive actions such as adding a payee, even within a valid session.</li>
</ul>
<p>Stateless tokens such as JWTs avoid a session store but cannot easily be revoked before they expire; keep their lifetime short and pair them with refresh tokens that can be revoked.</p>
<h3>Federation: OAuth 2.0 and OpenID Connect</h3>
<p>Many applications delegate authentication to an identity provider. <strong>OAuth 2.0</strong> is a framework for <em>authorisation</em>: a user lets an application access an API on their behalf with a scoped access token, without sharing their password. <strong>OpenID Connect</strong> adds authentication on top: the identity provider returns a signed ID token stating who the user is. Use the authorisation code flow with PKCE for all clients; validate the token's signature, issuer, audience, expiry and nonce; and never accept tokens issued for a different application. Open banking APIs use a hardened profile (FAPI) with mutual TLS or signed requests binding tokens to the client.</p>
<p>Finally, remember account recovery. A perfect passkey deployment with "reset by SMS" behind it is an SMS-protected system.</p>

<h2>In code</h2>
${code('Passwords.java')`import java.nio.ByteBuffer;
import java.security.MessageDigest;
import java.security.SecureRandom;
import java.time.Instant;
import java.util.Base64;
import javax.crypto.Mac;
import javax.crypto.SecretKeyFactory;
import javax.crypto.spec.PBEKeySpec;
import javax.crypto.spec.SecretKeySpec;

public final class Passwords {
    private static final SecureRandom RNG = new SecureRandom();
    private static final int ITER = 600_000;

    /** PBKDF2 is in the JDK. Prefer Argon2id via a library (Bouncy Castle, Password4j) where allowed. */
    public static String hash(char[] password) throws Exception {
        byte[] salt = new byte[16]; RNG.nextBytes(salt);
        byte[] dk = pbkdf2(password, salt, ITER);
        Base64.Encoder b = Base64.getEncoder().withoutPadding();
        return "pbkdf2-sha256$" + ITER + "$" + b.encodeToString(salt) + "$" + b.encodeToString(dk);
    }

    public static boolean verify(char[] password, String stored) throws Exception {
        String[] p = stored.split("\\$");
        byte[] salt = Base64.getDecoder().decode(p[2]), expected = Base64.getDecoder().decode(p[3]);
        return MessageDigest.isEqual(pbkdf2(password, salt, Integer.parseInt(p[1])), expected);
    }

    private static byte[] pbkdf2(char[] pw, byte[] salt, int iter) throws Exception {
        PBEKeySpec spec = new PBEKeySpec(pw, salt, iter, 256);
        try { return SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).getEncoded(); }
        finally { spec.clearPassword(); }
    }

    /** TOTP (RFC 6238) with HMAC-SHA256; accept one step of clock drift either side. */
    public static boolean verifyTotp(byte[] secret, String code, Instant now) throws Exception {
        long step = now.getEpochSecond() / 30;
        for (long s = step - 1; s <= step + 1; s++)
            if (MessageDigest.isEqual(totp(secret, s, 6).getBytes(), code.getBytes())) return true;
        return false;   // also record used steps per user so a code cannot be replayed
    }

    static String totp(byte[] secret, long counter, int digits) throws Exception {
        Mac mac = Mac.getInstance("HmacSHA256");
        mac.init(new SecretKeySpec(secret, "HmacSHA256"));
        byte[] h = mac.doFinal(ByteBuffer.allocate(8).putLong(counter).array());
        int off = h[h.length - 1] & 0x0f;
        int bin = ((h[off] & 0x7f) << 24) | ((h[off + 1] & 0xff) << 16) | ((h[off + 2] & 0xff) << 8) | (h[off + 3] & 0xff);
        return String.format("%0" + digits + "d", bin % (int) Math.pow(10, digits));
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Fast hashes (MD5, SHA-1, SHA-256) for passwords,</strong> even salted.</li>
<li><strong>Different error messages</strong> for "no such user" and "wrong password", which lets attackers enumerate accounts. Also equalise response time.</li>
<li><strong>Hard account lockouts</strong> that let attackers lock out customers at will.</li>
<li><strong>SMS or email as the recovery path</strong> for an otherwise strong account.</li>
<li><strong>Not rotating the session ID at login.</strong></li>
<li><strong>Accepting ID tokens without checking audience and issuer.</strong></li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Entropy of a passphrase</summary><p>Four words chosen uniformly from a 7,776-word list: how many bits? 4 × log₂ 7776 ≈ 51.7 bits. Compare with an 8-character random lowercase-and-digit password: 8 × log₂ 36 ≈ 41 bits.</p></details>
<details><summary>Spot the phishable factor</summary><p>Which of these can a real-time phishing proxy relay: SMS code, TOTP, push with number matching, passkey? All but the passkey.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Tune the cost</summary><p>Measure PBKDF2WithHmacSHA256 on your machine at 100,000 to 1,000,000 iterations. Pick the setting that takes about 250 ms, and compute how many logins per second one core can handle.</p></details>
<details><summary>Rehash on login</summary><p>Write a login method that verifies a password stored with old parameters and, on success, transparently rehashes it with the current algorithm and parameters.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Crack a sample</summary><p>Hash 1,000 passwords from a public breach list with unsalted SHA-256 and with PBKDF2 at 600,000 iterations. Use hashcat or a Java loop with a 100,000-word dictionary and compare how many you recover per minute.</p></details>
<details><summary>WebAuthn relying party</summary><p>Using a WebAuthn server library for Java (such as Yubico's java-webauthn-server), implement registration and authentication for a demo site, and verify that the assertion fails if you change the expected origin.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can distinguish identification, authentication and authorisation, and name the authentication factors.</li>
<li>I can explain online guessing, credential stuffing, offline cracking and phishing, and the defence for each.</li>
<li>I can store passwords with a salt and a slow, memory-hard function, and choose parameters.</li>
<li>I can state evidence-based password rules and check passwords against breaches privately.</li>
<li>I can compute a TOTP code and explain why codes are phishable.</li>
<li>I can explain how WebAuthn and passkeys resist phishing, and secure the session that follows.</li>
</ul>
`});

CH.push({
  id: 'ch14', n: 14, title: 'Key Exchange and TLS 1.3',
  lede: 'Everything so far comes together in authenticated key exchange: two parties, one or both identified by a certificate, agree on fresh keys that an active attacker can neither learn nor influence. TLS is the most important protocol of this kind, securing nearly all web, API and much internal traffic. This chapter builds an authenticated key exchange step by step, walks through the TLS 1.3 handshake and key schedule message by message, and covers resumption, 0-RTT, the attacks that shaped the protocol and how to configure it in Java.',
  html: `
<h2>What authenticated key exchange must achieve</h2>
<p>An authenticated key exchange (AKE) protocol should give:</p>
<ul>
<li><strong>Authentication:</strong> each side knows who it shares the key with. On the web usually only the server is authenticated; with mutual TLS both are.</li>
<li><strong>Key secrecy:</strong> the session key is indistinguishable from random to an active attacker, even one who learns the keys of other sessions.</li>
<li><strong>Forward secrecy:</strong> stealing a long-term private key later does not reveal past session keys.</li>
<li><strong>Key confirmation:</strong> each side knows the other derived the same key.</li>
<li><strong>Downgrade resistance:</strong> an attacker cannot make the parties settle on weaker options than both support.</li>
<li><strong>Identity protection</strong> where possible: hide certificates from passive observers.</li>
</ul>
<p>Getting all of these at once is subtle, and the history of protocols is a history of attacks found years after deployment. Figure 14.1 shows how the design evolves from plain Diffie-Hellman to the shape TLS 1.3 uses.</p>
${fig('ake', '<b>Figure 14.1</b> Building an authenticated key exchange in three steps. Only signing and MACing the whole transcript protects every message.')}
<div class="note key"><b>Key idea</b><p>Authenticate the <em>transcript</em>, not individual values. Anything sent in a handshake that is not covered by a signature or MAC is something an attacker can change.</p></div>

<h2>TLS in brief</h2>
<p>SSL was created by Netscape in 1994 to secure web commerce. SSL 3.0 (1996) became TLS 1.0 (1999), followed by TLS 1.1 (2006) and TLS 1.2 (2008). Each patched weaknesses in the last while keeping old options for compatibility, and many attacks exploited those options. TLS 1.3 (RFC 8446, 2018) was a redesign, developed together with academic analysts who verified its core with formal tools before publication. TLS 1.0 and 1.1 were formally deprecated in 2021 (RFC 8996).</p>
<p>TLS 1.3 removed:</p>
<ul>
<li>RSA key transport and static Diffie-Hellman: <strong>all</strong> handshakes now have forward secrecy;</li>
<li>CBC-mode and RC4 cipher suites, and MAC-then-encrypt: only AEADs remain (AES-GCM, ChaCha20-Poly1305, AES-CCM);</li>
<li>SHA-1 and MD5 in signatures, arbitrary custom DH groups, compression (CRIME), renegotiation;</li>
<li>a full round trip: the handshake takes one round trip instead of two.</li>
</ul>
<p>Only five cipher suites exist, such as <code>TLS_AES_128_GCM_SHA256</code>, which name the AEAD and the hash used by HKDF. Key exchange groups and signature algorithms are negotiated separately.</p>

<h2>The TLS 1.3 handshake</h2>
${fig('tls13', '<b>Figure 14.2</b> The TLS 1.3 full handshake. The client sends its key share in the first message, so keys exist after one round trip and everything from the server\'s second message on is encrypted.')}
<p>A few details deserve attention.</p>
<ul>
<li><strong>Guessing the group.</strong> The client sends key shares for the groups it expects the server to accept. If it guessed wrong, the server replies with a HelloRetryRequest naming a group, costing one extra round trip.</li>
<li><strong>Downgrade protection.</strong> A TLS 1.3 server that is forced to negotiate TLS 1.2 puts a special value ("DOWNGRD" plus a version byte) at the end of its random nonce. A 1.3-capable client that sees it aborts. Since the random is signed, an attacker cannot remove it.</li>
<li><strong>Client authentication.</strong> For mutual TLS the server sends a CertificateRequest, and the client returns its own Certificate and CertificateVerify before its Finished. Because these are encrypted, the client's identity is hidden from observers.</li>
<li><strong>What still leaks.</strong> The ClientHello is in the clear, including the server name (SNI). <em>Encrypted Client Hello</em> (ECH) encrypts the inner ClientHello to a public key published in DNS, hiding the name. Sizes and timing of records also leak information.</li>
</ul>

<h2>The key schedule</h2>
<p>TLS 1.3 derives every key through HKDF (Chapter 7) in a fixed chain. Each stage mixes in one new secret with HKDF-Extract, then derives labelled traffic secrets with HKDF-Expand over the hash of the transcript so far.</p>
${fig('keysched', '<b>Figure 14.3</b> The TLS 1.3 key schedule. Each secret is extracted from the previous one plus new input; traffic keys are expanded with labels and the transcript hash.')}
<p>This structure gives clean separation. Keys for 0-RTT, handshake and application data are independent; compromise of one does not reveal the others. Binding each derived secret to the transcript means both sides derive the same keys only if they saw identical handshakes. And the "exporter" secret lets applications derive extra keys bound to the TLS session, used for example to bind OAuth tokens to a connection.</p>
<h3>The record layer</h3>
<p>Application data is split into records of up to 16 KB, each encrypted with the AEAD. The nonce is the traffic IV XOR a 64-bit record sequence number, so nonces never repeat and records cannot be reordered, dropped or replayed without detection. The real content type is encrypted inside the record, and records can be padded to hide their length. Either side can send a KeyUpdate message to move to the next generation of traffic keys, which long-lived connections do to stay within AEAD limits.</p>

<h2>Resumption and 0-RTT</h2>
<p>After a handshake, the server can issue a <strong>session ticket</strong>, essentially an encrypted pre-shared key (PSK). On the next connection the client offers the ticket, and the handshake skips certificate verification. Usually the PSK is combined with a fresh ECDHE exchange, preserving forward secrecy.</p>
<p>With a PSK the client may also send <strong>early data</strong> in its first flight, encrypted with keys derived only from the PSK: zero round trips before application data. The cost is that early data has no protection against replay. An attacker who records the client's first flight can resend it, and a server farm without shared state cannot always tell.</p>
${fig('zrtt', '<b>Figure 14.4</b> The 0-RTT replay problem. Early data is encrypted and authenticated but not fresh.')}
<div class="note pit"><b>Pitfall</b><p>Only accept 0-RTT for idempotent, safe requests such as GET of public resources. Never for anything that changes state, such as payments. Many servers disable 0-RTT entirely; TLS front ends that accept it should mark such requests (for example with the <code>Early-Data: 1</code> header, RFC 8470) so applications can refuse them.</p></div>

<h2>Attacks that shaped TLS</h2>
<div class="tbl"><table><tr><th>Attack</th><th>Year</th><th>What it exploited</th><th>TLS 1.3 answer</th></tr>
<tr><td>BEAST</td><td>2011</td><td>Predictable CBC IVs in TLS 1.0</td><td>No CBC</td></tr>
<tr><td>CRIME, BREACH</td><td>2012–13</td><td>Compression leaking secrets through length</td><td>No compression (BREACH targets HTTP compression and remains an application issue)</td></tr>
<tr><td>Lucky Thirteen, POODLE</td><td>2013–14</td><td>MAC-then-encrypt padding oracles</td><td>AEAD only</td></tr>
<tr><td>Triple Handshake</td><td>2014</td><td>Session resumption not bound to the full handshake</td><td>Transcript-bound key schedule</td></tr>
<tr><td>Heartbleed</td><td>2014</td><td>A buffer over-read in OpenSSL (Chapter 26)</td><td>An implementation bug; no protocol fix</td></tr>
<tr><td>FREAK, Logjam</td><td>2015</td><td>Downgrade to export-grade RSA and DH</td><td>No export suites; transcript signatures; downgrade sentinel</td></tr>
<tr><td>Sweet32</td><td>2016</td><td>64-bit block ciphers</td><td>No 3DES</td></tr>
<tr><td>ROBOT</td><td>2017</td><td>Bleichenbacher oracle in RSA key transport</td><td>No RSA key transport</td></tr>
</table></div>

<h2>TLS in real deployments</h2>
<ul>
<li><strong>Versions:</strong> allow TLS 1.3 and 1.2 only; for 1.2, allow only ECDHE with AEAD suites.</li>
<li><strong>HSTS:</strong> the <code>Strict-Transport-Security</code> header tells browsers to use HTTPS only for the domain, defeating "SSL stripping" attacks that keep a victim on plain HTTP. Preload lists include domains in browsers before the first visit.</li>
<li><strong>Termination:</strong> TLS often ends at a load balancer or CDN. Traffic behind it must be re-encrypted (TLS from the load balancer to services), or a breach of the internal network exposes everything. Payment card rules require this across untrusted networks.</li>
<li><strong>Mutual TLS</strong> between services, with certificates issued automatically by an internal CA or a service mesh, gives strong workload identity.</li>
<li><strong>TLS inspection</strong> appliances decrypt traffic by installing their own root CA on devices. They are frequently less secure than the connections they break and must be treated as high-value targets.</li>
<li><strong>Certificate pinning</strong> (accepting only specific keys) in mobile apps defends against rogue CAs but causes outages when keys change. Pin to a set of backup keys or to your own CA, and have a recovery plan.</li>
<li><strong>QUIC and HTTP/3</strong> carry the TLS 1.3 handshake inside QUIC and use its keys to protect QUIC packets, combining the transport and cryptographic handshakes.</li>
</ul>

<h2>In code</h2>
${code('TlsClient.java')`import java.net.URI;
import java.net.http.HttpClient;
import java.net.http.HttpRequest;
import java.net.http.HttpResponse;
import java.time.Duration;
import javax.net.ssl.SSLContext;
import javax.net.ssl.SSLParameters;

public final class TlsClient {
    public static void main(String[] args) throws Exception {
        SSLContext ctx = SSLContext.getInstance("TLS");
        ctx.init(null, null, null);                 // default trust store; supply KeyManagers for mTLS

        SSLParameters p = ctx.getDefaultSSLParameters();
        p.setProtocols(new String[] { "TLSv1.3", "TLSv1.2" });
        p.setCipherSuites(new String[] {
            "TLS_AES_256_GCM_SHA384", "TLS_AES_128_GCM_SHA256", "TLS_CHACHA20_POLY1305_SHA256",
            "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384", "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384" });
        // Hostname verification is on by default in HttpClient. Never disable it.

        HttpClient client = HttpClient.newBuilder()
            .sslContext(ctx).sslParameters(p)
            .connectTimeout(Duration.ofSeconds(5)).build();
        HttpResponse<String> r = client.send(
            HttpRequest.newBuilder(URI.create("https://example.com/")).build(),
            HttpResponse.BodyHandlers.ofString());
        System.out.println(r.statusCode() + " via " + r.sslSession().map(s -> s.getProtocol() + " " + s.getCipherSuite()).orElse("?"));
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Trust-all TrustManagers or disabled hostname verification,</strong> often added "temporarily" for a test environment.</li>
<li><strong>Accepting 0-RTT</strong> for state-changing requests.</li>
<li><strong>Plain HTTP behind the load balancer</strong> across shared or cloud networks.</li>
<li><strong>Long-lived session ticket keys</strong> shared across a fleet and never rotated, which undoes forward secrecy for resumed sessions.</li>
<li><strong>Leaving TLS 1.0 and 1.1 enabled</strong> on legacy endpoints for an old client nobody has checked on.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Round trips</summary><p>With 80 ms round-trip time, how long until the client can send its first request byte with TLS 1.2 (two round trips) versus TLS 1.3 (one), after TCP's handshake? 160 ms versus 80 ms; 0 ms extra with 0-RTT.</p></details>
<details><summary>Read a handshake</summary><p>Run <code>openssl s_client -tls1_3</code> against three sites. Record the negotiated group (look for X25519 or X25519MLKEM768), the cipher suite and the signature algorithm.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Why sign the transcript?</summary><p>Describe how an attacker could downgrade a handshake to a weak group if the server signed only its own key share and not the client's list of offered groups.</p></details>
<details><summary>Decrypt your own traffic</summary><p>Set SSLKEYLOGFILE for a browser or curl, capture a TLS 1.3 session with Wireshark, and load the key log to decrypt it. Identify each handshake message from Figure 14.2.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Key schedule by hand</summary><p>Using the trace in RFC 8448 (example handshakes with all intermediate values), implement the TLS 1.3 key schedule in Java with HKDF and reproduce the client and server handshake traffic secrets.</p></details>
<details><summary>mTLS between services</summary><p>Create a private CA, issue client and server certificates, and configure a Java server to require client certificates. Show that a client without a certificate, or with one from another CA, is rejected during the handshake.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can list the goals of authenticated key exchange and explain why the transcript must be authenticated.</li>
<li>I can walk through each TLS 1.3 handshake message and say what it protects.</li>
<li>I can explain the TLS 1.3 key schedule and record-layer nonces.</li>
<li>I can explain resumption, 0-RTT and why early data can be replayed.</li>
<li>I can connect major TLS attacks to the design changes in TLS 1.3.</li>
<li>I can configure a Java client for TLS 1.3 and 1.2 with strong suites, and debug a handshake.</li>
</ul>
`});

CH.push({
  id: 'ch15', n: 15, title: 'Post-Quantum I: the Threat and Lattices',
  lede: 'A large quantum computer would break RSA, Diffie-Hellman and every elliptic-curve scheme in this book. Nobody has built one, but data encrypted today can be recorded and decrypted later, so the migration has already started. This chapter explains what quantum computers can and cannot do to cryptography, how to judge the urgency for your own data, why lattices became the foundation of the replacement, and how ML-KEM, the new standard key encapsulation mechanism, works and is used from Java.',
  html: `
<h2>What a quantum computer is, briefly</h2>
<p>A classical bit is 0 or 1. A <strong>qubit</strong> can be in a <em>superposition</em>, described by two complex amplitudes whose squared magnitudes give the probabilities of measuring 0 or 1. A register of n qubits has 2<sup>n</sup> amplitudes evolving together, and quantum gates transform all of them at once. Measurement, however, returns just one n-bit outcome, at random according to the amplitudes, and destroys the superposition.</p>
<p>So a quantum computer is <em>not</em> a machine that tries every answer in parallel and reports the right one. Its power comes from <strong>interference</strong>: carefully designed algorithms make the amplitudes of wrong answers cancel and those of right answers reinforce, so that measurement probably yields something useful. That only works for problems with special structure, and only a few cryptographically relevant problems have it.</p>
<p>Building one is hard because qubits are fragile: noise destroys superpositions within microseconds. Useful algorithms need <strong>error-corrected logical qubits</strong>, each built from hundreds or thousands of noisy <em>physical</em> qubits. A <em>cryptographically relevant quantum computer</em> (CRQC) is one large and reliable enough to run the attacks below.</p>

<h2>Shor's algorithm</h2>
<p>In 1994 Peter Shor showed that a quantum computer can find the <em>period</em> of a function efficiently, using the quantum Fourier transform. Factoring reduces to period finding: for random a, the function x ↦ a<sup>x</sup> mod n has a period r that, with good probability, reveals a factor of n through gcd(a<sup>r/2</sup> ± 1, n). Discrete logarithms in any group, including elliptic curves, reduce to period finding of a two-variable function. The running time is polynomial in the key size, so making keys bigger does not help.</p>
<p>The consequence is total for classical public-key cryptography:</p>
<div class="tbl"><table><tr><th>Scheme</th><th>Best quantum attack</th><th>Effect</th></tr>
<tr><td>RSA (any size)</td><td>Shor</td><td>Broken</td></tr>
<tr><td>Finite-field Diffie-Hellman, DSA</td><td>Shor</td><td>Broken</td></tr>
<tr><td>ECDH, ECDSA, Ed25519, X25519</td><td>Shor</td><td>Broken (needs fewer qubits than RSA of equal classical strength)</td></tr>
<tr><td>AES-128</td><td>Grover</td><td>Weakened in theory; still considered adequate by NIST</td></tr>
<tr><td>AES-256</td><td>Grover</td><td>Secure</td></tr>
<tr><td>SHA-256, SHA-3, HMAC</td><td>Grover, collision variants</td><td>Secure</td></tr>
</table></div>

<h2>Grover's algorithm</h2>
<p>Lov Grover's 1996 algorithm searches an unstructured space of N possibilities in about √N steps instead of N. Applied to a 128-bit key, that is about 2<sup>64</sup> quantum operations. This sounds alarming but is weaker than it looks: Grover's steps must run one after another (splitting the search across many machines gives only a square-root gain in total), each step is a deep quantum circuit, and 2<sup>64</sup> sequential error-corrected operations would take far longer than any realistic computation. NIST's post-quantum security categories still use AES-128 as the yardstick for the lowest level. Choosing AES-256 where convenient removes the question entirely.</p>

<h2>When?</h2>
<p>Nobody knows, and claims in both directions should be read carefully. What is known:</p>
<ul>
<li>Resource estimates keep falling. In 2019 Gidney and Ekerå estimated that RSA-2048 could be factored in about 8 hours with 20 million noisy physical qubits. In 2025 Gidney revised this to under a million noisy qubits running for less than a week.</li>
<li>Hardware is improving but far from that scale. Leading machines have hundreds to around a thousand physical qubits. In late 2024 Google's Willow chip showed error correction improving as more qubits were added, an important milestone, with 105 qubits.</li>
<li>Surveys of experts put a meaningful probability, not a certainty, on a CRQC within ten to fifteen years.</li>
</ul>
<p>Governments have set deadlines accordingly. NIST's draft transition plan (IR 8547) would deprecate RSA and elliptic-curve cryptography at the 112-bit level after 2030 and disallow it after 2035. The US NSA's CNSA 2.0 guidance asks national security systems to prefer post-quantum algorithms for new acquisitions in the next few years and complete migration by the early 2030s. The EU published a coordinated roadmap in 2025 asking member states to start transitions by the end of 2026 and protect high-risk systems by 2030.</p>

<h2>Harvest now, decrypt later</h2>
<p>For <strong>confidentiality</strong> the threat is already here. An adversary can record encrypted traffic today, store it cheaply and decrypt it when a quantum computer becomes available. Everything protected only by an ECDHE or RSA key exchange is exposed retroactively. Forward secrecy does not help, because the attacker can solve the recorded ephemeral exchange itself.</p>
<p>For <strong>authentication</strong> the timeline is different. A forged signature is useful only while it is accepted, so signatures need replacing before a CRQC exists, not before data is recorded. Exceptions are things signed today and trusted for decades: root CA certificates, firmware in devices with long lives, legal documents.</p>
<p>Michele Mosca's inequality turns this into a planning tool. Let x be how long your data must stay confidential, y how long migration will take, and z the time until a CRQC. If <strong>x + y > z</strong>, data sent today will be exposed while it still matters.</p>
${fig('mosca', '<b>Figure 15.1</b> Mosca\'s inequality for three kinds of data, assuming a quantum attack in ten years. Long-lived data is already exposed if migration takes years.')}
<p>Financial and health data, identity records and state secrets often have x of a decade or more, and large organisations rarely migrate core cryptography in under five years. That is why key exchange migration started first, and why it is already the default in browsers.</p>

<h2>Where post-quantum schemes come from</h2>
<p>Post-quantum cryptography (PQC) means classical algorithms, running on ordinary computers, based on problems that quantum computers are not known to solve efficiently. Several mathematical families compete:</p>
<div class="tbl"><table><tr><th>Family</th><th>Hard problem</th><th>Status</th></tr>
<tr><td>Lattices</td><td>Learning With Errors, short vectors</td><td>Basis of ML-KEM and ML-DSA; fast, moderate sizes</td></tr>
<tr><td>Hash-based</td><td>Security of the hash function only</td><td>SLH-DSA, XMSS, LMS; very conservative, large or stateful signatures (Chapter 16)</td></tr>
<tr><td>Codes</td><td>Decoding random linear codes</td><td>Classic McEliece (1978, never broken, keys up to about 1 MB); HQC chosen by NIST in 2025 as a backup KEM</td></tr>
<tr><td>Multivariate</td><td>Solving systems of quadratic equations</td><td>Rainbow, a finalist, was broken in 2022 with a weekend of laptop computation</td></tr>
<tr><td>Isogenies</td><td>Maps between elliptic curves</td><td>SIKE, an alternate candidate, was broken in 2022 in about an hour on a single core</td></tr>
</table></div>
<p>The two dramatic 2022 breaks were a healthy outcome of open scrutiny, and a lesson: newer mathematical assumptions carry more risk. It is the main argument for <strong>hybrid</strong> deployment (Chapter 16), combining a post-quantum scheme with a classical one so that both must be broken.</p>
<h3>The NIST process</h3>
<p>NIST called for proposals in 2016 and received 82, of which 69 were complete. After three rounds of public cryptanalysis, it announced selections in July 2022, and on 13 August 2024 published the first three standards: <strong>FIPS 203</strong> (ML-KEM, from CRYSTALS-Kyber), <strong>FIPS 204</strong> (ML-DSA, from CRYSTALS-Dilithium) and <strong>FIPS 205</strong> (SLH-DSA, from SPHINCS+). FN-DSA (from Falcon) follows as FIPS 206, and HQC was selected in March 2025 as a second KEM built on different mathematics.</p>

<h2>Lattices</h2>
<p>A <strong>lattice</strong> is the set of all integer combinations of some basis vectors b₁, …, bₙ: a regular grid of points in n-dimensional space. The same lattice has many bases. Some are <em>good</em>, made of short, nearly perpendicular vectors; most are <em>bad</em>, made of long, nearly parallel ones.</p>
${fig('lattice', '<b>Figure 15.2</b> One lattice, two bases. With the good basis, finding the lattice point nearest a target is easy; with the bad basis, the natural method lands far away.')}
<p>Two problems are hard in high dimensions given only a bad basis:</p>
<ul>
<li><strong>Shortest vector problem (SVP):</strong> find the shortest non-zero lattice vector.</li>
<li><strong>Closest vector problem (CVP):</strong> given a target point, find the nearest lattice point.</li>
</ul>
<p>The best algorithms, lattice reduction (LLL from 1982, and its stronger descendant BKZ) and sieving, take time exponential in the dimension for the approximation quality cryptography needs. No quantum algorithm is known to do substantially better. Cryptographic lattices have dimensions of several hundred to over a thousand.</p>
<p>Lattices also have a unique theoretical strength. Ajtai (1996) and Regev (2005) proved that solving random instances of certain lattice problems is at least as hard as solving the <em>worst-case</em> instances of related problems, so there are no "unlucky" keys to worry about, given proper parameters.</p>

<h2>Learning With Errors</h2>
<p>Oded Regev's 2005 <strong>Learning With Errors</strong> (LWE) problem is the workhorse. Choose a secret vector s of n numbers modulo q. Publish many random vectors aᵢ together with</p>
<div class="formula">bᵢ = ⟨aᵢ, s⟩ + eᵢ  mod q          where each eᵢ is a small random error</div>
<p>Without errors this is a linear system, solved instantly by Gaussian elimination. With small errors, recovering s, or even distinguishing the bᵢ from uniformly random numbers, is as hard as approximate lattice problems. Geometrically, b is a lattice point (A·s) pushed slightly off by e, and finding s is a closest-vector problem.</p>
${fig('lwe', '<b>Figure 15.3</b> Encrypting one bit with toy LWE (Regev\'s scheme). The secret cancels the public matrix during decryption, leaving small noise that decodes to 0 or 1.')}
<p>Regev's encryption scheme in the figure is simple and CPA-secure, but inefficient: the public key is a large matrix, and each ciphertext carries only one bit.</p>
<h3>From LWE to Module-LWE</h3>
<p>Efficient schemes replace numbers with <strong>polynomials</strong>. In the ring R_q = ℤ_q[x]/(x<sup>256</sup> + 1), an element is a polynomial with 256 coefficients modulo q, and multiplication wraps around because x<sup>256</sup> = −1. One ring element carries 256 coefficients' worth of structure, so keys shrink by a factor of hundreds. <strong>Module-LWE</strong> uses small vectors and matrices of such polynomials, for example 3 × 3 for ML-KEM-768. That keeps most of the structure's efficiency while adding a safety margin over the plain ring version. Multiplication uses the Number Theoretic Transform, a version of the fast Fourier transform with integers modulo q = 3329, which makes ML-KEM very fast.</p>

<h2>ML-KEM</h2>
<p>ML-KEM (FIPS 203) has two layers.</p>
<ol>
<li><strong>K-PKE</strong>, a CPA-secure public-key encryption scheme based on Module-LWE, essentially Regev's idea with polynomials: the public key is (A, t = A·s + e), and a 256-bit message is encoded in the coefficients of a polynomial, each near 0 or near q/2. Ciphertexts are compressed by dropping low-order bits, which only adds a little more noise.</li>
<li>A variant of the <strong>Fujisaki-Okamoto transform</strong> that turns it into a CCA-secure KEM. Encapsulation picks a random message m, derives the encryption randomness deterministically from m and a hash of the public key, and outputs K derived from m. Decapsulation decrypts to m′, <em>re-encrypts</em> m′ with the same derived randomness, and checks the result equals the received ciphertext. If not, it returns a pseudorandom key derived from a secret value and the ciphertext ("implicit rejection") instead of an error, so attackers learn nothing from malformed ciphertexts.</li>
</ol>
<div class="tbl"><table><tr><th>Parameter set</th><th>NIST category</th><th>Module rank k</th><th>Encapsulation key</th><th>Ciphertext</th><th>Decapsulation key</th></tr>
<tr><td>ML-KEM-512</td><td>1 (≈ AES-128)</td><td class="num">2</td><td class="num">800 B</td><td class="num">768 B</td><td class="num">1,632 B</td></tr>
<tr><td>ML-KEM-768</td><td>3 (≈ AES-192)</td><td class="num">3</td><td class="num">1,184 B</td><td class="num">1,088 B</td><td class="num">2,400 B</td></tr>
<tr><td>ML-KEM-1024</td><td>5 (≈ AES-256)</td><td class="num">4</td><td class="num">1,568 B</td><td class="num">1,568 B</td><td class="num">3,168 B</td></tr>
</table></div>
<p>All produce a 32-byte shared secret. ML-KEM-768 is the general default and the one in browsers' hybrid key exchange; CNSA 2.0 requires ML-KEM-1024. Computation is fast, comparable to or faster than X25519; the cost is size, about 1 KB each way instead of 32 bytes.</p>
<div class="note pit"><b>Pitfall</b><p>Implementations must be constant time like any other. In 2024 the "KyberSlash" issues showed that several libraries used a division by q on secret data, which takes data-dependent time on many CPUs and leaked keys. Use maintained implementations (the JDK, BoringSSL, AWS-LC, liboqs, Bouncy Castle) rather than ports from reference code.</p></div>

<h2>In code: ML-KEM in Java</h2>
<p>JDK 24 added ML-KEM (JEP 496) behind the KEM API introduced in JDK 21, so code written for DHKEM in Chapter 11 needs only a different algorithm name.</p>
${code('MlKemDemo.java')`import java.security.KeyPair;
import java.security.KeyPairGenerator;
import java.security.MessageDigest;
import java.security.spec.NamedParameterSpec;
import javax.crypto.KEM;
import javax.crypto.SecretKey;

public final class MlKemDemo {
    public static void main(String[] args) throws Exception {
        KeyPairGenerator g = KeyPairGenerator.getInstance("ML-KEM");
        g.initialize(NamedParameterSpec.ML_KEM_768);
        KeyPair recipient = g.generateKeyPair();
        System.out.println("encapsulation key: " + recipient.getPublic().getEncoded().length + " bytes (X.509-encoded)");

        KEM kem = KEM.getInstance("ML-KEM");
        KEM.Encapsulated e = kem.newEncapsulator(recipient.getPublic()).encapsulate();
        byte[] ciphertext = e.encapsulation();                        // 1088 bytes for ML-KEM-768
        SecretKey senderKey = e.key();                                 // 32-byte shared secret

        SecretKey recipientKey = kem.newDecapsulator(recipient.getPrivate()).decapsulate(ciphertext);
        System.out.println(ciphertext.length + " " + MessageDigest.isEqual(senderKey.getEncoded(), recipientKey.getEncoded()));

        // Tampering does not raise an error: implicit rejection returns an unrelated key.
        ciphertext[0] ^= 1;
        SecretKey bogus = kem.newDecapsulator(recipient.getPrivate()).decapsulate(ciphertext);
        System.out.println(MessageDigest.isEqual(senderKey.getEncoded(), bogus.getEncoded()));  // false
        // Feed the KEM key into HKDF and an AEAD exactly as in Chapter 11.
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Waiting for a quantum computer to appear</strong> before migrating key exchange for long-lived data.</li>
<li><strong>Doubling RSA or ECC key sizes</strong> as a quantum defence. Shor's algorithm scales polynomially.</li>
<li><strong>Using a post-quantum KEM alone</strong> in protocols where a hybrid is easy, while the schemes are still young.</li>
<li><strong>Assuming bigger ciphertexts fit</strong>: UDP-based protocols, small MTUs, fixed-size database columns and HSM message limits all need checking.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Apply Mosca</summary><p>Your bank archives encrypted customer communications that must stay confidential for 10 years, and migration will take 4 years. If a CRQC arrives in 12 years, are you exposed? Yes: 10 + 4 = 14 > 12.</p></details>
<details><summary>What breaks?</summary><p>Which of these does Shor's algorithm break: AES-256-GCM, Ed25519, HMAC-SHA256, X25519, RSA-4096? Ed25519, X25519 and RSA-4096.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>LWE without errors</summary><p>Using the toy numbers in Figure 15.3 but setting every error to zero, recover s from four rows of A and b by solving the linear system modulo 97. Then explain where the method fails with errors.</p></details>
<details><summary>Decryption failure</summary><p>In the toy scheme with q = 97, what is the largest total noise |rᵀe| that still decodes correctly? Anything below q/4 ≈ 24. How many rows with errors of ±1 could you sum before failure becomes possible?</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Implement toy Regev encryption</summary><p>Implement Regev's scheme in Java for n = 64, q = 4093 and Gaussian-like errors, encrypting a 32-byte message bit by bit. Measure key and ciphertext sizes, then compare with ML-KEM-768 to see what the ring structure saves.</p></details>
<details><summary>Lattice reduction</summary><p>Implement LLL in two dimensions (Gauss reduction) and show it recovers the good basis of Figure 15.2 from the bad one. Read about why BKZ is needed in high dimensions.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain what quantum computers do differently and why they are not "parallel trial" machines.</li>
<li>I can state what Shor and Grover break, and what remains secure.</li>
<li>I can explain harvest-now-decrypt-later and apply Mosca's inequality to real data.</li>
<li>I can name the post-quantum families and explain why SIKE's and Rainbow's breaks argue for hybrids.</li>
<li>I can define lattices, SVP, CVP and LWE, and explain why errors make LWE hard.</li>
<li>I can describe ML-KEM's structure, parameter sets and sizes, and use it from Java.</li>
</ul>
`});

CH.push({
  id: 'ch16', n: 16, title: 'Post-Quantum II: Signatures and Migration',
  lede: 'Key exchange is being replaced first because recorded traffic is at risk today. Signatures come next, and they are harder: post-quantum signatures are much larger, they flow through certificate chains, firmware updates and HSMs, and some must be trusted for decades. This chapter builds hash-based signatures from scratch, explains ML-DSA and SLH-DSA, measures what the new sizes do to TLS, and lays out a practical migration programme with crypto-agility at its centre.',
  html: `
<h2>Signatures from hash functions alone</h2>
<p>The most conservative post-quantum signatures need no new mathematics. Their only assumption is that a hash function is one-way, which Grover's algorithm weakens only modestly. They also make a satisfying construction to understand from first principles.</p>
<h3>Lamport one-time signatures</h3>
<p>Leslie Lamport's 1979 scheme signs one n-bit digest. The private key is 2n random secrets, a pair (x<sub>i,0</sub>, x<sub>i,1</sub>) for each bit position; the public key is the hash of each. To sign, reveal x<sub>i,b</sub> for each bit b of the digest. To verify, hash the revealed values and compare.</p>
${fig('lamport', '<b>Figure 16.1</b> Lamport signatures on a 4-bit digest. One signature reveals half the secrets; a second signature with the same key reveals enough to forge.')}
<p>Security follows directly: forging a signature on a new digest needs at least one secret that was never revealed, which requires inverting the hash. The flaw is that keys are strictly <strong>one-time</strong>, and they are big: for 256-bit digests, 16 KB of public key and 8 KB of signature.</p>
<h3>Winternitz: trading time for size</h3>
<p>Winternitz one-time signatures (WOTS) sign several bits at once with hash <em>chains</em>. For a base-16 digit d, the public value is H<sup>15</sup>(x) (x hashed 15 times) and the signature reveals H<sup>d</sup>(x); the verifier hashes 15 − d more times and compares. A checksum appended to the digest stops the attacker simply hashing forward to increase digits. Signatures shrink several-fold at the cost of more hashing.</p>
<h3>Merkle trees: many signatures, one public key</h3>
<p>One-time keys are impractical unless many can share one public key. Ralph Merkle's 1979 solution: generate 2<sup>h</sup> one-time key pairs, build a Merkle tree (Chapter 7) over their public keys, and publish only the root. A signature is a one-time signature with the next unused key, plus that key's authentication path to the root.</p>
${fig('merkleSig', '<b>Figure 16.2</b> A Merkle signature scheme. The public key is the root; a signature includes one one-time signature and the sibling hashes (orange) that link its key to the root.')}
<p>Standardised versions are <strong>XMSS</strong> (RFC 8391) and <strong>LMS</strong> (RFC 8554), both approved by NIST SP 800-208. They are compact and fast to verify, but <strong>stateful</strong>: the signer must never use a one-time key twice, so it must record which keys are used, reliably, before releasing each signature. Restoring a backup, cloning a VM or running two signing servers can reuse keys and allow forgeries. They therefore suit firmware and software signing done in a controlled HSM, and CNSA 2.0 requires them for that purpose now.</p>
<h3>SLH-DSA: stateless hash-based signatures</h3>
<p>SLH-DSA (FIPS 205, from SPHINCS+) removes the state. It uses a "hypertree" of many layers of XMSS-like trees, and at the bottom a <em>few-time</em> signature scheme (FORS) that tolerates occasional reuse. The leaf used for each message is chosen pseudorandomly from a hash of the message and a secret, so with an enormous number of leaves, collisions are too rare to matter. The result needs nothing but a hash function and keeps no state, at the cost of large signatures (7.9 KB for the small variant, 17 KB for the fast one) and slow signing. It is the conservative choice for things that must be trusted for decades, such as root CA keys.</p>

<h2>ML-DSA</h2>
<p>ML-DSA (FIPS 204, from CRYSTALS-Dilithium) is the general-purpose post-quantum signature, based on Module-LWE and the related Short Integer Solution problem. Its design is Schnorr's (Chapter 12) moved onto lattices, with one essential twist.</p>
<ul>
<li><strong>Key generation:</strong> random matrix A (expanded from a seed), short secret vectors s₁, s₂, public t = A·s₁ + s₂.</li>
<li><strong>Signing:</strong> pick a random short masking vector y, compute w = A·y, derive a challenge c from the hash of the message and the high-order bits of w, and respond z = y + c·s₁.</li>
<li><strong>Verification:</strong> check that z is short and that the high-order bits of A·z − c·t match those used to derive c.</li>
</ul>
<p>The twist is <strong>rejection sampling</strong>. Over many signatures, the distribution of z = y + c·s₁ would gradually reveal s₁, just as a biased ECDSA nonce reveals d. So the signer checks whether z, and a few other values, could leak information, and if so throws the attempt away and starts again with a new y ("Fiat-Shamir with aborts", Lyubashevsky 2009). Published z values are then statistically independent of the secret. ML-DSA-65 needs about five attempts on average, invisible to the caller.</p>
<p>ML-DSA signs with fresh randomness by default ("hedged"), also offers a deterministic mode, and accepts a context string for domain separation. A pre-hash variant, HashML-DSA, exists for signers such as HSMs that can only receive a digest.</p>
<div class="tbl"><table><tr><th>Parameter set</th><th>Category</th><th>Public key</th><th>Signature</th><th>Private key</th></tr>
<tr><td>ML-DSA-44</td><td>2</td><td class="num">1,312 B</td><td class="num">2,420 B</td><td class="num">2,560 B</td></tr>
<tr><td>ML-DSA-65</td><td>3</td><td class="num">1,952 B</td><td class="num">3,309 B</td><td class="num">4,032 B</td></tr>
<tr><td>ML-DSA-87</td><td>5</td><td class="num">2,592 B</td><td class="num">4,627 B</td><td class="num">4,896 B</td></tr>
</table></div>
<h3>FN-DSA and others</h3>
<p>FN-DSA (from Falcon, to be FIPS 206) uses NTRU lattices and a hash-and-sign design with very compact signatures, about 666 bytes for the 128-bit level. It requires sampling from a discrete Gaussian distribution with floating-point arithmetic, which is hard to implement in constant time, so it is attractive where size matters most and the implementation can be trusted. NIST is also evaluating a second round of additional signature candidates, 14 announced in October 2024, looking for smaller signatures based on other assumptions.</p>

<h2>What the sizes mean</h2>
${fig('pqsizes', '<b>Figure 16.3</b> Public key (purple segment) plus signature sizes in bytes. Classical signatures are a few dozen bytes; post-quantum ones are kilobytes.')}
<p>A TLS handshake carries several signatures and public keys: the leaf public key, its certificate's signature, the intermediate's public key and signature, two or three Certificate Transparency timestamps (each a signature), and the CertificateVerify signature. With ML-DSA-65 throughout, that is roughly 15 to 20 KB instead of about 2 to 4 KB. TCP's initial congestion window is typically 10 segments, about 14 KB, so the server's first flight may need an extra round trip. Mitigations under development include certificate compression, mixing algorithms (a compact FN-DSA or classical signature where quantum forgery is not a near-term risk), trust anchor negotiation, and <strong>Merkle Tree Certificates</strong>, which replace most per-certificate signatures with short inclusion proofs. For many API and internal uses, the extra kilobytes are simply affordable.</p>

<h2>Hybrid key exchange in practice</h2>
<p>While post-quantum schemes are young, the consensus for key exchange is <strong>hybrid</strong>: run a classical and a post-quantum key exchange together and derive keys from both. The session is secure if <em>either</em> holds, which protects against both a quantum computer and an unexpected classical break of ML-KEM.</p>
${fig('hybrid', '<b>Figure 16.4</b> The X25519MLKEM768 hybrid in a TLS 1.3 handshake. Both secrets feed the key schedule.')}
<p>This is not a future plan. Chrome made X25519MLKEM768 its default in late 2024, after a period with a pre-standard Kyber version; Firefox, Edge, Cloudflare, Google and AWS services support it, OpenSSL 3.5 (2025) offers it by default, and a large share of browser traffic to major CDNs is already post-quantum protected. Deployment surfaced practical problems: some middleboxes and servers failed on ClientHellos that span two packets, and enterprises needed policies to disable the feature temporarily. Protocols with tight size limits, such as IKEv2 for IPsec, needed extensions to carry the larger keys (RFC 9370).</p>
<p>For signatures, the hybrid question is more debated. Options include composite certificates (one certificate with two keys and two signatures), parallel chains, and simply moving to ML-DSA once trusted. Because signature migration is not urgent against harvest-now attacks, many organisations are taking time to choose.</p>

<h2>A migration programme</h2>
<ol>
<li><strong>Inventory.</strong> Find where cryptography is used: protocols, libraries, certificates, HSMs, keys at rest, partners' interfaces, embedded devices. A cryptographic bill of materials (CBOM) records algorithms and key sizes per system. Most organisations find far more uses than expected, many inside third-party products.</li>
<li><strong>Classify by Mosca.</strong> For each data flow, estimate how long the data must stay secret. Long-lived confidential data in transit gets hybrid key exchange first.</li>
<li><strong>Prioritise.</strong> Typically: external TLS and VPN key exchange for sensitive data; long-lived signing roots and firmware signing (consider SLH-DSA, LMS or XMSS); internal service meshes; data at rest (move to AES-256 and check key wrapping); then everything else.</li>
<li><strong>Build crypto-agility.</strong> Make algorithms a configuration choice, not a code change: algorithm identifiers in every ciphertext, signature and key format; versioned envelopes; central crypto libraries or services instead of scattered calls; certificate automation. Agility is what makes this migration and the next one cheap.</li>
<li><strong>Engage vendors.</strong> HSM firmware, cloud KMS, load balancers, payment terminals and partner networks set your pace. Major clouds and HSM vendors have begun offering ML-KEM and ML-DSA.</li>
<li><strong>Test.</strong> Larger handshakes, MTU and fragmentation, database column sizes for keys and signatures, HSM throughput, latency budgets.</li>
<li><strong>Roll out and monitor,</strong> keeping the classical half of hybrids until confidence is high.</li>
</ol>
${fig('pqtimeline', '<b>Figure 16.5</b> Milestones in the post-quantum transition, from NIST\'s call for proposals to the planned retirement of RSA and elliptic curves.')}
<div class="note key"><b>Key idea</b><p>Symmetric cryptography mostly survives. Use AES-256 and SHA-384 or SHA-512 for long-term protection, and keep using HMAC, HKDF and AEADs as before. The migration is about public-key operations.</p></div>

<h2>In code</h2>
${code('MlDsaDemo.java')`import java.nio.charset.StandardCharsets;
import java.security.KeyPair;
import java.security.KeyPairGenerator;
import java.security.Signature;
import java.security.spec.NamedParameterSpec;
import java.util.Map;

public final class MlDsaDemo {
    /** Crypto-agility: the algorithm comes from configuration and is recorded with each signature. */
    record SignatureSuite(String id, String jcaKeyAlg, NamedParameterSpec params, String jcaSigAlg) {}
    static final Map<String, SignatureSuite> SUITES = Map.of(
        "ed25519-v1", new SignatureSuite("ed25519-v1", "Ed25519", NamedParameterSpec.ED25519, "Ed25519"),
        "mldsa65-v1", new SignatureSuite("mldsa65-v1", "ML-DSA", NamedParameterSpec.ML_DSA_65, "ML-DSA"));

    public static void main(String[] args) throws Exception {
        SignatureSuite suite = SUITES.get(System.getProperty("sig.suite", "mldsa65-v1"));

        KeyPairGenerator g = KeyPairGenerator.getInstance(suite.jcaKeyAlg());
        g.initialize(suite.params());
        KeyPair kp = g.generateKeyPair();                         // JDK 24+ for ML-DSA (JEP 497)

        byte[] doc = "settlement batch 2026-11-06, total 1,204,331.17 EUR".getBytes(StandardCharsets.UTF_8);
        Signature s = Signature.getInstance(suite.jcaSigAlg());
        s.initSign(kp.getPrivate());
        s.update(doc);
        byte[] sig = s.sign();
        System.out.println(suite.id() + ": signature " + sig.length + " bytes");   // 3309 for ML-DSA-65

        Signature v = Signature.getInstance(suite.jcaSigAlg());
        v.initVerify(kp.getPublic());
        v.update(doc);
        System.out.println("valid: " + v.verify(sig));
        // Store {suite.id, sig} together so verifiers know which algorithm to use,
        // and old signatures stay verifiable after the default suite changes.
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Running stateful hash-based signatures</strong> (XMSS, LMS) outside a system that guarantees state is never rolled back.</li>
<li><strong>Hard-coding algorithm choices</strong> and key sizes across hundreds of services, so each must be changed by hand.</li>
<li><strong>Ignoring size limits:</strong> VARCHAR(512) signature columns, 4 KB HSM message limits, UDP protocols that cannot fragment.</li>
<li><strong>Treating the migration as only a TLS upgrade.</strong> Stored ciphertexts wrapped with RSA, code signing, partner file exchanges and tokens all need plans.</li>
<li><strong>Waiting for perfect standards.</strong> Hybrid ML-KEM is standard and deployed; start with key exchange.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Lamport sizes</summary><p>For SHA-256 digests and 32-byte secrets, how large are a Lamport public key and signature? 2 × 256 × 32 = 16 KB public key; 256 × 32 = 8 KB signature.</p></details>
