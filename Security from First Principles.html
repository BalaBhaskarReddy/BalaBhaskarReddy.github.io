CH.push({
  id: 'ch09', n: 9, title: 'Number Theory for Cryptography',
  lede: 'Symmetric cryptography needs a key shared in advance. Public-key cryptography removes that need, and it is built on arithmetic: on operations that are easy to do one way and believed hard to undo. This chapter develops exactly the number theory needed for Diffie-Hellman, RSA, elliptic curves and signatures, from modular arithmetic and inverses to groups, generators, fast exponentiation and the hard problems everything rests on.',
  html: `
<h2>Why arithmetic?</h2>
<p>Everything so far assumed Alice and Bob already share a key. Two strangers on the Internet do not. In 1976 Whitfield Diffie and Martin Hellman showed how they could agree on one in public, and in 1977 Rivest, Shamir and Adleman showed how to encrypt to someone who had only published a key. Both rely on mathematical <strong>one-way functions with structure</strong>: operations that are fast to compute, infeasible to invert, and that still obey algebraic rules allowing clever protocols. The raw material is arithmetic modulo a number.</p>

<h2>Modular arithmetic</h2>
<p>For a positive integer n, two integers are <strong>congruent modulo n</strong>, written a ≡ b (mod n), if n divides a − b. Every integer is congruent to exactly one value in {0, 1, …, n − 1}, its remainder. Clock arithmetic is arithmetic modulo 12: 9 o'clock plus 5 hours is 2 o'clock.</p>
<p>The set ℤₙ = {0, 1, …, n − 1} with addition and multiplication followed by taking the remainder behaves like ordinary arithmetic in most ways. You can add, subtract and multiply, and reduce at any time without changing the result: (a × b) mod n = ((a mod n) × (b mod n)) mod n. That is what keeps numbers manageable; a 2048-bit computation never needs more than 4096 bits in an intermediate product.</p>
<h3>Division and inverses</h3>
<p>Division is where modular arithmetic differs. The <strong>inverse</strong> of a modulo n is a number a<sup>−1</sup> with a × a<sup>−1</sup> ≡ 1 (mod n). It exists exactly when gcd(a, n) = 1, that is when a and n share no common factor. Figure 9.1 shows this in multiplication tables.</p>
${fig('multab', '<b>Figure 9.1</b> Multiplication tables modulo 7 and modulo 10. Modulo a prime, every non-zero element has an inverse; modulo 10, only elements coprime to 10 do.')}
<p>When n = p is prime, every non-zero element is invertible, so ℤₚ is a <strong>field</strong>: you can add, subtract, multiply and divide by anything except zero. Fields are where the most convenient cryptography lives: prime-field Diffie-Hellman, elliptic curves over ℤₚ, and the polynomial rings of post-quantum lattice schemes.</p>

<h2>The Euclidean algorithm</h2>
<p>The greatest common divisor is computed by Euclid's algorithm, more than 2,300 years old and still optimal in practice: gcd(a, b) = gcd(b, a mod b), and gcd(a, 0) = a. Each step at least halves the numbers every two steps, so the number of steps is proportional to the number of digits. For 2048-bit numbers that is a few thousand steps.</p>
<p>The <strong>extended</strong> Euclidean algorithm also finds integers s and t with s·a + t·b = gcd(a, b) (Bézout's identity). When gcd(a, n) = 1, the coefficient of a is its inverse modulo n. This is how RSA computes its private exponent.</p>
${fig('euclid', '<b>Figure 9.2</b> The extended Euclidean algorithm finding 17<sup>−1</sup> mod 3120 = 2753, the private exponent in the classic toy RSA example of Chapter 11.')}

<h2>Groups</h2>
<p>A <strong>group</strong> is a set with one operation that is associative, has an identity element and has inverses. Two groups matter here:</p>
<ul>
<li><strong>ℤₙ under addition</strong>, with identity 0. Easy, and useless for cryptography because "division" (solving x·a ≡ b) is trivial.</li>
<li><strong>ℤₙ* under multiplication</strong>, the invertible elements modulo n, with identity 1. For a prime p, ℤₚ* = {1, …, p − 1} has p − 1 elements.</li>
</ul>
<p>The number of elements in ℤₙ* is Euler's totient φ(n). For a prime, φ(p) = p − 1. For a product of two distinct primes, φ(pq) = (p − 1)(q − 1), which is easy to compute if you know p and q and, as far as anyone knows, hard if you do not. RSA depends on that asymmetry.</p>
<h3>Order, generators and subgroups</h3>
<p>Start at an element g and multiply by g repeatedly: g, g², g³, … Since the group is finite, you eventually return to 1. The number of steps is the <strong>order</strong> of g. If the powers of g reach every element, g is a <strong>generator</strong> and the group is <strong>cyclic</strong>. ℤₚ* is always cyclic. Otherwise the powers of g form a smaller <strong>subgroup</strong>.</p>
${fig('powers', '<b>Figure 9.3</b> Powers of 3 visit all of ℤ₇*, so 3 is a generator. Powers of 2 cycle through a subgroup of order 3.')}
<p><strong>Lagrange's theorem</strong>: the order of any element, and of any subgroup, divides the order of the group. Consequences used constantly:</p>
<ul>
<li><strong>Fermat's little theorem:</strong> for prime p and a not divisible by p, a<sup>p−1</sup> ≡ 1 (mod p).</li>
<li><strong>Euler's theorem:</strong> for gcd(a, n) = 1, a<sup>φ(n)</sup> ≡ 1 (mod n). So exponents can be reduced modulo φ(n): a<sup>x</sup> ≡ a<sup>x mod φ(n)</sup>. This is exactly why RSA decryption works.</li>
<li>Exponents live modulo the group order. In a group of prime order q, the exponents form the field ℤ_q, so you can divide exponents, which signature schemes rely on.</li>
</ul>
<p>Cryptography prefers groups of large <strong>prime order</strong>. If the order has small factors, an attacker can solve problems separately in each small subgroup and combine the answers (the Pohlig-Hellman method). Standard Diffie-Hellman groups use a <em>safe prime</em> p = 2q + 1 with q prime, working in the subgroup of order q.</p>

<h2>The Chinese remainder theorem</h2>
<p>If n = pq with p and q coprime, knowing x mod p and x mod q determines x mod n uniquely, and there is a simple formula to reconstruct it. Practically, arithmetic modulo n can be split into two independent computations modulo p and modulo q, each on numbers half the size. RSA implementations use this for a roughly fourfold speed-up of private-key operations. It also creates a danger: if a fault, such as a voltage glitch or a cosmic ray, corrupts one of the two half computations, the faulty signature and the correct one together reveal a factor of n (the Bellcore attack, 1996). Implementations verify each signature before releasing it.</p>

<h2>Fast exponentiation</h2>
<p>Public-key cryptography computes g<sup>x</sup> mod n with exponents of hundreds or thousands of bits. Multiplying x times is impossible; the trick is <strong>square-and-multiply</strong>. Read the exponent's bits from the most significant end; for each bit, square the accumulator, and if the bit is 1, also multiply by g. The number of operations is about twice the number of bits.</p>
${fig('sqmul', '<b>Figure 9.4</b> Square-and-multiply computing 5<sup>117</sup> mod 23. Each bit costs a squaring; each 1 bit adds a multiplication.')}
<div class="note pit"><b>Pitfall</b><p>The basic algorithm leaks the exponent. A 1 bit takes an extra multiplication, so timing or power measurements trace out the bits of a private key. Paul Kocher's 1996 timing attack recovered RSA and Diffie-Hellman keys this way. Constant-time implementations always perform the same operations regardless of the bits, for example the <em>Montgomery ladder</em>, which does one squaring and one multiplication per bit and swaps registers without branching. Never implement private-key exponentiation yourself for production; Java's <code>BigInteger.modPow</code> is not constant time and is fine only for public values.</p></div>

<h2>Finding large primes</h2>
<p>Keys need random primes of 1024 bits or more. The <strong>prime number theorem</strong> says the density of primes near N is about 1/ln N, so roughly 1 in 710 numbers near 2<sup>1024</sup> is prime, or 1 in 355 odd numbers. Picking random odd numbers and testing each finds one quickly.</p>
<p>The test is <strong>Miller-Rabin</strong>, a strengthened Fermat test. Write n − 1 = 2<sup>s</sup>·d with d odd, pick a random base a, and compute a<sup>d</sup>, a<sup>2d</sup>, …, a<sup>2^s·d</sup> mod n. For a prime, this sequence either starts at 1 or reaches −1 before hitting 1. A composite n passes for at most a quarter of bases, so 40 random rounds leave an error probability below 2<sup>−80</sup>. Java's <code>BigInteger.isProbablePrime(certainty)</code> and <code>probablePrime</code> implement this.</p>

<h2>The hard problems</h2>
<p>All classical public-key cryptography rests on a few problems believed to be hard on ordinary computers:</p>
<ul>
<li><strong>Factoring:</strong> given n = pq, find p and q. The best algorithm, the general number field sieve, runs in sub-exponential time. The largest RSA challenge number factored publicly is RSA-250, an 829-bit number, in 2020, using about 2,700 CPU core-years. 2048-bit RSA is far beyond reach.</li>
<li><strong>Discrete logarithm (DLP):</strong> in a cyclic group with generator g, given h = g<sup>x</sup>, find x. Exponentiation is fast; the logarithm is hard. In ℤₚ* the number field sieve also applies; a 795-bit discrete log was computed in 2019.</li>
<li><strong>Computational Diffie-Hellman (CDH):</strong> given g<sup>a</sup> and g<sup>b</sup>, compute g<sup>ab</sup>. At most as hard as DLP.</li>
<li><strong>Decisional Diffie-Hellman (DDH):</strong> given g<sup>a</sup>, g<sup>b</sup> and a value Z, decide whether Z = g<sup>ab</sup> or random. The strongest assumption, needed for semantic security of ElGamal encryption.</li>
</ul>
<p>Two points shape everything that follows. First, the number field sieve is why RSA and finite-field Diffie-Hellman need 2048-bit or larger numbers for 112-bit security, while elliptic curve groups, where no such sub-exponential algorithm is known, need only 256 bits for 128-bit security (Chapter 10). Second, Shor's quantum algorithm (Chapter 15) solves factoring and discrete logarithms in polynomial time, in every group above, which is why the post-quantum chapters exist.</p>

<h2>In code</h2>
${code('NumberTheory.java')`import java.math.BigInteger;
import java.security.SecureRandom;

public final class NumberTheory {
    /** Extended Euclid: returns {g, s, t} with s*a + t*b = g = gcd(a, b). */
    static BigInteger[] egcd(BigInteger a, BigInteger b) {
        BigInteger r0 = a, r1 = b, s0 = BigInteger.ONE, s1 = BigInteger.ZERO, t0 = BigInteger.ZERO, t1 = BigInteger.ONE;
        while (r1.signum() != 0) {
            BigInteger q = r0.divide(r1), tmp;
            tmp = r0.subtract(q.multiply(r1)); r0 = r1; r1 = tmp;
            tmp = s0.subtract(q.multiply(s1)); s0 = s1; s1 = tmp;
            tmp = t0.subtract(q.multiply(t1)); t0 = t1; t1 = tmp;
        }
        return new BigInteger[] { r0, s0, t0 };
    }

    /** Left-to-right square-and-multiply. Educational: NOT constant time. */
    static BigInteger modPow(BigInteger g, BigInteger e, BigInteger n) {
        BigInteger acc = BigInteger.ONE;
        for (int i = e.bitLength() - 1; i >= 0; i--) {
            acc = acc.multiply(acc).mod(n);
            if (e.testBit(i)) acc = acc.multiply(g).mod(n);
        }
        return acc;
    }

    public static void main(String[] args) {
        BigInteger phi = BigInteger.valueOf(3120), e = BigInteger.valueOf(17);
        System.out.println(egcd(phi, e)[2].mod(phi));          // 2753
        System.out.println(e.modInverse(phi));                 // 2753, built in
        System.out.println(modPow(BigInteger.valueOf(5), BigInteger.valueOf(117), BigInteger.valueOf(19)));

        // A random 1024-bit probable prime (Miller-Rabin inside).
        BigInteger p = BigInteger.probablePrime(1024, new SecureRandom());
        System.out.println(p.isProbablePrime(80) + " " + p.bitLength());

        // Fermat's little theorem: a^(p-1) = 1 mod p.
        System.out.println(BigInteger.TWO.modPow(p.subtract(BigInteger.ONE), p));   // 1
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Using groups whose order has small factors,</strong> which enables Pohlig-Hellman and small-subgroup attacks.</li>
<li><strong>Branching on secret exponent bits,</strong> which leaks keys through timing.</li>
<li><strong>Generating primes from a weak random source.</strong> Shared primes between devices let attackers factor keys by computing gcds across many public keys.</li>
<li><strong>Using java.util.Random for BigInteger.probablePrime.</strong> Pass a SecureRandom.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Inverses mod 11</summary><p>Find 4<sup>−1</sup> mod 11. 3, since 4 × 3 = 12 ≡ 1.</p></details>
<details><summary>Totient</summary><p>Compute φ(61 × 53). 60 × 52 = 3120.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Order of an element</summary><p>Find the order of 2 modulo 11 and decide whether 2 is a generator of ℤ₁₁*. Order 10, so yes.</p></details>
<details><summary>CRT by hand</summary><p>Find x with x ≡ 2 (mod 3) and x ≡ 3 (mod 5). x = 8.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Implement Miller-Rabin</summary><p>Implement Miller-Rabin in Java with BigInteger and test it on Carmichael numbers (561, 1105, 1729), which fool the plain Fermat test for every coprime base.</p></details>
<details><summary>Batch gcd</summary><p>Generate 1,000 RSA moduli where a few deliberately share a prime. Use a product tree and remainder tree (Bernstein's batch gcd) to find the shared factors much faster than all pairwise gcds.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can compute in ℤₙ and explain when an inverse exists.</li>
<li>I can run the extended Euclidean algorithm to find a modular inverse.</li>
<li>I can define groups, order, generators and subgroups, and state Lagrange's, Fermat's and Euler's theorems.</li>
<li>I can explain the Chinese remainder theorem and the fault attack it enables.</li>
<li>I can compute modular powers with square-and-multiply and explain why it must be constant time.</li>
<li>I can state the factoring, discrete log, CDH and DDH problems and why key sizes differ between RSA and elliptic curves.</li>
</ul>
`});

FIG.ecfield = host => {
  const p = 17, a = 2, pts = [];
  for (let x = 0; x < p; x++) for (let y = 0; y < p; y++) if ((y * y - (x * x * x + a * x + 2)) % p === 0 || ((y * y - (x * x * x + a * x + 2)) % p + p) % p === 0) pts.push([x, y]);
  const inv = v => { v = ((v % p) + p) % p; for (let i = 1; i < p; i++) if (v * i % p === 1) return i; return 0; };
  const add = (P, Q) => { if (!P) return Q; if (!Q) return P; if (P[0] === Q[0] && (P[1] + Q[1]) % p === 0) return null; const l = P[0] === Q[0] ? (3 * P[0] * P[0] + a) * inv(2 * P[1]) % p : ((Q[1] - P[1]) * inv(Q[0] - P[0]) % p + p) % p; const x = ((l * l - P[0] - Q[0]) % p + p) % p; return [x, ((l * (P[0] - x) - P[1]) % p + p) % p]; };
  const G = [5, 1], mult = [G]; while (true) { const n = add(mult[mult.length - 1], G); if (!n) break; mult.push(n); }
  const F = [{ k: 0, note: `Over the finite field ℤ₁₇ the "curve" y² = x³ + 2x + 2 is just ${pts.length} scattered points, plus O. There is no picture of lines any more, but the same formulas still define addition.` }];
  [1, 2, 3, 4, 5, 9, 13, 18, 19].forEach(k => F.push({ k, note: k <= 18 ? `${k}G = (${mult[k - 1].join(', ')})` + (k === 1 ? ': the generator G = (5, 1).' : k === 5 ? '. The multiples hop around with no visible pattern.' : '.') : '19G = O, the identity. G generates the whole group of 19 elements. Given a point Q = kG, finding k is the elliptic-curve discrete logarithm problem. For curves with about 2²⁵⁶ points, nobody knows how to do it.' }));
  stepper(host, F, f => {
    const c = 22, x0 = 34, y0 = 10; let s = '';
    for (let i = 0; i < p; i++) { s += tx(x0 + i * c, y0 + p * c + 10, i, 'ti') + tx(x0 - 12, y0 + (p - 1 - i) * c, i, 'ti'); }

CH.push({
  id: 'ch10', n: 10, title: 'Diffie-Hellman and Elliptic Curves',
  lede: 'Two strangers can agree on a secret key while an eavesdropper hears every word they say. This chapter builds the Diffie-Hellman protocol that makes it possible, explains what it protects against and what it does not, and then moves the same idea onto elliptic curves, where keys are ten times smaller. X25519, the elliptic-curve Diffie-Hellman used by TLS, SSH, Signal and WireGuard, comes out at the end with a working Java example.',
  html: `
<h2>The key distribution problem</h2>
<p>Symmetric cryptography is fast and well understood, but it assumes a shared key. A company with n employees who each need a private channel to every other would need n(n−1)/2 keys, distributed in person. On the Internet, where a browser talks to millions of servers it has never met, that is impossible. Key distribution centres (Kerberos is one) help inside an organisation but require everyone to trust a central server that knows all keys.</p>
<p>In 1976 Whitfield Diffie and Martin Hellman published "New Directions in Cryptography", which opened with "We stand today on the brink of a revolution in cryptography" and showed how two parties could agree on a key using only public messages. (Malcolm Williamson at GCHQ had found the same idea in 1974, but it was classified until 1997.)</p>

<h2>The idea in paint</h2>
<p>The standard analogy uses paint mixing, which is easy to do and hard to undo. It captures the protocol's shape exactly.</p>
${fig('paint', '<b>Figure 10.1</b> Diffie-Hellman as paint mixing. The shared colour is built from both secrets, but only the mixtures travel in public.')}

<h2>The protocol</h2>
<p>Replace paint with exponentiation in a cyclic group of prime order q with generator g, such as a subgroup of ℤₚ* (Chapter 9):</p>
<ol>
<li>Alice picks a random secret a in [1, q − 1] and sends A = g<sup>a</sup>.</li>
<li>Bob picks a random secret b and sends B = g<sup>b</sup>.</li>
<li>Alice computes B<sup>a</sup> = g<sup>ba</sup>; Bob computes A<sup>b</sup> = g<sup>ab</sup>. These are equal because exponents multiply.</li>
</ol>
${fig('dhnum', '<b>Figure 10.2</b> Diffie-Hellman with toy numbers. Real deployments use groups of 2048 bits or more, or elliptic curves.')}
<p>An eavesdropper sees g, g<sup>a</sup> and g<sup>b</sup> and needs g<sup>ab</sup>: precisely the computational Diffie-Hellman problem. Under the stronger decisional assumption, the shared value is indistinguishable from a random group element. Even so, it is a group element with structure, not a uniform bit string, so it is never used directly as a key. It is fed into a key derivation function such as HKDF (Chapter 7), together with context such as both public values.</p>

<h2>What Diffie-Hellman does not do</h2>
<h3>Authentication</h3>
<p>Plain Diffie-Hellman protects against Eve but not against Mallory. Sitting in the middle, she runs one exchange with Alice and another with Bob. Each believes it is talking to the other, and Mallory decrypts, reads and re-encrypts everything.</p>
${fig('dhmitm', '<b>Figure 10.3</b> A man-in-the-middle attack on unauthenticated Diffie-Hellman. Mallory shares one key with Alice and another with Bob.')}
<p>Every real protocol therefore authenticates the exchange: TLS has the server sign the handshake with a key in its certificate (Chapter 14); SSH checks the server's host key against a stored fingerprint; Signal compares "safety numbers"; WireGuard uses static keys configured in advance. Diffie-Hellman provides secrecy; authentication must come from somewhere else.</p>
<h3>Forward secrecy</h3>
<p>If a server uses the same Diffie-Hellman key pair for years (<em>static</em> DH), or encrypts session keys with a long-term RSA key, then stealing that one key later decrypts every recorded session. If instead both sides generate fresh <strong>ephemeral</strong> key pairs for each connection and delete them afterwards, a later key theft reveals nothing about past sessions. This is <strong>forward secrecy</strong>. TLS 1.3 requires ephemeral (EC)DHE for this reason; it removed RSA key transport entirely. Ephemeral keys are cheap: generating one is a single exponentiation.</p>

<h2>Choosing parameters safely</h2>
<ul>
<li><strong>Size:</strong> finite-field DH needs a prime of at least 2048 bits (112-bit security), 3072 for 128-bit security, because the number field sieve attacks ℤₚ*.</li>
<li><strong>Standard groups:</strong> use well-vetted groups such as the RFC 7919 "ffdhe" groups, which are safe primes with documented, verifiable generation.</li>
<li><strong>Validate received values:</strong> check that a received A lies in the right subgroup (A ≠ 0, 1, p − 1 and A<sup>q</sup> = 1). Otherwise an attacker can send an element of small order, force the shared value into a tiny set, and learn the victim's secret modulo small numbers, one small subgroup at a time.</li>
</ul>
<p><strong>Logjam</strong> (2015) showed what happens otherwise. A legacy "export grade" mode in TLS allowed 512-bit DH. Most servers shared a handful of primes, and the expensive part of the number field sieve depends only on the prime, so after a week of precomputation per prime the researchers could compute individual discrete logs in about a minute and downgrade and break connections. They estimated that a nation-state could do the same precomputation for the few 1024-bit primes then used by a large fraction of VPN and HTTPS servers.</p>

<h2>Elliptic curves</h2>
<p>Diffie-Hellman works in any cyclic group where discrete logs are hard. In 1985 Neal Koblitz and Victor Miller independently proposed the group of points on an elliptic curve over a finite field. Its advantage is that no sub-exponential attack like the number field sieve is known: the best generic algorithm, Pollard's rho, takes about √q steps for a group of order q. So a 256-bit curve gives about 128-bit security, matching 3072-bit RSA or DH with keys a tenth the size and operations many times faster.</p>
<h3>The group law</h3>
<p>An elliptic curve in short Weierstrass form is the set of points (x, y) satisfying y² = x³ + ax + b, plus a <strong>point at infinity</strong> O. Over the real numbers, adding two points has a geometric meaning: draw the line through them, find the third point where it meets the curve, and reflect it across the x-axis. To double a point, use the tangent line.</p>
${fig('ecadd', '<b>Figure 10.4</b> Point addition and doubling on a real elliptic curve. These geometric rules give exact algebraic formulas that work over any field.')}
<p>Translated into algebra, for P = (x₁, y₁) and Q = (x₂, y₂):</p>
<div class="formula">λ = (y₂ − y₁)/(x₂ − x₁)  for P ≠ Q,        λ = (3x₁² + a)/(2y₁)  for P = Q
x₃ = λ² − x₁ − x₂          y₃ = λ(x₁ − x₃) − y₁</div>
<p>These formulas use only addition, multiplication and division, so they work in any field, including ℤₚ. There the "curve" is a finite scatter of points with no visible shape, but the group law still holds.</p>
${fig('ecfield', '<b>Figure 10.5</b> An elliptic curve over ℤ₁₇ and the multiples of a generator. The multiples jump around unpredictably, which is what makes the discrete logarithm hard.')}
<p><strong>Scalar multiplication</strong> kP = P + P + … + P (k times) is computed by double-and-add, the elliptic-curve version of square-and-multiply. The elliptic-curve Diffie-Hellman (ECDH) protocol is the same as before: Alice sends aG, Bob sends bG, both compute abG. The number of points on a curve over ℤₚ is close to p (within 2√p, by Hasse's theorem), and curves are chosen so that the order is a large prime, or a large prime times a tiny cofactor.</p>

<h2>Curves in use</h2>
<div class="tbl"><table><tr><th>Curve</th><th>Where it is used</th><th>Notes</th></tr>
<tr><td>P-256 (secp256r1)</td><td>TLS, payment cards, government, HSMs, WebAuthn</td><td>NIST, 2000. Fast with care; needs point validation. Its seed constants were never fully explained, which caused distrust.</td></tr>
<tr><td>Curve25519 / X25519</td><td>TLS 1.3, SSH, Signal, WireGuard, Tor</td><td>Bernstein, 2006 (RFC 7748). Designed so simple implementations are constant time and safe without validation.</td></tr>
<tr><td>Ed25519</td><td>Signatures in SSH, Git, TLS, package signing</td><td>Same curve in Edwards form (Chapter 12).</td></tr>
<tr><td>secp256k1</td><td>Bitcoin, Ethereum</td><td>A Koblitz curve chosen for efficiency.</td></tr>
<tr><td>P-384</td><td>CNSA suite, high-assurance government</td><td>192-bit security.</td></tr>
</table></div>
<h3>Why X25519 is preferred</h3>
<p>Elliptic-curve code has a long history of subtle bugs. <strong>Invalid curve attacks</strong> send a point that is not on the intended curve; formulas that never use the coefficient b happily compute on a different, weak curve, leaking the secret modulo small primes. This broke several JSON Web Encryption libraries in 2017 and Bluetooth pairing in 2018. Branches on secret bits leak timing. X25519 avoids both by design: it uses only the x-coordinate with the Montgomery ladder, which performs the same steps for every bit; every 32-byte string is a valid input; and the curve and its "twist" are both secure, so points off the curve do no harm. Private scalars are "clamped" (certain bits forced) to remove the small cofactor. The one check worth doing is rejecting an all-zero shared secret, which results from a few low-order inputs.</p>

<h2>In code: X25519 key agreement</h2>
${code('Ecdh.java')`import java.security.KeyPair;
import java.security.KeyPairGenerator;
import java.security.MessageDigest;
import javax.crypto.KDF;
import javax.crypto.KeyAgreement;
import javax.crypto.SecretKey;
import javax.crypto.spec.HKDFParameterSpec;

public final class Ecdh {
    public static void main(String[] args) throws Exception {
        KeyPairGenerator kpg = KeyPairGenerator.getInstance("X25519");
        KeyPair alice = kpg.generateKeyPair();            // ephemeral: fresh per session
        KeyPair bob = kpg.generateKeyPair();

        byte[] s1 = agree(alice, bob), s2 = agree(bob, alice);
        System.out.println(MessageDigest.isEqual(s1, s2)); // true
        if (MessageDigest.isEqual(s1, new byte[32])) throw new SecurityException("low-order point");

        // Never use the raw shared secret as a key. Derive one, binding the context.
        byte[] info = "example-app v1 session key".getBytes();
        byte[] salt = MessageDigest.getInstance("SHA-256")
            .digest(concat(alice.getPublic().getEncoded(), bob.getPublic().getEncoded()));
        KDF hkdf = KDF.getInstance("HKDF-SHA256");          // javax.crypto.KDF, JDK 25+
        SecretKey key = hkdf.deriveKey("AES",
            HKDFParameterSpec.ofExtract().addIKM(s1).addSalt(salt).thenExpand(info, 32));
        System.out.println(key.getAlgorithm() + " " + key.getEncoded().length * 8 + " bits");
        // On older JDKs, use the HMAC-based hkdf() from Chapter 7.
    }

    static byte[] agree(KeyPair mine, KeyPair theirs) throws Exception {
        KeyAgreement ka = KeyAgreement.getInstance("X25519");
        ka.init(mine.getPrivate());
        ka.doPhase(theirs.getPublic(), true);
        return ka.generateSecret();
    }

    static byte[] concat(byte[] a, byte[] b) {
        byte[] r = new byte[a.length + b.length];
        System.arraycopy(a, 0, r, 0, a.length); System.arraycopy(b, 0, r, a.length, b.length);
        return r;
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Unauthenticated key exchange.</strong> Without signatures or pre-shared keys, a man in the middle wins.</li>
<li><strong>Using the shared secret directly as an AES key.</strong> Always run it through a KDF with context.</li>
<li><strong>Static keys where ephemeral ones would do,</strong> losing forward secrecy.</li>
<li><strong>Skipping point or subgroup validation</strong> on P-256 or finite-field groups.</li>
<li><strong>1024-bit DH groups</strong> still configured on VPNs and legacy load balancers.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Run DH by hand</summary><p>With p = 23, g = 5, a = 4, b = 3, compute A, B and the shared secret. A = 4, B = 10, shared = 18.</p></details>
<details><summary>Key sizes</summary><p>Why does a 256-bit elliptic-curve key give about the same security as a 3072-bit RSA key? The best attack on the curve is generic (√q), while factoring has sub-exponential algorithms.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Add points over ℤ₁₇</summary><p>On y² = x³ + 2x + 2 over ℤ₁₇, compute 2G for G = (5, 1). λ = (3·25 + 2)/(2·1) = 77/2 ≡ 9·9 ≡ 13; x = 169 − 10 ≡ 6; y = 13(5 − 6) − 1 ≡ 3. So 2G = (6, 3).</p></details>
<details><summary>Small subgroup</summary><p>In ℤ₂₃* (order 22 = 2 × 11), show that sending the element 22 (= −1, order 2) to a victim forces the shared value to be ±1, revealing the parity of the victim's secret. How does subgroup validation stop it?</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Montgomery ladder</summary><p>Implement X25519 in Java with BigInteger following RFC 7748 (clamping, ladder with conditional swaps) and check it against the RFC's test vectors and the JDK's XDH provider. Then explain where your implementation is not constant time.</p></details>
<details><summary>Rho for ECDLP</summary><p>Implement Pollard's rho for the discrete log on a small curve (prime order around 2<sup>30</sup>) and measure how the running time scales with √q.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can run the Diffie-Hellman protocol and explain why it is correct.</li>
<li>I can explain why Diffie-Hellman alone does not stop a man in the middle.</li>
<li>I can explain forward secrecy and why TLS 1.3 requires ephemeral key exchange.</li>
<li>I can explain Logjam, small-subgroup attacks and safe parameter choices.</li>
<li>I can add and double points on an elliptic curve and describe scalar multiplication.</li>
<li>I can explain why X25519 is preferred and use it in Java with a KDF.</li>
</ul>
`});

CH.push({
  id: 'ch11', n: 11, title: 'Public-Key Encryption',
  lede: 'Diffie-Hellman lets two online parties agree on a key. Public-key encryption lets anyone encrypt to a recipient who has only published a key, even one who is offline. This chapter builds RSA from the number theory of Chapter 9, shows that "textbook" RSA is dangerously insecure, explains the padding that fixes it and the attacks on padding that broke real systems, and ends with the modern pattern: a key encapsulation mechanism plus authenticated encryption.',
  html: `
<h2>Trapdoor functions</h2>
<p>A one-way function is easy to compute and hard to invert. A <strong>trapdoor</strong> one-way function has a secret, the trapdoor, that makes inversion easy. Publish the function, keep the trapdoor, and anyone can "encrypt" by computing the function while only you can invert it. In 1977 Ron Rivest, Adi Shamir and Leonard Adleman found the first practical trapdoor permutation, and RSA became the foundation of public-key cryptography for forty years. (Clifford Cocks at GCHQ had found it in 1973, secretly.)</p>

<h2>RSA</h2>
<h3>Key generation</h3>
<ol>
<li>Choose two large random primes p and q, each of 1024 bits or more.</li>
<li>Compute the modulus n = pq and φ(n) = (p − 1)(q − 1).</li>
<li>Choose a public exponent e coprime to φ(n). Almost everyone uses e = 65537 = 2<sup>16</sup> + 1, prime and with only two 1 bits, so encryption is fast.</li>
<li>Compute the private exponent d = e<sup>−1</sup> mod φ(n) with the extended Euclidean algorithm.</li>
</ol>
<p>The public key is (n, e); the private key is d (in practice also p, q and some precomputed values for CRT speed-ups).</p>
<h3>Encryption and decryption</h3>
<div class="formula">Enc(m) = mᵉ mod n          Dec(c) = cᵈ mod n</div>
<p>Why does it work? ed ≡ 1 (mod φ(n)), so ed = 1 + kφ(n) for some k, and by Euler's theorem m<sup>ed</sup> = m · (m<sup>φ(n)</sup>)<sup>k</sup> ≡ m (mod n). Try it in Figure 11.1 with the classic example p = 61, q = 53.</p>
${fig('rsatool', '<b>Figure 11.1</b> A working RSA calculator with small numbers. Change the primes, exponent or message and watch every value update.')}
<h3>Why it is believed secure</h3>
<p>Computing d from (n, e) requires φ(n), and computing φ(n) from n is as hard as factoring n. So if factoring is hard, nobody can derive the private key from the public one. The "RSA problem", computing m from mᵉ mod n without d, might in principle be easier than factoring, but no such method is known. The best attack is to factor n with the general number field sieve, which is why sizes must be large:</p>
<div class="tbl"><table><tr><th>Security level</th><th>RSA / finite-field DH modulus</th><th>Elliptic curve</th><th>Symmetric equivalent</th></tr>
<tr><td class="num">80 bits (legacy, broken)</td><td class="num">1024</td><td class="num">160</td><td>2-key 3DES</td></tr>
<tr><td class="num">112 bits</td><td class="num">2048</td><td class="num">224</td><td>3-key 3DES</td></tr>
<tr><td class="num">128 bits</td><td class="num">3072</td><td class="num">256</td><td>AES-128</td></tr>
<tr><td class="num">192 bits</td><td class="num">7680</td><td class="num">384</td><td>AES-192</td></tr>
<tr><td class="num">256 bits</td><td class="num">15360</td><td class="num">512</td><td>AES-256</td></tr>
</table></div>
<p>RSA keys grow much faster than the security they buy, and private-key operations cost roughly the cube of the key length. That, and Shor's algorithm (Chapter 15), is why new designs prefer elliptic curves today and lattices tomorrow.</p>

<h2>Textbook RSA is not secure encryption</h2>
<p>"Textbook" RSA, encrypting m directly as mᵉ mod n, fails every reasonable security definition.</p>
<ul>
<li><strong>It is deterministic.</strong> The same message always produces the same ciphertext, so it cannot be CPA-secure (Chapter 5). An attacker who suspects the message is "yes" or "no" encrypts both and compares.</li>
<li><strong>Small messages leak.</strong> With e = 3 and a message m < n<sup>1/3</sup>, such as a 128-bit AES key under a 2048-bit modulus, mᵉ never wraps around n, so the attacker takes an ordinary cube root. Sending the same message to three recipients with e = 3 also reveals it, by the Chinese remainder theorem (Håstad's broadcast attack).</li>
<li><strong>It is malleable.</strong> (m·s)ᵉ = mᵉ·sᵉ, so anyone can multiply the plaintext by a chosen factor without knowing it.</li>
</ul>
${fig('malleable', '<b>Figure 11.2</b> RSA\'s multiplicative property. Without padding, an attacker can transform a ciphertext into the encryption of a related plaintext.')}
<p>So RSA must always be used with a randomised padding scheme that destroys this algebra.</p>

<h2>Padding, and attacks on padding</h2>
<h3>PKCS#1 v1.5</h3>
<p>The first standard padding (1993) formats the message as <code>00 02 [at least 8 random non-zero bytes] 00 [message]</code> before exponentiation. The random bytes make encryption probabilistic. The structure is checked after decryption.</p>
<p>In 1998 Daniel Bleichenbacher showed that this check is a <strong>padding oracle</strong>, just like CBC's in Chapter 5. If a server reveals whether a decrypted value starts with 00 02, an attacker uses malleability: multiply the target ciphertext by sᵉ for chosen s, submit it, and learn whether m·s mod n falls in the narrow range starting 00 02. Each answer narrows the possible values of m. After about a million queries (the "million message attack") the attacker has decrypted the ciphertext, or signed an arbitrary message with the server's key. TLS servers that used RSA key transport were vulnerable, and TLS added complicated countermeasures. They kept failing: the <strong>ROBOT</strong> attack in 2017 found the oracle alive in products from F5, Citrix and Cisco, and on Facebook and PayPal servers; the <strong>Marvin</strong> attack in 2023 found timing variants in many libraries. RSA key transport was removed from TLS 1.3 entirely.</p>
<h3>OAEP</h3>
<p>Optimal Asymmetric Encryption Padding (Bellare and Rogaway, 1994; PKCS#1 v2) mixes the message with a random seed through two mask-generation functions (built from a hash) in a two-round Feistel-like structure. Every bit of the padded value depends on every bit of the message and the randomness, and a ciphertext not produced by the honest encryption algorithm decodes to garbage with overwhelming probability. RSA-OAEP is proven CCA-secure in the random oracle model, assuming the RSA problem is hard.</p>
${fig('oaep', '<b>Figure 11.3</b> OAEP encoding. A random seed masks the data block and the masked data block masks the seed, so the result looks random and resists tampering.')}
<div class="note pit"><b>Pitfall</b><p>OAEP decryption must also fail uniformly. Manger's attack (2001) exploits implementations that leak whether the leading byte after decryption was zero. Use the library's OAEP, never parse padding yourself, and return a single error.</p></div>

<h2>ElGamal encryption</h2>
<p>Encryption can also be built from Diffie-Hellman. The recipient's key pair is a secret x and public h = g<sup>x</sup>. To encrypt a group element m, pick a fresh random r and send</p>
<div class="formula">c = (g<sup>r</sup>,  m · h<sup>r</sup>)          decrypt:  m = c₂ / c₁<sup>x</sup></div>
<p>The sender in effect does an ephemeral Diffie-Hellman exchange with the recipient's static key and uses the shared value h<sup>r</sup> = g<sup>xr</sup> as a one-time mask. ElGamal is CPA-secure under the DDH assumption. It is <em>multiplicatively homomorphic</em>: multiplying two ciphertexts component-wise gives an encryption of the product of the messages. That is useful for electronic voting and mix networks, and also means plain ElGamal is malleable and not CCA-secure.</p>

<h2>Hybrid encryption and KEMs</h2>
<p>Public-key operations are slow and plaintexts are limited to the size of the modulus. Nobody encrypts a file with RSA. Instead, every practical system uses <strong>hybrid encryption</strong>: a public-key step transports a fresh symmetric key, and authenticated encryption protects the data.</p>
<p>The clean formulation is the <strong>KEM-DEM</strong> paradigm. A <strong>key encapsulation mechanism</strong> (KEM) has three algorithms:</p>
<div class="formula">KeyGen() → (pk, sk)          Encaps(pk) → (K, c)          Decaps(sk, c) → K</div>
<p>Encapsulation generates a random key K and an encapsulation c from which only the secret-key holder can recover K. The data is then encrypted with an AEAD under K (the "data encapsulation mechanism"). A KEM does not encrypt a chosen message; it produces a random key, which is simpler to make secure and exactly what is needed.</p>
${fig('kemdem', '<b>Figure 11.4</b> Hybrid encryption with a KEM and an AEAD. The KEM transports a fresh key; the AEAD protects the data.')}
<ul>
<li><strong>RSA-KEM:</strong> pick random r < n, send rᵉ mod n, set K = KDF(r). No padding needed, because r is uniform.</li>
<li><strong>DHKEM:</strong> generate an ephemeral key pair, send its public key, and set K = KDF(DH(ephemeral, recipient), both public keys). ECIES is a version of this.</li>
<li><strong>ML-KEM:</strong> the post-quantum lattice KEM of Chapter 15, which is <em>only</em> available as a KEM.</li>
</ul>
<p><strong>HPKE</strong> (Hybrid Public Key Encryption, RFC 9180, 2022) standardises the whole pattern with a KEM, a KDF and an AEAD, including modes where the sender also authenticates. It is used by Messaging Layer Security, Encrypted Client Hello and Oblivious HTTP. If you need to encrypt to a public key today, HPKE is the answer, or the equivalent in a library such as Tink.</p>

<h2>In code</h2>
${code('PublicKeyEncryption.java')`import java.security.KeyPair;
import java.security.KeyPairGenerator;
import java.security.spec.MGF1ParameterSpec;
import javax.crypto.Cipher;
import javax.crypto.KEM;
import javax.crypto.SecretKey;
import javax.crypto.spec.GCMParameterSpec;
import javax.crypto.spec.OAEPParameterSpec;
import javax.crypto.spec.PSource;

public final class PublicKeyEncryption {
    public static void main(String[] args) throws Exception {
        // 1. RSA-OAEP: say SHA-256 for BOTH the hash and MGF1 (Java's MGF1 default is SHA-1).
        KeyPairGenerator rsaGen = KeyPairGenerator.getInstance("RSA");
        rsaGen.initialize(3072);
        KeyPair rsa = rsaGen.generateKeyPair();
        OAEPParameterSpec oaep = new OAEPParameterSpec("SHA-256", "MGF1", MGF1ParameterSpec.SHA256, PSource.PSpecified.DEFAULT);
        Cipher c = Cipher.getInstance("RSA/ECB/OAEPPadding");   // "ECB" is a naming artefact: one block
        c.init(Cipher.ENCRYPT_MODE, rsa.getPublic(), oaep);
        byte[] wrapped = c.doFinal(new byte[32]);                // e.g. wrap a 256-bit key; max ~318 bytes

        // 2. KEM + AEAD (JDK 21+): DHKEM over X25519, then AES-GCM with the encapsulated key.
        KeyPairGenerator xGen = KeyPairGenerator.getInstance("X25519");
        KeyPair recipient = xGen.generateKeyPair();
        KEM kem = KEM.getInstance("DHKEM");

        KEM.Encapsulated enc = kem.newEncapsulator(recipient.getPublic()).encapsulate(0, 32, "AES");
        SecretKey k = enc.key();
        byte[] c1 = enc.encapsulation();                          // 32-byte ephemeral public key

        byte[] nonce = new byte[12];                              // a fresh key per message: a zero nonce is safe
        Cipher aead = Cipher.getInstance("AES/GCM/NoPadding");
        aead.init(Cipher.ENCRYPT_MODE, k, new GCMParameterSpec(128, nonce));
        aead.updateAAD(c1);                                       // bind the encapsulation
        byte[] c2 = aead.doFinal("statement for March".getBytes());

        // Recipient side
        SecretKey k2 = kem.newDecapsulator(recipient.getPrivate()).decapsulate(c1, 0, 32, "AES");
        aead.init(Cipher.DECRYPT_MODE, k2, new GCMParameterSpec(128, nonce));
        aead.updateAAD(c1);
        System.out.println(new String(aead.doFinal(c2)));
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"RSA/ECB/PKCS1Padding"</strong> for new designs, which invites Bleichenbacher attacks. Use OAEP or a KEM.</li>
<li><strong>Encrypting data directly with RSA</strong> rather than wrapping a symmetric key.</li>
<li><strong>Forgetting that Java's OAEP defaults to SHA-1 for MGF1,</strong> which breaks interoperability with other libraries' SHA-256 OAEP.</li>
<li><strong>Small or unusual exponents,</strong> such as e = 3 without padding, or a small d chosen for speed (Wiener's attack recovers d when d < n<sup>1/4</sup>).</li>
<li><strong>RSA keys below 2048 bits,</strong> still found in old HSMs, payment terminals and mainframe integrations.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Encrypt by hand</summary><p>With n = 33, e = 3, encrypt m = 4. 64 mod 33 = 31. Then find d (φ = 20, d = 7) and decrypt: 31<sup>7</sup> mod 33 = 4.</p></details>
<details><summary>Deterministic leak</summary><p>An app encrypts a yes/no vote with textbook RSA under a public key. How does an observer learn every vote? Encrypt "yes" and "no" with the public key and compare ciphertexts.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Cube-root attack</summary><p>With e = 3 and a 2048-bit n, show that a 256-bit message encrypted without padding can be recovered with an integer cube root. Implement it with BigInteger using Newton's method.</p></details>
<details><summary>Common modulus</summary><p>The same message is encrypted under (n, e₁) and (n, e₂) with gcd(e₁, e₂) = 1. Show how to recover m using Bézout coefficients, without any private key.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Bleichenbacher in miniature</summary><p>Implement a PKCS#1 v1.5 oracle with a 512-bit toy key and the first steps of Bleichenbacher's algorithm (finding s₁ and narrowing the interval). Count oracle queries.</p></details>
<details><summary>Fault attack on RSA-CRT</summary><p>Compute an RSA-CRT signature with an error injected into the mod-q half. Show that gcd(sᵉ − m, n) reveals p.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can generate an RSA key pair and explain why decryption works.</li>
<li>I can explain why textbook RSA is deterministic, malleable and leaky.</li>
<li>I can explain Bleichenbacher's padding oracle and why OAEP replaced PKCS#1 v1.5.</li>
<li>I can describe ElGamal encryption and its homomorphic property.</li>
<li>I can explain hybrid encryption, the KEM-DEM paradigm and HPKE.</li>
<li>I can use RSA-OAEP with explicit SHA-256 parameters and DHKEM with AES-GCM in Java.</li>
</ul>
`});

CH.push({
  id: 'ch12', n: 12, title: 'Digital Signatures and PKI',
  lede: 'A digital signature is the public-key counterpart of a MAC: anyone can verify it, only the private key holder can produce it. Signatures authenticate software updates, TLS servers, code commits, payment messages and the certificates that tie names to keys. This chapter builds RSA, ECDSA and Ed25519 signatures, shows the nonce mistakes that have leaked private keys, and then explains public key infrastructure: certificates, chains, validation, revocation and Certificate Transparency.',
  html: `
<h2>What a signature scheme is</h2>
<div class="formula">KeyGen() → (pk, sk)          σ = Sign(sk, m)          Verify(pk, m, σ) → accept or reject</div>
<p>The security notion is the same as for MACs (Chapter 6), existential unforgeability under chosen-message attack, but now the forger also knows the public key. Signatures differ from MACs in three ways that matter in practice:</p>
<ul>
<li><strong>Public verifiability:</strong> anyone with the public key can check a signature. One key pair serves millions of verifiers, and verifiers need no secret.</li>
<li><strong>Transferability:</strong> a verified signature can be shown to a third party, who can verify it too.</li>
<li><strong>Non-repudiation:</strong> only the private-key holder could have produced it, so the signer cannot plausibly deny it, at least as far as the mathematics goes. Legally, a stolen key or a compromised device can still be argued.</li>
</ul>
<p>The price is speed and size: signing and verifying cost thousands of times more than HMAC.</p>
<h3>Hash-and-sign</h3>
<p>Signature algorithms work on fixed-size values, so every practical scheme signs H(m). This makes the scheme's security depend on the hash's collision resistance: if an attacker finds m ≠ m′ with H(m) = H(m′), a signature on one is a signature on the other. The 2008 forged CA certificate using MD5 collisions and the Flame malware (Chapter 7) were exactly this.</p>

<h2>RSA signatures</h2>
<p>The trapdoor permutation runs backwards: sign with σ = H(m)<sup>d</sup> mod n, verify by checking σ<sup>e</sup> mod n = H(m). Textbook RSA signing without hashing and padding is forgeable: pick any σ, compute m = σ<sup>e</sup> mod n, and σ is a valid signature on that (random-looking) m. Multiplying two signatures gives a signature on the product of the messages.</p>
<ul>
<li><strong>PKCS#1 v1.5 signatures</strong> pad the hash deterministically with a fixed structure and an algorithm identifier. They are still widely used and secure if verified strictly. Lax parsers have repeatedly allowed forgeries when e = 3: Bleichenbacher showed in 2006 that a verifier that ignored trailing bytes would accept a forged cube root, and the same bug class reappeared as BERserk in Mozilla NSS in 2014.</li>
<li><strong>RSA-PSS</strong> (probabilistic signature scheme) adds a random salt and a mask, like OAEP, and has a tight security proof. It is required for RSA in TLS 1.3 handshakes.</li>
</ul>

<h2>Signatures from discrete logarithms</h2>
<h3>Schnorr signatures</h3>
<p>Claus Schnorr's 1989 scheme is the cleanest. With private key x and public key X = xG on a group of prime order n:</p>
<div class="formula">Sign:  pick random k,  R = kG,  e = H(R ‖ X ‖ m),  s = k + e·x mod n,  σ = (R, s)
Verify:  sG = R + e·X</div>
<p>It is the Fiat-Shamir transform of an interactive zero-knowledge proof of knowledge of x (Chapter 17). Schnorr was patented until 2008, so standards bodies created DSA instead.</p>
<h3>ECDSA</h3>
<p>The Digital Signature Algorithm (1991) and its elliptic-curve version ECDSA are the most widely deployed DLP signatures: TLS certificates, Bitcoin, payment terminals, WebAuthn, government ID cards. To sign hash z with private key d:</p>
<div class="formula">pick secret random k,   r = (kG).x mod n,   s = k⁻¹(z + r·d) mod n,   σ = (r, s)</div>
<p>The nonce k must be secret, unique, and uniformly random. Any failure is catastrophic, because k and d are linked by a linear equation.</p>
${fig('ecdsareuse', '<b>Figure 12.1</b> Two ECDSA signatures with the same nonce reveal the private key with a few lines of algebra.')}
<p>Real incidents:</p>
<ul>
<li><strong>Sony PlayStation 3 (2010):</strong> the console firmware was signed with a fixed k. The fail0verflow group recovered the master signing key.</li>
<li><strong>Android Bitcoin wallets (2013):</strong> a flaw in Android's SecureRandom produced repeated nonces; attackers scanned the blockchain for repeated r values and emptied wallets.</li>
<li><strong>Biased nonces:</strong> even leaking a few bits of each k is fatal with enough signatures. Lattice techniques turn many partial leaks into the key. Timing leaks in nonce generation broke smart cards and TPMs ("Minerva" and "TPM-Fail", 2019).</li>
</ul>
<p>Two defences exist. <strong>Deterministic nonces</strong> (RFC 6979) derive k from the private key and the message hash with HMAC, so a broken random number generator cannot cause reuse. Modern libraries also add fresh randomness to that derivation ("hedged" signing) to resist fault attacks. Note also that ECDSA signatures are <em>malleable</em>: if (r, s) is valid, so is (r, n − s). Systems that use a signature as a unique identifier, as early Bitcoin did, must normalise s.</p>
<h3>Ed25519</h3>
<p>EdDSA (Bernstein and others, 2011; RFC 8032) is Schnorr on a twisted Edwards curve, designed to remove ECDSA's sharp edges. The nonce is derived deterministically by hashing a secret prefix with the message, so there is no randomness to get wrong. The Edwards addition formulas have no special cases, making constant-time code natural. Keys are 32 bytes and signatures 64 bytes, signing and verification are fast, and batch verification is possible. Ed25519 is the default for SSH keys, Git commit signing, Signal, Tor, package managers and many new protocols. Its main limitation is that some regulated environments and HSMs only certify NIST curves, where ECDSA P-256 remains the choice.</p>

<h2>Public key infrastructure</h2>
<p>A signature proves that whoever holds a private key signed something. It does not say who that is. When your browser receives a public key from "pay.example.com", how does it know the key really belongs to that bank and not to Mallory? Public key infrastructure answers by having trusted parties vouch for the binding.</p>
<h3>Certificates</h3>
<p>An X.509 certificate is a signed statement: "the public key K belongs to subject S, valid from date A to date B, for purposes P, signed: issuer I". The important fields:</p>
<div class="tbl"><table><tr><th>Field</th><th>Purpose</th></tr>
<tr><td>Subject and Subject Alternative Name (SAN)</td><td>Who the key belongs to. Browsers check only SAN entries (DNS names, IP addresses); the old Common Name is ignored.</td></tr>
<tr><td>Issuer</td><td>Which CA signed it.</td></tr>
<tr><td>Validity (notBefore, notAfter)</td><td>When it may be used.</td></tr>
<tr><td>Subject public key</td><td>The key being certified, with its algorithm.</td></tr>
<tr><td>Basic constraints</td><td>Whether the subject is itself a CA, and how many levels below it may exist.</td></tr>
<tr><td>Key usage, extended key usage</td><td>What the key may do: TLS server, client authentication, code signing, signing other certificates.</td></tr>
<tr><td>CRL and OCSP pointers, SCTs</td><td>Where to check revocation; Certificate Transparency proofs.</td></tr>
<tr><td>Signature</td><td>The issuer's signature over everything above.</td></tr>
</table></div>
<h3>Chains and trust anchors</h3>
<p>Root CA keys are too valuable to use online, so roots sign a few <strong>intermediate</strong> CA certificates, which sign end-entity ("leaf") certificates. Operating systems and browsers ship a <strong>trust store</strong> of root certificates chosen by root programmes (Mozilla, Apple, Microsoft, Google) that audit CAs against the CA/Browser Forum's Baseline Requirements. Validation builds a chain from the leaf up to a trusted root and checks every link.</p>
${fig('chain', '<b>Figure 12.2</b> Validating a certificate chain from the leaf to a trusted root. Each step checks a signature and the constraints on the certificate that made it.')}
<h3>Getting a certificate</h3>
<p>For a public TLS certificate, the CA must verify that the requester controls the domain: by fetching a token from a well-known HTTP path, finding it in a DNS TXT record, or a TLS-ALPN challenge. The ACME protocol (RFC 8555), created for Let's Encrypt, automates this, and free automated certificates took HTTPS from a minority of page loads in 2015 to the vast majority today. Domain owners can publish a <strong>CAA</strong> DNS record listing which CAs may issue for them; CAs must check it.</p>

<h2>When CAs fail</h2>
<p>Any trusted CA can issue a certificate for any domain, so the system is only as strong as the weakest of about 150 root operators. Failures have happened:</p>
<ul>
<li><strong>DigiNotar (2011):</strong> attackers breached the Dutch CA and issued more than 500 fraudulent certificates, including one for google.com used to intercept Gmail for some 300,000 users in Iran. Browsers removed DigiNotar and it went bankrupt within weeks.</li>
<li><strong>Symantec (2015–2018):</strong> repeated mis-issuance, including test certificates for google.com, led Chrome and Mozilla to distrust the whole Symantec hierarchy, then one of the largest CAs.</li>
<li>Several smaller CAs have issued intermediate certificates to organisations that used them to intercept traffic.</li>
</ul>
<h3>Certificate Transparency</h3>
<p>The structural fix is to make mis-issuance visible. Certificate Transparency (RFC 6962, 2013) requires every publicly trusted certificate to be recorded in public, append-only Merkle-tree logs. Chrome has required CT for all new certificates since 2018, and Apple followed.</p>
${fig('ctlog', '<b>Figure 12.3</b> Certificate Transparency. Certificates must be logged publicly before browsers accept them, so a rogue certificate cannot stay secret.')}
<p>CT does not prevent a bad certificate, but it guarantees detection. Services such as crt.sh let anyone search the logs, and security teams subscribe to alerts for their domains. It has caught many mis-issued certificates since.</p>

<h2>Revocation</h2>
<p>If a private key leaks, its certificate must stop being trusted before it expires. Classic mechanisms work poorly:</p>
<ul>
<li><strong>Certificate revocation lists (CRLs):</strong> signed lists of revoked serial numbers. They grow large, and clients rarely download them.</li>
<li><strong>OCSP:</strong> the client asks the CA's responder whether one certificate is revoked. It adds latency, leaks browsing history to the CA, and browsers "soft-fail" when the responder is unreachable, so an attacker who blocks OCSP defeats it. <em>OCSP stapling</em> has the server attach a recent signed OCSP response to the handshake, fixing privacy and latency.</li>
<li><strong>Browser-pushed lists:</strong> Chrome's CRLSets and Firefox's CRLite compress revocation data and push it to browsers.</li>
<li><strong>Short-lived certificates:</strong> the most robust answer. If a certificate lives a few days, revocation matters less. The CA/Browser Forum has voted to reduce maximum public TLS certificate lifetimes from 398 days to 200 days from March 2026, 100 days from March 2027 and 47 days from March 2029. Let's Encrypt has ended its OCSP service and offers short-lived certificates.</li>
</ul>
<p>The practical lesson for operators: automate issuance and renewal now. Manual certificate renewal will become impossible.</p>

<h2>Private PKI and other uses of signatures</h2>
<ul>
<li><strong>Internal CAs</strong> issue certificates for services, devices and employees, enabling mutual TLS between microservices and VPN client authentication. Cloud providers offer managed private CAs; SPIFFE standardises workload identities in certificates.</li>
<li><strong>Code signing:</strong> operating systems and app stores verify signatures on software. Sigstore offers "keyless" signing with short-lived certificates bound to an OIDC identity, recorded in a transparency log.</li>
<li><strong>Documents and transactions:</strong> PDF signatures, eIDAS qualified electronic signatures in the EU, JSON Web Signatures for API messages in open banking.</li>
<li><strong>Tokens:</strong> JWTs signed with RS256, ES256 or EdDSA let services verify identity assertions with only a public key.</li>
</ul>

<h2>In code</h2>
${code('Signatures.java')`import java.nio.charset.StandardCharsets;
import java.security.KeyPair;
import java.security.KeyPairGenerator;
import java.security.Signature;
import java.security.spec.ECGenParameterSpec;
import java.security.spec.MGF1ParameterSpec;
import java.security.spec.PSSParameterSpec;

public final class Signatures {
    static byte[] sign(String alg, KeyPair kp, byte[] msg, java.security.spec.AlgorithmParameterSpec p) throws Exception {
        Signature s = Signature.getInstance(alg);
        if (p != null) s.setParameter(p);
        s.initSign(kp.getPrivate());
        s.update(msg);
        return s.sign();
    }
    static boolean verify(String alg, KeyPair kp, byte[] msg, byte[] sig, java.security.spec.AlgorithmParameterSpec p) throws Exception {
        Signature s = Signature.getInstance(alg);
        if (p != null) s.setParameter(p);
        s.initVerify(kp.getPublic());
        s.update(msg);
        return s.verify(sig);
    }

    public static void main(String[] args) throws Exception {
        byte[] msg = "pay 250.00 EUR to DE89370400440532013000".getBytes(StandardCharsets.UTF_8);

        KeyPair ed = KeyPairGenerator.getInstance("Ed25519").generateKeyPair();
        byte[] s1 = sign("Ed25519", ed, msg, null);                       // 64 bytes, deterministic
        System.out.println("Ed25519 " + s1.length + " " + verify("Ed25519", ed, msg, s1, null));

        KeyPairGenerator ecGen = KeyPairGenerator.getInstance("EC");
        ecGen.initialize(new ECGenParameterSpec("secp256r1"));
        KeyPair ec = ecGen.generateKeyPair();
        // DER-encoded (r, s) for X.509 and TLS; JOSE/JWS needs raw r||s: "SHA256withECDSAinP1363Format"
        byte[] s2 = sign("SHA256withECDSA", ec, msg, null);
        System.out.println("ECDSA " + s2.length + " " + verify("SHA256withECDSA", ec, msg, s2, null));

        KeyPairGenerator rsaGen = KeyPairGenerator.getInstance("RSA");
        rsaGen.initialize(3072);
        KeyPair rsa = rsaGen.generateKeyPair();
        PSSParameterSpec pss = new PSSParameterSpec("SHA-256", "MGF1", MGF1ParameterSpec.SHA256, 32, 1);
        byte[] s3 = sign("RSASSA-PSS", rsa, msg, pss);
        System.out.println("RSA-PSS " + s3.length + " " + verify("RSASSA-PSS", rsa, msg, s3, pss));

        msg[5] ^= 1;                                                       // change one bit
        System.out.println("tampered: " + verify("Ed25519", ed, msg, s1, null));   // false
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Weak or repeated ECDSA nonces.</strong> Use a library with RFC 6979 or hedged nonces, or prefer Ed25519.</li>
<li><strong>Disabling certificate validation</strong> ("trust all" TrustManagers, <code>curl -k</code>) in code that reaches production.</li>
<li><strong>Checking the chain but not the name,</strong> or matching names with substring logic.</li>
<li><strong>Letting a JWT choose its algorithm:</strong> accepting <code>alg: none</code>, or verifying an RS256 token with HMAC using the public key as the secret. Fix the expected algorithm per key.</li>
<li><strong>Manual certificate renewal,</strong> which causes outages as lifetimes shrink.</li>
<li><strong>Signing something ambiguous:</strong> sign a canonical, typed structure that includes its context, not loosely concatenated fields.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>MAC or signature?</summary><p>For each, choose: (a) a server authenticating its own session cookies; (b) a bank publishing daily statements customers can verify offline; (c) firmware updates for card terminals. (a) MAC, (b) signature, (c) signature.</p></details>
<details><summary>Read a certificate</summary><p>Run the openssl command above against a site you use. Find the SAN entries, the issuer, the validity period and the signature algorithm.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Textbook RSA forgery</summary><p>Given valid textbook RSA signatures σ₁ on m₁ and σ₂ on m₂, produce a valid signature on m₁m₂ mod n. σ₁σ₂ mod n. Explain why hashing prevents this.</p></details>
<details><summary>Search CT logs</summary><p>Use crt.sh to list certificates issued for a domain you own or know. How many CAs issued them? Are there any you did not expect?</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Recover a key from nonce reuse</summary><p>Using a small curve or a library that exposes ECDSA internals, sign two messages with the same k, then recover d with the formulas in Figure 12.1 and check it against the real key.</p></details>
<details><summary>Build a private CA</summary><p>With keytool or openssl, create a root, an intermediate with pathlen 0 and a leaf for a local service. Configure a Java HttpClient to trust only your root, and confirm that validation fails when the leaf's SAN does not match.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain how signatures differ from MACs and why signatures are hash-and-sign.</li>
<li>I can explain RSA-PSS and why textbook RSA signatures are forgeable.</li>
<li>I can write down ECDSA and show how a repeated or biased nonce reveals the private key.</li>
<li>I can explain why Ed25519 is safer by design.</li>
<li>I can read an X.509 certificate and validate a chain step by step.</li>
<li>I can explain Certificate Transparency, revocation options and the move to short-lived certificates.</li>
</ul>
`});
