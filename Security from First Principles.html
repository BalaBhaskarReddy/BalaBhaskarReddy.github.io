CH.push({
  id: 'ch22', n: 22, title: 'Firewalls, Segmentation and Zero Trust',
  lede: 'Firewalls decide which traffic may flow between parts of a network. This chapter starts with how packet filters and stateful firewalls actually make decisions, moves up to proxies and web application firewalls, and then to architecture: why a hard perimeter around a soft interior failed, how segmentation limits the damage of a breach, and what zero-trust architecture really means. Examples use nftables, AWS security groups in Terraform and Kubernetes network policies.',
  html: `
<h2>What a firewall does</h2>
<p>A firewall enforces a policy about which communications are allowed between network zones. It is the network expression of two principles from Chapter 1: <strong>fail-safe defaults</strong> (deny everything not explicitly allowed) and <strong>least privilege</strong> (allow only the flows each system needs). A good policy is short, written in terms of services and roles, and reviewed. A bad one is thousands of rules accumulated over a decade, many allowing "any".</p>
<p>Policy applies in both directions. <strong>Ingress</strong> filtering limits who can reach your systems. <strong>Egress</strong> filtering limits where your systems can connect, which stops malware calling home and data being sent out, and is neglected far more often.</p>

<h2>Packet filters</h2>
<p>The simplest firewall inspects each packet's header, mainly the five-tuple (source and destination address, protocol, source and destination port), and compares it against an ordered list of rules. The first matching rule decides.</p>
${fig('rules', '<b>Figure 22.1</b> First-match rule evaluation in a packet filter. Step through five packets and see which rule decides each one.')}
<p>Stateless filters are fast and still used in routers, cloud network ACLs and as a first line against floods. Their weakness is that they see packets, not conversations. To let replies back in, they must allow inbound packets to the whole range of ephemeral client ports, or trust the TCP ACK flag, which attackers can set. Fragmented packets, where only the first fragment carries port numbers, caused classic bypasses.</p>

<h2>Stateful inspection</h2>
<p>A stateful firewall tracks each connection in a table and allows packets that belong to a connection it has seen start under an allowed rule. For UDP and ICMP, which have no connections, it creates pseudo-connections with timeouts.</p>
${fig('stateful', '<b>Figure 22.2</b> Stateful inspection. Replies to allowed outbound connections pass; packets that match no tracked connection are dropped.')}
<p>Stateful firewalls made "allow outbound, deny inbound" easy and correct, and home routers with network address translation (NAT) give the same effect as a side effect: an inbound packet has no mapping to an inside host unless one was created by outbound traffic. NAT is not a security control by design, but it explains why so many devices that should never face the Internet were protected by accident, and why IPv6 networks without NAT need explicit stateful filtering.</p>

<h2>Proxies and application-layer firewalls</h2>
<p>Packet filters see addresses and ports; attacks live in content. <strong>Application-layer gateways</strong> and <strong>proxies</strong> terminate connections and inspect the protocol itself: HTTP methods and paths, SQL statements, SMTP commands. Two forms are common:</p>
<ul>
<li><strong>Forward proxies</strong> for outbound traffic, which enforce egress policy by destination name, scan downloads and log access.</li>
<li><strong>Web application firewalls</strong> (WAFs) in front of web applications, matching requests against attack signatures such as the OWASP Core Rule Set and rate limits. A WAF can provide a <em>virtual patch</em>, blocking a known exploit pattern within hours while the code fix is prepared, as many did for Log4Shell in 2021.</li>
</ul>
<p>WAFs are useful but bypassable: attackers encode payloads in ways the WAF does not normalise the way the application does. They are a layer, never a substitute for fixing injection bugs (Chapters 26 and 27). "Next-generation" firewalls combine stateful filtering with application identification, user identity, intrusion prevention and optional TLS inspection.</p>

<h2>Host and cloud firewalls</h2>
<p>Every host should filter its own traffic too, so that a misconfigured network firewall is not the only barrier. On Linux, nftables (successor to iptables) does this. In the cloud, filtering is part of the platform:</p>
<div class="tbl"><table><tr><th>AWS control</th><th>Applies to</th><th>State</th><th>Rules</th></tr>
<tr><td>Security group</td><td>Each network interface (instance, container, database)</td><td>Stateful</td><td>Allow only; can reference other security groups instead of addresses</td></tr>
<tr><td>Network ACL</td><td>A subnet</td><td>Stateless</td><td>Ordered allow and deny rules; return traffic must be allowed explicitly</td></tr>
</table></div>
<p>Referencing security groups ("the database accepts 5432 from members of the app-tier group") keeps policy correct as instances scale and change addresses, and expresses intent instead of IP ranges. Kubernetes network policies do the same for pods by label, and service meshes add authorisation by workload identity.</p>

<h2>Architecture: from perimeter to segments</h2>
<p>The traditional design put a strong firewall at the Internet edge and trusted everything inside. A <strong>DMZ</strong> (demilitarised zone) between two firewalls held Internet-facing servers, so a compromised web server could not reach the internal network directly.</p>
${fig('zones', '<b>Figure 22.3</b> A segmented network. Internet-facing systems sit in a DMZ, applications and data in separate zones, and administration goes through a bastion host.')}
<p>The perimeter model fails because attackers get inside: through phishing, a vulnerable VPN appliance, a supplier's credentials or a single exposed server. Inside a flat network, they move laterally to anything they can reach:</p>
<ul>
<li>In 2013 attackers entered Target's network with credentials stolen from a heating and ventilation contractor, moved from the vendor-access zone to point-of-sale systems, and stole 40 million card numbers.</li>
<li>In 2017 NotPetya spread from one infected accounting software update across entire corporate networks worldwide in minutes, using stolen credentials and an SMB exploit; shipping firm Maersk had to reinstall tens of thousands of machines.</li>
</ul>
<p><strong>Segmentation</strong> divides the network into zones by function and sensitivity and allows only required flows between them. PCI DSS makes this concrete: the <em>cardholder data environment</em> must be isolated so that systems outside it cannot reach it, which also reduces audit scope. <strong>Microsegmentation</strong> takes it further, with policy per workload rather than per subnet, enforced by host firewalls, security groups or a service mesh.</p>
<p><strong>Egress control</strong> belongs in every zone. Servers rarely need arbitrary Internet access. Restricting outbound traffic to known destinations, through a proxy with logging, would have stopped the Log4Shell exploit chain, which depended on the vulnerable server making an outbound LDAP connection to the attacker, and makes data exfiltration far harder.</p>

<h2>Zero trust</h2>
<p>Zero trust takes "assume breach" to its conclusion: <strong>network location confers no trust</strong>. Every request to every resource is authenticated, authorised and encrypted, wherever it comes from. Google's BeyondCorp project, started after a 2009 intrusion, moved employees off the corporate VPN to an access proxy that evaluates user and device on every request; NIST SP 800-207 (2020) standardised the vocabulary.</p>
${fig('zt', '<b>Figure 22.4</b> A zero-trust access decision. A policy engine evaluates identity, device and context for each request, and an enforcement point applies the decision.')}
<p>The core components and principles:</p>
<ul>
<li>A <strong>policy decision point</strong> (PDP) evaluates each request using identity, device posture, the resource's sensitivity and behavioural signals.</li>
<li>A <strong>policy enforcement point</strong> (PEP), such as an identity-aware proxy, gateway, service mesh sidecar or host agent, applies the decision.</li>
<li><strong>Strong identity for users and workloads:</strong> phishing-resistant MFA for people (Chapter 13); mTLS certificates for services (SPIFFE).</li>
<li><strong>Least privilege, per request,</strong> with short sessions and re-evaluation.</li>
<li><strong>Everything encrypted,</strong> including internal traffic.</li>
<li><strong>Visibility:</strong> every decision logged for monitoring (Chapter 24).</li>
</ul>
<p>Zero trust is an architecture, not a product, and it complements segmentation rather than replacing it. Most organisations move gradually: put sensitive internal applications behind an identity-aware proxy (zero-trust network access, often replacing VPNs), require device health for access, add service-to-service mTLS, and shrink network-level trust zone by zone.</p>

${code('FirstMatchFilter.java')`import java.net.InetAddress;
import java.util.List;

public final class FirstMatchFilter {
    record Cidr(byte[] net, int bits) {
        static Cidr of(String s) throws Exception {
            String[] p = s.split("/");
            return new Cidr(InetAddress.getByName(p[0]).getAddress(), p.length > 1 ? Integer.parseInt(p[1]) : 32);
        }
        boolean contains(byte[] a) {
            if (a.length != net.length) return false;
            for (int i = 0; i < bits; i++) {
                int m = 0x80 >>> (i % 8);
                if ((a[i / 8] & m) != (net[i / 8] & m)) return false;
            }
            return true;
        }
    }
    record Rule(Cidr src, Cidr dst, int port, boolean allow) {}

    static boolean decide(List<Rule> rules, String src, String dst, int port) throws Exception {
        byte[] s = InetAddress.getByName(src).getAddress(), d = InetAddress.getByName(dst).getAddress();
        for (Rule r : rules)
            if (r.src().contains(s) && r.dst().contains(d) && (r.port() == 0 || r.port() == port)) return r.allow();
        return false;                                                  // implicit default deny
    }

    public static void main(String[] args) throws Exception {
        List<Rule> rules = List.of(
            new Rule(Cidr.of("0.0.0.0/0"), Cidr.of("10.0.1.0/24"), 443, true),
            new Rule(Cidr.of("10.9.0.0/24"), Cidr.of("0.0.0.0/0"), 22, true),
            new Rule(Cidr.of("10.0.1.0/24"), Cidr.of("10.0.2.0/24"), 5432, true));
        System.out.println(decide(rules, "203.0.113.9", "10.0.1.10", 443));   // true
        System.out.println(decide(rules, "203.0.113.9", "10.0.2.5", 5432));   // false
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>"Any" rules</strong> added for a quick fix and never removed. Every rule should have an owner and an expiry review.</li>
<li><strong>No egress filtering,</strong> so a compromised server can reach anywhere.</li>
<li><strong>Management interfaces exposed to the Internet:</strong> SSH, RDP, database ports, admin consoles, VPN appliance web panels.</li>
<li><strong>Flat internal networks</strong> where a laptop can reach production databases.</li>
<li><strong>Buying a "zero trust" product</strong> while keeping network-location trust everywhere else.</li>
<li><strong>Treating a WAF as the fix</strong> for vulnerable code.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Order matters</summary><p>Rules: (1) deny 10.0.0.0/8 to any; (2) allow 10.9.0.4 to any port 22. Is SSH from 10.9.0.4 allowed? No: rule 1 matches first. Fix by moving the specific rule above the general one.</p></details>
<details><summary>Stateless return traffic</summary><p>With a stateless ACL allowing outbound TCP 443, what inbound rule is needed for replies, and why is it broad? Allow inbound TCP from port 443 to ports 1024–65535, because client ports are ephemeral.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Review a rule set</summary><p>Export the security groups of a test AWS account and find rules allowing 0.0.0.0/0 to anything other than 443, rules referencing deleted groups, and instances with no egress restriction.</p></details>
<details><summary>Segment a payments platform</summary><p>Draw zones for a platform with a public API, an admin console, card tokenisation, a ledger database, a data warehouse and CI/CD. List every allowed flow with port and direction; everything else is denied.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Identity-aware proxy</summary><p>Put an internal Java web app behind an identity-aware proxy (for example oauth2-proxy with an OIDC provider), require a managed-device claim in the token, and remove the app's direct network exposure. Verify with a request from an unmanaged device.</p></details>
<details><summary>Egress in practice</summary><p>Configure a forward proxy with an allow list of domains for a server, block direct outbound traffic, and show that a simulated Log4Shell-style callback to an arbitrary host fails while legitimate API calls succeed.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain first-match rule evaluation and default deny.</li>
<li>I can explain how stateful firewalls track connections and why that beats stateless filtering for return traffic.</li>
<li>I can describe proxies and WAFs and their limits.</li>
<li>I can compare security groups and network ACLs and write least-privilege rules in Terraform.</li>
<li>I can explain why the perimeter model fails and how segmentation and egress filtering limit lateral movement.</li>
<li>I can explain zero-trust architecture, its components and how organisations adopt it.</li>
</ul>
`});

CH.push({
  id: 'ch23', n: 23, title: 'VPNs: IPsec and WireGuard',
  lede: 'A virtual private network carries traffic between sites or devices through an encrypted tunnel across an untrusted network. This chapter explains what a VPN does and does not provide, takes IPsec apart (security associations, ESP, tunnel and transport modes, anti-replay windows and IKEv2), looks at why VPN appliances have become a favourite target, and then studies WireGuard as an example of how much simpler a modern design can be. It ends with how VPNs fit, and do not fit, a zero-trust architecture.',
  html: `
<h2>What a VPN is for</h2>
<p>A VPN builds an authenticated, encrypted tunnel at the network layer so that systems separated by the Internet behave as if they shared a private network. Common uses:</p>
<ul>
<li><strong>Site-to-site:</strong> connecting branch offices, data centres and cloud networks. Cloud providers' managed VPN gateways speak IPsec.</li>
<li><strong>Remote access:</strong> laptops and phones reaching internal networks.</li>
<li><strong>Partner links:</strong> payment processors, banks and clearing houses often require IPsec tunnels for file transfers and APIs, sometimes in addition to TLS.</li>
<li><strong>Privacy services:</strong> consumer VPNs that move the point where traffic enters the Internet.</li>
</ul>
<p>A VPN protects traffic between the tunnel endpoints. It does not protect data beyond them, does not make an endpoint trustworthy, and gives whoever is connected network-level access to everything the tunnel's routes allow. That last property is the main reason remote-access VPNs are being replaced by zero-trust access for applications (Chapter 22).</p>

<h2>IPsec architecture</h2>
<p>IPsec, standardised in the 1990s and revised many times, secures IP packets. Its central concept is the <strong>security association</strong> (SA): a one-way agreement between two peers on algorithms, keys and lifetime, identified by a 32-bit Security Parameter Index (SPI) carried in each packet. A bidirectional tunnel needs a pair of SAs. Two databases drive processing:</p>
<ul>
<li>The <strong>security policy database</strong> (SPD) says which traffic must be protected, bypassed or discarded, by addresses, ports and protocol (traffic selectors).</li>
<li>The <strong>security association database</strong> (SAD) holds the active SAs with their keys and counters.</li>
</ul>
<h3>AH and ESP</h3>
<p>The <strong>Authentication Header</strong> (AH) protects integrity, including much of the outer IP header, but does not encrypt. Because it covers addresses, it breaks through NAT and is rarely used. The <strong>Encapsulating Security Payload</strong> (ESP) provides encryption and integrity of the payload and is what nearly everyone uses, today with AEADs such as AES-GCM (RFC 4106) or ChaCha20-Poly1305. Older configurations combine AES-CBC with HMAC in encrypt-then-MAC order, the safe composition from Chapter 8.</p>
${fig('espmodes', '<b>Figure 23.1</b> ESP in transport and tunnel mode. Tunnel mode encrypts the entire original packet, including its addresses.')}
<h3>Anti-replay</h3>
<p>Every ESP packet carries a sequence number that increases for each packet sent on the SA, with 64-bit extended sequence numbers for fast links. Packets can arrive out of order, so receivers accept any number within a sliding window behind the highest seen, exactly once.</p>
${fig('replaywin', '<b>Figure 23.2</b> A sliding anti-replay window. Reordered packets inside the window are accepted once; duplicates and very old packets are rejected.')}
<p>Because the counter is also part of the AEAD nonce, an SA must be rekeyed before the counter wraps. A sender must never restart the counter under the same key, for example after a reboot without renegotiating.</p>
<h3>NAT traversal</h3>
<p>ESP is IP protocol 50, without ports, so NAT devices that multiplex on ports cannot handle it. IPsec detects NAT during IKE and then wraps ESP in UDP on port 4500. This is why IPsec firewalls typically open UDP 500 (IKE) and 4500.</p>

<h2>IKEv2</h2>
<p>SAs need keys, negotiated by the Internet Key Exchange protocol. IKEv1 (1998) was notoriously complex, with many modes; its "aggressive mode" with pre-shared keys exposed a hash that allowed offline cracking of the PSK. IKEv2 (2005, RFC 7296) is simpler and is what to use.</p>
${fig('ike', '<b>Figure 23.3</b> The IKEv2 exchanges: an unauthenticated Diffie-Hellman exchange, then mutual authentication over the transcript inside the protected channel.')}
<p>IKEv2 follows the signed-transcript pattern of Chapter 14. Its authentication options are certificates (preferred for site-to-site), pre-shared keys (must be long and random, one per peer), or EAP for user authentication in remote access. Configure only strong groups and algorithms: in particular, many deployments still allow 1024-bit Diffie-Hellman group 2, which Logjam-style precomputation threatens. Post-quantum protection is arriving through RFC 9370, which allows additional key exchanges such as ML-KEM in the same handshake, and RFC 8784, which mixes a post-quantum pre-shared key into the derivation.</p>

<h2>TLS-based VPNs and the appliance problem</h2>
<p>Many remote-access VPNs run over TLS instead (OpenVPN, and vendor "SSL VPN" products), because TLS on port 443 passes through almost any network. The protocol choice is fine; the products are the problem. A VPN appliance is an Internet-facing device, running a large amount of proprietary code including a web portal, that grants access to the internal network. That makes it the single most valuable target an organisation exposes, and attackers treat it so.</p>
<p>Critical pre-authentication vulnerabilities in widely used VPN appliances have been exploited within days of disclosure, repeatedly: arbitrary file reads that leaked session tokens and passwords (2019), path traversal that dumped credentials (2018 to 2020), and in January 2024 an authentication bypass chained with command injection in a leading product, which prompted a US government emergency directive to disconnect affected devices. Ransomware groups and state actors routinely enter through unpatched VPN gateways.</p>
<div class="note pit"><b>Pitfall</b><p>Treat every remote-access gateway as a crown-jewel system: patch within days, require phishing-resistant MFA, restrict the management interface, log everything, and limit what a connected client can reach. Better, reduce the need for network-level access at all.</p></div>

<h2>WireGuard</h2>
<p>WireGuard, designed by Jason Donenfeld and merged into Linux 5.6 in 2020, shows how much complexity is optional. Its kernel implementation is roughly 4,000 lines, against hundreds of thousands for a typical IPsec stack, which made formal verification of its protocol and audits of its code feasible.</p>
<h3>Fixed cryptography</h3>
<p>WireGuard negotiates nothing. Every implementation uses Curve25519 for key exchange, ChaCha20-Poly1305 for transport encryption, BLAKE2s for hashing, HKDF for key derivation and SipHash for internal hash tables. There is nothing to configure wrongly and no downgrade attack possible. If a primitive is ever broken, a new protocol version replaces the set.</p>
<h3>The handshake</h3>
<p>Peers are identified by static Curve25519 public keys, configured in advance like SSH keys. The handshake is built from the Noise protocol framework's IK pattern:</p>
${fig('wghs', '<b>Figure 23.4</b> The WireGuard handshake: one round trip giving mutual authentication, forward secrecy and initiator identity hiding.')}
<p>Several design choices are security features in themselves. <strong>Silence</strong>: a WireGuard endpoint does not respond to any packet that does not carry a valid mac1, so it is invisible to scanners. <strong>Timestamps</strong> in the initiation stop an attacker replaying a captured initiation to force a new session. <strong>Cookies</strong> under load require the initiator to prove its address before the server does expensive Diffie-Hellman work. <strong>Frequent rekeying</strong>, every two minutes, limits the data under any key and gives fine-grained forward secrecy.</p>
<h3>Cryptokey routing</h3>
<p>WireGuard ties routing to identity. Each peer has a list of <code>AllowedIPs</code>. Outgoing packets are encrypted to whichever peer's list contains the destination; incoming packets, after decryption with a peer's key, are accepted only if their source address is in that peer's list. A packet's inner source address is therefore authenticated by the key it arrived under, which lets firewall rules on the tunnel interface trust addresses.</p>
${fig('cryptokey', '<b>Figure 23.5</b> Cryptokey routing. Each peer\'s public key is bound to the addresses it may use.')}
<h3>Limits</h3>
<p>WireGuard is a tunnel, not a full remote-access product. It has no built-in user authentication, MFA or key distribution, and it keeps the last endpoint address of each peer in memory, which some privacy services work around. Products built on it (Tailscale, Netbird, commercial VPNs and cloud services) add identity providers, key distribution and access policy. For post-quantum protection, the optional pre-shared key can be filled from a post-quantum key exchange run alongside; Rosenpass does this with Classic McEliece and ML-KEM.</p>

<div class="tbl"><table><tr><th></th><th>IPsec / IKEv2</th><th>WireGuard</th></tr>
<tr><td>Algorithm choice</td><td>Negotiated; many options</td><td>Fixed set</td></tr>
<tr><td>Authentication</td><td>Certificates, PSK, EAP</td><td>Static public keys (plus optional PSK)</td></tr>
<tr><td>Handshake</td><td>Two exchanges, four messages</td><td>One round trip</td></tr>
<tr><td>Unauthenticated packets</td><td>Answered (IKE)</td><td>Silently ignored</td></tr>
<tr><td>Interoperability</td><td>Universal: routers, firewalls, clouds, partners</td><td>Growing; not yet in many network appliances</td></tr>
<tr><td>Code size</td><td>Large</td><td>About 4,000 lines (Linux)</td></tr>
</table></div>

${code('ReplayWindow.java')`/** Sliding anti-replay window (RFC 4303 style) with a 64-packet bitmap. */
public final class ReplayWindow {
    private static final int SIZE = 64;
    private long highest = 0;     // highest sequence number accepted
    private long bitmap = 0;      // bit i set => (highest - i) seen

    /** Call only AFTER the packet's AEAD tag has verified, or forged packets could move the window. */
    public synchronized boolean accept(long seq) {
        if (seq == 0) return false;
        if (seq > highest) {
            long shift = seq - highest;
            bitmap = shift >= SIZE ? 1L : (bitmap << shift) | 1L;
            highest = seq;
            return true;
        }
        long offset = highest - seq;
        if (offset >= SIZE) return false;              // too old
        long mask = 1L << offset;
        if ((bitmap & mask) != 0) return false;        // replay
        bitmap |= mask;
        return true;
    }

    public static void main(String[] args) {
        ReplayWindow w = new ReplayWindow();
        for (long s : new long[] { 1, 2, 3, 5, 4, 9, 4, 70, 6 })
            System.out.println(s + " -> " + w.accept(s));   // the second 4 and the final 6 are rejected
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Weak IKE configuration:</strong> IKEv1 aggressive mode, short PSKs shared across many peers, DH group 2, SHA-1.</li>
<li><strong>Unpatched VPN appliances</strong> and exposed management portals.</li>
<li><strong>Full-network access for every remote user,</strong> so one stolen VPN credential reaches everything.</li>
<li><strong>Checking replay before authenticity,</strong> which lets forged packets advance the window and cause real packets to be rejected.</li>
<li><strong>Overlapping AllowedIPs</strong> or 0.0.0.0/0 on a peer that should only reach one subnet.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Which mode?</summary><p>Two data centres connect their private networks over the Internet. Transport or tunnel mode? Tunnel mode between the gateways.</p></details>
<details><summary>Ports to open</summary><p>Which ports does an IPsec gateway behind NAT need, and WireGuard? UDP 500 and 4500 (and ESP if not NATed); one UDP port, 51820 by default.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Build a WireGuard tunnel</summary><p>Set up WireGuard between two Linux VMs, ping across it, then change one AllowedIPs entry so the other side's address is not listed and observe the packets being dropped. Capture the handshake with tcpdump and identify the three message types by size (148, 92 and data).</p></details>
<details><summary>Audit an IPsec proposal</summary><p>Given a partner's proposal "IKEv1 main mode, 3DES, SHA1, DH group 2, PSK", write the replacement you would require and explain each change.</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Noise IK by hand</summary><p>Using the Noise specification, implement the IK handshake in Java with the JDK's X25519 and ChaCha20-Poly1305 and HKDF from Chapter 7. Check you derive the same transport keys on both sides, then add WireGuard's timestamp check.</p></details>
<details><summary>Replace a VPN</summary><p>An organisation gives 2,000 staff and 300 contractors full VPN access. Design a migration to per-application zero-trust access, keeping site-to-site IPsec only for partner links. What breaks, and in what order would you move applications?</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain what a VPN protects and what it does not.</li>
<li>I can describe IPsec SAs, the SPD and SAD, AH and ESP, and tunnel versus transport mode.</li>
<li>I can explain anti-replay windows and implement one.</li>
<li>I can walk through IKEv2 and choose a strong configuration.</li>
<li>I can explain why VPN appliances are high-value targets and how to defend them.</li>
<li>I can explain WireGuard's handshake, silence, cookies and cryptokey routing.</li>
</ul>
`});

CH.push({
  id: 'ch24', n: 24, title: 'Intrusion Detection and Monitoring',
  lede: 'Prevention eventually fails, so security depends on noticing quickly. This chapter covers how intrusions are detected on networks and hosts, why signatures and anomaly detection each fall short, the statistics that make most alerts false, how attackers evade sensors, what to log and how to make logs trustworthy, and how detection fits into incident response. Examples include Suricata, Zeek and Sigma rules and a tamper-evident audit log in Java.',
  html: `
<h2>Detection is a security control</h2>
<p>Every chapter so far has been about preventing attacks. But the security mindset assumes some will succeed: a phishing email gets through, a zero-day is exploited, an insider abuses access. The damage then depends on how long the attacker goes unnoticed. Industry incident reports measure this <strong>dwell time</strong> and, though it has fallen sharply over the past decade, typical intrusions still last more than a week before detection, and much longer when the victim learns from a third party.</p>
<p>Detection and response turn a breach from a catastrophe into an incident. They require three things: <strong>visibility</strong> (the right data is collected), <strong>analysis</strong> (something notices the attack in that data) and <strong>response</strong> (people and automation act in time).</p>

<h2>Sensors</h2>
<ul>
<li><strong>Network intrusion detection systems</strong> (NIDS) watch traffic from a span port or tap. Snort (1998) and Suricata match packets and streams against rules; Zeek (formerly Bro, 1995) parses protocols into rich logs of connections, DNS queries, HTTP requests, TLS handshakes and files for later analysis. An <strong>intrusion prevention system</strong> (IPS) sits inline and can drop traffic, at the risk of blocking legitimate traffic or failing closed.</li>
<li><strong>Host-based detection</strong> watches processes, files, logins and system calls on each machine: auditd and OS logs, file integrity monitoring, and <strong>endpoint detection and response</strong> (EDR) agents that record process trees and can isolate a compromised host.</li>
<li><strong>Application and cloud logs</strong>: authentication events from the identity provider, API calls recorded by the cloud provider, database audit logs, and the application's own audit trail of business actions such as payments and permission changes.</li>
</ul>
<p>Network sensors see everything on the wire but less and less inside it, because traffic is encrypted. Host and application sensors see plaintext and intent but must be deployed everywhere. Mature programmes combine them.</p>

<h2>How detection works</h2>
<h3>Signatures</h3>
<p>Signature-based detection matches known patterns: a byte sequence in an exploit, a known malicious domain, a file hash, a specific sequence of process launches. Signatures are precise and explainable, and they catch commodity attacks well. They miss new attacks and trivially modified old ones, and attackers test their tools against common rule sets before using them.</p>
<h3>Anomalies</h3>
<p>Anomaly-based detection learns what normal looks like and flags deviations: a service account logging in interactively, a user downloading a hundred times their usual volume, a server connecting to a country it never talks to, a process tree no other host has. It can catch novel attacks, but "unusual" is not "malicious": maintenance work, new features and quarter-end reporting are unusual too. Machine-learning models are anomaly detectors with better features, and inherit the same problem.</p>
<h3>Specifications and behaviours</h3>
<p>A middle path defines what a system <em>should</em> do and alerts on violations: this payment service never spawns a shell; this database account never reads the whole customers table; admin logins only come through the bastion. Behaviour-based rules written against attacker techniques, such as "a process reading the memory of the credential store", outlast specific tools.</p>

<h2>The base-rate problem</h2>
<p>A detector's quality is described by its true-positive rate (the fraction of attacks it flags) and its false-positive rate (the fraction of benign events it wrongly flags). Because attacks are rare compared with normal activity, even a tiny false-positive rate produces more false alarms than true ones.</p>
${fig('baserate', '<b>Figure 24.1</b> The base-rate fallacy. A detector that is 99% accurate on each event still produces mostly false alarms when attacks are rare.')}
<p>Stefan Axelsson pointed this out for intrusion detection in 1999, and it explains alert fatigue in security operations centres. The practical responses: tune rules to remove known benign causes, correlate several weak signals before alerting, add context (asset value, user role, device), and route low-confidence signals to dashboards for hunting rather than to pagers.</p>

<h2>Evasion</h2>
<p>A network sensor must reconstruct what each host will see. Wherever its interpretation differs from the host's, an attacker can slip through. Classic techniques:</p>
${fig('ttlevade', '<b>Figure 24.2</b> An insertion attack. A segment that reaches the IDS but not the host makes their reconstructions of the stream differ.')}
<ul>
<li><strong>Fragmentation and overlapping segments</strong> that different operating systems reassemble differently.</li>
<li><strong>Encoding tricks:</strong> URL encoding, Unicode normalisation, case changes and comments that the application decodes but the sensor does not.</li>
<li><strong>Encryption:</strong> a NIDS cannot match patterns inside TLS.</li>
<li><strong>Living off the land:</strong> using the administration tools already present (PowerShell, remote management, cloud CLIs) so that activity looks like normal administration.</li>
</ul>
<p>Defences include traffic normalisation, target-based reassembly that models each host's operating system, decoding before matching, and moving detection to where the data is in plaintext: the endpoint and the application.</p>

<h2>Detecting in encrypted traffic</h2>
<p>Most traffic is TLS. Sensors fall back on metadata, which still says a lot:</p>
<ul>
<li><strong>Flows</strong> (NetFlow, IPFIX): who talked to whom, when, how much. Exfiltration and lateral movement show up as unusual flows.</li>
<li><strong>DNS logs:</strong> newly registered domains, algorithmically generated names, data encoded in long subdomains (DNS tunnelling).</li>
<li><strong>TLS handshake features:</strong> server name, certificate details, and fingerprints of the ClientHello (JA3 from 2017, JA4 from 2023) that identify client software, so a "browser" whose handshake matches a known malware family stands out.</li>
<li><strong>Beaconing:</strong> malware checks in with its controller at regular intervals, with some random jitter, producing periodic connections unlike human browsing.</li>
</ul>
<p>TLS inspection (Chapter 14) restores content visibility at the cost of a powerful man-in-the-middle device and broken certificate guarantees; many organisations limit it to specific categories and exclude banking, health and privacy-sensitive traffic.</p>

<h2>Logging that holds up</h2>
<p>Detection, investigation and compliance all depend on logs. What to collect:</p>
<ul>
<li><strong>Authentication:</strong> successes, failures, MFA events, session creation and revocation.</li>
<li><strong>Authorisation decisions</strong> and privilege changes: role grants, new API keys, policy edits.</li>
<li><strong>Administrative actions</strong> on infrastructure, cloud accounts and key management (every KMS call, Chapter 18).</li>
<li><strong>Business events</strong> that move money or data: payments, refunds, payee changes, exports.</li>
<li><strong>Network egress</strong> and DNS.</li>
</ul>
<p>Make logs useful: synchronise clocks (NTP), use structured formats with consistent field names, include request and correlation IDs, and centralise them quickly so an attacker on a host cannot delete the evidence. Never log secrets, full card numbers, passwords or tokens. Regulations set retention: PCI DSS requires a year of audit logs, with three months immediately available.</p>
<h3>Tamper evidence</h3>
<p>An attacker with administrative access will try to edit logs. Ship them off the host immediately, store them in write-once storage (object lock, a separate account), and make them tamper-evident with cryptography from Chapter 7.</p>
${fig('hashchain', '<b>Figure 24.3</b> A hash-chained audit log with a signed checkpoint. Editing any past entry changes every later hash and breaks the checkpoint.')}

<h2>From alerts to response</h2>
<p>A <strong>SIEM</strong> (security information and event management) collects logs, normalises them, runs detection rules and correlations, and supports investigation. Detection engineering treats rules as code: written in a portable format such as Sigma, version-controlled, mapped to attacker techniques in the MITRE ATT&CK knowledge base, tested by simulating the technique, and measured for false positives. Automation (SOAR) runs routine response steps: enrich an alert, disable a token, isolate a host, open a ticket.</p>
${fig('killchain', '<b>Figure 24.4</b> Stages of an intrusion and where each can be detected. Detecting early stages limits damage; detecting several stages makes evasion harder.')}
<p><strong>Deception</strong> gives high-confidence signals cheaply: honeypot hosts no one should touch, fake credentials planted in memory or configuration ("honeytokens"), canary API keys that alert when used, and decoy database rows that should never be queried. Any interaction is suspicious by definition, so false positives are rare.</p>
<p>Incident response itself follows a cycle (NIST SP 800-61): prepare (playbooks, contacts, tools, practice), detect and analyse, contain, eradicate and recover, and learn. The hardest and most valuable part is preparation, done before the incident.</p>

<h2>In code: rules</h2>

<p>Note that the Log4Shell rule shows the limits of signatures: attackers immediately switched to nested encodings such as <code>\${\${lower:j}ndi:</code>, and each needed a new rule. Patching and egress filtering were the real fixes.</p>

<h2>In code: a tamper-evident audit log</h2>
${code('AuditChain.java')`import java.nio.charset.StandardCharsets;
import java.security.MessageDigest;
import java.time.Instant;
import java.util.ArrayList;
import java.util.HexFormat;
import java.util.List;

public final class AuditChain {
    record Entry(long seq, Instant at, String actor, String action, String prevHash, String hash) {}
    private final List<Entry> entries = new ArrayList<>();
    private String head = HexFormat.of().formatHex(new byte[32]);      // genesis

    static String h(String prev, long seq, Instant at, String actor, String action) throws Exception {
        MessageDigest md = MessageDigest.getInstance("SHA-256");
        // Unambiguous encoding: length-prefix every field.
        for (String f : new String[] { prev, Long.toString(seq), at.toString(), actor, action }) {
            byte[] b = f.getBytes(StandardCharsets.UTF_8);
            md.update((byte) (b.length >>> 8)); md.update((byte) b.length); md.update(b);
        }
        return HexFormat.of().formatHex(md.digest());
    }

    public synchronized Entry append(String actor, String action) throws Exception {
        long seq = entries.size() + 1; Instant at = Instant.now();
        Entry e = new Entry(seq, at, actor, action, head, h(head, seq, at, actor, action));
        entries.add(e); head = e.hash();
        return e;                       // ship to write-once storage; sign 'head' every N minutes with a KMS key
    }

    /** Recompute from the start; compare the final hash with the latest signed checkpoint. */
    public boolean verify(String signedCheckpoint) throws Exception {
        String prev = HexFormat.of().formatHex(new byte[32]);
        for (Entry e : entries) {
            if (!e.prevHash().equals(prev) || !e.hash().equals(h(prev, e.seq(), e.at(), e.actor(), e.action()))) return false;
            prev = e.hash();
        }
        return prev.equals(signedCheckpoint);
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Collecting everything, watching nothing:</strong> terabytes of logs with no tested detections.</li>
<li><strong>Logs only on the host,</strong> where the attacker deletes them.</li>
<li><strong>Alert floods</strong> that train analysts to ignore alerts.</li>
<li><strong>No logging of cloud control-plane and KMS activity,</strong> where many breaches now happen.</li>
<li><strong>Secrets and personal data in logs,</strong> turning the log store into a breach target.</li>
<li><strong>No practised response:</strong> playbooks never exercised and contacts out of date.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Precision</summary><p>10 attacks among 1,000,000 events, a detector with 100% detection and 0.1% false positives. Precision? 10 / (10 + 1,000) ≈ 1%.</p></details>
<details><summary>What to log</summary><p>List five events a payments API must log for investigation, and two fields it must never log. For example login, MFA failure, payee added, refund approved, API key created; never passwords or full card numbers.</p></details></div>

<details><summary>Run Zeek</summary><p>Run Zeek on a packet capture of your own browsing and read conn.log, dns.log and ssl.log. Find the longest connection, the most queried domain and the TLS server names. What could an observer learn without decrypting anything?</p></details>
<details><summary>Detect beaconing</summary><p>Given connection timestamps from a host to one destination, write Java that computes the inter-arrival times and flags destinations whose intervals have a low coefficient of variation (standard deviation divided by mean) over many connections.</p></details></div>

<details><summary>Detection as code</summary><p>Write three Sigma rules for credential abuse in your cloud audit logs (for example, access keys used from two countries within an hour), a test that injects matching synthetic events, and measure false positives against a week of real logs.</p></details>
<details><summary>Signed checkpoints</summary><p>Extend AuditChain so that every 1,000 entries the head hash is signed with an Ed25519 key held in a KMS or separate service, and checkpoints are published to separate storage. Write a verifier that detects deletion of the last 50 entries.</p></details></div>
</div>

CH.push({
  id: 'ch25', n: 25, title: 'Anonymity and Tor',
  lede: 'Encryption hides what you say, not who you are talking to. Metadata, who communicates with whom, when and how much, is often as revealing as content. This chapter defines what anonymity means, explains mix networks and onion routing, takes the Tor network apart from circuit construction to onion services, and examines the attacks that work against it in practice: traffic correlation, fingerprinting, malicious relays and user mistakes. It ends with lighter-weight privacy tools now built into mainstream products.',
  html: `
<h2>Why metadata matters</h2>
<p>TLS protects the contents of your connection to a bank, a clinic or a news site. Anyone on the network path still sees that you connected, when, for how long and how much data moved. Over weeks, such records reveal relationships, routines, health concerns, political interests and business negotiations. Investigators and intelligence agencies rely on metadata because it is structured, cheap to store and hard for targets to hide.</p>
<p>Anonymity is needed by people with every kind of motive: journalists protecting sources, whistle-blowers, dissidents, abuse survivors, companies researching competitors or investigating fraud without tipping off the subject, security teams investigating malicious sites, and ordinary people who prefer not to be tracked.</p>
<h3>Definitions</h3>
<ul>
<li><strong>Sender anonymity:</strong> the recipient (or an observer) cannot tell who sent a message.</li>
<li><strong>Receiver anonymity:</strong> an observer cannot tell who received it.</li>
<li><strong>Unlinkability:</strong> an observer cannot tell that two messages or sessions involve the same person.</li>
<li><strong>Anonymity set:</strong> the set of people who could plausibly be the sender. Anonymity is only as good as the crowd you can hide in; a perfect system with five users gives little protection.</li>
</ul>

<h2>Single proxies and VPNs</h2>
<p>The simplest approach relays traffic through a proxy or commercial VPN. The website sees the provider's address instead of yours. But the provider sees both ends: who you are and where you go. You have moved trust, not removed it. Several "no logs" providers have later handed logs to authorities, and an observer who can watch traffic into and out of the provider can match flows by timing.</p>

<h2>Mix networks</h2>
<p>David Chaum's 1981 paper introduced the <strong>mix</strong>: a relay that collects messages from many senders, removes a layer of encryption from each, and outputs them in a random order, after a delay or once a batch is full. An observer of the mix sees messages go in and come out but cannot match inputs to outputs. Chaining several mixes run by different operators means every one of them must collude to link sender and receiver. Mixes add padding so all messages look the same size, and sometimes dummy traffic.</p>
<p>Mix networks give strong anonymity even against an observer who sees the whole network, but the delays (seconds to hours) make them unsuitable for web browsing. Modern mixnets (such as Loopix and Nym) use continuous random delays and cover traffic to reduce latency while keeping much of the protection.</p>

<h2>Onion routing</h2>
<p>Onion routing, developed at the US Naval Research Laboratory in the 1990s, trades some protection for interactivity. Like a mix cascade, it uses layered encryption through several relays, but it forwards traffic immediately, without batching or reordering. <strong>Tor</strong> ("The Onion Router"), designed by Roger Dingledine, Nick Mathewson and Paul Syverson and released in 2002, is the widely used implementation: a network of several thousand volunteer-run relays used by millions of people a day.</p>
${fig('onion', '<b>Figure 25.1</b> Onion encryption through a three-hop Tor circuit. Each relay removes one layer and learns only its neighbours.')}
<div class="tbl"><table><tr><th>Party</th><th>Knows your IP address?</th><th>Knows the destination?</th><th>Sees content?</th></tr>
<tr><td>Guard (entry)</td><td>Yes</td><td>No</td><td>No</td></tr>
<tr><td>Middle</td><td>No</td><td>No</td><td>No</td></tr>
<tr><td>Exit</td><td>No</td><td>Yes</td><td>Only if the connection is not encrypted end to end</td></tr>
<tr><td>Website</td><td>No (sees the exit)</td><td>—</td><td>Yes</td></tr>
</table></div>
<p>No single relay can link you to your destination. That requires seeing both ends of the circuit, which is the attack that matters most (below).</p>

<h2>How Tor works</h2>
<h3>The directory</h3>
<p>Clients need a list of relays they can trust is the same list everyone else sees, or an attacker could feed one user a list of only its own relays. A small set of independent <strong>directory authorities</strong>, run by trusted people in different countries, vote every hour on a signed <strong>consensus</strong>: every relay's address, keys, bandwidth and flags (Guard, Exit, Stable, Fast). Clients accept a consensus only if a majority of authorities signed it.</p>
<h3>Building circuits</h3>
<p>The client picks three relays, weighted by bandwidth and with constraints such as not two in the same family or the same /16 network, and builds the circuit one hop at a time.</p>
${fig('telescope', '<b>Figure 25.2</b> Telescoping circuit construction. The client negotiates a key with each relay through the relays already in the circuit.')}
<p>The per-hop handshake, <strong>ntor</strong>, is a one-round-trip authenticated Diffie-Hellman exchange over Curve25519 in which the relay proves it holds the onion key listed in the consensus, and keys gain forward secrecy. Data travels in fixed-size cells (514 bytes on current links), so cell sizes reveal nothing, and many TCP streams can share one circuit. Each relay's link to the next is itself TLS.</p>
<h3>Guards</h3>
<p>If a client picked a new random first hop for every circuit, then over months it would eventually pick a malicious one in a position to correlate. Tor clients instead choose a small set of <strong>entry guards</strong> and keep them for months. If your guard is honest you are protected against this attack for that period; if it is not, you were unlucky once rather than inevitably compromised over time.</p>
<h3>Exits</h3>
<p>Exit relays carry the legal and abuse burden of traffic leaving the network, and each publishes an <strong>exit policy</strong> of ports and destinations it will serve. Because an exit sees destinations and any unencrypted content, use HTTPS end to end. In 2020 an operator ran a large fraction of exit capacity for months, stripping HTTPS from connections to cryptocurrency sites to replace wallet addresses, before being removed. Tor Browser now enforces HTTPS by default.</p>

<h2>Onion services</h2>
<p>Tor also provides <strong>receiver</strong> anonymity. An onion service, such as a news organisation's secure drop box, is reached at an address like <code>….onion</code> that is derived from the service's public key (56 characters for version 3, an Ed25519 key with a checksum), so the address itself authenticates the service without any certificate authority.</p>
${fig('onionsvc', '<b>Figure 25.3</b> Connecting to an onion service. Client and service meet at a rendezvous relay, each through its own circuit, so neither learns where the other is.')}
<p>The connection uses six relays in total and never leaves the Tor network, so there is no exit to observe it. Onion services have also been the target of denial-of-service floods of introduction requests; since 2023 services can require a small proof-of-work from clients under load, an application of the cost-asymmetry ideas of Chapter 21.</p>

<h2>Attacks on Tor</h2>
<h3>End-to-end traffic correlation</h3>
<p>Low-latency anonymity has a fundamental limit: an adversary who can watch traffic entering the network at your guard and leaving at the exit (or arriving at the destination) can match the two by timing and volume, without breaking any encryption.</p>
${fig('correlate', '<b>Figure 25.4</b> Traffic correlation. The pattern of bursts entering the network reappears, slightly delayed, where it leaves.')}
<p>Tor's design explicitly does not defend against a global passive adversary. The realistic question is who can see both ends: an Internet exchange, an autonomous system that carries both paths, a national ISP for domestic traffic, or an attacker who runs both a guard and an exit. Research has shown that routing choices put a meaningful fraction of circuits within reach of a single large AS, and that BGP manipulation (Chapter 20) can increase it. Guard persistence, path selection that avoids shared networks, and padding reduce but do not remove the risk.</p>
<h3>Website fingerprinting</h3>
<p>Even a local observer who sees only the encrypted link to your guard, such as your ISP, sees the sizes and timing of cells. Each website produces a characteristic pattern, and machine-learning classifiers trained on these patterns identify visited sites with high accuracy in laboratory settings. Padding defences raise the cost, and real-world accuracy is lower because of the enormous number of possible pages, but the threat is real.</p>
<h3>Malicious relays and Sybil attacks</h3>
<p>Anyone can run relays. An attacker who adds many relays (a Sybil attack) increases the chance of controlling both ends of circuits. In 2014 a group ran over a hundred relays that marked traffic at onion service directories and detected the marks at guards, deanonymising some users for months. Tor's response includes relay family declarations, bandwidth measurement, monitoring for suspicious groups of relays and removing them.</p>
<h3>Application and user mistakes</h3>
<p>Most real deanonymisations do not break Tor at all. Browsers leak through plugins, JavaScript exploits that make a direct connection (used by law enforcement in 2013 against users of a hosting service), DNS queries made outside Tor, documents that fetch remote resources when opened, and fingerprintable browser characteristics. And people make operational mistakes: reusing a username, logging into a personal account in the same session, or posting a technical question under a real email address. Tor Browser exists to remove the technical leaks; the human ones remain.</p>

<h2>Privacy relays in mainstream products</h2>
<p>The two-or-more-party idea is spreading in lighter forms that do not aim to resist strong adversaries but break the link between identity and activity for everyday traffic:</p>
<ul>
<li><strong>iCloud Private Relay</strong> sends Safari traffic through two hops operated by different companies: the first sees the user's address but not the destination, the second the destination but not the user.</li>
<li><strong>Oblivious HTTP</strong> (RFC 9458) and <strong>Oblivious DoH</strong> (RFC 9230) send requests encrypted with HPKE (Chapter 11) to a target server through an independent relay, separating who asked from what was asked. Used for privacy-preserving telemetry and safe-browsing lookups.</li>
<li><strong>MASQUE</strong> proxies tunnel traffic over HTTP/3 and QUIC, the basis of several of these services.</li>
</ul>
<p>Financial services face anonymity from the other side as well: traffic from Tor exits and anonymising proxies is a strong signal in fraud models, but some legitimate customers use them for safety. Treat it as risk context for step-up authentication rather than an automatic block.</p>

<h2>In code: layered encryption</h2>
${code('OnionLayers.java')`import java.nio.ByteBuffer;
import java.security.SecureRandom;
import javax.crypto.Cipher;
import javax.crypto.KeyGenerator;
import javax.crypto.SecretKey;
import javax.crypto.spec.GCMParameterSpec;

/** Three layers, one key per relay. Real Tor derives these keys with ntor and uses a stream
 *  cipher with a running digest per hop; this only shows the layering idea. */
public final class OnionLayers {
    static final SecureRandom RNG = new SecureRandom();

    static byte[] seal(SecretKey k, byte[] in) throws Exception {
        byte[] n = new byte[12]; RNG.nextBytes(n);
        Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
        c.init(Cipher.ENCRYPT_MODE, k, new GCMParameterSpec(128, n));
        byte[] ct = c.doFinal(in);
        return ByteBuffer.allocate(12 + ct.length).put(n).put(ct).array();
    }
    static byte[] open(SecretKey k, byte[] in) throws Exception {
        Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
        c.init(Cipher.DECRYPT_MODE, k, new GCMParameterSpec(128, in, 0, 12));
        return c.doFinal(in, 12, in.length - 12);
    }

    public static void main(String[] args) throws Exception {
        KeyGenerator kg = KeyGenerator.getInstance("AES"); kg.init(256);
        SecretKey kGuard = kg.generateKey(), kMiddle = kg.generateKey(), kExit = kg.generateKey();

        byte[] request = "GET https://news.example/ HTTP/1.1".getBytes();
        byte[] onion = seal(kGuard, seal(kMiddle, seal(kExit, request)));   // innermost layer for the exit

        byte[] afterGuard = open(kGuard, onion);       // guard: still unreadable
        byte[] afterMiddle = open(kMiddle, afterGuard); // middle: still unreadable
        byte[] atExit = open(kExit, afterMiddle);       // exit: sees the request, not the sender
        System.out.println(onion.length + " bytes on the first link -> " + new String(atExit));
        // Note the size shrinks by 28 bytes per hop here; Tor uses fixed-size cells so sizes reveal nothing.
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Assuming a VPN makes you anonymous.</strong> It changes who can see your traffic.</li>
<li><strong>Using Tor with an ordinary browser,</strong> plugins or a logged-in personal account.</li>
<li><strong>Plain HTTP over Tor,</strong> visible and modifiable by the exit.</li>
<li><strong>Believing encryption hides metadata.</strong> Sizes, timing and endpoints leak.</li>
<li><strong>Blocking all anonymity networks</strong> without considering legitimate users, or trusting them without considering abuse.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Who knows what</summary><p>A user reaches an HTTPS site through Tor. Which party knows both the user's IP and the site? None, unless guard and exit (or observers of both ends) collude.</p></details>
<details><summary>Anonymity set</summary><p>Only three employees in a company use Tor, and the company sees connections to Tor guards in its logs. What does an anonymous leak via Tor reveal? That one of three people sent it: a tiny anonymity set.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Guard probability</summary><p>An attacker controls 2% of guard bandwidth and 2% of exit bandwidth. If a client picked fresh random relays for each of 1,000 circuits, what is the chance at least one circuit had both ends controlled? 1 − (1 − 0.0004)<sup>1000</sup> ≈ 33%. With one persistent honest guard, zero.</p></details>
<details><summary>Read the consensus</summary><p>Download the current Tor consensus (from a mirror or the metrics site) and count relays with the Guard and Exit flags. How concentrated is exit bandwidth among the largest operators?</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Correlate flows</summary><p>Generate synthetic flows: 50 users with random bursty traffic, each entering a network and leaving with a random delay of 0.5 to 1.5 s and some noise. Implement a correlation attack that matches entry and exit flows by cross-correlating byte counts per 100 ms window. How accurate is it, and how much padding destroys it?</p></details>
<details><summary>Oblivious HTTP</summary><p>Using an HPKE library in Java, implement the encapsulated request format of RFC 9458: a client encrypts a request to a gateway key, sends it via a relay, and the gateway decrypts and responds. Show that the relay learns only the client address and the gateway learns only the request.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why metadata matters and define sender anonymity, unlinkability and anonymity sets.</li>
<li>I can contrast proxies, mix networks and onion routing.</li>
<li>I can explain Tor's directory consensus, telescoping circuits, ntor, cells, guards and exits.</li>
<li>I can describe how onion services and rendezvous points provide receiver anonymity.</li>
<li>I can explain traffic correlation, website fingerprinting, Sybil relays and application leaks.</li>
<li>I can describe two-hop relays and Oblivious HTTP and where they fit.</li>
</ul>
`});

CH.push({
  id: 'ch26', n: 26, title: 'Memory Safety and Software Vulnerabilities',
  lede: 'Cryptography and network defences assume the software running them does what its source code says. Memory-safety bugs break that assumption: one out-of-bounds write lets an attacker run their own code. This chapter shows how buffer overflows, use-after-free and over-reads work at the level of the stack and heap, how mitigations from canaries to control-flow integrity raise the cost, why memory-safe languages are the real fix, and then turns to the vulnerability classes that remain in memory-safe Java: integer overflow, deserialisation, injection into interpreters, races and the software supply chain.',
  html: `
<h2>Why memory safety matters</h2>
<p>In C and C++, the programmer is responsible for every buffer's bounds and every object's lifetime. The language does not check that an index is inside an array or that a pointer still refers to live memory. A mistake does not just crash the program: with care, an attacker can turn it into reading secrets or executing arbitrary code with the program's privileges.</p>
<p>These bugs dominate serious vulnerabilities. Microsoft has reported that about 70% of the vulnerabilities it assigns CVEs to are memory-safety issues, and the Chromium project found the same proportion among its high-severity bugs. Famous Internet-scale incidents follow the same pattern: the Morris worm (1988), Code Red (2001), SQL Slammer (2003), Heartbleed (2014), and the EternalBlue SMB exploit (2017) used by WannaCry and NotPetya.</p>

<h2>How a process uses memory</h2>
${fig('memlayout', '<b>Figure 26.1</b> A typical process address space. The stack holds return addresses right next to local buffers, which is what makes stack overflows so dangerous.')}
<p>Each function call pushes a <strong>stack frame</strong>: arguments, the address to return to, the caller's frame pointer, and the function's local variables. Long-lived objects live on the <strong>heap</strong>, managed by an allocator that keeps metadata between chunks. Mixing control data (return addresses, function pointers, allocator metadata) with attacker-influenced data in the same memory is the root of the exploitation techniques below.</p>

<h2>Spatial errors: out of bounds</h2>
<h3>Stack buffer overflows</h3>
${fig('smash', '<b>Figure 26.2</b> A stack buffer overflow. Copying an over-long input past the end of a local buffer overwrites the saved return address; a canary detects it.')}
<p>Functions such as <code>strcpy</code>, <code>gets</code>, <code>sprintf</code> and hand-written copy loops write until the input ends, not until the buffer ends. Aleph One's 1996 article "Smashing the Stack for Fun and Profit" made the technique widely known: put machine code ("shellcode") in the buffer and overwrite the return address to point at it.</p>
<h3>Heap overflows and out-of-bounds reads</h3>
<p>Overflowing a heap buffer corrupts neighbouring objects (their function pointers, lengths or permission flags) or the allocator's metadata. An out-of-bounds <em>read</em> does not let the attacker run code directly, but leaks memory that may contain keys, passwords or addresses that defeat other mitigations.</p>
${fig('heartbleed', '<b>Figure 26.3</b> Heartbleed. A server trusted a length field in the request and returned up to 64 KB of its memory per heartbeat.')}
<h3>Integer overflows</h3>
<p>Arithmetic on fixed-width integers wraps around silently in C (and in Java). A size computation like <code>count * sizeof(item)</code> can overflow to a small number, the program allocates a tiny buffer, and then writes <code>count</code> items into it. Signed and unsigned confusion, where a negative length becomes a huge one, causes the same class of bug.</p>
<h3>Format strings</h3>
<p>Passing user input as the format argument, <code>printf(input)</code> instead of <code>printf("%s", input)</code>, lets the attacker supply directives: <code>%x</code> reads stack values, and <code>%n</code> writes the number of characters printed so far to an address on the stack, an arbitrary write.</p>

<h2>Temporal errors: lifetimes</h2>
${fig('uaf', '<b>Figure 26.4</b> Use-after-free. A dangling pointer to freed memory is used after the attacker has refilled that memory with controlled data.')}
<p><strong>Double free</strong> corrupts allocator metadata in similar ways, and <strong>type confusion</strong>, treating an object as a different type, lets the attacker read or write fields that do not exist. Use-after-free and type confusion dominate modern browser exploits, because browsers have complex object lifetimes driven by attacker-controlled JavaScript.</p>

<h2>Mitigations: raising the cost</h2>
<p>Decades of mitigations have made exploitation much harder, though not impossible:</p>
<div class="tbl"><table><tr><th>Mitigation</th><th>What it does</th><th>How attackers respond</th></tr>
<tr><td>Stack canaries</td><td>Random value before control data, checked on return</td><td>Leak the canary; overwrite non-adjacent targets</td></tr>
<tr><td>Non-executable memory (NX, DEP, W^X)</td><td>Stack and heap cannot execute, so injected shellcode will not run</td><td>Reuse existing code (return-oriented programming)</td></tr>
<tr><td>ASLR, PIE</td><td>Randomise where code, stack, heap and libraries load</td><td>Information leaks reveal addresses; brute force on 32-bit</td></tr>
<tr><td>RELRO, fortified libc</td><td>Make function pointer tables read-only; bounds-checked copies</td><td>Other writable function pointers</td></tr>
<tr><td>Control-flow integrity</td><td>Indirect calls may only go to valid targets</td><td>Find gadgets among permitted targets</td></tr>
<tr><td>Shadow stacks (Intel CET), pointer authentication (ARM PAC)</td><td>Hardware-protected copy of return addresses; signed pointers</td><td>Data-only attacks that change decisions, not control flow</td></tr>
<tr><td>Memory tagging (ARM MTE)</td><td>Tags on memory and pointers must match; catches most overflows and use-after-free</td><td>Tag collisions; still being deployed</td></tr>
</table></div>
<h3>Return-oriented programming</h3>
<p>Once injected code could not execute, attackers began chaining short snippets of existing code that end in a return instruction, called <strong>gadgets</strong>. By writing a sequence of gadget addresses onto the stack, they compose arbitrary computation from the program's own libraries.</p>
${fig('rop', '<b>Figure 26.5</b> A return-oriented programming chain. Return addresses on the stack sequence existing code fragments into a call to system("/bin/sh").')}
<p>ROP needs known addresses, so it is usually paired with an information leak to defeat ASLR. Hardware shadow stacks, now in mainstream Intel, AMD and ARM processors, stop return-address corruption directly.</p>

<h2>Finding bugs before attackers do</h2>
<ul>
<li><strong>Fuzzing</strong> feeds programs huge numbers of mutated inputs and watches for crashes. Coverage-guided fuzzers (AFL from 2013, libFuzzer) evolve inputs that reach new code. Google's OSS-Fuzz has found tens of thousands of bugs in open-source projects. Jazzer brings the same approach to Java.</li>
<li><strong>Sanitizers</strong> such as AddressSanitizer instrument C and C++ builds to detect out-of-bounds and use-after-free accesses the moment they happen, turning silent corruption into clear reports during testing.</li>
<li><strong>Static analysis</strong> finds patterns such as unchecked lengths or tainted data reaching dangerous functions.</li>
</ul>

<h2>The real fix: memory-safe languages</h2>
<p>Languages that check bounds and manage lifetimes, through garbage collection (Java, C#, Go) or compile-time ownership rules (Rust), eliminate these classes of bugs in safe code. The evidence is strong: Android began writing new low-level code in Rust and other memory-safe languages, and the share of its vulnerabilities caused by memory-safety bugs fell from about three quarters in 2019 to about a quarter in 2024, even though most existing code remained C and C++. Security agencies in several countries now urge vendors to publish memory-safety roadmaps.</p>
<p>The boundaries still matter: native libraries called through JNI or the Foreign Function and Memory API, <code>sun.misc.Unsafe</code>, and the JVM itself are written in or behave like unsafe code.</p>

<h2>Vulnerabilities in memory-safe Java</h2>
<p>Java eliminates buffer overflows and use-after-free, but not logic errors in how programs handle untrusted input. The common classes:</p>
<h3>Integer overflow in business logic</h3>
<p><code>int</code> and <code>long</code> arithmetic wraps silently. A quantity times a price that overflows can turn a huge order into a negative total, or a limit check into a pass. Use <code>Math.addExact</code> and <code>Math.multiplyExact</code>, which throw on overflow, and represent money as <code>long</code> minor units with exact arithmetic or <code>BigDecimal</code>, never <code>double</code>.</p>
<h3>Deserialisation of untrusted data</h3>
<p>Java's built-in serialisation reconstructs arbitrary object graphs and runs code in their <code>readObject</code> methods. In 2015 Gabriel Lawrence and Chris Frohoff showed "gadget chains" in common libraries such as Apache Commons Collections: a crafted byte stream that, when deserialised by any application with those libraries on its classpath, executes a command. Application servers, message queues and admin consoles that accepted serialised objects were exploited widely. Never deserialise untrusted data with <code>ObjectInputStream</code>; use JSON or Protocol Buffers with explicit schemas, and where Java serialisation cannot be avoided, apply a strict allow-list <code>ObjectInputFilter</code> (available since Java 9, JEP 290).</p>
<h3>Injection into interpreters</h3>
<p>Many Java vulnerabilities come from passing untrusted strings to something that interprets them:</p>
<ul>
<li><strong>Log4Shell</strong> (December 2021): Log4j 2 expanded <code>\${jndi:ldap://…}</code> lookups inside logged messages, fetching and running a class from an attacker's server. Any application that logged a user-controlled string, such as a User-Agent header, was exposed. It was rated 10.0, the maximum, and affected an enormous range of software.</li>
<li><strong>Expression languages:</strong> the 2017 Equifax breach, exposing data on about 147 million people, began with an Apache Struts vulnerability that evaluated an attacker-supplied OGNL expression from a Content-Type header. The patch had been available for two months.</li>
<li><strong>SQL, LDAP, XPath and OS commands</strong> (Chapter 27 covers SQL injection). For processes, use <code>ProcessBuilder</code> with a list of arguments, never a shell command string.</li>
<li><strong>XML external entities</strong> (XXE): a DTD can reference local files or internal URLs that the parser fetches and embeds. Disable DTDs (the SafeXml factory in Chapter 21).</li>
</ul>
<h3>Paths, archives and races</h3>
<ul>
<li><strong>Path traversal:</strong> a filename such as <code>../../etc/passwd</code> escapes the intended directory. "Zip Slip" (2018) found this in archive extraction code across many libraries: entries named with <code>../</code> wrote outside the target directory. Normalise and check that resolved paths stay under the base directory.</li>
<li><strong>Race conditions:</strong> check-then-act sequences without locking, such as reading a balance and then debiting it in two statements, allow concurrent requests to double-spend. Use database transactions with appropriate isolation, conditional updates (<code>UPDATE … WHERE balance >= ?</code>) or idempotency keys.</li>
</ul>

<h2>The software supply chain</h2>
<p>Most of the code an application runs was written by someone else. Attacks on that chain multiply impact:</p>
<ul>
<li><strong>Vulnerable dependencies:</strong> Log4Shell was in a transitive dependency many teams did not know they had. A software bill of materials (SBOM) and dependency scanning answer "are we affected?" in minutes instead of weeks.</li>
<li><strong>Malicious packages:</strong> typosquatted names, a compromised maintainer account, or a new maintainer who adds malicious code, as in the 2018 npm event-stream package that targeted a cryptocurrency wallet.</li>
<li><strong>Dependency confusion</strong> (2021): build tools fetched a public package with the same name as a company's internal one, at a higher version.</li>
<li><strong>The xz backdoor</strong> (2024): after two years building trust as a maintainer, an attacker hid a backdoor in the build process of a compression library that, through system integration, reached the OpenSSH server on some Linux distributions. An engineer noticed SSH logins taking half a second longer and investigated before it reached stable releases.</li>
</ul>
<p>Defences: pin and verify dependency versions and checksums, use private repositories with controlled upstream mirroring, require signed artefacts and provenance (Sigstore, the SLSA framework), build in isolated and reproducible environments, review dependency updates like code, and patch quickly when vulnerabilities are announced.</p>

<h2>In code</h2>
${code('', 'none')`/* C: the bug and the fix */
void greet(const char *name) {
    char buf[16];
    strcpy(buf, name);                       /* no bounds check: overflow */
}
void greet_safe(const char *name) {
    char buf[16];
    snprintf(buf, sizeof buf, "%s", name);   /* truncates; never overflows */
}
/* Build with mitigations: -fstack-protector-strong -D_FORTIFY_SOURCE=3 -fPIE -pie -Wl,-z,relro,-z,now
   and test with -fsanitize=address,undefined */`}
${code('SafeJava.java')`import java.io.ByteArrayInputStream;
import java.io.ObjectInputFilter;
import java.io.ObjectInputStream;
import java.nio.file.Path;
import java.util.List;

public final class SafeJava {
    /** Money in minor units with overflow detection. */
    static long orderTotalCents(long unitPriceCents, int quantity) {
        return Math.multiplyExact(unitPriceCents, (long) quantity);   // throws ArithmeticException
    }

    /** Resolve an uploaded file name safely under a base directory. */
    static Path safeResolve(Path base, String userName) {
        Path p = base.resolve(userName).normalize();
        if (!p.startsWith(base.normalize())) throw new SecurityException("path traversal");
        return p;
    }

    /** If Java serialisation is unavoidable: allow-list classes and cap graph size. */
    static Object readTrusted(byte[] data) throws Exception {
        ObjectInputFilter f = ObjectInputFilter.Config.createFilter(
            "com.example.dto.*;java.lang.*;java.util.*;maxdepth=10;maxrefs=1000;maxbytes=65536;!*");
        try (ObjectInputStream in = new ObjectInputStream(new ByteArrayInputStream(data))) {
            in.setObjectInputFilter(f);
            return in.readObject();
        }
    }

    /** Run a program with arguments, never through a shell. */
    static Process convert(Path input, Path output) throws Exception {
        return new ProcessBuilder(List.of("/usr/bin/convert", input.toString(), output.toString()))
            .redirectErrorStream(true).start();
    }
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>New C or C++ code for parsing untrusted input</strong> when a memory-safe option exists.</li>
<li><strong>Building without mitigations</strong> or shipping debug builds.</li>
<li><strong>ObjectInputStream on network input,</strong> including in old RMI, JMX or message queue endpoints.</li>
<li><strong>Logging or evaluating untrusted strings</strong> in libraries that interpret them.</li>
<li><strong>Unpatched dependencies</strong> and no inventory of what you ship.</li>
<li><strong>double for money</strong> and unchecked integer arithmetic in limits.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Easy</h4>
<details><summary>Spot the overflow</summary><p>What is wrong with <code>char b[8]; sprintf(b, "%d-%d", a, c);</code>? Two ints can need up to 23 characters plus the terminator; use snprintf with sizeof b.</p></details>
<details><summary>Integer wrap</summary><p>In Java, what is <code>Integer.MAX_VALUE + 1</code>? −2,147,483,648. Which method throws instead? Math.addExact.</p></details></div>
<div class="lvl md"><h4>Medium</h4>
<details><summary>Smash a stack in a lab</summary><p>Compile the vulnerable greet function without protections (<code>-fno-stack-protector -z execstack -no-pie</code>) in a VM, overflow it under a debugger, and observe the return address change. Rebuild with protections and observe the abort.</p></details>
<details><summary>Find your dependencies</summary><p>Generate an SBOM for a Java project (CycloneDX Maven or Gradle plugin) and run a vulnerability scanner over it. How many transitive dependencies are there, and how many have known CVEs?</p></details></div>
<div class="lvl h"><h4>Hard</h4>
<details><summary>Fuzz a parser</summary><p>Use Jazzer to fuzz a Java parser you maintain (a CSV or ISO 20022 message parser, for example) for 30 minutes. Triage any exceptions: which are denial-of-service risks and which could corrupt data?</p></details>
<details><summary>Double-spend race</summary><p>Write a Java service that debits an account by reading the balance and then writing balance minus amount. Fire 100 concurrent debits with a load tool and show the balance goes wrong. Fix it with a conditional UPDATE and with optimistic locking, and compare.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain the stack and heap layout and why control data next to buffers is dangerous.</li>
<li>I can describe stack and heap overflows, over-reads, integer overflows, format strings, use-after-free and type confusion.</li>
<li>I can explain canaries, NX, ASLR, ROP, CFI, shadow stacks and memory tagging.</li>
<li>I can explain fuzzing and sanitizers and why memory-safe languages are the lasting fix.</li>
<li>I can identify Java vulnerability classes: deserialisation, interpreter injection, path traversal, overflow and races.</li>
<li>I can describe supply-chain attacks and the controls that reduce them.</li>
</ul>
`});
