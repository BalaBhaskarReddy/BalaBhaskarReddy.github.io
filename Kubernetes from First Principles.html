    const nodes = Math.ceil(P * rq / (n * pk)), cost = nodes * c * (1 - sp * 0.65);
    const rs = Math.min(rq, Math.max(u * 1.3, 0.05)), nodes2 = Math.ceil(P * rs / (n * pk)), cost2 = nodes2 * c * (1 - sp * 0.65);
    host.querySelector('#co-out').innerHTML = `today: <b>${nodes} nodes</b>, about ₹${Math.round(cost).toLocaleString('en-IN')} a month · CPU utilisation of the fleet ≈ <b class="${nodes && P * u / (nodes * n) < 0.4 ? 'd' : 'g'}">${nodes ? Math.round(P * u / (nodes * n) * 100) : 0}%</b><br>requests right-sized to 1.3 × usage (${rs.toFixed(2)} cores): <b>${nodes2} nodes</b>, about ₹${Math.round(cost2).toLocaleString('en-IN')} a month · saving <b class="g">₹${Math.round(cost - cost2).toLocaleString('en-IN')}</b> (${Math.round((1 - cost2 / cost) * 100)}%)<br><span class="meta">The scheduler packs by requests, so over-requesting directly buys idle machines. Memory often binds before CPU; repeat the calculation for memory. Spot capacity suits stateless replicas and batch with interruption handling.</span>`;
  };
  host.querySelectorAll('input').forEach(e => e.addEventListener('input', draw)); draw();
};

CH.push({
  id: 'ch22', n: 22, title: 'Reliability, Scale and Cost',
  lede: 'Kubernetes heals individual failures automatically, but it will happily let you design a service that fails as a whole: all replicas in one zone, a drain that takes everything down at once, a cluster too big to upgrade, a bill twice the size it needs to be. This chapter is about designing for disruption, scaling within known limits, and paying only for what you use.',
  html: `
<h2>Voluntary and involuntary disruption</h2>
<p><b>Involuntary</b> disruptions are failures: a node crashes, a zone goes dark, the kernel kills a process. <b>Voluntary</b> ones are deliberate: draining nodes for upgrades, autoscaler consolidation, evictions for preemption. You defend against the first with replicas spread across failure domains; against the second with <b>PodDisruptionBudgets</b>, which the eviction API respects.</p>
${Y('A PodDisruptionBudget')`
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api, namespace: shop}
spec:
  minAvailable: 80%                       # or maxUnavailable: 1
  selector: {matchLabels: {app: api}}
  unhealthyPodEvictionPolicy: AlwaysAllow # do not let crashing Pods block node drains`}
${fig('pdb', '<b>Figure 22.1</b> Interactive: draining nodes against a PodDisruptionBudget.')}
<p>A PDB with <code>maxUnavailable: 0</code> (or minAvailable equal to replicas) blocks drains forever and stalls every upgrade; platform teams should reject such budgets by policy. Single-replica workloads cannot be protected by a PDB at all: they will be interrupted, so give them a fast start-up or a second replica.</p>

<h2>Designing a resilient service</h2>
<ol>
<li>At least two replicas, three for anything critical, spread across zones with topology spread constraints.</li>
<li>Readiness probes, graceful shutdown with a preStop delay, and enough termination grace period (Chapter 5).</li>
<li>A PodDisruptionBudget that allows at least one disruption.</li>
<li>Priority classes so critical services win when capacity is short.</li>
<li>Resource requests that reflect reality, so the scheduler does not overload nodes.</li>
<li>Dependencies with timeouts, retries with back-off, and circuit breakers; a cluster will not save an app that waits forever on a dead database.</li>
<li>Tested failure: drain nodes during business hours in staging; inject faults (Chaos Mesh, Litmus) deliberately.</li>
</ol>

<h2>Zones, regions and many clusters</h2>
<p>A cluster spread over three zones of one region survives a zone failure if workloads and their storage are zone-redundant. It does not survive a regional failure, a control-plane disaster or a bad cluster-wide change (a broken admission webhook, a CNI upgrade). For those, run <b>several clusters</b>: active–active in two regions behind a global load balancer or DNS, or active–standby with GitOps keeping the standby current and data replicated at the application level. Multi-cluster tooling (Cluster API for lifecycle, Argo CD ApplicationSets or Flux for delivery, MultiKueue for batch, cluster mesh or a service mesh for cross-cluster service discovery) makes this manageable. Smaller clusters also have a smaller blast radius, which many platform teams now prefer to one giant cluster.</p>

<h2>Scale limits</h2>
<div class="tbl"><table><tr><th>Dimension</th><th>Tested upstream limit</th><th>What usually breaks first</th></tr>
<tr><td>Nodes per cluster</td><td>5,000</td><td>API server and etcd load from node heartbeats and watches; upgrade duration</td></tr>
<tr><td>Pods per node</td><td>110 (default maxPods)</td><td>IP addresses per node range; kubelet and runtime overhead</td></tr>
<tr><td>Pods per cluster</td><td>150,000</td><td>etcd size, list and watch traffic, controller memory</td></tr>
<tr><td>Containers per cluster</td><td>300,000</td><td>Same</td></tr>
<tr><td>Services, endpoints</td><td>Tens of thousands</td><td>kube-proxy sync time (use nftables or eBPF)</td></tr>
<tr><td>Objects of a custom type</td><td>Depends on size and churn</td><td>Operators that list everything; etcd quota</td></tr>
</table></div>
<p>Providers run larger clusters with tuning, and recent releases have raised practical ceilings (streaming list encoding and consistent reads from cache, both stable in 1.34; WatchList; RangeStream, beta in 1.37 with etcd 3.7; and, still alpha, sharded list and watch). But a cluster near the limits is slow to upgrade and risky to change. Prefer more, smaller clusters unless you need one scheduling domain.</p>

<h2>Cost</h2>
${fig('cost', '<b>Figure 22.2</b> Interactive: how over-requesting turns into nodes and money.')}
<ul>
<li><b>Measure</b> cost per namespace and team (OpenCost, Kubecost, cloud cost allocation by label) so teams see what they spend.</li>
<li><b>Right-size</b> requests with VPA recommendations or usage data; it is the largest lever in most clusters. Since in-place Pod resize became stable (1.35), VPA's <code>InPlaceOrRecreate</code> mode applies new requests without restarting Pods where the node has room, so right-sizing no longer costs a rollout.</li>
<li><b>Autoscale</b> Pods and nodes, including down to zero for idle workloads and non-production at night: the built-in HPA scales to zero on object or external metrics (beta and on by default in 1.37). Node autoscalers such as Karpenter consolidate under-used nodes; their disruption budgets and the <code>karpenter.sh/do-not-disrupt</code> annotation interact with your PodDisruptionBudgets.</li>
<li><b>Use cheaper capacity</b>: spot or preemptible nodes for fault-tolerant work, ARM nodes where images support it, committed-use discounts for the steady base.</li>
<li><b>Clean up</b>: unused PVCs (beta in 1.37: an <code>Unused</code> condition whose last transition time is the "unused since" time), idle load balancers, abandoned namespaces, oversized logs and metrics retention.</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>PDBs that allow zero disruptions</strong>, blocking every drain and upgrade.</li>
<li><strong>All replicas in one zone</strong> because nothing asked the scheduler to spread them.</li>
<li><strong>One enormous cluster</strong> for everything: every change is risky, every upgrade slow.</li>
<li><strong>Cost reviews without request data</strong>: you cannot fix what you cannot attribute.</li>
<li><strong>Spot nodes for stateful primaries</strong> without interruption handling.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>PDB arithmetic</summary><p>6 replicas, all Ready, PDB maxUnavailable 2. How many Pods can a drain evict at once? What if two are already crashing?</p><p><em>Answer:</em> 2. With two unhealthy, 4 are Ready and desiredHealthy is 4, so disruptionsAllowed is 0: no Ready Pod may be evicted. The two unhealthy (Running, not Ready) Pods can still be evicted even under the default IfHealthyBudget, because currentHealthy (4) is not below desiredHealthy (4). IfHealthyBudget blocks evicting unhealthy Pods only once the application is already below budget (say a third Pod goes unready); AlwaysAllow evicts unhealthy Pods even then, which is why it keeps crash-looping workloads from blocking drains.</p></details>
<details><summary>Why many clusters?</summary><p>Give three reasons to run several smaller clusters instead of one large one.</p><p><em>Answer:</em> smaller blast radius for cluster-wide failures and bad changes; regional resilience; faster, safer upgrades; regulatory separation (for example a cardholder data environment).</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Zone failure game day</summary><p>In a multi-zone test cluster, cordon and drain all nodes in one zone. Measure error rates for each service, and list those that failed and why.</p><p><em>Answer:</em> typical failures: single-replica services, replicas concentrated in the drained zone, zonal volumes that cannot move, PDBs blocking the drain.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Cost model for a platform</summary><p>Using OpenCost data, build a monthly report of cost per team split into requested-but-idle and used, and propose request changes that cut 25% without exceeding p95 usage.</p><p><em>Answer:</em> the idle share is usually the biggest component; right-sizing CPU requests to observed p95 and memory to observed peak plus margin typically yields the savings, with node autoscaling removing the freed capacity.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can write PodDisruptionBudgets that protect services without blocking maintenance.</li>
<li>I can design a service and a platform for zone, region and cluster failures.</li>
<li>I know the tested scale limits and why smaller clusters are often better.</li>
<li>I can find and reduce waste in requests and capacity.</li>
</ul>
`});

CH.push({
  id: 'ch23', n: 23, title: 'Custom Resources',
  lede: 'A CustomResourceDefinition teaches the API server a new type. Your objects then get everything built-in types have: storage, watches, RBAC, admission, kubectl, validation and versioning. This chapter designs a real one, the Tenant resource that the next chapters\' operator will reconcile, and covers schemas, CEL validation, subresources, printer columns and version conversion.',
  html: `
<h2>Extending the API</h2>
<p>There are two ways to add types. A <b>CRD</b> is declarative: the API server stores and serves the objects for you, validated against an OpenAPI schema. An <b>aggregated API server</b> is your own server behind the main one (Chapter 29), for when you need custom storage, non-CRUD semantics or very high write rates. Almost every operator uses CRDs.</p>
<div class="note key"><b>The running example</b><p>A platform team onboards teams by hand: namespaces, quotas, default-deny network policies, Pod Security labels, RoleBindings for the team's groups. We will turn that runbook into an API. A cluster-scoped <code>Tenant</code> describes a team; an operator (Chapters 26 to 28) reconciles it into all those objects. Chapter 25 first builds a simpler controller with raw client-go to show the machinery.</p></div>

<h2>A CRD, field by field</h2>
${Y('tenants.platform.example.com (normally generated by controller-gen from Go types, Chapter 26)')`
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.platform.example.com          # <plural>.<group>
spec:
  group: platform.example.com
  scope: Cluster                              # a Tenant spans namespaces
  names: {kind: Tenant, listKind: TenantList, plural: tenants, singular: tenant, shortNames: [tn], categories: [platform]}
  versions:
  - name: v1
    served: true
    storage: true                             # exactly one version is the storage version
    subresources:
      status: {}                              # /status: spec and status written separately
    additionalPrinterColumns:
    - {name: Tier, type: string, jsonPath: .spec.tier}
    - {name: Ready, type: string, jsonPath: '.status.conditions[?(@.type=="Ready")].status'}
    - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
    selectableFields:
    - jsonPath: .spec.tier                    # kubectl get tenants --field-selector spec.tier=regulated
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [namespaces, adminGroups]
            x-kubernetes-validations:
            - rule: '!(has(oldSelf.tier) && oldSelf.tier == "regulated" && self.tier != "regulated")'
              message: a regulated tenant cannot be downgraded
            - rule: 'self.tier != "regulated" || self.namespaces.all(n, n.startsWith("payments") || n.startsWith("pci-"))'
              message: regulated tenants may only use namespaces prefixed "payments" or "pci-"
            - rule: '!has(self.quota) || self.quota.pods <= 200 * size(self.namespaces)'   # sibling fields: rule on the parent
              messageExpression: '"pods " + string(self.quota.pods) + " exceeds 200 per namespace"'
            properties:
              tier: {type: string, enum: [standard, regulated], default: standard}
              adminGroups:
                type: array
                items: {type: string, maxLength: 128}
                x-kubernetes-list-type: set
              namespaces:
                type: array
                minItems: 1
                maxItems: 10
                x-kubernetes-list-type: set
                items: {type: string, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
              quota:
                type: object
                properties:
                  cpu:
                    type: string
                    default: "8"
                    x-kubernetes-validations: [{rule: 'isQuantity(self)', message: 'must be a Kubernetes quantity such as "8" or "500m"'}]
                  memory:
                    type: string
                    default: 16Gi
                    x-kubernetes-validations: [{rule: 'isQuantity(self)', message: 'must be a Kubernetes quantity such as "16Gi"'}]
                  pods: {type: integer, minimum: 1, maximum: 2000, default: 100}
              networkIsolation: {type: boolean, default: true}
          status:
            type: object
            properties:
              observedGeneration: {type: integer, format: int64}
              namespaces: {type: array, items: {type: string}}
              conditions:
                type: array
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [type]
                items: {type: object, required: [type, status], properties: {type: {type: string}, status: {type: string}, reason: {type: string}, message: {type: string}, observedGeneration: {type: integer}, lastTransitionTime: {type: string, format: date-time}}}`}
<p>CEL rules see the object they are attached to as <code>self</code>. A rule comparing sibling fields, such as pods in the quota against the number of namespaces, must therefore sit on their common parent, <code>spec</code>. The API server type-checks every rule and estimates its cost when the CRD is created, and rejects rules that refer to fields that do not exist or could be too expensive.</p>

<h2>Validation</h2>
<p>CRD schemas must be <b>structural</b>: every field has a type, and unknown fields are <b>pruned</b> (silently dropped) unless marked <code>x-kubernetes-preserve-unknown-fields</code>. kubectl rejects unknown fields by default (<code>--validate=strict</code>, enforced server-side); other clients, including client-go and most operators and GitOps tools, get only a warning unless they send <code>fieldValidation=Strict</code>, and the field is then pruned. Beyond OpenAPI keywords (enum, pattern, min and max, required), <b>CEL rules</b> in <code>x-kubernetes-validations</code> express relations between fields, and with <code>oldSelf</code>, <b>transition rules</b> that compare an update with the previous object (immutability, no downgrades). Validation <b>ratcheting</b> lets existing objects that predate a stricter schema keep being updated as long as the invalid parts do not change.</p>
${fig('crdval', '<b>Figure 23.1</b> Interactive: schema and CEL validation of an update to a Tenant.')}
<div class="tbl"><table><tr><th>Need</th><th>Use</th></tr>
<tr><td>Field format, ranges, enums</td><td>OpenAPI schema keywords</td></tr>
<tr><td>Relations between fields; immutability; no downgrades</td><td>CEL <code>x-kubernetes-validations</code>, with <code>oldSelf</code> for transitions</td></tr>
<tr><td>Defaults</td><td>Schema <code>default</code> (applied on read, write and from etcd)</td></tr>
<tr><td>Rules that need other objects or external data</td><td>A validating webhook or ValidatingAdmissionPolicy (Chapter 28)</td></tr>
<tr><td>Map-like lists that merge well with server-side apply</td><td><code>x-kubernetes-list-type: map</code> with list-map keys</td></tr>
</table></div>

<h3>Production-grade CEL rules</h3>
<ul>
<li><b>Report on the right field</b>: a rule on a parent can set <code>fieldPath</code> (for example <code>.namespaces</code>) and <code>reason</code> (<code>FieldValueInvalid</code>, <code>FieldValueForbidden</code>, <code>FieldValueRequired</code>, <code>FieldValueDuplicate</code>) so clients see a precise error.</li>
<li><b>Transition rules on create</b>: <code>optionalOldSelf: true</code> makes a transition rule also run when there is no old value, using <code>oldSelf.hasValue()</code> and <code>oldSelf.value()</code>; it is the cleanest way to write "immutable once set".</li>
<li><b>Ratcheting</b> (stable since 1.33) lets an object whose unchanged fields violate a newly tightened rule still be updated; only changed fields are re-validated. Tighten rules on a live API without breaking every existing object.</li>
<li><b>Cost limits</b>: the API server estimates each rule's worst-case cost from the schema. Give lists and maps <code>maxItems</code> or <code>maxProperties</code> and strings <code>maxLength</code>, or a rule that iterates over them is rejected when you install the CRD.</li>
<li><b>Defaults that depend on other fields</b> belong in a MutatingAdmissionPolicy (stable since 1.36), not in a webhook.</li>
</ul>

<h2>Subresources and presentation</h2>
<ul>
<li><b>status</b>: separates the user's spec from the controller's status. Users can be denied <code>tenants/status</code>, so they cannot fake a Ready condition; controllers write status without bumping <code>generation</code>.</li>
<li><b>scale</b>: maps <code>spec.replicas</code> and <code>status.replicas</code> so <code>kubectl scale</code> and the HPA work on your type.</li>
<li><b>Printer columns</b>, <b>short names</b> and <b>categories</b> make <code>kubectl get tn</code> and <code>kubectl get platform</code> useful.</li>
<li><b>selectableFields</b> (stable since 1.32) allow field selectors on custom fields, for kubectl and for controllers' informers.</li>
</ul>
${SH('Using the new type')`
kubectl apply -f config/crd/tenants.yaml
kubectl explain tenant.spec --recursive
kubectl apply -f - <<'EOF'
apiVersion: platform.example.com/v1
kind: Tenant
metadata: {name: payments}
spec:
  tier: regulated
  adminGroups: ["oidc:payments-admins"]
  namespaces: [payments, payments-batch]
  quota: {cpu: "40", memory: 80Gi, pods: 300}
EOF
kubectl get tn                          # NAME  TIER  READY  AGE   (Ready is empty: nothing reconciles it yet)
kubectl get tenant payments -o yaml     # defaults applied: networkIsolation: true`}
<p>Nothing happens yet. A CRD only stores intentions; a controller has to act on them.</p>

<h2>Versions and conversion</h2>
<p>APIs evolve. A CRD can serve several versions; one is the storage version. If the schemas are identical, conversion is <code>None</code> (only apiVersion changes). If they differ, a <b>conversion webhook</b> converts between them, usually through a "hub" version so you write N conversions rather than N².</p>
${fig('conv', '<b>Figure 23.2</b> Step through: serving two versions with a conversion webhook, and retiring the old one.')}
<h3>Running a conversion webhook in production</h3>
<p>Once a CRD uses <code>conversion: Webhook</code>, the webhook sits on the <b>read</b> path. If it is down, every read, list and watch of that type at a version that needs conversion fails; the API server's watch cache for the type cannot initialise after a restart; garbage collection and namespace deletion stall on those objects; and GitOps tools report errors across the cluster. It is the most common CRD-related outage.</p>
<ul>
<li>Run at least two replicas with a PodDisruptionBudget and a PriorityClass, spread across zones, and never only on nodes that themselves depend on the CRD.</li>
<li>Size for bursts: since 1.37 the API server decodes the watch cache's initial load concurrently and can send about ten conversion requests at once.</li>
<li>Keep TLS healthy: <code>spec.conversion.webhook.clientConfig.caBundle</code> is usually injected by cert-manager's CA injector (<code>cert-manager.io/inject-ca-from</code>); an expired serving certificate makes the type unreadable.</li>
<li>Conversions must be lossless round trips that neither default nor validate; test them with fuzzed round trips (v1 → v1alpha1 → v1 must be identity).</li>
<li>Uninstall in the right order: the webhook must outlive the objects that need it, or deleting the CRD hangs.</li>
</ul>
<p>Rules for evolving a CRD safely: add optional fields freely; never change the meaning or type of an existing field within a version; never remove a version that clients or stored objects still use; use a new version for incompatible changes; and treat the CRD as a public API with a deprecation policy, because other teams will build on it.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Typos silently pruned</strong>: <code>spec.namspaces</code> disappears; enable strict field validation in clients.</li>
<li><strong>No status subresource</strong>: users can write status, and every status write bumps generation.</li>
<li><strong>Huge objects</strong> (approaching the 1.5 MB etcd limit) or CRDs used as a database with thousands of writes per second.</li>
<li><strong>Breaking changes within a version</strong>, or removing a served version before migrating storage.</li>
<li><strong>Uninstalling a CRD</strong>: it deletes every object of that type, cluster-wide.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Immutable field</summary><p>Write a CEL rule that makes <code>spec.region</code> immutable once set.</p><p><em>Answer:</em> on the field: <code>x-kubernetes-validations: [{rule: "self == oldSelf", message: "region is immutable"}]</code>; transition rules on a field only run when the field exists in both old and new objects, so also forbid removal with a rule on <code>spec</code>: <code>{rule: "!has(oldSelf.region) || has(self.region)", message: "region cannot be removed once set"}</code>.</p></details>
<details><summary>Cluster or namespaced?</summary><p>Why is Tenant cluster-scoped, and what would change if it were namespaced?</p><p><em>Answer:</em> it creates and owns namespaces, which are cluster-scoped, and must not be editable by the tenant itself. A namespaced Tenant could not own Namespace objects (owners must be cluster-scoped or in the same namespace) and would be controlled by whoever can write in its namespace.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Install and break it</summary><p>Apply the Tenant CRD in kind, then try invalid objects: a downgrade, an uppercase namespace, eleven namespaces. Read each error, then create a valid one and list it with printer columns.</p><p><em>Answer:</em> schema errors and CEL messages appear in the kubectl response; the valid object shows defaults applied.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Plan a version change</summary><p>You must replace <code>spec.quota.cpu</code> (string) with <code>spec.quota.cpuCores</code> (integer). Write the plan: versions, conversion, storage migration, client communication, and when v1 can be removed.</p><p><em>Answer:</em> add v2 with the new field and conversion through a hub; make v2 the storage version; run StorageVersionMigration and then trim <code>status.storedVersions</code>; update clients and charts; mark v1 deprecated (a <code>deprecationWarning</code> on the version); stop serving it after the announced period; remove it once no stored objects or clients use it.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can design a CRD with a structural schema, defaults and the status subresource.</li>
<li>I can write CEL validation rules, including transition rules with oldSelf.</li>
<li>I can add printer columns, short names, categories and selectable fields.</li>
<li>I can evolve a CRD across versions with conversion and storage migration.</li>
</ul>
`});

FIG.wq = host => {
  host.innerHTML = `<div class="tool"><p class="meta" style="margin:0 0 8px">A workqueue with one worker. Generate events and run the worker; watch de-duplication, the dirty set and rate-limited retries.</p><div class="btns"><button type="button" class="act" data-a="ev" data-k="payments">event: payments</button><button type="button" class="act" data-a="ev" data-k="risk">event: risk</button><button type="button" class="act" data-a="get">worker: Get</button><button type="button" class="act" data-a="ok">worker: success (Forget, Done)</button><button type="button" class="act" data-a="fail">worker: error (AddRateLimited, Done)</button><button type="button" class="act" data-a="tick">time passes</button><button type="button" class="act" data-a="reset">reset</button></div><div id="wq-fig"></div><div class="out" id="wq-out"></div></div>`;
  let q, proc, dirty, wait, fails, log, now;
  const reset = () => { q = []; proc = null; dirty = new Set(); wait = []; fails = {}; log = []; now = 0; };
  const add = k => { if (proc === k) { dirty.add(k); log.push(`add ${k}: being processed, marked dirty (will be re-queued after Done)`); return; } if (q.includes(k)) { log.push(`add ${k}: already queued, de-duplicated`); return; } q.push(k); dirty.add(k); log.push(`add ${k}: queued`); };
  const draw = () => {
    let s = tx(8, 14, 'queue', 'tm', 'start') + tx(250, 14, 'processing', 'tm', 'start') + tx(400, 14, 'waiting (back-off)', 'tm', 'start');
    q.forEach((k, i) => s += pod(8 + i * 76, 24, k, 'acc', 70));
    if (proc) s += pod(250, 24, proc, 'hot', 80);
    wait.forEach((w, i) => s += pod(400 + i * 116, 24, `${w.k} in ${w.at - now}s`, 'warn', 110));
    host.querySelector('#wq-fig').innerHTML = `<div class="stage">${svgw(650, 58, s, 'Workqueue state')}</div>`;
    host.querySelector('#wq-out').innerHTML = `dirty set: {${[...dirty].join(', ')}} · failures: ${Object.entries(fails).map(([k, v]) => k + '=' + v).join(', ') || 'none'}<br>` + log.slice(-5).map(esc).join('<br>');
  };
  host.querySelector('.btns').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const a = b.dataset.a;
    if (a === 'reset') reset();
    if (a === 'ev') add(b.dataset.k);
    if (a === 'get') { if (proc) log.push('the single worker is busy'); else if (!q.length) log.push('Get blocks: queue empty'); else { proc = q.shift(); dirty.delete(proc); log.push(`Get → ${proc}`); } }
    if ((a === 'ok' || a === 'fail') && proc) {
      const k = proc;
      if (a === 'ok') { delete fails[k]; log.push(`${k}: reconciled; Forget resets its back-off`); }
      else { fails[k] = (fails[k] || 0) + 1; const d = 5 * 2 ** (fails[k] - 1); const ex = wait.find(w => w.k === k); if (ex) ex.at = Math.min(ex.at, now + d); else wait.push({ k, at: now + d }); log.push(`${k}: error #${fails[k]}; AddRateLimited, retry in ${d}s (real default: 5 ms doubling to 1000 s)`); }

    draw();
  });
  reset(); draw();
};

CH.push({
  id: 'ch24', n: 24, title: 'How Controllers Work: client-go Internals',
  lede: 'Every controller in Kubernetes, from the Deployment controller to the operator you are about to write, is built from the same parts: informers that keep a local cache in sync with the API server, a work queue that turns events into deduplicated keys, workers that reconcile one key at a time, and leader election so only one replica acts. Understand these and every controller becomes readable.',
  html: `
<h2>The architecture</h2>
${fig('informer', '<b>Figure 24.1</b> Step through: from a change in the API server to your reconcile function.')}
<p>Three ideas carry most of the weight:</p>
<ul>
<li><b>The cache is the source of reads.</b> Controllers read from a local, eventually consistent copy, so they can afford to read everything on every reconcile without loading the API server. The cost: the cache may briefly lag your own writes.</li>
<li><b>Events become keys.</b> Handlers do not act on events; they enqueue the object's key. The worker then reads the current state. This is what makes a controller level-triggered.</li>
<li><b>One key, one worker.</b> The queue never hands the same key to two workers, so you need no locking per object, and you can run several workers for different objects.</li>
</ul>

<h2>Informers in code</h2>
${G('Watching Deployments with a shared informer (client-go v0.37)')`
package main

import (
	"context"
	"log/slog"
	"os"
	"os/signal"
	"time"

	appsv1 "k8s.io/api/apps/v1"
	apierrors "k8s.io/apimachinery/pkg/api/errors"
	"k8s.io/client-go/informers"
	"k8s.io/client-go/kubernetes"
	"k8s.io/client-go/tools/cache"
	"k8s.io/client-go/tools/clientcmd"
	"k8s.io/client-go/util/workqueue"
)

func main() {
	ctx, stop := signal.NotifyContext(context.Background(), os.Interrupt)
	defer stop() // Ctrl-C ends the loop below, so the deferred ShutDown runs
	cfg, err := clientcmd.BuildConfigFromFlags("", clientcmd.RecommendedHomeFile)
	if err != nil {
		panic(err)
	}
	cs := kubernetes.NewForConfigOrDie(cfg)

	// One factory per process: informers for the same type are shared by all controllers.
	factory := informers.NewSharedInformerFactory(cs, 10*time.Minute) // resync period
	deployments := factory.Apps().V1().Deployments()

	queue := workqueue.NewTypedRateLimitingQueueWithConfig(
		workqueue.DefaultTypedControllerRateLimiter[cache.ObjectName](),
		workqueue.TypedRateLimitingQueueConfig[cache.ObjectName]{Name: "deployments"},
	)
	defer queue.ShutDown()

	enqueue := func(obj any) {
		// Handles tombstones (DeletedFinalStateUnknown) for deletes missed during a disconnect.
		if key, err := cache.DeletionHandlingObjectToName(obj); err == nil {
			queue.Add(key) // a typed {Namespace, Name}
		}
	}
	_, _ = deployments.Informer().AddEventHandler(cache.ResourceEventHandlerFuncs{
		AddFunc:    enqueue,
		UpdateFunc: func(_, newObj any) { enqueue(newObj) },
		DeleteFunc: enqueue,
	})

	factory.Start(ctx.Done())
	if !cache.WaitForCacheSync(ctx.Done(), deployments.Informer().HasSynced) {
		panic("cache did not sync")
	}

	lister := deployments.Lister()
	for {
		key, shutdown := queue.Get()
		if shutdown {
			return
		}
		d, err := lister.Deployments(key.Namespace).Get(key.Name) // from the cache, not the API server
		switch {
		case apierrors.IsNotFound(err):
			slog.Info("gone", "key", key.String()) // deleted: clean up anything we track for it
		case err != nil:
			queue.AddRateLimited(key) // unexpected: retry with back-off
			queue.Done(key)
			continue
		default:
			report(d)
		}
		queue.Forget(key)
		queue.Done(key)
	}
}

func report(d *appsv1.Deployment) {
	slog.Info("deployment", "key", d.Namespace+"/"+d.Name,
		"generation", d.Generation, "observed", d.Status.ObservedGeneration,
		"ready", d.Status.ReadyReplicas)
}`}
<p>A <b>resync</b> re-delivers every cached object to the handlers periodically. It does not re-list from the API server; it exists so controllers that act on external systems revisit every object now and then. Many controllers set it to zero and instead requeue explicitly when they need to poll something.</p>

<h2>The workqueue</h2>
${fig('wq', '<b>Figure 24.2</b> Interactive: a rate-limited workqueue with de-duplication, the dirty set and back-off.')}
<p>The default controller rate limiter combines per-item exponential back-off (5 ms doubling up to 1,000 s) with an overall token bucket (10 per second, burst 100). A permanently failing object therefore settles into a retry about every 17 minutes (1,000 s) instead of spinning. Return errors for things that may succeed on retry; do not return errors for invalid input that only a user can fix (record it in status instead).</p>

<h2>Caches and their consistency</h2>
<p>Because writes go to the API server and reads come from the cache, a controller can read its own write back stale: create a child object, reconcile again a moment later, not see the child in the cache, and create a duplicate. Defences:</p>
<ul>
<li><b>Deterministic names</b> for child objects (<code>tenant-payments-quota</code>), so a duplicate create fails with AlreadyExists instead of creating a twin.</li>
<li><b>Server-side apply</b> for children: applying the same desired object twice is harmless.</li>
<li><b>Expectations</b>, as the built-in ReplicaSet controller does: remember how many creates you issued and wait to observe them before acting again.</li>
<li>Newer platform help: controller-runtime v0.25 can make cached reads wait for your own writes (experimental; opt in with <code>client.Options{Cache: &amp;client.CacheOptions{EnableReadYourWritesConsistency: ptr.To(true)}}</code>, opt out per call with <code>client.DisableReadYourWritesConsistency</code>), and Kubernetes added stale-controller mitigation for built-in controllers (alpha in 1.36, beta in 1.37), which requeues until the informer has caught up with the controller's own writes.</li>
</ul>
<p>Informers also cost memory: every object of every watched type, in every namespace you watch. The controls, cheapest first:</p>
<ul>
<li><b>Filter at the source</b>: <code>informers.NewSharedInformerFactoryWithOptions(cs, 0, informers.WithNamespace(ns), informers.WithTweakListOptions(func(o *metav1.ListOptions) { o.LabelSelector = "app.kubernetes.io/managed-by=tenant-operator" }))</code>. Objects outside the filter are invisible, so a Get for one returns NotFound.</li>
<li><b>Strip what you do not read</b>: <code>informer.SetTransform(cache.TransformStripManagedFields())</code> before the factory starts; managedFields are often a third or more of an object.</li>
<li><b>Metadata only</b>: <code>k8s.io/client-go/metadata/metadatainformer</code> (in controller-runtime, <code>builder.OnlyMetadata</code>) caches names, labels and owners without spec and status.</li>
<li><b>Streaming start-up</b>: WatchList (on by default since client-go 0.35) fills the cache from a stream instead of one huge LIST, removing the memory spike at start; client-go feature gates can be switched with environment variables such as <code>KUBE_FEATURE_WatchListClient=false</code>.</li>
<li><b>Respect 429s</b>: since 1.37 the API server answers list and watch requests its cache cannot serve with 429 and Retry-After; the reflector backs off, but hand-written LIST loops must too.</li>
</ul>

<h2>Leader election</h2>
${fig('lease', '<b>Figure 24.3</b> Step through: leader election with a Lease, and a failover.')}
<p>Run two or more replicas of a controller for availability, but only one may reconcile, or two leaders fight. client-go's <code>leaderelection</code> package (wrapped by controller-runtime) uses a <code>coordination.k8s.io/v1</code> Lease. Coordinated leader election for control-plane components (beta since 1.33, off by default) prefers the candidate at the right version during upgrades; your own controllers use the classic Lease mechanism.</p>

<h2>Generated clients for custom types</h2>
<p>client-go has typed clients, informers and listers for built-in types. For your CRDs you have three choices: <b>code generation</b> (k8s.io/code-generator produces a typed clientset, informers, listers and apply configurations from your Go types: Chapter 25), the <b>dynamic client</b> with <code>unstructured.Unstructured</code> (no types, works with any resource), or <b>controller-runtime</b>'s generic client, which works with any registered Go type without generated clients (Chapter 26).</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Doing work in event handlers</strong> instead of enqueueing keys.</li>
<li><strong>Acting on the event's object</strong> instead of re-reading the current state from the cache.</li>
<li><strong>Mutating objects from the cache</strong>: they are shared; always <code>DeepCopy()</code> before changing.</li>
<li><strong>Starting workers before the cache has synced</strong>: the controller thinks objects are missing and recreates them.</li>
<li><strong>Several active replicas without leader election.</strong></li>
<li><strong>Watching all Secrets or all Pods cluster-wide</strong> when you need a few: memory and API load.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Ten updates</summary><p>An object is updated ten times in one second while the worker is busy with another key. How many times is it reconciled?</p><p><em>Answer:</em> usually once: the key is queued once and de-duplicated; if it was being processed when an update arrived, once more after Done.</p></details>
<details><summary>Why DeepCopy?</summary><p>What goes wrong if you set a label on an object obtained from a Lister and then call Update?</p><p><em>Answer:</em> you have mutated the shared cache: other controllers see a change that never happened on the server, and if your update fails the cache stays wrong. Always DeepCopy first.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Run the informer</summary><p>Run the program above against kind, scale a Deployment and roll it, and watch generation, observedGeneration and ready counts flow through. Then stop the API server briefly and observe reconnection.</p><p><em>Answer:</em> events arrive within milliseconds; during the outage the reflector logs watch errors and resumes from the last resourceVersion when the server returns, with no re-list if the version is still available.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Add an index</summary><p>Add an indexer to the Deployment informer that indexes by the image of the first container, and list all Deployments running a given image from the cache.</p><p><em>Answer:</em> <code>AddIndexers(cache.Indexers{"image": func(o any) ([]string, error) {…}})</code> before starting, then <code>Informer().GetIndexer().ByIndex("image", img)</code>.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can draw the path from an API change through reflector, FIFO (RealFIFO, formerly DeltaFIFO), indexer, handlers and workqueue to a worker.</li>
<li>I can write a shared informer with handlers that enqueue keys, and a worker loop.</li>
<li>I understand de-duplication, the dirty set and rate-limited retries.</li>
<li>I know how stale caches cause duplicate actions and how to defend against them.</li>
<li>I can explain Lease-based leader election and its failover window.</li>
</ul>
`});

// +groupName=web.example.com

import metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"

// +genclient
// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object

// Website is a site served by a Deployment managed by the website controller.
type Website struct {
	metav1.TypeMeta   \`json:",inline"\`
	metav1.ObjectMeta \`json:"metadata,omitempty"\`

	Spec   WebsiteSpec   \`json:"spec"\`
	Status WebsiteStatus \`json:"status,omitempty"\`
}

type WebsiteSpec struct {
	Image    string \`json:"image"\`
	Replicas *int32 \`json:"replicas,omitempty"\` // pointer: "unset" differs from 0
	Port     int32  \`json:"port"\`
}

type WebsiteStatus struct {
	ObservedGeneration int64              \`json:"observedGeneration,omitempty"\`
	AvailableReplicas  int32              \`json:"availableReplicas"\`
	Conditions         []metav1.Condition \`json:"conditions,omitempty"\`
}

// +k8s:deepcopy-gen:interfaces=k8s.io/apimachinery/pkg/runtime.Object

type WebsiteList struct {
	metav1.TypeMeta \`json:",inline"\`
	metav1.ListMeta \`json:"metadata"\`
	Items           []Website \`json:"items"\`
}`}
<p>(The package comments normally live in <code>doc.go</code>; they are shown together here.) <code>+genclient</code> asks for a typed client; the deepcopy tags generate <code>DeepCopy</code> and <code>DeepCopyObject</code>, which make the type a <code>runtime.Object</code>. Use <code>metav1.Condition</code> for conditions: every tool already understands it.</p>

package v1alpha1

import (
	metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"
	"k8s.io/apimachinery/pkg/runtime"
	"k8s.io/apimachinery/pkg/runtime/schema"
)

var SchemeGroupVersion = schema.GroupVersion{Group: "web.example.com", Version: "v1alpha1"}

func Resource(resource string) schema.GroupResource {
	return SchemeGroupVersion.WithResource(resource).GroupResource()
}

var (
	SchemeBuilder = runtime.NewSchemeBuilder(addKnownTypes)
	AddToScheme   = SchemeBuilder.AddToScheme
)

func addKnownTypes(scheme *runtime.Scheme) error {

package main

import (
	"context"
	"errors"
	"fmt"
	"time"

	appsv1 "k8s.io/api/apps/v1"
	corev1 "k8s.io/api/core/v1"
	"k8s.io/apimachinery/pkg/api/equality"
	apierrors "k8s.io/apimachinery/pkg/api/errors"
	"k8s.io/apimachinery/pkg/api/meta"
	metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"
	"k8s.io/apimachinery/pkg/runtime/schema"
	utilruntime "k8s.io/apimachinery/pkg/util/runtime"
	"k8s.io/apimachinery/pkg/util/wait"
	appsinformers "k8s.io/client-go/informers/apps/v1"
	"k8s.io/client-go/kubernetes"
	"k8s.io/client-go/kubernetes/scheme"
	typedcorev1 "k8s.io/client-go/kubernetes/typed/core/v1"
	appslisters "k8s.io/client-go/listers/apps/v1"
	"k8s.io/client-go/tools/cache"
	"k8s.io/client-go/tools/record"
	"k8s.io/client-go/util/workqueue"
	"k8s.io/klog/v2"

	webv1alpha1 "example.com/website-controller/pkg/apis/web/v1alpha1"
	clientset "example.com/website-controller/pkg/generated/clientset/versioned"
	webscheme "example.com/website-controller/pkg/generated/clientset/versioned/scheme"
	webinformers "example.com/website-controller/pkg/generated/informers/externalversions/web/v1alpha1"
	weblisters "example.com/website-controller/pkg/generated/listers/web/v1alpha1"
)

const agent = "website-controller"

type Controller struct {
	kube     kubernetes.Interface
	web      clientset.Interface
	deploys  appslisters.DeploymentLister
	sites    weblisters.WebsiteLister
	synced   []cache.InformerSynced
	queue    workqueue.TypedRateLimitingInterface[cache.ObjectName]
	recorder record.EventRecorder
}

func NewController(ctx context.Context, kube kubernetes.Interface, web clientset.Interface,
	deployInformer appsinformers.DeploymentInformer, siteInformer webinformers.WebsiteInformer) *Controller {

	// Register our types so events can refer to Websites.
	utilruntime.Must(webscheme.AddToScheme(scheme.Scheme))
	b := record.NewBroadcaster(record.WithContext(ctx))
	b.StartStructuredLogging(0)
	b.StartRecordingToSink(&typedcorev1.EventSinkImpl{Interface: kube.CoreV1().Events("")})

	c := &Controller{
		kube:     kube,
		web:      web,
		deploys:  deployInformer.Lister(),
		sites:    siteInformer.Lister(),
		synced:   []cache.InformerSynced{deployInformer.Informer().HasSynced, siteInformer.Informer().HasSynced},
		queue:    workqueue.NewTypedRateLimitingQueue(workqueue.DefaultTypedControllerRateLimiter[cache.ObjectName]()),
		recorder: b.NewRecorder(scheme.Scheme, corev1.EventSource{Component: agent}),
	}

	// Websites: any change means "look at this Website again".
	_, _ = siteInformer.Informer().AddEventHandler(cache.ResourceEventHandlerFuncs{
		AddFunc:    c.enqueue,
		UpdateFunc: func(_, obj any) { c.enqueue(obj) },
	})
	// Deployments: map a change back to the Website that owns it.
	_, _ = deployInformer.Informer().AddEventHandler(cache.ResourceEventHandlerFuncs{
		AddFunc: c.handleOwned,
		UpdateFunc: func(oldObj, newObj any) {
			if oldObj.(*appsv1.Deployment).ResourceVersion == newObj.(*appsv1.Deployment).ResourceVersion {
				return // periodic resync: nothing changed
			}
			c.handleOwned(newObj)
		},
		DeleteFunc: c.handleOwned, // someone deleted our Deployment: recreate it
	})
	return c
}

func (c *Controller) enqueue(obj any) {
	if ref, err := cache.ObjectToName(obj); err == nil {
		c.queue.Add(ref)
	}
}

func (c *Controller) handleOwned(obj any) {
	object, ok := obj.(metav1.Object)
	if !ok {
		tomb, ok := obj.(cache.DeletedFinalStateUnknown)
		if !ok {
			return
		}
		if object, ok = tomb.Obj.(metav1.Object); !ok {
			return
		}
	}
	owner := metav1.GetControllerOf(object)
	if owner == nil || owner.Kind != "Website" {
		return
	}
	// Compare the group only: owner references keep the version they were written with.
	if gv, err := schema.ParseGroupVersion(owner.APIVersion); err != nil || gv.Group != webv1alpha1.SchemeGroupVersion.Group {
		return
	}
	site, err := c.sites.Websites(object.GetNamespace()).Get(owner.Name)
	if err != nil {
		return // owner already gone; the garbage collector handles the child
	}
	c.enqueue(site)
}`}
${G('controller.go: workers')`
func (c *Controller) Run(ctx context.Context, workers int) error {
	defer utilruntime.HandleCrash()
	defer c.queue.ShutDown()
	logger := klog.FromContext(ctx)

	logger.Info("waiting for caches")
	if !cache.WaitForCacheSync(ctx.Done(), c.synced...) {
		return fmt.Errorf("caches did not sync")
	}
	for range workers {
		go wait.UntilWithContext(ctx, c.runWorker, time.Second)
	}
	logger.Info("started", "workers", workers)
	<-ctx.Done()
	return nil
}

func (c *Controller) runWorker(ctx context.Context) {
	for c.next(ctx) {
	}
}

func (c *Controller) next(ctx context.Context) bool {
	ref, shutdown := c.queue.Get()
	if shutdown {
		return false
	}
	defer c.queue.Done(ref)

	if err := c.sync(ctx, ref); err != nil {
		utilruntime.HandleErrorWithContext(ctx, err, "sync failed, will retry", "website", ref)
		c.queue.AddRateLimited(ref)
		return true
	}
	c.queue.Forget(ref)
	return true
}`}
${fig('syncflow', '<b>Figure 25.1</b> Interactive: the decision path through <code>sync</code> in five situations.')}
${G('controller.go: reconciling one Website')`
func (c *Controller) sync(ctx context.Context, ref cache.ObjectName) error {
	site, err := c.sites.Websites(ref.Namespace).Get(ref.Name)
	if apierrors.IsNotFound(err) {
		return nil // deleted: owner references take care of the Deployment
	}
	if err != nil {
		return err
	}

	want := desiredDeployment(site)
	dep, err := c.deploys.Deployments(site.Namespace).Get(want.Name)
	if apierrors.IsNotFound(err) {
		dep, err = c.kube.AppsV1().Deployments(site.Namespace).Create(ctx, want, metav1.CreateOptions{FieldManager: agent})
	}
	if err != nil {
		return err // includes AlreadyExists if our cache was stale: retry and see it next time
	}

	if !metav1.IsControlledBy(dep, site) {
		msg := fmt.Sprintf("Deployment %s exists and is not managed by this Website", dep.Name)
		c.recorder.Event(site, corev1.EventTypeWarning, "ResourceExists", msg)
		s := site.DeepCopy() // record it where users look: Available=False, reason ResourceExists
		meta.SetStatusCondition(&s.Status.Conditions, metav1.Condition{Type: "Available", Status: metav1.ConditionFalse,
			Reason: "ResourceExists", Message: msg, ObservedGeneration: site.Generation})
		_, _ = c.web.WebV1alpha1().Websites(s.Namespace).UpdateStatus(ctx, s, metav1.UpdateOptions{FieldManager: agent})
		return errors.New(msg) // retried: nothing else would re-enqueue the Website (see the pitfalls)
	}

	if drifted(dep, want) {
		upd := dep.DeepCopy() // never modify objects from the cache
		upd.Spec.Replicas = want.Spec.Replicas
		upd.Spec.Template.Spec.Containers[0].Image = want.Spec.Template.Spec.Containers[0].Image
		upd.Spec.Template.Spec.Containers[0].Ports = want.Spec.Template.Spec.Containers[0].Ports
		if dep, err = c.kube.AppsV1().Deployments(site.Namespace).Update(ctx, upd, metav1.UpdateOptions{FieldManager: agent}); err != nil {
			return err // a 409 Conflict lands here and is retried with fresh data
		}
		c.recorder.Eventf(site, corev1.EventTypeNormal, "Updated", "updated Deployment %s", dep.Name)
	}
	return c.updateStatus(ctx, site, dep)
}

// Compare only the fields we own. Comparing whole specs would loop forever on server-side defaults.
func drifted(have, want *appsv1.Deployment) bool {
	h, w := have.Spec.Template.Spec.Containers, want.Spec.Template.Spec.Containers
	return *have.Spec.Replicas != *want.Spec.Replicas || len(h) == 0 ||
		h[0].Image != w[0].Image || !equality.Semantic.DeepEqual(h[0].Ports, w[0].Ports)
}

func (c *Controller) updateStatus(ctx context.Context, site *webv1alpha1.Website, dep *appsv1.Deployment) error {
	s := site.DeepCopy()
	s.Status.ObservedGeneration = site.Generation
	s.Status.AvailableReplicas = dep.Status.AvailableReplicas

	cond := metav1.Condition{Type: "Available", Status: metav1.ConditionFalse, Reason: "Progressing",
		Message: fmt.Sprintf("%d of %d replicas available", dep.Status.AvailableReplicas, *dep.Spec.Replicas),
		ObservedGeneration: site.Generation}
	if dep.Status.ObservedGeneration >= dep.Generation && dep.Status.AvailableReplicas >= *dep.Spec.Replicas {
		cond.Status, cond.Reason = metav1.ConditionTrue, "MinimumReplicasAvailable"
	}
	meta.SetStatusCondition(&s.Status.Conditions, cond) // sets lastTransitionTime only on change

	if equality.Semantic.DeepEqual(s.Status, site.Status) {
		return nil // no write if nothing changed: avoids pointless API traffic and events
	}
	_, err := c.web.WebV1alpha1().Websites(s.Namespace).UpdateStatus(ctx, s, metav1.UpdateOptions{FieldManager: agent})
	return err
}

func desiredDeployment(site *webv1alpha1.Website) *appsv1.Deployment {
	labels := map[string]string{
		"app.kubernetes.io/name":       "website",
		"app.kubernetes.io/instance":   site.Name,
		"app.kubernetes.io/managed-by": agent,
	}
	replicas := int32(2)
	if site.Spec.Replicas != nil {
		replicas = *site.Spec.Replicas
	}
	return &appsv1.Deployment{
		ObjectMeta: metav1.ObjectMeta{
			Name:      site.Name + "-web", // deterministic: a stale-cache duplicate create fails
			Namespace: site.Namespace,
			Labels:    labels,
			OwnerReferences: []metav1.OwnerReference{
				*metav1.NewControllerRef(site, webv1alpha1.SchemeGroupVersion.WithKind("Website")),
			},
		},
		Spec: appsv1.DeploymentSpec{
			Replicas: &replicas,
			Selector: &metav1.LabelSelector{MatchLabels: labels},
			Template: corev1.PodTemplateSpec{
				ObjectMeta: metav1.ObjectMeta{Labels: labels},
				Spec: corev1.PodSpec{Containers: []corev1.Container{{
					Name:  "web",
					Image: site.Spec.Image,
					Ports: []corev1.ContainerPort{{Name: "http", ContainerPort: site.Spec.Port, Protocol: corev1.ProtocolTCP}},
				}}},
			},
		},
	}
}`}
<h2>Step 4: main</h2>
${G('main.go')`
package main

import (
	"context"
	"flag"
	"os"
	"os/signal"
	"syscall"

	metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"
	kubeinformers "k8s.io/client-go/informers"
	"k8s.io/client-go/kubernetes"
	"k8s.io/client-go/tools/clientcmd"
	"k8s.io/klog/v2"

	clientset "example.com/website-controller/pkg/generated/clientset/versioned"
	informers "example.com/website-controller/pkg/generated/informers/externalversions"
)

func main() {
	klog.InitFlags(nil)
	kubeconfig := flag.String("kubeconfig", "", "path to kubeconfig; empty means in-cluster")
	flag.Parse()

	ctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)
	defer stop()
	logger := klog.FromContext(ctx)

	cfg, err := clientcmd.BuildConfigFromFlags("", *kubeconfig)
	if err != nil {
		logger.Error(err, "building config")
		os.Exit(1)
	}
	cfg.QPS, cfg.Burst = 20, 40 // client-side rate limits; the server applies APF on top

	kube := kubernetes.NewForConfigOrDie(cfg)
	web := clientset.NewForConfigOrDie(cfg)
	// Cache only the Deployments this controller manages, not every Deployment in the cluster.
	// (Side effect: a Deployment someone unlabels looks deleted, and re-creating it hits AlreadyExists.)
	kubeFactory := kubeinformers.NewSharedInformerFactoryWithOptions(kube, 0,
		kubeinformers.WithTweakListOptions(func(o *metav1.ListOptions) {
			o.LabelSelector = "app.kubernetes.io/managed-by=" + agent
		}))
	webFactory := informers.NewSharedInformerFactory(web, 0)

	c := NewController(ctx, kube, web,
		kubeFactory.Apps().V1().Deployments(),
		webFactory.Web().V1alpha1().Websites())

	kubeFactory.Start(ctx.Done()) // informers requested above start now
	webFactory.Start(ctx.Done())
	defer kubeFactory.Shutdown() // wait for informer goroutines on exit
	defer webFactory.Shutdown()
	if err := c.Run(ctx, 2); err != nil {
		logger.Error(err, "controller stopped")
		os.Exit(1)
	}
}`}

<h2>What this taught, and what is still missing</h2>
<p>You have written by hand: scheme registration, informers and listers, a typed queue, event handlers mapping owned objects back to owners, worker loops, idempotent create-or-update, owner references, events and status conditions. Not yet handled: leader election, metrics and health endpoints, finalizers for external clean-up, webhooks, tests and packaging. controller-runtime and kubebuilder provide all of those, which is why Chapter 26 switches to them.</p>
<div class="note key"><b>Why update only owned fields?</b><p>The API server defaults many Deployment fields (strategy, revisionHistoryLimit, termination grace periods, image pull policy). A naive "compare my whole desired spec with the live one" always sees a difference, updates, triggers a watch event and reconciles again: a hot loop. Compare only fields you set, or better, use server-side apply, which merges by field ownership and makes this problem disappear (Chapter 26).</p></div>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Comparing whole specs</strong> and fighting server-side defaults.</li>
<li><strong>Random or generated child names</strong>: stale caches then create duplicates.</li>
<li><strong>Taking over objects you did not create</strong>; check <code>IsControlledBy</code>.</li>
<li><strong>Writing status on every pass</strong> even when unchanged.</li>
<li><strong>Forgetting the status subresource RBAC</strong> (<code>websites/status</code>).</li>
<li><strong>Returning errors for invalid user input</strong>, which retries forever; report it in a condition instead. The name clash in <code>sync</code> is the deliberate exception: our handler ignores Deployments we do not control, so nothing would re-enqueue the Website when the foreign Deployment disappears; it records a condition and returns an error to be retried with back-off.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Why map Deployment events?</summary><p>What would break if the controller watched only Websites?</p><p><em>Answer:</em> it would not notice when its Deployment is changed or deleted by someone else, or when the Deployment's status changes, so drift would persist and status would go stale until the next Website change or resync.</p></details>
<details><summary>Pointer replicas</summary><p>Why is <code>Replicas</code> a pointer in the spec?</p><p><em>Answer:</em> so the controller can tell "not set, use the default of 2" from "explicitly 0"; with a plain int32 both are 0.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Add a Service</summary><p>Extend the controller to also create a Service <code>docs-web</code> selecting the Pods on the named port, owned by the Website, and to write the in-cluster URL into <code>status.url</code>. Watch Services too.</p><p><em>Answer:</em> add a Service informer and lister, a <code>desiredService</code> function, create-if-missing with the same ownership check, compare only ports and selector, map Service events with <code>handleOwned</code>, and grant Service RBAC.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Switch to server-side apply</summary><p>Replace create-and-update with a single <code>Apply</code> using the generated apply configurations (<code>appsv1ac.Deployment(name, ns).WithSpec(…)</code>) and <code>metav1.ApplyOptions{FieldManager: agent, Force: true}</code>. What code disappears, and what new behaviour do you get when a human edits a field you own?</p><p><em>Answer:</em> the get, diff and update logic disappears; apply is idempotent. A human edit to a field you own is overwritten on the next reconcile (Force); fields you do not set (an annotation someone adds) are left alone.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can define API types with code-generation tags and register them in a scheme.</li>
<li>I can generate a typed clientset, informers and listers for a CRD.</li>
<li>I can write a controller with handlers that map owned objects to owners, rate-limited workers and an idempotent sync.</li>
<li>I can report status conditions with observedGeneration and record events.</li>
</ul>
`});

<p>Run <code>make manifests</code> and controller-gen turns these markers into the CRD of Chapter 23 (<code>config/crd/bases/platform.example.com_tenants.yaml</code>), and RBAC markers in the controller into <code>config/rbac/role.yaml</code>. <code>make generate</code> writes the deep-copy functions. The Go types are the single source of truth.</p>
<p>Three API conventions are easy to get wrong in these types and expensive to fix after release. Mark every field <code>+required</code> or <code>+optional</code> explicitly, since controller-gen's default depends on the JSON tag and readers should not have to work it out. Use <code>omitzero</code> (Go 1.24) for struct-valued optional fields such as <code>Quota</code>, because <code>omitempty</code> never omits a struct. And use a pointer when "not set" and "set to zero" mean different things (a quota of 0 CPU is not the same as no quota). The Kubernetes project's kube-api-linter, run as a golangci-lint plugin, checks these rules and others in CI.</p>

<h2>The reconciler</h2>
${G('internal/controller/tenant_controller.go (part 1: setup)')`
package controller

import (
	"context"
	"fmt"

	corev1 "k8s.io/api/core/v1"
	networkingv1 "k8s.io/api/networking/v1"
	rbacv1 "k8s.io/api/rbac/v1"
	"k8s.io/apimachinery/pkg/api/equality"
	apierrors "k8s.io/apimachinery/pkg/api/errors"
	"k8s.io/apimachinery/pkg/api/meta"
	"k8s.io/apimachinery/pkg/api/resource"
	metav1 "k8s.io/apimachinery/pkg/apis/meta/v1"
	"k8s.io/apimachinery/pkg/runtime"
	"k8s.io/apimachinery/pkg/types"
	"k8s.io/apimachinery/pkg/util/intstr"
	corev1ac "k8s.io/client-go/applyconfigurations/core/v1"
	metav1ac "k8s.io/client-go/applyconfigurations/meta/v1"
	netv1ac "k8s.io/client-go/applyconfigurations/networking/v1"
	rbacv1ac "k8s.io/client-go/applyconfigurations/rbac/v1"
	"k8s.io/utils/ptr"
	ctrl "sigs.k8s.io/controller-runtime"
	"sigs.k8s.io/controller-runtime/pkg/builder"
	"sigs.k8s.io/controller-runtime/pkg/client"
	"sigs.k8s.io/controller-runtime/pkg/handler"
	logf "sigs.k8s.io/controller-runtime/pkg/log"
	"sigs.k8s.io/controller-runtime/pkg/predicate"
	"sigs.k8s.io/controller-runtime/pkg/reconcile"

	platformv1 "example.com/tenant-operator/api/v1"
)

const (
	fieldOwner  = "tenant-operator"
	tenantLabel = "platform.example.com/tenant"
)

type TenantReconciler struct {
	client.Client
	Scheme *runtime.Scheme
}

// +kubebuilder:rbac:groups=platform.example.com,resources=tenants,verbs=get;list;watch;update;patch
// +kubebuilder:rbac:groups=platform.example.com,resources=tenants/status,verbs=get;update;patch
// +kubebuilder:rbac:groups=platform.example.com,resources=tenants/finalizers,verbs=update
// +kubebuilder:rbac:groups="",resources=namespaces;resourcequotas;limitranges,verbs=get;list;watch;create;update;patch;delete
// +kubebuilder:rbac:groups=networking.k8s.io,resources=networkpolicies,verbs=get;list;watch;create;update;patch;delete
// +kubebuilder:rbac:groups=rbac.authorization.k8s.io,resources=rolebindings,verbs=get;list;watch;create;update;patch;delete
// +kubebuilder:rbac:groups=rbac.authorization.k8s.io,resources=clusterroles,verbs=bind,resourceNames=admin

func (r *TenantReconciler) SetupWithManager(mgr ctrl.Manager) error {
	return ctrl.NewControllerManagedBy(mgr).
		For(&platformv1.Tenant{}, builder.WithPredicates(predicate.GenerationChangedPredicate{})).
		Owns(&corev1.ResourceQuota{}).
		Owns(&corev1.LimitRange{}).
		Owns(&rbacv1.RoleBinding{}).
		Owns(&networkingv1.NetworkPolicy{}).
		Watches(&corev1.Namespace{}, handler.EnqueueRequestsFromMapFunc(
			func(_ context.Context, o client.Object) []reconcile.Request {
				if name := o.GetLabels()[tenantLabel]; name != "" {
					return []reconcile.Request{{NamespacedName: types.NamespacedName{Name: name}}}
				}
				return nil
			})).
		Named("tenant").
		Complete(r)
}`}
${fig('watchmap', '<b>Figure 26.2</b> Interactive: how events on the Tenant, its owned objects and related namespaces become reconcile requests.')}
${G('internal/controller/tenant_controller.go (part 2: Reconcile)')`
func (r *TenantReconciler) Reconcile(ctx context.Context, req ctrl.Request) (ctrl.Result, error) {
	log := logf.FromContext(ctx)

	var t platformv1.Tenant
	if err := r.Get(ctx, req.NamespacedName, &t); err != nil {
		return ctrl.Result{}, client.IgnoreNotFound(err) // deleted: owned objects are garbage-collected
	}
	orig := t.DeepCopy() // status patches are computed against this snapshot
	// Chapter 27 adds finalizer handling here.

	owner := metav1ac.OwnerReference().
		WithAPIVersion(platformv1.GroupVersion.String()).WithKind("Tenant").
		WithName(t.Name).WithUID(t.UID).
		WithController(true).WithBlockOwnerDeletion(true)

	var conflicts []string
	for _, ns := range t.Spec.Namespaces {
		// Never take over a namespace another tenant (or nobody) already holds:
		// every Tenant shares one field manager, so apply alone would not object.
		var cur corev1.Namespace
		err := r.Get(ctx, client.ObjectKey{Name: ns}, &cur)
		switch {
		case err == nil && cur.Labels[tenantLabel] != t.Name:
			conflicts = append(conflicts, ns) // another tenant's, or pre-existing and unclaimed
			continue
		case err != nil && !apierrors.IsNotFound(err):
			return ctrl.Result{}, err
		}
		for _, obj := range desiredObjects(&t, ns, owner) {
			// Server-side apply: declare the fields we own; idempotent; no get-compare-update.
			if err := r.Apply(ctx, obj, client.FieldOwner(fieldOwner), client.ForceOwnership); err != nil {
				err = fmt.Errorf("namespace %s: %w", ns, err) // returned errors are logged by controller-runtime
				return ctrl.Result{}, r.setReady(ctx, &t, orig, metav1.ConditionFalse, "ApplyFailed", err.Error(), err)
			}
		}
	}
	if len(conflicts) > 0 {
		log.Info("namespaces held by someone else", "namespaces", conflicts)
		return ctrl.Result{}, r.setReady(ctx, &t, orig, metav1.ConditionFalse, "NamespaceConflict",
			fmt.Sprintf("namespaces already in use: %v", conflicts), nil)
	}
	return ctrl.Result{}, r.setReady(ctx, &t, orig, metav1.ConditionTrue, "Reconciled",
		fmt.Sprintf("%d namespaces configured", len(t.Spec.Namespaces)), nil)
}

// setReady records the outcome in status and returns cause, so a failure is retried with back-off.
func (r *TenantReconciler) setReady(ctx context.Context, t, orig *platformv1.Tenant,
	status metav1.ConditionStatus, reason, msg string, cause error) error {

	before := orig // the object as read, so every status change made during this reconcile is sent
	t.Status.ObservedGeneration = t.Generation
	t.Status.Namespaces = t.Spec.Namespaces
	meta.SetStatusCondition(&t.Status.Conditions, metav1.Condition{
		Type: "Ready", Status: status, Reason: reason, Message: msg, ObservedGeneration: t.Generation,
	})
	if !equality.Semantic.DeepEqual(before.Status, t.Status) {
		if err := r.Status().Patch(ctx, t, client.MergeFrom(before)); err != nil {
			return err
		}
	}
	return cause
}`}
${G('internal/controller/tenant_controller.go (part 3: desired state)')`
func desiredObjects(t *platformv1.Tenant, ns string, owner *metav1ac.OwnerReferenceApplyConfiguration) []runtime.ApplyConfiguration {
	level := "baseline"
	if t.Spec.Tier == "regulated" {
		level = "restricted"
	}
	objs := []runtime.ApplyConfiguration{
		// Labelled, not owned: deleting a Tenant must not silently delete workloads (Chapter 27).
		corev1ac.Namespace(ns).WithLabels(map[string]string{
			tenantLabel:                          t.Name,
			"pod-security.kubernetes.io/enforce": level,
			"pod-security.kubernetes.io/warn":    "restricted",
		}),
		corev1ac.ResourceQuota("tenant-quota", ns).WithOwnerReferences(owner).
			WithSpec(corev1ac.ResourceQuotaSpec().WithHard(corev1.ResourceList{
				// The API server has defaulted these; Deref guards objects created before the defaults existed.
				corev1.ResourceRequestsCPU:    ptr.Deref(t.Spec.Quota.CPU, resource.MustParse("8")),
				corev1.ResourceRequestsMemory: ptr.Deref(t.Spec.Quota.Memory, resource.MustParse("16Gi")),
				corev1.ResourcePods:           *resource.NewQuantity(int64(ptr.Deref(t.Spec.Quota.Pods, 100)), resource.DecimalSI),
			})),
		corev1ac.LimitRange("tenant-defaults", ns).WithOwnerReferences(owner).
			WithSpec(corev1ac.LimitRangeSpec().WithLimits(corev1ac.LimitRangeItem().
				WithType(corev1.LimitTypeContainer).
				WithDefaultRequest(corev1.ResourceList{corev1.ResourceCPU: resource.MustParse("100m"), corev1.ResourceMemory: resource.MustParse("128Mi")}).
				WithDefault(corev1.ResourceList{corev1.ResourceMemory: resource.MustParse("256Mi")}))),
		rbacv1ac.RoleBinding("tenant-admins", ns).WithOwnerReferences(owner).
			WithRoleRef(rbacv1ac.RoleRef().WithAPIGroup(rbacv1.GroupName).WithKind("ClusterRole").WithName("admin")).
			WithSubjects(groups(t.Spec.AdminGroups)...),
	}
	if t.Spec.NetworkIsolation == nil || *t.Spec.NetworkIsolation {
		dns := netv1ac.NetworkPolicyEgressRule().
			WithTo(netv1ac.NetworkPolicyPeer().
				WithNamespaceSelector(metav1ac.LabelSelector().WithMatchLabels(map[string]string{"kubernetes.io/metadata.name": "kube-system"})).
				WithPodSelector(metav1ac.LabelSelector().WithMatchLabels(map[string]string{"k8s-app": "kube-dns"}))).
			WithPorts(
				netv1ac.NetworkPolicyPort().WithProtocol(corev1.ProtocolUDP).WithPort(intstr.FromInt32(53)),
				netv1ac.NetworkPolicyPort().WithProtocol(corev1.ProtocolTCP).WithPort(intstr.FromInt32(53)))
		objs = append(objs, netv1ac.NetworkPolicy("default-deny", ns).WithOwnerReferences(owner).
			WithSpec(netv1ac.NetworkPolicySpec().
				WithPodSelector(metav1ac.LabelSelector()).
				WithPolicyTypes(networkingv1.PolicyTypeIngress, networkingv1.PolicyTypeEgress).
				WithEgress(dns)))
	}
	return objs
}

func groups(names []string) []*rbacv1ac.SubjectApplyConfiguration {
	out := make([]*rbacv1ac.SubjectApplyConfiguration, 0, len(names))
	for _, g := range names {
		out = append(out, rbacv1ac.Subject().WithKind(rbacv1.GroupKind).WithAPIGroup(rbacv1.GroupName).WithName(g))
	}
	return out
}`}
<div class="note pit"><b>Two traps in this design</b><p><b>Nested defaults.</b> Structural defaulting fills in fields only inside objects that are present. Without <code>+kubebuilder:default={}</code> on <code>quota</code>, a Tenant that omits it would get no defaults, and a typed Go client with non-pointer fields would send <code>"0"</code> explicitly: the operator would then apply a ResourceQuota of zero CPU, memory and Pods, and nothing could run. Default the parent, make optional scalars pointers, and test the empty case. <b>Shared field manager.</b> Every Tenant is applied under the same field manager with force, so server-side apply would never report that Tenant <code>risk</code> is taking over Tenant <code>payments</code>'s namespace (and its admin RoleBinding). The reconciler therefore refuses any existing namespace not already labelled for this tenant and reports <code>NamespaceConflict</code>; a platform administrator adopts a pre-existing namespace by labelling it. Admission (Chapter 28) narrows the race; this check closes it.</p></div>
<p>The NetworkPolicy allows DNS only to CoreDNS Pods; with NodeLocal DNSCache add an <code>ipBlock</code> for its link-local address (169.254.20.10/32). Default deny also blocks traffic between Pods of the same namespace, so tenants add explicit allow policies, or the operator applies a same-namespace allow rule.</p>
<div class="note key"><b>Why server-side apply in operators</b><p>Each apply sends the complete desired state for the fields this operator owns, under the field manager <code>tenant-operator</code>. The server merges it, so defaults, other controllers' fields and annotations added by humans are left alone; applying the same thing twice is a no-op; and a human edit to a field the operator owns is reverted on the next reconcile (that is what <code>ForceOwnership</code> means). It removes the get-diff-update code and the hot-loop problem of Chapter 25.</p></div>

<h2>The manager</h2>
${G('cmd/main.go (the essential part of the scaffold)')`
mgr, err := ctrl.NewManager(ctrl.GetConfigOrDie(), ctrl.Options{
	Scheme:                 scheme,                         // clientgoscheme + platformv1 registered
	Metrics:                metricsserver.Options{BindAddress: ":8443", SecureServing: true, FilterProvider: filters.WithAuthenticationAndAuthorization},
	HealthProbeBindAddress: ":8081",
	LeaderElection:         enableLeaderElection, // --leader-elect, set in config/manager/manager.yaml
	LeaderElectionReleaseOnCancel: true,          // hand over at once on rolling updates (main exits right after Start)
	LeaderElectionID:       "tenant-operator.platform.example.com",
})
if err != nil {
	setupLog.Error(err, "unable to start manager")
	os.Exit(1)
}
if err := (&controller.TenantReconciler{Client: mgr.GetClient(), Scheme: mgr.GetScheme()}).SetupWithManager(mgr); err != nil {
	setupLog.Error(err, "unable to create controller", "controller", "Tenant")
	os.Exit(1)
}
_ = mgr.AddHealthzCheck("healthz", healthz.Ping)
_ = mgr.AddReadyzCheck("readyz", healthz.Ping)
if err := mgr.Start(ctrl.SetupSignalHandler()); err != nil {
	setupLog.Error(err, "manager exited")
	os.Exit(1)
}`}
<p>Two details of this configuration surprise people. <code>ctrl.GetConfigOrDie()</code> disables client-go's client-side rate limiter (it sets QPS to -1 when unset) and relies on the API server's Priority and Fairness; set <code>cfg.QPS</code> and <code>Burst</code> yourself if the operator talks to a small or shared control plane. And leader election is a flag (<code>--leader-elect</code>, off by default and switched on in <code>config/manager/manager.yaml</code>) because out of the cluster the manager cannot infer a namespace for its Lease, so <code>make run</code> runs without it.</p>

<h3>Scope the cache before production</h3>
<p>Every <code>Owns()</code> and <code>Watches()</code> above starts a cluster-wide informer: this operator caches every ResourceQuota, LimitRange, RoleBinding, NetworkPolicy and Namespace in the cluster, and needs cluster-wide list and watch permission for each. In a large cluster that is hundreds of megabytes and the usual cause of operator OOM kills. Because the operator labels everything it applies, it can cache only its own objects:</p>
${G('cmd/main.go: a scoped cache')`
sel := labels.SelectorFromSet(labels.Set{"app.kubernetes.io/managed-by": "tenant-operator"})
mgr, err := ctrl.NewManager(cfg, ctrl.Options{
	Cache: cache.Options{
		ByObject: map[client.Object]cache.ByObject{
			&rbacv1.RoleBinding{}:         {Label: sel},
			&networkingv1.NetworkPolicy{}: {Label: sel},
			&corev1.ResourceQuota{}:       {Label: sel},
			&corev1.LimitRange{}:          {Label: sel},
		},
		DefaultTransform: cache.TransformStripManagedFields(),
	},
	// ...
})
// and in SetupWithManager: Watches(&corev1.Namespace{}, handler, builder.OnlyMetadata)`}
<p>Add the label to every apply configuration in <code>desiredObjects</code>. The trade-off: objects outside the filter are invisible to the cached client, so a child whose label someone removed looks deleted, and the next apply takes it back (with server-side apply that is usually what you want). Watch <code>controller_runtime_reconcile_time_seconds</code>, workqueue depth and the process's working set as the cluster grows.</p>

<h2>Run it</h2>
${SH('The development loop')`
make manifests generate      # CRD, RBAC, deep-copy from markers
make install                 # apply the CRD to the current cluster
make run                     # run the manager locally against kind
kubectl apply -f config/samples/platform_v1_tenant.yaml
kubectl get tn
# NAME       TIER        READY   AGE
# payments   regulated   True    8s
kubectl get resourcequota,limitrange,rolebinding,networkpolicy -n payments-batch
kubectl delete resourcequota tenant-quota -n payments-batch   # recreated within a second
kubectl label ns payments pod-security.kubernetes.io/enforce=privileged --overwrite   # reverted: we own that label
make docker-build docker-push IMG=registry.example.com/tenant-operator:0.1.0
make deploy IMG=registry.example.com/tenant-operator:0.1.0   # or: make build-installer → dist/install.yaml`}

<h2>What the framework did for you</h2>
<div class="tbl"><table><tr><th>Chapter 25, by hand</th><th>controller-runtime</th></tr>
<tr><td>Scheme registration, generated clientset, informers, listers</td><td>One generic client over a shared cache, for any registered type</td></tr>
<tr><td>Event handlers mapping children to owners</td><td><code>Owns</code>, <code>Watches</code> with map functions, predicates</td></tr>
<tr><td>Typed workqueue, workers, rate limiting, Forget/Done</td><td>Built in; <code>MaxConcurrentReconciles</code>; a priority queue (the default since v0.23) that serves real changes before the initial-list flood after a restart</td></tr>
<tr><td>Get, compare, update</td><td><code>Apply</code> with apply configurations</td></tr>
<tr><td>Leader election, signal handling, metrics, health</td><td>Manager options</td></tr>
<tr><td>Event broadcaster and recorder (core/v1 Events)</td><td><code>mgr.GetEventRecorder("tenant-operator")</code>, using the events.k8s.io/v1 API since v0.23; RBAC: <code>// +kubebuilder:rbac:groups=events.k8s.io,resources=events,verbs=create;patch</code>. Operators upgraded from older releases with the old RBAC marker silently lose their events.</td></tr>
<tr><td>Hand-written RBAC and CRD YAML</td><td>Generated from markers</td></tr>
</table></div>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Owning namespaces</strong> from a custom resource: deleting it deletes every workload inside.</li>
<li><strong>No GenerationChangedPredicate</strong> (or equivalent) on the primary type, so each status update triggers another reconcile.</li>
<li><strong>Wildcard RBAC markers</strong>; review <code>config/rbac/role.yaml</code> in every pull request.</li>
<li><strong>Granting <code>bind</code> on all ClusterRoles</strong> instead of the one you bind (<code>resourceNames=admin</code>).</li>
<li><strong>Returning an error for invalid specs</strong> the user must fix; set a False condition with a clear reason instead.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Which watch?</summary><p>For each, choose For, Owns or Watches: the Tenant itself; the ResourceQuota the operator creates; a ConfigMap of platform-wide defaults that every Tenant uses.</p><p><em>Answer:</em> For(Tenant); Owns(ResourceQuota); Watches(ConfigMap) with a map function that enqueues all Tenants (or those affected).</p></details>
<details><summary>Field ownership</summary><p>A team adds an annotation to their RoleBinding. Does the operator remove it? What if they change the subjects?</p><p><em>Answer:</em> the annotation stays (not a field the operator applies); changed subjects are reverted on the next reconcile because the operator owns that field and applies with force.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Remove a namespace from a Tenant</summary><p>When a namespace is removed from <code>spec.namespaces</code>, its tenant objects stay behind. Implement pruning: list objects labelled for this tenant whose namespace is no longer in spec, delete the operator-managed objects there, and remove the tenant label from the namespace.</p><p><em>Answer:</em> add a label to managed objects, list with <code>client.MatchingLabels</code>, compare with spec, delete; use an apply configuration without the label (or a patch) for the namespace. Keep it idempotent.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Per-tier policy</summary><p>Regulated tenants must also get an egress policy allowing only an egress gateway, and their namespaces must be scheduled on a dedicated node pool. Add both, and decide how to enforce the node pool: namespace annotation, a MutatingAdmissionPolicy, or a scheduler profile.</p><p><em>Answer:</em> a second NetworkPolicy for regulated tiers; for placement, a MutatingAdmissionPolicy that adds node affinity and tolerations to Pods in namespaces labelled with the regulated tier is robust and auditable.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can scaffold an operator with kubebuilder and generate CRDs and RBAC from markers.</li>
<li>I can write API types with validation, defaults, CEL rules, printer columns and the status subresource.</li>
<li>I can write a reconciler that applies desired state with server-side apply and reports conditions.</li>
<li>I can wire For, Owns and Watches with predicates and map functions.</li>
<li>I can run the operator locally and deploy it.</li>
</ul>
