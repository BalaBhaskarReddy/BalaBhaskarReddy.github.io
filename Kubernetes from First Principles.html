FIG.probes = host => {
  host.innerHTML = `<div class="tool"><p class="meta" style="margin:0 0 8px">An app that needs a while to start, then may deadlock or lose its database. Configure probes and watch 240 seconds of kubelet decisions.</p>
  <div class="row"><div><label for="pb-s">app start-up time (s)</label><input class="txt" type="number" id="pb-s" value="45" min="0"></div><div><label><input type="checkbox" id="pb-sp" checked> startup probe (period 5 s, failureThreshold 18 = up to 90 s)</label></div></div>
  <div class="row"><div><label for="pb-ld">liveness initialDelaySeconds</label><input class="txt" type="number" id="pb-ld" value="0" min="0"></div><div><label for="pb-lp">liveness period (s)</label><input class="txt" type="number" id="pb-lp" value="10" min="1"></div><div><label for="pb-lf">liveness failureThreshold</label><input class="txt" type="number" id="pb-lf" value="3" min="1"></div></div>
  <div class="row"><div><label><input type="checkbox" id="pb-hang" checked> app deadlocks at t = 120 s</label></div><div><label><input type="checkbox" id="pb-db"> database unavailable 60–100 s</label></div><div><label><input type="checkbox" id="pb-ldb"> liveness probe also checks the database</label></div></div>
  <div id="pb-fig"></div><div class="out" id="pb-out"></div></div>`;
  const $ = id => host.querySelector('#' + id);
  const draw = () => {
    const S = Math.max(0, +$('pb-s').value || 0), useSP = $('pb-sp').checked, ld = +$('pb-ld').value || 0, lp = Math.max(1, +$('pb-lp').value || 10), lf = Math.max(1, +$('pb-lf').value || 3);
    const hang = $('pb-hang').checked, db = $('pb-db').checked, ldb = $('pb-ldb').checked, T = 240;
    let start = 0, restarts = 0, backoffUntil = -1, started = false, spFails = 0, lvFails = 0, rdFails = 0, hung = false, ready = false, running = true;
    const ev = [], segs = [], readyAt = [];
    let segStart = 0;
    const alive = t => !(hung) && t - start >= S;
    const dbOk = t => !(db && t >= 60 && t < 100);
    for (let t = 0; t <= T; t++) {
      if (!running) { if (t >= backoffUntil) { running = true; start = t; segStart = t; started = false; spFails = lvFails = rdFails = 0; ev.push([t, 'container restarted']); } readyAt.push(0); continue; }
      if (hang && t === 120 && restarts === 0) { hung = true; ev.push([t, 'app deadlocks']); }
      const age = t - start;
      let kill = '';
      if (!started) {
        if (useSP) { if (age > 0 && age % 5 === 0) { if (alive(t)) { started = true; ev.push([t, 'startup probe passed']); } else if (++spFails >= 18) kill = 'startup probe failed 18 times'; } }
        else started = true;
      }
      if (started && !kill && age >= ld && age > 0 && age % lp === 0) {
        const ok = alive(t) && (!ldb || dbOk(t));
        if (ok) lvFails = 0; else if (++lvFails >= lf) kill = `liveness failed ${lf}×`;
      }
      if (started && age > 0 && age % 5 === 0) { const ok = alive(t) && dbOk(t); if (ok) { if (!ready) ev.push([t, 'Ready']); ready = true; rdFails = 0; } else if (++rdFails >= 3 && ready) { ready = false; ev.push([t, 'NotReady (removed from Service)']); } }
      readyAt.push(ready && running ? 1 : 0);
      if (kill) { segs.push([segStart, t]); ev.push([t, 'killed: ' + kill]); running = false; ready = false; hung = false; backoffUntil = t + 10 * Math.pow(2, restarts); restarts++; }
    }
    if (running) segs.push([segStart, T]);
    const X = t => 110 + t * 2.15;
    let s = tx(100, 22, 'container', 'tm', 'end') + tx(100, 52, 'Ready', 'tm', 'end');
    segs.forEach(([a, b]) => s += rect(X(a), 12, Math.max(2, X(b) - X(a)), 20, 'bar acc', 3));
    let r0 = -1; for (let t = 0; t <= T; t++) { const on = t < T && readyAt[t]; if (on && r0 < 0) r0 = t; if (!on && r0 >= 0) { s += rect(X(r0), 44, X(t) - X(r0), 16, 'bar ok', 3); r0 = -1; } }
    [0, 60, 120, 180, 240].forEach(t => s += tx(X(t), 76, t + ' s', 'ti'));
    if (db) s += rect(X(60), 40, X(100) - X(60), 24, 'area-hot', 2);
    ev.filter(e => /killed/.test(e[1])).forEach(([t]) => s += tx(X(t), 4 + 2, '✕', 'tp hot'));
    $('pb-fig').innerHTML = `<div class="stage">${svgw(650, 86, s, 'Probe timeline')}</div>`;
    const readySecs = readyAt.reduce((a, b) => a + b, 0);
    $('pb-out').innerHTML = ev.slice(0, 12).map(([t, e]) => `${String(t).padStart(3)} s  ${/killed/.test(e) ? `<span class="d">${esc(e)}</span>` : esc(e)}`).join('<br>') + `<br><b>restarts: ${restarts} · ready ${Math.round(readySecs / T * 100)}% of the time</b>` + (ldb && db ? '<br><span class="d">The database outage restarted a healthy app. During a real outage this restarts every replica at once.</span>' : '') + (!useSP && S > ld + lp * lf ? '<br><span class="d">Without a startup probe, liveness kills the app before it finishes starting: a restart loop.</span>' : '');
  };
  host.querySelectorAll('input').forEach(e => e.addEventListener('input', draw)); draw();
};

FIG.qos = host => {
  const C = [['cpu req', '250m'], ['cpu lim', ''], ['mem req', '256Mi'], ['mem lim', '256Mi']];
  host.innerHTML = `<div class="tool"><p class="meta" style="margin:0 0 8px">Two containers in one Pod. Leave a field empty for "not set". Units: CPU in millicores (m) or cores; memory in Mi or Gi.</p>${[0, 1].map(c => `<div class="row">${C.map(([l, v], j) => `<div><label for="q-${c}-${j}">${c ? 'sidecar' : 'app'} ${l}</label><input class="txt" id="q-${c}-${j}" value="${c ? ['50m', '', '64Mi', '64Mi'][j] : v}"></div>`).join('')}</div>`).join('')}<div class="out" id="q-out"></div></div>`;
  const mem = v => { const m = String(v).trim().match(/^([\d.]+)\s*(Ki|Mi|Gi|Ti|M|G)?$/); if (!m) return null; return +m[1] * ({ Ki: 1 / 1024, Gi: 1024, Ti: 1048576, G: 953.7, M: 0.9537, Mi: 1 }[m[2]] || 1 / 1048576); };
  const cpu = v => { v = String(v || '').trim(); if (!v) return null; return v.endsWith('m') ? +v.slice(0, -1) : +v * 1000; };
  const draw = () => {
    const v = (c, j) => host.querySelector(`#q-${c}-${j}`).value.trim();
    let cls, why = [];
    const cont = [0, 1].map(c => { const r = { cr: v(c, 0), cl: v(c, 1), mr: v(c, 2), ml: v(c, 3) }; if (!r.cr && r.cl) r.cr = r.cl; if (!r.mr && r.ml) r.mr = r.ml; return r; });
    const none = cont.every(r => !r.cr && !r.cl && !r.mr && !r.ml), guar = cont.every(r => r.cl && r.ml && cpu(r.cr || r.cl) === cpu(r.cl) && mem(r.mr || r.ml) === mem(r.ml));
    cls = none ? 'BestEffort' : guar ? 'Guaranteed' : 'Burstable';
    if (cls === 'Burstable') cont.forEach((r, i) => { const n = i ? 'sidecar' : 'app'; if (!r.cl) why.push(`${n} has no CPU limit`); if (!r.ml) why.push(`${n} has no memory limit`); if (r.cl && cpu(r.cr || r.cl) !== cpu(r.cl)) why.push(`${n} CPU request ≠ limit`); if (r.ml && mem(r.mr || r.ml) !== mem(r.ml)) why.push(`${n} memory request ≠ limit`); });
    const mr = cont.reduce((a, r) => a + (mem(r.mr) || 0), 0), node = 16384;
    const oom = cls === 'Guaranteed' ? -997 : cls === 'BestEffort' ? 1000 : Math.min(999, Math.max(2, Math.round(1000 - 1000 * mr / node)));
    host.querySelector('#q-out').innerHTML = `QoS class: <b class="${cls === 'BestEffort' ? 'd' : 'g'}">${cls}</b>${why.length ? ' <span class="meta">(' + why.join('; ') + ')</span>' : ''}<br>oom_score_adj on a 16 GiB node: <b>${oom}</b> <span class="meta">(higher dies first when the node runs out of memory)</span><br>${{ Guaranteed: 'Never uses more than its requests, so it is chosen for eviction only after every Pod that does; eligible for exclusive CPUs with the static CPU manager policy if CPU is a whole number.', Burstable: 'Under node pressure the kubelet first evicts Pods using more than their requests (BestEffort Pods always are), then orders by Pod priority and by how far usage exceeds requests. A Burstable Pod within its requests is rarely chosen.', BestEffort: 'First to be evicted and first to be OOM-killed. Fine for throwaway work, never for production services.' }[cls]}<br><span class="meta">Requests drive scheduling and the CPU share (cpu.weight); a CPU limit sets a CFS quota (throttling); a memory limit sets memory.max (the container is OOM-killed above it).</span>`;
  };
  host.querySelectorAll('input').forEach(e => e.addEventListener('input', draw)); draw();
};

CH.push({
  id: 'ch05', n: 5, title: 'Pods',
  lede: 'The Pod is the unit Kubernetes schedules: one or more containers that share a network identity, storage and fate. Almost every production incident involving "the app" turns out to be about how a Pod starts, proves it is healthy, uses resources or shuts down. This chapter covers all four, including native sidecars, in-place resizing and user namespaces.',
  html: `
<h2>Why Pods and not containers</h2>
<p>Containers in one Pod share a <b>network namespace</b> (one IP, one port space; they reach each other on <code>localhost</code>), can share <b>volumes</b>, and are scheduled, started and stopped together. That makes a Pod the right home for a process plus its tightly-coupled helpers: a service-mesh proxy, a log shipper, a credential refresher. Everything that should scale independently belongs in a separate Pod.</p>
${Y('A Pod with an init container, a native sidecar and probes')`
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels: {app: web}
spec:
  initContainers:
  - name: migrate                     # runs to completion first
    image: registry.example.com/web:1.8.2
    command: ["/app/migrate", "--up"]
  - name: log-shipper                 # native sidecar: init container that keeps running
    image: fluent/fluent-bit:4.0
    restartPolicy: Always
    volumeMounts: [{name: logs, mountPath: /var/log/app}]
  containers:
  - name: app
    image: registry.example.com/web:1.8.2
    ports: [{containerPort: 8080, name: http}]
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits:   {memory: 256Mi}
    startupProbe:   {httpGet: {path: /healthz, port: http}, periodSeconds: 5, failureThreshold: 18}
    livenessProbe:  {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
    readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
    lifecycle:
      preStop: {sleep: {seconds: 5}}  # let endpoints update before SIGTERM
    volumeMounts: [{name: logs, mountPath: /var/log/app}]
  terminationGracePeriodSeconds: 30
  volumes:
  - name: logs
    emptyDir: {}`}

<h2>The life of a Pod</h2>
${fig('podlife', '<b>Figure 5.1</b> Step through: phases, the sandbox, init containers, a native sidecar, and shutdown order.')}
<p>A Pod's <b>phase</b> is a coarse summary (Pending, Running, Succeeded, Failed, Unknown). The useful detail is in <b>conditions</b> (<code>PodScheduled</code>, <code>PodReadyToStartContainers</code>, <code>Initialized</code>, <code>ContainersReady</code>, <code>Ready</code>, and <code>DisruptionTarget</code> when it is being evicted) and in each container's <b>state</b> (Waiting with a reason like <code>ImagePullBackOff</code> or <code>CrashLoopBackOff</code>; Running; Terminated with an exit code and reason such as <code>OOMKilled</code>).</p>
<p>Before native sidecars, a "sidecar" was just a second regular container, which caused two chronic problems: Jobs never completed because the proxy never exited, and the proxy could stop before the app finished draining. Native sidecars fix both: they start before the app, stop after it, and do not block Job completion.</p>

<h2>Restarts</h2>
<p><code>spec.restartPolicy</code> (Always, OnFailure, Never) applies to the whole Pod. When a container exits and policy says restart, the kubelet waits with exponential back-off (10 s, 20 s, 40 s… capped at five minutes, reset after ten minutes of healthy running). <code>CrashLoopBackOff</code> is that waiting state, not an error in itself: the error is whatever made the container exit, visible with <code>kubectl logs --previous</code>.</p>
<p>Since 1.35 (beta, on by default), containers can also have their own <code>restartPolicy</code> and <code>restartPolicyRules</code>, for example "restart in place on exit code 42" even in a Pod whose policy is Never. That lets batch workloads retry a known-transient failure without rescheduling the whole Pod.</p>
${Y('Restarting in place on a known exit code')`
spec:
  restartPolicy: Never              # the Pod as a whole is not restarted...
  containers:
  - name: trainer
    image: registry.example.com/ml/trainer:2.4
    restartPolicy: Never
    restartPolicyRules:             # ...but this container is, when it exits with 42
    - action: Restart
      exitCodes: {operator: In, values: [42]}`}
<p>Two related controls arrived alongside. The <code>RestartAllContainers</code> action (beta and on by default since 1.36) restarts every container of the Pod in place, re-running init containers but keeping the node, IP and volumes, which suits distributed training where one failed worker must reset its whole Pod without losing an expensive placement. And the kubelet setting <code>crashLoopBackOff.maxContainerRestartPeriod</code> (beta since 1.35, 1 to 300 seconds) lets a node cap the back-off for workloads that should retry faster. In-place restarts are not Pod failures, so they do not count against a Job's <code>podFailurePolicy</code> or backoff limit.</p>

<h2>Probes</h2>
<div class="tbl"><table><tr><th>Probe</th><th>Question</th><th>On failure</th></tr>
<tr><td><b>startup</b></td><td>Has the app finished starting?</td><td>After failureThreshold × period, the container is killed and restarted. Liveness and readiness wait until it succeeds.</td></tr>
<tr><td><b>liveness</b></td><td>Is the process stuck beyond recovery?</td><td>The container is killed and restarted.</td></tr>
<tr><td><b>readiness</b></td><td>Should it receive traffic right now?</td><td>The Pod is removed from Service endpoints; nothing is restarted.</td></tr>
</table></div>
${fig('probes', '<b>Figure 5.2</b> Interactive: a probe timeline. Turn off the startup probe, make liveness check the database, and see what goes wrong.')}
<div class="note key"><b>Rules for probes</b><p>Liveness checks only the process itself (can it answer at all?); never a database, cache or downstream API, or one outage restarts your whole fleet. Readiness may check dependencies the instance genuinely cannot serve without. Use a startup probe for anything slow to start instead of a long <code>initialDelaySeconds</code>. Probe handlers can be <code>httpGet</code>, <code>tcpSocket</code>, <code>grpc</code> or <code>exec</code>; exec probes fork a process every period and are expensive at scale.</p></div>

<h2>Shutting down cleanly</h2>
<p>When a Pod is deleted, two things happen <b>in parallel</b>: the endpoints controller removes it from Services, and the kubelet starts the shutdown (preStop hook, then SIGTERM). Load balancers and kube-proxy on other nodes learn about the endpoint change a little later, so for a moment traffic can still arrive at a process that is exiting. The standard fix is a short <code>preStop</code> sleep (the built-in <code>sleep</code> action is stable since 1.34, no shell needed), and an app that, on SIGTERM, stops accepting new connections, finishes in-flight requests and exits well within <code>terminationGracePeriodSeconds</code>.</p>

<h2>Resources and quality of service</h2>
<p>Each container may declare <b>requests</b> (what the scheduler reserves for it) and <b>limits</b> (a ceiling enforced by the kernel). On Linux, the kubelet maps them to cgroup v2 settings: requests become <code>cpu.weight</code> (relative share under contention), a CPU limit becomes <code>cpu.max</code> (a hard quota per 100 ms period, which throttles), a memory limit becomes <code>memory.max</code> (exceeding it means OOM-kill). Since 1.35 nodes must run cgroup v2; the kubelet refuses to start on cgroup v1 unless explicitly overridden. Memory QoS (beta and on by default in 1.37) also uses <code>memory.min</code> and <code>memory.high</code> to protect requested memory and throttle before the hard limit.</p>
${fig('qos', '<b>Figure 5.3</b> Interactive: requests and limits decide the Pod\'s QoS class, its OOM score and eviction order.')}
<p>Chapter 8 covers sizing, CPU throttling and autoscaling. Two more recent features belong here. <b>Pod-level resources</b> (beta since 1.34) let you set requests and limits for the Pod as a whole and let containers share the budget. <b>In-place resize</b> (stable since 1.35) changes CPU and memory of a running Pod through the <code>resize</code> subresource, without restarting it when the runtime supports it; <code>resizePolicy</code> per resource says whether a restart is required.</p>
${SH('Resize a running Pod')`
kubectl patch pod web --subresource resize -p \
  '{"spec":{"containers":[{"name":"app","resources":{"requests":{"cpu":"500m"},"limits":{"memory":"512Mi"}}}]}}'
# the default patch type is strategic: containers merge by name (a JSON merge patch would replace the whole list)
kubectl get pod web -o jsonpath='{.status.containerStatuses[0].resources}'   # what is actually applied
kubectl get pod web -o jsonpath='{.status.conditions}' | jq '.[] | select(.type|test("Resize"))'`}

<h2>Isolation inside the Pod</h2>
<p>Containers share a kernel with the node. The <code>securityContext</code> (Chapter 18) controls the user, capabilities, seccomp and read-only file systems. One setting deserves attention now: <code>hostUsers: false</code> runs the Pod in a <b>user namespace</b> (stable since 1.36), so root inside the container is an unprivileged user on the node. A container escape then lands as a high, unprivileged host UID that no other Pod shares. Use it for any workload that needs to run as root inside.</p>

<h2>Debugging a Pod</h2>
${SH('The debugging sequence')`
kubectl get pod web -o wide                      # phase, restarts, node, IP
kubectl describe pod web                         # events: scheduling, pulls, probe failures, OOM
kubectl logs web -c app --previous               # output of the last crashed instance
kubectl debug -it web --image=busybox:1.37 --target=app   # ephemeral container sharing the app's process namespace
kubectl debug node/lab-worker -it --image=busybox:1.37    # a pod on the node with the host filesystem at /host`}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Liveness probes that check dependencies.</strong> One database blip restarts everything.</li>
<li><strong>No startup probe for slow starters</strong>, so liveness kills them in a loop.</li>
<li><strong>No preStop delay and no SIGTERM handling</strong>: errors on every deploy.</li>
<li><strong>BestEffort Pods in production</strong>: first to be killed under pressure.</li>
<li><strong>Running as root without user namespaces</strong> when the image does not need host privileges.</li>
<li><strong>Treating CrashLoopBackOff as the problem</strong> instead of reading the previous logs and exit code.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Exit code 137</summary><p>A container's last state is Terminated, reason OOMKilled, exit code 137. What happened and what do you change?</p><p><em>Answer:</em> it exceeded its memory limit and the kernel killed it (137 = 128 + SIGKILL). Find the real peak usage, fix leaks, raise the limit, or for JVMs set heap relative to the container limit.</p></details>
<details><summary>Sidecar in a Job</summary><p>A Job's Pod has a log-shipping sidecar as a regular container and never completes. Fix it.</p><p><em>Answer:</em> move the sidecar to <code>initContainers</code> with <code>restartPolicy: Always</code>; native sidecars are stopped after the main containers finish and do not block completion.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Measure the shutdown race</summary><p>Deploy an HTTP app with three replicas behind a Service and run a load generator during <code>kubectl rollout restart</code>. Count errors with and without a 5 s preStop sleep and SIGTERM handling.</p><p><em>Answer:</em> without them you typically see a burst of connection-refused or 502 errors on each Pod replacement; with them, none.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>See the cgroups</summary><p>On a kind node, find the cgroup of a Burstable Pod under <code>/sys/fs/cgroup/kubepods.slice/</code> and read <code>cpu.weight</code>, <code>cpu.max</code> and <code>memory.max</code>. Resize the Pod in place and read them again.</p><p><em>Answer:</em> cpu.weight follows the CPU request, cpu.max the CPU limit (or "max"), memory.max the memory limit; after the resize the values change without a container restart.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain what containers in a Pod share and when to use one Pod or several.</li>
<li>I know the order of init containers, native sidecars and main containers at start and at shutdown.</li>
<li>I can configure startup, liveness and readiness probes correctly.</li>
<li>I can predict a Pod's QoS class and what happens when it exceeds its limits.</li>
<li>I can resize a Pod in place and use ephemeral containers to debug it.</li>
</ul>
`});

FIG.rollout = host => {
  host.innerHTML = `<div class="tool"><div class="row"><div><label for="ro-n">replicas</label><input class="txt" type="number" id="ro-n" value="6" min="1" max="12"></div><div><label for="ro-s">maxSurge</label><input class="txt" id="ro-s" value="25%"></div><div><label for="ro-u">maxUnavailable</label><input class="txt" id="ro-u" value="25%"></div></div><label class="chk"><input type="checkbox" id="ro-bad"> the new version never becomes ready</label><div id="ro-step"></div></div>`;
  const pct = (v, n, up) => { v = String(v).trim(); if (v.endsWith('%')) { const x = n * parseFloat(v) / 100; return up ? Math.ceil(x) : Math.floor(x); } return Math.max(0, parseInt(v) || 0); };
  const run = () => {
    const N = Math.min(12, Math.max(1, +host.querySelector('#ro-n').value || 1)), bad = host.querySelector('#ro-bad').checked;
    let surge = pct(host.querySelector('#ro-s').value, N, true), un = pct(host.querySelector('#ro-u').value, N, false);
    if (surge === 0 && un === 0) { host.querySelector('#ro-step').innerHTML = '<div class="out"><span class="d">Rejected by the API server: maxSurge and maxUnavailable cannot both be 0 (nothing could ever move).</span></div>'; return; }
    let old = N, nw = [], frames = [], term = 0;
    frames.push({ old, nw: [], term: 0, note: `Start: ${N} Pods of the old version. maxSurge ${surge} (at most ${N + surge} Pods in total), maxUnavailable ${un} (at least ${N - un} available).` });
    for (let step = 0; step < 40; step++) {
      nw = nw.map(p => p === 'new' && !bad ? 'ready' : p);
      const ready = old + nw.filter(p => p === 'ready').length;
      let notes = [];
      const canRemove = Math.max(0, Math.min(old, ready - (N - un)));
      if (canRemove > 0) { old -= canRemove; term = canRemove; notes.push(`scale old ReplicaSet down by ${canRemove}`); } else term = 0;
      const room = N + surge - (old + nw.length), want = N - nw.length, add = Math.max(0, Math.min(room, want));
      for (let i = 0; i < add; i++) nw.push('new');
      if (add) notes.push(`scale new ReplicaSet up by ${add}`);
      const avail = old + nw.filter(p => p === 'ready').length;
      frames.push({ old, nw: nw.slice(), term, note: (notes.join('; ') || (bad ? 'Nothing can move: old Pods cannot be removed without dropping below the minimum, and no room to add more. The rollout is stuck.' : 'waiting for new Pods to become ready')) + ` · available ${avail}/${N}` });
      if (old === 0 && nw.every(p => p === 'ready')) { frames.push({ old, nw: nw.slice(), term: 0, note: 'Done: all Pods run the new version. The old ReplicaSet is kept at 0 replicas for rollback.' }); break; }
      if (!notes.length && bad && step > 2) { frames.push({ old, nw: nw.slice(), term: 0, note: 'After progressDeadlineSeconds (600 s by default) the Deployment\'s Progressing condition becomes False with reason ProgressDeadlineExceeded. Nothing rolls back automatically: run <code>kubectl rollout undo</code>, or let your delivery tool do it.' }); break; }
    }
    stepper(host.querySelector('#ro-step'), frames, f => {
      let s = tx(8, 14, 'old ReplicaSet', 'tm', 'start') + tx(8, 72, 'new ReplicaSet', 'tm', 'start');
      for (let i = 0; i < f.old; i++) s += pod(8 + i * 52, 24, 'v1', 'acc', 46);
      for (let i = 0; i < f.term; i++) s += pod(8 + (f.old + i) * 52, 24, 'stop', 'dim', 46);
      f.nw.forEach((p, i) => s += pod(8 + i * 52, 82, p === 'ready' ? 'v2' : 'v2 …', p === 'ready' ? 'ok' : 'warn', 46));
      return { s, w: 640, h: 116 };
    }, { speed: 1300, legend: '<span class="l-acc">old, available</span><span class="l-warn">new, not ready yet</span><span class="l-ok">new, ready</span>' });
  };
  host.querySelectorAll('input').forEach(e => e.addEventListener('change', run)); run();
};

CH.push({
  id: 'ch06', n: 6, title: 'Workload Controllers',
  lede: 'You almost never create Pods directly. You create a controller object that creates Pods for you and keeps them in the shape you asked for: interchangeable replicas, ordered replicas with identity, one per node, or work that runs to completion. This chapter takes each controller apart, with the rollout mechanics you need to deploy safely.',
  html: `
<h2>Choosing a controller</h2>
${fig('choose', '<b>Figure 6.1</b> Interactive: the five workload controllers compared.')}

<h2>ReplicaSets and Deployments</h2>
<p>A <b>ReplicaSet</b> keeps N Pods matching a selector. A <b>Deployment</b> manages ReplicaSets: each change to the Pod template creates a new ReplicaSet (named with a hash of the template) and the Deployment shifts replicas from the old to the new one. Old ReplicaSets are kept at zero replicas, up to <code>revisionHistoryLimit</code> (10), which is what makes <code>kubectl rollout undo</code> instant.</p>
${Y('A Deployment tuned for safe rollouts')`
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop}
spec:
  replicas: 6
  selector: {matchLabels: {app: web}}         # immutable after creation
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 25%, maxUnavailable: 0}   # never drop below 6 available
  minReadySeconds: 10            # a new Pod must stay Ready 10 s before it counts as available
  progressDeadlineSeconds: 600   # report failure if no progress for 10 minutes
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: app
        image: registry.example.com/web:1.9.0
        readinessProbe: {httpGet: {path: /ready, port: 8080}}`}
${fig('rollout', '<b>Figure 6.2</b> Interactive: a rolling update. Change replicas, maxSurge and maxUnavailable; then break the new version and watch the rollout stall.')}
<p>Two settings dominate. <b>maxSurge</b> is how many extra Pods may exist (speed, at the cost of capacity). <b>maxUnavailable</b> is how many may be missing (speed, at the cost of serving capacity). <code>maxUnavailable: 0</code> with a positive surge is the safest default for services. A readiness probe is what makes any of this meaningful: without one, a Pod counts as available as soon as its containers start, and a broken release rolls out completely.</p>
${SH('Rollout commands')`
kubectl set image deploy/web app=registry.example.com/web:1.9.1 -n shop
kubectl rollout status deploy/web -n shop --timeout=5m     # exits non-zero on failure: use it in CI
kubectl rollout history deploy/web -n shop
kubectl rollout undo deploy/web -n shop --to-revision=7
kubectl rollout pause deploy/web -n shop    # batch several changes into one rollout, then resume
kubectl rollout restart deploy/web -n shop  # new Pods, same spec (sets an annotation on the template)`}
<p>The <b>Recreate</b> strategy deletes all old Pods before creating new ones. Use it only when two versions must never run at the same time and downtime is acceptable. Canary and blue-green releases with traffic shifting are built on top of Deployments by tools such as Argo Rollouts or Flagger, together with Gateway API traffic weights (Chapter 13 and 20).</p>

<h2>StatefulSets</h2>
<p>A <b>StatefulSet</b> gives each replica a sticky identity: an ordinal name, a DNS record through a <b>headless Service</b> (one with <code>clusterIP: None</code>), and its own PersistentVolumeClaim created from <code>volumeClaimTemplates</code>.</p>
${fig('sts', '<b>Figure 6.3</b> Step through: ordered creation, stable identity across rescheduling, and scale-down.')}
<ul>
<li><b>Updates</b> go from the highest ordinal down, one at a time by default. A <code>partition</code> updates only ordinals at or above it: set it to 2 of 3 to canary one replica. <code>maxUnavailable</code> for StatefulSets is beta and, after a bug fix, on by default again in 1.37, allowing faster updates for systems that tolerate it. A <code>Recreate</code> update strategy for StatefulSets is alpha in 1.37.</li>
<li><b>podManagementPolicy: Parallel</b> drops the start-up ordering, for systems that do not need it.</li>
<li><b>persistentVolumeClaimRetentionPolicy</b> (stable) chooses whether PVCs are deleted on scale-down or when the StatefulSet is deleted. The default retains them: safer, but you pay for orphaned volumes.</li>
</ul>
<h3>When a node dies under a StatefulSet</h3>
<p>The most common StatefulSet outage is "the node died, the Pod is stuck Terminating, the database is down". Taint-based eviction marks the Pod for deletion after 300 seconds, but deletion completes only when the kubelet confirms the containers stopped, which a dead node never does. A Deployment does not care: its ReplicaSet ignores terminating Pods and creates replacements (so briefly two copies may run). A StatefulSet guarantees at most one Pod per identity, so it waits. The volume is also still attached to the dead node; the attach-detach controller force-detaches it only after six minutes, and only for a node known to be shut down.</p>
<div class="tbl"><table><tr><th>Recovery</th><th>When to use</th></tr>
<tr><td>Delete the Node object</td><td>The VM is gone; cloud node-lifecycle controllers do this automatically for terminated instances</td></tr>
<tr><td>Taint <code>node.kubernetes.io/out-of-service=nodeshutdown:NoExecute</code></td><td>The node is known to be powered off (stable since 1.28): Pods are force-deleted and volumes force-detached at once</td></tr>
<tr><td><code>kubectl delete pod db-1 --force --grace-period=0</code></td><td>Last resort, and dangerous if the node is only partitioned: the old Pod may still be writing</td></tr>
</table></div>
<p>Planned shutdowns are different: with graceful node shutdown (<code>shutdownGracePeriod</code> and <code>shutdownGracePeriodCriticalPods</code> in the kubelet configuration) the kubelet terminates Pods properly before the machine stops. And because the cluster can only guess whether a silent node is dead, databases still need their own fencing or leader election on top.</p>

<div class="note key"><b>A StatefulSet is not a database operator</b><p>It provides identity and storage, nothing more. It does not know which replica is the primary, how to fail over, how to back up, or how to add a replica to a cluster safely. That knowledge belongs in an operator (Chapters 26 and 27), which usually creates a StatefulSet as one of its tools.</p></div>

<h2>DaemonSets</h2>
<p>A <b>DaemonSet</b> runs one Pod per node, or per node matching a selector. The DaemonSet controller creates the Pods with node affinity, and the default scheduler places them; they tolerate taints such as <code>not-ready</code> and <code>unreachable</code> so that agents keep running on troubled nodes. Rolling updates proceed node by node; <code>maxSurge</code> lets a new agent start before the old one stops on the same node, which matters for networking agents.</p>

<h2>Jobs</h2>
<p>A <b>Job</b> runs Pods until a number of them succeed. <code>completions</code> is how many successes are needed; <code>parallelism</code> how many run at once. In <b>Indexed</b> mode each Pod gets an index (0 … completions−1) in an annotation and the <code>JOB_COMPLETION_INDEX</code> environment variable: the simplest way to split data into shards.</p>
${Y('An Indexed Job with modern failure handling')`
apiVersion: batch/v1
kind: Job
metadata: {name: reconcile-settlements}
spec:
  completionMode: Indexed
  completions: 32                 # 32 shards
  parallelism: 8
  backoffLimitPerIndex: 2         # each shard may fail twice (stable since 1.33)
  maxFailedIndexes: 3             # give up on the Job if more than 3 shards fail
  podReplacementPolicy: Failed    # only create a replacement once the old Pod has fully terminated
  podFailurePolicy:
    rules:
    - action: FailJob             # a bug: retrying will not help
      onExitCodes: {containerName: worker, operator: In, values: [3]}
    - action: Ignore              # node drain or preemption: do not count it as a failure
      onPodConditions: [{type: DisruptionTarget}]
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: registry.example.com/settle:2.4.0
        args: ["--shard=$(JOB_COMPLETION_INDEX)", "--of=32"]`}
<ul>
<li><b>podFailurePolicy</b> (stable) separates bugs from infrastructure noise: fail fast on a known fatal exit code, ignore disruptions.</li>
<li><b>successPolicy</b> (stable since 1.33) declares the Job successful when certain indexes succeed, for example the leader of a distributed training run.</li>
<li><b>podReplacementPolicy: Failed</b> (stable since 1.34) avoids two copies of the same index running at once while one is still terminating.</li>
<li><b>managedBy</b> (stable since 1.35) hands a Job to an external controller, which is how MultiKueue runs Jobs on other clusters (Chapter 10).</li>
<li><b>suspend: true</b> creates a Job without starting it; queueing systems such as Kueue use it to admit Jobs when capacity is available.</li>
</ul>

<h2>CronJobs</h2>
${Y('A CronJob in a specific time zone')`
apiVersion: batch/v1
kind: CronJob
metadata: {name: eod-report}
spec:
  schedule: "30 18 * * 1-5"         # 18:30 on weekdays
  timeZone: Asia/Kolkata            # otherwise the controller manager's time zone
  concurrencyPolicy: Forbid         # skip a run if the previous is still going
  startingDeadlineSeconds: 600      # if the controller was down, still start up to 10 min late
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers: [{name: report, image: registry.example.com/report:3.1.0}]`}
<p>CronJobs guarantee "about once": a run can be missed if the controller is down past the deadline, and in rare cases two Jobs can be created for one tick. Make the work idempotent.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>No readiness probe</strong>: rollouts "succeed" with broken Pods.</li>
<li><strong>Changing the selector</strong> of a Deployment: it is immutable; you must create a new one.</li>
<li><strong>Using a StatefulSet as if it were a database operator.</strong></li>
<li><strong>Jobs without <code>ttlSecondsAfterFinished</code></strong> pile up thousands of finished Pods.</li>
<li><strong>Non-idempotent CronJobs</strong> that double-charge or double-send when they run twice.</li>
<li><strong>A DaemonSet without tolerations</strong> that skips the very nodes (tainted, GPU, control plane) you need it on.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Count the Pods</summary><p>replicas 10, maxSurge 3, maxUnavailable 2. During a rollout, what are the maximum total Pods and the minimum available Pods?</p><p><em>Answer:</em> at most 13 Pods exist; at least 8 are available.</p></details>
<details><summary>Which controller?</summary><p>A node-level eBPF security agent; a three-node etcd for a tool; a nightly reconciliation of bank statements; a stateless REST API.</p><p><em>Answer:</em> DaemonSet; StatefulSet (ideally managed by an operator); CronJob; Deployment.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Canary a StatefulSet</summary><p>Update the image of a 3-replica StatefulSet with <code>partition: 2</code>, verify db-2, then roll the rest. Write the commands.</p><p><em>Answer:</em> patch <code>spec.updateStrategy.rollingUpdate.partition</code> to 2, change the image, wait for db-2; then patch partition to 0 and watch db-1 and db-0 update in turn.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Failure policy in action</summary><p>Write an Indexed Job whose worker exits with code 3 on index 5 and code 1 randomly elsewhere. Configure it so index 5 fails the Job immediately while random failures retry. Drain a node during the run and confirm disruptions are ignored.</p><p><em>Answer:</em> a podFailurePolicy with FailJob on exit code 3 and Ignore on DisruptionTarget, plus backoffLimitPerIndex for the random failures; check <code>status.failedIndexes</code> and conditions.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can choose the right controller for a workload.</li>
<li>I can tune maxSurge, maxUnavailable, minReadySeconds and progressDeadlineSeconds, and roll back.</li>
<li>I understand StatefulSet identity, ordering, partitions and PVC retention.</li>
<li>I can write Jobs with indexes, per-index retries, failure and success policies, and safe CronJobs.</li>
</ul>
`});

CH.push({
  id: 'ch07', n: 7, title: 'Configuration, Secrets and Workload Identity',
  lede: 'Images should be the same in every environment; what changes is configuration, secrets and identity. This chapter covers ConfigMaps and Secrets and how changes reach running Pods, the downward API, service account tokens and how clouds trust them, and the newer pieces: pod certificates, trust bundles and image volumes.',
  html: `
<h2>ConfigMaps and Secrets</h2>
<p>A <b>ConfigMap</b> holds non-secret key–value data or files; a <b>Secret</b> holds sensitive data. Both are limited to 1 MiB. A Secret's values are base64-encoded in the API, which is <b>encoding, not encryption</b>: anyone who can read Secrets in a namespace, or read etcd without encryption at rest, can read them. Secrets differ from ConfigMaps in three ways that matter: RBAC usually restricts them separately, the kubelet keeps them in memory (tmpfs) on nodes, and the API server can encrypt them at rest.</p>
${Y('Consuming configuration three ways')`
apiVersion: v1
kind: Pod
metadata: {name: web}
spec:
  containers:
  - name: app
    image: registry.example.com/web:1.9.0
    env:
    - name: LOG_LEVEL
      valueFrom: {configMapKeyRef: {name: app-cfg, key: log_level}}
    - name: DB_PASSWORD
      valueFrom: {secretKeyRef: {name: db-cred, key: password}}
    - name: MEM_LIMIT                       # downward API: the container's own limit
      valueFrom: {resourceFieldRef: {resource: limits.memory}}
    volumeMounts:
    - {name: cfg, mountPath: /etc/app, readOnly: true}
  volumes:
  - name: cfg
    projected:                              # several sources merged into one directory
      sources:
      - configMap: {name: app-cfg}
      - secret: {name: tls-client, items: [{key: tls.crt, path: client.crt}]}
      - downwardAPI: {items: [{path: labels, fieldRef: {fieldPath: metadata.labels}}]}`}
${fig('cfgprop', '<b>Figure 7.1</b> Interactive: how a ConfigMap edit reaches a running container, depending on how it is consumed.')}
<p>The <b>downward API</b> exposes a Pod's own metadata (name, namespace, labels, annotations, node name, IP, service account) and its resource requests and limits, as environment variables or files. Since 1.35 (beta) the zone and region labels of the node can be passed down as well, without giving the Pod permission to read Node objects.</p>

<h2>Secrets in practice</h2>
<p>Storing production secrets as plain Secret manifests in Git is the mistake to avoid. The common patterns:</p>
<div class="tbl"><table><tr><th>Pattern</th><th>How it works</th><th>Trade-off</th></tr>
<tr><td>External Secrets Operator</td><td>A controller reads from Vault, AWS Secrets Manager, Azure Key Vault, GCP Secret Manager and writes Kubernetes Secrets</td><td>Apps stay unchanged; the secret still exists in etcd (encrypt at rest)</td></tr>
<tr><td>Secrets Store CSI driver</td><td>Mounts secrets from the external store directly as files; optional sync to Secrets</td><td>Nothing in etcd unless synced; tied to Pod start</td></tr>
<tr><td>Sealed or SOPS-encrypted manifests</td><td>Encrypted in Git, decrypted in the cluster by a controller or the GitOps tool</td><td>GitOps-friendly; key management is now your problem</td></tr>
<tr><td>Workload identity, no secret at all</td><td>The Pod proves who it is to the cloud or to Vault with its service account token</td><td>Best where supported: nothing to leak or rotate</td></tr>
</table></div>

<h2>Service accounts and their tokens</h2>
<p>Every Pod runs as a <b>service account</b> (<code>default</code> unless you set <code>serviceAccountName</code>). Since 1.24 tokens are not stored in Secrets: the kubelet requests a short-lived, audience-bound token through the <b>TokenRequest</b> API and projects it into the Pod, refreshing it automatically. The token is a JWT signed by the cluster's service account issuer, bound to the Pod and node.</p>
${fig('satoken', '<b>Figure 7.2</b> Interactive: a projected service account token. Change the audience and lifetime, and age the token.')}
<p>Set <code>automountServiceAccountToken: false</code> on Pods that never call the Kubernetes API: an attacker who gets code execution in the Pod then has no cluster credentials to steal. Since 1.36 the API server can delegate signing to an external signer (an HSM or cloud KMS) through the stable <code>ExternalJWTSigner</code> interface, so the signing key never sits on control-plane disks.</p>

<div class="note pit"><b>Default tokens live a year</b><p>The kubelet asks for 3607-second tokens, but by default the API server extends exactly these admission-injected tokens to one year (<code>--service-account-extend-token-expiration=true</code>) and only <em>warns</em> after an hour: use after the <code>warnafter</code> claim is counted in <code>serviceaccount_stale_tokens_total</code> and annotated in audit logs as <code>authentication.k8s.io/stale-token</code>, not rejected. A stolen default token therefore stays usable for up to a year. Hardened clusters (it is a CIS Benchmark item) set the flag to <code>false</code> once the metric shows that no client still relies on old tokens; managed services may not let you change it.</p></div>
<h3>Token hardening checklist</h3>
<ul>
<li><code>--service-account-extend-token-expiration=false</code> once stale-token usage is zero, and <code>--service-account-max-token-expiration</code> to bound tokens that clients request themselves.</li>
<li>Find and remove legacy Secret-based tokens: <code>kubectl get secrets -A --field-selector type=kubernetes.io/service-account-token</code>. The legacy-token cleaner (stable since 1.30) labels unused ones <code>kubernetes.io/legacy-token-invalid-since</code> and deletes them after a year by default.</li>
<li>Rotate signing keys with overlap: publish old and new keys in the JWKS until every token signed by the old key has expired. External signers (stable in 1.36) let a KMS or HSM hold the key.</li>
<li>Treat <code>create</code> on <code>serviceaccounts/token</code> as holding that identity, and include it in access reviews.</li>
</ul>

<h2>Workload identity: trusting tokens outside the cluster</h2>
<p>Because the issuer publishes its public keys through standard OIDC discovery, other systems can verify service account tokens. Clouds use this to give Pods cloud permissions without keys: IAM Roles for Service Accounts on EKS, AKS Workload Identity with Microsoft Entra ID and GKE Workload Identity Federation verify the token through the issuer's OIDC discovery document (Figure 7.3). EKS Pod Identity uses the same projected token but sends it through a node agent to the EKS Auth API instead of OIDC federation. HashiCorp Vault's Kubernetes and JWT auth methods work the same way.</p>
${fig('wlid', '<b>Figure 7.3</b> Step through: a Pod gets cloud credentials with its service account token.')}
<p>The kubelet can also use service account tokens to pull private images (beta since 1.34): an image credential provider exchanges the Pod's token for registry credentials, removing long-lived image pull Secrets.</p>

<h3>Image pull credentials and the node's image cache</h3>
<p>Images are cached per node and shared by every Pod on it. Before 1.35, a Pod with <code>imagePullPolicy: IfNotPresent</code> could start from another tenant's private image that happened to be cached on the node, without presenting any credentials. Since 1.35 (beta, on by default) the kubelet records which credentials pulled each image and verifies that a Pod presenting different credentials is also allowed to pull it, by contacting the registry. The KubeletConfiguration field <code>imagePullCredentialsVerificationPolicy</code> chooses how strict this is:</p>
<div class="tbl"><table><tr><th>Policy</th><th>Behaviour</th></tr>
<tr><td><code>NeverVerify</code></td><td>The old behaviour: cached images are usable by anyone</td></tr>
<tr><td><code>NeverVerifyPreloadedImages</code> (default)</td><td>Images present before the kubelet started (baked into the node image) are trusted; everything else is verified</td></tr>
<tr><td><code>NeverVerifyAllowlistedImages</code></td><td>Only images matching <code>preloadedImagesVerificationAllowlist</code> skip verification</td></tr>
<tr><td><code>AlwaysVerify</code></td><td>Every use of a private image is checked</td></tr>
</table></div>
<p>The operational consequence: a registry outage now also affects Pods that previously would have started from cache. Keep system images in the node image (covered by the default policy), and combine this with service-account-token image pulls so registries can authorise per workload rather than per node.</p>

<h2>Pod certificates and trust bundles</h2>
<p>Tokens prove identity to things that understand JWTs. For mutual TLS between services, Pods need X.509 certificates. Kubernetes 1.37 made two features stable for this:</p>
<ul>
<li><b>Pod certificates</b>: a <code>podCertificate</code> projected volume source. The kubelet generates a private key on the node, creates a <code>PodCertificateRequest</code>, and a signer (a controller you or your mesh run) issues the certificate; the kubelet writes key and chain into the Pod and rotates them. The private key never leaves the node.</li>
<li><b>ClusterTrustBundles</b>: cluster-scoped objects holding CA certificates, projected into Pods so they can verify peers, and rotated centrally.</li>
</ul>
${Y('A Pod with a workload certificate and a trust bundle')`
volumes:
- name: identity
  projected:
    sources:
    - podCertificate:
        signerName: example.com/workload-mtls
        keyType: ECDSAP256
        credentialBundlePath: credentials.pem    # key and certificate chain in one file
    - clusterTrustBundle:
        signerName: example.com/workload-mtls
        labelSelector: {matchLabels: {trust: current}}
        path: ca.pem`}
<p>Service meshes and identity systems such as SPIFFE implementations can build on these primitives instead of their own node agents.</p>

<h2>Image volumes</h2>
<p>An <b>image volume</b> (stable since 1.36) mounts the contents of an OCI image or artifact, read-only, into a Pod. Ship configuration bundles, static assets or machine-learning model weights as versioned, signed OCI artifacts in your registry, separate from the application image. It requires a runtime that supports it, such as containerd 2.1 or newer. Since 1.35 the kubelet also re-checks pull credentials before a Pod may use a privately pulled image or image volume that is already cached on the node (see below).</p>
${Y('Mounting model weights from an OCI artifact')`
volumes:
- name: model
  image:
    reference: registry.example.com/models/fraud-scorer:2026-10-31
    pullPolicy: IfNotPresent`}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Believing base64 is protection</strong>, or committing Secrets to Git.</li>
<li><strong>Expecting environment variables to update</strong> when the ConfigMap changes.</li>
<li><strong>subPath mounts for configuration that changes.</strong></li>
<li><strong>Mounting the API token into every Pod</strong> and binding broad RBAC to the default service account.</li>
<li><strong>Static cloud keys in Secrets</strong> where workload identity is available.</li>
<li><strong>Granting <code>list</code> on Secrets</strong>: it returns every value, not just names.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Who can read the Secret?</summary><p>Name three ways someone can read a Secret's value besides <code>get secret</code> RBAC.</p><p><em>Answer:</em> <code>list</code> or <code>watch</code> on Secrets; creating a Pod in the namespace that mounts it (and reading it from inside); reading etcd or its backups without encryption at rest; node access where the Pod runs.</p></details>
<details><summary>Roll on config change</summary><p>How do you make a Deployment roll automatically when its ConfigMap changes, using only built-in features?</p><p><em>Answer:</em> put a hash of the ConfigMap in a Pod template annotation (Helm and Kustomize can generate it), or use immutable ConfigMaps with a versioned name; either changes the template and triggers a rollout.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Decode your own token</summary><p>Exec into a Pod, read the projected token, decode its payload (base64url) and check iss, aud, exp and the kubernetes.io claims. Then delete the Pod and try the token from outside with <code>kubectl --token</code>.</p><p><em>Answer:</em> the claims name the Pod and node; after the Pod is deleted the API server rejects the token because its bound object no longer exists.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Your cluster as an identity provider</summary><p>In a cluster with a publicly reachable issuer, configure a cloud role trust policy for <code>system:serviceaccount:shop:web</code> and have a Pod list a storage bucket with no keys. What exactly does the cloud verify, and what would let another namespace impersonate it?</p><p><em>Answer:</em> signature (against the issuer's JWKS), issuer, audience, subject and expiry. Anyone able to create Pods using that service account in that namespace, or to create tokens for it, can obtain the role; RBAC on serviceaccounts/token and Pod creation is the real boundary.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can choose between env, volume and immutable ConfigMaps and predict how changes propagate.</li>
<li>I know what protects Secrets and what does not, and the external-store patterns.</li>
<li>I can explain bound service account tokens and how workload identity federation works.</li>
<li>I know when to use pod certificates, ClusterTrustBundles and image volumes.</li>
</ul>
`});

FIG.throttle = host => {
  host.innerHTML = `<div class="tool"><p class="meta" style="margin:0 0 8px">A request needs a fixed amount of CPU time, spread over several threads. A CPU limit becomes a quota per 100 ms period; once the container's threads use it up, they all wait for the next period.</p><div class="row"><div><label for="th-w">CPU work per request (ms)</label><input class="txt" type="number" id="th-w" value="240" min="10"></div><div><label for="th-t">busy threads</label><input class="txt" type="number" id="th-t" value="4" min="1" max="32"></div><div><label for="th-l">CPU limit (cores; 0 = none)</label><input class="txt" type="number" id="th-l" value="1" min="0" step="0.25"></div></div><div id="th-fig"></div><div class="out" id="th-out"></div></div>`;
  const draw = () => {
    const W = Math.max(1, +host.querySelector('#th-w').value || 1), T = Math.max(1, +host.querySelector('#th-t').value || 1), L = Math.max(0, +host.querySelector('#th-l').value || 0);
    const free = W / T, Q = L > 0 ? L * 100 : Infinity, perPeriod = Math.min(Q, T * 100);
    // totals computed exactly; only the first 10 periods are drawn
    const full = Math.floor(W / perPeriod), rem = W - full * perPeriod, periods = rem > 0 ? full + 1 : full;
    const throttledPeriods = L > 0 && Q < T * 100 ? periods - 1 : 0;
    let t = (periods - 1) * 100 + (rem > 0 ? rem : perPeriod) / T, thr = throttledPeriods * (100 - perPeriod / T), left = W, s = '';
    if (!(L > 0 && Q < T * 100)) t = free;
    for (let p = 0; p < Math.min(periods, 10); p++) {
      const used = Math.min(left, perPeriod), busy = used / T, x = 24 + p * 62;
      s += rect(x, 20, busy * 0.62, 28, 'bar ok', 2);
      if (left - used > 0 && L > 0 && Q < T * 100) s += rect(x + busy * 0.62, 20, (100 - busy) * 0.62, 28, 'bar hot', 2);
      left -= used;
    }
    if (periods > 10) s += tx(640, 34, `… ${periods} periods`, 'ti', 'end');
    for (let p = 0; p <= Math.min(periods, 10); p++) s += `<line x1="${f1(24 + p * 62)}" y1="14" x2="${f1(24 + p * 62)}" y2="54" class="ed dash"/>` + tx(24 + p * 62, 64, p * 100 + ' ms', 'ti');
    host.querySelector('#th-fig').innerHTML = `<div class="stage">${svgw(650, 74, s, 'CPU periods')}</div>`;
    host.querySelector('#th-out').innerHTML = `without a limit: <b>${free.toFixed(0)} ms</b> · with ${L ? L + ' core limit (' + Q + ' ms per period)' : 'no limit'}: <b class="${t > free * 1.2 ? 'd' : 'g'}">${t.toFixed(0)} ms</b>${thr ? ` · throttled ${thr.toFixed(0)} ms` : ''}<br><span class="meta">Average usage may look far below the limit while every request is slowed. Watch container_cpu_cfs_throttled_periods_total, not just usage.</span>`;
  };
  host.querySelectorAll('input').forEach(e => e.addEventListener('input', draw)); draw();
};

FIG.hpa = host => {
  host.innerHTML = `<div class="tool"><div class="row"><div><label for="hp-r">current replicas</label><input class="txt" type="number" id="hp-r" value="4" min="0"></div><div><label for="hp-u">average CPU utilisation (% of request)</label><input class="txt" type="number" id="hp-u" value="92"></div><div><label for="hp-t">target utilisation (%)</label><input class="txt" type="number" id="hp-t" value="60"></div></div><div class="row"><div><label for="hp-q">queue depth (external metric)</label><input class="txt" type="number" id="hp-q" value="300"></div><div><label for="hp-qt">target per replica</label><input class="txt" type="number" id="hp-qt" value="50"></div><div><label for="hp-tol">tolerance</label><input class="txt" type="number" id="hp-tol" value="0.1" step="0.01"></div></div><div class="row"><div><label for="hp-min">minReplicas</label><input class="txt" type="number" id="hp-min" value="2" min="0"></div><div><label for="hp-max">maxReplicas</label><input class="txt" type="number" id="hp-max" value="20"></div></div><div class="out" id="hp-out"></div></div>`;
  const $ = id => +host.querySelector('#' + id).value;
  const draw = () => {
    const r = $('hp-r'), u = $('hp-u'), t = Math.max(1, $('hp-t')), q = $('hp-q'), qt = Math.max(1, $('hp-qt')), tol = $('hp-tol'), mn = $('hp-min'), mx = $('hp-max');
    const lines = []; let best = 0;
    const one = (name, ratio, desired) => { const inTol = Math.abs(ratio - 1) <= tol; lines.push(`${name}: ratio ${ratio.toFixed(2)} → ${inTol ? `within tolerance, keep ${r}` : `ceil(${r} × ${ratio.toFixed(2)}) = ${desired}`}`); return inTol ? r : desired; };
    if (r > 0) best = Math.max(best, one('CPU', u / t, Math.ceil(r * u / t)));
    best = Math.max(best, one('queue (AverageValue)', r > 0 ? (q / Math.max(r, 1)) / qt : (q > 0 ? Infinity : 0), Math.ceil(q / qt)));
    let fin = Math.min(mx, Math.max(mn, best)), note = '';
    if (mn === 0) {
      note = 'minReplicas 0 (scale to zero, beta and on by default in 1.37) works only with Object or External metrics; an HPA that also has a CPU or memory metric is not supported, so this simulation ignores the CPU row.';
      fin = Math.min(mx, q === 0 ? 0 : Math.max(1, Math.ceil(q / qt)));
      lines.splice(0, lines.length, `queue (AverageValue): ${q === 0 ? 'zero → scale to zero, condition ScaledToZero' : `ceil(${q} / ${qt}) = ${Math.ceil(q / qt)}`}`);
    } else if (r === 0) { fin = 0; note = 'Current replicas are 0 and minReplicas is above 0: the HPA treats the target as switched off (ScalingActive=False) and does nothing.'; }
    host.querySelector('#hp-out').innerHTML = lines.map(esc).join('<br>') + `<br>the HPA takes the <b>largest</b> proposal across metrics, clamped to [${mn}, ${mx}]: <b class="g">${fin} replicas</b>` + (fin < r ? '<br><span class="meta">Scaling down is smoothed: by default the HPA uses the highest recommendation of the last 5 minutes (behavior.scaleDown.stabilizationWindowSeconds: 300).</span>' : '') + (note ? `<br><span class="meta">${note}</span>` : '');
  };
  host.querySelectorAll('input').forEach(e => e.addEventListener('input', draw)); draw();
};

  id: 'ch08', n: 8, title: 'Resources, Quotas and Autoscaling',
  lede: 'Requests decide where Pods fit, limits decide what happens when they misbehave, quotas decide how a shared cluster is divided, and autoscalers change all three in response to load. Getting these right is most of the difference between a cluster that is cheap and calm and one that is expensive and noisy.',
  html: `
<h2>Requests, limits and allocatable</h2>
<p>CPU is measured in cores (<code>250m</code> is a quarter core); memory in bytes (<code>512Mi</code>). The scheduler places Pods by <b>requests</b> only, against each node's <b>allocatable</b>: capacity minus <code>kube-reserved</code>, <code>system-reserved</code> and the eviction threshold. The sum of requests on a node can never exceed allocatable; the sum of limits can, which is <b>overcommitment</b>.</p>

kubectl describe node lab-worker | sed -n '/Capacity/,/Allocatable/p;/Allocated resources/,/Events/p'
kubectl top pods -A --sort-by=memory | head      # actual usage (metrics-server)`}
<div class="tbl"><table><tr><th></th><th>CPU</th><th>Memory</th></tr>
<tr><td>Request</td><td>Scheduling, and the share of CPU under contention (cgroup <code>cpu.weight</code>)</td><td>Scheduling, eviction ranking, and (with Memory QoS) protection via <code>memory.min</code></td></tr>
<tr><td>Limit</td><td>Hard quota per period: the container is <b>throttled</b></td><td>Hard ceiling: the container is <b>OOM-killed</b></td></tr>
<tr><td>Exceeding the request</td><td>Fine while the node has idle CPU</td><td>Fine until the node runs short; then such Pods are evicted first</td></tr>
</table></div>

<h2>CPU limits and throttling</h2>
${fig('throttle', '<b>Figure 8.1</b> Interactive: how a CPU limit stretches a multi-threaded request.')}
<p>Because the quota is per period and shared by all threads, a multi-threaded process can exhaust it in a fraction of the period and then stall. Many teams therefore set CPU <b>requests</b> carefully and leave CPU <b>limits</b> off for latency-sensitive services, relying on requests for fair sharing. Keep CPU limits where you need hard isolation (multi-tenant clusters, noisy batch jobs) and size them with throttling metrics. Always set memory limits; memory cannot be shared back once used.</p>
<div class="note key"><b>Runtimes and limits</b><p>Make sure runtimes see their container limits. Recent JVMs size the heap from the cgroup memory limit (use <code>-XX:MaxRAMPercentage</code>, typically 60 to 75); Go 1.25 and later set <code>GOMAXPROCS</code> from the CPU limit automatically; Node.js sizes its heap from the container's memory. A JVM with a heap larger than the container limit will be OOM-killed rather than throw OutOfMemoryError.</p></div>

<h2>Eviction</h2>
<p>When a node runs short of memory, disk or process IDs, the kubelet evicts Pods before the kernel's OOM killer acts. The default hard threshold for memory is <code>memory.available&lt;100Mi</code>. Pods are ranked by whether their usage exceeds their requests, then by Pod priority, then by usage relative to requests. Evicted Pods get a <code>DisruptionTarget</code> condition and their controllers replace them elsewhere.</p>

<h3>Memory pressure beyond limits: swap, PSI and Memory QoS</h3>
<ul>
<li><b>Swap</b> (stable since 1.34) is off unless the kubelet sets <code>memorySwap.swapBehavior: LimitedSwap</code>. Then only Burstable Pods may swap, in proportion to their memory requests; Guaranteed and BestEffort Pods never do. Keep it off for latency-critical workloads and for anything holding secrets or card data, or use encrypted swap, because swapped pages reach the disk.</li>
<li><b>Pressure stall information</b> (stable since 1.36) reports how long tasks waited for memory, CPU and I/O (<code>container_pressure_memory_waiting_seconds_total</code> and friends from the kubelet). It is an earlier and more honest signal than OOM counts: a container can be stalling on memory long before it is killed.</li>
<li><b>Memory QoS</b> (beta and on by default in 1.37, cgroup v2 only) sets <code>memory.min</code> from requests, protecting them from reclaim, and <code>memory.high</code> below the limit, so the kernel throttles and reclaims a container approaching its limit before the OOM killer acts.</li>
<li><b>Whole-container OOM kills.</b> Since 1.32 the kubelet sets <code>memory.oom.group</code>, so an OOM kills every process in the container rather than one victim; set <code>singleProcessOOMKill</code> in the kubelet configuration if a multi-process container relies on the old behaviour.</li>
</ul>

<h2>Sharing a cluster: LimitRange and ResourceQuota</h2>
${Y('Defaults and a budget for a team namespace')`
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: team-payments}
spec:
  limits:
  - type: Container
    defaultRequest: {cpu: 100m, memory: 128Mi}   # applied when a container sets none
    default:        {memory: 256Mi}               # default limit (must be >= any request you expect)
    max:            {cpu: "4", memory: 8Gi}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: budget, namespace: team-payments}
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.memory: 120Gi
    pods: "200"
    services.loadbalancers: "2"
    persistentvolumeclaims: "30"
    requests.storage: 2Ti
    count/jobs.batch: "50"`}
<p>A ResourceQuota makes the API server reject creations that would exceed it, and once a quota covers a resource, every Pod must specify it (which is why it pairs with a LimitRange for defaults). LimitRange defaults are applied per missing field: a container that requests 512Mi of memory but sets no limit receives the 256Mi default limit and is rejected because its request exceeds it, so set default limits at least as large as any request you expect, or require explicit limits. Quotas can be scoped, for example to a PriorityClass, so that high-priority workloads have their own budget.</p>

<h2>Autoscaling</h2>
${fig('autos', '<b>Figure 8.2</b> Interactive: the autoscalers and what each one changes.')}
<p>Autoscalers form layers. The <b>HPA</b> adds Pods when load rises; the new Pods are Pending if they do not fit; a <b>node autoscaler</b> (Cluster Autoscaler or Karpenter) sees Pending Pods and adds nodes; when load falls, the HPA removes Pods and the node autoscaler removes or consolidates the emptied nodes. The <b>VPA</b> works on another axis, correcting requests over time.</p>

<h2>The Horizontal Pod Autoscaler</h2>
${Y('autoscaling/v2 with two metrics and tuned behaviour')`
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: payments-worker}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: payments-worker}
  minReplicas: 2
  maxReplicas: 40
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
  - type: External
    external:
      metric: {name: queue_messages_ready, selector: {matchLabels: {queue: payments}}}
      target: {type: AverageValue, averageValue: "50"}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 30}]   # at most double every 30 s
      tolerance: 0.05                                                # react to 5% deviations (stable in 1.37)
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Pods, value: 2, periodSeconds: 60}]`}
${fig('hpa', '<b>Figure 8.3</b> Interactive: the HPA calculation with a resource and an external metric, tolerance, and scale to zero.')}
<p>The algorithm is <code>desired = ceil(current × currentValue / target)</code> per metric, ignoring changes within the tolerance (10% by default, configurable per direction), and taking the largest result across metrics. Utilisation is measured against <b>requests</b>, so wrong requests produce wrong scaling. Scaling to zero replicas, long done by KEDA, is beta and enabled by default in the built-in HPA since 1.37 for object and external metrics (not CPU or memory).</p>
<p>A <code>Resource</code> metric averages over the whole Pod: the usage of every container, sidecars included, divided by the sum of their requests. With a mesh proxy or log shipper in the Pod, scale on the application container alone with a <code>ContainerResource</code> metric (stable since 1.30): <code>containerResource: {name: cpu, container: app, target: {type: Utilization, averageUtilization: 60}}</code>. When the Pod uses Pod-level resources, utilisation is measured against the Pod-level request.</p>
<h3>Inputs the formula does not show</h3>
<ul>
<li><b>New and unready Pods.</b> When scaling up, Pods that are not yet ready, or that started within the CPU initialisation period (5 minutes by default), are ignored, and Pods without metrics count as 0%; when scaling down, missing Pods count as 100%. That is why a burst of freshly started JVMs does not trigger runaway scale-up.</li>
<li><b>Reaction time.</b> The HPA evaluates every 15 seconds, and metrics-server scrapes kubelets every 15 seconds by default, so a step in load takes 15 to 30 seconds to register before any Pod is even created.</li>
<li><b>Tolerance and stabilisation together.</b> The per-direction tolerance (stable in 1.37) ignores small ratios; the stabilisation window then picks the highest recommendation of the window for scale-down. Tune the window first: it is what prevents flapping.</li>
<li><b>Event sources.</b> Built-in scale-to-zero needs an Object or External metric through an adapter; KEDA remains the practical choice when scaling from Kafka lags, SQS queues or cron schedules, because it also handles activation from zero.</li>
</ul>

<h2>Right-sizing</h2>
<p>Most clusters waste half their capacity on requests nobody uses. A practical loop: run the VPA in recommendation mode (<code>updateMode: "Off"</code>) or use your observability stack to compare requests with p95 usage over two weeks; set CPU requests near typical usage and memory requests near peak; review monthly. Bin-packing improves when requests are honest, and the node autoscaler can then remove nodes.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>No requests at all</strong>: the scheduler packs blindly and the HPA cannot compute utilisation.</li>
<li><strong>Tight CPU limits on latency-sensitive services</strong>, hidden as throttling.</li>
<li><strong>Memory request far below real use</strong>: the Pod is first in line for eviction.</li>
<li><strong>HPA and VPA both acting on CPU</strong> for the same workload: they fight.</li>
<li><strong>Replicas in Git and an HPA in the cluster</strong>: every sync resets the count (Chapter 3).</li>
<li><strong>Node autoscaler limits lower than HPA maximums</strong>: Pods stay Pending at the worst moment.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>The HPA by hand</summary><p>5 replicas at 90% average CPU, target 60%, tolerance 10%. How many replicas? What if utilisation were 64%?</p><p><em>Answer:</em> ceil(5 × 1.5) = 8. At 64% the ratio is 1.067, inside the tolerance: stay at 5.</p></details>
<details><summary>Why Pending?</summary><p>A Pod requesting 3 CPU stays Pending on a cluster with 10 idle CPUs spread as 2 per node. Why, and what fixes it?</p><p><em>Answer:</em> requests must fit on one node; no node has 3 allocatable CPUs free. Larger nodes, a node autoscaler with a bigger instance type, or smaller Pods.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Find throttling</summary><p>Run a CPU-bound multi-threaded load test against a Pod with a 500m limit and query <code>container_cpu_cfs_throttled_periods_total / container_cpu_cfs_periods_total</code>. Remove the limit and compare p99 latency.</p><p><em>Answer:</em> a high throttled ratio with moderate average usage indicates limit-induced latency; p99 drops when the limit is removed or raised.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Scale a queue worker to zero</summary><p>Use an external metric from your queue (via KEDA or a metrics adapter) with an HPA at <code>minReplicas: 0</code> on a 1.37 cluster. Measure the delay from the first message to the first processed message.</p><p><em>Answer:</em> the delay is the metric polling interval plus Pod scheduling and start-up time (and node provisioning if a node must be added); design the queue's tolerance for that cold start.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain what requests and limits do for CPU and memory and how allocatable is computed.</li>
<li>I can detect and reason about CPU throttling.</li>
<li>I can set up LimitRanges and ResourceQuotas for a team namespace.</li>
<li>I can configure an HPA with several metrics and behaviours, and know how it composes with node autoscalers and the VPA.</li>
</ul>
`});

FIG.schedsim = host => {

  <div id="ss-fig"></div><div class="out" id="ss-out"></div></div>`;
  const $ = id => host.querySelector('#' + id);
  const draw = () => {
    const cpu = +$('ss-cpu').value || 0, mem = +$('ss-mem').value || 0, req = $('ss-sel').value, pref = $('ss-pref').value, anti = $('ss-anti').value, tol = $('ss-tol').checked;
    const res = SNODES.map(nd => {
      let why = '';
      if (nd.taint && !tol) why = `TaintToleration: untolerated taint ${nd.taint}:NoSchedule`;
      else if (req === 'disk=ssd' && nd.labels.disk !== 'ssd') why = 'NodeAffinity: disk is not ssd';
      else if (req === 'zone=b' && nd.zone !== 'b') why = 'NodeAffinity: zone is not b';
      else if (req === 'gpu' && !nd.labels.gpu) why = 'NodeAffinity: no gpu label';
      else if (cpu > nd.cpu) why = `NodeResourcesFit: insufficient cpu (${nd.cpu} free)`;
      else if (mem > nd.mem) why = `NodeResourcesFit: insufficient memory (${nd.mem} GiB free)`;
      else if (anti === 'req' && nd.pods.includes('web')) why = 'InterPodAffinity: a web Pod already runs here';
      let score = 0, parts = [];
      if (!why) {

        const spread = { a: 2, b: 0, c: 0 }[nd.zone]; if (spread) { score -= 10 * spread; parts.push(`default zone spreading (system soft constraint) −${10 * spread}`); }
      }

    });

      r.nd.pods.forEach((p, j) => s += pod(x + 8 + (j % 2) * 56, 76 + Math.floor(j / 2) * 28, p, 'dim', 50));

    });
    $('ss-fig').innerHTML = `<div class="stage">${svgw(650, 152, s, 'Scheduling decision')}</div>`;
    $('ss-out').innerHTML = res.map(r => `${r.nd.n}: ${r.why ? `<span class="d">${esc(r.why)}</span>` : esc(r.parts.join(', ')) + ' = ' + r.score}`).join('<br>') + `<br>${win ? `<b class="g">Bind to ${win.nd.n}</b>` : '<b class="d">0/5 nodes are available. The Pod stays Pending (FailedScheduling event lists these reasons); PostFilter tries preemption if the Pod has a high enough priority.</b>'}`;

FIG.schedfw = host => {
  const P = [['PreEnqueue', 'q'], ['QueueSort', 'q'], ['PreFilter', 's'], ['Filter', 's'], ['PostFilter', 's'], ['PreScore', 's'], ['Score', 's'], ['Normalize', 's'], ['Reserve', 's'], ['Permit', 's'], ['PreBind', 'b'], ['Bind', 'b'], ['PostBind', 'b']];
  const N = ['A scheduling framework profile is a list of plugins at each extension point. Every built-in behaviour (resources, affinity, taints, spreading, volumes) is a plugin.', '<b>PreEnqueue</b>: may the Pod enter the queue at all? Pods with <code>schedulingGates</code> wait here until every gate is removed, which is how queueing systems hold Pods back.', '<b>QueueSort</b>: order of the active queue, normally by priority then age. Pods that failed wait in back-off or in the unschedulable pool until a cluster event that could help them (plugin-specific queueing hints decide which events matter).', '<b>PreFilter</b>: pre-compute for this Pod (for example, the topology domains for spreading); may reject the Pod outright.', '<b>Filter</b>: run for each node, in parallel: NodeResourcesFit, NodeAffinity, TaintToleration, PodTopologySpread, InterPodAffinity, VolumeBinding, NodePorts… A node failing any filter is out.', '<b>PostFilter</b>: only if no node passed. DefaultPreemption looks for a node where evicting lower-priority Pods would make room.', '<b>PreScore</b>: pre-compute for scoring.', '<b>Score</b>: each plugin scores each feasible node 0–100; scores are weighted and summed.', '<b>NormalizeScore</b>: plugins rescale their raw scores to 0–100.', '<b>Reserve</b>: the chosen node\'s resources are reserved in the scheduler\'s cache, so the next Pod does not take them. Unreserve runs on later failure.', '<b>Permit</b>: approve, deny, or wait. Out-of-tree co-scheduling plugins hold Pods here until their group is complete; the in-tree gang scheduler (the Workload API) instead schedules a whole PodGroup in one PodGroup scheduling cycle.', '<b>PreBind</b>: work before binding, such as provisioning or attaching volumes, or waiting for DRA devices to be ready. This and the following steps run asynchronously (the binding cycle), so the scheduler can start on the next Pod.', '<b>Bind</b>: write the Binding to the API server.', '<b>PostBind</b>: clean-up and notifications.'];
  stepper(host, N.map((note, k) => ({ k, note })), f => {
    let s = rect(4, 4, 96, 120, 'nd dim', 8) + tx(52, 18, 'queueing', 'ti') + rect(104, 4, 384, 120, 'nd dim', 8) + tx(296, 18, 'scheduling cycle (one Pod at a time)', 'ti') + rect(492, 4, 154, 120, 'nd dim', 8) + tx(569, 18, 'binding cycle (async)', 'ti');
    let qi = 0, si = 0, bi = 0;
    P.forEach(([n, ph], i) => {
      let x, y; if (ph === 'q') { x = 12; y = 30 + qi++ * 44; } else if (ph === 's') { x = 112 + (si % 3) * 124; y = 30 + Math.floor(si++ / 3) * 30; } else { x = 500; y = 30 + bi++ * 30; }
      const w = ph === 's' ? 116 : ph === 'q' ? 80 : 138, h = ph === 'q' ? 36 : 24;
      s += rect(x, y, w, h, 'nd ' + (i + 1 === f.k ? 'hot' : i + 1 < f.k ? 'ok' : ''), 5) + tx(x + w / 2, y + h / 2, n, 'ti');
    });
    return { s, w: 650, h: 130 };
  }, { speed: 1700 });
};

    else if (!hard) { const z = Object.keys(Z).filter(z => !(z === 'c' && full)).sort((p, q) => Z[p] - Z[q])[0]; Z[z]++; msg = `no zone satisfies maxSkew ${skew}; ScheduleAnyway places it in zone ${z}, preferring lower skew`; }
    else msg = `<span class="d">Pending: placing it anywhere would exceed maxSkew ${skew} (zone c, with the fewest Pods, has no capacity). This is how a full zone can block a whole Deployment.</span>`;
