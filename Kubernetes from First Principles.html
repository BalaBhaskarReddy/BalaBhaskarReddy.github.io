  id: 'ch16', n: 16, title: 'Authentication, Authorization and RBAC',
  lede: 'Every request to the API server is from someone and is either allowed or denied. Kubernetes delegates the first question to identity systems and answers the second with authorizers, usually RBAC. Getting both right is the foundation of cluster security: most real Kubernetes compromises involve a credential with far more permission than it needed.',
  html: `
<h2>Identities</h2>
<p>Kubernetes has no User objects. A human or system is authenticated by a credential, and the result is a <b>user name</b>, a <b>UID</b> and a list of <b>groups</b> (every authenticated identity is also in <code>system:authenticated</code>). Service accounts are the exception: they are API objects, and appear as <code>system:serviceaccount:&lt;namespace&gt;:&lt;name&gt;</code> in groups <code>system:serviceaccounts</code> and <code>system:serviceaccounts:&lt;namespace&gt;</code>.</p>
${fig('authn', '<b>Figure 16.1</b> Interactive: ways to authenticate and when to use each.')}
${Y('Structured authentication: an OIDC issuer with claim rules')`
apiVersion: apiserver.config.k8s.io/v1
kind: AuthenticationConfiguration
jwt:
- issuer:
    url: https://login.example.com/tenant-id/v2.0
    audiences: [kubernetes-prod]
  claimValidationRules:
  - expression: 'claims.amr.exists(m, m == "mfa")'     # require MFA
    message: multi-factor authentication required
  claimMappings:
    username: {expression: '"oidc:" + claims.preferred_username'}
    groups:   {expression: 'claims.groups.map(g, "oidc:" + g)'}   # prefix to avoid colliding with system: groups
anonymous:
  enabled: true
  conditions: [{path: /livez}, {path: /readyz}, {path: /healthz}]   # nothing else is anonymous`}

<h2>Authorization</h2>
<p>After authentication, the request is described as attributes: user and groups, verb (get, list, watch, create, update, patch, delete, deletecollection, plus special verbs such as <code>escalate</code>, <code>bind</code>, <code>impersonate</code>), API group, resource, subresource, namespace and name. Authorizers run in order (typically <b>Node</b>, then <b>RBAC</b>, optionally a <b>webhook</b>) until one allows or denies. RBAC never denies; it only allows or has no opinion.</p>

<h3>Authorization configuration and audit policy</h3>
<p>Since 1.32 (stable), an <code>AuthorizationConfiguration</code> file replaces the <code>--authorization-mode</code> flag: an ordered chain of authorizers, several webhooks each with CEL <code>matchConditions</code> (call the webhook only for requests it cares about), timeouts and a <code>failurePolicy</code>, reloaded without restarting the API server.</p>
${Y('AuthorizationConfiguration and a starting audit policy')`
apiVersion: apiserver.config.k8s.io/v1
kind: AuthorizationConfiguration
authorizers:
- type: Node
  name: node
- type: RBAC
  name: rbac
- type: Webhook                         # e.g. a policy service for one sensitive API group
  name: payments-authz
  webhook:
    timeout: 3s
    subjectAccessReviewVersion: v1
    matchConditionSubjectAccessReviewVersion: v1
    failurePolicy: Deny
    connectionInfo: {type: KubeConfigFile, kubeConfigFile: /etc/kubernetes/payments-authz.kubeconfig}
    matchConditions:
    - expression: has(request.resourceAttributes) && request.resourceAttributes.group == 'payments.example.com'
---
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
- level: None                            # health checks and noise
  nonResourceURLs: ["/healthz*", "/livez*", "/readyz*"]
- level: Metadata                        # never log Secret contents
  resources: [{group: "", resources: [secrets, configmaps, serviceaccounts/token]}]
- level: RequestResponse                 # who changed access, and how
  resources:
  - {group: rbac.authorization.k8s.io}
  - {group: admissionregistration.k8s.io}
  - {group: certificates.k8s.io}
- level: Metadata                        # everything else`}
<p>Ship audit logs off the cluster to a store the cluster administrators cannot modify; for PCI DSS (requirement 10) they are the record of who did what to the cardholder data environment.</p>

<h2>RBAC</h2>
<div class="tbl"><table><tr><th>Object</th><th>Scope</th><th>Contains</th></tr>
<tr><td>Role</td><td>Namespace</td><td>Rules: API groups, resources, verbs (optionally resource names)</td></tr>
<tr><td>ClusterRole</td><td>Cluster</td><td>Rules for any namespace, cluster-scoped resources, or non-resource URLs; reusable templates</td></tr>
<tr><td>RoleBinding</td><td>Namespace</td><td>Grants a Role or a ClusterRole to subjects, <b>in that namespace only</b></td></tr>
<tr><td>ClusterRoleBinding</td><td>Cluster</td><td>Grants a ClusterRole to subjects in all namespaces</td></tr>
</table></div>
${Y('A least-privilege role for a CI deployer')`
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: deployer, namespace: shop}
rules:
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [""]
  resources: [services, configmaps]
  verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: ci-deployer, namespace: shop}
subjects:
- {kind: ServiceAccount, name: deployer, namespace: ci}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployer}`}

kubectl auth can-i create pods/exec -n shop --as=meera
kubectl auth whoami                                     # who am I, according to the API server
kubectl get clusterrolebindings -o json | jq -r '.items[] | select(.roleRef.name=="cluster-admin") | .subjects'`}

<h2>Dangerous permissions</h2>
<p>Some permissions are equivalent to much more than they appear. Treat them as administrator rights.</p>
<div class="tbl"><table><tr><th>Permission</th><th>Why it is dangerous</th></tr>
<tr><td>Create Pods (or any workload) in a namespace</td><td>Can mount any Secret and use any service account in that namespace; with privileged Pods allowed, can take over the node</td></tr>
<tr><td><code>get/list/watch secrets</code></td><td>Reads every credential, including service account tokens for older clusters</td></tr>
<tr><td><code>pods/exec</code>, <code>pods/attach</code>, <code>pods/portforward</code></td><td>Acts as the workload: its secrets, its identity, its network access</td></tr>
<tr><td><code>escalate</code>, <code>bind</code> on roles</td><td>Lets a user grant permissions they do not have</td></tr>
<tr><td><code>patch</code>/<code>update</code> on <code>namespaces</code></td><td>Relabel a namespace, for example setting <code>pod-security.kubernetes.io/enforce: privileged</code>, which switches off Pod Security for everything in it</td></tr>
<tr><td><code>approve</code> on certificate signers, <code>create persistentvolumes</code>, <code>update nodes/status</code></td><td>Mint client certificates for any identity the signer allows; create hostPath volumes onto nodes; influence scheduling and node health</td></tr>
<tr><td><code>impersonate</code></td><td>Become any user or group, including system:masters (constrained impersonation, beta since 1.36, limits what an impersonator may do)</td></tr>
<tr><td><code>create serviceaccounts/token</code></td><td>Mint tokens for a service account and use its rights</td></tr>
<tr><td>Write to webhook configurations, CRDs or APIServices</td><td>Intercept or replace API traffic</td></tr>
<tr><td><code>nodes/proxy</code> (even just <code>get</code>)</td><td>Reaches the kubelet API directly, bypassing the API server's admission and audit. Because a WebSocket handshake is a GET, <code>get nodes/proxy</code> is enough to exec into any container on the node. Since 1.36 (fine-grained kubelet authorization, stable) grant monitoring <code>nodes/metrics</code> and <code>nodes/stats</code> instead, and remove <code>nodes/proxy</code> from every non-admin role. Since 1.35 the API server also requires <code>create</code>, not just <code>get</code>, on <code>pods/exec</code>, <code>pods/attach</code> and <code>pods/portforward</code> for WebSocket connections: audit old roles that relied on <code>get</code>.</td></tr>
</table></div>
<p>RBAC has a built-in safeguard: you cannot create or update a Role or binding granting permissions you do not already have, unless you have <code>escalate</code> or <code>bind</code>. That is why controllers that manage RBAC need those verbs and should be reviewed carefully.</p>

<h2>The Node authorizer</h2>
<p>Kubelets authenticate as <code>system:node:&lt;name&gt;</code> in group <code>system:nodes</code>. The Node authorizer plus the NodeRestriction admission plugin limit each kubelet to the Pods, Secrets, ConfigMaps and volumes of Pods bound to its own node, and to modifying only its own Node object. A compromised node therefore exposes its own workloads' secrets, not the whole cluster's. Since 1.34, authorization can also depend on field and label selectors, which lets policies restrict list and watch to, for example, Pods on one node.</p>

<h2>Practical model for an organisation</h2>
<ul>
<li>People authenticate through OIDC with MFA; groups come from the IdP.</li>
<li>Platform administrators get <code>cluster-admin</code> only through just-in-time elevation, audited.</li>
<li>Teams get <code>edit</code>-like roles in their namespaces through RoleBindings to groups; production write access goes through GitOps rather than kubectl.</li>
<li>Every controller and CI pipeline has its own service account with a minimal role. Operators you write declare their RBAC with kubebuilder markers (Chapter 26), reviewed like code.</li>
<li>No one is in <code>system:masters</code> except a sealed break-glass credential.</li>
<li>Audit logs record every write and every access to Secrets, and are shipped off the cluster.</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Binding <code>cluster-admin</code></strong> to CI, operators or the default service account.</li>
<li><strong>Wildcards</strong> (<code>resources: ["*"]</code>, <code>verbs: ["*"]</code>) in roles that will gain new resources as CRDs are installed.</li>
<li><strong>Granting list on Secrets</strong> while thinking it shows only names.</li>
<li><strong>Using a ClusterRoleBinding</strong> when a RoleBinding to a ClusterRole would scope it.</li>
<li><strong>Long-lived kubeconfigs with client certificates</strong> on laptops.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>ClusterRole via RoleBinding</summary><p>A RoleBinding in namespace shop references the ClusterRole <code>view</code>. Can the subject list Pods in payments? Nodes?</p><p><em>Answer:</em> no and no: a RoleBinding grants the ClusterRole's rules only in its own namespace, and cluster-scoped resources such as Nodes cannot be granted by a RoleBinding.</p></details>
<details><summary>Hidden admin</summary><p>A team can create Deployments in their namespace and the namespace has no Pod Security enforcement. Why might they be cluster administrators in effect?</p><p><em>Answer:</em> they can run a privileged Pod with hostPath / and host PID on a node, take over the node, and use the kubelet's or other Pods' credentials. RBAC alone does not stop it; Pod Security Admission does (Chapter 17).</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Audit your bindings</summary><p>List every subject bound to cluster-admin, every role with wildcards, and every subject that can read Secrets cluster-wide. Use kubectl and jq, or a tool such as rbac-tool or kubectl-who-can.</p><p><em>Answer:</em> typical findings: old CI service accounts with cluster-admin, operators with wildcard roles, and monitoring tools with cluster-wide Secret access they do not need.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>OIDC in kind</summary><p>Run Keycloak or Dex, configure the kind API server with an AuthenticationConfiguration file for it, and log in with kubelogin. Add a claim validation rule requiring a group, and confirm a user without it gets 401.</p><p><em>Answer:</em> the API server validates the token against the issuer's keys, applies CEL rules and mappings, and rejects tokens failing validation before authorization runs.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain how users, groups and service accounts are authenticated, and configure OIDC with structured authentication.</li>
<li>I can write Roles, ClusterRoles and bindings with the correct scope.</li>
<li>I can recognise permissions that amount to administrator rights.</li>
<li>I can design an access model with least privilege, just-in-time elevation and auditing.</li>
</ul>
`});

CH.push({
  id: 'ch17', n: 17, title: 'Admission Control and Policy',
  lede: 'RBAC decides who may create a Pod; admission control decides what kind of Pod may be created. It is where organisations enforce security baselines, conventions and guardrails, and where they inject defaults. Kubernetes now has native, in-process policy written in CEL alongside webhooks and policy engines, so most rules no longer need extra infrastructure.',
  html: `
<h2>Where admission sits</h2>
<p>After authentication and authorization, a write passes <b>mutating admission</b> (which may change the object), schema validation, then <b>validating admission</b> (which may only accept or reject). Admission sees the full object, so it can enforce rules RBAC cannot express: "no privileged Pods", "images only from our registry", "every Deployment has an owner label". Reads are never subject to admission.</p>
<div class="tbl"><table><tr><th>Mechanism</th><th>Runs</th><th>Written in</th><th>Status</th></tr>
<tr><td>Built-in admission plugins</td><td>In the API server</td><td>Go (part of Kubernetes)</td><td>NamespaceLifecycle, LimitRanger, ServiceAccount, NodeRestriction, ResourceQuota, PodSecurity, DefaultStorageClass…</td></tr>
<tr><td>ValidatingAdmissionPolicy</td><td>In the API server</td><td>CEL</td><td>Stable since 1.30</td></tr>
<tr><td>MutatingAdmissionPolicy</td><td>In the API server</td><td>CEL producing apply configurations or JSON patches</td><td>Stable since 1.36</td></tr>
<tr><td>Admission webhooks</td><td>Your HTTPS service</td><td>Any language</td><td>Stable; most flexible, most operational risk</td></tr>
<tr><td>Policy engines (Kyverno, OPA Gatekeeper)</td><td>Webhooks, increasingly generating native policies</td><td>YAML or Rego, CEL</td><td>Add reporting, mutation, generation, image verification</td></tr>
</table></div>

<h2>Pod Security Admission</h2>
<p>The <b>Pod Security Standards</b> define three levels: <b>privileged</b> (unrestricted), <b>baseline</b> (blocks known privilege escalations: privileged containers, host namespaces, hostPath, dangerous capabilities, and probes or hooks that target another host) and <b>restricted</b> (current hardening practice: non-root, no privilege escalation, all capabilities dropped, seccomp). The built-in PodSecurity admission plugin enforces them per namespace through labels.</p>
${Y('Namespace labels for Pod Security')`
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37   # pin, then raise deliberately
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted`}
${fig('psa', '<b>Figure 17.1</b> Interactive: which Pod Security level a Pod meets, and whether a namespace admits it.')}
${Y('A container that meets restricted')`
securityContext:                 # Pod level
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
containers:
- name: app
  image: registry.example.com/web:1.9.0
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
    readOnlyRootFilesystem: true   # not required by restricted, but recommended`}
<p>Roll out with <code>warn</code> and <code>audit</code> first, read the warnings and audit annotations, fix workloads, then <code>enforce</code>. A server-side dry run shows what would break: <code>kubectl label --dry-run=server --overwrite ns payments pod-security.kubernetes.io/enforce=restricted</code>.</p>

<h2>ValidatingAdmissionPolicy</h2>
${Y('A policy, its parameters, and a binding')`
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: approved-registries}
spec:
  failurePolicy: Fail
  paramKind: {apiVersion: v1, kind: ConfigMap}
  matchConstraints:
    resourceRules:
    - {apiGroups: [apps], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [deployments, statefulsets, daemonsets]}
  variables:
  - name: containers
    expression: 'object.spec.template.spec.containers + (has(object.spec.template.spec.initContainers) ? object.spec.template.spec.initContainers : [])'
  validations:
  - expression: 'variables.containers.all(c, params.data.registries.split(",").exists(r, c.image.startsWith(r)))'
    messageExpression: '"images must come from: " + params.data.registries'
    reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: approved-registries-prod}
spec:
  policyName: approved-registries
  validationActions: [Deny]          # or Warn, Audit, while rolling out
  paramRef: {name: registries, namespace: platform, parameterNotFoundAction: Deny}
  matchResources:
    namespaceSelector: {matchLabels: {env: prod}}`}
${fig('cel', '<b>Figure 17.2</b> Interactive: CEL validation rules applied to a Deployment, with the three validation actions.')}
<p>CEL expressions are type-checked when the policy is created and their cost is bounded, so a bad policy cannot hang the API server. Because policies run in-process, there is no webhook to fail or slow down. Since 1.37 (beta) policies can also be loaded from files on the control plane (<code>staticManifestsDir</code>), so critical guardrails cannot be deleted through the API, even by an administrator.</p>

<h2>MutatingAdmissionPolicy</h2>
${Y('Inject a default without a webhook')`
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata: {name: default-seccomp}
spec:
  matchConstraints:
    resourceRules: [{apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [pods]}]
  matchConditions:
  - name: no-seccomp-set
    expression: '!has(object.spec.securityContext) || !has(object.spec.securityContext.seccompProfile)'
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      expression: 'Object{spec: Object.spec{securityContext: Object.spec.securityContext{seccompProfile: Object.spec.securityContext.seccompProfile{type: "RuntimeDefault"}}}}'
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata: {name: default-seccomp}
spec: {policyName: default-seccomp}`}

<h2>Admission webhooks</h2>
<p>When rules need external data, complex logic or side effects, write a webhook: an HTTPS service that receives an <code>AdmissionReview</code> and returns allowed or denied (and for mutating webhooks, a JSON patch). Chapter 28 builds one with controller-runtime. Configure them defensively:</p>
<ul>
<li><b>matchConditions</b> (CEL) and selectors so the webhook only sees requests it needs; exclude <code>kube-system</code> and the webhook's own namespace.</li>
<li><b>timeoutSeconds</b> short (2–5 s) and enough replicas with a PodDisruptionBudget.</li>
<li><b>failurePolicy</b>: <code>Fail</code> for security rules (no silent bypass), <code>Ignore</code> for conveniences; know that Fail plus an outage blocks matching writes cluster-wide.</li>
<li><b>sideEffects: None</b> and idempotent mutations, since a request may be retried or dry-run.</li>
</ul>

<h2>Policy engines</h2>
<p><b>Kyverno</b> (CEL-based ValidatingPolicy, MutatingPolicy, GeneratingPolicy, ImageValidatingPolicy and DeletingPolicy in <code>policies.kyverno.io/v1</code>, plus policy reports; its older JMESPath <code>ClusterPolicy</code> is deprecated and scheduled for removal in Kyverno 1.20) and <b>OPA Gatekeeper</b> (Rego constraint templates, audit of existing resources) add what native policies lack: reporting on resources that already exist, generating default objects (a default-deny NetworkPolicy in every new namespace), and verifying image signatures. Both increasingly compile to native ValidatingAdmissionPolicies where possible, keeping the webhook only for what CEL cannot do.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>A webhook with failurePolicy Fail and one replica</strong>: one Pod restart blocks deployments cluster-wide, or worse, if it matches its own Pods, it can never start again.</li>
<li><strong>Policies that check only Pods</strong> but not Deployments: users learn of the rejection only when ReplicaSets fail to create Pods. Validate the controllers too, or rely on warnings.</li>
<li><strong>Enforcing restricted without a warn phase.</strong></li>
<li><strong>Mutation that surprises teams</strong>: injected defaults should be documented and visible.</li>
<li><strong>Policies with no tests.</strong> Keep test manifests that must pass and must fail next to each policy, in CI.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Which level?</summary><p>A Pod runs as UID 1000 with all capabilities dropped and RuntimeDefault seccomp, but mounts hostPath /var/log. Which level does it meet?</p><p><em>Answer:</em> privileged only: hostPath violates baseline, regardless of the other settings.</p></details>
<details><summary>Native or webhook?</summary><p>"Images must be signed by our CI key" and "Deployments need a team label". Which mechanism for each?</p><p><em>Answer:</em> the label rule is a simple CEL ValidatingAdmissionPolicy; signature verification needs to fetch signatures from the registry, so a webhook-based engine (Kyverno, Sigstore policy-controller).</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Roll out restricted safely</summary><p>Label every non-system namespace with <code>warn=restricted</code> and <code>audit=restricted</code>, collect the warnings for a week from the audit log, fix the top offenders, then enforce namespace by namespace.</p><p><em>Answer:</em> audit events carry <code>pod-security.kubernetes.io/audit-violations</code> annotations you can aggregate by namespace and image.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Undeletable guardrails</summary><p>On a 1.37 kind cluster, configure the API server's AdmissionConfiguration with <code>staticManifestsDir</code> containing a ValidatingAdmissionPolicy that forbids privileged Pods, and confirm that a cluster-admin cannot delete it through the API.</p><p><em>Answer:</em> put both the policy and its binding in the directory, named with the required <code>.static.k8s.io</code> suffix and without <code>paramKind</code> or <code>paramRef</code>, and reference the directory from the ValidatingAdmissionPolicyConfiguration in the API server's AdmissionConfiguration. The objects never exist in etcd, so <code>kubectl delete</code> cannot remove them, and API objects using the reserved suffix are refused. The guardrail now depends on who can write files on control-plane hosts (the API server re-reads them about once a minute), a much smaller group than cluster administrators.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can place mutating and validating admission in the request pipeline.</li>
<li>I can apply Pod Security levels to namespaces and roll them out safely.</li>
<li>I can write ValidatingAdmissionPolicies and MutatingAdmissionPolicies in CEL with parameters and bindings.</li>
<li>I can configure webhooks defensively and know when a policy engine is worth adding.</li>
</ul>
`});

CH.push({
  id: 'ch18', n: 18, title: 'Hardening Workloads, the Supply Chain and Tenancy',
  lede: 'A Kubernetes cluster is only as strong as the weakest Pod it runs and the least trustworthy image it accepts. This chapter follows a realistic attack from a vulnerable web app to cluster takeover, then builds the controls that break it: container isolation, secret protection, a verifiable supply chain, runtime detection, and multi-tenancy models.',
  html: `
<h2>How clusters are attacked</h2>
${fig('attack', '<b>Figure 18.1</b> Step through: a typical attack path, and the control that breaks each step.')}
<p>Almost every step relies on a default that was never tightened. Defence in depth means that no single control has to be perfect: the attacker has to beat all of them.</p>

<h2>Isolating containers</h2>
<p>Containers share the node's kernel. The kernel features that separate them:</p>
<div class="tbl"><table><tr><th>Control</th><th>Kubernetes field</th><th>Recommended</th></tr>
<tr><td>Run as non-root user</td><td><code>runAsNonRoot</code>, <code>runAsUser</code></td><td>Always, unless the image truly needs root (then user namespaces)</td></tr>
<tr><td>User namespaces</td><td><code>hostUsers: false</code></td><td>Stable since 1.36; root inside maps to an unprivileged user on the node</td></tr>
<tr><td>Linux capabilities</td><td><code>capabilities.drop: [ALL]</code>, add back only what is needed</td><td>Drop all</td></tr>
<tr><td>Privilege escalation</td><td><code>allowPrivilegeEscalation: false</code></td><td>Always false</td></tr>
<tr><td>System call filtering</td><td><code>seccompProfile: RuntimeDefault</code></td><td>Always; or enable <code>seccompDefault</code> on kubelets</td></tr>
<tr><td>Mandatory access control</td><td><code>appArmorProfile</code>, <code>seLinuxOptions</code></td><td>Runtime default profiles on distributions that support them</td></tr>
<tr><td>Read-only root file system</td><td><code>readOnlyRootFilesystem: true</code></td><td>Yes, with emptyDir for scratch</td></tr>
<tr><td>Sandboxed runtime</td><td><code>runtimeClassName: gvisor</code> or <code>kata</code></td><td>For untrusted code: customer plug-ins, CI jobs, AI agents executing generated code</td></tr>
</table></div>
${fig('isol', '<b>Figure 18.2</b> Relative isolation strength of common choices (qualitative).')}
<p>Two newer items are worth knowing. AI coding and browsing agents that execute generated code are a fast-growing class of untrusted workload; the Kubernetes AI conformance checklist for 1.37 recommends (a SHOULD requirement) that platforms offer a sandbox with strong kernel isolation for such agents, typically gVisor or Kata through RuntimeClass, and SIG Apps\' agent-sandbox project adds a Sandbox API for these stateful, isolated agent runtimes. And the kubelet now ensures that a Pod using a cached private image actually has credentials to pull it (beta since 1.35), closing a gap where one tenant could run another tenant's private image already on the node.</p>

<h2>Protecting secrets and the control plane</h2>
<ul>
<li><b>Encrypt Secrets at rest</b> with the KMS v2 provider and a key in your cloud KMS or HSM: etcd and its backups then hold only ciphertext. Since 1.37 (beta), administrators can remove resources that can no longer be decrypted (after a lost key) through the API.</li>
<li><b>Keep the API server private</b>, or behind an allow-list, with OIDC authentication and audit logging to a store the cluster cannot modify.</li>
<li><b>Harden kubelets</b>: anonymous authentication off, webhook authorization on, read-only port closed (all defaults with kubeadm today).</li>
<li><b>Patch nodes</b> continuously, or replace them: immutable node images rolled regularly are easier to keep current than patched long-lived nodes.</li>
<li><b>Benchmark</b> against the CIS Kubernetes Benchmark (kube-bench) and your cloud's managed-service benchmark.</li>
</ul>

<h2>The software supply chain</h2>
${fig('supply', '<b>Figure 18.3</b> Step through: controls from source to running Pod.')}
${SH('Sign and verify an image with Sigstore')`
# in CI, with the CI system's OIDC identity (keyless)
cosign sign --yes registry.example.com/web@sha256:3f1c…
cosign attest --yes --type spdxjson --predicate sbom.spdx.json registry.example.com/web@sha256:3f1c…
# anywhere: verify who signed it
cosign verify registry.example.com/web@sha256:3f1c… \
  --certificate-identity-regexp '^https://github.com/example/web/.github/workflows/release.yml@refs/tags/' \
  --certificate-oidc-issuer https://token.actions.githubusercontent.com`}
${Y('Admission-time verification with Kyverno (ImageValidatingPolicy)')`
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata: {name: verify-images}
spec:
  validationActions: [Deny]
  webhookConfiguration: {timeoutSeconds: 10}
  matchConstraints:
    resourceRules:
    - {apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods]}
  matchImageReferences:
  - glob: "registry.example.com/*"
  validationConfigurations:
    mutateDigest: true          # pin tags to the verified digest
    verifyDigest: true
  attestors:
  - name: ci
    cosign:
      keyless:
        identities:
        - issuer: https://token.actions.githubusercontent.com
          subjectRegExp: '^https://github.com/example/.+/.github/workflows/release.yml@refs/tags/.+$'
  validations:
  - expression: >-
      images.containers.map(image, verifyImageSignatures(image, [attestors.ci])).all(e, e > 0)
    message: images must be signed by our release workflow`}
<p>Kyverno's CEL-based policy types (<code>ValidatingPolicy</code>, <code>MutatingPolicy</code>, <code>GeneratingPolicy</code>, <code>ImageValidatingPolicy</code>, <code>DeletingPolicy</code> in <code>policies.kyverno.io/v1</code>) replace the older <code>ClusterPolicy</code>, which is deprecated and scheduled for removal in Kyverno 1.20; migrate existing policies before upgrading.</p>

<h2>Runtime detection</h2>
<p>Prevention fails eventually. <b>Falco</b> and <b>Tetragon</b> use eBPF to watch system calls and kernel events in every container and alert (or, with Tetragon, block) on behaviour such as a shell spawned in a container, writes to binary directories, reading service account tokens by unusual processes, or connections to the metadata endpoint. Route alerts to your SOC with Pod, namespace, image and node attached.</p>

<h2>Multi-tenancy</h2>
<div class="tbl"><table><tr><th>Model</th><th>Isolation</th><th>Cost and effort</th><th>Fits</th></tr>
<tr><td>Namespace per team</td><td>Soft: RBAC, quotas, NetworkPolicy, Pod Security, shared nodes and control plane</td><td>Lowest</td><td>Teams of one organisation that trust each other moderately</td></tr>
<tr><td>Namespaces plus dedicated node pools</td><td>Kernel separation for sensitive tenants (taints and affinity, Chapter 9)</td><td>Moderate</td><td>Regulated workloads such as a cardholder data environment</td></tr>
<tr><td>Virtual clusters (vCluster and similar)</td><td>Each tenant has its own API server and CRDs, on shared nodes</td><td>Moderate</td><td>Tenants who need cluster-admin-like freedom (CRDs, operators)</td></tr>
<tr><td>Cluster per tenant</td><td>Hard: separate control plane and nodes</td><td>Highest; fleet management needed</td><td>Untrusted customers, strict regulatory separation</td></tr>
</table></div>
<p>A sound default for a fintech: separate clusters for production and non-production, separate node pools (or clusters) for in-scope payment workloads, namespaces per team inside each, and every namespace created by automation with its quota, LimitRange, default-deny NetworkPolicy, Pod Security labels and RoleBindings already in place. Chapter 31 builds this platform.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Images with shells, package managers and root users</strong> in production.</li>
<li><strong>Secrets in environment variables</strong> logged by crash reporters and visible in <code>kubectl describe</code> of controllers.</li>
<li><strong>Signing without verifying</strong>: a signature nobody checks protects nothing.</li>
<li><strong>Verifying tags instead of digests</strong>: the tag can move after verification.</li>
<li><strong>Treating namespaces as a hard tenant boundary</strong> for untrusted tenants.</li>
<li><strong>Pods able to reach the cloud metadata endpoint.</strong></li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Order the controls</summary><p>You can do three things this quarter: enforce Pod Security restricted, verify image signatures at admission, enable runtime detection. Which order, and why?</p><p><em>Answer:</em> a reasonable order is restricted first (removes the cheapest escape paths everywhere), then runtime detection (visibility of what gets through), then signature verification (needs CI changes first). Your threat model may differ.</p></details>
<details><summary>Root in the image</summary><p>A vendor image must run as root and cannot be changed. How do you run it with less risk?</p><p><em>Answer:</em> user namespaces (<code>hostUsers: false</code>), drop all capabilities except those needed, RuntimeDefault seccomp, read-only root file system, and if it is untrusted, a gVisor or Kata RuntimeClass on a dedicated node pool.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Detect the shell</summary><p>Install Falco in kind and run <code>kubectl exec -it</code> into a Pod. Find the alert, then write a rule exception for your debugging namespace only.</p><p><em>Answer:</em> the default ruleset raises "Terminal shell in container" with Pod and namespace details; exceptions are added with a list of allowed namespaces in a rule override.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>End-to-end supply chain</summary><p>Build an image in GitHub Actions, generate an SBOM with Syft, sign and attest keylessly with cosign, and enforce verification with Kyverno in kind. Then try to deploy an image built locally with the same tag.</p><p><em>Answer:</em> the local image has a different digest and no signature from the CI identity, so admission rejects it; the CI-built digest is admitted.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can trace a realistic attack path and name the control that breaks each step.</li>
<li>I can harden Pods with non-root, user namespaces, capabilities, seccomp and sandboxed runtimes.</li>
<li>I can protect Secrets at rest and keep the control plane private and audited.</li>
<li>I can build a supply chain with SBOMs, signatures and admission-time verification, plus runtime detection.</li>
<li>I can choose a multi-tenancy model for a given level of trust.</li>
</ul>
`});

CH.push({
  id: 'ch19', n: 19, title: 'Building, Upgrading and Running Clusters',
  lede: 'Someone has to create clusters, keep their certificates valid, upgrade them three times a year and restore them after a disaster. This chapter compares managed services with self-managed clusters, walks through kubeadm and Cluster API, explains the version skew rules that dictate upgrade order, and covers backup and recovery of the control plane.',
  html: `
<h2>Where clusters come from</h2>
<div class="tbl"><table><tr><th>Option</th><th>You run</th><th>Choose when</th></tr>
<tr><td>Managed (EKS, AKS, GKE, and many others)</td><td>Nodes (or not, with serverless node modes), add-ons, configuration, workloads</td><td>Most cases in the cloud: the control plane, etcd and their upgrades are the provider's problem</td></tr>
<tr><td>Distributions (OpenShift, Rancher RKE2, Talos, k3s, others)</td><td>Everything, with vendor tooling and support</td><td>On-premises and edge; regulated environments wanting a supported, opinionated stack</td></tr>
<tr><td>kubeadm</td><td>Everything, with upstream tooling</td><td>Learning, custom platforms, building your own distribution</td></tr>
<tr><td>Cluster API</td><td>Clusters as Kubernetes objects, across providers</td><td>Fleets: many clusters created, upgraded and deleted declaratively</td></tr>
</table></div>
<p>Even on a managed service you own a lot: node images and patching (unless the provider manages nodes), the CNI configuration, add-ons, RBAC and authentication, policies, backups of your objects and data, and upgrades, which providers may force when a version leaves support.</p>

<h2>kubeadm in brief</h2>
${SH('Bootstrapping a highly available control plane with kubeadm')`
# on every node: containerd 2.x with the systemd cgroup driver, cgroup v2, swap configured, kubelet installed
sudo kubeadm init --control-plane-endpoint api.k8s.internal:6443 --upload-certs \
     --pod-network-cidr 10.244.0.0/16 --service-cidr 10.96.0.0/16
# install a CNI next (nothing schedules until it is ready)
# additional control-plane nodes:
sudo kubeadm join api.k8s.internal:6443 --control-plane --token … --discovery-token-ca-cert-hash sha256:… --certificate-key …
# workers:
sudo kubeadm join api.k8s.internal:6443 --token … --discovery-token-ca-cert-hash sha256:…
sudo kubeadm certs check-expiration      # component certificates last one year by default

# upgrading one minor (packages come from pkgs.k8s.io, one repository per minor: switch it first)
sudo kubeadm upgrade plan
sudo kubeadm upgrade apply v1.37.2       # first control-plane node; "kubeadm upgrade node" on the others
kubectl drain cp1 --ignore-daemonsets    # then upgrade the kubelet and kubectl packages on that node
sudo systemctl restart kubelet && kubectl uncordon cp1`}
<p>kubeadm writes static Pod manifests for the control plane, generates a certificate authority and certificates for every component, and creates bootstrap tokens so kubelets can join and request their own certificates. Component certificates are renewed automatically during <code>kubeadm upgrade</code>; a cluster never upgraded for a year will have its certificates expire, which is a classic outage.</p>

<p>Component certificates last one year and the CA ten (kubeadm's v1beta4 configuration can change both). <code>kubeadm certs renew all</code> renews the files but restarts nothing, so restart the control-plane static Pods afterwards. Kubelet <b>serving</b> certificates are self-signed unless the kubelet sets <code>serverTLSBootstrap: true</code> and something approves the resulting CSRs. A control-plane minor version cannot be downgraded: "rollback" means restoring etcd (below) or failing over to another cluster.</p>

<h2>Cluster API</h2>
<p><b>Cluster API</b> (CAPI) applies the Kubernetes pattern to clusters themselves: a management cluster runs controllers that reconcile <code>Cluster</code>, <code>MachineDeployment</code>, <code>KubeadmControlPlane</code> and provider-specific objects (AWS, Azure, GCP, vSphere, bare metal) into real machines. <b>ClusterClass</b> templates let you stamp out consistent clusters and upgrade a whole fleet by changing one version field. It is the same reconcile idea you will implement yourself in Part VIII.</p>

<h2>Version skew and upgrade order</h2>
${fig('skew', '<b>Figure 19.1</b> Interactive: check component versions against the skew policy.')}
${fig('upgrade', '<b>Figure 19.2</b> Step through: an upgrade from 1.36 to 1.37.')}
<p>Things that have broken recent upgrades and deserve explicit checks: nodes still on cgroup v1 (the kubelet refuses to start since 1.35 unless overridden) or containerd 1.x (unsupported from 1.36); kube-proxy in IPVS mode (deprecated: scheduled to be off by default by 1.40 and then removed; move to nftables); kube-dns (deprecated in 1.37; use CoreDNS); Services using <code>externalIPs</code> (deprecated in 1.36); CRD conversion webhooks that cannot handle about 10 concurrent requests (1.37 decodes the watch cache's initial load concurrently); static Pods referencing Secrets or ConfigMaps (forbidden in 1.37); and the SELinux volume-labelling change in 1.37 (volumes from capable CSI drivers are mounted with <code>-o context=</code>, so Pods with different SELinux labels sharing one volume on a node can fail to start; opt such Pods out with <code>securityContext.seLinuxChangePolicy: Recursive</code>).</p>

<h2>Backup and restore</h2>
${SH('etcd snapshot and restore (self-managed)')`
etcdctl --endpoints https://127.0.0.1:2379 \
  --cacert /etc/kubernetes/pki/etcd/ca.crt --cert /etc/kubernetes/pki/etcd/server.crt --key /etc/kubernetes/pki/etcd/server.key \
  snapshot save /backup/etcd-$(date +%F-%H%M).db
etcdutl snapshot status /backup/etcd-2026-11-07-0300.db -w table
# restore: stop every kube-apiserver and etcd member first, then on EACH member (its own --name and peer URL):
etcdutl snapshot restore /backup/etcd-2026-11-07-0300.db \
  --name cp1 --initial-cluster cp1=https://10.0.0.11:2380,cp2=https://10.0.0.12:2380,cp3=https://10.0.0.13:2380 \
  --initial-cluster-token etcd-restore-1 --initial-advertise-peer-urls https://10.0.0.11:2380 \
  --bump-revision 1000000000 --mark-compacted \
  --data-dir /var/lib/etcd-restored
# point the etcd static Pod (hostPath) at /var/lib/etcd-restored, start etcd everywhere, then the API servers.
# --bump-revision with --mark-compacted forces every informer to relist instead of trusting a resourceVersion
# from the "future"`}
<p>An etcd snapshot restores the whole cluster to a point in time, including things that have changed in the outside world since (cloud load balancers, volumes), so controllers will reconcile again (restart them or let them relist; the revision bump guarantees they cannot keep state newer than the restored data)st a stale view. For most recoveries it is better to <b>rebuild</b> a cluster from code (infrastructure as code, GitOps) and restore <b>workload data</b> from application backups and volume snapshots. Velero backs up selected API objects and volume snapshots and is useful for namespaces that are not fully in Git. Whatever you choose, rehearse it: a restore that has never been tested is a hope, not a plan.</p>

<h2>Nodes</h2>
<ul>
<li><b>Images.</b> Minimal, immutable node operating systems (Bottlerocket, Talos, Flatcar, distribution-provided container-optimised images) reduce patching to "replace the node".</li>
<li><b>Lifecycle.</b> Drain before maintenance (<code>kubectl drain --ignore-daemonsets --delete-emptydir-data</code>); graceful node shutdown lets the kubelet stop Pods in priority order when the machine is shut down. Alpha in 1.37, nodes can carry standard conditions such as <code>MaintenancePlanned</code> and <code>Drained</code>, so tools can coordinate maintenance.</li>
<li><b>Kubelet configuration.</b> Use the configuration file (and the drop-in directory, stable since 1.35) rather than flags; reserve resources for system daemons; set eviction thresholds deliberately.</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Skipping upgrades</strong> until the version is out of support, then needing several in a row under pressure.</li>
<li><strong>Expired certificates</strong> on clusters not upgraded within a year.</li>
<li><strong>Removed APIs</strong> discovered after the upgrade, when Helm releases or operators stop working.</li>
<li><strong>Backups never restored</strong> in a drill.</li>
<li><strong>Snowflake clusters</strong> created by hand: impossible to rebuild consistently.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Valid skew?</summary><p>API servers 1.37 and 1.36 (mid-upgrade), scheduler 1.37, kubelets 1.34. Valid?</p><p><em>Answer:</em> no: the scheduler must not be newer than the oldest API server (1.36). Kubelets at 1.34 are within three minors of 1.37 and not newer than 1.36, so they are fine.</p></details>
<details><summary>Snapshot or rebuild?</summary><p>An operator bug deleted all Deployments in two namespaces an hour ago. etcd snapshot restore, or something else?</p><p><em>Answer:</em> not a full etcd restore, which would roll back the whole cluster. Re-sync those namespaces from Git (GitOps) or restore them selectively from a Velero backup.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Upgrade a lab cluster the kubeadm way</summary><p>Build a three-node cluster with kubeadm on VMs (or use Cluster API with its Docker infrastructure provider, which supports real rolling upgrades on a laptop; kind cannot upgrade a node in place, because its node image is the version), upgrade the control plane by one minor version, then drain and upgrade one worker. Check component versions with <code>kubectl version</code> and <code>kubectl get nodes</code> at each step.</p><p><em>Answer:</em> the API server reports the new version first; nodes report their kubelet version until each is upgraded.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Disaster drill</summary><p>Destroy your lab cluster. Recreate it from code, reinstall add-ons, re-sync workloads from Git, and restore one stateful app's data from its backup. Time each stage.</p><p><em>Answer:</em> the times you measure are your realistic recovery time; usually data restore and DNS or certificate changes dominate, not cluster creation.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can weigh managed, distribution, kubeadm and Cluster API approaches.</li>
<li>I can apply the version skew policy and plan a safe upgrade, including prerequisite checks.</li>
<li>I can back up and restore etcd, and I know when to rebuild instead.</li>
<li>I can manage node images, maintenance and kubelet configuration.</li>
</ul>
`});

CH.push({
  id: 'ch20', n: 20, title: 'Packaging and Delivery: Helm, Kustomize and GitOps',
  lede: 'Manifests need templating for environments, packaging for distribution, and a reliable way to reach clusters. This chapter covers Helm 4 and Kustomize, how to choose between them, and GitOps with Argo CD or Flux, the delivery model most regulated teams have settled on because it turns every change into a reviewed, auditable commit.',
  html: `
<h2>Why plain YAML is not enough</h2>
<p>The same application runs in development, staging and production with different replica counts, images, resources, hostnames and secrets. Copying manifests per environment drifts quickly. Two tools dominate: <b>Helm</b>, which templates and packages, and <b>Kustomize</b>, which patches.</p>

<h2>Helm</h2>
<p>A Helm <b>chart</b> is a directory of Go templates plus default <code>values.yaml</code>; a <b>release</b> is an installed instance, with its history stored in the cluster so it can be upgraded and rolled back. Charts are distributed through OCI registries like images. <b>Helm 4</b>, released in November 2025 for Helm's tenth anniversary, adds server-side apply (the default for new installations, so field ownership works as in Chapter 3), a WebAssembly-based plugin system, and readiness waiting based on kstatus (<code>--wait</code> now takes a strategy; a bare <code>--wait</code> means <code>watcher</code>). Helm 3 charts (apiVersion v2) continue to work, but the Helm 3 binary stopped receiving security fixes on 11 November 2026, so pipelines should be on Helm 4. Watch for renamed flags (<code>--atomic</code> became <code>--rollback-on-failure</code>, <code>--force</code> became <code>--force-replace</code>), and note that <code>helm upgrade</code> keeps whichever apply method a release was installed with (<code>--server-side=auto</code>) unless you pass <code>--server-side=true</code>.</p>
${Y('A template and the values that drive it')`
# templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "web.fullname" . }}
  labels: {{- include "web.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}       # leave replicas to the HPA when autoscaling
  {{- end }}
  selector:
    matchLabels: {{- include "web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "web.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
      - name: app
        image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
        resources: {{- toYaml .Values.resources | nindent 10 }}
---
# values-prod.yaml
replicaCount: 6
image: {repository: registry.example.com/web, digest: "sha256:3f1c9a…"}
autoscaling: {enabled: true, minReplicas: 6, maxReplicas: 30}
resources: {requests: {cpu: "1", memory: 1Gi}, limits: {memory: 1Gi}}`}
${SH('Working with charts')`
helm template web ./charts/web -f values-prod.yaml | less            # render locally; review in CI
helm upgrade --install web oci://registry.example.com/charts/web --version 3.4.1 -n shop -f values-prod.yaml --wait
helm history web -n shop; helm rollback web 12 -n shop
helm lint ./charts/web && helm package ./charts/web && helm push web-3.4.1.tgz oci://registry.example.com/charts`}

<h3>Helm in production</h3>
<ul>
<li><b>CRDs</b> in a chart's <code>crds/</code> directory are installed on first install only and are never upgraded or deleted by Helm. Ship CRDs as templates in a separate chart, or apply them through GitOps ahead of the workloads (an Argo CD sync wave, Flux's CRD upgrade policy).</li>
<li><b>Hooks</b> (<code>helm.sh/hook</code>) run outside the release's three-way merge; a failed hook Job blocks every later upgrade until cleaned up, so set <code>helm.sh/hook-delete-policy</code>. Argo CD maps hooks onto its own sync phases.</li>
<li><b>Release history</b> is stored as Secrets (<code>sh.helm.release.v1.&lt;name&gt;.v&lt;N&gt;</code>), each limited to about 1 MiB and containing the rendered values. Cap it with <code>--history-max</code> and treat those Secrets as sensitive.</li>
<li><b>Values schema</b>: ship <code>values.schema.json</code> so a typo in values fails the install instead of being ignored.</li>
<li><b>Moving releases to Helm 4</b>: existing releases keep client-side apply until upgraded with <code>--server-side=true</code>; expect field-manager conflicts on that first upgrade (resolve with <code>--force-conflicts</code>), and remember that kstatus-based waiting needs custom resources to publish status conditions.</li>
<li><b>Supply chain</b>: push charts to an OCI registry and sign them with cosign, like images, and verify at deploy time.</li>
</ul>

<h2>Kustomize</h2>
<p><b>Kustomize</b> (built into kubectl as <code>kubectl apply -k</code>) starts from plain YAML <b>bases</b> and applies <b>overlays</b>: patches, name prefixes, namespaces, image substitutions, labels, and generated ConfigMaps and Secrets whose names include a hash of their content, so Pods roll automatically when configuration changes.</p>
${fig('kust', '<b>Figure 20.1</b> Interactive: a base and two overlays, and the Deployment each produces.')}
<div class="tbl"><table><tr><th></th><th>Helm</th><th>Kustomize</th></tr>
<tr><td>Model</td><td>Templates + values</td><td>Plain YAML + patches</td></tr>
<tr><td>Best for</td><td>Distributing software to many users with many options (third-party charts)</td><td>Your own applications across a few environments</td></tr>
<tr><td>Lifecycle</td><td>Releases with history, hooks, rollback</td><td>None: output is just YAML (GitOps provides the lifecycle)</td></tr>
<tr><td>Risk</td><td>Templates become unreadable; logic in YAML</td><td>Many small patches become hard to follow</td></tr>
</table></div>
<p>They combine well: install third-party software from Helm charts, configure your own applications with Kustomize, and let a GitOps tool render both.</p>

<h2>GitOps</h2>
<p>GitOps applies the control-loop idea to delivery. The <b>OpenGitOps</b> principles: desired state is <b>declarative</b>, <b>versioned and immutable</b> (in Git), <b>pulled automatically</b> by agents, and <b>continuously reconciled</b>. The two CNCF-graduated implementations are <b>Argo CD</b> (applications and ApplicationSets, a strong UI, multi-cluster from one control plane) and <b>Flux</b> (a set of controllers: source, kustomize, helm, image automation; per-cluster, Git-native).</p>
${fig('gitops', '<b>Figure 20.2</b> Step through: a change flowing from merge to production, and drift correction.')}
${Y('An Argo CD Application with automated sync and self-heal')`
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: web-prod, namespace: argocd}
spec:
  project: shop
  source:
    repoURL: https://git.example.com/platform/config.git
    targetRevision: main
    path: apps/web/overlays/prod
  destination: {server: https://kubernetes.default.svc, namespace: shop}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true, CreateNamespace=false, RespectIgnoreDifferences=true]
  ignoreDifferences:
  - group: apps
    kind: Deployment
    jsonPointers: [/spec/replicas]       # owned by the HPA`}
<p><code>ignoreDifferences</code> alone only changes the diff; on every sync Argo CD would still apply the manifest's replica count over the HPA's. <code>RespectIgnoreDifferences=true</code> makes the sync honour it too. Better still, leave <code>replicas</code> out of the manifests of anything an HPA scales (as the prod overlay above does, and as the Helm template does when autoscaling is enabled), so no tool but the HPA owns the field and <code>ignoreDifferences</code> is only a safety net.</p>
<div class="note key"><b>Why regulated teams like GitOps</b><p>Every change to production is a reviewed pull request with an author, approver, timestamp and diff. The agent's service account is the only writer; humans have read-only access in production plus break-glass. Drift is detected and reverted. Recreating an environment after a disaster is re-pointing an agent at a repository. These map directly onto change-management and segregation-of-duties controls auditors ask about.</p></div>

<h2>Progressive delivery</h2>
<p>Rolling updates replace Pods; they do not judge whether the new version is good. <b>Argo Rollouts</b> and <b>Flagger</b> add canary and blue-green strategies: shift a percentage of traffic (through a Gateway API route or a mesh), measure error rates and latency from Prometheus, and promote or roll back automatically.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Templating secrets into Git.</strong> Use external secret stores or encrypted secrets (Chapter 7).</li>
<li><strong>Both GitOps and humans writing</strong> the same objects: endless drift and fights.</li>
<li><strong>Tags instead of digests</strong> in production values: the same commit can deploy different images.</li>
<li><strong>Huge charts with every option</strong> for an internal app nobody else installs.</li>
<li><strong>No health checks for custom resources</strong>: GitOps shows "Healthy" while your operator reports failure.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Helm or Kustomize?</summary><p>You ship a product that customers install in their own clusters with many options; and you run three internal services across dev, staging and prod. Which tool for each?</p><p><em>Answer:</em> a Helm chart for the product; Kustomize overlays (or simple Helm values) for the internal services, delivered by GitOps.</p></details>
<details><summary>Config change, no rollout</summary><p>You change a ConfigMap through GitOps but Pods keep the old values. Two fixes?</p><p><em>Answer:</em> Kustomize configMapGenerator (hashed names), or a checksum annotation in the Helm template; both change the Pod template and trigger a rollout.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>GitOps in kind</summary><p>Install Argo CD or Flux in kind, point it at a repository with a Kustomize base and two overlays, enable self-heal, change a replica count with kubectl, and watch it revert. Then promote a new image by commit.</p><p><em>Answer:</em> the application goes OutOfSync then Synced; the history shows each commit applied.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Canary on the Gateway API</summary><p>Install Argo Rollouts with the Gateway API traffic router plugin and Prometheus. Define a canary that shifts 10%, 30%, 60%, 100% with an analysis template on 5xx rate, deploy a bad version, and observe the automatic abort.</p><p><em>Answer:</em> the analysis fails at the first step, the HTTPRoute weights return to 100/0 and the rollout is marked Degraded.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can write and operate Helm charts and know what Helm 4 changed.</li>
<li>I can structure Kustomize bases and overlays with generators and image substitution.</li>
<li>I can set up GitOps with Argo CD or Flux, including self-heal and fields owned by other controllers.</li>
<li>I know how progressive delivery adds automated canary analysis.</li>
</ul>
`});

const TRB = {
  pending: ['Pod stays Pending', ['The scheduler cannot place it: read the FailedScheduling event (insufficient resources, taints, affinity, spread constraints).', 'Unbound PVC: WaitForFirstConsumer is normal until scheduled; otherwise a provisioning problem.', 'Gated: <code>spec.schedulingGates</code> set by a queueing system (Kueue) waiting for admission.', 'ResourceQuota exhausted (the Pod would not even be created: check the controller\'s events).'], 'kubectl describe pod X | sed -n \'/Events/,$p\'\nkubectl get events -n NS --field-selector involvedObject.name=X\nkubectl describe nodes | grep -A6 "Allocated resources"'],
  creating: ['Stuck in ContainerCreating', ['Volume attach or mount failing (FailedAttachVolume, FailedMount: often a zone mismatch or a volume still attached elsewhere).', 'CNI failing to assign an IP (address exhaustion with VPC CNIs, plugin not ready).', 'Secret or ConfigMap referenced by a volume does not exist.', 'Image volume or large image still pulling.'], 'kubectl describe pod X\nkubectl get volumeattachments | grep PV_NAME\nkubectl logs -n kube-system -l k8s-app=<cni-agent> --tail=50'],
  pull: ['ImagePullBackOff / ErrImagePull', ['Wrong image name, tag or digest (typo, tag not pushed).', 'Private registry without credentials: missing imagePullSecrets or credential provider.', 'Registry rate limits (Docker Hub) or network egress blocked.', 'Architecture mismatch: a multi-arch index without the node\'s platform fails here (no match for platform); a single-arch image of the wrong architecture pulls fine and crashes later with exec format error.'], 'kubectl describe pod X | grep -A3 Failed\nkubectl get pod X -o jsonpath=\'{.spec.containers[*].image}\'\ncrane manifest IMAGE   # or: docker manifest inspect IMAGE'],
  crash: ['CrashLoopBackOff', ['The process exits: read the previous instance\'s logs and the exit code.', 'Exit code 1 or 2: the app\'s own error (configuration, missing environment variable, cannot reach a dependency at start).', 'Exit 137 with reason OOMKilled: memory limit (see below). Exit 139: segmentation fault.', 'Liveness probe kills a slow starter: add a startup probe (Chapter 5).'], 'kubectl logs X -c app --previous\nkubectl get pod X -o jsonpath=\'{.status.containerStatuses[*].lastState}\'\nkubectl debug -it X --image=busybox:1.37 --copy-to=X-debug --container=app -- sh   # same spec, shell instead'],
  oom: ['OOMKilled', ['Real memory need above the limit: measure peak working set (container_memory_working_set_bytes).', 'Runtime not container-aware: JVM heap or similar sized beyond the limit.', 'Memory leak: usage grows steadily until killed.', 'Node-level OOM (not the container limit): node overcommitted; the kernel picked by oom_score_adj (QoS).'], 'kubectl describe pod X | grep -B2 -A4 "Last State"\nkubectl top pod X --containers\n# PromQL: max_over_time(container_memory_working_set_bytes{pod="X"}[1d])'],

  svc: ['Service unreachable', ['No endpoints: selector does not match Pod labels, or no Pod is Ready.', 'Wrong targetPort (named port typo).', 'NetworkPolicy blocks the client (connections time out rather than being refused).', 'DNS: wrong namespace in the name, or CoreDNS unhealthy.'], 'kubectl get endpointslices -l kubernetes.io/service-name=SVC -o wide\nkubectl run t --rm -it --image=busybox:1.37 -- sh -c "nslookup SVC.NS && wget -qO- -T3 SVC.NS:80"\nkubectl get networkpolicy -n NS'],
  node: ['Node NotReady', ['The kubelet has stopped (crashed, out of disk, certificate expired) or cannot reach the API server.', 'Container runtime down; CNI not ready (the node reports NetworkUnavailable or the kubelet reports the runtime network not ready).', 'Pressure conditions: MemoryPressure, DiskPressure, PIDPressure.'], 'kubectl describe node N | sed -n \'/Conditions/,/Addresses/p\'\nkubectl get --raw "/api/v1/nodes/N/proxy/logs/?query=kubelet&tailLines=100"   # node log query (stable in 1.36; needs enableSystemLogHandler and enableSystemLogQuery in the kubelet config)\njournalctl -u kubelet -u containerd --since -30m   # on the node'],
  term: ['Stuck Terminating', ['Finalizers not removed: the controller responsible is missing or failing (Chapter 3).', 'The node is unreachable, so the kubelet never confirms the Pod stopped.', 'A namespace waiting on resources from an unavailable aggregated API.'], 'kubectl get pod X -o jsonpath=\'{.metadata.finalizers}\'\nkubectl get ns NS -o jsonpath=\'{.status.conditions}\' | jq\n# last resort for a Pod on a dead node: kubectl delete pod X --grace-period=0 --force']

CH.push({
  id: 'ch21', n: 21, title: 'Observability and Troubleshooting',
  lede: 'A cluster is a distributed system made of distributed systems. You need metrics, logs, traces and events from the platform and the applications, collected in a way that survives the failures you are investigating, and a disciplined way to go from a symptom to a cause. This chapter gives you both.',
  html: `
<h2>The signals</h2>
${fig('obsarch', '<b>Figure 21.1</b> A typical observability pipeline for a cluster.')}
<div class="tbl"><table><tr><th>Signal</th><th>Kubernetes source</th><th>Use</th></tr>
<tr><td>Resource metrics</td><td>kubelet (cAdvisor), served by metrics-server through <code>metrics.k8s.io</code> (v1 since 1.37)</td><td><code>kubectl top</code>, HPA; not for long-term storage</td></tr>
<tr><td>Object state</td><td>kube-state-metrics</td><td>Replicas desired vs available, Pod phases, restarts, Job failures, PVC status</td></tr>
<tr><td>Component metrics</td><td><code>/metrics</code> on API server, scheduler, controller manager, kubelet, etcd</td><td>Control-plane health: request latency, APF rejections, scheduling latency, etcd fsync</td></tr>
<tr><td>Pressure</td><td>PSI (pressure stall information) per container and node, stable since 1.36</td><td>Detect CPU, memory and I/O contention before it causes failures</td></tr>
<tr><td>Logs</td><td>Container stdout/stderr written by the runtime to <code>/var/log/pods</code>, rotated by the kubelet</td><td>Shipped by a node agent (Fluent Bit, OpenTelemetry Collector) to a store</td></tr>
<tr><td>Traces</td><td>Your apps (OpenTelemetry SDKs); the API server and kubelet also emit OpenTelemetry traces (stable since 1.34)</td><td>Latency across services, including calls to the API server</td></tr>
<tr><td>Events</td><td>Event objects from controllers, scheduler and kubelet; kept for one hour by default</td><td>The "why" of state changes; export them to keep them</td></tr>
<tr><td>Audit</td><td>API server audit log</td><td>Who changed what, security investigations</td></tr>
</table></div>
<p>Kubernetes metrics can now be exposed as Prometheus <b>native histograms</b> as well as classic ones (beta in 1.37), giving accurate latency percentiles at lower cost. They appear only when the scraper asks for the protobuf format: in Prometheus 3.8 or later set <code>scrape_native_histograms: true</code>, and keep classic histograms until dashboards are migrated. Components also offer <code>/statusz</code> and <code>/flagz</code> pages (beta) showing their version and effective flags, useful when you need to know exactly how a running component is configured.</p>
${Y('Scraping your application with the Prometheus Operator')`
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: payments, namespace: shop, labels: {release: prometheus}}
spec:
  selector: {matchLabels: {app: payments}}
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics`}

<h3>An OpenTelemetry pipeline that works</h3>
<p>The common deployment has two tiers of OpenTelemetry Collector. An <b>agent</b> DaemonSet on every node collects container logs from <code>/var/log/pods</code> (the <code>filelog</code> receiver), node and Pod metrics from the kubelet (<code>kubeletstats</code>), and OTLP from local Pods; a <b>gateway</b> Deployment batches, samples traces (tail sampling keeps every error and slow request) and exports. The <code>k8sattributes</code> processor adds Pod, namespace and owner metadata to every signal, and the <code>k8sobjects</code> receiver in watch mode exports Events, which otherwise vanish after an hour. For Java services the OpenTelemetry Operator injects the Java agent with no code changes: create an <code>Instrumentation</code> resource and annotate Pods with <code>instrumentation.opentelemetry.io/inject-java: "true"</code>. Prometheus 3 can also receive OTLP metrics directly (<code>--web.enable-otlp-receiver</code>). For PCI DSS requirement 10, ship the API server audit log (Chapter 16) to the same pipeline and on to a SIEM the cluster's administrators cannot modify.</p>

<h2>What to alert on</h2>
<p>Alert on <b>symptoms users feel</b> and on <b>saturation that predicts them</b>, not on every cause. For services: error rate, latency and throughput against service-level objectives. For the platform:</p>
<ul>
<li>API server: error rate and p99 latency by verb; APF rejections; webhook latency.</li>
<li>etcd: leader changes, fsync latency, database size against quota.</li>
<li>Nodes: NotReady, pressure conditions, disk filling, PSI.</li>
<li>Workloads: Deployments with unavailable replicas for more than N minutes, CrashLoopBackOff, Jobs failing, PVCs nearly full.</li>
<li>Certificates expiring; clusters running unsupported versions.</li>
</ul>

<h2>Troubleshooting method</h2>
<p>Work from the object the user cares about down the chain of controllers: Gateway route → Service → EndpointSlice → Pods → containers → node. At each level read <b>status and conditions</b>, then <b>events</b>, then <b>logs</b>. Most problems announce themselves in one of those three places.</p>
${fig('trouble', '<b>Figure 21.2</b> Interactive: from a symptom to likely causes and the commands that confirm them.')}
${SH('The everyday toolkit')`
kubectl get pods -A --field-selector=status.phase!=Running,status.phase!=Succeeded
kubectl events -A | tail -30                          # sorted correctly, handles event series
kubectl describe deploy/web -n shop            # conditions: Available, Progressing (and why)
kubectl logs -n shop -l app=web --all-containers --since=10m --prefix --max-log-requests=20   # every Pod, not one
kubectl debug -it pod/web-7d9-abc --image=nicolaka/netshoot --target=app   # network tools beside the app
kubectl top nodes; kubectl top pods -A --sort-by=cpu | head
kubectl get --raw '/readyz?verbose'; kubectl get --raw '/livez?verbose'`}

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Relying on <code>kubectl logs</code></strong> as your log system: logs vanish with Pods and nodes.</li>
<li><strong>Not exporting events</strong>: the explanation of last night's incident expired an hour after it happened.</li>
<li><strong>High-cardinality labels</strong> (user IDs, request IDs) in metrics: your Prometheus falls over.</li>
<li><strong>Monitoring stack in the cluster it monitors only</strong>: when the cluster fails, so does your visibility. Keep alerting or a copy of key signals outside.</li>
<li><strong>Alerting on every Pod restart</strong>: pages for self-healing systems doing their job.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Which signal?</summary><p>Where would you look first for: why a Deployment is not progressing; why the app returned 500s at 03:12; who deleted a ConfigMap; whether nodes are CPU-starved?</p><p><em>Answer:</em> Deployment conditions and events; application logs and traces around 03:12; the audit log; PSI and CPU throttling metrics.</p></details>
<details><summary>Empty Service</summary><p><code>kubectl get endpointslices</code> for a Service shows no endpoints, but Pods are Running. Two likely causes?</p><p><em>Answer:</em> the selector does not match the Pods' labels, or the Pods are not Ready (failing readiness probes).</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Break and fix</summary><p>Have a colleague break five things in your kind cluster (wrong image tag, impossible affinity, missing ConfigMap, bad probe path, NetworkPolicy blocking DNS). Diagnose each using only status, events and logs, and time yourself.</p><p><em>Answer:</em> each is visible in describe output or events within seconds; the DNS policy is the one usually found last, from timeouts in app logs.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>An SLO for the platform</summary><p>Define an SLO for "deployments succeed within 10 minutes" using kube-state-metrics (generation vs observedGeneration and available replicas) and Prometheus recording rules, and alert on error-budget burn rate.</p><p><em>Answer:</em> record a per-Deployment "rollout completed in time" ratio, aggregate to an SLI, and use multi-window burn-rate alerts (for example 1 h and 6 h) to page only on sustained problems.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know which component produces each signal and where to store it.</li>
<li>I can choose alerts on symptoms and saturation for both apps and the platform.</li>
<li>I can troubleshoot from status and conditions, to events, to logs, down the chain of controllers.</li>
<li>I can use kubectl debug, node log query and component status pages.</li>
</ul>
`});

FIG.pdb = host => {
  host.innerHTML = `<div class="tool"><p class="meta" style="margin:0 0 8px">Five replicas of an API across four nodes, with a PodDisruptionBudget. Drain nodes one after another; evictions that would break the budget are refused (HTTP 429) and retried, while the controller recreates evicted Pods elsewhere. The simulation assumes <code>unhealthyPodEvictionPolicy: AlwaysAllow</code> (as in the YAML): Pods that are not Ready are always evictable.</p><div class="row"><div><label for="pd-m">PDB minAvailable</label><input class="txt" type="number" id="pd-m" value="4" min="0" max="5"></div><div><label><input type="checkbox" id="pd-slow" checked> replacement Pods take a while to become Ready</label></div></div><div class="btns"><button type="button" class="act" data-n="0">drain node-1</button><button type="button" class="act" data-n="1">drain node-2</button><button type="button" class="act" data-n="2">drain node-3</button><button type="button" class="act" data-a="tick">time passes (replacements become Ready)</button><button type="button" class="act" data-a="reset">reset</button></div><div id="pd-fig"></div><div class="out" id="pd-out"></div></div>`;
  let P, cord, log;
  const reset = () => { P = [{ n: 0, r: true }, { n: 0, r: true }, { n: 1, r: true }, { n: 2, r: true }, { n: 3, r: true }]; cord = [false, false, false, false]; log = []; };
  const draw = () => {
    let s = '';
    for (let i = 0; i < 4; i++) { const x = 6 + i * 162; s += nodeBox(x, 6, 152, 92, `node-${i + 1}${cord[i] ? ' (cordoned)' : ''}`, cord[i] ? 'dim' : ''); P.filter(p => p.n === i).forEach((p, k) => s += pod(x + 10 + (k % 2) * 68, 30 + Math.floor(k / 2) * 30, p.r ? 'api' : 'api…', p.r ? 'ok' : 'warn', 62)); }
    host.querySelector('#pd-fig').innerHTML = `<div class="stage">${svgw(656, 104, s, 'Pods across nodes')}</div>`;
    const ready = P.filter(p => p.r).length, min = +host.querySelector('#pd-m').value;
    host.querySelector('#pd-out').innerHTML = `ready ${ready}/5 · minAvailable ${min} · allowed disruptions now: <b>${Math.max(0, ready - min)}</b><br>${log.slice(-5).map(esc).join('<br>')}`;
  };
  const place = () => { const ok = [0, 1, 2, 3].filter(i => !cord[i]).sort((a, b) => P.filter(p => p.n === a).length - P.filter(p => p.n === b).length); return ok[0]; };
  host.querySelector('.btns').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const min = +host.querySelector('#pd-m').value, slow = host.querySelector('#pd-slow').checked;
    if (b.dataset.a === 'reset') reset();
    else if (b.dataset.a === 'tick') { P.forEach(p => p.r = true); log.push('replacement Pods are Ready'); }
    else {
      const n = +b.dataset.n; cord[n] = true; log.push(`kubectl drain node-${n + 1}: cordoned`);
      for (const p of P.filter(p => p.n === n)) {
        const ready = P.filter(q => q.r).length;
        if (p.r && ready - 1 < min) { log.push(`evict api on node-${n + 1}: refused, would violate the PodDisruptionBudget (429); drain keeps retrying`); continue; }
        const to = place(); if (to === undefined) { log.push('no schedulable node for the replacement'); continue; }
        p.n = to; p.r = !slow; log.push(`evicted api from node-${n + 1}; replacement scheduled on node-${to + 1}${slow ? ' (starting)' : ''}`);
      }
    }
    draw();
  });
  host.querySelector('#pd-m').addEventListener('input', draw); reset(); draw();
};

FIG.cost = host => {

  const $ = id => +host.querySelector('#' + id).value;
