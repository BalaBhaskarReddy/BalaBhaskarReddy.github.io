CH.push({
  id: 'ch27', n: 27, title: 'Operator Patterns in Depth',
  lede: 'A working reconciler is the start. Production operators must clean up things outside the cluster, survive restarts in the middle of multi-step work, tell users and tools exactly what state they are in, retry sensibly, and stay correct when several of them run against shared systems. This chapter adds finalizers, external resources and rich status to the Tenant operator and collects the patterns and anti-patterns that matter most.',
  html: `
<h2>The reconcile contract</h2>
<p>Every pattern in this chapter follows from four rules:</p>
<ol>
<li><b>Level-triggered</b>: decide from current state, every time. Never rely on having seen a particular event.</li>
<li><b>Idempotent</b>: running Reconcile twice in a row must be safe and the second run should find nothing to do.</li>
<li><b>Resumable</b>: the process may die between any two lines. On restart, the next Reconcile must finish the job from whatever state exists.</li>
<li><b>Honest</b>: status says what the controller observed for which generation, never what it hopes.</li>
</ol>
<div class="tbl"><table><tr><th>Return</th><th>Meaning</th><th>Use when</th></tr>
<tr><td><code>ctrl.Result{}, nil</code></td><td>Done; reconcile again only on the next event</td><td>The world matches the spec</td></tr>
<tr><td><code>ctrl.Result{}, err</code></td><td>Retry with exponential back-off</td><td>Transient failures: API conflicts, timeouts, external 5xx</td></tr>
<tr><td><code>ctrl.Result{RequeueAfter: d}, nil</code></td><td>Come back after d, no back-off</td><td>Waiting for something you cannot watch (an external job, a certificate expiry, drift in an external system)</td></tr>
<tr><td><code>ctrl.Result{}, reconcile.TerminalError(err)</code></td><td>Log and stop retrying until the object changes</td><td>Invalid input only a user can fix; record it in a condition too</td></tr>
</table></div>
<p><code>Result{Requeue: true}</code> is deprecated; use <code>RequeueAfter</code>. Since controller-runtime v0.23 a result can also carry a <code>Priority</code> for the (default) priority queue.</p>
<h3>Stale caches and read-your-writes</h3>
<p>The most common correctness bug in operators comes from reading an eventually consistent cache. A reconcile writes status (or creates a child); the watch event for that write has not reached the informer yet; the next reconcile reads the old object and acts again: a duplicate external call, a spurious conflict, a condition that flaps. Idempotent external calls (above) make this harmless, and returning conflicts for a quick retry repairs it, but two newer tools address it directly. controller-runtime v0.25 can make cached reads wait until the cache has caught up with the client's own writes (experimental; <code>client.Options{Cache: &amp;client.CacheOptions{EnableReadYourWritesConsistency: ptr.To(true)}}</code>, not supported with multi-namespace caches). And client-go 1.37's stale-controller support (beta) lets a controller record the resourceVersion of its write and requeue until the informer has seen it. For a single critical decision, <code>mgr.GetAPIReader()</code> reads live from the API server, at the cost of an API call; do not use it for routine reads.</p>

<h2>Finalizers and external resources</h2>
<p>Owner references clean up objects inside the cluster. Anything outside (cloud resources, database users, DNS records, secrets-store policies) needs a <b>finalizer</b>: add it before creating the external thing, and remove it only after the external thing is gone.</p>
${fig('finalizer', '<b>Figure 27.1</b> Step through: deletion with a finalizer, when clean-up fails, and when the operator has been removed.')}
<p>Three small changes to Chapter 26's code come first: the reconciler gains a <code>Policies PolicyStore</code> field and a <code>Recorder</code> from <code>mgr.GetEventRecorder("tenant-operator")</code> (events.k8s.io; see Chapter 26 for its RBAC), <code>TenantStatus</code> gains <code>PolicyID string</code>, and <code>setReady</code> is generalised to <code>setCondition(ctx, t, orig, conditionType, status, reason, message, cause)</code>, patching status against the snapshot <code>orig</code> taken right after the Get. (Taking the snapshot inside the helper would miss changes such as <code>PolicyID</code> made before it is called.) A failure of any specific condition also sets <code>Ready=False</code> with the same reason, so the summary never stays True while a part is failing.</p>
${G('Adding finalizer handling to the Tenant reconciler')`
import "sigs.k8s.io/controller-runtime/pkg/controller/controllerutil"

const finalizer = "platform.example.com/cleanup"

// PolicyStore is the external system: for example, a secrets manager where each tenant gets a policy.
type PolicyStore interface {
	EnsurePolicy(ctx context.Context, tenant string, groups []string) (id string, err error) // idempotent
	DeletePolicy(ctx context.Context, tenant string) error                                   // nil if already gone
}

func (r *TenantReconciler) Reconcile(ctx context.Context, req ctrl.Request) (ctrl.Result, error) {
	var t platformv1.Tenant
	if err := r.Get(ctx, req.NamespacedName, &t); err != nil {
		return ctrl.Result{}, client.IgnoreNotFound(err)
	}
	orig := t.DeepCopy()

	if !t.DeletionTimestamp.IsZero() {
		return r.finalize(ctx, &t, orig)
	}

	// Add the finalizer before touching the external system, and persist it first.
	if controllerutil.AddFinalizer(&t, finalizer) {
		if err := r.Update(ctx, &t); err != nil {
			return ctrl.Result{}, err // a conflict just means: try again with fresh data
		}
	}

	// External state: idempotent by tenant name; we never store secrets in status, only the reference.
	id, err := r.Policies.EnsurePolicy(ctx, t.Name, t.Spec.AdminGroups)
	if err != nil {
		r.Recorder.Eventf(&t, nil, corev1.EventTypeWarning, "PolicyError", "EnsurePolicy", "external policy: %v", err)
		return ctrl.Result{}, r.setCondition(ctx, &t, orig, "PolicyReady", metav1.ConditionFalse, "PolicyError", err.Error(), err) // also Ready=False
	}
	t.Status.PolicyID = id // persisted by the status patch below, computed against orig

	// … in-cluster objects with server-side apply, as in Chapter 26 …

	// The external system can drift without us seeing an event: check it again in ten minutes.
	return ctrl.Result{RequeueAfter: 10 * time.Minute},
		r.setCondition(ctx, &t, orig, "Ready", metav1.ConditionTrue, "Reconciled", "tenant configured", nil)
}

func (r *TenantReconciler) finalize(ctx context.Context, t, orig *platformv1.Tenant) (ctrl.Result, error) {
	if !controllerutil.ContainsFinalizer(t, finalizer) {
		return ctrl.Result{}, nil // not ours to do, or already done
	}
	if err := r.Policies.DeletePolicy(ctx, t.Name); err != nil {
		r.Recorder.Eventf(t, nil, corev1.EventTypeWarning, "CleanupFailed", "DeletePolicy", "external policy deletion failed: %v", err)
		return ctrl.Result{}, r.setCondition(ctx, t, orig, "Ready", metav1.ConditionFalse, "CleanupFailed", err.Error(), err)
	}
	waiting, err := r.releaseNamespaces(ctx, t) // Retain: remove our labels. Delete: delete and wait.
	if err != nil {
		return ctrl.Result{}, err
	}
	if waiting {
		return ctrl.Result{RequeueAfter: 5 * time.Second}, nil // namespaces still terminating
	}
	controllerutil.RemoveFinalizer(t, finalizer)
	return ctrl.Result{}, r.Update(ctx, t)
}`}
<p>Notice three details. The finalizer is persisted <b>before</b> the external resource exists, so a crash in between cannot leak it. External calls are <b>idempotent by a natural key</b> (the tenant name), so a retry after a timeout does not create a second policy. And deletion of namespaces honours <code>deletionPolicy</code>, defaulting to <b>Retain</b>: an operator should never silently destroy tenant workloads.</p>

<h2>Status that people and tools can trust</h2>
<p>Design status for two audiences: humans reading <code>kubectl get</code> and <code>describe</code>, and tools deciding whether a rollout succeeded.</p>
<ul>
<li>Always set <code>status.observedGeneration</code> and put <code>observedGeneration</code> in each condition.</li>
<li>Publish a summary <b>Ready</b> condition, plus specific ones (<code>NamespacesReady</code>, <code>PolicyReady</code>) whose reasons are CamelCase and stable (they are an API), and messages written for humans.</li>
<li>Use <code>meta.SetStatusCondition</code>, which updates <code>lastTransitionTime</code> only when status actually changes.</li>
<li>Report external identifiers (policy ID, load balancer ARN) so humans can find things; never report secrets.</li>
<li>Status is a report, not a database: an operator must be able to rebuild it from the world. Do not store the only copy of anything in status.</li>
</ul>
${fig('kstatus', '<b>Figure 27.2</b> Interactive: how generic tools compute a custom resource\'s status from generation and conditions.')}

<h2>More patterns</h2>
<div class="tbl"><table><tr><th>Pattern</th><th>What it solves</th></tr>
<tr><td><b>One object, one reconciler, one owner per field</b></td><td>Two controllers writing the same field fight forever. Split responsibilities by field managers, or by objects.</td></tr>
<tr><td><b>Deterministic names</b> for children and external resources</td><td>Stale caches and retries cannot create duplicates</td></tr>
<tr><td><b>Status-driven state machines</b> for long workflows (backup, failover, upgrade)</td><td>Record the current phase and its inputs in status or a child object; each reconcile advances one step; resumable after crashes</td></tr>
<tr><td><b>Child objects for heavy work</b> (a Job per backup)</td><td>Long work runs outside the reconcile loop; the operator watches the Job's status</td></tr>
<tr><td><b>Rate limits and circuit breakers</b> on external APIs</td><td>A thousand Tenants reconciling at start-up must not exceed the external system's quota</td></tr>
<tr><td><b>Pause annotation</b> (<code>platform.example.com/paused: "true"</code>)</td><td>Lets humans stop reconciliation of one object during an incident</td></tr>
<tr><td><b>Cache scoping</b> (label selectors, namespaces, metadata-only watches)</td><td>Keeps memory bounded in big clusters</td></tr>
<tr><td><b>MaxConcurrentReconciles</b> and the priority queue</td><td>Throughput with many objects; recently changed objects first after a restart</td></tr>
</table></div>

<h2>Operator maturity</h2>
${fig('levels', '<b>Figure 27.3</b> The operator capability levels commonly used to describe how much operational knowledge an operator encodes.')}
<p>The Tenant operator is at level 1 to 2. Operators for stateful systems climb further: CloudNativePG, for example, handles PostgreSQL failover, backups to object storage, point-in-time recovery and rolling minor-version upgrades. The higher the level, the more the operator must be tested against real failures (Chapter 28).</p>

<h2>Anti-patterns</h2>
<div class="note pit"><b>Things that make operators dangerous</b>
<ul>
<li><strong>Edge-triggered logic</strong> ("on create, do X"): a missed event means X never happens.</li>
<li><strong>Imperative multi-step code in one Reconcile</strong> that assumes it will run to completion.</li>
<li><strong>Removing finalizers before clean-up succeeds</strong>, or never adding them before creating external resources.</li>
<li><strong>Cascading deletion of user data</strong> through owner references on namespaces, volumes or databases.</li>
<li><strong>Status written on every pass</strong>, causing watch storms; or spec written by the operator, confusing users and GitOps.</li>
<li><strong>Cluster-admin RBAC</strong> "to be safe".</li>
<li><strong>Hot loops</strong>: reconciles that always find a difference (comparing defaulted fields, timestamps, map ordering).</li>
<li><strong>Blocking calls without timeouts</strong> to external systems, which stall a worker forever.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Error or requeue?</summary><p>Choose the return for: the cloud API returned 429; the user asked for a namespace that another tenant already uses; waiting for a certificate that is issued asynchronously.</p><p><em>Answer:</em> return the error (back-off); a False condition with reason NamespaceConflict and either RequeueAfter (minutes) or, better, a field index on <code>spec.namespaces</code> so the Namespace map function enqueues every Tenant that lists the namespace (TerminalError alone would wait until someone edits the Tenant); RequeueAfter (or watch the Certificate object if it is in the cluster).</p></details>
<details><summary>Crash between steps</summary><p>The operator creates the external policy, then crashes before writing status. What happens on restart?</p><p><em>Answer:</em> Reconcile runs again, EnsurePolicy finds the existing policy by tenant name and returns its ID, and status is written. Idempotency by natural key is what makes this safe.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Implement Delete policy</summary><p>Implement <code>releaseNamespaces</code> for both policies. For Delete, delete each labelled namespace and return waiting=true until none remain; for Retain, remove the tenant label and Pod Security labels the operator set (using an apply that omits them).</p><p><em>Answer:</em> list namespaces by label; for Delete, call Delete (ignore NotFound) and report waiting while any still exist; for Retain, apply the namespace with the operator's field manager and no labels, which removes the fields it owned.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>A state machine</summary><p>Add a <code>TenantMigration</code> resource that moves a tenant's workloads to another cluster in phases (Freeze, Backup, Restore, Verify, Switch, Done). Store the phase in status, make each phase idempotent and resumable, run heavy work as Jobs, and add a pause annotation.</p><p><em>Answer:</em> a switch on status.phase; each case checks whether its work is done (Job succeeded, data present), starts it if not, and advances the phase only when verified; failures set a condition and either retry or stall for human action.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can choose between returning nil, an error, RequeueAfter and a terminal error.</li>
<li>I can implement finalizers safely for external resources, including deletion policies.</li>
<li>I can design status with observedGeneration and conditions that generic tools understand.</li>
<li>I can apply patterns for long workflows, external rate limits and large clusters, and recognise anti-patterns.</li>
</ul>
`});

<h2>When a webhook is still needed</h2>
<p>Prefer CEL in the CRD schema (Chapter 23) or a ValidatingAdmissionPolicy (Chapter 17): they run in the API server and cannot go down. Use a webhook when a rule needs <b>other objects or external data</b>. For Tenants: a namespace may belong to only one Tenant, which requires listing other Tenants.</p>

package v1

import (
	"context"
	"fmt"
	"slices"

	apierrors "k8s.io/apimachinery/pkg/api/errors"
	"k8s.io/apimachinery/pkg/util/validation/field"
	ctrl "sigs.k8s.io/controller-runtime"
	"sigs.k8s.io/controller-runtime/pkg/builder"
	"sigs.k8s.io/controller-runtime/pkg/client"
	"sigs.k8s.io/controller-runtime/pkg/webhook/admission"

	platformv1 "example.com/tenant-operator/api/v1"
)

func SetupTenantWebhookWithManager(mgr ctrl.Manager) error {
	return builder.WebhookManagedBy(mgr, &platformv1.Tenant{}).
		WithValidator(&TenantValidator{Reader: mgr.GetAPIReader()}). // uncached reads for correctness
		WithDefaulter(&TenantDefaulter{}).
		Complete()
}

// +kubebuilder:webhook:path=/mutate-platform-example-com-v1-tenant,mutating=true,failurePolicy=fail,sideEffects=None,groups=platform.example.com,resources=tenants,verbs=create;update,versions=v1,name=mtenant-v1.platform.example.com,admissionReviewVersions=v1

type TenantDefaulter struct{}

// Default adds the platform team's group to every tenant's administrators.
func (d *TenantDefaulter) Default(_ context.Context, t *platformv1.Tenant) error {
	if !slices.Contains(t.Spec.AdminGroups, "oidc:platform-admins") {
		t.Spec.AdminGroups = append(t.Spec.AdminGroups, "oidc:platform-admins")
	}
	return nil
}

// +kubebuilder:webhook:path=/validate-platform-example-com-v1-tenant,mutating=false,failurePolicy=fail,sideEffects=None,groups=platform.example.com,resources=tenants,verbs=create;update,versions=v1,name=vtenant-v1.platform.example.com,admissionReviewVersions=v1

type TenantValidator struct {
	Reader client.Reader
}

func (v *TenantValidator) ValidateCreate(ctx context.Context, t *platformv1.Tenant) (admission.Warnings, error) {
	return v.validate(ctx, t)
}

func (v *TenantValidator) ValidateUpdate(ctx context.Context, _, t *platformv1.Tenant) (admission.Warnings, error) {
	return v.validate(ctx, t)
}

func (v *TenantValidator) ValidateDelete(context.Context, *platformv1.Tenant) (admission.Warnings, error) {
	return nil, nil
}

func (v *TenantValidator) validate(ctx context.Context, t *platformv1.Tenant) (admission.Warnings, error) {
	var tenants platformv1.TenantList
	if err := v.Reader.List(ctx, &tenants); err != nil {
		return nil, err // failurePolicy=fail: better to reject than to admit unchecked
	}
	var errs field.ErrorList
	path := field.NewPath("spec", "namespaces")
	for _, other := range tenants.Items {
		if other.Name == t.Name {
			continue
		}
		for i, ns := range t.Spec.Namespaces {
			if slices.Contains(other.Spec.Namespaces, ns) {
				errs = append(errs, field.Forbidden(path.Index(i), fmt.Sprintf("namespace %q already belongs to tenant %q", ns, other.Name)))
			}
		}
	}
	var warn admission.Warnings
	if ptr.Deref(t.Spec.Quota.Pods, 100) > 1000 {
		warn = append(warn, "pods quota above 1000: confirm capacity with the platform team")
	}
	if len(errs) > 0 {
		return warn, apierrors.NewInvalid(platformv1.GroupVersion.WithKind("Tenant").GroupKind(), t.Name, errs)
	}
	return warn, nil
}`}
<div class="note key"><b>Webhooks cannot enforce uniqueness alone</b><p>Two Tenants created at the same instant can both pass validation, because each check runs before either is stored. The reconciler must still detect the conflict and report it (a <code>NamespaceConflict</code> condition, and not touching the contested namespace). Admission narrows the window; the controller closes it.</p></div>
<p>Webhooks need TLS certificates trusted by the API server. The kubebuilder scaffold uses cert-manager to issue them and inject the CA bundle into the webhook configurations; controller-runtime reloads rotated certificates. Run at least two replicas (webhooks serve in every replica, not only the leader), set a PodDisruptionBudget, and allow the API server to reach port 9443 in your NetworkPolicy.</p>
<h3>Webhook hardening</h3>
<ul>
<li><b>Call the webhook only when needed</b>: <code>namespaceSelector</code> and <code>objectSelector</code> exclude <code>kube-system</code> and the operator's own namespace, and <code>matchConditions</code> (CEL, stable since 1.30) skip requests the webhook does not care about, before any network call.</li>
<li><b>Short timeouts</b>: <code>timeoutSeconds</code> defaults to 10 and may be at most 30; keep validating webhooks at 2 to 5 seconds, because a slow webhook slows every matching write.</li>
<li><b>Watch it</b>: <code>apiserver_admission_webhook_request_total</code>, <code>apiserver_admission_webhook_rejection_count</code> and <code>apiserver_admission_webhook_admission_duration_seconds</code> show failures and latency from the API server's side.</li>
<li><b>Guardrails that must survive</b> belong in manifest-based admission configuration (beta in 1.37, Chapter 17) rather than in a webhook that a cluster administrator can delete.</li>
</ul>

<h2>Conversion</h2>
${fig('hubspoke', '<b>Figure 28.1</b> Hub-and-spoke conversion: each old version converts to and from the hub only.')}
${G('Converting v1alpha1 (spoke) to and from v1 (hub)')`
// api/v1/tenant_conversion.go
func (*Tenant) Hub() {}

// api/v1alpha1/tenant_conversion.go
// v1alpha1 had a single "owner" group; v1 has adminGroups, tier, quota and more.
// Down-conversion keeps the whole v1 spec in an annotation so a round trip through
// an old client loses nothing (and cannot silently downgrade a regulated tenant).
const v1SpecAnnotation = "platform.example.com/v1-spec"

func (src *Tenant) ConvertTo(dstRaw conversion.Hub) error {
	dst := dstRaw.(*platformv1.Tenant)
	dst.ObjectMeta = *src.ObjectMeta.DeepCopy()
	if raw, ok := src.Annotations[v1SpecAnnotation]; ok {
		if err := json.Unmarshal([]byte(raw), &dst.Spec); err != nil {
			return err
		}
		delete(dst.Annotations, v1SpecAnnotation)
	}
	dst.Spec.Namespaces = src.Spec.Namespaces // fields v1alpha1 can edit win
	if len(dst.Spec.AdminGroups) == 0 || dst.Spec.AdminGroups[0] != src.Spec.Owner {
		dst.Spec.AdminGroups = append([]string{src.Spec.Owner}, without(dst.Spec.AdminGroups, src.Spec.Owner)...)
	}
	dst.Status.Conditions = src.Status.Conditions
	return nil
}

func (dst *Tenant) ConvertFrom(srcRaw conversion.Hub) error {
	src := srcRaw.(*platformv1.Tenant)
	dst.ObjectMeta = *src.ObjectMeta.DeepCopy()
	dst.Spec.Namespaces = src.Spec.Namespaces
	if len(src.Spec.AdminGroups) > 0 {
		dst.Spec.Owner = src.Spec.AdminGroups[0]
	}
	raw, err := json.Marshal(src.Spec)
	if err != nil {
		return err
	}
	if dst.Annotations == nil {
		dst.Annotations = map[string]string{}
	}
	dst.Annotations[v1SpecAnnotation] = string(raw)
	dst.Status.Conditions = src.Status.Conditions
	return nil
}`}

<p>Test the cases that break operators in production: reconciling with the cache missing your last write; the API returning conflicts; the external system timing out; deletion while a reconcile is in progress; an operator upgrade while objects exist; a CRD upgrade adding a required field (it must have a default, or old objects become invalid on their next update).</p>

<h2>Shipping</h2>
<div class="tbl"><table><tr><th>Concern</th><th>Practice</th></tr>
<tr><td>Packaging</td><td><code>make build-installer</code> for a single YAML; the kubebuilder Helm plugin for a chart; OLM bundles (Operator SDK) for OperatorHub and OpenShift</td></tr>
<tr><td>CRD upgrades</td><td>Helm does not upgrade CRDs in its <code>crds/</code> directory: ship CRDs as templates or apply them separately, before the new operator version starts. Change the storage version, run a <code>StorageVersionMigration</code> (<code>storagemigration.k8s.io/v1</code>, stable in 1.37), confirm <code>status.storedVersions</code> lists only the new version, then stop serving and finally remove the old version, each in a separate release</td></tr>
<tr><td>Operator upgrades</td><td>New and old versions may run side by side briefly; reconcile must tolerate objects written by either</td></tr>
<tr><td>Security</td><td>Distroless image, non-root, restricted Pod Security, minimal generated RBAC reviewed in PRs, signed images with SBOMs (Chapter 18), NetworkPolicy allowing only the API server to reach webhooks</td></tr>
<tr><td>Operations</td><td>Metrics (<code>controller_runtime_reconcile_errors_total</code>, reconcile time, workqueue depth), structured logs with the object key, alerts on persistent errors and on objects not Ready</td></tr>
<tr><td>Support policy</td><td>Publish which Kubernetes versions each operator release supports, and the deprecation policy for your API versions</td></tr>
</table></div>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Webhooks for rules CEL could express</strong>: more moving parts, more outages.</li>
<li><strong>Webhook <code>failurePolicy: Fail</code> matching all namespaces</strong> including the operator's own, so it cannot restart.</li>
<li><strong>Testing deletion cascades in envtest</strong> and concluding owner references are broken.</li>
<li><strong>CRD changes without defaults for new required fields.</strong></li>
<li><strong>Shipping CRDs in Helm's crds/ folder</strong> and wondering why upgrades do not change them.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Cached or not?</summary><p>Why does the validator use <code>mgr.GetAPIReader()</code> instead of the cached client?</p><p><em>Answer:</em> admission must decide on the latest stored state; the cache may lag, letting a conflicting Tenant through. The direct reader costs one API call per admission, acceptable for low-rate objects such as Tenants.</p></details>
<details><summary>What envtest does not do</summary><p>Your envtest asserts that deleting a Tenant deletes its ResourceQuotas, and it fails. Bug?</p><p><em>Answer:</em> not necessarily: envtest runs no garbage collector. Assert the owner reference instead, and test the cascade on kind.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Webhook end to end</summary><p>Deploy the operator with cert-manager in kind, create two Tenants claiming the same namespace (one after the other), and observe the rejection. Then delete the webhook Deployment and try again with failurePolicy Fail and Ignore.</p><p><em>Answer:</em> with the webhook up, the second create is rejected with a field error; with it down, Fail rejects every Tenant write ("failed calling webhook") and Ignore admits it, leaving the controller to report the conflict.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Round-trip fuzzing</summary><p>Write a fuzz test that generates random v1alpha1 and v1 Tenants, converts each to the other version and back, and checks equality (after normalising fields that are expected to change). What must the conversion preserve?</p><p><em>Answer:</em> everything v1alpha1 cannot represent: extra admin groups, tier, quota, isolation and deletion policy. Storing the full v1 spec in an annotation on down-conversion and restoring it on up-conversion (as above) makes v1 → v1alpha1 → v1 lossless; fuzz both directions, and normalise only the annotation itself when comparing.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can decide when a webhook is justified and write validating and defaulting webhooks with controller-runtime.</li>
<li>I can implement hub-and-spoke conversion and test round trips.</li>
<li>I can test operators with unit tests, envtest and e2e, knowing what each layer misses.</li>
<li>I can package, upgrade and secure an operator, including CRD upgrades.</li>
</ul>
`});

CH.push({
  id: 'ch29', n: 29, title: 'Extending the Platform Further',
  lede: 'Custom resources and controllers cover most extensions, but Kubernetes has a plug-in point at almost every layer: the API server, admission, scheduling, the runtime, networking, storage, devices, identity and the command line. This chapter maps them, shows how to choose, and sketches the most commonly written ones beyond operators.',
  html: `
<h2>The map</h2>
${fig('extmap', '<b>Figure 29.1</b> Where Kubernetes can be extended.')}
${fig('extp', '<b>Figure 29.2</b> Interactive: from a goal to the right extension point.')}
<div class="note key"><b>Choose the least powerful mechanism that works</b><p>Configuration beats code; CEL beats a webhook; a CRD beats an aggregated API server; a scheduler profile beats a scheduler plugin. Every component in the request path or the node's trust path is something you must keep available, patched and compatible with every Kubernetes upgrade.</p></div>

<h2>Aggregated API servers</h2>
${Y('Registering an aggregated API')`
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata: {name: v1beta1.reports.example.com}
spec:
  group: reports.example.com
  version: v1beta1
  service: {name: reports-apiserver, namespace: reports, port: 443}
  caBundle: LS0t…                 # or let cert-manager inject it
  groupPriorityMinimum: 1000
  versionPriority: 15`}
<p>The main API server proxies <code>/apis/reports.example.com/v1beta1</code> to your server, passing the authenticated user in headers; your server delegates authentication and authorization back to the main API server (k8s.io/apiserver does this for you). Use it when CRDs cannot: computed or very large data, high write rates, special verbs. If it is unavailable, discovery for its group fails and namespace deletion can stall, so run it highly available or not at all.</p>

<h2>Scheduler plugins</h2>
<p>A plugin implements one or more framework interfaces (Chapter 9) and is compiled into a scheduler binary built from the Kubernetes source, usually starting from the scheduler-plugins project, which publishes builds and plugins (capacity scheduling, coscheduling, network-aware placement) per Kubernetes release.</p>
${G('A Score plugin preferring spot capacity for tolerant Pods (sketch)')`
// Package and import paths of the framework types follow your Kubernetes version;
// recent releases have been moving the interfaces into the k8s.io/kube-scheduler staging module.
type CapacityType struct{}

func (p *CapacityType) Name() string { return "CapacityType" }

func (p *CapacityType) Score(ctx context.Context, state fwk.CycleState, pod *v1.Pod, nodeInfo fwk.NodeInfo) (int64, *fwk.Status) {
	if pod.Annotations["scheduling.example.com/interruptible"] != "true" {
		return 0, nil
	}
	if nodeInfo.Node().Labels["node.example.com/capacity-type"] == "spot" {
		return fwk.MaxNodeScore, nil
	}
	return 0, nil
}

func (p *CapacityType) ScoreExtensions() fwk.ScoreExtensions { return nil }

// Registered in main with app.NewSchedulerCommand(app.WithPlugin("CapacityType", New))
// and enabled in a profile of KubeSchedulerConfiguration with a weight.`}
<p>Often a plugin is unnecessary: the same effect comes from preferred node affinity injected by a MutatingAdmissionPolicy for annotated Pods. Measure scheduling latency (<code>scheduler_scheduling_attempt_duration_seconds</code>) before and after adding any plugin.</p>

<h2>Device plugins and DRA drivers</h2>
<p>A <b>device plugin</b> is a gRPC server on the node that registers with the kubelet, advertises a count of devices and prepares one when a container is started. A <b>DRA driver</b> has a controller part that publishes ResourceSlices (or the kubelet plugin publishes them for node-local devices) and a kubelet plugin that prepares and unprepares claims, using the <code>k8s.io/dynamic-resource-allocation</code> helper libraries. Drivers now report device health into Pod status and can taint failing devices (Chapter 10). If you are writing support for new hardware today, write a DRA driver.</p>

<h2>kubectl plugins and preferences</h2>
${SH('A kubectl plugin is just an executable')`
cat > ~/bin/kubectl-tenants <<'EOF'
#!/usr/bin/env bash
# kubectl tenants: list tenants with their readiness and namespaces
kubectl get tenants -o custom-columns='NAME:.metadata.name,TIER:.spec.tier,READY:.status.conditions[?(@.type=="Ready")].status,NAMESPACES:.spec.namespaces'
EOF
chmod +x ~/bin/kubectl-tenants
kubectl tenants
kubectl krew search          # discover community plugins (krew is itself a plugin manager)`}
<p>Since 1.34 (beta, on by default), a <code>kuberc</code> file holds per-user kubectl aliases and defaults (for example, always use server-side apply, or interactive delete confirmation), separate from kubeconfig credentials, and since 1.35 can restrict which credential exec plugins kubectl may run.</p>

<h2>Plugins in the trust path</h2>
<ul>
<li><b>Kubelet image credential providers</b>: executables the kubelet calls to get registry credentials, now able to use the Pod's service account token.</li>
<li><b>KMS v2 plugins</b>: gRPC services that wrap and unwrap the data-encryption keys for Secrets at rest using a cloud KMS or HSM.</li>
<li><b>Authentication, authorization and audit webhooks</b>: external services the API server calls on every request or event.</li>
<li><b>External service account token signers</b> (stable since 1.36): keep signing keys in an HSM.</li>
</ul>
<p>Each of these can take a cluster down if it is slow or unavailable, and each sees credentials or every request. Run them with the same care as the control plane.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Forking the scheduler</strong> for something a profile or admission policy could do.</li>
<li><strong>Aggregated API servers without high availability</strong>, which break discovery and namespace deletion.</li>
<li><strong>New device plugins</strong> for hardware that would be better described with DRA.</li>
<li><strong>Plugins in the trust path without timeouts, replicas and monitoring.</strong></li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Pick the extension point</summary><p>Choose for each: show per-team cost data through <code>kubectl get costs</code>; forbid images from public registries; place latency-sensitive Pods on nodes near a hardware security module; add a <code>kubectl tenants</code> command.</p><p><em>Answer:</em> an aggregated API (computed data) or a CRD written by a cost controller; a ValidatingAdmissionPolicy; node affinity and labels (or a DRA driver if the HSM is a node device); a kubectl plugin.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Run a second scheduler profile</summary><p>Configure kube-scheduler in kind with a second profile using MostAllocated scoring, schedule a Deployment with <code>schedulerName</code> set to it, and compare placement with the default profile.</p><p><em>Answer:</em> Pods from the bin-packing profile concentrate on fewer nodes; the default profile spreads them.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>A minimal aggregated API</summary><p>Using the k8s.io/sample-apiserver as a template, serve a read-only resource computed from Tenants (for example, per-tenant resource usage), register it with an APIService, and access it with kubectl and RBAC.</p><p><em>Answer:</em> kubectl get works through the main API server; RBAC rules on the aggregated group apply because your server delegates authorization via SubjectAccessReview.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can map a goal to the right extension point and prefer the least powerful one.</li>
<li>I know when an aggregated API server is justified and what it costs.</li>
<li>I can outline a scheduler plugin, a DRA driver and a kubectl plugin.</li>
<li>I treat plugins in the API server and kubelet trust path as critical infrastructure.</li>
</ul>
`});

CH.push({
  id: 'ch30', n: 30, title: 'AI and Accelerated Workloads',
  lede: 'Kubernetes has become the default substrate for training, fine-tuning and serving models, and increasingly for running AI agents. The workloads stretch every part of the system covered so far: scheduling scarce devices, all-or-nothing placement, long-lived stateful serving with very uneven request costs, and untrusted generated code. This chapter assembles the pieces into an AI platform.',
  html: `
<h2>The stack</h2>
${fig('aistack', '<b>Figure 30.1</b> The layers of an AI platform on Kubernetes.')}
<p>The CNCF's <b>Kubernetes AI Conformance</b> programme, launched in November 2025, certifies platforms that provide this stack in a portable way: DRA for accelerators, gang and workload-aware scheduling, in-place Pod resize, accelerator metrics, inference-aware ingress, and since 2026 checks for disaggregated inference and for sandboxing agentic workloads. By March 2026, 31 platforms were certified.</p>

<h2>Getting accelerators into Pods</h2>
<p>The <b>NVIDIA GPU Operator</b> (itself an operator, levels 3 to 4 in Chapter 27's terms) installs and upgrades everything a node needs: driver, container toolkit, device plugin or DRA driver, the DCGM exporter for metrics, MIG configuration and validation. Other vendors ship comparable operators. With DRA (stable since 1.34, Chapter 10), workloads ask for devices by attributes rather than counts.</p>
${fig('gpushare', '<b>Figure 30.2</b> Interactive: four ways to share a GPU.')}

<h2>Training and fine-tuning</h2>
<ul>
<li><b>Shape</b>: a JobSet (or the Kubeflow Trainer) with a leader and N workers, a headless Service for rendezvous, and a success policy keyed on the leader.</li>
<li><b>Admission</b>: Kueue queues the job until the whole gang fits within the team's quota, borrowing idle capacity from other teams and giving it back by preemption.</li>
<li><b>Placement, all or nothing</b>: since 1.37 the scheduler itself can place a gang atomically through the Workload and PodGroup APIs (beta, behind an API group you must enable; Chapter 10). Kueue decides when the job may start; the PodGroup scheduling cycle decides where all its Pods go, so 8 free GPUs never end up split between a 6-Pod and a 4-Pod gang that both wait forever. Workload-aware preemption (beta) evicts whole gangs rather than single Pods, and ResourceClaims can be shared across a PodGroup so a gang gets one coherent set of devices.</li>
<li><b>Placement</b>: topology-aware scheduling keeps workers in one rack or NVLink domain; DRA claims allocate GPUs and RDMA network interfaces together.</li>
<li><b>Failure handling</b>: a pod failure policy ignores disruptions and fails fast on code errors; frequent checkpoints to object storage make preemption cheap. Pod-level checkpoint and restore through the runtime is alpha in 1.37.</li>
<li><b>Data</b>: datasets streamed from object storage or a parallel file system; model weights versioned as OCI artifacts and mounted with image volumes.</li>
</ul>

<h2>Serving models</h2>
<p>Large-model inference breaks assumptions behind ordinary load balancing. Requests vary from a few tokens to tens of thousands; each replica keeps a <b>KV cache</b> whose fullness determines how many requests it can take; replicas may have different <b>LoRA adapters</b> loaded; and requests sharing a long prompt prefix are much cheaper on a replica that already cached it. Round-robin sends requests to the wrong places.</p>
<p>The <b>Gateway API Inference Extension</b> adds an <code>InferencePool</code> resource (<code>inference.networking.k8s.io/v1</code>): a pool of model-server Pods that an HTTPRoute can target like a Service. The gateway asks an <b>endpoint picker</b> which Pod should serve each request, using live metrics from the model servers. The full-featured picker is developed with the <b>llm-d</b> project, which also supports disaggregated serving (prefill and decode on different replicas) and prefix-cache-aware routing.</p>
${fig('epp', '<b>Figure 30.3</b> Interactive: routing a request with round robin versus an endpoint picker.')}
${Y('An inference pool behind a Gateway')`
apiVersion: inference.networking.k8s.io/v1
kind: InferencePool
metadata: {name: llama-pool, namespace: ai}
spec:
  selector: {matchLabels: {app: vllm-llama}}
  targetPorts: [{number: 8000}]
  endpointPickerRef: {name: llama-epp, port: {number: 9002}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: llm, namespace: ai}
spec:
  parentRefs: [{name: inference-gw}]
  rules:
  - matches: [{path: {type: PathPrefix, value: /v1/}}]
    backendRefs:
    - {group: inference.networking.k8s.io, kind: InferencePool, name: llama-pool}`}
<p>Serving patterns to know: <b>LeaderWorkerSet</b> for models too big for one node; autoscaling on <b>queue depth or tokens per second</b> (custom or external metrics; KEDA), not CPU; <b>scale to zero</b> for rarely used models, accepting cold starts that are dominated by loading weights (pre-pull images, cache weights on local NVMe, use image volumes); and in-place resize to adjust CPU and memory of serving Pods without restarts.</p>

<h2>Agents</h2>
<p>AI agents add two kinds of risk to a cluster.</p>
<ul>
<li><b>Agents that run code.</b> Coding and data-analysis agents execute generated code, which must be treated as untrusted: run it in sandboxed runtimes (gVisor, Kata) through RuntimeClass, with no service account token, default-deny egress, and resource limits. The kubernetes-sigs <b>agent-sandbox</b> project provides a <code>Sandbox</code> API for isolated, stateful agent environments; AI conformance now checks that such isolation is available.</li>
<li><b>Agents that operate the cluster.</b> Assistants that call the Kubernetes API (often through an MCP server) are just another client, and the rules of Chapter 16 apply with extra force: a dedicated identity per agent, read-only by default, write access only to specific namespaces and resources, dry-run and diff before apply, human approval for changes in production, and audit logs attributed to the agent. Never give an agent a kubeconfig with cluster-admin.</li>
</ul>

<h2>Cost and capacity</h2>
<p>Accelerators dominate cost. Measure GPU utilisation (DCGM metrics), not just allocation; share GPUs for small models with MIG; queue batch work with Kueue so idle GPUs are used; use spot capacity for checkpointed training; and right-size serving replicas with request-level metrics.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>CPU-based autoscaling for model servers.</strong> GPUs saturate while CPU idles.</li>
<li><strong>Round-robin load balancing for LLM serving.</strong></li>
<li><strong>Distributed training without gang scheduling.</strong></li>
<li><strong>Time-slicing GPUs across tenants</strong> who must not see or disturb each other.</li>
<li><strong>Agents with broad cluster credentials</strong>, or running generated code in ordinary containers.</li>
<li><strong>Multi-gigabyte model weights baked into images</strong> that every node re-pulls on every rollout.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Choose the sharing mode</summary><p>A bank runs three small fraud-scoring models for different business units on one 80 GB GPU, with strict latency SLOs and separate owners. Which sharing mode?</p><p><em>Answer:</em> MIG: hardware isolation of memory and faults, predictable latency, and one partition per business unit.</p></details>
<details><summary>Scale on what?</summary><p>What metric should drive autoscaling of an LLM serving Deployment?</p><p><em>Answer:</em> queue depth (waiting requests) or KV-cache utilisation per replica, from the model server's metrics, via custom or external metrics; not CPU.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Inference routing without GPUs</summary><p>Deploy a CPU build of a small model server (or the project's simulator) as three replicas, put an InferencePool and an endpoint picker behind a Gateway, and compare tail latency with a plain Service under a skewed load.</p><p><em>Answer:</em> with uneven request sizes, the picker reduces queueing on hot replicas and lowers p99 time to first token compared with connection-level balancing.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>A sandbox for an agent</summary><p>Run a coding agent's executor as Pods in a RuntimeClass using gVisor, with no service account token, default-deny egress except to a package mirror, read-only root, a CPU and memory limit, and a time limit. Try to reach the API server and the cloud metadata endpoint from inside.</p><p><em>Answer:</em> both fail: no credentials, no network path; the sandboxed kernel also blocks many system calls an escape would need.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can describe the layers of an AI platform on Kubernetes and the AI conformance expectations.</li>
<li>I can choose between whole-GPU, time-slicing, MPS and MIG, and use DRA for accelerators.</li>
<li>I can run distributed training with JobSet, Kueue and gang scheduling.</li>
<li>I can serve models with InferencePools and an endpoint picker, and autoscale them on the right metrics.</li>
<li>I can run AI agents and their generated code safely.</li>
</ul>
