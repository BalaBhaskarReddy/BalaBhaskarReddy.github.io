<style>
/* Layout: lab manual. A fixed chapter rail on the left, one reading column, figures that break slightly wider than the prose. */
:root{

  --code-bg:#EDF1F6; --code-ink:#1B2534;

  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#78A6FF; --accent-soft:#1B2944; --hot:#FF8B50; --hot-soft:#3B2216; --ok:#43C99D; --ok-soft:#12332A;
  --cmp:#B78FFF; --cmp-soft:#291F43; --warn:#E5B54A; --warn-soft:#352B12;
  --code-bg:#111821; --code-ink:#DCE3EC;
  --tk-key:#C39BFF; --tk-str:#5FD3A8; --tk-num:#FF9E6B; --tk-com:#7D889A; --tk-fn:#8DB4FF; --tk-type:#F08FC0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C26; --sunk:#1C2531; --ink:#E5EAF1; --ink-2:#B5BFCD; --muted:#8F9AAB; --line:#28323F; --line-2:#56627A;
  --accent:#78A6FF; --accent-soft:#1B2944; --hot:#FF8B50; --hot-soft:#3B2216; --ok:#43C99D; --ok-soft:#12332A;

  color-scheme:dark}
*{box-sizing:border-box}

.rail a{display:grid;grid-template-columns:30px 1fr 14px;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-size:15px;font-weight:500;line-height:1.25}

.rail a.complete .done{background:var(--ok);border-color:var(--ok)}
.topbar{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;font-family:var(--f-display)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.note.key{border-color:var(--accent);background:var(--accent-soft)} .note.key>b:first-child{color:var(--accent)}
.note.pit{border-color:var(--hot);background:var(--hot-soft)} .note.pit>b:first-child{color:var(--hot)}
.note.ex{border-style:dashed} .note.ex>b:first-child{color:var(--ok)}
.formula{font-family:var(--f-mono);font-size:15.5px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:16px 0 18px;overflow-x:auto;white-space:pre;line-height:1.55}

.tbl{overflow-x:auto;margin:18px 0 24px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

.stage{overflow-x:auto;padding:4px 0}
.dg{display:block;margin:0 auto;max-width:100%;height:auto}
.fnote{font-family:var(--f-display);font-size:15.5px;line-height:1.45;color:var(--ink);background:var(--sunk);border-radius:8px;padding:10px 14px;margin-top:10px;min-height:3.3em}

.ctl button svg{width:15px;height:15px;fill:currentColor}

.cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.tabs,.pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--f-display);font-size:13px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--line-2);background:var(--surface)}

.cell{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}

.cell.ok,.nd.ok,.bar.ok{fill:var(--ok-soft);stroke:var(--ok)}

.ed.hot{stroke:var(--hot);stroke-width:3}

.ed.acc{stroke:var(--accent);stroke-width:2.6}

.tp.hot,.tri.hot{fill:var(--hot)} .tp.ok,.tri.ok{fill:var(--ok)} .tp.cmp,.tri.cmp{fill:var(--cmp)} .tp.acc,.tri.acc{fill:var(--accent)} .tp.warn,.tri.warn{fill:var(--warn)}
.lbg{fill:var(--surface);stroke:var(--line);stroke-width:1}
.lbg.hot{fill:var(--hot-soft);stroke:var(--hot)} .lbg.ok{fill:var(--ok-soft);stroke:var(--ok)} .lbg.acc{fill:var(--accent-soft);stroke:var(--accent)} .lbg.cmp{fill:var(--cmp-soft);stroke:var(--cmp)} .lbg.dim{opacity:.35}
.w{font-size:12px;fill:var(--ink-2);font-weight:600}
.axis{stroke:var(--line-2);stroke-width:1.2} .gridl{stroke:var(--line);stroke-width:1}
.c1{stroke:var(--ink-2)} .c2{stroke:var(--ok)} .c3{stroke:var(--accent)} .c4{stroke:var(--cmp)} .c5{stroke:var(--warn)} .c6{stroke:var(--hot)}
.f1{fill:var(--ink-2)} .f2{fill:var(--ok)} .f3{fill:var(--accent)} .f4{fill:var(--cmp)} .f5{fill:var(--warn)} .f6{fill:var(--hot)}
.curve{fill:none;stroke-width:2.6}
.area-ok{fill:var(--ok-soft);opacity:.8} .area-cmp{fill:var(--cmp-soft);opacity:.8} .area-hot{fill:var(--hot-soft)} .area-acc{fill:var(--accent-soft)}
.box{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.6}
.boxs{fill:var(--sunk);stroke:var(--line-2);stroke-width:1.2}
/* practice + checklist */
.practice{display:grid;grid-template-columns:1fr;gap:14px;margin:18px 0 26px}
@media (min-width:760px){.practice{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lvl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}

.lvl.e h4{color:var(--ok)} .lvl.md h4{color:var(--warn)} .lvl.h h4{color:var(--hot)}
.lvl details{border-top:1px solid var(--line);padding:7px 0;font-size:15.5px}
.lvl summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.3}
.lvl details p{margin:6px 0 2px;font-size:15px;color:var(--ink-2);line-height:1.5}
ul.check{list-style:none;padding:0;margin:14px 0 10px;display:grid;gap:6px}
ul.check label{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 14px;cursor:pointer;font-size:16.5px;line-height:1.45}
ul.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok);flex:none}
ul.check label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.ch-nav{max-width:720px;margin:64px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pn:hover{border-color:var(--accent)}
.bitrow{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 12px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
.tool{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px}
.tool label{overflow-wrap:anywhere;display:block;font:600 13px var(--f-display);color:var(--ink-2);margin:10px 0 5px}
.tool label:first-child{margin-top:0}
.tool input.txt{width:100%;height:auto;margin:0;font:15px var(--f-mono);padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg);color:var(--ink);box-sizing:border-box;accent-color:auto}
.tool .chk{display:inline-flex;align-items:center;gap:6px;font:500 13px var(--f-display);color:var(--ink);margin:4px 14px 4px 0;cursor:pointer}.tool .chk input{accent-color:var(--acc)}.tool input[type=datetime-local].txt{font-size:14px}

.tool .out{font:13.5px/1.55 var(--f-mono);overflow-wrap:anywhere;background:var(--sunk);border-radius:7px;padding:8px 10px;color:var(--ink)}

.tool .out .g{color:var(--ok)}

<script>
'use strict';
/* ================= core helpers ================= */
const CH = [], FIG = {};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const f1 = n => Math.round(n * 10) / 10;
const tx = (x, y, t, c = 't', a = 'middle') => `<text x="${f1(x)}" y="${f1(y)}" class="${c}" text-anchor="${a}" dominant-baseline="central">${esc(t)}</text>`;
const svgw = (w, h, inner, label) => `<svg class="dg" viewBox="0 0 ${f1(w)} ${f1(h)}" width="${f1(w)}" height="${f1(h)}" role="img" aria-label="${esc(label || 'Diagram')}">${inner}</svg>`;
const grp = (x, y, s) => `<g transform="translate(${f1(x)},${f1(y)})">${s}</g>`;
const mk = c => ({ hot: 'ar-hot', ok: 'ar-ok', acc: 'ar-acc', cmp: 'ar-cmp', warn: 'ar-warn' }[String(c).split(' ')[0]] || 'ar');
function shorten(a, b, ra, rb) { const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1; return { x1: a.x + dx / L * ra, y1: a.y + dy / L * ra, x2: b.x - dx / L * rb, y2: b.y - dy / L * rb }; }
const ln = (L, c = '', m) => `<line x1="${f1(L.x1)}" y1="${f1(L.y1)}" x2="${f1(L.x2)}" y2="${f1(L.y2)}" class="ed ${c}"${m ? ` marker-end="url(#${mk(c)})"` : ''}/>`;
const arrow = (x1, y1, x2, y2, c = '') => ln({ x1, y1, x2, y2 }, c, true);
function lbl(x, y, t, c = '') { const w = String(t).length * 7.4 + 10; return `<rect x="${f1(x - w / 2)}" y="${f1(y - 9)}" width="${f1(w)}" height="18" rx="4" class="lbg ${c}"/>` + tx(x, y, t, 'w ' + c); }
const rect = (x, y, w, h, c = 'cell', r = 5) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${r}" class="${c}"/>`;
const code = (title, lang = 'go') => (s, ...v) => `<div class="code">${title ? `<div class="code-h">${esc(title)}</div>` : ''}<pre><code class="language-${lang}">${esc(String.raw({ raw: s.raw }, ...v).replace(/\\`/g, '`').replace(/\\\$\{/g, '${').replace(/^\n+|\s+$/g, ''))}</code></pre></div>`;
const fig = (name, cap) => `<figure class="fig" data-fig="${name}" data-cap="${esc(cap || '')}"></figure>`;

/* ================= primitives ================= */
function arrayRow(vals, o = {}) {
  const c = o.cell || 46, gap = o.gap || 0, st = o.st || {}, x0 = o.x || 0, y0 = o.y || 0;
  const groups = {};
  (o.ptr || []).forEach(p => { if (p.i == null || p.i < 0 || p.i > vals.length) return; (groups[p.i] = groups[p.i] || []).push(p); });
  const depth = Math.max(0, ...Object.values(groups).map(g => g.length));
  const top = y0 + (depth ? depth * 17 + 12 : 0);
  let s = '';
  if (o.range) { const [l, r] = o.range; if (l <= r) s += rect(x0 + l * (c + gap) - 3, top - 3, (r - l + 1) * (c + gap) - gap + 6, c + 6, 'area-' + (o.rangeCls || 'acc'), 7); }
  vals.forEach((v, i) => {
    const x = x0 + i * (c + gap), k = st[i] || '';
    s += rect(x + 1, top + 1, c - 2, c - 2, 'cell ' + k);
    s += tx(x + c / 2, top + c / 2, v == null ? '' : v, 'tv ' + (o.small ? 'sm ' : '') + k);
    if (o.idx !== false) s += tx(x + c / 2, top + c + 13, o.idxLabels ? o.idxLabels[i] : i, 'ti');
  });
  for (const i in groups) {
    const x = x0 + (+i) * (c + gap) + c / 2, g = groups[i];
    g.forEach((p, k) => { s += tx(x, top - 12 - (g.length - 1 - k) * 17, p.label, 'tp ' + (p.cls || 'acc')); });
    s += `<path d="M${f1(x - 5)} ${top - 5} L${f1(x + 5)} ${top - 5} L${f1(x)} ${top + 1} Z" class="tri ${g[g.length - 1].cls || 'acc'}"/>`;
  }
  const pmax = Math.max(vals.length, ...Object.keys(groups).map(k => +k + 1));
  return { s, w: x0 + pmax * (c + gap) - gap, h: top + c + (o.idx !== false ? 24 : 4) };
}

function chips(x, y, label, vals, o = {}) {
  let s = label ? tx(x, y + 14, label, 'tm', 'start') : '';
  let cx = x + (label ? (o.lw || 74) : 0);
  const st = o.st || {};
  vals.forEach((v, i) => {
    const w = Math.max(30, String(v).length * 8.2 + 14), k = st[i] || o.cls || '';
    s += rect(cx, y, w, 28, 'cell ' + k) + tx(cx + w / 2, y + 14, v, 'tv sm ' + k); cx += w + 6;
  });
  if (!vals.length) s += tx(cx, y + 14, o.empty || 'empty', 'tm', 'start');
  return s;
}

function btree(nodes, root, o = {}) {
  const dx = o.dx || 46, dy = o.dy || 62, r = o.r || 18, px = o.px ?? 20, py = o.py ?? 20, st = o.st || {}, es = o.es || {}, sub = o.sub || {};
  const pos = {}; let k = 0, md = 0;
  (function w(id, d) { if (id == null || nodes[id] == null) return; w(nodes[id].l, d + 1); pos[id] = { x: px + r + k * dx, y: py + r + d * dy }; k++; md = Math.max(md, d); w(nodes[id].r, d + 1); })(root, 0);
  let s = '';
  for (const id in pos) { const n = nodes[id]; [n.l, n.r].forEach(c => { if (c != null && pos[c]) s += ln(shorten(pos[id], pos[c], r, r), es[id + '-' + c] || ''); }); }
  for (const id in pos) {
    const p = pos[id], c = st[id] || '';
    s += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}" class="nd ${c}"/>` + tx(p.x, p.y, nodes[id].v, 'tn ' + (String(nodes[id].v).length > 2 ? 'sm ' : '') + c);
    if (sub[id] != null) s += tx(p.x, p.y + r + 11, sub[id], 'tsub');
  }
  return { s, w: px * 2 + 2 * r + Math.max(0, k - 1) * dx, h: py * 2 + 2 * r + md * dy + (Object.keys(sub).length ? 16 : 0), pos };
}
function heapNodes(a) { const N = {}; a.forEach((v, i) => { N[i] = { v, l: 2 * i + 1 < a.length ? 2 * i + 1 : null, r: 2 * i + 2 < a.length ? 2 * i + 2 : null }; }); return N; }
/* level-order heap layout: keeps positions stable as the heap changes */
function heapTree(a, o = {}) {
  const n = a.length, r = o.r || 19, dy = o.dy || 58, W = o.W || 520, st = o.st || {}, es = o.es || {};
  const P = i => { const d = Math.floor(Math.log2(i + 1)), first = 2 ** d - 1, cnt = 2 ** d; return { x: (i - first + 0.5) * W / cnt, y: r + 8 + d * dy }; };
  let s = '', md = 0;
  for (let i = 1; i < n; i++) { const p = (i - 1) >> 1; s += ln(shorten(P(p), P(i), r, r), es[p + '-' + i] || ''); }
  for (let i = 0; i < n; i++) {
    const p = P(i), c = st[i] || ''; md = Math.max(md, p.y);
    s += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}" class="nd ${c}"/>` + tx(p.x, p.y, a[i], 'tn ' + c);
    if (o.idx) s += tx(p.x + r + 6, p.y - r + 2, i, 'ti', 'start');
  }
  return { s, w: W, h: md + r + 10 };
}

function gtree(root, o = {}) {
  const dx = o.dx || 64, dy = o.dy || 64, nw = o.nw || 54, nh = o.nh || 28, px = o.px ?? 8, py = o.py ?? 8;
  let leaf = 0, md = 0; const all = [];
  (function lay(n, d) { n._d = d; md = Math.max(md, d); all.push(n); if (n.kids && n.kids.length) { n.kids.forEach(c => lay(c, d + 1)); n._x = (n.kids[0]._x + n.kids[n.kids.length - 1]._x) / 2; } else n._x = leaf++; })(root, 0);
  const W = n => n.w || nw;
  const X = n => px + nw / 2 + n._x * dx, Y = n => py + nh / 2 + n._d * dy;
  let s = '', el = '';
  all.forEach(n => (n.kids || []).forEach(c => {
    s += `<line x1="${f1(X(n))}" y1="${f1(Y(n) + nh / 2)}" x2="${f1(X(c))}" y2="${f1(Y(c) - nh / 2)}" class="ed ${c.ec || ''}"/>`;
    if (c.el != null) el += lbl((X(n) + X(c)) / 2, (Y(n) + nh / 2 + Y(c) - nh / 2) / 2, c.el, c.ec || '');
  }));
  s += el;
  all.forEach(n => {
    const w = W(n);
    s += rect(X(n) - w / 2, Y(n) - nh / 2, w, nh, 'nd ' + (n.cls || ''), o.round ? nh / 2 : 6) + tx(X(n), Y(n), n.label, 'tn ' + (o.small ? 'sm ' : '') + (n.cls || ''));
    if (n.sub != null) s += tx(X(n), Y(n) + nh / 2 + 11, n.sub, 'tsub');
  });
  return { s, w: px * 2 + nw + Math.max(0, leaf - 1) * dx, h: py * 2 + nh + md * dy + 16, X, Y, all };
}

function graph(N, E, o = {}) {
  const r = o.r || 19, ns = o.ns || {}, es = o.es || {}, sub = o.sub || {}, dir = !!o.dir;
  let s = '', labels = '';
  E.forEach(([a, b, w, bend]) => {
    const A = N[a], B = N[b], k = es[a + '-' + b] || (!dir && es[b + '-' + a]) || '';
    if (bend) {
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy);
      const C = { x: mx - dy / L * bend, y: my + dx / L * bend }, s1 = shorten(A, C, r, 0), s2 = shorten(C, B, 0, r + (dir ? 2 : 0));
      s += `<path d="M${f1(s1.x1)} ${f1(s1.y1)} Q${f1(C.x)} ${f1(C.y)} ${f1(s2.x2)} ${f1(s2.y2)}" class="ed ${k}"${dir ? ` marker-end="url(#${mk(k)})"` : ''}/>`;
      if (w != null) labels += lbl((A.x + 2 * C.x + B.x) / 4, (A.y + 2 * C.y + B.y) / 4, w, k);
    } else {
      s += ln(shorten(A, B, r, r + (dir ? 2 : 0)), k, dir);
      if (w != null) labels += lbl((A.x + B.x) / 2, (A.y + B.y) / 2, w, k);
    }
  });
  s += labels;
  for (const id in N) {
    const n = N[id], k = ns[id] || '';
    const lab = n.l ?? id;
    if (n.box) { const bw = Math.max(2 * r, String(lab).length * 8 + 18), bh = 2 * r - 4; s += rect(n.x - bw / 2, n.y - bh / 2, bw, bh, 'nd ' + k, 6); }
    else s += `<circle cx="${n.x}" cy="${n.y}" r="${r}" class="nd ${k}"/>`;
    s += tx(n.x, n.y, lab, 'tn ' + (String(lab).length > 2 ? 'sm ' : '') + k);
    if (sub[id] != null && sub[id] !== '') s += lbl(n.x + (n.sx || 0), n.y + (n.sy ?? -1) * (r + 13), sub[id], (o.subCls || {})[id] || '');
  }
  return { s, w: o.w, h: o.h };
}

function llist(o) {
  const bw = o.bw || 66, bh = 38, gap = o.gap || 46, px = 16, val = o.val || {}, st = o.st || {}, drop = o.drop || {};
  const ptr = o.ptr || {};
  const depth = Math.max(0, ...Object.values(ptr).map(a => a.length));
  const top = 10 + (depth ? depth * 17 + 12 : 0);
  const idx = {}; o.slots.forEach((id, i) => idx[id] = i);
  const X = i => px + i * (bw + gap), Y = id => top + (drop[id] || 0);
  const isNull = id => String(id).startsWith('null');
  let s = '', below = 0;
  for (const id in (o.next || {})) {
    const t = o.next[id]; if (t == null || idx[t] == null || idx[id] == null) continue;
    const i = idx[id], j = idx[t], k = (o.es || {})[id] || '';
    const sx = X(i) + bw - 11, sy = Y(id) + bh / 2;
    if (j > i) { const ex = isNull(t) ? X(j) + bw / 2 - 28 : X(j) - 1; s += `<path d="M${sx} ${sy} L${ex} ${Y(t) + bh / 2}" class="ed ${k}" marker-end="url(#${mk(k)})"/>`; }
    else { const ex = X(j) + bw / 2, ey = Y(t) + (isNull(t) ? bh / 2 + 14 : bh) + 3, dep = 22 + (i - j) * 8; below = Math.max(below, dep + 10); s += `<path d="M${sx} ${sy} C ${sx + 6} ${sy + dep + 22}, ${ex} ${ey + dep}, ${ex} ${ey}" class="ed ${k}" marker-end="url(#${mk(k)})"/>`; }
  }
  o.slots.forEach((id, i) => {
    const x = X(i), y = Y(id), k = st[id] || '';
    if (isNull(id)) { s += rect(x + bw / 2 - 26, y + bh / 2 - 14, 52, 28, 'cell dash ' + k) + tx(x + bw / 2, y + bh / 2, 'null', 'tm'); }
    else {
      s += rect(x, y, bw, bh, 'cell ' + k) + `<line x1="${x + bw - 22}" y1="${y}" x2="${x + bw - 22}" y2="${y + bh}" class="ed"/>`;
      s += tx(x + (bw - 22) / 2, y + bh / 2, val[id] ?? id, 'tv ' + k) + `<circle cx="${x + bw - 11}" cy="${y + bh / 2}" r="3.4" class="f1"/>`;
    }
    const pl = ptr[id]; if (pl) { pl.forEach((p, q) => { s += tx(x + bw / 2 - 11, top - 12 - (pl.length - 1 - q) * 17 + (drop[id] || 0), p.label, 'tp ' + (p.cls || 'acc')); }); }
  });
  const md = Math.max(0, ...Object.values(drop));
  return { s, w: X(o.slots.length - 1) + bw + px, h: top + bh + md + below + 14 };
}

function stackV(vals, o = {}) {
  const cap = Math.max(o.cap || 4, vals.length), bw = o.bw || 96, bh = 32, px = o.px ?? 14, py = o.title ? 30 : 12, st = o.st || {};
  let s = o.title ? tx(px + bw / 2, 12, o.title, 'th') : '';
  const bot = py + cap * bh + 6;
  s += `<path d="M${px - 5} ${py} V${bot} H${px + bw + 5} V${py}" class="well"/>`;
  vals.forEach((v, i) => { const y = py + (cap - 1 - i) * bh + 3, k = st[i] || ''; s += rect(px, y, bw, bh - 4, 'cell ' + k) + tx(px + bw / 2, y + (bh - 4) / 2, v, 'tv sm ' + k); });
  if (vals.length && o.top !== false) { const y = py + (cap - vals.length) * bh + 3 + (bh - 4) / 2; s += arrow(px + bw + 44, y, px + bw + 10, y, 'acc') + tx(px + bw + 48, y, 'top', 'tp acc', 'start'); }
  if (!vals.length) s += tx(px + bw / 2, bot - 20, 'empty', 'tm');
  return { s, w: px + bw + (o.top !== false ? 84 : 16), h: bot + 8 };
}

function ring(slots, o = {}) {
  const n = slots.length, R = o.R || 92, cx = R + 74, cy = R + 54, bw = 44, st = o.st || {};
  let s = `<circle cx="${cx}" cy="${cy}" r="${R}" class="ringc"/>`;
  slots.forEach((v, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n, cs = Math.cos(a), sn = Math.sin(a), x = cx + R * cs, y = cy + R * sn, k = st[i] || '';
    s += rect(x - bw / 2, y - bw / 2, bw, bw, 'cell ' + k, 7) + tx(x, y, v ?? '', 'tv ' + k) + tx(cx + (R - 40) * cs, cy + (R - 40) * sn, i, 'ti');
    const labs = []; if (o.head === i) labs.push(['head', 'acc']); if (o.tail === i) labs.push(['tail', 'hot']);
    labs.forEach((L, q) => { const rr = R + 42 + q * 18; s += tx(cx + rr * cs, cy + rr * sn, L[0], 'tp ' + L[1]); });
  });
  return { s, w: 2 * cx, h: 2 * cy };
}

function bars(vals, o = {}) {
  const bw = o.bw || 34, gap = o.gap || 8, H = o.H || 150, max = o.max || Math.max(...vals, 1), st = o.st || {}, px = 8, py = 22;
  let s = '';
  if (o.range && o.range[0] <= o.range[1]) { const [l, r] = o.range; s += rect(px + l * (bw + gap) - 4, py - 16, (r - l + 1) * (bw + gap) - gap + 8, H + 20, 'area-' + (o.rangeCls || 'acc'), 6); }
  vals.forEach((v, i) => { const h = Math.max(3, v / max * H), x = px + i * (bw + gap), y = py + H - h, k = st[i] || ''; s += rect(x, y, bw, h, 'bar ' + k, 3) + tx(x + bw / 2, y - 9, v, 'tv sm') + tx(x + bw / 2, py + H + 13, i, 'ti'); });
  let rows = 0;
  (o.marks || []).forEach(m => { if (m.i == null) return; rows = Math.max(rows, (m.row || 0) + 1); const x = px + m.i * (bw + gap) + bw / 2; s += tx(x, py + H + 31 + (m.row || 0) * 16, m.label, 'tp ' + (m.cls || 'acc')); });
  return { s, w: px * 2 + vals.length * (bw + gap) - gap, h: py + H + 24 + rows * 16 + 6 };
}

function grid(cells, o = {}) {
  const cw = o.cw || 40, chh = o.chh || 34, rows = cells.length, cols = cells[0].length, st = o.st || {};
  const hw = o.rh ? (o.rhw || 46) : 0, hh = o.ch ? 26 : 0, px = 2, py = 2;
  let s = '';
  if (o.ch) o.ch.forEach((t, c) => s += tx(px + hw + c * cw + cw / 2, py + hh / 2, t, 'th'));
  if (o.rh) o.rh.forEach((t, r) => s += tx(px + hw / 2, py + hh + r * chh + chh / 2, t, 'th'));
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const k = st[r + ',' + c] || '', x = px + hw + c * cw, y = py + hh + r * chh, v = cells[r][c];
    s += rect(x + 1, y + 1, cw - 2, chh - 2, 'cell ' + k, 3) + tx(x + cw / 2, y + chh / 2, v == null ? '' : v, 'tv ' + (o.small ? 'sm ' : '') + k);
  }
  (o.arrows || []).forEach(a => {
    const C = ([r, c]) => ({ x: px + hw + c * cw + cw / 2, y: py + hh + r * chh + chh / 2 });
    s += ln(shorten(C(a[0]), C(a[1]), 9, 11), a[2] || 'hot', true);
  });
  return { s, w: px * 2 + hw + cols * cw, h: py * 2 + hh + rows * chh };
}

/* ================= figure mounting + stepper ================= */
const IC = {

FIG.reconcile = host => {
  const NODES = ['node-a', 'node-b', 'node-c'];
  let want = 4, pods = [], up = [true, true, true], seq = 0, log = [], auto = false, timer = null;
  const mkpod = n => ({ id: 'web-' + (++seq).toString(36).padStart(3, '0'), node: n, st: 'Pending' });
  host.innerHTML = `<div class="tool"><p class="meta" style="margin:0 0 8px">A toy ReplicaSet controller. It never remembers what it did; every pass it compares what you asked for with what exists and acts on the difference.</p>
  <div class="row"><div style="flex:2 1 200px"><label for="rc-want">desired replicas: <b id="rc-wv">4</b></label><input type="range" id="rc-want" min="0" max="9" value="4"></div></div>
  <div class="btns"><button type="button" class="act" data-a="step">Run one reconcile pass</button><button type="button" class="act" data-a="auto">Run continuously</button><button type="button" class="act" data-a="kill">Delete a random pod</button><button type="button" class="act" data-a="node">Fail or restore node-b</button></div>
  <div id="rc-fig"></div><div class="out" id="rc-log" aria-live="polite"></div></div>`;
  const R = rng(7);
  const draw = () => {
    let s = '';
    NODES.forEach((n, i) => {
      const x = 8 + i * 212; s += nodeBox(x, 8, 200, 130, n + (up[i] ? '' : ' (NotReady)'), up[i] ? '' : 'hot');
      pods.filter(p => p.node === i).forEach((p, k) => s += pod(x + 10 + (k % 2) * 92, 32 + Math.floor(k / 2) * 30, p.id, p.st === 'Running' ? 'ok' : p.st === 'Lost' ? 'hot' : 'warn', 84));
    });
    const live = pods.filter(p => p.st !== 'Lost').length;
    s += tx(320, 156, `desired ${want} · observed ${live} · difference ${want - live > 0 ? '+' : ''}${want - live}`, 'tb');
    host.querySelector('#rc-fig').innerHTML = `<div class="stage">${svgw(644, 170, s, 'Pods across three nodes')}</div>`;
    host.querySelector('#rc-log').innerHTML = log.slice(-6).map(l => esc(l)).join('<br>') || 'Press "Run one reconcile pass".';
  };
  const pass = () => {
    pods.forEach(p => { if (p.st === 'Pending' && up[p.node]) p.st = 'Running'; });
    pods.forEach(p => { if (!up[p.node] && p.st !== 'Lost') p.st = 'Lost'; });
    const before = pods.length; pods = pods.filter(p => p.st !== 'Lost');
    if (before !== pods.length) log.push(`observe: ${before - pods.length} pod(s) on the failed node were evicted (a real cluster waits 5 minutes by default)`);
    const diff = want - pods.length;
    if (diff > 0) {
      for (let k = 0; k < diff; k++) {
        const ok = [0, 1, 2].filter(i => up[i]).sort((a, b) => pods.filter(p => p.node === a).length - pods.filter(p => p.node === b).length);
        if (!ok.length) { log.push('act: no Ready node; nothing can be placed, will retry'); break; }
        const p = mkpod(ok[0]); pods.push(p);
      }
      log.push(`act: desired ${want}, observed ${want - diff} → create ${diff}`);
    } else if (diff < 0) {
      const victims = pods.slice().sort((a, b) => (a.st === 'Pending' ? -1 : 1) - (b.st === 'Pending' ? -1 : 1)).slice(0, -diff);
      pods = pods.filter(p => !victims.includes(p)); log.push(`act: desired ${want}, observed ${want - diff} → delete ${-diff}`);
    } else log.push(`observe: desired ${want} = observed ${pods.length} → nothing to do`);
    draw();
  };
  host.querySelector('#rc-want').addEventListener('input', e => { want = +e.target.value; host.querySelector('#rc-wv').textContent = want; draw(); });

    const b = e.target.closest('button'); if (!b) return; const a = b.dataset.a;
    if (a === 'step') pass();
    if (a === 'kill' && pods.length) { const p = pods[Math.floor(R() * pods.length)]; pods = pods.filter(x => x !== p); log.push(`event: someone deleted ${p.id}`); draw(); }
    if (a === 'node') { up[1] = !up[1]; log.push(`event: node-b ${up[1] ? 'is Ready again' : 'stopped reporting (NotReady)'}`); draw(); }
    if (a === 'auto') {
      auto = !auto; b.classList.toggle('on', auto); b.textContent = auto ? 'Stop' : 'Run continuously';
      clearInterval(timer); if (auto) timer = setInterval(() => { if (!host.isConnected) { clearInterval(timer); return; } pass(); }, 1300);

CH.push({
  id: 'ch01', n: 1, title: 'The Idea of Kubernetes',
  lede: 'Kubernetes is a database of intentions plus a crowd of small programs that keep reality matching those intentions. Everything else in this book, from Deployments to GPU scheduling to the operators you will write, follows from that one idea. This chapter builds it from the ground up and sets up the lab you will use throughout.',
  html: `
<h2>The problem it solves</h2>
<p>Suppose you run 400 containers across 60 machines. Machines fail, disks fill, a release goes out at 14:00 and must be rolled back at 14:07, traffic triples on payday. A shell script that says "start container X on machine 12" is <b>imperative</b>: it describes steps. It cannot cope with the step that half-worked, the machine that died in the middle, or the operator who ran it twice.</p>
<p>Kubernetes takes a different approach. You write down <b>what should be true</b> ("four replicas of this image, each with 500 millicores, reachable on port 8080") and store it. Independent programs called <b>controllers</b> keep watching what is stored and what actually exists, and they act to close the gap. When a machine dies, nobody has to remember the script: the gap reopens and some controller closes it again.</p>

<h2>Control loops</h2>
<p>A thermostat is the classic control loop: it reads the temperature, compares it with the setpoint and switches the heater. It does not care how the room got cold. Kubernetes controllers work the same way and share three properties that you will rely on when you write your own in Part VIII:</p>
<ul>
<li><b>Level-triggered, not edge-triggered.</b> A controller decides from the current state ("three pods exist, four are wanted"), not from the history of events ("a pod was deleted"). If it misses an event, the next look still produces the right answer.</li>
<li><b>Idempotent.</b> Running a pass twice does no harm; the second pass finds nothing to do.</li>
<li><b>Single-purpose and composable.</b> The Deployment controller manages ReplicaSets; the ReplicaSet controller manages Pods; the scheduler assigns Pods to nodes; the kubelet runs them. None of them knows the whole story.</li>
</ul>
${fig('reconcile', '<b>Figure 1.1</b> Interactive: a reconcile loop. Change the desired count, delete pods, fail a node, and watch each pass compare desired with observed state.')}
<p>Try deleting pods while the loop runs: the controller never "notices the deletion"; it simply sees too few pods. Then fail node-b: its pods are lost and are recreated elsewhere. That is self-healing, and it is nothing more than this comparison repeated.</p>

<div class="note key"><b>The central idea</b><p>The API server stores desired state (<code>spec</code>) and observed state (<code>status</code>). Controllers read both and write changes. Nothing in Kubernetes talks to anything else directly when it can instead write to the API and let a controller react.</p></div>

<h2>What Kubernetes is, and is not</h2>
<div class="tbl"><table><tr><th>It is</th><th>It is not</th></tr>
<tr><td>An API and a set of controllers for running containers on a fleet of machines</td><td>A platform-as-a-service: it does not build your code, provide a database or run CI</td></tr>
<tr><td>A scheduler that places work by resources and constraints</td><td>A guarantee of availability: you still design replicas, budgets and zones</td></tr>
<tr><td>Extensible: new types (CRDs) and new controllers are first-class</td><td>Simple: the surface is large, and this book exists for that reason</td></tr>
<tr><td>Portable across clouds and on-premises through standard interfaces (CRI, CNI, CSI)</td><td>A security boundary by default: tenants must be isolated deliberately (Part VI)</td></tr>
</table></div>

<h2>A short history</h2>
${fig('k8shist', '<b>Figure 1.2</b> From Google\'s internal systems to Kubernetes 1.37.')}
<p>Kubernetes ships three minor releases a year. Each is supported with patches for about fourteen months. In November 2026 the supported releases are <b>1.37</b> (August 2026), <b>1.36</b> (April 2026) and <b>1.35</b> (December 2025); 1.38 is scheduled for 16 December 2026. Features move through <b>alpha</b> (off by default, may change), <b>beta</b> (usually on, API may still change) and <b>stable</b> (GA, kept compatible). This book marks the stage of every recent feature it describes.</p>

<h2>Your lab</h2>
<p>You need a cluster you can break. <b>kind</b> (Kubernetes in Docker) runs each node as a container and starts in under a minute; <b>k3d</b> and <b>minikube</b> are alternatives. Install <code>kubectl</code> at the same minor version as the cluster, or one minor version away.</p>
${SH('Create a three-node lab cluster')`
cat > kind.yaml <<'EOF'
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
- role: worker
EOF
kind create cluster --name lab --config kind.yaml   # pin --image kindest/node:v1.37.x for a specific version
kubectl get nodes -o wide
kubectl cluster-info`}
<p>Then do the experiment from Figure 1.1 for real:</p>
${SH('Self-healing, for real')`
kubectl create deployment web --image=nginx:1.29 --replicas=4
kubectl get pods -l app=web -o wide --watch &       # leave this running
kubectl delete pod -l app=web --wait=false          # delete all four
# within seconds four new pods appear with new names
kubectl scale deployment web --replicas=2           # the controller deletes two`}
<p>Notice you never told Kubernetes to "restart" anything. You stated a count, and a controller enforced it.</p>

<h2>The shape of the system</h2>
<p>Everything you will meet fits one of four roles:</p>
<ul>
<li><b>The API server and its store (etcd)</b>: the only component that reads and writes cluster state. Chapters 3 and 4.</li>
<li><b>Controllers</b>: built-in ones in <code>kube-controller-manager</code>, the scheduler, cloud controllers, and any you add. Chapters 6, 9, 24 to 28.</li>
<li><b>Node agents</b>: the kubelet, the container runtime, the network and storage plugins that turn a Pod object into running processes. Chapters 5, 11, 15.</li>
<li><b>Clients</b>: kubectl, CI/CD, GitOps tools, your applications. They write intentions and read results.</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Thinking imperatively.</strong> Running <code>kubectl delete pod</code> to "restart" an app works only because a controller recreates it; if the pod was bare (no controller), it is simply gone.</li>
<li><strong>Fighting the controller.</strong> Editing an object that a controller owns (a ReplicaSet created by a Deployment) is undone on the next pass. Change the owner instead.</li>
<li><strong>Assuming instant consistency.</strong> Controllers converge; between a change and its effect there is always a window. Design clients to wait on status, not on the success of a write.</li>
<li><strong>Running unsupported versions.</strong> Only the three newest minor releases receive patches; in November 2026 anything at 1.34 or older gets no security fixes. Managed services\' extended support is a paid stopgap, not a plan.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Level or edge?</summary><p>A controller keeps a counter of "pods deleted since start" and creates one pod per deletion event. Why is this fragile?</p><p><em>Answer:</em> it is edge-triggered. If it restarts, misses a watch event, or sees a duplicate, the counter is wrong forever. A level-triggered controller recomputes from current state each time and is right after any pass.</p></details>
<details><summary>Bare pod</summary><p>You run <code>kubectl run tmp --image=busybox -- sleep 3600</code> and delete the pod. Does it come back? Why or why not?</p><p><em>Answer:</em> no. <code>kubectl run</code> creates a bare Pod with no controller owning it, so nothing holds the intention that it should exist.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Watch the controllers talk</summary><p>In your kind cluster, run <code>kubectl get events -A --watch</code> in one terminal and scale a Deployment from 2 to 6 in another. Which components emit events, in what order?</p><p><em>Answer:</em> the deployment-controller (ScalingReplicaSet), the replicaset-controller (SuccessfulCreate), the default-scheduler (Scheduled), then the kubelet (Pulling, Pulled, Created, Started).</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Break the loop</summary><p>Stop the controller manager in kind (<code>docker exec lab-control-plane mv /etc/kubernetes/manifests/kube-controller-manager.yaml /tmp/</code>), then delete pods of a Deployment. What happens, and what happens when you move the manifest back?</p><p><em>Answer:</em> nothing recreates the pods while the controller manager is down; the Deployment still says 4. When it returns, it lists current state, sees the gap and creates the missing pods. No events were "replayed": the level was enough.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain desired state, observed state and reconciliation in my own words.</li>
<li>I know why controllers are level-triggered and idempotent.</li>
<li>I have a working multi-node lab cluster and can watch self-healing happen.</li>
<li>I know which Kubernetes releases are supported in November 2026 and what alpha, beta and stable mean.</li>
</ul>
`});

CH.push({
  id: 'ch02', n: 2, title: 'Architecture of a Cluster',
  lede: 'A cluster is a control plane that stores and reconciles intentions, and a set of nodes that turn Pod objects into running processes. This chapter names every component, traces one kubectl apply from keyboard to running container, and shows how the pieces are made highly available.',
  html: `
<h2>The components</h2>
${fig('arch', '<b>Figure 2.1</b> Interactive: the components of a cluster. Select a component to see what it does.')}
<p>The design has one rule worth memorising: <b>every component talks to the API server, and only the API server talks to etcd.</b> Controllers do not call the scheduler, the scheduler does not call kubelets. Each watches the API for the objects it cares about and writes back what it decided. This is why you can replace, restart or add components independently, and why the API server's health is the cluster's health.</p>
<p>The one exception runs the other way: for <code>kubectl logs</code>, <code>exec</code>, <code>attach</code>, <code>port-forward</code> and the node <code>proxy</code> subresource, the API server connects to the kubelet's HTTPS port (10250) on the node (metrics-server also scrapes kubelets directly). Clusters that cannot open that path (private nodes behind NAT) use the Konnectivity proxy.</p>

<h2>One apply, end to end</h2>
${fig('applyflow', '<b>Figure 2.2</b> Step through: what happens after <code>kubectl apply</code> of a three-replica Deployment.')}
<p>Four separate controllers cooperated, and each one did one small thing. Each of them would have done the same thing if it had been restarted in the middle: that is what makes the system robust. It also explains a common surprise: <code>kubectl apply</code> returns success as soon as the object is stored, long before anything runs. Use <code>kubectl rollout status</code> or <code>kubectl wait --for=condition=Available</code> to wait on the outcome.</p>

<h2>The control plane</h2>
<div class="tbl"><table><tr><th>Component</th><th>State</th><th>Scaling and availability</th></tr>
<tr><td>kube-apiserver</td><td>Stateless; caches objects in memory (the watch cache)</td><td>Run 2 or more behind a load balancer; all are active</td></tr>
<tr><td>etcd</td><td>All cluster state</td><td>3 or 5 members (an odd number for a Raft majority); back it up</td></tr>
<tr><td>kube-scheduler</td><td>None beyond its cache</td><td>Several replicas, one active through a Lease (leader election)</td></tr>
<tr><td>kube-controller-manager</td><td>None beyond caches</td><td>Several replicas, one active through a Lease</td></tr>
<tr><td>cloud-controller-manager</td><td>None</td><td>Several replicas, one active through a Lease</td></tr>
</table></div>
${SH('Look at the control plane of your kind cluster')`
kubectl get pods -n kube-system -o wide
kubectl get leases -n kube-system                     # who is leader for scheduler and controller-manager
docker exec lab-control-plane ls /etc/kubernetes/manifests   # static pods: the kubelet runs these from files
kubectl get --raw='/readyz?verbose' | tail -5`}
<p>In kubeadm clusters the control plane runs as <b>static pods</b>: manifests in <code>/etc/kubernetes/manifests</code> that the kubelet runs directly, without the API server. That breaks the chicken-and-egg problem of running the API server on the cluster it serves.</p>

<h2>The node</h2>
<p>The <b>kubelet</b> is the most complex component on a node. It watches Pods assigned to it, prepares volumes and secrets, calls the container runtime through the <b>Container Runtime Interface</b> (gRPC), runs probes, enforces limits through Linux cgroups v2, evicts Pods when the node runs short of memory or disk, and reports status.</p>
<p>Every node renews a <b>Lease</b> object in the <code>kube-node-lease</code> namespace about every ten seconds. If renewals stop for longer than the grace period (under a minute by default), the node lifecycle controller marks the node <code>Ready=Unknown</code> and taints it <code>node.kubernetes.io/unreachable:NoExecute</code>. Pods tolerate that taint for 300 seconds by default and are then evicted, so a dead node's workloads move after about five minutes. You can shorten that per Pod with <code>tolerationSeconds</code>.</p>
${SH('Inspect a node')`
kubectl describe node lab-worker | sed -n '/Conditions/,/Addresses/p'
kubectl get lease -n kube-node-lease
kubectl get node lab-worker -o jsonpath='{.status.nodeInfo}' | jq .   # kubelet, runtime and kernel versions`}

<h2>Making it highly available</h2>
${fig('hatopo', '<b>Figure 2.3</b> Interactive: three ways to run a highly available control plane.')}
<p>Two numbers matter. etcd needs a <b>majority</b> of members to accept writes: three members survive one failure, five survive two, and four are no better than three. And the API servers should be spread across failure domains (zones), each with its own etcd member if stacked.</p>

<h2>Add-ons you will always see</h2>
<ul>
<li><b>CoreDNS</b>: cluster DNS for Services and Pods (Chapter 12). kube-dns is deprecated, and no new packages will be built for it after v1.40.</li>
<li><b>metrics-server</b>: CPU and memory figures for <code>kubectl top</code> and the Horizontal Pod Autoscaler; the <code>metrics.k8s.io</code> API it serves reached v1 (stable) in 1.37.</li>
<li><b>A Gateway API or ingress controller</b>: north–south HTTP traffic (Chapter 13).</li>
<li><b>A CNI plugin and CSI drivers</b>: networking and storage (Chapters 11 and 15).</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Two etcd members, or four.</strong> An even count adds failure risk without adding tolerance.</li>
<li><strong>One API server behind no load balancer.</strong> Every node and controller points at it; losing it stops the cluster from changing (running Pods keep running).</li>
<li><strong>Waiting on apply instead of on status.</strong> CI pipelines that treat a successful apply as a successful deployment ship broken releases.</li>
<li><strong>Forgetting that a dead node takes five minutes to drain by default.</strong> For latency-sensitive workloads, set shorter <code>tolerationSeconds</code> or run enough replicas to absorb it.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Who writes nodeName?</summary><p>Which component sets <code>spec.nodeName</code> on a normal Pod, and how?</p><p><em>Answer:</em> the scheduler, by creating a Binding subresource for the Pod through the API server. The kubelet only reads it.</p></details>
<details><summary>etcd majority</summary><p>A five-member etcd cluster loses two members. Can it accept writes? What about three?</p><p><em>Answer:</em> with two lost, three of five remain: a majority, so yes. With three lost, two of five remain: no majority, so writes stop (reads may be served stale only if allowed).</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Kill the leader</summary><p>In a kind cluster with three control-plane nodes, find the scheduler leader from its Lease and stop that container. How long until another scheduler takes over, and what decides it?</p><p><em>Answer:</em> the Lease's duration (15 seconds by default) and the renew deadline; a standby acquires the Lease once it expires, typically within 15 to 20 seconds.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Partition a node</summary><p>Disconnect a kind worker from the network (<code>docker network disconnect kind lab-worker</code>). Track the node condition, the taints and the Pods over six minutes. Then reconnect it. What happens to the original Pods on that node?</p><p><em>Answer:</em> the node goes Unknown and gets the unreachable taint; after 300 s its Pods are marked for deletion and Deployment Pods are replaced elsewhere (StatefulSet Pods are not, until the node is confirmed gone; Chapter 6). The old Pods keep running on the isolated node until it reconnects, when the kubelet sees they were deleted and kills them. During the partition both copies may run, which matters for anything that assumes one writer.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can name every control-plane and node component and what it writes to the API.</li>
<li>I can trace a kubectl apply through four controllers to a running container.</li>
<li>I know how node heartbeats, taints and default tolerations decide when Pods leave a dead node.</li>
<li>I can choose between stacked, external and managed control planes.</li>
</ul>
`});

const PODS3 = [
  ['web-7d9', { app: 'web', tier: 'frontend', env: 'prod', track: 'stable' }], ['web-k2p', { app: 'web', tier: 'frontend', env: 'prod', track: 'canary' }],

  ['db-0', { app: 'postgres', tier: 'data', env: 'prod' }], ['debug', { owner: 'meera' }]
];
function parseSel(str) {
  const reqs = []; let s = str.trim(); if (!s) return reqs;
  const parts = []; let depth = 0, cur = '';
  for (const c of s) { if (c === '(') depth++; if (c === ')') depth--; if (c === ',' && !depth) { parts.push(cur); cur = ''; } else cur += c; }
  parts.push(cur);
  parts.forEach(p => {
    p = p.trim(); let m;
    if ((m = p.match(/^([\w./-]+)\s+(in|notin)\s*\(([^)]*)\)$/))) reqs.push([m[1], m[2], m[3].split(',').map(x => x.trim()).filter(Boolean)]);
    else if ((m = p.match(/^([\w./-]+)\s*(==|=|!=)\s*([\w.-]*)$/))) reqs.push([m[1], m[2] === '!=' ? '!=' : '=', [m[3]]]);
    else if ((m = p.match(/^!([\w./-]+)$/))) reqs.push([m[1], '!exists', []]);
    else if ((m = p.match(/^([\w./-]+)$/))) reqs.push([m[1], 'exists', []]);
    else throw new Error('cannot parse "' + p + '"');
  });
  return reqs;
}
const matchSel = (reqs, L) => reqs.every(([k, op, v]) => op === '=' ? L[k] === v[0] : op === '!=' ? L[k] !== v[0] : op === 'in' ? v.includes(L[k]) : op === 'notin' ? !v.includes(L[k]) : op === 'exists' ? k in L : !(k in L));

CH.push({
  id: 'ch03', n: 3, title: 'Objects and the API',
  lede: 'Everything in Kubernetes is an object behind a uniform REST API: Pods, Services, roles, even the API\'s own extensions. Learn the anatomy of an object, how it is addressed, how concurrent writers are kept from overwriting each other, and how objects own and finalise each other, and the rest of the system becomes predictable.',
  html: `
<h2>Anatomy of an object</h2>
${Y('A Deployment, with the parts every object shares')`
apiVersion: apps/v1          # group "apps", version "v1"
kind: Deployment             # the type
metadata:                    # ObjectMeta: the same fields on every object
  name: web
  namespace: shop
  uid: 4c1e…                 # set by the server; unique forever
  resourceVersion: "184467"  # changes on every write; used for concurrency and watches
  generation: 7              # increments when spec changes
  labels: {app: web, team: payments}           # identifying, selectable
  annotations: {deploy.example.com/ticket: CHG-42}   # non-identifying metadata
  ownerReferences: []        # who owns me (for garbage collection)
  finalizers: []             # who must clean up before I disappear
spec:                        # desired state: written by you
  replicas: 3
  selector: {matchLabels: {app: web}}
  template: {…}
status:                      # observed state: written by controllers
  observedGeneration: 7      # the spec generation the controller has acted on
  replicas: 3
  readyReplicas: 3
  conditions:
  - {type: Available, status: "True", reason: MinimumReplicasAvailable}`}
<p>The split between <b>spec</b> and <b>status</b> is the API form of the control loop: you write spec, controllers write status. When <code>status.observedGeneration</code> equals <code>metadata.generation</code>, the controller has seen your latest spec; only then do its conditions describe your change. Since 1.35 Pods have the same pair, so you can tell when the kubelet has acted on, say, a resize.</p>

<h2>Addressing: groups, versions, resources</h2>
<p>Every type has a <b>group</b>, a <b>version</b> and a <b>kind</b> (GVK). The REST path uses the <b>resource</b>, the lower-case plural (GVR). The core group (Pods, Services, ConfigMaps, Nodes) lives under <code>/api/v1</code>; everything else under <code>/apis/&lt;group&gt;/&lt;version&gt;</code>. Some resources have <b>subresources</b>, separate endpoints with their own permissions: <code>status</code>, <code>scale</code>, <code>log</code>, <code>exec</code>, <code>eviction</code>, and since 1.33 <code>resize</code> for Pods.</p>
${fig('apipath', '<b>Figure 3.1</b> Interactive: build the HTTP request behind a kubectl command.')}
${SH('Explore the API yourself')`
kubectl api-resources -o wide | head -20        # every resource, its group, verbs and short names
kubectl api-versions | grep -E 'apps|resource|gateway'
kubectl explain deployment.spec.strategy.rollingUpdate --recursive
kubectl get --raw /apis/apps/v1/namespaces/default/deployments | jq '.items[].metadata.name'
kubectl get deploy web -v=8 2>&1 | grep -E 'GET|Response Status'   # see the real requests`}

<h2>Labels, selectors and annotations</h2>
<p><b>Labels</b> are short key–value pairs used to <em>select</em> objects: a Service finds its Pods, a Deployment finds its ReplicaSets, a NetworkPolicy finds what it protects, all by selector. <b>Annotations</b> hold anything else (tool configuration, build metadata, ticket numbers) and are never selected on. Keep label values short and stable; use the <code>app.kubernetes.io/name</code>, <code>/instance</code>, <code>/version</code>, <code>/component</code>, <code>/part-of</code> and <code>/managed-by</code> conventions so tools can understand your objects.</p>
${fig('selector', '<b>Figure 3.2</b> Interactive: label selectors. Equality (<code>=</code>, <code>!=</code>), set-based (<code>in</code>, <code>notin</code>) and existence (<code>key</code>, <code>!key</code>) requirements, combined with AND.')}
<p>Selectors have no OR across keys: to select "frontend or anything in staging" you need two queries, or a shared label. That limitation is deliberate; it keeps selection cheap enough to run on every watch event.</p>

<h2>Namespaces</h2>
<p>Namespaces scope names and are the unit for quotas, RBAC role bindings, Pod Security levels, network policy defaults and most multi-tenancy (Chapter 18). They are not network boundaries by themselves: Pods in different namespaces can reach each other unless a NetworkPolicy says otherwise. Cluster-scoped resources (Nodes, PersistentVolumes, ClusterRoles, CRDs, StorageClasses) belong to no namespace.</p>

<h2>Concurrency: resourceVersion</h2>
<p>Two controllers read a Deployment, both change it and both write it back. Without care, the second write silently erases the first. Kubernetes uses <b>optimistic concurrency</b>: an update must carry the <code>resourceVersion</code> it read. If the object has changed since, the server rejects the write with <b>409 Conflict</b>, and the client re-reads and retries. Controllers you write will meet this constantly (Chapter 25), and client-go provides <code>retry.RetryOnConflict</code> for it.</p>
<p>Since 1.35, resource versions of built-in types are guaranteed to be comparable decimal numbers, so a client can tell which of two versions is newer. Treat them as opaque everywhere else: never do arithmetic on them.</p>

<h2>Server-side apply and field ownership</h2>
<p>Declarative tools need a merge: "make the fields I care about look like this, leave others alone". <b>Server-side apply</b> (SSA, stable since 1.22) does the merge on the server and records, in <code>metadata.managedFields</code>, which <b>field manager</b> last set each field. If you apply a value for a field that another manager owns, you get a conflict instead of a silent overwrite; you can then <code>--force-conflicts</code> to take ownership, or stop specifying that field.</p>
${Y('Field ownership: the HPA owns replicas, so leave it out of your manifest')`
# kubectl apply --server-side -f web.yaml   (manager "kubectl")
# HorizontalPodAutoscaler scales the Deployment (manager "kube-controller-manager")
metadata:
  managedFields:
  - manager: kubectl
    operation: Apply
    fieldsV1: {f:spec: {f:template: {…}, f:selector: {…}}}
  - manager: kube-controller-manager
    operation: Update
    subresource: scale
    fieldsV1: {f:spec: {f:replicas: {}}}
# If web.yaml also says "replicas: 3", the next apply fights the autoscaler.
# Remove replicas from the manifest and let the HPA own it.`}
<p>Operators should use SSA for the objects they manage (Chapter 26): it makes them declare exactly the fields they own and coexist with other controllers and humans.</p>

<h2>Ownership and garbage collection</h2>
<p>An object can list owners in <code>metadata.ownerReferences</code>. When the owner is deleted, the <b>garbage collector</b> deletes the dependents. Owners must be in the same namespace as their dependents (or be cluster-scoped). This is how deleting a Deployment removes its ReplicaSets and Pods, and how your operator's child objects will be cleaned up for free.</p>
${fig('gc', '<b>Figure 3.3</b> Step through: the three deletion propagation policies.')}

<h2>Finalizers</h2>
<p>A <b>finalizer</b> is a string in <code>metadata.finalizers</code> that blocks deletion. Deleting an object with finalizers only sets <code>metadata.deletionTimestamp</code>; the object stays until every finalizer has been removed by whoever added it. Controllers use this to clean up things the garbage collector cannot see: a cloud load balancer, a database user, a DNS record. Built-in examples: <code>kubernetes.io/pvc-protection</code> keeps a PVC in use from vanishing; <code>foregroundDeletion</code> implements foreground cascading.</p>
<div class="note key"><b>The deletion contract</b><p>Once <code>deletionTimestamp</code> is set it can never be cleared; the object will go away. A controller that sees it must clean up and remove its finalizer, and must not add new finalizers. A controller that has crashed or been uninstalled leaves objects stuck in Terminating forever, which is the most common finalizer problem in practice.</p></div>

<h2>Versions, deprecation and output formats</h2>
<p>An API group can serve several versions at once (<code>v1beta1</code>, <code>v1</code>); the server converts between them and stores one. Kubernetes promises that a GA version is not removed within the same major version, and beta APIs are deprecated before removal with a published schedule. KYAML, a stricter, unambiguous YAML subset (quoted strings, explicit braces, no "Norway problem"), became stable as a kubectl output format in 1.37: <code>kubectl get deploy web -o kyaml</code>.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Specifying fields another controller owns</strong> (replicas under an HPA, annotations added by a mesh). Your GitOps tool and the controller fight forever.</li>
<li><strong>Read-modify-write without retry on conflict.</strong> Works in testing, fails under load.</li>
<li><strong>Removing a finalizer by hand to "unstick" an object</strong> without doing the cleanup it stood for: you leak the external resource.</li>
<li><strong>Selecting on mutable labels.</strong> A Deployment's selector is immutable; choose its labels carefully up front.</li>
<li><strong>Assuming namespaces isolate network traffic.</strong> They do not without NetworkPolicy.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Spec or status?</summary><p>Which of these do you set, and which does a controller set: a Deployment's <code>replicas</code>, a Pod's <code>podIP</code>, a Service's <code>clusterIP</code>, a Node's <code>allocatable</code>?</p><p><em>Answer:</em> you set replicas (spec). podIP and allocatable are status, set by the kubelet. clusterIP is in spec but allocated by the API server if you leave it empty.</p></details>
<details><summary>Stuck in Terminating</summary><p>A namespace has been Terminating for an hour. Where do you look?</p><p><em>Answer:</em> <code>kubectl get ns X -o yaml</code> for status conditions, then list remaining objects in it (<code>kubectl api-resources --namespaced -o name | xargs -n1 kubectl get -n X</code>) and check their finalizers; often an operator that would remove them is gone, or an aggregated API is unavailable.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Provoke a conflict</summary><p>Get a ConfigMap as YAML twice into two files, edit both, <code>kubectl replace</code> the first then the second. What happens, and how would SSA have behaved?</p><p><em>Answer:</em> the second replace fails with a conflict because its resourceVersion is stale. With SSA and two managers setting different keys, both apply cleanly; setting the same key yields a field conflict naming the other manager.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Write a finalizer by hand</summary><p>Create a ConfigMap with finalizer <code>example.com/cleanup</code>, delete it, observe it, then remove the finalizer with a JSON patch. What fields changed at each step?</p><p><em>Answer:</em> delete sets deletionTimestamp (and deletionGracePeriodSeconds); the object remains readable; patching finalizers to empty lets the API server remove it immediately.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can read any object as metadata, spec and status, and use generation and observedGeneration.</li>
<li>I can map a kubectl command to its REST request, including subresources.</li>
<li>I can write equality and set-based label selectors.</li>
<li>I understand optimistic concurrency, server-side apply and field managers.</li>
<li>I can explain owner references, the three deletion policies and finalizers.</li>
</ul>
`});

FIG.reqpipe = host => {
  const S = [['TLS', 'connection'], ['authn', 'who are you?'], ['APF', 'queue fairly'], ['authz', 'may you?'], ['mutate', 'admission'], ['schema', 'validate'], ['validate', 'admission'], ['store', 'convert, encrypt'], ['etcd', 'Raft commit']];
  const N = ['A request arrives: <code>kubectl apply</code> creating a Pod in namespace shop. Every write passes the same stages, in this order.', '<b>TLS.</b> The connection is terminated by the API server itself. The client certificate, if any, is captured for the next step.', '<b>Authentication.</b> Authenticators run until one succeeds: client certificate, bearer token (service account JWT, or OIDC via structured authentication configuration), or the webhook authenticator. The result is a user name, UID and groups. If none succeed and anonymous access is not allowed for this path, 401.', '<b>API Priority and Fairness.</b> The request is classified by a FlowSchema into a priority level and a flow (for example, per user or per namespace) and waits in a fair queue for a concurrency "seat". If queues are full: 429 Too Many Requests. This keeps one noisy client from starving the controllers.', '<b>Authorization.</b> Node authorizer, RBAC, and optionally a webhook decide whether this user may "create pods in namespace shop". Denied: 403.', '<b>Mutating admission.</b> Built-in plugins (ServiceAccount, DefaultStorageClass, LimitRanger…), MutatingAdmissionPolicies written in CEL (stable since 1.36), then mutating webhooks may change the object, for example injecting a sidecar.', '<b>Schema validation.</b> The object (already defaulted, then mutated) is checked against its type: required fields, formats, immutable fields, declarative and CEL validation rules. Defaults were applied earlier, when the request body was decoded, so mutating admission already saw them.', '<b>Validating admission.</b> Built-in plugins (Pod Security Admission, ResourceQuota), ValidatingAdmissionPolicies (CEL) and validating webhooks may reject, but no longer change, the object.', '<b>Storage.</b> The object is converted to its storage version, serialised (protobuf for built-in types), and encrypted if encryption at rest is configured for this resource.', '<b>etcd.</b> A transaction writes the key <code>/registry/pods/shop/web-…</code> if its revision is what was expected. Once a majority of etcd members commit it, the API server returns 201 Created and the watch cache emits an event to every watcher.'];
  stepper(host, N.map((note, k) => ({ k, note })), f => {
    let s = '';
    S.forEach(([t, sub], i) => { const x = 6 + (i % 5) * 128, y = i < 5 ? 10 : 94; s += box(x, y, 116, 52, t, i + 1 === f.k ? 'hot' : i + 1 < f.k ? 'ok' : 'dim', sub); if (i % 5) s += arrow(x - 10, y + 26, x - 2, y + 26, i + 1 <= f.k ? 'ok' : ''); });
    s += `<path d="M570 62 V78 H64 V92" class="ed ${f.k >= 6 ? 'ok' : ''}" fill="none" marker-end="url(#${f.k >= 6 ? 'ar-ok' : 'ar'})"/>`;
    const rej = { 2: '401', 3: '429', 4: '403', 6: '400/422', 7: '403/422' }[f.k];
    if (rej) s += tx(600, 128, 'can fail: ' + rej, 'tp hot', 'end');
    return { s, w: 650, h: 156 };
  }, { speed: 1800 });
};

FIG.raft = host => {
  const N = [
    ['A three-member etcd cluster. Member 1 is the leader for term 7; the others follow. All have the same log up to index 41.', [41, 41, 41], [41, 41, 41], 1, ''],
    ['The API server sends a write (a new Pod) to the leader. The leader appends entry 42 to its own log.', [42, 41, 41], [41, 41, 41], 1, ''],
    ['The leader sends AppendEntries to both followers. Each appends entry 42 and acknowledges.', [42, 42, 42], [41, 41, 41], 1, 'ack'],
    ['The leader has two of three copies (a majority) as soon as one follower acknowledges, so it marks 42 committed, applies it to its key-value store and answers the API server.', [42, 42, 42], [42, 41, 41], 1, ''],
    ['Followers learn the new commit index on the next message and apply it. Every member now holds revision 42.', [42, 42, 42], [42, 42, 42], 1, ''],
    ['Member 1 fails. Followers stop receiving heartbeats and, after a randomised election timeout, member 2 starts an election for term 8.', [42, 42, 42], [42, 42, 42], 0, 'down'],
    ['Member 3 votes for member 2, whose log is at least as complete as its own. With two of three votes, member 2 leads term 8 and writes continue. With one member left, no majority: writes would stop.', [42, 42, 42], [42, 42, 42], 2, 'down']
  ];
  stepper(host, N.map(([note, log, com, lead, ev]) => ({ note, log, com, lead, ev })), f => {

    [0, 1, 2].forEach(i => {

      for (let e = 38; e <= f.log[i]; e++) { const c = e <= f.com[i] ? 'ok' : 'warn'; s += rect(x + 12 + (e - 38) * 36, 44, 32, 30, 'cell ' + c, 4) + tx(x + 28 + (e - 38) * 36, 59, e, 'tv sm ' + c); }
      s += tx(x + 12, 96, `log index ${f.log[i]}`, 'ti', 'start') + tx(x + 12, 112, `committed ${f.com[i]}`, 'ti', 'start');
    });
    if (f.ev === 'ack') s += arrow(206, 60, 226, 60, 'ok') + arrow(420, 60, 440, 60, 'ok');
    return { s, w: 650, h: 150 };
  }, { speed: 1900, legend: '<span class="l-warn">appended, not committed</span><span class="l-ok">committed</span>' });

FIG.apf = host => {
  const LV = [['system, node-high, leader-election', 'kubelets, leader election, kube-system components', 30, 60], ['workload-high', 'built-in controllers', 40, 120], ['workload-low', 'service accounts: your operators, CI', 100, 120], ['global-default', 'everything else: humans, scripts', 20, 40]];
  host.innerHTML = `<div class="tool"><p class="meta" style="margin:0 0 8px">A simplified API Priority and Fairness model. Each priority level gets a share of the server's concurrency; demand above its share waits in queues, and beyond the queues is rejected with 429. Set demand in concurrent requests.</p>${LV.map(([k, d, sh, dem], i) => `<div class="row" style="align-items:end"><div style="flex:3 1 220px"><label for="apf-${i}">${k} <span class="meta">(${d}; ${sh} shares)</span></label></div><div style="flex:1 1 90px"><input class="txt" type="number" min="0" id="apf-${i}" value="${dem}"></div></div>`).join('')}<div class="row"><div><label for="apf-cap">server concurrency limit (max-requests-inflight + max-mutating)</label><input class="txt" type="number" id="apf-cap" value="200"></div></div><div id="apf-fig"></div><div class="out" id="apf-out"></div></div>`;
  const draw = () => {
    const cap = Math.max(1, +host.querySelector('#apf-cap').value || 1), tot = LV.reduce((a, l) => a + l[2], 0);
    let s = '', out = [];
    const dems = LV.map((l, i) => Math.max(0, +host.querySelector('#apf-' + i).value || 0)), K = 500 / Math.max(1, ...dems.map((d, i) => Math.max(d, Math.round(cap * LV[i][2] / tot))));
    LV.forEach(([k, , sh], i) => {
      const dem = dems[i], seats = Math.round(cap * sh / tot), run = Math.min(dem, seats), q = Math.min(dem - run, Math.round(seats * 0.5)), rej = Math.max(0, dem - run - q);
      const y = 8 + i * 34, X = v => 130 + v * K;
      s += tx(122, y + 12, k, 'tm', 'end') + rect(130, y, seats * K, 24, 'cell', 3) + rect(130, y + 3, run * K, 18, 'bar ok', 3);
      if (q) s += rect(X(run), y + 3, q * K, 18, 'bar warn', 3);
      if (rej) s += rect(X(run + q), y + 3, rej * K, 18, 'bar hot', 3);
      out.push(`${k}: ${seats} seats · running ${run} · queued ${q} · <span class="${rej ? 'd' : 'g'}">rejected ${rej}</span>`);
    });
    host.querySelector('#apf-fig').innerHTML = `<div class="stage">${svgw(650, 146, s, 'Seats per priority level')}</div>`;
    host.querySelector('#apf-out').innerHTML = out.join('<br>') + '<br><span class="meta">Real APF also lets levels borrow unused seats from each other, shuffle-shards flows across queues so one flow cannot fill them all, and counts LIST and WATCH requests as several seats in proportion to their expected cost.</span>';
  };
  host.querySelectorAll('input').forEach(e => e.addEventListener('input', draw)); draw();
};

CH.push({
  id: 'ch04', n: 4, title: 'Inside the API Server and etcd',
  lede: 'The API server is where security, consistency and scale are decided. This chapter follows a write through every stage of its pipeline, explains how watches deliver change to thousands of controllers, shows how etcd agrees on each write with Raft, and covers the mechanisms that keep one noisy client from taking the cluster down.',
  html: `
<h2>The request pipeline</h2>
${fig('reqpipe', '<b>Figure 4.1</b> Step through: the stages of a write request, and where each can fail.')}
<p>Reads skip admission and, normally, etcd: they are served from the API server's in-memory <b>watch cache</b>. Since 1.34, consistent reads from that cache are stable: the server checks with etcd which revision is current, waits until its cache has caught up, and answers from memory. This keeps large LIST calls from hammering etcd.</p>

<h2>List and watch</h2>
<p>Controllers do not poll. They <b>LIST</b> a resource once, note the <code>resourceVersion</code> of the list, and open a <b>WATCH</b> from that version. The server streams ADDED, MODIFIED and DELETED events, plus periodic BOOKMARK events that carry the latest version so a reconnect can resume without missing anything. If a client asks for a version that has been compacted away, it gets <b>410 Gone</b> and must list again. client-go's informers (Chapter 24) do all of this for you.</p>
${SH('Watch the raw stream')`
kubectl get --raw '/api/v1/namespaces/default/pods?watch=true&allowWatchBookmarks=true' &
kubectl run tmp --image=busybox:1.37 --restart=Never -- sleep 30
# {"type":"ADDED","object":{"kind":"Pod",…}}
# {"type":"MODIFIED",…}   (scheduled, then running, then succeeded)`}
<p>Several improvements have made this cheaper at scale. <b>Streaming list encoding</b> (stable in 1.34) writes large LIST responses item by item instead of building them in memory. <b>WatchList</b> (beta since 1.34, used by kube-controller-manager by default) lets an informer receive its initial state as a stream of watch events from the cache instead of one huge LIST. In 1.37, <b>RangeStream</b> (beta, <code>EtcdRangeStream</code>, on by default) lets the API server read large ranges from etcd 3.7 as a stream, cutting memory use on big list reads; with older etcd it falls back to an ordinary range read.</p>

<h2>etcd</h2>
<p>etcd stores each object under a key such as <code>/registry/deployments/shop/web</code>. It is a multi-version store: every write creates a new <b>revision</b> for the whole database, and the object's <code>resourceVersion</code> is the revision at which it last changed. Old revisions are kept so watches can resume, until the API server <b>compacts</b> them (every five minutes by default). Compaction leaves free space inside the database file; <b>defragmentation</b> returns it to the disk.</p>
${fig('raft', '<b>Figure 4.2</b> Step through: a write committed by Raft, then a leader failure.')}
<div class="tbl"><table><tr><th>Concern</th><th>Guidance</th></tr>
<tr><td>Disk</td><td>Fast SSD with low fsync latency; etcd writes synchronously. Watch <code>etcd_disk_wal_fsync_duration_seconds</code> (aim for p99 under 10 ms).</td></tr>
<tr><td>Size</td><td>Default backend quota 2 GiB; can be raised (8 GiB is a common ceiling). Hitting the quota raises an alarm and makes etcd read-only.</td></tr>
<tr><td>Members</td><td>3 or 5, across zones, with low latency between them.</td></tr>
<tr><td>Backup</td><td><code>etcdctl snapshot save</code> on a schedule, stored off the cluster and encrypted; practise restoring (Chapter 19).</td></tr>
<tr><td>Versions</td><td>etcd 3.6 (2025) and 3.7 (July 2026) are current; 3.7 is needed for RangeStream.</td></tr>
</table></div>

<h2>Keeping the server healthy: API Priority and Fairness</h2>
<p>A buggy controller that LISTs all Pods in a loop, or a CI job with a thousand parallel kubectl calls, can saturate an API server. <b>API Priority and Fairness</b> (APF) classifies every request with <code>FlowSchema</code> objects into <code>PriorityLevelConfiguration</code>s, each with a share of the server's concurrency. Within a level, requests are grouped into flows (often per user) and served with fair queuing, so one flow cannot crowd out others.</p>
${fig('apf', '<b>Figure 4.3</b> Interactive: how priority levels divide concurrency, queue excess demand and reject the rest.')}
${SH('See APF in action')`
kubectl get flowschemas
kubectl get prioritylevelconfigurations
kubectl get --raw /debug/api_priority_and_fairness/dump_priority_levels
# metrics: apiserver_flowcontrol_rejected_requests_total, apiserver_flowcontrol_current_inqueue_requests`}
<p>When you write an operator, give it its own service account. If it misbehaves, its requests are throttled in their own flow instead of slowing down kubectl for everyone, and you can see exactly which client is responsible.</p>

<h2>Other things the API server does</h2>
<ul>
<li><b>Encryption at rest.</b> An <code>EncryptionConfiguration</code> encrypts selected resources (at least Secrets) before they reach etcd, ideally with the KMS v2 provider backed by a cloud KMS or HSM (Chapter 18).</li>
<li><b>Auditing.</b> An audit policy records who did what, at levels from Metadata to RequestResponse, to log files or a webhook. Essential for security investigations.</li>
<li><b>The aggregation layer.</b> The API server can proxy a whole API group to another server, registered with an <code>APIService</code>. metrics-server works this way (Chapter 29).</li>
<li><b>Storage version migration.</b> When a resource's storage version changes, objects in etcd must be rewritten. The built-in StorageVersionMigration API (<code>storagemigration.k8s.io/v1</code>) became stable and enabled by default in 1.37.</li>
<li><b>Mixed-version proxy.</b> During an upgrade, API servers at different versions forward requests for resources they do not serve to a peer that does (beta in 1.36).</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Clients that LIST instead of watching</strong>, or that LIST without a label or field selector and with no limit. Use informers.</li>
<li><strong>etcd on network-attached disks with slow fsync.</strong> Leader elections and timeouts follow.</li>
<li><strong>Never defragmenting.</strong> The file grows until it hits the quota and the cluster becomes read-only.</li>
<li><strong>Slow or unavailable admission webhooks</strong> with <code>failurePolicy: Fail</code>: every matching write stalls or fails (Chapter 17).</li>
<li><strong>Sharing one service account across many automation tools.</strong> APF and audit logs cannot tell them apart.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Which status code?</summary><p>Give the stage and status code for: an expired token; a user without permission; a Pod rejected by Pod Security Admission; a stale resourceVersion on update; a watch from a compacted version.</p><p><em>Answer:</em> authentication 401; authorization 403; validating admission 403 (Forbidden with the policy message); storage 409 Conflict; watch 410 Gone.</p></details>
<details><summary>Five members</summary><p>Why do large clusters rarely use seven etcd members?</p><p><em>Answer:</em> every write must reach a majority; more members means more replication traffic and slower commits, while five already tolerates two failures.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Snapshot and inspect</summary><p>In kind, exec into the etcd pod, take a snapshot with etcdctl (certificates are under /etc/kubernetes/pki/etcd), and run <code>etcdctl get /registry/deployments --prefix --keys-only</code>. What do you notice about Secrets if encryption at rest is not configured?</p><p><em>Answer:</em> keys mirror the API paths; Secret values are stored as plain protobuf, readable by anyone with etcd access, which is why encryption at rest matters.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Starve the API</summary><p>Write a script that runs 200 parallel <code>kubectl get pods -A</code> loops as one service account. Watch APF metrics and try kubectl as your admin user at the same time. Then create a FlowSchema that puts that service account in a low priority level with few seats. What changes?</p><p><em>Answer:</em> by default the service account's requests are already classified by the <code>service-accounts</code> FlowSchema into <code>workload-low</code>, and your kind admin (group <code>kubeadm:cluster-admins</code>) into <code>global-default</code>, so the loops queue and receive 429s in their own level (each cluster-wide LIST costs several seats) while your requests stay mostly fast; any slowdown you see comes from API server CPU and memory. A dedicated FlowSchema plus a PriorityLevelConfiguration with few nominal seats and <code>lendablePercent: 0</code> caps that one client tightly, visible in <code>apiserver_flowcontrol_rejected_requests_total</code> for that priority level.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can list the stages of a write and which status code each can return.</li>
<li>I understand list-then-watch, bookmarks and 410 Gone.</li>
<li>I can explain how etcd commits a write with Raft and why compaction and defragmentation matter.</li>
<li>I know how API Priority and Fairness protects the API server and how to give a client its own flow.</li>
</ul>
