CH.push({
  id: 'ch09', n: 9, title: 'The Scheduler',
  lede: 'The scheduler answers one question, over and over: which node should this Pod run on? It answers it by filtering and scoring, through a framework of plugins you can configure and extend. Knowing how it decides lets you express placement needs precisely: spreading across zones, keeping replicas apart, reserving special hardware, and deciding which work wins when capacity is short.',
  html: `
<h2>Filter, score, bind</h2>
${fig('schedsim', '<b>Figure 9.1</b> Interactive: a scheduling decision. Change the Pod\'s requests, affinity and tolerations and see which filter removes each node and how the rest score. Scores are simplified: the real scheduler normalises each plugin to 0–100 and multiplies by plugin weights (NodeAffinity, PodTopologySpread and InterPodAffinity ×2; NodeResourcesFit ×1).')}
<p>Two consequences of this design are worth absorbing. First, the scheduler decides with <b>requests</b>, not usage: a node at 5% real CPU but fully requested accepts nothing. Second, it decides <b>once</b>: a Pod is never moved by the scheduler after binding, even if a better node appears. Rebalancing is the job of the descheduler or of node autoscalers' consolidation, which evict Pods so they are scheduled again.</p>

<h2>The scheduling framework</h2>
${fig('schedfw', '<b>Figure 9.2</b> Step through: the extension points of the scheduling framework.')}
<p>Recent releases have made the scheduler faster and smarter about retries: plugin-specific queueing hints (stable in 1.34) requeue a Pod only on cluster events that could make it schedulable; API calls are made asynchronously (beta in 1.34); and opportunistic batching (beta in 1.35) reuses filtering and scoring results for consecutive Pods with identical requirements, such as replicas of the same Deployment.</p>

<h2>Expressing placement</h2>
${Y('Node affinity, pod anti-affinity, spreading and a toleration')`
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:                      # terms are ORed; expressions inside a term are ANDed
        - matchExpressions:
          - {key: kubernetes.io/arch, operator: In, values: [amd64, arm64]}
          - {key: node.example.com/pci, operator: Exists}
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        preference: {matchExpressions: [{key: topology.kubernetes.io/zone, operator: In, values: [ap-south-1a]}]}
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector: {matchLabels: {app: web}}
          topologyKey: kubernetes.io/hostname   # "not on the same node as another web Pod"
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector: {matchLabels: {app: web}}
    matchLabelKeys: [pod-template-hash]         # spread each rollout revision on its own
  tolerations:
  - {key: node.example.com/pci, operator: Exists, effect: NoSchedule}`}
<div class="tbl"><table><tr><th>Mechanism</th><th>Who expresses it</th><th>Use for</th></tr>
<tr><td><code>nodeSelector</code> / node affinity</td><td>The Pod: "I need nodes like this"</td><td>Architecture, hardware, zones, compliance pools</td></tr>
<tr><td>Taints and tolerations</td><td>The node: "keep off unless you tolerate me"</td><td>Dedicated or special nodes (GPU, PCI, control plane), node problems</td></tr>
<tr><td>Pod affinity / anti-affinity</td><td>The Pod, relative to other Pods</td><td>Co-locate chatty services; keep replicas apart</td></tr>
<tr><td>Topology spread constraints</td><td>The Pod, relative to its peers</td><td>Even spreading across zones and nodes</td></tr>
</table></div>
<p>Taints have three effects: <code>NoSchedule</code> (new Pods without a toleration are not placed), <code>PreferNoSchedule</code> (avoid if possible) and <code>NoExecute</code> (running Pods without a toleration are evicted, after <code>tolerationSeconds</code> if set). To dedicate nodes to a team you need both: a taint so others stay off, and node affinity so the team's Pods go there. Numeric comparison operators for tolerations (alpha in 1.35) let a node advertise, say, a reliability level that Pods can require a minimum of.</p>

<h2>Spreading</h2>
${fig('spread', '<b>Figure 9.3</b> Interactive: topology spread with maxSkew. Fill zone c and see DoNotSchedule block placement.')}
<p>Required pod anti-affinity across zones and hard spread constraints are powerful but can strand Pods when a zone is short of capacity. Prefer <code>ScheduleAnyway</code> or preferred anti-affinity unless losing the spread is worse than not running.</p>

<h2>Priority and preemption</h2>
${Y('Priority classes')`
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: payments-critical}
value: 100000
description: "Customer-facing payment paths"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: batch-low}
value: 100
preemptionPolicy: Never      # waits for space; never evicts others
description: "Reports and backfills"`}
<p>When a Pod cannot be placed, the scheduler's PostFilter looks for a node where evicting <b>lower-priority</b> Pods would make it fit, preferring the option that disrupts least. It respects PodDisruptionBudgets on a best-effort basis (it may still violate them if nothing else works). The preemptor gets <code>status.nominatedNodeName</code> while victims shut down gracefully. Two built-in classes, <code>system-cluster-critical</code> and <code>system-node-critical</code>, are reserved for cluster components.</p>

<h2>Configuring and replacing the scheduler</h2>
${Y('KubeSchedulerConfiguration with two profiles')`
apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
profiles:
- schedulerName: default-scheduler
  pluginConfig:
  - name: NodeResourcesFit
    args:
      scoringStrategy:
        type: MostAllocated          # bin-pack instead of spreading (fewer, fuller nodes)
        resources: [{name: cpu, weight: 1}, {name: memory, weight: 1}]
- schedulerName: batch-scheduler     # Pods choose it with spec.schedulerName
  plugins:
    score:
      disabled: [{name: PodTopologySpread}]`}
<p>Most needs are met by configuration. When they are not, you can write a plugin and compile your own scheduler binary (Chapter 29), or run a second scheduler for some Pods. Batch and AI systems add queueing on top of the scheduler rather than replacing it (Chapter 10).</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Hard anti-affinity with more replicas than nodes</strong>: the extra replicas never schedule.</li>
<li><strong>A taint without matching affinity</strong>: dedicated nodes stay empty while tolerating Pods land elsewhere.</li>
<li><strong>Everyone at high priority</strong>: priority then means nothing, and preemption cascades.</li>
<li><strong>Expecting the scheduler to rebalance</strong> after nodes are added.</li>
<li><strong>Using node names in manifests</strong> (<code>nodeName</code>) instead of labels: it bypasses the scheduler entirely.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Read FailedScheduling</summary><p>"0/12 nodes are available: 3 Insufficient memory, 4 node(s) had untolerated taint {dedicated: gpu}, 5 node(s) didn't match pod anti-affinity rules." What are your options?</p><p><em>Answer:</em> lower the memory request or add bigger nodes; relax the anti-affinity (preferred instead of required) or reduce replicas; do not tolerate the GPU taint unless the Pod needs GPUs.</p></details>
<details><summary>Dedicated nodes</summary><p>Write the node taint and the Pod fields that keep a PCI workload on PCI nodes and everything else off them.</p><p><em>Answer:</em> taint the nodes <code>pci=true:NoSchedule</code> and label them <code>pci=true</code>; give PCI Pods a toleration for the taint and required node affinity for the label.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Watch preemption</summary><p>Fill a kind cluster with low-priority Pods, then create a high-priority Pod that does not fit. Observe events, nominatedNodeName and the victims' DisruptionTarget condition.</p><p><em>Answer:</em> the scheduler emits Preempted events on victims, sets nominatedNodeName on the preemptor, and binds it once the victims have terminated.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Bin-packing versus spreading</summary><p>Run the same workload under LeastAllocated and MostAllocated scoring with a node autoscaler. Compare node count, cost, and what happens when one node fails.</p><p><em>Answer:</em> MostAllocated packs Pods onto fewer nodes so the autoscaler can remove idle ones; a single node failure then affects more Pods at once, so pair it with spread constraints for replicas of the same service.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain filter, score, reserve, permit and bind, and read FailedScheduling events.</li>
<li>I can choose between node affinity, taints, pod affinity and spread constraints.</li>
<li>I can design priority classes and predict preemption.</li>
<li>I know how to configure scheduler profiles and when a custom plugin is justified.</li>
</ul>
`});

FIG.kueue = host => {
  const Q = { A: { quota: 8, borrow: 8, used: 0, run: [], wait: [] }, B: { quota: 8, borrow: 8, used: 0, run: [], wait: [] } };
  let seq = 0, log = [];
  host.innerHTML = `<div class="tool"><p class="meta" style="margin:0 0 8px">Two teams' ClusterQueues share a cohort of 16 GPUs. Each has a nominal quota of 8 and may borrow unused quota from the other. Jobs are admitted whole or wait.</p><div class="btns"><button type="button" class="act" data-q="A" data-n="4">Team A: job, 4 GPUs</button><button type="button" class="act" data-q="A" data-n="8">Team A: job, 8 GPUs</button><button type="button" class="act" data-q="B" data-n="4">Team B: job, 4 GPUs</button><button type="button" class="act" data-q="B" data-n="2">Team B: job, 2 GPUs</button><button type="button" class="act" data-a="finish">Oldest running job finishes</button><button type="button" class="act" data-a="reset">Reset</button></div><div id="kq-fig"></div><div class="out" id="kq-out"></div></div>`;
  const free = () => 16 - Q.A.used - Q.B.used;
  const admit = () => {
    let changed = true, guard = 0;
    while (changed && guard++ < 50) {
      changed = false;
      for (const k of ['A', 'B']) {
        const q = Q[k], o = Q[k === 'A' ? 'B' : 'A']; if (!q.wait.length) continue; const j = q.wait[0];
        const otherNeeds = o.wait.length && o.used + o.wait[0].n <= o.quota;
        if (j.n <= free() && q.used + j.n <= q.quota + q.borrow && (q.used + j.n <= q.quota || !otherNeeds)) { q.wait.shift(); q.run.push(j); q.used += j.n; j.borrowed = Math.max(0, q.used - q.quota); log.push(`admit ${j.id} (${j.n} GPUs) in team ${k}${q.used > q.quota ? ', borrowing ' + (q.used - q.quota) : ''}`); changed = true; }
        else if (q.used + j.n <= q.quota && o.used > o.quota) {
          // reclaim: preempt the other team's newest borrowing jobs
          const victims = []; let need = j.n - free();
          for (const v of o.run.slice().reverse()) { if (need <= 0 || o.used - victims.reduce((a, x) => a + x.n, 0) <= o.quota) break; victims.push(v); need -= v.n; }
          if (need <= 0) { victims.forEach(v => { o.run = o.run.filter(x => x !== v); o.used -= v.n; o.wait.unshift(v); log.push(`preempt ${v.id} of team ${k === 'A' ? 'B' : 'A'}: it was borrowing team ${k}'s quota (requeued)`); }); changed = true; }
        }
      }
    }
  };
  const draw = () => {
    let s = '', x = 10;
    ['A', 'B'].forEach(k => Q[k].run.forEach(j => { s += rect(x, 20, j.n * 38 - 2, 36, 'nd ' + (k === 'A' ? 'acc' : 'cmp') + (j.borrowed ? ' dash' : ''), 6) + tx(x + j.n * 19 - 1, 38, j.id, 'ti'); x += j.n * 38; }));
    for (let i = 0; i <= 16; i++) s += `<line x1="${10 + i * 38}" y1="62" x2="${10 + i * 38}" y2="66" class="axis"/>`;
    s += tx(10, 78, '0', 'ti') + tx(314, 78, '8', 'ti') + tx(618, 78, '16 GPUs', 'ti', 'end') + tx(10, 10, 'running', 'tm', 'start');
    host.querySelector('#kq-fig').innerHTML = `<div class="stage">${svgw(640, 86, s, 'GPU allocation')}</div>`;
    host.querySelector('#kq-out').innerHTML = ['A', 'B'].map(k => `team ${k}: using ${Q[k].used}/${Q[k].quota} nominal${Q[k].used > Q[k].quota ? ` (+${Q[k].used - Q[k].quota} borrowed)` : ''} · waiting: ${Q[k].wait.map(j => j.id + '(' + j.n + ')').join(', ') || 'none'}`).join('<br>') + '<br>' + log.slice(-4).map(esc).join('<br>');
  };
  host.querySelector('.btns').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'reset') { ['A', 'B'].forEach(k => Object.assign(Q[k], { used: 0, run: [], wait: [] })); log = []; seq = 0; }
    else if (b.dataset.a === 'finish') { const all = [...Q.A.run.map(j => ['A', j]), ...Q.B.run.map(j => ['B', j])].sort((p, q) => p[1].t - q[1].t); if (all.length) { const [k, j] = all[0]; Q[k].run = Q[k].run.filter(x => x !== j); Q[k].used -= j.n; log.push(`${j.id} finished, ${j.n} GPUs free`); } }
    else { const j = { id: b.dataset.q.toLowerCase() + (++seq), n: +b.dataset.n, t: seq }; Q[b.dataset.q].wait.push(j); log.push(`team ${b.dataset.q} submits ${j.id} (${j.n} GPUs, created suspended)`); }
    admit(); draw();
  });
  draw();
};

CH.push({
  id: 'ch10', n: 10, title: 'Batch, Gangs and Devices',
  lede: 'The default scheduler places one Pod at a time and knows devices only as counters. Batch processing and AI need more: queues with fair shares between teams, all-or-nothing placement for jobs whose workers must start together, and rich descriptions of accelerators. This chapter covers Kueue, gang scheduling in the core, and Dynamic Resource Allocation.',
  html: `
<h2>What the default scheduler does not do</h2>
<ul>
<li><b>Queueing and quotas over time.</b> ResourceQuota rejects what does not fit; it does not queue it, share idle capacity, or decide which team goes next.</li>
<li><b>All-or-nothing placement.</b> A distributed training job with 64 workers is useless with 60.</li>
<li><b>Rich device requests.</b> "One GPU" says nothing about model, memory, interconnect, NUMA locality or partitions.</li>
</ul>

<h2>Kueue: job queueing</h2>
<p><b>Kueue</b>, a Kubernetes SIG project, is the standard queueing layer. Jobs (batch Jobs, JobSets, LeaderWorkerSets, Ray and Kubeflow jobs, even plain Pods) are created <b>suspended</b>. Kueue decides when to admit each one, based on quotas in <code>ClusterQueue</code>s, then unsuspends it and lets the normal scheduler place its Pods.</p>
${Y('Queues for two teams sharing GPUs')`
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata: {name: h100}
spec:
  nodeLabels: {gpu.example.com/model: h100}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata: {name: team-risk}
spec:
  cohortName: ml-shared             # queues in a cohort lend unused quota to each other
  namespaceSelector: {}
  preemption:
    reclaimWithinCohort: Any        # take back lent quota by preempting borrowers
    withinClusterQueue: LowerPriority
  resourceGroups:
  - coveredResources: [cpu, memory, nvidia.com/gpu]
    flavors:
    - name: h100
      resources:
      - {name: cpu, nominalQuota: 256}
      - {name: memory, nominalQuota: 2Ti}
      - {name: nvidia.com/gpu, nominalQuota: 8, borrowingLimit: 8}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: training, namespace: risk-ml}
spec: {clusterQueue: team-risk}
# A Job joins the queue with the label  kueue.x-k8s.io/queue-name: training`}
${fig('kueue', '<b>Figure 10.1</b> Interactive: two ClusterQueues in a cohort. Submit jobs, let one team borrow, then watch the other reclaim its quota.')}
<p>Kueue also offers <b>topology-aware scheduling</b> (placing a job's Pods within one rack or network block, important for training), <b>MultiKueue</b> (dispatching jobs to worker clusters, using the Job <code>managedBy</code> field), fair sharing by weights, and integration with the cluster autoscaler for provisioning capacity before admission.</p>

<h2>Gang scheduling</h2>
${fig('gang', '<b>Figure 10.2</b> Step through: two four-worker jobs on four GPUs, scheduled Pod by Pod and as gangs.')}
<p>Kueue avoids the deadlock by admitting whole jobs. Since 1.35 the core scheduler itself has <b>workload-aware scheduling</b>. A <code>Workload</code> object describes the groups a job needs (<code>podGroupTemplates</code>), and a controller creates one <code>PodGroup</code> object per group with a gang policy (<code>schedulingPolicy.gang.minCount</code>); the scheduler then places each PodGroup all-or-nothing in a single PodGroup scheduling cycle. In 1.37 Workload and PodGroup are beta (<code>scheduling.k8s.io/v1beta1</code>), <code>minCount</code> became mutable, and workload-aware preemption (evicting whole groups rather than single Pods) is beta. Like every beta API group, it is not served by default: enable <code>scheduling.k8s.io/v1beta1</code> with <code>--runtime-config</code> and the <code>GenericWorkload</code> feature gate, which managed services may not let you do.</p>
${Y('A gang of four workers (scheduling.k8s.io/v1beta1, Kubernetes 1.37)')`
apiVersion: scheduling.k8s.io/v1beta1
kind: Workload
metadata: {name: train-llm, namespace: ml}
spec:
  podGroupTemplates:
  - name: workers
    schedulingPolicy:
      gang: {minCount: 4}           # all four Pods or none
---
apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup                      # usually created by the job's controller
metadata: {name: train-llm-workers, namespace: ml}
spec:
  workloadRef: {workloadName: train-llm, templateName: workers}
  schedulingPolicy:
    gang: {minCount: 4}`}
<p>The division of labour with Kueue is clean: Kueue decides <b>when</b> a job may start (quota, fair sharing, admission), and PodGroups decide <b>where</b> its Pods go, all at once. In 1.37, Job integration (<code>spec.scheduling</code> on a Job) and CompositePodGroup for multi-level gangs are alpha. It reached beta in 1.37 together with <b>workload-aware preemption</b>, which preempts whole groups rather than individual Pods; integration with the Job controller and hierarchical groups (CompositePodGroup) are alpha in 1.37. Higher-level APIs build on these primitives:</p>
<div class="tbl"><table><tr><th>API</th><th>Shape</th><th>Typical use</th></tr>
<tr><td><b>JobSet</b></td><td>Several replicated Jobs (driver, workers, parameter servers) managed as one unit, with a headless Service for discovery and coordinated restarts</td><td>Distributed training</td></tr>
<tr><td><b>LeaderWorkerSet</b> (LWS)</td><td>Groups of Pods, a leader and workers, replicated and rolled out as units</td><td>Multi-node inference: one model sharded across several nodes</td></tr>
<tr><td><b>Kubeflow Trainer, KubeRay</b></td><td>Framework-specific operators (PyTorch, JAX, Ray)</td><td>ML platforms</td></tr>
</table></div>

<h2>Devices: from counters to Dynamic Resource Allocation</h2>
<p>The original mechanism is the <b>device plugin</b>: a node agent advertises an extended resource such as <code>nvidia.com/gpu: 8</code>, and Pods request a count. Simple, still widely used, but opaque: you cannot ask for a model, share a device, or describe partitions.</p>
<p><b>Dynamic Resource Allocation</b> (DRA), stable since 1.34, replaces counts with descriptions:</p>
<ul>
<li>A <b>DRA driver</b> publishes <code>ResourceSlice</code>s listing each device on each node with typed <b>attributes</b> (model, driver version, NUMA node, PCIe root) and <b>capacities</b> (memory, compute units).</li>
<li>An administrator defines <code>DeviceClass</code>es ("any GPU from this driver", "H100 with at least 80 GiB").</li>
<li>A workload creates a <code>ResourceClaim</code> (or a <code>ResourceClaimTemplate</code> for a claim per Pod) with requests, CEL selectors and constraints.</li>
<li>The <b>scheduler</b> allocates matching devices while choosing a node, writes the allocation into the claim's status, and the kubelet asks the driver to prepare the devices for the Pod.</li>
</ul>
${Y('A claim for two H100s on one NUMA node, with a fallback')`
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata: {name: two-gpus}
spec:
  spec:
    devices:
      requests:
      - name: gpus
        firstAvailable:                       # prioritized alternatives (stable in 1.36)
        - name: h100
          deviceClassName: gpu.example.com
          count: 2
          selectors:
          - cel: {expression: 'device.attributes["gpu.example.com"].model == "h100"'}
        - name: l4
          deviceClassName: gpu.example.com
          count: 4
          selectors:
          - cel: {expression: 'device.attributes["gpu.example.com"].model == "l4"'}
      constraints:
      - requests: [gpus]
        matchAttribute: resource.kubernetes.io/numaNode   # standard attribute (stable in 1.37)
---
apiVersion: v1
kind: Pod
metadata: {name: trainer}
spec:
  resourceClaims:
  - {name: gpus, resourceClaimTemplateName: two-gpus}
  containers:
  - name: train
    image: registry.example.com/trainer:5.2
    resources:
      claims: [{name: gpus}]`}
${fig('dra', '<b>Figure 10.3</b> Interactive: devices published in ResourceSlices, and how a claim\'s selector, count and NUMA constraint pick them.')}
<div class="tbl"><table><tr><th>DRA capability</th><th>Status (1.37)</th><th>What it adds</th></tr>
<tr><td>Core API, structured parameters</td><td>Stable (1.34)</td><td>Classes, slices, claims, CEL selectors</td></tr>
<tr><td>Prioritized alternatives (<code>firstAvailable</code>)</td><td>Stable (1.36)</td><td>Fallback device types</td></tr>
<tr><td>Admin access</td><td>Stable (1.36)</td><td>Monitoring tools can access devices already in use, only in namespaces labelled <code>resource.kubernetes.io/admin-access: "true"</code>, so restrict who can set that label</td></tr>
<tr><td>Device taints and tolerations, claim device status, extended-resource mapping, resource health in Pod status, standard <code>numaNode</code> attribute</td><td>Stable (1.37)</td><td>Take faulty devices out of service; report per-device data such as NIC addresses; let Pods that ask for <code>nvidia.com/gpu: 1</code> be served by a DRA driver</td></tr>
<tr><td>Partitionable devices, consumable capacity</td><td>Beta</td><td>Allocate MIG slices of a GPU, or share a device's capacity among claims</td></tr>
<tr><td>Claims for workloads, device compatibility groups, derived attributes, node-allocatable requests</td><td>Beta / alpha (1.37)</td><td>Share claims across a PodGroup; avoid mixing MIG and vGPU on one GPU</td></tr>
</table></div>
<p>Drivers exist for NVIDIA GPUs, for network interfaces (used for high-speed RDMA networking in AI clusters) and for other accelerators; Chapter 30 puts these together into an AI platform.</p>

<h2>Node-level placement: CPU, memory and topology managers</h2>
<p>Inside a node, the kubelet can pin resources. The <b>CPU manager</b> with the <code>static</code> policy gives Guaranteed Pods that request whole CPUs exclusive cores; the <b>memory manager</b> pins memory to NUMA nodes; the <b>topology manager</b> aligns CPUs, memory and devices on the same NUMA node (policies <code>best-effort</code>, <code>restricted</code>, <code>single-numa-node</code>). Latency-critical services (payment switches, trading engines) and high-throughput inference use these. Pod-level resource managers, which apply these policies to Pod-level resources, are beta (off by default) in 1.37.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Running distributed jobs without gang semantics</strong>: partial placement wastes accelerators.</li>
<li><strong>Quotas without a queue</strong>: users retry in loops when ResourceQuota rejects them.</li>
<li><strong>Mixing device plugins and DRA drivers for the same devices</strong> without the extended-resource mapping: double allocation.</li>
<li><strong>Ignoring topology</strong> for multi-GPU work: cross-socket traffic can halve throughput.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Why suspended?</summary><p>Why does Kueue need Jobs to be created with <code>suspend: true</code>?</p><p><em>Answer:</em> so that no Pods exist until Kueue decides to admit the whole job; it then sets suspend to false (and can inject node affinity for the chosen flavour).</p></details>
<details><summary>Count or description?</summary><p>Your inference service needs a GPU with at least 40 GiB of memory, and can use either one H100 or two L4s. Which mechanism can express that?</p><p><em>Answer:</em> DRA, with a capacity selector and a <code>firstAvailable</code> list; device plugin counts cannot.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>A DRA lab without GPUs</summary><p>Install the example DRA driver from the Kubernetes project (it publishes fake devices) on a kind 1.37 cluster. Create a DeviceClass and a claim that selects by an attribute, and inspect the ResourceSlice and the claim's allocation.</p><p><em>Answer:</em> <code>kubectl get resourceslices -o yaml</code> shows devices per node; the claim's <code>status.allocation</code> names the driver, pool and device; the Pod lands on that node.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Fair share under pressure</summary><p>Configure three ClusterQueues in a cohort with weights 2:1:1 and fair sharing enabled. Saturate them with jobs and measure admitted GPU-hours per team over an hour.</p><p><em>Answer:</em> long-run shares approach the weights when all teams have demand; idle quota flows to busy teams and is reclaimed by preemption when the owner needs it.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain why batch and AI workloads need queueing and gang scheduling.</li>
<li>I can configure Kueue ResourceFlavors, ClusterQueues, cohorts and LocalQueues.</li>
<li>I can write DRA DeviceClasses and ResourceClaims with selectors, alternatives and constraints.</li>
<li>I know when CPU, memory and topology managers matter.</li>
</ul>
`});

CH.push({
  id: 'ch11', n: 11, title: 'The Network Model and CNI',
  lede: 'Kubernetes networking rests on a few rules that every network plugin must satisfy, after which almost anything goes: bridges, routing, overlays, eBPF, addresses taken straight from a cloud VPC. This chapter explains the rules, follows packets between Pods, shows how a plugin wires up each Pod, and helps you plan addresses before they run out.',
  html: `
<h2>The rules</h2>
<ol>
<li>Every Pod gets its own IP address (or one per IP family).</li>
<li>Pods can reach all other Pods, on any node, <b>without NAT</b>: the source address a Pod sees is the sender's real Pod IP.</li>
<li>Agents on a node (the kubelet, system daemons) can reach all Pods on that node.</li>
</ol>
<p>That is all Kubernetes requires. It does not say how. Containers in a Pod share its network namespace, so they share the IP and talk over <code>localhost</code>. Pods are flat and routable to each other by default: segmentation is added with NetworkPolicy (Chapter 14), not taken away.</p>

<h2>Following a packet</h2>
${fig('netpath', '<b>Figure 11.1</b> Interactive: the path of a packet between Pods on the same node and across nodes, and what is on the wire in each design.')}

<h2>How a Pod gets its network</h2>
${fig('cniadd', '<b>Figure 11.2</b> Step through: the Container Network Interface (CNI) ADD sequence for a new Pod.')}
<p>The <b>CNI specification</b> is deliberately small: a plugin is an executable that receives a JSON configuration and a command (ADD, DEL, CHECK, STATUS, GC) and returns JSON. Most plugins pair that binary with a DaemonSet agent that programs the node and a controller that manages addresses and policy. You can see the configuration on any node:</p>
${SH('Look at a node\'s CNI setup')`
docker exec lab-worker ls /etc/cni/net.d/ /opt/cni/bin/
docker exec lab-worker cat /etc/cni/net.d/10-kindnet.conflist
docker exec lab-worker ip -br addr; docker exec lab-worker ip route    # one veth per Pod, one route per Pod or per node range
kubectl get pods -o wide -A | head    # Pod IPs from each node's range`}

<h2>Choosing a plugin</h2>
<div class="tbl"><table><tr><th>Plugin</th><th>Datapath</th><th>Strengths</th></tr>
<tr><td><b>Cilium</b></td><td>eBPF; overlay or native routing</td><td>kube-proxy replacement, L3–L7 policy, Hubble flow visibility, encryption (WireGuard or IPsec), cluster mesh; default in several managed offerings</td></tr>
<tr><td><b>Calico</b></td><td>iptables, nftables or eBPF; BGP or overlay</td><td>Mature policy (including global and tiered policies), BGP peering with data-centre networks, Windows support</td></tr>
<tr><td><b>Cloud VPC CNIs</b> (AWS VPC CNI, Azure CNI, GKE)</td><td>Pods get VPC addresses</td><td>Pods are first-class on the cloud network (security groups, flow logs); consumes subnet space</td></tr>
<tr><td><b>Flannel</b>, <b>kindnet</b></td><td>Simple overlay or routes</td><td>Minimal; no NetworkPolicy on their own; labs and small clusters</td></tr>
<tr><td><b>Multus</b></td><td>Meta-plugin</td><td>Attaches extra interfaces (SR-IOV, storage or RDMA networks) to Pods; DRA network drivers are the newer path</td></tr>
</table></div>
<p>For a regulated environment the deciding features are usually: NetworkPolicy enforcement (and cluster-wide policy), encryption in transit between nodes, flow logs for audit, and whether security tooling can see real Pod IPs.</p>

<h2>Address planning</h2>
${fig('ipcalc', '<b>Figure 11.3</b> Interactive: how the cluster pod range, the per-node range and maxPods limit the size of a cluster.')}
<p>Changing a cluster's pod or Service ranges later ranges from painful to impossible, so plan before creating it. Avoid overlaps with on-premises networks and other clusters you may connect (VPN, peering, cluster mesh). Since 1.33, Service IP ranges can be extended at run time with additional <code>ServiceCIDR</code> objects, which helps when you run short of ClusterIPs.</p>

<h2>IPv6 and dual-stack</h2>
<p>Dual-stack (stable since 1.23) gives Pods and Services both IPv4 and IPv6 addresses (<code>status.podIPs</code>, <code>spec.ipFamilies</code>, <code>ipFamilyPolicy: PreferDualStack</code>). IPv6-only clusters remove address scarcity entirely and are increasingly common at large scale; you need NAT64 and DNS64 to reach IPv4-only services outside.</p>

<h2>Egress</h2>
<p>Traffic from Pods to the outside world is normally source-NATed to the node's address, so external firewalls see node IPs, not workloads. When an external partner (a bank, a card network) allow-lists your IPs, use an <b>egress gateway</b> (Cilium, Calico, Istio, or a cloud NAT per node pool) to give specific workloads fixed, known source addresses.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Overlapping CIDRs</strong> with corporate networks or peered VPCs: some destinations become unreachable from Pods.</li>
<li><strong>MTU mismatches</strong> with overlays or VPNs: small requests work, large responses hang.</li>
<li><strong>Running out of VPC addresses</strong> with VPC-native CNIs: Pods stay in ContainerCreating with IP allocation errors.</li>
<li><strong>A CNI without NetworkPolicy support</strong>: policies are accepted by the API and silently ignored.</li>
<li><strong>Allow-listing node IPs</strong> at a partner: every workload on those nodes inherits the access.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>NAT or not?</summary><p>Pod A (10.244.1.5) calls Pod C (10.244.2.7) on another node. What source address does C see? And when A calls an external website?</p><p><em>Answer:</em> 10.244.1.5, because pod-to-pod traffic is not NATed. External traffic is usually SNATed to the node IP (or an egress gateway's IP).</p></details>
<details><summary>Size it</summary><p>A /16 pod CIDR with /24 per node: how many nodes? What if you need 600 nodes?</p><p><em>Answer:</em> 256 nodes. For 600, use a /14 cluster range (1,024 nodes at /24 each), or keep the /16 and give each node a /26 (1,024 nodes with 62 addresses each, so set maxPods to about 60), or use IPv6.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Trace a packet</summary><p>In kind, start two Pods on different nodes, find their veth interfaces on each node (<code>ip link</code> and the Pod's <code>cat /sys/class/net/eth0/iflink</code>), and run <code>tcpdump</code> on the node interface while they ping. What do you see?</p><p><em>Answer:</em> with kindnet the packets cross between node containers with Pod IPs (routed, no encapsulation); an overlay plugin would show UDP packets between node IPs.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Replace the CNI</summary><p>Create a kind cluster with <code>disableDefaultCNI: true</code> and <code>kubeProxyMode: none</code>, install Cilium with kube-proxy replacement, and use Hubble to observe flows between two Pods. What disappeared from iptables or nftables on the nodes?</p><p><em>Answer:</em> the per-Service rules kube-proxy would have created; Service load balancing now happens in eBPF at the socket or tc layer.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can state the Kubernetes network rules and what they leave to the plugin.</li>
<li>I can explain overlay, native routing and eBPF datapaths and their trade-offs.</li>
<li>I can describe the CNI ADD sequence and inspect a node's CNI configuration.</li>
<li>I can plan pod, node and Service address ranges, and handle egress to partners that allow-list IPs.</li>
</ul>
`});

    const abs = raw.endsWith('.'), name = raw.replace(/\.$/, ''), dots = (name.match(/\./g) || []).length;
    const tries = abs ? [name] : dots >= nd ? [name, ...search.map(d => name + '.' + d)] : [...search.map(d => name + '.' + d), name];
    const internal = /\.svc\.cluster\.local$/.test(name) || (name.split('.').length <= 2 && !/\.(com|in|net|org|io|dev)$/.test(name));
    const found = tries.findIndex(t => internal ? /^[^.]+\.[^.]+\.svc\.cluster\.local$/.test(t) : t === name);
    const q = found < 0 ? tries.length : found + 1;
    host.querySelector('#nd-out').innerHTML = `"${esc(raw)}" has ${dots} dot(s); ndots is ${nd}, so ${abs ? 'it is absolute (trailing dot): asked as is' : dots >= nd ? 'it is tried as is first' : 'the search list is tried first'}.<br>` + tries.map((t, i) => `${i + 1}. ${esc(t)} ${i === found ? '<b class="g">→ answer</b>' : i < q ? '<span class="d">NXDOMAIN</span>' : '<span class="meta">(not needed)</span>'}`).join('<br>') + `<br><b>${q} lookups${q > 1 ? `, each for A and AAAA: ${q * 2} queries` : ''}</b> before an answer. <span class="meta">For external names, add a trailing dot, or set <code>dnsConfig.options: [{name: ndots, value: "2"}]</code> on the Pod.</span>`;

};

CH.push({
  id: 'ch12', n: 12, title: 'Services, kube-proxy and DNS',
  lede: 'Pods come and go with new IP addresses. A Service gives a set of Pods one stable name and address, and a whole machinery of EndpointSlices, kube-proxy rules and DNS keeps that address pointing at the right Pods. This chapter shows exactly how a connection to a Service reaches a Pod, the Service types, routing preferences across zones, and the DNS behaviour that quietly multiplies your lookups.',
  html: `
<h2>Services and EndpointSlices</h2>
${Y('A Service and the EndpointSlice the control plane creates for it')`
apiVersion: v1
kind: Service
metadata: {name: payments, namespace: shop}
spec:
  selector: {app: payments}
  ports:
  - {name: http, port: 80, targetPort: http, protocol: TCP}   # targetPort can name a container port
---
# created and maintained by the EndpointSlice controller:
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: payments-x7k2q
  labels: {kubernetes.io/service-name: payments}
addressType: IPv4
ports: [{name: http, port: 8080, protocol: TCP}]
endpoints:
- addresses: ["10.244.2.7"]
  conditions: {ready: true, serving: true, terminating: false}
  nodeName: node-2
  zone: ap-south-1b
  targetRef: {kind: Pod, name: payments-6f9-abc}`}
<p>The Service selects Pods by label; the <b>EndpointSlice controller</b> maintains slices of up to 100 endpoints each with their readiness, node and zone. Only <b>ready</b> Pods receive new traffic, which is why readiness probes matter. Terminating endpoints are still listed (with <code>terminating: true</code>) so proxies can drain them gracefully. The old Endpoints API is deprecated in favour of EndpointSlices.</p>
${fig('stypes', '<b>Figure 12.1</b> Interactive: the Service types.')}

<h2>How a ClusterIP works</h2>
${fig('svcpath', '<b>Figure 12.2</b> Step through: a connection to a ClusterIP, translated on the client\'s own node.')}
<p>The ClusterIP is virtual: <b>kube-proxy</b> on every node watches Services and EndpointSlices and programs the node so that packets to the virtual address are translated to a real endpoint. Load balancing therefore happens on the client's node, per connection, not per request: a long-lived HTTP/2 or gRPC connection stays on one Pod for its whole life. Use client-side balancing, a Gateway, or a mesh for per-request balancing of such traffic.</p>
<div class="tbl"><table><tr><th>kube-proxy mode</th><th>Status</th><th>Notes</th></tr>
<tr><td><b>nftables</b></td><td>Stable since 1.33; the intended future default and the migration target for ipvs</td><td>Set-based lookups: rule updates and per-packet cost stay low as Services grow</td></tr>
<tr><td><b>iptables</b></td><td>Default for compatibility</td><td>Rules grow linearly; large clusters see slow updates</td></tr>
<tr><td><b>ipvs</b></td><td>Deprecated since 1.35</td><td>Scheduled to be off by default by 1.40 and removed after that (the 1.37 notes say by 1.43); migrate to nftables</td></tr>
<tr><td><b>Replaced by eBPF</b></td><td>Plugin feature</td><td>Cilium and Calico can do Service translation in eBPF, often at socket level (connect-time), avoiding per-packet NAT</td></tr>
</table></div>
<h3>Migrating to nftables without surprises</h3>
<ul>
<li><b>Set the mode explicitly</b> in the KubeProxyConfiguration (<code>mode: nftables</code>, or <code>iptables</code> until you migrate). The default is still iptables and is planned to change, so an unpinned cluster could switch during an upgrade.</li>
<li><b>NodePorts answer only on the node's primary addresses</b> in nftables mode (<code>--nodeport-addresses primary</code> by default), not on every local address, and NodePorts on <code>localhost</code> do not work.</li>
<li><b>No automatic accept rules for NodePorts</b>: if the host firewall drops unknown ports, open the NodePort range yourself.</li>
<li><b>No conntrack workaround for old kernels</b>: the iptables mode drops packets conntrack marks invalid, which hides a bug in kernels before 6.1. Check <code>iptables_ct_state_invalid_dropped_packets_total</code> before migrating; if it is not zero, use a newer kernel or <code>--conntrack-tcp-be-liberal</code>.</li>
<li>Check the current mode with <code>kubectl -n kube-system get cm kube-proxy -o jsonpath='{.data.config\\.conf}' | grep mode:</code>, and migrate one node pool at a time.</li>
</ul>
${SH('See the rules kube-proxy wrote')`
docker exec lab-worker nft list table ip kube-proxy | grep -A3 payments      # nftables mode
docker exec lab-worker iptables-save -t nat | grep payments                   # iptables mode
docker exec lab-worker conntrack -L -d 10.96.14.20 2>/dev/null | head`}

<h2>Traffic policies and zone-aware routing</h2>
<ul>
<li><b>externalTrafficPolicy: Local</b> on NodePort and LoadBalancer Services sends external traffic only to endpoints on the receiving node, preserving the client's source IP and avoiding a second hop; nodes without endpoints fail health checks so the load balancer skips them. <code>Cluster</code> (default) spreads evenly but SNATs.</li>
<li><b>internalTrafficPolicy: Local</b> sends in-cluster traffic only to endpoints on the same node: good for node-local agents (a DaemonSet cache).</li>
<li><b>trafficDistribution</b> expresses a preference: <code>PreferSameZone</code> (formerly <code>PreferClose</code>, which still works) and <code>PreferSameNode</code>, both stable since 1.35.</li>
</ul>
${fig('tdist', '<b>Figure 12.3</b> Interactive: where requests from a client in zone a go, with and without a traffic distribution preference.')}
<p>Cross-zone traffic costs money on every major cloud and adds latency, so zone preference is often worth enabling. The risk is uneven load: if a zone has few endpoints but many clients, those endpoints are overloaded. Spread your replicas evenly with topology spread constraints when you use it.</p>

<h2>DNS</h2>
<p><b>CoreDNS</b> serves records for Services and Pods: <code>payments.shop.svc.cluster.local</code> resolves to the ClusterIP; for a headless Service, to the Pod IPs; for a StatefulSet Pod, <code>db-0.db.shop.svc.cluster.local</code> to that Pod. SRV records exist for named ports. The kubelet writes each Pod's <code>/etc/resolv.conf</code> with the cluster DNS server, a search list starting with the Pod's own namespace, and <code>options ndots:5</code>.</p>
${fig('ndots', '<b>Figure 12.4</b> Interactive: how the search list and ndots expand a name into DNS queries.')}
<p>With <code>ndots:5</code>, every external name with fewer than five dots is first tried with each search domain, each failure costing a round trip (doubled for IPv4 and IPv6). At scale this is a large share of all DNS traffic. Fixes: use fully-qualified names with a trailing dot for external hosts, lower ndots for Pods that mostly call external services, and run <b>NodeLocal DNSCache</b>, a DaemonSet cache on each node that also avoids conntrack problems with UDP DNS.</p>

<h2>Exposing Services and what not to use</h2>
<p>For HTTP and gRPC, expose Services through a Gateway (Chapter 13) rather than one load balancer per Service. Avoid <code>spec.externalIPs</code>: it lets anyone who can create Services claim arbitrary IPs and intercept traffic (CVE-2020-8554); it is deprecated since 1.36 and scheduled to stop working in 1.43. Since 1.37 Service names follow relaxed validation rules (stable), aligning them with other object names.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Selector typos</strong>: a Service with no endpoints accepts connections and refuses them. Check <code>kubectl get endpointslices -l kubernetes.io/service-name=X</code>.</li>
<li><strong>Long-lived gRPC connections</strong> pinned to one Pod while new replicas sit idle.</li>
<li><strong>externalTrafficPolicy: Cluster</strong> when the app needs the client IP (fraud checks, rate limiting).</li>
<li><strong>ndots:5 with heavy external calls</strong>: DNS latency and CoreDNS load.</li>
<li><strong>Staying on IPVS mode</strong> past its deprecation window.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Where is the load balancer?</summary><p>For a ClusterIP Service, which component chooses the backend Pod, and on which machine?</p><p><em>Answer:</em> the client node's kernel, following rules kube-proxy (or an eBPF datapath) installed; there is no central load balancer for ClusterIP.</p></details>
<details><summary>Count the lookups</summary><p>With ndots 5 and four search domains, how many DNS queries does resolving <code>api.stripe.com</code> take, IPv4 and IPv6?</p><p><em>Answer:</em> the name has two dots, so the four search domains are tried first (four failures) then the name itself: five lookups, ten queries.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Switch kube-proxy to nftables</summary><p>Create a kind cluster with <code>networking.kubeProxyMode: nftables</code>, create 500 Services with a loop, and time how long kube-proxy takes to sync compared with iptables mode (metric <code>kubeproxy_sync_proxy_rules_duration_seconds</code>).</p><p><em>Answer:</em> sync time grows much more slowly in nftables mode because Service lookups use maps rather than chains of rules.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Prove the connection pinning</summary><p>Run a gRPC client with one long-lived connection against a 3-replica Service, scale to 6 and observe per-Pod request counts. Then make the client use the headless Service with round-robin balancing.</p><p><em>Answer:</em> all requests stay on the original Pod; with a headless Service and client-side round-robin over the returned IPs, load spreads across all six.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain Services, EndpointSlices and readiness, and choose a Service type.</li>
<li>I can describe how a ClusterIP connection is translated, and the kube-proxy modes and their status.</li>
<li>I can use traffic policies and traffic distribution sensibly.</li>
<li>I understand cluster DNS, the search list and ndots, and how to reduce DNS load.</li>
</ul>
`});

FIG.routematch = host => {
  host.innerHTML = `<div class="tool"><p class="meta" style="margin:0 0 8px">Six HTTPRoute rules on one Gateway listener. Send a request and see which rule wins, and why.</p><div class="row"><div><label for="rm-m">method</label>${sel('rm-m', [['GET', 'GET'], ['POST', 'POST']], 'GET')}</div><div style="flex:3 1 220px"><label for="rm-p">path</label><input class="txt" id="rm-p" value="/api/orders"></div></div><label class="chk"><input type="checkbox" id="rm-h"> header x-canary: true</label><div class="out" id="rm-out"></div></div>`;
  const pm = (t, v, p) => t === 'Exact' ? p === v : (v === '/' || p === v || p.startsWith(v.replace(/\/$/, '') + '/'));
  const draw = () => {
    const m = host.querySelector('#rm-m').value, p = host.querySelector('#rm-p').value || '/', h = host.querySelector('#rm-h').checked;
    const hits = ROUTES.filter(r => pm(r.m.path[0], r.m.path[1], p) && (!r.m.method || r.m.method === m) && (!r.m.hdr || h));
    hits.sort((a, b) => (b.m.path[0] === 'Exact') - (a.m.path[0] === 'Exact') || b.m.path[1].length - a.m.path[1].length || !!b.m.method - !!a.m.method || !!b.m.hdr - !!a.m.hdr);
    const w = hits[0];
    const list = ROUTES.map(r => `${hits.includes(r) ? (r === w ? '<b class="g">✓ wins</b>' : '<span class="meta">✓ matches</span>') : '<span class="meta">✗</span>'} ${esc(r.r)}: ${r.m.method ? r.m.method + ' ' : ''}${r.m.path[0]} ${esc(r.m.path[1])}${r.m.hdr ? ' + header ' + r.m.hdr.join('=') : ''} → ${r.b.map(([n, x]) => n + (r.b.length > 1 ? ` (${x})` : '')).join(', ')}`).join('<br>');
    const why = w ? (w.m.path[0] === 'Exact' ? 'an Exact path match beats any prefix' : hits.length > 1 && hits[1].m.path[1].length < w.m.path[1].length ? `the longest matching prefix (${w.m.path[1]}) wins` : w.m.method ? 'same prefix: a rule that also matches the method is more specific' : w.m.hdr ? 'same prefix: the rule with more header matches is more specific' : 'it is the only match') : '';
    host.querySelector('#rm-out').innerHTML = list + `<br>${w ? `→ <b>${esc(w.r)}</b>: ${why}.${w.b.length > 1 ? ` Then backends by weight: ${w.b.map(([n, x]) => `${n} ${x}%`).join(', ')}.` : ''}` : '<span class="d">no rule matches: 404</span>'}<br><span class="meta">Precedence: exact path, then longest prefix, then method, then number of header matches, then number of query matches; remaining ties go to the oldest route.</span>`;

};

CH.push({
  id: 'ch13', n: 13, title: 'Gateway API, Ingress and Service Mesh',
  lede: 'Getting traffic from outside the cluster to the right Pods, safely, used to mean Ingress plus a pile of controller-specific annotations. The Gateway API replaces that with a role-oriented, portable model, and in March 2026 the most widely used Ingress controller was retired. This chapter teaches the Gateway API in depth, shows how to migrate, and places service meshes in the same picture.',
  html: `
<h2>Ingress and its retirement problem</h2>
<p>The <b>Ingress</b> API (stable, but frozen) maps hosts and paths to Services. Everything beyond that (rewrites, timeouts, canaries, authentication, rate limits) was added through annotations specific to each controller, so manifests were not portable and cluster operators could not safely delegate. The most popular implementation, <b>ingress-nginx</b>, was retired by SIG Network and the Security Response Committee on <b>24 March 2026</b>: there are no further releases, bug fixes or security patches. Existing installations keep running, but every new vulnerability in it now stays open. Other Ingress controllers (from NGINX's vendor, Traefik, HAProxy, cloud providers) remain supported, and the Ingress API itself is not going away, but the direction of the project is the Gateway API.</p>

<h2>The Gateway API model</h2>
${fig('gwroles', '<b>Figure 13.1</b> The Gateway API resources and the roles that own them.')}
<ul>
<li><b>GatewayClass</b>: a kind of gateway offered by an implementation (Envoy Gateway, Istio, Cilium, NGINX Gateway Fabric, Kong, Traefik, or a cloud's managed load balancer).</li>
<li><b>Gateway</b>: an instance with <b>listeners</b> (port, protocol, hostname, TLS certificates) and rules for which namespaces may attach routes.</li>
<li><b>Routes</b>: <code>HTTPRoute</code>, <code>GRPCRoute</code>, <code>TLSRoute</code>, <code>TCPRoute</code>, <code>UDPRoute</code>, owned by application teams in their own namespaces, attached to Gateways through <code>parentRefs</code>.</li>
<li><b>ReferenceGrant</b>: the owner of a namespace explicitly allows references into it from another namespace (a Gateway using a certificate Secret, a route using a backend).</li>
<li><b>ListenerSet</b>: lets teams contribute listeners (their own hostnames and certificates) to a shared Gateway.</li>
<li><b>BackendTLSPolicy</b>: TLS from the gateway to the backend, with the CA and hostname to verify.</li>
</ul>
<p>The project ships in a <b>standard</b> channel (stable, backward compatible) and an <b>experimental</b> channel. Version 1.5 (February 2026) moved ListenerSet, TLSRoute, the CORS filter, client certificate validation, backend certificate selection and ReferenceGrant (now v1) to standard; version 1.6 (June 2026) made TCPRoute and UDPRoute GA and moved new experimental resources into a separate API group, <code>gateway.networking.x-k8s.io</code>, with an X prefix (XBackend, XMesh), so experimental and standard can no longer be confused. Releases follow a train: whatever is ready at feature freeze ships. Upgrade CRDs deliberately: installing v1.5 standard over an older experimental install leaves v1alpha2 TLSRoutes unreadable until they are migrated to v1.</p>
${Y('A shared Gateway and a team\'s route with a canary')`
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: public, namespace: infra}
spec:
  gatewayClassName: envoy-gateway
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.example.com"
    tls:
      mode: Terminate
      certificateRefs: [{name: wildcard-tls}]
    allowedRoutes:
      namespaces:
        from: Selector
        selector: {matchLabels: {gateway-access: public}}   # only labelled namespaces may attach
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: shop, namespace: shop}
spec:
  parentRefs: [{name: public, namespace: infra, sectionName: https}]
  hostnames: [shop.example.com]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /api}
    timeouts: {request: 10s}
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier: {add: [{name: x-forwarded-team, value: shop}]}
    backendRefs:
    - {name: api, port: 8080, weight: 90}
    - {name: api-v2, port: 8080, weight: 10}       # canary: 10% of requests
  - matches:
    - path: {type: PathPrefix, value: /checkout}
      headers: [{name: x-canary, value: "true"}]
    backendRefs: [{name: checkout-v2, port: 8080}]
  - backendRefs: [{name: web, port: 8080}]          # no match block: everything else`}

<h2>How routes are matched</h2>
${fig('routematch', '<b>Figure 13.2</b> Interactive: HTTPRoute rule precedence and weighted backends.')}
<p>Precedence rules are part of the specification, so every conformant implementation picks the same rule. Check a route's <code>status.parents[].conditions</code>: <code>Accepted</code> tells you whether the Gateway took it (and if not, why: wrong namespace, no matching listener), <code>ResolvedRefs</code> whether its backends and grants resolved. Most "my route does nothing" problems are visible there.</p>
${SH('Debugging a route')`
kubectl get gateway -A; kubectl get httproute -A
kubectl get httproute shop -n shop -o jsonpath='{.status.parents[*].conditions}' | jq
kubectl describe gateway public -n infra     # listeners, attached routes count, addresses`}

<h2>Migrating from ingress-nginx</h2>
<ol>
<li><b>Inventory</b> every Ingress and every annotation in use (<code>kubectl get ingress -A -o yaml | grep nginx.ingress.kubernetes.io | sort | uniq -c</code>). Annotations are where the hidden behaviour lives: rewrites, regex paths, CORS, auth, snippets.</li>
<li><b>Choose an implementation</b> and decide who owns Gateways (a platform team) and who owns routes (application teams).</li>
<li><b>Translate</b> with <code>ingress2gateway</code> (1.0 handles 30+ common ingress-nginx annotations and warns about the rest), then review by hand. ingress-nginx has silent behaviours you must decide to keep or drop: regex paths are prefix-matched and case-insensitive; <code>rewrite-target</code> turns on regex for every path of that host across all Ingresses; missing trailing slashes are redirected; URLs are normalised. Configuration snippets and external auth still need implementation-specific policies.</li>
<li><b>Run both side by side</b> on different addresses, test, then move DNS gradually. Keep the old controller only as long as needed: it receives no security fixes.</li>
</ol>
${Y('Before and after: a rewrite')`
# Ingress (ingress-nginx annotations)
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - host: shop.example.com
    http:
      paths:
      - {path: /legacy(/|$)(.*), pathType: ImplementationSpecific, backend: {service: {name: web, port: {number: 80}}}}
---
# HTTPRoute (portable)
rules:

<h2>Service mesh</h2>
<p>A <b>service mesh</b> manages east–west traffic between services: mutual TLS with workload identities, per-request load balancing and retries, traffic shifting, and uniform telemetry. Designs have shifted away from a proxy sidecar in every Pod:</p>
<div class="tbl"><table><tr><th>Design</th><th>Examples</th><th>Trade-off</th></tr>
<tr><td>Sidecar proxies</td><td>Istio sidecar mode, Linkerd</td><td>Full per-Pod L7 features; memory and CPU in every Pod; injection and upgrade friction</td></tr>
<tr><td>Node-level L4 plus optional L7 proxies</td><td>Istio ambient mode (ztunnel per node, waypoint proxies where L7 is needed)</td><td>mTLS for everything at low cost; L7 only where you deploy a waypoint</td></tr>
<tr><td>eBPF-based</td><td>Cilium service mesh</td><td>No sidecars; L7 via a per-node Envoy; tightly bound to the CNI</td></tr>
</table></div>
<p>The Gateway API also covers meshes (the GAMMA initiative): an HTTPRoute whose <code>parentRefs</code> point to a <b>Service</b> instead of a Gateway configures mesh routing for calls to that Service. One API now describes north–south and east–west traffic.</p>
<div class="note key"><b>Do you need a mesh?</b><p>For a regulated platform the strongest reason is encryption and authentication of all service-to-service traffic with workload identity, with audit-friendly telemetry. If that is the only goal, compare an ambient or eBPF mesh with CNI-level encryption (WireGuard) plus NetworkPolicy and application-level mTLS using pod certificates (Chapter 7). Each layer you add is another thing to patch and upgrade.</p></div>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Staying on ingress-nginx</strong> after its retirement, with no security fixes.</li>
<li><strong>Letting every namespace attach to the public Gateway</strong>: one team can then claim another team's hostname path. Use <code>allowedRoutes</code> with selectors.</li>
<li><strong>Translating annotations blindly</strong>: snippets and regex paths often hide security-relevant behaviour.</li>
<li><strong>Ignoring route status</strong> when debugging.</li>
<li><strong>Adopting a mesh for one feature</strong> without the operational capacity to run it.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Who owns what?</summary><p>In your organisation, which team should own the GatewayClass, the Gateway, the TLS certificates, and HTTPRoutes?</p><p><em>Answer:</em> the platform or infrastructure team owns GatewayClass and Gateways (and usually certificates, delegated via ReferenceGrant or ListenerSets); application teams own routes in their namespaces.</p></details>
<details><summary>Precedence</summary><p>Rules: PathPrefix /api; PathPrefix /api/v1; Exact /api/v1/health. Which wins for /api/v1/health, /api/v1/orders and /api/v2?</p><p><em>Answer:</em> the Exact rule; the /api/v1 prefix; the /api prefix.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Run a canary</summary><p>Install Envoy Gateway (or another implementation) in kind, create a Gateway and an HTTPRoute with 90/10 weights between two versions, and send 1,000 requests. Then move to header-based routing for testers only.</p><p><em>Answer:</em> roughly 900/100 split; a second rule matching the header sends only tester traffic to the new version.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Migrate a real Ingress set</summary><p>Take ten Ingresses with nginx annotations, run ingress2gateway, and list everything it could not translate. For each, decide whether to drop it, use a standard filter, or use an implementation-specific policy.</p><p><em>Answer:</em> expect gaps for configuration snippets, regex paths, custom error pages and external auth; snippets in particular often hide security headers that must be recreated deliberately.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I know why ingress-nginx's retirement matters and how to plan a migration.</li>
<li>I can model GatewayClass, Gateway, routes, ReferenceGrant and ListenerSet with clear ownership.</li>
<li>I can write HTTPRoutes with matches, filters, timeouts and weighted backends, and predict precedence.</li>
<li>I can compare sidecar, ambient and eBPF meshes and decide whether a mesh is needed.</li>
</ul>

CH.push({
  id: 'ch14', n: 14, title: 'Network Policy and Zero Trust',
  lede: 'By default every Pod can talk to every other Pod. NetworkPolicy turns that flat network into one where each workload accepts only the traffic it should. The API is small but has sharp semantic edges, so this chapter works through them with an evaluator, then covers cluster-wide policy, layer-7 and DNS-aware rules, and encryption.',
  html: `
<h2>How NetworkPolicy works</h2>
<ul>
<li>A policy <b>selects</b> Pods in its namespace with <code>podSelector</code> (empty means all).</li>
<li>For each direction listed in <code>policyTypes</code> (Ingress, Egress), selected Pods become <b>isolated</b>: only traffic allowed by some policy is permitted.</li>
<li>Policies are <b>additive allow-lists</b>; there is no deny rule and no ordering. The union of all policies selecting a Pod is what is allowed.</li>
<li>A connection needs the sender's egress <b>and</b> the receiver's ingress to allow it. Replies to allowed connections are always permitted.</li>
<li>Enforcement is done by the CNI plugin. If it does not support NetworkPolicy, policies are stored and ignored.</li>
</ul>
${Y('Default deny, then allow exactly what is needed')`
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: shop}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api, namespace: shop}
spec:
  podSelector: {matchLabels: {app: api}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: web}}                       # same namespace
    - namespaceSelector: {matchLabels: {purpose: monitoring}}      # OR any Pod in monitoring namespaces
    ports: [{port: 8080, protocol: TCP}]
  egress:
  - to: [{podSelector: {matchLabels: {app: db}}}]
    ports: [{port: 5432, protocol: TCP}]
  - to:                                                            # DNS, or nothing resolves
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}              # same element: AND
    ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]`}
<div class="note key"><b>The AND/OR trap</b><p>Inside one <code>from</code> or <code>to</code> element, <code>namespaceSelector</code> and <code>podSelector</code> are ANDed: "Pods labelled X in namespaces labelled Y". As two separate list elements (two dashes) they are ORed: "Pods labelled X in this namespace, or any Pod in namespaces labelled Y". One extra dash can open a database to the whole cluster.</p></div>
${fig('npeval', '<b>Figure 14.1</b> Interactive: a NetworkPolicy evaluator. Toggle policies, including egress isolation and the two-peer mistake, and test connections.')}

<h2>Patterns that work</h2>
<ol>
<li><b>Default deny in every namespace</b>, created by the platform when the namespace is created (a namespace template, or a policy engine generating it, Chapter 17).</li>
<li><b>Allow DNS egress</b> to the cluster DNS Pods from everything.</li>
<li><b>Per-application ingress</b> from its known callers, by label, on its ports.</li>
<li><b>Egress to external systems</b> by IP block, or by DNS name where the CNI supports it.</li>
<li><b>Test it</b>: a policy that is never tested is a policy that is wrong. Tools such as Cilium's policy editor, Calico's policy recommendations, and connectivity checks in CI help.</li>
</ol>
<p>Use the automatic <code>kubernetes.io/metadata.name</code> label to select namespaces by name; it is set on every namespace and cannot be forged by a tenant who can only label their own namespace with other keys. Do not rely on labels that tenants can set on their own namespaces for security decisions.</p>

<h2>Beyond the core API</h2>
<div class="tbl"><table><tr><th>Need</th><th>Core NetworkPolicy</th><th>Where to get it</th></tr>
<tr><td>Cluster-wide guardrails that tenants cannot override</td><td>No: namespaced and allow-only</td><td>Cilium <code>CiliumClusterwideNetworkPolicy</code>, Calico <code>GlobalNetworkPolicy</code> with tiers; the SIG Network policy API project defines <code>ClusterNetworkPolicy</code> (<code>policy.networking.k8s.io/v1beta1</code>, an out-of-tree CRD): an Admin tier that NetworkPolicy cannot override and a Baseline tier that it can, with priorities and Accept, Deny and Pass actions. Check whether your CNI implements it</td></tr>
<tr><td>Egress by DNS name (<code>api.partner-bank.com</code>)</td><td>No: IP blocks only</td><td>Cilium <code>toFQDNs</code>, Calico DNS policy, egress gateways, a mesh egress gateway</td></tr>
<tr><td>Layer 7: allow GET /orders, deny DELETE</td><td>No</td><td>Cilium L7 policy, mesh authorisation policies (Istio AuthorizationPolicy)</td></tr>
<tr><td>Identity-based rules (service account, SPIFFE ID)</td><td>No: labels and IPs</td><td>Meshes with mTLS, Cilium identities</td></tr>
<tr><td>Flow logs for audit</td><td>No</td><td>Hubble, Calico flow logs, cloud VPC flow logs</td></tr>
</table></div>

<h3>Sharp edges in NetworkPolicy semantics</h3>
<ul>
<li><b>Policies see Pod IPs, after Service translation.</b> Allowing a Service's ClusterIP in an <code>ipBlock</code> does nothing; select the backing Pods with a Pod or namespace selector.</li>
<li><b>Source addresses may not be the client's.</b> Traffic through a LoadBalancer with <code>externalTrafficPolicy: Cluster</code>, or through an ingress proxy or mesh gateway, arrives with a node or proxy address, so client-IP allow-lists in <code>ipBlock</code> do not work there; use <code>externalTrafficPolicy: Local</code> or enforce at the proxy.</li>
<li><b>Existing connections</b>: whether a new policy cuts connections that are already open is implementation-defined. Test it with your CNI before relying on it in an incident.</li>
<li><b>Port ranges</b> use <code>endPort</code> (stable since 1.25) with <code>port</code> as the start.</li>
<li><b>The cloud metadata endpoint</b> (169.254.169.254) is the classic egress to deny for every tenant; with ClusterNetworkPolicy or your CNI's cluster-wide policy it becomes a guardrail tenants cannot override.</li>
</ul>

<h2>Encryption in transit</h2>
<p>NetworkPolicy controls who can connect, not whether traffic is readable on the wire. PCI DSS (Requirement 4) mandates strong cryptography for cardholder data over open, public networks; it does not require it on a private network, but many assessors and internal policies now expect it inside cloud VPCs and between clusters, and encrypting by default removes a scoping argument. Options: CNI-level encryption between nodes (WireGuard or IPsec in Cilium and Calico; some clouds encrypt VPC traffic transparently), a mesh with mTLS, or TLS in the application using pod certificates. CNI encryption is the cheapest to roll out; mTLS adds authentication of each workload.</p>

<h2>Zero trust, in Kubernetes terms</h2>
<p>"Never trust the network" translates to: every workload has an identity (service account, certificate), every connection is authenticated and authorised against that identity, least privilege is enforced by default deny, and everything is logged. NetworkPolicy is the coarse first layer; identity-aware authorisation and encryption complete it.</p>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Egress default deny without a DNS rule</strong>: everything breaks with confusing name-resolution errors.</li>
<li><strong>The two-dash OR</strong> turning a scoped rule into a cluster-wide one.</li>
<li><strong>Selecting on namespace labels tenants control.</strong></li>
<li><strong>Forgetting the kubelet</strong>: probes come from the node; most plugins allow node-to-Pod traffic, but check yours.</li>
<li><strong>Assuming policy applies to hostNetwork Pods</strong>: usually it does not.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Is it isolated?</summary><p>A namespace has one policy: podSelector app=db, policyTypes [Ingress], ingress from app=api. Can web reach api? Can web reach db? Can db reach the internet?</p><p><em>Answer:</em> yes (api is not selected by any policy); no (db is isolated for ingress and only api is allowed); yes (no policy isolates db's egress).</p></details>
<details><summary>Spot the bug</summary><p><code>from: [{namespaceSelector: {}}, {podSelector: {matchLabels: {app: web}}}]</code>. What does it allow?</p><p><em>Answer:</em> every Pod in every namespace (the first peer), plus web Pods in this namespace. It was probably meant as one element: web Pods in any namespace.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Lock down a namespace</summary><p>Install a policy-capable CNI in kind, deploy web, api and db, apply default deny plus the minimal allows, and prove with <code>kubectl exec … -- nc -zv</code> that only the intended paths work, including DNS.</p><p><em>Answer:</em> permitted pairs connect; others time out; nslookup works only after the DNS egress rule.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Guardrails tenants cannot remove</summary><p>With Cilium or Calico, write a cluster-wide policy that denies all Pods egress to the cloud metadata endpoint (169.254.169.254) except those in a <code>node-agents</code> namespace, and show that a tenant's own allow-all policy does not override it.</p><p><em>Answer:</em> cluster-scoped deny policies in a higher tier or with explicit deny are evaluated before namespaced allows; the tenant's NetworkPolicy cannot re-open the path.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can explain isolation, additivity and the two-sided check of NetworkPolicy.</li>
<li>I can write default-deny policies with the necessary DNS and monitoring exceptions.</li>
<li>I can avoid the AND/OR selector trap and selectors tenants control.</li>
<li>I know when to use cluster-wide, FQDN, layer-7 and identity-based policies, and how to encrypt traffic in transit.</li>
</ul>
`});

  resources: {requests: {storage: 200Gi}}`}
<ul>
<li>A <b>PersistentVolumeClaim</b> (PVC) is a namespaced request: size, access mode, class.</li>
<li>A <b>PersistentVolume</b> (PV) is a cluster-scoped piece of storage. With dynamic provisioning, the driver creates one per claim.</li>
<li>A <b>StorageClass</b> names a provisioner and its parameters (disk type, encryption, IOPS), the binding mode, expansion and reclaim policy.</li>
</ul>
<p><b>Access modes</b> describe how a volume may be mounted: <code>ReadWriteOnce</code> (read-write by one node, so several Pods on that node can share it), <code>ReadWriteOncePod</code> (one Pod, stable since 1.29, the safe choice for single-writer databases), <code>ReadOnlyMany</code> and <code>ReadWriteMany</code> (many nodes; needs file storage).</p>
${fig('pvcbind', '<b>Figure 15.1</b> Step through: dynamic provisioning with WaitForFirstConsumer, from claim to mounted volume.')}
${fig('stor', '<b>Figure 15.2</b> Interactive: kinds of storage and what each is good for.')}

<h2>The Container Storage Interface</h2>
<p>Storage vendors ship <b>CSI drivers</b>, gRPC services with three parts: an Identity service, a <b>Controller</b> service (create, delete, attach, snapshot, expand volumes; runs as a Deployment) and a <b>Node</b> service (stage and publish mounts; runs as a DaemonSet). Kubernetes-maintained sidecars translate API objects into CSI calls: external-provisioner, external-attacher, external-resizer, external-snapshotter, and node-driver-registrar. All in-tree cloud volume plugins have been migrated to CSI; the last, Portworx, completed in 1.36.</p>

<h2>Day-two operations</h2>
<div class="tbl"><table><tr><th>Operation</th><th>How</th><th>Status</th></tr>
<tr><td>Expand a volume</td><td>Edit the PVC's requested size; the resizer and kubelet grow the disk and file system, usually online. If the backend rejects the new size you can now retry with a smaller one</td><td>Expansion stable; recovery from failure stable since 1.34</td></tr>
<tr><td>Change performance</td><td>Point the PVC at another <code>VolumeAttributesClass</code> (IOPS, throughput) without recreating it</td><td>Stable since 1.34; needs driver support</td></tr>
<tr><td>Snapshot</td><td><code>VolumeSnapshot</code> with a <code>VolumeSnapshotClass</code>; restore by creating a PVC with <code>dataSource</code></td><td>Stable</td></tr>
<tr><td>Consistent multi-volume snapshot</td><td><code>VolumeGroupSnapshot</code> selecting PVCs by label (data and log volumes of one database)</td><td>Stable since 1.36</td></tr>
<tr><td>Clone or pre-populate</td><td><code>dataSource</code> or <code>dataSourceRef</code> to another PVC, a snapshot, or a custom populator</td><td>Stable</td></tr>
<tr><td>Find unused volumes</td><td>PVCs report when they were last used and get an <code>Unused</code> condition</td><td>Beta (on) in 1.37</td></tr>
</table></div>
${Y('Snapshot and restore')`
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata: {name: ledger-2026-11-07, namespace: payments}
spec:
  volumeSnapshotClassName: ebs-snap
  source: {persistentVolumeClaimName: ledger-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ledger-restore, namespace: payments}
spec:
  storageClassName: gp3-encrypted
  accessModes: [ReadWriteOncePod]
  resources: {requests: {storage: 200Gi}}
  dataSource: {apiGroup: snapshot.storage.k8s.io, kind: VolumeSnapshot, name: ledger-2026-11-07}`}
<p>A note on SELinux: since 1.37 the kubelet labels volumes at mount time (<code>mount -o context=…</code>) by default for drivers that declare support, instead of relabelling every file. It is much faster on large volumes, but Pods with different SELinux labels can no longer share such a volume on one node; set <code>seLinuxChangePolicy: Recursive</code> on Pods that need the old behaviour.</p>

<h3>When the node holding a volume dies</h3>
<p>The classic stateful outage combines Chapter 6 and this chapter. A node stops responding; after the 300-second toleration its StatefulSet Pod is marked for deletion but stays Terminating, because no kubelet confirms it stopped; its ReadWriteOnce volume is still attached to the dead node, so even a forced replacement reports <code>Multi-Attach error for volume … Volume is already exclusively attached to one node</code>. The attach/detach controller force-detaches only after six minutes (<code>maxWaitForUnmountDuration</code>) and only for nodes known to be shut down. Once you are certain the node is off, taint it <code>node.kubernetes.io/out-of-service=nodeshutdown:NoExecute</code> (non-graceful node shutdown, stable since 1.28): its Pods are force-deleted and volumes detached immediately. Remove the taint when the node returns, and never apply it to a node that might still be writing.</p>
<ul>
<li><b>Retention</b>: a StatefulSet's <code>persistentVolumeClaimRetentionPolicy</code> (<code>whenDeleted</code>, <code>whenScaled</code>: Retain or Delete) decides whether scaling down or deleting it deletes data. Retain is the safe default for anything like a ledger.</li>
<li><b>Large volumes</b>: set <code>fsGroupChangePolicy: OnRootMismatch</code> so the kubelet does not walk and change ownership of every file at each mount, which can take many minutes on big volumes.</li>
<li><b>Scheduling inputs</b>: storage capacity tracking lets the scheduler avoid nodes whose topology has no room left, and per-node attach limits (reported by CSI drivers) cap how many volumes a node may mount; both explain otherwise mysterious Pending Pods.</li>
</ul>

<h2>Running stateful systems</h2>
<p>Kubernetes can run databases well, but the hard parts are not storage mechanics. They are replication, failover, backups, upgrades and recovery, which is application knowledge. Use a mature <b>operator</b> (CloudNativePG for PostgreSQL, Strimzi for Kafka, and others) that encodes it, or a managed database service outside the cluster. Either way:</p>
<ul>
<li>Back up at the application level (logical or physical backups to object storage), not only volume snapshots, and test restores.</li>
<li>Use <code>ReadWriteOncePod</code> and <code>Retain</code> for primary data; never <code>Delete</code> reclaim on irreplaceable data.</li>
<li>Spread replicas across zones; remember a zonal disk ties its Pod to the zone.</li>
<li>Back up cluster objects too (Velero or your GitOps repository), so you can recreate claims, secrets and operators after a disaster.</li>
</ul>

<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Immediate binding with zonal disks</strong>: volumes created in a zone where the Pod cannot run.</li>
<li><strong>reclaimPolicy: Delete on important data</strong>: deleting a namespace deletes the disks.</li>
<li><strong>RWO when you meant RWOP</strong>: two Pods on the same node write one file system.</li>
<li><strong>hostPath volumes</strong> in application Pods.</li>
<li><strong>Snapshots treated as backups</strong>: they usually live in the same account and region, with the same failure modes and the same attackers.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">
<div class="lvl e"><h4>Foundation</h4>
<details><summary>Pending PVC</summary><p>A PVC has been Pending for ten minutes. What are the likely causes?</p><p><em>Answer:</em> WaitForFirstConsumer with no Pod using it yet (normal); no default StorageClass and none named; the provisioner is not running or lacks permissions; the cloud account's volume or IOPS limits are exhausted (ProvisioningFailed events; a Kubernetes ResourceQuota would have rejected the PVC outright instead); the requested access mode is not supported by the driver. <code>kubectl describe pvc</code> shows events.</p></details>
<details><summary>Choose an access mode</summary><p>A single-primary PostgreSQL data volume; a shared directory of uploaded documents read by 20 web Pods.</p><p><em>Answer:</em> ReadWriteOncePod on block storage; ReadWriteMany (or better, object storage via the SDK) for the shared documents.</p></details></div>
<div class="lvl md"><h4>Applied</h4>
<details><summary>Snapshot round trip</summary><p>Install the CSI hostpath driver with snapshot support in kind, write data to a PVC, snapshot it, delete the data, restore into a new PVC, and verify.</p><p><em>Answer:</em> the restored PVC contains the data as of the snapshot; <code>readyToUse: true</code> on the snapshot before you restore.</p></details></div>
<div class="lvl h"><h4>Deeper</h4>
<details><summary>Zone failure drill</summary><p>Run a 3-replica StatefulSet on zonal disks across three zones. Cordon and drain every node in one zone. What happens to the replica in that zone, and how would an operator handle it differently from the StatefulSet alone?</p><p><em>Answer:</em> the Pod cannot move because its disk is zonal; it stays Pending until the zone returns. An operator can declare the replica lost, create a new replica with a fresh volume in another zone, and rebuild it from its peers or a backup.</p></details></div>
</div>

<h2>Checkpoint</h2>
<ul class="check">
<li>I can choose between ephemeral and persistent volume types.</li>
<li>I can write StorageClasses and PVCs with the right binding mode, access mode and reclaim policy.</li>
<li>I can explain the CSI controller and node services and the sidecars.</li>
<li>I can expand, modify, snapshot, group-snapshot and restore volumes, and I back up at the application level.</li>
</ul>
`});
