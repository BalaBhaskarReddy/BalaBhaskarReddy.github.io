FIG.roundtrip = host => {
  const N = { A: { x: 60, y: 290 }, B: { x: 280, y: 40 }, C: { x: 500, y: 290 }, D: { x: 280, y: 196 } };
  const T = [['A', 'B', 2, '9,500'], ['B', 'C', 3, '9,400'], ['B', 'D', 1, '9,800'], ['C', 'A', 5, '9,300'], ['C', 'D', 6, '9,350'], ['D', 'A', 10, '9,200']];
  const E = T.map(([a, b, t, amt]) => [a, b, `t${t} · ${amt}`]);
  const out = {}; T.forEach(([a, b, t]) => (out[a] = out[a] || []).push({ to: b, t }));
  const WIN = 6, HOPS = 4, start = 'A', F = [], path = [start], found = [];
  const first = out[start][0], deadline = first.t + WIN;
  const snap = (o) => F.push({ path: [...path], found: [...found], ...o });
  snap({ note: `Look for round trips that start at A. A's first transfer is A→B at t${first.t}, and the window is ${WIN}, so the loop must close by t${deadline}. At most ${HOPS} transfers.` });
  path.push(first.to);
  snap({ e: { [start + '-' + first.to]: 'acc' }, note: `Follow A→B at t${first.t}. The money is now at B, having arrived at t${first.t}.` });
  const walk = (u, tIn, hops) => {
    (out[u] || []).forEach(e => {
      const k = u + '-' + e.to;
      if (e.t <= tIn) { snap({ e: { [k]: 'cmp' }, note: `${u}→${e.to} at t${e.t} happened before the money reached ${u} at t${tIn}, so it cannot carry it on. Skip.` }); return; }
      if (e.t > deadline) { snap({ e: { [k]: 'cmp' }, note: `${u}→${e.to} at t${e.t} is after the deadline t${deadline}. Skip.` }); return; }
      if (e.to === start) {
        found.push([...path, start].join('→'));
        const cyc = {}; for (let i = 0; i < path.length; i++) cyc[path[i] + '-' + (path[i + 1] || start)] = 'ok';
        snap({ e: cyc, ok: true, note: `${u}→A at t${e.t} is later than t${tIn} and brings the money back to A: round trip ${[...path, start].join(' → ')} found, ${path.length} transfers inside the window.` });
        return;
      }
      if (path.includes(e.to) || hops === 1) { snap({ e: { [k]: 'cmp' }, note: path.includes(e.to) ? `${e.to} is already on the path. Skip.` : `Hop limit reached. Skip.` }); return; }
      path.push(e.to);
      snap({ e: { [k]: 'acc' }, note: `${u}→${e.to} at t${e.t} is later than t${tIn} and before t${deadline}: follow it. The money is now at ${e.to}.` });
      walk(e.to, e.t, hops - 1);
      path.pop();
    });
  };
  walk(first.to, first.t, HOPS - 1);
  path.pop();
  snap({ note: `Done: one round trip from A. The full search repeats this from every account and every first transfer. Notice the amounts: each hop passes on slightly less, a pattern an amount filter can test as well.` });
  stepper(host, F, f => {
    const ns = {}, es = {};
    for (let i = 0; i + 1 < f.path.length; i++) es[f.path[i] + '-' + f.path[i + 1]] = 'acc';
    f.path.forEach(v => ns[v] = 'acc');
    Object.assign(es, f.e || {});
    if (f.ok) f.path.forEach(v => ns[v] = 'ok');
    const g = graph(N, E, { dir: true, ns, es, r: 21, w: 560, h: 320 });
    return { s: g.s + chips(0, 326, 'path', f.path, { cls: 'acc', lw: 56 }) + chips(0, 362, 'found', f.found, { cls: 'ok', lw: 56, empty: 'none yet' }), w: 560, h: 394 };
  }, { speed: 1500, legend: '<span class="l-acc">current path</span><span class="l-cmp">transfer rejected</span><span class="l-ok">round trip found</span>' });
};

CH.push({
  id: 'ch09', n: 9, title: 'Graph Algorithms',
  lede: 'A graph is the most general way to model relationships: roads between cities, links between web pages, dependencies between build steps, payments between accounts. This chapter covers how to store graphs and the core algorithms that explore them, order them, find shortest paths through them and connect them cheaply.',
  html: `
<h2>What a graph is</h2>
<p>A <strong>graph</strong> G = (V, E) is a set of <strong>vertices</strong> (also called nodes) and a set of <strong>edges</strong>, each connecting two vertices. Trees and linked lists are special cases: a tree is a connected graph with no cycles, and a list is a tree in which every node has at most one child.</p>
${fig('gtypes', '<b>Figure 9.1</b> Four common kinds of graph.')}
<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Undirected / directed</td><td>In an undirected graph an edge {u, v} works both ways. In a directed graph (digraph) an edge (u, v) goes only from u to v.</td></tr>
<tr><td>Weighted</td><td>Each edge carries a number: a distance, a cost, a latency, an amount.</td></tr>
<tr><td>Adjacent, neighbour</td><td>v is adjacent to u if there is an edge from u to v.</td></tr>
<tr><td>Degree</td><td>Number of edges at a vertex. Directed graphs distinguish in-degree and out-degree.</td></tr>
<tr><td>Path, cycle</td><td>A path is a sequence of vertices joined by edges. A cycle is a path that returns to its start.</td></tr>
<tr><td>Connected</td><td>An undirected graph is connected if every vertex can reach every other. Its maximal connected pieces are its <em>connected components</em>.</td></tr>
<tr><td>DAG</td><td>A directed acyclic graph: directed, with no cycles. Dependency graphs are DAGs.</td></tr>
<tr><td>Sparse / dense</td><td>Sparse graphs have E close to V; dense graphs have E close to V². Most real graphs are sparse.</td></tr>
</table></div>
<p>The input size of a graph problem has two parts, V and E, and costs are written in terms of both, such as O(V + E).</p>

<h2>Representing a graph</h2>
${fig('reprs', '<b>Figure 9.2</b> One undirected graph stored three ways.')}
<h3>Adjacency matrix</h3>
<p>A V × V grid where <code>m[u][v]</code> is 1 (or the edge weight) if there is an edge from u to v. Checking whether an edge exists is O(1). But the matrix always uses O(V²) memory, and listing a vertex's neighbours costs O(V) even if it has only two. Use it for small or dense graphs, and for algorithms like Floyd-Warshall that touch every pair anyway.</p>
<h3>Adjacency list</h3>
<p>For each vertex, a list of its neighbours. It uses O(V + E) memory, and iterating over a vertex's neighbours costs exactly its degree. This is the default representation for almost every algorithm in this chapter.</p>
<h3>Edge list</h3>
<p>Simply a list of (u, v, weight) triples. It is compact and natural for algorithms that process edges in some order rather than exploring from a vertex: Kruskal sorts the edges, and Bellman-Ford repeatedly scans them.</p>
${code('Building an adjacency list')`
// Vertices numbered 0..n-1. For an undirected graph, add each edge in both directions.
static List<List<Integer>> build(int n, int[][] edges, boolean directed) {
  List<List<Integer>> g = new ArrayList<>();
  for (int i = 0; i < n; i++) g.add(new ArrayList<>());
  for (int[] e : edges) {
    g.get(e[0]).add(e[1]);
    if (!directed) g.get(e[1]).add(e[0]);
  }
  return g;
}

// Weighted version: each neighbour entry is {to, weight}.
static List<List<int[]>> buildWeighted(int n, int[][] edges) {
  List<List<int[]>> g = new ArrayList<>();
  for (int i = 0; i < n; i++) g.add(new ArrayList<>());
  for (int[] e : edges) g.get(e[0]).add(new int[]{e[1], e[2]});
  return g;
}`}
${rs('adjacency.rs')`
// Vertices numbered 0..n-1. For an undirected graph, add each edge in both directions.
fn build(n: usize, edges: &[(usize, usize)], directed: bool) -> Vec<Vec<usize>> {
    let mut g = vec![Vec::new(); n];
    for &(u, v) in edges {
        g[u].push(v);
        if !directed { g[v].push(u); }
    }
    g
}

// Weighted version: each neighbour entry is (to, weight).
fn build_weighted(n: usize, edges: &[(usize, usize, u64)]) -> Vec<Vec<(usize, u64)>> {
    let mut g = vec![Vec::new(); n];
    for &(u, v, w) in edges { g[u].push((v, w)); }
    g
}`}
<p>When vertices are strings or objects, use <code>Map&lt;String, List&lt;String&gt;&gt;</code>. Grids are implicit graphs: cell (r, c) has up to four neighbours, and you generate them on the fly instead of storing edges.</p>
<div class="note key"><b>Graphs in Rust</b><p>A graph with cycles cannot be built from <code>Box</code> links, because a vertex reachable from two others would need two owners. <code>Rc&lt;RefCell&lt;Node&gt;&gt;</code> can express shared, mutable vertices, but every access is checked at run time and a cycle of <code>Rc</code> links is never freed unless some links are <code>Weak</code>. The idiomatic answer is the one used throughout this chapter: number the vertices and store the graph as <code>Vec&lt;Vec&lt;usize&gt;&gt;</code> (or <code>Vec&lt;Vec&lt;(usize, u64)&gt;&gt;</code> with weights). Indices are plain numbers, so the borrow checker has nothing to object to, the lists sit compactly in memory, and per-vertex data (distances, colours, parents) lives in parallel <code>Vec</code>s. Graph libraries such as petgraph work the same way. To use names, map each one to an index once with a <code>HashMap&lt;String, usize&gt;</code>.</p></div>
<div class="tbl"><table><tr><th>Operation</th><th>Matrix</th><th>Adjacency list</th><th>Edge list</th></tr>
<tr><td>Memory</td><td class="num">O(V²)</td><td class="num">O(V + E)</td><td class="num">O(E)</td></tr>
<tr><td>Is (u, v) an edge?</td><td class="num">O(1)</td><td class="num">O(deg u)</td><td class="num">O(E)</td></tr>
<tr><td>List neighbours of u</td><td class="num">O(V)</td><td class="num">O(deg u)</td><td class="num">O(E)</td></tr>
<tr><td>Visit every edge</td><td class="num">O(V²)</td><td class="num">O(V + E)</td><td class="num">O(E)</td></tr>
</table></div>

<h2>Breadth-first search</h2>
<p><strong>Breadth-first search</strong> (BFS) explores a graph in rings around a source vertex: first the source, then all vertices one edge away, then all vertices two edges away, and so on. A queue enforces this order, because vertices discovered earlier are processed earlier.</p>
${fig('bfs', '<b>Figure 9.3</b> BFS from A. The label above each node is its distance in edges. The queue always holds a slice of at most two consecutive distances.')}
${code('BFS.java')`
static int[] bfs(List<List<Integer>> g, int src) {
  int[] dist = new int[g.size()];
  Arrays.fill(dist, -1);                 // -1 means "not discovered"
  Deque<Integer> q = new ArrayDeque<>();
  dist[src] = 0; q.offer(src);
  while (!q.isEmpty()) {
    int u = q.poll();
    for (int v : g.get(u)) {
      if (dist[v] == -1) {               // first time we see v
        dist[v] = dist[u] + 1;
        q.offer(v);
      }
    }
  }
  return dist;
}`}
${rs('bfs.rs')`
fn bfs(g: &[Vec<usize>], src: usize) -> Vec<Option<usize>> {
    let mut dist = vec![None; g.len()];          // None means "not discovered"
    let mut q = VecDeque::from([(src, 0)]);      // (vertex, its distance)
    dist[src] = Some(0);
    while let Some((u, d)) = q.pop_front() {
        for &v in &g[u] {
            if dist[v].is_none() {               // first time we see v
                dist[v] = Some(d + 1);
                q.push_back((v, d + 1));
            }
        }
    }
    dist
}`}
<p>Every vertex is enqueued once and every edge examined once (twice for undirected graphs), so BFS is O(V + E). The most important property: <strong>in an unweighted graph, BFS finds shortest paths</strong>. A vertex is first discovered from a vertex one ring closer, so its distance is set correctly the first time. Record each vertex's parent and you can rebuild the path by walking back from the target; the transaction-network section below does exactly that. The Rust version stores <code>Option&lt;usize&gt;</code> distances instead of −1 and keeps each vertex's distance next to it in the queue.</p>
<div class="note key"><b>Mark when you enqueue</b><p>Mark a vertex as discovered at the moment you add it to the queue, not when you remove it. Otherwise the same vertex can be added many times by different neighbours, which wastes work and, in dense graphs, memory.</p></div>

<h2>Depth-first search</h2>
<p><strong>Depth-first search</strong> (DFS) goes as deep as possible along one path before backing up, exactly like the backtracking of Chapter 2. It is usually written recursively, using the call stack, or iteratively with an explicit stack.</p>
${fig('dfs', '<b>Figure 9.4</b> DFS from A. Each node shows discovery time / finish time. The blue edges form the DFS tree.')}
${code('DFS.java')`
static int time = 0;
static void dfs(List<List<Integer>> g, int u, boolean[] seen, int[] disc, int[] fin) {
  seen[u] = true;
  disc[u] = ++time;                       // discovery time
  for (int v : g.get(u))
    if (!seen[v]) dfs(g, v, seen, disc, fin);
  fin[u] = ++time;                        // finish time: all descendants are done
}

// Visit every vertex, even in a disconnected graph.
static void dfsAll(List<List<Integer>> g) {
  boolean[] seen = new boolean[g.size()];
  int[] disc = new int[g.size()], fin = new int[g.size()];
  for (int u = 0; u < g.size(); u++) if (!seen[u]) dfs(g, u, seen, disc, fin);
}`}
${rs('dfs.rs')`
struct Dfs<'g> {
    g: &'g [Vec<usize>],
    time: u32,
    disc: Vec<u32>,                     // discovery times; 0 means "not seen yet"
    fin: Vec<u32>,                      // finish times
}

impl Dfs<'_> {
    fn visit(&mut self, u: usize) {
        self.time += 1;
        self.disc[u] = self.time;       // discovery time
        let g = self.g;                 // copy the shared reference, so the loop does not borrow self
        for &v in &g[u] {
            if self.disc[v] == 0 { self.visit(v); }
        }
        self.time += 1;
        self.fin[u] = self.time;        // finish time: all descendants are done
    }
}

// Visit every vertex, even in a disconnected graph.
fn dfs_all(g: &[Vec<usize>]) -> (Vec<u32>, Vec<u32>) {
    let mut s = Dfs { g, time: 0, disc: vec![0; g.len()], fin: vec![0; g.len()] };
    for u in 0..g.len() {
        if s.disc[u] == 0 { s.visit(u); }
    }
    (s.disc, s.fin)
}`}
<p>DFS is also O(V + E). It does not find shortest paths, but its discovery and finish times reveal the structure of the graph: a vertex's descendants in the DFS tree are exactly those discovered after it and finished before it. Cycle detection, topological sorting, strongly connected components and bridges all build on this.</p>
<p>The Rust DFS keeps its state in a struct instead of static fields. One line deserves a comment: <code>let g = self.g;</code> copies the shared reference to the graph, so the loop over <code>g[u]</code> does not hold a borrow of <code>self</code> while the recursive call needs <code>&amp;mut self</code>.</p>
<h3>BFS or DFS?</h3>
<ul>
<li>Shortest path in an unweighted graph, or "minimum number of steps": <strong>BFS</strong>.</li>
<li>Exploring everything reachable, counting components, flood fill: either works.</li>
<li>Cycles, ordering, structure (topological sort, SCCs, bridges): <strong>DFS</strong>.</li>
<li>Very deep graphs (a long path of a million nodes): BFS or iterative DFS, to avoid stack overflow.</li>
</ul>

<h2>Uses of BFS and DFS</h2>
<h3>Connected components</h3>
<p>Run a traversal from every vertex not yet seen. Each run discovers one whole component. Counting the runs counts the components. For grids, this is the classic "number of islands" problem.</p>
<h3>Bipartite check</h3>
<p>A graph is <strong>bipartite</strong> if its vertices can be coloured with two colours so that every edge joins different colours. Colour the source 0, and colour each newly discovered neighbour the opposite of its parent. If you ever find an edge between two vertices of the same colour, the graph is not bipartite. Equivalently, a graph is bipartite exactly when it has no odd-length cycle.</p>
<h3>Cycle detection</h3>
<p>In an <strong>undirected</strong> graph, a cycle exists if DFS reaches an already-visited vertex that is not the parent it just came from. (Union-find from Chapter 8 is another option.)</p>
<p>In a <strong>directed</strong> graph that rule is wrong, because reaching a finished vertex through a different route is not a cycle. Use three colours: white (unvisited), grey (on the current DFS path) and black (finished). A cycle exists exactly when DFS finds an edge into a <em>grey</em> vertex, an edge back to an ancestor on the current path.</p>
${code('Directed cycle detection')`
// color: 0 = white (unvisited), 1 = grey (on the current path), 2 = black (finished)
static boolean hasCycle(List<List<Integer>> g, int u, int[] color) {
  color[u] = 1;
  for (int v : g.get(u)) {
    if (color[v] == 1) return true;                         // back edge: cycle
    if (color[v] == 0 && hasCycle(g, v, color)) return true;
  }
  color[u] = 2;
  return false;
}`}
${rs('cycle.rs')`
#[derive(Clone, Copy, PartialEq)]
enum Color { White, Grey, Black }       // unvisited, on the current path, finished

fn has_cycle(g: &[Vec<usize>], u: usize, color: &mut [Color]) -> bool {
    color[u] = Color::Grey;
    for &v in &g[u] {
        if color[v] == Color::Grey { return true; }                             // back edge: cycle
        if color[v] == Color::White && has_cycle(g, v, color) { return true; }
    }
    color[u] = Color::Black;
    false
}`}

<h2>Topological sort</h2>
<p>A <strong>topological order</strong> of a DAG lists the vertices so that every edge goes from an earlier vertex to a later one. If the edges mean "must happen before", a topological order is a valid schedule. Build systems order compilation steps this way, package managers order installs, spreadsheets order recalculations, and infrastructure tools such as Terraform order resource creation.</p>
<h3>Kahn's algorithm</h3>
<p>A vertex with no incoming edges has no unmet dependencies, so it can go first. Remove it and its outgoing edges; that may free up other vertices. Repeat.</p>
${fig('topo', '<b>Figure 9.5</b> Kahn\'s algorithm ordering cloud resources. Each label shows the remaining in-degree.')}
${code('Kahn.java')`
static List<Integer> topoSort(List<List<Integer>> g) {
  int n = g.size();
  int[] indeg = new int[n];
  for (List<Integer> out : g) for (int v : out) indeg[v]++;
  Deque<Integer> q = new ArrayDeque<>();
  for (int i = 0; i < n; i++) if (indeg[i] == 0) q.offer(i);
  List<Integer> order = new ArrayList<>();
  while (!q.isEmpty()) {
    int u = q.poll();
    order.add(u);
    for (int v : g.get(u)) if (--indeg[v] == 0) q.offer(v);
  }
  if (order.size() < n) throw new IllegalStateException("cycle detected");   // some vertices never freed
  return order;
}`}
${rs('kahn.rs')`
fn topo_sort(g: &[Vec<usize>]) -> Result<Vec<usize>, &'static str> {
    let n = g.len();
    let mut indeg = vec![0; n];
    for &v in g.iter().flatten() { indeg[v] += 1; }
    let mut q: VecDeque<usize> = (0..n).filter(|&i| indeg[i] == 0).collect();
    let mut order = Vec::with_capacity(n);
    while let Some(u) = q.pop_front() {
        order.push(u);
        for &v in &g[u] {
            indeg[v] -= 1;
            if indeg[v] == 0 { q.push_back(v); }
        }
    }
    if order.len() < n { return Err("cycle detected"); }      // some vertices never freed
    Ok(order)
}`}
<p>Kahn's algorithm doubles as a cycle detector: if a cycle exists, the vertices on it never reach in-degree 0, so the output is shorter than V. Replacing the queue with a priority queue gives the lexicographically smallest order.</p>
<h3>The DFS method</h3>
<p>Run DFS over the whole graph and record each vertex when it <em>finishes</em>. Reversing that list gives a topological order, because a vertex finishes only after everything it points to has finished.</p>

<h2>Strongly connected components</h2>
<p>In a directed graph, two vertices are <strong>strongly connected</strong> if each can reach the other. The graph splits into <strong>strongly connected components</strong> (SCCs): maximal groups in which every vertex can reach every other. Shrinking each SCC to a single vertex always leaves a DAG.</p>
${fig('scc', '<b>Figure 9.6</b> A directed graph with three strongly connected components. Edges between components only ever go one way.')}
<p><strong>Kosaraju's algorithm</strong> finds them with two DFS passes:</p>
<ol>
<li>Run DFS on the whole graph and push each vertex onto a stack when it finishes.</li>
<li>Reverse every edge.</li>
<li>Pop vertices off the stack. For each one not yet assigned, run DFS on the reversed graph; every vertex it reaches is one SCC.</li>
</ol>
<p>The vertex that finishes last belongs to a "source" component. In the reversed graph, that component cannot escape into any other, so the second DFS collects exactly one component at a time. <strong>Tarjan's algorithm</strong> finds the same components in one DFS using "low-link" values. Both are O(V + E). In a payments graph, a non-trivial SCC is a set of accounts through which money can circulate, which is a common pattern to investigate (see the applied section below).</p>
<p>The version below follows the three steps but replaces both recursive searches with explicit stacks, because payment and dependency graphs can contain paths far longer than the call stack allows. The first pass keeps, for each vertex on the stack, the index of the next edge to try, so a vertex is popped, and finishes, only after all its edges are done. The second pass may use any traversal.</p>
${code('Kosaraju.java')`
/** comp[v] = number of v's strongly connected component (Kosaraju, without recursion). */
static int[] scc(List<List<Integer>> g) {
  int n = g.size();
  // Pass 1: DFS on g, recording vertices in the order they finish.
  int[] next = new int[n];                   // next[u] = index of the next edge of u to try
  boolean[] seen = new boolean[n];
  List<Integer> finished = new ArrayList<>(n);
  Deque<Integer> st = new ArrayDeque<>();
  for (int s = 0; s < n; s++) {
    if (seen[s]) continue;
    seen[s] = true; st.push(s);
    while (!st.isEmpty()) {
      int u = st.peek();
      if (next[u] < g.get(u).size()) {
        int v = g.get(u).get(next[u]++);
        if (!seen[v]) { seen[v] = true; st.push(v); }
      } else {
        st.pop(); finished.add(u);           // all edges of u done: u finishes
      }
    }
  }
  // Pass 2: on the reversed graph, latest finisher first.
  List<List<Integer>> rev = new ArrayList<>();
  for (int i = 0; i < n; i++) rev.add(new ArrayList<>());
  for (int u = 0; u < n; u++) for (int v : g.get(u)) rev.get(v).add(u);
  int[] comp = new int[n];
  Arrays.fill(comp, -1);
  int c = 0;
  for (int i = n - 1; i >= 0; i--) {
    int s = finished.get(i);
    if (comp[s] != -1) continue;
    comp[s] = c; st.push(s);
    while (!st.isEmpty()) {                  // any traversal works here
      int u = st.pop();
      for (int v : rev.get(u)) if (comp[v] == -1) { comp[v] = c; st.push(v); }
    }
    c++;
  }
  return comp;
}`}
${rs('kosaraju.rs')`
// comp[v] = number of v's strongly connected component (Kosaraju, without recursion).
fn scc(g: &[Vec<usize>]) -> Vec<usize> {
    let n = g.len();
    // Pass 1: DFS on g, recording vertices in the order they finish.
    let mut next = vec![0; n];                  // next[u] = index of the next edge of u to try
    let mut seen = vec![false; n];
    let mut finished = Vec::with_capacity(n);
    for s in 0..n {
        if seen[s] { continue; }
        seen[s] = true;
        let mut st = vec![s];
        while let Some(&u) = st.last() {
            if let Some(&v) = g[u].get(next[u]) {
                next[u] += 1;
                if !seen[v] { seen[v] = true; st.push(v); }
            } else {
                st.pop();
                finished.push(u);               // all edges of u done: u finishes
            }
        }
    }
    // Pass 2: on the reversed graph, latest finisher first.
    let mut rev = vec![Vec::new(); n];
    for (u, out) in g.iter().enumerate() {
        for &v in out { rev[v].push(u); }
    }
    let mut comp = vec![None; n];
    let mut c = 0;
    for &s in finished.iter().rev() {
        if comp[s].is_some() { continue; }
        comp[s] = Some(c);
        let mut st = vec![s];
        while let Some(u) = st.pop() {          // any traversal works here
            for &v in &rev[u] {
                if comp[v].is_none() { comp[v] = Some(c); st.push(v); }
            }
        }
        c += 1;
    }
    comp.into_iter().map(|c| c.expect("every vertex is assigned")).collect()
}`}
<p>Component numbers come out in topological order of the condensed DAG: component 0 is a source, and every edge between components goes from a lower number to a higher one. Because neither pass recurses, a cycle of a million vertices is no problem.</p>

<h2>Shortest paths in weighted graphs</h2>
<p>When edges have weights, the shortest path is the one with the smallest total weight, not the fewest edges. BFS no longer works. The core operation of every weighted shortest-path algorithm is <strong>relaxation</strong>:</p>
<div class="formula">relax(u, v, w):   if dist[u] + w < dist[v]  then  dist[v] = dist[u] + w;  parent[v] = u</div>
<p>It asks: is going through u a better way to reach v than the best way found so far? The algorithms differ only in which edges they relax and in what order.</p>
<h3>Dijkstra's algorithm</h3>
<p>Dijkstra's algorithm works when all weights are non-negative. It grows a set of <em>settled</em> vertices whose shortest distances are known. At each step it settles the unsettled vertex with the smallest tentative distance, using a priority queue, and relaxes that vertex's outgoing edges.</p>
${fig('dijkstra', '<b>Figure 9.7</b> Dijkstra from A. Labels show tentative distances. Watch B improve from 4 to 3 and E from 12 to 10.')}
<p>Why is the popped distance final? Every other route to that vertex would have to leave the settled set through some unsettled vertex whose distance is already at least as large. With non-negative weights, continuing from there can only add cost. This argument fails as soon as an edge can be negative.</p>
${code('Dijkstra.java')`
static long[] dijkstra(List<List<int[]>> g, int src) {
  long[] dist = new long[g.size()];
  Arrays.fill(dist, Long.MAX_VALUE);
  dist[src] = 0;
  PriorityQueue<long[]> pq = new PriorityQueue<>(Comparator.comparingLong(e -> e[1]));   // {vertex, dist}
  pq.offer(new long[]{src, 0});
  while (!pq.isEmpty()) {
    long[] top = pq.poll();
    int u = (int) top[0];
    if (top[1] > dist[u]) continue;                 // stale entry: u was already settled
    for (int[] e : g.get(u)) {
      int v = e[0], w = e[1];
      if (dist[u] + w < dist[v]) {
        dist[v] = dist[u] + w;
        pq.offer(new long[]{v, dist[v]});            // push a new entry instead of decrease-key
      }
    }
  }
  return dist;
}`}
${rs('dijkstra.rs')`
// u64 weights: the type itself rules out the negative edges that break Dijkstra.
fn dijkstra(g: &[Vec<(usize, u64)>], src: usize) -> Vec<u64> {
    let mut dist = vec![u64::MAX; g.len()];
    dist[src] = 0;
    let mut pq = BinaryHeap::from([Reverse((0, src))]);    // (dist, vertex), smallest first
    while let Some(Reverse((d, u))) = pq.pop() {
        if d > dist[u] { continue; }                       // stale entry: u was already settled
        for &(v, w) in &g[u] {
            let nd = d + w;
            if nd < dist[v] {
                dist[v] = nd;
                pq.push(Reverse((nd, v)));                 // push a new entry instead of decrease-key
            }
        }
    }
    dist
}`}
<p>Java's <code>PriorityQueue</code> has no decrease-key operation, so the code pushes a fresh entry whenever a distance improves and ignores stale entries when they are popped. This "lazy deletion" keeps the total at O((V + E) log V). Chapter 7 shows the same trick and the indexed heap that avoids it. Rust's <code>BinaryHeap</code> has no decrease-key either; the Rust listing pushes <code>(distance, vertex)</code> pairs wrapped in <code>Reverse</code>, and its <code>u64</code> weights rule out negative edges at compile time.</p>
${fig('negedge', '<b>Figure 9.8</b> With a negative edge, Dijkstra settles C at 2 before discovering the cheaper route A→B→C of cost 1.')}
<h3>Bellman-Ford</h3>
<p>Bellman-Ford handles negative weights. It relaxes <em>every</em> edge, then does it again, V − 1 times in total. A shortest path uses at most V − 1 edges, and after pass k, every shortest path with at most k edges has been found.</p>
${fig('bellman', '<b>Figure 9.9</b> Bellman-Ford on a graph with a negative edge. Each pass relaxes all four edges in the same order.')}
${code('BellmanFord.java')`
static long[] bellmanFord(int n, int[][] edges, int src) {       // edges: {u, v, w}
  long INF = Long.MAX_VALUE / 4;
  long[] d = new long[n];
  Arrays.fill(d, INF);
  d[src] = 0;
  for (int pass = 1; pass < n; pass++) {
    boolean changed = false;
    for (int[] e : edges)
      if (d[e[0]] != INF && d[e[0]] + e[2] < d[e[1]]) { d[e[1]] = d[e[0]] + e[2]; changed = true; }
    if (!changed) break;                                         // already optimal
  }
  for (int[] e : edges)                                          // one more pass: any improvement means a negative cycle
    if (d[e[0]] != INF && d[e[0]] + e[2] < d[e[1]]) throw new IllegalStateException("negative cycle");
  return d;
}`}
${rs('bellman_ford.rs')`
// The distance v would get through edge (u, v, w), if that improves on d[v].
fn better(d: &[Option<i64>], (u, v, w): (usize, usize, i64)) -> Option<i64> {
    let nd = d[u]? + w;                     // None is "infinity": no sentinel value to overflow
    d[v].is_none_or(|dv| nd < dv).then_some(nd)
}

fn bellman_ford(n: usize, edges: &[(usize, usize, i64)], src: usize) -> Result<Vec<Option<i64>>, &'static str> {
    let mut d = vec![None; n];
    d[src] = Some(0);
    for _pass in 1..n {
        let mut changed = false;
        for &e in edges {
            if let Some(nd) = better(&d, e) { d[e.1] = Some(nd); changed = true; }
        }
        if !changed { break; }                                   // already optimal
    }
    if edges.iter().any(|&e| better(&d, e).is_some()) {         // one more pass: any improvement means a negative cycle
        return Err("negative cycle");
    }
    Ok(d)
}`}
<p>If a V-th pass can still improve some distance, the graph has a <strong>negative cycle</strong>: going around it again and again lowers the cost without limit, so no shortest path exists. This check has a classic financial use. Take currency exchange rates as edge weights of −log(rate). A cycle of conversions that ends with more money than it started with has a product of rates greater than 1, which is a negative sum of weights. Bellman-Ford detects such an arbitrage loop. Its cost is O(V · E). The Rust version represents "not reached yet" as <code>None</code> rather than a large sentinel, so there is no infinity to overflow, and <code>better</code> returns the improved distance only when there is one.</p>
<h3>Floyd-Warshall</h3>
<p>To find shortest paths between <em>every</em> pair of vertices, Floyd-Warshall uses dynamic programming. Let dist[i][j] be the best path from i to j using only intermediate vertices from {0, …, k−1}. Allowing vertex k as well gives:</p>
<div class="formula">dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])</div>
${code('FloydWarshall.java')`
static final long INF = Long.MAX_VALUE / 4;     // "no edge"

static void floyd(long[][] d) {            // d[i][j] = edge weight, or INF; d[i][i] = 0
  int n = d.length;
  for (int k = 0; k < n; k++)              // k must be the OUTER loop
    for (int i = 0; i < n; i++) {
      if (d[i][k] == INF) continue;        // no path i -> k: nothing to improve
      for (int j = 0; j < n; j++)
        if (d[k][j] != INF && d[i][k] + d[k][j] < d[i][j]) d[i][j] = d[i][k] + d[k][j];
    }
}`}
${rs('floyd_warshall.rs')`
// d[i][j] = Some(edge weight) or None for "no edge"; d[i][i] = Some(0).
fn floyd(d: &mut [Vec<Option<i64>>]) {
    for k in 0..d.len() {                               // k must be the OUTER loop
        let via_k = d[k].clone();                       // row k as it was before this round
        for row in d.iter_mut() {                       // row = d[i] for every i
            let Some(ik) = row[k] else { continue };    // no path i -> k: nothing to improve
            for (ij, &kj) in row.iter_mut().zip(&via_k) {
                if let Some(kj) = kj && ij.is_none_or(|x| ik + kj < x) { *ij = Some(ik + kj); }
            }
        }
    }
}`}
<p>It is O(V³) time and O(V²) space: practical for a few hundred vertices. It handles negative edges, and a negative value on the diagonal afterwards signals a negative cycle.</p>
<p>The two checks against <code>INF</code> matter. With <code>INF = Long.MAX_VALUE</code>, <code>d[i][k] + d[k][j]</code> overflows to a large negative number and corrupts every entry. With a smaller <code>INF</code>, a negative edge still turns "unreachable" into <code>INF − 5</code>, which no longer equals <code>INF</code> and so looks like a real distance. Skipping unreachable entries avoids both. The Rust version uses <code>None</code> for "no path" and updates from a copy of row k taken at the start of each round, which is exactly the recurrence above.</p>

<h2>Minimum spanning trees</h2>
<p>A <strong>spanning tree</strong> of a connected undirected graph is a subset of edges that connects every vertex with no cycles; it always has exactly V − 1 edges. A <strong>minimum spanning tree</strong> (MST) is a spanning tree with the smallest total weight. It answers questions like "what is the cheapest way to connect all these offices with network links?"</p>
<p>Both classic MST algorithms are greedy (Chapter 17), and both rely on the <strong>cut property</strong>: for any way of splitting the vertices into two groups, the lightest edge crossing between the groups belongs to some MST.</p>
<h3>Kruskal's algorithm</h3>
<p>Sort all edges by weight. Go through them from lightest to heaviest and add each one unless it would create a cycle, which union-find detects in effectively constant time.</p>
${fig('kruskal', '<b>Figure 9.10</b> Kruskal\'s algorithm. Edges are considered lightest first; an edge is skipped when its endpoints are already connected.')}
${code('Kruskal.java')`
static long kruskal(int n, int[][] edges) {                 // edges: {u, v, w}
  Arrays.sort(edges, Comparator.comparingInt(e -> e[2]));
  DSU dsu = new DSU(n);                                     // from Chapter 8
  long total = 0; int used = 0;
  for (int[] e : edges) {
    if (dsu.union(e[0], e[1])) {                            // false means it would form a cycle
      total += e[2];
      if (++used == n - 1) break;                           // tree complete
    }
  }
  return total;
}`}
${rs('kruskal.rs')`
fn kruskal(n: usize, edges: &mut [(usize, usize, u64)]) -> u64 {
    edges.sort_unstable_by_key(|&(_, _, w)| w);
    let mut dsu = Dsu::new(n);                      // from Chapter 8
    let (mut total, mut used) = (0, 0);
    for &(u, v, w) in edges.iter() {
        if dsu.union(u, v) {                        // false means it would form a cycle
            total += w;
            used += 1;
            if used == n - 1 { break; }             // tree complete
        }
    }
    total
}`}
<p>Sorting dominates: O(E log E). If the graph is not connected, the loop never reaches V − 1 edges and the result is the weight of a minimum spanning <em>forest</em>, one tree per component.</p>
<h3>Prim's algorithm</h3>
<p>Prim grows a single tree from a starting vertex. At each step it adds the cheapest edge connecting the tree to a vertex outside it, using a priority queue of candidate edges. It looks very much like Dijkstra, except that the priority of a vertex is the weight of the single edge that would attach it, not the total distance from the source. With a binary heap it runs in O(E log V). For dense graphs, where E is close to V², a simpler version wins: keep the cheapest known attaching edge of every outside vertex in a plain array and scan it for the minimum at each step, O(V²) in total with no heap at all.</p>
${code('Prim.java')`
static long prim(List<List<int[]>> g) {                  // undirected, weighted
  boolean[] inTree = new boolean[g.size()];
  PriorityQueue<int[]> pq = new PriorityQueue<>(Comparator.comparingInt(e -> e[1]));   // {vertex, edgeWeight}
  pq.offer(new int[]{0, 0});
  long total = 0;
  while (!pq.isEmpty()) {
    int[] top = pq.poll();
    if (inTree[top[0]]) continue;
    inTree[top[0]] = true;
    total += top[1];
    for (int[] e : g.get(top[0])) if (!inTree[e[0]]) pq.offer(new int[]{e[0], e[1]});
  }
  return total;
}`}
${rs('prim.rs')`
fn prim(g: &[Vec<(usize, u64)>]) -> u64 {                // undirected, weighted
    let mut in_tree = vec![false; g.len()];
    let mut pq = BinaryHeap::from([Reverse((0, 0))]);      // (edge weight, vertex), lightest first
    let mut total = 0;
    while let Some(Reverse((w, u))) = pq.pop() {
        if in_tree[u] { continue; }
        in_tree[u] = true;
        total += w;
        for &(v, wv) in &g[u] {
            if !in_tree[v] { pq.push(Reverse((wv, v))); }
        }
    }
    total
}`}
<p>Prim only reaches the component of its start vertex; on a disconnected graph, check that every vertex ended up in the tree.</p>

<h2>Applied: analysing a transaction network</h2>
<p>A payments ledger is a directed graph. Accounts are vertices, and every transfer is an edge from payer to payee that carries an amount and a timestamp. Many money-laundering typologies are shapes in this graph, so the algorithms in this chapter become screening tools.</p>
<div class="tbl"><table><tr><th>Pattern</th><th>In the graph</th><th>Tool</th></tr>
<tr><td>Collection (smurfing)</td><td>many small payments converging on one account</td><td>in-degree and amount over a sliding window (Chapter 5)</td></tr>
<tr><td>Distribution</td><td>one account fanning out to many</td><td>out-degree over a sliding window</td></tr>
<tr><td>Exposure</td><td>a short path from a sanctioned or flagged account</td><td>multi-source BFS with a hop limit</td></tr>
<tr><td>Round-tripping</td><td>money returning to where it started</td><td>SCCs to find candidates, then a time-ordered cycle search</td></tr>
<tr><td>Shared control</td><td>accounts linked by devices, phones or cards</td><td>union-find with hub filtering (Chapter 8)</td></tr>
</table></div>
<h3>Exposure: hops to a flagged account</h3>
<p>To measure how close every account is to a set of flagged accounts, do not run one BFS per flagged account. Put all of them in the queue at distance 0 and run a single <strong>multi-source BFS</strong>. BFS settles vertices in order of distance, so each account is first reached from its nearest flagged account, and one O(V + E) pass gives every account's distance to the whole set. The <code>via</code> links give the chain of accounts an investigator needs. A hop limit keeps the search local: risk fades with distance, and in a large payment graph almost everything is reachable within a few hops.</p>
${code('Exposure.java')`
record Exposure(int[] hops, int[] via) {}   // hops: fewest transfers from a flagged account (-1: not exposed)
                                             // via: the previous account on one such chain (-1: none)

static Exposure exposure(List<List<Integer>> g, int[] flagged, int maxHops) {
  int n = g.size();
  int[] hops = new int[n], via = new int[n];
  Arrays.fill(hops, -1); Arrays.fill(via, -1);
  Deque<Integer> q = new ArrayDeque<>();
  for (int f : flagged)
    if (hops[f] == -1) { hops[f] = 0; q.offer(f); }         // all sources start together
  while (!q.isEmpty()) {
    int u = q.poll();
    if (hops[u] == maxHops) continue;                       // do not look further out
    for (int v : g.get(u))
      if (hops[v] == -1) { hops[v] = hops[u] + 1; via[v] = u; q.offer(v); }
  }
  return new Exposure(hops, via);
}

/** The chain of accounts from the nearest flagged account to v (empty if v is not exposed). */
static List<Integer> chain(Exposure e, int v) {
  List<Integer> path = new ArrayList<>();
  if (e.hops()[v] == -1) return path;
  for (int x = v; x != -1; x = e.via()[x]) path.add(x);
  return path.reversed();                                    // Java 21: a reversed view
}`}
${rs('exposure.rs')`
struct Exposure {
    hops: Vec<Option<u32>>,     // fewest transfers from any flagged account (None: not exposed)
    via: Vec<Option<usize>>,    // the previous account on one such chain
}

fn exposure(g: &[Vec<usize>], flagged: &[usize], max_hops: u32) -> Exposure {
    let n = g.len();
    let mut e = Exposure { hops: vec![None; n], via: vec![None; n] };
    let mut q = VecDeque::new();
    for &f in flagged {
        if e.hops[f].is_none() { e.hops[f] = Some(0); q.push_back((f, 0)); }   // all sources start together
    }
    while let Some((u, h)) = q.pop_front() {
        if h == max_hops { continue; }                      // do not look further out
        for &v in &g[u] {
            if e.hops[v].is_none() {
                e.hops[v] = Some(h + 1);
                e.via[v] = Some(u);
                q.push_back((v, h + 1));
            }
        }
    }
    e
}

// The chain of accounts from the nearest flagged account to v (empty if v is not exposed).
fn chain(e: &Exposure, v: usize) -> Vec<usize> {
    if e.hops[v].is_none() { return Vec::new(); }
    let mut path: Vec<usize> = std::iter::successors(Some(v), |&x| e.via[x]).collect();
    path.reverse();
    path
}`}
<p>In the sample network (transfers 0→1, 1→2, 2→3, 3→1, 2→4, 4→5, 5→8, 8→9, 6→7, 7→6, with account 0 flagged and a limit of 3), account 4 is three transfers away through 0 → 1 → 2 → 4, and account 5, four away, is outside the limit. Following edges forwards finds where flagged money went. To find who paid <em>into</em> flagged accounts, run the same code on the reversed graph.</p>
<h3>Where money can circulate</h3>
<p>Money can only go round a loop inside a strongly connected component. Computing SCCs once, in O(V + E) with the Kosaraju code above, is therefore a cheap filter: accounts that form a component on their own cannot be on any cycle and need no cycle search. In the sample network the components with more than one account are {1, 2, 3} and {6, 7}. In a real payment graph, hubs such as payment processors, exchanges, payroll providers and large merchants link so much together that most active accounts fall into one giant component. Remove known hubs, or restrict the graph to a time window, before computing components.</p>
<h3>Round trips in time order</h3>
<p>A cycle in the graph is not yet a round trip. Transfers A→B in March and B→A in January form a cycle, but no money went round it. A round trip needs a <strong>time-respecting cycle</strong>: every transfer happens after the one before it, and the whole loop closes within a window. The search is a depth-first search from each account that only follows transfers later than the one the money arrived by, stops at a deadline set by the first transfer, and limits the number of hops. Each round trip is found once, from its earliest transfer, because starting the same loop anywhere else would break the time order.</p>
${fig('roundtrip', '<b>Figure 9.11</b> Searching for round trips from A with a window of 6 and at most 4 transfers. Edge labels give the time and amount of each transfer. Only transfers later than the money\'s arrival, and before the deadline, are followed.')}
${code('RoundTrips.java')`
import java.util.*;

/** Every simple cycle start -> ... -> start whose transfers happen in strictly increasing time,
    all within window of the first transfer, using at most maxHops transfers. */
class RoundTrips {
  record Transfer(int to, long time) {}

  static List<List<Integer>> find(List<List<Transfer>> g, long window, int maxHops) {
    RoundTrips s = new RoundTrips(g);
    for (s.start = 0; s.start < g.size(); s.start++)
      for (Transfer first : g.get(s.start)) {         // the cycle's earliest transfer leaves start
        s.deadline = first.time() + window;
        s.path.add(s.start); s.onPath[s.start] = true;
        s.step(first, maxHops - 1);
        s.path.remove(s.path.size() - 1); s.onPath[s.start] = false;
      }
    return s.found;
  }

  private final List<List<Transfer>> g;
  private final boolean[] onPath;
  private final List<Integer> path = new ArrayList<>();
  private final List<List<Integer>> found = new ArrayList<>();
  private int start;
  private long deadline;

  private RoundTrips(List<List<Transfer>> g) { this.g = g; onPath = new boolean[g.size()]; }

  /** Follow transfer t, then any later transfer, until the money is back at start. */
  private void step(Transfer t, int hopsLeft) {
    if (t.to() == start) {
      List<Integer> cycle = new ArrayList<>(path);
      cycle.add(start);
      found.add(cycle);
      return;
    }
    if (onPath[t.to()] || hopsLeft == 0) return;
    path.add(t.to()); onPath[t.to()] = true;
    for (Transfer next : g.get(t.to()))
      if (next.time() > t.time() && next.time() <= deadline) step(next, hopsLeft - 1);
    path.remove(path.size() - 1); onPath[t.to()] = false;
  }
}`}
${rs('round_trips.rs')`
#[derive(Clone, Copy)]
struct Transfer { to: usize, time: u64 }

// Every simple cycle start -> ... -> start whose transfers happen in strictly increasing time,
// all within window of the first transfer, using at most max_hops transfers.
fn round_trips(g: &[Vec<Transfer>], window: u64, max_hops: usize) -> Vec<Vec<usize>> {
    assert!(max_hops >= 1);
    let mut s = Search { g, start: 0, deadline: 0, on_path: vec![false; g.len()], path: vec![], found: vec![] };
    for (start, out) in g.iter().enumerate() {
        s.start = start;
        for &first in out {                         // the cycle's earliest transfer leaves start
            s.deadline = first.time + window;
            s.path.push(start);
            s.on_path[start] = true;
            s.step(first, max_hops - 1);
            s.path.pop();
            s.on_path[start] = false;
        }
    }
    s.found
}

struct Search<'g> {
    g: &'g [Vec<Transfer>],
    start: usize,
    deadline: u64,
    on_path: Vec<bool>,
    path: Vec<usize>,
    found: Vec<Vec<usize>>,
}

impl Search<'_> {
    // Follow transfer t, then any later transfer, until the money is back at start.
    fn step(&mut self, t: Transfer, hops_left: usize) {
        if t.to == self.start {
            let mut cycle = self.path.clone();
            cycle.push(self.start);
            self.found.push(cycle);
            return;
        }
        if self.on_path[t.to] || hops_left == 0 { return; }
        self.path.push(t.to);
        self.on_path[t.to] = true;
        let g = self.g;                             // copy the shared reference, as in the DFS listing
        for &next in &g[t.to] {
            if next.time > t.time && next.time <= self.deadline { self.step(next, hops_left - 1); }
        }
        self.path.pop();
        self.on_path[t.to] = false;
    }
}`}
<p>On the network of Figure 9.11 the search reports A → B → C → A. With a window of 10 it also reports the four-transfer loop A → B → C → D → A; with a window of 10 but at most 3 transfers, only the first loop again. The number of simple paths grows exponentially with their length, so the hop limit and the window are what make the search practical: with limits of a few hops and hours to days, each search explores a small neighbourhood. If each account's transfers are sorted by time, the loop can stop at the first transfer past the deadline. An amount filter (each hop passing on most of what it received) prunes further and sharpens the alerts. Run the search only inside the SCCs found above.</p>
<p>These searches produce leads, not conclusions. Legitimate businesses also move money in loops, for example in treasury sweeps between their own accounts and in refunds, so production systems combine graph patterns with customer data, thresholds and investigator review, and record the path that triggered each alert.</p>

<h2>Choosing an algorithm</h2>
<div class="tbl"><table><tr><th>Question</th><th>Algorithm</th><th>Time</th><th>Notes</th></tr>
<tr><td>Fewest edges from a source</td><td>BFS</td><td class="num">O(V + E)</td><td>unweighted graphs and grids</td></tr>
<tr><td>Reachability, components, flood fill</td><td>BFS or DFS</td><td class="num">O(V + E)</td><td>or union-find for incremental edges</td></tr>
<tr><td>Dependency order</td><td>Kahn or DFS finish order</td><td class="num">O(V + E)</td><td>DAG only; detects cycles</td></tr>
<tr><td>Cycles in a directed graph</td><td>DFS with three colours</td><td class="num">O(V + E)</td><td></td></tr>
<tr><td>Strongly connected components</td><td>Kosaraju or Tarjan</td><td class="num">O(V + E)</td><td></td></tr>
<tr><td>Shortest paths, weights ≥ 0</td><td>Dijkstra</td><td class="num">O((V + E) log V)</td><td>the workhorse</td></tr>
<tr><td>Shortest paths, negative weights</td><td>Bellman-Ford</td><td class="num">O(V · E)</td><td>detects negative cycles</td></tr>
<tr><td>All-pairs shortest paths</td><td>Floyd-Warshall</td><td class="num">O(V³)</td><td>small graphs</td></tr>
<tr><td>Cheapest way to connect everything</td><td>Kruskal or Prim</td><td class="num">O(E log V)</td><td>undirected graphs</td></tr>
<tr><td>Distance from a set of sources</td><td>multi-source BFS</td><td class="num">O(V + E)</td><td>exposure to flagged accounts</td></tr>
<tr><td>Time-ordered cycles</td><td>bounded DFS</td><td class="num">O(dᵏ)</td><td>d = out-degree, k = hop limit: keep k and the window small</td></tr>
</table></div>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Marking visited too late in BFS.</strong> Mark on enqueue.</li>
<li><strong>Using Dijkstra with negative edges.</strong> It silently returns wrong answers. Use Bellman-Ford.</li>
<li><strong>Overflow from "infinity plus weight".</strong> Use <code>Long.MAX_VALUE / 4</code> and check for infinity before adding. In Rust, overflow panics in debug builds and wraps silently in release builds; represent infinity as <code>None</code>, or use <code>checked_add</code> or <code>saturating_add</code>.</li>
<li><strong>Forgetting disconnected graphs.</strong> Start a traversal from every unvisited vertex.</li>
<li><strong>Applying the undirected cycle test to a directed graph.</strong> Use the grey-vertex test.</li>
<li><strong>Floyd-Warshall loop order.</strong> The intermediate vertex k must be the outermost loop.</li>
<li><strong>Recursion depth.</strong> DFS on a path of 10⁵ vertices overflows the default stack; use an explicit stack, as the Kosaraju listing does. Rust has the same limit: spawned threads get 2 MiB of stack by default, and an overflow aborts the whole process.</li>
<li><strong>Treating every cycle as a round trip.</strong> In a transaction graph, a cycle only matters if its transfers happen in time order.</li>
</ul></div>

const SORT_IN = [7, 3, 9, 2, 6, 1, 8, 4, 5];
function sortFrames(kind) {
  const a = [...SORT_IN], n = a.length, F = [], done = new Set();
  const P = (st, note, extra = {}) => { const s = { ...st }; done.forEach(i => { if (!s[i]) s[i] = 'ok'; }); F.push({ a: [...a], st: s, note, ...extra }); };
  const sw = (i, j) => { [a[i], a[j]] = [a[j], a[i]]; };
  P({}, 'The unsorted input.');
  if (kind === 'bubble') {
    for (let end = n - 1; end > 0; end--) {
      let swapped = false;
      for (let j = 0; j < end; j++) {
        if (a[j] > a[j + 1]) { sw(j, j + 1); swapped = true; P({ [j]: 'hot', [j + 1]: 'hot' }, `${a[j + 1]} > ${a[j]}: swap them, so the larger value moves right.`); }
        else P({ [j]: 'cmp', [j + 1]: 'cmp' }, `${a[j]} ≤ ${a[j + 1]}: already in order.`);
      }
      done.add(end); P({}, `End of pass: ${a[end]} has bubbled to its final position.`);
      if (!swapped) { for (let k = 0; k < end; k++) done.add(k); P({}, 'A whole pass with no swaps means the array is sorted. Stop early.'); break; }
    }
    done.add(0);
  } else if (kind === 'selection') {
    for (let i = 0; i < n - 1; i++) {
      let m = i;
      for (let j = i + 1; j < n; j++) { if (a[j] < a[m]) m = j; }
      P({ [m]: 'acc', [i]: 'cmp' }, `Scan positions ${i}..${n - 1}: the smallest is ${a[m]} at index ${m}.`, { marks: [{ i, label: 'i' }, { i: m, label: 'min', cls: 'hot', row: m === i ? 1 : 0 }] });
      sw(i, m); done.add(i); P({ [i]: 'hot' }, `Swap it into position ${i}. The prefix 0..${i} is now final.`);
    }
    done.add(n - 1);
  } else if (kind === 'insertion') {
    done.add(0);
    for (let i = 1; i < n; i++) {
      const key = a[i]; let j = i - 1;
      P({ [i]: 'acc' }, `Take ${key}. Everything to its left is already sorted (among themselves).`, { marks: [{ i, label: 'key' }] });
      while (j >= 0 && a[j] > key) { a[j + 1] = a[j]; j--; P({ [j + 1]: 'cmp', [j + 2]: 'hot' }, `${a[j + 2]} > ${key}: shift it one place right.`); a[j + 1] = key; F[F.length - 1].a[j + 1] = key; }
      a[j + 1] = key; for (let k = 0; k <= i; k++) done.add(k);
      P({ [j + 1]: 'hot' }, `Insert ${key} at index ${j + 1}. Positions 0..${i} are sorted.`);
    }
  } else if (kind === 'merge') {
    const tmp = [];
    (function ms(lo, hi) {
      if (hi - lo < 2) return; const mid = (lo + hi) >> 1; ms(lo, mid); ms(mid, hi);
      for (let k = lo; k < hi; k++) tmp[k] = a[k];
      P({}, `Merge the sorted halves [${lo}..${mid - 1}] and [${mid}..${hi - 1}].`, { range: [lo, hi - 1] });
      let i = lo, j = mid;
      for (let k = lo; k < hi; k++) { const fromL = j >= hi || (i < mid && tmp[i] <= tmp[j]); a[k] = fromL ? tmp[i++] : tmp[j++]; }
      P(Object.fromEntries([...Array(hi - lo)].map((_, q) => [lo + q, 'hot'])), `Merged: positions ${lo}..${hi - 1} now hold ${a.slice(lo, hi).join(', ')}.`, { range: [lo, hi - 1] });
    })(0, n);
    for (let k = 0; k < n; k++) done.add(k);
  } else if (kind === 'quick') {
    (function qs(lo, hi) {
      if (lo > hi) return; if (lo === hi) { done.add(lo); return; }
      const p = a[hi]; let i = lo;
      P({ [hi]: 'cmp' }, `Partition [${lo}..${hi}] around the pivot ${p} (the last element).`, { range: [lo, hi] });
      for (let j = lo; j < hi; j++) {
        if (a[j] < p) { sw(i, j); P({ [hi]: 'cmp', [i]: 'hot', [j]: 'hot' }, `${a[i]} < ${p}: move it into the "smaller" region at index ${i}.`, { range: [lo, hi], marks: [{ i: i + 1, label: 'i' }, { i: j, label: 'j', cls: 'hot', row: 1 }] }); i++; }
      }
      sw(i, hi); done.add(i); P({ [i]: 'hot' }, `Place the pivot ${p} at index ${i}. Everything left of it is smaller, everything right is larger. It is in its final place.`, { range: [lo, hi] });
      qs(lo, i - 1); qs(i + 1, hi);
    })(0, n - 1);
  } else if (kind === 'heap') {
    const sink = (i, m) => { while (2 * i + 1 < m) { let c = 2 * i + 1; if (c + 1 < m && a[c + 1] > a[c]) c++; if (a[i] >= a[c]) break; sw(i, c); i = c; } };
    for (let i = (n >> 1) - 1; i >= 0; i--) sink(i, n);
    P({ 0: 'acc' }, 'Build a max-heap in place (Chapter 7). The largest value, 9, is now at index 0.');
    for (let end = n - 1; end > 0; end--) { sw(0, end); done.add(end); P({ [end]: 'hot' }, `Swap the maximum ${a[end]} to the end of the heap region. It is final.`); sink(0, end); P({ 0: 'acc' }, `Sift the new root down. The heap now covers 0..${end - 1}, and its maximum is ${a[0]}.`, { range: [0, end - 1] }); }
    done.add(0);
  }
  P({}, 'Sorted.');
  return F;
}

  html: `
<h2>Why sorting matters</h2>
<p>Many problems become simple once the data is sorted. Duplicates sit next to each other. The closest pair of values are neighbours. Binary search (Chapter 11) finds any value in O(log n). Two sorted lists can be merged or intersected in one linear pass. A huge number of algorithms start with "first, sort the input", so the cost of sorting often sets the cost of the whole solution.</p>
<p>Sorting algorithms are also the best place to practise the ideas from earlier chapters: loop invariants, recursion, divide and conquer, heaps and the analysis of best, worst and average cases.</p>

<h2>Properties to compare</h2>
<div class="tbl"><table><tr><th>Property</th><th>Meaning</th><th>Why it matters</th></tr>
<tr><td>Time</td><td>best, average and worst case</td><td>Worst case is the guarantee; best case tells you about nearly sorted data.</td></tr>
<tr><td>In place</td><td>uses only O(1) or O(log n) extra memory</td><td>Matters for large arrays and memory-constrained systems.</td></tr>
<tr><td>Stable</td><td>equal keys keep their original relative order</td><td>Lets you sort by one key and then by another without losing the first order.</td></tr>
<tr><td>Adaptive</td><td>runs faster when the input is already partly sorted</td><td>Real data is often nearly sorted: appended logs, re-sorted lists.</td></tr>
<tr><td>Comparison-based</td><td>only learns about keys by comparing pairs</td><td>Comparison sorts work on anything with an ordering but cannot beat O(n log n).</td></tr>
</table></div>

<h2>Watch them run</h2>
<p>Every algorithm in this chapter sorts the same nine values below. Switch between them and step through; the differences in strategy are easier to see than to describe.</p>
${fig('sortviz', '<b>Figure 10.1</b> Six sorting algorithms on the same input. Bar height is the value; green marks elements that have reached their final position.')}

<h2>The quadratic sorts</h2>
<p>These three are simple, in place and O(n²) in the worst case. They are too slow for large inputs, but insertion sort in particular is still used inside faster algorithms for small subarrays.</p>
<h3>Bubble sort</h3>
<p>Walk through the array comparing each adjacent pair and swap them if they are out of order. After one pass, the largest element has "bubbled" to the end. Repeat on the remaining unsorted prefix. If a pass makes no swaps, the array is sorted and you can stop.</p>
${code('Bubble sort')`
static void bubbleSort(int[] a) {
  for (int end = a.length - 1; end > 0; end--) {
    boolean swapped = false;
    for (int j = 0; j < end; j++)
      if (a[j] > a[j + 1]) { swap(a, j, j + 1); swapped = true; }
    if (!swapped) return;          // already sorted: best case O(n)
  }
}`}
${rs('bubble_sort.rs')`
fn bubble_sort<T: Ord>(a: &mut [T]) {
    for end in (1..a.len()).rev() {
        let mut swapped = false;
        for j in 0..end {
            if a[j] > a[j + 1] { a.swap(j, j + 1); swapped = true; }
        }
        if !swapped { return; }           // already sorted: best case O(n)
    }
}
`}
<h3>Selection sort</h3>
<p>Find the smallest element and swap it into position 0. Find the smallest of the rest and swap it into position 1. Continue. It always does about n²/2 comparisons, even on sorted input, but it makes at most n − 1 swaps, which can matter when writes are expensive.</p>
${code('Selection sort')`
static void selectionSort(int[] a) {
  for (int i = 0; i < a.length - 1; i++) {
    int min = i;
    for (int j = i + 1; j < a.length; j++) if (a[j] < a[min]) min = j;
    swap(a, i, min);               // the swap can jump over equal keys: not stable
  }
}`}
${rs('selection_sort.rs')`
fn selection_sort<T: Ord>(a: &mut [T]) {
    for i in 0..a.len().saturating_sub(1) {
        let min = (i..a.len()).min_by_key(|&j| &a[j]).unwrap();   // the first smallest
        a.swap(i, min);                   // the swap can jump over equal keys: not stable
    }
}
`}
<h3>Insertion sort</h3>
<p>This is how most people sort a hand of cards. Keep a sorted prefix. Take the next element and shift larger elements of the prefix one place right until you find where it belongs, then drop it in.</p>
${code('Insertion sort')`
static void insertionSort(int[] a) {
  for (int i = 1; i < a.length; i++) {
    int key = a[i], j = i - 1;
    while (j >= 0 && a[j] > key) { a[j + 1] = a[j]; j--; }   // shift larger elements right
    a[j + 1] = key;
  }
}`}
${rs('insertion_sort.rs')`
fn insertion_sort<T: Ord>(a: &mut [T]) {
    for i in 1..a.len() {
        let mut j = i;
        while j > 0 && a[j - 1] > a[j] {  // swap the new element left past larger ones
            a.swap(j - 1, j);
            j -= 1;
        }
    }
}
`}
<p>Its work is proportional to the number of <em>inversions</em>, pairs that are out of order. On sorted input there are none and it runs in O(n). On nearly sorted input it is very fast. It is stable, in place and has tiny constant factors, which is why fast library sorts switch to it for subarrays of a few dozen elements. The Rust version swaps the new element leftwards instead of holding it in a variable, because a slice of a generic type cannot be left with a hole in it; it makes the same comparisons.</p>

<h2>Merge sort</h2>
<p>Merge sort is the standard example of divide and conquer. Split the array in half, sort each half recursively, and merge the two sorted halves into one. Merging two sorted sequences is easy: repeatedly take the smaller front element.</p>
${fig('mergetree', '<b>Figure 10.2</b> Merge sort on eight values. The array is split down to single elements, which are trivially sorted, and then merged back up.')}
${code('MergeSort.java')`
static void mergeSort(int[] a) { mergeSort(a, new int[a.length], 0, a.length); }

// Sorts a[lo..hi). tmp is shared scratch space so we allocate only once.
static void mergeSort(int[] a, int[] tmp, int lo, int hi) {
  if (hi - lo < 2) return;
  int mid = (lo + hi) >>> 1;
  mergeSort(a, tmp, lo, mid);
  mergeSort(a, tmp, mid, hi);
  if (a[mid - 1] <= a[mid]) return;           // halves already in order: skip the merge
  System.arraycopy(a, lo, tmp, lo, hi - lo);
  int i = lo, j = mid;
  for (int k = lo; k < hi; k++) {
    if (j >= hi || (i < mid && tmp[i] <= tmp[j])) a[k] = tmp[i++];   // <= keeps it stable
    else a[k] = tmp[j++];
  }
}`}
${rs('merge_sort.rs')`
fn merge_sort<T: Ord + Clone>(a: &mut [T]) {
    let mut tmp = a.to_vec();                  // scratch space, allocated once
    sort(a, &mut tmp);
}

// Sorts a; tmp is scratch space of the same length. Slices replace the lo and hi indices.
fn sort<T: Ord + Clone>(a: &mut [T], tmp: &mut [T]) {
    if a.len() < 2 { return; }
    let mid = a.len() / 2;
    sort(&mut a[..mid], &mut tmp[..mid]);
    sort(&mut a[mid..], &mut tmp[mid..]);
    if a[mid - 1] <= a[mid] { return; }        // halves already in order: skip the merge
    tmp.clone_from_slice(a);
    let (left, right) = tmp.split_at(mid);
    let (mut i, mut j) = (0, 0);
    for slot in a.iter_mut() {
        if j == right.len() || (i < left.len() && left[i] <= right[j]) {   // <= keeps it stable
            slot.clone_from(&left[i]); i += 1;
        } else {
            slot.clone_from(&right[j]); j += 1;
        }
    }
}
`}
<p>The recurrence is T(n) = 2T(n/2) + n, which the Master Theorem solves as Θ(n log n). Plain merge sort pays that on every input. The in-order check in the code above makes already sorted input linear, because each merge is then skipped after one comparison. The Rust version passes subslices instead of lo and hi indices, so there is no midpoint to overflow. Merge sort is stable (the <code>&lt;=</code> takes from the left half on ties). Its drawback is the O(n) extra array. On linked lists, merging needs no extra array, which makes merge sort the natural choice there. It is also the basis of <strong>external sorting</strong>: sort chunks that fit in memory, write them to disk, then do a k-way merge (Chapter 7).</p>

<h2>Quicksort</h2>
<p>Quicksort is also divide and conquer, but it does the hard work before recursing instead of after. Pick an element called the <strong>pivot</strong>. <strong>Partition</strong> the array so that everything smaller than the pivot comes before it and everything larger comes after it. The pivot is now in its final position. Recursively sort the two sides. No merge step is needed.</p>
${code('QuickSort.java')`
private static final Random RNG = new Random();

static void quickSort(int[] a, int lo, int hi) {        // sorts a[lo..hi], inclusive
  if (lo >= hi) return;
  swap(a, lo + RNG.nextInt(hi - lo + 1), hi);           // random pivot, moved to the end
  int p = partition(a, lo, hi);
  quickSort(a, lo, p - 1);
  quickSort(a, p + 1, hi);
}

// Lomuto partition. Invariant: a[lo..i-1] < pivot, a[i..j-1] >= pivot.
static int partition(int[] a, int lo, int hi) {
  int pivot = a[hi], i = lo;
  for (int j = lo; j < hi; j++)
    if (a[j] < pivot) swap(a, i++, j);
  swap(a, i, hi);                                       // pivot into its final place
  return i;
}`}
${rs('quick_sort.rs')`
// Rust's standard library has no random number generator; the rand crate is the usual choice.
fn quick_sort<T: Ord>(a: &mut [T]) {
    if a.len() < 2 { return; }
    let last = a.len() - 1;
    a.swap(rand::random_range(0..a.len()), last);   // random pivot, moved to the end
    let p = partition(a);
    quick_sort(&mut a[..p]);
    quick_sort(&mut a[p + 1..]);
}

// Lomuto partition around the last element. Invariant: a[..i] < pivot, a[i..j] >= pivot.
fn partition<T: Ord>(a: &mut [T]) -> usize {
    let last = a.len() - 1;
    let mut i = 0;
    for j in 0..last {
        if a[j] < a[last] { a.swap(i, j); i += 1; }
    }
    a.swap(i, last);                           // pivot into its final place
    i
}
`}
<p>When the pivot splits the array roughly in half, the recurrence is again T(n) = 2T(n/2) + n, giving O(n log n). When the pivot is always the smallest or largest element, one side is empty and the recurrence becomes T(n) = T(n − 1) + n, which is O(n²). With a fixed choice like "always the last element", that worst case happens on already sorted input, which is common. Choosing the pivot at random makes the worst case extremely unlikely on any input: the expected cost is about 1.39·n·log₂n comparisons.</p>
<p>Quicksort is in place (O(log n) stack on average; the code above can reach O(n) depth in its worst case, which recursing into the smaller side and looping on the larger one prevents), not stable, and in practice usually the fastest comparison sort for arrays of primitives, thanks to its tight inner loop and good cache behaviour.</p>
<h3>Partitioning with many duplicates</h3>
<p>If many keys are equal, Lomuto partitioning puts all of them on one side and degrades. <strong>Three-way partitioning</strong> (the Dutch national flag scheme) splits the range into three regions, less than, equal to and greater than the pivot, and recurses only on the outer two.</p>
${code('Three-way partition')`
static void quick3(int[] a, int lo, int hi) {
  if (lo >= hi) return;
  int lt = lo, gt = hi, i = lo + 1, v = a[lo];
  while (i <= gt) {
    if (a[i] < v) swap(a, lt++, i++);
    else if (a[i] > v) swap(a, i, gt--);
    else i++;
  }                                       // now a[lt..gt] == v
  quick3(a, lo, lt - 1);
  quick3(a, gt + 1, hi);
}`}
${rs('quick3.rs')`
use std::cmp::Ordering;

fn quick3<T: Ord + Clone>(a: &mut [T]) {
    if a.len() < 2 { return; }
    let v = a[0].clone();
    let (mut lt, mut i, mut gt) = (0, 1, a.len());   // gt is exclusive here: a[gt..] > v
    while i < gt {
        match a[i].cmp(&v) {
            Ordering::Less => { a.swap(lt, i); lt += 1; i += 1; }
            Ordering::Greater => { gt -= 1; a.swap(i, gt); }
            Ordering::Equal => i += 1,
        }
    }                                          // now a[lt..gt] == v
    quick3(&mut a[..lt]);
    quick3(&mut a[gt..]);
}
`}

<h2>Heapsort</h2>
<p>Heapsort uses the max-heap from Chapter 7. Rearrange the array into a max-heap in O(n). The largest element is at index 0; swap it with the last element, shrink the heap by one and sift the new root down. Repeat until the heap is empty.</p>
${code('HeapSort.java')`
static void heapSort(int[] a) {
  int n = a.length;
  for (int i = n / 2 - 1; i >= 0; i--) sink(a, i, n);   // build a max-heap
  for (int end = n - 1; end > 0; end--) {
    swap(a, 0, end);                                    // maximum to its final place
    sink(a, 0, end);                                    // restore the heap on a[0..end)
  }
}
static void sink(int[] a, int i, int n) {
  while (2 * i + 1 < n) {
    int c = 2 * i + 1;
    if (c + 1 < n && a[c + 1] > a[c]) c++;
    if (a[i] >= a[c]) return;
    swap(a, i, c); i = c;
  }
}`}
${rs('heap_sort.rs')`
fn heap_sort<T: Ord>(a: &mut [T]) {
    for i in (0..a.len() / 2).rev() { sink(a, i); }   // build a max-heap
    for end in (1..a.len()).rev() {
        a.swap(0, end);                        // maximum to its final place
        sink(&mut a[..end], 0);                // restore the heap on a[..end]
    }
}

fn sink<T: Ord>(a: &mut [T], mut i: usize) {
    let n = a.len();
    while 2 * i + 1 < n {
        let mut c = 2 * i + 1;
        if c + 1 < n && a[c + 1] > a[c] { c += 1; }
        if a[i] >= a[c] { return; }
        a.swap(i, c);
        i = c;
    }
}
`}
<p>Heapsort is O(n log n) in the worst case and uses O(1) extra space, a combination neither merge sort nor quicksort offers. It is not stable and its memory access pattern jumps around, so it is usually slower than quicksort. Introsort, used by many C++ libraries, starts with quicksort and switches to heapsort if recursion gets too deep, which guarantees O(n log n). Java's sort for primitive arrays and Rust's <code>sort_unstable</code> use the same safety net.</p>

<h2>Sorting without comparisons</h2>
<p>If keys are small integers, or can be broken into small integer digits, you can sort without ever comparing two elements, and beat O(n log n).</p>
<h3>Counting sort</h3>
<p>For keys in the range 0..k−1: count how many times each key occurs, turn the counts into running totals (so count[v] tells you how many keys are ≤ v), then place each element directly into its slot.</p>
${fig('counting', '<b>Figure 10.3</b> Counting sort. The counts become positions; scanning the input from right to left keeps it stable.')}
${code('Counting sort')`
static int[] countingSort(int[] a, int k) {        // keys in 0..k-1
  int[] count = new int[k];
  for (int x : a) count[x]++;
  for (int v = 1; v < k; v++) count[v] += count[v - 1];    // count[v] = number of keys <= v
  int[] out = new int[a.length];
  for (int i = a.length - 1; i >= 0; i--) out[--count[a[i]]] = a[i];   // right to left: stable
  return out;
}`}
${rs('counting_sort.rs')`
fn counting_sort(a: &[usize], k: usize) -> Vec<usize> {   // keys in 0..k
    let mut count = vec![0; k];
    for &x in a { count[x] += 1; }
    for v in 1..k { count[v] += count[v - 1]; }   // count[v] = number of keys <= v
    let mut out = vec![0; a.len()];
    for &x in a.iter().rev() {                 // right to left: stable
        count[x] -= 1;
        out[count[x]] = x;
    }
    out
}
`}
<p>It runs in O(n + k) time and space. It is excellent when k is small (ages, grades, HTTP status codes) and useless when k is huge (arbitrary 64-bit IDs).</p>
<h3>Radix sort</h3>
<p>Radix sort handles large keys by sorting them one digit at a time with a stable counting sort. The least-significant-digit (LSD) version sorts by the ones digit, then by the tens digit, and so on. Because each pass is stable, ties on the current digit keep the order from the previous passes, so after the last pass the keys are fully sorted.</p>
${fig('radix', '<b>Figure 10.4</b> LSD radix sort, base 10. The highlighted digit is the one each pass sorts by.')}
<p>With d digits in base b, radix sort costs O(d · (n + b)). For 32-bit integers sorted 8 bits at a time, that is 4 passes of counting sort with 256 buckets, linear in n. Radix sort suits fixed-width keys such as integers, IP addresses and fixed-length strings.</p>
<h3>Bucket sort</h3>
<p>If keys are spread roughly uniformly over a range, such as random doubles in [0, 1), split the range into n equal buckets, drop each key into its bucket, sort each bucket with insertion sort, and concatenate. Each bucket holds about one key on average, so the expected time is O(n). If the keys are clustered, one bucket gets most of them and the time degrades to that of the inner sort.</p>

<h2>Stability</h2>
<p>A sort is <strong>stable</strong> if records with equal keys come out in the same relative order they went in.</p>
${fig('stable', '<b>Figure 10.5</b> Sorting by number only. A stable sort keeps 1a before 1b because that was the input order.')}
<p>Stability matters when you sort by several keys. To list transactions by account, and by time within each account, you can sort by time first and then <em>stably</em> by account. The second sort keeps the time order inside each account. Merge sort, insertion sort, counting sort and radix sort are stable. Quicksort, heapsort and selection sort are not, though any sort can be made stable by adding the original index as a final tie-breaker.</p>

<h2>The lower bound for comparison sorting</h2>
<p>Why do merge sort and heapsort stop at n log n? Because every comparison-based sort must, in the worst case, make at least about n log₂n comparisons. The argument uses a <strong>decision tree</strong>.</p>
${fig('decision', '<b>Figure 10.6</b> The decision tree of a comparison sort on three items. Each leaf is one possible output order.')}
<p>Any comparison sort, run on n distinct items, behaves like a binary tree of questions: each internal node is a comparison, each branch is its answer, and each leaf is a final ordering. The algorithm must be able to produce every one of the n! possible orderings, so the tree needs at least n! leaves. A binary tree with n! leaves has height at least log₂(n!), and</p>
<div class="formula">log₂(n!)  ≥  log₂((n/2)^(n/2))  =  (n/2) · log₂(n/2)  =  Ω(n log n)</div>
<p>The height is the number of comparisons on the worst path. So merge sort and heapsort are optimal among comparison sorts. Counting and radix sort escape the bound only because they do not compare elements; they use the keys as array indices.</p>

<h2>What Java and Rust use</h2>
<ul>
<li><code>Arrays.sort(int[])</code> and the other primitive overloads use a tuned <strong>dual-pivot quicksort</strong>, which partitions around two pivots into three parts. Since JDK 14 it also sorts small parts with insertion sort, merges runs when the input turns out to be nearly sorted, and switches to heapsort if the recursion gets too deep, so its worst case is O(n log n). Large <code>byte</code>, <code>short</code> and <code>char</code> arrays are counting-sorted instead. None of this is stable, but for primitives stability is invisible, because equal values are indistinguishable.</li>
<li><code>Arrays.sort(Object[])</code>, <code>Collections.sort</code> and <code>List.sort</code> use <strong>TimSort</strong>, a merge sort that detects runs that are already sorted and merges them, using insertion sort for short runs. It is stable and very fast on partially ordered data.</li>
<li><code>Arrays.parallelSort</code> splits the work across the common fork-join pool for large arrays.</li>
<li>Rust's <code>sort</code>, <code>sort_by</code> and <code>sort_by_key</code> are <strong>stable</strong> and O(n log n) in the worst case. The current implementation, driftsort, combines quicksort with merge sort's run detection, so sorted and reversed input take linear time. It allocates a buffer: as long as the slice for medium sizes, capped at half of it for large ones.</li>
<li>Rust's <code>sort_unstable</code> family is <strong>unstable</strong>, allocates nothing and is usually faster. The current implementation, ipnsort, is a quicksort that falls back to heapsort, so it too is O(n log n) in the worst case. Prefer it whenever stability does not matter, as with plain numbers.</li>
<li>Both Rust sorts need <code>Ord</code>, a total order. <code>f64</code> is only <code>PartialOrd</code>, because NaN is unordered, so floats are sorted with <code>sort_by(f64::total_cmp)</code>. If an <code>Ord</code> implementation is inconsistent, the sort may panic or leave the order unspecified: Rust's counterpart of TimSort's "Comparison method violates its general contract".</li>
</ul>
${code('Sorting records in Java')`
record Txn(String account, long timestamp, long amountCents) {}

List<Txn> txns = new ArrayList<>(/* ... */);
txns.sort(Comparator.comparing(Txn::account)
                    .thenComparingLong(Txn::timestamp));          // multi-key, stable

txns.sort(Comparator.comparingLong(Txn::amountCents).reversed()); // largest first

int[] xs = {5, 2, 9, 1};
Arrays.sort(xs);                                                  // dual-pivot quicksort`}
${rs('sorting_records.rs')`
#[derive(Debug)]
struct Txn { account: String, timestamp: u64, amount_cents: i64 }

let mut txns: Vec<Txn> = vec![/* ... */];
txns.sort_by(|a, b| a.account.cmp(&b.account)
                     .then(a.timestamp.cmp(&b.timestamp)));     // multi-key, stable

txns.sort_by_key(|t| std::cmp::Reverse(t.amount_cents));        // largest first, stable

let mut xs = [5, 2, 9, 1];
xs.sort_unstable();                     // no allocation; equal ints are indistinguishable

let mut rates = [0.5, -1.0, 2.25];
rates.sort_by(f64::total_cmp);          // f64 is not Ord (NaN); total_cmp is a total order
`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Comparators that subtract.</strong> <code>(x, y) -&gt; x - y</code> overflows for large or negative values. Use <code>Integer.compare</code>; in Rust, <code>a.cmp(&amp;b)</code>.</li>
<li><strong>Inconsistent comparators.</strong> A comparator must be transitive; TimSort may throw "Comparison method violates its general contract" if it is not, and Rust's sorts may panic.</li>
<li><strong>Sorting floats with <code>partial_cmp(...).unwrap()</code></strong> in Rust. It panics on the first NaN; use <code>f64::total_cmp</code>.</li>
<li><strong>A fixed pivot on sorted input.</strong> Use a random pivot or median-of-three.</li>
<li><strong>Midpoint overflow.</strong> <code>(lo + hi) / 2</code> overflows for very large indices; use <code>(lo + hi) &gt;&gt;&gt; 1</code> or <code>lo + (hi - lo) / 2</code>.</li>
<li><strong>Assuming a sort is stable.</strong> Check before relying on it for multi-key ordering.</li>
</ul></div>
