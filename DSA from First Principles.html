CH.push({
  id: 'ch16', n: 16, title: 'Algorithm Design Techniques',
  lede: 'The earlier chapters taught specific structures and algorithms. This chapter steps back to the general strategies behind them, so that when you meet a new problem you can recognize which strategy fits. It also gives a repeatable procedure for going from a problem statement to a correct, efficient solution.',
  html: `
<h2>From tools to strategies</h2>
<p>Most algorithms are instances of a handful of design strategies, often called <strong>paradigms</strong>. Knowing them lets you approach an unfamiliar problem with a short list of questions rather than a blank page. The paradigms are not exclusive: Dijkstra's algorithm is greedy, merge sort is divide and conquer, Floyd-Warshall is dynamic programming, and binary search is a degenerate divide and conquer.</p>
<div class="tbl"><table><tr><th>Paradigm</th><th>Core idea</th><th>Signals in the problem</th><th>Examples</th></tr>
<tr><td>Brute force</td><td>try every candidate</td><td>tiny input; need a correct baseline</td><td>check every pair, every subset</td></tr>
<tr><td>Backtracking</td><td>build candidates step by step, abandon dead ends</td><td>"all", "every", "count the ways", constraints to satisfy</td><td>N-Queens, Sudoku, permutations</td></tr>
<tr><td>Greedy</td><td>make the best-looking choice and never revisit it</td><td>an obvious ordering; a choice you can prove is safe</td><td>interval scheduling, Huffman, Dijkstra, Kruskal</td></tr>
<tr><td>Divide and conquer</td><td>split into independent parts, solve, combine</td><td>"halve the input"; a cheap combine step</td><td>merge sort, quicksort, binary search, Karatsuba</td></tr>
<tr><td>Dynamic programming</td><td>solve overlapping subproblems once and reuse the answers</td><td>"minimum", "maximum", "number of ways"; brute force repeats work</td><td>knapsack, edit distance, shortest paths</td></tr>
<tr><td>Transform and conquer</td><td>change the representation so the problem becomes easy</td><td>"if only it were sorted, or indexed"</td><td>sort first, hash for lookup, heapify, build a graph</td></tr>
<tr><td>Randomization</td><td>use random choices to avoid bad cases on average</td><td>an adversary or unlucky input could cause the worst case</td><td>random pivots, hashing, sampling</td></tr>
</table></div>

<h2>One problem, four strategies</h2>
<p>The <strong>maximum subarray</strong> problem shows how much the choice of strategy matters. Given an array of integers, possibly negative, find the contiguous subarray with the largest sum. For example, in [−2, 1, −3, 4, −1, 2, 1, −5, 4] the answer is 6, from [4, −1, 2, 1]. A trader asks the same question of daily profit and loss: which stretch of days had the best total?</p>
<h3>Brute force, O(n³)</h3>
<p>Try every pair (i, j) and sum the elements between them.</p>
${code('Cubic')`
static int maxSubCubic(int[] a) {
  int best = Integer.MIN_VALUE;
  for (int i = 0; i < a.length; i++)
    for (int j = i; j < a.length; j++) {
      int sum = 0;
      for (int k = i; k <= j; k++) sum += a[k];
      best = Math.max(best, sum);
    }
  return best;
}`}
${rs('cubic.rs')`
// Returns None for an empty slice instead of a sentinel value.
fn max_sub_cubic(a: &[i32]) -> Option<i32> {
    let mut best = None;
    for i in 0..a.len() {
        for j in i..a.len() {
            let sum: i32 = a[i..=j].iter().sum();      // the third loop, inside sum()
            best = best.max(Some(sum));                // None compares below every Some
        }
    }
    best
}
`}
<h3>Remove repeated work, O(n²)</h3>
<p>The sum of a[i..j] is the sum of a[i..j−1] plus a[j]. Keep a running sum instead of recomputing it.</p>
${code('Quadratic')`
static int maxSubQuadratic(int[] a) {
  int best = Integer.MIN_VALUE;
  for (int i = 0; i < a.length; i++) {
    int sum = 0;
    for (int j = i; j < a.length; j++) { sum += a[j]; best = Math.max(best, sum); }
  }
  return best;
}`}
${rs('quadratic.rs')`
fn max_sub_quadratic(a: &[i32]) -> Option<i32> {
    let mut best = None;
    for i in 0..a.len() {
        let mut sum = 0;
        for &x in &a[i..] { sum += x; best = best.max(Some(sum)); }
    }
    best
}
`}
<h3>Divide and conquer, O(n log n)</h3>
<p>The best subarray lies entirely in the left half, entirely in the right half, or crosses the middle. The first two are recursive calls. The crossing case is the best sum ending at the middle plus the best sum starting just after it, found in linear time. The recurrence is T(n) = 2T(n/2) + n. Chapter 18 works through it in detail.</p>
<h3>Dynamic programming, O(n): Kadane's algorithm</h3>
<p>Let best(j) be the largest sum of a subarray that <em>ends exactly at</em> j. Either that subarray is just a[j], or it extends the best subarray ending at j − 1. So best(j) = max(a[j], best(j−1) + a[j]), and the answer is the largest best(j).</p>
${code('Kadane')`
static int maxSubLinear(int[] a) {             // a must be non-empty
  int endingHere = a[0], best = a[0];
  for (int j = 1; j < a.length; j++) {
    endingHere = Math.max(a[j], endingHere + a[j]);   // extend, or start fresh at j
    best = Math.max(best, endingHere);
  }
  return best;
}`}
${rs('kadane.rs')`
fn max_sub_linear(a: &[i32]) -> Option<i32> {
    let (&first, rest) = a.split_first()?;             // None for an empty slice
    let (mut ending_here, mut best) = (first, first);
    for &x in rest {
        ending_here = x.max(ending_here + x);          // extend, or start fresh at x
        best = best.max(ending_here);
    }
    Some(best)
}
`}
<p>The Rust versions return <code>Option&lt;i32&gt;</code>: <code>None</code> for an empty slice, where the Java versions return <code>Integer.MIN_VALUE</code> or fail on <code>a[0]</code>. <code>Option</code> compares <code>None</code> below every <code>Some</code>, so <code>best.max(Some(sum))</code> needs no special first case.</p>
<p>At roughly a billion simple steps per second, the four versions compare like this:</p>
<div class="tbl"><table><tr><th>Approach</th><th>Time</th><th>n = 10⁴</th><th>n = 10⁶</th></tr>
<tr><td>Brute force</td><td class="num">O(n³)</td><td>about 17 minutes</td><td>about 30 years</td></tr>
<tr><td>Running sum</td><td class="num">O(n²)</td><td>0.1 s</td><td>17 minutes</td></tr>
<tr><td>Divide and conquer</td><td class="num">O(n log n)</td><td>instant</td><td>20 ms</td></tr>
<tr><td>Kadane (DP)</td><td class="num">O(n)</td><td>instant</td><td>1 ms</td></tr>
</table></div>
<p>The same problem, the same answer, and a factor of a trillion between the slowest and fastest solution at n = 10⁶. Each improvement came from asking a design question: "what work am I repeating?" and "what should my subproblem be?"</p>

<h2>Recognizing the right technique</h2>
<p>When a problem is new, run through these questions roughly in order. The first "yes" is usually a good place to start.</p>
${fig('flow', '<b>Figure 16.1</b> A decision guide for choosing a design technique.')}
<h3>Let the input size tell you the target</h3>
<p>Problem constraints are a strong hint about the intended complexity. A core executes around 10⁹ simple instructions per second, but one step of a real algorithm usually costs several of them, so a safe budget is about 10⁸ steps per second of allowed time:</p>
<div class="tbl"><table><tr><th>Largest n</th><th>Acceptable complexity</th><th>Typical technique</th></tr>
<tr><td class="num">≤ 10–12</td><td class="num">O(n!), O(n · n!)</td><td>permutations, brute force</td></tr>
<tr><td class="num">≤ 20–25</td><td class="num">O(2ⁿ · n)</td><td>subsets, bitmask DP, meet in the middle</td></tr>
<tr><td class="num">≤ 500</td><td class="num">O(n³)</td><td>interval DP, Floyd-Warshall</td></tr>
<tr><td class="num">≤ 5,000</td><td class="num">O(n²)</td><td>2-D DP, all pairs</td></tr>
<tr><td class="num">≤ 10⁶</td><td class="num">O(n log n)</td><td>sorting, heaps, binary search, divide and conquer</td></tr>
<tr><td class="num">≤ 10⁸</td><td class="num">O(n)</td><td>single pass, two pointers, hashing, Kadane</td></tr>
<tr><td class="num">larger</td><td class="num">O(log n) or O(1)</td><td>math, binary search on the answer</td></tr>
</table></div>

<h2>A procedure for solving problems</h2>
<ol>
<li><strong>Understand.</strong> Restate the problem in your own words. Identify the inputs, the output and every constraint. Ask about edge cases: empty input, one element, duplicates, negative numbers, overflow.</li>
<li><strong>Work examples by hand.</strong> Do two or three small cases, including an awkward one. Patterns you notice by hand often become the algorithm.</li>
<li><strong>Write a brute-force solution first,</strong> at least in your head. It proves you understand the problem and gives you something to test faster versions against.</li>
<li><strong>Find the bottleneck.</strong> What does brute force repeat or waste? Which data structure would make the slow step fast? Which paradigm from the table fits?</li>
<li><strong>Design and analyze</strong> before coding. State the time and space. Check that the complexity fits the constraints.</li>
<li><strong>Code</strong> cleanly, with meaningful names and small helper methods.</li>
<li><strong>Test</strong> with your hand examples, the edge cases and, ideally, randomized comparison against the brute-force version.</li>
</ol>
${code('Randomized testing against a brute-force reference')`
static void fuzz() {
  Random r = new Random(42);
  for (int trial = 0; trial < 10_000; trial++) {
    int[] a = r.ints(1 + r.nextInt(12), -10, 10).toArray();
    int expect = maxSubCubic(a), got = maxSubLinear(a);
    if (expect != got) throw new AssertionError(Arrays.toString(a) + " expected " + expect + " got " + got);
  }
  System.out.println("all trials passed");
}`}
${rs('fuzz.rs')`
// std has no random number generator; the rand crate is the usual choice.
use rand::{RngExt, SeedableRng, rngs::StdRng};

fn fuzz() {
    let mut r = StdRng::seed_from_u64(42);
    for _ in 0..10_000 {
        let n = r.random_range(1..=12);
        let a: Vec<i32> = (0..n).map(|_| r.random_range(-10..10)).collect();
        let (expect, got) = (max_sub_cubic(&a), max_sub_linear(&a));
        assert_eq!(expect, got, "{a:?}");                 // panics with the failing input
    }
    println!("all trials passed");
}
`}
<p>This kind of differential testing finds off-by-one errors and missed cases far faster than reasoning alone. It is worth the five minutes for any algorithm you will rely on. In Rust the same check usually lives in a <code>#[test]</code> function run by <code>cargo test</code>, and property-testing crates such as proptest generate the inputs and shrink a failing one to a small example.</p>

<h2>Arguing correctness</h2>
<p>An efficient algorithm that is sometimes wrong is useless. Three tools cover most correctness arguments.</p>
<h3>Loop invariants</h3>
<p>A loop invariant is a statement that is true before the loop, stays true after each iteration, and, combined with the exit condition, implies the result is correct. For Kadane: "after processing a[0..j], <code>endingHere</code> is the best sum of a subarray ending at j and <code>best</code> is the best sum of any subarray within a[0..j]." It holds initially, the update keeps it true, and at the end it is exactly the answer.</p>
<h3>Induction</h3>
<p>Recursive algorithms are proved by induction on the input size: show the base case is correct, then show that if the recursive calls return correct answers on smaller inputs, the combining step produces a correct answer. This is the "leap of faith" from Chapter 2, made rigorous.</p>
<h3>Exchange arguments</h3>
<p>Greedy algorithms are usually proved by taking any optimal solution and showing that you can swap in the greedy choice without making it worse. Repeating the swap transforms the optimal solution into the greedy one. Chapter 17 does this for interval scheduling.</p>
<h3>Counterexamples</h3>
<p>To show an idea is wrong, one counterexample is enough. Before you invest in a greedy rule, spend a few minutes trying to break it with small inputs. If you cannot, try to prove it.</p>

<h2>Recurring design ideas</h2>
<ul>
<li><strong>Precompute.</strong> Prefix sums turn range-sum queries into O(1). Sorting turns many queries into binary searches. Tables of answers turn repeated computation into lookup.</li>
<li><strong>Trade space for time.</strong> Hash tables, memoization and indexes all spend memory to save work.</li>
<li><strong>Incremental updates.</strong> Instead of recomputing a result from scratch, update it as the input changes: a running sum, a rolling hash, a sliding window.</li>
<li><strong>Reduce to a known problem.</strong> Scheduling with dependencies is topological sorting. Currency arbitrage is negative-cycle detection. Recognizing the reduction is often the whole solution.</li>
<li><strong>Change the order of processing.</strong> Process events by time, intervals by end point, edges by weight, or queries offline in a convenient order.</li>
<li><strong>Use amortization.</strong> A structure can afford occasional expensive steps if they are rare enough, as with dynamic arrays and union-find.</li>
</ul>

<h2>Practice</h2>

<div class="lvl e"><h4>Easy</h4>

CH.push({
  id: 'ch17', n: 17, title: 'Greedy Algorithms',
  lede: 'A greedy algorithm builds a solution one step at a time, always taking the choice that looks best right now and never reconsidering. It is the simplest kind of algorithm to write and often the fastest. The hard part is knowing when it is correct, because for many problems the locally best choice leads to a globally poor answer.',
  html: `
<h2>The greedy idea</h2>
<p>Suppose you must make change for 68 rupees with notes and coins of 50, 20, 10, 5, 2 and 1. Almost everyone does the same thing without thinking: take the largest denomination that fits (50), then the largest that fits the remaining 18 (10), then 5, then 2, then 1. Five pieces, and it is the fewest possible. That is a greedy algorithm: at every step, take the best immediate option, commit to it, and move on.</p>
<p>Greedy algorithms are attractive because they are simple and fast, usually a sort followed by one pass. But they only work for problems with two properties:</p>
<ul>
<li><strong>Greedy-choice property:</strong> some optimal solution begins with the greedy choice. Taking it never rules out an optimal answer.</li>
<li><strong>Optimal substructure:</strong> after making the greedy choice, what remains is a smaller instance of the same problem, and an optimal solution to it combined with the greedy choice is optimal overall.</li>
</ul>
<p>Dynamic programming (Chapter 19) also needs optimal substructure, but it considers every choice at each step. Greedy commits to one. When the greedy-choice property holds, greedy gives the same answer with much less work.</p>

<h2>Interval scheduling</h2>
<p>A meeting room receives requests, each with a start and finish time. Accept as many requests as possible so that no two accepted requests overlap. Several greedy rules come to mind: pick the shortest request, the one that starts earliest, or the one with the fewest conflicts. Only one of them is always optimal: <strong>pick the request that finishes earliest</strong>, discard everything that overlaps it, and repeat.</p>
${fig('activity', '<b>Figure 17.1</b> Earliest-finish-first on eleven requests. Each accepted request is the one that frees the room soonest.')}
${code('Interval scheduling')`
static int maxNonOverlapping(int[][] iv) {            // iv[i] = {start, end}, half-open [start, end)
  Arrays.sort(iv, Comparator.comparingInt(a -> a[1]));  // by finishing time
  int count = 0, freeAt = Integer.MIN_VALUE;
  for (int[] r : iv) {
    if (r[0] >= freeAt) { count++; freeAt = r[1]; }     // compatible with everything accepted so far
  }
  return count;
}`}
${rs('interval_scheduling.rs')`
fn max_non_overlapping(iv: &mut [(i32, i32)]) -> usize {   // (start, end), half-open [start, end)
    iv.sort_unstable_by_key(|&(_, end)| end);              // by finishing time
    let (mut count, mut free_at) = (0, i32::MIN);
    for &(start, end) in iv.iter() {
        if start >= free_at { count += 1; free_at = end; } // compatible with everything accepted so far
    }
    count
}
`}
<h3>Why it is correct: an exchange argument</h3>
<p>Let g be the request that finishes earliest, and take any optimal schedule S. Let f be the first request in S. Every other request in S starts at or after f finishes, and g finishes no later than f, so replacing f with g in S cannot create an overlap. The new schedule has the same size, so it is also optimal, and it contains g. So the greedy choice is always safe. After choosing g, the remaining problem is the same problem restricted to requests that start after g ends, so by induction greedy is optimal there too.</p>
<p>The other rules fail, and it is instructive to see how. Shortest-first fails when a short request sits across the boundary of two long compatible ones. Earliest-start fails when the first request to start is very long and blocks many others. Always test a greedy rule against small counterexamples before trusting it.</p>
<h3>Related interval problems</h3>
<ul>
<li><strong>Minimum removals to eliminate overlaps:</strong> n minus the answer above.</li>
<li><strong>Minimum number of points that pierce every interval</strong> (minimum arrows to burst balloons): sort by end and place a point at each chosen end.</li>
<li><strong>Minimum number of rooms for all requests:</strong> sort by start and keep a min-heap of end times; the largest heap size is the answer. This is greedy too, but a different rule.</li>
<li><strong>Merging overlapping intervals:</strong> sort by start and extend the current interval while the next one overlaps.</li>
</ul>

<h2>Fractional knapsack</h2>
<p>A thief can carry W kilograms and the store has items of various weights and values. In the <strong>fractional</strong> version, the thief may take any fraction of an item, like gold dust rather than gold bars. The greedy rule is to sort items by value per kilogram and take the best ones first, taking a fraction of the last item that fits.</p>
${code('Fractional knapsack')`
static double fractionalKnapsack(int[] w, int[] v, int cap) {   // every weight > 0
  Integer[] idx = new Integer[w.length];
  for (int i = 0; i < idx.length; i++) idx[i] = i;
  Arrays.sort(idx, (a, b) -> Double.compare((double) v[b] / w[b], (double) v[a] / w[a]));   // best ratio first
  double total = 0;
  for (int i : idx) {
    if (cap == 0) break;
    int take = Math.min(w[i], cap);
    total += take * (double) v[i] / w[i];
    cap -= take;
  }
  return total;
}`}
${rs('fractional_knapsack.rs')`
fn fractional_knapsack(w: &[u32], v: &[u32], mut cap: u32) -> f64 {   // every weight > 0
    let mut idx: Vec<usize> = (0..w.len()).collect();
    // Best ratio first. v[a]/w[a] < v[b]/w[b] exactly when v[a]*w[b] < v[b]*w[a]: exact, no floats.
    idx.sort_by(|&a, &b| (u64::from(v[b]) * u64::from(w[a])).cmp(&(u64::from(v[a]) * u64::from(w[b]))));
    let mut total = 0.0;
    for i in idx {
        if cap == 0 { break; }
        let take = w[i].min(cap);
        total += f64::from(take) * f64::from(v[i]) / f64::from(w[i]);
        cap -= take;
    }
    total
}
`}
<p>The Rust version sorts by comparing v[a] · w[b] with v[b] · w[a] in integers, which is exact; it could not sort by an <code>f64</code> ratio directly, because floating-point numbers implement only <code>PartialOrd</code> (NaN has no place in a total order), and Java's <code>Double.compare</code> is what imposes one there.</p>
<p>The exchange argument is simple: if an optimal solution carries some lower-ratio item while a higher-ratio item is left behind, swapping equal weights of them increases the value. In the <strong>0/1 knapsack</strong>, where each item is taken whole or not at all, this greedy rule fails. With capacity 50 and items (10 kg, 60), (20 kg, 100), (30 kg, 120), the best ratios give 60 + 100 = 160, but 100 + 120 = 220 is better. The 0/1 version needs dynamic programming.</p>

<h2>Huffman coding</h2>
<p>Text is normally stored with a fixed number of bits per character. If some characters are far more common than others, you can save space with a <strong>variable-length code</strong>: short codes for frequent characters, long codes for rare ones. To decode without separators, no code may be a prefix of another; this is a <strong>prefix code</strong>, and it corresponds to a binary tree whose leaves are the characters, where the path from the root spells the code (left is 0, right is 1).</p>
<p>David Huffman's greedy algorithm (1952) builds the optimal prefix code. Start with one tree per character, weighted by frequency. Repeatedly take the two lightest trees and join them under a new root whose weight is their sum. When one tree remains, it defines the code.</p>
${fig('huffman', '<b>Figure 17.2</b> Building a Huffman tree. The two lightest trees always merge first, so rare symbols end up deepest.')}
${code('Huffman.java')`
import java.util.*;

public class Huffman {
  record Node(char ch, int freq, Node left, Node right) { boolean leaf() { return left == null; } }

  static Map<Character, String> codes(Map<Character, Integer> freq) {
    PriorityQueue<Node> pq = new PriorityQueue<>(Comparator.comparingInt(Node::freq));
    freq.forEach((c, f) -> pq.add(new Node(c, f, null, null)));
    while (pq.size() > 1) {
      Node a = pq.poll(), b = pq.poll();                   // the two lightest trees
      pq.add(new Node('\0', a.freq() + b.freq(), a, b));
    }
    Map<Character, String> out = new TreeMap<>();
    walk(pq.poll(), "", out);
    return out;
  }
  private static void walk(Node n, String code, Map<Character, String> out) {
    if (n.leaf()) { out.put(n.ch(), code.isEmpty() ? "0" : code); return; }
    walk(n.left(), code + "0", out);
    walk(n.right(), code + "1", out);
  }
  public static void main(String[] args) {
    System.out.println(codes(Map.of('a', 45, 'b', 13, 'c', 12, 'd', 16, 'e', 9, 'f', 5)));
    // {a=0, b=101, c=100, d=111, e=1101, f=1100}
  }
}`}
${rs('huffman.rs')`
use std::cmp::Reverse;
use std::collections::{BTreeMap, BinaryHeap};

// Nodes live in a Vec (an arena) and refer to their children by index.
enum Node { Leaf(char), Internal(usize, usize) }

fn codes(freq: &[(char, u32)]) -> BTreeMap<char, String> {
    let mut arena = Vec::new();
    let mut pq = BinaryHeap::new();                  // Reverse makes the max-heap a min-heap
    for &(c, f) in freq {
        pq.push(Reverse((f, arena.len())));          // (weight, node index)
        arena.push(Node::Leaf(c));
    }
    while pq.len() > 1 {
        let Reverse((fa, a)) = pq.pop().unwrap();    // the two lightest trees
        let Reverse((fb, b)) = pq.pop().unwrap();
        pq.push(Reverse((fa + fb, arena.len())));    // joined under a new root
        arena.push(Node::Internal(a, b));
    }
    let mut out = BTreeMap::new();
    if let Some(Reverse((_, root))) = pq.pop() { walk(&arena, root, String::new(), &mut out); }
    out
}

fn walk(arena: &[Node], n: usize, code: String, out: &mut BTreeMap<char, String>) {
    match arena[n] {
        Node::Leaf(c) => { out.insert(c, if code.is_empty() { "0".to_string() } else { code }); }
        Node::Internal(left, right) => {
            walk(arena, left, format!("{code}0"), out);
            walk(arena, right, code + "1", out);
        }
    }
}

fn main() {
    println!("{:?}", codes(&[('a', 45), ('b', 13), ('c', 12), ('d', 16), ('e', 9), ('f', 5)]));
    // {'a': "0", 'b': "101", 'c': "100", 'd': "111", 'e': "1101", 'f': "1100"}
}
`}
<p>Java's <code>PriorityQueue</code> is a min-heap ordered by its comparator. Rust's <code>BinaryHeap</code> is a max-heap ordered by the elements' own <code>Ord</code>, so the Rust version pushes <code>Reverse((weight, index))</code>: tuples compare by weight first, and the index breaks ties deterministically. Rather than implement <code>Ord</code> for a tree of boxed nodes, it keeps the nodes in a <code>Vec</code> and links them by index, a pattern called an arena.</p>
<p>With these frequencies the average code length is 2.24 bits per character instead of the 3 bits a fixed code needs for six symbols, a 25% saving. Huffman coding runs in O(n log n) with a heap and is part of DEFLATE (used by gzip, zip and PNG) and of JPEG and MP3.</p>
<p>Why is it optimal? The two least frequent symbols can always be placed as siblings at the deepest level of some optimal tree; if they were not, swapping them with whatever is deepest would not increase the cost. Merging them reduces the problem to one with one fewer symbol, and induction finishes the proof.</p>

<h2>When greedy fails</h2>
<p>The rupee example works because those denominations happen to be well behaved. Change the coins to {1, 3, 4} and ask for 6:</p>
${fig('coins', '<b>Figure 17.3</b> Largest-coin-first gives 4 + 1 + 1. The optimum is 3 + 3.')}
<p>Greedy takes 4 first, and that choice rules out the optimal answer, so the greedy-choice property fails. The same thing happens with 0/1 knapsack, with the longest path in a graph and with the travelling salesman problem (where "go to the nearest unvisited city" can be very poor). In each case, use dynamic programming, search, or an approximation with a proven bound.</p>
<p>Even well-behaved denominations stop being safe when the supply is limited. A cash machine holding one 500 note and three 200 notes, asked for 600, takes the 500 first and is then stuck, although three 200s would have worked. Limited supply turns change-making into a bounded knapsack for dynamic programming, or a small search, since a dispenser holds only a few kinds of note. With unlimited supply, whether largest-first is always optimal for a set of coins can be checked mechanically: if greedy ever uses more coins than necessary, it already does so for some amount below the sum of the two largest denominations, so comparing it with the coin-change DP of Chapter 19 up to that amount settles the question.</p>
<div class="note key"><b>How to decide</b><p>First, look for a natural ordering: by end time, by ratio, by weight, by deadline. Second, try hard to break the rule with small examples. Third, if you cannot break it, try an exchange argument. If the argument works, greedy is correct. If you find a counterexample, the problem probably needs dynamic programming.</p></div>

<h2>More greedy algorithms</h2>
<p>Several algorithms from earlier chapters are greedy, and seeing them as greedy explains why they work.</p>
<ul>
<li><strong>Dijkstra's algorithm</strong> settles the closest unsettled vertex. Non-negative weights guarantee nothing can later reach it more cheaply.</li>
<li><strong>Prim's and Kruskal's algorithms</strong> add the cheapest edge that does not break the tree. The cut property is the exchange argument.</li>
<li><strong>Scheduling to minimize lateness</strong>: run jobs in order of deadline (earliest deadline first). Swapping any two adjacent jobs that are out of deadline order never increases the maximum lateness.</li>
<li><strong>Jump game</strong>: walk left to right, tracking the furthest index reachable so far. If you ever stand beyond it, the end is unreachable.</li>
<li><strong>Gas station</strong>: if the total fuel covers the total cost, a solution exists, and it starts just after the point where the running balance is lowest.</li>
</ul>
${code('Jump Game (LeetCode 55)')`
static boolean canReachEnd(int[] jump) {
  int furthest = 0;
  for (int i = 0; i < jump.length; i++) {
    if (i > furthest) return false;            // stuck: this index is unreachable
    furthest = Math.max(furthest, i + jump[i]);
  }
  return true;
}`}
${rs('jump_game.rs')`
fn can_reach_end(jump: &[usize]) -> bool {
    let mut furthest = 0;
    for (i, &j) in jump.iter().enumerate() {
        if i > furthest { return false; }          // stuck: this index is unreachable
        furthest = furthest.max(i + j);
    }
    true
}
`}

<h2>Applied: meeting settlement cut-offs</h2>
<p>An end-of-day run must produce several files and postings. Each takes a known time on a shared engine and each has a cut-off: a card scheme's settlement window, a clearing file deadline, the close of the general ledger. When they cannot all finish on time, two questions arise. In what order should they run so that the worst overrun is as small as possible? And if some must miss their cut-off, how many can still make it?</p>
<p>The first has a greedy answer: <strong>earliest deadline first</strong>. Suppose some optimal order runs a job i immediately before a job j with an earlier deadline. Swap them. Job j now finishes earlier than before. Job i now finishes at f, the time j used to finish, so its lateness is f − dᵢ, which is less than f − dⱼ, the lateness j had before the swap. No other job moves, so the maximum lateness does not increase. Repeating such swaps sorts the order by deadline without ever making it worse, so the deadline order is optimal. The durations play no part in the rule; sorting by length, the intuitive "quick jobs first", can be much worse.</p>
<p>The second question, the most jobs on time, also has a greedy answer, due to Moore and Hodgson. Take jobs in deadline order, and whenever the job just added would finish late, drop the longest job accepted so far. Dropping the longest frees the most time at the price of a single job. A max-heap of accepted durations makes each step O(log n).</p>
${code('SettlementSchedule.java')`
import java.util.*;

public class SettlementSchedule {
  record Job(String id, int minutes, int deadline) {}       // deadline in minutes after the run starts

  // Earliest deadline first minimizes the worst lateness. Returns that lateness (0 if every job is on time).
  static int maxLateness(List<Job> jobs) {
    List<Job> order = new ArrayList<>(jobs);
    order.sort(Comparator.comparingInt(Job::deadline));
    int t = 0, worst = 0;
    for (Job j : order) {
      t += j.minutes();                                      // j finishes at time t
      worst = Math.max(worst, t - j.deadline());
    }
    return worst;
  }

  // The most jobs that can all meet their deadlines (Moore-Hodgson): go in deadline order,
  // and whenever the job just added would finish late, drop the longest job kept so far.
  static List<Job> mostOnTime(List<Job> jobs) {
    List<Job> order = new ArrayList<>(jobs);
    order.sort(Comparator.comparingInt(Job::deadline));
    PriorityQueue<Job> kept = new PriorityQueue<>(Comparator.comparingInt(Job::minutes).reversed());
    int t = 0;
    for (Job j : order) {
      kept.add(j);
      t += j.minutes();
      if (t > j.deadline()) t -= kept.poll().minutes();      // shed the longest; the rest now fit
    }
    List<Job> onTime = new ArrayList<>(kept);
    onTime.sort(Comparator.comparingInt(Job::deadline));     // run them in deadline order
    return onTime;
  }

  public static void main(String[] args) {
    List<Job> jobs = List.of(new Job("card-settlement", 30, 60), new Job("ach-file", 20, 45),
        new Job("fx-confirm", 15, 50), new Job("gl-posting", 40, 120), new Job("recon-report", 25, 100));
    System.out.println(maxLateness(jobs));                   // 10: ach, fx, card, recon, gl
    List<Job> tight = List.of(new Job("card-settlement", 30, 40), new Job("ach-file", 20, 30),
        new Job("fx-confirm", 15, 45), new Job("gl-posting", 40, 90), new Job("recon-report", 25, 70));
    System.out.println(mostOnTime(tight).stream().map(Job::id).toList());   // [ach-file, fx-confirm, recon-report]
  }
}
`}
${rs('settlement_schedule.rs')`
use std::collections::BinaryHeap;

#[derive(Debug, Clone)]
struct Job { id: &'static str, minutes: u32, deadline: u32 }   // deadline in minutes after the run starts

// Earliest deadline first minimizes the worst lateness. Returns that lateness (0 if every job is on time).
fn max_lateness(jobs: &[Job]) -> u32 {
    let mut order = jobs.to_vec();
    order.sort_by_key(|j| j.deadline);
    let (mut t, mut worst) = (0, 0);
    for j in &order {
        t += j.minutes;                                       // j finishes at time t
        worst = worst.max(t.saturating_sub(j.deadline));      // early counts as 0
    }
    worst
}

// The most jobs that can all meet their deadlines (Moore-Hodgson): go in deadline order,
// and whenever the job just added would finish late, drop the longest job kept so far.
fn most_on_time(jobs: &[Job]) -> Vec<Job> {
    let mut order = jobs.to_vec();
    order.sort_by_key(|j| j.deadline);
    let mut kept = BinaryHeap::new();                         // max-heap by length: (minutes, index)
    let mut t = 0;
    for (i, j) in order.iter().enumerate() {
        kept.push((j.minutes, i));
        t += j.minutes;
        if t > j.deadline && let Some((longest, _)) = kept.pop() { t -= longest; }   // shed the longest
    }
    let mut keep: Vec<usize> = kept.into_iter().map(|(_, i)| i).collect();
    keep.sort_unstable();                                     // back into deadline order
    keep.into_iter().map(|i| order[i].clone()).collect()
}
`}
<p>With the first set of cut-offs, earliest deadline first runs ach-file, fx-confirm, card-settlement, recon-report and gl-posting, and the worst overrun is 10 minutes, on gl-posting. The jobs take 130 minutes in total and the last cut-off is at 120, so no order can do better. Shortest first would run card-settlement after three shorter jobs and miss its cut-off by 30. With the tighter cut-offs, card-settlement and ach-file cannot both be on time, and the best possible is three jobs, which is what the second method keeps. Both methods are O(n log n). Give each late job its own penalty and minimizing the total penalty becomes NP-hard (Chapter 20): a small change to an easy greedy problem often makes it hard.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Trusting a greedy rule without proof.</strong> Many plausible rules are wrong. Look for a counterexample first.</li>
<li><strong>Sorting by the wrong key.</strong> Interval scheduling needs end time, not start time or length.</li>
<li><strong>Using greedy on 0/1 knapsack or arbitrary coin systems.</strong> Use dynamic programming.</li>
<li><strong>Off-by-one on touching intervals.</strong> Decide whether [1, 4) and [4, 6) overlap and be consistent.</li>
<li><strong>Keeping a greedy rule after the problem changes.</strong> Limited supply, weights or penalties often break a rule that was provably safe before.</li>
</ul></div>

<h2>Practice</h2>

CH.push({
  id: 'ch18', n: 18, title: 'Divide and Conquer',
  lede: 'Divide and conquer solves a problem by splitting it into smaller independent pieces of the same kind, solving those recursively, and combining their answers. It produces some of the most elegant and efficient algorithms in computing, and its running time can almost always be read off a recurrence using the Master Theorem from Chapter 1.',
  html: `
<h2>The three steps</h2>
<ol>
<li><strong>Divide</strong> the input into smaller subproblems, usually two halves.</li>
<li><strong>Conquer</strong> each subproblem recursively. When a subproblem is small enough, solve it directly; this is the base case.</li>
<li><strong>Combine</strong> the sub-answers into an answer for the whole input.</li>
</ol>
<p>The pattern is familiar from large-scale systems. A MapReduce or Spark job splits a dataset into partitions, processes each partition independently, and merges the partial results. A search engine shards its index, queries every shard in parallel and merges the top results. Because the subproblems are <em>independent</em>, divide and conquer also parallelizes naturally: Java's fork/join framework and parallel streams are built on it.</p>
<p>The cost of a divide-and-conquer algorithm follows a recurrence of the form</p>
<div class="formula">T(n) = a · T(n / b) + f(n)        a subproblems of size n/b, plus f(n) to divide and combine</div>
<p>The Master Theorem then tells you the answer. Most of the design effort goes into two places: making the split balanced, and making the combine step cheap.</p>

<h2>Merge sort, revisited</h2>
<p>Merge sort is the model divide-and-conquer algorithm. Divide is trivial (split at the middle), conquer sorts each half, and combine merges two sorted halves in linear time.</p>
${fig('mergetree', '<b>Figure 18.1</b> Divide (top) and combine (bottom) in merge sort. All the real work happens in the merges.')}
<p>T(n) = 2T(n/2) + n, which is case 2 of the Master Theorem: Θ(n log n). Quicksort reverses the balance of work: it spends linear time dividing (partitioning) and does nothing to combine. Binary search is the degenerate case: divide in O(1), conquer only <em>one</em> half, and no combine at all, giving T(n) = T(n/2) + 1 = Θ(log n). Algorithms that recurse into only one piece are sometimes called <strong>decrease and conquer</strong>; quickselect from Chapter 12 is another.</p>

<h2>Counting inversions</h2>
<p>An <strong>inversion</strong> is a pair of positions i &lt; j with a[i] &gt; a[j]. The number of inversions measures how far an array is from sorted: 0 for a sorted array, n(n−1)/2 for a reversed one. It is used to compare rankings (how differently two users ordered the same items) and to count how many adjacent swaps are needed to sort.</p>
${fig('inversions', '<b>Figure 18.2</b> Each arc connects a larger element to a smaller one that appears after it.')}
<p>Checking every pair is O(n²). Divide and conquer does better by piggybacking on merge sort. Every inversion is either entirely in the left half, entirely in the right half, or a "split" pair with one element in each half. The first two kinds are counted by the recursive calls. Split inversions are counted during the merge: whenever an element is taken from the right half, it is smaller than every element still remaining in the left half, so it forms an inversion with each of them.</p>
${code('CountInversions.java')`
static long countInversions(int[] a) { return sortCount(a, new int[a.length], 0, a.length); }

static long sortCount(int[] a, int[] tmp, int lo, int hi) {          // a[lo..hi)
  if (hi - lo < 2) return 0;
  int mid = (lo + hi) >>> 1;
  long inv = sortCount(a, tmp, lo, mid) + sortCount(a, tmp, mid, hi);
  int i = lo, j = mid, k = lo;
  while (i < mid && j < hi) {
    if (a[i] <= a[j]) tmp[k++] = a[i++];
    else { inv += mid - i; tmp[k++] = a[j++]; }   // a[j] jumps ahead of the (mid - i) remaining left elements
  }
  while (i < mid) tmp[k++] = a[i++];
  while (j < hi)  tmp[k++] = a[j++];
  System.arraycopy(tmp, lo, a, lo, hi - lo);
  return inv;
}`}
${rs('count_inversions.rs')`
fn count_inversions(a: &mut [i32]) -> u64 {
    let mut tmp = a.to_vec();
    sort_count(a, &mut tmp)
}

fn sort_count(a: &mut [i32], tmp: &mut [i32]) -> u64 {      // sorts a; tmp is scratch of the same length
    let n = a.len();
    if n < 2 { return 0; }
    let mid = n / 2;
    let mut inv = {
        let ((l, r), (tl, tr)) = (a.split_at_mut(mid), tmp.split_at_mut(mid));
        sort_count(l, tl) + sort_count(r, tr)
    };
    let (mut i, mut j) = (0, mid);
    for slot in tmp.iter_mut() {
        if j == n || (i < mid && a[i] <= a[j]) { *slot = a[i]; i += 1; }
        else { inv += (mid - i) as u64; *slot = a[j]; j += 1; }   // a[j] jumps ahead of the mid - i remaining left elements
    }
    a.copy_from_slice(tmp);
    inv
}
`}
<p>The counting adds O(1) per merge step, so the total stays O(n log n). The same "count during merge" trick solves "count of smaller numbers after self" and "reverse pairs".</p>

<h2>Maximum subarray</h2>
<p>Chapter 16 introduced this problem. The divide-and-conquer solution splits the array at the middle. The best subarray is either entirely in the left half, entirely in the right half, or it <em>crosses</em> the middle. The crossing case is easy to solve directly in linear time: the best crossing subarray is the best sum ending exactly at mid, scanning left, plus the best sum starting at mid + 1, scanning right.</p>
${fig('crossing', '<b>Figure 18.3</b> The crossing case: extend as far as is profitable in each direction from the middle.')}
${code('MaxSubarrayDC.java')`
static int maxSub(int[] a, int lo, int hi) {                 // inclusive bounds
  if (lo == hi) return a[lo];
  int mid = (lo + hi) >>> 1;
  int bestLeft = Integer.MIN_VALUE, sum = 0;
  for (int i = mid; i >= lo; i--) { sum += a[i]; bestLeft = Math.max(bestLeft, sum); }
  int bestRight = Integer.MIN_VALUE; sum = 0;
  for (int i = mid + 1; i <= hi; i++) { sum += a[i]; bestRight = Math.max(bestRight, sum); }
  int crossing = bestLeft + bestRight;
  return Math.max(crossing, Math.max(maxSub(a, lo, mid), maxSub(a, mid + 1, hi)));
}`}
${rs('max_subarray_dc.rs')`
fn max_sub(a: &[i32]) -> i32 {                     // a must be non-empty
    if let [x] = a { return *x; }
    let mid = (a.len() - 1) / 2;                   // left half a[..=mid], right half a[mid + 1..]
    let crossing = best_prefix(a[..=mid].iter().rev()) + best_prefix(a[mid + 1..].iter());
    crossing.max(max_sub(&a[..=mid])).max(max_sub(&a[mid + 1..]))
}

// The largest sum of a non-empty prefix of xs: scanning outward from the middle.
fn best_prefix<'a>(xs: impl Iterator<Item = &'a i32>) -> i32 {
    xs.scan(0, |sum, &x| { *sum += x; Some(*sum) }).max().expect("non-empty")
}
`}
<p>T(n) = 2T(n/2) + n gives O(n log n). Kadane's linear-time DP is faster, which is an important lesson: divide and conquer is not always the best tool, especially when the subproblems can share information instead of being solved independently.</p>

<h2>Fast exponentiation</h2>
<p>Computing xⁿ with n − 1 multiplications is O(n). Divide and conquer does it in O(log n): xⁿ = (x^(n/2))² when n is even, and x · (x^(n/2))² when n is odd. Each step halves the exponent, and both halves are the same value, so only one recursive call is needed.</p>
${code('Fast power, recursive and iterative')`
static long powMod(long x, long n, long mod) {
  if (n == 0) return 1 % mod;
  long half = powMod(x, n / 2, mod);
  long sq = half * half % mod;
  return (n % 2 == 0) ? sq : sq * (x % mod) % mod;
}

// Iterative: read the bits of n from least significant to most.
static long powModIter(long x, long n, long mod) {
  long result = 1 % mod; x %= mod;
  while (n > 0) {
    if ((n & 1) == 1) result = result * x % mod;
    x = x * x % mod;
    n >>= 1;
  }
  return result;
}`}
${rs('fast_power.rs')`
// Products of two values below m fit in u128, so any u64 modulus is safe.
fn pow_mod(x: u64, n: u64, m: u64) -> u64 {
    if n == 0 { return 1 % m; }
    let (half, m128) = (u128::from(pow_mod(x, n / 2, m)), u128::from(m));
    let sq = half * half % m128;
    let r = if n.is_multiple_of(2) { sq } else { sq * u128::from(x % m) % m128 };
    r as u64                                       // r < m, so it fits
}

// Iterative: read the bits of n from least significant to most.
fn pow_mod_iter(x: u64, mut n: u64, m: u64) -> u64 {
    let m = u128::from(m);
    let (mut result, mut x) = (1 % m, u128::from(x) % m);
    while n > 0 {
        if n & 1 == 1 { result = result * x % m; }
        x = x * x % m;
        n >>= 1;
    }
    result as u64
}
`}
<p>The Java version multiplies two values below <code>mod</code> in a <code>long</code>, so <code>mod</code> must stay below about 3 × 10⁹ for the product to fit; the common 10⁹ + 7 is fine. For larger moduli use <code>BigInteger.modPow</code>, or <code>Math.multiplyHigh</code> to get the full 128-bit product. The Rust version widens to <code>u128</code>, which covers any 64-bit modulus. Both expect x ≥ 0: Java's <code>%</code> keeps the sign of a negative x, so use <code>Math.floorMod</code> first if x can be negative.</p>
<p>Modular exponentiation of very large numbers is the core operation of RSA and Diffie-Hellman; with 2048-bit exponents, the difference between O(n) and O(log n) multiplications is the difference between impossible and instant. The same idea raises a matrix to a power in O(log n) multiplications, which computes the nth Fibonacci number in O(log n) time.</p>

<h2>Karatsuba multiplication</h2>
<p>Multiplying two n-digit numbers the school way takes n² digit multiplications. Split each number into high and low halves: x = x₁·10^(n/2) + x₀ and y = y₁·10^(n/2) + y₀. Then</p>
<div class="formula">x · y = x₁y₁ · 10ⁿ + (x₁y₀ + x₀y₁) · 10^(n/2) + x₀y₀</div>
<p>That needs four half-size multiplications, so T(n) = 4T(n/2) + n = Θ(n²): no gain. In 1960 Anatoly Karatsuba noticed that the middle term can be computed from the other two with one extra multiplication:</p>
<div class="formula">x₁y₀ + x₀y₁  =  (x₁ + x₀)(y₁ + y₀) − x₁y₁ − x₀y₀</div>
<p>Now only three multiplications are needed: T(n) = 3T(n/2) + n = Θ(n^log₂3) ≈ Θ(n^1.585). Java's <code>BigInteger.multiply</code> switches to Karatsuba for numbers above a certain size, and to an even faster Toom-Cook method for larger ones. Rust's standard library has no arbitrary-precision integers; crates such as num-bigint provide them, with the same switch to Karatsuba and Toom-Cook for large operands. <strong>Strassen's algorithm</strong> applies the same trick to matrices, multiplying two n × n matrices with seven half-size products instead of eight: Θ(n^2.81).</p>

<h2>Closest pair of points</h2>
<p>Given n points in the plane, find the two that are closest together. Checking every pair is O(n²). The divide-and-conquer algorithm is O(n log n):</p>
<ol>
<li>Sort the points by x-coordinate and split them with a vertical line into a left half and a right half.</li>
<li>Recursively find the closest pair in each half. Let d be the smaller of the two distances.</li>
<li>The only pairs that could beat d straddle the dividing line, with both points within distance d of it. Collect the points in that strip, sort them by y, and compare each with the next few points in y order.</li>
</ol>
${fig('closest', '<b>Figure 18.4</b> d is the closest distance within either half (dashed). Only points in the strip near the dividing line can form a closer pair across the halves, like the pair joined in green.')}
<p>The key fact is geometric: in a d × 2d rectangle of the strip, at most 8 points can fit while keeping distance at least d from each other on each side, so each point needs to be compared with at most 7 others. The combine step is therefore linear (after sorting), giving T(n) = 2T(n/2) + O(n) = O(n log n) when the y-sorted order is maintained during the recursion.</p>

<h2>Designing a divide-and-conquer algorithm</h2>
<ul>
<li><strong>Find a balanced split.</strong> Halves are ideal. A split that peels off one element at a time, such as T(n) = T(n − 1) + n, gives quadratic time.</li>
<li><strong>Make the combine step cheap.</strong> If combining is linear, you get n log n. If it is quadratic, you have gained nothing over brute force.</li>
<li><strong>Look for repeated subproblems.</strong> If the same subproblem appears many times (as in naive Fibonacci), divide and conquer wastes work and you should use dynamic programming instead.</li>
<li><strong>Stop recursing early.</strong> For tiny inputs, a simple quadratic method has lower overhead. Library sorts switch to insertion sort below a few dozen elements.</li>
<li><strong>Write the recurrence</strong> and solve it before you write the code. If it does not beat the obvious approach, rethink the split or the combine.</li>
</ul>
<div class="tbl"><table><tr><th>Algorithm</th><th>Recurrence</th><th>Time</th></tr>
<tr><td>Binary search</td><td class="num">T(n/2) + 1</td><td class="num">O(log n)</td></tr>
<tr><td>Fast exponentiation</td><td class="num">T(n/2) + 1</td><td class="num">O(log n)</td></tr>
<tr><td>Quickselect (average)</td><td class="num">T(n/2) + n</td><td class="num">O(n)</td></tr>
<tr><td>Merge sort, inversions</td><td class="num">2T(n/2) + n</td><td class="num">O(n log n)</td></tr>
<tr><td>Quicksort (average)</td><td class="num">2T(n/2) + n</td><td class="num">O(n log n)</td></tr>

</table></div>

<h2>Divide and conquer in parallel</h2>
<p>Because the subproblems are independent, they can run on different cores. Java's fork/join framework is designed for exactly this: a task splits itself into subtasks, forks them, and joins their results.</p>
${code('Parallel sum with fork/join')`
import java.util.concurrent.*;

class SumTask extends RecursiveTask<Long> {
  private static final int THRESHOLD = 10_000;      // below this, just loop
  private final long[] a; private final int lo, hi;
  SumTask(long[] a, int lo, int hi) { this.a = a; this.lo = lo; this.hi = hi; }

  @Override protected Long compute() {
    if (hi - lo <= THRESHOLD) { long s = 0; for (int i = lo; i < hi; i++) s += a[i]; return s; }
    int mid = (lo + hi) >>> 1;
    SumTask left = new SumTask(a, lo, mid), right = new SumTask(a, mid, hi);
    left.fork();                                    // run the left half asynchronously
    return right.compute() + left.join();           // do the right half here, then combine
  }
}
// long total = ForkJoinPool.commonPool().invoke(new SumTask(data, 0, data.length));`}
${rs('parallel_sum.rs')`
// rayon::join is the work-stealing fork/join of the rayon crate; std alone has std::thread::scope.
const THRESHOLD: usize = 10_000;                   // below this, just loop

fn sum(a: &[i64]) -> i64 {
    if a.len() <= THRESHOLD { return a.iter().sum(); }
    let (left, right) = a.split_at(a.len() / 2);   // two disjoint borrows: no data race is possible
    let (l, r) = rayon::join(|| sum(left), || sum(right));   // the halves may run on different threads
    l + r
}
// The same with rayon's parallel iterators: a.par_iter().sum::<i64>()
`}
<p>The threshold matters: splitting all the way to single elements would spend more time creating tasks than adding numbers. The Rust version uses the rayon crate, whose <code>join</code> is the same work-stealing fork/join. Because <code>split_at</code> hands each half out as a separate borrow, the compiler itself proves that the two tasks cannot interfere.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Unbalanced splits.</strong> Always splitting off one element turns n log n into n².</li>
<li><strong>Expensive combines.</strong> Copying arrays or concatenating lists at every level can add an extra log factor or worse.</li>
<li><strong>Overlapping subproblems.</strong> Recomputing the same subproblem is exponential; memoize or switch to DP.</li>
<li><strong>Off-by-one splits.</strong> Pick inclusive or half-open bounds and use them consistently; make sure both halves are strictly smaller than the original.</li>
<li><strong>Too-fine parallel tasks.</strong> Set a sequential threshold.</li>
</ul></div>
