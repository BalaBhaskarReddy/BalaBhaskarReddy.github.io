const code = (title, lang = 'java') => (s, ...v) => `<div class="code">${title ? `<div class="code-h">${esc(title)}</div>` : ''}<pre><code class="language-${lang}">${esc(String.raw({ raw: s.raw }, ...v).replace(/^\n+|\s+$/g, ''))}</code></pre></div>`;

/* Pair each Java listing with the Rust listing that follows it: one block, a Java/Rust switch shared across the book. */
let LANG = (() => { try { return localStorage.getItem('dsa-lang') || 'java'; } catch (e) { return 'java'; } })();

document.addEventListener('click', e => { const b = e.target.closest('.langsw button'); if (b) setLang(b.dataset.l); });
const fig = (name, cap) => `<figure class="fig" data-fig="${name}" data-cap="${esc(cap || '')}"></figure>`;

/* ================= primitives ================= */
function arrayRow(vals, o = {}) {

}

function chips(x, y, label, vals, o = {}) {
  let s = label ? tx(x, y + 14, label, 'tm', 'start') : '';
  let cx = x + (label ? (o.lw || 74) : 0);
  const st = o.st || {};
  vals.forEach((v, i) => {
    const w = Math.max(30, String(v).length * 8.2 + 14), k = st[i] || o.cls || '';
    s += rect(cx, y, w, 28, 'cell ' + k) + tx(cx + w / 2, y + 14, v, 'tv sm ' + k); cx += w + 6;
  });
  if (!vals.length) s += tx(cx, y + 14, o.empty || 'empty', 'tm', 'start');

}

function btree(nodes, root, o = {}) {
  const dx = o.dx || 46, dy = o.dy || 62, r = o.r || 18, px = o.px ?? 20, py = o.py ?? 20, st = o.st || {}, es = o.es || {}, sub = o.sub || {};
  const pos = {}; let k = 0, md = 0;
  (function w(id, d) { if (id == null || nodes[id] == null) return; w(nodes[id].l, d + 1); pos[id] = { x: px + r + k * dx, y: py + r + d * dy }; k++; md = Math.max(md, d); w(nodes[id].r, d + 1); })(root, 0);
  let s = '';
  for (const id in pos) { const n = nodes[id]; [n.l, n.r].forEach(c => { if (c != null && pos[c]) s += ln(shorten(pos[id], pos[c], r, r), es[id + '-' + c] || ''); }); }

    const p = pos[id], c = st[id] || '';
    s += `<circle cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}" class="nd ${c}"/>` + tx(p.x, p.y, nodes[id].v, 'tn ' + (String(nodes[id].v).length > 2 ? 'sm ' : '') + c);

function heapNodes(a) { const N = {}; a.forEach((v, i) => { N[i] = { v, l: 2 * i + 1 < a.length ? 2 * i + 1 : null, r: 2 * i + 2 < a.length ? 2 * i + 2 : null }; }); return N; }
/* level-order heap layout: keeps positions stable as the heap changes */
function heapTree(a, o = {}) {

    if (o.idx) s += tx(p.x + r + 6, p.y - r + 2, i, 'ti', 'start');

function gtree(root, o = {}) {

function graph(N, E, o = {}) {

function llist(o) {
  const bw = o.bw || 66, bh = 38, gap = o.gap || 46, px = 16, val = o.val || {}, st = o.st || {}, drop = o.drop || {};

    const i = idx[id], j = idx[t], k = (o.es || {})[id] || '';

    if (j > i) { const ex = isNull(t) ? X(j) + bw / 2 - 28 : X(j) - 1; s += `<path d="M${sx} ${sy} L${ex} ${Y(t) + bh / 2}" class="ed ${k}" marker-end="url(#${mk(k)})"/>`; }

  }

    const x = X(i), y = Y(id), k = st[id] || '';
    if (isNull(id)) { s += rect(x + bw / 2 - 26, y + bh / 2 - 14, 52, 28, 'cell dash ' + k) + tx(x + bw / 2, y + bh / 2, 'null', 'tm'); }
    else {
      s += rect(x, y, bw, bh, 'cell ' + k) + `<line x1="${x + bw - 22}" y1="${y}" x2="${x + bw - 22}" y2="${y + bh}" class="ed"/>`;
      s += tx(x + (bw - 22) / 2, y + bh / 2, val[id] ?? id, 'tv ' + k) + `<circle cx="${x + bw - 11}" cy="${y + bh / 2}" r="3.4" class="f1"/>`;

  });

function stackV(vals, o = {}) {
  const cap = Math.max(o.cap || 4, vals.length), bw = o.bw || 96, bh = 32, px = o.px ?? 14, py = o.title ? 30 : 12, st = o.st || {};

  s += `<path d="M${px - 5} ${py} V${bot} H${px + bw + 5} V${py}" class="well"/>`;
  vals.forEach((v, i) => { const y = py + (cap - 1 - i) * bh + 3, k = st[i] || ''; s += rect(px, y, bw, bh - 4, 'cell ' + k) + tx(px + bw / 2, y + (bh - 4) / 2, v, 'tv sm ' + k); });

function ring(slots, o = {}) {
  const n = slots.length, R = o.R || 92, cx = R + 74, cy = R + 54, bw = 44, st = o.st || {};

    const labs = []; if (o.head === i) labs.push(['head', 'acc']); if (o.tail === i) labs.push(['tail', 'hot']);

  });

  let s = '';

  let rows = 0;
  (o.marks || []).forEach(m => { if (m.i == null) return; rows = Math.max(rows, (m.row || 0) + 1); const x = px + m.i * (bw + gap) + bw / 2; s += tx(x, py + H + 31 + (m.row || 0) * 16, m.label, 'tp ' + (m.cls || 'acc')); });
  return { s, w: px * 2 + vals.length * (bw + gap) - gap, h: py + H + 24 + rows * 16 + 6 };
}

function grid(cells, o = {}) {

  if (o.rh) o.rh.forEach((t, r) => s += tx(px + hw / 2, py + hh + r * chh + chh / 2, t, 'th'));

/* ================= figure mounting + stepper ================= */
const IC = {
  first: '<svg viewBox="0 0 20 20"><path d="M4 4h2.4v12H4zM16.5 4 8 10l8.5 6z"/></svg>',
  prev: '<svg viewBox="0 0 20 20"><path d="M14 4 5.5 10 14 16z"/></svg>',
  next: '<svg viewBox="0 0 20 20"><path d="M6 4l8.5 6L6 16z"/></svg>',
  play: '<svg viewBox="0 0 20 20"><path d="M6 3.5 16.5 10 6 16.5z"/></svg>',

const asSvg = (r, label) => typeof r === 'string' ? r : svgw(r.w, r.h, r.s, label);

  const stage = host.querySelector('.stage'), note = host.querySelector('.fnote'), cnt = host.querySelector('.cnt'), bar = host.querySelector('.prog i');
  const B = a => host.querySelector(`[data-a="${a}"]`);

    B('first').disabled = B('prev').disabled = i === 0; B('next').disabled = i === n - 1;

  host.querySelector('.ctl').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const a = b.dataset.a;
    if (a === 'first') { stop(); i = 0; } else if (a === 'prev') { stop(); i = Math.max(0, i - 1); } else if (a === 'next') { stop(); i = Math.min(n - 1, i + 1); }

CH.push({
  id: 'ch01', n: 1, title: 'Introduction',
  lede: 'Before you learn any particular data structure, you need two things: a precise idea of what data structures and algorithms are, and a way to measure how much work an algorithm does as its input grows. This chapter builds both. Every later chapter uses the tools introduced here.',
  html: `
<h2>What data structures and algorithms are</h2>
<p>Every program is made of two things: data, and steps that act on that data. A <strong>data structure</strong> is a particular way of arranging data in memory so that some operations on it are cheap. An <strong>algorithm</strong> is a finite sequence of precise steps that turns an input into the desired output.</p>
<p>Consider the contacts on your phone. You could keep them in the order you added them, in alphabetical order, or grouped by first letter. With the first arrangement, adding a contact is instant but finding one means reading every entry. With alphabetical order, finding a name is fast because you can jump to the right region, but inserting a new name means shifting everything after it. Each arrangement makes some operations fast and others slow. Choosing a data structure means deciding which operations you need to be fast.</p>
<p>The two ideas are inseparable. An algorithm is usually written against a data structure (binary search needs a sorted array), and a data structure is only useful because of the algorithms that run on it (a heap is valuable because of how quickly it can return the smallest item).</p>

<h3>Abstract data types and their implementations</h3>
<p>An <strong>abstract data type</strong> (ADT) describes <em>what</em> a collection does: the operations it supports and what each operation means. It says nothing about memory layout. A <strong>data structure</strong> is a concrete implementation of an ADT: it decides <em>how</em> the data is stored and how each operation is carried out.</p>
<p>Java makes this separation visible. <code>List</code>, <code>Queue</code> and <code>Map</code> are interfaces, which play the role of ADTs. <code>ArrayList</code> and <code>LinkedList</code> both implement <code>List</code>, but one stores elements in a contiguous array and the other in a chain of nodes. They answer the same questions with very different costs. Your code can depend on the ADT, and you can swap the implementation when you learn more about your workload.</p>
<div class="tbl"><table><tr><th>ADT</th><th>Core operations</th><th>Typical implementations</th><th>Chapter</th></tr>
<tr><td>List</td><td>get(i), insert, remove, size</td><td>dynamic array, linked list</td><td>3</td></tr>
<tr><td>Stack</td><td>push, pop, peek</td><td>array, linked list</td><td>4</td></tr>
<tr><td>Queue</td><td>enqueue, dequeue, peek</td><td>circular array, linked list</td><td>5</td></tr>
<tr><td>Priority queue</td><td>insert, remove-min, peek-min</td><td>binary heap</td><td>7</td></tr>
<tr><td>Disjoint set</td><td>find, union</td><td>forest with path compression</td><td>8</td></tr>
<tr><td>Symbol table (map)</td><td>put, get, delete, ordered queries</td><td>balanced BST, hash table</td><td>13, 14</td></tr>
</table></div>

<h3>Java and Rust in this book</h3>
<p>Every listing in this book is written in Java and again in Rust. The <strong>Java / Rust</strong> switch at the top of a listing changes every listing on the page, and the choice is remembered from chapter to chapter. The Rust versions are idiomatic rather than line-by-line translations, so they sometimes look different while doing the same work at the same cost. The differences that matter most for data structures are these:</p>
<ul>
<li><strong>Generics.</strong> Java erases generic types when it compiles, so a <code>List&lt;Integer&gt;</code> holds references to separate boxed <code>Integer</code> objects. Rust <em>monomorphises</em>: it compiles a separate copy of generic code for each element type, so a <code>Vec&lt;i32&gt;</code> stores plain 4-byte integers side by side, with no boxing. Java interfaces such as <code>List</code> correspond to Rust traits, but Rust's standard collections are concrete types rather than implementations of a shared list trait; slices and iterators are the common vocabulary.</li>
<li><strong>No null.</strong> A value that may be absent has the type <code>Option&lt;T&gt;</code>, which is either <code>Some(x)</code> or <code>None</code>, and the compiler makes you handle both. Where Java returns <code>null</code> or throws (polling an empty queue, looking up a missing key), Rust returns an <code>Option</code>; operations that can fail for other reasons return a <code>Result</code>.</li>
<li><strong>Ownership instead of a garbage collector.</strong> Every value has one owner and is freed as soon as its owner goes out of scope. References borrow a value without owning it, and the compiler checks that no reference outlives the value and that nothing is changed while it is shared. Lists and trees in which each node has a single parent fit this model directly (<code>Option&lt;Box&lt;Node&gt;&gt;</code>). Structures in which a node is reachable from two places, such as doubly linked lists and graphs with cycles, do not; Rust code usually stores those nodes in a <code>Vec</code> and links them by index. Chapter 3 shows both.</li>
<li><strong>Integer overflow.</strong> Java's <code>int</code> and <code>long</code> wrap around silently. Rust panics on overflow in debug builds and wraps in release builds (unless overflow checks are switched on), and when you need a particular behaviour you say so with <code>checked_add</code>, <code>wrapping_add</code> or <code>saturating_add</code>. Sizes and indices have the unsigned type <code>usize</code>, so <code>i - 1</code> at <code>i == 0</code> is an overflow, not −1.</li>
<li><strong>Standard collections.</strong> <code>ArrayList</code> becomes <code>Vec</code>, <code>ArrayDeque</code> becomes <code>VecDeque</code>, <code>HashMap</code> and <code>HashSet</code> keep their names, <code>TreeMap</code> and <code>TreeSet</code> become <code>BTreeMap</code> and <code>BTreeSet</code>, and <code>PriorityQueue</code> becomes <code>BinaryHeap</code>, which returns the <em>largest</em> item first. The cost table at the end of this chapter covers both languages.</li>
</ul>

<h3>What makes something an algorithm</h3>
<p>A recipe counts as an algorithm when it has these properties:</p>
<ul>
<li><strong>Input and output.</strong> It takes zero or more inputs and produces at least one output.</li>
<li><strong>Definiteness.</strong> Every step is unambiguous. "Add a pinch of salt" is not definite; "add 2 grams of salt" is.</li>
<li><strong>Finiteness.</strong> It stops after a finite number of steps for every valid input.</li>
<li><strong>Effectiveness.</strong> Each step is simple enough to actually carry out.</li>
<li><strong>Correctness.</strong> For every valid input it produces the right output. One counterexample is enough to make an algorithm wrong.</li>
</ul>
<p>Here is a small, complete algorithm. It finds the largest value in an array by scanning once and remembering the best value seen so far.</p>
${code('MaxValue.java')`
public class MaxValue {
  // Precondition: a has at least one element.
  static int max(int[] a) {
    int best = a[0];                 // the largest value seen so far
    for (int i = 1; i < a.length; i++) {
      if (a[i] > best) best = a[i];  // found something larger
    }
    return best;                     // best is now the largest of all elements
  }
  public static void main(String[] args) {
    System.out.println(max(new int[]{7, 2, 9, 4}));   // 9
  }
}`}
${rs('max_value.rs')`
// An empty slice has no maximum, so the result is an Option instead of a precondition.
fn max(a: &[i32]) -> Option<i32> {
    let (&first, rest) = a.split_first()?;   // None for an empty slice
    let mut best = first;                    // the largest value seen so far
    for &x in rest {
        if x > best { best = x; }            // found something larger
    }
    Some(best)                               // best is now the largest of all elements
}

fn main() {
    println!("{:?}", max(&[7, 2, 9, 4]));    // Some(9)
    println!("{:?}", max(&[]));              // None
    // The library version is a.iter().max(), which returns Option<&i32>.
}`}
<p>Notice the comment "the largest value seen so far". That sentence is true before the loop, stays true after every iteration, and therefore is still true when the loop ends. A statement like this is called a <strong>loop invariant</strong>, and it is the standard way to argue that a loop is correct. You will see invariants again in binary search, partitioning and heaps.</p>

<h2>Measuring how much work an algorithm does</h2>
<p>We want to compare algorithms independently of the machine, the language and the JIT compiler. Timing with a stopwatch fails that test: the same code runs at different speeds on different computers, and the measurement changes with the input you happen to choose. Instead we count <strong>basic operations</strong> (an assignment, a comparison, an arithmetic operation, an array access) and treat each one as costing one unit of time. This simplified machine is called the <strong>RAM model</strong>.</p>
<p>The cost is always expressed as a function of the <strong>input size</strong>, written <span class="m">n</span>. For an array, <span class="m">n</span> is the number of elements. For a string it is the number of characters. For a graph we usually use two sizes: <span class="m">V</span> vertices and <span class="m">E</span> edges. For a single number, the size is the number of bits needed to write it down, which matters in Chapter 20.</p>
<p>Let us count the operations in a loop that sums an array:</p>
${code('Counting operations')`
int sum = 0;                          // 1 assignment
for (int i = 0; i < n; i++) {         // 1 init, n+1 comparisons, n increments
  sum += a[i];                        // n additions (each with an array read)
}
return sum;                           // 1`}
${rs('counting.rs')`
let mut sum = 0;                      // 1 assignment
for &x in a {                         // n+1 "is there another element?" checks
    sum += x;                         // n additions (each with an element read)
}
sum                                   // 1   (or simply: a.iter().sum())`}
<p>The total is about 1 + 1 + (n+1) + n + n + 1 = 3n + 4 operations. The exact constants depend on what we choose to count, so they are not very meaningful. What matters is the shape: the work grows in direct proportion to <span class="m">n</span>. Double the array and you double the work. This shape is what we call the algorithm's <strong>growth rate</strong> or <strong>order of growth</strong>.</p>
${fig('growth', '<b>Figure 1.1</b> Steps needed by common growth rates as n goes from 1 to 64. The vertical axis is logarithmic: each gridline is ten times the one below it. Exponential growth leaves the chart before n reaches 20.')}
<p>The figure shows why growth rate dominates everything else. For small inputs the curves are close together, and a "slow" algorithm with small constants can even win. As <span class="m">n</span> grows, the curves separate by orders of magnitude, and no amount of hardware can close the gap. The table makes the same point with concrete numbers, assuming a machine that performs one billion basic operations per second.</p>
<div class="tbl"><table><tr><th>Growth</th><th>Name</th><th>n = 10</th><th>n = 1,000</th><th>n = 1,000,000</th><th>Time at n = 10⁶</th></tr>
<tr><td class="num">O(1)</td><td>constant</td><td class="num">1</td><td class="num">1</td><td class="num">1</td><td>1 ns</td></tr>
<tr><td class="num">O(log n)</td><td>logarithmic</td><td class="num">3</td><td class="num">10</td><td class="num">20</td><td>20 ns</td></tr>
<tr><td class="num">O(n)</td><td>linear</td><td class="num">10</td><td class="num">1,000</td><td class="num">10⁶</td><td>1 ms</td></tr>
<tr><td class="num">O(n log n)</td><td>linearithmic</td><td class="num">33</td><td class="num">10,000</td><td class="num">2×10⁷</td><td>20 ms</td></tr>
<tr><td class="num">O(n²)</td><td>quadratic</td><td class="num">100</td><td class="num">10⁶</td><td class="num">10¹²</td><td>17 minutes</td></tr>

</table></div>
<p>A useful way to feel these classes is to ask what happens when the input doubles. A linear algorithm takes twice as long. A quadratic one takes four times as long. A cubic one takes eight times as long. A logarithmic one takes just one more step. An exponential one squares its running time.</p>
<h3>From input size to a budget</h3>
<p>The same arithmetic works in reverse. If you know how large the input can get and how long you may take, you can tell which growth rates are affordable before you write any code. A rough working figure for simple loops in compiled Java or Rust is between 10⁸ and 10⁹ basic operations per second; treat it as an order of magnitude, not a promise. With a budget of about one second:</p>
<div class="tbl"><table><tr><th>Largest n</th><th>Affordable growth</th><th>Typical shape</th></tr>
<tr><td class="num">about 10 to 12</td><td class="num">O(n!)</td><td>try every permutation</td></tr>
<tr><td class="num">about 20 to 25</td><td class="num">O(2ⁿ), O(n · 2ⁿ)</td><td>try every subset (Chapter 2)</td></tr>
<tr><td class="num">about 500</td><td class="num">O(n³)</td><td>three nested loops over the input</td></tr>
<tr><td class="num">about 10⁴</td><td class="num">O(n²)</td><td>compare every pair</td></tr>
<tr><td class="num">about 10⁶</td><td class="num">O(n log n)</td><td>sort, then scan; heaps; balanced trees</td></tr>
<tr><td class="num">about 10⁸</td><td class="num">O(n)</td><td>one pass</td></tr>
<tr><td class="num">beyond that</td><td class="num">O(log n) or O(1) per query</td><td>binary search, hashing, precomputed answers</td></tr>
</table></div>
<p>The same reasoning applies to production jobs. A sanctions-screening batch that compares every customer name with every list entry costs customers × entries comparisons; with millions of customers and tens of thousands of entries that is on the order of 10¹⁰ to 10¹¹ comparisons before any fuzzy scoring. That is why screening systems first narrow the candidates with an index, such as a hash of name tokens (Chapter 14) or a trie or automaton over the list (Chapter 15), and only then run the expensive comparison on the few candidates that remain.</p>

<h2>Asymptotic notation: O, Ω and Θ</h2>
<p>Asymptotic notation is the vocabulary for growth rates. It deliberately ignores constant factors and small inputs, because those depend on the machine, and keeps only how the cost behaves as <span class="m">n</span> becomes large.</p>
<h3>Big-O: an upper bound</h3>
<p>We say <span class="m">f(n)</span> is <strong>O(g(n))</strong> if there exist positive constants <span class="m">c</span> and <span class="m">n₀</span> such that</p>
<div class="formula">f(n) ≤ c · g(n)   for every n ≥ n₀</div>
<p>In words: from some point on, <span class="m">f</span> never rises above a constant multiple of <span class="m">g</span>. The constant <span class="m">c</span> absorbs machine speed and implementation details. The threshold <span class="m">n₀</span> lets us ignore small inputs where odd effects can happen.</p>
<div class="note ex"><b>Worked example</b><p>Show that 3n + 4 is O(n). Choose c = 4. We need 3n + 4 ≤ 4n, which simplifies to 4 ≤ n. So with n₀ = 4, the inequality holds for every n ≥ n₀. That proves it. Many other choices of c and n₀ also work; you only need one pair.</p></div>
<h3>Big-Omega and Big-Theta</h3>
<p><strong>Ω(g(n))</strong> is the matching lower bound: f(n) ≥ c · g(n) for all n ≥ n₀. It says the algorithm needs <em>at least</em> this much work. <strong>Θ(g(n))</strong> means both at once: there are constants c₁ and c₂ with c₁·g(n) ≤ f(n) ≤ c₂·g(n) for large n. Θ is the precise statement "f grows exactly like g".</p>
${fig('bigo', '<b>Figure 1.2</b> f(n) wiggles and starts high, but from n₀ onward it stays between c₁·g(n) and c₂·g(n). That makes f(n) = Θ(g(n)).')}
<p>In everyday engineering conversation people say "O" when they mean Θ. For example, "merge sort is O(n log n)" is usually meant as a tight statement. Technically, merge sort is also O(n²), because an upper bound can be loose. When precision matters, use Θ for tight bounds.</p>
<div class="note pit"><b>Common confusion</b><p>Big-O is not the same thing as "worst case". O, Ω and Θ describe functions. Best case, worst case and average case are different functions you might choose to describe. You can give a Θ bound for the best case (insertion sort's best case is Θ(n)) and a Θ bound for its worst case (Θ(n²)).</p></div>
<h3>Rules for simplifying</h3>
<ol>
<li><strong>Drop constant factors.</strong> 5n² and n²/2 are both Θ(n²).</li>
<li><strong>Keep only the dominant term.</strong> n² + 100n + 7 is Θ(n²), because for large n the n² term dwarfs the rest.</li>
<li><strong>Sequential steps add.</strong> Doing an O(n) pass and then an O(n²) pass costs O(n + n²) = O(n²).</li>
<li><strong>Nested steps multiply.</strong> Doing O(log n) work for each of n items costs O(n log n).</li>
<li><strong>The base of a logarithm does not matter.</strong> log₂n and log₁₀n differ only by a constant factor (log₂n = 3.32·log₁₀n), so we simply write log n.</li>
<li><strong>The hierarchy:</strong> 1 &lt; log n &lt; √n &lt; n &lt; n log n &lt; n² &lt; n³ &lt; 2ⁿ &lt; n!. Any polynomial eventually beats any logarithm, and any exponential eventually beats any polynomial.</li>
</ol>

<h2>Analyzing loops</h2>
<p>Most of the time you analyze code by looking at its loops. Each pattern below appears constantly; learn to recognize it on sight.</p>
<h3>A single loop</h3>
${code('Linear')`
for (int i = 0; i < n; i++) { /* O(1) work */ }          // Θ(n)`}
${rs('linear.rs')`
for _ in 0..n { /* O(1) work */ }                        // Θ(n)`}
<h3>Loops one after another</h3>
${code('Sequential: add the costs')`
for (int i = 0; i < n; i++) { /* O(1) */ }
for (int j = 0; j < m; j++) { /* O(1) */ }               // Θ(n + m)`}
${rs('sequential.rs')`
for _ in 0..n { /* O(1) */ }
for _ in 0..m { /* O(1) */ }                             // Θ(n + m)`}
<h3>Independent nested loops</h3>
${code('Nested: multiply the costs')`
for (int i = 0; i < n; i++)
  for (int j = 0; j < n; j++) { /* O(1) */ }             // Θ(n²)`}
${rs('nested.rs')`
for _ in 0..n {
    for _ in 0..n { /* O(1) */ }                         // Θ(n²)
}`}
<h3>Dependent nested loops</h3>
<p>When the inner loop's range depends on the outer variable, add up the inner counts row by row.</p>
${code('Triangle')`
for (int i = 0; i < n; i++)
  for (int j = i; j < n; j++) { /* O(1) */ }             // n + (n-1) + ... + 1 = n(n+1)/2 = Θ(n²)`}
${rs('triangle.rs')`
for i in 0..n {
    for _ in i..n { /* O(1) */ }    // n + (n-1) + ... + 1 = n(n+1)/2 = Θ(n²)
}`}
${fig('triangle', '<b>Figure 1.3</b> Each row is one value of i, each dot one execution of the inner body. The dots fill half of an n × n square, so the count is about n²/2, which is still Θ(n²).')}
<h3>Halving or doubling</h3>
<p>If the loop variable is multiplied or divided by a constant each time, the number of iterations is logarithmic. After k iterations, i equals 2ᵏ. The loop stops when 2ᵏ ≥ n, which happens when k = log₂n.</p>
${code('Logarithmic')`
for (int i = 1; i < n; i *= 2) { /* O(1) */ }            // Θ(log n)
for (int i = n; i > 0; i /= 2) { /* O(1) */ }            // Θ(log n)`}
${rs('logarithmic.rs')`
// A Rust for loop walks a range or an iterator, so multiplicative steps use while.
let mut i = 1;
while i < n { /* O(1) */ i *= 2; }                       // Θ(log n)
let mut i = n;
while i > 0 { /* O(1) */ i /= 2; }                       // Θ(log n)`}
<h3>A linear loop around a logarithmic loop</h3>
${code('Linearithmic')`
for (int i = 0; i < n; i++)
  for (int j = 1; j < n; j *= 2) { /* O(1) */ }          // n · log n = Θ(n log n)`}
${rs('linearithmic.rs')`
for _ in 0..n {
    let mut j = 1;
    while j < n { /* O(1) */ j *= 2; }                   // n · log n = Θ(n log n)
}`}
<h3>The harmonic pattern</h3>
<p>Here the inner loop runs n/1 times, then n/2 times, then n/3 times, and so on. The sum n·(1 + 1/2 + 1/3 + … + 1/n) is n times the harmonic number, which grows like ln n. This pattern appears in sieve-style algorithms, for example listing the divisors of every number up to n.</p>
${code('Harmonic')`
for (int i = 1; i <= n; i++)
  for (int j = i; j <= n; j += i) { /* O(1) */ }         // Θ(n log n)`}
${rs('harmonic.rs')`
for i in 1..=n {
    for _ in (i..=n).step_by(i) { /* O(1) */ }           // Θ(n log n)
}`}
<h3>Square-root loops</h3>
${code('Square root')`
for (int i = 1; i <= n / i; i++) { /* O(1) */ }          // Θ(√n), e.g. trial division for primality
// Not i * i <= n: when n is close to Integer.MAX_VALUE, i * i overflows and the loop never ends.`}
${rs('square_root.rs')`
let mut i = 1;
while i <= n / i { /* O(1) */ i += 1; }                  // Θ(√n); i * i <= n would overflow near the top
// (n.isqrt() gives ⌊√n⌋ directly.)`}
<div class="note key"><b>Method</b><p>For any loop nest, work from the inside out. Write down how many times the innermost body runs for fixed outer variables, then sum over the outer variables. Simplify with the rules above. If the body calls a method, include that method's cost, including hidden ones such as <code>list.contains</code> (linear) or string concatenation in a loop (linear per step).</p></div>

<h2>Best, worst and average case</h2>
<p>The same algorithm can do different amounts of work on inputs of the same size. Linear search shows this clearly:</p>
${code('LinearSearch.java')`
static int indexOf(int[] a, int target) {
  for (int i = 0; i < a.length; i++)
    if (a[i] == target) return i;   // may stop early
  return -1;
}`}
${rs('linear_search.rs')`
fn index_of(a: &[i32], target: i32) -> Option<usize> {
    for (i, &x) in a.iter().enumerate() {
        if x == target { return Some(i); }   // may stop early
    }
    None                                     // the library form: a.iter().position(|&x| x == target)
}`}
<ul>
<li><strong>Best case:</strong> the target is the first element. One comparison: Θ(1).</li>
<li><strong>Worst case:</strong> the target is last or absent. n comparisons: Θ(n).</li>
<li><strong>Average case:</strong> if the target is equally likely to be at any position, about n/2 comparisons on average: still Θ(n).</li>
</ul>
<p>Engineers focus on the worst case because it is a guarantee: no input can make the algorithm slower. The average case is useful when inputs really are random, or when the algorithm itself makes random choices (such as quicksort with a random pivot). The best case is rarely useful on its own, since almost any algorithm can be made fast on one lucky input.</p>

<h2>Space complexity</h2>
<p>Memory is measured the same way as time. <strong>Auxiliary space</strong> is the extra memory an algorithm uses beyond its input. Reversing an array in place by swapping the ends uses O(1) auxiliary space. Building a reversed copy uses O(n).</p>
<p>Recursion uses space too, even when you do not allocate anything. Each pending call keeps a frame on the call stack until it returns. A recursive function that goes n levels deep uses O(n) stack space. In Java the default thread stack (typically 1 MB on 64-bit platforms) holds roughly ten to twenty thousand frames of a simple recursive method, so deep recursion can fail with <code>StackOverflowError</code> long before you run out of heap memory. Rust has the same limit, and there a stack overflow aborts the whole process instead of throwing an error you could catch. Chapter 2 covers this in detail.</p>
<p>Time and space often trade against each other. A hash table spends memory to make lookups fast. Dynamic programming (Chapter 19) stores answers to subproblems to avoid recomputing them. Recognizing these trades is a large part of design.</p>

<h2>Recurrence relations</h2>
<p>Loops are analyzed by summing. Recursive algorithms are analyzed with <strong>recurrence relations</strong>: equations that define the cost on input size n in terms of the cost on smaller inputs. For example, binary search does constant work and then recurses on half of the array:</p>
<div class="formula">T(n) = T(n/2) + c,     T(1) = c</div>
<h3>Solving by expansion</h3>
<p>The simplest method is to substitute the recurrence into itself until a pattern appears.</p>
<div class="formula">T(n) = T(n/2) + c
     = T(n/4) + 2c
     = T(n/8) + 3c
     = T(n/2ᵏ) + k·c        stop when n/2ᵏ = 1, i.e. k = log₂n
     = c + c·log₂n  =  Θ(log n)</div>
<p>Two more expansions you should know by heart:</p>
<div class="formula">T(n) = T(n-1) + c   →  c·n               = Θ(n)      (one recursive step per element)
T(n) = T(n-1) + n   →  n + (n-1) + ... + 1 = Θ(n²)     (selection sort written recursively)</div>
<h3>The recursion-tree method</h3>
<p>For recurrences that split into several subproblems, draw the tree of calls. Write the non-recursive work inside each node, add up each level, then add up the levels. Merge sort splits an array into two halves, sorts each half recursively, and merges them in linear time:</p>
<div class="formula">T(n) = 2·T(n/2) + n</div>
${fig('rectree', '<b>Figure 1.4</b> Recursion tree for merge sort. Step through it to see each level add up to n.')}
<p>Every level of the tree costs n in total. The sizes halve at each level, so there are log₂n levels before reaching size 1. Multiplying gives Θ(n log n). This method always works, and it builds the intuition for the shortcut that follows.</p>

<h2>The Master Theorem</h2>
<p>Most divide-and-conquer algorithms have recurrences of the form</p>
<div class="formula">T(n) = a·T(n/b) + f(n)     a ≥ 1 subproblems, each of size n/b, plus f(n) work to divide and combine</div>
<p>In the recursion tree, the root costs f(n) and there are n^(log_b a) leaves. The <strong>Master Theorem</strong> compares these two quantities and tells you which one decides the total.</p>
${fig('master', '<b>Figure 1.5</b> Work per level of the recursion tree in the three cases. Either the root dominates, all levels tie, or the leaves dominate.')}
<div class="tbl"><table><tr><th>Case</th><th>Condition (compare f(n) with n^(log_b a))</th><th>Result</th></tr>
<tr><td>1. Leaves dominate</td><td>f(n) = O(n^(log_b a − ε)) for some ε &gt; 0</td><td class="num">Θ(n^(log_b a))</td></tr>
<tr><td>2. Balanced</td><td>f(n) = Θ(n^(log_b a))</td><td class="num">Θ(n^(log_b a) · log n)</td></tr>
<tr><td>3. Root dominates</td><td>f(n) = Ω(n^(log_b a + ε)), and a·f(n/b) ≤ k·f(n) for some k &lt; 1</td><td class="num">Θ(f(n))</td></tr>
</table></div>
<p>To apply it, compute the "critical exponent" log_b a, compare f(n) with n raised to that exponent, and read off the case.</p>
<div class="tbl"><table><tr><th>Recurrence</th><th>a, b, log_b a</th><th>f(n)</th><th>Case</th><th>Answer</th><th>Example</th></tr>
<tr><td class="num">T(n/2) + 1</td><td class="num">1, 2, 0</td><td class="num">1 = n⁰</td><td>2</td><td class="num">Θ(log n)</td><td>binary search</td></tr>
<tr><td class="num">2T(n/2) + n</td><td class="num">2, 2, 1</td><td class="num">n</td><td>2</td><td class="num">Θ(n log n)</td><td>merge sort</td></tr>
<tr><td class="num">2T(n/2) + 1</td><td class="num">2, 2, 1</td><td class="num">1</td><td>1</td><td class="num">Θ(n)</td><td>tree traversal</td></tr>
<tr><td class="num">8T(n/2) + n²</td><td class="num">8, 2, 3</td><td class="num">n²</td><td>1</td><td class="num">Θ(n³)</td><td>naive recursive matrix multiply</td></tr>
<tr><td class="num">7T(n/2) + n²</td><td class="num">7, 2, 2.81</td><td class="num">n²</td><td>1</td><td class="num">Θ(n^2.81)</td><td>Strassen</td></tr>
<tr><td class="num">3T(n/2) + n</td><td class="num">3, 2, 1.58</td><td class="num">n</td><td>1</td><td class="num">Θ(n^1.58)</td><td>Karatsuba multiplication</td></tr>
<tr><td class="num">2T(n/2) + n²</td><td class="num">2, 2, 1</td><td class="num">n²</td><td>3</td><td class="num">Θ(n²)</td><td>expensive combine step</td></tr>
</table></div>
<p>The theorem does not cover everything. It does not apply to "subtract" recurrences such as T(n) = T(n−1) + n, to unequal splits such as T(n) = T(n/3) + T(2n/3) + n, or to gaps that are not polynomial, such as T(n) = 2T(n/2) + n/log n. For those, use expansion or a recursion tree. (The unequal-split example still turns out to be Θ(n log n). Every level costs at most n and there are at most log₃/₂n levels, which gives the upper bound; the first log₃n levels are complete and cost exactly n each, which gives the matching lower bound.)</p>

<h2>Amortized analysis</h2>
<p>Some operations are usually cheap but occasionally expensive. Judging them by their single worst call is too pessimistic. <strong>Amortized analysis</strong> looks at the total cost of a whole sequence of operations and divides by the number of operations. The result is a guarantee about the sequence, with no probability involved.</p>
<p>The classic example is a dynamic array such as <code>ArrayList</code>. It stores elements in a fixed-size array. When the array is full, it allocates a larger array and copies everything across. That copy costs O(n). If the array doubles its capacity each time, copies become rarer as the array grows.</p>
${fig('amort', '<b>Figure 1.6</b> Pushing nine values into a doubling array. Expensive pushes appear at sizes 1, 2, 4 and 8, but the average cost per push stays below 3.')}
<p>The <strong>aggregate method</strong> makes this precise. Over n pushes, the copying costs 1 + 2 + 4 + … up to n, which is less than 2n. Adding the n writes gives fewer than 3n operations in total, so each push costs O(1) amortized.</p>
<p>The <strong>accounting method</strong> tells the same story with money. Charge every push 3 coins. One coin pays for writing the element. The other two are saved with it. When the array doubles from k to 2k slots, the k/2 elements pushed since the last resize have saved k coins, exactly enough to pay for copying all k elements. The bank never goes negative, so 3 coins per push always suffice.</p>
<div class="note pit"><b>Growth factor matters</b><p>If the array grew by a fixed amount (say 10 slots) instead of doubling, a resize would happen every 10 pushes and copy the whole array each time. The total would be about n²/20, so each push would cost O(n) amortized. Geometric growth (1.5× in Java's <code>ArrayList</code>, doubling in Rust's <code>Vec</code>) is what makes the amortized cost constant.</p></div>
<p>Amortized cost is different from average-case cost. An average-case bound assumes something about the input distribution. An amortized bound holds for every possible sequence of operations. You will meet amortized analysis again in hash table resizing (Chapter 14), the two-stack queue (Chapter 5) and union-find (Chapter 8).</p>

<h2>Costs of common Java and Rust operations</h2>
<p>These are the figures you should know without looking them up. They come from the documented contracts of the Java Collections Framework and of Rust's standard library.</p>
<div class="tbl"><table><tr><th>Java</th><th>Rust</th><th>Operation</th><th>Cost</th></tr>
<tr><td><code>ArrayList</code></td><td><code>Vec</code></td><td>get(i), set(i), add at end</td><td class="num">O(1), O(1), O(1) amortized</td></tr>

<p>Rust strings need a separate word. A <code>String</code> is UTF-8, in which a character takes one to four bytes. <code>len()</code> counts bytes in O(1), and byte access and slicing (<code>&amp;s[a..b]</code>, a borrowed view rather than a copy) are O(1), but a slice must start and end on character boundaries or it panics. Finding the i-th <em>character</em> (<code>s.chars().nth(i)</code>) has to walk from the start, so it is O(n). Code that indexes text heavily usually works on <code>s.as_bytes()</code> or on a <code>Vec&lt;char&gt;</code>.</p>

CH.push({
  id: 'ch02', n: 2, title: 'Recursion and Backtracking',
  lede: 'Recursion is the technique of solving a problem by solving smaller versions of the same problem. It is the natural way to process trees, graphs and nested structures, and it is the starting point for divide and conquer, backtracking and dynamic programming. Backtracking uses recursion to explore choices systematically and to abandon dead ends early.',
  html: `
<h2>What recursion is</h2>
<p>A function is <strong>recursive</strong> when it calls itself. That sounds circular, but it works because each call is on a smaller input, and there is a smallest input that the function answers directly. Every correct recursive function has two parts:</p>
<ul>
<li>A <strong>base case</strong>: an input small enough to answer immediately, without recursion.</li>
<li>A <strong>recursive case</strong>: a rule that expresses the answer for n in terms of answers for smaller inputs, and makes <em>progress</em> toward the base case.</li>
</ul>
<p>The factorial function is the standard first example. By definition n! = n × (n−1) × … × 1. Notice that the part after "n ×" is exactly (n−1)!. So n! = n × (n−1)!, with 1! = 1 as the base case.</p>
${code('Factorial.java')`
public class Factorial {
  static long fact(int n) {
    if (n <= 1) return 1;          // base case: answer directly
    return n * fact(n - 1);        // recursive case: smaller input
  }
  public static void main(String[] args) {
    System.out.println(fact(4));   // 24
    System.out.println(fact(20));  // 2432902008176640000, the largest that fits in a long
  }
}`}
${rs('factorial.rs')`
fn fact(n: u64) -> u64 {
    if n <= 1 { return 1; }          // base case: answer directly
    n * fact(n - 1)                  // recursive case: smaller input
}

// Same recursion, but overflow becomes None instead of a panic (debug) or a wrong answer (release).
fn fact_checked(n: u64) -> Option<u64> {
    if n <= 1 { return Some(1); }
    fact_checked(n - 1)?.checked_mul(n)
}

fn main() {
    println!("{}", fact(4));                 // 24
    println!("{}", fact(20));                // 2432902008176640000, the largest that fits in a u64
    println!("{:?}", fact_checked(21));      // None
}`}
<div class="note key"><b>The leap of faith</b><p>When you write the recursive case, assume the recursive call already works for the smaller input. Your only job is to use its answer to build the answer for the current input. You do not need to trace the whole chain of calls in your head. If the base case is right and each call gets closer to it, the function is correct by induction.</p></div>
<p>That is exactly the structure of a proof by mathematical induction. The base case is the base of the induction. The recursive case is the inductive step: "if it works for n−1, then it works for n".</p>

<h2>How the call stack runs a recursive function</h2>
<p>Each time a method is called, the JVM pushes a <strong>stack frame</strong> that holds the method's parameters, local variables and the place to return to. When the method returns, its frame is popped and execution continues in the caller. Recursion uses exactly the same mechanism: each recursive call gets its own frame with its own copy of <code>n</code>.</p>
${fig('callstack', '<b>Figure 2.1</b> The call stack while computing fact(4). Frames pile up until the base case, then unwind in reverse order as each call finishes its multiplication.')}
<p>Two consequences follow. First, recursion has a memory cost: a chain of n pending calls uses O(n) stack space. Second, the stack has a fixed size. The default thread stack in the JVM is typically 1 MB on 64-bit platforms (the <code>-Xss</code> option changes it), which allows roughly ten to twenty thousand frames for a simple method; the exact number depends on the size of each frame and on whether the JIT compiler has optimised the method yet. Recursing a million levels deep throws <code>StackOverflowError</code>. A missing or unreachable base case causes the same error almost immediately. Rust has the same limit (spawned threads get 2 MiB by default), but a stack overflow there aborts the process with a message instead of throwing an error that could be caught.</p>

<h2>Writing recursive functions</h2>
<p>Practice turning familiar loops into recursion. Each example below follows the same recipe: define what the function returns for an input, handle the smallest input, and express the general case through a smaller one.</p>
${code('RecursionBasics.java')`
public class RecursionBasics {
  // Sum of a[i..end]: the first element plus the sum of the rest.
  static int sum(int[] a, int i) {
    if (i == a.length) return 0;              // empty range
    return a[i] + sum(a, i + 1);
  }
  // x^n by repeated squaring: O(log n) calls instead of n. Requires n >= 0.
  static double power(double x, int n) {
    if (n == 0) return 1;
    double half = power(x, n / 2);
    return (n % 2 == 0) ? half * half : half * half * x;
  }
  // A string is a palindrome if its ends match and the middle is a palindrome.
  static boolean isPal(String s, int lo, int hi) {
    if (lo >= hi) return true;                // zero or one character left
    return s.charAt(lo) == s.charAt(hi) && isPal(s, lo + 1, hi - 1);
  }
  // Greatest common divisor: Euclid's algorithm, about 2,300 years old. Requires a, b >= 0.
  static int gcd(int a, int b) {
    return b == 0 ? a : gcd(b, a % b);
  }
  // The binary representation of n, for n >= 0.
  static String binary(int n) {
    if (n < 2) return String.valueOf(n);
    return binary(n / 2) + (n % 2);
  }
  public static void main(String[] args) {
    System.out.println(sum(new int[]{3, 1, 4, 1, 5}, 0));  // 14
    System.out.println(power(2, 10));                      // 1024.0
    System.out.println(isPal("racecar", 0, 6));            // true
    System.out.println(gcd(84, 36));                       // 12
    System.out.println(binary(13));                        // 1101
  }
}`}
${rs('recursion_basics.rs')`
// Sum of a slice: the first element plus the sum of the rest.
fn sum(a: &[i32]) -> i32 {
    match a {
        [] => 0,                                     // empty range
        [first, rest @ ..] => first + sum(rest),
    }
}
// x^n by repeated squaring: O(log n) calls instead of n. An unsigned n rules out negative powers.
fn power(x: f64, n: u32) -> f64 {
    if n == 0 { return 1.0; }
    let half = power(x, n / 2);
    if n.is_multiple_of(2) { half * half } else { half * half * x }
}
// A string is a palindrome if its ends match and the middle is a palindrome (ASCII bytes here).
fn is_pal(s: &[u8]) -> bool {
    match s {
        [] | [_] => true,                            // zero or one character left
        [first, middle @ .., last] => first == last && is_pal(middle),
    }
}
// Greatest common divisor: Euclid's algorithm.
fn gcd(a: u64, b: u64) -> u64 {
    if b == 0 { a } else { gcd(b, a % b) }
}
// The binary representation of n (format!("{n:b}") does the same).
fn binary(n: u32) -> String {
    if n < 2 { return n.to_string(); }
    binary(n / 2) + &(n % 2).to_string()
}

fn main() {
    println!("{}", sum(&[3, 1, 4, 1, 5]));   // 14
    println!("{}", power(2.0, 10));          // 1024
    println!("{}", is_pal(b"racecar"));      // true
    println!("{}", gcd(84, 36));             // 12
    println!("{}", binary(13));              // 1101
}`}
<p>Notice that <code>power</code> makes one recursive call on n/2, so it runs in O(log n) time, while <code>sum</code> makes one call on n−1, so it runs in O(n). The recurrence for the work is visible directly in the code.</p>

<h2>Tree recursion and its cost</h2>
<p>When a function makes <em>more than one</em> recursive call, the calls form a tree. The Fibonacci numbers are defined by F(0) = 0, F(1) = 1 and F(n) = F(n−1) + F(n−2). The direct translation into code is short and correct, and it is also hopelessly slow.</p>
${code('Fib.java')`
static long fib(int n) {
  if (n < 2) return n;
  return fib(n - 1) + fib(n - 2);   // two calls: the work branches
}`}
${rs('fib.rs')`
fn fib(n: u32) -> u64 {
    if n < 2 { return u64::from(n); }
    fib(n - 1) + fib(n - 2)          // two calls: the work branches
}`}
${fig('fibtree', '<b>Figure 2.2</b> The calls made by fib(5). The same subproblems are solved again and again.')}
<p>The tree for fib(n) has about 1.6ⁿ nodes, so the running time is exponential. fib(50) makes about 40 billion calls. The waste comes from <strong>overlapping subproblems</strong>: f(3) is computed twice in the figure, f(2) three times, and the repetition explodes as n grows. Storing each answer the first time it is computed (memoization) reduces the cost to O(n). That idea is the core of dynamic programming in Chapter 19.</p>
<p>The depth of the tree, which determines stack space, is only n. The <em>number of nodes</em> determines time. Keep those two measurements separate.</p>
<div class="tbl"><table><tr><th>Shape of recursion</th><th>Calls per invocation</th><th>Time</th><th>Stack space</th><th>Example</th></tr>
<tr><td>Linear</td><td>1, on n−1</td><td class="num">O(n)</td><td class="num">O(n)</td><td>factorial, sum</td></tr>
<tr><td>Logarithmic</td><td>1, on n/2</td><td class="num">O(log n)</td><td class="num">O(log n)</td><td>fast power, binary search</td></tr>
<tr><td>Binary, halving</td><td>2, on n/2</td><td class="num">O(n) or O(n log n)</td><td class="num">O(log n)</td><td>tree traversal, merge sort</td></tr>
<tr><td>Binary, decrementing</td><td>2, on n−1 and n−2</td><td class="num">O(2ⁿ)</td><td class="num">O(n)</td><td>naive Fibonacci, subsets</td></tr>
</table></div>

<h2>Thinking recursively: the Towers of Hanoi</h2>
<p>Some problems that look difficult with loops become simple once you think recursively. In the Towers of Hanoi you must move a stack of n disks from peg A to peg C using peg B, moving one disk at a time and never placing a larger disk on a smaller one.</p>
<p>Think only about the largest disk. It must move from A to C at some point, and at that moment all the other disks must be out of the way on B. So the solution has three parts: move the top n−1 disks from A to B, move the largest disk from A to C, then move the n−1 disks from B to C. The two inner moves are the same problem with one fewer disk, so recursion solves them.</p>
${code('Hanoi.java')`
static void hanoi(int n, char from, char to, char via) {
  if (n == 0) return;                    // nothing to move
  hanoi(n - 1, from, via, to);           // clear the way
  System.out.println("move disk " + n + " " + from + " -> " + to);
  hanoi(n - 1, via, to, from);           // rebuild on top
}`}
${rs('hanoi.rs')`
fn hanoi(n: u32, from: char, to: char, via: char) {
    if n == 0 { return; }                  // nothing to move
    hanoi(n - 1, from, via, to);           // clear the way
    println!("move disk {n} {from} -> {to}");
    hanoi(n - 1, via, to, from);           // rebuild on top
}`}
${fig('hanoi', '<b>Figure 2.3</b> The seven moves for three disks. The middle move (disk 3) splits the solution into two copies of the two-disk solution.')}
<p>The number of moves satisfies M(n) = 2M(n−1) + 1, which gives M(n) = 2ⁿ − 1. This is optimal; no strategy can do better.</p>

<h2>Recursion versus iteration</h2>
<p>Any recursive function can be rewritten as a loop, sometimes with an explicit stack data structure to replace the call stack (Chapter 4 shows how). Any loop can be written as recursion. The choice is about clarity and resources:</p>
<ul>
<li>Recursion is clearer for naturally recursive data: trees, nested expressions, file systems, divide and conquer.</li>
<li>Iteration avoids stack-depth limits and the small overhead of method calls. Prefer it for simple linear processing, especially on large inputs.</li>
<li>A call is <strong>tail recursive</strong> when it is the very last thing the function does, as in <code>gcd</code>. Some languages turn tail calls into jumps so they use no extra stack. Java does not do this, so even tail-recursive Java code uses O(depth) stack. Rust does not guarantee it either (the optimiser sometimes does it in release builds), so do not rely on it in either language.</li>
</ul>
<h3>When the recursion is too deep</h3>
<p>Sometimes a recursive algorithm is clearly right but its depth grows with the input: a linked structure walked recursively, a depth-first search on a long chain, a parser fed deeply nested data. There are three fixes. Rewrite it with an explicit stack (Chapter 4), which is the most robust. Bound the depth, for example by always recursing into the smaller part and looping over the larger one. Or run the computation on a thread whose stack is big enough, which is a small change in both languages:</p>
${code('DeepRecursion.java')`
public class DeepRecursion {
  static long sum(int[] a, int i) { return i == a.length ? 0 : a[i] + sum(a, i + 1); }   // depth a.length

  public static void main(String[] args) throws InterruptedException {
    int[] big = new int[1_000_000];
    java.util.Arrays.fill(big, 1);
    // The last argument asks for a 512 MB stack for this thread only; the JVM may round it or ignore it.
    Thread t = new Thread(null, () -> System.out.println(sum(big, 0)), "deep", 512L << 20);
    t.start();
    t.join();                                    // prints 1000000
  }
}`}
${rs('deep_recursion.rs')`
fn sum(a: &[i32]) -> i64 {
    match a {
        [] => 0,
        [first, rest @ ..] => i64::from(*first) + sum(rest),   // depth a.len()
    }
}

fn main() {
    let big = vec![1; 1_000_000];
    let total = std::thread::Builder::new()
        .stack_size(512 << 20)                       // 512 MiB for this thread only
        .spawn(move || sum(&big))
        .expect("failed to spawn thread")
        .join()
        .expect("thread panicked");
    println!("{total}");                             // 1000000
}`}
<p>Treat the bigger stack as a stopgap. The depth still grows with the input, so the next, larger input fails in the same way; and a service that accepts nested input from outside (JSON, XML, expressions) should enforce a maximum nesting depth before it recurses at all.</p>

<h2>Backtracking</h2>
<p><strong>Backtracking</strong> is a way of searching through all possible combinations of choices. You build a candidate solution one choice at a time. After each choice you recurse to make the next one. When you return, you <em>undo</em> the choice and try the next alternative. If you can tell early that the current partial solution cannot lead anywhere useful, you stop exploring it. That early stop is called <strong>pruning</strong>.</p>
<p>The search space forms a tree. The root is the empty solution, each edge is a choice, and each leaf is a complete candidate. Backtracking is a depth-first walk of this tree.</p>
<h3>Generating all subsets</h3>
<p>For each element we have two choices: include it or leave it out. With n elements there are 2ⁿ subsets, and the decision tree has 2ⁿ leaves.</p>
${fig('subsets', '<b>Figure 2.4</b> The decision tree for the subsets of {1, 2, 3}. Each level decides one element. Step through the depth-first walk to see choices being made and undone.')}
${code('Subsets.java')`
import java.util.*;

public class Subsets {
  static void build(int[] a, int i, Deque<Integer> cur, List<List<Integer>> out) {
    if (i == a.length) {                   // every element decided: a leaf
      out.add(new ArrayList<>(cur));       // copy, because cur keeps changing
      return;
    }
    cur.addLast(a[i]);                     // choose: include a[i]
    build(a, i + 1, cur, out);             // explore
    cur.removeLast();                      // un-choose
    build(a, i + 1, cur, out);             // explore the "skip" branch
  }
  public static void main(String[] args) {
    List<List<Integer>> out = new ArrayList<>();
    build(new int[]{1, 2, 3}, 0, new ArrayDeque<>(), out);
    System.out.println(out);   // [[1, 2, 3], [1, 2], [1, 3], [1], [2, 3], [2], [3], []]
  }
}`}
${rs('subsets.rs')`
fn build(a: &[i32], i: usize, cur: &mut Vec<i32>, out: &mut Vec<Vec<i32>>) {
    if i == a.len() {                  // every element decided: a leaf
        out.push(cur.clone());         // copy, because cur keeps changing
        return;
    }
    cur.push(a[i]);                    // choose: include a[i]
    build(a, i + 1, cur, out);         // explore
    cur.pop();                         // un-choose
    build(a, i + 1, cur, out);         // explore the "skip" branch
}

fn main() {
    let mut out = Vec::new();
    build(&[1, 2, 3], 0, &mut Vec::new(), &mut out);
    println!("{out:?}");   // [[1, 2, 3], [1, 2], [1, 3], [1], [2, 3], [2], [3], []]
}`}
<h3>Generating all permutations</h3>
<p>For permutations, each level chooses <em>which</em> remaining element goes next. The first level has n choices, the second n−1, and so on, giving n! leaves. A boolean array tracks which elements are already used.</p>
${code('Permutations.java')`
static void permute(int[] a, boolean[] used, Deque<Integer> cur, List<List<Integer>> out) {
  if (cur.size() == a.length) { out.add(new ArrayList<>(cur)); return; }
  for (int i = 0; i < a.length; i++) {
    if (used[i]) continue;          // already placed earlier on this path
    used[i] = true;  cur.addLast(a[i]);      // choose
    permute(a, used, cur, out);              // explore
    cur.removeLast(); used[i] = false;       // un-choose
  }
}`}
${rs('permutations.rs')`
fn permute(a: &[i32], used: &mut [bool], cur: &mut Vec<i32>, out: &mut Vec<Vec<i32>>) {
    if cur.len() == a.len() { out.push(cur.clone()); return; }
    for (i, &x) in a.iter().enumerate() {
        if used[i] { continue; }            // already placed earlier on this path
        used[i] = true; cur.push(x);        // choose
        permute(a, used, cur, out);         // explore
        cur.pop(); used[i] = false;         // un-choose
    }
}`}
<h3>Pruning with constraints: N-Queens</h3>
<p>The N-Queens puzzle asks you to place n queens on an n × n chessboard so that no two attack each other. Since each row must have exactly one queen, we choose a column for row 0, then row 1, and so on. Before placing a queen we check whether any earlier queen shares its column or diagonal. If one does, we skip that column entirely. That single check removes most of the search tree.</p>
${fig('queens', '<b>Figure 2.5</b> Backtracking search for 4-Queens. Attacked squares are pruned immediately; when a row has no safe square, the search backs up and moves the previous queen.')}
${code('NQueens.java')`
public class NQueens {
  // Two squares share a "/" diagonal when r + c is equal and a "\" diagonal when r - c is equal.
  static int count(int r, int n, boolean[] col, boolean[] d1, boolean[] d2) {
    if (r == n) return 1;                             // all rows filled: one solution
    int total = 0;
    for (int c = 0; c < n; c++) {
      if (col[c] || d1[r + c] || d2[r - c + n - 1]) continue;   // prune attacked squares
      col[c] = d1[r + c] = d2[r - c + n - 1] = true;            // place
      total += count(r + 1, n, col, d1, d2);
      col[c] = d1[r + c] = d2[r - c + n - 1] = false;           // remove
    }
    return total;
  }
  public static void main(String[] args) {
    int n = 8;
    System.out.println(count(0, n, new boolean[n], new boolean[2 * n - 1], new boolean[2 * n - 1])); // 92
  }
}`}
${rs('n_queens.rs')`
// Two squares share a "/" diagonal when r + c is equal and a "\" diagonal when r - c is equal.
struct Board { n: usize, col: Vec<bool>, d1: Vec<bool>, d2: Vec<bool> }

impl Board {
    fn new(n: usize) -> Self {
        Board { n, col: vec![false; n], d1: vec![false; 2 * n - 1], d2: vec![false; 2 * n - 1] }
    }
    fn count(&mut self, r: usize) -> u64 {
        if r == self.n { return 1; }                        // all rows filled: one solution
        let mut total = 0;
        for c in 0..self.n {
            let (a, b) = (r + c, r + self.n - 1 - c);       // r - c + n - 1, ordered so usize never goes negative
            if self.col[c] || self.d1[a] || self.d2[b] { continue; }   // prune attacked squares
            self.mark(c, a, b, true);                       // place
            total += self.count(r + 1);
            self.mark(c, a, b, false);                      // remove
        }
        total
    }
    fn mark(&mut self, c: usize, a: usize, b: usize, v: bool) {
        self.col[c] = v; self.d1[a] = v; self.d2[b] = v;
    }
}

fn main() {
    println!("{}", Board::new(8).count(0));   // 92
}`}
<p>The three boolean arrays make the safety check O(1) instead of O(n). Without pruning, 8-Queens would examine 8⁸ ≈ 16.7 million placements. With pruning it visits about two thousand nodes.</p>

<h2>The backtracking template</h2>
<p>Almost every backtracking solution follows this shape. Learn it and you can write subsets, permutations, combinations, Sudoku and word search from the same skeleton.</p>
${code('Template (pseudocode)', 'none')`
void backtrack(state):
    if state is a complete solution:
        record a copy of it
        return
    for each choice available from state:
        if choice violates a constraint: continue        // prune
        apply choice to state                            // choose
        backtrack(state)                                 // explore
        undo choice                                      // un-choose`}
<p>Three questions define any backtracking problem: <strong>what is the state</strong> (the partial solution), <strong>what are the choices</strong> at each step, and <strong>when is the state complete or hopeless</strong>. Answer them before you write code.</p>
<div class="tbl"><table><tr><th>Problem</th><th>Choice at each level</th><th>Leaves</th><th>Time</th></tr>
<tr><td>Subsets</td><td>include or exclude element i</td><td class="num">2ⁿ</td><td class="num">O(n · 2ⁿ)</td></tr>
<tr><td>Permutations</td><td>which unused element comes next</td><td class="num">n!</td><td class="num">O(n · n!)</td></tr>
<tr><td>Combinations (k of n)</td><td>next element, larger than the last</td><td class="num">C(n, k)</td><td class="num">O(k · C(n, k))</td></tr>
<tr><td>N-Queens</td><td>column for the next row</td><td class="num">≤ n!</td><td class="num">much less in practice</td></tr>
<tr><td>Sudoku</td><td>digit for the next empty cell</td><td class="num">≤ 9^(empty)</td><td class="num">pruning makes it fast</td></tr>
</table></div>
<p>The extra factor of n in the subset and permutation costs comes from copying each solution into the output.</p>

<h2>Applied: matching a payment to open invoices</h2>
<p>A customer sends 138.75 without saying which invoices it pays. Matching incoming payments to open receivables (cash application) often comes down to finding a set of open invoices that add up exactly to the amount received. That is the subset-sum problem, and the subsets template with two pruning rules handles the modest number of open invoices a single customer has:</p>
<ul>
<li>Skip an invoice that is larger than the amount still unmatched.</li>
<li>Give up on a branch as soon as all the remaining invoices together cannot reach the unmatched amount. Precomputing suffix sums makes this test O(1).</li>
</ul>
<p>Trying the largest invoices first makes both rules fire sooner. Amounts are integers in cents: in floating point 0.1 + 0.2 is not exactly 0.3, and a search for an exact total would silently miss real matches.</p>
${code('InvoiceMatch.java')`
import java.util.*;

public class InvoiceMatch {
  // Returns the indices of invoices (amounts in cents) that add up exactly to payment, or an empty list.
  static List<Integer> match(long[] invoices, long payment) {
    Integer[] order = new Integer[invoices.length];
    for (int i = 0; i < order.length; i++) order[i] = i;
    Arrays.sort(order, (x, y) -> Long.compare(invoices[y], invoices[x]));   // largest first
    long[] suffix = new long[order.length + 1];             // suffix[k] = total of order[k..]
    for (int k = order.length - 1; k >= 0; k--) suffix[k] = suffix[k + 1] + invoices[order[k]];
    Deque<Integer> chosen = new ArrayDeque<>();
    return search(invoices, order, suffix, 0, payment, chosen) ? new ArrayList<>(chosen) : List.of();
  }

  static boolean search(long[] inv, Integer[] order, long[] suffix, int k, long remaining, Deque<Integer> chosen) {
    if (remaining == 0) return true;                                 // exact match
    if (k == order.length || suffix[k] < remaining) return false;    // prune: the rest cannot reach it
    long amount = inv[order[k]];
    if (amount <= remaining) {                                       // prune: too large to fit
      chosen.addLast(order[k]);                                      // choose
      if (search(inv, order, suffix, k + 1, remaining - amount, chosen)) return true;
      chosen.removeLast();                                           // un-choose
    }
    return search(inv, order, suffix, k + 1, remaining, chosen);     // skip this invoice
  }

  public static void main(String[] args) {
    long[] open = {12_000, 7_550, 31_000, 4_225, 9_999, 1_875};      // 120.00, 75.50, ...
    System.out.println(match(open, 13_875));                         // [0, 5]: 120.00 + 18.75
    System.out.println(match(open, 5_000));                          // []
  }
}`}
${rs('invoice_match.rs')`
// Returns the indices of invoices (amounts in cents) that add up exactly to payment.
fn match_payment(invoices: &[u64], payment: u64) -> Option<Vec<usize>> {
    let mut order: Vec<usize> = (0..invoices.len()).collect();
    order.sort_by_key(|&i| std::cmp::Reverse(invoices[i]));          // largest first
    let mut suffix = vec![0; order.len() + 1];                       // suffix[k] = total of order[k..]
    for k in (0..order.len()).rev() {
        suffix[k] = suffix[k + 1] + invoices[order[k]];
    }
    let mut chosen = Vec::new();
    search(invoices, &order, &suffix, 0, payment, &mut chosen).then_some(chosen)
}

fn search(inv: &[u64], order: &[usize], suffix: &[u64], k: usize, remaining: u64, chosen: &mut Vec<usize>) -> bool {
    if remaining == 0 { return true; }                               // exact match
    if k == order.len() || suffix[k] < remaining { return false; }   // prune: the rest cannot reach it
    let amount = inv[order[k]];
    if amount <= remaining {                                         // prune: too large to fit
        chosen.push(order[k]);                                       // choose
        if search(inv, order, suffix, k + 1, remaining - amount, chosen) { return true; }
        chosen.pop();                                                // un-choose
    }
    search(inv, order, suffix, k + 1, remaining, chosen)             // skip this invoice
}

fn main() {
    let open = [12_000, 7_550, 31_000, 4_225, 9_999, 1_875];        // 120.00, 75.50, ...
    println!("{:?}", match_payment(&open, 13_875));                 // Some([0, 5]): 120.00 + 18.75
    println!("{:?}", match_payment(&open, 5_000));                  // None
}`}
<p>Pruning does not change the worst case. Subset sum is NP-complete, so no known algorithm runs in time polynomial in the number of invoices on every input. When amounts are bounded integers, the dynamic programming of Chapter 19 solves it in O(n × amount) time instead. Real reconciliation also uses tolerances, dates and remittance references to narrow the candidates before any search runs.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Missing or unreachable base case.</strong> The recursion never stops and ends in <code>StackOverflowError</code>. Check that every path through the function reaches a base case.</li>
<li><strong>No progress.</strong> Calling <code>f(n)</code> from <code>f(n)</code>, or <code>f(n/2)</code> when n can be 0 or negative, loops forever.</li>
<li><strong>Adding the shared list instead of a copy.</strong> <code>out.add(cur)</code> stores a reference to a list that you keep modifying; at the end every entry is empty. Always add <code>new ArrayList&lt;&gt;(cur)</code>. Rust rejects this mistake at compile time: <code>cur</code> is a borrowed <code>&amp;mut Vec</code>, so you have to write <code>cur.clone()</code>.</li>
<li><strong>Forgetting to undo.</strong> If you mark a square, a used flag or a visited cell, unmark it after the recursive call returns.</li>
<li><strong>Exponential recomputation.</strong> If the same arguments recur, memoize (Chapter 19).</li>
<li><strong>Overflow in the answer.</strong> 21! does not fit in a long. Use <code>BigInteger</code> or work modulo a prime. In Rust, <code>checked_mul</code> turns the overflow into <code>None</code>, as <code>fact_checked</code> shows.</li>
</ul></div>
