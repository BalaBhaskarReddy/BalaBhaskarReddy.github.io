<p>An int or long used as a set of flags is called a <strong>bitmask</strong>. It makes subset DP possible (the state "which items have been used" fits in one integer) and is how Java's <code>EnumSet</code> works internally. For more than 64 flags, <code>BitSet</code> provides the same operations over an array of longs. Rust's standard library has no bit-set type: the bitflags crate generates typed flag sets, and crates such as fixedbitset provide large bit sets.</p>

<h2>Two pointers</h2>
<p>Two indices moving through an array, either toward each other or in the same direction, replace a nested loop in many problems. The trick works when each step can safely discard one candidate.</p>
<h3>Opposite ends</h3>
<p>To find two values in a sorted array that add up to a target, start at both ends. If the sum is too small, the left value cannot pair with anything (it is already paired with the largest remaining value), so move it right. If the sum is too large, move the right pointer left.</p>
${fig('twoptr', '<b>Figure 21.2</b> Two pointers on a sorted array. Each step rules out one value permanently, so the search takes at most n steps.')}
${code('Two pointers')`
static int[] pairWithSum(int[] sorted, int target) {
  int l = 0, r = sorted.length - 1;
  while (l < r) {
    int s = sorted[l] + sorted[r];
    if (s == target) return new int[]{l, r};
    if (s < target) l++; else r--;
  }
  return null;
}

// Same direction: remove duplicates from a sorted array in place.
static int dedupe(int[] a) {
  if (a.length == 0) return 0;
  int write = 1;
  for (int read = 1; read < a.length; read++)
    if (a[read] != a[write - 1]) a[write++] = a[read];
  return write;          // a[0..write) holds the distinct values
}`}
${rs('two_pointers.rs')`
use std::cmp::Ordering;

fn pair_with_sum(sorted: &[i32], target: i32) -> Option<(usize, usize)> {
    let (mut l, mut r) = (0, sorted.len().checked_sub(1)?);   // None for an empty slice
    while l < r {
        match (sorted[l] + sorted[r]).cmp(&target) {
            Ordering::Equal => return Some((l, r)),
            Ordering::Less => l += 1,
            Ordering::Greater => r -= 1,
        }
    }
    None
}

// Same direction: remove duplicates from a sorted slice in place. (A Vec has dedup() for this.)
fn dedupe(a: &mut [i32]) -> usize {
    if a.is_empty() { return 0; }
    let mut write = 1;
    for read in 1..a.len() {
        if a[read] != a[write - 1] { a[write] = a[read]; write += 1; }
    }
    write                  // a[..write] holds the distinct values
}
`}
<p>Variations: 3Sum (fix one value, two-pointer the rest, O(n²)), container with most water (move the shorter side), checking palindromes, partitioning around a pivot, and merging two sorted arrays.</p>

<h2>Sliding windows</h2>
<p>A sliding window is a contiguous range [lo, hi] that moves across an array or string. The right edge expands to take in new elements; the left edge contracts whenever the window violates a condition. Because both edges only move forward, the total work is O(n) even though there are two loops.</p>
${fig('window', '<b>Figure 21.3</b> A variable-size window over "abcabcbb". It grows while its characters are distinct and jumps forward past a repeat.')}
${code('Sliding window templates')`
// Longest substring with no repeated character.
static int longestDistinct(String s) {
  Map<Character, Integer> last = new HashMap<>();
  int best = 0;
  for (int lo = 0, hi = 0; hi < s.length(); hi++) {
    Integer p = last.put(s.charAt(hi), hi);
    if (p != null && p >= lo) lo = p + 1;          // shrink past the earlier copy
    best = Math.max(best, hi - lo + 1);
  }
  return best;
}

// Shortest subarray with sum >= target (all values positive, target > 0).
static int shortestAtLeast(int[] a, int target) {
  int best = Integer.MAX_VALUE, sum = 0;
  for (int lo = 0, hi = 0; hi < a.length; hi++) {
    sum += a[hi];                                  // expand
    while (sum >= target) {                        // valid: try to shrink
      best = Math.min(best, hi - lo + 1);
      sum -= a[lo++];
    }
  }
  return best == Integer.MAX_VALUE ? 0 : best;
}`}
${rs('sliding_window.rs')`
use std::collections::HashMap;

// Longest substring with no repeated character.
fn longest_distinct(s: &str) -> usize {
    let mut last: HashMap<char, usize> = HashMap::new();
    let (mut lo, mut best) = (0, 0);
    for (hi, c) in s.chars().enumerate() {
        if let Some(p) = last.insert(c, hi) && p >= lo { lo = p + 1; }   // shrink past the earlier copy
        best = best.max(hi + 1 - lo);
    }
    best
}

// Shortest subarray with sum >= target (all values positive, target > 0). None if there is none.
fn shortest_at_least(a: &[u32], target: u64) -> Option<usize> {
    let (mut lo, mut sum, mut best) = (0, 0u64, usize::MAX);
    for (hi, &x) in a.iter().enumerate() {
        sum += u64::from(x);                              // expand
        while sum >= target {                             // valid: try to shrink
            best = best.min(hi + 1 - lo);
            sum -= u64::from(a[lo]);
            lo += 1;
        }
    }
    (best != usize::MAX).then_some(best)
}
`}
<p>The window pattern needs the condition to be <em>monotone</em>: making a valid window larger (for "at most" conditions) or smaller (for "at least" conditions) must keep it valid. With negative numbers, a sum condition is not monotone, and prefix sums with a hash map (below) or a monotonic deque (Chapter 5) take over.</p>

<h2>Prefix sums and difference arrays</h2>
<p>A <strong>prefix sum</strong> array stores P[i] = a[0] + … + a[i−1], with P[0] = 0. After O(n) preprocessing, the sum of any range is a single subtraction.</p>
${fig('prefix', '<b>Figure 21.4</b> Any range sum is the difference of two prefix sums.')}
<div class="formula">sum(a[l..r]) = P[r + 1] − P[l]</div>
${code('Prefix sums')`
static long[] prefix(int[] a) {
  long[] P = new long[a.length + 1];
  for (int i = 0; i < a.length; i++) P[i + 1] = P[i] + a[i];
  return P;
}
// 2-D version: sum of a rectangle in O(1) after O(rows * cols) preprocessing.
// S[r+1][c+1] = a[r][c] + S[r][c+1] + S[r+1][c] - S[r][c]
// rect(r1,c1,r2,c2) = S[r2+1][c2+1] - S[r1][c2+1] - S[r2+1][c1] + S[r1][c1]`}
${rs('prefix_sums.rs')`
fn prefix(a: &[i32]) -> Vec<i64> {
    let running = a.iter().scan(0i64, |s, &x| { *s += i64::from(x); Some(*s) });
    std::iter::once(0).chain(running).collect()           // p[0] = 0, p[i + 1] = p[i] + a[i]
}
// 2-D version: sum of a rectangle in O(1) after O(rows * cols) preprocessing.
// s[r+1][c+1] = a[r][c] + s[r][c+1] + s[r+1][c] - s[r][c]
// rect(r1,c1,r2,c2) = s[r2+1][c2+1] - s[r1][c2+1] - s[r2+1][c1] + s[r1][c1]
`}
<p>Combined with a hash map of previously seen prefix sums, the same idea counts subarrays with a given sum in O(n), even with negative numbers (Chapter 14).</p>
<p>A <strong>difference array</strong> is the inverse. To add v to every element of a[l..r] for many ranges, record D[l] += v and D[r + 1] −= v, then take a prefix sum of D at the end. Each range update is O(1). Booking systems use this to count how many reservations overlap each day.</p>

<h2>Sweep lines and intervals</h2>
<p>Many interval problems become simple if you turn each interval into two events, a start and an end, sort all events by time, and sweep through them in order while keeping a running state.</p>
${code('Maximum number of overlapping intervals')`
static int maxOverlap(int[][] intervals) {           // half-open [start, end), start < end
  int n = intervals.length;
  int[] starts = new int[n], ends = new int[n];
  for (int i = 0; i < n; i++) { starts[i] = intervals[i][0]; ends[i] = intervals[i][1]; }
  Arrays.sort(starts); Arrays.sort(ends);
  int active = 0, best = 0;
  for (int i = 0, j = 0; i < n; ) {
    if (starts[i] < ends[j]) { active++; i++; best = Math.max(best, active); }   // something begins
    else { active--; j++; }                                                     // something ends first
  }
  return best;     // e.g. the number of meeting rooms needed
}`}
${rs('max_overlap.rs')`
fn max_overlap(intervals: &[(i32, i32)]) -> usize {       // half-open [start, end)
    // One event per endpoint: +1 at a start, -1 at an end. Sorting puts (t, -1) before (t, 1),
    // so an interval that ends at t is closed before one that starts at t is opened.
    let mut events: Vec<(i32, i32)> = intervals.iter().flat_map(|&(s, e)| [(s, 1), (e, -1)]).collect();
    events.sort_unstable();
    let (mut active, mut best) = (0, 0);
    for (_, delta) in events {
        active += delta;
        best = best.max(active);
    }
    best as usize          // e.g. the number of meeting rooms needed
}
`}
<p>The Rust version sorts the start and end events together instead, with ends first at equal times, which also copes with empty intervals; the Java version assumes every interval is non-empty. Sweep lines also merge overlapping intervals, compute the union length of rectangles and find the skyline of a city. The key decisions are how to break ties between events at the same time and what state to carry along.</p>

<h2>Range queries with updates</h2>
<p>Prefix sums answer range sums in O(1) but cost O(n) to update after changing one element. When updates and queries are interleaved, use a tree that splits the array into ranges.</p>
<h3>Segment tree</h3>
<p>A <strong>segment tree</strong> is a binary tree in which each node stores the sum (or minimum, maximum, or any associative combination) of one range of the array. The root covers everything, each child covers half of its parent's range, and the leaves are single elements.</p>
${fig('segtree', '<b>Figure 21.5</b> A segment tree over eight values. The query [2..6] uses three nodes that lie fully inside the range: 7 + 9 = 16, 6 + 4 = 10 and 1.')}
${code('SegmentTree.java')`
public class SegmentTree {
  private final int n; private final long[] t;       // iterative, 0-indexed, sums
  public SegmentTree(int[] a) {
    n = a.length; t = new long[2 * n];
    for (int i = 0; i < n; i++) t[n + i] = a[i];     // leaves in the second half
    for (int i = n - 1; i > 0; i--) t[i] = t[2 * i] + t[2 * i + 1];
  }
  public void set(int i, int v) {                    // O(log n)
    for (t[i += n] = v; i > 1; i >>= 1) t[i >> 1] = t[i] + t[i ^ 1];
  }
  public long sum(int l, int r) {                    // sum of a[l..r), O(log n)
    long s = 0;
    for (l += n, r += n; l < r; l >>= 1, r >>= 1) {
      if ((l & 1) == 1) s += t[l++];
      if ((r & 1) == 1) s += t[--r];
    }
    return s;
  }
}`}
${rs('segment_tree.rs')`
pub struct SegmentTree { n: usize, t: Vec<i64> }        // iterative, 0-indexed, sums

impl SegmentTree {
    pub fn new(a: &[i32]) -> Self {
        let n = a.len();
        let mut t = vec![0; 2 * n];
        for (leaf, &x) in t[n..].iter_mut().zip(a) { *leaf = i64::from(x); }   // leaves in the second half
        for i in (1..n).rev() { t[i] = t[2 * i] + t[2 * i + 1]; }
        SegmentTree { n, t }
    }
    pub fn set(&mut self, i: usize, v: i32) {             // O(log n)
        let mut i = i + self.n;
        self.t[i] = i64::from(v);
        while i > 1 { self.t[i >> 1] = self.t[i] + self.t[i ^ 1]; i >>= 1; }
    }
    pub fn sum(&self, l: usize, r: usize) -> i64 {        // sum of a[l..r), O(log n)
        let (mut l, mut r, mut s) = (l + self.n, r + self.n, 0);
        while l < r {
            if l & 1 == 1 { s += self.t[l]; l += 1; }
            if r & 1 == 1 { r -= 1; s += self.t[r]; }
            l >>= 1; r >>= 1;
        }
        s
    }
}
`}
<p>Both operations are O(log n). With "lazy propagation", a segment tree can also add a value to a whole range in O(log n).</p>
<h3>Fenwick tree</h3>
<p>A <strong>Fenwick tree</strong> (binary indexed tree) supports point updates and prefix sums in O(log n) using a single array and the <code>i &amp; -i</code> trick to jump between responsible ranges. It is shorter than a segment tree and very fast, but limited to operations that can be undone, like addition.</p>
${code('Fenwick.java')`
public class Fenwick {
  private final long[] f;                         // 1-indexed internally
  public Fenwick(int n) { f = new long[n + 1]; }
  public void add(int i, long v) { for (i++; i < f.length; i += i & -i) f[i] += v; }
  public long prefix(int i) { long s = 0; for (i++; i > 0; i -= i & -i) s += f[i]; return s; }  // a[0..i]
  public long range(int l, int r) { return prefix(r) - (l > 0 ? prefix(l - 1) : 0); }
}`}
${rs('fenwick.rs')`
pub struct Fenwick { f: Vec<i64> }                       // 1-indexed internally

impl Fenwick {
    pub fn new(n: usize) -> Self { Fenwick { f: vec![0; n + 1] } }
    // i & i.wrapping_neg() is Java's i & -i for an unsigned index: the lowest set bit.
    pub fn add(&mut self, i: usize, v: i64) {
        let mut i = i + 1;
        while i < self.f.len() { self.f[i] += v; i += i & i.wrapping_neg(); }
    }
    pub fn prefix(&self, i: usize) -> i64 {              // a[0..=i]
        let (mut i, mut s) = (i + 1, 0);
        while i > 0 { s += self.f[i]; i -= i & i.wrapping_neg(); }
        s
    }
    pub fn range(&self, l: usize, r: usize) -> i64 {     // a[l..=r]
        self.prefix(r) - if l > 0 { self.prefix(l - 1) } else { 0 }
    }
}
`}

<h2>Randomized techniques</h2>
<h3>Reservoir sampling</h3>
<p>To pick k items uniformly at random from a stream whose length you do not know in advance, keep the first k items. When the ith item arrives (counting from 1, with i &gt; k), keep it with probability k/i, in place of a random member of the sample. At every moment, each item seen so far is in the sample with equal probability. Audit teams use this to sample transactions from a log too large to hold in memory.</p>
${code('Reservoir sampling')`
static int[] reservoir(Iterator<Integer> stream, int k, Random rnd) {
  int[] sample = new int[k];
  int i = 0;
  while (stream.hasNext()) {
    int x = stream.next();
    if (i < k) sample[i] = x;
    else { int j = rnd.nextInt(i + 1); if (j < k) sample[j] = x; }   // keep with probability k/(i+1)
    i++;
  }
  return sample;
}`}
${rs('reservoir.rs')`
use rand::{Rng, RngExt};                                   // the rand crate

// A uniform random sample of k items from a stream of unknown length (fewer if it is shorter).
fn reservoir<T>(stream: impl IntoIterator<Item = T>, k: usize, rng: &mut impl Rng) -> Vec<T> {
    let mut sample = Vec::with_capacity(k);
    for (i, x) in stream.into_iter().enumerate() {
        if i < k { sample.push(x); }
        else {
            let j = rng.random_range(0..=i);                // keep with probability k/(i+1)
            if j < k { sample[j] = x; }                     // the replaced item is dropped here
        }
    }
    sample
}
`}
<p>The Rust version is generic and moves each item into the sample, so nothing is copied, and it returns fewer than k items when the stream is shorter, where the Java array would keep zeros.</p>
<h3>Shuffling</h3>
<p>The <strong>Fisher-Yates shuffle</strong> produces a uniformly random permutation in O(n): for i from n − 1 down to 1, swap a[i] with a[random index in 0..i]. Swapping with a random index from the whole array instead is a famous bug that produces a biased shuffle. <code>Collections.shuffle</code> implements the correct version, and so does <code>shuffle</code> from the rand crate's <code>SliceRandom</code> trait in Rust.</p>

<h2>Rate limiting and sketches</h2>
<p>Payment APIs, card-testing defences and fraud rules all count events per key (per card, per merchant, per IP address) over time. Chapter 5 kept a log of timestamps for each key, which is exact but uses memory in proportion to the limit. With millions of keys, two cheaper ideas take over: a bucket that summarizes a key's recent rate in two numbers, and sketches that count approximately for every key at once in a fixed amount of memory. Together with the Bloom filter of Chapter 14, which answers "have I seen this before?", they cover most counting questions over streams.</p>
<h3>Token bucket</h3>
<p>A <strong>token bucket</strong> holds up to <em>capacity</em> tokens and gains one every <em>msPerToken</em> milliseconds. Each request spends a token and is refused when the bucket is empty. A client that has been quiet can burst up to the capacity, but over any long period it gets no more than the refill rate. The state is two numbers, topped up from the elapsed time when a request arrives, so no timer is needed.</p>
${code('TokenBucket.java')`
// Allows bursts of up to capacity requests and a long-run rate of one request per msPerToken.
class TokenBucket {
  private final long capacity, msPerToken;
  private long tokens, lastMs;                     // tokens available as of time lastMs

  TokenBucket(long capacity, long msPerToken, long nowMs) {
    this.capacity = capacity; this.msPerToken = msPerToken;
    tokens = capacity; lastMs = nowMs;             // start full
  }

  boolean allow(long nowMs) {
    long earned = (nowMs - lastMs) / msPerToken;   // whole tokens earned since lastMs
    if (earned > 0) {
      tokens = Math.min(capacity, tokens + earned);
      lastMs = tokens == capacity ? nowMs : lastMs + earned * msPerToken;   // keep progress toward the next token
    }
    if (tokens == 0) return false;
    tokens--;
    return true;
  }

  public static void main(String[] args) {
    TokenBucket b = new TokenBucket(3, 1_000, 0);  // bursts of 3, then one per second
    StringBuilder sb = new StringBuilder();
    for (long t : new long[]{0, 0, 0, 0, 500, 1_000, 1_500, 2_500, 9_000, 9_000, 9_000, 9_000})
      sb.append(b.allow(t) ? 'Y' : 'n');
    System.out.println(sb);                        // YYYnnYnYYYYn
  }
}
`}
${rs('token_bucket.rs')`
// Allows bursts of up to capacity requests and a long-run rate of one request per ms_per_token.
struct TokenBucket {
    capacity: u64,
    ms_per_token: u64,
    tokens: u64,                                         // tokens available as of last_ms
    last_ms: u64,
}

impl TokenBucket {
    fn new(capacity: u64, ms_per_token: u64, now_ms: u64) -> Self {
        TokenBucket { capacity, ms_per_token, tokens: capacity, last_ms: now_ms }   // start full
    }

    fn allow(&mut self, now_ms: u64) -> bool {
        let earned = now_ms.saturating_sub(self.last_ms) / self.ms_per_token;   // whole tokens earned
        if earned > 0 {
            self.tokens = self.capacity.min(self.tokens.saturating_add(earned));
            self.last_ms = if self.tokens == self.capacity {
                now_ms                                   // full: restart the clock
            } else {
                self.last_ms + earned * self.ms_per_token   // keep progress toward the next token
            };
        }
        if self.tokens == 0 { return false; }
        self.tokens -= 1;
        true
    }
}

fn main() {
    let mut b = TokenBucket::new(3, 1_000, 0);           // bursts of 3, then one per second
    let times = [0, 0, 0, 0, 500, 1_000, 1_500, 2_500, 9_000, 9_000, 9_000, 9_000];
    let s: String = times.iter().map(|&t| if b.allow(t) { 'Y' } else { 'n' }).collect();
    println!("{s}");                                     // YYYnnYnYYYYn
}
`}
<p>The example allows three requests at time 0 and refuses the next two. It earns one token back at each whole second, and after the long pause it is full again at 9 seconds, but never holds more than three. Behind several servers, the bucket lives in a shared store and the refill-and-spend step must be a single atomic operation, for the same reason as the idempotency claim in Chapter 14. Idle buckets can simply be deleted, because a missing bucket behaves like a full one.</p>
<h3>Count-min sketch</h3>
<p>To count attempts per card across millions of cards without a map entry for each, a <strong>count-min sketch</strong> keeps a table of d rows by w counters. Adding a key increments one counter in each row, chosen by that row's hash; estimating a key reads the same d counters and takes the smallest. Other keys that share a counter can only inflate it, so an estimate is never too low, and the row with the fewest collisions gives the closest answer. With w = ⌈e/ε⌉ and d = ⌈ln(1/δ)⌉, an estimate exceeds the true count by more than ε times the total of all counts with probability at most δ.</p>
${code('CountMinSketch.java')`
// Approximate counts for any number of keys in fixed memory. An estimate is never below the true
// count and, with probability at least 1 - delta, at most epsilon * (total of all counts) above it.
public class CountMinSketch {
  private final long[][] table;
  private final int width, depth;

  public CountMinSketch(double epsilon, double delta) {
    width = (int) Math.ceil(Math.E / epsilon);
    depth = (int) Math.ceil(Math.log(1 / delta));
    table = new long[depth][width];
  }
  // Row r uses column h1 + r * h2 (double hashing, as in the Bloom filter of Chapter 14).
  private int column(String key, int r) {
    long h = key.hashCode() * 0x9E3779B97F4A7C15L;          // spread the 32-bit hash over 64 bits
    int h1 = (int) (h >>> 32), h2 = (int) h | 1;
    return Math.floorMod(h1 + r * h2, width);
  }
  public void add(String key, long count) {
    for (int r = 0; r < depth; r++) table[r][column(key, r)] += count;
  }
  public long estimate(String key) {                         // the least-inflated counter wins
    long best = Long.MAX_VALUE;
    for (int r = 0; r < depth; r++) best = Math.min(best, table[r][column(key, r)]);
    return best;
  }

  public static void main(String[] args) {
    CountMinSketch cms = new CountMinSketch(0.001, 0.01);    // 2,719 x 5 counters
    for (int i = 0; i < 100_000; i++) cms.add("card-" + (i % 20_000), 1);   // 20,000 cards, 5 attempts each
    for (int i = 0; i < 300; i++) cms.add("card-4242", 1);   // one card tried 300 more times
    System.out.println(cms.estimate("card-4242") + " " + cms.estimate("card-17"));
  }
}
`}
${rs('count_min_sketch.rs')`
use std::hash::{BuildHasher, Hash, RandomState};

// Approximate counts for any number of keys in fixed memory. An estimate is never below the true
// count and, with probability at least 1 - delta, at most epsilon * (total of all counts) above it.
pub struct CountMinSketch { table: Vec<Vec<u64>>, width: u64, hasher: RandomState }

impl CountMinSketch {
    pub fn new(epsilon: f64, delta: f64) -> Self {
        let width = (std::f64::consts::E / epsilon).ceil() as u64;
        let depth = (1.0 / delta).ln().ceil() as usize;
        CountMinSketch { table: vec![vec![0; width as usize]; depth], width, hasher: RandomState::new() }
    }
    // Row r uses column h1 + r * h2 (double hashing, as in the Bloom filter of Chapter 14).
    fn columns<T: Hash + ?Sized>(&self, key: &T) -> impl Iterator<Item = usize> + use<T> {
        let h = self.hasher.hash_one(key);
        let (h1, h2, w) = (h >> 32, (h & 0xffff_ffff) | 1, self.width);
        (0..self.table.len() as u64).map(move |r| (h1.wrapping_add(r.wrapping_mul(h2)) % w) as usize)
    }
    pub fn add<T: Hash + ?Sized>(&mut self, key: &T, count: u64) {
        for (r, c) in self.columns(key).enumerate() { self.table[r][c] += count; }
    }
    pub fn estimate<T: Hash + ?Sized>(&self, key: &T) -> u64 {     // the least-inflated counter wins
        self.columns(key).enumerate().map(|(r, c)| self.table[r][c]).min().unwrap_or(0)
    }
}
`}
<p>The example sizes the sketch for ε = 0.001 and δ = 0.01: 2,719 × 5 counters, about 106 KiB of longs, however many cards there are. After 100,300 additions the error bound is about 100, so the card attempted 305 times stands out (it reads 335), while an ordinary card attempted 5 times reads 40. That makes a count-min sketch the right tool for finding heavy hitters, the keys with unusually large counts, and the wrong tool for exact per-key limits. Two sketches with the same dimensions and hash functions merge by adding their tables, so each server can count locally and a central job can combine the results. (The Rust version seeds its hasher randomly, so its numbers vary from run to run within the same bound.)</p>
<h3>Counting distinct values: HyperLogLog</h3>
<p>"How many different cards were used at this merchant today?" is a distinct count, and an exact answer needs a set of every card seen. <strong>HyperLogLog</strong> estimates it from the hashes alone. A hash that starts with k zero bits turns up about once in 2ᵏ distinct values, so the longest run of leading zeros seen hints at how many distinct values there were. Splitting the hashes among m registers and combining the registers' estimates with a harmonic mean gives a standard error of about 1.04/√m: with m = 2¹⁴ registers of 6 bits, about 12 KiB, the error is around 0.8% whether there are thousands or billions of distinct cards. Two HyperLogLogs merge by taking the larger value in each register, and many databases and caches offer them as a built-in type.</p>

<h2>Matrix and grid techniques</h2>
<ul>
<li><strong>Direction arrays</strong> such as <code>int[][] DIRS = {{1,0},{-1,0},{0,1},{0,-1}}</code> keep grid BFS and DFS code short and free of copy-paste errors.</li>
<li><strong>Rotating a square matrix 90°</strong> in place: transpose it, then reverse each row.</li>
<li><strong>Spiral order:</strong> keep four boundaries (top, bottom, left, right) and shrink each one after walking along it.</li>
<li><strong>Encoding a cell</strong> as a single integer r × cols + c lets you store it in sets and union-find structures.</li>
</ul>

<h2>Numbers and overflow</h2>
<ul>
<li>Use <code>long</code> for sums and products that might exceed about 2.1 billion. <code>Math.addExact</code> and <code>Math.multiplyExact</code> throw instead of silently wrapping.</li>
<li>In Rust, integer overflow panics in debug builds and wraps in release builds (unless overflow checks are turned on). Say what you mean with <code>checked_add</code> (returns <code>None</code>), <code>wrapping_add</code> or <code>saturating_add</code>.</li>
<li>For money, never use <code>double</code>: 0.1 + 0.2 is not exactly 0.3 in binary floating point. Store integer minor units (paise, cents) in a long, or use <code>BigDecimal</code> with an explicit rounding mode. Rust has no decimal type in its standard library: use integer minor units, or a crate such as rust_decimal.</li>
<li>When a problem asks for an answer "modulo 10⁹ + 7", reduce after every addition and multiplication, and add the modulus before reducing a subtraction.</li>
<li>The greatest common divisor (Euclid, Chapter 2) and fast modular exponentiation (Chapter 18) are the two number-theory tools you will use most.</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Operator precedence with bits.</strong> <code>x &amp; 1 == 0</code> parses as <code>x &amp; (1 == 0)</code>, which Java rejects as a type error. Write <code>(x &amp; 1) == 0</code>. Rust gives <code>&amp;</code> the higher precedence, so there the unbracketed form means what it looks like.</li>
<li><strong>&gt;&gt; versus &gt;&gt;&gt;</strong> on negative numbers.</li>
<li><strong>Shifting by 32 or more.</strong> Java masks the shift distance, so <code>1 &lt;&lt; 32</code> equals 1. Use <code>1L &lt;&lt; k</code> for wider masks. Rust panics on such a shift in debug builds; <code>checked_shl</code> and <code>wrapping_shl</code> make the choice explicit.</li>
<li><strong>A sliding window on a non-monotone condition.</strong> Use prefix sums instead.</li>
<li><strong>Prefix-sum overflow.</strong> Use long.</li>
<li><strong>Biased shuffles and samples.</strong> Use Fisher-Yates and reservoir sampling exactly as written.</li>
<li><strong>Doubles for money.</strong> Use integer minor units or BigDecimal.</li>
<li><strong>Treating a sketch as exact.</strong> A count-min estimate can be high by up to ε times the total; use it to find suspects, then check them exactly.</li>
</ul></div>
