CH.push({
  id: 'ch03', n: 3, title: 'Linked Lists',
  lede: 'A linked list stores a sequence as a chain of separate nodes, each pointing to the next. It gives up fast access by position in exchange for cheap insertion and removal anywhere you already hold a reference. Linked lists also teach the pointer manipulation skills that trees and graphs depend on.',
  html: `
<h2>Why not just use an array?</h2>
<p>An array stores its elements in one contiguous block of memory. Because every element has the same size, the address of element i is <em>base + i × size</em>, so reading any position takes one step. That is the array's great strength.</p>
<p>The same layout is also its weakness. To insert a value at the front of an array of n elements, every existing element must shift one place to the right: n moves. Removing from the front shifts everything left. And a fixed-size array cannot grow; a dynamic array grows by copying into a larger block, as you saw in Chapter 1.</p>
<p>A <strong>linked list</strong> drops the requirement that elements be adjacent. Each element lives in its own small object called a <strong>node</strong>, and each node stores a reference to the next node. The list itself only needs to remember the first node, called the <strong>head</strong>.</p>
${fig('memlayout', '<b>Figure 3.1</b> An array occupies consecutive addresses. A linked list\'s nodes can be scattered anywhere; each node records where the next one is.')}
<p>Adding a node at the front now means creating it and pointing it at the old head: constant work, no shifting. The price is that you cannot jump to position i. You must start at the head and follow i references.</p>

<h2>Nodes and traversal</h2>
<p>A node in a singly linked list has two fields: the value and the reference to the next node. The last node's <code>next</code> is <code>null</code>, which marks the end.</p>
${code('Node.java')`
class Node {
  int val;
  Node next;              // null means "no next node": this is the tail
  Node(int val) { this.val = val; }
}`}
${rs('node.rs')`
type Link = Option<Box<Node>>;      // a link either owns the next node or is None

struct Node {
    val: i32,
    next: Link,                     // None means "no next node": this is the tail
}

impl Node {
    fn new(val: i32) -> Self { Node { val, next: None } }
}`}
<div class="note key"><b>Linked lists in Rust</b><p>In the Rust listings a link is an <code>Option&lt;Box&lt;Node&gt;&gt;</code>: a <code>Box</code> owns one node on the heap, and <code>None</code> plays the part of <code>null</code>. Ownership shapes the code in three ways. Each node has exactly one owner (its predecessor, or the variable holding the head), so operations move nodes around with <code>take()</code>, which hands over the link and leaves <code>None</code> in its place. Anything that needs a second pointer to a node, such as a <code>prev</code> link, a <code>tail</code> reference or a cycle, cannot be built from <code>Box</code>; the listings below keep such nodes in a <code>Vec</code> and link them by index, the usual safe alternative to reference counting (<code>Rc&lt;RefCell&lt;Node&gt;&gt;</code> with <code>Weak</code> back links) or raw pointers. And dropping a long list frees it through one nested call per node, which can overflow the stack; Chapter 4 shows the short fix.</p></div>
<p>Almost every linked list algorithm starts with the same loop. A cursor starts at the head and moves along until it falls off the end.</p>
${code('Traversal')`
static int length(Node head) {
  int count = 0;
  for (Node cur = head; cur != null; cur = cur.next) count++;
  return count;
}

static boolean contains(Node head, int target) {
  for (Node cur = head; cur != null; cur = cur.next)
    if (cur.val == target) return true;
  return false;
}`}
${rs('traversal.rs')`
fn length(head: Option<&Node>) -> usize {      // pass list.as_deref() to borrow the first node
    let mut count = 0;
    let mut cur = head;
    while let Some(node) = cur {                // stops when cur is None
        count += 1;
        cur = node.next.as_deref();             // Option<Box<Node>> to Option<&Node>
    }
    count
}

fn contains(head: Option<&Node>, target: i32) -> bool {
    // The same walk as an iterator: successors follows next until it meets None.
    std::iter::successors(head, |node| node.next.as_deref()).any(|node| node.val == target)
}`}
<p>Memorize the condition <code>cur != null</code>. Using <code>cur.next != null</code> instead stops one node early, which is sometimes what you want (to stop <em>at</em> the last node) and is a classic off-by-one bug when it is not.</p>

<h2>Inserting a node</h2>
<p>To insert at the front, point the new node at the current head and make the new node the head. To insert after a node you already hold, called <code>prev</code>, you need two pointer assignments, and their order matters.</p>
${fig('llinsert', '<b>Figure 3.2</b> Inserting 25 after 20. The new node is linked to its successor first, then its predecessor is redirected to it.')}
${code('Insertion')`
static Node insertFront(Node head, int v) {
  Node n = new Node(v);
  n.next = head;          // new node points at the old first node
  return n;               // and becomes the new head
}

static void insertAfter(Node prev, int v) {
  Node n = new Node(v);
  n.next = prev.next;     // 1. hook the new node to the rest of the list
  prev.next = n;          // 2. then redirect prev to the new node
}

static Node insertBack(Node head, int v) {   // O(n) without a tail pointer
  Node n = new Node(v);
  if (head == null) return n;
  Node cur = head;
  while (cur.next != null) cur = cur.next;   // stop AT the last node
  cur.next = n;
  return head;
}`}
${rs('insertion.rs')`
fn insert_front(head: Link, v: i32) -> Link {
    Some(Box::new(Node { val: v, next: head }))     // the new node takes ownership of the old list
}

fn insert_after(prev: &mut Node, v: i32) {
    let rest = prev.next.take();                    // 1. detach the rest of the list (prev.next is now None)
    prev.next = Some(Box::new(Node { val: v, next: rest }));   // 2. the new node holds the rest
}

fn insert_back(head: &mut Link, v: i32) {           // O(n) without a tail pointer
    let mut cur = head;                             // a cursor to a link, not to a node
    while let Some(node) = cur {
        cur = &mut node.next;                       // stop AT the empty link after the last node
    }
    *cur = Some(Box::new(Node::new(v)));
}`}
<p>If you swapped the two steps in <code>insertAfter</code>, the first assignment would overwrite <code>prev.next</code>, and the only reference to the rest of the list would be lost. When in doubt, ask: "after this assignment, can I still reach every node?"</p>
<p>Inserting at the back requires walking to the last node, which costs O(n). Lists that need fast appends keep a second reference, <code>tail</code>, that always points at the last node, which makes appending O(1).</p>

<h2>Deleting a node</h2>
<p>To remove a node from a singly linked list you must change the <code>next</code> field of the node <em>before</em> it. The node itself is simply skipped over.</p>
${fig('lldelete', '<b>Figure 3.3</b> Deleting 25 by redirecting its predecessor around it.')}
<h3>The dummy head trick</h3>
<p>Deleting the first node is a special case, because it has no predecessor. Instead of writing separate code for it, create a temporary <strong>dummy</strong> (or sentinel) node whose <code>next</code> is the real head. Now every real node has a predecessor, and the special case disappears. At the end, return <code>dummy.next</code>.</p>
${code('Delete all nodes with a given value')`
static Node removeAll(Node head, int target) {
  Node dummy = new Node(0);
  dummy.next = head;
  Node prev = dummy;
  while (prev.next != null) {
    if (prev.next.val == target) prev.next = prev.next.next;   // skip it; prev stays
    else prev = prev.next;                                      // keep it; advance
  }
  return dummy.next;      // may differ from the original head
}`}
${rs('remove_all.rs')`
// No dummy node needed: the cursor can point at the head link itself, so the head is not a special case.
fn remove_all(head: &mut Link, target: i32) {
    let mut cur = head;
    loop {
        match cur {
            None => return,
            Some(node) if node.val == target => *cur = node.next.take(),   // skip it; cur stays
            Some(node) => cur = &mut node.next,                            // keep it; advance
        }
    }
}`}
<p>Use a dummy head whenever the head of the list might change: deletions, merges, partitioning and building a new list from scratch.</p>
<p>The Rust version needs no dummy. Its cursor points at a <em>link</em> (<code>&amp;mut Option&lt;Box&lt;Node&gt;&gt;</code>) rather than at a node, so it can point at the head link itself, and removing the first node is no different from removing any other. A removed node is freed the moment its <code>Box</code> is dropped; there is no garbage collector to wait for.</p>

<h2>Doubly and circular lists</h2>
<p>In a <strong>doubly linked list</strong> each node also stores <code>prev</code>, a reference to the node before it. You can walk in both directions, and given a reference to any node you can remove it in O(1) without searching for its predecessor. Each insertion or deletion now updates four references instead of two, and each node uses a little more memory.</p>
${fig('dll', '<b>Figure 3.4</b> A doubly linked list. Each node has a next link (blue) and a prev link (purple). Keeping both head and tail makes operations at either end O(1).')}
${code('Doubly linked node and O(1) unlink')`
class DNode {
  int key, val;
  DNode prev, next;
  DNode(int k, int v) { key = k; val = v; }
}

// With sentinel head and tail nodes, a real node always has both neighbours.
static void unlink(DNode n) {
  n.prev.next = n.next;
  n.next.prev = n.prev;
}
static void insertAfter(DNode at, DNode n) {
  n.prev = at;  n.next = at.next;
  at.next.prev = n;  at.next = n;
}`}
${rs('dlist.rs')`
// Each node is reachable from two neighbours, so neither can own it as a Box.
// The nodes live in a Vec and refer to each other by index; slots 0 and 1 are sentinels.
const HEAD: usize = 0;
const TAIL: usize = 1;

struct DNode { key: i32, val: i32, prev: usize, next: usize }

struct DList { nodes: Vec<DNode> }

impl DList {
    fn new() -> Self {
        let sentinel = || DNode { key: 0, val: 0, prev: HEAD, next: TAIL };
        DList { nodes: vec![sentinel(), sentinel()] }
    }
    fn alloc(&mut self, key: i32, val: i32) -> usize {       // store a node, return its index
        self.nodes.push(DNode { key, val, prev: HEAD, next: TAIL });
        self.nodes.len() - 1
    }
    // With sentinels, a real node always has both neighbours.
    fn unlink(&mut self, n: usize) {
        let DNode { prev, next, .. } = self.nodes[n];
        self.nodes[prev].next = next;
        self.nodes[next].prev = prev;
    }
    fn insert_after(&mut self, at: usize, n: usize) {
        let next = self.nodes[at].next;
        self.nodes[n].prev = at;    self.nodes[n].next = next;
        self.nodes[next].prev = n;  self.nodes[at].next = n;
    }
}`}
<p>The Rust version keeps the nodes in a <code>Vec</code> and uses indices as links, with slots 0 and 1 as the sentinels. Indices are plain numbers, so the borrow checker has nothing to object to, and the nodes sit together in memory. The price is bookkeeping: a removed node's slot has to be recycled by hand (the LRU cache below reuses the slot of the entry it evicts), and a stale index is a logic bug rather than a compile error.</p>
<p>In a <strong>circular linked list</strong>, the last node points back to the first instead of to <code>null</code>. It suits round-robin scheduling, where you cycle through items forever. Traversal must stop when you return to the starting node, because there is no <code>null</code> to stop at.</p>

<h2>Reversing a list in place</h2>
<p>Reversal is the single most important linked list exercise because it forces you to manage three references at once. Walk the list with <code>cur</code>, remember the previous node in <code>prev</code>, and before changing <code>cur.next</code>, save it in <code>nxt</code> so you can continue.</p>
${fig('reverse', '<b>Figure 3.5</b> Iterative reversal. At every step, the part to the left of cur is already reversed and the part from cur onwards is untouched.')}
${code('Reverse.java')`
static Node reverse(Node head) {
  Node prev = null, cur = head;
  while (cur != null) {
    Node nxt = cur.next;   // 1. remember the rest of the list
    cur.next = prev;       // 2. flip this node's pointer
    prev = cur;            // 3. advance prev
    cur = nxt;             // 4. advance cur
  }
  return prev;             // prev is the old tail, now the head
}

// Recursive version: reverse the rest, then hook this node on at the end.
static Node reverseRec(Node head) {
  if (head == null || head.next == null) return head;
  Node newHead = reverseRec(head.next);
  head.next.next = head;   // the node after head now points back at head
  head.next = null;
  return newHead;
}`}
${rs('reverse.rs')`
fn reverse(mut head: Link) -> Link {
    let mut prev: Link = None;
    while let Some(mut node) = head {   // node is the old cur
        head = node.next.take();        // 1. remember the rest of the list (this also advances cur)
        node.next = prev;               // 2. flip this node's pointer
        prev = Some(node);              // 3. advance prev
    }
    prev                                // prev is the old tail, now the head
}

// Recursive version. Java's head.next.next = head needs two references to one node,
// which Box forbids, so this one carries the reversed part along instead.
fn reverse_rec(head: Link, reversed: Link) -> Link {
    match head {
        None => reversed,
        Some(mut node) => {
            let rest = node.next.take();
            node.next = reversed;                   // put this node in front of the reversed part
            reverse_rec(rest, Some(node))
        }
    }
}`}
<p>The invariant is the key to getting it right: <code>prev</code> is the head of the already-reversed part and <code>cur</code> is the head of the part still to do. The iterative version uses O(1) extra space; the recursive version uses O(n) stack.</p>

<h2>Fast and slow pointers</h2>
<p>Many list problems are solved by moving two references at different speeds. Because you cannot index into a list, this is how you find positions relative to the end or the middle in a single pass.</p>
<h3>Finding the middle</h3>
<p>Move <code>slow</code> one step and <code>fast</code> two steps at a time. When fast reaches the end, slow is halfway there.</p>
${code('Middle')`
static Node middle(Node head) {
  Node slow = head, fast = head;
  while (fast != null && fast.next != null) {   // check both before jumping two
    slow = slow.next;
    fast = fast.next.next;
  }
  return slow;    // for even length, the second of the two middle nodes
}`}
${rs('middle.rs')`
fn middle(head: Option<&Node>) -> Option<&Node> {
    let (mut slow, mut fast) = (head, head);
    // Only step when fast has a next node: the same check as fast != null && fast.next != null.
    while let Some(f) = fast.and_then(|f| f.next.as_deref()) {
        slow = slow.and_then(|s| s.next.as_deref());
        fast = f.next.as_deref();
    }
    slow    // for even length, the second of the two middle nodes
}`}
<h3>The nth node from the end</h3>
<p>Move a lead pointer n steps ahead, then move both pointers together. When the lead falls off the end, the trailing pointer is n nodes from the end.</p>
${code('NthFromEnd')`
static Node nthFromEnd(Node head, int n) {      // n = 1 means the last node
  Node lead = head;
  for (int i = 0; i < n; i++) {
    if (lead == null) return null;              // the list has fewer than n nodes
    lead = lead.next;
  }
  Node trail = head;
  while (lead != null) {                        // keep the gap of n nodes
    lead = lead.next;
    trail = trail.next;
  }
  return trail;
}`}
${rs('nth_from_end.rs')`
fn nth_from_end(head: Option<&Node>, n: usize) -> Option<&Node> {   // n = 1 means the last node
    let mut lead = head;
    for _ in 0..n {
        lead = lead?.next.as_deref();          // ? returns None: the list has fewer than n nodes
    }
    let mut trail = head;
    while let Some(l) = lead {
        lead = l.next.as_deref();
        trail = trail?.next.as_deref();
    }
    trail
}`}
<p>To <em>remove</em> that node you need its predecessor, so start both pointers at a dummy node and stop the trailing pointer one step earlier: that is LeetCode 19 in the practice list.</p>
<h3>Detecting a cycle: Floyd's algorithm</h3>
<p>A bug or corrupted data can make a list loop back on itself, and then a normal traversal never ends. Floyd's tortoise and hare algorithm detects this in O(n) time with O(1) memory. If there is no cycle, fast reaches <code>null</code>. If there is a cycle, both pointers eventually enter it, and fast closes the gap by one node per step, so they must meet.</p>
${fig('floyd', '<b>Figure 3.6</b> Floyd\'s algorithm on a list whose tail loops back to node 3. Phase 1 detects the cycle; phase 2 finds where it starts.')}
${code('Floyd.java')`
static Node cycleStart(Node head) {
  Node slow = head, fast = head;
  while (fast != null && fast.next != null) {
    slow = slow.next;
    fast = fast.next.next;
    if (slow == fast) {                 // phase 1: they met inside the cycle
      Node p = head;
      while (p != slow) { p = p.next; slow = slow.next; }   // phase 2
      return p;                         // the first node of the cycle
    }
  }
  return null;                          // fast hit the end: no cycle
}`}
${rs('floyd.rs')`
// A Box cannot point back at an earlier node, so a list with a cycle is modelled by index:
// next[i] is the node after node i, or None at the end.
fn cycle_start(next: &[Option<usize>], head: usize) -> Option<usize> {
    let (mut slow, mut fast) = (head, head);
    loop {
        slow = next[slow]?;
        fast = next[next[fast]?]?;          // fast hit the end: no cycle
        if slow == fast { break; }          // phase 1: they met inside the cycle
    }
    let mut p = head;
    while p != slow {                       // phase 2
        p = next[p]?;
        slow = next[slow]?;
    }
    Some(p)                                 // the first node of the cycle
}`}
<p>Why does phase 2 work? Let the distance from the head to the cycle start be a, and let the meeting point be b steps into the cycle of length L. When they meet, fast has travelled twice as far as slow, which works out to a = kL − b for some whole number k. So walking a steps from the head and a steps from the meeting point lands both pointers on the cycle start at the same time.</p>
<p>The Rust version works on an array of next indices, because a list built from <code>Box</code> cannot contain a cycle at all. Written that way, the same code finds the cycle in any function that maps a finite set to itself, such as repeatedly applying a pseudo-random generator.</p>

<h2>Merging two sorted lists</h2>
<p>Merging is the heart of merge sort (Chapter 10) and appears in many interview problems. With a dummy head and a tail pointer, the code is short: repeatedly take the smaller front node from either list and attach it to the result.</p>
${code('Merge.java')`
static Node merge(Node a, Node b) {
  Node dummy = new Node(0), tail = dummy;
  while (a != null && b != null) {
    if (a.val <= b.val) { tail.next = a; a = a.next; }   // <= keeps equal keys in order
    else                { tail.next = b; b = b.next; }
    tail = tail.next;
  }
  tail.next = (a != null) ? a : b;   // attach whatever is left
  return dummy.next;
}`}
${rs('merge.rs')`
fn merge(mut a: Link, mut b: Link) -> Link {
    let mut head: Link = None;
    let mut tail = &mut head;                       // cursor to the empty link at the end of the result
    while let (Some(x), Some(y)) = (&a, &b) {
        let src = if x.val <= y.val { &mut a } else { &mut b };   // <= keeps equal keys in order
        let mut node = src.take().expect("checked above");
        *src = node.next.take();                    // advance that list
        tail = &mut tail.insert(node).next;         // attach the node and move the cursor past it
    }
    *tail = a.or(b);                                // attach whatever is left
    head
}`}
<p>No new nodes are created; the existing nodes are relinked. The cost is O(n + m) time and O(1) extra space.</p>

<h2>Design example: an LRU cache</h2>
<p>A <strong>least recently used</strong> cache keeps a fixed number of entries and, when full, evicts the entry that was used longest ago. It needs O(1) lookup by key, O(1) "mark as most recently used", and O(1) "remove the least recently used". No single structure does all three, but two together do:</p>
<ul>
<li>A <strong>hash map</strong> from key to node gives O(1) lookup (Chapter 14).</li>
<li>A <strong>doubly linked list</strong> ordered by recency gives O(1) moves and removals, because each node can unlink itself.</li>
</ul>
${fig('lru', '<b>Figure 3.7</b> The map finds a node in O(1). The list keeps nodes in recency order, with sentinel nodes at both ends.')}
${code('LRUCache.java')`
import java.util.*;

public class LRUCache {
  private static class DNode { int key, val; DNode prev, next; DNode(int k, int v) { key = k; val = v; } }
  private final Map<Integer, DNode> map = new HashMap<>();
  private final DNode head = new DNode(0, 0), tail = new DNode(0, 0);   // sentinels
  private final int capacity;

  public LRUCache(int capacity) {
    if (capacity < 1) throw new IllegalArgumentException("capacity must be at least 1");
    this.capacity = capacity; head.next = tail; tail.prev = head;
  }

  public int get(int key) {
    DNode n = map.get(key);
    if (n == null) return -1;
    unlink(n); addFront(n);               // used now: move to the front
    return n.val;
  }
  public void put(int key, int value) {
    DNode n = map.get(key);
    if (n != null) { n.val = value; unlink(n); addFront(n); return; }
    if (map.size() == capacity) {         // evict the least recently used
      DNode lru = tail.prev;
      unlink(lru); map.remove(lru.key);
    }
    n = new DNode(key, value);
    addFront(n); map.put(key, n);
  }
  private void unlink(DNode n) { n.prev.next = n.next; n.next.prev = n.prev; }
  private void addFront(DNode n) { n.next = head.next; n.prev = head; head.next.prev = n; head.next = n; }

  public static void main(String[] args) {
    LRUCache c = new LRUCache(2);
    c.put(1, 1); c.put(2, 2); c.get(1);   // order now 1, 2
    c.put(3, 3);                          // evicts 2
    System.out.println(c.get(2));         // -1
  }
}`}
${rs('lru_cache.rs')`
use std::collections::HashMap;

const HEAD: usize = 0;      // sentinel slots in nodes
const TAIL: usize = 1;

struct DNode { key: i32, val: i32, prev: usize, next: usize }

pub struct LruCache {
    map: HashMap<i32, usize>,       // key -> index of its node
    nodes: Vec<DNode>,              // the doubly linked list, linked by index
    capacity: usize,
}

impl LruCache {
    pub fn new(capacity: usize) -> Self {
        assert!(capacity > 0, "capacity must be at least 1");
        let sentinel = || DNode { key: 0, val: 0, prev: HEAD, next: TAIL };
        LruCache { map: HashMap::new(), nodes: vec![sentinel(), sentinel()], capacity }
    }

    pub fn get(&mut self, key: i32) -> Option<i32> {
        let n = *self.map.get(&key)?;
        self.unlink(n); self.add_front(n);              // used now: move to the front
        Some(self.nodes[n].val)
    }

    pub fn put(&mut self, key: i32, value: i32) {
        if let Some(&n) = self.map.get(&key) {
            self.nodes[n].val = value; self.unlink(n); self.add_front(n);
            return;
        }
        let n = if self.map.len() == self.capacity {    // evict the least recently used...
            let lru = self.nodes[TAIL].prev;
            self.unlink(lru);
            self.map.remove(&self.nodes[lru].key);
            self.nodes[lru] = DNode { key, val: value, prev: HEAD, next: TAIL };   // ...and reuse its slot
            lru
        } else {
            self.nodes.push(DNode { key, val: value, prev: HEAD, next: TAIL });
            self.nodes.len() - 1
        };
        self.add_front(n);
        self.map.insert(key, n);
    }

    fn unlink(&mut self, n: usize) {
        let (p, x) = (self.nodes[n].prev, self.nodes[n].next);
        self.nodes[p].next = x; self.nodes[x].prev = p;
    }
    fn add_front(&mut self, n: usize) {
        let x = self.nodes[HEAD].next;
        self.nodes[n].prev = HEAD; self.nodes[n].next = x;
        self.nodes[x].prev = n; self.nodes[HEAD].next = n;
    }
}

fn main() {
    let mut c = LruCache::new(2);
    c.put(1, 1); c.put(2, 2); c.get(1);     // order now 1, 2
    c.put(3, 3);                            // evicts 2
    println!("{:?}", c.get(2));             // None
}`}
<p>Java also provides this behaviour ready-made: a <code>LinkedHashMap</code> constructed with <code>accessOrder = true</code>, with <code>removeEldestEntry</code> overridden to return <code>size() &gt; capacity</code>. Rust's standard library has no such map. The Rust listing builds the list from indices, as in the doubly linked list above, and reuses the evicted entry's slot, so the node vector never grows beyond capacity plus the two sentinels.</p>

<h2>Costs and when to use a list</h2>
<div class="tbl"><table><tr><th>Operation</th><th>Dynamic array</th><th>Singly linked</th><th>Doubly linked</th></tr>
<tr><td>Access by index</td><td class="num">O(1)</td><td class="num">O(n)</td><td class="num">O(n)</td></tr>
<tr><td>Insert or delete at front</td><td class="num">O(n)</td><td class="num">O(1)</td><td class="num">O(1)</td></tr>
<tr><td>Insert at back</td><td class="num">O(1) amortized</td><td class="num">O(1) with tail</td><td class="num">O(1)</td></tr>
<tr><td>Delete at back</td><td class="num">O(1)</td><td class="num">O(n)</td><td class="num">O(1)</td></tr>
<tr><td>Insert or delete next to a known node</td><td class="num">O(n)</td><td class="num">O(1) after it</td><td class="num">O(1) before or after</td></tr>
<tr><td>Search by value</td><td class="num">O(n)</td><td class="num">O(n)</td><td class="num">O(n)</td></tr>
<tr><td>Extra memory per element</td><td>none (some slack capacity)</td><td>one reference</td><td>two references</td></tr>
</table></div>
<p>In Java, <code>java.util.LinkedList</code> is a doubly linked list that implements both <code>List</code> and <code>Deque</code>. In practice <code>ArrayList</code> and <code>ArrayDeque</code> are usually faster even for workloads that look list-friendly, because their elements sit next to each other in memory and the CPU cache loves that. Reach for linked nodes when you hold references to nodes and must splice them in O(1), as in an LRU cache, or when you write your own trees and graphs. Rust's <code>std::collections::LinkedList</code> is also doubly linked, and its documentation steers you to <code>Vec</code> or <code>VecDeque</code> for the same reason.</p>

<h2>Memory and the cache</h2>
<p>The cost table counts operations, and by that count a linked list looks at least as good as an array for many workloads. Measured programs usually disagree, for two reasons that the RAM model of Chapter 1 leaves out.</p>
<p><strong>Memory per element.</strong> Every Java object carries a header, and generic collections hold references to boxed values. Measuring two million elements on a 64-bit JDK 21 with default settings gives these figures (the values were outside the small cache of shared <code>Integer</code> objects, so each element is a separate object):</p>
<div class="tbl"><table><tr><th>Structure</th><th>Bytes per element</th><th>Where they go</th></tr>
<tr><td><code>int[]</code></td><td class="num">4</td><td>the value itself</td></tr>
<tr><td><code>ArrayList&lt;Integer&gt;</code></td><td class="num">20</td><td>4-byte reference plus a 16-byte <code>Integer</code></td></tr>
<tr><td><code>LinkedList&lt;Integer&gt;</code></td><td class="num">40</td><td>24-byte node (header, item, next, prev) plus a 16-byte <code>Integer</code></td></tr>
<tr><td>Rust <code>Vec&lt;i32&gt;</code></td><td class="num">4</td><td>the value itself, stored inline</td></tr>
<tr><td>Rust <code>Option&lt;Box&lt;Node&gt;&gt;</code> list of <code>i32</code></td><td class="num">16 + allocator overhead</td><td>8-byte pointer and 4-byte value, padded to 16; one heap allocation per node</td></tr>
</table></div>
<p><strong>Locality.</strong> The processor fetches memory in cache lines, typically 64 bytes, and during a sequential scan it prefetches the next lines before they are needed, so walking an array streams through memory. Walking a list is a chain of dependent loads: the address of the next node is unknown until the current node has arrived, so prefetching cannot run ahead, and nodes allocated at different times can be far apart. A step that misses the caches waits for main memory, which is far slower than a cache hit. On large collections the list traversal is commonly several times slower than the array traversal, even though both perform the same number of operations.</p>
<p>The practical rule follows. Default to <code>ArrayList</code> and <code>ArrayDeque</code> in Java and to <code>Vec</code> and <code>VecDeque</code> in Rust, and store primitives (<code>int[]</code>, <code>long[]</code>, <code>Vec&lt;i64&gt;</code>) when the volume is large, as in a batch of transaction amounts. Linked nodes earn their place when you hold references into the middle of the sequence and splice there, which is exactly the LRU cache's situation.</p>


<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>NullPointerException on fast.next.next.</strong> Always check <code>fast != null &amp;&amp; fast.next != null</code> before taking two steps.</li>
<li><strong>Losing the rest of the list.</strong> Save <code>cur.next</code> before overwriting it.</li>
<li><strong>Forgetting the head can change.</strong> Return the new head from methods that modify the list, or use a dummy node.</li>
<li><strong>Comparing values instead of references.</strong> Cycle detection compares nodes with <code>==</code>; two different nodes can hold the same value.</li>
<li><strong>Off-by-one when stopping.</strong> Decide whether the loop should stop <em>on</em> the last node or <em>after</em> it, and pick the condition to match.</li>
</ul></div>

CH.push({
  id: 'ch04', n: 4, title: 'Stacks',
  lede: 'A stack is a collection where the last item added is the first one removed. That one rule makes stacks the natural tool for anything that must be undone in reverse order: nested brackets, expression evaluation, backtracking and the call stack itself.',
  html: `
<h2>The stack ADT</h2>
<p>Picture a stack of plates. You add a plate on top, and you take the top plate off. You never pull a plate from the middle. This discipline is called <strong>LIFO</strong>: last in, first out.</p>
<p>The stack ADT has a small set of operations:</p>
<div class="tbl"><table><tr><th>Operation</th><th>Meaning</th><th>Cost</th></tr>
<tr><td><code>push(x)</code></td><td>place x on top</td><td class="num">O(1)</td></tr>
<tr><td><code>pop()</code></td><td>remove and return the top item</td><td class="num">O(1)</td></tr>
<tr><td><code>peek()</code></td><td>return the top item without removing it</td><td class="num">O(1)</td></tr>
<tr><td><code>isEmpty()</code>, <code>size()</code></td><td>inspect the stack</td><td class="num">O(1)</td></tr>
</table></div>
${fig('stackops', '<b>Figure 4.1</b> A sequence of stack operations. Whatever was pushed last is always the next to leave.')}
<p>Stacks appear wherever work has to be resumed in reverse order. The browser back button keeps a stack of pages. An editor's undo history is a stack of changes. The JVM keeps a stack of method frames, as you saw in Chapter 2. Any time you see the words "most recent" or "innermost", think of a stack.</p>

<h2>Implementing a stack</h2>
<h3>With an array</h3>
<p>Keep the elements in an array and a counter <code>size</code>. The top of the stack is <code>data[size - 1]</code>. Push writes at index <code>size</code> and increments it; pop decrements it and reads. When the array fills up, double it, exactly like the dynamic array in Chapter 1, so push is O(1) amortized.</p>
${code('ArrayStack.java')`
import java.util.*;

public class ArrayStack<T> {
  private Object[] data = new Object[8];
  private int size = 0;

  public void push(T x) {
    if (size == data.length) data = Arrays.copyOf(data, size * 2);   // grow geometrically
    data[size++] = x;
  }
  @SuppressWarnings("unchecked")
  public T pop() {
    if (size == 0) throw new NoSuchElementException("stack is empty");
    T x = (T) data[--size];
    data[size] = null;             // let the garbage collector reclaim it
    return x;
  }
  @SuppressWarnings("unchecked")
  public T peek() {
    if (size == 0) throw new NoSuchElementException("stack is empty");
    return (T) data[size - 1];
  }
  public boolean isEmpty() { return size == 0; }
  public int size() { return size; }
}`}
${rs('array_stack.rs')`
// Vec already is an array-backed stack: push and pop at the end, doubling when full.
pub struct ArrayStack<T> {
    data: Vec<T>,
}

impl<T> ArrayStack<T> {
    pub fn new() -> Self { ArrayStack { data: Vec::new() } }
    pub fn push(&mut self, x: T) { self.data.push(x); }        // O(1) amortized
    pub fn pop(&mut self) -> Option<T> { self.data.pop() }     // None when empty; the value moves out
    pub fn peek(&self) -> Option<&T> { self.data.last() }
    pub fn is_empty(&self) -> bool { self.data.is_empty() }
    pub fn len(&self) -> usize { self.data.len() }
}

impl<T> Default for ArrayStack<T> {
    fn default() -> Self { Self::new() }
}`}
<p>Setting the vacated slot to <code>null</code> matters in a long-lived stack. Without it, the array would still hold a reference to the popped object and the garbage collector could not free it. This bug is called <strong>loitering</strong>. Rust code cannot loiter in this way: <code>Vec::pop</code> moves the value out to the caller, and the vector keeps no copy of it.</p>
<h3>With a linked list</h3>
<p>The head of a singly linked list makes a perfect top: inserting and removing at the head are both O(1), and there is never any resizing.</p>
${code('LinkedStack.java')`
public class LinkedStack<T> {
  private static class Node<T> { T val; Node<T> next; Node(T v, Node<T> n) { val = v; next = n; } }
  private Node<T> top;
  private int size;

  public void push(T x) { top = new Node<>(x, top); size++; }
  public T pop() {
    if (top == null) throw new java.util.NoSuchElementException();
    T x = top.val; top = top.next; size--;
    return x;
  }
  public T peek() {
    if (top == null) throw new java.util.NoSuchElementException();
    return top.val;
  }
  public boolean isEmpty() { return top == null; }
}`}
${rs('linked_stack.rs')`
pub struct LinkedStack<T> {
    top: Option<Box<Node<T>>>,
    size: usize,
}

struct Node<T> { val: T, next: Option<Box<Node<T>>> }

impl<T> LinkedStack<T> {
    pub fn new() -> Self { LinkedStack { top: None, size: 0 } }

    pub fn push(&mut self, x: T) {
        let next = self.top.take();
        self.top = Some(Box::new(Node { val: x, next }));
        self.size += 1;
    }
    pub fn pop(&mut self) -> Option<T> {
        let node = self.top.take()?;        // None when empty
        self.top = node.next;
        self.size -= 1;
        Some(node.val)
    }
    pub fn peek(&self) -> Option<&T> { self.top.as_ref().map(|n| &n.val) }
    pub fn is_empty(&self) -> bool { self.top.is_none() }
}

impl<T> Default for LinkedStack<T> {
    fn default() -> Self { Self::new() }
}

// The automatic drop would free node 1, which frees node 2, and so on: one stack frame
// per node, enough to overflow on a long list. Unlinking in a loop avoids that.
impl<T> Drop for LinkedStack<T> {
    fn drop(&mut self) {
        let mut cur = self.top.take();
        while let Some(mut node) = cur {
            cur = node.next.take();
        }
    }
}`}
<p>The array version uses less memory per element and is friendlier to the CPU cache. The linked version never pays for a resize, so every push is O(1) in the worst case, not just amortized.</p>
<p>The Rust <code>LinkedStack</code> also implements <code>Drop</code>. Without it, dropping a stack of a million nodes would free them through a million nested calls, one per node, and overflow the thread stack (try it: it aborts in both debug and release builds). The loop frees the nodes one at a time instead. Any linked structure built from <code>Box</code> that can grow long needs the same few lines.</p>

<h3>Using Java's built-in stack</h3>
<p>Java has an old class called <code>java.util.Stack</code>. Avoid it. It extends <code>Vector</code>, so every method is synchronized (slow), and it exposes methods like <code>get(i)</code> and <code>add(i, x)</code> that break the stack discipline. Its own documentation recommends using a <code>Deque</code> instead. Rust has no separate stack type: a <code>Vec</code> is the stack, with <code>push</code>, <code>pop</code> and <code>last</code>.</p>
${code('Idiomatic Java')`
Deque<Integer> stack = new ArrayDeque<>();
stack.push(5);                 // adds at the front
stack.push(8);
int top = stack.peek();        // 8
int x = stack.pop();           // 8
boolean empty = stack.isEmpty();`}
${rs('idiomatic.rs')`
let mut stack: Vec<i32> = Vec::new();
stack.push(5);                     // adds at the end, which is the top
stack.push(8);
let top = stack.last().copied();   // Some(8)
let x = stack.pop();               // Some(8); None if the stack is empty
let empty = stack.is_empty();`}
<p><code>ArrayDeque</code> does not accept <code>null</code> elements, and <code>pop()</code> on an empty deque throws <code>NoSuchElementException</code>. Use <code>poll()</code> or <code>peek()</code> if you would rather get <code>null</code> back.</p>

<h2>Application: matching brackets</h2>
<p>A compiler must check that every opening bracket has a matching closing bracket of the same kind, and that the pairs nest properly. "([])" is fine; "([)]" is not, because the square bracket closes before the round one. The rule "the most recent unmatched opener must close first" is exactly LIFO.</p>
${fig('brackets', '<b>Figure 4.2</b> Bracket matching. Openers are pushed; each closer must match whatever is on top. Switch tabs to see a failure.')}
${code('Balanced.java')`
static boolean balanced(String s) {
  Deque<Character> st = new ArrayDeque<>();
  for (char c : s.toCharArray()) {
    switch (c) {
      case '(', '[', '{' -> st.push(c);
      case ')' -> { if (st.isEmpty() || st.pop() != '(') return false; }
      case ']' -> { if (st.isEmpty() || st.pop() != '[') return false; }
      case '}' -> { if (st.isEmpty() || st.pop() != '{') return false; }
      default -> { }           // ignore other characters
    }
  }
  return st.isEmpty();         // leftover openers mean "not balanced"
}`}
${rs('balanced.rs')`
fn balanced(s: &str) -> bool {
    let mut st = Vec::new();
    for c in s.chars() {
        let want = match c {
            '(' | '[' | '{' => { st.push(c); continue; }
            ')' => '(',
            ']' => '[',
            '}' => '{',
            _ => continue,                       // ignore other characters
        };
        if st.pop() != Some(want) { return false; }   // empty, or the wrong opener on top
    }
    st.is_empty()                                // leftover openers mean "not balanced"
}`}
<p>The same idea validates HTML and XML tags, JSON nesting and Terraform blocks.</p>

<h2>Application: evaluating expressions</h2>
<p>We normally write arithmetic in <strong>infix</strong> form, with operators between operands: 5 + (1 + 2) × 4 − 3. Infix needs precedence rules and parentheses, which makes it awkward for a machine. In <strong>postfix</strong> form (also called reverse Polish notation) each operator comes after its operands: 5 1 2 + 4 × + 3 −. Postfix needs no parentheses and no precedence rules, and a stack evaluates it in one pass.</p>
${fig('postfix', '<b>Figure 4.3</b> Evaluating a postfix expression. Numbers are pushed; each operator pops two operands and pushes the result.')}
${code('EvalRPN.java')`
static int evalPostfix(String[] tokens) {
  Deque<Integer> st = new ArrayDeque<>();
  for (String t : tokens) {
    switch (t) {
      case "+" -> st.push(st.pop() + st.pop());
      case "*" -> st.push(st.pop() * st.pop());
      case "-" -> { int b = st.pop(), a = st.pop(); st.push(a - b); }   // order matters
      case "/" -> { int b = st.pop(), a = st.pop(); st.push(a / b); }
      default  -> st.push(Integer.parseInt(t));
    }
  }
  return st.pop();
}`}
${rs('eval_rpn.rs')`
fn eval_postfix(tokens: &[&str]) -> Result<i32, String> {
    let mut st: Vec<i32> = Vec::new();
    for &t in tokens {
        if let Ok(v) = t.parse() { st.push(v); continue; }      // a number (including "-3")
        let (Some(b), Some(a)) = (st.pop(), st.pop()) else {    // b is popped first: the right operand
            return Err(format!("missing operand for {t}"));
        };
        st.push(match t {
            "+" => a + b,
            "-" => a - b,                                       // order matters
            "*" => a * b,
            "/" if b != 0 => a / b,
            "/" => return Err("division by zero".into()),
            _ => return Err(format!("unknown token {t}")),
        });
    }
    match st[..] {
        [v] => Ok(v),
        _ => Err("expected exactly one value at the end".into()),
    }
}`}
<h3>Converting infix to postfix</h3>
<p>Dijkstra's <strong>shunting-yard algorithm</strong> converts infix to postfix with a stack of operators. Read tokens left to right:</p>
<ol>
<li>A number goes straight to the output.</li>
<li>An operator first pops to the output every operator on the stack that has higher precedence (or equal precedence and is left-associative), then is pushed.</li>
<li>"(" is pushed. ")" pops operators to the output until the matching "(" is found, and discards both brackets.</li>
<li>At the end, pop all remaining operators to the output.</li>
</ol>
<p>For 3 + 4 × 2 the output is 3 4 2 × +, because × has higher precedence and stays on the stack above +. Combining shunting-yard with postfix evaluation gives you a complete calculator. Here is the conversion for non-negative integers, the four operators and parentheses:</p>
${code('Calculator.java')`
import java.util.*;

public class Calculator {
  static int prec(char op) { return op == '+' || op == '-' ? 1 : 2; }   // * and / bind tighter

  // Infix to postfix (shunting-yard) for non-negative integers, + - * / and parentheses.
  static List<String> toPostfix(String expr) {
    List<String> out = new ArrayList<>();
    Deque<Character> ops = new ArrayDeque<>();
    for (int i = 0; i < expr.length(); i++) {
      char c = expr.charAt(i);
      if (Character.isWhitespace(c)) continue;
      if (c >= '0' && c <= '9') {                               // read the whole number
        int j = i;
        while (j < expr.length() && expr.charAt(j) >= '0' && expr.charAt(j) <= '9') j++;
        out.add(expr.substring(i, j));
        i = j - 1;
      } else if (c == '(') {
        ops.push(c);
      } else if (c == ')') {                                    // pop back to the matching "("
        while (!ops.isEmpty() && ops.peek() != '(') out.add(String.valueOf(ops.pop()));
        if (ops.isEmpty()) throw new IllegalArgumentException("unmatched )");
        ops.pop();                                              // discard both brackets
      } else if ("+-*/".indexOf(c) >= 0) {
        while (!ops.isEmpty() && ops.peek() != '(' && prec(ops.peek()) >= prec(c))
          out.add(String.valueOf(ops.pop()));                   // >= : all four are left-associative
        ops.push(c);
      } else {
        throw new IllegalArgumentException("unexpected " + c);
      }
    }
    while (!ops.isEmpty()) {
      char op = ops.pop();
      if (op == '(') throw new IllegalArgumentException("unmatched (");
      out.add(String.valueOf(op));
    }
    return out;
  }

  public static void main(String[] args) {
    List<String> postfix = toPostfix("5 + (1 + 2) * 4 - 3");
    System.out.println(postfix);                                // [5, 1, 2, +, 4, *, +, 3, -]
    System.out.println(evalPostfix(postfix.toArray(String[]::new)));   // 14, with evalPostfix from above
  }
}`}
${rs('calculator.rs')`
fn prec(op: char) -> u8 { if op == '+' || op == '-' { 1 } else { 2 } }   // * and / bind tighter

// Infix to postfix (shunting-yard) for non-negative integers, + - * / and parentheses.
fn to_postfix(expr: &str) -> Result<Vec<String>, String> {
    let mut out = Vec::new();
    let mut ops: Vec<char> = Vec::new();
    let mut chars = expr.chars().peekable();
    while let Some(c) = chars.next() {
        match c {
            c if c.is_whitespace() => {}
            '0'..='9' => {                                      // read the whole number
                let mut num = c.to_string();
                while let Some(d) = chars.next_if(char::is_ascii_digit) { num.push(d); }
                out.push(num);
            }
            '(' => ops.push(c),
            ')' => loop {                                       // pop back to the matching "("
                match ops.pop() {
                    Some('(') => break,                         // discard both brackets
                    Some(op) => out.push(op.to_string()),
                    None => return Err("unmatched )".into()),
                }
            },
            '+' | '-' | '*' | '/' => {
                while let Some(&top) = ops.last() {
                    if top == '(' || prec(top) < prec(c) { break; }
                    out.push(top.to_string());                  // >= : all four are left-associative
                    ops.pop();
                }
                ops.push(c);
            }
            _ => return Err(format!("unexpected {c}")),
        }
    }
    while let Some(op) = ops.pop() {
        if op == '(' { return Err("unmatched (".into()); }
        out.push(op.to_string());
    }
    Ok(out)
}

fn main() {
    let postfix = to_postfix("5 + (1 + 2) * 4 - 3").unwrap();
    println!("{postfix:?}");                                    // ["5", "1", "2", "+", "4", "*", "+", "3", "-"]
    let tokens: Vec<&str> = postfix.iter().map(String::as_str).collect();
    println!("{:?}", eval_postfix(&tokens));                    // Ok(14), with eval_postfix from above
}`}
<p>Converting the infix form of Figure 4.3, 5 + (1 + 2) * 4 - 3, produces exactly the postfix tokens the figure evaluates. Two details deserve attention. The test is <code>&gt;=</code> because all four operators are left-associative: 8 - 3 - 2 must become 8 3 - 2 -, which is 3, not 8 3 2 - -, which is 7. A right-associative operator such as exponentiation would pop only on <code>&gt;</code>. And unary minus is not handled: a production parser, such as one that evaluates rule expressions in a screening or pricing engine, either marks a minus that follows an operator or a "(" as unary, or switches to a recursive-descent parser, which is the same algorithm with the call stack doing the work of the operator stack.</p>

<h2>Monotonic stacks</h2>
<p>A <strong>monotonic stack</strong> keeps its elements in sorted order from bottom to top. Before pushing a new element, you pop everything that would break the order. Each popped element has just met the element that "beats" it, which is exactly the information many problems ask for.</p>
<p>The classic example is <em>next greater element</em>: for every position, find the first element to its right that is larger. The brute-force approach checks every pair, which is O(n²). With a stack of indices whose values decrease from bottom to top, the answer takes one pass.</p>
${fig('nge', '<b>Figure 4.4</b> Next greater element with a monotonic stack. When a larger value arrives, it resolves every smaller value waiting on the stack.')}
${code('NextGreater.java')`
static int[] nextGreater(int[] a) {
  int[] res = new int[a.length];
  Arrays.fill(res, -1);
  Deque<Integer> st = new ArrayDeque<>();        // indices; their values decrease upward
  for (int i = 0; i < a.length; i++) {
    while (!st.isEmpty() && a[st.peek()] < a[i])
      res[st.pop()] = a[i];                      // a[i] is the first larger value to the right
    st.push(i);
  }
  return res;                                    // indices left on the stack keep -1
}`}
${rs('next_greater.rs')`
fn next_greater(a: &[i32]) -> Vec<i32> {
    let mut res = vec![-1; a.len()];
    let mut st: Vec<usize> = Vec::new();               // indices; their values decrease upward
    for (i, &x) in a.iter().enumerate() {
        while let Some(&j) = st.last().filter(|&&j| a[j] < x) {
            res[j] = x;                                // x is the first larger value to the right
            st.pop();
        }
        st.push(i);
    }
    res                                                // indices left on the stack keep -1
}`}
<p>Although there is a loop inside a loop, every index is pushed once and popped at most once, so the total work is O(n). This amortized argument is the same one from Chapter 1. Variations of the pattern answer "how many days until a warmer day", "the stock span", "the largest rectangle in a histogram" and "trapping rain water".</p>

<h2>Design example: a stack with O(1) minimum</h2>
<p>Suppose you need <code>push</code>, <code>pop</code> and <code>getMin</code>, all in O(1). Keep a second stack in parallel that stores, at each level, the minimum of everything at or below that level. When you push x, push <code>min(x, currentMin)</code> on the second stack. When you pop, pop both. The top of the second stack is always the current minimum.</p>
${code('MinStack.java')`
class MinStack {
  private final Deque<Integer> vals = new ArrayDeque<>(), mins = new ArrayDeque<>();
  public void push(int x) { vals.push(x); mins.push(mins.isEmpty() ? x : Math.min(x, mins.peek())); }
  public void pop()       { vals.pop(); mins.pop(); }
  public int top()        { return vals.peek(); }
  public int getMin()     { return mins.peek(); }
}`}
${rs('min_stack.rs')`
#[derive(Default)]
struct MinStack {
    vals: Vec<i32>,
    mins: Vec<i32>,     // mins[i] = minimum of vals[0..=i]
}

impl MinStack {
    fn push(&mut self, x: i32) {
        let m = self.mins.last().map_or(x, |&m| m.min(x));
        self.vals.push(x);
        self.mins.push(m);
    }
    fn pop(&mut self) -> Option<i32> { self.mins.pop(); self.vals.pop() }
    fn top(&self) -> Option<i32> { self.vals.last().copied() }
    fn get_min(&self) -> Option<i32> { self.mins.last().copied() }
}`}

<h2>Stacks and recursion</h2>
<p>Recursion is a stack in disguise: the JVM pushes a frame for each call and pops it on return. Any recursive algorithm can therefore be rewritten with an explicit stack. You do this when recursion would be too deep for the thread stack, or when you need to pause and resume a traversal.</p>
${code('Recursive and iterative depth-first traversal of a tree')`
// Recursive: the call stack remembers where to come back to.
static void preorder(TreeNode n, List<Integer> out) {
  if (n == null) return;
  out.add(n.val);
  preorder(n.left, out);
  preorder(n.right, out);
}

// Iterative: an explicit stack does the same job.
static List<Integer> preorderIter(TreeNode root) {
  List<Integer> out = new ArrayList<>();
  Deque<TreeNode> st = new ArrayDeque<>();
  if (root != null) st.push(root);
  while (!st.isEmpty()) {
    TreeNode n = st.pop();
    out.add(n.val);
    if (n.right != null) st.push(n.right);   // push right first so left is processed first
    if (n.left  != null) st.push(n.left);
  }
  return out;
}`}
${rs('preorder.rs')`
struct TreeNode { val: i32, left: Option<Box<TreeNode>>, right: Option<Box<TreeNode>> }

// Recursive: the call stack remembers where to come back to.
fn preorder(n: Option<&TreeNode>, out: &mut Vec<i32>) {
    let Some(n) = n else { return };
    out.push(n.val);
    preorder(n.left.as_deref(), out);
    preorder(n.right.as_deref(), out);
}

// Iterative: an explicit stack does the same job.
fn preorder_iter(root: Option<&TreeNode>) -> Vec<i32> {
    let mut out = Vec::new();
    let mut st: Vec<&TreeNode> = root.into_iter().collect();
    while let Some(n) = st.pop() {
        out.push(n.val);
        if let Some(r) = n.right.as_deref() { st.push(r); }   // push right first so left is processed first
        if let Some(l) = n.left.as_deref() { st.push(l); }
    }
    out
}`}

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Popping an empty stack.</strong> Always check <code>isEmpty()</code> first, or handle the exception deliberately.</li>
<li><strong>Using <code>java.util.Stack</code>.</strong> Use <code>ArrayDeque</code>.</li>
<li><strong>Storing values when you need positions.</strong> Monotonic stack problems usually need indices so you can compute distances and write results.</li>
<li><strong>Wrong operand order.</strong> For subtraction and division, the first value popped is the right-hand operand.</li>
<li><strong>Loitering.</strong> In your own array stack, clear the slot when you pop.</li>
</ul></div>
