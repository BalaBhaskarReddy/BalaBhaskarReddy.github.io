CH.push({
  id: 'ch05', n: 5, title: 'Queues',
  lede: 'A queue serves items in the order they arrived: first in, first out. Queues model waiting lines of every kind, from print jobs and network packets to messages between services, and they are the engine of breadth-first search.',
  html: `
<h2>The queue ADT</h2>
<p>A queue is a line at a ticket counter. People join at the back and are served from the front. Nobody jumps ahead. This discipline is called <strong>FIFO</strong>: first in, first out. It is the opposite of a stack's LIFO.</p>
<div class="tbl"><table><tr><th>Operation</th><th>Meaning</th><th>Cost</th></tr>
<tr><td><code>enqueue(x)</code> / <code>offer(x)</code></td><td>add x at the back</td><td class="num">O(1)</td></tr>
<tr><td><code>dequeue()</code> / <code>poll()</code></td><td>remove and return the front item</td><td class="num">O(1)</td></tr>
<tr><td><code>peek()</code></td><td>return the front item without removing it</td><td class="num">O(1)</td></tr>
<tr><td><code>isEmpty()</code>, <code>size()</code></td><td>inspect the queue</td><td class="num">O(1)</td></tr>
</table></div>
<p>Queues are everywhere in systems. An operating system queues processes waiting for the CPU. A web server queues incoming requests when all worker threads are busy. A message broker queues events between a producer and a consumer that run at different speeds. In all of these, fairness means serving the oldest request first.</p>

<h2>Why a plain array is not enough</h2>
<p>Suppose you store a queue in an array, adding at the end and removing from index 0. Removing from the front shifts every remaining element left, which costs O(n). You could instead keep an index <code>head</code> that moves right as items leave. That makes dequeue O(1), but now the occupied region drifts steadily to the right. Eventually <code>tail</code> hits the end of the array even though the slots at the front are empty.</p>
<p>The fix is to treat the array as a ring. When an index reaches the end, it wraps around to 0. This is a <strong>circular buffer</strong> (or ring buffer), and it is how high-performance queues are built.</p>

<h2>The circular array queue</h2>
<p>Keep an array of capacity <span class="m">c</span>, an index <code>head</code> of the front element, an index <code>tail</code> of the next free slot, and a count <code>size</code>. Every index update is taken modulo <span class="m">c</span>:</p>
<div class="formula">enqueue:  data[tail] = x;      tail = (tail + 1) % c;   size++
dequeue:  x = data[head];      head = (head + 1) % c;   size--</div>
${fig('ring', '<b>Figure 5.1</b> A circular queue of capacity 6. head and tail chase each other around the ring; neither ever moves backwards.')}
<p>Why keep <code>size</code>? When <code>head == tail</code>, the queue could be either completely empty or completely full. The count tells the two apart. (An alternative is to always leave one slot unused, so "full" means <code>(tail + 1) % c == head</code>.)</p>
${code('CircularQueue.java')`
import java.util.NoSuchElementException;

public class CircularQueue<T> {
  private Object[] data;
  private int head = 0, tail = 0, size = 0;

  public CircularQueue(int capacity) { data = new Object[Math.max(1, capacity)]; }   // at least one slot, so grow() can double it

  public void enqueue(T x) {
    if (size == data.length) grow();
    data[tail] = x;
    tail = (tail + 1) % data.length;
    size++;
  }
  @SuppressWarnings("unchecked")
  public T dequeue() {
    if (size == 0) throw new NoSuchElementException("queue is empty");
    T x = (T) data[head];
    data[head] = null;                       // avoid loitering
    head = (head + 1) % data.length;
    size--;
    return x;
  }
  @SuppressWarnings("unchecked")
  public T peek() { if (size == 0) throw new NoSuchElementException(); return (T) data[head]; }
  public boolean isEmpty() { return size == 0; }

  private void grow() {                      // copy in queue order, starting at head
    Object[] bigger = new Object[data.length * 2];
    for (int i = 0; i < size; i++) bigger[i] = data[(head + i) % data.length];
    data = bigger; head = 0; tail = size;
  }
}`}
${rs('circular_queue.rs')`
pub struct CircularQueue<T> {
    data: Vec<Option<T>>,       // None marks a free slot
    head: usize,
    tail: usize,
    size: usize,
}

impl<T> CircularQueue<T> {
    pub fn new(capacity: usize) -> Self {
        let data = (0..capacity.max(1)).map(|_| None).collect();
        CircularQueue { data, head: 0, tail: 0, size: 0 }
    }
    pub fn enqueue(&mut self, x: T) {
        if self.size == self.data.len() { self.grow(); }
        self.data[self.tail] = Some(x);
        self.tail = (self.tail + 1) % self.data.len();
        self.size += 1;
    }
    pub fn dequeue(&mut self) -> Option<T> {
        if self.size == 0 { return None; }
        let x = self.data[self.head].take();        // take() leaves None behind: no loitering
        self.head = (self.head + 1) % self.data.len();
        self.size -= 1;
        x
    }
    pub fn peek(&self) -> Option<&T> { self.data[self.head].as_ref() }   // None when empty
    pub fn is_empty(&self) -> bool { self.size == 0 }

    fn grow(&mut self) {                            // copy in queue order, starting at head
        let cap = self.data.len();
        let mut bigger: Vec<Option<T>> = (0..self.size).map(|i| self.data[(self.head + i) % cap].take()).collect();
        bigger.resize_with(cap * 2, || None);
        self.data = bigger;
        self.head = 0;
        self.tail = self.size;
    }
}`}
<p>Notice that <code>grow</code> cannot simply copy the array as-is, because the elements may wrap around the end. It copies them in queue order so the new array starts at index 0.</p>
<p>Rust's <code>VecDeque</code> is this structure, ready-made: a growable ring buffer with O(1) amortized pushes and pops at both ends. The Rust listing stores an <code>Option&lt;T&gt;</code> in each slot, so an empty slot is <code>None</code> and <code>dequeue</code> moves the value out with <code>take()</code>.</p>

<h2>A linked-list queue</h2>
<p>A singly linked list with both <code>head</code> and <code>tail</code> references also gives O(1) for both operations: enqueue appends after the tail, and dequeue removes the head. Removing from the tail would be O(n) in a singly linked list, which is why the front of the queue goes at the head.</p>
${code('LinkedQueue.java')`
public class LinkedQueue<T> {
  private static class Node<T> { T val; Node<T> next; Node(T v) { val = v; } }
  private Node<T> head, tail;

  public void enqueue(T x) {
    Node<T> n = new Node<>(x);
    if (tail == null) head = tail = n;      // first element
    else { tail.next = n; tail = n; }
  }
  public T dequeue() {
    if (head == null) throw new java.util.NoSuchElementException();
    T x = head.val;
    head = head.next;
    if (head == null) tail = null;          // queue became empty
    return x;
  }
}`}
${rs('linked_queue.rs')`
// With Box, the last node is owned by its predecessor, so a second pointer to it (tail)
// cannot be a Box or a reference. Safe Rust keeps the nodes in a Vec and links them by
// index; std::collections::LinkedList uses raw pointers internally instead.
pub struct LinkedQueue<T> {
    nodes: Vec<Node<T>>,
    free: Vec<usize>,           // slots of removed nodes, reused by later enqueues
    head: Option<usize>,
    tail: Option<usize>,
}

struct Node<T> { val: Option<T>, next: Option<usize> }

impl<T> LinkedQueue<T> {
    pub fn new() -> Self { LinkedQueue { nodes: Vec::new(), free: Vec::new(), head: None, tail: None } }

    pub fn enqueue(&mut self, x: T) {
        let node = Node { val: Some(x), next: None };
        let n = match self.free.pop() {
            Some(i) => { self.nodes[i] = node; i }
            None => { self.nodes.push(node); self.nodes.len() - 1 }
        };
        match self.tail {
            None => self.head = Some(n),                // first element
            Some(t) => self.nodes[t].next = Some(n),
        }
        self.tail = Some(n);
    }
    pub fn dequeue(&mut self) -> Option<T> {
        let h = self.head?;
        self.head = self.nodes[h].next;
        if self.head.is_none() { self.tail = None; }    // queue became empty
        self.free.push(h);
        self.nodes[h].val.take()
    }
}

impl<T> Default for LinkedQueue<T> {
    fn default() -> Self { Self::new() }
}`}
<p>The line <code>if (head == null) tail = null</code> is easy to forget. Without it, <code>tail</code> would keep pointing at a removed node and the next enqueue would attach to a node nobody can reach.</p>
<p>This is also the structure where Rust's ownership rules bite hardest. The last node is owned by its predecessor's <code>Box</code>, so a <code>tail</code> field would be a second pointer to a node that something else owns. The Rust listing keeps the nodes in a <code>Vec</code>, links them by index and recycles freed slots; the standard library's <code>LinkedList</code> solves the same problem with raw pointers inside <code>unsafe</code> code. For an ordinary queue, <code>VecDeque</code> is simpler and faster than either.</p>

<h2>Queues in Java</h2>
<p>Java's <code>Queue</code> interface offers two versions of each operation. One throws an exception when it cannot do its job; the other returns a special value. Pick one style and use it consistently.</p>
<div class="tbl"><table><tr><th></th><th>Throws an exception</th><th>Returns a special value</th></tr>
<tr><td>Insert at back</td><td><code>add(x)</code></td><td><code>offer(x)</code> returns false if full</td></tr>
<tr><td>Remove front</td><td><code>remove()</code></td><td><code>poll()</code> returns null if empty</td></tr>
<tr><td>Examine front</td><td><code>element()</code></td><td><code>peek()</code> returns null if empty</td></tr>
</table></div>
<p>Rust's <code>VecDeque</code> has one version of each: <code>push_back</code>, <code>pop_front</code> and <code>front</code>, and the last two return an <code>Option</code> that is <code>None</code> when the queue is empty.</p>
${code('Choosing an implementation')`
Queue<String> q = new ArrayDeque<>();             // default choice: a growable circular array
Deque<String> dq = new ArrayDeque<>();            // double-ended: add/remove at both ends

// For producer/consumer threads, use a thread-safe blocking queue.
BlockingQueue<String> jobs = new ArrayBlockingQueue<>(1000);   // bounded: applies back-pressure
jobs.put("job-1");      // blocks if the queue is full
String j = jobs.take(); // blocks if the queue is empty`}
${rs('choosing.rs')`
use std::collections::VecDeque;
use std::sync::mpsc;

let mut q: VecDeque<String> = VecDeque::new();   // default choice: a growable ring buffer
q.push_back("a".into());                         // push_front, pop_front, pop_back work too
let front = q.pop_front();                       // Some("a"); None if empty

// For producer/consumer threads, a bounded channel.
let (jobs_tx, jobs_rx) = mpsc::sync_channel::<String>(1000);   // bounded: applies back-pressure
jobs_tx.send("job-1".into()).unwrap();           // blocks if the channel is full
let j = jobs_rx.recv().unwrap();                 // blocks if the channel is empty`}
<p>A <strong>bounded</strong> blocking queue is an important design tool. When consumers fall behind, producers block instead of filling memory without limit. This is called <strong>back-pressure</strong>. In Rust, <code>mpsc::sync_channel(n)</code> is the bounded, blocking version and <code>mpsc::channel()</code> the unbounded one.</p>

<h2>Deques</h2>
<p>A <strong>deque</strong> (double-ended queue, pronounced "deck") supports insertion and removal at both ends in O(1). It can act as a stack (use one end), as a queue (add at one end, remove at the other), or as both. <code>ArrayDeque</code> implements it with a circular array, which is why it is the default choice for stacks and queues in Java.</p>
<div class="tbl"><table><tr><th>Front</th><th>Back</th></tr>
<tr><td><code>addFirst</code>, <code>offerFirst</code>, <code>push</code></td><td><code>addLast</code>, <code>offerLast</code>, <code>offer</code></td></tr>
<tr><td><code>pollFirst</code>, <code>poll</code>, <code>pop</code></td><td><code>pollLast</code></td></tr>
<tr><td><code>peekFirst</code>, <code>peek</code></td><td><code>peekLast</code></td></tr>
<tr><td>Rust <code>VecDeque</code>: <code>push_front</code>, <code>pop_front</code>, <code>front</code></td><td><code>push_back</code>, <code>pop_back</code>, <code>back</code></td></tr>
</table></div>

<h2>Queues between threads</h2>
<p>A queue between threads has to answer two questions that a single-threaded queue never meets: what happens when two threads touch it at once, and what a consumer does when it is empty or a producer when it is full. The standard choices:</p>
<div class="tbl"><table><tr><th>Java</th><th>Nearest Rust (standard library)</th><th>Bound</th><th>Behaviour</th></tr>
<tr><td><code>ArrayBlockingQueue</code></td><td><code>mpsc::sync_channel(n)</code></td><td>fixed</td><td>A ring buffer. Producers block when it is full, consumers when it is empty. In Java one lock guards both ends.</td></tr>
<tr><td><code>LinkedBlockingQueue</code></td><td><code>mpsc::channel()</code></td><td>optional; unbounded by default</td><td>Linked nodes with separate locks for the head and the tail, so a producer and a consumer rarely wait for each other. Give it a capacity.</td></tr>
<tr><td><code>ConcurrentLinkedQueue</code></td><td>none</td><td>unbounded</td><td>Lock-free linked queue. It never blocks, so a consumer must poll, and <code>size()</code> walks the whole queue.</td></tr>
<tr><td><code>SynchronousQueue</code></td><td><code>mpsc::sync_channel(0)</code></td><td>zero</td><td>A hand-off: each put waits until a consumer takes the item.</td></tr>
<tr><td><code>PriorityBlockingQueue</code>, <code>DelayQueue</code></td><td><code>Mutex&lt;BinaryHeap&gt;</code> with a <code>Condvar</code></td><td>unbounded</td><td>Items leave by priority, or once their delay has passed (retry schedules, timeouts).</td></tr>
</table></div>
<p>Rust's <code>mpsc</code> channels have many producers and a single consumer. Several consumers can share one receiver behind a <code>Mutex</code>, or use a third-party channel built for that. Here is a bounded pipeline in both languages:</p>
${code('Pipeline.java')`
import java.util.concurrent.*;

public class Pipeline {
  private static final String DONE = "DONE";                 // poison pill: tells the consumer to stop

  public static void main(String[] args) throws InterruptedException {
    BlockingQueue<String> q = new ArrayBlockingQueue<>(2);   // tiny bound to make back-pressure visible
    Thread consumer = new Thread(() -> {
      try {
        for (String job = q.take(); !job.equals(DONE); job = q.take())
          System.out.println("processed " + job);
      } catch (InterruptedException e) {
        Thread.currentThread().interrupt();                  // restore the flag and stop
      }
    });
    consumer.start();
    for (int i = 1; i <= 5; i++) q.put("payment-" + i);     // blocks while two jobs are waiting
    q.put(DONE);
    consumer.join();
  }
}`}
${rs('pipeline.rs')`
use std::sync::mpsc;
use std::thread;

fn main() {
    let (tx, rx) = mpsc::sync_channel::<String>(2);      // tiny bound to make back-pressure visible
    let consumer = thread::spawn(move || {
        for job in rx {                                   // ends once every sender is dropped
            println!("processed {job}");
        }
    });
    for i in 1..=5 {
        tx.send(format!("payment-{i}")).unwrap();         // blocks while two jobs are waiting
    }
    drop(tx);                                             // closing the channel replaces the poison pill
    consumer.join().unwrap();
}`}
<p>The Java consumer stops when it takes a sentinel value, a "poison pill". The Rust consumer needs none: when every sender has been dropped, the channel reports that it is closed, and the <code>for</code> loop ends after draining what is left. In both versions the producer can never get more than two jobs ahead of the consumer, which is the back-pressure that keeps a slow downstream service from turning into an out-of-memory error upstream.</p>

<h2>A queue made of two stacks</h2>
<p>This classic exercise shows amortized analysis in action. Keep an <em>inbox</em> stack and an <em>outbox</em> stack. Enqueue pushes onto the inbox. Dequeue pops from the outbox; if the outbox is empty, first move every item from the inbox to the outbox, which reverses their order so the oldest item ends up on top.</p>
${fig('twostack', '<b>Figure 5.2</b> Two stacks acting as a queue. Pouring the inbox into the outbox is expensive, but each item is poured at most once.')}
<p>A single dequeue can cost O(n) when it triggers a transfer. But each item takes part in exactly four stack operations over its whole life: one push onto the inbox, one pop from the inbox and one push onto the outbox during a transfer, and one final pop from the outbox. So any sequence of n operations costs O(n), and each operation is O(1) amortized.</p>

<h2>Application: breadth-first processing</h2>
<p>Queues process things in "waves": first everything at distance 1, then everything at distance 2, and so on. This is breadth-first search, which Chapter 9 develops fully. The skeleton is short:</p>
${code('BFS skeleton')`
Queue<Node> q = new ArrayDeque<>();
Set<Node> seen = new HashSet<>();
q.offer(start); seen.add(start);
while (!q.isEmpty()) {
  Node cur = q.poll();                     // oldest discovered node
  for (Node nb : cur.neighbours()) {
    if (seen.add(nb)) q.offer(nb);        // add returns false if already seen
  }
}`}
${rs('bfs.rs')`
use std::collections::{HashSet, VecDeque};

// Nodes are numbered 0..n and adj[v] lists the neighbours of v.
fn bfs(adj: &[Vec<usize>], start: usize) -> Vec<usize> {
    let mut q = VecDeque::from([start]);
    let mut seen = HashSet::from([start]);
    let mut order = Vec::new();
    while let Some(cur) = q.pop_front() {            // oldest discovered node
        order.push(cur);
        for &nb in &adj[cur] {
            if seen.insert(nb) { q.push_back(nb); }  // insert returns false if already seen
        }
    }
    order                                            // nodes in the order they were reached
}`}
<p>Level-order traversal of a tree (Chapter 6), the shortest path in an unweighted grid, and "rotting oranges" style simulations all use this loop.</p>

<h2>Application: sliding windows</h2>
<p>Many problems look at a fixed-size window that slides over a sequence: the last k requests, the last k prices. A deque lets you add at the back and expire old items from the front.</p>
<h3>A sliding-window rate limiter</h3>
<p>To allow at most <span class="m">limit</span> requests in any window of <span class="m">w</span> milliseconds, keep the timestamps of accepted requests in a deque. On each request, drop timestamps older than the window from the front, then accept if there is room.</p>
${code('RateLimiter.java')`
class SlidingWindowLimiter {
  private final Deque<Long> log = new ArrayDeque<>();
  private final int limit; private final long windowMs;
  SlidingWindowLimiter(int limit, long windowMs) { this.limit = limit; this.windowMs = windowMs; }

  boolean allow(long nowMs) {
    while (!log.isEmpty() && log.peekFirst() <= nowMs - windowMs) log.pollFirst();   // expire
    if (log.size() < limit) { log.addLast(nowMs); return true; }
    return false;
  }
}`}
${rs('rate_limiter.rs')`
use std::collections::VecDeque;

struct SlidingWindowLimiter {
    log: VecDeque<u64>,     // timestamps of accepted requests, oldest first
    limit: usize,
    window_ms: u64,
}

impl SlidingWindowLimiter {
    fn new(limit: usize, window_ms: u64) -> Self {
        SlidingWindowLimiter { log: VecDeque::new(), limit, window_ms }
    }

    fn allow(&mut self, now_ms: u64) -> bool {
        // t + window <= now rather than t <= now - window: unsigned subtraction could underflow.
        while self.log.front().is_some_and(|&t| t + self.window_ms <= now_ms) {
            self.log.pop_front();                                   // expire
        }
        if self.log.len() < self.limit { self.log.push_back(now_ms); true } else { false }
    }
}`}
<h3>Sliding window maximum</h3>
<p>To report the maximum of every window of size k, keep a deque of indices whose values decrease from front to back. A new value removes every smaller value from the back, because those can never be a maximum while the new value is in the window. The front is always the maximum of the current window, and it is removed once it slides out.</p>
${fig('slidemax', '<b>Figure 5.3</b> A monotonic deque for the sliding window maximum. Each index enters and leaves the deque at most once, so the whole scan is O(n).')}
${code('SlidingMax.java')`
static int[] maxWindow(int[] a, int k) {          // requires 1 <= k <= a.length
  int[] res = new int[a.length - k + 1];
  Deque<Integer> dq = new ArrayDeque<>();          // indices, values decreasing
  for (int i = 0; i < a.length; i++) {
    if (!dq.isEmpty() && dq.peekFirst() <= i - k) dq.pollFirst();     // expired
    while (!dq.isEmpty() && a[dq.peekLast()] < a[i]) dq.pollLast();   // dominated
    dq.addLast(i);
    if (i >= k - 1) res[i - k + 1] = a[dq.peekFirst()];
  }
  return res;
}`}
${rs('sliding_max.rs')`
use std::collections::VecDeque;

fn max_window(a: &[i32], k: usize) -> Vec<i32> {      // expects 1 <= k <= a.len()
    let mut res = Vec::with_capacity(a.len().saturating_sub(k) + 1);
    let mut dq: VecDeque<usize> = VecDeque::new();     // indices, values decreasing
    for (i, &x) in a.iter().enumerate() {
        if dq.front().is_some_and(|&j| j + k <= i) { dq.pop_front(); }   // expired
        while dq.back().is_some_and(|&j| a[j] < x) { dq.pop_back(); }    // dominated
        dq.push_back(i);
        if i + 1 >= k { res.push(a[dq[0]]); }
    }
    res
}`}

<h2>Applied: velocity checks over transactions</h2>
<p>Transaction monitoring for anti-money-laundering and fraud is full of <em>velocity</em> rules: flag an account whose outgoing payments within any 24 hours exceed a threshold, or that makes more than a set number of transfers in an hour. Each rule is a sliding window over a stream of events, and the rate limiter's deque already solves it. For each account, keep a deque of recent transactions in time order and their running total. A new transaction first expires everything older than the window from the front, then joins at the back and updates the total. Every transaction enters and leaves its deque once, so the cost is O(1) amortized per transaction, and memory is proportional to the transactions currently inside the windows.</p>
${code('VelocityCheck.java')`
import java.util.*;

class VelocityCheck {
  private record Tx(long timeMs, long amount) {}             // amount in cents
  private static final class Window { final Deque<Tx> txs = new ArrayDeque<>(); long total; }
  private final Map<String, Window> byAccount = new HashMap<>();
  private final long windowMs, limit;

  VelocityCheck(long windowMs, long limit) { this.windowMs = windowMs; this.limit = limit; }

  // Records one transaction (per account, in time order); true if the window total now exceeds the limit.
  boolean record(String account, long timeMs, long amount) {
    Window w = byAccount.computeIfAbsent(account, k -> new Window());
    while (!w.txs.isEmpty() && w.txs.peekFirst().timeMs() <= timeMs - windowMs)
      w.total -= w.txs.pollFirst().amount();                 // expire from the front
    w.txs.addLast(new Tx(timeMs, amount));
    w.total += amount;
    return w.total > limit;
  }

  public static void main(String[] args) {
    long hour = 3_600_000;
    VelocityCheck v = new VelocityCheck(24 * hour, 1_000_000);   // 10,000.00 in 24 hours
    System.out.println(v.record("acc-1", 0, 400_000));           // false
    System.out.println(v.record("acc-1", 5 * hour, 350_000));    // false
    System.out.println(v.record("acc-1", 20 * hour, 300_000));   // true: 10,500.00
    System.out.println(v.record("acc-1", 26 * hour, 50_000));    // false: 7,000.00
  }
}`}
${rs('velocity_check.rs')`
use std::collections::{HashMap, VecDeque};

#[derive(Default)]
struct Window {
    txs: VecDeque<(u64, u64)>,      // (time in ms, amount in cents), oldest first
    total: u64,
}

struct VelocityCheck {
    by_account: HashMap<String, Window>,
    window_ms: u64,
    limit: u64,
}

impl VelocityCheck {
    fn new(window_ms: u64, limit: u64) -> Self {
        VelocityCheck { by_account: HashMap::new(), window_ms, limit }
    }

    // Records one transaction (per account, in time order); true if the window total now exceeds the limit.
    fn record(&mut self, account: &str, time_ms: u64, amount: u64) -> bool {
        let w = self.by_account.entry(account.to_owned()).or_default();
        while let Some(&(t, amt)) = w.txs.front() {
            if t + self.window_ms > time_ms { break; }    // still inside the window
            w.total -= amt;                               // expire from the front
            w.txs.pop_front();
        }
        w.txs.push_back((time_ms, amount));
        w.total += amount;
        w.total > self.limit
    }
}

fn main() {
    let hour = 3_600_000;
    let mut v = VelocityCheck::new(24 * hour, 1_000_000);       // 10,000.00 in 24 hours
    println!("{}", v.record("acc-1", 0, 400_000));               // false
    println!("{}", v.record("acc-1", 5 * hour, 350_000));        // false
    println!("{}", v.record("acc-1", 20 * hour, 300_000));       // true: 10,500.00
    println!("{}", v.record("acc-1", 26 * hour, 50_000));        // false: 7,000.00
}`}
<p>The example records 4,000.00 at hour 0, 3,500.00 at hour 5 and 3,000.00 at hour 20, which is flagged because 10,500.00 left the account within 24 hours. At hour 26 the first payment has left the window, so a further 500.00 brings the total only to 7,000.00.</p>
<p>Two production concerns change the details but not the idea. Events can arrive late or out of order, so a streaming system either holds them until it is confident the window is complete or keeps the window in an ordered map instead of a deque. And the per-account state lives in a keyed, persistent state store rather than a <code>HashMap</code>, so that it survives restarts and can be split across machines by account.</p>
<div class="note key"><b>Same lifetime, so a FIFO is enough</b><p>Expiring from the front works because every entry lives for the same length of time, so the first one in is always the first one due out. The same reasoning lets a FIFO queue beside a hash set expire idempotency keys or duplicate-message IDs after a fixed time-to-live, with O(1) work per key. When lifetimes differ, insertion order is no longer expiry order, and you need a priority queue keyed by expiry time (Chapter 7).</p></div>

<h2>Priority queues: a preview</h2>
<p>Sometimes order of arrival is not the right rule. An emergency room treats the most serious case first, not the earliest arrival. A <strong>priority queue</strong> always removes the item with the highest priority. It cannot be built efficiently with an array or list alone; Chapter 7 introduces the heap, which gives O(log n) insertion and removal.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Calling <code>remove()</code> on an ArrayList's index 0 as a queue.</strong> That is O(n) per call. Use <code>ArrayDeque</code>.</li>
<li><strong>Forgetting the wrap-around.</strong> Every index update in a circular buffer needs <code>% capacity</code>.</li>
<li><strong>Confusing empty and full</strong> when <code>head == tail</code>. Keep a size counter.</li>
<li><strong>Inserting null into ArrayDeque.</strong> It throws, because null is reserved to mean "empty" for <code>poll</code>.</li>
<li><strong>Unbounded queues between fast producers and slow consumers.</strong> Memory grows until the process dies. Bound the queue.</li>
</ul></div>

function travFrames(kind) {
  const { N, root } = bstBuild(BST_SEQ), F = [], out = [];
  if (kind === 'level') {
    const q = [root]; F.push({ out: [], q: [...q], note: 'Level order uses a queue. Start with the root in it.' });
    while (q.length) { const v = q.shift(); out.push(v); [N[v].l, N[v].r].forEach(c => { if (c != null) q.push(c); }); F.push({ cur: v, out: [...out], q: [...q], note: `Dequeue ${v} and output it, then enqueue its children${N[v].l == null && N[v].r == null ? ' (it has none)' : ''}.` }); }
    F.push({ out: [...out], q: [], note: 'The queue is empty. Nodes came out level by level, left to right.' }); return { N, root, F };
  }
  const path = [];
  (function go(v) {
    if (v == null) return; path.push(v);
    const visit = () => { out.push(v); F.push({ cur: v, path: [...path], out: [...out], note: `Visit ${v}: write it to the output.` }); };
    if (kind === 'pre') visit(); else F.push({ path: [...path], enter: v, out: [...out], note: `Enter ${v}. ${kind === 'in' ? 'Its left subtree comes first.' : 'Both subtrees come before it.'}` });
    go(N[v].l); if (kind === 'in') visit(); go(N[v].r); if (kind === 'post') visit();
    path.pop();
  })(root);
  F.push({ out: [...out], note: kind === 'in' ? 'Done. For a binary search tree, inorder output is sorted.' : 'Done. Every node was visited exactly once: O(n).' });
  return { N, root, F };
}

  html: `
<h2>Vocabulary</h2>
<p>A <strong>tree</strong> is a collection of <strong>nodes</strong> connected by <strong>edges</strong>, with one special node called the <strong>root</strong>, such that there is exactly one path from the root to every node. That last condition means a tree has no cycles.</p>
${fig('treevocab', '<b>Figure 6.1</b> The parts of a tree. A is the root. B, D, E, G and H form the subtree rooted at B. D, G, H and F are leaves.')}
<div class="tbl"><table><tr><th>Term</th><th>Meaning</th><th>In Figure 6.1</th></tr>
<tr><td>Parent, child</td><td>If an edge goes from u down to v, u is v's parent and v is u's child.</td><td>B is the parent of D and E.</td></tr>
<tr><td>Siblings</td><td>Nodes with the same parent.</td><td>D and E.</td></tr>
<tr><td>Leaf</td><td>A node with no children.</td><td>D, G, H, F.</td></tr>
<tr><td>Internal node</td><td>A node with at least one child.</td><td>A, B, C, E.</td></tr>
<tr><td>Ancestor, descendant</td><td>Any node on the path up to the root, or any node below.</td><td>A and B are ancestors of G.</td></tr>
<tr><td>Subtree</td><td>A node together with all its descendants.</td><td>The subtree rooted at B.</td></tr>
<tr><td>Depth of a node</td><td>Number of edges from the root to it.</td><td>depth(A) = 0, depth(G) = 3.</td></tr>
<tr><td>Height of the tree</td><td>The largest depth of any node.</td><td>3.</td></tr>
<tr><td>Degree</td><td>Number of children of a node.</td><td>degree(C) = 1.</td></tr>
</table></div>
<p>Trees are recursive by nature: every child of a node is the root of its own smaller tree. This is why almost every tree algorithm is a short recursive function.</p>

<h2>Binary trees</h2>
<p>A <strong>binary tree</strong> is a tree in which every node has at most two children, called the <strong>left child</strong> and the <strong>right child</strong>. The distinction matters: a node with only a left child is a different tree from a node with only a right child.</p>
${fig('treetypes', '<b>Figure 6.2</b> Four shapes of binary tree.')}
<ul>
<li><strong>Full</strong>: every node has either zero or two children.</li>
<li><strong>Complete</strong>: every level is filled except possibly the last, and the last level is filled from the left. Heaps (Chapter 7) are complete trees.</li>
<li><strong>Perfect</strong>: every internal node has two children and all leaves are at the same depth. A perfect tree of height h has 2^(h+1) − 1 nodes.</li>
<li><strong>Degenerate</strong>: every node has at most one child, so the tree is really a linked list. Its height is n − 1.</li>
</ul>
<p>Two facts connect height and size. A binary tree of height h has at most 2^(h+1) − 1 nodes. Turning that around, a binary tree with n nodes has height at least ⌊log₂n⌋. So the best possible height is logarithmic and the worst is linear. Most of this chapter is about staying close to the best case.</p>

<h3>Representing a binary tree</h3>
<p>The usual representation is a node object with two child references:</p>

    fn new(val: i32) -> Self { TreeNode { val, left: None, right: None } }
}`}
<div class="note key"><b>Trees in Rust</b><p>A tree is the shape that Rust's ownership model fits best. Every node has exactly one parent, so the parent can own its children outright: <code>Option&lt;Box&lt;TreeNode&gt;&gt;</code> is a child that is either present and owned, or <code>None</code>. Read-only functions borrow the tree (<code>&amp;Tree</code>), and functions that restructure it take a <code>&amp;mut</code> link or take the subtree by value and return the new one, as the rotations and the AVL code below do. Two things need care. A <code>parent</code> pointer would give a node a second referrer, which <code>Box</code> cannot express; keep nodes in a <code>Vec</code> and link them by index (as Chapter 3 did for the doubly linked list), or use <code>Rc</code> for children with <code>Weak</code> for the parent link. And dropping a tree is itself a recursion, one call per level: a degenerate tree of a million nodes aborts with a stack overflow when it goes out of scope (in a test, 100,000 nodes were already enough in a debug build). Balanced trees never get that deep.</p></div>
<p>A complete binary tree can also be stored in a plain array with no references at all. Put the root at index 0; the children of index i are at 2i + 1 and 2i + 2, and its parent is at (i − 1) / 2. Chapter 7 builds heaps this way.</p>

<h2>Traversals</h2>
<p>A <strong>traversal</strong> visits every node exactly once. Depth-first traversals go as deep as possible before backing up. They differ only in <em>when</em> a node is visited relative to its subtrees:</p>
<ul>
<li><strong>Preorder</strong> (node, left, right): visit the node first. Useful for copying a tree or printing its structure, since parents come before children.</li>
<li><strong>Inorder</strong> (left, node, right): visit the node between its subtrees. For a binary search tree this produces the keys in sorted order.</li>
<li><strong>Postorder</strong> (left, right, node): visit the node last. Useful when children must be processed before their parent, such as deleting a tree or computing folder sizes.</li>
</ul>
<p><strong>Level order</strong> is breadth-first: visit all nodes at depth 0, then depth 1, and so on, using a queue.</p>
${fig('traverse', '<b>Figure 6.3</b> The four traversal orders on the same tree. Switch tabs and step through each one.')}
${code('Traversals.java')`
static void preorder(TreeNode n, List<Integer> out)  { if (n == null) return; out.add(n.val); preorder(n.left, out); preorder(n.right, out); }
static void inorder(TreeNode n, List<Integer> out)   { if (n == null) return; inorder(n.left, out); out.add(n.val); inorder(n.right, out); }
static void postorder(TreeNode n, List<Integer> out) { if (n == null) return; postorder(n.left, out); postorder(n.right, out); out.add(n.val); }

static List<List<Integer>> levelOrder(TreeNode root) {
  List<List<Integer>> levels = new ArrayList<>();
  if (root == null) return levels;
  Queue<TreeNode> q = new ArrayDeque<>();
  q.offer(root);
  while (!q.isEmpty()) {
    int width = q.size();                 // number of nodes on this level
    List<Integer> level = new ArrayList<>();
    for (int i = 0; i < width; i++) {
      TreeNode n = q.poll();
      level.add(n.val);
      if (n.left != null) q.offer(n.left);
      if (n.right != null) q.offer(n.right);
    }
    levels.add(level);
  }
  return levels;
}`}
${rs('traversals.rs')`
fn preorder(n: &Tree, out: &mut Vec<i32>) {
    if let Some(n) = n { out.push(n.val); preorder(&n.left, out); preorder(&n.right, out); }
}
fn inorder(n: &Tree, out: &mut Vec<i32>) {
    if let Some(n) = n { inorder(&n.left, out); out.push(n.val); inorder(&n.right, out); }
}
fn postorder(n: &Tree, out: &mut Vec<i32>) {
    if let Some(n) = n { postorder(&n.left, out); postorder(&n.right, out); out.push(n.val); }
}

fn level_order(root: &Tree) -> Vec<Vec<i32>> {
    let mut levels = Vec::new();
    let mut q: VecDeque<&TreeNode> = root.as_deref().into_iter().collect();   // empty for an empty tree
    while !q.is_empty() {
        let mut level = Vec::new();
        for _ in 0..q.len() {                  // the range is fixed once: the nodes on this level
            let Some(n) = q.pop_front() else { break };
            level.push(n.val);
            q.extend(n.left.as_deref());       // Option is iterable: pushes the child if present
            q.extend(n.right.as_deref());
        }
        levels.push(level);
    }
    levels
}`}
<p>Every traversal is O(n) time. The recursive versions use O(h) stack space, where h is the height; the level-order version uses O(w) queue space, where w is the widest level.</p>
<h3>Iterative inorder traversal</h3>
<p>Inorder is the trickiest to write without recursion, and it is worth learning because it shows exactly what the call stack was doing. Push nodes while walking left. When you cannot go further left, pop a node, visit it, and then move into its right subtree.</p>
${code('Iterative inorder')`
static List<Integer> inorderIter(TreeNode root) {
  List<Integer> out = new ArrayList<>();
  Deque<TreeNode> st = new ArrayDeque<>();
  TreeNode cur = root;
  while (cur != null || !st.isEmpty()) {
    while (cur != null) { st.push(cur); cur = cur.left; }   // go left as far as possible
    cur = st.pop();
    out.add(cur.val);                                        // visit
    cur = cur.right;                                         // then the right subtree
  }
  return out;
}`}
${rs('inorder_iter.rs')`
fn inorder_iter(root: &Tree) -> Vec<i32> {
    let mut out = Vec::new();
    let mut st: Vec<&TreeNode> = Vec::new();
    let mut cur = root.as_deref();
    loop {
        while let Some(n) = cur { st.push(n); cur = n.left.as_deref(); }   // go left as far as possible
        let Some(n) = st.pop() else { break };                            // nothing left: done
        out.push(n.val);                                                  // visit
        cur = n.right.as_deref();                                         // then the right subtree
    }
    out
}`}

<h2>Solving problems recursively on trees</h2>
<p>Most tree questions follow one pattern: <em>ask each child for its answer, then combine the answers at the current node</em>. Write down what the function returns for a subtree, handle <code>null</code> as the base case, and combine.</p>
${code('Tree recursion patterns')`
// Height: an empty tree has height -1, a single node 0.
static int height(TreeNode n) { return n == null ? -1 : 1 + Math.max(height(n.left), height(n.right)); }

// Number of nodes.
static int size(TreeNode n) { return n == null ? 0 : 1 + size(n.left) + size(n.right); }

// Mirror image.
static TreeNode invert(TreeNode n) {
  if (n == null) return null;
  TreeNode l = invert(n.left), r = invert(n.right);
  n.left = r; n.right = l;
  return n;
}

// Is there a root-to-leaf path whose values add up to target?
static boolean hasPathSum(TreeNode n, int target) {
  if (n == null) return false;
  if (n.left == null && n.right == null) return n.val == target;
  return hasPathSum(n.left, target - n.val) || hasPathSum(n.right, target - n.val);
}

// Diameter: the longest path between any two nodes, counted in edges.
// Each call returns the depth of its subtree and updates the best answer on the side.
static int best;
static int depth(TreeNode n) {
  if (n == null) return 0;
  int l = depth(n.left), r = depth(n.right);
  best = Math.max(best, l + r);      // the longest path that bends at n
  return 1 + Math.max(l, r);
}`}
${rs('tree_recursion.rs')`
// Height: an empty tree has height -1, a single node 0.
fn height(n: &Tree) -> i32 {
    n.as_ref().map_or(-1, |n| 1 + height(&n.left).max(height(&n.right)))
}

// Number of nodes.
fn size(n: &Tree) -> usize {
    n.as_ref().map_or(0, |n| 1 + size(&n.left) + size(&n.right))
}

// Mirror image, in place: swap the two owned subtrees, then recurse.
fn invert(n: &mut Tree) {
    if let Some(n) = n {
        std::mem::swap(&mut n.left, &mut n.right);
        invert(&mut n.left);
        invert(&mut n.right);
    }
}

// Is there a root-to-leaf path whose values add up to target?
fn has_path_sum(n: &Tree, target: i32) -> bool {
    match n {
        None => false,
        Some(n) if n.left.is_none() && n.right.is_none() => n.val == target,
        Some(n) => has_path_sum(&n.left, target - n.val) || has_path_sum(&n.right, target - n.val),
    }
}

// Diameter: the longest path between any two nodes, counted in edges.
// The helper returns the depth of its subtree and updates the best answer through a &mut.
fn diameter(root: &Tree) -> usize {
    fn depth(n: &Tree, best: &mut usize) -> usize {
        let Some(n) = n else { return 0 };
        let (l, r) = (depth(&n.left, best), depth(&n.right, best));
        *best = (*best).max(l + r);       // the longest path that bends at n
        1 + l.max(r)
    }
    let mut best = 0;
    depth(root, &mut best);
    best
}`}
<p>The diameter example shows a useful refinement: sometimes the value you return to the parent (the depth) differs from the value you are looking for (the longest path). Return what the parent needs and record the global answer separately. The Java version keeps that answer in a static field, which must be reset before every call; the Rust version passes a <code>&amp;mut</code> accumulator down the recursion instead, which is cleaner in either language.</p>

<h2>Binary search trees</h2>
<p>A <strong>binary search tree</strong> (BST) is a binary tree that keeps its keys in order. For every node:</p>
<div class="formula">every key in the left subtree  <  node.key  <  every key in the right subtree</div>
<p>This property turns the tree into a decision structure. To find a key, compare it with the root. If it is smaller, the key can only be in the left subtree, so the whole right subtree is ruled out. Each comparison descends one level, so a search costs O(h).</p>
<h3>Search and insert</h3>
${fig('bstinsert', '<b>Figure 6.4</b> Building a BST by inserting 8, 3, 10, 1, 6, 14, 4, 7, 13. Insertion is a search that ends at an empty slot.')}
${code('BST.java')`
public class BST {
  static class Node { int key; Node left, right; Node(int k) { key = k; } }
  Node root;

  boolean contains(int key) {
    Node cur = root;
    while (cur != null) {
      if (key == cur.key) return true;
      cur = key < cur.key ? cur.left : cur.right;   // discard one side
    }
    return false;
  }

  void insert(int key) { root = insert(root, key); }
  private Node insert(Node n, int key) {
    if (n == null) return new Node(key);            // found the empty slot
    if (key < n.key) n.left = insert(n.left, key);
    else if (key > n.key) n.right = insert(n.right, key);
    return n;                                       // duplicates are ignored
  }

  int min() { Node n = root; while (n.left != null) n = n.left; return n.key; }    // the tree must not be empty
  int max() { Node n = root; while (n.right != null) n = n.right; return n.key; }
}`}
${rs('bst.rs')`
type Link = Option<Box<Node>>;

struct Node { key: i32, left: Link, right: Link }

#[derive(Default)]
struct Bst { root: Link }

impl Bst {
    fn contains(&self, key: i32) -> bool {
        let mut cur = self.root.as_deref();
        while let Some(n) = cur {
            cur = match key.cmp(&n.key) {
                Ordering::Equal => return true,
                Ordering::Less => n.left.as_deref(),        // discard one side
                Ordering::Greater => n.right.as_deref(),
            };
        }
        false
    }

    fn insert(&mut self, key: i32) {
        let mut slot = &mut self.root;                       // a cursor to a link, as in Chapter 3
        while let Some(n) = slot {
            slot = match key.cmp(&n.key) {
                Ordering::Less => &mut n.left,
                Ordering::Greater => &mut n.right,
                Ordering::Equal => return,                   // duplicates are ignored
            };
        }
        *slot = Some(Box::new(Node { key, left: None, right: None }));   // found the empty slot
    }

    fn min(&self) -> Option<i32> {                           // None for an empty tree
        let mut n = self.root.as_deref()?;
        while let Some(l) = n.left.as_deref() { n = l; }
        Some(n.key)
    }
    fn max(&self) -> Option<i32> {
        let mut n = self.root.as_deref()?;
        while let Some(r) = n.right.as_deref() { n = r; }
        Some(n.key)
    }
}`}
<p>The Rust <code>insert</code> walks a cursor that points at a <em>link</em> rather than at a node, the same trick as Chapter 3's linked list: when the loop stops, the cursor is the empty slot, and one assignment fills it. <code>min</code> and <code>max</code> return <code>Option</code>, so an empty tree is an ordinary answer rather than a <code>NullPointerException</code>.</p>
<h3>Floor and ceiling</h3>
<p>Because the tree is ordered, it can answer questions a hash table cannot. The <strong>floor</strong> of x is the largest key ≤ x; the <strong>ceiling</strong> is the smallest key ≥ x. Walk down the tree, remembering the best candidate so far:</p>
${code('Floor')`
Integer floor(int x) {
  Node cur = root; Integer best = null;
  while (cur != null) {
    if (cur.key == x) return x;
    if (cur.key < x) { best = cur.key; cur = cur.right; }   // candidate; look for a larger one
    else cur = cur.left;                                     // too big
  }
  return best;
}`}
${rs('floor.rs')`
impl Bst {
    fn floor(&self, x: i32) -> Option<i32> {
        let mut cur = self.root.as_deref();
        let mut best = None;
        while let Some(n) = cur {
            match n.key.cmp(&x) {
                Ordering::Equal => return Some(x),
                Ordering::Less => { best = Some(n.key); cur = n.right.as_deref(); }   // candidate; look for a larger one
                Ordering::Greater => cur = n.left.as_deref(),                         // too big
            }
        }
        best
    }
}`}
<h3>Deletion</h3>
<p>Deleting a key has three cases, depending on how many children the node has.</p>
${fig('bstdelete', '<b>Figure 6.5</b> The three deletion cases: a leaf, a node with one child, and a node with two children.')}
${code('Delete')`
private Node delete(Node n, int key) {
  if (n == null) return null;
  if (key < n.key)      n.left = delete(n.left, key);
  else if (key > n.key) n.right = delete(n.right, key);
  else {
    if (n.left == null)  return n.right;     // zero children, or only a right child
    if (n.right == null) return n.left;      // only a left child
    Node s = n.right;                        // two children: find the successor
    while (s.left != null) s = s.left;
    n.key = s.key;                           // copy it here
    n.right = delete(n.right, s.key);        // and remove it from the right subtree
  }
  return n;
}`}
${rs('delete.rs')`
fn delete(link: &mut Link, key: i32) {
    let Some(n) = link else { return };
    match key.cmp(&n.key) {
        Ordering::Less => delete(&mut n.left, key),
        Ordering::Greater => delete(&mut n.right, key),
        Ordering::Equal => {
            if n.left.is_none() { *link = n.right.take(); }          // zero children, or only a right child
            else if n.right.is_none() { *link = n.left.take(); }     // only a left child
            else { n.key = take_min(&mut n.right); }                 // two children: the successor's key moves here
        }
    }
}

// Unlinks the smallest node of a non-empty subtree and returns its key.
fn take_min(mut link: &mut Link) -> i32 {
    while link.as_ref().is_some_and(|n| n.left.is_some()) {
        link = &mut link.as_mut().unwrap().left;
    }
    let s = link.take().expect("subtree is not empty");
    *link = s.right;                                                 // the successor never has a left child
    s.key
}`}
<p>The successor is the next key in sorted order. It is the smallest key larger than the deleted one, so placing it in the deleted node's position keeps every key on the correct side. Using the predecessor (largest key in the left subtree) works equally well. In the Rust version, <code>take_min</code> unlinks the successor and hands back its key in one pass, and <code>take()</code> moves a child out of its node so that the parent's link can adopt it.</p>
<h3>Validating a BST</h3>
<p>A common mistake is to check only that each node is larger than its left child and smaller than its right child. That is not enough: a node deep in the left subtree could still be larger than the root. Pass down the allowed range instead.</p>
${code('Validate')`
static boolean isBST(TreeNode n, long lo, long hi) {
  if (n == null) return true;
  if (n.val <= lo || n.val >= hi) return false;
  return isBST(n.left, lo, n.val) && isBST(n.right, n.val, hi);
}
// call: isBST(root, Long.MIN_VALUE, Long.MAX_VALUE)   (long avoids overflow at the int limits)`}
${rs('validate.rs')`
fn is_bst(n: &Tree, lo: Option<i32>, hi: Option<i32>) -> bool {
    let Some(n) = n else { return true };
    if lo.is_some_and(|lo| n.val <= lo) || hi.is_some_and(|hi| n.val >= hi) { return false; }
    is_bst(&n.left, lo, Some(n.val)) && is_bst(&n.right, Some(n.val), hi)
}
// call: is_bst(&root, None, None)   (an absent bound is None, so no sentinel value can collide with a key)`}

<h2>Why balance matters</h2>
<p>A BST's operations cost O(h), and the height depends on the order of insertion. Insert keys in random order and the expected height grows like 2.99·log₂n for large n, while the average depth of a node, which is what a typical search pays, is about 1.39·log₂n. Insert them already sorted and every key becomes the right child of the previous one: the tree is a linked list, and every operation is O(n).</p>
${fig('degenerate', '<b>Figure 6.6</b> The same five keys, inserted in two different orders.')}
<p>Sorted input is common in practice (timestamps, auto-incrementing IDs), so production code never relies on luck. <strong>Self-balancing</strong> trees restructure themselves after each insertion or deletion to keep the height O(log n).</p>
<h3>Rotations</h3>
<p>The basic restructuring step is a <strong>rotation</strong>. It changes the shape of a small part of the tree while keeping every key in order. A right rotation at y lifts its left child x up; y becomes x's right child, and x's old right subtree moves across to become y's left subtree.</p>
${fig('rotate', '<b>Figure 6.7</b> A right rotation moves x up one level and y down one level. Only three references change, so a rotation is O(1).')}
${code('Rotations')`
static Node rotateRight(Node y) {
  Node x = y.left;
  y.left = x.right;      // T2 moves across
  x.right = y;
  return x;              // x is the new root of this subtree
}
static Node rotateLeft(Node x) {
  Node y = x.right;
  x.right = y.left;
  y.left = x;
  return y;
}`}
${rs('rotations.rs')`
// The subtree root is moved in by value and the new root is moved out: no node is ever shared.
fn rotate_right(mut y: Box<Node>) -> Box<Node> {
    let mut x = y.left.take().expect("rotate_right needs a left child");
    y.left = x.right.take();      // T2 moves across
    x.right = Some(y);
    x                             // x is the new root of this subtree
}
fn rotate_left(mut x: Box<Node>) -> Box<Node> {
    let mut y = x.right.take().expect("rotate_left needs a right child");
    x.right = y.left.take();
    y.left = Some(x);
    y
}`}
<h3>AVL trees</h3>
<p>An <strong>AVL tree</strong> stores the height of every node and enforces that the heights of each node's two subtrees differ by at most 1. After an insertion, walk back up the path. If some node becomes unbalanced, one or two rotations fix it:</p>
<ul>
<li><strong>Left-left</strong> (the new key went into the left child's left subtree): one right rotation.</li>
<li><strong>Right-right</strong>: one left rotation.</li>
<li><strong>Left-right</strong>: a left rotation at the child, then a right rotation at the node.</li>
<li><strong>Right-left</strong>: a right rotation at the child, then a left rotation at the node.</li>
</ul>
<p>The height of an AVL tree with n nodes is less than about 1.44·log₂(n + 2), so it is never more than about 44% taller than the best possible tree.</p>
<p>The code is shorter than the case analysis suggests. Each node stores its height, insertion is the ordinary recursive BST insert, and on the way back up every node on the path recomputes its height and calls <code>rebalance</code>. The balance factor of the heavy child tells the two shapes apart: if it leans the other way, one rotation at the child turns a left-right case into a left-left case (or right-left into right-right), and one rotation at the node finishes the job.</p>
${code('AVL.java')`
class AVL {
  static class Node { int key, height; Node left, right; Node(int k) { key = k; } }   // a leaf has height 0
  Node root;

  static int h(Node n) { return n == null ? -1 : n.height; }
  static void update(Node n) { n.height = 1 + Math.max(h(n.left), h(n.right)); }
  static int balance(Node n) { return h(n.left) - h(n.right); }   // > 1: left-heavy, < -1: right-heavy

  static Node rotateRight(Node y) { Node x = y.left; y.left = x.right; x.right = y; update(y); update(x); return x; }
  static Node rotateLeft(Node x)  { Node y = x.right; x.right = y.left; y.left = x; update(x); update(y); return y; }

  void insert(int key) { root = insert(root, key); }
  private static Node insert(Node n, int key) {
    if (n == null) return new Node(key);
    if (key < n.key) n.left = insert(n.left, key);
    else if (key > n.key) n.right = insert(n.right, key);
    else return n;                                         // duplicate: nothing changes
    update(n);                                             // on the way back up: fix the height,
    return rebalance(n);                                   // then the balance
  }

  static Node rebalance(Node n) {
    int b = balance(n);
    if (b > 1) {                                           // left-heavy
      if (balance(n.left) < 0) n.left = rotateLeft(n.left);       // left-right: first make it left-left
      return rotateRight(n);
    }
    if (b < -1) {                                          // right-heavy
      if (balance(n.right) > 0) n.right = rotateRight(n.right);   // right-left: first make it right-right
      return rotateLeft(n);
    }
    return n;
  }
}`}
${rs('avl.rs')`
type Link = Option<Box<Node>>;
struct Node { key: i32, height: i32, left: Link, right: Link }      // a leaf has height 0

fn h(n: &Link) -> i32 { n.as_ref().map_or(-1, |n| n.height) }
fn update(n: &mut Node) { n.height = 1 + h(&n.left).max(h(&n.right)); }
fn balance(n: &Node) -> i32 { h(&n.left) - h(&n.right) }            // > 1: left-heavy, < -1: right-heavy

fn rotate_right(mut y: Box<Node>) -> Box<Node> {
    let mut x = y.left.take().expect("left child");
    y.left = x.right.take();
    update(&mut y);
    x.right = Some(y);
    update(&mut x);
    x
}
fn rotate_left(mut x: Box<Node>) -> Box<Node> {
    let mut y = x.right.take().expect("right child");
    x.right = y.left.take();
    update(&mut x);
    y.left = Some(x);
    update(&mut y);
    y
}

// Takes the subtree by value and returns its new root: Rust's form of n.left = insert(n.left, key).
fn insert(n: Link, key: i32) -> Box<Node> {
    let Some(mut n) = n else { return Box::new(Node { key, height: 0, left: None, right: None }) };
    match key.cmp(&n.key) {
        Ordering::Less => n.left = Some(insert(n.left.take(), key)),
        Ordering::Greater => n.right = Some(insert(n.right.take(), key)),
        Ordering::Equal => return n,                                 // duplicate: nothing changes
    }
    update(&mut n);                                                  // on the way back up: fix the height,
    rebalance(n)                                                     // then the balance
}

fn rebalance(mut n: Box<Node>) -> Box<Node> {
    let b = balance(&n);
    if b > 1 {                                                       // left-heavy
        let l = n.left.take().expect("left-heavy");
        n.left = Some(if balance(&l) < 0 { rotate_left(l) } else { l });     // left-right: make it left-left
        return rotate_right(n);
    }
    if b < -1 {                                                      // right-heavy
        let r = n.right.take().expect("right-heavy");
        n.right = Some(if balance(&r) > 0 { rotate_right(r) } else { r });   // right-left: make it right-right
        return rotate_left(n);
    }
    n
}`}
<p>Inserting 1 to 7 in order, the case that degenerated earlier, gives a perfect tree of height 2 rooted at 4; inserting a million keys in order gives height 19. Because <code>rebalance</code> also handles a heavy child with balance 0, the same function works after a deletion, where the shape can need a rotation at every level on the way up. The Rust version takes each subtree by value and returns the new root, so a rotation simply moves boxes around, and there is never a moment where two links own the same node.</p>
<h3>Red-black trees</h3>
<p>A <strong>red-black tree</strong> colours every node red or black and enforces two rules: a red node never has a red child, and every path from a node down to an empty subtree passes through the same number of black nodes. Together these guarantee the height is at most 2·log₂(n+1). A red-black insertion needs at most two rotations and a deletion at most three, plus recolouring; an AVL deletion may rotate at every level on the way back up. The price is a less strictly balanced, slightly taller tree. Java's <code>TreeMap</code> and <code>TreeSet</code> are red-black trees, and so are the bins that <code>HashMap</code> converts into trees when many keys collide (Chapter 14).</p>

m.put(30, "c"); m.put(10, "a"); m.put(20, "b");
m.firstKey();          // 10
m.floorKey(25);        // 20   largest key <= 25
m.ceilingKey(25);      // 30   smallest key >= 25

m.subMap(10, 30);      // {10=a, 20=b}   10 <= key < 30

<h3>Ordered maps in Java and Rust</h3>
<p>Rust's standard library has no red-black tree. Its ordered map, <code>BTreeMap</code>, is a B-tree: each node holds a small sorted array of keys (between B − 1 and 2B − 1 of them) and searches it linearly. That needs more comparisons than a binary tree but far fewer heap allocations and pointer hops, and on modern hardware the cache wins. There are no <code>floorKey</code> and <code>ceilingKey</code> methods; the general tool is <code>range</code>, which returns a double-ended iterator, so the floor is the last key of <code>..=x</code> and the ceiling the first key of <code>x..</code>. Nor does the map take a comparator: for descending order, read from the other end (<code>last_key_value</code>, <code>next_back</code>) or wrap keys in <code>std::cmp::Reverse</code>.</p>
<div class="tbl"><table><tr><th>Map</th><th>Structure</th><th>Lookup, insert, delete</th><th>Threads</th></tr>
<tr><td>Java <code>TreeMap</code></td><td>red-black tree, one node per key</td><td class="num">O(log n)</td><td>not thread-safe</td></tr>
<tr><td>Java <code>ConcurrentSkipListMap</code></td><td>skip list (Chapter 13)</td><td class="num">O(log n) expected</td><td>safe for concurrent readers and writers, without a global lock</td></tr>
<tr><td>Rust <code>BTreeMap</code></td><td>B-tree, many keys per node</td><td class="num">O(log n)</td><td>shared reads are free (<code>&amp;</code>); writers need <code>&amp;mut</code> or a <code>Mutex</code></td></tr>
</table></div>
<p>Reach for an ordered map only when you need order: range scans, floor and ceiling, the smallest or largest key, sorted iteration. For plain lookups by key a hash map is faster (Chapter 14).</p>

<h2>Applied: a limit order book</h2>
<p>An exchange keeps, for each instrument, the buy orders (bids) and sell orders (asks) that have not traded yet. An incoming buy order trades against the cheapest asks first; an incoming sell order trades against the highest bids first. Among orders at the same price, the oldest goes first. This rule is called <strong>price-time priority</strong>.</p>
<p>The natural structure is an ordered map from price to a FIFO queue of orders at that price, one map per side. The best price is the first key, found in O(log n) where n is the number of distinct price levels, which is usually much smaller than the number of orders. Within a level, a deque keeps arrival order. Prices are integers in the smallest currency unit, never floating point.</p>
${code('OrderBook.java')`
import java.util.*;

/** A price-time priority limit order book for one instrument. Prices are in cents. */
class OrderBook {
  record Order(long id, boolean buy, long price, long qty) {}
  record Fill(long buyId, long sellId, long price, long qty) {}

  // price level -> resting orders at that price, oldest first
  private final TreeMap<Long, ArrayDeque<Order>> bids = new TreeMap<>(Comparator.reverseOrder());  // first = highest
  private final TreeMap<Long, ArrayDeque<Order>> asks = new TreeMap<>();                           // first = lowest

  List<Fill> submit(Order o) {
    List<Fill> fills = new ArrayList<>();
    TreeMap<Long, ArrayDeque<Order>> other = o.buy() ? asks : bids;
    long left = o.qty();
    while (left > 0 && !other.isEmpty()) {
      Map.Entry<Long, ArrayDeque<Order>> best = other.firstEntry();     // best opposite price: O(log n)
      long p = best.getKey();
      if (o.buy() ? p > o.price() : p < o.price()) break;               // prices no longer cross
      ArrayDeque<Order> level = best.getValue();
      Order resting = level.pollFirst();                                // oldest order at this price
      long q = Math.min(left, resting.qty());
      fills.add(o.buy() ? new Fill(o.id(), resting.id(), p, q) : new Fill(resting.id(), o.id(), p, q));
      left -= q;
      if (q < resting.qty())                                            // partly filled: keeps its place
        level.addFirst(new Order(resting.id(), resting.buy(), p, resting.qty() - q));
      if (level.isEmpty()) other.pollFirstEntry();
    }
    if (left > 0)                                                       // the rest waits in the book
      (o.buy() ? bids : asks).computeIfAbsent(o.price(), k -> new ArrayDeque<>())
          .addLast(new Order(o.id(), o.buy(), o.price(), left));
    return fills;
  }

  Long bestBid() { return bids.isEmpty() ? null : bids.firstKey(); }
  Long bestAsk() { return asks.isEmpty() ? null : asks.firstKey(); }
}`}
${rs('order_book.rs')`
use std::collections::{BTreeMap, VecDeque};

#[derive(Clone, Copy, Debug)]
struct Order { id: u64, buy: bool, price: u64, qty: u64 }

#[derive(Debug, PartialEq)]
struct Fill { buy_id: u64, sell_id: u64, price: u64, qty: u64 }

// A price-time priority limit order book for one instrument. Prices are in cents.
#[derive(Default)]
struct OrderBook {
    bids: BTreeMap<u64, VecDeque<Order>>,   // best bid = last key (highest)
    asks: BTreeMap<u64, VecDeque<Order>>,   // best ask = first key (lowest)
}

impl OrderBook {
    fn submit(&mut self, mut o: Order) -> Vec<Fill> {
        let mut fills = Vec::new();
        while o.qty > 0 {
            // the best opposite level, as long as its price crosses ours
            let best = if o.buy { self.asks.first_entry() } else { self.bids.last_entry() };
            let crosses = |p: u64| if o.buy { p <= o.price } else { p >= o.price };
            let Some(mut level) = best.filter(|e| crosses(*e.key())) else { break };
            let p = *level.key();
            let resting = level.get_mut().front_mut().expect("a level is never left empty");
            let q = o.qty.min(resting.qty);
            let (buy_id, sell_id) = if o.buy { (o.id, resting.id) } else { (resting.id, o.id) };
            fills.push(Fill { buy_id, sell_id, price: p, qty: q });
            o.qty -= q;
            resting.qty -= q;                          // partly filled: keeps its place
            if resting.qty == 0 { level.get_mut().pop_front(); }
            if level.get().is_empty() { level.remove(); }
        }
        if o.qty > 0 {                                 // the rest waits in the book
            let side = if o.buy { &mut self.bids } else { &mut self.asks };
            side.entry(o.price).or_default().push_back(o);
        }
        fills
    }

    fn best_bid(&self) -> Option<u64> { self.bids.last_key_value().map(|(&p, _)| p) }
    fn best_ask(&self) -> Option<u64> { self.asks.first_key_value().map(|(&p, _)| p) }
}`}
<p>A worked run: sell 100 at 101.00 and sell 50 at 100.50 both rest on the ask side. A buy for 120 at 101.00 then takes all 50 at 100.50 (the better price first), then 70 of the 100 at 101.00, which keeps its place in the queue with 30 left. The best ask is now 101.00 and there is no bid. The Java version orders the bid map with <code>Comparator.reverseOrder()</code> so that the best bid is the first key; the Rust version keeps both maps ascending and takes the best bid from the end with <code>last_entry</code>.</p>
<p>Why not a priority queue of orders, as Chapter 7 suggests at first sight? Real books spend much of their time on cancellations, and a heap cannot remove an arbitrary order cheaply. A production book adds a hash map from order id to its order, and stores each price level as a doubly linked list (Chapter 3), so that a cancel is O(1) once the order is found, and an emptied level is removed from the tree in O(log n). Matching for one instrument usually runs on a single thread, so the book needs no locks; the parallelism comes from running many instruments side by side.</p>

<h2>Other trees you will meet</h2>
<ul>
<li><strong>N-ary trees</strong> allow any number of children, stored as a list. File systems and HTML documents are N-ary trees.</li>
<li><strong>Tries</strong> store strings one character per level and answer prefix queries quickly (Chapter 15).</li>
<li><strong>Heaps</strong> are complete binary trees ordered so the smallest key is at the root (Chapter 7).</li>
<li><strong>B-trees</strong> are balanced trees with hundreds of keys per node, designed so that each node fills one disk page. The default index type in most relational databases is a B+ tree.</li>
<li><strong>Segment trees</strong> and <strong>Fenwick trees</strong> answer range queries over arrays (Chapter 21).</li>
</ul>

<h2>Costs</h2>

</table></div>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Validating a BST against direct children only.</strong> Pass the allowed range down the recursion.</li>
<li><strong>Overflow in range bounds.</strong> Use <code>long</code> or nullable bounds when keys can be <code>Integer.MIN_VALUE</code> or <code>MAX_VALUE</code>.</li>
<li><strong>Deep recursion on skewed trees.</strong> A degenerate tree of tens of thousands of nodes can overflow the default Java stack (in a test, 10,000 was already enough for a recursive inorder); use an iterative traversal. In Rust, even dropping such a tree recurses, one call per level.</li>
<li><strong>Forgetting to reassign children</strong> in recursive insert and delete. Write <code>n.left = insert(n.left, key)</code>, not just <code>insert(n.left, key)</code>.</li>
<li><strong>Confusing height conventions.</strong> Decide whether an empty tree has height −1 or 0 and stick to it.</li>
<li><strong>Floating-point prices as keys.</strong> Rounding makes equal prices compare unequal, and in Rust <code>f64</code> is not even <code>Ord</code>, so it cannot key a <code>BTreeMap</code>. Use integer minor units.</li>
</ul></div>

function heapView(a, st, es, note) { return { a: [...a], st: { ...st }, es: { ...(es || {}) }, note }; }
function renderHeap(f) {
  const t = heapTree(f.a, { st: f.st, es: f.es, W: 560, idx: true });
  const r = arrayRow(f.a, { st: f.st, cell: 44, y: 0 });
  return { s: t.s + grp((560 - r.w) / 2, t.h + 14, r.s), w: 560, h: t.h + 14 + r.h };
}
function siftUpFrames(a, x) {
  a = [...a]; const F = [heapView(a, {}, {}, `Insert ${x} into the min-heap.`)];
  a.push(x); let i = a.length - 1;
  F.push(heapView(a, { [i]: 'hot' }, {}, `Place ${x} at the end of the array (index ${i}), the next free spot on the bottom level. The shape stays complete, but the order may now be broken.`));
  while (i > 0) {
    const p = (i - 1) >> 1;
    if (a[p] <= a[i]) { F.push(heapView(a, { [i]: 'hot', [p]: 'ok' }, { [p + '-' + i]: 'ok' }, `Parent ${a[p]} (index ${p}) ≤ ${a[i]}. Heap order holds, so stop.`)); break; }
    F.push(heapView(a, { [i]: 'hot', [p]: 'cmp' }, { [p + '-' + i]: 'hot' }, `Parent ${a[p]} at index ${p} is larger than ${a[i]}. Swap them.`));
    [a[p], a[i]] = [a[i], a[p]]; i = p;
    F.push(heapView(a, { [i]: 'hot' }, {}, i === 0 ? `${a[i]} has reached the root. Done after ${Math.floor(Math.log2(a.length))} levels at most.` : `${a[i]} moved up to index ${i}. Compare with its new parent.`));
  }
  return F;
}
function siftDownFrames(a, i0, n, F, label) {
  let i = i0;
  while (true) {
    const l = 2 * i + 1, r = l + 1; if (l >= n) { F.push(heapView(a, { [i]: 'ok' }, {}, `${a[i]} at index ${i} has no children. Stop.`)); break; }
    const c = r < n && a[r] < a[l] ? r : l;
    const st = { [i]: 'hot', [l]: 'cmp' }; if (r < n) st[r] = 'cmp'; st[c] = 'acc';
    if (a[i] <= a[c]) { F.push(heapView(a, { [i]: 'ok', [c]: 'acc' }, {}, `${a[i]} ≤ its smaller child ${a[c]}. Heap order holds. Stop.`)); break; }
    F.push(heapView(a, st, { [i + '-' + c]: 'hot' }, `${label ? label + ' ' : ''}Children of ${a[i]} are ${a[l]}${r < n ? ' and ' + a[r] : ''}. The smaller is ${a[c]}, which is less than ${a[i]}: swap.`));
    [a[i], a[c]] = [a[c], a[i]]; i = c;
  }
}
