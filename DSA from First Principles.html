CH.push({
  id: 'ch14', n: 14, title: 'Hashing',
  lede: 'Hashing turns a key into an array index so that a lookup jumps straight to the right place instead of searching. Done well, it gives constant-time insertion, deletion and lookup on average, which makes hash tables the fastest general-purpose symbol table. This chapter covers hash functions, collisions, resizing, Bloom filters and the security side of hashing.',
  html: `
<h2>The idea</h2>
<p>If keys were small integers, say 0 to 999, you could store values in an array of 1,000 slots and use the key directly as the index. Every operation would be one array access. This is called <strong>direct addressing</strong>. It fails as soon as keys come from a huge space: strings, 64-bit account numbers, UUIDs. You cannot allocate an array with 2⁶⁴ slots.</p>
<p>A <strong>hash function</strong> fixes that. It maps each key from the huge space to an index in a small array of m slots, called <strong>buckets</strong>. A lookup computes the hash of the key and goes straight to that bucket.</p>
${fig('hashidea', '<b>Figure 14.1</b> Five names hashed into eight buckets with Java\'s String hash. Two names landing in the same bucket is a collision.')}
<p>Because there are far more possible keys than buckets, different keys will sometimes hash to the same bucket. This is a <strong>collision</strong>, and it is unavoidable: if you put m + 1 keys into m buckets, at least one bucket gets two (the pigeonhole principle). Collisions also happen far sooner than intuition suggests. By the <strong>birthday paradox</strong>, with 23 people the chance that two share a birthday is over 50%, and with m buckets you expect the first collision after only about √(πm/2) keys. Every hash table therefore needs two ingredients: a good hash function, and a strategy for collisions.</p>

<h2>Hash functions</h2>
<p>A good hash function for a table has three properties:</p>
<ul>
<li><strong>Deterministic:</strong> the same key always produces the same hash.</li>
<li><strong>Uniform:</strong> keys are spread evenly over the buckets, with no pattern in the input showing up as a pattern in the output.</li>
<li><strong>Fast:</strong> it is computed on every operation.</li>
</ul>
<h3>Hashing integers</h3>
<p>The simplest scheme is the <strong>division method</strong>, h(k) = k mod m. It is fast, but sensitive to the choice of m. If m is a power of two, h(k) keeps only the lowest bits of k, so keys that differ only in their high bits all collide; prime m works better. The <strong>multiplication method</strong> computes (k × A) and takes the top bits of the result, for a carefully chosen constant A. It works well with power-of-two table sizes and is the basis of many fast integer hashes.</p>
<h3>Hashing strings</h3>
<p>Treat the string as a number in some base and reduce it as you go. Java's <code>String.hashCode</code> uses base 31:</p>
<div class="formula">h = s[0]·31^(n-1) + s[1]·31^(n-2) + … + s[n-1]        (computed with int overflow)</div>
${code('String hash, Horner style')`
static int hash(String s) {
  int h = 0;
  for (int i = 0; i < s.length(); i++) h = 31 * h + s.charAt(i);   // overflow wraps around; that is fine
  return h;
}`}
${rs('string_hash.rs')`
// Java's String.hashCode, reproduced over UTF-16 code units. Rust panics on overflow in debug
// builds, so the wraparound that Java does silently must be asked for explicitly.
fn hash(s: &str) -> i32 {
    s.encode_utf16().fold(0, |h: i32, c| h.wrapping_mul(31).wrapping_add(i32::from(c)))
}
`}
<p>Every character affects the result, and the multiplication spreads each character's influence across many bits. Computing it is O(length); <code>String</code> caches the result after the first call.</p>
<h3>Hashing compound keys</h3>
<p>For a key made of several fields, combine the fields' hashes the same way: <code>h = 31 * h + field.hashCode()</code> for each field. <code>Objects.hash(a, b, c)</code> does exactly this, starting from 1. Records generate a similar combination, though the exact formula is deliberately left unspecified. In Rust, <code>#[derive(Hash)]</code> feeds each field into a <code>Hasher</code> in turn and leaves the mixing to the hasher.</p>
<h3>From hash code to bucket</h3>
<p>A hash code can be any int, including negative. To get an index in [0, m), Java's <code>HashMap</code> first mixes the high bits into the low bits (<code>h ^ (h &gt;&gt;&gt; 16)</code>), because a power-of-two table only looks at the low bits, and then masks with <code>&amp; (m − 1)</code>. If you use the modulo operator yourself, use <code>Math.floorMod(h, m)</code>; <code>Math.abs(h) % m</code> fails for <code>Integer.MIN_VALUE</code>, whose absolute value is still negative.</p>

<h2>Collision resolution: separate chaining</h2>
<p>In <strong>separate chaining</strong>, each bucket holds a small linked list (a chain) of all the entries that hashed there. Insert adds to the chain; lookup hashes to a bucket and walks its chain comparing keys with <code>equals</code>.</p>
${fig('chain', '<b>Figure 14.2</b> Inserting seven keys with h(k) = k mod 7. Four of them collide in bucket 1 and share a chain.')}
<p>The <strong>load factor</strong> α = n / m is the average chain length. A lookup costs O(1 + α): one step to hash, plus walking a chain. If you keep α bounded by a constant, every operation is O(1) on average. Chaining degrades gracefully: even at α = 2 or 3 it still works, just more slowly.</p>
${code('ChainedHashMap.java')`
import java.util.*;

public class ChainedHashMap<K, V> {
  private static class Entry<K, V> { final K key; V val; Entry<K, V> next; Entry(K k, V v, Entry<K, V> n) { key = k; val = v; next = n; } }
  private Entry<K, V>[] table;
  private int size;

  @SuppressWarnings("unchecked")
  public ChainedHashMap() { table = (Entry<K, V>[]) new Entry[16]; }

  private int index(Object key, int m) {
    int h = key.hashCode();
    h ^= (h >>> 16);                 // spread high bits into the low bits
    return h & (m - 1);              // m is a power of two
  }
  public V get(K key) {
    for (Entry<K, V> e = table[index(key, table.length)]; e != null; e = e.next)
      if (e.key.equals(key)) return e.val;
    return null;
  }
  public void put(K key, V val) {
    int i = index(key, table.length);
    for (Entry<K, V> e = table[i]; e != null; e = e.next)
      if (e.key.equals(key)) { e.val = val; return; }        // replace
    table[i] = new Entry<>(key, val, table[i]);              // add at the front of the chain
    if (++size > table.length * 3 / 4) resize();             // keep the load factor <= 0.75
  }
  public void remove(K key) {
    int i = index(key, table.length);
    Entry<K, V> prev = null;
    for (Entry<K, V> e = table[i]; e != null; prev = e, e = e.next)
      if (e.key.equals(key)) { if (prev == null) table[i] = e.next; else prev.next = e.next; size--; return; }
  }
  @SuppressWarnings("unchecked")
  private void resize() {
    Entry<K, V>[] old = table;
    table = (Entry<K, V>[]) new Entry[old.length * 2];
    for (Entry<K, V> head : old)
      for (Entry<K, V> e = head; e != null; e = e.next) {
        int i = index(e.key, table.length);                  // indices change with m: rehash every key
        table[i] = new Entry<>(e.key, e.val, table[i]);
      }
  }
}`}
${rs('chained_hash_map.rs')`
use std::hash::{BuildHasher, Hash, RandomState};

pub struct ChainedHashMap<K, V> {
    table: Vec<Vec<(K, V)>>,       // each bucket is a small Vec rather than a linked chain
    size: usize,
    hasher: RandomState,           // SipHash with a random key, as std's HashMap uses
}

impl<K: Hash + Eq, V> ChainedHashMap<K, V> {
    pub fn new() -> Self {
        ChainedHashMap { table: empty_table(16), size: 0, hasher: RandomState::new() }
    }
    fn index(&self, key: &K, m: usize) -> usize {
        self.hasher.hash_one(key) as usize & (m - 1)         // m is a power of two
    }
    pub fn get(&self, key: &K) -> Option<&V> {
        let bucket = &self.table[self.index(key, self.table.len())];
        bucket.iter().find(|(k, _)| k == key).map(|(_, v)| v)
    }
    pub fn put(&mut self, key: K, val: V) {
        let i = self.index(&key, self.table.len());
        if let Some(entry) = self.table[i].iter_mut().find(|(k, _)| *k == key) {
            entry.1 = val;                                   // replace
            return;
        }
        self.table[i].push((key, val));
        self.size += 1;
        if self.size > self.table.len() * 3 / 4 { self.resize(); }   // keep the load factor <= 0.75
    }
    pub fn remove(&mut self, key: &K) -> Option<V> {
        let i = self.index(key, self.table.len());
        let pos = self.table[i].iter().position(|(k, _)| k == key)?;
        self.size -= 1;
        Some(self.table[i].swap_remove(pos).1)               // order inside a bucket does not matter
    }
    fn resize(&mut self) {
        let m = self.table.len() * 2;
        let old = std::mem::replace(&mut self.table, empty_table(m));
        for (k, v) in old.into_iter().flatten() {
            let i = self.index(&k, m);                       // indices change with m: rehash every key
            self.table[i].push((k, v));                      // moves the pair; nothing is cloned
        }
    }
}

impl<K: Hash + Eq, V> Default for ChainedHashMap<K, V> {
    fn default() -> Self { Self::new() }
}

fn empty_table<K, V>(m: usize) -> Vec<Vec<(K, V)>> {
    std::iter::repeat_with(Vec::new).take(m).collect()
}
`}

<p>The Rust version keeps each bucket in a small <code>Vec</code> instead of a linked chain, which is simpler under ownership and friendlier to the cache, and it hashes with the standard library's randomly keyed SipHash, whose output is already well mixed. Resizing moves each pair into the new table without copying it.</p>

<h2>Collision resolution: open addressing</h2>
<p>In <strong>open addressing</strong>, all entries live directly in the array. When the home slot of a key is occupied, the table <strong>probes</strong> a sequence of other slots until it finds a free one. Lookup follows the same sequence until it finds the key or an empty slot.</p>
${fig('probe', '<b>Figure 14.3</b> Linear probing. Keys that collide spill into neighbouring slots and build a cluster. Deletion leaves a tombstone.')}
<div class="tbl"><table><tr><th>Probe sequence</th><th>Slot tried on attempt i</th><th>Behaviour</th></tr>
<tr><td>Linear probing</td><td class="num">(h(k) + i) mod m</td><td>Very cache-friendly, but forms long runs of occupied slots (primary clustering).</td></tr>
<tr><td>Quadratic probing</td><td class="num">(h(k) + i²) mod m</td><td>Breaks up runs; keys with the same home slot still follow the same path.</td></tr>
<tr><td>Double hashing</td><td class="num">(h₁(k) + i·h₂(k)) mod m</td><td>Each key has its own step size; behaves close to ideal random probing.</td></tr>
</table></div>
<p>Open addressing must keep the load factor well below 1, typically at most 0.5 to 0.7, because the expected number of probes grows like 1/(1 − α) and explodes as the table fills. Deletion needs care: emptying a slot would break the probe chain of any key that passed through it, so deleted slots are marked with a <strong>tombstone</strong> that searches skip over and inserts may reuse.</p>
<p>Chaining is simpler and tolerates high load. Open addressing uses less memory per entry (no node objects or references) and has far better cache behaviour, which is why many high-performance tables use it.</p>

<h2>Load factor and resizing</h2>
<p>As entries are added, α grows and operations slow down. When α passes a threshold, allocate a table about twice as large and <strong>rehash</strong>: reinsert every entry, because each key's bucket depends on m. A single resize costs O(n), but by the same doubling argument as the dynamic array in Chapter 1, the cost spread over all insertions is O(1) amortized.</p>
<p>If you know roughly how many entries a map will hold, create it with enough capacity from the start to avoid repeated resizes. In Java 19 and later, <code>HashMap.newHashMap(expectedSize)</code> computes the right capacity for you.</p>

<h2>Inside Java's HashMap</h2>
<ul>
<li>Separate chaining over an array whose length is always a power of two, starting at 16.</li>
<li>Default load factor 0.75: the table doubles when it is three-quarters full.</li>
<li>Hash codes are spread with <code>h ^ (h &gt;&gt;&gt; 16)</code> before masking.</li>
<li>Since Java 8, when an entry is added to a bucket that already holds 8 entries, the chain is converted into a small red-black tree, provided the table has at least 64 buckets; a smaller table is doubled instead. A tree shrinks back to a list at 6 entries or fewer when a resize splits it. The tree orders entries by hash and, when hashes are equal, by <code>compareTo</code> if the keys are <code>Comparable</code>, so the worst case for that bucket becomes O(log n) for keys such as <code>String</code>. Keys with identical hashes that are not <code>Comparable</code> can still cost O(n) per lookup.</li>
<li>One <code>null</code> key and any number of <code>null</code> values are allowed. <code>ConcurrentHashMap</code> allows neither.</li>
<li>Iteration order is unspecified and can change after a resize. Never rely on it.</li>
</ul>
<h3>Inside Rust's HashMap</h3>
<ul>
<li>Open addressing, not chaining: the table is a port of Google's SwissTable. Alongside the entries it keeps one control byte per slot holding 7 bits of the key's hash, and it compares a whole group of control bytes at once with SIMD instructions, so most lookups inspect one group and then one entry. Probing between groups is quadratic.</li>
<li>The default hasher is SipHash-1-3 with a random key, chosen when the map's <code>RandomState</code> is created. An attacker cannot predict collisions, so there is no tree fallback. A side effect is that iteration order differs from one run of the program to the next, not only after a resize.</li>
<li>SipHash is slower than a simple multiply-and-shift for small keys such as integers. When the keys cannot be chosen by an attacker, a faster hasher from a crate can be plugged in with <code>HashMap::with_hasher</code>.</li>
<li>Keys must implement <code>Eq</code> and <code>Hash</code> consistently. <code>HashMap::with_capacity(n)</code> plays the role of <code>newHashMap</code>, and a <code>HashMap&lt;String, V&gt;</code> can be queried with a <code>&amp;str</code>, because <code>String</code> implements <code>Borrow&lt;str&gt;</code>.</li>
</ul>
<div class="tbl"><table><tr><th>Scheme</th><th>Expected search or insert</th><th>Worst case</th><th>Typical maximum load</th></tr>
<tr><td>Separate chaining</td><td class="num">O(1 + α)</td><td class="num">O(n), or O(log n) with treeified bins</td><td class="num">0.75 to 3</td></tr>
<tr><td>Linear probing</td><td class="num">O(1/(1 − α)²) unsuccessful</td><td class="num">O(n)</td><td class="num">0.5 to 0.7</td></tr>
<tr><td>Double hashing</td><td class="num">O(1/(1 − α))</td><td class="num">O(n)</td><td class="num">0.7 to 0.8</td></tr>
<tr><td>Resize</td><td class="num">O(n) once, O(1) amortized</td><td></td><td></td></tr>
</table></div>

<h2>Hashing patterns</h2>
<p>Many problems become linear once you ask "have I seen this before?" in O(1):</p>
${code('Three hash-map patterns')`
// 1. Complement lookup: two numbers that add to target, O(n).
static int[] twoSum(int[] a, int target) {
  Map<Integer, Integer> seen = new HashMap<>();
  for (int i = 0; i < a.length; i++) {
    Integer j = seen.get(target - a[i]);
    if (j != null) return new int[]{j, i};
    seen.put(a[i], i);
  }
  return null;
}

// 2. Prefix sums: number of subarrays summing to k, O(n).
static int subarraySum(int[] a, int k) {
  Map<Integer, Integer> count = new HashMap<>(Map.of(0, 1));   // the empty prefix
  int sum = 0, res = 0;
  for (int x : a) {
    sum += x;
    res += count.getOrDefault(sum - k, 0);   // earlier prefixes that leave exactly k
    count.merge(sum, 1, Integer::sum);
  }
  return res;
}

// 3. Canonical keys: group words that are anagrams.
static Collection<List<String>> anagrams(String[] words) {
  Map<String, List<String>> g = new HashMap<>();
  for (String w : words) {
    char[] c = w.toCharArray(); Arrays.sort(c);
    g.computeIfAbsent(new String(c), k -> new ArrayList<>()).add(w);
  }
  return g.values();
}`}
${rs('hash_patterns.rs')`
use std::collections::HashMap;

// 1. Complement lookup: two numbers that add to target, O(n).
fn two_sum(a: &[i32], target: i32) -> Option<(usize, usize)> {
    let mut seen = HashMap::new();
    for (i, &x) in a.iter().enumerate() {
        // checked_sub: if target - x overflows, no i32 can be the complement.
        if let Some(&j) = target.checked_sub(x).and_then(|c| seen.get(&c)) { return Some((j, i)); }
        seen.insert(x, i);
    }
    None
}

// 2. Prefix sums: number of subarrays summing to k, O(n).
fn subarray_sum(a: &[i32], k: i64) -> usize {
    let mut count = HashMap::from([(0, 1)]);          // the empty prefix
    let (mut sum, mut res) = (0i64, 0);
    for &x in a {
        sum += i64::from(x);                          // i64: the running sum cannot overflow
        res += count.get(&(sum - k)).copied().unwrap_or(0);   // earlier prefixes that leave exactly k
        *count.entry(sum).or_insert(0) += 1;
    }
    res
}

// 3. Canonical keys: group words that are anagrams.
fn anagrams<'a>(words: &[&'a str]) -> Vec<Vec<&'a str>> {
    let mut groups: HashMap<Vec<char>, Vec<&str>> = HashMap::new();
    for &w in words {
        let mut key: Vec<char> = w.chars().collect();
        key.sort_unstable();
        groups.entry(key).or_default().push(w);
    }
    groups.into_values().collect()
}
`}

<h2>Bloom filters</h2>
<p>Sometimes you only need to know whether an item is <em>possibly</em> in a huge set, and you cannot afford to store the set in memory. A <strong>Bloom filter</strong> answers membership questions using a bit array of m bits and k independent hash functions.</p>
<ul>
<li>To <strong>add</strong> an item, compute its k hashes and set those k bits to 1.</li>
<li>To <strong>query</strong> an item, check its k bits. If any bit is 0, the item was definitely never added. If all are 1, it was <em>probably</em> added.</li>
</ul>
${fig('bloom', '<b>Figure 14.4</b> A 16-bit Bloom filter. A zero bit proves absence; all ones only suggests presence.')}
<p>A Bloom filter never gives a false negative, but it can give a <strong>false positive</strong> when other items happen to have set all of a key's bits. With n items, the false-positive rate is about (1 − e^(−kn/m))^k, which is minimized by choosing k = (m/n)·ln 2. The practical rule: about <strong>9.6 bits per item gives a 1% false-positive rate</strong>, and each extra 4.8 bits per item cuts it by ten. That is regardless of how large each item is. You cannot delete from a standard Bloom filter; a <em>counting</em> Bloom filter replaces bits with small counters to allow it.</p>
<p>Bloom filters sit in front of expensive lookups. Databases such as Cassandra and RocksDB check one before reading a file from disk. A payment system can check a card number against a revocation list in memory and only query the database on a "maybe". Browsers have used them to check URLs against lists of malicious sites.</p>
${code('BloomFilter.java')`
import java.util.BitSet;

public class BloomFilter {
  private final BitSet bits; private final int m, k;
  public BloomFilter(int expectedItems, double fpRate) {
    m = (int) Math.ceil(-expectedItems * Math.log(fpRate) / (Math.log(2) * Math.log(2)));
    k = Math.max(1, (int) Math.round((double) m / expectedItems * Math.log(2)));
    bits = new BitSet(m);
  }
  // Double hashing: k hash functions from two base hashes.
  private int bit(String s, int i) {
    int h1 = s.hashCode(), h2 = Integer.rotateLeft(h1 * 0x9E3779B9, 16) | 1;
    return Math.floorMod(h1 + i * h2, m);
  }
  public void add(String s) { for (int i = 0; i < k; i++) bits.set(bit(s, i)); }
  public boolean mightContain(String s) {
    for (int i = 0; i < k; i++) if (!bits.get(bit(s, i))) return false;   // definitely absent
    return true;                                                           // probably present
  }
}`}
${rs('bloom_filter.rs')`
use std::hash::{BuildHasher, Hash, RandomState};

pub struct BloomFilter {
    bits: Vec<u64>,                // m bits packed 64 to a word
    m: u64,
    k: u64,
    hasher: RandomState,           // random per filter: a filter saved to disk needs a fixed seed
}

impl BloomFilter {
    pub fn new(expected_items: usize, fp_rate: f64) -> Self {
        let n = expected_items as f64;
        let ln2 = std::f64::consts::LN_2;
        let m = (-n * fp_rate.ln() / (ln2 * ln2)).ceil() as u64;
        let k = ((m as f64 / n * ln2).round() as u64).max(1);
        BloomFilter { bits: vec![0; m.div_ceil(64) as usize], m, k, hasher: RandomState::new() }
    }
    // Double hashing: k bit positions from the two 32-bit halves of one 64-bit hash.
    // use<T>: the iterator borrows neither self nor x, so add can update bits while using it.
    fn positions<T: Hash + ?Sized>(&self, x: &T) -> impl Iterator<Item = usize> + use<T> {
        let h = self.hasher.hash_one(x);
        let (h1, h2, m) = (h >> 32, (h & 0xffff_ffff) | 1, self.m);
        (0..self.k).map(move |i| (h1.wrapping_add(i.wrapping_mul(h2)) % m) as usize)
    }
    pub fn add<T: Hash + ?Sized>(&mut self, x: &T) {
        for b in self.positions(x) { self.bits[b / 64] |= 1 << (b % 64); }
    }
    pub fn might_contain<T: Hash + ?Sized>(&self, x: &T) -> bool {
        self.positions(x).all(|b| self.bits[b / 64] & (1 << (b % 64)) != 0)   // a 0 bit: definitely absent
    }
}
`}

<h2>Hashing and security</h2>
<p>The word "hash" covers two families of functions with very different goals. Mixing them up causes real vulnerabilities.</p>
<div class="tbl"><table><tr><th></th><th>Table hash functions</th><th>Cryptographic hash functions</th><th>Password hashing functions</th></tr>
<tr><td>Examples</td><td>String.hashCode, MurmurHash, xxHash</td><td>SHA-256, SHA-3, BLAKE2</td><td>Argon2id, scrypt, bcrypt, PBKDF2</td></tr>
<tr><td>Goal</td><td>speed and an even spread</td><td>infeasible to find collisions or invert</td><td>deliberately slow and memory-hungry</td></tr>
<tr><td>Use for</td><td>hash tables, Bloom filters, sharding</td><td>integrity checks, signatures, Merkle trees, content addressing</td><td>storing passwords</td></tr>
<tr><td>Never use for</td><td>anything an attacker can exploit</td><td>password storage on its own (too fast)</td><td>hash tables (far too slow)</td></tr>
</table></div>
<h3>Hash flooding</h3>
<p>Table hash functions are easy to reverse-engineer. An attacker who controls the keys, such as the parameter names in a web request, can deliberately choose thousands of keys that all hash to the same bucket. Every insertion then walks one long chain, the table degrades to O(n) per operation, and a single request can consume seconds of CPU. This denial-of-service attack was demonstrated against many web platforms in 2011, including Java's. The defences are a hash function with a secret random seed (as Python and Rust use), treeified buckets (as Java 8 added) and limits on the number of keys accepted from untrusted input. A table with a seeded hash needs no tree fallback, which is why Rust's <code>HashMap</code> has none.</p>
<h3>Integrity and content addressing</h3>
<p>A cryptographic hash such as SHA-256 produces a 256-bit digest that changes completely if a single bit of the input changes, and nobody can feasibly find two inputs with the same digest. That makes it a fingerprint: store or sign the digest, and anyone can later verify the data has not been altered. Git identifies every commit by such a hash, and a <strong>Merkle tree</strong> (a tree of hashes of hashes) lets a blockchain or a database prove that one record belongs to a huge dataset with only log n hashes.</p>
${code('SHA-256 digest in Java')`
import java.security.MessageDigest;
import java.util.HexFormat;

byte[] digest = MessageDigest.getInstance("SHA-256").digest("ledger-batch-001".getBytes(java.nio.charset.StandardCharsets.UTF_8));
String hex = HexFormat.of().formatHex(digest);   // 64 hex characters`}

use sha2::{Digest, Sha256};       // the RustCrypto sha2 crate: std has no cryptographic hashes

let digest = Sha256::digest("ledger-batch-001".as_bytes());
let hex: String = digest.iter().map(|b| format!("{b:02x}")).collect();   // 64 hex characters
`}
<h3>Passwords</h3>
<p>A fast hash is exactly wrong for passwords, because an attacker with a stolen database can try billions of guesses per second on a GPU. Password hashing functions such as <strong>Argon2id</strong> are designed to be slow and to use a lot of memory, with a tunable cost, and they mix in a random per-user <strong>salt</strong> so that identical passwords produce different hashes and precomputed tables are useless. OWASP's current guidance recommends Argon2id first and keeps bcrypt for legacy systems.</p>

<h2>Applied: idempotency keys and deduplication</h2>
<p>Networks fail in the middle of requests. A client that sends "pay 100" and times out cannot tell whether the payment happened, so it retries, and without protection the customer is charged twice. The standard defence is an <strong>idempotency key</strong>: the client generates a unique key (usually a random UUID) for each logical operation and sends it with every attempt. The server keeps a map from key to outcome. The first request with a key does the work and stores the response; a retry with the same key gets the stored response back, and nothing is charged again.</p>
<p>Three details make it correct. The claim must be <strong>atomic</strong>: two retries arriving together must not both find the key absent and both run the payment, so the check and the insert are one operation (<code>putIfAbsent</code>, a lock around the map, or a unique constraint on the key in a database). The store keeps a <strong>fingerprint</strong> of the request, a SHA-256 of its body, so that a client bug that reuses a key for a different payment is rejected instead of being answered with the wrong response. And a request that is still running is reported as such, not run a second time.</p>
${code('IdempotencyStore.java')`
import java.security.MessageDigest;
import java.nio.charset.StandardCharsets;
import java.util.HexFormat;
import java.util.concurrent.ConcurrentHashMap;
import java.util.function.UnaryOperator;

public class IdempotencyStore {
  private record Entry(String fingerprint, String response) {}     // response == null: still running
  private final ConcurrentHashMap<String, Entry> entries = new ConcurrentHashMap<>();

  /** Runs process at most once per key; a retry with the same key and body gets the stored response. */
  public String handle(String key, String body, UnaryOperator<String> process) {
    String fp = sha256(body);                                        // fingerprint of the request
    Entry prev = entries.putIfAbsent(key, new Entry(fp, null));      // atomic claim: one winner per key
    if (prev != null) {
      if (!prev.fingerprint().equals(fp)) throw new IllegalArgumentException("key reused for a different request");
      if (prev.response() == null) throw new IllegalStateException("first request still in progress");
      return prev.response();                                        // replay: do not charge twice
    }
    try {
      String response = process.apply(body);
      entries.put(key, new Entry(fp, response));
      return response;
    } catch (RuntimeException e) {
      entries.remove(key);               // failed before any effect: let the client retry
      throw e;
    }
  }

  private static String sha256(String s) {
    try {
      return HexFormat.of().formatHex(MessageDigest.getInstance("SHA-256").digest(s.getBytes(StandardCharsets.UTF_8)));
    } catch (java.security.NoSuchAlgorithmException e) { throw new AssertionError(e); }   // every JDK has SHA-256
  }
}
`}
${rs('idempotency_store.rs')`
use sha2::{Digest, Sha256};
use std::collections::HashMap;
use std::collections::hash_map::Entry;
use std::sync::Mutex;

struct Record { fingerprint: [u8; 32], response: Option<String> }   // None: still running

#[derive(Debug, PartialEq)]
enum IdemError { KeyReused, InProgress, Failed(String) }

#[derive(Default)]
struct IdempotencyStore { records: Mutex<HashMap<String, Record>> }

impl IdempotencyStore {
    /// Runs process at most once per key; a retry with the same key and body gets the stored response.
    fn handle(&self, key: &str, body: &str,
              process: impl FnOnce(&str) -> Result<String, String>) -> Result<String, IdemError> {
        let fp: [u8; 32] = Sha256::digest(body.as_bytes()).into();       // fingerprint of the request
        match self.records.lock().unwrap().entry(key.to_owned()) {       // the lock makes the claim atomic
            Entry::Vacant(v) => { v.insert(Record { fingerprint: fp, response: None }); }
            Entry::Occupied(o) => {
                let r = o.get();
                if r.fingerprint != fp { return Err(IdemError::KeyReused); }
                return r.response.clone().ok_or(IdemError::InProgress);  // replay: do not charge twice
            }
        }                                                                // lock released while process runs
        let result = process(body);
        let mut records = self.records.lock().unwrap();
        match result {
            Ok(resp) => {
                records.insert(key.to_owned(), Record { fingerprint: fp, response: Some(resp.clone()) });
                Ok(resp)
            }
            Err(e) => { records.remove(key); Err(IdemError::Failed(e)) }   // failed before any effect: allow a retry
        }
    }
}
`}
<p>One process can keep this map in memory, but a payment service with several instances needs it in shared storage: a table with the key as its primary key, or a cache command that sets a key only if it is absent, with an expiry. The structure is the same hash map. Entries expire after a retention window chosen to outlast every client's retries. Removing the entry when processing fails, as the code above does, is right only if the failure happened before anything reached the outside world. If a call to a card network timed out, the outcome is unknown: record it and reconcile it, rather than letting a retry charge again.</p>
<h3>Deduplicating a message stream</h3>
<p>Message brokers usually promise at-least-once delivery, so consumers see the occasional redelivery. If every message carries a unique ID, a consumer can drop repeats with a set of the IDs it has seen. The set must not grow forever, so it keeps only the IDs from a recent time window and expires them from the front of a queue, exactly like the sliding windows of Chapter 5.</p>
${code('Deduplicator.java')`
import java.util.ArrayDeque;
import java.util.HashSet;
import java.util.Set;

public class Deduplicator {
  private record Seen(long timeMs, String id) {}
  private final Set<String> seen = new HashSet<>();
  private final ArrayDeque<Seen> order = new ArrayDeque<>();        // oldest first
  private final long windowMs;

  public Deduplicator(long windowMs) { this.windowMs = windowMs; }

  /** True the first time an id arrives within the window; false for a redelivery. Times must not decrease. */
  public boolean firstTime(String id, long nowMs) {
    while (!order.isEmpty() && order.peekFirst().timeMs() + windowMs <= nowMs)
      seen.remove(order.pollFirst().id());                           // forget ids older than the window
    if (!seen.add(id)) return false;                                 // add returns false if already present
    order.addLast(new Seen(nowMs, id));
    return true;
  }
}
`}
${rs('deduplicator.rs')`
use std::collections::{HashSet, VecDeque};

struct Deduplicator {
    seen: HashSet<String>,
    order: VecDeque<(u64, String)>,      // (time in ms, id), oldest first
    window_ms: u64,
}

impl Deduplicator {
    fn new(window_ms: u64) -> Self {
        Deduplicator { seen: HashSet::new(), order: VecDeque::new(), window_ms }
    }

    /// True the first time an id arrives within the window; false for a redelivery. Times must not decrease.
    fn first_time(&mut self, id: &str, now_ms: u64) -> bool {
        while self.order.front().is_some_and(|&(t, _)| t + self.window_ms <= now_ms) {
            if let Some((_, old)) = self.order.pop_front() { self.seen.remove(&old); }   // forget expired ids
        }
        if !self.seen.insert(id.to_owned()) { return false; }   // insert returns false if already present
        self.order.push_back((now_ms, id.to_owned()));
        true
    }
}
`}
<p>When the set of IDs is too large for memory and lives in a database, a Bloom filter in front of it saves most of the lookups: "definitely not seen", the common case, lets a message through at once. Never drop a message on the filter's "maybe" alone, because a false positive would silently lose a real payment; check the exact store.</p>

<h2>Consistent hashing</h2>
<p>When data is spread across N servers with <code>hash(key) mod N</code>, adding or removing one server changes almost every key's server and forces a massive reshuffle. <strong>Consistent hashing</strong> places both servers and keys on a circle of hash values and assigns each key to the next server clockwise. Adding a server only moves the keys between it and its predecessor, about 1/N of them. Each physical server is usually given many "virtual" positions on the circle to even out the load. Distributed caches and Dynamo-style databases such as Cassandra use this idea.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>A hashCode that returns a constant</strong>, or one that ignores most fields. Every key lands in one bucket and the map becomes a list.</li>
<li><strong>Overriding equals without hashCode.</strong> Equal keys end up in different buckets.</li>
<li><strong>Mutating a key after inserting it.</strong> Its hash changes and the entry is lost.</li>
<li><strong><code>Math.abs(h) % m</code></strong> for negative hash codes. Use <code>Math.floorMod</code> or a bit mask.</li>
<li><strong>Deleting from an open-addressing table by emptying the slot.</strong> Use tombstones.</li>
<li><strong>Storing passwords with SHA-256</strong>, or any fast hash. Use Argon2id with a salt.</li>
<li><strong>Checking an idempotency key and then inserting it in two steps.</strong> Two concurrent retries can both pass the check. Claim the key atomically.</li>
<li><strong>Swapping in a fast unkeyed hasher</strong> in Rust for keys that come from outside, which brings hash flooding back.</li>
</ul></div>

CH.push({
  id: 'ch15', n: 15, title: 'String Algorithms',
  lede: 'Strings are sequences of characters, and the central question about them is where a pattern occurs inside a text. The naive answer compares the pattern at every position. Smarter algorithms reuse what earlier comparisons revealed, use hashing to skip most positions, or preprocess the text into tries and suffix arrays that answer queries in time proportional to the pattern alone.',
  html: `
<h2>Strings in Java</h2>
<p>A Java <code>String</code> is an immutable sequence of UTF-16 code units. Two facts follow that affect every algorithm in this chapter.</p>
<ul>
<li><strong>Concatenation creates a new string.</strong> <code>s = s + c</code> in a loop copies the whole string each time, which makes building a string of n characters O(n²). Use a <code>StringBuilder</code>, which appends in amortized O(1).</li>
<li><strong>Substrings are copies.</strong> <code>substring</code> costs O(length) time and memory. In hot loops, work with indices into the original string or with a <code>char[]</code>.</li>
</ul>
${code('Common building blocks')`
StringBuilder sb = new StringBuilder();
for (int i = 0; i < 5; i++) sb.append(i).append(',');   // amortized O(1) per append
String csv = sb.toString();

char[] cs = "racecar".toCharArray();     // mutable copy, fast indexed access
int[] freq = new int[26];
for (char c : cs) freq[c - 'a']++;       // counting letters: O(n)

boolean same = "abc".equals(other);      // compare contents; == compares references`}
${rs('building_blocks.rs')`
use std::fmt::Write;

let mut csv = String::new();
for i in 0..5 { write!(csv, "{i},").unwrap(); }     // appends in place: amortized O(1) per byte
let csv = csv + "end";                               // + takes csv by value and reuses its buffer

let bytes = "racecar".as_bytes();                    // a borrowed view, no copy; O(1) indexing
let mut freq = [0usize; 26];
for &b in bytes { freq[usize::from(b - b'a')] += 1; }   // counting letters: O(n)

let same = "abc" == other;                           // == compares contents in Rust
`}
<p>Many string problems on lowercase letters use a <code>new int[26]</code> count array as a tiny, fast hash table. For general Unicode text, use a <code>HashMap&lt;Character, Integer&gt;</code> or work with code points.</p>
<p>Rust strings differ in ways that matter here. A <code>String</code> or <code>&amp;str</code> is UTF-8, so there is no <code>s[i]</code>; slicing with <code>&amp;s[a..b]</code> borrows without copying, but panics unless both ends fall on character boundaries. <code>s + "x"</code> takes the left string by value and appends in place, so building a string with <code>+</code> or <code>push_str</code> in a loop is linear, not quadratic. Most Rust listings below work on <code>&amp;[u8]</code> (from <code>s.as_bytes()</code>), which suits ASCII text and identifiers. They are also correct on UTF-8 text: UTF-8 is designed so that one character's encoding never appears inside another's, so a byte-level match of a UTF-8 pattern always starts and ends on character boundaries.</p>

<h2>Pattern matching</h2>
<p>The problem: given a <strong>text</strong> T of length n and a <strong>pattern</strong> P of length m, find every position where P occurs in T. Text editors, <code>grep</code>, intrusion detection systems scanning packets for attack signatures, data-loss-prevention tools scanning documents for card numbers, and DNA sequence search all solve this problem at enormous scale.</p>
<h3>The naive algorithm</h3>
<p>Try every alignment. Place the pattern at shift s = 0, 1, …, n − m, and compare characters from left to right until one differs or the whole pattern matches.</p>
${fig('naive', '<b>Figure 15.1</b> Naive matching. After each mismatch the pattern moves one place right and all knowledge from the comparisons so far is thrown away.')}
${code('Naive matching')`
static List<Integer> naive(String t, String p) {
  List<Integer> hits = new ArrayList<>();
  int n = t.length(), m = p.length();
  for (int s = 0; s <= n - m; s++) {
    int j = 0;
    while (j < m && t.charAt(s + j) == p.charAt(j)) j++;
    if (j == m) hits.add(s);
  }
  return hits;
}`}
${rs('naive.rs')`
fn naive(t: &[u8], p: &[u8]) -> Vec<usize> {
    if p.len() > t.len() { return Vec::new(); }
    (0..=t.len() - p.len())
        .filter(|&s| t[s..s + p.len()] == *p)      // compares left to right, stops at a mismatch
        .collect()
}
`}
<p>In the worst case, such as text "AAAA…A" and pattern "AAA…AB", nearly every alignment compares almost the whole pattern, so the cost is O(n · m). On typical text, mismatches happen quickly and the naive method is fast, which is why Java's <code>String.indexOf</code> uses it: it scans for the first character, compares the rest, and HotSpot can replace the loop with a vectorised intrinsic. Rust's <code>str::find</code> uses the Two-Way algorithm instead, which is linear in the worst case and needs only constant extra memory. The algorithms below guarantee good performance on every input.</p>

<h2>Rabin-Karp: matching by hashing</h2>
<p>Rabin-Karp compares hashes instead of characters. Compute the hash of the pattern once. Then compute the hash of each window of m characters in the text; only when a window's hash equals the pattern's hash do you compare the characters.</p>
<p>The trick that makes this fast is a <strong>rolling hash</strong>. Treat a window as an m-digit number in base b, reduced modulo a prime q. Sliding the window one place to the right removes the leading digit and appends a new trailing digit, which updates the hash in O(1):</p>
<div class="formula">hash(next) = ( (hash(current) − t[s]·b^(m−1)) · b + t[s+m] )  mod q</div>
${fig('rk', '<b>Figure 15.2</b> Rabin-Karp with base 10 and modulus 13. Only windows whose hash equals 7 are checked character by character; 67399 is a spurious hit.')}
${code('RabinKarp.java')`
static List<Integer> rabinKarp(String t, String p) {
  final long B = 256, Q = 1_000_000_007L;
  int n = t.length(), m = p.length();
  List<Integer> hits = new ArrayList<>();
  if (m > n) return hits;
  long hp = 0, ht = 0, pow = 1;                 // pow = B^(m-1) mod Q
  for (int i = 0; i < m; i++) {
    hp = (hp * B + p.charAt(i)) % Q;
    ht = (ht * B + t.charAt(i)) % Q;
    if (i < m - 1) pow = pow * B % Q;
  }
  for (int s = 0; ; s++) {
    if (hp == ht && t.regionMatches(s, p, 0, m)) hits.add(s);       // verify to rule out collisions
    if (s + m >= n) break;
    ht = (ht - t.charAt(s) * pow % Q + Q) % Q;                       // remove the leading character
    ht = (ht * B + t.charAt(s + m)) % Q;                             // append the next character
  }
  return hits;
}`}
${rs('rabin_karp.rs')`
fn rabin_karp(t: &[u8], p: &[u8]) -> Vec<usize> {
    const B: u64 = 256;
    const Q: u64 = 1_000_000_007;
    let (n, m) = (t.len(), p.len());
    let mut hits = Vec::new();
    if m == 0 || m > n { return hits; }
    let hash = |w: &[u8]| w.iter().fold(0, |h, &c| (h * B + u64::from(c)) % Q);
    let pow = (1..m).fold(1, |acc, _| acc * B % Q);           // B^(m-1) mod Q
    let (hp, mut ht) = (hash(p), hash(&t[..m]));
    for s in 0..=n - m {
        if hp == ht && t[s..s + m] == *p { hits.push(s); }    // verify to rule out collisions
        if s + m < n {
            ht = (ht + Q - u64::from(t[s]) * pow % Q) % Q;    // remove the leading byte (+ Q: no underflow)
            ht = (ht * B + u64::from(t[s + m])) % Q;          // append the next byte
        }
    }
    hits
}
`}
<p>The expected time is O(n + m). The worst case is still O(n · m) if almost every window collides, which a large random prime makes very unlikely. Rabin-Karp's real strength is searching for <em>many</em> patterns of the same length at once: put all the pattern hashes in a hash set and check each window's hash against the set. Plagiarism detectors and deduplication systems use rolling hashes to find shared chunks between documents.</p>

<h2>Knuth-Morris-Pratt</h2>
<p>When the naive algorithm finds a mismatch after matching j characters, it slides the pattern by one and rechecks text characters it has already seen. But those characters are known: they are the first j characters of the pattern itself. The Knuth-Morris-Pratt (KMP) algorithm uses that knowledge to slide the pattern as far as safely possible and never moves backwards in the text.</p>
<h3>The failure function</h3>
<p>For each position i in the pattern, compute <code>lps[i]</code>: the length of the longest proper prefix of P[0..i] that is also a suffix of P[0..i]. Such a prefix-suffix is called a <strong>border</strong>. If a mismatch happens after matching j characters, the last lps[j − 1] text characters already match the start of the pattern, so the pattern can continue from position lps[j − 1] without re-reading them.</p>
${fig('lps', '<b>Figure 15.3</b> Building the lps table for ABABCABAB. On a mismatch, len falls back through shorter borders instead of starting over.')}
${code('Building the lps table')`
static int[] lps(String p) {
  int[] lps = new int[p.length()];
  int len = 0;                                // length of the current border
  for (int i = 1; i < p.length(); ) {
    if (p.charAt(i) == p.charAt(len)) lps[i++] = ++len;   // extend the border
    else if (len > 0) len = lps[len - 1];                 // try the next shorter border
    else lps[i++] = 0;                                    // no border ends here
  }
  return lps;
}`}
${rs('lps.rs')`
fn lps(p: &[u8]) -> Vec<usize> {
    let mut lps = vec![0; p.len()];
    let (mut len, mut i) = (0, 1);                 // len: length of the current border
    while i < p.len() {
        if p[i] == p[len] { len += 1; lps[i] = len; i += 1; }   // extend the border
        else if len > 0 { len = lps[len - 1]; }                  // try the next shorter border
        else { lps[i] = 0; i += 1; }                             // no border ends here
    }
    lps
}
`}
<h3>Matching</h3>
${fig('kmp', '<b>Figure 15.4</b> KMP matching. At each mismatch the pattern jumps forward by an amount read from the lps table, and the text pointer never moves back.')}
${code('KMP search')`
static List<Integer> kmp(String t, String p) {
  int[] lps = lps(p);
  List<Integer> hits = new ArrayList<>();
  for (int i = 0, j = 0; i < t.length(); ) {
    if (t.charAt(i) == p.charAt(j)) {
      i++; j++;
      if (j == p.length()) { hits.add(i - j); j = lps[j - 1]; }   // found; keep going for overlaps
    } else if (j > 0) {
      j = lps[j - 1];                         // reuse what we know; i does not move
    } else {
      i++;
    }
  }
  return hits;
}`}
${rs('kmp.rs')`
fn kmp(t: &[u8], p: &[u8]) -> Vec<usize> {         // p must not be empty
    let lps = lps(p);
    let mut hits = Vec::new();
    let mut j = 0;                                  // characters of p matched so far
    for (i, &c) in t.iter().enumerate() {           // i only ever moves forward
        while j > 0 && c != p[j] { j = lps[j - 1]; }    // reuse what we know
        if c == p[j] { j += 1; }
        if j == p.len() { hits.push(i + 1 - j); j = lps[j - 1]; }   // found; keep going for overlaps
    }
    hits
}
`}
<p>Building the table is O(m) and matching is O(n), for O(n + m) total in the worst case. Because the text pointer only moves forward, KMP works on streams: it can scan data as it arrives from a network socket without buffering. The lps table is also useful on its own, for example to find the shortest period of a string or the longest prefix that is also a suffix.</p>

<h2>Boyer-Moore</h2>
<p>Boyer-Moore compares the pattern against the text from <em>right to left</em>. The payoff comes on a mismatch. If the mismatched text character does not occur in the pattern at all, no alignment that overlaps it can succeed, and the pattern can jump past it entirely: a shift of up to m characters from a single comparison. This is the <strong>bad character rule</strong>.</p>
${fig('bm', '<b>Figure 15.5</b> Boyer-Moore with the bad character rule. Most alignments are rejected after one comparison, and the pattern often jumps several places at once.')}
${code('Boyer-Moore (bad character rule)')`
static int boyerMoore(String t, String p) {
  int n = t.length(), m = p.length();
  int[] last = new int[65536];
  Arrays.fill(last, -1);
  for (int i = 0; i < m; i++) last[p.charAt(i)] = i;      // last position of each character
  int s = 0;
  while (s <= n - m) {
    int j = m - 1;
    while (j >= 0 && p.charAt(j) == t.charAt(s + j)) j--;
    if (j < 0) return s;                                   // full match
    s += Math.max(1, j - last[t.charAt(s + j)]);           // align the bad character, or jump past it
  }
  return -1;
}`}
${rs('boyer_moore.rs')`
fn boyer_moore(t: &[u8], p: &[u8]) -> Option<usize> {
    let (n, m) = (t.len(), p.len());
    let mut last = [None; 256];                    // last position of each byte value in p
    for (i, &b) in p.iter().enumerate() { last[usize::from(b)] = Some(i); }
    let mut s = 0;
    while s + m <= n {
        let mut j = m;                             // p[j..] already matches; compare from the right
        while j > 0 && p[j - 1] == t[s + j - 1] { j -= 1; }
        if j == 0 { return Some(s); }              // full match
        let bad = j - 1;                           // the mismatch is at p[bad]
        s += match last[usize::from(t[s + bad])] {
            Some(l) if l < bad => bad - l,         // line up the bad character
            Some(_) => 1,                          // its last occurrence is further right: move on
            None => bad + 1,                       // not in p at all: jump past it
        };
    }
    None
}
`}
<p>On natural language with a reasonably long pattern, Boyer-Moore reads only a fraction of the text, about n/m characters in good cases. That sublinear behaviour is why it and its simplified variant Horspool are used in tools like <code>grep</code>. The full algorithm adds a second rule (the good suffix rule) that guarantees O(n + m) in the worst case for finding the first occurrence; reporting every occurrence in linear time needs one more refinement, the Galil rule. Working on bytes, the Rust version needs a 256-entry table instead of the Java version's 65,536.</p>

<h2>The Z algorithm</h2>
<p>The <strong>Z array</strong> of a string S stores, for each position i, the length of the longest substring starting at i that matches a prefix of S. It can be computed in O(n) by maintaining the rightmost window [l, r] that matches a prefix. To find P in T, compute the Z array of P + "$" + T, where $ appears in neither; every position with Z value m is a match. It solves the same problems as KMP and some people find it easier to reason about.</p>

<h2>Tries</h2>
<p>All the algorithms so far preprocess the <em>pattern</em>. When you have a fixed set of many words and many queries, it pays to preprocess the <em>dictionary</em> instead. A <strong>trie</strong> (from re<em>trie</em>val, also called a prefix tree) stores strings by their characters: each edge is labelled with one character, each node represents the prefix spelled out by the path from the root, and nodes that complete a word are marked.</p>
${fig('trie', '<b>Figure 15.6</b> A trie holding car, card, care, cat, do and dog. Words that share a prefix share the path for it.')}
${code('Trie.java')`
public class Trie {
  private static class Node { Node[] next = new Node[26]; boolean isWord; int prefixCount; }
  private final Node root = new Node();

  public void insert(String w) {
    Node n = root;
    for (char c : w.toCharArray()) {
      int i = c - 'a';
      if (n.next[i] == null) n.next[i] = new Node();
      n = n.next[i];
      n.prefixCount++;                         // how many words pass through here
    }
    n.isWord = true;
  }
  private Node walk(String s) {
    Node n = root;
    for (char c : s.toCharArray()) { n = n.next[c - 'a']; if (n == null) return null; }
    return n;
  }
  public boolean contains(String w)      { Node n = walk(w); return n != null && n.isWord; }
  public boolean startsWith(String pre)  { return walk(pre) != null; }
  public int countPrefix(String pre)     { Node n = walk(pre); return n == null ? 0 : n.prefixCount; }

  /** All words with the given prefix, in alphabetical order. */
  public List<String> complete(String pre) {
    List<String> out = new ArrayList<>();
    Node n = walk(pre);
    if (n != null) collect(n, new StringBuilder(pre), out);
    return out;
  }
  private void collect(Node n, StringBuilder sb, List<String> out) {
    if (n.isWord) out.add(sb.toString());
    for (int i = 0; i < 26; i++) if (n.next[i] != null) {
      sb.append((char) ('a' + i)); collect(n.next[i], sb, out); sb.deleteCharAt(sb.length() - 1);
    }
  }
}`}
${rs('trie.rs')`
#[derive(Default)]
struct Node { next: [Option<Box<Node>>; 26], is_word: bool, prefix_count: usize }

// Lowercase a to z only, like the Java version.
#[derive(Default)]
pub struct Trie { root: Node }

impl Trie {
    pub fn insert(&mut self, w: &str) {
        let mut n = &mut self.root;
        for b in w.bytes() {
            n = n.next[usize::from(b - b'a')].get_or_insert_with(Box::default);
            n.prefix_count += 1;                       // how many words pass through here
        }
        n.is_word = true;
    }
    fn walk(&self, s: &str) -> Option<&Node> {
        s.bytes().try_fold(&self.root, |n, b| n.next[usize::from(b - b'a')].as_deref())
    }
    pub fn contains(&self, w: &str) -> bool { self.walk(w).is_some_and(|n| n.is_word) }
    pub fn starts_with(&self, pre: &str) -> bool { self.walk(pre).is_some() }
    pub fn count_prefix(&self, pre: &str) -> usize { self.walk(pre).map_or(0, |n| n.prefix_count) }

    /// All words with the given prefix, in alphabetical order.
    pub fn complete(&self, pre: &str) -> Vec<String> {
        let mut out = Vec::new();
        if let Some(n) = self.walk(pre) { collect(n, &mut pre.to_owned(), &mut out); }
        out
    }
}

fn collect(n: &Node, word: &mut String, out: &mut Vec<String>) {
    if n.is_word { out.push(word.clone()); }
    for (c, child) in (b'a'..=b'z').zip(&n.next) {
        if let Some(child) = child {
            word.push(char::from(c));
            collect(child, word, out);
            word.pop();
        }
    }
}
`}
<p>Insert and lookup cost O(L) for a word of length L, independent of how many words are stored. A trie also answers prefix questions that a hash set cannot: autocomplete, "how many words start with ca", longest common prefix, and lexicographic iteration. The cost is memory: a 26-slot array per node is wasteful for sparse tries, so large tries use a <code>HashMap</code> per node or compress chains of single-child nodes into one edge (a <strong>radix tree</strong>). IP routing tables use binary tries over address bits for longest-prefix matching. In Rust the child array <code>[Option&lt;Box&lt;Node&gt;&gt;; 26]</code> also costs 26 pointers per node: <code>Option&lt;Box&gt;</code> is the size of one pointer, with <code>None</code> stored as null.</p>
<h3>Aho-Corasick</h3>
<p>To search a text for many patterns at once, build a trie of the patterns and add KMP-style failure links between nodes. The resulting automaton, Aho-Corasick, reads the text once and reports every occurrence of every pattern. The screening section below builds it.</p>

<h2>Suffix arrays and suffix trees</h2>
<p>When the <em>text</em> is fixed and you will search it many times with different patterns, preprocess the text. A <strong>suffix array</strong> is the list of starting positions of all suffixes of the text, sorted alphabetically by suffix.</p>

<tr><td class="num">0</td><td class="num">5</td><td><code>a</code></td><td class="num">–</td></tr>
<tr><td class="num">1</td><td class="num">3</td><td><code>ana</code></td><td class="num">1</td></tr>
<tr><td class="num">2</td><td class="num">1</td><td><code>anana</code></td><td class="num">3</td></tr>
<tr><td class="num">3</td><td class="num">0</td><td><code>banana</code></td><td class="num">0</td></tr>
<tr><td class="num">4</td><td class="num">4</td><td><code>na</code></td><td class="num">0</td></tr>
<tr><td class="num">5</td><td class="num">2</td><td><code>nana</code></td><td class="num">2</td></tr>
</table></div>
<p>Every occurrence of a pattern is a prefix of some suffix, and in sorted order all the suffixes that start with the pattern are consecutive. So binary search on the suffix array finds all occurrences in O(m log n). The <strong>LCP array</strong> stores the length of the longest common prefix between neighbouring suffixes; its maximum gives the longest repeated substring (here "ana", length 3), and it supports many other queries.</p>
${code('Suffix array (simple construction)')`
// O(n² log n) because each comparison can cost O(n). Fine for learning and for small texts;
// production code uses O(n log n) prefix doubling or O(n) SA-IS.
static Integer[] suffixArray(String s) {
  Integer[] sa = new Integer[s.length()];
  for (int i = 0; i < sa.length; i++) sa[i] = i;
  Arrays.sort(sa, (a, b) -> s.substring(a).compareTo(s.substring(b)));
  return sa;
}`}
${rs('suffix_array.rs')`
// O(n log n) comparisons, each up to O(n): fine for learning and for small texts. Production
// code uses O(n log n) prefix doubling or O(n) SA-IS.
fn suffix_array(s: &[u8]) -> Vec<usize> {
    let mut sa: Vec<usize> = (0..s.len()).collect();
    sa.sort_unstable_by_key(|&i| &s[i..]);     // suffixes compared as borrowed slices: no copies
    sa
}
`}
<p>A <strong>suffix tree</strong> is a compressed trie of all suffixes. It can be built in O(n) (Ukkonen's algorithm) and answers a pattern query in O(m), plus many other questions such as the longest common substring of two strings. It uses a lot of memory, so suffix arrays with LCP arrays are usually preferred in practice. Genome search tools and full-text indexes are built on these structures.</p>

<h2>Applied: screening names against a sanctions list</h2>
<p>Payment systems must check the parties to each payment, and the free text that travels with it, against sanctions and watch lists. Chapter 1 showed that comparing every name with every list entry is far too slow at scale. The structures of this chapter make it fast, but only after a step that is easy to underestimate: <strong>normalisation</strong>. The list may say "Müller" while the payment says "MULLER" or "muller,". Both sides are first folded to one canonical form: decompose accented letters and drop the accents, lowercase, and turn punctuation and runs of spaces into single spaces.</p>
${code('Normalize.java')`
import java.text.Normalizer;
import java.util.Locale;

/** Folds a name to one canonical form before matching: "José  O'Neil-Smith" becomes "jose o neil smith". */
static String normalize(String name) {
  String s = Normalizer.normalize(name, Normalizer.Form.NFKD)   // é becomes e plus a combining accent
                       .replaceAll("\\p{M}", "");                // drop the accents
  return s.toLowerCase(Locale.ROOT)
          .replaceAll("[^\\p{L}\\p{N}]+", " ")                    // punctuation and runs of spaces: one space
          .strip();
}
`}
${rs('normalize.rs')`
// std has no Unicode normalisation; the unicode-normalization crate provides it.
use unicode_normalization::{UnicodeNormalization, char::is_combining_mark};

/// Folds a name to one canonical form before matching: "José  O'Neil-Smith" becomes "jose o neil smith".
fn normalize(name: &str) -> String {
    let folded: String = name.nfkd()                          // é becomes e plus a combining accent
        .filter(|&c| !is_combining_mark(c))                   // drop the accents
        .flat_map(char::to_lowercase)
        .map(|c| if c.is_alphanumeric() { c } else { ' ' })   // punctuation becomes a space
        .collect();
    folded.split_whitespace().collect::<Vec<_>>().join(" ")   // runs of spaces become one
}
`}
<p>This deals with accents, case and punctuation. Spelling conventions such as "ue" for "ü", transliteration from other scripts, honorifics and word order need further rules or lists of known variants, built on the same idea: map every spelling to a canonical key before comparing.</p>
<h3>Many names at once: Aho-Corasick</h3>
<p>To find any of thousands of list names inside a payment's free-text field, build a trie of the normalised names and give every node a <strong>failure link</strong> to the node for the longest proper suffix of its string that is also in the trie: the many-pattern version of KMP's lps table. While scanning, a character with no edge from the current node follows failure links until some node has that edge, so the text pointer never moves back. Each node also records the patterns that end there, including shorter ones reached through failure links: a text that contains "she" also contains "he".</p>
${fig('aho', '<b>Figure 15.7</b> Aho-Corasick for he, she, his and hers scanning "ushers". At "r" the state "she" has no edge, so it falls back along its failure link to "he" and continues to "her" and "hers".')}
${code('AhoCorasick.java')`
import java.util.*;

public class AhoCorasick {
  public record Hit(int start, int end, String pattern) {}         // text[start, end) == pattern
  private final List<Map<Character, Integer>> next = new ArrayList<>();   // trie edges of each node
  private final List<Integer> fail = new ArrayList<>();
  private final List<List<Integer>> out = new ArrayList<>();      // patterns that end at each node
  private final String[] patterns;

  public AhoCorasick(String... patterns) {
    this.patterns = patterns;
    newNode();                                                     // node 0 is the root
    for (int p = 0; p < patterns.length; p++) {                    // 1. a trie of the patterns
      int n = 0;
      for (char c : patterns[p].toCharArray()) {
        Integer child = next.get(n).get(c);
        if (child == null) { child = newNode(); next.get(n).put(c, child); }
        n = child;
      }
      out.get(n).add(p);
    }
    ArrayDeque<Integer> q = new ArrayDeque<>(next.get(0).values()); // 2. failure links, breadth first;
    while (!q.isEmpty()) {                                         //    depth-1 nodes fail to the root
      int n = q.poll();
      for (Map.Entry<Character, Integer> e : next.get(n).entrySet()) {
        char c = e.getKey(); int child = e.getValue();
        int f = fail.get(n);
        while (f != 0 && !next.get(f).containsKey(c)) f = fail.get(f);
        int target = next.get(f).getOrDefault(c, 0);              // longest proper suffix that is in the trie
        fail.set(child, target);
        out.get(child).addAll(out.get(target));                    // shorter patterns that end here too
        q.add(child);
      }
    }
  }
  private int newNode() { next.add(new HashMap<>()); fail.add(0); out.add(new ArrayList<>()); return next.size() - 1; }

  /** Every occurrence of every pattern, in one left-to-right pass over the text. */
  public List<Hit> search(String text) {
    List<Hit> hits = new ArrayList<>();
    int n = 0;
    for (int i = 0; i < text.length(); i++) {
      char c = text.charAt(i);
      while (n != 0 && !next.get(n).containsKey(c)) n = fail.get(n);   // fall back, as KMP does
      n = next.get(n).getOrDefault(c, 0);
      for (int p : out.get(n)) hits.add(new Hit(i + 1 - patterns[p].length(), i + 1, patterns[p]));
    }
    return hits;
  }

  /** Only hits that are whole words of a normalised text (words separated by single spaces). */
  public List<Hit> searchWords(String text) {
    return search(text).stream()
        .filter(h -> (h.start() == 0 || text.charAt(h.start() - 1) == ' ')
                  && (h.end() == text.length() || text.charAt(h.end()) == ' '))
        .toList();
  }
}
`}
${rs('aho_corasick.rs')`
use std::collections::{BTreeMap, VecDeque};

#[derive(Default)]
struct AcNode { next: BTreeMap<u8, usize>, fail: usize, out: Vec<usize> }   // out: patterns ending here

pub struct AhoCorasick { nodes: Vec<AcNode>, lens: Vec<usize> }   // nodes link by index; 0 is the root

impl AhoCorasick {
    pub fn new(patterns: &[&str]) -> Self {
        let mut nodes = vec![AcNode::default()];
        for (p, pat) in patterns.iter().enumerate() {           // 1. a trie of the patterns
            let mut n = 0;
            for &b in pat.as_bytes() {
                n = match nodes[n].next.get(&b) {
                    Some(&child) => child,
                    None => {
                        nodes.push(AcNode::default());
                        let child = nodes.len() - 1;
                        nodes[n].next.insert(b, child);
                        child
                    }
                };
            }
            nodes[n].out.push(p);
        }
        let mut q: VecDeque<usize> = nodes[0].next.values().copied().collect();
        while let Some(n) = q.pop_front() {                     // 2. failure links, breadth first;
            let edges: Vec<(u8, usize)> = nodes[n].next.iter().map(|(&b, &c)| (b, c)).collect();
            for (b, child) in edges {                           //    depth-1 nodes keep fail = root
                let mut f = nodes[n].fail;
                while f != 0 && !nodes[f].next.contains_key(&b) { f = nodes[f].fail; }
                let target = nodes[f].next.get(&b).copied().unwrap_or(0);
                nodes[child].fail = target;                     // longest proper suffix in the trie
                let inherited = nodes[target].out.clone();      // shorter patterns that end here too
                nodes[child].out.extend(inherited);
                q.push_back(child);
            }
        }
        AhoCorasick { nodes, lens: patterns.iter().map(|p| p.len()).collect() }
    }

    /// Every occurrence as (start, end, pattern index), text[start..end] == pattern, in one pass.
    pub fn search(&self, text: &str) -> Vec<(usize, usize, usize)> {
        let mut hits = Vec::new();
        let mut n = 0;
        for (i, &b) in text.as_bytes().iter().enumerate() {
            while n != 0 && !self.nodes[n].next.contains_key(&b) { n = self.nodes[n].fail; }   // fall back
            n = self.nodes[n].next.get(&b).copied().unwrap_or(0);
            hits.extend(self.nodes[n].out.iter().map(|&p| (i + 1 - self.lens[p], i + 1, p)));
        }
        hits
    }

    /// Only hits that are whole words of a normalised text (words separated by single spaces).
    pub fn search_words(&self, text: &str) -> Vec<(usize, usize, usize)> {
        let t = text.as_bytes();
        self.search(text).into_iter()
            .filter(|&(s, e, _)| (s == 0 || t[s - 1] == b' ') && (e == t.len() || t[e] == b' '))
            .collect()
    }
}
`}
<p>Building the automaton costs O(total pattern length) (times the alphabet when node edges are arrays), and a search costs O(n + number of matches): every failure step moves the state to a shallower node, and the depth grows by at most one per character, as in the KMP analysis. Antivirus scanners and network intrusion detection systems match thousands of signatures this way, and in Rust the aho-corasick crate provides a heavily optimised version that the regex crate builds on. A raw hit inside a longer word is usually noise ("petro" inside "petrov"), so screening keeps only hits that start and end at word boundaries, which <code>searchWords</code> does on normalised text.</p>
<h3>Near misses: edit distance on a trie</h3>
<p>Exact matching misses typing errors and variant spellings such as "Petrof" for "Petrov". The usual measure is the Levenshtein distance from Chapter 19, the number of single-character insertions, deletions and substitutions between two strings, and a typical rule flags a name within k edits of a list name, with k growing with the length of the name. Computing the distance to every list entry separately repeats the work for every shared prefix. Instead, walk the trie of list names and carry one row of the edit-distance table down the walk: the row for a node is computed from its parent's row in O(m) for a query of length m, so a prefix shared by a thousand names is processed once. And if every value in a row exceeds k, no word below that node can come back within k, so the whole subtree is skipped.</p>
${code('Fuzzy search on the trie')`
// Added to the Trie class above. row[j] is the edit distance between the word spelled so far
// and the first j characters of q: one row of the Chapter 19 table, extended as the walk goes down.
public record Near(String word, int edits) {}

/** Every stored word within maxEdits of q (Levenshtein distance), in one walk of the trie. */
public List<Near> fuzzy(String q, int maxEdits) {
  List<Near> out = new ArrayList<>();
  int[] row = new int[q.length() + 1];
  for (int j = 0; j <= q.length(); j++) row[j] = j;              // from "" to each prefix of q
  walkFuzzy(root, new StringBuilder(), q, row, maxEdits, out);
  return out;
}
private void walkFuzzy(Node n, StringBuilder word, String q, int[] row, int k, List<Near> out) {
  if (n.isWord && row[q.length()] <= k) out.add(new Near(word.toString(), row[q.length()]));
  if (Arrays.stream(row).min().getAsInt() > k) return;           // no extension can get back to k: prune
  for (int i = 0; i < 26; i++) {
    if (n.next[i] == null) continue;
    char c = (char) ('a' + i);
    int[] next = new int[row.length];
    next[0] = row[0] + 1;
    for (int j = 1; j < row.length; j++)
      next[j] = Math.min(row[j - 1] + (q.charAt(j - 1) == c ? 0 : 1),   // match or substitute
                Math.min(row[j] + 1, next[j - 1] + 1));               // delete, insert
    word.append(c);
    walkFuzzy(n.next[i], word, q, next, k, out);
    word.deleteCharAt(word.length() - 1);
  }
}
`}
${rs('fuzzy.rs')`
// A second impl block for the Trie above.
impl Trie {
    /// Every stored word within max_edits of q (Levenshtein distance), as (word, edits).
    pub fn fuzzy(&self, q: &str, max_edits: usize) -> Vec<(String, usize)> {
        let row: Vec<usize> = (0..=q.len()).collect();         // from "" to each prefix of q
        let mut out = Vec::new();
        walk_fuzzy(&self.root, &mut String::new(), q.as_bytes(), &row, max_edits, &mut out);
        out
    }
}

// row[j]: edit distance between the word spelled so far and q[..j]. One row of the Chapter 19
// table, extended as the walk goes down.
fn walk_fuzzy(n: &Node, word: &mut String, q: &[u8], row: &[usize], k: usize, out: &mut Vec<(String, usize)>) {
    if n.is_word && row[q.len()] <= k { out.push((word.clone(), row[q.len()])); }
    if row.iter().all(|&d| d > k) { return; }                  // no extension can get back to k: prune
    for (c, child) in (b'a'..=b'z').zip(&n.next) {
        let Some(child) = child else { continue };
        let mut next = vec![row[0] + 1; row.len()];
        for j in 1..row.len() {
            let sub = row[j - 1] + usize::from(q[j - 1] != c);  // match or substitute
            next[j] = sub.min(row[j] + 1).min(next[j - 1] + 1);  // delete, insert
        }
        word.push(char::from(c));
        walk_fuzzy(child, word, q, &next, k, out);
        word.pop();
    }
}
`}
<p>The cost is O(m) per trie node visited, and with a small k the pruning leaves most of the trie unvisited. Full names are usually split into normalised tokens that are matched separately and then scored together. Production screening combines all of these: normalisation, exact token lookups in a hash set, Aho-Corasick over free text, and near-miss scoring with edit distance or measures such as Jaro-Winkler, which weighs agreement at the start of a name more heavily. The threshold is a trade-off the compliance team owns: a looser one produces more false positives for analysts to clear, a tighter one risks missing a real match.</p>

<h2>Comparison</h2>
<div class="tbl"><table><tr><th>Algorithm</th><th>Preprocessing</th><th>Search, worst case</th><th>Notes</th></tr>
<tr><td>Naive</td><td>none</td><td class="num">O(n · m)</td><td>fast on typical text; <code>String.indexOf</code></td></tr>
<tr><td>Rabin-Karp</td><td class="num">O(m)</td><td class="num">O(n · m), O(n + m) expected</td><td>many patterns of equal length</td></tr>
<tr><td>KMP</td><td class="num">O(m)</td><td class="num">O(n + m)</td><td>never backs up in the text; streaming</td></tr>
<tr><td>Boyer-Moore</td><td class="num">O(m + alphabet)</td><td class="num">O(n + m) with both rules (first match)</td><td>often sublinear in practice</td></tr>
<tr><td>Z algorithm</td><td class="num">O(n + m)</td><td class="num">O(n + m)</td><td>prefix-matching array</td></tr>
<tr><td>Trie</td><td class="num">O(total length of words)</td><td class="num">O(L) per word</td><td>prefix queries, autocomplete</td></tr>
<tr><td>Aho-Corasick</td><td class="num">O(total pattern length)</td><td class="num">O(n + matches)</td><td>many patterns at once</td></tr>
<tr><td>Trie + edit-distance walk</td><td class="num">O(total length of words)</td><td class="num">O(m · nodes visited)</td><td>near-miss name matching</td></tr>
<tr><td>Suffix array + LCP</td><td class="num">O(n log n)</td><td class="num">O(m log n)</td><td>many queries on a fixed text</td></tr>
<tr><td>Suffix tree</td><td class="num">O(n)</td><td class="num">O(m)</td><td>powerful but memory-heavy</td></tr>
</table></div>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>String concatenation in loops.</strong> Use StringBuilder.</li>
<li><strong>Comparing strings with ==.</strong> Use <code>equals</code>.</li>
<li><strong>Rabin-Karp without verification.</strong> Equal hashes do not prove equal strings.</li>
<li><strong>Negative values after modular subtraction.</strong> Add the modulus before taking the remainder again.</li>
<li><strong>Screening without normalisation.</strong> "Müller", "MULLER" and "muller," are three different strings until they are folded to one form.</li>
<li><strong>Slicing a Rust string at a byte offset</strong> that is not a character boundary. It panics; work on bytes or use <code>char_indices</code>.</li>
<li><strong>Off-by-one in KMP fallbacks.</strong> After a mismatch with j &gt; 0, set j = lps[j − 1] and do not advance i.</li>
<li><strong>Trie memory blow-up.</strong> A 26- or 128-slot array per node multiplies quickly; use maps or compression for large dictionaries.</li>
</ul></div>
