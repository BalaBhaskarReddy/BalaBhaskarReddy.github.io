  html: `
<h2>The priority queue ADT</h2>
<p>A normal queue serves items in arrival order. A <strong>priority queue</strong> serves them in priority order. Each item has a key, and the queue always removes the item with the smallest key (a <strong>min-priority queue</strong>) or the largest key (a <strong>max-priority queue</strong>).</p>
<div class="tbl"><table><tr><th>Operation</th><th>Meaning</th></tr>
<tr><td><code>insert(x)</code></td><td>add an item</td></tr>
<tr><td><code>peekMin()</code></td><td>return the smallest item without removing it</td></tr>
<tr><td><code>removeMin()</code></td><td>remove and return the smallest item</td></tr>
<tr><td><code>size()</code>, <code>isEmpty()</code></td><td>inspect</td></tr>
</table></div>
<p>Priority queues are behind schedulers that run the most urgent job first, timer queues that fire the earliest timeout, simulations that process the next event in time order, and some of the most important graph algorithms (Dijkstra and Prim in Chapter 9). (Systems with very many timers often use a timing wheel instead: an array of time buckets, which trades exact ordering within a tick for O(1) inserts.) An exchange's order book behaves like a pair of priority queues, buyers ordered by highest bid and sellers by lowest ask, although a real one must also cancel orders quickly, so it is built on an ordered map of price levels instead (Chapter 6).</p>

<h2>Why simple structures fall short</h2>
<div class="tbl"><table><tr><th>Implementation</th><th>insert</th><th>removeMin</th><th>peekMin</th></tr>
<tr><td>Unsorted array</td><td class="num">O(1)</td><td class="num">O(n): scan for the minimum</td><td class="num">O(n)</td></tr>
<tr><td>Sorted array</td><td class="num">O(n): shift to make room</td><td class="num">O(1): take from the end</td><td class="num">O(1)</td></tr>
<tr><td>Balanced BST</td><td class="num">O(log n)</td><td class="num">O(log n)</td><td class="num">O(log n)</td></tr>
<tr><td><strong>Binary heap</strong></td><td class="num">O(log n)</td><td class="num">O(log n)</td><td class="num">O(1)</td></tr>
</table></div>
<p>The unsorted array is fast at one operation and slow at the other; the sorted array is the reverse. A balanced BST is good at both but keeps far more order than we need: it knows the exact rank of every element. A priority queue only ever asks for the minimum. The heap keeps just enough order to answer that one question, and in return it is simpler, smaller and faster than a BST.</p>

<h2>The binary heap</h2>
<p>A <strong>binary min-heap</strong> is a binary tree with two properties:</p>
<ol>
<li><strong>Shape property:</strong> it is a <em>complete</em> binary tree. Every level is full except possibly the last, which is filled from the left.</li>
<li><strong>Heap-order property:</strong> every node's key is less than or equal to the keys of its children.</li>
</ol>
<p>From the heap-order property, the smallest key must be at the root, so <code>peekMin</code> is O(1). Notice what the property does <em>not</em> say: there is no rule relating a left child to a right child, or a node to its cousins. A heap is only partially ordered.</p>
<h3>Storing a heap in an array</h3>
<p>Because the tree is complete, its nodes can be numbered level by level, left to right, with no gaps. Store node number i at array index i. Then the family relationships become arithmetic:</p>
<div class="formula">parent(i) = (i − 1) / 2        left(i) = 2i + 1        right(i) = 2i + 2</div>
${fig('heapmap', '<b>Figure 7.1</b> The same heap as a tree and as an array. The tree is only a way of picturing the array; no child references exist.')}
<p>No node objects, no references and no wasted space: the heap is just an array plus a size counter. That is why heaps are so fast in practice.</p>

<h2>Insert: sift up</h2>
<p>To insert, put the new key in the first free position, which is index <code>size</code>. The tree is still complete, but the new key might be smaller than its parent. Fix that by repeatedly swapping it with its parent until the parent is smaller or it reaches the root. This is called <strong>sift up</strong> (also swim or bubble up).</p>
${fig('siftup', '<b>Figure 7.2</b> Inserting 2. It starts at the bottom and swaps upward past every larger ancestor.')}
<p>Each swap moves the key up one level, and a complete tree with n nodes has height ⌊log₂n⌋, so insertion makes at most that many swaps: O(log n).</p>

<h2>Remove the minimum: sift down</h2>
<p>The minimum is at the root. Removing it leaves a hole at the top. Fill the hole with the <em>last</em> element in the array, which keeps the tree complete. That element is probably too large for the root, so <strong>sift it down</strong>: compare it with its two children and swap it with the smaller child, and repeat until neither child is smaller.</p>
${fig('siftdown', '<b>Figure 7.3</b> Removing the minimum. The last element moves to the root and sinks to its proper level.')}
<p>Why swap with the <em>smaller</em> child? After the swap, that child becomes the parent of the other child. Since it was the smaller of the two, the heap order between them is satisfied automatically.</p>
${code('MinHeap.java')`
import java.util.*;

public class MinHeap {
  private int[] a = new int[16];
  private int n = 0;

  public void add(int x) {
    if (n == a.length) a = Arrays.copyOf(a, 2 * n);
    a[n] = x;
    siftUp(n++);
  }
  public int peek() { if (n == 0) throw new NoSuchElementException(); return a[0]; }
  public int poll() {
    if (n == 0) throw new NoSuchElementException();
    int min = a[0];
    a[0] = a[--n];             // move the last element to the root
    siftDown(0);
    return min;
  }
  private void siftUp(int i) {
    while (i > 0) {
      int p = (i - 1) / 2;
      if (a[p] <= a[i]) break;
      swap(i, p); i = p;
    }
  }
  private void siftDown(int i) {
    while (true) {
      int l = 2 * i + 1, r = l + 1, c = i;
      if (l < n && a[l] < a[c]) c = l;
      if (r < n && a[r] < a[c]) c = r;
      if (c == i) return;      // both children are >= a[i]
      swap(i, c); i = c;
    }
  }
  private void swap(int i, int j) { int t = a[i]; a[i] = a[j]; a[j] = t; }
  public int size() { return n; }

  public static void main(String[] args) {
    MinHeap h = new MinHeap();
    for (int x : new int[]{5, 3, 8, 1, 9, 2}) h.add(x);
    StringBuilder sb = new StringBuilder();
    while (h.size() > 0) sb.append(h.poll()).append(' ');
    System.out.println(sb);    // 1 2 3 5 8 9
  }
}`}
${rs('min_heap.rs')`
// Generic over any ordered T. The array is a Vec, so growth is handled for us.
struct MinHeap<T: Ord> { a: Vec<T> }

impl<T: Ord> MinHeap<T> {
    fn new() -> Self { MinHeap { a: Vec::new() } }

    fn push(&mut self, x: T) {
        self.a.push(x);
        self.sift_up(self.a.len() - 1);
    }
    fn peek(&self) -> Option<&T> { self.a.first() }            // None when empty, instead of an exception
    fn pop(&mut self) -> Option<T> {
        if self.a.is_empty() { return None; }
        let min = self.a.swap_remove(0);                        // the last element moves to the root
        self.sift_down(0);
        Some(min)
    }
    fn sift_up(&mut self, mut i: usize) {
        while i > 0 {
            let p = (i - 1) / 2;
            if self.a[p] <= self.a[i] { break; }
            self.a.swap(i, p);
            i = p;
        }
    }
    fn sift_down(&mut self, mut i: usize) {
        let n = self.a.len();
        loop {
            let (l, r) = (2 * i + 1, 2 * i + 2);
            let mut c = i;
            if l < n && self.a[l] < self.a[c] { c = l; }
            if r < n && self.a[r] < self.a[c] { c = r; }
            if c == i { return; }                               // both children are >= a[i]
            self.a.swap(i, c);
            i = c;
        }
    }
    fn len(&self) -> usize { self.a.len() }
}

fn main() {
    let mut h = MinHeap::new();
    for x in [5, 3, 8, 1, 9, 2] { h.push(x); }
    assert_eq!(h.peek(), Some(&1));
    let out: Vec<String> = std::iter::from_fn(|| h.pop()).map(|x| x.to_string()).collect();
    println!("{}", out.join(" "));                              // 1 2 3 5 8 9
    assert_eq!(h.len(), 0);
}`}
<p>For a max-heap, flip every comparison. In Java you rarely need a separate class: use a comparator, as shown below. The Rust version is generic over any <code>T: Ord</code> and leans on two <code>Vec</code> methods: <code>swap</code>, and <code>swap_remove(0)</code>, which removes the root and moves the last element into its place in O(1), exactly the first step of a removal. <code>peek</code> and <code>pop</code> return <code>Option</code>, so an empty heap needs no exception.</p>

<h2>Building a heap in linear time</h2>
<p>To turn an arbitrary array into a heap, you could insert the elements one by one, costing O(n log n). There is a faster way called <strong>heapify</strong>. Every leaf is already a valid heap of one node. Starting at the last internal node and moving backwards to the root, sift each node down. When you reach node i, both of its subtrees are already heaps, so sifting i down makes its whole subtree a heap.</p>
${fig('heapify', '<b>Figure 7.4</b> Bottom-up heap construction. Each internal node sinks into the already-valid heaps beneath it.')}
<p>Why is this O(n) and not O(n log n)? Sifting a node down costs at most its height. In a complete tree, half the nodes are leaves (height 0, no work), a quarter have height 1, an eighth have height 2, and so on. The total is</p>
<div class="formula">n/4 · 1 + n/8 · 2 + n/16 · 3 + …  =  n · Σ k/2^(k+1)  =  n · 1  =  O(n)</div>
<p>Most of the nodes are near the bottom, where sifting is cheap. Only the root can travel the full height.</p>
${code('Heapify')`
static void heapify(int[] a) {
  int n = a.length;
  for (int i = n / 2 - 1; i >= 0; i--) siftDown(a, i, n);   // last internal node is n/2 - 1
}`}
${rs('heapify.rs')`
fn heapify<T: Ord>(a: &mut [T]) {
    let n = a.len();
    for i in (0..n / 2).rev() { sift_down(a, i, n); }   // last internal node is n/2 - 1
}
// The standard library does the same in BinaryHeap::from(vec): O(n), in place.`}

<p><code>java.util.PriorityQueue</code> is a binary heap backed by a resizable array. It is a min-heap by default.</p>

<h2>Heap patterns</h2>
<h3>Top k elements</h3>
<p>To find the k largest values in a stream of n values, keep a <em>min</em>-heap of size k. For each value, add it; if the heap grows beyond k, remove the minimum. The heap always holds the k largest values seen so far, and its root is the kth largest. This takes O(n log k) time and O(k) memory, which works even when the data does not fit in memory.</p>
${code('Top k')`
static List<Integer> topK(int[] nums, int k) {
  PriorityQueue<Integer> pq = new PriorityQueue<>();        // min-heap
  for (int x : nums) {
    pq.offer(x);
    if (pq.size() > k) pq.poll();                          // evict the smallest
  }
  return new ArrayList<>(pq);                              // the k largest, unordered
}`}
${rs('top_k.rs')`
fn top_k(nums: &[i32], k: usize) -> Vec<i32> {
    let mut pq = BinaryHeap::with_capacity(k + 1);    // a min-heap, through Reverse
    for &x in nums {
        pq.push(Reverse(x));
        if pq.len() > k { pq.pop(); }                 // evict the smallest
    }
    pq.into_iter().map(|Reverse(x)| x).collect()      // the k largest, unordered
}`}
<p>The choice of heap direction is counter-intuitive and worth remembering: <strong>the k largest use a min-heap</strong> (so you can evict the smallest of them), and the k smallest use a max-heap.</p>
<h3>Merging k sorted sequences</h3>
<p>To merge k sorted lists, put the first element of each list into a min-heap. Repeatedly remove the minimum, output it, and push the next element from the same list. With N elements in total, this costs O(N log k). External sorting, log merging and time-series joins all use this.</p>
${code('k-way merge')`
static List<Integer> mergeK(List<List<Integer>> lists) {
  // heap entries: {value, listIndex, positionInList}
  PriorityQueue<int[]> pq = new PriorityQueue<>(Comparator.comparingInt(e -> e[0]));
  for (int i = 0; i < lists.size(); i++)
    if (!lists.get(i).isEmpty()) pq.offer(new int[]{lists.get(i).get(0), i, 0});
  List<Integer> out = new ArrayList<>();
  while (!pq.isEmpty()) {
    int[] e = pq.poll();
    out.add(e[0]);
    int next = e[2] + 1;
    if (next < lists.get(e[1]).size()) pq.offer(new int[]{lists.get(e[1]).get(next), e[1], next});
  }
  return out;
}`}
${rs('merge_k.rs')`
fn merge_k(lists: &[Vec<i32>]) -> Vec<i32> {
    // heap entries: (value, list index, position in list), smallest first
    let mut pq: BinaryHeap<_> = lists.iter().enumerate()
        .filter_map(|(i, l)| l.first().map(|&v| Reverse((v, i, 0))))
        .collect();
    let mut out = Vec::new();
    while let Some(Reverse((v, i, pos))) = pq.pop() {
        out.push(v);
        if let Some(&next) = lists[i].get(pos + 1) { pq.push(Reverse((next, i, pos + 1))); }
    }
    out

<h3>Running median with two heaps</h3>
<p>To report the median of a growing stream, keep the smaller half of the values in a max-heap and the larger half in a min-heap, with sizes differing by at most one. The median is at the top of one or both heaps. Each insertion is O(log n). Chapter 12 develops this in detail.</p>
<h3>Scheduling and simulation</h3>
<p>Event-driven simulations keep future events in a min-heap keyed by time and repeatedly process the earliest. Task schedulers do the same with deadlines or priorities. <code>ScheduledThreadPoolExecutor</code> uses a heap of delayed tasks internally.</p>

<h2>Cancelling and changing priorities</h2>
<p>A binary heap answers one question fast: what is the minimum? It cannot find an arbitrary element, so removing one costs O(n), and changing an element's key in place breaks the heap without the heap noticing. Real systems need both. A payment that is scheduled for a retry may succeed through another channel, so its retry must be cancelled; a customer may ask for an earlier attempt, so its time must change. There are two standard answers.</p>
<h3>Lazy cancellation</h3>
<p>Leave the old entry in the heap and make it recognisably stale. Give every scheduled entry a version number and remember, in a hash map, the current version for each payment. Cancelling removes the payment from the map: O(1). Rescheduling pushes a new entry with a new version: O(log n). When an entry reaches the top, check it against the map and skip it if it is no longer current. Dijkstra's algorithm in Chapter 9 uses the same idea, with the distance itself acting as the version.</p>
${code('RetryScheduler.java')`
import java.util.*;

/** Payment retries due at given times. cancel is O(1): stale heap entries are skipped later. */
class RetryScheduler {
  private record Entry(long due, long version, String paymentId) {}
  private final PriorityQueue<Entry> heap = new PriorityQueue<>(
      Comparator.comparingLong(Entry::due).thenComparingLong(Entry::version));   // earliest first, then FIFO
  private final Map<String, Long> live = new HashMap<>();     // paymentId -> version of its current entry
  private long nextVersion = 0;

  void schedule(String paymentId, long due) {                 // also reschedules: the old entry goes stale
    long v = nextVersion++;
    live.put(paymentId, v);
    heap.offer(new Entry(due, v, paymentId));
  }

  void cancel(String paymentId) { live.remove(paymentId); }

  /** Removes and returns every payment due at or before now, earliest first. */
  List<String> due(long now) {
    List<String> out = new ArrayList<>();
    while (!heap.isEmpty() && heap.peek().due() <= now) {
      Entry e = heap.poll();
      Long v = live.get(e.paymentId());
      if (v != null && v == e.version()) {                    // skip stale entries
        live.remove(e.paymentId());
        out.add(e.paymentId());
      }
    }
    return out;
  }
}`}
${rs('retry_scheduler.rs')`
// Payment retries due at given times. cancel is O(1): stale heap entries are skipped later.
#[derive(Default)]
struct RetryScheduler {
    heap: BinaryHeap<Reverse<(u64, u64, String)>>,  // (due, version, payment id): earliest first, then FIFO
    live: HashMap<String, u64>,                     // payment id -> version of its current entry
    next_version: u64,
}

impl RetryScheduler {
    fn schedule(&mut self, payment_id: &str, due: u64) {   // also reschedules: the old entry goes stale
        let v = self.next_version;
        self.next_version += 1;
        self.live.insert(payment_id.to_string(), v);
        self.heap.push(Reverse((due, v, payment_id.to_string())));
    }

    fn cancel(&mut self, payment_id: &str) { self.live.remove(payment_id); }

    // Removes and returns every payment due at or before now, earliest first.
    fn due(&mut self, now: u64) -> Vec<String> {
        let mut out = Vec::new();
        while let Some(top) = self.heap.peek_mut() && top.0.0 <= now {
            let Reverse((_, v, id)) = PeekMut::pop(top);
            if self.live.get(&id) == Some(&v) {            // skip stale entries
                self.live.remove(&id);
                out.push(id);
            }
        }
        out
    }
}`}
<p>For example, schedule p1 at 100, p2 at 50 and p3 at 70, then reschedule p2 to 120 and cancel p3. <code>due(100)</code> pops p2's old entry (stale, skipped), p3 (cancelled, skipped) and p1 (returned), so it returns [p1]; <code>due(200)</code> returns [p2]. Each stale entry is popped once, so its cost is paid once. The cost of laziness is memory: if cancellations are frequent, stale entries can outnumber live ones. A common rule is to rebuild the heap from the live entries, in O(n), whenever the stale entries exceed half of it. The version also breaks ties, so payments due at the same time come out in the order they were scheduled, which makes runs reproducible.</p>
<h3>An indexed heap with decrease-key</h3>
<p>When items are numbered 0 to n − 1 (vertices of a graph, slots of a table), the heap can keep a second array <code>pos</code> that records where each item currently sits in the heap. Every swap updates both arrays, so the heap can find any item in O(1), and changing its key is a sift up or sift down from that position: O(log n). This is the <strong>indexed priority queue</strong>. It keeps at most one entry per item, so the heap never grows beyond n.</p>
${code('IndexMinPQ.java')`
import java.util.*;

/** A min-priority queue of items 0..n-1, each with a key; decreaseKey is O(log n). */
class IndexMinPQ {
  private final int[] heap;     // heap[k] = the item at heap position k
  private final int[] pos;      // pos[item] = its heap position, or -1 if absent
  private final long[] key;     // key[item]
  private int size;

  IndexMinPQ(int n) { heap = new int[n]; pos = new int[n]; key = new long[n]; Arrays.fill(pos, -1); }

  boolean contains(int item) { return pos[item] != -1; }
  boolean isEmpty() { return size == 0; }

  void insert(int item, long k) {
    if (contains(item)) throw new IllegalArgumentException("item already present");
    key[item] = k; heap[size] = item; pos[item] = size;
    siftUp(size++);
  }
  void decreaseKey(int item, long k) {
    if (!contains(item)) throw new NoSuchElementException("item not present");
    if (k > key[item]) throw new IllegalArgumentException("key would increase");
    key[item] = k;
    siftUp(pos[item]);          // a smaller key can only move up
  }
  int pollMin() {
    if (size == 0) throw new NoSuchElementException();
    int min = heap[0];
    swap(0, --size);
    pos[min] = -1;
    siftDown(0);
    return min;
  }
  private void siftUp(int i) {
    while (i > 0 && key[heap[(i - 1) / 2]] > key[heap[i]]) { swap(i, (i - 1) / 2); i = (i - 1) / 2; }
  }
  private void siftDown(int i) {
    while (true) {
      int l = 2 * i + 1, r = l + 1, c = i;
      if (l < size && key[heap[l]] < key[heap[c]]) c = l;
      if (r < size && key[heap[r]] < key[heap[c]]) c = r;
      if (c == i) return;
      swap(i, c); i = c;
    }
  }
  private void swap(int i, int j) {
    int t = heap[i]; heap[i] = heap[j]; heap[j] = t;
    pos[heap[i]] = i; pos[heap[j]] = j;      // keep the index in step with the heap
  }
}`}
${rs('index_min_pq.rs')`
// A min-priority queue of items 0..n-1, each with a key; decrease_key is O(log n).
struct IndexMinPq<K> {
    heap: Vec<(K, usize)>,              // (key, item), heap-ordered by key
    pos: Vec<Option<usize>>,            // pos[item] = its place in heap, or None if absent
}

impl<K: Ord> IndexMinPq<K> {
    fn new(n: usize) -> Self { IndexMinPq { heap: Vec::with_capacity(n), pos: vec![None; n] } }
    fn contains(&self, item: usize) -> bool { self.pos[item].is_some() }

    fn insert(&mut self, item: usize, key: K) {
        assert!(!self.contains(item), "item already present");
        self.heap.push((key, item));
        let i = self.heap.len() - 1;
        self.pos[item] = Some(i);
        self.sift_up(i);
    }
    fn decrease_key(&mut self, item: usize, key: K) {
        let i = self.pos[item].expect("item not present");
        assert!(key <= self.heap[i].0, "key would increase");
        self.heap[i].0 = key;
        self.sift_up(i);                // a smaller key can only move up
    }
    fn pop_min(&mut self) -> Option<(usize, K)> {
        let last = self.heap.len().checked_sub(1)?;     // None when empty
        self.swap(0, last);
        let (key, item) = self.heap.pop()?;
        self.pos[item] = None;
        self.sift_down(0);
        Some((item, key))
    }
    fn sift_up(&mut self, mut i: usize) {
        while i > 0 && self.heap[(i - 1) / 2].0 > self.heap[i].0 {
            self.swap(i, (i - 1) / 2);
            i = (i - 1) / 2;
        }
    }
    fn sift_down(&mut self, mut i: usize) {
        let n = self.heap.len();
        loop {
            let (l, r) = (2 * i + 1, 2 * i + 2);
            let mut c = i;
            if l < n && self.heap[l].0 < self.heap[c].0 { c = l; }
            if r < n && self.heap[r].0 < self.heap[c].0 { c = r; }
            if c == i { return; }
            self.swap(i, c);
            i = c;
        }
    }
    fn swap(&mut self, i: usize, j: usize) {
        self.heap.swap(i, j);
        self.pos[self.heap[i].1] = Some(i);     // keep the index in step with the heap
        self.pos[self.heap[j].1] = Some(j);
    }
}`}
<p>Inserting items 0 to 4 with keys 50, 40, 30, 20, 10, then lowering item 0 to 5 and item 2 to 15, pops the items in the order 0, 4, 2, 3, 1. The essential line is in <code>swap</code>: whenever two items change places in the heap, their entries in <code>pos</code> change too. Forgetting one of those updates is the classic bug. In the Rust version the heap stores <code>(key, item)</code> pairs and <code>pos</code> holds <code>Option&lt;usize&gt;</code>, so "absent" is a value of its own rather than −1.</p>
<p>Which to choose? Lazy cancellation works with the standard library heap, needs no item numbering and is usually fast enough. The indexed heap bounds memory at n entries and suits algorithms that update keys constantly, such as Dijkstra and Prim on dense graphs.</p>

<h2>Heapsort</h2>
<p>A heap gives a sorting algorithm almost for free. Build a max-heap in O(n), then repeatedly swap the root (the maximum) with the last element of the heap, shrink the heap by one, and sift the new root down. Each of the n removals costs O(log n), so heapsort is O(n log n) in the worst case and uses O(1) extra space. Chapter 10 compares it with the other sorts.</p>

<h2>Beyond the binary heap</h2>
<ul>
<li>A <strong>d-ary heap</strong> gives each node d children. It is shallower (height log_d n), which speeds up sift up, at the cost of more comparisons per sift down level.</li>
<li>An <strong>indexed priority queue</strong>, shown above, also keeps a map from item to array position, so it can change an item's priority in O(log n). Dijkstra's algorithm can use one for its decrease-key operation.</li>
<li><strong>Binomial</strong> and <strong>Fibonacci heaps</strong> support fast merging and, for Fibonacci heaps, O(1) amortized decrease-key. They matter in theory; binary heaps usually win in practice.</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Using the wrong heap direction for top-k.</strong> k largest means a min-heap of size k.</li>
<li><strong>Comparators that subtract.</strong> <code>(a, b) -&gt; a - b</code> overflows for large values. Use <code>Integer.compare</code> or <code>Comparator.comparingInt</code>. In Rust, use <code>a.cmp(&amp;b)</code>.</li>
<li><strong>Forgetting that Rust's <code>BinaryHeap</code> is a max-heap.</strong> Wrap keys in <code>Reverse</code> for a min-heap, and check which end a derived <code>Ord</code> puts first.</li>
<li><strong>Mutating an element after inserting it.</strong> The heap does not notice and its order breaks. Remove, change, and reinsert instead.</li>
<li><strong>Expecting sorted iteration.</strong> Only <code>poll</code> returns elements in order.</li>
<li><strong>Calling <code>contains</code> or <code>remove(Object)</code> in a loop.</strong> Each is O(n).</li>
</ul></div>

CH.push({
  id: 'ch08', n: 8, title: 'Disjoint Sets',
  lede: 'A disjoint-set structure, usually called union-find, tracks how a collection of items is split into groups, and lets you merge groups and ask whether two items share a group. With two small tricks, both operations run in time so close to constant that the difference never matters in practice.',
  html: `
<h2>The problem</h2>
<p>Imagine a fraud team receiving a stream of facts: account A and account B logged in from the same device; account B and account C used the same card; account D and account E share a phone number. After each fact, the team wants to know whether two accounts are linked, directly or through a chain. The groups only ever merge, never split.</p>
<p>The same problem appears in many forms: which computers in a network can reach each other, which pixels belong to the same region of an image, which variables a compiler has proved equal, which edges would create a cycle in a graph. The <strong>disjoint-set</strong> ADT handles all of them.</p>
<div class="tbl"><table><tr><th>Operation</th><th>Meaning</th></tr>
<tr><td><code>makeSet(x)</code></td><td>create a new set containing only x</td></tr>
<tr><td><code>find(x)</code></td><td>return the <em>representative</em> of x's set; two items are in the same set exactly when find returns the same representative</td></tr>
<tr><td><code>union(x, y)</code></td><td>merge the sets containing x and y</td></tr>
</table></div>
<p>The sets are <strong>disjoint</strong>: every element belongs to exactly one set. Together they form a <strong>partition</strong> of the elements.</p>

<h2>First attempt: quick-find</h2>
<p>Store an array <code>id[]</code> where <code>id[x]</code> is the name of x's set. Then <code>find(x)</code> is just <code>id[x]</code>: O(1). But <code>union(x, y)</code> must relabel every element of one set, which means scanning the whole array: O(n). Performing n unions costs O(n²), which is too slow for millions of elements.</p>

<h2>Second attempt: a forest of trees</h2>
<p>Represent each set as a tree in which every node points to its parent. The root of each tree is the representative, and it points to itself. The whole structure is a single array:</p>
<div class="formula">parent[x] = x        when x is a root (the representative of its set)
parent[x] = p        otherwise: x's parent in its tree</div>
<p><code>find(x)</code> follows parent links up to the root. <code>union(x, y)</code> finds both roots and makes one root point to the other. Merging is now a single assignment, but find costs O(height), and with careless linking a tree can become a long chain.</p>
${fig('dsuchain', '<b>Figure 8.1</b> Repeatedly hanging a big tree under a small one builds a chain; hanging the smaller tree under the bigger root keeps it flat.')}

<h2>Union by rank</h2>
<p>The fix is to always hang the <em>shorter</em> tree under the root of the <em>taller</em> one. Keep a <strong>rank</strong> for each root, an upper bound on its tree's height. When linking two roots, the one with smaller rank becomes the child. If the ranks are equal, pick either and increase the winner's rank by one.</p>
<p>A tree's rank only grows when two trees of equal rank merge, so a tree of rank r contains at least 2^r nodes. With n elements, no rank can exceed log₂n, and find is O(log n). (Union by <em>size</em>, which hangs the tree with fewer nodes under the larger one, gives the same guarantee.)</p>

<h2>Path compression</h2>
<p>The second trick costs almost nothing to add. During <code>find(x)</code>, you visit every node on the path from x to the root. Afterwards, make each of those nodes point <em>directly</em> at the root. The next find on any of them takes one step.</p>
${fig('dsu', '<b>Figure 8.2</b> A sequence of unions with union by rank, followed by a find with path compression. Watch both the forest and the parent array.')}
${code('Find with path compression')`
int find(int x) {
  if (parent[x] != x) parent[x] = find(parent[x]);   // point x straight at the root
  return parent[x];
}

// Iterative version, safe for very deep trees:
int findIter(int x) {
  int root = x;
  while (parent[root] != root) root = parent[root];
  while (parent[x] != root) { int next = parent[x]; parent[x] = root; x = next; }
  return root;
}`}
${rs('find.rs')`
fn find(parent: &mut [usize], x: usize) -> usize {
    if parent[x] != x { parent[x] = find(parent, parent[x]); }   // point x straight at the root
    parent[x]
}

// Iterative version, safe for very deep trees:
fn find_iter(parent: &mut [usize], mut x: usize) -> usize {
    let mut root = x;
    while parent[root] != root { root = parent[root]; }
    while parent[x] != root { let next = parent[x]; parent[x] = root; x = next; }
    root
}`}

<h2>How fast is it?</h2>
<p>With both union by rank and path compression, any sequence of m operations on n elements runs in O(m · α(n)) time, a result proved by Robert Tarjan in 1975. Here α is the <strong>inverse Ackermann function</strong>. It grows so slowly that α(n) ≤ 4 for every n smaller than the number of atoms in the observable universe. For all practical purposes, each operation is constant time.</p>
<div class="tbl"><table><tr><th>Version</th><th>find</th><th>union</th></tr>
<tr><td>Quick-find array</td><td class="num">O(1)</td><td class="num">O(n)</td></tr>
<tr><td>Forest, naive linking</td><td class="num">O(n)</td><td class="num">O(n)</td></tr>
<tr><td>Union by rank or size</td><td class="num">O(log n)</td><td class="num">O(log n)</td></tr>
<tr><td>Path compression only</td><td class="num">O(log n) amortized</td><td class="num">O(log n) amortized</td></tr>
<tr><td>Both</td><td class="num">O(α(n)) amortized</td><td class="num">O(α(n)) amortized</td></tr>
</table></div>
<p>This is an <em>amortized</em> bound (Chapter 1). A single find can still walk a path of length O(log n), but it flattens that path, and the total work over any sequence of operations stays tiny.</p>

<h2>A complete implementation</h2>
${code('DSU.java')`
public class DSU {
  private final int[] parent, rank;
  private int components;

  public DSU(int n) {
    parent = new int[n]; rank = new int[n]; components = n;
    for (int i = 0; i < n; i++) parent[i] = i;        // makeSet for every element
  }

  public int find(int x) {
    while (parent[x] != x) {
      parent[x] = parent[parent[x]];                   // path halving: a one-pass variant of compression
      x = parent[x];
    }
    return x;
  }

  /** Returns false if x and y were already in the same set. */
  public boolean union(int x, int y) {
    int rx = find(x), ry = find(y);
    if (rx == ry) return false;
    if (rank[rx] < rank[ry]) { int t = rx; rx = ry; ry = t; }   // rx is the taller tree
    parent[ry] = rx;
    if (rank[rx] == rank[ry]) rank[rx]++;
    components--;
    return true;
  }

  public boolean connected(int x, int y) { return find(x) == find(y); }
  public int components() { return components; }

  public static void main(String[] args) {
    DSU d = new DSU(6);
    d.union(0, 1); d.union(1, 2); d.union(3, 4);
    System.out.println(d.connected(0, 2));   // true
    System.out.println(d.connected(0, 3));   // false
    System.out.println(d.components());      // 3: {0,1,2}, {3,4}, {5}
  }
}`}
${rs('dsu.rs')`
struct Dsu {
    parent: Vec<usize>,
    rank: Vec<u8>,              // rank <= log2(n), so a byte is plenty
    components: usize,
}

impl Dsu {
    fn new(n: usize) -> Self {
        Dsu { parent: (0..n).collect(), rank: vec![0; n], components: n }   // makeSet for every element
    }

    // &mut self even for a lookup: path halving rewrites parent links.
    fn find(&mut self, mut x: usize) -> usize {
        while self.parent[x] != x {
            self.parent[x] = self.parent[self.parent[x]];   // path halving: a one-pass variant of compression
            x = self.parent[x];
        }
        x
    }

    /// Returns false if x and y were already in the same set.
    fn union(&mut self, x: usize, y: usize) -> bool {
        let (mut rx, mut ry) = (self.find(x), self.find(y));
        if rx == ry { return false; }
        if self.rank[rx] < self.rank[ry] { std::mem::swap(&mut rx, &mut ry); }   // rx is the taller tree
        self.parent[ry] = rx;
        if self.rank[rx] == self.rank[ry] { self.rank[rx] += 1; }
        self.components -= 1;
        true
    }

    fn connected(&mut self, x: usize, y: usize) -> bool { self.find(x) == self.find(y) }
    fn components(&self) -> usize { self.components }
}

fn main() {
    let mut d = Dsu::new(6);
    d.union(0, 1); d.union(1, 2); d.union(3, 4);
    println!("{}", d.connected(0, 2));      // true
    println!("{}", d.connected(0, 3));      // false
    println!("{}", d.components());        // 3: {0,1,2}, {3,4}, {5}
}`}
<p>The <code>find</code> above uses <strong>path halving</strong>: each node on the path is pointed at its grandparent. It is iterative, needs a single pass, and has the same asymptotic guarantee as full compression.</p>
<p>In Rust, <code>find</code> takes <code>&amp;mut self</code> even though it looks like a query, because path compression rewrites parent links; <code>connected</code> therefore needs <code>&amp;mut self</code> too. That is the type system stating a real fact: two threads cannot safely call <code>find</code> on the same structure at once without synchronisation. Ranks never exceed log₂n, so they fit in a <code>u8</code>.</p>
<h3>Elements that are not integers</h3>
<p>Union-find works on indices 0 to n−1. For strings or other objects, assign each one an index with a <code>HashMap&lt;String, Integer&gt;</code> as you first see it, or store parents directly in a <code>HashMap&lt;String, String&gt;</code>. In Rust the same mapping is a <code>HashMap&lt;String, usize&gt;</code> filled through the <code>entry</code> API.</p>

<h2>Applications</h2>
<h3>Counting connected components</h3>
<p>Start with n components and union the endpoints of every edge. Each successful union reduces the count by one. This answers "how many separate groups?" in nearly linear time, even when edges arrive one at a time and you need the answer after each one.</p>
<h3>Detecting a cycle in an undirected graph</h3>
<p>Process the edges one by one. If an edge's two endpoints are already in the same set, there was already a path between them, so this edge closes a cycle. <code>union</code> returning <code>false</code> is the signal.</p>
${code('Redundant connection')`
static int[] firstCycleEdge(int n, int[][] edges) {
  DSU d = new DSU(n + 1);
  for (int[] e : edges) if (!d.union(e[0], e[1])) return e;   // already connected
  return null;
}`}
${rs('redundant.rs')`
fn first_cycle_edge(n: usize, edges: &[[usize; 2]]) -> Option<[usize; 2]> {
    let mut d = Dsu::new(n + 1);
    edges.iter().copied().find(|&[u, v]| !d.union(u, v))      // already connected
}`}
<h3>Kruskal's minimum spanning tree</h3>
<p>Kruskal's algorithm (Chapter 9) sorts edges by weight and adds each edge unless it would form a cycle. Union-find answers that question for each edge in effectively constant time.</p>
<h3>Grouping equivalent records</h3>
<p>Merging customer accounts that share an email, clustering transactions that share a device or IP address, and grouping synonyms are all union-find problems. Union every pair of records that share an attribute, then group records by <code>find</code>.</p>
${code('Group accounts that share any identifier')`
static Collection<List<String>> group(Map<String, List<String>> idsByAccount) {
  List<String> accounts = new ArrayList<>(idsByAccount.keySet());
  DSU d = new DSU(accounts.size());
  Map<String, Integer> ownerOfId = new HashMap<>();
  for (int i = 0; i < accounts.size(); i++)
    for (String id : idsByAccount.get(accounts.get(i))) {
      Integer prev = ownerOfId.putIfAbsent(id, i);
      if (prev != null) d.union(prev, i);          // two accounts share this identifier
    }
  Map<Integer, List<String>> groups = new HashMap<>();
  for (int i = 0; i < accounts.size(); i++)
    groups.computeIfAbsent(d.find(i), k -> new ArrayList<>()).add(accounts.get(i));
  return groups.values();
}`}
${rs('group.rs')`
use std::collections::HashMap;
use std::collections::hash_map::Entry;

fn group(ids_by_account: &HashMap<String, Vec<String>>) -> Vec<Vec<&str>> {
    let accounts: Vec<&str> = ids_by_account.keys().map(String::as_str).collect();
    let mut d = Dsu::new(accounts.len());
    let mut owner_of_id: HashMap<&str, usize> = HashMap::new();
    for (i, &acct) in accounts.iter().enumerate() {
        for id in &ids_by_account[acct] {
            match owner_of_id.entry(id) {
                Entry::Occupied(e) => { d.union(*e.get(), i); }     // two accounts share this identifier
                Entry::Vacant(e) => { e.insert(i); }
            }
        }
    }
    let mut groups: HashMap<usize, Vec<&str>> = HashMap::new();
    for (i, &acct) in accounts.iter().enumerate() {
        groups.entry(d.find(i)).or_default().push(acct);
    }
    groups.into_values().collect()
}`}
<h3>Grids and images</h3>
<p>For a grid, number cell (r, c) as r × cols + c, and union each land cell with its land neighbours. This handles problems where cells are added over time ("number of islands after each addition"), which a single BFS cannot answer efficiently.</p>

<h2>Applied: linking accounts for AML</h2>
<p>Anti-money-laundering teams use exactly this grouping, often called <strong>entity resolution</strong>: accounts that share a device, a phone number, a card fingerprint or a login IP address are probably controlled by the same person or ring, so alerts and limits should apply to the whole cluster. The idea is simple. Real data adds a trap: <strong>hub identifiers</strong>. A shared office network, a mobile carrier's address pool, a payment processor's device id or a placeholder such as "000000" can appear on thousands of unrelated accounts. Union-find is transitive, so a single hub merges everything that touches it into one giant cluster, and the result is useless.</p>
<p>The usual defence is to count first: find how many accounts hold each identifier, and skip identifiers above a threshold (or weight them, or handle them separately). Counting needs one pass over the data and a hash map; the unions follow in a second pass.</p>
${code('Clusters of linked accounts')`
/** Clusters accounts that share an identifier (device, phone, card fingerprint, IP address).
    Identifiers held by more than maxShare accounts are treated as hubs and ignored. */
static List<List<String>> clusters(Map<String, List<String>> idsByAccount, int maxShare) {
  List<String> accounts = new ArrayList<>(idsByAccount.keySet());
  // 1. Who holds each identifier?
  Map<String, List<Integer>> holders = new HashMap<>();
  for (int i = 0; i < accounts.size(); i++)
    for (String id : idsByAccount.get(accounts.get(i)))
      holders.computeIfAbsent(id, k -> new ArrayList<>()).add(i);
  // 2. Union the holders of every identifier that is not a hub.
  DSU d = new DSU(accounts.size());
  for (List<Integer> h : holders.values())
    if (h.size() <= maxShare)
      for (int j = 1; j < h.size(); j++) d.union(h.get(0), h.get(j));   // a star of unions links them all

  Map<Integer, List<String>> byRoot = new HashMap<>();
  for (int i = 0; i < accounts.size(); i++)
    byRoot.computeIfAbsent(d.find(i), k -> new ArrayList<>()).add(accounts.get(i));

      .filter(c -> c.size() > 1)
      .sorted(Comparator.comparingInt((List<String> c) -> c.size()).reversed())

use std::collections::HashMap;

// Clusters accounts that share an identifier (device, phone, card fingerprint, IP address).
// Identifiers held by more than max_share accounts are treated as hubs and ignored.
fn clusters(ids_by_account: &HashMap<String, Vec<String>>, max_share: usize) -> Vec<Vec<&str>> {
    let accounts: Vec<&str> = ids_by_account.keys().map(String::as_str).collect();
    // 1. Who holds each identifier?
    let mut holders: HashMap<&str, Vec<usize>> = HashMap::new();
    for (i, &acct) in accounts.iter().enumerate() {
        for id in &ids_by_account[acct] { holders.entry(id.as_str()).or_default().push(i); }
    }
    // 2. Union the holders of every identifier that is not a hub.
    let mut d = Dsu::new(accounts.len());
    for h in holders.values().filter(|h| h.len() <= max_share) {
        for &j in &h[1..] { d.union(h[0], j); }        // a star of unions links them all
    }
    // 3. Collect clusters of two or more accounts, largest first.
    let mut by_root: HashMap<usize, Vec<&str>> = HashMap::new();
    for (i, &acct) in accounts.iter().enumerate() { by_root.entry(d.find(i)).or_default().push(acct); }
    let mut out: Vec<Vec<&str>> = by_root.into_values().filter(|c| c.len() > 1).collect();
    out.sort_by_key(|c| std::cmp::Reverse(c.len()));
    out
}`}
<p>In the test data, ip0 appears on 6 of the 7 accounts. With <code>maxShare</code> 10 it is used, and all seven accounts collapse into one cluster. With <code>maxShare</code> 4 it is skipped, and the real structure appears: A, B and C share a device and a phone, D and E share a card. Each identifier with k holders costs k − 1 unions, so the whole run is close to linear in the number of (account, identifier) pairs.</p>
<p>Three practical notes. Union-find forgets <em>why</em> two accounts were joined, and an investigator will ask; keep the identifier that caused each successful union as evidence, which is exactly a spanning tree of the cluster. Links are only ever added, so a cluster that turns out to be wrong cannot be split; when identifiers expire or are corrected, rebuild from the source data, which is cheap at this speed. And the structure updates incrementally: a new account is one <code>makeSet</code> and a few unions, so clusters stay current as data arrives.</p>

<h2>Union-find with weights: consistent exchange rates</h2>
<p>Sometimes the elements in a set are related by a value, not just by membership. Exchange rates are the standard example: if 1 EUR = 1.08 USD and 1 USD = 150 JPY, then 1 EUR = 162 JPY, whether or not anyone quoted that pair. A <strong>weighted union-find</strong> stores, for each element, its value relative to its parent. <code>find</code> multiplies the factors along the path as it compresses, so afterwards every element on the path holds its value relative to the root, and the rate between any two elements of a set is a division.</p>
${code('RateBook.java')`
/** Union-find that also stores, for every currency, its value in units of its parent. */
class RateBook {
  private final int[] parent, size;
  private final double[] toParent;          // 1 unit of x = toParent[x] units of parent[x]

  RateBook(int n) {
    parent = new int[n]; size = new int[n]; toParent = new double[n];
    for (int i = 0; i < n; i++) { parent[i] = i; size[i] = 1; toParent[i] = 1.0; }
  }

  /** Returns x's root; afterwards x points at the root and toParent[x] is x's value in root units. */
  int find(int x) {
    int p = parent[x];
    if (p == x) return x;
    int root = find(p);                     // depth is O(log n) with union by size
    toParent[x] *= toParent[p];             // x -> p -> root
    parent[x] = root;
    return root;
  }

  /** Records the quote "1 a = rate b". Returns false if earlier quotes imply a rate more than tol away. */
  boolean quote(int a, int b, double rate, double tol) {
    int ra = find(a), rb = find(b);
    if (ra == rb) return Math.abs(toParent[a] / toParent[b] - rate) <= tol * rate;   // already implied: check it
    double f = rate * toParent[b] / toParent[a];                                     // 1 ra = f rb
    if (size[ra] < size[rb]) { parent[ra] = rb; toParent[ra] = f;     size[rb] += size[ra]; }
    else                     { parent[rb] = ra; toParent[rb] = 1 / f; size[ra] += size[rb]; }
    return true;
  }

  /** How many units of b one unit of a buys, or NaN if no chain of quotes links them. */
  double rate(int a, int b) { return find(a) == find(b) ? toParent[a] / toParent[b] : Double.NaN; }
}`}
${rs('rate_book.rs')`
// Union-find that also stores, for every currency, its value in units of its parent.
struct RateBook {
    parent: Vec<usize>,
    size: Vec<usize>,
    to_parent: Vec<f64>,        // 1 unit of x = to_parent[x] units of parent[x]
}

impl RateBook {
    fn new(n: usize) -> Self {
        RateBook { parent: (0..n).collect(), size: vec![1; n], to_parent: vec![1.0; n] }
    }

    // Returns x's root; afterwards x points at the root and to_parent[x] is x's value in root units.
    fn find(&mut self, x: usize) -> usize {
        let p = self.parent[x];
        if p == x { return x; }
        let root = self.find(p);                // depth is O(log n) with union by size
        self.to_parent[x] *= self.to_parent[p]; // x -> p -> root
        self.parent[x] = root;
        root
    }

    // Records the quote "1 a = rate b". Returns false if earlier quotes imply a rate more than tol away.
    fn quote(&mut self, a: usize, b: usize, rate: f64, tol: f64) -> bool {
        let (ra, rb) = (self.find(a), self.find(b));
        let (va, vb) = (self.to_parent[a], self.to_parent[b]);
        if ra == rb { return (va / vb - rate).abs() <= tol * rate; }   // already implied: check it
        let f = rate * vb / va;                                       // 1 ra = f rb
        if self.size[ra] < self.size[rb] {
            self.parent[ra] = rb; self.to_parent[ra] = f; self.size[rb] += self.size[ra];
        } else {
            self.parent[rb] = ra; self.to_parent[rb] = 1.0 / f; self.size[ra] += self.size[rb];
        }
        true
    }

    // How many units of b one unit of a buys, or None if no chain of quotes links them.
    fn rate(&mut self, a: usize, b: usize) -> Option<f64> {
        (self.find(a) == self.find(b)).then(|| self.to_parent[a] / self.to_parent[b])
    }
}`}
<p>With the three quotes EUR/USD 1.08, USD/JPY 150 and GBP/EUR 1.17, <code>rate(GBP, JPY)</code> is 1.17 × 1.08 × 150 = 189.54, although no one quoted GBP/JPY, and <code>rate(GBP, CHF)</code> has no answer because no chain of quotes links them. A new quote of 170 for EUR/JPY is rejected as inconsistent (the book implies 162), while 162.1 is accepted within a 1% tolerance.</p>
<p>When linking two roots, the code computes the factor between them from the new quote and the two elements' values relative to their roots; the rest of each tree is untouched and its values stay correct because they are relative. Union by size keeps the trees shallow, so the recursive <code>find</code> is safe. Floating-point rounding makes exact equality meaningless, hence the tolerance, and real quotes have bid-ask spreads that a production check must take into account. The structure keeps one consistent set of rates; finding a profitable loop among many conflicting quotes is a different problem, solved with Bellman-Ford in Chapter 9. The same pattern answers "is this account's ledger consistent with its counterparties?" and LeetCode's "Evaluate Division".</p>

<h2>Limitations</h2>
<ul>
<li>Union-find cannot <strong>split</strong> a set or remove an element. If you need deletions, you need a different structure, or you can process the operations in reverse so that removals become unions.</li>
<li>It answers "are x and y connected?" but not "what is the path between them?". For paths, use BFS or DFS.</li>
<li>It only handles undirected, symmetric relationships. "A can reach B" in a directed graph is not an equivalence relation.</li>
</ul>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Comparing parents instead of roots.</strong> <code>parent[x] == parent[y]</code> is wrong; compare <code>find(x) == find(y)</code>.</li>
<li><strong>Linking non-roots.</strong> Always link the two roots, never the original elements.</li>
<li><strong>Deep recursion in find</strong> before compression has flattened anything. This can only happen without union by rank or size, which caps the depth at log₂n; if you link naively, use the iterative form on large inputs.</li>
<li><strong>Letting hub identifiers merge everything.</strong> Count how many records share each identifier before unioning on it.</li>
<li><strong>Forgetting to map objects to indices</strong> consistently, creating two indices for the same item.</li>
</ul></div>

  F.push({ pq: [...pq], done: new Set(), lab: lab(), par: {}, note: 'All distances start at ∞ except the source A, which is 0. The priority queue holds (node, tentative distance).' });
  while (pq.length) {
    pq.sort((a, b) => a[1] - b[1]); const [u, du] = pq.shift();
    if (done.has(u)) { F.push({ pq: [...pq], done: new Set(done), lab: lab(), par: { ...par }, stale: u, note: `Pop ${u}:${du}, but ${u} is already settled with a smaller distance. This entry is stale; skip it.` }); continue; }
    done.add(u); const rel = [], msg = [];
    adj[u].forEach(([v, w]) => { if (!done.has(v) && du + w < dist[v]) { msg.push(`${v}: ${dist[v] === Infinity ? '∞' : dist[v]} → ${du}+${w} = ${du + w}`); dist[v] = du + w; par[v] = u; pq.push([v, du + w]); rel.push(v); } });
    F.push({ cur: u, rel, pq: [...pq], done: new Set(done), lab: lab(), par: { ...par }, note: `Pop ${u} with distance ${du}. It is the closest unsettled node, so ${du} is final. ` + (msg.length ? 'Relax its edges: ' + msg.join('; ') + '.' : 'No neighbour improves.') });
  }
  F.push({ pq: [], done, lab: lab(), par: { ...par }, note: 'Every node is settled. The green edges are the shortest-path tree from A: A→C→B→D→E→F costs 12.' });
  stepper(host, F, f => {
    const ns = {}, es = {}; f.done.forEach(v => ns[v] = 'ok'); if (f.cur) ns[f.cur] = 'hot';
    for (const v in f.par) es[f.par[v] + '-' + v] = 'ok'; (f.rel || []).forEach(v => es[f.cur + '-' + v] = 'hot');
    const g = graph(DG, DGE, { ns, es, sub: f.lab, subCls: Object.fromEntries((f.rel || []).map(v => [v, 'hot'])), w: 600, h: 310 });
    return { s: g.s + chips(0, 312, 'priority queue', [...f.pq].sort((a, b) => a[1] - b[1]).map(p => p[0] + ':' + p[1]), { cls: 'cmp', lw: 110 }), w: 600, h: 346 };
  }, { speed: 1500, legend: '<span class="l-hot">current node and relaxed edges</span><span class="l-ok">settled; shortest-path tree</span>' });
};

  const N = { S: { x: 60, y: 130 }, A: { x: 240, y: 40 }, B: { x: 240, y: 220, sy: 1 }, C: { x: 420, y: 130 } };
  const E = [['A', 'C', 2], ['B', 'A', -2], ['S', 'B', 3], ['S', 'A', 4]];
  const d = { S: 0, A: Infinity, B: Infinity, C: Infinity }, F = [];
  const lab = () => Object.fromEntries(Object.entries(d).map(([k, v]) => [k, v === Infinity ? '∞' : v]));
  F.push({ lab: lab(), note: 'Bellman-Ford relaxes every edge, in a fixed order, V − 1 = 3 times. The edge order here is deliberately unlucky: A→C, B→A, S→B, S→A.' });
  for (let pass = 1; pass <= 3; pass++) {
    let changed = false;
    E.forEach(([u, v, w]) => {
      let note;
      if (d[u] !== Infinity && d[u] + w < d[v]) { note = `Pass ${pass}, edge ${u}→${v} (${w}): ${d[v] === Infinity ? '∞' : d[v]} improves to ${d[u]} + (${w}) = ${d[u] + w}.`; d[v] = d[u] + w; changed = true; F.push({ lab: lab(), e: u + '-' + v, hot: v, note }); }

    });
    if (!changed) { F.push({ lab: lab(), note: `Pass ${pass} changed nothing, so the distances are final. Stop early.` }); break; }
  }
  F.push({ lab: lab(), note: 'One more pass finds no improvement, so there is no negative cycle. Final distances: S 0, B 3, A 1, C 3.' });
  stepper(host, F, f => graph(N, E, { dir: true, es: f.e ? { [f.e]: 'hot' } : {}, ns: f.hot ? { [f.hot]: 'hot' } : {}, sub: f.lab, w: 480, h: 270 }), { speed: 1000 });
