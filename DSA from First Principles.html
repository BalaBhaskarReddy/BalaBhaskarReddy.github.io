CH.push({
  id: 'ch19', n: 19, title: 'Dynamic Programming',
  lede: 'Dynamic programming solves problems whose subproblems overlap: the same smaller question comes up again and again. By solving each subproblem once and storing the answer, it turns many exponential-time recursions into polynomial-time algorithms. It is the most powerful technique in this book and, with practice, one of the most systematic.',
  html: `
<h2>Recursion plus memory</h2>
<p>Recall the naive Fibonacci function from Chapter 2. Its recursion tree has about 1.6ⁿ nodes because it computes the same values over and over. But there are only n + 1 different subproblems: f(0), f(1), …, f(n). Drawing each distinct subproblem once, with an arrow to the subproblems it needs, gives a small graph instead of a huge tree.</p>
${fig('fibtree', '<b>Figure 19.1</b> The recursion tree for f(5). Identical subproblems are solved repeatedly.')}
${fig('fibdag', '<b>Figure 19.2</b> The same computation with each subproblem drawn once. Six nodes, eight edges.')}
<p>Dynamic programming means evaluating that small graph instead of the tree: compute each subproblem once, remember the answer, and look it up whenever it is needed again.</p>
${code('Fibonacci three ways')`
// 1. Naive recursion: O(1.6^n) time.
static long fibNaive(int n) { return n < 2 ? n : fibNaive(n - 1) + fibNaive(n - 2); }

// 2. Memoization (top-down): the same recursion, plus a cache. O(n) time, O(n) space.
static long[] memo = new long[93];
static long fibMemo(int n) {
  if (n < 2) return n;
  if (memo[n] != 0) return memo[n];                  // answered before: look it up
  return memo[n] = fibMemo(n - 1) + fibMemo(n - 2);
}

// 3. Tabulation (bottom-up): fill answers in dependency order. O(n) time, O(1) space.
static long fibTab(int n) {
  if (n < 2) return n;
  long prev = 0, cur = 1;
  for (int i = 2; i <= n; i++) { long next = prev + cur; prev = cur; cur = next; }
  return cur;
}`}
${rs('fibonacci.rs')`
// 1. Naive recursion: O(1.6^n) time.
fn fib_naive(n: u32) -> u64 { if n < 2 { u64::from(n) } else { fib_naive(n - 1) + fib_naive(n - 2) } }

// 2. Memoization (top-down): the same recursion, plus a cache. O(n) time, O(n) space.
//    Rust has no mutable globals without locking, so the caller owns the cache: vec![None; n + 1].
fn fib_memo(n: usize, memo: &mut [Option<u64>]) -> u64 {
    if n < 2 { return n as u64; }
    if let Some(v) = memo[n] { return v; }            // answered before: look it up
    let v = fib_memo(n - 1, memo) + fib_memo(n - 2, memo);
    memo[n] = Some(v);
    v
}

// 3. Tabulation (bottom-up): fill answers in dependency order. O(n) time, O(1) space.
fn fib_tab(n: u32) -> u64 {
    if n < 2 { return u64::from(n); }
    let (mut prev, mut cur) = (0u64, 1u64);
    for _ in 2..=n { (prev, cur) = (cur, prev + cur); }
    cur
}
`}
<p>fibNaive(50) takes about a minute. The other two take microseconds. Nothing about the mathematics changed; the only difference is that the same work is never done twice. The Rust memoized version takes its cache as a parameter, because a mutable global would need a lock, and it marks missing answers with <code>None</code> rather than borrowing 0 as a "not computed yet" value, as the Java array does.</p>

<h2>When dynamic programming applies</h2>
<p>A problem is a good fit for dynamic programming when it has two properties:</p>
<ul>
<li><strong>Optimal substructure:</strong> an optimal solution can be built from optimal solutions to smaller subproblems. The shortest route from A to C through B contains the shortest route from A to B.</li>
<li><strong>Overlapping subproblems:</strong> a straightforward recursion would solve the same subproblems many times. Without overlap, plain divide and conquer is enough.</li>
</ul>
<p>Typical signals in the problem statement are words like <em>minimum</em>, <em>maximum</em>, <em>longest</em>, <em>shortest</em>, <em>number of ways</em> and <em>is it possible</em>, combined with choices that interact, so that greedy does not work.</p>

<h2>Memoization versus tabulation</h2>
<div class="tbl"><table><tr><th></th><th>Memoization (top-down)</th><th>Tabulation (bottom-up)</th></tr>
<tr><td>How</td><td>write the recursion, add a cache</td><td>fill a table in an order where dependencies come first</td></tr>
<tr><td>Strengths</td><td>easy to derive from the recurrence; computes only the subproblems actually needed</td><td>no recursion depth limits; no call overhead; easy to reduce memory</td></tr>
<tr><td>Weaknesses</td><td>stack overflow on deep recursions; cache lookup overhead</td><td>you must work out the evaluation order; may compute unneeded entries</td></tr>
<tr><td>Use when</td><td>the state space is large but sparsely visited, or the order is awkward</td><td>the state space is dense and the order is obvious</td></tr>
</table></div>
<p>A good workflow is to write the memoized version first, because it follows directly from the recurrence, and convert to tabulation when you need speed or have a depth problem.</p>

<h2>A five-step recipe</h2>
<ol>
<li><strong>Define the state in words.</strong> "dp[i] is the most money obtainable from houses 0 to i." This sentence is the most important line of any DP solution. If you cannot write it, you are not ready to code.</li>
<li><strong>Write the transition.</strong> Express dp of a state in terms of smaller states, by considering the last choice made.</li>
<li><strong>Set the base cases.</strong> The smallest states, answered directly.</li>
<li><strong>Choose the evaluation order</strong> so that every state is computed after the states it depends on.</li>
<li><strong>Locate the answer</strong> in the table, and then see whether you can keep fewer rows or columns.</li>
</ol>
<p>The rest of this chapter applies the recipe to the classic problems. Each one is a template for a whole family.</p>

<h2>One-dimensional DP</h2>
<h3>House robber</h3>
<p>Houses in a row hold given amounts of money. You cannot rob two adjacent houses. What is the most you can take?</p>
<p><strong>State:</strong> dp[i] = the best total from houses 0..i. <strong>Transition:</strong> for house i, either skip it (dp[i−1]) or rob it and skip house i−1 (dp[i−2] + a[i]). <strong>Base:</strong> dp[0] = a[0], dp[1] = max(a[0], a[1]).</p>
${fig('robber', '<b>Figure 19.3</b> Each dp entry is the better of two options, each read from earlier entries.')}
${code('House robber')`
static int rob(int[] a) {
  int prev2 = 0, prev1 = 0;            // dp[i-2] and dp[i-1]
  for (int x : a) {
    int cur = Math.max(prev1, prev2 + x);
    prev2 = prev1; prev1 = cur;
  }
  return prev1;
}`}
${rs('house_robber.rs')`
fn rob(a: &[u32]) -> u32 {
    // The state is the pair (dp[i-2], dp[i-1]); fold carries it along the houses.
    let (_, best) = a.iter().fold((0, 0), |(prev2, prev1), &x| (prev1, prev1.max(prev2 + x)));
    best
}
`}
<p>Climbing stairs, decode ways, and minimum cost climbing stairs all have exactly this shape: dp[i] depends on a constant number of earlier entries.</p>
<h3>Coin change</h3>
<p>Given coin denominations and a target amount, find the fewest coins that make the amount (each denomination can be used any number of times). Chapter 17 showed that greedy fails for coins {1, 3, 4}.</p>
<p><strong>State:</strong> dp[x] = fewest coins that make exactly x. <strong>Transition:</strong> the last coin used is some c, so dp[x] = 1 + min over coins c ≤ x of dp[x − c]. <strong>Base:</strong> dp[0] = 0.</p>
${fig('coindp', '<b>Figure 19.4</b> Coin change for 11 with coins {1, 5, 6, 9}. Each entry tries every coin as the last one.')}
${code('Coin change')`
static int coinChange(int[] coins, int amount) {
  int[] dp = new int[amount + 1];
  Arrays.fill(dp, Integer.MAX_VALUE);
  dp[0] = 0;
  for (int x = 1; x <= amount; x++)
    for (int c : coins)
      if (c <= x && dp[x - c] != Integer.MAX_VALUE)
        dp[x] = Math.min(dp[x], dp[x - c] + 1);
  return dp[amount] == Integer.MAX_VALUE ? -1 : dp[amount];
}

// Number of different ways to make the amount (order does not matter).
static long countWays(int[] coins, int amount) {
  long[] ways = new long[amount + 1];
  ways[0] = 1;
  for (int c : coins)                  // coins in the outer loop: each combination counted once
    for (int x = c; x <= amount; x++) ways[x] += ways[x - c];
  return ways[amount];
}`}
${rs('coin_change.rs')`
fn coin_change(coins: &[usize], amount: usize) -> Option<u32> {
    let mut dp: Vec<Option<u32>> = vec![None; amount + 1];   // None: amount not reachable
    dp[0] = Some(0);
    for x in 1..=amount {
        dp[x] = coins.iter()
            .filter(|&&c| c <= x)
            .filter_map(|&c| dp[x - c])                      // reachable predecessors only
            .min()
            .map(|k| k + 1);
    }
    dp[amount]
}

// Number of different ways to make the amount (order does not matter).
fn count_ways(coins: &[usize], amount: usize) -> u64 {
    let mut ways = vec![0u64; amount + 1];
    ways[0] = 1;
    for &c in coins {                        // coins in the outer loop: each combination counted once
        for x in c..=amount { ways[x] += ways[x - c]; }
    }
    ways[amount]
}
`}
<p>The Rust version stores <code>Option&lt;u32&gt;</code>, so "not reachable" is a value of its own instead of <code>Integer.MAX_VALUE</code> and −1, and it cannot be added to by mistake. Both run in O(amount × number of coins). In the counting version, the loop order matters: with coins outside, {1, 2} and {2, 1} are the same combination; with amounts outside, they would be counted as two different sequences.</p>

<h2>Knapsack</h2>
<p>The <strong>0/1 knapsack</strong> problem: n items with weights and values, and a bag of capacity W. Choose a subset of items with total weight at most W and maximum total value. Each item is taken whole or not at all.</p>
<p><strong>State:</strong> T[i][c] = the best value using only the first i items with capacity c. <strong>Transition:</strong> item i is either left out (T[i−1][c]) or taken, if it fits (T[i−1][c − wᵢ] + vᵢ). <strong>Base:</strong> T[0][c] = 0.</p>
${fig('knap', '<b>Figure 19.5</b> Filling the knapsack table row by row. Each cell looks straight up (skip the item) and up and to the left by the item\'s weight (take it).')}
${code('Knapsack.java')`
static int knapsack(int[] w, int[] v, int W) {
  int[] dp = new int[W + 1];                       // dp[c] = row i of the table, reused
  for (int i = 0; i < w.length; i++)
    for (int c = W; c >= w[i]; c--)                // DOWNWARD, so each item is used at most once
      dp[c] = Math.max(dp[c], dp[c - w[i]] + v[i]);
  return dp[W];
}`}
${rs('knapsack.rs')`
fn knapsack(w: &[usize], v: &[u64], cap: usize) -> u64 {
    let mut dp = vec![0u64; cap + 1];                // dp[c] = row i of the table, reused
    for (&wi, &vi) in w.iter().zip(v) {
        for c in (wi..=cap).rev() {                  // DOWNWARD, so each item is used at most once
            dp[c] = dp[c].max(dp[c - wi] + vi);
        }
    }
    dp[cap]
}
`}
<p>The one-dimensional version keeps only one row. Iterating capacity <em>downward</em> ensures that <code>dp[c - w[i]]</code> still holds the value from the previous row, before item i was considered. Iterating <em>upward</em> would let an item be added again and again, which solves the <strong>unbounded knapsack</strong> instead. That single loop direction is the difference between the two problems.</p>
<p>The running time is O(n · W). That looks polynomial but is not quite: W is a number in the input, and writing it down takes only log W bits, so the time is exponential in the size of the input. Such algorithms are called <strong>pseudo-polynomial</strong>. They are fast when W is small (a few million) and useless when W is astronomically large. Chapter 20 explains why no truly polynomial algorithm is known.</p>
<p>Many problems are knapsack in disguise: <em>partition equal subset sum</em> (can a subset reach half the total?), <em>target sum</em> (assign + or − signs), and budget allocation problems. The invoice matching of Chapter 2 is subset sum, which is knapsack on booleans: reachable[x] says whether some subset of the invoices adds up to exactly x cents, and filling it is O(n × amount).</p>

<h2>Two-sequence DP</h2>
<h3>Longest common subsequence</h3>
<p>A <strong>subsequence</strong> keeps characters in order but may skip some: "ACE" is a subsequence of "ABCDE". The longest common subsequence (LCS) of two strings is the longest string that is a subsequence of both. <code>diff</code> and version-control tools use LCS to find unchanged lines between two files.</p>
<p><strong>State:</strong> T[i][j] = LCS length of the first i characters of A and the first j characters of B. <strong>Transition:</strong> if A[i−1] = B[j−1], those characters can end the common subsequence: T[i−1][j−1] + 1. Otherwise one of them is not used: max(T[i−1][j], T[i][j−1]). <strong>Base:</strong> row 0 and column 0 are 0.</p>
${fig('lcs', '<b>Figure 19.6</b> Filling the LCS table for ABCB and BDCAB, then tracing back from the corner to recover the subsequence itself.')}
${code('LCS with reconstruction')`
static String lcs(String a, String b) {
  int m = a.length(), n = b.length();
  int[][] T = new int[m + 1][n + 1];
  for (int i = 1; i <= m; i++)
    for (int j = 1; j <= n; j++)
      T[i][j] = a.charAt(i - 1) == b.charAt(j - 1) ? T[i - 1][j - 1] + 1 : Math.max(T[i - 1][j], T[i][j - 1]);
  StringBuilder sb = new StringBuilder();           // walk back from the corner
  for (int i = m, j = n; i > 0 && j > 0; ) {
    if (a.charAt(i - 1) == b.charAt(j - 1)) { sb.append(a.charAt(i - 1)); i--; j--; }
    else if (T[i - 1][j] >= T[i][j - 1]) i--;
    else j--;
  }
  return sb.reverse().toString();
}`}
${rs('lcs.rs')`
fn lcs(a: &str, b: &str) -> String {
    let (a, b): (Vec<char>, Vec<char>) = (a.chars().collect(), b.chars().collect());
    let (m, n) = (a.len(), b.len());
    let mut t = vec![vec![0usize; n + 1]; m + 1];
    for i in 1..=m {
        for j in 1..=n {
            t[i][j] = if a[i - 1] == b[j - 1] { t[i - 1][j - 1] + 1 } else { t[i - 1][j].max(t[i][j - 1]) };
        }
    }
    let mut out = Vec::new();                         // walk back from the corner
    let (mut i, mut j) = (m, n);
    while i > 0 && j > 0 {
        if a[i - 1] == b[j - 1] { out.push(a[i - 1]); i -= 1; j -= 1; }
        else if t[i - 1][j] >= t[i][j - 1] { i -= 1; }
        else { j -= 1; }
    }
    out.iter().rev().collect()
}
`}
<p>Recording how each cell was decided and walking backwards is the general way to recover the actual solution, not just its value, from any DP table.</p>
<h3>Edit distance</h3>
<p>The <strong>edit distance</strong> (Levenshtein distance) between two strings is the minimum number of single-character insertions, deletions and substitutions that turn one into the other. Spell checkers, fuzzy name matching (for example screening names against sanctions lists, where "Mohammed" and "Muhammad" should match) and DNA alignment all use it.</p>
<p><strong>State:</strong> T[i][j] = edit distance between the first i characters of A and the first j of B. <strong>Transition:</strong> if the last characters match, T[i−1][j−1]. Otherwise 1 + the minimum of substituting (T[i−1][j−1]), deleting from A (T[i−1][j]) and inserting into A (T[i][j−1]). <strong>Base:</strong> T[i][0] = i and T[0][j] = j.</p>
${fig('edit', '<b>Figure 19.7</b> Edit distance from kitten to sitting is 3: substitute k→s, substitute e→i, insert g. The highlighted cells trace one optimal sequence of edits.')}
${code('Edit distance')`
static int editDistance(String a, String b) {
  int m = a.length(), n = b.length();
  int[] prev = new int[n + 1], cur = new int[n + 1];
  for (int j = 0; j <= n; j++) prev[j] = j;            // turning "" into b[0..j)
  for (int i = 1; i <= m; i++) {
    cur[0] = i;
    for (int j = 1; j <= n; j++) {
      if (a.charAt(i - 1) == b.charAt(j - 1)) cur[j] = prev[j - 1];
      else cur[j] = 1 + Math.min(prev[j - 1], Math.min(prev[j], cur[j - 1]));
    }
    int[] t = prev; prev = cur; cur = t;               // keep only two rows: O(n) space
  }
  return prev[n];
}`}
${rs('edit_distance.rs')`
fn edit_distance(a: &str, b: &str) -> usize {
    let b: Vec<char> = b.chars().collect();
    let mut prev: Vec<usize> = (0..=b.len()).collect();      // turning "" into b[..j]
    let mut cur = vec![0; b.len() + 1];
    for (i, ca) in a.chars().enumerate() {
        cur[0] = i + 1;
        for (j, &cb) in b.iter().enumerate() {
            cur[j + 1] = if ca == cb { prev[j] } else { 1 + prev[j].min(prev[j + 1]).min(cur[j]) };
        }
        std::mem::swap(&mut prev, &mut cur);                  // keep only two rows: O(n) space
    }
    prev[b.len()]
}
`}

<h2>Longest increasing subsequence</h2>
<p>Find the length of the longest strictly increasing subsequence of an array.</p>
<p>The direct DP is O(n²): dp[i] = 1 + max dp[j] over all j &lt; i with a[j] &lt; a[i]. A cleverer formulation gives O(n log n). Keep an array <code>tails</code>, where tails[k] is the smallest value that can end an increasing subsequence of length k + 1. For each new value, binary search for the first tail ≥ it and replace that tail, or append if every tail is smaller.</p>
${fig('lis', '<b>Figure 19.8</b> The tails array for 10, 9, 2, 5, 3, 7, 101, 18. Its length is the LIS length.')}
${code('LIS, O(n log n)')`
static int lis(int[] a) {
  int[] tails = new int[a.length];
  int len = 0;
  for (int x : a) {
    int lo = 0, hi = len;                    // lower bound: first tail >= x
    while (lo < hi) { int mid = (lo + hi) >>> 1; if (tails[mid] < x) lo = mid + 1; else hi = mid; }
    tails[lo] = x;
    if (lo == len) len++;
  }
  return len;
}`}
${rs('lis.rs')`
fn lis(a: &[i32]) -> usize {
    let mut tails: Vec<i32> = Vec::new();
    for &x in a {
        let k = tails.partition_point(|&t| t < x);    // lower bound: first tail >= x
        if k == tails.len() { tails.push(x); } else { tails[k] = x; }
    }
    tails.len()
}
`}
<p>Why replace? A smaller ending value is always at least as good for the future, because more later values can extend it. The tails array stays sorted, which is what makes binary search possible; in Rust, <code>partition_point</code> is that lower-bound search.</p>

<h2>Weighted interval scheduling</h2>
<p>Chapter 17 fitted as many requests as possible onto one resource by always taking the one that finishes first. Give each request a value and ask for the most valuable set that does not overlap, and that greedy rule fails. A shared settlement engine, a reserved processing window or a credit line booked by several desks all pose this question: each booking has a time and a value, and two bookings cannot overlap.</p>
<p>Sort the bookings by finishing time. <strong>State:</strong> dp[i] = the best total using only the first i bookings. <strong>Transition:</strong> the last of them, booking i − 1, is either left out, giving dp[i − 1], or taken. If it is taken, the rest of the selection comes from the bookings that end by the time it starts; since the bookings are sorted by end, those form a prefix, whose length p is found by binary search, giving dp[p] + its value. <strong>Base:</strong> dp[0] = 0.</p>
${code('WeightedIntervals.java')`
import java.util.*;

public class WeightedIntervals {
  record Booking(String id, int start, int end, long value) {}     // half-open [start, end)

  // The most valuable set of non-overlapping bookings, in O(n log n).
  static List<Booking> best(List<Booking> input) {
    List<Booking> b = new ArrayList<>(input);
    b.sort(Comparator.comparingInt(Booking::end));
    int n = b.size();
    int[] ends = new int[n];
    for (int i = 0; i < n; i++) ends[i] = b.get(i).end();
    long[] dp = new long[n + 1];         // dp[i] = best total using only the first i bookings
    int[] prev = new int[n];             // prev[i] = how many bookings end by the time booking i starts
    for (int i = 0; i < n; i++) {
      prev[i] = upperBound(ends, b.get(i).start());                  // all of them fit before booking i
      dp[i + 1] = Math.max(dp[i], dp[prev[i]] + b.get(i).value());   // skip booking i, or take it
    }
    List<Booking> chosen = new ArrayList<>();                         // walk back to recover the choice
    for (int i = n; i > 0; ) {
      if (dp[i] == dp[i - 1]) i--;                                   // booking i - 1 was skipped
      else { chosen.add(b.get(i - 1)); i = prev[i - 1]; }
    }
    Collections.reverse(chosen);
    return chosen;
  }

  static int upperBound(int[] a, int key) {                           // first index with a[i] > key
    int lo = 0, hi = a.length;
    while (lo < hi) { int mid = (lo + hi) >>> 1; if (a[mid] <= key) lo = mid + 1; else hi = mid; }
    return lo;
  }

  public static void main(String[] args) {
    List<Booking> requests = List.of(new Booking("A", 9, 11, 50), new Booking("B", 10, 14, 200),
        new Booking("C", 11, 12, 30), new Booking("D", 12, 15, 60), new Booking("E", 14, 17, 70),
        new Booking("F", 15, 16, 40), new Booking("G", 16, 18, 50));
    List<Booking> pick = best(requests);
    System.out.println(pick.stream().map(Booking::id).toList() + " " + pick.stream().mapToLong(Booking::value).sum());   // [B, F, G] 290
  }
}
`}
${rs('weighted_intervals.rs')`
#[derive(Debug, Clone)]
struct Booking { id: &'static str, start: u32, end: u32, value: u64 }   // half-open [start, end)

// The most valuable set of non-overlapping bookings, in O(n log n).
fn best(input: &[Booking]) -> Vec<Booking> {
    let mut b = input.to_vec();
    b.sort_by_key(|x| x.end);
    let n = b.len();
    let mut dp = vec![0u64; n + 1];        // dp[i] = best total using only the first i bookings
    let mut prev = vec![0usize; n];        // prev[i] = how many bookings end by the time booking i starts
    for i in 0..n {
        prev[i] = b.partition_point(|x| x.end <= b[i].start);    // all of them fit before booking i
        dp[i + 1] = dp[i].max(dp[prev[i]] + b[i].value);          // skip booking i, or take it
    }
    let mut chosen = Vec::new();                                  // walk back to recover the choice
    let mut i = n;
    while i > 0 {
        if dp[i] == dp[i - 1] { i -= 1; }                         // booking i - 1 was skipped
        else { chosen.push(b[i - 1].clone()); i = prev[i - 1]; }
    }
    chosen.reverse();
    chosen
}

fn main() {
    let bk = |id, start, end, value| Booking { id, start, end, value };
    let requests = [bk("A", 9, 11, 50), bk("B", 10, 14, 200), bk("C", 11, 12, 30), bk("D", 12, 15, 60),
                    bk("E", 14, 17, 70), bk("F", 15, 16, 40), bk("G", 16, 18, 50)];
    let pick = best(&requests);
    let ids: Vec<&str> = pick.iter().map(|x| x.id).collect();
    println!("{ids:?} {}", pick.iter().map(|x| x.value).sum::<u64>());   // ["B", "F", "G"] 290
}
`}
<p>On this input, earliest finish first accepts A, C, D, F and G: five bookings worth 230. Taking the most valuable booking first gets B and then E, worth 270. The DP finds B, F and G, worth 290: fewer bookings, more value. Sorting and the n binary searches cost O(n log n), filling the table O(n), and walking back from dp[n] recovers the bookings, as with LCS.</p>

<h2>Grid DP</h2>
<p>How many paths go from the top-left to the bottom-right of an R × C grid if you may only move right or down? The last step into any cell comes either from above or from the left, so paths(r, c) = paths(r−1, c) + paths(r, c−1), with 1 along the top row and left column.</p>
${fig('paths', '<b>Figure 19.9</b> Each cell is the sum of the cell above and the cell to the left. There are 56 paths through a 4 × 6 grid.')}
<p>Adding obstacles (set blocked cells to 0), costs (take the minimum instead of the sum) or collectable items gives a whole family: minimum path sum, dungeon game, cherry pickup.</p>

<h2>Interval DP: matrix chain multiplication</h2>
<p>Multiplying a p × q matrix by a q × r matrix costs p·q·r scalar multiplications. Matrix multiplication is associative, so a chain A₁A₂…Aₙ can be parenthesized in many ways, and the cost varies enormously. For dimensions 10 × 30, 30 × 5 and 5 × 60, computing (A₁A₂)A₃ costs 1,500 + 3,000 = 4,500, while A₁(A₂A₃) costs 9,000 + 18,000 = 27,000.</p>
<p><strong>State:</strong> T[i][j] = the minimum cost of multiplying Aᵢ through Aⱼ. <strong>Transition:</strong> the last multiplication splits the chain at some k between i and j: T[i][j] = min over k of T[i][k] + T[k+1][j] + dᵢ₋₁·dₖ·dⱼ. <strong>Order:</strong> by increasing interval length, so shorter intervals are ready first.</p>
${code('Matrix chain order')`
// Matrix i has dimensions d[i-1] x d[i], for i = 1..n.
static long matrixChain(int[] d) {
  int n = d.length - 1;
  long[][] T = new long[n + 1][n + 1];
  for (int len = 2; len <= n; len++)                 // interval length
    for (int i = 1; i + len - 1 <= n; i++) {
      int j = i + len - 1;
      T[i][j] = Long.MAX_VALUE;
      for (int k = i; k < j; k++)                    // where the last split happens
        T[i][j] = Math.min(T[i][j], T[i][k] + T[k + 1][j] + (long) d[i - 1] * d[k] * d[j]);
    }
  return T[1][n];
}
// matrixChain(new int[]{10, 30, 5, 60}) == 4500`}
${rs('matrix_chain.rs')`
// Matrix i has dimensions d[i-1] x d[i], for i = 1..n.
fn matrix_chain(d: &[u64]) -> u64 {
    let n = d.len() - 1;
    let mut t = vec![vec![0u64; n + 1]; n + 1];
    for len in 2..=n {                                   // interval length
        for i in 1..=n + 1 - len {
            let j = i + len - 1;
            t[i][j] = (i..j)                             // where the last split happens
                .map(|k| t[i][k] + t[k + 1][j] + d[i - 1] * d[k] * d[j])
                .min()
                .expect("i < j");
        }
    }
    t[1][n]
}
// matrix_chain(&[10, 30, 5, 60]) == 4500
`}
<p>It takes O(n³) time and O(n²) space. The same "split the interval at k" pattern solves burst balloons, optimal binary search trees, palindrome partitioning and minimum cost to cut a stick.</p>

<h2>Applied: batching payouts</h2>
<p>Payouts arrive through the day and go to the bank in batches. Each batch carries a fixed fee, so fewer and larger batches are cheaper; but a payout waiting for its batch costs something too, in float, in customer experience or against an agreed service level, and a file format may cap the number of items in a batch. Choosing where to cut the queue is a DP over prefixes, the same shape as breaking text into lines.</p>
<p><strong>State:</strong> dp[i] = the cheapest way to send the first i payouts. <strong>Transition:</strong> the last batch holds payouts j to i − 1, for some j no more than maxBatch back. It is sent when payout i − 1 arrives, so each payout k in it waits t[i − 1] − t[k]. With prefix sums P of the arrival times, the batch's total wait is one subtraction, t[i − 1] · (i − j) − (P[i] − P[j]), and dp[i] is the minimum over j of dp[j] + fee + waitCost · wait. <strong>Base:</strong> dp[0] = 0.</p>
${code('PayoutBatcher.java')`
import java.util.*;

public class PayoutBatcher {
  record Plan(long cost, List<Integer> starts) {}   // batch k holds payouts starts[k] .. starts[k+1]-1

  // t: arrival minute of each payout, in order. Each batch costs fee and is sent when its last payout
  // arrives; every payout costs waitCost per minute it waits. A batch holds at most maxBatch payouts.
  static Plan plan(long[] t, long fee, long waitCost, int maxBatch) {
    int n = t.length;
    long[] P = new long[n + 1];                          // prefix sums of arrival times
    for (int i = 0; i < n; i++) P[i + 1] = P[i] + t[i];
    long[] dp = new long[n + 1];                         // dp[i] = cheapest way to send the first i payouts
    int[] from = new int[n + 1];                         // where the last batch of that plan starts
    for (int i = 1; i <= n; i++) {
      dp[i] = Long.MAX_VALUE;
      for (int j = Math.max(0, i - maxBatch); j < i; j++) {   // last batch: payouts j..i-1, sent at t[i-1]
        long waited = t[i - 1] * (i - j) - (P[i] - P[j]);      // total minutes waited in that batch
        long cost = dp[j] + fee + waitCost * waited;
        if (cost < dp[i]) { dp[i] = cost; from[i] = j; }
      }
    }
    Deque<Integer> starts = new ArrayDeque<>();
    for (int i = n; i > 0; i = from[i]) starts.addFirst(from[i]);
    return new Plan(dp[n], List.copyOf(starts));
  }

  public static void main(String[] args) {
    long[] arrivals = {0, 2, 3, 10, 11, 30, 31, 33, 60};
    System.out.println(plan(arrivals, 40, 1, 4));   // Plan[cost=170, starts=[0, 3, 5, 8]]
  }
}
`}
${rs('payout_batcher.rs')`
// t: arrival minute of each payout, in order. Each batch costs fee and is sent when its last payout
// arrives; every payout costs wait_cost per minute it waits. A batch holds at most max_batch payouts.
// Returns the total cost and the index where each batch starts.
fn plan(t: &[u64], fee: u64, wait_cost: u64, max_batch: usize) -> (u64, Vec<usize>) {
    let n = t.len();
    let mut p = vec![0u64; n + 1];                       // prefix sums of arrival times
    for i in 0..n { p[i + 1] = p[i] + t[i]; }
    let mut dp = vec![u64::MAX; n + 1];                  // dp[i] = cheapest way to send the first i payouts
    let mut from = vec![0usize; n + 1];                  // where the last batch of that plan starts
    dp[0] = 0;
    for i in 1..=n {
        for j in i.saturating_sub(max_batch)..i {        // last batch: payouts j..i-1, sent at t[i-1]
            let waited = t[i - 1] * (i - j) as u64 - (p[i] - p[j]);   // total minutes waited in that batch
            let cost = dp[j] + fee + wait_cost * waited;
            if cost < dp[i] { dp[i] = cost; from[i] = j; }
        }
    }
    let mut starts = Vec::new();
    let mut i = n;
    while i > 0 { starts.push(from[i]); i = from[i]; }
    starts.reverse();
    (dp[n], starts)
}
`}
<p>With a fee of 40, a waiting cost of 1 per payout-minute and at most four payouts in a batch, the plan sends the payouts that arrive at minutes {0, 2, 3}, {10, 11}, {30, 31, 33} and {60}, for a total of 170: four fees and 10 minutes of waiting. Merging {10, 11} into the next batch would save one fee of 40 but add 44 minutes of waiting, so the DP keeps them apart. The cost is O(n · maxBatch) time. The same recurrence fits any batch cost that depends only on where the batch starts and ends: tiered fees, a cap on a batch's total value, or a penalty for a batch sent after a cut-off.</p>

${code('State-machine DP: stock trading with a cooldown day')`
static int maxProfitCooldown(int[] price) {
  int hold = Integer.MIN_VALUE / 2, sold = 0, rest = 0;   // best profit in each state at the end of a day
  for (int p : price) {
    int prevSold = sold;
    sold = hold + p;                       // sell today
    hold = Math.max(hold, rest - p);       // keep holding, or buy today (only from "rest")
    rest = Math.max(rest, prevSold);       // the day after a sale is a forced rest
  }
  return Math.max(sold, rest);
}`}
${rs('stock_cooldown.rs')`
fn max_profit_cooldown(price: &[i32]) -> i32 {
    let (mut hold, mut sold, mut rest) = (i32::MIN / 2, 0, 0);   // best profit in each state at the end of a day
    for &p in price {
        (hold, sold, rest) = (           // every right-hand side reads yesterday's values
            hold.max(rest - p),          // keep holding, or buy today (only from "rest")
            hold + p,                    // sell today
            rest.max(sold),              // the day after a sale is a forced rest
        );
    }
    sold.max(rest)
}
`}

<h2>Saving memory</h2>
<p>If each row of the table depends only on the previous row, keep two rows (or one, filled in the right direction) instead of the whole table. Edit distance and knapsack above drop from O(m·n) to O(n) space this way. The cost is that you can no longer trace back the full solution; when you need both little memory and the solution itself, Hirschberg's divide-and-conquer technique recovers it in linear space.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>A vague state.</strong> Write the state as a full sentence before coding. Most DP bugs are state bugs.</li>
<li><strong>Wrong evaluation order.</strong> A cell must be computed after every cell it reads.</li>
<li><strong>Wrong loop direction in 1-D knapsack.</strong> Downward for 0/1, upward for unbounded.</li>
<li><strong>Missing or wrong base cases,</strong> especially for empty prefixes and capacity 0.</li>
<li><strong>Overflow in counting problems.</strong> Use long, or take answers modulo a prime if the problem asks. In Rust, overflow panics in debug builds and wraps silently in release builds; use <code>u64</code> or <code>u128</code>, or <code>checked_add</code> to detect it.</li>
<li><strong>Memoizing with string keys</strong> such as <code>i + "," + j</code> in a HashMap when a 2-D array would be much faster.</li>
<li><strong>Deep memoized recursion</strong> on large inputs causing stack overflow. Convert to tabulation. Rust threads have fixed stacks too, and an overflow there aborts the whole process.</li>
</ul></div>

CH.push({
  id: 'ch20', n: 20, title: 'Complexity Classes',
  lede: 'Some problems have fast algorithms and some, as far as anyone knows, do not. Complexity theory sorts problems by how hard they are, and gives you a way to prove that a new problem is as hard as famous ones nobody can solve efficiently. Recognizing such problems saves you from searching for an algorithm that probably does not exist and points you to practical alternatives.',
  html: `
<h2>Tractable and intractable</h2>
<p>Every algorithm in the earlier chapters runs in <strong>polynomial time</strong>: O(nᵏ) for some fixed k, such as O(n log n) or O(n³). Some problems seem to require <strong>exponential time</strong>, O(2ⁿ) or worse, for every known algorithm. The difference is not a matter of degree. On a machine doing a billion operations per second:</p>
<div class="tbl"><table><tr><th>n</th><th>n³</th><th>2ⁿ</th></tr>
<tr><td class="num">20</td><td>8 microseconds</td><td>1 millisecond</td></tr>
<tr><td class="num">40</td><td>64 microseconds</td><td>18 minutes</td></tr>
<tr><td class="num">60</td><td>0.2 milliseconds</td><td>36 years</td></tr>
<tr><td class="num">100</td><td>1 millisecond</td><td>4 × 10¹³ years, thousands of times the age of the universe</td></tr>
</table></div>
<p>A faster computer barely helps an exponential algorithm: doubling the speed lets it handle n + 1 instead of n. For this reason, polynomial time is the working definition of <strong>tractable</strong>, or efficiently solvable.</p>
<p>The theory is stated for <strong>decision problems</strong>, questions whose answer is yes or no. "What is the shortest tour?" becomes "Is there a tour of length at most L?" This loses little: if you can answer the yes/no version quickly, binary search on L usually recovers the optimal value quickly too.</p>

<h2>The class P</h2>
<p><strong>P</strong> is the set of decision problems that can be <em>solved</em> in polynomial time. Sorting, searching, shortest paths, minimum spanning trees, maximum flow, matching, linear programming and testing whether a number is prime (shown to be in P in 2002) are all in P.</p>

<h2>The class NP</h2>
<p><strong>NP</strong> is the set of decision problems whose "yes" answers can be <em>verified</em> in polynomial time, given a hint called a <strong>certificate</strong>. You may not be able to find the answer quickly, but if someone hands you a proposed solution, you can check it quickly.</p>
${fig('verify', '<b>Figure 20.1</b> Checking a proposed subset takes one pass. Finding one without a hint may require trying exponentially many.')}
<p>Sudoku is the familiar example. Solving a large, hard puzzle can take a long time, but checking a filled grid is easy: each row, column and box must contain each digit once. Other problems in NP:</p>
<ul>
<li><strong>Boolean satisfiability (SAT):</strong> is there an assignment of true/false to the variables that makes a formula true? Certificate: the assignment.</li>
<li><strong>Hamiltonian cycle:</strong> is there a cycle visiting every vertex exactly once? Certificate: the cycle.</li>
<li><strong>Subset sum:</strong> does some subset of these numbers add up to the target? Certificate: the subset.</li>
<li><strong>Graph colouring:</strong> can the vertices be coloured with k colours so no edge joins two of the same colour? Certificate: the colouring.</li>
</ul>
<p>Every problem in P is also in NP: if you can solve it quickly, you can verify an answer by simply solving it. So P ⊆ NP.</p>
<div class="note pit"><b>A common misreading</b><p>NP does not mean "not polynomial". It stands for <em>nondeterministic polynomial time</em>: the problems a hypothetical machine that could guess the right certificate would solve in polynomial time. Many problems in NP are easy; all of P is inside NP.</p></div>

<h2>Reductions</h2>
<p>A <strong>reduction</strong> from problem A to problem B is a polynomial-time way to transform any instance of A into an instance of B that has the same answer. If such a reduction exists, then B is at least as hard as A: any fast algorithm for B would give a fast algorithm for A (transform, then solve). We write A ≤ B.</p>
<p>You have already used reductions as a design tool. Scheduling tasks with dependencies reduces to topological sorting. Currency arbitrage reduces to negative-cycle detection. Complexity theory uses the same idea in the other direction: to show a new problem is <em>hard</em>, reduce a known hard problem <em>to</em> it.</p>
${fig('reduce', '<b>Figure 20.2</b> A set of vertices is independent exactly when the remaining vertices cover every edge. This turns any independent set question into a vertex cover question.')}
<p>Here is a complete reduction. An <strong>independent set</strong> is a set of vertices with no edges between them. A <strong>vertex cover</strong> is a set of vertices that touches every edge. In any graph with n vertices, S is an independent set if and only if the other vertices V − S form a vertex cover. So "is there an independent set of size at least k?" has the same answer as "is there a vertex cover of size at most n − k?". The transformation does nothing but change k, so it takes polynomial time.</p>

<h2>NP-complete problems</h2>
<p>A problem is <strong>NP-hard</strong> if every problem in NP reduces to it: it is at least as hard as anything in NP. A problem is <strong>NP-complete</strong> if it is NP-hard <em>and</em> it is itself in NP. NP-complete problems are the hardest problems whose answers can still be checked quickly.</p>
<p>The first NP-complete problem was found in 1971, when Stephen Cook (and, independently, Leonid Levin) proved that every problem in NP reduces to SAT. The proof shows that the verification process of any NP problem can be written as a Boolean formula that is satisfiable exactly when a valid certificate exists. A year later Richard Karp reduced SAT to 21 other well-known problems, including clique, vertex cover, Hamiltonian cycle, graph colouring and knapsack, showing they are all NP-complete. Thousands more have been found since.</p>
<h3>Proving a problem is NP-complete</h3>
<ol>
<li>Show the problem is in NP: describe a certificate and a polynomial-time check.</li>
<li>Pick a known NP-complete problem and reduce it <em>to</em> your problem in polynomial time.</li>
<li>Prove the reduction preserves answers in both directions: yes maps to yes and no maps to no.</li>
</ol>
<p>The direction of the reduction is the classic mistake. Reducing your problem to SAT only shows your problem is no harder than SAT, which is true of every problem in NP. To show your problem is hard, the known hard problem must be transformed into yours.</p>
<div class="tbl"><table><tr><th>Problem</th><th>Question</th><th>Class</th></tr>
<tr><td>Shortest path</td><td>path of length ≤ k between two vertices?</td><td>P</td></tr>
<tr><td>Minimum spanning tree</td><td>spanning tree of weight ≤ k?</td><td>P</td></tr>
<tr><td>2-SAT</td><td>satisfying assignment, two literals per clause?</td><td>P</td></tr>
<tr><td>Euler circuit</td><td>a cycle using every <em>edge</em> once?</td><td>P</td></tr>
<tr><td>SAT, 3-SAT</td><td>satisfying assignment?</td><td>NP-complete</td></tr>
<tr><td>Hamiltonian cycle</td><td>a cycle visiting every <em>vertex</em> once?</td><td>NP-complete</td></tr>
<tr><td>Travelling salesman (decision)</td><td>a tour of length ≤ k?</td><td>NP-complete</td></tr>
<tr><td>Clique, independent set, vertex cover</td><td>a set of size k with the property?</td><td>NP-complete</td></tr>
<tr><td>Subset sum, 0/1 knapsack (decision)</td><td>reach the target or value?</td><td>NP-complete</td></tr>
<tr><td>Graph 3-colouring</td><td>colour with 3 colours?</td><td>NP-complete</td></tr>
<tr><td>Bin packing (decision)</td><td>fit items into k bins?</td><td>NP-complete</td></tr>
</table></div>
<p>Notice how small the gap can be between easy and hard: 2-SAT is in P but 3-SAT is NP-complete; Euler circuits are easy but Hamiltonian cycles are hard; shortest paths are easy but <em>longest</em> simple paths are hard.</p>

<h2>NP-hard and beyond</h2>
<p>NP-hard problems do not have to be in NP. The optimization version of the travelling salesman problem ("find the shortest tour") is NP-hard, but it is not a yes/no question, so it is not in NP. Some NP-hard problems are much harder still. The <strong>halting problem</strong>, deciding whether an arbitrary program stops, is <strong>undecidable</strong>: Alan Turing proved in 1936 that no algorithm can solve it at all, however much time it is given.</p>
${fig('venn', '<b>Figure 20.3</b> The relationship between the classes, drawn assuming P ≠ NP.')}

<h2>P versus NP</h2>
<p>Is P equal to NP? In other words, if a solution can be checked quickly, can it always be found quickly? Nobody knows. It is the most famous open problem in computer science and one of the seven Millennium Prize Problems, with a one-million-dollar reward for its resolution.</p>
<p>Almost everyone believes P ≠ NP, partly because decades of effort have not produced a fast algorithm for any NP-complete problem. Because all NP-complete problems reduce to each other, a polynomial algorithm for any single one of them would give one for all, and for every problem in NP.</p>
<p>Modern cryptography relies on certain problems being hard on average: factoring large numbers for RSA, discrete logarithms for Diffie-Hellman and elliptic curves. Interestingly, factoring is in NP but is not believed to be NP-complete, and a large quantum computer running Shor's algorithm could factor and compute discrete logarithms efficiently, breaking RSA, Diffie-Hellman and elliptic curves alike. That is why post-quantum cryptography uses different hard problems, based on lattices and hashes.</p>

<h2>Pseudo-polynomial time</h2>
<p>The knapsack DP from Chapter 19 runs in O(n · W). Why is knapsack still NP-complete? Because input size is measured in bits. The capacity W is written with only log W bits, so O(n · W) is O(n · 2^(bits of W)), exponential in the input size. Such algorithms are called <strong>pseudo-polynomial</strong>: fast when the numbers are small, hopeless when they are huge. Problems like this are called weakly NP-complete. Others, such as 3-SAT and the travelling salesman problem, remain hard even when every number in them is small; they are strongly NP-complete.</p>

<h2>What to do with a hard problem</h2>
<p>Proving that a problem is NP-hard is not the end of the work; it tells you which kind of solution to look for.</p>
<ul>
<li><strong>Exploit small inputs.</strong> Exponential is fine for small n. Bitmask DP solves the travelling salesman problem for n ≤ 20 in O(2ⁿ · n²), and backtracking with good pruning handles larger instances in practice.</li>
<li><strong>Exploit special structure.</strong> Many NP-hard graph problems become easy on trees, on bipartite graphs, or when some parameter (such as the answer size k) is small. Vertex cover of size k can be found in O(2ᵏ · (V + E)): one endpoint of any uncovered edge must be in the cover, so branch on the two choices, at most k levels deep.</li>
<li><strong>Approximate with a guarantee.</strong> Taking both endpoints of every edge in a maximal matching gives a vertex cover at most twice the optimal size. Christofides' algorithm gives a tour within 1.5 times optimal for metric travelling salesman.</li>
<li><strong>Use heuristics.</strong> Greedy construction followed by local search (2-opt for routes), simulated annealing and genetic algorithms find good, though not provably optimal, answers quickly.</li>
<li><strong>Use a solver.</strong> Modern SAT solvers and integer linear programming solvers handle industrial instances with millions of variables. Translating your problem into their format is often the most practical approach.</li>
</ul>
<p>Engineering examples are common. Packing containers or virtual machines onto hosts is bin packing. Scheduling jobs with constraints, building exam timetables, choosing the cheapest set of policy rules that covers every requirement (set cover) and planning delivery routes are all NP-hard. Each is solved daily, with the techniques above.</p>

<h2>Applied: hard problems in payment and compliance systems</h2>
<p>NP-hard problems rarely announce themselves. They arrive as ordinary-sounding requirements, and recognizing them tells you to reach for an approximation with a known guarantee instead of searching for an exact, fast algorithm that probably does not exist.</p>
<h3>Packing payments into batches: bin packing</h3>
<p>Suppose a downstream system accepts batches whose total may not exceed a fixed limit, and every batch costs something to send. Using as few batches as possible is <strong>bin packing</strong>, which is NP-hard. The classic approximation is <strong>first-fit decreasing</strong>: sort the payments from largest to smallest and put each one into the first batch with room, opening a new batch only when none has room. Placing the large payments first leaves the small ones to fill the gaps.</p>
${code('FilePacker.java')`
import java.util.*;

public class FilePacker {
  // First-fit decreasing: take payments largest first and put each into the first batch with room.
  // Amounts and the per-batch limit are in cents.
  static List<List<Long>> pack(long[] amounts, long limit) {
    long[] a = amounts.clone();
    Arrays.sort(a);                                          // ascending, so walk it backwards
    List<List<Long>> batches = new ArrayList<>();
    List<Long> room = new ArrayList<>();                     // room.get(b) = space left in batch b
    for (int i = a.length - 1; i >= 0; i--) {
      if (a[i] > limit) throw new IllegalArgumentException("payment above the batch limit: " + a[i]);
      int b = 0;
      while (b < batches.size() && room.get(b) < a[i]) b++;  // the first batch it fits in
      if (b == batches.size()) { batches.add(new ArrayList<>()); room.add(limit); }
      batches.get(b).add(a[i]);
      room.set(b, room.get(b) - a[i]);
    }
    return batches;
  }

  // No packing can use fewer batches than the total divided by the limit, rounded up.
  static long lowerBound(long[] amounts, long limit) {
    long total = Arrays.stream(amounts).sum();
    return (total + limit - 1) / limit;
  }

  public static void main(String[] args) {
    long[] payments = {600_000, 450_000, 400_000, 350_000, 300_000, 250_000, 250_000, 200_000, 150_000, 50_000};
    long limit = 1_000_000;                                  // 10,000.00 per batch
    List<List<Long>> batches = pack(payments, limit);
    System.out.println(batches.size() + " batches, at least " + lowerBound(payments, limit) + ": " + batches);
  }
}
`}
${rs('file_packer.rs')`
// First-fit decreasing: take payments largest first and put each into the first batch with room.
// Amounts and the per-batch limit are in cents.
fn pack(amounts: &[u64], limit: u64) -> Result<Vec<Vec<u64>>, String> {
    let mut a = amounts.to_vec();
    a.sort_unstable_by(|x, y| y.cmp(x));                       // largest first
    let mut batches: Vec<(u64, Vec<u64>)> = Vec::new();        // (space left, payments)
    for x in a {
        if x > limit { return Err(format!("payment above the batch limit: {x}")); }
        match batches.iter_mut().find(|(room, _)| *room >= x) {   // the first batch it fits in
            Some((room, items)) => { *room -= x; items.push(x); }
            None => batches.push((limit - x, vec![x])),
        }
    }
    Ok(batches.into_iter().map(|(_, items)| items).collect())
}

// No packing can use fewer batches than the total divided by the limit, rounded up.
fn lower_bound(amounts: &[u64], limit: u64) -> u64 {
    amounts.iter().sum::<u64>().div_ceil(limit)
}
`}
<p>First-fit decreasing is proven never to use more than 11/9 of the optimal number of batches plus 6/9 of a batch. A cheaper check is often more convincing in practice: no packing can use fewer batches than the total divided by the limit, rounded up. Here that bound is 3 and first-fit decreasing uses 3, so this packing is provably optimal. It is not always: with a limit of 10 and amounts 6, 5, 3, 2, 2 and 2, first-fit decreasing opens three batches, while {6, 2, 2} and {5, 3, 2} need only two. The scan above is O(n × batches); a segment tree over the batches' remaining space finds the first one with room in O(log n).</p>
<h3>Choosing controls: set cover</h3>
<p>A compliance programme has a list of requirements, drawn from standards such as PCI DSS and SOC 2, and a catalogue of controls, each of which satisfies some of them. Picking the fewest controls, or the cheapest, that together satisfy every requirement is <strong>set cover</strong>, which is also NP-hard. The greedy rule repeatedly takes the control that covers the most requirements not yet covered.</p>
${code('ControlCover.java')`
import java.util.*;

public class ControlCover {
  record Control(String name, Set<String> covers) {}

  // Greedy set cover: keep taking the control that covers the most requirements still uncovered.
  static List<String> choose(Set<String> requirements, List<Control> controls) {
    Set<String> uncovered = new HashSet<>(requirements);
    List<String> chosen = new ArrayList<>();
    while (!uncovered.isEmpty()) {
      Control best = null;
      int bestGain = 0;
      for (Control c : controls) {
        int gain = 0;
        for (String r : c.covers()) if (uncovered.contains(r)) gain++;
        if (gain > bestGain) { best = c; bestGain = gain; }
      }
      if (best == null) throw new IllegalArgumentException("no control covers " + uncovered);
      chosen.add(best.name());
      uncovered.removeAll(best.covers());
    }
    return chosen;
  }

  public static void main(String[] args) {
    Set<String> reqs = Set.of("encrypt-at-rest", "encrypt-in-transit", "key-rotation", "mfa", "access-review", "log-retention");
    List<Control> controls = List.of(
        new Control("vendor-suite", Set.of("encrypt-at-rest", "encrypt-in-transit", "mfa", "access-review")),
        new Control("crypto-platform", Set.of("encrypt-at-rest", "encrypt-in-transit", "key-rotation")),
        new Control("identity-platform", Set.of("mfa", "access-review", "log-retention")),
        new Control("siem", Set.of("log-retention")));
    System.out.println(choose(reqs, controls));   // [vendor-suite, crypto-platform, identity-platform]
  }
}
`}
${rs('control_cover.rs')`
use std::collections::BTreeSet;

struct Control { name: &'static str, covers: Vec<&'static str> }

// Greedy set cover: keep taking the control that covers the most requirements still uncovered.
fn choose(requirements: &[&'static str], controls: &[Control]) -> Result<Vec<&'static str>, String> {
    let mut uncovered: BTreeSet<&str> = requirements.iter().copied().collect();
    let mut chosen = Vec::new();
    while !uncovered.is_empty() {
        let gain = |c: &Control| c.covers.iter().filter(|r| uncovered.contains(*r)).count();
        // max_by_key returns the last maximum; rev() makes ties go to the earliest control, as in the Java.
        let best = controls.iter().rev().max_by_key(|c| gain(c)).filter(|c| gain(c) > 0)
            .ok_or_else(|| format!("no control covers {uncovered:?}"))?;
        chosen.push(best.name);
        for r in &best.covers { uncovered.remove(r); }
    }
    Ok(chosen)
}
`}
<p>Greedy is not optimal on this input. It takes vendor-suite first, because it covers four requirements, and then needs two more controls for key-rotation and log-retention, whereas crypto-platform and identity-platform alone cover everything. But greedy has a guarantee: it never uses more than about ln n + 1 times the optimal number of controls, where n is the number of requirements, and the same holds with costs if greedy takes the lowest cost per newly covered requirement. Under standard complexity assumptions no polynomial-time algorithm can promise a ratio much better than ln n, so greedy is close to the best guarantee available. With a few dozen controls, an integer programming solver finds the true optimum quickly.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Reading NP as "not polynomial".</strong> It means verifiable in polynomial time.</li>
<li><strong>Reducing in the wrong direction.</strong> To show X is hard, reduce a known hard problem to X.</li>
<li><strong>Calling a pseudo-polynomial algorithm polynomial.</strong> Measure the input in bits.</li>
<li><strong>Giving up on an NP-hard problem.</strong> Small instances, special structure, approximation and solvers all work in practice.</li>
<li><strong>Assuming hard means hard on every input.</strong> NP-hardness is about the worst case; typical instances are often easy.</li>
<li><strong>Optimizing without a lower bound.</strong> A bound such as total ÷ limit for bin packing tells you how far from optimal an answer can be, and sometimes proves it optimal.</li>
</ul></div>

  lede: 'This last chapter collects the techniques that do not belong to a single data structure but appear in a large share of real problems: bit manipulation, two pointers, sliding windows, prefix sums, sweep lines, range-query trees and sampling. Together with the earlier chapters they complete a working toolkit, and the closing table maps common problem signals to the right tool.',

<h2>Bit manipulation</h2>
<p>Computers store integers in binary. A Java <code>int</code> has 32 bits and a <code>long</code> 64. Working on bits directly gives compact sets, fast arithmetic tricks and the low-level operations used in hashing, compression and cryptography.</p>
<h3>Two's complement</h3>
<p>Java stores negative numbers in <strong>two's complement</strong>: to negate x, flip every bit and add 1. With 8 bits, 5 is 00000101 and −5 is 11111011. The leftmost bit acts as the sign. One consequence is that the range is asymmetric: an int runs from −2³¹ to 2³¹ − 1, so <code>-Integer.MIN_VALUE</code> is still <code>Integer.MIN_VALUE</code>, and <code>Math.abs</code> of it is negative. Rust's signed integers are two's complement too; <code>i32::MIN.abs()</code> panics in a debug build and returns <code>i32::MIN</code> in a release build, while <code>unsigned_abs()</code> returns the correct value as a <code>u32</code>.</p>
<h3>The operators</h3>
<div class="tbl"><table><tr><th>Operator</th><th>Meaning</th><th>Example</th></tr>
<tr><td><code>&amp;</code></td><td>AND: 1 where both are 1</td><td><code>1100 &amp; 1010 = 1000</code></td></tr>
<tr><td><code>|</code></td><td>OR: 1 where either is 1</td><td><code>1100 | 1010 = 1110</code></td></tr>
<tr><td><code>^</code></td><td>XOR: 1 where they differ</td><td><code>1100 ^ 1010 = 0110</code></td></tr>
<tr><td><code>~</code></td><td>NOT: flip every bit</td><td><code>~00001111 = 11110000</code></td></tr>
<tr><td><code>&lt;&lt; k</code></td><td>shift left: multiply by 2ᵏ</td><td><code>0011 &lt;&lt; 2 = 1100</code></td></tr>
<tr><td><code>&gt;&gt; k</code></td><td>arithmetic shift right: divide by 2ᵏ, keeping the sign</td><td><code>-8 &gt;&gt; 1 = -4</code></td></tr>
<tr><td><code>&gt;&gt;&gt; k</code></td><td>logical shift right: fill with zeros</td><td><code>-8 &gt;&gt;&gt; 28 = 15</code></td></tr>
</table></div>
<p>Rust has the same operators with two differences. There is no <code>&gt;&gt;&gt;</code>: <code>&gt;&gt;</code> is arithmetic on signed types and logical on unsigned ones, so cast to <code>u32</code> to get Java's <code>&gt;&gt;&gt;</code>. And bitwise NOT is written <code>!x</code>, not <code>~x</code>.</p>
<p>Click the bits below to change x and watch the common tricks update.</p>
${fig('bits', '<b>Figure 21.1</b> An 8-bit value and the results of common bit tricks. Click a bit to flip it.')}

// Every value appears twice except one: XOR everything; the pairs cancel.
fn single_number(a: &[i32]) -> i32 { a.iter().fold(0, |r, &x| r ^ x) }

// Count set bits by repeatedly clearing the lowest one (Kernighan's method). The library call is x.count_ones().
fn popcount(mut x: u32) -> u32 {
    let mut c = 0;
    while x != 0 { x &= x - 1; c += 1; }
    c
}

// Permissions as a bit set.
const READ: u8 = 1;
const WRITE: u8 = 1 << 1;
const EXEC: u8 = 1 << 2;

fn can_write(perms: u8) -> bool { perms & WRITE != 0 }   // Rust's & binds tighter than !=, unlike Java's
// can_write(READ | EXEC) == false

// Enumerate all subsets of n items: each mask from 0 to 2^n - 1 is one subset.
fn subsets(a: &[i32]) {
    let n = a.len();
    for mask in 0u32..1 << n {
        let s: Vec<i32> = (0..n).filter(|&i| (mask >> i) & 1 == 1).map(|i| a[i]).collect();
        println!("{s:?}");
    }
}
