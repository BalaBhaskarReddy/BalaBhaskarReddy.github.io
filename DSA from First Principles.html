CH.push({
  id: 'ch11', n: 11, title: 'Searching',
  lede: 'Searching means finding where a value is, or proving it is absent. On unordered data the only option is to look at everything. On ordered data, binary search finds any value among a billion in about thirty steps, and the same idea solves a surprising range of problems that do not look like searching at all.',
  html: `
<h2>Linear search</h2>
<p>When the data has no order, the only way to find a value is to examine elements one by one until you find it or run out. That costs O(n) in the worst and average case and O(1) in the best case.</p>
${code('Linear search')`
static int linearSearch(int[] a, int target) {
  for (int i = 0; i < a.length; i++) if (a[i] == target) return i;
  return -1;
}`}
${rs('linear_search.rs')`
fn linear_search(a: &[i32], target: i32) -> Option<usize> {
    a.iter().position(|&x| x == target)        // None instead of -1
}
`}
<p>Linear search is the right choice when you search only once (sorting first would cost more), when the data is tiny, or when the data is a stream you cannot store. If you search the same data many times, sort it once or build an index such as a hash table (Chapter 14) and every later search becomes much cheaper.</p>

<h2>Binary search</h2>
<p>When the array is sorted, one comparison tells you far more. Look at the middle element. If it equals the target, you are done. If it is smaller, the target can only be to its right, so the entire left half is ruled out. If it is larger, the right half is ruled out. Each step halves the range of candidates.</p>
${fig('binsearch', '<b>Figure 11.1</b> Binary search for 23 in a sorted array of ten values. Each probe rules out half of what remains.')}
${code('BinarySearch.java')`
static int binarySearch(int[] a, int target) {
  int lo = 0, hi = a.length - 1;          // invariant: if target is present, it is in a[lo..hi]
  while (lo <= hi) {
    int mid = lo + (hi - lo) / 2;         // avoids int overflow of (lo + hi)
    if (a[mid] == target) return mid;
    if (a[mid] < target) lo = mid + 1;    // target is right of mid
    else hi = mid - 1;                    // target is left of mid
  }
  return -1;                              // the range is empty: not present
}`}
${rs('binary_search.rs')`
use std::cmp::Ordering;

fn binary_search(a: &[i32], target: i32) -> Option<usize> {
    let (mut lo, mut hi) = (0, a.len());       // half-open: if target is present, it is in a[lo..hi]
    while lo < hi {
        let mid = lo + (hi - lo) / 2;          // no overflow
        match a[mid].cmp(&target) {
            Ordering::Equal => return Some(mid),
            Ordering::Less => lo = mid + 1,    // target is right of mid
            Ordering::Greater => hi = mid,     // target is left of mid
        }
    }
    None                                       // the range is empty: not present
}
`}
<p>After k probes at most n / 2ᵏ candidates remain, so the loop runs at most ⌊log₂n⌋ + 1 times. For a million elements that is 20 probes; for a billion, 30. The recurrence is T(n) = T(n/2) + 1 = O(log n).</p>
<h3>Getting the boundaries right</h3>
<p>Binary search is famously easy to get subtly wrong. Write down the <strong>invariant</strong> before you write the loop, and make every line preserve it:</p>
<ul>
<li>The version above uses a <em>closed</em> range [lo, hi]. The loop runs while the range is non-empty (<code>lo &lt;= hi</code>), and both updates exclude mid because mid has been checked.</li>
<li>Another common version uses a <em>half-open</em> range [lo, hi). The loop runs while <code>lo &lt; hi</code>, and an update that keeps mid as a candidate sets <code>hi = mid</code>.</li>
<li>Mixing the two conventions causes infinite loops (the range stops shrinking) or skipped elements.</li>
<li>In Rust, indices are <code>usize</code>, and <code>hi = mid - 1</code> underflows when mid is 0, so the Rust listings use the half-open form throughout.</li>
</ul>
<div class="note pit"><b>The overflow bug</b><p>For decades many textbook and library implementations computed <code>mid = (lo + hi) / 2</code>. With arrays of more than about a billion elements, <code>lo + hi</code> exceeds the largest int and becomes negative. Java's own <code>Arrays.binarySearch</code> had this bug until 2006. Write <code>lo + (hi - lo) / 2</code> or <code>(lo + hi) &gt;&gt;&gt; 1</code>. In Rust the same overflow on <code>usize</code> panics in a debug build and wraps in a release build; the same fix applies.</p></div>

<h2>Lower bound and upper bound</h2>
<p>When the array contains duplicates, "find an index of 5" is not very useful. You usually want the <em>first</em> position of 5, the <em>last</em> position, or where 5 would be inserted to keep the array sorted. Two functions answer all of these:</p>
<ul>
<li><strong>lowerBound(x)</strong>: the first index i with a[i] ≥ x.</li>
<li><strong>upperBound(x)</strong>: the first index i with a[i] &gt; x.</li>
</ul>
${fig('lowerbound', '<b>Figure 11.2</b> Lower bound for 5 in an array with three 5s. The range never excludes a possible answer, and it shrinks until lo and hi meet.')}
${code('Bounds')`
// First index with a[i] >= x, or a.length if there is none.
static int lowerBound(int[] a, int x) {
  int lo = 0, hi = a.length;             // answer is in [lo, hi]
  while (lo < hi) {
    int mid = (lo + hi) >>> 1;
    if (a[mid] < x) lo = mid + 1;        // mid is too small to be the answer
    else hi = mid;                       // mid might be the answer
  }
  return lo;
}
// First index with a[i] > x.
static int upperBound(int[] a, int x) {
  int lo = 0, hi = a.length;
  while (lo < hi) {
    int mid = (lo + hi) >>> 1;
    if (a[mid] <= x) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}`}
${rs('bounds.rs')`
// First index with a[i] >= x, or a.len() if there is none.
fn lower_bound(a: &[i32], x: i32) -> usize {
    let (mut lo, mut hi) = (0, a.len());       // answer is in [lo, hi]
    while lo < hi {
        let mid = lo + (hi - lo) / 2;
        if a[mid] < x { lo = mid + 1 } else { hi = mid }   // too small, or might be the answer
    }
    lo
}
// First index with a[i] > x: the standard library's partition_point runs the same loop.
fn upper_bound(a: &[i32], x: i32) -> usize {
    a.partition_point(|&v| v <= x)
}
`}
<p>From these two you get everything else: x is present if <code>lowerBound(x) &lt; n</code> and <code>a[lowerBound(x)] == x</code>; the last occurrence is <code>upperBound(x) − 1</code>; the number of occurrences is <code>upperBound(x) − lowerBound(x)</code>; and the number of values in [lo, hi] is <code>upperBound(hi) − lowerBound(lo)</code>.</p>
<p>Java's <code>Arrays.binarySearch</code> returns the index of <em>some</em> matching element, not necessarily the first, and when the key is absent it returns <code>−(insertionPoint) − 1</code>. For ordered maps, <code>TreeMap.floorKey</code> and <code>ceilingKey</code> give the same answers on a dynamic set.</p>
<p>Rust's <code>slice::binary_search</code> returns a <code>Result&lt;usize, usize&gt;</code>: <code>Ok(i)</code> with the index of some match (again not necessarily the first) or <code>Err(i)</code> with the insertion point. <code>partition_point(pred)</code> is the general form of both bounds: it returns the first index at which the predicate becomes false, so lowerBound(x) is <code>partition_point(|&amp;v| v &lt; x)</code>. On a <code>BTreeMap</code>, <code>range</code> answers floor and ceiling.</p>

<h2>Binary search on the answer</h2>
<p>Binary search does not need an array. It needs a <strong>monotone predicate</strong>: a yes/no question about a number x whose answer is "no" for all small x and "yes" for all large x (or the reverse). Binary search finds the boundary between them.</p>
${fig('predicate', '<b>Figure 11.3</b> "Can we ship all the packages within 5 days at this capacity?" Once the answer becomes yes, it stays yes for every larger capacity.')}
<p>Consider: packages with given weights must be shipped in order within D days, and each day the ship carries at most C. What is the smallest C that works? Checking a particular C is easy (simulate the days greedily). The answer is "no" for small capacities and "yes" for large ones. So binary search over C between the heaviest single package and the total weight.</p>
${code('Ship within D days (LeetCode 1011)')`
static int minCapacity(int[] w, int days) {
  int lo = 0, hi = 0;
  for (int x : w) { lo = Math.max(lo, x); hi += x; }        // the answer lies in [max, sum]
  while (lo < hi) {
    int cap = (lo + hi) >>> 1;
    if (feasible(w, days, cap)) hi = cap;                   // works: try smaller
    else lo = cap + 1;                                      // fails: need more
  }
  return lo;
}
static boolean feasible(int[] w, int days, int cap) {
  int need = 1, load = 0;
  for (int x : w) {
    if (load + x > cap) { need++; load = 0; }               // start a new day
    load += x;
  }
  return need <= days;
}`}
${rs('ship_within_days.rs')`
fn min_capacity(w: &[u64], days: u32) -> u64 {
    let mut lo = w.iter().copied().max().unwrap_or(0);   // the answer lies in [max, sum]
    let mut hi = w.iter().sum();                         // u64: no overflow for realistic inputs
    while lo < hi {
        let cap = lo + (hi - lo) / 2;
        if feasible(w, days, cap) { hi = cap } else { lo = cap + 1 }   // works: try smaller
    }
    lo
}

fn feasible(w: &[u64], days: u32, cap: u64) -> bool {
    let (mut need, mut load) = (1, 0);
    for &x in w {
        if load + x > cap { need += 1; load = 0; }       // start a new day
        load += x;
    }
    need <= days
}
`}
<p>The cost is O(n · log(sum)): about log₂(sum) feasibility checks, each linear. (The Java version sums into an int, which is fine for this problem's limits; the Rust version sums into a <code>u64</code>.) This pattern answers questions of the form "what is the minimum X such that something is possible" or "the maximum X such that something still holds": minimum speed, minimum time, maximum distance, smallest largest sum. Whenever you can check a candidate answer quickly and the check is monotone, think of this pattern.</p>
<h3>Binary search on real numbers</h3>
<p>For continuous answers, such as a square root, loop a fixed number of times (say 100 iterations) or until hi − lo is below a tolerance. Each iteration halves the interval, so 60 iterations reach double-precision accuracy from any reasonable range.</p>

<h2>Searching rotated and unusual arrays</h2>
<h3>A rotated sorted array</h3>
<p>A sorted array rotated at an unknown point, such as [15, 18, 22, 30, 2, 5, 9, 12], is no longer sorted overall, but it is made of two sorted runs. At any mid, at least one of the halves [lo..mid] or [mid..hi] is sorted, and you can tell which by comparing a[lo] with a[mid].</p>
${fig('rotated', '<b>Figure 11.4</b> In a rotated array, one side of any midpoint is a normal sorted run.')}
${code('Search in Rotated Sorted Array (LeetCode 33)')`
static int searchRotated(int[] a, int t) {
  int lo = 0, hi = a.length - 1;
  while (lo <= hi) {
    int mid = (lo + hi) >>> 1;
    if (a[mid] == t) return mid;
    if (a[lo] <= a[mid]) {                         // left half is sorted
      if (a[lo] <= t && t < a[mid]) hi = mid - 1;  // t lies inside it
      else lo = mid + 1;
    } else {                                       // right half is sorted
      if (a[mid] < t && t <= a[hi]) lo = mid + 1;
      else hi = mid - 1;
    }
  }
  return -1;
}`}
${rs('search_rotated.rs')`
fn search_rotated(a: &[i32], t: i32) -> Option<usize> {
    let (mut lo, mut hi) = (0, a.len());               // half-open range a[lo..hi]
    while lo < hi {
        let mid = lo + (hi - lo) / 2;
        if a[mid] == t { return Some(mid); }
        if a[lo] <= a[mid] {                           // left part a[lo..=mid] is sorted
            if a[lo] <= t && t < a[mid] { hi = mid } else { lo = mid + 1 }
        } else if a[mid] < t && t <= a[hi - 1] {       // right part a[mid..hi] is sorted
            lo = mid + 1;                              // and t lies inside it
        } else {
            hi = mid;
        }
    }
    None
}
`}
<h3>A sorted 2D matrix</h3>
<p>If every row is sorted and each row starts after the previous row ends, the matrix is really one sorted array of length rows × cols; map index k to (k / cols, k % cols) and binary search. If rows and columns are each sorted but rows overlap, start at the top-right corner: if the value is too large move left, if too small move down. That takes O(rows + cols).</p>
<h3>Peak finding</h3>
<p>A "peak" is an element larger than its neighbours. Even in an unsorted array you can find one in O(log n): if a[mid] &lt; a[mid + 1], a peak must exist to the right, because the values rise there; otherwise one exists at mid or to its left.</p>

<h2>Other search strategies</h2>
<ul>
<li><strong>Exponential search</strong> finds a range for an unbounded or very large sorted input by checking indices 1, 2, 4, 8, … until it passes the target, then binary searches inside. It costs O(log i), where i is the target's position.</li>
<li><strong>Interpolation search</strong> guesses the position from the value, as you do with a phone book: a name starting with "W" is near the end. On uniformly distributed keys it averages O(log log n), but it degrades to O(n) on skewed data.</li>
<li><strong>Ternary search</strong> finds the maximum of a function that rises and then falls (unimodal) by comparing values at two interior points and discarding a third of the range each step.</li>
<li><strong>Hash lookup</strong> (Chapter 14) answers "is x present?" in O(1) expected time but cannot answer ordered questions such as the nearest value.</li>
<li><strong>Tree lookup</strong> (Chapter 6) answers both exact and ordered questions in O(log n) on data that changes.</li>
</ul>
<div class="tbl"><table><tr><th>Method</th><th>Requires</th><th>Time</th><th>Answers ordered questions</th></tr>
<tr><td>Linear search</td><td>nothing</td><td class="num">O(n)</td><td>yes, by scanning</td></tr>
<tr><td>Binary search</td><td>sorted array or monotone predicate</td><td class="num">O(log n)</td><td>yes</td></tr>
<tr><td>Exponential search</td><td>sorted, possibly unbounded</td><td class="num">O(log i)</td><td>yes</td></tr>
<tr><td>Interpolation search</td><td>sorted, uniform values</td><td class="num">O(log log n) average</td><td>yes</td></tr>
<tr><td>Hash table</td><td>hashable keys</td><td class="num">O(1) expected</td><td>no</td></tr>
<tr><td>Balanced BST (TreeMap)</td><td>comparable keys</td><td class="num">O(log n)</td><td>yes, with updates</td></tr>
</table></div>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Infinite loops</strong> from <code>lo = mid</code> in a loop with <code>lo &lt; hi</code>. When the range has two elements, mid equals lo and nothing changes. Use <code>lo = mid + 1</code>, or round mid up.</li>
<li><strong>Overflow in mid.</strong> Use <code>lo + (hi - lo) / 2</code>.</li>
<li><strong>Searching unsorted data.</strong> Binary search on unsorted input returns garbage without any error.</li>
<li><strong>A predicate that is not monotone.</strong> Binary search on the answer only works if "yes" never turns back into "no".</li>
<li><strong>Wrong initial range</strong> for search on the answer. Make sure the true answer is inside [lo, hi] before the loop starts.</li>
</ul></div>

<div class="practice">

CH.push({
  id: 'ch12', n: 12, title: 'Selection and Medians',
  lede: 'Selection asks for the element of a given rank: the smallest, the 10th largest, the median, the 99th percentile. Sorting answers it in O(n log n), but sorting does far more work than the question needs. This chapter finds any rank in linear time, first on average with quickselect, then in the worst case with the median of medians.',
  html: `
<h2>The selection problem</h2>
<p>Given n values and a rank k, find the value that would be at index k if the values were sorted. Rank 0 is the minimum, rank n − 1 is the maximum, and rank ⌊n/2⌋ is the <strong>median</strong>. Percentiles are ranks too: the 99th percentile of a million latencies is, by the common nearest-rank definition, the 990,000th smallest value: rank 989,999 when counting from 0.</p>
<p>Medians and percentiles matter because they resist outliers. If one request in a million takes an hour, the mean latency jumps, but the median does not move. Service-level objectives are usually stated as percentiles for this reason.</p>
<p>The minimum and maximum take one pass, O(n). Finding both at once can even be done with only about 1.5n comparisons by examining elements in pairs. The interesting question is whether a <em>middle</em> rank can also be found in linear time.</p>

<h2>Four approaches</h2>
<div class="tbl"><table><tr><th>Approach</th><th>Time</th><th>Extra space</th><th>When to use</th></tr>
<tr><td>Sort, then index</td><td class="num">O(n log n)</td><td class="num">O(1) to O(n)</td><td>simple; fine for small inputs or many queries on the same data</td></tr>
<tr><td>Heap of size k</td><td class="num">O(n log k)</td><td class="num">O(k)</td><td>streams, small k, data larger than memory</td></tr>
<tr><td>Quickselect</td><td class="num">O(n) average, O(n²) worst</td><td class="num">O(1)</td><td>the default for in-memory arrays</td></tr>
<tr><td>Median of medians</td><td class="num">O(n) worst case</td><td class="num">O(log n)</td><td>when a guarantee matters; as a fallback inside quickselect</td></tr>
</table></div>
<p>The heap approach was covered in Chapter 7: to find the kth largest, keep a min-heap of the k largest values seen so far. The rest of this chapter is about the other two.</p>

<h2>Quickselect</h2>
<p>Quickselect is quicksort with one recursive call removed. Partition the array around a pivot, as in Chapter 10. The pivot lands at its final sorted position p. If p equals k, the pivot is the answer. If k is smaller, the answer is in the left part; if larger, in the right part. Recurse only into the part that contains k. The other part is never looked at again.</p>
${fig('quickselect', '<b>Figure 12.1</b> Quickselect finding the median of nine values. After each partition, the side that cannot contain rank k is discarded.')}
${code('QuickSelect.java')`
private static final Random RNG = new Random();

/** Returns the element of rank k (0-based). Reorders the array. */
static int quickselect(int[] a, int k) {
  int lo = 0, hi = a.length - 1;
  while (lo < hi) {
    int p = partition(a, lo, hi, lo + RNG.nextInt(hi - lo + 1));
    if (p == k) return a[p];
    if (k < p) hi = p - 1;        // answer is on the left
    else lo = p + 1;              // answer is on the right
  }
  return a[lo];
}

// Lomuto partition around a[pivotIndex]; returns the pivot's final index.
static int partition(int[] a, int lo, int hi, int pivotIndex) {
  int pivot = a[pivotIndex];
  swap(a, pivotIndex, hi);
  int store = lo;
  for (int i = lo; i < hi; i++) if (a[i] < pivot) swap(a, store++, i);
  swap(a, store, hi);
  return store;
}

static int kthLargest(int[] a, int k) { return quickselect(a, a.length - k); }   // k = 1 is the maximum`}
${rs('quickselect.rs')`
use std::cmp::Ordering;

/// Returns the element of rank k (0-based). Reorders the slice. Expects k < a.len().
fn quickselect<T: Ord + Copy>(a: &mut [T], k: usize) -> T {
    let (mut lo, mut hi) = (0, a.len());             // the answer is in a[lo..hi]
    while hi - lo > 1 {
        let pivot = rand::random_range(0..hi - lo);
        let p = lo + partition(&mut a[lo..hi], pivot);
        match k.cmp(&p) {
            Ordering::Equal => return a[p],
            Ordering::Less => hi = p,                // answer is on the left
            Ordering::Greater => lo = p + 1,         // answer is on the right
        }
    }
    a[lo]
}

// Lomuto partition around a[pivot]; returns the pivot's final index.
fn partition<T: Ord>(a: &mut [T], pivot: usize) -> usize {
    let last = a.len() - 1;
    a.swap(pivot, last);
    let mut store = 0;
    for i in 0..last {
        if a[i] < a[last] { a.swap(store, i); store += 1; }
    }
    a.swap(store, last);
    store
}

// The standard library already provides selection: select_nth_unstable.
fn kth_largest(a: &mut [i32], k: usize) -> i32 {     // k = 1 is the maximum
    *a.select_nth_unstable(a.len() - k).1            // returns (left part, &mut element, right part)
}
`}
<h3>Why it is linear on average</h3>
<p>With a random pivot, the pivot lands somewhere uniformly random in the range. Half the time it lands in the middle half, which throws away at least a quarter of the elements. So, on average, the problem shrinks by a constant factor every couple of partitions, and the work forms a geometric series:</p>
<div class="formula">n + (3/4)n + (3/4)²n + …  ≤  4n  =  O(n)</div>
<p>A more careful calculation gives an expected cost of at most about 3.4n comparisons for the median. Compare that with quicksort, which must recurse into <em>both</em> sides and therefore pays n at every one of log n levels.</p>
<p>The worst case is still O(n²): if every pivot is the smallest or largest element, each partition removes only one element. Random pivots make this astronomically unlikely, but an adversary who knows your pivot rule can trigger it. When that matters, you need a pivot that is guaranteed to be good.</p>

<h2>Median of medians</h2>
<p>In 1973, Blum, Floyd, Pratt, Rivest and Tarjan showed how to pick a pivot that is never too close to either end, which makes selection O(n) in the worst case. The procedure is:</p>
<ol>
<li>Split the n elements into groups of 5.</li>
<li>Find the median of each group by sorting its five elements. This costs O(1) per group, so O(n) in total.</li>
<li>Recursively find the median of those n/5 medians. Call it p.</li>
<li>Partition around p and recurse into the side that contains rank k, exactly as in quickselect.</li>
</ol>
${fig('mom', '<b>Figure 12.2</b> 25 values in five sorted groups, with the groups ordered by their medians. The pivot p is at the centre. Everything up and to the left is ≤ p; everything down and to the right is ≥ p.')}
<h3>Why the pivot is good</h3>
<p>Look at the figure. Half of the group medians are ≤ p, and in each of those groups, the median and the two elements below it are ≤ p. That is 3 elements in each of about n/10 groups, so at least about 3n/10 elements are ≤ p. By the same argument, at least about 3n/10 are ≥ p. Therefore each side of the partition has at most about 7n/10 elements, no matter what the input is.</p>
<p>The running time satisfies:</p>
<div class="formula">T(n) ≤ T(n/5)  +  T(7n/10)  +  O(n)
        ↑ median of medians   ↑ recurse into one side   ↑ grouping and partitioning</div>
<p>Because 1/5 + 7/10 = 9/10 is less than 1, the work at each level of recursion shrinks by a factor of 0.9, and the total is a geometric series bounded by 10 · O(n) = O(n). That is why the group size is 5: with groups of 3 the fractions add up to exactly 1 and the bound becomes O(n log n).</p>
${code('MedianOfMedians.java')`
/** Element of rank k in a[lo..hi], worst-case O(n). Reorders the array. */
static int select(int[] a, int lo, int hi, int k) {
  while (true) {
    if (hi - lo < 5) { Arrays.sort(a, lo, hi + 1); return a[k]; }
    int m = lo;                                          // move each group median to the front
    for (int i = lo; i <= hi; i += 5) {
      int end = Math.min(i + 4, hi);
      Arrays.sort(a, i, end + 1);                        // sorting 5 items is O(1)
      swap(a, m++, (i + end) >>> 1);
    }
    int mid = (lo + m - 1) >>> 1;
    select(a, lo, m - 1, mid);                           // a[mid] becomes the median of medians
    int p = partition(a, lo, hi, mid);
    if (k == p) return a[p];
    if (k < p) hi = p - 1; else lo = p + 1;
  }
}`}
${rs('median_of_medians.rs')`
/// Element of rank k in a, worst-case O(n). Reorders the slice so that a[k] holds it.
fn select<T: Ord + Copy>(a: &mut [T], k: usize) -> T {
    let (mut lo, mut hi) = (0, a.len());               // the answer is in a[lo..hi]
    loop {
        let s = &mut a[lo..hi];
        if s.len() <= 5 { s.sort_unstable(); return a[k]; }
        let mut m = 0;                                 // move each group median to the front
        for g in (0..s.len()).step_by(5) {
            let end = (g + 5).min(s.len());
            s[g..end].sort_unstable();                 // sorting 5 items is O(1)
            s.swap(m, (g + end - 1) / 2);
            m += 1;
        }
        let mid = (m - 1) / 2;
        select(&mut s[..m], mid);                      // s[mid] becomes the median of medians
        let p = lo + partition(s, mid);
        match k.cmp(&p) {
            Ordering::Equal => return a[p],
            Ordering::Less => hi = p,
            Ordering::Greater => lo = p + 1,
        }
    }
}
`}
<p>The constant factor is large, so in practice median of medians is slower than randomized quickselect. Its main use is as a safety net. <strong>Introselect</strong> runs quickselect normally and switches to median of medians only if the partitions keep coming out unbalanced, giving quickselect's speed with a worst-case guarantee. Library implementations differ in the fallback. Rust's <code>select_nth_unstable</code> is introselect with a median-of-medians fallback, so it is O(n) in the worst case. The C++ standard asks <code>std::nth_element</code> only for linear time on average, and GCC's library, for example, falls back to heap selection, which bounds the worst case at O(n log n) rather than O(n). Java's standard library has no selection method; copy and sort, or write quickselect.</p>

<h2>Medians of a stream</h2>
<p>When values arrive one at a time and you need the median after each arrival, re-running selection each time would cost O(n) per query. Instead keep two heaps:</p>
<ul>
<li>a <strong>max-heap</strong> holding the smaller half of the values, and</li>
<li>a <strong>min-heap</strong> holding the larger half,</li>
</ul>
<p>with every value in the max-heap ≤ every value in the min-heap, and sizes that differ by at most one. The median is the top of the larger heap, or the average of both tops when the sizes are equal.</p>
${fig('twoheaps', '<b>Figure 12.3</b> The running median after seven values. The two heap tops sit on either side of the middle.')}
${code('MedianFinder.java')`
class MedianFinder {
  private final PriorityQueue<Integer> low = new PriorityQueue<>(Comparator.reverseOrder());  // max-heap
  private final PriorityQueue<Integer> high = new PriorityQueue<>();                          // min-heap

  void add(int x) {
    low.offer(x);
    high.offer(low.poll());                       // move the largest of the low half up
    if (high.size() > low.size()) low.offer(high.poll());   // keep low.size() >= high.size()
  }
  double median() {
    return low.size() > high.size() ? low.peek() : (low.peek() + (long) high.peek()) / 2.0;   // long: no int overflow
  }
}`}
${rs('median_finder.rs')`
use std::cmp::Reverse;
use std::collections::BinaryHeap;

#[derive(Default)]
struct MedianFinder {
    low: BinaryHeap<i32>,              // max-heap: the smaller half
    high: BinaryHeap<Reverse<i32>>,    // min-heap: the larger half
}

impl MedianFinder {
    fn add(&mut self, x: i32) {
        self.low.push(x);
        let top = self.low.pop().expect("just pushed");
        self.high.push(Reverse(top));                       // move the largest of the low half up
        if self.high.len() > self.low.len() {
            let Reverse(y) = self.high.pop().expect("not empty");
            self.low.push(y);                               // keep low.len() >= high.len()
        }
    }
    fn median(&self) -> Option<f64> {                       // None until the first add
        let lo = f64::from(*self.low.peek()?);
        Some(match self.high.peek() {
            Some(&Reverse(hi)) if self.low.len() == self.high.len() => (lo + f64::from(hi)) / 2.0,
            _ => lo,                                        // f64 sums cannot overflow here
        })
    }
}
`}
<p>Rust's <code>BinaryHeap</code> is a max-heap, so the upper half wraps its values in <code>std::cmp::Reverse</code> to turn it into a min-heap. Each insertion costs O(log n) and each median query O(1). For a sliding window (the median of the last k values), you also need to delete values that leave the window; use two <code>TreeMap</code>s with counts, or two heaps with lazy deletion.</p>
<h3>Approximate quantiles</h3>
<p>Monitoring systems handle billions of values and cannot keep them all. They use sketches such as t-digest, KLL or HDR histograms, which keep a small summary and report any percentile within a known error bound. The exact algorithms in this chapter are the foundation those approximations are measured against.</p>

<h2>Weighted medians and k closest</h2>
<p>Selection shows up inside other problems. The point on a line that minimizes the total distance to a set of points is their median; this is why a warehouse or meeting point is placed at the median, not the mean. When the points carry weights, such as trades with volumes or depots with order counts, the point that minimizes the total weighted distance is the <strong>weighted median</strong>: the smallest value at which the items at or below it carry at least half of the total weight. For trades at 99, 100, 101 and 102 with volumes 10, 30, 5 and 5, the volume-weighted median price is 100, where most of the volume traded; the plain median of the four prices would be 100.5.</p>
${code('WeightedMedian.java')`
/** Smallest value x such that the items with value <= x carry at least half of the total weight. */
static long weightedMedian(long[] values, long[] weights) {
  Integer[] order = new Integer[values.length];
  for (int i = 0; i < order.length; i++) order[i] = i;
  Arrays.sort(order, Comparator.comparingLong(i -> values[i]));   // indices by value
  long total = 0;
  for (long w : weights) total += w;
  long acc = 0;
  for (int i : order) {
    acc += weights[i];                                            // running weight
    if (2 * acc >= total) return values[i];                       // half the weight is at or below this value
  }
  throw new IllegalArgumentException("no items");
}
`}
${rs('weighted_median.rs')`
/// Smallest value x such that the items with value <= x carry at least half of the total weight.
fn weighted_median(items: &mut [(i64, u64)]) -> Option<i64> {       // (value, weight)
    items.sort_unstable_by_key(|&(value, _)| value);
    let total: u64 = items.iter().map(|&(_, w)| w).sum();
    items.iter()
        .scan(0, |acc, &(value, w)| { *acc += w; Some((value, *acc)) })   // running weight
        .find(|&(_, acc)| 2 * acc >= total)              // half the weight is at or below this value
        .map(|(value, _)| value)
}
`}
<p>Sorting makes this O(n log n). A selection-style version runs in O(n) on average: partition around a random pivot, compare the weight on its left with half the total, and continue only into the side that holds the answer, carrying the weight already passed. To find the k points closest to the origin, use quickselect on the squared distances: the k elements left of position k are the answer, in O(n) average time.</p>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Mixing up 0-based and 1-based ranks.</strong> "The kth largest" with k = 1 is the maximum, which is rank n − 1.</li>
<li><strong>Forgetting quickselect reorders the input.</strong> Copy the array first if the caller still needs the original order.</li>
<li><strong>A fixed pivot.</strong> Sorted or adversarial input makes quickselect quadratic. Pick the pivot at random.</li>
<li><strong>Two-heap imbalance.</strong> Rebalance after every insertion, and decide which heap holds the extra element when the count is odd.</li>
<li><strong>Integer overflow when averaging</strong> two middle values: convert to long or double before adding, <code>((long) a + b) / 2.0</code>. The index trick <code>a + (b - a) / 2</code> is not enough here, because b − a itself overflows when a is a large negative value.</li>
</ul></div>

<h2>Practice</h2>
<div class="practice">

<details><summary>Top K Frequent Elements (347)</summary><p>Count, then quickselect on the counts, or bucket by frequency.</p></details>
<details><summary>K Closest Points to Origin (973)</summary><p>Quickselect on squared distances.</p></details>
<details><summary>Wiggle Sort II (324)</summary><p>Find the median with quickselect, then three-way partition with virtual indexing.</p></details>
<details><summary>Minimum Moves to Equal Array Elements II (462)</summary><p>Move everything to the median.</p></details>
<details><summary>Weighted median in O(n) average time</summary><p>Partition (value, weight) pairs around a random pivot. Let L be the total weight strictly left of the pivot, plus the weight already discarded on the left. If 2(L + pivot weight) ≥ total and 2L &lt; total, the pivot is the answer; if 2L ≥ total, recurse left; otherwise add the left weight and the pivot's to the carried weight and recurse right.</p></details></div>

CH.push({
  id: 'ch13', n: 13, title: 'Symbol Tables',
  lede: 'A symbol table associates keys with values: a word with its definition, an account number with its balance, a host name with an address. It is probably the most used data structure in software. This chapter defines the ADT, compares the ways to implement it, and shows how to choose between them.',
  html: `
<h2>The symbol table ADT</h2>
<p>A <strong>symbol table</strong>, also called a map, dictionary or associative array, stores <strong>key-value pairs</strong> and lets you look up a value by its key. The name comes from compilers, which keep a table mapping each identifier (a symbol) to its type, scope and memory location. The same idea is everywhere: a DNS cache maps names to addresses, a session store maps tokens to users, a configuration maps setting names to values, and a ledger index maps account numbers to balances.</p>
<p>Two rules define the basic ADT:</p>
<ul>
<li>Keys are unique. Putting a pair whose key is already present replaces the old value.</li>
<li>Looking up a key that is absent returns a signal such as <code>null</code> rather than failing.</li>
</ul>
<div class="tbl"><table><tr><th>Operation</th><th>Meaning</th></tr>
<tr><td><code>put(key, value)</code></td><td>associate value with key, replacing any previous value</td></tr>
<tr><td><code>get(key)</code></td><td>the value for key, or null if absent</td></tr>
<tr><td><code>delete(key)</code></td><td>remove the pair with this key</td></tr>
<tr><td><code>contains(key)</code>, <code>size()</code>, <code>isEmpty()</code></td><td>inspect</td></tr>
<tr><td><code>keys()</code></td><td>iterate over all keys</td></tr>
</table></div>

<h3>Ordered symbol tables</h3>
<p>When keys have a natural order (numbers, strings, dates), a symbol table can answer far richer questions. These <strong>ordered operations</strong> are the reason to prefer a tree over a hash table in many designs.</p>
<div class="tbl"><table><tr><th>Operation</th><th>Meaning</th><th>Example use</th></tr>
<tr><td><code>min()</code>, <code>max()</code></td><td>smallest and largest key</td><td>earliest timestamp, best price</td></tr>
<tr><td><code>floor(k)</code>, <code>ceiling(k)</code></td><td>largest key ≤ k, smallest key ≥ k</td><td>the tax bracket for an income; the next scheduled event</td></tr>
<tr><td><code>rank(k)</code></td><td>number of keys smaller than k</td><td>percentile of a score</td></tr>
<tr><td><code>select(i)</code></td><td>the key of rank i</td><td>the 100th largest order</td></tr>
<tr><td><code>range(lo, hi)</code></td><td>all keys between lo and hi</td><td>transactions between two dates</td></tr>
</table></div>
${fig('ordered', '<b>Figure 13.1</b> Ordered queries on the keys 10, 20, 35, 50, 65, 80. A hash table can answer none of these without scanning everything.')}

<h2>Implementations</h2>
<h3>Unordered linked list</h3>
<p>Keep the pairs in a linked list. <code>get</code> scans until it finds the key; <code>put</code> scans to check for an existing key and otherwise adds at the front. Everything is O(n). It is useful only for very small tables, and as the building block of separate chaining in Chapter 14.</p>
<h3>Ordered array with binary search</h3>
<p>Keep keys in a sorted array and values in a parallel array. The key helper is <code>rank(key)</code>, which uses binary search to count how many keys are smaller. Then <code>get</code> is O(log n): compute the rank and check whether the key at that index matches. But <code>put</code> must shift every larger key one place to the right, which is O(n).</p>
${fig('rankput', '<b>Figure 13.2</b> Inserting into an ordered-array symbol table. Finding the position is fast; making room is slow.')}
${code('OrderedArrayST.java')`
public class OrderedArrayST<K extends Comparable<K>, V> {
  private K[] keys; private V[] vals; private int n = 0;

  @SuppressWarnings("unchecked")
  public OrderedArrayST(int cap) { keys = (K[]) new Comparable[cap]; vals = (V[]) new Object[cap]; }

  /** Number of keys strictly less than key. */
  public int rank(K key) {
    int lo = 0, hi = n;
    while (lo < hi) {
      int mid = (lo + hi) >>> 1;
      if (keys[mid].compareTo(key) < 0) lo = mid + 1; else hi = mid;
    }
    return lo;
  }
  public V get(K key) {
    int i = rank(key);
    return (i < n && keys[i].compareTo(key) == 0) ? vals[i] : null;
  }
  public void put(K key, V val) {
    int i = rank(key);
    if (i < n && keys[i].compareTo(key) == 0) { vals[i] = val; return; }   // replace
    if (n == keys.length) { keys = Arrays.copyOf(keys, 2 * n + 1); vals = Arrays.copyOf(vals, 2 * n + 1); }   // full: grow
    for (int j = n; j > i; j--) { keys[j] = keys[j - 1]; vals[j] = vals[j - 1]; }  // shift: O(n)
    keys[i] = key; vals[i] = val; n++;
  }
  public K floor(K key) {
    int i = rank(key);
    if (i < n && keys[i].compareTo(key) == 0) return keys[i];
    return i == 0 ? null : keys[i - 1];
  }
  public K select(int r) { return keys[r]; }
}`}
${rs('ordered_array_st.rs')`
pub struct OrderedArrayST<K, V> {
    keys: Vec<K>,                  // sorted; a Vec grows by itself
    vals: Vec<V>,                  // vals[i] belongs to keys[i]
}

impl<K: Ord, V> OrderedArrayST<K, V> {
    pub fn new() -> Self { OrderedArrayST { keys: Vec::new(), vals: Vec::new() } }

    /// Number of keys strictly less than key.
    pub fn rank(&self, key: &K) -> usize { self.keys.partition_point(|k| k < key) }

    pub fn get(&self, key: &K) -> Option<&V> {
        self.keys.binary_search(key).ok().map(|i| &self.vals[i])
    }
    pub fn put(&mut self, key: K, val: V) {
        match self.keys.binary_search(&key) {        // Ok(index) or Err(insertion point)
            Ok(i) => self.vals[i] = val,             // replace
            Err(i) => { self.keys.insert(i, key); self.vals.insert(i, val); }   // shift: O(n)
        }
    }
    pub fn floor(&self, key: &K) -> Option<&K> {
        match self.keys.binary_search(key) {
            Ok(i) => Some(&self.keys[i]),
            Err(i) => i.checked_sub(1).map(|j| &self.keys[j]),   // None if every key is larger
        }
    }
    pub fn select(&self, r: usize) -> Option<&K> { self.keys.get(r) }
}

impl<K: Ord, V> Default for OrderedArrayST<K, V> {
    fn default() -> Self { Self::new() }
}
`}
<p>This structure is excellent when the data is built once and then read many times: a static lookup table, or a sorted snapshot that is rebuilt periodically. It is also compact and cache-friendly.</p>
<h3>Binary search tree</h3>
<p>A BST (Chapter 6) keeps the ordering without needing contiguous storage, so insertion no longer shifts anything. All operations, including the ordered ones, cost O(h). A balanced BST such as a red-black tree guarantees h = O(log n). To support <code>rank</code> and <code>select</code> in O(log n), each node also stores the size of its subtree.</p>
${code('Rank and select with subtree sizes')`
class Node { int key; Node left, right; int size = 1; }   // size of the subtree rooted here
static int size(Node n) { return n == null ? 0 : n.size; }

static int rank(Node n, int key) {                         // keys < key
  if (n == null) return 0;
  if (key < n.key) return rank(n.left, key);
  if (key > n.key) return size(n.left) + 1 + rank(n.right, key);
  return size(n.left);
}
static int select(Node n, int r) {                         // key of rank r
  int leftSize = size(n.left);
  if (r < leftSize) return select(n.left, r);
  if (r > leftSize) return select(n.right, r - leftSize - 1);
  return n.key;
}`}
${rs('rank_select.rs')`
use std::cmp::Ordering;

type Link = Option<Box<Node>>;
struct Node { key: i32, left: Link, right: Link, size: usize }   // size of the subtree rooted here

fn size(n: &Link) -> usize { n.as_ref().map_or(0, |n| n.size) }

fn rank(n: &Link, key: i32) -> usize {                   // keys < key
    let Some(n) = n else { return 0 };
    match key.cmp(&n.key) {
        Ordering::Less => rank(&n.left, key),
        Ordering::Greater => size(&n.left) + 1 + rank(&n.right, key),
        Ordering::Equal => size(&n.left),
    }
}

fn select(n: &Link, r: usize) -> Option<i32> {           // key of rank r; None if r >= size
    let n = n.as_ref()?;
    let left = size(&n.left);
    match r.cmp(&left) {
        Ordering::Less => select(&n.left, r),
        Ordering::Greater => select(&n.right, r - left - 1),
        Ordering::Equal => Some(n.key),
    }
}
`}
<h3>Skip list</h3>
<p>A <strong>skip list</strong> keeps the keys in a sorted linked list and adds express lanes above it. Every node is on level 0; about half of the nodes are also on level 1, a quarter on level 2, and so on, decided by coin flips when each node is inserted. A search starts on the highest level, moves right while the next key is smaller than the target, and drops down a level when the next step would overshoot. Each level roughly halves the remaining distance, as binary search does, so get, put and delete take O(log n) <em>expected</em> time with no rotations or rebalancing. The randomness is in the structure, not in the input, so no insertion order is bad for it.</p>
${fig('skiplist', '<b>Figure 13.3</b> Searching a skip list for 31. The search runs along level 3 to 19, drops down while the next key is missing or not smaller (nothing, then 40, then 31), steps to 25 on level 0 and finds 31 next.')}
<p>Its real attraction is concurrency. An insertion changes only a few next pointers, one per level, and each can be updated with a compare-and-set, so threads can insert and search at the same time without a global lock. That is how Java's <code>ConcurrentSkipListMap</code> and <code>ConcurrentSkipListSet</code> work, and why they are the standard concurrent sorted collections. Rust's standard library has no skip list: a concurrent sorted map comes from a crate such as crossbeam-skiplist, or is a <code>BTreeMap</code> behind a lock.</p>
${code('SkipList.java')`
public class SkipList<K extends Comparable<K>, V> {
  private static final int MAX_LEVEL = 32;
  private static class Node<K, V> {
    final K key; V val; final Node<K, V>[] next;          // next[i]: successor on level i
    @SuppressWarnings("unchecked")
    Node(K key, V val, int height) { this.key = key; this.val = val; next = (Node<K, V>[]) new Node[height]; }
  }
  private final Node<K, V> head = new Node<>(null, null, MAX_LEVEL);   // sentinel on every level
  private int levels = 1;                                              // levels in use

  public V get(K key) {
    Node<K, V> x = head;
    for (int i = levels - 1; i >= 0; i--)                              // start at the top level
      while (x.next[i] != null && x.next[i].key.compareTo(key) < 0) x = x.next[i];   // move right
    x = x.next[0];                                                     // the first key >= key
    return x != null && x.key.compareTo(key) == 0 ? x.val : null;
  }

  public void put(K key, V val) {
    @SuppressWarnings("unchecked")
    Node<K, V>[] path = (Node<K, V>[]) new Node[MAX_LEVEL];            // last node before key, per level
    Node<K, V> x = head;
    for (int i = levels - 1; i >= 0; i--) {
      while (x.next[i] != null && x.next[i].key.compareTo(key) < 0) x = x.next[i];
      path[i] = x;                                                     // then drop down
    }
    if (x.next[0] != null && x.next[0].key.compareTo(key) == 0) { x.next[0].val = val; return; }   // replace
    int h = Math.min(MAX_LEVEL, Integer.numberOfTrailingZeros(ThreadLocalRandom.current().nextInt()) + 1);   // coin flips
    for (int i = levels; i < h; i++) path[i] = head;
    levels = Math.max(levels, h);
    Node<K, V> n = new Node<>(key, val, h);
    for (int i = 0; i < h; i++) { n.next[i] = path[i].next[i]; path[i].next[i] = n; }   // splice in at each level
  }
}
`}
${rs('skip_list.rs')`
const MAX_LEVEL: usize = 32;

struct SkipNode<K, V> { key: K, val: V, next: Vec<Option<usize>> }   // next[i]: successor on level i

// Nodes live in a Vec and link to each other by index, as in Chapter 3: a node is reachable
// from several predecessors, one per level, which plain Box ownership cannot express.
pub struct SkipList<K, V> {
    nodes: Vec<SkipNode<K, V>>,
    head: Vec<Option<usize>>,      // the head's links; its length is the number of levels in use
}

impl<K: Ord, V> SkipList<K, V> {
    pub fn new() -> Self { SkipList { nodes: Vec::new(), head: vec![None] } }

    fn next(&self, at: Option<usize>, level: usize) -> Option<usize> {   // at == None is the head
        match at { None => self.head[level], Some(i) => self.nodes[i].next[level] }
    }

    // On each level, the last node whose key is smaller than key (None for the head).
    fn path(&self, key: &K) -> Vec<Option<usize>> {
        let mut path = vec![None; self.head.len()];
        let mut x = None;
        for level in (0..self.head.len()).rev() {                        // start at the top level
            while let Some(n) = self.next(x, level).filter(|&n| self.nodes[n].key < *key) {
                x = Some(n);                                             // move right
            }
            path[level] = x;                                             // then drop down
        }
        path
    }

    pub fn get(&self, key: &K) -> Option<&V> {
        let n = self.next(self.path(key)[0], 0)?;
        (self.nodes[n].key == *key).then_some(&self.nodes[n].val)
    }

    pub fn put(&mut self, key: K, val: V) {
        let mut path = self.path(&key);
        if let Some(n) = self.next(path[0], 0) && self.nodes[n].key == key {
            self.nodes[n].val = val;                                     // replace
            return;
        }
        let h = (rand::random::<u32>().trailing_zeros() as usize + 1).min(MAX_LEVEL);   // coin flips
        while self.head.len() < h { self.head.push(None); path.push(None); }
        let id = self.nodes.len();
        let next = (0..h).map(|level| self.next(path[level], level)).collect();
        self.nodes.push(SkipNode { key, val, next });
        for (level, &before) in path.iter().enumerate().take(h) {        // splice in at each level
            match before {
                None => self.head[level] = Some(id),
                Some(i) => self.nodes[i].next[level] = Some(id),
            }
        }
    }
}

impl<K: Ord, V> Default for SkipList<K, V> {
    fn default() -> Self { Self::new() }
}
`}
<p>A node appears on two levels on average, so the extra links cost a constant factor of memory. Deletion finds the same path and unlinks the node on every level where it appears.</p>
<h3>Hash table</h3>
<p>A hash table (Chapter 14) turns the key into an array index with a hash function. <code>get</code>, <code>put</code> and <code>delete</code> take O(1) expected time, the fastest of all. The price: the keys are scattered in no meaningful order, so every ordered operation requires a full scan.</p>

<h2>Comparing the implementations</h2>
<div class="tbl"><table><tr><th>Implementation</th><th>get</th><th>put</th><th>delete</th><th>Ordered operations</th><th>Java / Rust</th></tr>
<tr><td>Unordered list</td><td class="num">O(n)</td><td class="num">O(n)</td><td class="num">O(n)</td><td>scan</td><td>none</td></tr>
<tr><td>Ordered array</td><td class="num">O(log n)</td><td class="num">O(n)</td><td class="num">O(n)</td><td class="num">O(log n)</td><td>sorted array + <code>Arrays.binarySearch</code> / <code>Vec</code> + <code>binary_search</code></td></tr>
<tr><td>Unbalanced BST</td><td class="num">O(log n) avg, O(n) worst</td><td class="num">same</td><td class="num">same</td><td class="num">O(h)</td><td>none</td></tr>
<tr><td>Red-black BST</td><td class="num">O(log n)</td><td class="num">O(log n)</td><td class="num">O(log n)</td><td class="num">O(log n)</td><td><code>TreeMap</code> / none (Rust's <code>BTreeMap</code> is a B-tree, same costs)</td></tr>
<tr><td>Skip list</td><td class="num">O(log n) expected</td><td class="num">same</td><td class="num">same</td><td class="num">O(log n)</td><td><code>ConcurrentSkipListMap</code> / none in std</td></tr>
<tr><td>Hash table</td><td class="num">O(1) expected</td><td class="num">O(1) amortized</td><td class="num">O(1) expected</td><td>scan, O(n)</td><td><code>HashMap</code> / <code>HashMap</code></td></tr>
</table></div>

<h2>The Java map family</h2>
<div class="tbl"><table><tr><th>Class</th><th>Backed by</th><th>Iteration order</th><th>Use when</th></tr>
<tr><td><code>HashMap</code></td><td>hash table</td><td>unspecified</td><td>you only need fast lookup; the default choice</td></tr>
<tr><td><code>LinkedHashMap</code></td><td>hash table + doubly linked list</td><td>insertion order, or access order</td><td>predictable iteration, LRU caches</td></tr>
<tr><td><code>TreeMap</code></td><td>red-black tree</td><td>sorted by key</td><td>floor, ceiling, ranges, sorted output</td></tr>
<tr><td><code>EnumMap</code></td><td>array indexed by ordinal</td><td>enum declaration order</td><td>keys are enum constants; very fast</td></tr>
<tr><td><code>ConcurrentHashMap</code></td><td>hash table with fine-grained locking</td><td>unspecified</td><td>shared between threads</td></tr>
<tr><td><code>ConcurrentSkipListMap</code></td><td>skip list</td><td>sorted by key</td><td>ordered and shared between threads</td></tr>
</table></div>

let bracket = brackets.range(..=450_000).next_back();     // Some((300000, "5%")): the floor entry
`}
<h3>The Rust map family</h3>
<div class="tbl"><table><tr><th>Java</th><th>Rust</th><th>Notes</th></tr>
<tr><td><code>HashMap</code></td><td><code>HashMap</code></td><td>open addressing with a randomly keyed hash (Chapter 14)</td></tr>
<tr><td><code>TreeMap</code></td><td><code>BTreeMap</code></td><td>a B-tree rather than a red-black tree; floor and ceiling through <code>range</code> (Chapter 6)</td></tr>
<tr><td><code>LinkedHashMap</code></td><td>none in std</td><td>the indexmap crate keeps insertion order; an LRU cache is built by hand (Chapter 3)</td></tr>
<tr><td><code>EnumMap</code></td><td>an array</td><td>index a plain array with <code>variant as usize</code> for an enum without fields</td></tr>
<tr><td><code>ConcurrentHashMap</code></td><td><code>Mutex&lt;HashMap&gt;</code>, <code>RwLock&lt;HashMap&gt;</code></td><td>or a sharded map from a crate such as dashmap</td></tr>
<tr><td><code>ConcurrentSkipListMap</code></td><td>none in std</td><td>a crate such as crossbeam-skiplist, or a <code>BTreeMap</code> behind a lock</td></tr>
</table></div>
<p>Where Java has <code>merge</code>, <code>computeIfAbsent</code> and <code>getOrDefault</code>, Rust has one general tool, the <strong>entry API</strong>: <code>map.entry(key)</code> finds the slot once and returns an occupied or a vacant entry, and helpers such as <code>or_insert</code> and <code>or_default</code> cover the common cases.</p>

<h2>Keys and contracts</h2>
<p>Symbol tables rely on keys behaving consistently. Two contracts matter in Java.</p>
<h3>equals and hashCode</h3>
<p>Hash-based maps first use <code>hashCode()</code> to find a bucket and then <code>equals()</code> to find the key inside it. So equal objects <strong>must</strong> have equal hash codes. If you override <code>equals</code> without <code>hashCode</code>, two equal keys can land in different buckets and lookups silently fail. Records generate both correctly. In Rust the pair is <code>Eq</code> and <code>Hash</code>, and <code>#[derive(PartialEq, Eq, Hash)]</code> generates them consistently.</p>
${code('Value objects as keys')`
// A record generates equals, hashCode and toString from its components.
record AccountKey(String bank, String number) {}

Map<AccountKey, Long> m = new HashMap<>();
m.put(new AccountKey("HDFC", "001"), 10L);
m.get(new AccountKey("HDFC", "001"));    // 10: equal records, equal hash codes`}
${rs('value_keys.rs')`
// derive generates ==, the hash and Debug from the fields, consistently with each other.
#[derive(Debug, Clone, PartialEq, Eq, Hash)]
struct AccountKey { bank: String, number: String }

let mut m = HashMap::new();
m.insert(AccountKey { bank: "HDFC".into(), number: "001".into() }, 10_i64);
let v = m.get(&AccountKey { bank: "HDFC".into(), number: "001".into() });   // Some(10): equal keys, equal hashes
`}
<h3>Comparable and comparators</h3>
<p>Tree maps use <code>compareTo</code> (or a supplied <code>Comparator</code>) instead of <code>equals</code>. If <code>compare(a, b) == 0</code>, the tree treats a and b as the <em>same key</em>, even if <code>a.equals(b)</code> is false. A comparator on "amount" alone would merge two different transactions with equal amounts into one entry. Make comparators consistent with equals, typically by adding a unique tie-breaker such as an ID. Rust's <code>BTreeMap</code> uses <code>Ord</code> the same way: keys that compare <code>Equal</code> are the same key.</p>
<h3>Immutability</h3>
<p>Never change a key's fields while it is inside a map. Its hash code or ordering would change, the map would look in the wrong place, and the entry would become unreachable. Use immutable keys: strings, boxed numbers, records with immutable components. Rust enforces most of this: a map hands out its keys only through shared references, so safe code cannot change a key in place. The exception is interior mutability (<code>Cell</code>, <code>RefCell</code>); the documentation calls changing a key's hash or order that way a logic error, which can produce wrong results or panics but never memory unsafety.</p>

<h2>Sets</h2>
<p>A <strong>set</strong> is a symbol table with keys and no values. Java implements each set on top of the matching map: <code>HashSet</code> uses a <code>HashMap</code>, <code>TreeSet</code> uses a <code>TreeMap</code>, <code>LinkedHashSet</code> uses a <code>LinkedHashMap</code>. Rust's <code>HashSet</code> and <code>BTreeSet</code> are likewise thin wrappers around the maps. Everything in this chapter applies to sets as well, including <code>TreeSet.floor</code>, <code>ceiling</code> and <code>subSet</code>.</p>

<h2>Choosing an implementation</h2>
<ol>
<li>Do you need ordered operations (ranges, floor and ceiling, sorted iteration, min and max)? Use a <strong>balanced tree</strong>: <code>TreeMap</code> (in Rust, <code>BTreeMap</code>).</li>
<li>Do you only need lookup by exact key? Use a <strong>hash table</strong>: <code>HashMap</code>.</li>
<li>Do you need a predictable iteration order without sorting? Use <code>LinkedHashMap</code>.</li>
<li>Is the data static, built once and read many times? A <strong>sorted array</strong> with binary search is compact and fast.</li>
<li>Are the keys small integers or enum constants? Use a plain <strong>array</strong> indexed by the key, or an <code>EnumMap</code>.</li>
<li>Is the map shared between threads? Use the concurrent variants.</li>
</ol>

<h2>Common mistakes</h2>
<div class="note pit"><b>Pitfalls</b>
<ul>
<li><strong>Overriding equals without hashCode.</strong> Lookups fail at random. Use records or generate both.</li>
<li><strong>Mutable keys.</strong> Entries become unreachable after the key changes.</li>
<li><strong>Comparators that ignore some fields</strong>, which silently merge distinct keys in a TreeMap.</li>
<li><strong>Using a HashMap and then sorting its keys</strong> every time you need order. Use a TreeMap.</li>
<li><strong>Treating null from get as "absent"</strong> when null is also a stored value. Use <code>containsKey</code> or avoid storing null.</li>
</ul></div>
